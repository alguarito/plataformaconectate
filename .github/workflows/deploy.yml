name: Deploy ConectaTE a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        # Astro 6 requiere Node >=22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        env:
          # Capa de cuentas (Supabase) DESACTIVADA por decisión del autor (2026-10-22).
          # Con la bandera en 'false' no se publican /cuenta, /docente ni /conectividad
          # y ninguna página carga el cliente Supabase (ver astro.config.mjs).
          # Se reactiva en 2027, después de corregir el SQL y las funciones según
          # docs/cuentas-2027.md. Para reactivarla: descomentar las dos variables
          # de Supabase y poner la bandera en 'true'.
          PUBLIC_AUTH_ENABLED: 'false'
          # URL pública del proyecto Supabase ConcienciA (no es secreto).
          # PUBLIC_SUPABASE_URL: https://zvvylehmgfrggpghrskd.supabase.co
          # Publishable key — segura con RLS activa. Diseñada para exposición pública.
          # PUBLIC_SUPABASE_ANON_KEY: sb_publishable_7XDCbfzYmyRIJfUQhIVWnw_EH7LfMqn
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

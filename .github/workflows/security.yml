name: Security Review

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/sw.js'
      - 'public/**.html'
      - 'astro.config.mjs'
      - 'tailwind.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - uses: anthropics/claude-code-security-review@main
        with:
          comment-pr: true
          claude-api-key: ${{ secrets.CLAUDE_API_KEY }}
          exclude-directories: 'content/guias,scripts/guias_drive,public/guias-mejoras'

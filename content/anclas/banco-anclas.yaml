    limites_eticos: No usar «querencia» como término del Pacífico. No usar cifras del Censo 2018 sobre población afro sin la advertencia de omisión censal (Sentencia T-276 de 2022).
    texto_usable: |-
      Desde los años setenta, familias enteras del Chocó, de Buenaventura, de Guapi, Timbiquí y Tumaco bajaron a Cali. Hoy la región de Cali, el sur del Valle, el norte del Cauca y Buenaventura concentra alrededor de 1,5 millones de personas afrodescendientes, la mayor concentración del país. Al llegar no se llegaba solo: funcionaba el paisanaje (el que ya estaba recibía al que venía del mismo río) y se formaron las colonias: la guapireña, la timbiqueña, la bonaverense, la chocoana. En el Pacífico las personas no se presentan por ciudad sino por el río del que vienen. Y cuando alguien muere, el que se fue vuelve: los de fuera se quedaban los nueve días completos, hasta el levantamiento de tumba.
    usos: []


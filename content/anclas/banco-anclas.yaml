    cara_de_exclusion: La Guardia existe porque el territorio está bajo amenaza armada permanente; no es una figura folclórica ni un cuerpo de vigilancia escolar.
    limites_eticos: Comunicación responsable — el ancla no menciona muerte, método, caso ni cifra de fallecidos, ni presenta héroes solitarios. No usar la crisis de suicidio en pueblos indígenas como material. No usar los ritos del Medio San Juan en la guía 10-4.
    texto_usable: |-
      El 28 de mayo de 2001, en El Tierrero (resguardo de Huellas Caloto, norte del Cauca), quedó formalmente constituida la Guardia Indígena, que en nasa yuwe se llama Kiwe Thegnas: «cuidadores del territorio». No llevan armas: llevan un bastón de mando. Su trabajo no es enfrentarse solos a lo que amenaza a la comunidad, sino recorrer el territorio, darse cuenta a tiempo, dar la alerta y llamar a la asamblea, que es la que decide. En 2004 recibieron el Premio Nacional de Paz. Lo que hace fuerte a un kiwe thegna no es la valentía individual: es que nunca actúa solo y nunca se calla lo que vio.
    usos: []

  - id: fals-borda-saucio-escala-agricola
    pueblo: Vereda de Saucío (campesinado de Chocontá)
    territorio: Chocontá (Cundinamarca) — no del suroccidente
    del_suroccidente: false
    practica: Las dos medidas del valor en Saucío (1949-1953) — la «escala agrícola» frente al convite y el brazo prestado
    que_ensena: La comparación no la inventó Instagram, la escalera ya estaba; el remedio nunca fue esconder la escalera sino construir algo con otros.
    conceptos: [ranking, métrica, comparación, reciprocidad, indicador de estatus]
    grados_sugeridos: [11]
    fuente_apa: |-
      Fals Borda, O. (2017). Campesinos de los Andes y otros escritos antológicos. Universidad Nacional de Colombia. (Obra original publicada en 1955 como Peasant society in the Colombian Andes: A sociological study of Saucío, University of Florida Press; edición en español, 1961)
    fuente_apa_latex: |-
      Fals Borda, O. (2017). \emph{Campesinos de los Andes y otros escritos antológicos}. Universidad Nacional de Colombia. (Obra original publicada en 1955 como \emph{Peasant society in the Colombian Andes: A sociological study of Saucío}, University of Florida Press; edición en español, 1961)
    verificacion: vault SUSTITUTO de «la medida comunitaria del valor» (Anclas 5 §7) · monografía clásica reeditada por la Universidad Nacional
    cara_de_exclusion: No idealizar la vereda — Fals Borda registró que en Saucío no había cooperativas ni reuniones para discutir problemas comunes, y que la minga no se había desarrollado o había desaparecido allí.
    limites_eticos: Declarar que es Cundinamarca, no el Valle.
    texto_usable: |-
      Entre 1949 y 1953, el sociólogo Orlando Fals Borda vivió en la vereda de Saucío (Chocontá, Cundinamarca) y encontró que allí la gente se medía de dos maneras a la vez. Una era lo que él llamó la «escala agrícola»: una escalera invisible en la que arriba estaban los propietarios y abajo los concertados sin tierra, y en la que hasta los muebles y los zapatos servían de indicador de posición. Fals Borda anotó algo incómodo: que el campesino ahorraba sobre todo para sostener su prestigio, y que ese prestigio se medía por su capacidad de corresponder invitaciones. La otra manera de medir era el convite y el brazo prestado: valías por lo que ponías cuando a otro le hacía falta. Fals Borda vio desaparecer la segunda («se habían olvidado las prácticas de convite y brazo prestado que reforzaban la solidaridad local») y vio la vereda recuperarse cuando volvieron a hacer algo juntos: construir la escuela.
    usos: []

  - id: colonizacion-norte-del-valle-compania-burila
    pueblo: Colonos antioqueños y caldenses del Norte del Valle; Compañía Burila
    territorio: Sevilla, Caicedonia, Zarzal (Norte del Valle del Cauca); Calarcá (Quindío)
    del_suroccidente: true
    practica: Abrir trocha en la vertiente de la cordillera Central y el título colonial de la Compañía Burila (1884) que cobraba el lote al colono
    que_ensena: Decidir sin certeza fue real, y también lo fue que abrir camino no garantizaba llegar a ninguna parte.
    conceptos: [incertidumbre, riesgo, título vs. posesión, información asimétrica, decisión]
    grados_sugeridos: [11]
    fuente_apa: |-
      Parsons, J. J. (1997). La colonización antioqueña en el occidente de Colombia (4.ª ed.). Banco de la República / El Áncora Editores. (Obra original publicada en 1949)
    fuente_apa_latex: |-
      Parsons, J. J. (1997). \emph{La colonización antioqueña en el occidente de Colombia} (4.ª ed.). Banco de la República / El Áncora Editores. (Obra original publicada en 1949)
    fuentes_apa_extra:
      - |-
        Valencia Llano, A. (s. f.). La disputa política entre Calarcá-Quindío y la empresa de Fomento y Colonización Burila (1886-1908). Anuario de Historia Regional y de las Fronteras. https://revistas.uis.edu.co/index.php/anuariohistoria/article/view/10994
    verificacion: vault RESCATABLE con el ángulo duro obligatorio (Anclas 5 §8) · Parsons (1949/1997). DUDA — la ficha de Valencia Llano (autoría, año, volumen, páginas) está marcada «por confirmar antes de citar» en el vault.
    cara_de_exclusion: El colono desmontaba, sembraba y levantaba la casa; después llegaba la compañía con un título colonial a cobrarle el lote. Y en el Camino del Quindío la incertidumbre no se repartía igual entre el que viajaba y el carguero que lo llevaba a la espalda.
    limites_eticos: Fecha de fundación de Sevilla — usar «1903» sin día; no imprimir «Caicedonia, 1910» ni cifras de peso de los cargueros (POR VERIFICAR).
    texto_usable: |-
      A comienzos del siglo XX, familias que venían de Antioquia y del Viejo Caldas abrieron a machete la vertiente de la cordillera Central y fundaron los pueblos del Norte del Valle: Sevilla nació en 1903 con el nombre de San Luis, con colonos encabezados por Heraclio Uribe Uribe. Abrían trocha sin saber qué había adelante ni si la tierra iba a dar. Pero hay una parte que el relato heroico suele saltarse: desde el 25 de noviembre de 1884 existía la Compañía Burila, una sociedad de cien accionistas del Cauca y Caldas que reclamaba como propio todo un polígono que iba de Bugalagrande hasta detrás de Calarcá, e incluía Sevilla, Caicedonia y Zarzal. El colono desmontaba, sembraba y levantaba la casa; después llegaba la compañía con un título colonial en la mano a cobrarle el lote. Decidir sin certeza fue real, y también lo fue que abrir camino no garantizaba llegar a ninguna parte.
    usos: []

  - id: univalle-regionalizacion-sede-cartago
    pueblo: Institución (Universidad del Valle, Programa de Regionalización; ciudadanos de Cartago)
    territorio: Cartago (Valle del Cauca)
    del_suroccidente: true
    practica: La regionalización de Univalle (Acuerdo 008 del 15 de septiembre de 1986) y la sede Cartago
    que_ensena: Nadie debería tener que perderse a sí mismo para poder estudiar; la región decidió que irse no fuera el precio de estudiar.
    conceptos: [descentralización, acceso, red de sedes, educación a distancia, decisión colectiva]
    grados_sugeridos: [11]
    fuente_apa: |-
      Universidad del Valle. (s. f.). Historia sede Cartago. https://www.univalle.edu.co/35-aniversario-regionalizacion-2/historia-sede-cartago
    fuente_apa_latex: |-
      Universidad del Valle. (s.\,f.). \emph{Historia sede Cartago}.
    fuentes_apa_extra:
      - |-
        Universidad del Valle. (s. f.). Historia de las sedes: 35 años de regionalización. https://www.univalle.edu.co/35-aniversario-regionalizacion-2
    verificacion: vault SIN CANDIDATO ancestral → SUSTITUTO por historia local reciente (Anclas 5 §9) · portal institucional de Univalle (dos páginas)
    cara_de_exclusion: No todo salió bien — la sede de Sevilla cerró después del primer año; y la razón de fondo era poco romántica (irse costaba plata, familia y salud).
    limites_eticos: Confirmar contra el MEN/DANE las cifras de tránsito inmediato a educación superior antes de imprimirlas. No sostener «el encargue de hijos a familias del pueblo» (sin fuente arbitrada).
    texto_usable: |-
      En 1984, la Universidad del Valle escribió una propuesta que empezaba nombrando dos ciudades: Buenaventura y Cartago. Dos años después, por Acuerdo 008 del 15 de septiembre de 1986, el Consejo Superior creó el Programa de Regionalización, y la sede de Cartago abrió ese mismo año en modalidad a distancia, empujada por un grupo de cartagüeños que consideró que la ciudad necesitaba sus propios espacios de formación. La razón de fondo era simple y muy poco romántica: estudiar obligaba a irse, e irse costaba plata, familia y salud. No todo salió bien (la sede de Sevilla cerró después del primer año). Pero la decisión dejó una idea que sigue sirviendo: nadie debería tener que perderse a sí mismo para poder estudiar.
    usos: []

  - id: jurisdiccion-indigena-t-523-1997
    pueblo: Cabildos nasa del norte del Cauca (Jambaló)
    territorio: Norte del Cauca
    del_suroccidente: true
    practica: La asamblea de cabildos que juzga delante de todos para «devolver la armonía» y la Sentencia T-523 de 1997 (caso Francisco Gembuel)
    que_ensena: Una norma acordada por la comunidad pesa de verdad, y ni siquiera un acuerdo comunitario puede saltarse el debido proceso.
    conceptos: [debido proceso, acuerdo, sanción, límites, protocolo]
    grados_sugeridos: [8]
    fuente_apa: |-
      Corte Constitucional de Colombia. (1997, 15 de octubre). Sentencia T-523 de 1997 (M. P. Carlos Gaviria Díaz). https://www.corteconstitucional.gov.co/relatoria/1997/T-523-97.htm
    fuente_apa_latex: |-
      Corte Constitucional de Colombia. (1997, 15 de octubre). \emph{Sentencia T-523 de 1997} (M. P. Carlos Gaviria Díaz).
    fuentes_apa_extra:
      - |-
        Congreso de la República de Colombia. (2013a, 15 de marzo). Ley 1620 de 2013. Por la cual se crea el Sistema Nacional de Convivencia Escolar y Formación para el Ejercicio de los Derechos Humanos, la Educación para la Sexualidad y la Prevención y Mitigación de la Violencia Escolar. Diario Oficial. https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=52287
      - |-
        Ministerio de Educación Nacional de Colombia. (2013). Decreto 1965 de 2013, por el cual se reglamenta la Ley 1620 de 2013. https://www.mineducacion.gov.co/1621/articles-328630_archivo_pdf_Decreto_1965.pdf
    verificacion: vault REENCUADRE (Anclas 5 §10) · sentencia en la relatoría de la Corte (Anclas 2 §4 pedía confirmar el ponente; Anclas 5 lo da como Carlos Gaviria Díaz)
    cara_de_exclusion: La sanción física fue admitida por la Corte y sigue siendo objeto de debate; presentarla como el punto donde el acuerdo colectivo choca con los límites de los derechos, no como modelo ni exotismo.
    limites_eticos: Sesenta fuetazos (dos por cabildo), no veinte. El Decreto 1965 de 2013 está compilado en el Decreto 1075 de 2015 — verificar numeración vigente.
    texto_usable: |-
      En los cabildos del norte del Cauca las faltas no las juzga una oficina: las juzga la asamblea, delante de todos, y el objetivo declarado no es castigar sino «devolver la armonía». En 1997 ese sistema llegó hasta la Corte Constitucional: una asamblea de cabildos había sancionado a Francisco Gembuel con 60 fuetazos (dos por cada cabildo), expulsión del territorio y pérdida del derecho a elegir y ser elegido. En la Sentencia T-523 de 1997, el magistrado Carlos Gaviria Díaz concluyó que la comunidad había respetado el debido proceso, porque el acusado pudo defenderse él mismo ante la asamblea y elegir como defensor a alguien de su comunidad. El caso deja dos lecciones incómodas y necesarias: que una norma acordada por la comunidad pesa de verdad, y que ni siquiera un acuerdo comunitario puede saltarse el debido proceso.
    usos: ["8-5"]

  - id: misak-nak-chak
    pueblo: Misak
    territorio: Resguardo de Guambía, Silvia (Cauca)
    del_suroccidente: true
    practica: El nak chak (cocina) y el nak kuk (fogón) como sitio de la educación propia misak
    que_ensena: El asunto no se resuelve donde ocurre; se lleva a un espacio de deliberación con turnos — la escuela empieza en la cocina.
    conceptos: [protocolo, cola de decisión, turno, espacio de deliberación]
    grados_sugeridos: [6, 7]
    fuente_apa: |-
      Montano Morales, J. (2025). Comer y vivir bien en el mundo indígena misak: «sentipensar el cuidado de la vida». Revista de Estudios Sociales, (91), 163-174. https://doi.org/10.7440/res91.2025.09
    fuente_apa_latex: |-
      Montano Morales, J. (2025). Comer y vivir bien en el mundo indígena misak: «sentipensar el cuidado de la vida». \emph{Revista de Estudios Sociales}, (91), 163--174. https://doi.org/10.7440/res91.2025.09
    fuentes_apa_extra:
      - |-
        Ministerio de Cultura de Colombia. (2012). Política para el conocimiento, la salvaguardia y el fomento de la alimentación y las cocinas tradicionales de Colombia. Ministerio de Cultura. https://patrimonio.mincultura.gov.co/Paginas/Cocinas.aspx
      - |-
        Cabildo Indígena de Guambía. (2020). Misak educación. Cabildo Indígena de Guambía. https://www.misak-colombia.org/wp-content/uploads/2020/11/MISAK-EDUCACION-MEN-Corregido.pdf
    verificacion: vault RESCATABLE, la mejor del lote (Anclas 5 §11) · artículo arbitrado con DOI (Uniandes) + política nacional de cocinas tradicionales + documento del Cabildo de Guambía
    cara_de_exclusion: "Cocinar entre los misak «se concentra su fuerza en el \"mundo\" femenino»: el fogón fue espacio de palabra y de reparto desigual del trabajo. Se dice en la guía; si no, se vende nostalgia."
    limites_eticos: La frase «nadie interrumpe al que está hablando, porque el fogón tiene su turno» es redacción del vault sobre el ancla, no cita textual de Montano Morales; no entrecomillarla.
    texto_usable: |-
      Entre los misak, en el resguardo de Guambía (Silvia, Cauca), la escuela no empieza en un salón: empieza en la cocina. Llaman nak chak a la cocina y nak kuk al fogón, y los mayores dicen que ahí «se dinamiza la educación propia»: alrededor del fuego se cocina, se come, se conversa, se cuentan las cosas del día y se resuelven los desacuerdos. Nadie interrumpe al que está hablando, porque el fogón tiene su turno. Colombia entera reconoció algo parecido cuando el Ministerio de Cultura formuló en 2012 su política de cocinas tradicionales y declaró que lo que se sabe en una cocina es patrimonio, no receta.
    usos: ["6-3"]


      En Cali, en 1940, Luisita Sánchez de Hurtado impulsó un lugar para niños ciegos y sordos que el 29 de julio de 1942 quedó constituido oficialmente como entidad de utilidad común: el Instituto para Niños Ciegos y Sordos del Valle del Cauca, que todavía existe en el barrio San Fernando. Antes de eso, en el suroccidente colombiano, un niño sordo simplemente no tenía dónde estudiar. Y el país tardó todavía medio siglo en entender lo esencial: la Ley 324 de 1996 reconoció la lengua de los sordos colombianos, pero la llamó «lengua manual», como si fuera un truco con las manos; hubo que esperar a la Ley 982 de 2005 para que la ley dijera lo correcto, que la lengua de señas es la lengua natural de la comunidad sorda. La diferencia entre las dos leyes no es de palabras: es la diferencia entre «este niño tiene un problema» y «este niño tiene un idioma que la escuela no habla».

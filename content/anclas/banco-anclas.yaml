  - id: bordado-cartago-nombrar-puntadas
    pueblo: Bordadoras de Cartago
    territorio: Cartago (Valle del Cauca)
    del_suroccidente: true
    practica: El bordado a mano cartagüeño y el nombre propio de cada puntada (cadeneta, pasado, rococó, paté cabra, randas caladas)
    que_ensena: No hay «una puntada», hay muchas; llamarlas por su nombre es lo que permite pedir, corregir y enseñar.
    conceptos: [vocabulario técnico, nomenclatura, precisión, estándar, tipo de dato]
    grados_sugeridos: [6]
    fuente_apa: |-
      Chica García, A. (2019, 17 de agosto). Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas. Radio Nacional de Colombia. https://www.radionacional.co/cultura/la-herencia-espanola-que-preservan-las-mujeres-de-cartago
    fuente_apa_latex: |-
      Chica García, A. (2019, 17 de agosto). \emph{Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas}. Radio Nacional de Colombia.
    fuentes_apa_extra:
      - |-
        Universidad Autónoma de Occidente. (2021, 24 de marzo). Cartago, capital mundial del bordado, el tejido y la moda, a través de la gestión del turismo cultural. https://www.uao.edu.co/ciencias-administrativas/cartago-capital-mundial-del-bordado-el-tejido-la-moda-a-traves-de-la-gestion-del-turismo-cultural/
      - |-
        Alcaldía de Cartago, Secretaría de Salud y Protección Social. (2026). Análisis de situación de salud participativo. Municipio de Cartago, año 2025. Municipio de Cartago. https://cartago.gov.co/wp-content/uploads/2026/03/ASIS-Cartago-2025_Final.pdf
      - |-
        UNESCO. (2025). Primer Encuentro Patrimonial Cartago «Vivamos nuestro Bordado». Patrimonio Cultural Inmaterial. https://ich.unesco.org/en/activities/primer-encuentro-patrimonial-cartago-vivamos-nuestro-bordado-00631
    verificacion: vault CONFIRMADA (Anclas 1 §2) · prensa con firma (Radio Nacional) + nota institucional UAO + ASIS municipal 2025 + plataforma PCI UNESCO
    cara_de_exclusion: Oficio en riesgo por informalidad laboral y desinterés generacional; la mayoría de quienes bordan son mujeres cabeza de familia con ingreso precario (UAO, 2021; Chica García, 2019).
    limites_eticos: "No publicar como hecho «desde el siglo XVI», «1890 con las Vicentinas», «casi un centenar de puntadas» ni «más de 40 bordadoras de tradición» (NO VERIFICADO: blogs sin autoría)."
    texto_usable: |-
      En Cartago, Valle del Cauca, el bordado a mano no es adorno: es economía y es lenguaje. Más de 1.500 bordadoras trabajan en el municipio y cerca de 100 establecimientos venden lo que hacen; una sola prenda puede pasar por las manos de unas ocho artesanas y tomar más de ocho horas de trabajo (Chica García, 2019). El oficio llegó con las Hermanas Vicentinas y con las mujeres españolas, y las cartagüeñas lo reapropiaron poniéndole color propio. Cada gesto de la aguja tiene nombre distinto: cadeneta, pasado, rococó, paté cabra, randas caladas (Universidad Autónoma de Occidente, 2021). Bordar es, literalmente, saber nombrar: no hay una «puntada», hay muchas, y llamarlas por su nombre es lo que permite pedir, corregir y enseñar.
    usos: ["6-2"]

  - id: calado-ansermanuevo-deshilado
    pueblo: Caladoras y bordadoras de Ansermanuevo
    territorio: Ansermanuevo (Norte del Valle del Cauca)
    del_suroccidente: true
    practica: El calado (deshilado y vainica trabajada por el revés)
    que_ensena: Hay oficios donde lo que se ve por delante depende por completo de lo que se hizo por detrás, y donde parte del trabajo consiste en deshacer.
    conceptos: [sustracción, refactorización, revés/backend, depuración, error y rehacer]
    grados_sugeridos: [6]
    fuente_apa: |-
      Soy Valle. (s. f.). Ruta del bordado y el calado: Ansermanuevo, Cartago. https://www.soyvalle.com/ruta-del-bordado-y-el-calado/
    fuente_apa_latex: |-
      Soy Valle. (s.\,f.). \emph{Ruta del bordado y el calado: Ansermanuevo, Cartago}.
    fuentes_apa_extra:
      - |-
        Gobernación del Valle del Cauca. (2026). Gobernación impulsa reconocimiento de bordado y calado del norte del Valle como Patrimonio Inmaterial de la Nación. https://www.valledelcauca.gov.co/publicaciones/88394/gobernacion-impulsa-reconocimiento-de-bordado-y-calado-del-norte-del-valle/
    verificacion: vault CONFIRMADA con reserva técnica (Anclas 1 §3) · fuente turística departamental + Gobernación del Valle 2026. DUDA — la fuente principal es un portal de promoción turística; conviene reforzar con el informe referencial de bordados y calados de Artesanías de Colombia (CENDAR).
    cara_de_exclusion: Mismo oficio precario que el bordado; el reconocimiento patrimonial en curso no equivale a ingreso digno para las artesanas.
    limites_eticos: No afirmar nada sobre «el revés sin nudos», el protocolo de remiendo del error ni «el revés debe ser tan bello como el derecho» (NO VERIFICADO; requiere entrevista con una bordadora de tradición).
    texto_usable: |-
      En el Norte del Valle hay un oficio hermano del bordado que trabaja quitando en vez de poniendo: el calado. Ansermanuevo, a 200 km de Cali, es llamada «cuna del calado y el bordado» y celebra sus Fiestas del Calado y el Bordado a mediados de agosto. La técnica base es el deshilado: se retiran hilos de la trama o de la urdimbre de la tela y se reagrupan los que quedan con puntadas decorativas, hasta que el vacío mismo dibuja. La vainica se trabaja por el revés de la tela. Es decir: hay oficios enteros del territorio donde lo que se ve por delante depende por completo de lo que se hizo por detrás, y donde parte del trabajo consiste en deshacer.
    usos: ["6-6"]

  - id: bordado-oficio-heredado-abuela-nieta
    pueblo: Bordadoras de Cartago
    territorio: Cartago (Valle del Cauca)
    del_suroccidente: true
    practica: Transmisión del bordado de abuela a nieta y el molde de plástico que se disuelve
    que_ensena: Cuando el molde desaparece, solo queda lo que la mano hizo; el oficio se hereda por la casa, no por la escuela.
    conceptos: [andamiaje, plantilla, herencia, transmisión intergeneracional, autonomía]
    grados_sugeridos: [11]
    fuente_apa: |-
      Chica García, A. (2019, 17 de agosto). Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas. Radio Nacional de Colombia. https://www.radionacional.co/cultura/la-herencia-espanola-que-preservan-las-mujeres-de-cartago
    fuente_apa_latex: |-
      Chica García, A. (2019, 17 de agosto). \emph{Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas}. Radio Nacional de Colombia.
    fuentes_apa_extra:
      - |-
        UNESCO. (2025). Primer Encuentro Patrimonial Cartago «Vivamos nuestro Bordado». Patrimonio Cultural Inmaterial. https://ich.unesco.org/en/activities/primer-encuentro-patrimonial-cartago-vivamos-nuestro-bordado-00631
    verificacion: vault CONFIRMADA (Anclas 1 §4) · nombre propio (Gladys Ramírez) en fuente firmada + registro UNESCO ICH del encuentro de 2025
    cara_de_exclusion: La transmisión doméstica del oficio convive con informalidad y con jefatura femenina de hogar; heredar el oficio no garantiza heredar un ingreso estable.
    limites_eticos: null
    texto_usable: |-
      En Cartago el oficio se hereda por la casa, no por la escuela. Gladys Ramírez, bordadora con más de treinta años en el oficio, aprendió a bordar de su abuela (Chica García, 2019). El diseño se dibuja a lápiz sobre un plástico biodegradable que se disuelve al mojarse: cuando el plástico se va, solo queda la puntada; el molde desaparece y lo que permanece es lo que la mano hizo. En 2025 la ciudad celebró su Primer Encuentro Patrimonial «Vivamos nuestro Bordado» con el objetivo declarado de sostener esa transmisión entre generaciones (UNESCO, 2025).
    usos: []

  - id: bordado-y-calado-dos-oficios-con-nombre
    pueblo: Bordadoras de Cartago y caladoras de Ansermanuevo
    territorio: Cartago y Ansermanuevo (Norte del Valle del Cauca)
    del_suroccidente: true
    practica: Bordado y calado como dos oficios distintos, con dos ciudades y dos nombres
    que_ensena: Tener nombre propio para lo que uno hace es parte de la dignidad del trabajo; pero el reconocimiento no es lo mismo que la justicia.
    conceptos: [especialización, roles, nomenclatura, dignidad del trabajo, informalidad]
    grados_sugeridos: [11]
    fuente_apa: |-
      Universidad Autónoma de Occidente. (2021, 24 de marzo). Cartago, capital mundial del bordado, el tejido y la moda, a través de la gestión del turismo cultural. https://www.uao.edu.co/ciencias-administrativas/cartago-capital-mundial-del-bordado-el-tejido-la-moda-a-traves-de-la-gestion-del-turismo-cultural/
    fuente_apa_latex: |-
      Universidad Autónoma de Occidente. (2021, 24 de marzo). \emph{Cartago, capital mundial del bordado, el tejido y la moda, a través de la gestión del turismo cultural}.
    fuentes_apa_extra:
      - |-
        Chica García, A. (2019, 17 de agosto). Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas. Radio Nacional de Colombia. https://www.radionacional.co/cultura/la-herencia-espanola-que-preservan-las-mujeres-de-cartago
      - |-
        Gobernación del Valle del Cauca. (2026). Gobernación impulsa reconocimiento de bordado y calado del norte del Valle como Patrimonio Inmaterial de la Nación. https://www.valledelcauca.gov.co/publicaciones/88394/gobernacion-impulsa-reconocimiento-de-bordado-y-calado-del-norte-del-valle/
    verificacion: vault CONFIRMADA (Anclas 1 §5) · UAO 2021 + Radio Nacional 2019 + Gobernación 2026 (Mesa Técnica del Bordado, pilar «dignificación de las artesanas»)
    cara_de_exclusion: La tradición está en riesgo por informalidad laboral, desinterés generacional y desconexión entre artesanas y diseñadores; «la mayoría somos mujeres cabeza de familia». La guía no debe sugerir que la dignidad compensa el ingreso precario.
    limites_eticos: Nombrar la informalidad junto al orgullo, siempre.
    texto_usable: |-
      Bordado y calado son dos oficios distintos, con dos ciudades y dos nombres: Cartago se llama a sí misma capital del bordado; Ansermanuevo se llama cuna del calado, y cada agosto lo celebra en sus Fiestas del Calado y el Bordado. Tener nombre propio para lo que uno hace es parte de la dignidad del trabajo. Pero el reconocimiento no es lo mismo que la justicia: la tradición está en riesgo por informalidad laboral, desinterés generacional y desconexión entre artesanas y diseñadores (Universidad Autónoma de Occidente, 2021), y buena parte de quienes bordan lo dicen sin rodeos: «la mayoría somos mujeres cabeza de familia» (citado en Chica García, 2019).
    usos: []

  - id: rio-la-vieja-puerto-alejandria
    pueblo: Barrios ribereños de Cartago
    territorio: Cartago (Valle del Cauca), río La Vieja
    del_suroccidente: true
    practica: Mirar el nivel del río en Puerto Alejandría, punto de referencia de las crecientes
    que_ensena: La gente no adivina la creciente, la mira; el miedo que protege es el que enseña a qué hay que mirarle el nivel.
    conceptos: [umbral, monitoreo, serie temporal, punto de referencia, alerta]
    grados_sugeridos: [6]
    fuente_apa: |-
      CiudadRegión. (2022, 7 de marzo). Alarma por alto nivel del río La Vieja a su paso por Cartago. CiudadRegión Noticias. https://ciudadregion.com/regiones/valle-del-cauca/cartago/preocupacion-en-cartago-por-alto-nivel-del-rio-la-vieja
    fuente_apa_latex: |-
      CiudadRegión. (2022, 7 de marzo). \emph{Alarma por alto nivel del río La Vieja a su paso por Cartago}. CiudadRegión Noticias.
    fuentes_apa_extra:
      - |-
        Alcaldía de Cartago, Secretaría de Salud y Protección Social. (2026). Análisis de situación de salud participativo. Municipio de Cartago, año 2025. Municipio de Cartago. https://cartago.gov.co/wp-content/uploads/2026/03/ASIS-Cartago-2025_Final.pdf
      - |-
        López-García, J.-D., Carvajal-Escobar, Y., & Enciso-Arango, A.-M. (2017). Sistemas de alerta temprana con enfoque participativo: un desafío para la gestión del riesgo en Colombia. Revista Luna Azul, (44), 231–246. https://doi.org/10.17151/luaz.2017.44.14
    verificacion: vault CONFIRMADA como hecho territorial, con reserva (Anclas 1 §6) · prensa regional fechada + ASIS Cartago 2025 (pp. 12-17) + artículo arbitrado con DOI que confirma la ausencia de SAT en la cuenca
    cara_de_exclusion: "La creciente se lleva siempre los mismos barrios (Brisas del Río, La Platanera, La Arenera, La Playa, Tierra del Olvido): el riesgo está distribuido por clase y por ubicación, no por azar."
    limites_eticos: No inventar un repertorio de «señales ancestrales» (color del agua, animales, olor) ni un sistema de alerta comunitario en la cuenca (NO VERIFICADO; no existen en las fuentes).
    texto_usable: |-
      El río La Vieja bordea a Cartago y le pone frontera con Risaralda. Cuando crece, no se lleva la ciudad entera: se lleva siempre los mismos barrios (Brisas del Río, La Platanera, La Arenera, La Playa, Tierra del Olvido), que en marzo de 2022 quedaron bajo el agua cuando el río llegó a 12,3 metros. La gente no adivina la creciente: la mira. Puerto Alejandría es el punto al que se va a ver el nivel, la referencia con la que se compara «cómo está hoy» contra «cómo estaba ayer». Ese es el miedo que protege: no el que paraliza, sino el que enseña a qué hay que mirarle el nivel.
    usos: []

  - id: calendario-cafetero-mitaca-tiempo-frio
    pueblo: Campesinado cafetero
    territorio: Valle del Cauca y Caldas (Eje Cafetero)
    del_suroccidente: true
    practica: Las dos cosechas del café (principal y mitaca/traviesa) y el «tiempo frío» entre cosechas
    que_ensena: El descanso no es tiempo perdido, es la otra mitad del ciclo que hace posible la siguiente cosecha.
    conceptos: [ciclo, temporada, planificación, capacidad, latencia]
    grados_sugeridos: [6]
    fuente_apa: |-
      Parada Sanabria, P. J. (2017). Práctica social y cultural del campesinado cafetero en cuatro municipios de Caldas (Colombia). Revista Colombiana de Sociología, 40(1 Supl.), 193–212. https://doi.org/10.15446/rcs.v40n1Supl.65913
    fuente_apa_latex: |-
      Parada Sanabria, P. J. (2017). Práctica social y cultural del campesinado cafetero en cuatro municipios de Caldas (Colombia). \emph{Revista Colombiana de Sociología, 40}(1 Supl.), 193--212. https://doi.org/10.15446/rcs.v40n1Supl.65913
    fuentes_apa_extra:
      - |-
        Federación Nacional de Cafeteros de Colombia. (s. f.). Colombia se alista para recoger más de 6 millones de sacos de café este primer semestre. https://federaciondecafeteros.org/wp/listado-noticias/colombia-se-alista-para-recoger-mas-de-6-millones-de-sacos-de-cafe-este-primer-semestre/
    verificacion: vault CONFIRMADA (Anclas 1 §7) · artículo arbitrado con DOI (Univ. Nacional) + nota institucional FNC
    cara_de_exclusion: "El descanso es del cultivo y del calendario, no un beneficio laboral del recolector: entre cosechas no hay jornal. No convertirlo en lección de autocuidado individual."
    limites_eticos: No publicar la cifra «6,5 millones de sacos con 135.000 recolectores» sin contrastar la nota de la FNC (POR VERIFICAR).
    texto_usable: |-
      El café no se recoge todo el año igual. Colombia tiene dos cosechas: la principal (aproximadamente septiembre–diciembre) y una segunda llamada mitaca o traviesa (aproximadamente abril–junio). El Valle del Cauca es una de las zonas que está en traviesa en el primer semestre, mientras otras regiones están en cosecha principal: por eso en Colombia casi siempre hay alguien recogiendo en alguna parte (Federación Nacional de Cafeteros, s. f.). En las veredas cafeteras de Caldas los campesinos llaman «tiempo frío» al periodo entre cosechas: no es tiempo perdido, es la otra mitad del ciclo, la que hace posible la siguiente cosecha grande de octubre y noviembre (Parada Sanabria, 2017).
    usos: ["6-9"]

  - id: convite-caldas
    pueblo: Campesinado cafetero de Caldas
    territorio: Salamina y otros municipios de Caldas (Eje Cafetero)
    del_suroccidente: true
    practica: El convite (trabajo recíproco entre vecinos convocado por una necesidad concreta)
    que_ensena: Pedir ayuda no es confesar debilidad; es reconocer que hay problemas que ninguna casa resuelve sola.
    conceptos: [cooperación, bien común, tarea compartida, convocatoria, código abierto]
    grados_sugeridos: [6, 7, 8]
    fuente_apa: |-
      Parada Sanabria, P. J. (2017). Práctica social y cultural del campesinado cafetero en cuatro municipios de Caldas (Colombia). Revista Colombiana de Sociología, 40(1 Supl.), 193–212. https://doi.org/10.15446/rcs.v40n1Supl.65913
    fuente_apa_latex: |-
      Parada Sanabria, P. J. (2017). Práctica social y cultural del campesinado cafetero en cuatro municipios de Caldas (Colombia). \emph{Revista Colombiana de Sociología, 40}(1 Supl.), 193--212. https://doi.org/10.15446/rcs.v40n1Supl.65913
    verificacion: vault SUSTITUTO documentado de «mano cambiada / mano vuelta» (Anclas 1 §8; Anclas 4 §7-2 y Anclas 5 §11-2 lo corroboran) · artículo arbitrado con DOI y cita textual (p. 203)
    cara_de_exclusion: El convite se activa para el camino de todos, pero convive con el clientelismo y con juntas capturadas por favores; la reciprocidad entre desiguales se vuelve deuda (ver compadrazgo).
    limites_eticos: No usar la narrativa divulgativa del Banco de la República («los convites hicieron posible la supervivencia de los colonos») como dato duro.
    texto_usable: |-
      En las veredas cafeteras la ayuda mutua tiene un nombre propio: el convite. No es permanente ni ritual: se activa cuando hay una necesidad concreta. Así lo dice una campesina de Salamina (Caldas) en 2014: «Hay junta de acción comunal, hay convites. Si hay necesidad de arreglar caminos interveredales o se daña la carretera, se hace un convite» (citada en Parada Sanabria, 2017, p. 203). El convite no se pide como favor personal: se convoca porque el camino es de todos. Pedir ayuda, ahí, no es confesar debilidad; es reconocer que hay problemas que ninguna casa resuelve sola.
    usos: ["6-10", "7-9", "8-8"]

  - id: taller-bordado-reputacion-por-obra
    pueblo: Talleres de bordado de Cartago
    territorio: Cartago (Valle del Cauca)
    del_suroccidente: true
    practica: La reputación de un taller de bordado se construye con lo que sale de sus manos (ornamentos papales bordados en Cartago)
    que_ensena: Reputación construida por obra (verificable, lenta, colectiva) frente a reputación construida por conversación (rápida, barata, reversible).
    conceptos: [reputación verificable, trazabilidad, control de calidad, rumor, identidad]
    grados_sugeridos: [8]
    fuente_apa: |-
      Chica García, A. (2019, 17 de agosto). Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas. Radio Nacional de Colombia. https://www.radionacional.co/cultura/la-herencia-espanola-que-preservan-las-mujeres-de-cartago
    fuente_apa_latex: |-
      Chica García, A. (2019, 17 de agosto). \emph{Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas}. Radio Nacional de Colombia.
    verificacion: vault SUSTITUTO documentado del pregonero (Anclas 1 §10) · prensa con firma (Radio Nacional)
    cara_de_exclusion: El nombre del taller lo sostienen ocho artesanas por prenda que rara vez aparecen en él; la reputación se acumula en el taller, no en quien borda.

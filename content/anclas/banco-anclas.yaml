    texto_usable: |-
      En Cartago la reputación de un taller de bordado no la construye lo que se dice de él, sino lo que sale de sus manos. Los ornamentos que vistió el papa durante su visita a Colombia se bordaron en Cartago (Chica García, 2019). Una prenda pasa por unas ocho artesanas y más de ocho horas de trabajo antes de llevar el nombre de un taller. En un oficio así, el nombre no se defiende hablando: se defiende con la puntada, y una sola pieza mal hecha pesa más que cualquier rumor.

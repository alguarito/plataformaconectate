      - |-
        Christie, K. H. (1978). Antioqueño colonization in western Colombia: A reappraisal. Hispanic American Historical Review, 58(2), 260-283. https://doi.org/10.1215/00182168-58.2.260
    verificacion: vault SUSTITUTO documentado de «el forastero» (Anclas 4 §8-8) · dos artículos en HAHR con DOI + monografía ICANH + PES oficial (pp. 12-13)
    cara_de_exclusion: Es el corazón del ancla — el relato oficial dejó por fuera a los indígenas y a los negros que ya estaban ahí. No usar la fusión de 1846 como final feliz.
    limites_eticos: El relato de la cerca es fundacional documentado institucionalmente (PES cita a Calvo de Vanegas y a Appelbaum sin referencia en el original), no archivo primario. No publicar «cerca del 70 % de población indígena» (NO VERIFICADO; falta CNPV 2018).
    texto_usable: |-
      Riosucio (Caldas) nació de dos pueblos que no se querían: Quiebralomo, de mineros blancos, negros y mulatos, y La Montaña, de indígenas. Cada uno puso su plaza y su iglesia a una cuadra del otro, y entre las dos levantaron una cerca que los separó durante más de veinte años; los días de mercado se insultaban y se tiraban piedras de lado a lado (Ministerio de Cultura, 2011). En 1846 un decreto los fusionó, y de aquellos insultos salió el verso burlón que hoy es el Carnaval. Mientras tanto, el relato oficial del Eje Cafetero se contaba como el de colonos blancos y respetables, y ese relato dejó por fuera a los indígenas y a los negros que ya estaban ahí (Christie, 1978; Appelbaum, 2007).
    usos: ["8-8"]

  - id: roya-cosecha-incierta
    pueblo: Familias productoras de café
    territorio: Valle del Cauca y Quindío (dato nacional; medición en Chinchiná, Caldas)
    del_suroccidente: true
    practica: La cosecha incierta — la crisis de la roya (2008-2011) y la volatilidad de producción y precio
    que_ensena: Distinguir lo que no depende de nadie, lo que no depende de mí pero sí de alguien, y lo que depende de mí; la parte «incontrolable» se fabricó en parte con decisiones económicas.
    conceptos: [variable controlable, riesgo, sistema, retroalimentación, incertidumbre]

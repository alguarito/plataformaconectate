    cara_de_exclusion: La tulpa es también espacio de trabajo doméstico repartido de forma desigual; y el CRIC usa el nombre para sus espacios políticos, es decir, es institución de gobierno, no una técnica escolar.
    limites_eticos: No citar entre comillas «alrededor de la tulpa no se reza, se escucha» (NO VERIFICADA). La evidencia de Correa-Chávez y Rogoff es maya guatemalteca — decirlo. No montar una «tulpa» en el aula con el nombre indígena.
    texto_usable: |-
      En los pueblos del Cauca hay un lugar donde se aprende a escuchar: la tulpa, el fogón de tres piedras en el centro de la casa. El Tejido de Comunicación de la ACIN recoge la explicación de los mayores kiwe the del resguardo de Toez, Caloto: «las tres piedras que forman la tulpa son traídas con todos los análisis espirituales de los mayores… es aquí donde está la comunicación propia» (2018). Cuatro comuneros del pueblo kokonuko lo cuentan igual en la revista del CRIC: alrededor del fogón, de noche y después de comer, los abuelos y abuelas contaban historias a hijos y nietos (2022). Nadie llegaba allí a hablar: se llegaba a estar y a oír.
    usos: ["6-8"]


  - id: chisme-matachin-riosucio
    pueblo: Carnaval de Riosucio (Matachines) y campesinado cafetero de Caldas
    territorio: Riosucio (Caldas)
    del_suroccidente: true
    practica: El chisme como frontera del grupo y el Matachín, «hacedor de la palabra», que lo devuelve en verso, firmado y en público
    que_ensena: La diferencia con el rumor no es el contenido, es que alguien pone la cara; y el pueblo consagra o degrada a sus Matachines.
    conceptos: [rumor vs. palabra firmada, autoría, moderación, verificación pública, pertenencia]

      Cartago fue fundada el 9 de agosto de 1540 por el mariscal Jorge Robledo, y cada agosto celebra su aniversario: misa en la Catedral Nuestra Señora del Carmen, ofrenda floral en el monumento a Robledo en La Isleta y sesión solemne del Concejo Municipal (Alcaldía de Cartago, 2021); la Feria de 2026 se programó del 1 al 9 de agosto, en los 486 años del municipio. A pocos kilómetros, Ansermanuevo celebra a mediados de agosto sus Fiestas del Calado y el Bordado, y se llama a sí misma «cuna del calado y el bordado». Dos pueblos vecinos, dos ferias en el mismo mes, y en ambas la misma pregunta: en la feria uno se pone lo mejor que tiene, pero ¿lo mejor que tiene es lo que hace o lo que compra?

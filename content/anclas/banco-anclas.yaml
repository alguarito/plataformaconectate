    texto_usable: |-
      Alguien nos enseñó a mirar los cuerpos así. La antropóloga Zandra Pedraza revisó lo que se leyó en Colombia entre 1830 y 1990 (cartillas escolares, manuales de higiene, textos de educación popular y la revista Cromos) y encontró que el país fue aprendiendo, página por página, qué cuerpo se consideraba sano, decente y digno de respeto, y cuál no. Ese aprendizaje pasó por la escuela: la clase de higiene y la de urbanidad enseñaban a pararse, a comer, a vestirse y, sin decirlo, a avergonzarse. Por eso la burla por un cuerpo no es un chiste espontáneo: es una lección vieja que alguien repite sin saber de dónde la sacó.

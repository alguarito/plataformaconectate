    pueblo: Wounaan
    territorio: Bajo San Juan (Chocó / Valle del Cauca)
    del_suroccidente: true
    estado: sin ficha ni mención en el vault
    que_falta: fuente de Artesanías de Colombia (CENDAR) o etnografía arbitrada sobre la técnica, el rol de las tejedoras y la economía del oficio; cara de exclusión (informalidad, intermediarios)
    fuentes_localizadas: []
    guias_candidatas: []

  - id: rio-como-grafo
    nombre: El río como grafo (identificarse y orientarse por cuencas y afluentes)
    pueblo: Comunidades del Pacífico (por definir)
    territorio: Pacífico colombiano
    del_suroccidente: true
    estado: metáfora técnica sin práctica documentada; lo único verificado es «las personas se identifican por el río del que vienen» (Riaño-Alcalá & Chaparro, 2020) y los cantos de boga
    que_falta: fuente que documente un sistema de orientación o de nombres por afluentes en una comunidad concreta; si no aparece, tratarlo como analogía de la guía (declarada), no como saber ancestral
    fuentes_localizadas:
      - |-
        Riaño-Alcalá, P., & Chaparro Pacheco, R. (2020). Cantando el sufrimiento del río. Memoria, poética y acción política de las cantadoras del Medio Atrato chocoano. Revista Colombiana de Antropología, 56(2), 79–110. https://doi.org/10.22380/2539472X.793
    guias_candidatas: []

  - id: cabildo-composicion-y-juan-tama
    nombre: Composición estándar del cabildo y origen del bastón en Juan Tama (1635)
    pueblo: Nasa
    territorio: Cauca
    del_suroccidente: true
    estado: datos hallados en fuente divulgativa / presentados como legendarios por el propio Museo Nacional (Anclas 2 §3)
    que_falta: reglamento interno de un cabildo concreto o fuente del CRIC para la composición; el origen en Juan Tama se usa solo como tradición
    fuentes_localizadas: []
    guias_candidatas: ["8-9"]

# ═══════════════════════════════════════════════════════════════════════════
# DESCARTADAS · anclas que NO deben usarse tal como estaban formuladas
# ═══════════════════════════════════════════════════════════════════════════
descartadas:

  - nombre: Parteras del Norte del Valle
    guia: "6-1"
    razon: Atribución territorial falsa. La partería patrimonial colombiana es afro del Pacífico (Buenaventura); en Cartago el parto institucional es del 99,3 % (ASIS 2025).
    sustituto: parteria-afro-pacifico-asoparupa

  - nombre: Mano cambiada / mano vuelta
    guia: "6-10"
    razon: «Mano vuelta» está documentada en comunidades indígenas y rurales de México; no hay fuente que la registre en el Valle ni en el Eje Cafetero.
    sustituto: convite-caldas

  - nombre: El lindero campesino (mojones y disputas)
    guia: "6-7"
    razon: No hay costumbre local documentada; lo único localizable es el deslinde y amojonamiento (derecho procesal, no tradición).
    sustituto: cerca-viva-valle

  - nombre: El pregonero
    guia: "8-4"
    razon: Oficio hispánico general; cero evidencia en Cartago, Ansermanuevo o el Norte del Valle.
    sustituto: taller-bordado-reputacion-por-obra

  - nombre: El sereno
    guia: "10-1"
    razon: Documentado en Bogotá y solo en fuentes divulgativas; ninguna menciona Cartago. Si se usa, declarar «en Bogotá, a finales del siglo XIX».
    sustituto: aviso-nocturno-barrios-riberenos

  - nombre: El consejo de mayores (genérico)
    guia: "8-2"
    razon: No nombra ninguna institución verificable; no existe con ese nombre en el CRIC, la ONIC ni los cabildos misak o nasa.
    sustituto: misak-nu-nakchak-misak-ley

  - nombre: El silencio del sabedor
    guia: "6-8"
    razon: Imagen bonita sin fuente; no hay corpus etnográfico del silencio como pedagogía nasa, misak o embera.
    sustituto: tulpa-kokonuko-acin

  - nombre: El límite del secreto
    guia: "7-7"
    razon: Descartada por ética, no por falta de fuentes — documentarla obliga a usar como ilustración lo que las comunidades protegen (Kolowratnik, 2022). Única formulación admisible, sin más — «hay saberes que un pueblo decide no compartir, y esa decisión también está reconocida — cuando el Estado inscribe una manifestación, es la comunidad la que escribe qué se salvaguarda» (PES wayuu; UNESCO 2022, exp. 01886). Ninguna guía nombra contenidos de saber restringido de ningún pueblo.
    sustituto: null

  - nombre: Querencia como término del Pacífico
    guia: "11-5"
    razon: Vocabulario hispano / Yi-Fu Tuan / Nuevo México; los términos documentados del territorio son paisanaje, colonias e identificarse por el río.
    sustituto: paisanaje-colonias-cali

  - nombre: Cantos de boga del río Cauca que «regulan la respiración»
    guia: "6-4"
    razon: No hay cantos de boga documentados en el río Cauca (son de ríos del Pacífico) y el vínculo canto→respiración es inferencia, no dato.
    sustituto: cantos-de-boga-pacifico

  - nombre: La palabra empeñada (abstracta)
    guia: "7-4"
    razon: Estampa costumbrista sin práctica nombrada.
    sustituto: fiado-cali-cuaderno

  - nombre: El testigo comunitario / testigo de lindero
    guia: "8-3"
    razon: No existe como figura ritual con nombre propio en Colombia; la costumbre de golpear a un niño en el mojón es europea y no verificada aquí.
    sustituto: conciliador-en-equidad-jac

  - nombre: El forastero (genérico)
    guia: "8-8"
    razon: Sin lugar ni fuente; el ángulo fuerte es la colonización antioqueña y quién quedó por fuera.
    sustituto: riosucio-dos-plazas-la-cerca

  - nombre: Cabañuelas
    guia: "10-9"
    razon: NO VERIFICADO en Colombia como saber etnográficamente documentado; solo prensa y divulgación, sin estudio colombiano que las compare con el pronóstico. ATENCIÓN — la guía semillero/astronomia-2 las usa hoy como saber_ancestral «del campo del Valle»; corregir.
    sustituto: pleiades-orlove

  - nombre: La casa que vigila
    guia: "9-4"
    razon: No nombra casa, pueblo ni práctica.
    sustituto: codigo-penal-1936-art-383

  - nombre: Apellidos del Valle como casta
    guia: "9-5"
    razon: No hay estudio arbitrado sobre estratificación por apellido en pueblos del Valle. «Castas» sí se sostiene.
    sustituto: gracias-al-sacar-1795

  - nombre: El que trabaja distinto / «el lugar sagrado del distinto»
    guia: "9-6"
    razon: Sin práctica tradicional documentada que resista verificación; lo que circula es divulgación no arbitrada.
    sustituto: instituto-ninos-ciegos-sordos-cali-lengua-de-senas

  - nombre: El cuerpo que trabaja / la chapolera como imagen fabricada
    guia: "8-7"
    razon: No nombra oficio ni fuente; no hay crítica académica localizable sobre la chapolera como imagen fabricada.
    sustituto: pedraza-cuerpo-aprendido

  - nombre: Saber ancestral sobre el suicidio
    guia: "10-4"
    razon: No existe ni debe fabricarse; la crisis de suicidio en pueblos indígenas es asunto de salud pública, no material de apertura. Tampoco usar los ritos mortuorios del Medio San Juan en esta guía.
    sustituto: guardia-indigena-kiwe-thegnas

  - nombre: La medida comunitaria del valor
    guia: "11-2"
    razon: Nombra una idea, no una comunidad.
    sustituto: fals-borda-saucio-escala-agricola

  - nombre: El que se fue a estudiar / «el encargue» de hijos
    guia: "11-6"
    razon: Sin práctica documentada que resista verificación.
    sustituto: univalle-regionalizacion-sede-cartago

  - nombre: Reglas comunitarias del noviazgo (sin documento)
    guia: "9-3"
    razon: A secas no nombra nada; solo se rescata anclada en la Real Pragmática de 1776/1778.
    sustituto: real-pragmatica-matrimonios-1776

  - nombre: El que abre trocha (relato heroico)
    guia: "11-3"
    razon: Solo se rescata con el ángulo duro obligatorio (Compañía Burila); sin él es epopeya sin referente.
    sustituto: colonizacion-norte-del-valle-compania-burila

  - nombre: Cirugía estética y narcocultura «en el Valle del Cauca»
    guia: "8-7"
    razon: La literatura arbitrada es sobre Culiacán, Medellín o Colombia en general; no atribuir al Valle.
    sustituto: null

  - nombre: Cabrillas / Pléyades como saber «de estas laderas» y de los Quimbaya
    guia: "astronomia-1"
    razon: El estudio de Orlove et al. (2000) es de agricultores del altiplano de Perú y Bolivia; no hay fuente que lo sitúe en el Valle ni entre los quimbayas. La guía astronomia-1 debe declarar el origen andino.
    sustituto: pleiades-orlove

# ═══════════════════════════════════════════════════════════════════════════
# CORRECCIONES OBLIGATORIAS · errores detectados en la ronda adversarial del vault
# ═══════════════════════════════════════════════════════════════════════════
correcciones_obligatorias:
  - "«Mandar obedeciendo» es zapatista (EZLN, Chiapas, Juntas de Buen Gobierno 2003), no nasa; si se usa, se dice de dónde viene."
  - "El poporo Quimbaya del Museo del Oro procede de Angostura/Yarumal, Antioquia — no de Cartago ni del Valle. El Tesoro Quimbaya fue saqueado en 1890 en La Soledad, Filandia (Quindío); la fórmula «regalado a España en 1892 por los 400 años» está refutada."
  - "«Quimbaya» es un exónimo colonial y de coleccionistas, sobre-extendido a todo el Cauca medio; la orfebrería clásica es del Periodo Temprano (~500 a.C.–600 d.C.), no del grupo contactado por Robledo en el siglo XVI. Presentarlo siempre como hipótesis/etiqueta, no como pueblo único."
  - "Cartago fue fundada el 9 de agosto de 1540 donde hoy está Pereira (Cartago Viejo) y se trasladó al sitio actual en 1691."
  - "Los alabaos NO son patrimonio de la humanidad (UNESCO). Lo inscrito por la UNESCO es la música de marimba y cantos y bailes tradicionales del Pacífico sur (2010, Lista Representativa — no Salvaguardia Urgente; ampliada y reemplazada en 2015 con Ecuador). Los ritos mortuorios del Medio San Juan están en la lista nacional (Resolución 3094 de 2014) y cubren un solo municipio."
  - "«Levantar la tumba» es desmontar el altar doméstico cantando al noveno día; no es abrir la sepultura. En el gualí (velorio de niño) no hay rosario, alabaos ni novena. No datar los alabaos en el siglo XVII."
  - "Radio Sutatenza / ACPO entró al programa Memoria del Mundo de la Unesco en 2013 (registro regional), no en 2017; verificar si el registro es regional o internacional antes de citarlo."
  - "Sentencia T-523 de 1997 — la sanción fue de 60 fuetazos (dos por cabildo), más expulsión y pérdida de derechos políticos; no «20 fuetazos». Ponente: Carlos Gaviria Díaz."
  - "Código Penal de 1936 (Ley 95 de 1936) — el atenuante por «vida honesta» es el artículo 383, no el 382."
  - "Ley 1799 de 2016 — la prohibición de cirugía estética a menores no es absoluta: la Sentencia C-246 de 2017 la declaró exequible condicionada (excluye a mayores de 14 años con capacidad evolutiva que decidan con quienes tienen la patria potestad)."
  - "«Mano vuelta» es mexicana (tepehuas; tequio, gozona, fajina); en el Eje Cafetero el nombre documentado es el convite."
  - "Traviesa y mitaca son la misma cosecha secundaria del café, no dos distintas."
  - "RUV — ubicación ≠ ocurrencia ≠ declaración. Decir «en Cartago pasaron 7.631 desplazamientos» sería falso; los 2.650 migrantes son afiliados al SGSSS, no un censo."
  - "El CRIC nació el 24 de febrero de 1971 en Toribío (no el 21). No publicar el listado de cabildos fundadores como cerrado (siete vs. ocho nombres)."
  - "Ley 89 de 1890 — si se cita, nombrar su título racista y que la Corte Constitucional derribó los artículos 1, 5, 40 (C-139/96) y 11 (C-463/14). El cabildo es un cuerpo colegiado, no «un jefe»."
  - "No traducir pütchipü'üi como «el que habla bonito» ni shur/shura como «abuelo/abuela» (glosa NO VERIFICADA)."
  - "Las cabañuelas NO están verificadas en Colombia; no afirmar ni que funcionan ni que no funcionan «según estudios»."
  - "El estudio de las Pléyades (Orlove, Chiang y Cane, 2000) es de los Andes de Perú y Bolivia; no atribuirlo al Valle, a Cartago ni a los quimbayas."
  - "Censo 2018 — las cifras de población negra, afrocolombiana, raizal y palenquera están disputadas oficialmente (omisión censal; Sentencia T-276 de 2022); no usarlas sin la advertencia."
  - "No hay cantos de boga en el río Cauca ni fuente de que «regulen la respiración»."
  - "El «gualiceo» (bailar con el cuerpo del niño) no va a ninguna guía. No pedir a estudiantes que canten un alabao."
  - "Fórmula descriptiva obligatoria: «el pueblo X resuelve así…; nosotros, aquí, tenemos este otro problema». Nunca «los pueblos indígenas nos enseñan a…» ni «los afrocolombianos hacen…». Prohibido el juego de roles con nombres de instituciones indígenas (palabrero, cabildo, mandato, tulpa, bastón)."

    fuente_apa_latex: |-
      UNESCO. (2010). \emph{El sistema normativo de los wayuus, aplicado por el pütchipü'üi («palabrero»)} (Expediente 00435). Lista Representativa del Patrimonio Cultural Inmaterial de la Humanidad.
    fuentes_apa_extra:
      - |-
        Polo Figueroa, N. (2016). Reparación y reconciliación en el sistema normativo wayuu. Civilizar Ciencias Sociales y Humanas, 16(31), 41-48. https://doi.org/10.22518/16578953.641
      - |-
        Ministerio de Cultura de Colombia. (2009, 30 de diciembre). Resolución 2733 de 2009, por la cual se aprueba el Plan Especial de Salvaguardia del sistema normativo wayuu aplicado por el pütchipü'üi (palabrero).
      - |-
        Guerra Curvelo, W. (2002). La disputa y la palabra: la ley en la sociedad wayuu. Ministerio de Cultura.
    verificacion: vault CONFIRMADA, la más sólida del lote (Anclas 2 §1) · declaratoria UNESCO 2010 (Lista Representativa, exp. 00435) + Resolución 2733 de 2009 + artículo arbitrado con DOI + antropólogo wayuu (Guerra Curvelo)
    cara_de_exclusion: La responsabilidad es clanil, no personal, y la venganza existe dentro del sistema como último recurso reglado; presentar a los wayuu como «pueblo sin venganza» sería falso y paternalista.
    limites_eticos: Decir siempre «el pueblo wayuu, en La Guajira». Prohibido el juego de roles con el nombre wayuu ni convertir al palabrero en «mediador escolar». No traducir pütchipü'üi como «el que habla bonito». No imprimir «37 palabreros», la grafía de la Junta ni «maünnaa» sin confirmar.
    texto_usable: |-
      Entre el pueblo wayuu, en La Guajira, cuando dos familias entran en conflicto ninguna de las dos habla directamente con la otra: se busca un pütchipü'üi, el palabrero, que lleva y trae la palabra hasta que hay un acuerdo. Su oficio no es averiguar quién tiene la razón, sino evitar que la ofensa se convierta en guerra, y termina en una compensación (ganado, collares de tumas, hoy también dinero) que repara el daño ante los dos clanes. Este sistema normativo wayuu fue inscrito por la UNESCO en 2010 en la Lista Representativa del Patrimonio Cultural Inmaterial de la Humanidad (expediente 00435), y en Colombia tiene su propio Plan Especial de Salvaguardia desde la Resolución 2733 de 2009, a cargo de la Junta Mayor Autónoma de Palabreros, con sede en Maicao.

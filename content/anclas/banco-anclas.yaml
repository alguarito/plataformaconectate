      En el Eje Cafetero, «cuadrilla» nombra dos cosas. Una es el grupo de recolectores que entra al cafetal detrás de un patrón de corte que marca los surcos con una bandera; ahí uno pertenece mientras dure la cosecha y a la gente se la conoce por de dónde viene: paisa, tolimense, pastuso (Saldarriaga Ramírez, 2024). La otra son las Cuadrillas del Carnaval de Riosucio: doce a quince personas que trabajan un año entero en una letra, una música y un disfraz que no se pueden repetir nunca más (Ministerio de Cultura, 2011). Las dos dan pertenencia. Pero una la da mientras uno sirva, y la otra la da mientras uno cree.

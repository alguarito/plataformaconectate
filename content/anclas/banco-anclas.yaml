    practica: Las dos cuadrillas — la de recolección tras un patrón de corte y la del Carnaval de Riosucio (12-15 personas, un año de trabajo)
    que_ensena: Las dos dan pertenencia; una la da mientras uno sirva, y la otra mientras uno cree.

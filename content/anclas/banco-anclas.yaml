    del_suroccidente: true
    practica: El alabao, canto fúnebre responsorial (pie y segunda) en velorios de adultos
    que_ensena: La empatía como presencia sostenida y trabajo repartido (cantar, cocinar, prestar el espacio, acompañar toda la noche), frente a la lástima como comentario. Nadie sostiene la voz solo.
    conceptos: [respuesta, redundancia, carga distribuida, red de apoyo, patrón llamada-respuesta]

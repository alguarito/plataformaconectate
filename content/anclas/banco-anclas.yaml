    texto_usable: |-
      En los ríos del Pacífico —Atrato, San Juan, Guapi, Timbiquí— quien va remando canta. Se llaman cantos de boga y, según el Plan Especial de Salvaguardia de las músicas de marimba, «los entonan sobre todo las mujeres mientras navegan en sus pequeñas canoas». El único acompañamiento es el golpe del canalete en el agua. En el Chocó se registra que los bogas cantaban para «aligerar el paso» en trayectos de días enteros. El canto no quita el esfuerzo: le pone un compás y lo vuelve sostenible.
    usos: ["6-4"]


    texto_usable: |-
      En 1795 la Corona española publicó un arancel de gracias que se podían comprar, y entre las setenta y una opciones estaba la blancura: un pardo o un quinterón podía pagar para que un papel oficial lo declarara blanco. Eso se llamó gracias al sacar, y la historiadora Ann Twinam siguió esos expedientes uno por uno. Que la blancura tuviera precio prueba dos cosas al tiempo: que no era un hecho de la naturaleza sino una posición social, y que esa posición abría o cerraba puertas reales (estudiar, ordenarse sacerdote, ocupar un cargo, casarse con quien uno quisiera). El sistema de castas no era una etiqueta: era una lista de permisos. Y su rastro no se fue con la Colonia: siguió viviendo en quién parece «de familia conocida» y quién no.

    verificacion: vault CONFIRMADA con acotación territorial (Anclas 4 §7-2) · artículo arbitrado con DOI (Nariño) + clásico antropológico + marco regional (Gutiérrez de Pineda). Falta etnografía específica del Norte del Valle o Eje Cafetero.
    cara_de_exclusion: El compadrazgo fue infraestructura del clientelismo — el gamonal ofrecía protección a cambio de lealtad y el compadrazgo y el favor personal convirtieron la supervivencia comunitaria en relación de poder (Leal Buitrago y Dávila, 1990). El vínculo entre desiguales no es amistad, es deuda.
    limites_eticos: Cotejar la edición de Gutiérrez de Pineda contra el ejemplar físico (reimpresiones con paginación distinta). El vault menciona «mano cambiada / mano vuelta» junto al convite en esta ficha; para el Valle solo está documentado el convite (ver correcciones).
    texto_usable: |-
      En el campesinado andino colombiano, apadrinar a un niño no crea un lazo con el niño solamente: crea un lazo entre los adultos. Los padres y los padrinos quedan como compadres, y ese vínculo obliga a ayudar, a prestar la mano y a responder aunque no haya papel firmado (Mintz y Wolf, 1950; Chamorro Rosero, 2016). En Caldas todavía se documentan convites: cuando se daña la carretera de la vereda, la gente se convoca y la arregla entre todos (Parada Sanabria, 2017). El compadre no es «mi amigo»: es alguien con quien uno queda comprometido. Y ese mismo lazo, cuando el compadre es el poderoso del pueblo, deja de ser ayuda mutua y se vuelve favor que se cobra.
    usos: ["7-2"]

  - id: fiado-cali-cuaderno
    pueblo: Tenderas y vecinos de barrio en Cali
    territorio: Cali (Valle del Cauca); tiendas de barrio de Cartago (uso en 8-1-1)
    del_suroccidente: true
    practica: El fiado — circuito crediticio sin interés ni garantía, sostenido por un cuaderno manuscrito y por ser «buena paga»
    que_ensena: La palabra vale porque hay memoria (el cuaderno se revisa y se tacha); el registro vale porque cualquiera puede ponerlo a prueba.
    conceptos: [registro, libro mayor, verificación, confianza, control de versiones]
    grados_sugeridos: [7, 8]
    fuente_apa: |-
      Martínez Benavides, A. (2021). Circuitos crediticios: fiado y trabajo relacional en un pequeño negocio en Cali, Colombia. Estudios Sociológicos de El Colegio de México, 39(116), 467-494. https://doi.org/10.24201/es.2021v39n116.1946
    fuente_apa_latex: |-

        Federación Nacional de Cafeteros de Colombia. (2025). Informe de gestión 2024. FNC. https://federaciondecafeteros.org/informes/
    verificacion: vault CONFIRMADA, la de datos más duros del lote (Anclas 4 §10-2) · artículo arbitrado con DOI + informe de gestión FNC 2024
    cara_de_exclusion: Presentar el precio internacional como «destino» sería falsear el dato — el precio y el costo del insumo determinaron el manejo, y el manejo la vulnerabilidad (Avelino et al., 2015). Cuidado con la lectura estoica ingenua.
    limites_eticos: No usar «7,7 millones de sacos en 2012» (NO VERIFICADO) ni las cifras de precio de 1990 y pérdidas post-1989 sin series de la OIC (POR VERIFICAR).
    texto_usable: |-
      Un cafetero del Valle o del Quindío controla cuándo abona, cuándo renueva y cuándo recoge. No controla el hongo, ni la temperatura, ni el precio en Nueva York. Entre 2008 y 2011 la roya hizo caer la producción colombiana un 31 % en promedio frente a 2007 (Avelino et al., 2015). Y lo que la disparó no fue solo el clima: al subir el costo de los insumos, muchos dejaron de abonar, y el cafetal mal manejado se volvió vulnerable. En 2022 el país produjo 11,1 millones de sacos; en 2024, 14 millones, «por mejores condiciones climáticas» (Federación Nacional de Cafeteros, 2025). En medio de eso viven 557.311 familias productoras. La pregunta del cafetero no es cómo evitar la incertidumbre, sino qué hacer con la parte que sí es suya.

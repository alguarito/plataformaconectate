    cara_de_exclusion: Quienes cantan son en su mayoría mujeres mayores que no reciben remuneración y cuya pérdida por desplazamiento la comunidad registra como amenaza; el canto tiene función espiritual, no terapéutica.
    limites_eticos: No convertir el alabao en «técnica para procesar emociones». No pedir a los estudiantes que canten un alabao (escuchar una grabación con crédito sí; ejecutar, no). Nombrar siempre el origen (Medio San Juan; Pogue, Bojayá) y a las cantadoras cuando existan. No decir «los alabaos son patrimonio de la humanidad» ni «datan del siglo XVII».
    texto_usable: |-
      En el Chocó y en el Pacífico, cuando muere un adulto, la comunidad no llega a la casa a decir frases: llega a cantar. El canto se llama alabao y es responsorial: alguien «pone el pie» y los demás responden haciendo «la segunda», de modo que nadie sostiene la voz solo. Quienes lo cantan son, en su mayoría, mujeres mayores llamadas cantadoras o alabaoras. En los velorios del municipio del Medio San Juan (Chocó) el alabao «busca apoyar y acompañar a los familiares y dolientes del difunto». Desde 2014, esos ritos están en la Lista Representativa de Patrimonio Cultural Inmaterial de Colombia.
    usos: ["7-3"]

  - id: guali-levantamiento-de-tumba-novenario
    pueblo: Comunidades afro del Medio San Juan
    territorio: Medio San Juan (Chocó); chigualo en el Pacífico centro-sur (Cauca, Nariño)
    del_suroccidente: true
    practica: El duelo con calendario — velorio, novena, levantamiento de tumba (desmontar el altar doméstico cantando al noveno día) y gualí/chigualo para niños
    que_ensena: El duelo tiene calendario y cierre; la despedida definitiva se hace cantando, pieza por pieza, delante de todos.

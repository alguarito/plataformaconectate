    verificacion: vault CONFIRMADA + reencuadre (Anclas 4 §7-8) · PES oficial (pp. 20, 41) + clásico antropológico con DOI + artículo arbitrado (Caldas)
    cara_de_exclusion: El chisme fue y sigue siendo control social sobre las mujeres — lo que se vigila es la reputación sexual (Chávez Arellano et al., 2007, estudio mexicano universitario; citarlo así). No presentarlo como cohesión pintoresca.
    limites_eticos: El estudio de Chávez Arellano et al. es mexicano y universitario — vale como evidencia del mecanismo, no como dato colombiano ni escolar.
    texto_usable: |-
      El chisme no es un accidente de los pueblos pequeños: es lo que marca quién está adentro y quién está afuera (Gluckman, 1963). En los cafetales de Caldas, el tajo es el lugar donde la gente «se entera de los chismes» mientras trabaja (Parada Sanabria, 2017). Pero en Riosucio hicieron algo distinto con eso: el Matachín, el poeta del Carnaval, recoge los chismes y los hechos del pueblo y los devuelve en verso, con nombre propio y en público. Y el pueblo, a su vez, «consagra a sus Matachines o los degrada» cuando no están a la altura (Ministerio de Cultura, 2011, p. 41). La diferencia con el rumor no es el contenido: es que alguien pone la cara.
    usos: ["7-8"]


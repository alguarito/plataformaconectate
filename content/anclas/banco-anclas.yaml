        Mintz, S. W., y Wolf, E. R. (1950). An analysis of ritual co-parenthood (compadrazgo). Southwestern Journal of Anthropology, 6(4), 341-368. https://doi.org/10.1086/soutjanth.6.4.3628562
      - |-
        Gutiérrez de Pineda, V. (1994). Familia y cultura en Colombia: tipologías, funciones y dinámica de la familia. Manifestaciones múltiples a través del mosaico cultural y sus estructuras sociales (4.ª ed.). Editorial Universidad de Antioquia. (Obra original publicada en 1968)
      - |-
        Leal Buitrago, F., y Dávila Ladrón de Guevara, A. (1990). Clientelismo: el sistema político y su expresión regional. Tercer Mundo Editores / Instituto de Estudios Políticos y Relaciones Internacionales, Universidad Nacional de Colombia.
      - |-

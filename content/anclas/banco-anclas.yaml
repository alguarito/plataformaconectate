      En la finca cafetera del siglo XX los oficios venían asignados. Un informe consular británico de comienzos de siglo dice que la recolección «la llevan a cabo mujeres y niños»; ellas eran además escogedoras en la trilladora, cocineras de los trabajadores, encargadas de los animales, de la huerta y del pancoger (Ramírez Bacca, 2015). A la recolectora la llamaron chapolera, por la chapola, el arbolito de café recién nacido. Cien años después, el DANE (2022) muestra que en los predios rurales de un solo dueño el 63,7 % son hombres y el 36,3 % mujeres, y que en ningún departamento del país hay paridad. Y algo más: hay más mujeres con título que mujeres tomando las decisiones productivas.

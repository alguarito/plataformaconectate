      En los pueblos indígenas del Cauca, las normas que rigen a todos se llaman mandatos y no las escribe una autoridad sola: salen de un congreso al que llega la gente de los resguardos a discutir durante días. El XV Congreso del CRIC se reunió en Río Blanco, Sotará, del 25 al 30 de junio de 2017, y de allí salieron mandatos concretos que la organización después tiene que rendir públicamente: cuáles se cumplieron y cuáles no. Lo mismo hizo el pueblo misak con su Misak Ley del 12 de agosto de 2007. Un mandato no vale por estar escrito: vale porque quienes lo hicieron vuelven a mirarlo.

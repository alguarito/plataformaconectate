  - id: real-pragmatica-matrimonios-1776
    pueblo: Institución (Corona española; familia patriarcal de la zona andina media)
    territorio: Indias españolas (1778); Antioquia, Viejo Caldas y Norte del Valle (marco de Gutiérrez de Pineda)
    del_suroccidente: false
    practica: La Real Pragmática de Matrimonios (1776/1778) — consentimiento paterno obligatorio y pleitos de «disenso» por desigualdad notable
    que_ensena: Las reglas se contaban como cuidado, pero cuidaban el apellido y el patrimonio; hoy el criterio es el consentimiento de quien participa, no el permiso de un tercero.
    conceptos: [consentimiento, permiso, regla, control, validación de terceros]
    grados_sugeridos: [9]
    fuente_apa: |-
      Gutiérrez de Pineda, V. (1968). Familia y cultura en Colombia: tipologías, funciones y dinámica de la familia. Tercer Mundo / Departamento de Sociología, Universidad Nacional de Colombia.
    fuente_apa_latex: |-
      Gutiérrez de Pineda, V. (1968). \emph{Familia y cultura en Colombia: tipologías, funciones y dinámica de la familia}. Tercer Mundo / Departamento de Sociología, Universidad Nacional de Colombia.
    verificacion: vault RESCATABLE con anclaje documental (Anclas 5 §1). DUDA — la lista de referencias del vault NO trae ficha APA de la Real Pragmática (1776) ni de la Real Cédula (1778); solo el marco de Gutiérrez de Pineda. Falta añadir la fuente primaria o una historiografía arbitrada antes de citar fechas en la guía.
    cara_de_exclusion: La «desigualdad notable» se medía en raza, origen y color; quien pagaba el precio era casi siempre la mujer.
    limites_eticos: No presentar el permiso familiar como ternura antigua.
    texto_usable: |-
      Durante buena parte de nuestra historia, con quién te podías juntar no lo decidías tú. El 23 de marzo de 1776 la Corona española expidió la Real Pragmática de Matrimonios, extendida a América por Real Cédula del 7 de abril de 1778: los menores de 25 años necesitaban el consentimiento de sus padres para casarse, y si los padres se oponían el asunto se litigaba ante un juez como un pleito de «disenso». El argumento legal para negar el permiso era la «desigualdad notable», y en América esa desigualdad se medía en raza, origen y color. Esas reglas se contaban como cuidado, pero lo que cuidaban era el apellido y el patrimonio de la familia, y quien pagaba el precio era casi siempre la mujer: la antropóloga Virginia Gutiérrez de Pineda documentó en 1968 que la familia de la zona andina media (Antioquia, el Viejo Caldas y el Norte del Valle) funcionaba con una estructura fuertemente patriarcal, en la que la honra de la casa se sostenía vigilando el cuerpo y la palabra de las hijas.
    usos: ["9-3"]

  - id: codigo-penal-1936-art-383
    pueblo: Institución (Código Penal colombiano de 1936)
    territorio: Colombia (nacional)
    del_suroccidente: false
    practica: El celo como atenuante legal — artículo 383 de la Ley 95 de 1936, vigente hasta enero de 1981
    que_ensena: «Me cela porque me quiere» lo creyó el país entero y lo escribió en el Código Penal; la ley protegía la honra del hombre, no la vida de la mujer.

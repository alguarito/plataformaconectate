  - id: desplazamiento-cartago-ruv
    pueblo: Población víctima y migrante ubicada en Cartago
    territorio: Cartago (Valle del Cauca)
    del_suroccidente: true
    practica: El Registro Único de Víctimas y el ASIS municipal como memoria cifrada de quién llegó de otra parte
    que_ensena: «El que llegó de otra parte» no es una hipótesis; uno de cada quince cartagüeños figura en el registro de víctimas.
    conceptos: [dato abierto, fecha de corte, unidad de análisis, metadato, ubicación vs. ocurrencia]
    grados_sugeridos: [9]
    fuente_apa: |-
      Unidad para la Atención y Reparación Integral a las Víctimas. (2026). Cifras de víctimas municipal [Conjunto de datos, corte 30 de junio de 2026]. Datos Abiertos Colombia. https://www.datos.gov.co/d/ykxr-xynr
    fuente_apa_latex: |-
      Unidad para la Atención y Reparación Integral a las Víctimas. (2026). \emph{Cifras de víctimas municipal} [Conjunto de datos, corte 30 de junio de 2026]. Datos Abiertos Colombia.
    fuentes_apa_extra:
      - |-
        Unidad para la Atención y Reparación Integral a las Víctimas. (2025). Cifras de víctimas por hechos municipal [Conjunto de datos, corte 31 de diciembre de 2025]. Datos Abiertos Colombia. https://www.datos.gov.co/d/9qih-4vkc
      - |-
        Alcaldía de Cartago, Secretaría de Salud y Protección Social. (2026). Análisis de situación de salud participativo. Municipio de Cartago, año 2025. Municipio de Cartago. https://cartago.gov.co/wp-content/uploads/2026/03/ASIS-Cartago-2025_Final.pdf
    verificacion: vault CONFIRMADA, la más sólida del lote (Anclas 1 §14) · microdatos RUV en datos.gov.co (código DANE 76147) + ASIS Cartago 2025
    cara_de_exclusion: Las cifras nombran desplazamiento forzado y migración con su fuente, no como color local; los 2.650 migrantes son solo los afiliados al SGSSS, no un censo.
    limites_eticos: Distinguir siempre ubicación / ocurrencia / declaración; decir que «uno de cada quince» es una razón aproximada entre cortes distintos; no usar el «13,9 % de víctimas en el Valle» de prensa institucional.
    texto_usable: |-
      Cartago tenía 143.522 habitantes proyectados para 2025, el 96,8 % en zona urbana (Alcaldía de Cartago, 2026, p. 42). En el Registro Único de Víctimas, con corte al 31 de diciembre de 2025, 7.631 personas víctimas de desplazamiento forzado figuran ubicadas en Cartago (es decir, viven allí); 6.385 declararon su hecho victimizante en el municipio y 2.624 sufrieron el desplazamiento dentro de Cartago mismo (Unidad para la Atención y Reparación Integral a las Víctimas, 2025). Sumando todos los hechos, con corte al 30 de junio de 2026 hay 9.393 personas víctimas ubicadas en Cartago y 7.515 reconocidas como sujetos de atención (Unidad para la Atención y Reparación Integral a las Víctimas, 2026). En el mismo corte, el Valle del Cauca registra 703.063 personas víctimas ubicadas. A eso se suma la migración reciente: con corte a agosto de 2025, 2.650 migrantes venezolanos estaban afiliados al sistema de salud en Cartago (662 en régimen contributivo y 1.988 en subsidiado), el 54 % mujeres (Alcaldía de Cartago, 2026, p. 31). En un salón de Cartago, «el que llegó de otra parte» no es una hipótesis: uno de cada quince cartagüeños figura en el registro de víctimas.
    usos: ["9-7"]


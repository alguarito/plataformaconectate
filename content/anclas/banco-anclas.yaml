    cara_de_exclusion: La ley que reconoció los cabildos (Ley 89 de 1890) tiene un título explícitamente racista y la Corte Constitucional ya derribó tres de sus artículos; citarla nombrando ese hecho, no en limpio.
    limites_eticos: "«Mandar obedeciendo» es zapatista (EZLN), no nasa: si se usa, se dice de dónde viene. No convertir el bastón en objeto decorativo de aula ni en «símbolo del turno de palabra». No publicar la composición del cabildo ni el origen en Juan Tama (1635) como hecho histórico (tradición)."
    texto_usable: |-
      En los pueblos indígenas del Cauca, la autoridad no se toma: se recibe y se devuelve. El cabildo es elegido y reconocido por la propia comunidad y su periodo dura un año (así lo fija desde 1890 la ley que reconoció los cabildos, y así lo define hoy el Decreto 2164 de 1995: «entidad pública especial… elegidos y reconocidos por ésta»). A quien recibe el cargo se le entrega un bastón de mando de madera de chonta con cintas de colores, que carga durante ese año y luego pasa a otra persona. Desde 1991, el artículo 246 de la Constitución reconoce que esas autoridades pueden juzgar dentro de su territorio con sus propias normas.
    usos: ["8-9", "9-10"]


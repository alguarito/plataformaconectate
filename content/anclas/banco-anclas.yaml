      En los cafetales del Quindío y Risaralda pasa algo parecido: los recolectores se contratan en el cuadradero, de palabra, por una semana, y antes de aceptar preguntan por la fama del patrón (Saldarriaga Ramírez, 2024). En los dos casos la palabra vale porque hay memoria. Y la memoria también castiga: cuando alguien falla, no lo demandan, lo avergüenzan delante de todos.

    cara_de_exclusion: La alegría del gualí tiene una raíz histórica dura que la comunidad nombra — celebrar que el niño no viviría las crueldades de la esclavitud (PES, p. 44); se puede citar, no endulzar.
    limites_eticos: El «gualiceo» (bailar con el cuerpo del niño) NO va a la guía. «Tumba» ≠ sepultura — es el altar doméstico. En el gualí no hay rosario, alabaos ni novena. Cuidado extremo en aulas con duelos recientes (terremoto 2026).
    texto_usable: |-
      En el Medio San Juan (Chocó) el duelo tiene calendario. La noche del velorio se canta; después vienen nueve días de novena; el noveno día, a las cinco de la mañana, se levanta la tumba: se desarma cantando, pieza por pieza, el altar que se había montado en la sala de la casa. La comunidad lo describe como «el momento más doloroso, porque es la despedida definitiva». Cuando quien muere es un niño el rito es otro y se llama gualí (o chigualo en el sur): dura solo esa noche, se despide con rondas y juegos, y no lleva ni rosario ni alabaos ni novena.

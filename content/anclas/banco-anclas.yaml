        Jimeno, M. (2004). Crimen pasional: contribución a una antropología de las emociones. Universidad Nacional de Colombia, Facultad de Ciencias Humanas, Departamento de Antropología. https://repositorio.unal.edu.co/handle/unal/2888
    verificacion: vault SUSTITUTO de «la casa que vigila» (Anclas 5 §2) · texto de la ley en acceso abierto (Univ. del Rosario; art. 383 verificado) + monografía antropológica
    cara_de_exclusion: La frase «de vida honesta» debe quedar en el texto — muestra a quién protegía la norma.
    limites_eticos: Usar 383 (no 382); el día exacto de entrada en vigencia del Código de 1980 (enero de 1981) no está confirmado.
    texto_usable: |-
      Los celos no siempre se consideraron un problema: durante décadas fueron una atenuante legal. El artículo 383 del Código Penal colombiano de 1936 rebajaba la pena, de la mitad a las tres cuartas partes, a quien matara o hiriera a su esposa, hija o hermana «de vida honesta» sorprendida con otro, y también a quien lo hiciera «en estado de ira o de intenso dolor» por esa ofensa, aunque no la hubiera sorprendido. La norma solo dejó de regir con el Código Penal de 1980, que entró en vigencia en enero de 1981: es decir, hace menos de cincuenta años. La antropóloga Myriam Jimeno, que en 2004 leyó expedientes judiciales de crímenes pasionales en Colombia y Brasil, encontró que casi nunca hubo un arrebato repentino: hubo un conflicto largo, sostenido por una creencia aprendida (que amar da derecho a controlar) hasta que un día terminó mal.
    usos: ["9-4"]


# Banco de anclas ancestrales · fuente única para las guías ConectaTE
# ---------------------------------------------------------------------------
# Regla: solo entran prácticas con fuente verificable (APA 7) y veredicto CONFIRMADA en el vault
# o con verificación en Crossref/institución. Prioridad: pueblos y comunidades del suroccidente.
#
# Fuente de verdad: vault CEREBRO 2 → «Taller Editorial MILC/Anclas — Territorio interior/» (notas 1-5;
# la nota 6 «Química, discurso y estoicismo» no contiene anclas ancestrales, solo se consultó), más
# «Investigación — Historia aborigen de Cartago (Tomo II)» y, para la minga, «Investigación — Terremoto 2026».
# Las guías del repo que ya citan fuente (8-1-1, semillero/*, bebras/*) se usaron para llenar `usos`.
#
# Esquema
#   version: 1
#   anclas:                         # prácticas CONFIRMADAS o SUSTITUTOS documentados (una entrada por ancla del vault)
#     - id: kebab-case único
#       pueblo: pueblo o comunidad portadora (o «institución» cuando el ancla es historia/derecho situado)
#       territorio: lugar concreto
#       del_suroccidente: true | false
#           # true = Valle del Cauca, Cauca, Nariño, Chocó/Pacífico y Eje Cafetero (Caldas, Risaralda, Quindío:
#           #        territorio contiguo a Cartago). false = Wayuu, muiscas, Cundinamarca, Andes del Perú, normas
#           #        nacionales, Indias españolas, etc.: la guía DEBE declarar el origen («el pueblo wayuu, en La Guajira»).
#       practica: nombre de la práctica con su término propio
#       que_ensena: el principio que la guía puede tomar (una frase)
#       conceptos: [conceptos técnicos anclables]
#       grados_sugeridos: [grados]                 # derivados de las claves de guía del vault (6-2 → 6, 11-4 → 11…)
#       fuente_apa: referencia principal, copiada del vault (texto plano; los *itálicos* markdown se quitan)
#       fuente_apa_latex: la misma referencia para `apertura.fuente` (con \emph{} y rangos con --)
#       fuentes_apa_extra: [otras referencias del vault que sostienen la ficha]   # opcional
#       verificacion: cómo se verificó (nota y sección del vault · tipo de fuente · DOI/acto administrativo)
#       cara_de_exclusion: obligatoria (una o dos frases)
#       limites_eticos: texto o null
#       texto_usable: párrafo redactado en el vault (solo hechos verificados; sin datos NO VERIFICADO)
#       usos: [claves de guías que ya la usan]     # territorio-interior/6-2 → "6-2"; 8/8-1-1 → "8-1-1"; semillero → "astronomia-1"
#   por_verificar:                  # prácticas sin ficha cerrada: qué falta para confirmarlas
#     - nombre · pueblo · estado · que_falta · fuentes_localizadas
#   descartadas:                    # anclas que NO deben usarse tal como estaban formuladas
#     - nombre · guia · razon · sustituto (id de `anclas`, id de `por_verificar` o null)
#   correcciones_obligatorias:      # errores que el vault detectó y que ninguna guía puede repetir
#
# Convención de citas dentro de `texto_usable`: (Autor, año) tal como lo trae el vault; la referencia completa
# está en `fuente_apa` / `fuentes_apa_extra`.
# ---------------------------------------------------------------------------
version: 1

anclas:

  # ═══════════════════════════════════════════════════════════════════════
  # LOTE 1 · Cartago, Norte del Valle y Eje Cafetero (vault: Anclas 1)

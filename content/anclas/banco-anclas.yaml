    verificacion: vault SUSTITUTO documentado de «la palabra empeñada» (Anclas 4 §7-4) · etnografía arbitrada con DOI. Ya usada como apertura.fuente en la guía piloto 8-1-1.
    cara_de_exclusion: La sanción por incumplir no es proporcional ni apelable, es humillación pública ante testigos; y a quien la tendera no conoce, no le fía — el circuito solo cuenta a los que ya estaban adentro.
    limites_eticos: null
    texto_usable: |-
      En una tienda de Cali hay un cuaderno. La vendedora anota ahí quién debe y cuánto, y va tachando. Nadie firma nada: al fiado se entra demostrando que uno es «buena paga» y se sale cuando uno deja de serlo (Martínez Benavides, 2021). En los dos casos la palabra vale porque hay memoria. Y la memoria también castiga: cuando alguien falla, no lo demandan, lo avergüenzan delante de todos.
    usos: ["8-1-1", "7-4", "8-4"]


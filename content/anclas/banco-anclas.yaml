    texto_usable: |-
      Las cantadoras del Pacífico sostienen el duelo de todo el pueblo, y alguien tiene que sostenerlas a ellas. En el Medio Atrato dicen que el dolor no elaborado «les quita fuerza vital a las personas y al canto», y que es el canto compartido el que les devuelve la fuerza. Por eso nunca se canta sola: una pone el pie y las demás responden. Cuando la comunidad del Medio San Juan escribió su plan de salvaguardia, la primera línea de acción no fue el archivo ni el festival: fue «Atención a sabedoras y sabedores», con visitas, llamadas y reconocimiento a las mayores que cargan ese saber.

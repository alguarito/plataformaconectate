    texto_usable: |-
      En los Andes, los agricultores miran las Pléyades en junio para saber si el verano vendrá seco y si conviene atrasar la siembra de la papa. En el año 2000, tres investigadores lo pusieron a prueba con imágenes de satélite y datos de El Niño, y encontraron que tenían razón: cuando las Pléyades se ven borrosas es porque hay cirros altos, y esos cirros anuncian un año de El Niño con menos lluvia (Orlove, Chiang y Cane, 2000). El saber campesino no era superstición: era una observación buena a la que le faltaba la explicación. Hoy en Colombia las Mesas Técnicas Agroclimáticas sientan en la misma mesa a agricultores, meteorólogos y técnicos para decidir juntos qué sembrar y cuándo (Loboguerrero et al., 2018). Prepararse no es adivinar el año entero: es leer bien la señal que sí existe.

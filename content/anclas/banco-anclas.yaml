  - id: palabrero-wayuu
    pueblo: Wayuu
    territorio: La Guajira (Maicao, sede de la Junta Mayor Autónoma de Palabreros)
    del_suroccidente: false
    practica: El sistema normativo wayuu aplicado por el pütchipü'üi (palabrero) y la compensación entre clanes
    que_ensena: La palabra circula por un tercero antes de que el daño escale; reparar es pagar ante los dos clanes, no perdonar ni encarcelar.

      En el pueblo misak, en Guambía (Silvia, Cauca), las decisiones grandes no las toma una persona: se llevan al Nu Nakchak, el espacio de las autoridades junto con los shures y shuras, los mayores y mayoras. Ese modo de decidir dejó documentos con fecha: el Mandato de Vida y Permanencia Misak Misak (Piendamó, 2005) y la Misak Ley, proclamada el 12 de agosto de 2007, donde el pueblo misak dice públicamente qué acepta y qué no, apoyado en lo que llama su Derecho Mayor. No es un «no» dicho de rabia: es un no que se sostiene por escrito, con testigos y con años encima.

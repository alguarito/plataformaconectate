    texto_usable: |-
      Entre los embera, el jaibaná no nace jaibaná ni hereda el cargo: aprende de un maestro, al que acompaña durante años. El antropólogo Luis Guillermo Vasco Uribe lo documentó en Jaibanás: los verdaderos hombres (1985), tras trabajar con los embera chamí de Risaralda y con los embera del río Garrapatas, en el Valle del Cauca. Se aprende estando al lado, mirando y haciendo, no recibiendo instrucciones; y por eso lo primero que se aprende de alguien es cómo mira el mundo. La investigación sobre aprendizaje en comunidades indígenas de América (Rogoff y colaboradoras) llama a esto observación atenta y escucha de cerca: aprender de una actividad que no está dirigida a uno.

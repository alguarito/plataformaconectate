      Desde 1958, Colombia tiene una institución donde los vecinos deciden juntos: la Junta de Acción Comunal (Ley 19 de 1958). Hoy la rige la Ley 2166 de 2021, y ahí están las reglas exactas del juego: en una vereda bastan 20 afiliados para constituirla, la asamblea se reúne por lo menos tres veces al año, no se puede ni siquiera deliberar con menos del 20 % de los miembros, y para cambiar los estatutos se necesitan dos tercios. Cada junta tiene una Comisión de Convivencia y Conciliación, y no se puede sancionar a nadie sin pasar por ella. Y hay un detalle que casi nadie sabe: se puede ser afiliado desde los catorce años.

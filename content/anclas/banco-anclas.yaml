  - id: conciliador-en-equidad-jac
    pueblo: Institución (organizaciones cívicas de barrios, corregimientos y veredas)
    territorio: Colombia (nacional; existe en cada vereda con junta)
    del_suroccidente: false
    practica: El conciliador en equidad, la Comisión de Convivencia y Conciliación de la JAC y el juez de paz — la comunidad nombra a quien mira, da fe y responde
    que_ensena: Mirar es un cargo; estas normas reparten la responsabilidad para que no recaiga en un individuo aislado.
    conceptos: [rol designado, acta, cosa juzgada, responsabilidad distribuida, procedimiento]
    grados_sugeridos: [8]
    fuente_apa: |-
      Congreso de la República de Colombia. (2021, 18 de diciembre). Ley 2166 de 2021. Por la cual se establece el régimen de los organismos de acción comunal… Diario Oficial.
    fuente_apa_latex: |-
      Congreso de la República de Colombia. (2021, 18 de diciembre). \emph{Ley 2166 de 2021. Por la cual se establece el régimen de los organismos de acción comunal\ldots} Diario Oficial.
    fuentes_apa_extra:
      - |-
        Congreso de la República de Colombia. (1998, 7 de julio). Ley 446 de 1998. Por la cual se adoptan como legislación permanente algunas normas del Decreto 2651 de 1991… Diario Oficial No. 43.335.
      - |-
        Congreso de la República de Colombia. (1999, 10 de febrero). Ley 497 de 1999. Por la cual se crean los jueces de paz y se reglamenta su organización y funcionamiento. Diario Oficial.
    verificacion: vault SUSTITUTO documentado de «el testigo comunitario» (Anclas 4 §8-3) · tres leyes vigentes (446/1998, 497/1999, 2166/2021 art. 29 y 32). Es derecho colombiano, no tradición — presentarlo como tal.
    cara_de_exclusion: El que da fe también puede callar; en veredas con actores armados o poder local fuerte, ser el que mira y responde tiene costo.
    limites_eticos: No usar «testigo de lindero» ni la costumbre de golpear a un niño en el mojón (NO VERIFICADO para Colombia; documentación europea).
    texto_usable: |-
      En Colombia, la comunidad no espera a que aparezca un testigo: lo nombra. Las organizaciones cívicas de barrios, corregimientos y veredas postulan a los conciliadores en equidad, y lo que ellos hacen constar en un acta tiene efecto de cosa juzgada (Ley 446 de 1998). En cada Junta de Acción Comunal hay una Comisión de Convivencia y Conciliación, y no se puede sancionar a nadie sin pasar por ella (Ley 2166 de 2021, art. 29). Y los jueces de paz se eligen por voto popular y fallan en equidad, «conforme a los criterios de justicia de la comunidad» (Ley 497 de 1999). Mirar, aquí, es un cargo.
    usos: ["8-3"]

  - id: riosucio-dos-plazas-la-cerca
    pueblo: Riosucio (Quiebralomo y La Montaña); resguardos indígenas de Riosucio
    territorio: Riosucio (Caldas); Zona Cafetera
    del_suroccidente: true
    practica: Dos pueblos, dos plazas y una cerca en la mitad de la calle (1819-1846); el relato blanco de la colonización antioqueña y a quién dejó por fuera
    que_ensena: La región se narró a sí misma como blanca y moderna, y esa narración fue una herramienta de despojo; de los insultos de mercado salió el verso del Carnaval.

  - id: compadrazgo-andino
    pueblo: Campesinado andino colombiano (complejo cultural de la montaña)
    territorio: Andes colombianos — Gualmatán (Nariño); Antioquia, Viejo Caldas y Norte del Valle (marco regional)
    del_suroccidente: true
    practica: El compadrazgo (parentesco ritual entre adultos creado al apadrinar) y el convite que lo acompaña
    que_ensena: El compadre no es «mi amigo», es alguien con quien uno queda comprometido; y el mismo lazo entre desiguales se vuelve favor que se cobra.
    conceptos: [red de confianza, vínculo, dependencia, obligación, clientelismo]
    grados_sugeridos: [7]
    fuente_apa: |-

        Gluckman, M. (1963). Gossip and scandal. Current Anthropology, 4(3), 307-316. https://doi.org/10.1086/200378
      - |-
        Parada Sanabria, P. (2017). Práctica social y cultural del campesinado cafetero en cuatro municipios de Caldas (Colombia). Revista Colombiana de Sociología, 40(1 Supl.), 193-212. https://doi.org/10.15446/rcs.v40n1supl.65913

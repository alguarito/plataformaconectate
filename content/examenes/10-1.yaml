clave: "10-1"
grado: 10
periodo: 1
completo: true

titulo: "Examen final · Libro editorial con asistencia de IA"
titulo_portada: |-
  Examen final ---
  Libro editorial
  con IA

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen: tu firma como editor responsable depende de eso.

apertura:
  saber_ancestral: |-
    En cada barrio del centro de Cartago hubo durante décadas un personaje silencioso que cualquier vecino mayor recuerda: \textbf{el editor de la gaceta barrial}. La gaceta era un cuadernillo impreso a mimeógrafo, después fotocopiado, que circulaba los sábados por las tiendas. Adentro venían noticias del barrio: cumpleaños, fallecimientos, fiestas patronales, ofertas. \textbf{El editor no escribía todas las notas}: las recibía, las elegía, las corregía. Cada semana llegaban a su mesa 30-40 notas mandadas por vecinos. El editor leía cada una y decidía: \emph{esta entra, esta no, esta se acorta, esta se publica al lado de aquella}. Cuando salía la gaceta, su nombre aparecía abajo: \emph{``Editor: don Hernando Castaño.''} Esa firma no significaba ``yo escribí esto''; significaba \textbf{``yo respondo por esta pieza''}. Si una nota tenía error, el editor respondía. Esa distinción ancestral entre \emph{escribir} y \emph{editar} es la base del oficio que aprendiste este periodo con IA generativa: el modelo escribe primeros borradores, tú decides qué entra, ordenas, refinas y firmas.

  contexto: |-
    Este examen cierra el periodo 1 de grado 10°, donde construiste un \textbf{libro de al menos 80 páginas con asistencia de IA generativa}. Recorriste el oficio completo: concebir género y audiencia (S2), prompting profesional (S3), iteración V1→V2→V3 (S4), estructura editorial (S5), derechos de autor y Ley 23 de 1982 (S6), portada con IA de imagen (S7), diagramación (S8), producción final con carta del editor (S9) y sustentación pública (S10). La pregunta detrás de las 10 sesiones fue una sola: \emph{¿cómo se usa la IA como escritor asistente sin perder la autoría editorial?}.

  pregunta_marco: |-
    ¿Qué cruza la firma de don Hernando al pie de la gaceta barrial con tu firma como editor de un libro hecho con asistencia de ChatGPT o Claude?

aprendizajes:
  - sesion: 1
    titulo: "El oficio del editor: qué hace y qué no hace"
  - sesion: 2
    titulo: "Concebir el libro: género, tema, audiencia, escaleta"
  - sesion: 3
    titulo: "Prompting profesional: las 5 partes del prompt"
  - sesion: 4
    titulo: "Iteración V1→V2→V3 con intervención humana mínima de 20-30%"
  - sesion: 5
    titulo: "Estructura editorial: arco de 3 actos, capítulos pivote"
  - sesion: 6
    titulo: "Derechos de autor con IA: Ley 23 de 1982, Creative Commons"
  - sesion: 7
    titulo: "Portada con IA generativa: prompt visual, descriptores"
  - sesion: 8
    titulo: "Diagramación: Canva, Google Docs, LibreOffice"
  - sesion: 9
    titulo: "Producción final: PDF 80 páginas + carta del editor"
  - sesion: 10
    titulo: "Sustentación pública del libro y feria editorial"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un compañero de grado 9° lo más importante que aprendiste usando IA para hacer un libro, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos), cada una en su propia oración corta. Evita frases hechas como ``la IA es el futuro'': se específico con vocabulario del periodo (editor, prompt, V3, autoría, etc.).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo (rol del editor, las 5 partes del prompt, iteración V3, Canvas editorial, derechos morales, etc.). (3) que se note \textbf{voz propia} de alguien que efectivamente firmó un libro, no resumen de manual.
    retroalimentacion: |-
      Una buena respuesta cruza método con experiencia: ``aprendí que (1) la IA es escritor asistente, no autor; el editor firma. (2) un prompt sin las 5 partes (rol, contexto, tarea, formato, restricciones) produce texto genérico inservible. (3) sin V3 con intervención humana de 20-30% mínimo, el libro deja de ser tuyo.''
    puntos: 1.0

  contexto:
    enunciado: |-
      Don Hernando, editor de la gaceta barrial de Cartago, no escribía todas las notas pero firmaba todas. Su firma significaba ``yo respondo por esta pieza''.

      Responde en 5-7 renglones: \textbf{¿qué del oficio de don Hernando cruza con tu rol como editor responsable de un libro hecho con IA, y qué riesgo aparece cuando alguien usa IA sin asumir esa misma responsabilidad de firma?} Da al menos un ejemplo concreto de cada lado, idealmente de tu propio libro.
    criterio: |-
      Se evalúa: (1) que se identifique al menos una \textbf{práctica concreta} de don Hernando (elegir, corregir, ordenar, firmar). (2) que se nombre un riesgo real al usar IA sin firma editorial (publicar texto sin verificar, perder autoría, publicar errores fácticos, dejar que la IA quede como ``coautora''). (3) idealmente con ejemplo del propio libro del estudiante.
    retroalimentacion: |-
      Una buena respuesta admite el riesgo: ``Don Hernando elegía cada nota antes de publicar. En mi libro hice lo mismo: la IA me dio un capítulo 4 que tenía un dato falso (afirmaba que Cartago fue fundada en 1530, en realidad fue 1540). Si no hubiera verificado y firmado, ese error habría circulado con mi nombre. La firma editorial es eso: responder por cada palabra publicada.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Tu compañera Valentina escribió su primer libro de 80 páginas sobre música caleña. Su flujo fue: \textbf{generó capítulos completos con ChatGPT en una sola sesión de prompting; los pegó tal cual en el documento final; agregó una portada generada con Bing Image Creator; firmó como autora; publicó en Issuu sin cambios manuales}.

        Aplicando lo aprendido este periodo, ¿cuál es la observación MÁS importante sobre el proceso de Valentina?
      contexto: |-
        Recuerda: la regla profesional es V3 con al menos 20-30% de intervención humana directa. Sin esa firma, el libro deja de ser legítimamente del editor.
      tipo: opcion_multiple
      opciones:
        - "Está bien, ChatGPT acelera la producción y el resultado es válido."
        - "El problema es que usó Issuu en lugar de Canva."
        - "El problema es que Bing Image Creator no genera imágenes profesionales."
        - "Le falta el paso V3 con intervención humana mínima; sin él, la autoría editorial es cuestionable."
      respuesta_index: 3
      criterio: |-
        La opción D es correcta. El flujo descrito carece de V3 (intervención humana 20-30%). Eso vuelve la autoría editorial cuestionable según la regla del periodo. A es la trampa común. C y D son aspectos secundarios que no tocan el problema central de autoría.
      retroalimentacion: |-
        El núcleo del oficio editorial es V3: sin intervención humana directa de al menos 20-30%, el libro deja de ser legítimamente del editor. La velocidad de la IA no exime de esa responsabilidad.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Estás escribiendo el capítulo 6 de tu libro. La IA te entregó un primer borrador de 4 páginas. El borrador tiene buena estructura general pero (a) abre con un cliché (``En esta era acelerada en la que vivimos''), (b) tiene un dato dudoso sin fuente, (c) usa un tono académico pesado que no calza con la audiencia juvenil que definiste en la sesión 2.

        \textbf{Diseña en 5-7 renglones tu pasada V2 (revisión editorial)}: escribe el prompt exacto que le darías a la IA para refinar el borrador. Aplica las 5 partes del prompt profesional (rol + contexto + tarea + formato + restricciones). Cierra explicando \textbf{qué pasarías después a V3 (a mano)}.
      criterio: |-
        Se evalúa: (1) el prompt usa las 5 partes nombradas o claramente identificables. (2) las 3 mejoras pedidas (apertura sin cliché, verificar dato, tono juvenil) aparecen como restricciones específicas. (3) el cierre sobre V3 muestra criterio: nombra qué fragmentos reescribirá a mano para sumar voz propia.
      retroalimentacion: |-
        Una buena respuesta: ``Rol: editor de literatura juvenil. Contexto: libro de 80 págs sobre música caleña para bachillerato. Tarea: refina el cap 6 borrador V1. Formato: 4 páginas en prosa, subtítulos cada 2 págs. Restricciones: elimina la apertura con cliché, verifica o quita el dato dudoso, baja el tono académico al cercano que usé en otros caps. Para V3, reescribiré a mano la mitad del capítulo agregando 2 anécdotas personales mías sobre tomarme un sancocho oyendo Niche en familia.''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto del oficio editorial con IA que aprendiste. \textbf{Las 3 lentes deben aparecer explícitamente}.

      Cierra el texto con una sola frase de compromiso: \emph{``Para el periodo 2, me comprometo a...''}
    voces:
      dussel: |-
        ``Un libro hecho con IA puede dignificar al sujeto retratado o reproducir el cliché del centro hegemónico. El editor decide a quién su libro deja por fuera.''
      estoico: |-
        ``Firmar es comprometerse. La IA acelera pero no asume responsabilidad: el editor humano firma porque acepta responder por cada palabra publicada.''
      floridi: |-
        ``En la infoesfera, cada libro hecho con IA entra a la conversación común. Su calidad ética no es la velocidad de producción: es la honestidad sobre cómo se hizo.''
    criterio: |-
      Se evalúa: (1) las 3 lentes aparecen y se aplican a aspectos distintos del oficio editorial. (2) el estudiante identifica una tensión real (velocidad vs. responsabilidad, IA como herramienta vs. IA como coautora). (3) el compromiso final es específico.
    retroalimentacion: |-
      Una buena respuesta: ``Mi libro habla de música caleña: Dussel me pregunta si centra al sur o si lo cosifica. Lo estoico me recuerda que firmar implica responder por cada dato (verificar fuentes incluso si la IA los da con confianza). Floridi me pide declarar honestamente que usé IA en cada cap, no esconderlo. Para el periodo 2 me comprometo a aplicar la misma disciplina V3 a mis informes técnicos profesionales.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 1 con un libro firmado. Lo que llevas no es la pieza: es el método. El periodo 2 (Informes técnicos profesionales con IA) te pedirá aplicar la misma disciplina editorial a textos más severos. La firma sigue siendo tuya.

# ─── BANCO DE PRÁCTICA · 22 preguntas ──────────────────────────────
banco_practica:
  - id: "bp-001"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la diferencia clave entre AUTOR y EDITOR en el periodo?
    opciones:
      - "Son lo mismo"
      - "El autor escribe; el editor decide qué entra y firma como responsable"
      - "El editor escribe más rápido"
      - "El autor es siempre humano y el editor siempre es la IA"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. El autor escribe, el editor decide y firma. En este periodo asumiste el rol de editor; la IA fue tu escritor asistente.
    feedback_incorrecto: |-
      Autor escribe; editor decide y firma. La IA puede ser autor asistente, pero la responsabilidad editorial es humana.

  - id: "bp-002"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos enunciados de "audiencia" es el MÁS profesional para concebir un libro?
    opciones:
      - "Jóvenes en general"
      - "Personas con celular"
      - "Estudiantes de 14-16 años del Valle del Cauca que ya juegan videojuegos pero no programan"
      - "Todo el mundo"
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Audiencia profesional incluye edad concreta, contexto cultural y nivel previo. Sin eso, el tono y los ejemplos quedan ciegos.
    feedback_incorrecto: |-
      Audiencia precisa: edad + contexto + nivel previo. "Jóvenes" o "todo el mundo" son demasiado vagos para guiar las decisiones del libro.

  - id: "bp-003"
    bloom: recordar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuáles son las 5 partes obligatorias de un prompt profesional?
    opciones:
      - "Rol, contexto, tarea, formato, restricciones"
      - "Saludo, agradecimiento, pregunta, despedida, firma"
      - "Solo la tarea"
      - "Solo el saludo"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Rol + contexto + tarea + formato + restricciones. Las 5 partes hacen la diferencia entre texto genérico y útil.
    feedback_incorrecto: |-
      Las 5 partes son rol, contexto, tarea, formato y restricciones. Sin ellas, la IA produce texto genérico sin valor.

  - id: "bp-004"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué porcentaje mínimo de intervención humana directa exige V3?
    opciones:
      - "0% (la IA lo hace todo)"
      - "100%"
      - "5%"
      - "20-30%"
    respuesta_index: 3
    feedback_correcto: |-
      Exacto. 20-30% mínimo es la regla irrenunciable. Sin esa firma, V3 deja de ser tuyo.
    feedback_incorrecto: |-
      Mínimo 20-30%. Es lo que distingue tu libro de uno generado 100% por IA y firmado en falso.

  - id: "bp-005"
    bloom: comprender
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué porcentaje del libro ocupa el Acto 2 (Desarrollo) en la estructura editorial clásica?
    opciones:
      - "10%"
      - "25%"
      - "50%"
      - "90%"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. El Acto 2 ocupa el 50% del libro. Es la zona más larga y de mayor responsabilidad narrativa.
    feedback_incorrecto: |-
      El Acto 2 es el 50% del libro. Planteamiento (Acto 1) y cierre (Acto 3) ocupan 25% cada uno.

  - id: "bp-006"
    bloom: analizar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué ley colombiana regula los derechos de autor de tu libro?
    opciones:
      - "Ley 23 de 1982"
      - "Ley 100 de 1993"
      - "Ley 30 de 1992"
      - "No hay ley aplicable"
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. Ley 23 de 1982, complementada por la Decisión Andina 351/1993. Es marco principal de derechos de autor en Colombia.
    feedback_incorrecto: |-
      Ley 23 de 1982. Es el marco de derechos de autor en Colombia que distingue derechos morales (intransferibles) de patrimoniales (negociables).

  - id: "bp-007"
    bloom: evaluar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿La IA generativa puede ser titular de derechos de autor sobre el libro?
    opciones:
      - "Sí, porque escribió la mayoría del texto"
      - "No, el modelo no tiene personalidad jurídica; la autoría es del editor humano que firma y declara el uso de IA"
      - "Sí, junto contigo como coautora"
      - "Depende del país"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La IA no tiene personalidad jurídica. Con intervención editorial sustancial y declaración honesta, la obra es del editor humano.
    feedback_incorrecto: |-
      La IA no tiene personalidad jurídica. La autoría es del editor humano cuando hay intervención sustancial y declaración honesta de uso.

  - id: "bp-008"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas herramientas es gratuita y permite generar portadas con IA?
    opciones:
      - "Solo Photoshop pago"
      - "Solo Midjourney pago"
      - "Solo Photoshop pago"
      - "Bing Image Creator (DALL-E 3 gratis con cuenta Microsoft)"
    respuesta_index: 3
    feedback_correcto: |-
      Exacto. Bing Image Creator es gratis con cuenta Microsoft. Usa DALL-E 3. También Leonardo.ai (150 imágenes/día gratis).
    feedback_incorrecto: |-
      Bing Image Creator es gratuita y usa DALL-E 3. Otras opciones gratis: Leonardo.ai, Adobe Express, Microsoft Designer, Ideogram.

  - id: "bp-009"
    bloom: analizar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Un prompt visual para IA generativa debe priorizar...
    opciones:
      - "Instrucciones narrativas largas tipo cuento"
      - "Gramática impecable"
      - "Descriptores visuales (estilo, paleta, atmósfera, composición)"
      - "Una historia personal del autor"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. El prompt visual gira en torno a descriptores: cinematic, watercolor, minimalist, paleta, atmósfera, composición.
    feedback_incorrecto: |-
      Descriptores visuales (estilo, paleta, atmósfera, composición). Términos narrativos largos confunden al modelo de imagen.

  - id: "bp-010"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Tu libro es 80% texto y 20% imágenes. ¿Cuál herramienta gratuita es la más razonable para diagramarlo?
    opciones:
      - "Google Docs (con estilos, tabla de contenido automática y exportación a PDF)"
      - "Solo Canva"
      - "WhatsApp"
      - "Una calculadora"
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. Google Docs es ideal para libros mayormente de texto: estilos, TOC automática, colaboración. Canva es mejor para libros muy visuales.
    feedback_incorrecto: |-
      Google Docs para libros mayormente de texto. Canva si tu libro tiene fuerte componente visual (manuales, ilustrados, fanzines).

  - id: "bp-011"
    bloom: evaluar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué elemento NUEVO del libro distingue al editor profesional contemporáneo del autor pre-IA?
    opciones:
      - "La portada"
      - "El número de páginas"
      - "La bibliografía"
      - "La carta del editor firmada que declara el proceso y el uso de IA"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. La carta del editor firmada (transparencia editorial). Es la pieza nueva que define el estándar profesional contemporáneo.
    feedback_incorrecto: |-
      La carta del editor firmada. Declara el proceso, el uso de IA y el porcentaje editado a mano. Es transparencia editorial.

  - id: "bp-012"
    bloom: crear
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Durante tu sustentación pública del libro, ¿qué prueba MEJOR que tu autoría es legítima?
    opciones:
      - "Mostrar el PDF terminado"
      - "Leer en voz alta un fragmento de tu libro y que suene a ti, no a un chatbot"
      - "Tener muchas páginas"
      - "Decir que la IA no ayudó"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. La lectura en voz alta es la prueba de fuego: revela si el texto tiene voz humana o quedó genérico.
    feedback_incorrecto: |-
      La lectura en voz alta. Si suena a ti, V3 funcionó; si suena a manual, hubo poco trabajo editorial.

  - id: "bp-013"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el oficio ancestral que conecta con el rol del editor en este periodo?
    opciones:
      - "El cartero del barrio"
      - "Don Hernando Castaño, editor de la gaceta barrial de Cartago"
      - "El conductor del bus escolar"
      - "El sastre del centro"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Don Hernando elegía, corregía y firmaba cada gaceta. Era editor responsable antes de la era digital.
    feedback_incorrecto: |-
      Don Hernando, editor de la gaceta barrial. Firmaba cada edición como responsable de las notas que entraban y las que no.

  - id: "bp-014"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es una "escaleta" en concepción editorial?
    opciones:
      - "Lista preliminar de capítulos con tema y peso aproximado, antes de escribir"
      - "Una escalera literaria"
      - "El primer capítulo del libro"
      - "El índice final del libro"
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. Escaleta = mapa de capítulos antes de escribir. Sin escaleta, el libro se construye al azar.
    feedback_incorrecto: |-
      Escaleta es el mapa de capítulos previo. "El libro empieza a escribirse en la escaleta, no en el capítulo 1."

  - id: "bp-015"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      "Escríbeme algo sobre la amistad" es un prompt:
    opciones:
      - "Profesional, está completo"
      - "Excelente, corto y al grano"
      - "Vago: le falta rol, contexto, tarea precisa, formato y restricciones"
      - "Imposible de responder"
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Garbage in, garbage out: ese prompt vago produce texto vago. Faltan las 5 partes.
    feedback_incorrecto: |-
      Faltan las 5 partes. Sin rol, contexto, tarea precisa, formato y restricciones, la IA produce texto genérico inservible.

  - id: "bp-016"
    bloom: analizar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué hace una iteración V2 sobre el borrador V1 generado por IA?
    opciones:
      - "Repetir el mismo prompt"
      - "Borrar V1 y empezar otro"
      - "Aceptar V1 sin cambios"
      - "Pedirle a la IA mejoras específicas (apertura, clichés, tono, longitud)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. V2 = mejoras específicas pedidas con instrucciones puntuales. V3 = reescritura humana directa para incrustar voz propia.
    feedback_incorrecto: |-
      V2 pide mejoras específicas. "Mejora la apertura, reduce clichés del párrafo 3, ajusta tono." Instrucciones puntuales, no reescritura completa.

  - id: "bp-017"
    bloom: comprender
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuáles son los "capítulos pivote" de un libro?
    opciones:
      - "Cualquier capítulo central"
      - "El primero (engancha), el de la mitad (sostiene) y el último (cierra)"
      - "Solo el primero"
      - "Los capítulos pares"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. 3 pivotes: primero, mitad, último. Reescribirlos más veces que los demás. Si esos 3 funcionan, el libro funciona.
    feedback_incorrecto: |-
      Pivotes: primero, mitad, último. Son los 3 que merecen más reescritura porque definen si el lector sigue o abandona.

  - id: "bp-018"
    bloom: evaluar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué licencia permite que otros usen tu libro citándote, sin fines comerciales?
    opciones:
      - "Todos los derechos reservados (no permite compartir)"
      - "Patente internacional"
      - "Creative Commons BY-NC (atribución, no comercial)"
      - "Ninguna licencia es necesaria"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. CC BY-NC permite uso citando autor y sin fines comerciales. Es alternativa práctica a "todos los derechos reservados".
    feedback_incorrecto: |-
      Creative Commons BY-NC. Permite que otros usen tu obra citándote y sin fines comerciales.

  - id: "bp-019"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuántos principios fundamentales de maquetación cubren el 80% del oficio?
    opciones:
      - "4 (tipografía coherente, jerarquía visual, espacios respirables, numeración automática)"
      - "1"
      - "20"
      - "100"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. 4 principios cubren el 80% del oficio. Aplicarlos da apariencia profesional con cualquier herramienta.
    feedback_incorrecto: |-
      Son 4 principios: tipografía coherente, jerarquía visual, espacios respirables, numeración automática.

  - id: "bp-020"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos componentes NO debe faltar en el PDF final del libro?
    opciones:
      - "Música de fondo"
      - "Solo capítulos"
      - "Solo la portada"
      - "Portada + créditos + tabla de contenido + capítulos + carta del editor"
    respuesta_index: 3
    feedback_correcto: |-
      Exacto. Los 5 componentes obligatorios. La carta del editor es lo nuevo: declara honestamente el uso de IA.
    feedback_incorrecto: |-
      Portada + créditos + TOC + capítulos + carta del editor firmada. Los 5 componentes definen un libro profesional con IA.

  - id: "bp-021"
    bloom: crear
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Tu libro de 80 páginas tendrá cuántos capítulos típicamente?
    opciones:
      - "1 capítulo gigante"
      - "100 capítulos pequeños"
      - "Exactamente 30"
      - "8-12 capítulos con peso asignado según su función"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. 8-12 capítulos. Cada uno con función específica (planteamiento, desarrollo, cierre).
    feedback_incorrecto: |-
      8-12 capítulos. Más fragmenta sin razón; menos hace capítulos demasiado largos para mantener atención.

  - id: "bp-022"
    bloom: evaluar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Un compañero te pasa un prompt sin "Restricciones" (la 5ª parte). ¿Qué problema típico aparecerá en la respuesta de la IA?
    opciones:
      - "La IA no responderá nada"
      - "La IA caerá en clichés, frases hechas o tono inadecuado sin que nadie se lo prohíba"
      - "La IA cobrará dinero"
      - "El prompt está bien sin restricciones"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Sin restricciones, la IA cae en clichés y frases hechas. Las restricciones son la quinta parte que filtra lo que NO debe pasar.
    feedback_incorrecto: |-
      Sin restricciones, aparecen clichés y frases hechas. Las restricciones evitan que la IA caiga en el promedio insulso.

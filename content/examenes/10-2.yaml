clave: "10-2"
grado: 10
periodo: 2
completo: true

titulo: "Examen final · Informes técnicos profesionales con IA"
titulo_portada: |-
  Examen final ---
  Informes técnicos
  profesionales con IA

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen: tu firma como autor depende de eso.

apertura:
  saber_ancestral: |-
    En el centro histórico de Cartago, en la calle de la galería, hubo durante décadas \textbf{escribientes públicos}: hombres y mujeres mayores que se sentaban con una máquina de escribir en un kiosco pequeño y, por una propina modesta, tomaban dictado de los vecinos que necesitaban escribir una carta a la alcaldía, un derecho de petición, una constancia laboral o una solicitud al colegio. El escribiente tenía un oficio severo: \textbf{convertir la palabra hablada del cliente en un texto formal apto para ser leído por una autoridad que no lo conocía}. Su disciplina era inconfundible: \emph{ni más palabras de las necesarias, ni menos}. Si el cliente decía ``ese hombre me robó la finca de mi finado padre'', el escribiente escribía: \emph{``Solicito a su despacho intervenir en el caso de la finca registrada en folio X-X, en disputa con el señor Y, según los hechos siguientes''}. Esa traducción de habla cotidiana a \textbf{texto profesional dirigido a destinatario específico} es el oficio ancestral del informe técnico. La estructura, el tono, la precisión: todo viene del escribiente, no de Word ni de ChatGPT.

  contexto: |-
    Este examen cierra el periodo 2 de grado 10°, donde aprendiste a producir \textbf{informes técnicos profesionales con asistencia de IA pero firma humana}. Aprendiste a distinguir 4 tipos de texto profesional (S1), la estructura del informe técnico (S2), Google Docs profesional (S3), Markdown como formato portable (S4), encuestas con phronesis y filtro de IA (S5), análisis cualitativo auditado (S6), informe comercial (S7), correo profesional con IA (S8), mini-proyecto integrador (S9) y sustentación (S10).

  pregunta_marco: |-
    ¿Qué cruza el oficio del escribiente público de Cartago con tu informe técnico hecho con IA como asistente?

aprendizajes:
  - sesion: 1
    titulo: "4 tipos de texto profesional: informe, comercial, técnico-comercial, estudio de mercado"
  - sesion: 2
    titulo: "Estructura del informe técnico: introducción, desarrollo, conclusiones"
  - sesion: 3
    titulo: "Google Docs profesional: estilos, TOC automática, citas APA, pie de figura"
  - sesion: 4
    titulo: "Markdown: formato portable que se convierte a PDF, HTML, libro"
  - sesion: 5
    titulo: "Encuestas con phronesis: Google Forms + filtro de IA contra sesgos"
  - sesion: 6
    titulo: "Análisis cualitativo con IA + auditoría humana"
  - sesion: 7
    titulo: "Informe comercial: persuasión con audiencia real y CTA claro"
  - sesion: 8
    titulo: "Correo profesional con IA como asistente, no reemplazo"
  - sesion: 9
    titulo: "Mini-proyecto: informe técnico con datos reales + IA documentada"
  - sesion: 10
    titulo: "Sustentación del periodo: defensa del oficio"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un profesional adulto que aún escribe informes con plantillas de Word de los años 2000 lo más importante que aprendiste este periodo, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos). Evita frases hechas como ``aprender a usar IA'': se específico con vocabulario del periodo (tipo de texto, estructura, audiencia, criterio, filtro IA, etc.).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo (tipo de texto, estructura del informe, citas APA, encuesta con phronesis, IA como asistente, etc.). (3) que se note \textbf{voz propia} y no copia de manual.
    retroalimentacion: |-
      Una buena respuesta: ``aprendí que (1) cada tipo de texto profesional tiene su tono y su destinatario: mezclarlos pierde la audiencia. (2) la estructura del informe (intro + desarrollo + conclusiones) no es decorativa, es funcional. (3) la IA puede ayudar a redactar, pero debe pasar por el filtro humano contra sesgos y clichés antes de firmar.''
    puntos: 1.0

  contexto:
    enunciado: |-
      El escribiente público de Cartago traducía el habla cotidiana del cliente en texto formal dirigido a un destinatario específico (alcaldía, colegio, juzgado). Su disciplina: ni más palabras ni menos, tono adecuado a la autoridad.

      Responde en 5-7 renglones: \textbf{¿qué del oficio del escribiente cruza con la disciplina del informe técnico que aprendiste, y qué se pierde cuando alguien usa IA para escribir informes sin esa misma disciplina de destinatario y precisión?} Da al menos un ejemplo concreto.
    criterio: |-
      Se evalúa: (1) que se identifique al menos una \textbf{práctica concreta} del escribiente (traducir habla a texto formal, ajustar tono a la autoridad destinataria, economía de palabras). (2) que se nombre un riesgo real cuando se salta esa disciplina (texto inflado, tono inadecuado, destinatario equivocado). (3) que se note reflexión propia.
    retroalimentacion: |-
      Una buena respuesta admite la tensión: ``El escribiente sabía que el alcalde lee 50 cartas por día y rechaza las que le hacen perder tiempo. La IA tiende a inflar texto con relleno (`en este sentido', `cabe resaltar', `es importante mencionar'). Sin un filtro humano que recorte como el escribiente, el informe técnico se convierte en muralla de palabras que el destinatario abandona en la segunda página.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Tu compañero Sebastián escribió un informe técnico sobre el ruido del recreo del colegio. \textbf{Lo dirigió a la rectoría}. El informe (a) abre con un párrafo personal sobre por qué le importa el tema, (b) tiene 8 páginas de revisión bibliográfica sobre acústica industrial, (c) presenta 12 mediciones de decibeles tomadas en 3 lugares del colegio, (d) cierra con la pregunta abierta ``¿qué harán al respecto?''.

        Aplicando lo aprendido este periodo, ¿cuál es la observación MÁS importante sobre el informe de Sebastián?
      contexto: |-
        Recuerda: el informe técnico tiene 3 secciones (intro + desarrollo + conclusiones con recomendaciones accionables) y se ajusta a su destinatario.
      tipo: opcion_multiple
      opciones:
        - "Tiene problemas de estructura y tono: la intro debe ser técnica (objetivo + alcance), la revisión de acústica industrial sobra para una rectoría, y las conclusiones deben proponer acciones concretas, no preguntas abiertas."
        - "Está bien, tiene datos y referencias."
        - "El problema es que solo hizo 12 mediciones."
        - "Debería haber usado Markdown en lugar de Word."
      respuesta_index: 0
      criterio: |-
        La opción A es la correcta. (1) La intro técnica abre con objetivo + alcance, no opinión personal. (2) Revisión bibliográfica académica es desproporcionada para destinatario rectoría. (3) Las conclusiones de informe técnico llevan recomendaciones accionables, no preguntas. A es la trampa común. C y D son aspectos menores.
      retroalimentacion: |-
        El informe técnico se ajusta al destinatario. Para la rectoría: intro técnica, desarrollo enfocado en lo del colegio, conclusiones con propuestas concretas (qué, quién, plazo, recursos).
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Aplicarás una encuesta a 30 estudiantes para saber qué tan satisfechos están con la biblioteca del colegio. Le pediste a ChatGPT que te genere 5 preguntas y te devolvió esto:

        \begin{enumerate}
          \item ¿No crees que la biblioteca debería estar abierta más horas?
          \item ¿Qué tan buenos y útiles te parecen los libros y los recursos digitales?
          \item ¿Estás muy satisfecho o súper satisfecho con la atención?
          \item ¿Cuántas veces vas a la biblioteca?
          \item ¿Te parece importante leer?
        \end{enumerate}

        \textbf{En 6-8 renglones, aplica el filtro de IA del periodo}: identifica al menos 3 problemas en estas preguntas (sesgada, doble cabeza, capciosa, ambigua) y reescribe 2 de ellas correctamente. Cierra con \textbf{qué pasarías por filtro humano antes de aplicar la encuesta}.
      criterio: |-
        Se evalúa: (1) detección correcta de al menos 3 problemas: P1 sesgada (induce sí), P2 doble cabeza (calidad y utilidad), P3 capciosa/falsa neutralidad, P5 trivialmente sí. (2) reescritura de 2 con vocabulario neutro y respuesta cerrada. (3) cierre que muestra criterio: pasar por compañero, contrastar con destinatario, etc.
      retroalimentacion: |-
        Una buena respuesta: ``P1 sesgada (induce sí), P2 doble cabeza, P3 capciosa (ambas opciones positivas). Reescritura P1: '¿Cómo evalúas el horario actual de la biblioteca de 7am a 4pm: insuficiente / adecuado / excesivo?'. Reescritura P3: 'En una escala 1-5, ¿qué tan satisfecho estás con la atención del personal?'. Filtro humano: pasar las 5 preguntas a 2 compañeros antes de aplicar, verificar que el destinatario (bibliotecaria) entienda los resultados.''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto del oficio de escribir informes profesionales con IA. \textbf{Las 3 lentes deben aparecer explícitamente}.

      Cierra el texto con una sola frase de compromiso: \emph{``Para el periodo 3, me comprometo a...''}
    voces:
      dussel: |-
        ``Un informe profesional dignifica o cosifica al sujeto que retrata. El autor decide a quién su texto deja por fuera y a quién dignifica con su precisión."
      estoico: |-
        ``Ni una palabra de más, ni una de menos. El escribiente disciplinado entiende que cada palabra suma o quita poder a la pieza."
      floridi: |-
        ``Cada informe que se publica entra a la conversación informacional de la sociedad. Su honestidad es responsabilidad ética del autor."
    criterio: |-
      Se evalúa: (1) las 3 lentes se aplican a aspectos distintos. (2) el estudiante identifica una tensión real (precisión vs. velocidad, IA como herramienta vs. IA como sustituto, dignidad del destinatario vs. eficiencia de redacción). (3) el compromiso final es específico.
    retroalimentacion: |-
      Una buena respuesta: ``Mi informe técnico habla de los hábitos de lectura de estudiantes (Floridi: información que entra a la conversación). Lente del nosotros me pide preguntar a quién dejé fuera: a los estudiantes con discapacidad visual que no usan la biblioteca física. Lo estoico me dice que mi tendencia a inflar texto cuando uso IA traiciona al destinatario. Para el periodo 3 me comprometo a aplicar el mismo rigor a mis hojas de cálculo y mi plan de microemprendimiento.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 2 con el oficio del escribiente actualizado a la era de la IA. El periodo 3 (Ofimática + contabilidad + emprendimiento) te pedirá llevar esa misma precisión a los números, las hojas de cálculo y los planes de negocio. La palabra empeñada sigue siendo tuya.

# ─── BANCO DE PRÁCTICA · 22 preguntas ──────────────────────────────
banco_practica:
  - id: "bp-001"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la diferencia principal entre informe técnico e informe comercial?
    opciones:
      - "No hay diferencia"
      - "El comercial es más largo"
      - "El técnico solo tiene números"
      - "Técnico informa para decisión técnica (tono neutro); comercial persuade para decisión de compra/aprobación (tono cálido, CTA)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Propósito + audiencia + tono distinguen los tipos. Mezclarlos pierde audiencia.
    feedback_incorrecto: |-
      Técnico informa (tono neutro, datos verificables); comercial persuade (tono cálido, CTA). Cada uno tiene su audiencia y su estructura.

  - id: "bp-002"
    bloom: recordar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuáles son las 3 secciones obligatorias de un informe técnico?
    opciones:
      - "Introducción, desarrollo, conclusiones"
      - "Saludo, cuerpo, despedida"
      - "Solo conclusiones"
      - "Resumen, contenido, bibliografía"
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. Introducción (contexto + objetivo + alcance), desarrollo (metodología + datos + análisis), conclusiones (hallazgos + recomendaciones accionables).
    feedback_incorrecto: |-
      Las 3 secciones son introducción + desarrollo + conclusiones. Cada una tiene función específica que no se debe mezclar.

  - id: "bp-003"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas herramientas de Google Docs distingue a un documento profesional de una tarea escolar?
    opciones:
      - "Cambiar el color del texto"
      - "Agregar muchas imágenes"
      - "Usar estilos de título consistentemente para generar tabla de contenido automática"
      - "Subrayar palabras importantes"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Estilos + TOC automática es el primer paso. Sin estilos, no hay índice navegable ni estructura visible.
    feedback_incorrecto: |-
      Estilos de título consistentes generan TOC automática. Es la diferencia entre documento profesional y tarea escolar.

  - id: "bp-004"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Tu informe lleva 8 citas en formato APA. ¿Cómo las gestionas en Google Docs?
    opciones:
      - "Las escribo a mano una por una"
      - "Uso Herramientas → Citas para insertarlas y generar bibliografía automática"
      - "No cito porque es informal"
      - "Pongo solo el nombre del autor sin más"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Herramientas → Citas en Google Docs gestiona APA, MLA, Chicago. Automatiza el formato y evita errores.
    feedback_incorrecto: |-
      Herramientas → Citas en Docs. Soporta APA, MLA, Chicago. Genera bibliografía automática al final.

  - id: "bp-005"
    bloom: comprender
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la mayor ventaja de Markdown sobre Word?
    opciones:
      - "Es más bonito"
      - "Tiene más colores"
      - "Es más rápido de escribir"
      - "Portabilidad: el mismo .md se convierte a PDF, HTML, libro, presentación"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Portabilidad. Un solo archivo soporta múltiples salidas sin reescribir.
    feedback_incorrecto: |-
      Portabilidad. Es la propiedad clave. Word te ata a una salida; Markdown te abre PDF, HTML, libro, slides, todo desde el mismo archivo.

  - id: "bp-006"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cómo se hace negrita en Markdown?
    opciones:
      - "$$texto$$"
      - "<b>texto</b>"
      - "**texto**"
      - "&&texto&&"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Dos asteriscos a cada lado. Cursiva con un solo asterisco *texto*.
    feedback_incorrecto: |-
      **texto** para negrita. *texto* para cursiva. # para H1, ## para H2.

  - id: "bp-007"
    bloom: evaluar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué problema tiene la pregunta "¿No crees que la biblioteca debería abrir más horas?"?
    opciones:
      - "Ninguno"
      - "Es sesgada: induce respuesta afirmativa al usar 'no crees'"
      - "Es muy larga"
      - "No tiene signo de pregunta"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Sesgada. Una pregunta neutra dice "¿Cómo evalúas el horario actual de la biblioteca?".
    feedback_incorrecto: |-
      Es sesgada: "no crees que..." induce el sí. Pregunta neutra: "¿Cómo evalúas el horario actual?".

  - id: "bp-008"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Antes de aplicar tu encuesta de 10 preguntas, ¿qué haces?
    opciones:
      - "Le pido a la IA que la audite contra sesgos, ambigüedades, doble cabeza y supuestos; pruebo con 2 compañeros"
      - "La aplico directamente"
      - "Solo se la muestro a mi mamá"
      - "La publico en redes"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Filtro de IA + prueba con compañeros antes de aplicar. La IA detecta 5 problemas comunes; los humanos validan que el destinatario entiende.
    feedback_incorrecto: |-
      Filtro IA + prueba humana. Ese paso ahorra rehacer la encuesta cuando descubres después que las preguntas no daban respuestas útiles.

  - id: "bp-009"
    bloom: analizar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      La IA te clasifica respuestas abiertas en categorías. ¿En qué falla típicamente?
    opciones:
      - "En todo"
      - "En contar palabras"
      - "En detectar sarcasmo, modismos locales colombianos y contexto cultural específico"
      - "En traducir al inglés"
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Sarcasmo y modismos son límites conocidos. El editor humano audita y reclasifica esos casos.
    feedback_incorrecto: |-
      Sarcasmo + modismos locales + contexto cultural. La IA propone categorías; el humano audita y reclasifica los casos problemáticos.

  - id: "bp-010"
    bloom: evaluar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cómo termina un informe COMERCIAL?
    opciones:
      - "Con un poema"
      - "Con un pedido claro (CTA): 'Solicito decisión sobre X' o 'Apruebe Y'"
      - "Con varios anexos"
      - "Sin terminar"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. CTA explícita. "Informe comercial sin pedido es informe perdido."
    feedback_incorrecto: |-
      Con pedido claro. Sin CTA, el informe comercial pierde su propósito persuasivo.

  - id: "bp-011"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Tu informe comercial propone instalar bebederos en el colegio. ¿Qué sección NO debe faltar?
    opciones:
      - "Resumen ejecutivo de 1 página + cuerpo argumentativo + recomendaciones accionables con responsable, plazo y recursos"
      - "Solo el saludo"
      - "Solo el problema"
      - "Solo conclusiones"
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. Los 4 componentes obligatorios. La recomendación accionable identifica qué, quién, plazo y recursos.
    feedback_incorrecto: |-
      Resumen ejecutivo + cuerpo + recomendaciones accionables. Cada sección con función propia.

  - id: "bp-012"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Tu correo profesional para la rectora supera 250 palabras. ¿Qué haces?
    opciones:
      - "Lo envío así, mejor más detalle"
      - "Agrego más párrafos"
      - "Cambio el destinatario"
      - "Reviso si todo es necesario: 200 palabras es el límite razonable; si pasa, sospecho que hay relleno"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. La regla de las 200 palabras es señal: si pasa, hay que recortar. El destinatario apurado agradece la síntesis.
    feedback_incorrecto: |-
      Revisar y recortar. 200 palabras es señal: más exige justificación. La rectora lee 50 correos por día.

  - id: "bp-013"
    bloom: comprender
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el rol correcto de la IA al redactar un correo profesional?
    opciones:
      - "Reemplazar al estudiante: pegar lo que diga ChatGPT"
      - "Asistente que da borrador inicial; el humano ajusta tono, matices culturales y firma"
      - "No tiene rol"
      - "Solo traducir"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. IA como asistente, humano como editor + firmante. La IA acelera; el humano sostiene criterio.
    feedback_incorrecto: |-
      Asistente, no reemplazo. Borrador IA + edición humana + firma humana. La responsabilidad no se delega.

  - id: "bp-014"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu mini-proyecto integrador tiene 6 componentes obligatorios. ¿Cuál es el NUEVO respecto a un informe escolar tradicional?
    opciones:
      - "La declaración honesta de uso de IA con bitácora detallada"
      - "La portada"
      - "El índice"
      - "La bibliografía"
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. La declaración de IA es la pieza nueva del estándar profesional contemporáneo.
    feedback_incorrecto: |-
      La declaración honesta de IA. Pieza nueva que define el estándar profesional de transparencia.

  - id: "bp-015"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Durante tu sustentación de 5 minutos, ¿qué demuestra MEJOR que dominas tu proyecto?
    opciones:
      - "Una presentación con muchos efectos visuales"
      - "Hablar muy rápido para caber en 5 min"
      - "Leer un papel"
      - "Responder con honestidad a las preguntas duras (reconocer lo no resuelto sin inventar)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Honestidad ante preguntas duras revela dominio. Inventar respuestas erosiona credibilidad.
    feedback_incorrecto: |-
      Responder con honestidad, reconocer lo no resuelto. Esa actitud es lo que distingue profesional de aficionado.

  - id: "bp-016"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué oficio ancestral del Valle conecta con el informe técnico de este periodo?
    opciones:
      - "El barbero de la plaza"
      - "El vendedor de helados"
      - "El escribiente público de Cartago con su máquina de escribir"
      - "El conductor de chiva"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. El escribiente traducía habla cotidiana a texto formal dirigido a una autoridad específica.
    feedback_incorrecto: |-
      El escribiente público. Su disciplina: ni más palabras ni menos, tono ajustado al destinatario.

  - id: "bp-017"
    bloom: aplicar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      Recibes una invitación a un evento de emprendedores y te piden enviar tu "estudio de mercado". ¿De qué tipo de texto se trata?
    opciones:
      - "Informe técnico"
      - "Estudio de mercado: análisis de sector/audiencia/competencia con tono analítico y datos"
      - "Texto comercial"
      - "Correo profesional"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Estudio de mercado tiene su anatomía propia: contexto + metodología + análisis + conclusiones estratégicas.
    feedback_incorrecto: |-
      Estudio de mercado. Distinto de los otros 3 tipos en propósito (decisión estratégica) y estructura.

  - id: "bp-018"
    bloom: analizar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué porcentaje del informe técnico ocupa el desarrollo?
    opciones:
      - "10%"
      - "100%"
      - "5%"
      - "60-70%"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. 60-70%. Es la zona más larga: metodología + datos + análisis.
    feedback_incorrecto: |-
      60-70%. Es la zona de mayor responsabilidad: metodología clara, datos verificables, análisis con criterio.

  - id: "bp-019"
    bloom: evaluar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      "La IA propone, el humano dispone" es la regla profesional para...
    opciones:
      - "Análisis cualitativo de respuestas abiertas con IA: la IA acelera la propuesta inicial, el humano audita y firma"
      - "Solo redactar"
      - "Solo enviar correos"
      - "Solo formatear texto"
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. La IA agiliza la clasificación inicial; el humano audita los casos límite y firma como responsable.
    feedback_incorrecto: |-
      Es la regla del análisis cualitativo. IA propone, humano dispone y firma. Sin auditoría, la IA introduce errores en sarcasmos y modismos.

  - id: "bp-020"
    bloom: crear
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Diseñas una encuesta para 20 personas. ¿Cuántas preguntas son razonables?
    opciones:
      - "1 sola pregunta"
      - "50 preguntas para tener mucha información"
      - "5-10 preguntas bien diseñadas (cerradas + 1-2 abiertas para insights cualitativos)"
      - "100 preguntas"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. 5-10 preguntas bien diseñadas. Más preguntas reducen la tasa de finalización y agotan al encuestado.
    feedback_incorrecto: |-
      5-10 preguntas bien diseñadas. La cantidad importa menos que la calidad de cada pregunta.

  - id: "bp-021"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos asuntos de correo es el MÁS profesional?
    opciones:
      - "Hola"
      - "URGENTE!!!"
      - "Sin asunto"
      - "Propuesta de mejora del recreo escolar — Grado 10°"
    respuesta_index: 3
    feedback_correcto: |-
      Exacto. Asunto específico, en 5-7 palabras, sin signos exagerados. El destinatario sabe qué leerá al abrir.
    feedback_incorrecto: |-
      Asunto específico (5-7 palabras) que le diga al destinatario qué encontrará. "Hola" y "URGENTE!!!" suelen ir a spam.

  - id: "bp-022"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu mini-proyecto declara que usaste IA en 60% del texto y editaste a mano 30%. ¿Es legítimo firmarlo?
    opciones:
      - "Sí, si la declaración es honesta y se mantiene en la carta del autor; el 30% editado a mano + verificación humana es la firma"
      - "No, no se puede firmar nada hecho con IA"
      - "Solo si la IA fue gratis"
      - "Solo si fue ChatGPT específicamente"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Honestidad + intervención humana sustancial = autoría legítima. La transparencia es la nueva ética editorial.
    feedback_incorrecto: |-
      Es legítimo si la declaración es honesta y la intervención humana es sustancial. La transparencia define la ética contemporánea.

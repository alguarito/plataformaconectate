clave: "10-3"
grado: 10
periodo: 3
completo: true

titulo: "Examen final · Ofimática con IA, contabilidad y emprendimiento"
titulo_portada: |-
  Examen final ---
  Ofimática, contabilidad
  y emprendimiento

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen: tu firma como emprendedor responsable depende de eso.

apertura:
  saber_ancestral: |-
    En cada barrio de Cartago hubo durante décadas \textbf{la tienda de la esquina}: ese pequeño negocio familiar que vendía arroz, panela, fósforos, huevos por unidad, jabón, cerveza y mil cosas más. La dueña de la tienda tenía una herramienta silenciosa pero fundamental: \textbf{el cuaderno}. Era un cuaderno cuadriculado con anillos, abierto encima del mostrador, lleno de columnas hechas a mano: fecha, cliente, productos, monto, fiado o pagado, saldo pendiente. \emph{``Doña Rosa, esta semana lleva diez mil pesos. ¿Le anoto los huevos también?''}. Esa contabilidad de cuaderno no era informal: era \textbf{rigurosa}. La tendera sabía en tiempo real quién le debía qué, qué productos rotaban rápido (huevos, pan), cuáles lento (atún en lata), cuándo hacer pedido al mayorista, cuál era su \emph{punto de equilibrio} sin haber leído nunca un libro de finanzas. Esa práctica ancestral cruza directamente con todo lo que aprendiste este periodo: ofimática con IA es la versión digital del cuaderno; contabilidad básica es lo que la tendera hacía a mano; el plan de negocio (Canvas) es lo que la fundadora de la tienda decidió antes de abrir.

  contexto: |-
    Este examen cierra el periodo 3 de grado 10°, donde aprendiste a usar \textbf{ofimática con IA como copiloto del oficio digital cotidiano}: Sheets, contabilidad básica (S1-S2), Sheets como base contable con IA (S3), flujo de caja y punto de equilibrio (S4), visualización honesta (S5), encuestas y análisis de mercado (S6), Business Model Canvas con IA (S7), comunicación empresarial (S8), proyecto integrador con plan completo de micro-emprendimiento (S9) y sustentación pública con carta de cierre del grado (S10).

  pregunta_marco: |-
    ¿Qué cruza el cuaderno cuadriculado de la tendera de Cartago con tu hoja de cálculo de Google Sheets asistida por IA?

aprendizajes:
  - sesion: 1
    titulo: "Ofimática con IA como copiloto (Sheets, Notion, ChatGPT, Gemini)"
  - sesion: 2
    titulo: "Contabilidad básica: ingresos, egresos, balance neto"
  - sesion: 3
    titulo: "Sheets contable con fórmulas + =GEMINI()"
  - sesion: 4
    titulo: "Flujo de caja, costos fijos vs variables, punto de equilibrio"
  - sesion: 5
    titulo: "Visualización de datos con 5 principios de honestidad"
  - sesion: 6
    titulo: "Estudio de mercado: 5 preguntas + análisis cualitativo auditado"
  - sesion: 7
    titulo: "Business Model Canvas: 9 bloques con datos verificables"
  - sesion: 8
    titulo: "Comunicación empresarial: 3 piezas coherentes (propuesta, correo, visual)"
  - sesion: 9
    titulo: "Proyecto integrador: micro-emprendimiento con plan completo"
  - sesion: 10
    titulo: "Sustentación pública + feria de microempresas + carta de cierre del grado"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un adulto que administra un negocio pequeño (tienda, peluquería, papelería) lo más importante que aprendiste este periodo, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos). Evita frases hechas como ``ser emprendedor digital'': sé específico con vocabulario del periodo (balance, flujo de caja, punto de equilibrio, Canvas, KPI, validación, etc.).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo (balance neto, flujo de caja, punto de equilibrio, Canvas, KPI, validación de mercado, =GEMINI(), gráfico honesto, etc.). (3) que se note \textbf{voz propia} y experiencia real con la hoja de cálculo y el Canvas.
    retroalimentacion: |-
      Una buena respuesta: ``aprendí que (1) si no registras tus gastos día a día, no puedes mejorarlos; el balance neto es el primer espejo. (2) el punto de equilibrio te dice cuánto vender al mes para no perder; sin ese número, vender más no significa ganar más. (3) el Canvas te obliga a llenar 9 bloques con datos verificables del estudio de mercado, no con suposiciones.''
    puntos: 1.0

  contexto:
    enunciado: |-
      La tendera de Cartago llevaba todo en un cuaderno cuadriculado: clientes, fiados, productos que rotaban, deudas. Hacía contabilidad rigurosa sin haber leído ni un libro de finanzas.

      Responde en 5-7 renglones: \textbf{¿qué del oficio de la tendera cruza con la disciplina contable que aprendiste este periodo, y qué se gana al pasar de cuaderno a Google Sheets sin perder el rigor del cuaderno?} Da al menos un ejemplo concreto de cada lado.
    criterio: |-
      Se evalúa: (1) que se identifique al menos una \textbf{práctica concreta} de la tendera (registro diario, columnas claras, saldo en tiempo real, conocimiento del cliente). (2) que se nombre una ganancia real al digitalizar (cálculos automáticos, gráficos, IA para clasificar, escala). (3) que se note reflexión propia: NO presentar Sheets como ``más sofisticado'' sino como herramienta que extiende el oficio del cuaderno.
    retroalimentacion: |-
      Una buena respuesta admite continuidad: ``La tendera sabía quién le debía con solo abrir el cuaderno. La disciplina del registro diario es la misma con Sheets, solo que las fórmulas =SUMAR.SI suman todos los créditos por cliente automáticamente, y la IA puede clasificar productos por rotación. Lo que NO debe perderse al digitalizar es la disciplina del registro diario: una hoja de cálculo vacía es peor que un cuaderno mantenido.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Tu tía María quiere abrir una pequeña pastelería casera. Sus números son: \textbf{costos fijos mensuales \$800.000 (arriendo + luz + suscripciones), costo variable por torta \$15.000 (insumos), precio de venta por torta \$35.000}.

        Aplicando lo aprendido este periodo, ¿cuántas tortas debe vender al mes para alcanzar el punto de equilibrio?
      contexto: |-
        Fórmula del punto de equilibrio: PE = Costos fijos / (Precio unitario - Costo variable unitario).
      tipo: opcion_multiple
      opciones:
        - "20 tortas"
        - "100 tortas"
        - "200 tortas"
        - "40 tortas"
      respuesta_index: 3
      criterio: |-
        La opción D es correcta. PE = 800.000 / (35.000 - 15.000) = 800.000 / 20.000 = 40 tortas mensuales. Las otras opciones aplican mal la fórmula.
      retroalimentacion: |-
        PE = Costos fijos / Margen unitario. 800.000 / 20.000 = 40. Sin ese número, María no sabe si su negocio es viable.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Tu vecino Andrés quiere abrir un servicio de tutorías virtuales de matemáticas para estudiantes de bachillerato del Valle. Tiene la idea y \$500.000 ahorrados. Quiere arrancar el próximo mes.

        \textbf{Diseña en 6-8 renglones los pasos que le recomiendas} aplicando lo aprendido este periodo. Incluye: (a) qué hace ANTES de gastar el dinero (validación), (b) cómo arma su Canvas en 3 bloques mínimos, (c) cómo lleva su contabilidad básica desde la primera semana, (d) cuáles 2 KPIs honestos mediría al final del primer mes.

        Cierra con una frase de cuidado: \textbf{``Andrés, antes de invertir tus \$500.000, asegúrate de...''}
      criterio: |-
        Se evalúa: (1) el orden correcto: validación ANTES de gasto. (2) Canvas con al menos 3 bloques concretos (Segmento, Propuesta de valor, Fuentes de ingresos), no abstractos. (3) contabilidad: ingresos + egresos en Sheets desde día 1. (4) los 2 KPIs son específicos (no "muchas visitas" sino "tasa de conversión visitas → clase contratada", "ingresos vs. costos fijos"). (5) la frase de cuidado muestra criterio.
      retroalimentacion: |-
        Una buena respuesta: ``(a) entrevistar 8 estudiantes objetivo antes de gastar. (b) Canvas mínimo: Segmento (estudiantes 10°-11° Valle con dificultades en matemáticas, \$5K-10K/hora), Propuesta (clases 1-a-1 por Meet con material propio), Fuentes (pago directo o por paquete de 5 clases). (c) Sheets desde día 1 con ingresos + egresos + saldo. (d) KPIs: tasa de conversión consulta→clase contratada; ingresos - costos fijos. Andrés, antes de invertir, asegúrate de tener 5 clientes que ya se comprometieron a probar el primer mes.''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto del oficio emprendedor con ofimática y contabilidad. \textbf{Las 3 lentes deben aparecer explícitamente}.

      Cierra el texto con una sola frase de compromiso para el grado 11°: \emph{``Para el último año del bachillerato, me comprometo a...''}
    voces:
      dussel: |-
        ``Todo emprendimiento elige a quién dignifica con su precio y a quién deja por fuera. Saber qué economía estoy construyendo es la primera ética del oficio."
      estoico: |-
        ``Las cifras son espejo, no decoración. El emprendedor maduro lleva su contabilidad con la disciplina del cuaderno, sin truncar lo que no le gusta ver."
      floridi: |-
        ``Tu hoja de cálculo entra a la cadena informacional de tu negocio. Su honestidad es responsabilidad ética: los números que escondes te traicionan después."
    criterio: |-
      Se evalúa: (1) las 3 lentes aparecen y aplican a aspectos distintos del emprender con contabilidad. (2) el estudiante identifica una tensión real (escalar vs. dignidad, mostrar números vs. esconderlos, automatizar vs. perder oficio). (3) el compromiso final para grado 11° es específico.
    retroalimentacion: |-
      Una buena respuesta: ``Mi proyecto del Canvas vendía tutorías a \$10K/hora (Floridi: información que dignifica si es accesible). La lente del nosotros me pregunta si \$10K excluye a quien más lo necesita; quizás un esquema con beca cubre eso. Lo estoico me dice que mi balance neto negativo del primer mes no se debe maquillar. Para grado 11° me comprometo a aplicar Canvas y contabilidad rigurosa al proyecto emprendedor final de bachillerato.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 3, el grado 10°, y dejas listas las herramientas para el grado 11°: el último año del bachillerato. Lo que aprendiste este periodo no se queda en aula: la tendera de Cartago vive en cada hoja de cálculo bien llevada, en cada Canvas honesto, en cada balance que se firma sin trampa.

# ─── BANCO DE PRÁCTICA · 22 preguntas ──────────────────────────────
banco_practica:
  - id: "bp-001"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué función nueva tiene Google Sheets desde 2025 para integrar IA en celdas?
    opciones:
      - "=SUMA()"
      - "=PRINT()"
      - "=GEMINI()"
      - "=GUARDAR()"
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. =GEMINI("pregunta") permite consultar IA directamente desde una celda con prompt entre comillas.
    feedback_incorrecto: |-
      Es =GEMINI(). Integra IA generativa dentro de Sheets para análisis, clasificación y propuestas.

  - id: "bp-002"
    bloom: recordar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuáles son los 3 elementos obligatorios de la contabilidad básica?
    opciones:
      - "Ingresos, egresos y balance neto"
      - "Solo ingresos"
      - "Solo el saldo bancario"
      - "Compras, ventas, impuestos"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Ingresos + egresos + balance neto. Los 3 juntos cuentan la historia económica del periodo.
    feedback_incorrecto: |-
      Ingresos + egresos + balance neto. Saltar uno deja la contabilidad incompleta.

  - id: "bp-003"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál fórmula usas para sumar SOLO los egresos cuya categoría sea "Transporte"?
    opciones:
      - "=SUMA(B2:B30)"
      - "=PROMEDIO(B2:B30)"
      - "=CONTAR.SI(B2:B30; 0)"
      - "=SUMAR.SI(C2:C30; \"Transporte\"; B2:B30)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. =SUMAR.SI con criterio "Transporte" suma solo las filas que cumplen la condición.
    feedback_incorrecto: |-
      =SUMAR.SI. Es la fórmula condicional para agrupar gastos por categoría.

  - id: "bp-004"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Tu negocio tiene costos fijos \$500.000/mes, precio unitario \$10.000, costo variable \$5.000. ¿Cuál es tu punto de equilibrio en unidades?
    opciones:
      - "50 unidades"
      - "100 unidades"
      - "200 unidades"
      - "500 unidades"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. PE = 500.000 / (10.000 - 5.000) = 100 unidades mensuales.
    feedback_incorrecto: |-
      PE = Costos fijos / Margen unitario. 500.000 / 5.000 = 100 unidades.

  - id: "bp-005"
    bloom: comprender
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos costos es FIJO?
    opciones:
      - "Insumos por unidad producida"
      - "Comisión por venta"
      - "Arriendo del local"
      - "Envío al cliente"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Arriendo se paga existan o no ventas. Insumos, comisión y envío son variables (dependen del volumen).
    feedback_incorrecto: |-
      Arriendo es fijo. Los otros 3 dependen de la cantidad vendida (variables).

  - id: "bp-006"
    bloom: analizar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué principio de honestidad visual aplica a gráficos de barras?
    opciones:
      - "El eje Y debe partir de cero (salvo justificación explícita)"
      - "Mientras más colores, mejor"
      - "Eje Y desde el valor mínimo para que se vean grandes las diferencias"
      - "Sin etiquetas porque distraen"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Eje Y desde cero evita exagerar diferencias visualmente. Es regla de honestidad visual.
    feedback_incorrecto: |-
      Eje Y desde cero. Si no parte de cero, las diferencias se inflan visualmente y engañan al lector.

  - id: "bp-007"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Quieres mostrar la composición de tus egresos del mes (alimentación, transporte, ocio, ahorro). ¿Qué gráfico es el más adecuado?
    opciones:
      - "Líneas"
      - "Dispersión"
      - "3D rotativo"
      - "Circular (pastel)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Circular es el indicado para proporciones del total (4 categorías es ideal).
    feedback_incorrecto: |-
      Circular para proporciones del total. Líneas para tendencia temporal. Barras para comparación entre categorías.

  - id: "bp-008"
    bloom: comprender
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuántas preguntas básicas responde un estudio de mercado?
    opciones:
      - "1"
      - "5 (cliente, necesidad, precio, competencia, canal)"
      - "100"
      - "0"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. 5 preguntas: quién es el cliente, qué necesita, cuánto está dispuesto a pagar, cuál es la competencia, por qué canal se entera.
    feedback_incorrecto: |-
      Son 5 preguntas básicas. Sin responder esas 5, el negocio se construye sobre suposiciones.

  - id: "bp-009"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuántas respuestas mínimas pide la encuesta cuantitativa del estudio de mercado?
    opciones:
      - "1-2"
      - "1.000"
      - "10.000"
      - "15-20"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. 15-20 respuestas mínimas dan base para detectar patrones sin exigir esfuerzo desproporcionado.
    feedback_incorrecto: |-
      Son 15-20 respuestas mínimas. Suficientes para análisis sin esfuerzo desproporcionado.

  - id: "bp-010"
    bloom: recordar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuántos bloques tiene el Business Model Canvas de Osterwalder?
    opciones:
      - "9"
      - "1"
      - "50"
      - "100"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. 9 bloques en un lienzo apaisado. Es la herramienta visual más usada para diseñar modelos de negocio.
    feedback_incorrecto: |-
      9 bloques. Alex Osterwalder, 2010. Es el estándar contemporáneo del oficio emprendedor.

  - id: "bp-011"
    bloom: comprender
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál bloque del Canvas es el corazón del modelo de negocio?
    opciones:
      - "Costos"
      - "Propuesta de valor"
      - "Canales"
      - "Socios clave"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La propuesta de valor define qué problema resuelves y para quién. Todo lo demás se ajusta a eso.
    feedback_incorrecto: |-
      Propuesta de valor. Centro del Canvas. Sin claridad ahí, los otros 8 bloques se desordenan.

  - id: "bp-012"
    bloom: analizar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Con qué se llena el Canvas correctamente?
    opciones:
      - "Con tu imaginación"
      - "Con post-its bonitos"
      - "Con datos verificables del estudio de mercado"
      - "Con suposiciones"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Datos verificables del estudio de mercado. Sin datos, el Canvas es ficción que se cae al primer cliente.
    feedback_incorrecto: |-
      Con datos verificables. Sin estudio de mercado previo, el Canvas es suposición que se desmiente apenas hablas con clientes reales.

  - id: "bp-013"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuántas piezas básicas tiene la comunicación empresarial de un microemprendimiento?
    opciones:
      - "3 (propuesta comercial breve, correo de presentación, publicación visual)"
      - "1"
      - "10"
      - "100"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. 3 piezas que deben ser coherentes entre sí. Si dicen cosas distintas, el cliente desconfía.
    feedback_incorrecto: |-
      3 piezas: propuesta breve, correo, publicación visual. Deben ser coherentes; incoherencias erosionan confianza.

  - id: "bp-014"
    bloom: aplicar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu proyecto integrador del periodo tiene 6 componentes obligatorios. ¿Cuál NO debe faltar?
    opciones:
      - "Solo el Canvas"
      - "Solo el balance"
      - "Solo el video promocional"
      - "Idea con problema real + Canvas + contabilidad proyectada + 3 piezas de comunicación + plan de validación + bitácora del año"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Los 6 componentes juntos. El plan de validación con 5 personas reales es clave.
    feedback_incorrecto: |-
      Los 6 componentes: idea + Canvas + contabilidad + 3 piezas comunicación + plan validación + bitácora.

  - id: "bp-015"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué propiedad NO es irrenunciable de la sustentación final del periodo?
    opciones:
      - "Tiempo controlado de 10 minutos"
      - "Demostración real de los 3 productos del año"
      - "Música de fondo emocionante"
      - "Honestidad sobre uso de IA"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. La música es decoración opcional. Lo irrenunciable: tiempo, demo real, honestidad IA.
    feedback_incorrecto: |-
      La música no. Lo irrenunciable: tiempo controlado + demostración real + honestidad sobre uso de IA.

  - id: "bp-016"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el oficio ancestral del Valle que conecta con la ofimática y contabilidad este periodo?
    opciones:
      - "El abogado del barrio"
      - "La tendera de la esquina con su cuaderno cuadriculado"
      - "El sastre"
      - "El maestro de música"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La tendera llevaba contabilidad rigurosa en su cuaderno: clientes, fiados, productos, saldo en tiempo real.
    feedback_incorrecto: |-
      La tendera con su cuaderno cuadriculado. Era contabilidad rigurosa antes del software.

  - id: "bp-017"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      Tu balance neto del mes es -\$30.000. ¿Qué significa?
    opciones:
      - 'Tienes excedente'
      - 'Empate exacto'
      - 'Ganaste \$30.000'
      - 'Tienes déficit: gastaste \$30.000 más de lo que recibiste'
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Balance negativo significa déficit. Hay que ajustar gastos o aumentar ingresos para el próximo mes.
    feedback_incorrecto: |-
      Déficit: gastaste más de lo que entró. Si se repite mes a mes, el negocio o el bolsillo personal se hunden.

  - id: "bp-018"
    bloom: evaluar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu microempresa hipotética tiene PE de 60 ventas/mes y realísticamente vendes 50. ¿Qué dicen los datos?
    opciones:
      - "Estás bien, sigue así"
      - "Hay problema estructural: o subes precio, o bajas costos fijos, o cambias el modelo"
      - "Necesitas más publicidad"
      - "El negocio es viable como está"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Si las ventas reales no alcanzan el PE, el modelo es deficitario. Hay que ajustar precio, costos o producto.
    feedback_incorrecto: |-
      Hay problema estructural. Vender bajo PE = pérdida cada mes. Hay que subir precio, bajar costos o cambiar el modelo.

  - id: "bp-019"
    bloom: crear
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Tu flujo de caja proyecta 3 meses: M1 = +\$200K, M2 = -\$150K, M3 = +\$100K. ¿Cuál es el saldo acumulado al final de M3?
    opciones:
      - '-\$50K'
      - '+\$300K'
      - '+\$150K'
      - '+\$450K'
    respuesta_index: 2
    feedback_correcto: |-

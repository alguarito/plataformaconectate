clave: "11-1"
grado: 11
periodo: 1
completo: true

titulo: "Examen final · Presencia y marca digital"
titulo_portada: |-
  Examen final ---
  Presencia y marca
  digital

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No copies de internet ni uses IA durante el examen: tu firma como editor responsable depende de eso.

apertura:
  saber_ancestral: |-
    En las plazas de Cartago hubo durante décadas un \textbf{maestro fotógrafo} que retrataba bautizos, grados y matrimonios. Su firma era un sello pequeño en la esquina inferior derecha de cada copia: \emph{``Fotografías Pereira, Cartago.''} Ese sello no era decoración: era \textbf{compromiso de oficio}. Si alguien reclamaba una foto borrosa, ese sello le decía dónde tocar la puerta. Si alguien quería más copias diez años después, ese sello le decía a quién buscar. El maestro nunca firmó una foto que no aprobara. La \textbf{marca era la firma del oficio}, y la firma comprometía al maestro con la calidad. Esa práctica ancestral del firmador artesanal es exactamente la misma lógica que sostiene la marca digital contemporánea: \textbf{firmar es comprometerse}.

  contexto: |-
    Este examen cierra el periodo 1 de grado 11°, donde construiste tu \textbf{presencia digital profesional}: marca personal, identidad visual, sitio web, copywriting con IA, SEO básico, perfiles en LinkedIn, métricas. La pregunta detrás de las 10 sesiones fue una sola: \emph{¿cómo se construye una marca digital con criterio, sin caer en la imitación vacía ni en la sobreexposición publicitaria?}. El examen verifica que aprendiste a \textbf{firmar lo que publicas} como editor responsable, no solo como usuario de plataformas.

  pregunta_marco: |-
    ¿Qué cruza la firma del maestro fotógrafo en la esquina de cada copia con tu firma como editor responsable de tu presencia digital?

aprendizajes:
  - sesion: 1
    titulo: "Marca personal: del oficio heredado a la huella propia"
  - sesion: 2
    titulo: "Identidad visual: paleta, tipografía, lockup coherente"
  - sesion: 3
    titulo: "Sitio web personal: arquitectura y propósito"
  - sesion: 4
    titulo: "Plantillas: elegir y adaptar sin perder la voz propia"
  - sesion: 5
    titulo: "Copywriting con IA: criterio, no copia ciega"
  - sesion: 6
    titulo: "SEO básico: visibilidad sin engaño"
  - sesion: 7
    titulo: "Imagen propia: foto y video con propósito"
  - sesion: 8
    titulo: "Perfiles profesionales: LinkedIn y portafolio coherentes"
  - sesion: 9
    titulo: "Métricas básicas: quién entra y qué busca"
  - sesion: 10
    titulo: "Lanzamiento: presencia digital pública con responsabilidad"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un compañero que no tomó este periodo lo más importante que aprendiste sobre construir presencia digital con criterio, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos), cada una en su propia oración corta. Evita frases hechas como ``ser auténtico'' o ``ser uno mismo'': se específico.
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas, no repetidas con sinónimos. (2) que se nombre al menos un \textbf{concepto técnico} del periodo (marca, paleta, SEO, métricas, copywriting con IA, etc.) y no solo generalidades. (3) que se note \textbf{voz propia} y no copia de manual.
    retroalimentacion: |-
      Una buena respuesta cruza lo conceptual con lo personal: ``aprendí que mi marca se construye con paleta y tipografía coherentes (sesión 2), que la IA es asistente y no autor (sesión 5), y que las métricas son retroalimentación, no vanidad (sesión 9).''
    puntos: 1.0

  contexto:
    enunciado: |-
      El maestro fotógrafo de Cartago firmaba cada copia con su sello como compromiso de oficio. Hoy tu presencia digital también te ``firma'' constantemente: cada post, foto, video, comentario lleva tu nombre asociado.

      Responde en 5-7 renglones: \textbf{¿qué decisiones concretas tomaste este periodo para que tu presencia digital se parezca al sello del maestro fotógrafo y no a una marca corporativa hueca?} Da al menos 2 ejemplos concretos de tu propio sitio o perfil.
    criterio: |-
      Se evalúa: (1) que los ejemplos sean del propio trabajo del estudiante, no inventados ni copiados. (2) que se nombre al menos un \textbf{principio del periodo} (coherencia visual, voz propia, no engaño en SEO, métricas honestas, etc.). (3) que se reconozca tensión real: dónde fue fácil sostener el criterio y dónde fue difícil.
    retroalimentacion: |-
      Una buena respuesta admite las dudas: ``elegí paleta sobria porque no quería sonar a influencer; me costó renunciar a un titular SEO con clickbait porque sabía que generaba más visitas pero no representaba lo que ofrezco.'' La honestidad del oficio incluye reconocer las tensiones.
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Tu compañera Valentina lanzó hace 3 semanas su sitio web para vender ilustraciones digitales. Mira sus métricas (Google Analytics): \textbf{1.200 visitas, 4\% de conversión a contacto, 70\% rebote en menos de 5 segundos, posición \#8 en Google para ``ilustraciones cartago''}. Quiere decidir su próxima acción con un solo cambio.

        ¿Cuál es la acción más razonable según lo que aprendiste en este periodo?
      contexto: |-
        Recuerda: rebote en menos de 5 segundos suele indicar problemas de carga o de claridad inmediata; las visitas son altas pero la conversión moderada; la posición en Google ya es buena para una keyword local.
      tipo: opcion_multiple
      opciones:
        - "Subir 5 anuncios pagados de Instagram para multiplicar las visitas a 5.000 esta semana."
        - "Auditar la página de inicio para mejorar el tiempo de carga y la jerarquía visual del primer pliegue, sosteniendo la posición SEO actual."
        - "Cambiar todos los textos usando ChatGPT con prompts genéricos de ``copywriting persuasivo'' para aumentar la conversión."
        - "Subir el precio de las ilustraciones un 50\\% porque ya tiene tráfico suficiente."
      respuesta_index: 1
      criterio: |-
        La opción B es correcta: el rebote alto en pocos segundos delata problema de claridad o carga (sesión 3-4); la conversión razonable + visibilidad SEO ya buena indican que no hay que romper lo que funciona. A es vanity metric pagada que no resuelve el rebote; C es copywriting ciego con IA (sesión 5 prohíbe esto); D es decisión sin datos.
      retroalimentacion: |-
        Las métricas se interpretan en conjunto, no aisladas. El rebote alto es la señal más fuerte porque rompe todo el embudo posterior.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Vas a publicar tu primer post profesional en LinkedIn anunciando que terminaste el bachillerato técnico y abriste tu portafolio. Tu primer borrador, redactado con ChatGPT, dice:

        \begin{quote}\textit{``¡Estoy súper emocionado/a de compartir un hito enorme en mi vida! Después de años de esfuerzo y dedicación, finalmente he completado mi bachillerato técnico. Esto representa el inicio de un viaje increíble. ¡No puedo esperar a aplicar todo lo aprendido!''}\end{quote}

        Aplica el criterio del periodo: \textbf{reescribe ese texto en 4-6 renglones} para que suene a tu voz, sin clichés, sin sobreexposición, con al menos un dato verificable que dignifique la pieza. Después de tu reescritura, explica en 2-3 líneas \textbf{qué cambiaste y por qué}.
      criterio: |-
        Se evalúa: (1) la reescritura elimina al menos 3 de los clichés del original (``súper emocionado/a'', ``viaje increíble'', ``hito enorme'', ``aplicar todo lo aprendido''). (2) incluye al menos un dato concreto (proyecto del periodo, número de guías, herramienta usada). (3) la justificación final identifica qué se cambió y por qué, con vocabulario del periodo (copywriting, voz propia, IA como asistente, etc.).
      retroalimentacion: |-
        Una buena reescritura: ``Terminé el bachillerato técnico esta semana. Cierro con un portafolio de 30 guías y un sitio personal en pereira.com. Lo siguiente: aplicar para programa de diseño industrial en Univalle. Si conocen referencias del medio, escríbanme.'' Concreto, verificable, con CTA real.
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto de tu marca digital construida en este periodo. \textbf{Las 3 lentes deben aparecer explícitamente} (no basta con mencionar a un solo autor).

      Cierra el texto con una sola frase de compromiso: \emph{``Para el periodo 2, me comprometo a...''}
    voces:
      dussel: |-
        ``Toda marca digital incluye y excluye. Saber a quién mi presencia deja por fuera es la primera ética del oficio.''
      estoico: |-
        ``Lo que firmas, te firma. La marca disciplinada exige más de quien la sostiene que de quien la mira.''
      floridi: |-
        ``En la infoesfera, tu marca no es un anuncio: es información que entra a la conversación común. La calidad de esa información es responsabilidad ética del autor.''
    criterio: |-
      Se evalúa: (1) las 3 lentes aparecen y se aplican a aspectos distintos (no todas a lo mismo). (2) el estudiante identifica una tensión real entre las lentes o dentro de su propia marca (no celebra sin matiz). (3) el compromiso final es específico (no ``ser mejor persona'' sino ``revisar mensualmente la accesibilidad del sitio'' o similar).
    retroalimentacion: |-
      Una buena respuesta no necesita citar literalmente: aplica las ideas. Por ejemplo: ``Mi sitio personal centra mi oficio (Floridi: información en la conversación común), pero noto que está solo en español y deja fuera a clientes potenciales de comunidades indígenas del Valle (Dussel: exclusión silenciosa). La disciplina estoica me dice que no debo agregar idiomas para parecer global, sino para incluir bien a quien quiero servir. Para el periodo 2, me comprometo a evaluar si mi marca dialoga con el sur o solo con el centro.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 1 con instrumentos para razonar tu propia marca digital. El periodo 2 (Automatización y procesos) los volverá a poner a prueba: ya no en cómo te presentas, sino en cómo automatizas tu trabajo sin perder criterio.

# ─── BANCO DE PRÁCTICA · 20 preguntas para la web (LabQuiz) ────────
banco_practica:
  - id: "bp-001"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas frases representa mejor lo que entendimos por "marca personal" en la sesión 1?
    opciones:
      - "Una logo bonito y un nombre corto"
      - "El compromiso visible que firma quien produce un trabajo"
      - "Un perfil de Instagram con muchos seguidores"
      - "Un currículum bien diseñado"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Marca personal es compromiso visible, no estética. La paleta y el nombre vienen después.
    feedback_incorrecto: |-
      No es la respuesta. Marca personal es compromiso visible que firma tu trabajo. Los elementos visuales son apoyo, no esencia.

  - id: "bp-002"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Por qué la coherencia entre paleta, tipografía y lockup importa para una marca personal?
    opciones:
      - "Porque es obligatorio según las leyes de diseño"
      - "Porque permite que la marca se reconozca rápido en cualquier soporte"
      - "Porque las herramientas digitales lo exigen"
      - "Porque sin eso no se puede tener sitio web"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. El reconocimiento rápido es la función. Sin coherencia, cada soporte se ve como una marca distinta.
    feedback_incorrecto: |-
      La función es el reconocimiento rápido. La coherencia visual hace que tu marca se reconozca en pocos segundos.

  - id: "bp-003"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Tu sitio personal tiene 5 páginas, pero los visitantes solo ven la home y la de contacto. ¿Qué decisión es más razonable?
    opciones:
      - "Borrar las otras 3 páginas"
      - "Reorganizar la home para que destaque mejor lo que la gente realmente busca"
      - "Subir más páginas para tener más contenido"
      - "Pagar publicidad para llevar gente a las otras 3"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Las métricas indican qué importa al visitante. Reorganizar la home según eso es la decisión basada en datos.
    feedback_incorrecto: |-
      La decisión basada en datos es reorganizar la home según lo que sí buscan. Borrar o pagar son atajos sin pensar.

  - id: "bp-004"
    bloom: analizar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Eliges una plantilla web para tu sitio personal. ¿Cuál es el principal riesgo de NO adaptarla?
    opciones:
      - "Que tarde más en cargar"
      - "Que tu sitio se vea idéntico a otros 50.000 sitios que usaron la misma plantilla"
      - "Que tenga errores de código"
      - "Que sea ilegal usarla"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. La plantilla sin adaptar te diluye en la multitud. Adaptarla es lo que la hace "tuya".
    feedback_incorrecto: |-
      El riesgo es perderte en la multitud. Adaptar paleta, tipografía y estructura es lo que diferencia tu sitio.

  - id: "bp-005"
    bloom: evaluar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Usas ChatGPT para escribir el "Sobre mí" de tu sitio. ¿Qué hace que el texto resultante sea profesional?
    opciones:
      - "Aceptarlo tal como sale en la primera generación"
      - "Editarlo, agregar 2-3 detalles personales verificables y borrar todos los clichés"
      - "Pegarlo sin cambios pero agregando emojis"
      - "Pedirle que use palabras más largas"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La IA es asistente, no autor. Editar + agregar detalles personales + quitar clichés es lo que firma como tuyo el texto.
    feedback_incorrecto: |-
      La IA es asistente, no autor. El texto profesional exige edición humana: agregar tus datos y quitar las frases hechas.

  - id: "bp-006"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Cuál de estos títulos sigue mejor las prácticas de SEO honesto que vimos en la sesión 6?
    opciones:
      - "Las 7 técnicas SECRETAS que NADIE te quiere contar sobre programación!!!"
      - "Cómo escribí mi primer programa en Python en grado 11 — Conéctate Cartago"
      - "Click aquí para no perderte"
      - "Lo más viral del momento"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Título específico, con contexto (grado), local (Cartago), sin sensacionalismo. SEO sin engaño.
    feedback_incorrecto: |-
      El SEO honesto es específico y local. Los títulos sensacionalistas funcionan corto plazo y dañan la credibilidad.

  - id: "bp-007"
    bloom: comprender
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué define una foto profesional para tu marca personal?
    opciones:
      - "Que tenga muchos filtros y efectos"
      - "Que sea coherente con tu paleta de marca y muestre tu rostro con calidad técnica básica"
      - "Que sea tomada con cámara profesional cara"
      - "Que sea blanco y negro siempre"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Coherencia con paleta + claridad técnica básica. La cámara cara no es el factor.
    feedback_incorrecto: |-
      La coherencia con tu paleta y la claridad técnica son los factores. La cámara cara no garantiza foto profesional.

  - id: "bp-008"
    bloom: analizar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Tu LinkedIn y tu portafolio web tienen mensajes distintos sobre lo que ofreces. ¿Cuál es el problema?
    opciones:
      - "No hay problema, cada plataforma es distinta"
      - "La inconsistencia confunde a quien te lee y debilita tu marca"
      - "LinkedIn pesa más que tu sitio personal"
      - "Tu sitio personal debería copiar a LinkedIn"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. La inconsistencia genera duda en el lector. La coherencia entre canales es lo que sostiene la marca.
    feedback_incorrecto: |-
      El problema es la inconsistencia. Cuando un reclutador te busca en ambos lugares, debe encontrar la misma propuesta.

  - id: "bp-009"
    bloom: aplicar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué métrica te dice mejor si tu sitio personal funciona?
    opciones:
      - "Cuántos likes tienen tus posts"
      - "Cuántos contactos (correos, mensajes, llamadas) generaste desde el sitio"
      - "Cuántas visitas totales tuvo en el mes"
      - "Cuántas páginas tiene tu sitio"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Los contactos son la conversión real. Las visitas y los likes son vanity metrics si no se traducen en conversación.
    feedback_incorrecto: |-
      La métrica clave es la conversión: cuántos contactos reales se generaron. Las visitas sin conversión son humo.

  - id: "bp-010"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Estás listo para lanzar tu presencia digital. ¿Cuál es la última verificación antes de hacer público el sitio?
    opciones:
      - "Que el diseño se vea bien solo en tu computador"
      - "Que el sitio cargue rápido en móvil, sea accesible y todos los enlaces funcionen"
      - "Que tenga al menos 20 páginas"
      - "Que tenga música de fondo"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Carga móvil, accesibilidad y enlaces funcionales son la auditoría mínima antes del lanzamiento.
    feedback_incorrecto: |-
      La verificación es técnica: carga móvil, accesibilidad y enlaces. El estudiante en Cartago llega más por celular que por computador.

  - id: "bp-011"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué oficio ancestral conecta con la marca digital en este periodo?
    opciones:
      - "El programador de Silicon Valley"
      - "El maestro fotógrafo que firmaba cada copia con su sello"
      - "El youtuber de los años 2010"
      - "El community manager"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. El maestro fotógrafo del Valle firmaba como compromiso de oficio, no como decoración.
    feedback_incorrecto: |-
      Es el maestro fotógrafo. Su sello en cada copia era compromiso, no marketing. La marca digital hereda esa lógica.

  - id: "bp-012"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la "regla de los 3 segundos" en identidad visual?
    opciones:
      - "El tiempo que tarda una página en cargar"
      - "El tiempo que un visitante decide si tu marca le interesa al ver la home"
      - "El tiempo entre cada animación"
      - "El tiempo de duración de un post"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. 3 segundos para enganchar al visitante. Tu jerarquía visual debe comunicar lo esencial en ese tiempo.
    feedback_incorrecto: |-
      Son 3 segundos para enganchar. La jerarquía visual del primer pliegue es la que decide si el visitante sigue o se va.

  - id: "bp-013"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Le pides a ChatGPT que escriba tu "Sobre mí" y te devuelve un texto bonito pero genérico. ¿Qué haces?
    opciones:
      - "Lo pegas tal cual porque suena bien"
      - "Lo editas para agregar tu nombre, tu colegio y al menos 2 proyectos concretos"
      - "Le pides otra versión hasta que te guste"
      - "Le agregas muchos emojis"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Edición humana con detalles verificables es lo que firma tu autoría. La IA es asistente, no autor.
    feedback_incorrecto: |-
      Editar y agregar tus datos específicos es lo que firma como tuyo el texto. Sin eso, suena a cualquiera.

  - id: "bp-014"
    bloom: analizar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué tienen en común las palabras clave que rankean bien sin clickbait?
    opciones:
      - "Son largas y suenan importantes"
      - "Describen exactamente lo que ofreces, en el idioma de quien busca"
      - "Son palabras en inglés"
      - "Llevan signos de exclamación"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Especificidad y lenguaje del usuario. "Ilustraciones cartago" rankea para tu mercado real.
    feedback_incorrecto: |-
      Especificidad y lenguaje del usuario. SEO honesto coincide con lo que la gente realmente escribe al buscar.

  - id: "bp-015"
    bloom: evaluar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Vas a usar la misma foto de perfil en LinkedIn, tu sitio web y tu portafolio. ¿Es buena idea?
    opciones:
      - "No, cada plataforma debe tener una distinta"
      - "Sí, refuerza el reconocimiento de tu marca"
      - "Solo si la foto es muy seria"
      - "Solo si es en blanco y negro"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Repetir la misma foto refuerza tu reconocimiento. Es lo mismo que el sello del fotógrafo en cada copia.
    feedback_incorrecto: |-
      Repetir la foto refuerza el reconocimiento. La consistencia visual hace que tu marca se grabe más rápido en quien te ve.

  - id: "bp-016"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la primera sección que un reclutador suele leer en tu LinkedIn?
    opciones:
      - "Las recomendaciones"
      - "El titular (headline) y el resumen (about)"
      - "Las publicaciones"
      - "Los grupos a los que perteneces"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Headline + About es el primer pliegue. Si no engancha ahí, no scrollea más.
    feedback_incorrecto: |-
      Headline y About son lo que se lee primero. Ahí concentras la jerarquía visual: nombre, oficio, propuesta.

  - id: "bp-017"
    bloom: analizar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu sitio tiene 500 visitas/mes pero 0 contactos. ¿Cuál es la hipótesis más razonable?
    opciones:
      - "Las visitas son falsas, deberías comprar un dominio nuevo"
      - "La CTA (llamada a la acción) no es visible o no genera confianza"
      - "Necesitas más visitas"
      - "Necesitas redes sociales"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. El problema está en la conversión, no en la cantidad de tráfico. Auditar la CTA es lo siguiente.
    feedback_incorrecto: |-
      Si hay tráfico pero no conversión, la CTA es el sospechoso. Más visitas sin arreglar eso solo amplifica el problema.

  - id: "bp-018"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Después de lanzar tu presencia digital, ¿cuál es el siguiente paso responsable?
    opciones:
      - "Olvidarte del sitio y enfocarte en redes sociales"
      - "Establecer una rutina mensual de revisión: métricas, errores, actualización de contenido"
      - "Pedir a tus amigos que pongan likes"
      - "Cambiar el diseño cada mes"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Rutina de mantenimiento es lo que distingue marca personal sostenible de lanzamiento que se olvida.
    feedback_incorrecto: |-
      La rutina de revisión sostiene la marca. Sin ella, el sitio queda como tarea escolar olvidada.

  - id: "bp-019"

clave: "11-2"
grado: 11
periodo: 2
completo: true

titulo: "Examen final · Automatización y procesos"
titulo_portada: |-
  Examen final ---
  Automatización
  y procesos

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen: tu firma como editor responsable depende de eso.

apertura:
  saber_ancestral: |-
    En el centro de Cartago hubo durante décadas una \textbf{panadería de barrio} que abría a las 4 de la madrugada. El maestro panadero tenía una rutina escrita en una hoja pegada a la pared, en letra de marcador grueso: \emph{4:00 amasar, 5:00 leudar, 6:00 hornear primer lote, 7:00 sacar y enfriar, 7:30 empacar, 8:00 abrir mostrador}. Cada paso tenía su hora, cada hora su acción. Cuando un ayudante faltaba, el siguiente leía la hoja y sabía exactamente qué hacer. Eso era \textbf{automatización antes del software}: \emph{convertir un proceso repetitivo en una rutina documentada que cualquiera puede ejecutar}. El maestro panadero entendía algo que los emprendedores digitales redescubren: \textbf{primero se mapea el proceso (qué se hace, en qué orden, en cuánto tiempo); después se automatiza (qué partes puede hacer una máquina, qué partes exigen criterio humano)}. Sin ese mapeo previo, la automatización es atajo ciego que repite errores más rápido.

  contexto: |-
    Este examen cierra el periodo 2 de grado 11°, donde construiste \textbf{procesos digitales automatizados con criterio}: mapeaste flujos (S1-S2), capturaste datos sin papel (S3-S4), conectaste herramientas con triggers (S5), aplicaste IA a tareas repetitivas (S6-S7), mediste con KPIs (S8) y aplicaste mejora continua Kaizen (S9). La pregunta detrás de las 10 sesiones fue una sola: \emph{¿cómo se automatizan procesos sin perder la dignidad del oficio que estaban detrás?}. El examen verifica que aprendiste a \textbf{decidir qué se automatiza y qué se conserva humano}, no solo a configurar Zapier.

  pregunta_marco: |-
    ¿Qué cruza el oficio del panadero con su hoja pegada a la pared y tu rutina de automatización con Zapier o n8n?

aprendizajes:
  - sesion: 1
    titulo: "Mapeo de procesos: dónde se pierde el tiempo"
  - sesion: 2
    titulo: "Diagramas de flujo y notación BPMN básica"
  - sesion: 3
    titulo: "Formularios digitales como captura de información"
  - sesion: 4
    titulo: "Hojas de cálculo usadas como base de datos"
  - sesion: 5
    titulo: "Automatización con triggers (Zapier, Make, n8n)"
  - sesion: 6
    titulo: "IA en mensajería: clasificar y responder con criterio"
  - sesion: 7
    titulo: "Chatbots sin código: flujos conversacionales"
  - sesion: 8
    titulo: "KPIs: las métricas que importan en un proceso"
  - sesion: 9
    titulo: "Mejora continua: Kaizen aplicado a procesos digitales"
  - sesion: 10
    titulo: "Caso real: automatizar un proceso del colegio o la casa"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un emprendedor adulto que nunca ha automatizado nada lo más importante que aprendiste en este periodo, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos), cada una en su propia oración corta. Evita frases hechas como ``ahorrar tiempo'' o ``trabajar inteligente'': se específico con vocabulario del periodo.
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo (mapeo, BPMN, trigger, KPI, Kaizen, chatbot, IA en mensajería, etc.). (3) que se note \textbf{voz propia} y no copia de manual.
    retroalimentacion: |-
      Una buena respuesta cruza método con criterio: ``aprendí que (1) la automatización empieza por mapear, no por configurar Zapier; (2) los KPIs honestos miden lo que el proceso debe lograr, no lo fácil de contar; (3) Kaizen exige iterar con datos, no rediseñar desde cero.''
    puntos: 1.0

  contexto:
    enunciado: |-
      El panadero de Cartago tenía una hoja pegada a la pared con su rutina mecanizada (4:00 amasar, 5:00 leudar...). Esa hoja era mapeo de procesos antes del software.

      Responde en 5-7 renglones: \textbf{¿qué del oficio del panadero cruza directamente con la disciplina del mapeo de procesos que aprendiste, y qué se perdió cuando los procesos se trasladaron a software sin esa disciplina previa?} Da al menos un ejemplo concreto de cada lado.
    criterio: |-
      Se evalúa: (1) que se identifique al menos una \textbf{práctica concreta} del panadero (documentar pasos, asignar tiempos, dejar instrucciones para suplencia, etc.). (2) que se nombre un riesgo real cuando se salta el mapeo (atajo ciego, errores acelerados, automatización inútil, etc.). (3) que se note reflexión propia, no parafraseo del enunciado.
    retroalimentacion: |-
      Una buena respuesta admite la pérdida: ``El panadero documentaba con palabras simples para que cualquiera supiera ejecutar. Cuando llevamos eso al software sin esa disciplina, automatizamos un proceso que nunca entendimos: el resultado es un Zapier que envía mensajes en momentos equivocados a la audiencia equivocada.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Diseñas un proceso automatizado para tu microempresa: cada vez que un cliente llena el formulario de pedido, Zapier debe (a) guardar el pedido en una hoja de cálculo, (b) enviar correo de confirmación al cliente, (c) notificar al WhatsApp del repartidor, (d) actualizar el inventario.

        Aplicaste el sistema durante 1 semana. Estos son los KPIs honestos del proceso: \textbf{20 pedidos recibidos, 18 confirmaciones enviadas, 12 notificaciones al repartidor (8 fallaron), 17 inventarios actualizados (3 con datos mal calculados)}.

        ¿Cuál es la acción más razonable según lo aprendido en este periodo?
      contexto: |-
        Recuerda: Kaizen exige mejora basada en datos del proceso real, no en rediseño desde cero. Los KPIs honestos identifican exactamente dónde está la fricción.
      tipo: opcion_multiple
      opciones:
        - "Auditar y arreglar la notificación al repartidor primero (40\\% de fallas) antes de tocar el resto."
        - "Rehacer todo el flujo desde cero porque tiene 3 fallas distintas."
        - "Eliminar el paso del inventario porque genera errores."
        - "Cambiar de Zapier a n8n esperando que las fallas se resuelvan solas."
      respuesta_index: 0
      criterio: |-
        La opción A es correcta: Kaizen dicta atacar primero la falla más grande con datos. Notificación al repartidor falla 40\\% (8/20), confirmación de correo solo 10\\% (2/20), inventario 15\\% (3/20). Rediseñar todo (A) es desperdicio. Eliminar el inventario (C) es atajo. Cambiar de herramienta (D) no resuelve el problema de proceso.
      retroalimentacion: |-
        Kaizen es disciplina de iteración con datos: identifica la mayor fricción, atácala, mide, repite. Rehacer todo o cambiar de plataforma son atajos sin pensar.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Tu mamá administra una tienda pequeña del barrio. Recibe pedidos por WhatsApp, los anota en un cuaderno, despacha a domicilio y al final del día suma las ventas en una calculadora. Quiere automatizar el proceso pero no quiere perder el contacto humano con sus clientas frecuentes.

        \textbf{Diseña en 6-8 renglones un proceso automatizado para ella} que: (a) reduzca el trabajo manual repetitivo, (b) mantenga el contacto humano en los momentos clave, (c) use al menos 2 herramientas concretas vistas en el periodo (formulario digital, hoja de cálculo, trigger, chatbot, etc.). Justifica al final \textbf{qué decidiste NO automatizar y por qué}.
      criterio: |-
        Se evalúa: (1) el flujo propuesto es ejecutable, no abstracto. (2) usa al menos 2 herramientas del periodo con nombre concreto (Google Forms, Sheets, Zapier, Make, n8n, chatbot). (3) la decisión de qué no automatizar revela criterio: identifica los momentos de contacto humano que dignifican el oficio (saludo a clientas frecuentes, atención al cliente molesto, recomendación personalizada).
      retroalimentacion: |-
        Una buena respuesta: ``Formulario de Google para pedidos nuevos → Sheets con pedidos del día → Zapier dispara mensaje al WhatsApp del repartidor con dirección. NO automatizo: la respuesta a clientas frecuentes (mi mamá las saluda por nombre, eso vende más que la velocidad) ni el seguimiento de quejas (esos casos exigen tono humano).''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto de la automatización de procesos. \textbf{Las 3 lentes deben aparecer explícitamente} (no basta con mencionar a un solo autor).

      Cierra el texto con una sola frase de compromiso: \emph{``Para el periodo 3, me comprometo a...''}
    voces:
      dussel: |-
        ``Toda automatización deja por fuera a alguien: a quien no tiene la tecnología, a quien resuelve mejor a mano, a quien el algoritmo no entiende. Saber a quién mi proceso excluye es la primera ética del oficio.''
      estoico: |-
        ``Automatizar sin haber mapeado primero es vanidad disfrazada de eficiencia. La rutina del panadero exige más disciplina que el script más complejo.''
      floridi: |-
        ``En la infoesfera, un proceso automatizado es información que entra a la cadena del mundo. Su calidad ética no depende de su velocidad: depende de qué información produce y a quién dignifica o degrada.''
    criterio: |-
      Se evalúa: (1) las 3 lentes aparecen y se aplican a aspectos distintos (no todas a lo mismo). (2) el estudiante identifica una tensión real (eficiencia vs. dignidad, velocidad vs. inclusión, automatizar vs. conservar contacto humano). (3) el compromiso final es específico.
    retroalimentacion: |-
      Una buena respuesta: ``Mi chatbot agiliza la atención (Floridi: información en cadena), pero la lente del nosotros me pide preguntar a quién deja sin atención: clientes mayores que no usan WhatsApp, vecinos sin datos. Lo estoico me dice que automatizar sin medir el costo humano es atajo. Para el periodo 3 me comprometo a auditar mensualmente quién quedó fuera de mi proceso automatizado.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 2 con instrumentos para automatizar con criterio. El periodo 3 (Proyecto final emprendedor) te pedirá poner todos estos instrumentos al servicio de un problema real de tu comunidad. Llega con la disciplina del panadero, no con la prisa del que quiere despachar rápido.

# ─── BANCO DE PRÁCTICA · 22 preguntas para la web ──────────────────
banco_practica:
  - id: "bp-001"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es "mapear un proceso" según la sesión 1?
    opciones:
      - "Documentar qué se hace, en qué orden y en cuánto tiempo, antes de automatizar"
      - "Hacer un mapa físico del lugar donde se trabaja"
      - "Configurar Zapier rápidamente"
      - "Comprar herramientas digitales nuevas"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Mapear es documentar el proceso real antes de automatizar. Sin mapeo, la automatización es atajo ciego.
    feedback_incorrecto: |-
      Mapear es documentar el proceso real (qué, orden, tiempo) antes de tocar Zapier. Sin esa disciplina, la automatización acelera errores.

  - id: "bp-002"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué representa un rombo en un diagrama de flujo BPMN?
    opciones:
      - "El inicio del proceso"
      - "El final del proceso"
      - "Un actor humano"
      - "Una decisión: el flujo se ramifica según una condición"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. El rombo es decisión: el flujo se bifurca según una condición (sí/no, A/B/C).
    feedback_incorrecto: |-
      Es una decisión. El rombo marca dónde el proceso se bifurca según una condición.

  - id: "bp-003"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas situaciones se beneficia MÁS de reemplazar papel con un formulario digital?
    opciones:
      - "Una firma legal notarial que debe ser presencial"
      - "Un examen oral de grado 5"
      - "El registro semanal de pedidos de la tienda de tu mamá"
      - "Un acta firmada por testigos en persona"
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Procesos repetidos con datos estructurados son los ideales para digitalizar. Los actos legales con firma presencial siguen requiriendo papel.
    feedback_incorrecto: |-
      Los procesos repetidos con datos estructurados son los candidatos ideales. Las firmas presenciales legales no se digitalizan así.

  - id: "bp-004"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Estás usando Google Sheets como base de datos. ¿Cuál de estas prácticas es CORRECTA?
    opciones:
      - "Mezclar datos de tipos distintos en la misma columna"
      - "Una columna por dato, una fila por registro, con encabezados claros"
      - "Dejar celdas vacías en el medio para que se vea bonito"
      - "No poner encabezados porque ya sé qué significa cada columna"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La regla profesional de Sheets-as-DB: una columna = un campo, una fila = un registro, encabezados explícitos.
    feedback_incorrecto: |-
      Una columna por dato, una fila por registro, encabezados claros. Romper esa estructura te impide automatizar después.

  - id: "bp-005"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué hace un "trigger" en Zapier o Make?
    opciones:
      - "Es el botón final para ejecutar el flujo manualmente"
      - "Es el nombre de la app gratis"
      - "Es el evento que dispara el flujo automatizado (nueva entrada en un formulario, correo recibido, etc.)"
      - "Es la factura mensual del servicio"
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. El trigger es el evento detonante: cuando ocurre X, el flujo arranca.
    feedback_incorrecto: |-
      Es el evento detonante. Una nueva fila en Sheets, un correo nuevo o un envío de formulario son ejemplos típicos de trigger.

  - id: "bp-006"
    bloom: analizar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Tu chatbot de IA responde mensajes de tus clientes. Llega un mensaje complicado con quejas legítimas. ¿Qué hace un chatbot bien diseñado?
    opciones:
      - "Responde con una plantilla genérica para cerrar rápido"
      - "Detecta la queja y deriva la conversación a un humano del equipo"
      - "Ignora el mensaje"
      - "Repite la misma respuesta hasta que el cliente desista"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La IA detecta cuándo no es competente y deriva. Eso es criterio: la máquina sabe lo que NO debe hacer.
    feedback_incorrecto: |-
      Un chatbot bien diseñado detecta sus límites y deriva al humano. La IA con criterio sabe cuándo NO debe responder sola.

  - id: "bp-007"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la primera regla al diseñar un flujo conversacional para un chatbot?
    opciones:
      - "Diseñar primero el camino corto (3-5 mensajes) que resuelve el 80\\% de las solicitudes"
      - "Hacer respuestas muy largas para parecer profesional"
      - "Usar emojis en cada mensaje"
      - "Cambiar el tono según la hora del día"
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. El camino corto resuelve la mayoría de los casos. Lo complejo se atiende con derivación a humano.
    feedback_incorrecto: |-
      Camino corto primero (3-5 mensajes para el 80\\%) y derivación humana para el resto. La eficiencia conversacional sigue el principio 80/20.

  - id: "bp-008"
    bloom: comprender
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Un KPI honesto debe ser...
    opciones:
      - "Fácil de contar aunque no represente lo importante"
      - "Un número grande para impresionar"
      - "Cambiante cada semana"
      - "Específico, medible y conectado al propósito del proceso"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. KPI honesto = específico + medible + conectado al propósito. Lo fácil de contar es trampa común (vanity metric).
    feedback_incorrecto: |-
      El KPI honesto se conecta al propósito real del proceso. Lo fácil de contar pero sin sentido es vanity metric.

  - id: "bp-009"
    bloom: analizar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué significa Kaizen aplicado a procesos digitales?
    opciones:
      - "Mejoras pequeñas, frecuentes y basadas en datos del proceso real"
      - "Rediseñar todo desde cero cada mes"
      - "Comprar herramientas nuevas constantemente"
      - "Cambiar de plataforma cada vez que algo falla"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Kaizen es iteración disciplinada con datos: mejoras pequeñas constantes, no rediseños grandes.
    feedback_incorrecto: |-
      Kaizen es mejora pequeña, frecuente, basada en datos. Rediseñar todo o cambiar de plataforma son atajos contrarios al principio.

  - id: "bp-010"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Vas a automatizar el proceso de inscripción al taller de fotografía del colegio. ¿Cuál es el primer paso responsable?
    opciones:
      - "Configurar el formulario en Google Forms inmediatamente"
      - "Comprar una suscripción a Zapier Pro"
      - "Mapear el proceso actual con la coordinación y el docente que dicta el taller"
      - "Diseñar el logo del taller"
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Mapear con quienes ejecutan el proceso es el primer paso. Sin eso, automatizas un proceso que no entiendes.
    feedback_incorrecto: |-
      El mapeo con quienes ejecutan el proceso real es el primer paso. La herramienta viene después.

  - id: "bp-011"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál era el oficio ancestral del Valle que conectó con la automatización en este periodo?
    opciones:
      - "El sastre que tomaba medidas"
      - "El zapatero del centro"
      - "El pescador del Pacífico"
      - "El panadero que documentaba su rutina en una hoja pegada a la pared"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. El panadero documentaba pasos y tiempos. Era mapeo de procesos antes del software.
    feedback_incorrecto: |-
      El panadero. Su hoja pegada a la pared con la rutina (4:00 amasar, 5:00 leudar...) es mapeo de procesos en su forma más pura.

  - id: "bp-012"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      BPMN significa...
    opciones:
      - "Big Process Manager Network"
      - "Business Process Model and Notation"
      - "Best Programming Method Now"
      - "Brand Plan and Marketing Notes"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. BPMN es el lenguaje estándar para diagramar procesos de negocio.
    feedback_incorrecto: |-
      BPMN = Business Process Model and Notation. Es el lenguaje estándar para diagramar procesos.

  - id: "bp-013"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Tu flujo de Zapier dispara correctamente, pero los datos llegan corruptos. ¿Qué herramienta del periodo usas para diagnosticar?
    opciones:
      - "Borrar el flujo y empezar de cero"
      - "Cambiar a Make"
      - "Revisar la base de datos (Sheets) para ver qué pasó en cada paso del flujo"
      - "Apagar y prender el computador"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Auditar el log/datos en cada paso es el método. Cambiar de plataforma no resuelve el problema.
    feedback_incorrecto: |-
      Auditar los datos en cada paso del flujo es el diagnóstico. Cambiar de herramienta es atajo sin pensar.

  - id: "bp-014"
    bloom: analizar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos casos NO debe ser gestionado solo por IA?
    opciones:
      - "Una consulta sobre horarios de atención"
      - "Una solicitud de información del menú"
      - "Una pregunta sobre la dirección del local"
      - "La queja formal de un cliente molesto que pide hablar con un humano"
    respuesta_index: 3
    feedback_correcto: |-
      Exacto. Las quejas que piden trato humano exigen derivación. La IA con criterio reconoce su límite.
    feedback_incorrecto: |-
      Las quejas con pedido de contacto humano se derivan. La IA con criterio sabe cuándo no es la respuesta correcta.

  - id: "bp-015"
    bloom: evaluar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Tu chatbot tiene 12 caminos posibles y los usuarios se pierden. ¿Qué decisión es razonable?
    opciones:
      - "Simplificar a 3-4 caminos principales y derivar el resto a humano"
      - "Agregar 5 caminos más para cubrir todos los casos"
      - "Eliminar el chatbot"
      - "Cambiar el color del chat"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Simplificar al camino corto + derivación humana. 12 caminos es complejidad innecesaria.
    feedback_incorrecto: |-
      Simplificar a los caminos esenciales + derivación. 12 caminos confunden al usuario; 3-4 + humano resuelven mejor.

  - id: "bp-016"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Tu microempresa de pedidos tiene 100 visitas/semana pero solo 5 ventas. ¿Cuál es el KPI clave a observar?
    opciones:
      - "La cantidad de visitas (vanity)"
      - "La tasa de conversión visitas → ventas (5\\%) y dónde se pierden los otros 95\\%"
      - "El color del sitio"
      - "El número de palabras en la home"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Tasa de conversión + análisis del embudo es el KPI honesto. Las visitas solas son vanity.
    feedback_incorrecto: |-
      La tasa de conversión y dónde se pierde el embudo. Las visitas sin conversión no significan nada.

  - id: "bp-017"
    bloom: analizar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Aplicas Kaizen a tu flujo. Después de la primera mejora, ¿qué haces?
    opciones:
      - "Mides el efecto de la mejora, identificas la siguiente fricción y vuelves a iterar"
      - "Declaras el flujo terminado"
      - "Olvidas el flujo durante 6 meses"
      - "Cambias a otra herramienta"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Kaizen es ciclo continuo: medir, mejorar, medir, mejorar. Nunca termina.
    feedback_incorrecto: |-
      Kaizen es ciclo: medir el efecto, identificar la siguiente fricción, mejorar. Nunca se da por terminado.

  - id: "bp-018"
    bloom: crear
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Identificas un proceso en el colegio que se puede automatizar (asistencia, permisos, citaciones). ¿Cuál es tu siguiente paso responsable?
    opciones:
      - "Programar la solución y entregarla sin avisar"
      - "Hablar con quien ejecuta el proceso actualmente, entender qué decide y qué no, antes de proponer"
      - "Publicar la idea en redes sociales primero"
      - "Pedir presupuesto a la rectoría sin haber probado nada"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Conversar con quien ejecuta el proceso es el respeto por el oficio. Sin eso, la automatización es imposición externa.
    feedback_incorrecto: |-
      Conversar con quien ejecuta el proceso real. Sin esa escucha, automatizas lo que crees, no lo que es.

  - id: "bp-019"
    bloom: evaluar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Diseñas un formulario digital para captar pedidos. ¿Cuántos campos obligatorios pones?
    opciones:
      - "Cuantos más mejor, para tener todos los datos"
      - "Ninguno, todos opcionales"
      - "Solo el correo electrónico"
      - "Solo los estrictamente necesarios para iniciar el pedido (típicamente 3-5)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Mínimos campos obligatorios = mayor tasa de respuesta. 3-5 campos es el rango profesional.
    feedback_incorrecto: |-
      Solo lo estrictamente necesario. Cada campo obligatorio adicional reduce la tasa de respuesta.

  - id: "bp-020"
    bloom: crear
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Tu Sheets como base de datos crece a 5.000 filas. ¿Qué decisión profesional toma sentido?
    opciones:
      - "Borrar los datos antiguos sin respaldarlos"
      - "Comprar más espacio en Google Drive"
      - "Evaluar migrar a una base de datos real (Airtable, PostgreSQL) y mantener Sheets para visualización"
      - "Seguir igual"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Sheets tiene límites; a 5.000+ filas con uso intensivo conviene migrar a herramienta especializada.
    feedback_incorrecto: |-
      Migrar a base de datos real cuando el volumen lo justifique. Sheets es punto de partida, no destino final.

  - id: "bp-021"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Le pides a la IA que clasifique tus mensajes de clientes en categorías. La IA propone "queja / pregunta / agradecimiento". Después auditas y encuentras 3 mensajes mal clasificados (sarcasmos tomados literal). ¿Qué haces?
    opciones:
      - "Confías en la IA porque acertó en 17 de 20"
      - "Eliminas la IA del proceso"
      - "Cambias de modelo de IA"
      - "Reclasificas a mano los 3 y documentas que los sarcasmos son límite conocido de la IA"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Auditoría humana de la IA + documentar sus límites es el método profesional. La IA propone, el humano dispone.
    feedback_incorrecto: |-
      Reclasificar a mano y documentar el límite. La IA acelera, el humano supervisa y firma.

  - id: "bp-022"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Aplicas Kaizen a tu proceso durante 4 semanas y los KPIs no mejoran. ¿Qué haces?
    opciones:
      - "Vuelves al mapeo: probablemente el problema no es de ejecución sino de diseño del proceso"
      - "Sigues iterando las mismas mejoras esperando que en algún momento funcionen"
      - "Abandonas Kaizen como método"
      - "Compras una herramienta nueva"
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. Cuando Kaizen no mueve los KPIs, el problema es de diseño del proceso, no de ejecución. Volver al mapeo.
    feedback_incorrecto: |-
      Volver al mapeo. Si las mejoras pequeñas no mueven los KPIs, el problema está en el diseño del proceso, no en la iteración.

clave: "11-3"
grado: 11
periodo: 3
completo: true

titulo: "Examen final · Proyecto emprendedor de cierre del bachillerato"
titulo_portada: |-
  Examen final ---
  Proyecto emprendedor
  de cierre

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen: tu firma como editor responsable depende de eso.
  Este examen cierra el bachillerato técnico: respóndelo con la voz del joven adulto que entregará una propuesta a su comunidad la próxima semana.

apertura:
  saber_ancestral: |-
    En los barrios populares de Cartago existió siempre una figura silenciosa que sostuvo la vida cívica: \textbf{el fundador de la junta de acción comunal}. No tenía título profesional ni capital propio. Tenía una libreta, un buen oído para escuchar a los vecinos y la paciencia de ir casa por casa preguntando: \emph{``¿qué le mejoraría la cuadra?, ¿qué pondría usted?, ¿qué pondríamos juntos?''}. Después de semanas de ese ejercicio, el fundador volvía con una libreta llena de datos: 18 vecinos pidieron alumbrado público en la calle 7; 11 pidieron una caneca en la esquina; 5 pidieron un parque para los niños. Con esa libreta iba a la alcaldía, no con una idea propia, sino con \textbf{la voz documentada de su barrio}. Esa práctica ancestral cruza directamente con el proyecto emprendedor moderno: \textbf{ideación que parte de un problema real validado con los afectados, no de una ocurrencia personal en el escritorio}. El fundador comunal hacía Lean Startup sin saberlo: hablaba antes de construir, mide antes de pedir, sustentaba en público antes de ejecutar.

  contexto: |-
    Este examen cierra el periodo 3 de grado 11° y, con él, tu bachillerato técnico. Construiste un \textbf{proyecto emprendedor end-to-end}: ideación a partir de un problema real (S1), validación con los afectados (S2), modelo de negocio en Canvas (S3), MVP digital (S4), datos del MVP (S5), pitch (S6), presupuesto (S7), ética y legal (S8), versión final del MVP (S9) y sustentación pública (S10). La pregunta detrás de las 10 sesiones fue una sola: \emph{¿cómo se construye una propuesta emprendedora con dignidad de oficio, no como ejercicio de marketing inflado?}. El examen verifica que aprendiste a \textbf{escuchar antes de construir, validar antes de pedir, sustentar antes de ejecutar}.

  pregunta_marco: |-
    ¿Qué cruza la libreta del fundador de la junta de acción comunal con tu proyecto emprendedor de cierre?

aprendizajes:
  - sesion: 1
    titulo: "Ideación a partir de un problema real de la comunidad"
  - sesion: 2
    titulo: "Validación: hablar con los afectados antes de construir"
  - sesion: 3
    titulo: "Modelo de negocio en Business Model Canvas"
  - sesion: 4
    titulo: "MVP digital: la versión imperfecta para probar"
  - sesion: 5
    titulo: "Datos del MVP: recoger evidencia con rigor"
  - sesion: 6
    titulo: "Pitch: contar la historia del proyecto en 3 minutos"
  - sesion: 7
    titulo: "Presupuesto: cuánto siembras, cuánto cosechas"
  - sesion: 8
    titulo: "Ética y legal: la palabra empeñada en lo digital"
  - sesion: 9
    titulo: "Versión final del MVP y plan de mejora"
  - sesion: 10
    titulo: "Sustentación pública frente a la comunidad"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un compañero menor (grado 10°) lo más importante que aprendiste construyendo tu proyecto emprendedor, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos), cada una en su propia oración corta. Evita frases hechas como ``ser emprendedor'' o ``creer en uno mismo'': se específico con vocabulario del periodo (validación, MVP, Canvas, datos, pitch).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo (validación, MVP, Canvas, KPI, pitch, presupuesto, ética digital, etc.). (3) que se note \textbf{voz propia} de quien construyó algo, no resumen de manual.
    retroalimentacion: |-
      Una buena respuesta cruza método con experiencia personal: ``aprendí que (1) el proyecto empieza preguntando, no proponiendo; (2) el MVP feo y rápido enseña más que el plan perfecto en papel; (3) el pitch funciona cuando cuenta una historia real, no cuando enumera virtudes.''
    puntos: 1.0

  contexto:
    enunciado: |-
      El fundador de la junta comunal de Cartago no llegaba con propuestas propias: llegaba con la libreta llena de la voz de sus vecinos. Validaba antes de pedir.

      Responde en 5-7 renglones: \textbf{¿qué del oficio del fundador comunal cruza con la disciplina de validación que aprendiste, y qué se pierde cuando un emprendedor moderno arranca con su propia idea sin haberla validado primero?} Da al menos un ejemplo concreto de cada lado, idealmente de tu propio proyecto.
    criterio: |-
      Se evalúa: (1) que se identifique al menos una \textbf{práctica concreta} del fundador (escuchar primero, documentar, volver con datos, no con opinión personal). (2) que se nombre un riesgo real cuando se salta la validación (construir lo que nadie quiere, gastar antes de saber, perder la confianza de la comunidad). (3) que se note reflexión propia, idealmente con un ejemplo del proyecto que el estudiante construyó.
    retroalimentacion: |-
      Una buena respuesta admite el aprendizaje: ``El fundador comunal volvía con datos de 18 vecinos antes de pedir alumbrado a la alcaldía. Eso es Lean Startup sin saberlo. En mi proyecto empecé con la idea de una app para reservar canchas y solo después de hablar con 8 jóvenes entendí que el verdadero problema era que las canchas se cerraban temprano: pivotar a "negociación colectiva de horarios" cambió completamente el MVP.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Tu compañero Diego construyó un MVP de app para clases particulares de matemáticas entre estudiantes. Hace 2 semanas lanzó: \textbf{lo descargaron 80 estudiantes, 12 se registraron como tutores, 4 contrataron clases, ingresos totales \$80.000}. Diego está orgulloso del lanzamiento pero quiere decidir qué hacer en las próximas 3 semanas.

        ¿Cuál es la decisión MÁS razonable según lo aprendido en este periodo?
      contexto: |-
        Recuerda: el MVP no es producto final, es instrumento para aprender. Las decisiones se toman con los datos del MVP, no con el plan inicial.
      tipo: opcion_multiple
      opciones:
        - 'Pedir un préstamo de \$5.000.000 para crecer rápido porque ya hay tracción.'
        - 'Entrevistar a los 80 descargas y los 4 clientes para entender por qué tan baja conversión y pivotar si hace falta.'
        - 'Lanzar la versión 2.0 con 10 funciones nuevas que se le ocurren a Diego.'
        - 'Dejar el proyecto y empezar otro porque \$80.000 es poco.'
      respuesta_index: 1
      criterio: |-
        La opción B es correcta: tasa de conversión 5\\% (4/80) es señal de que algo no encaja con el problema real. Pivotar con datos es el método. A es escalar antes de validar (atajo común que mata startups). C es agregar features sin saber qué falla. D es abandono sin aprender.
      retroalimentacion: |-
        El MVP es instrumento de aprendizaje. La tasa de conversión baja exige escuchar a los usuarios, no escalar ni agregar features ni abandonar.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Lleva 6 meses tu proyecto emprendedor de cierre. Tu hermana mayor (universidad) te invita a participar en una convocatoria local para emprendedores jóvenes: hay 5 millones de pesos de capital semilla para el ganador.

        \textbf{Diseña en 6-8 renglones tu pitch de 3 minutos} para esa convocatoria. Tu pitch debe incluir: (a) el problema real con un dato verificable, (b) la solución (tu MVP en una frase clara), (c) la evidencia de validación (qué pasó cuando lo probaste con gente real), (d) qué harías con los 5 millones (en máximo 3 rubros concretos del presupuesto).

        Cierra con una sola frase de compromiso ético: \emph{``Si gano, me comprometo a...''}

      criterio: |-
        Se evalúa: (1) el pitch incluye los 4 componentes pedidos (problema verificable, solución concreta, evidencia de validación, plan de presupuesto). (2) usa vocabulario del periodo (MVP, validación, KPI, etc.). (3) el compromiso final muestra criterio ético, no promesa vacía. (4) tiene voz propia, no plantilla copiada de un manual de emprendimiento.
      retroalimentacion: |-
        Un buen pitch: ``En Cartago, el 60\\% de los jóvenes de 11° no encuentra cómo prepararse para Saber 11 con tutorías accesibles (Sec. de Educación, 2024). Mi proyecto, EnseñaTE, conecta tutores estudiantes con quienes necesitan refuerzo a precios desde \$5.000/hora. En 2 meses de MVP, 80 descargas, 12 tutores activos, 32 horas dictadas, calificación 4.7/5. Con \$5M: (1) \$2M plataforma móvil real, (2) \$2M sueldos de tutores 3 meses, (3) \$1M pruebas pedagógicas. Si gano, me comprometo a hacer público el reporte mensual de uso y a destinar 10\\% de utilidades a becas para estudiantes de bajos recursos.''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto del proyecto emprendedor que construiste. \textbf{Las 3 lentes deben aparecer explícitamente}.

      Cierra el texto con una sola frase de compromiso: \emph{``Al cerrar el bachillerato, me comprometo a...''}
    voces:
      dussel: |-
        ``Todo proyecto emprendedor incluye y excluye. Saber a quién mi MVP no llega — por costo, por idioma, por brecha digital — es la primera ética del emprendimiento que parte del sur.''
      estoico: |-
        ``Validar antes de pedir es virtud. La idea no probada es vanidad disfrazada de innovación. El emprendedor maduro escucha más de lo que habla, especialmente al principio.''
      floridi: |-
        ``En la infoesfera, todo emprendimiento digital es información que entra a la conversación común. Su éxito ético no es la facturación: es el tipo de mundo informacional que ayuda a construir.''
    criterio: |-
      Se evalúa: (1) las 3 lentes aparecen y se aplican a aspectos distintos del propio proyecto. (2) el estudiante identifica una tensión real (rentabilidad vs. inclusión, escala vs. dignidad, idea propia vs. voz del afectado). (3) el compromiso final del bachillerato es específico y verificable.
    retroalimentacion: |-
      Una buena respuesta cierra el ciclo: ``Mi proyecto resuelve un problema real (Floridi: información que dignifica el aprendizaje). La lente del nosotros me pregunta a quién dejé fuera: a los que no tienen smartphone. La lente estoica me recuerda que mis 80 descargas no son éxito: son evidencia. Al cerrar el bachillerato me comprometo a sostener el proyecto al menos 6 meses más antes de evaluar si escalo o cierro con honestidad.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 3, el grado 11° y el bachillerato técnico. Tres palabras te llevas como herencia del oficio: \emph{escuchar, validar, sustentar}. Que tu próximo proyecto, sea académico, laboral o comunitario, parta de esas tres palabras. La universidad o el oficio que sigue no te pedirán emprendedores ruidosos: te pedirán adultos con palabra empeñada.

# ─── BANCO DE PRÁCTICA · 22 preguntas para la web ──────────────────
banco_practica:
  - id: "bp-001"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué tipo de problema sirve mejor como punto de partida para un proyecto emprendedor de cierre?
    opciones:
      - "Un problema general del mundo, como el cambio climático"
      - "Un problema real, concreto, verificable, de tu comunidad cercana"
      - "Un problema interesante que viste en TikTok"
      - "Cualquier problema, no importa la escala"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Problema real, concreto, verificable y cercano. Solo así puedes validar y construir un MVP útil.
    feedback_incorrecto: |-
      El problema debe ser real, concreto, verificable y cercano. Los temas generales no permiten validación con personas reales.

  - id: "bp-002"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué significa "validar" en el contexto de Lean Startup?
    opciones:
      - "Pedir aprobación a tus profesores"
      - "Comprar el dominio web"
      - "Hacer publicidad en redes sociales"
      - "Hablar con los afectados por el problema antes de construir, para verificar si lo que crees es real"
    respuesta_index: 3
    feedback_correcto: |-
      Exacto. Validar es escuchar a quienes viven el problema, antes de gastar tiempo o dinero construyendo.
    feedback_incorrecto: |-
      Validar es escuchar a los afectados antes de construir. Es lo que diferencia un proyecto serio de una ocurrencia personal.

  - id: "bp-003"
    bloom: comprender
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      El Business Model Canvas tiene 9 bloques. ¿Cuál es el bloque central?
    opciones:
      - "Costos"
      - "Canales"
      - "Propuesta de valor"
      - "Socios"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. La propuesta de valor es el centro: qué problema resuelves para quién.
    feedback_incorrecto: |-
      La propuesta de valor es el centro del Canvas. Define qué resuelves y para quién; todo lo demás se ajusta a eso.

  - id: "bp-004"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué define un MVP (Producto Mínimo Viable)?
    opciones:
      - "La versión más pequeña que prueba la hipótesis principal del proyecto con usuarios reales"
      - "Un producto perfecto con todas las funciones"
      - "Un prototipo en PowerPoint"
      - "El proyecto terminado al 100\\%"
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. El MVP es la versión imperfecta pero usable que permite aprender. No es el producto final.
    feedback_incorrecto: |-
      El MVP es la versión más pequeña que prueba la hipótesis con usuarios reales. Es instrumento de aprendizaje, no producto final.

  - id: "bp-005"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Lanzaste tu MVP. ¿Qué datos importan MÁS?
    opciones:
      - "Cuántos likes recibió la publicación"
      - "Cuántos usuarios reales lo usaron, cuántos volvieron, qué dijeron al probarlo"
      - "El color del logo"
      - "El número de seguidores en redes sociales"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Uso real, retención, feedback cualitativo. Los likes son vanity metrics que no enseñan nada.
    feedback_incorrecto: |-
      Uso real, retención y feedback cualitativo. Los likes y seguidores son vanity metrics que no informan decisiones.

  - id: "bp-006"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Un pitch profesional de 3 minutos debe incluir...
    opciones:
      - "Todas las funcionalidades técnicas en detalle"
      - "Solo la historia personal del fundador"
      - "Una lista de tus referentes intelectuales"
      - "Problema + solución + evidencia + plan + pedido concreto"
    respuesta_index: 3
    feedback_correcto: |-
      Exacto. Problema, solución, evidencia, plan y pedido. La estructura es lo que mantiene la atención del que escucha.
    feedback_incorrecto: |-
      Estructura: problema + solución + evidencia + plan + pedido. Sin esa anatomía, el pitch se dispersa.

  - id: "bp-007"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Estás armando el presupuesto de tu proyecto. ¿Cuál de estos costos NO debe ir en el presupuesto inicial?
    opciones:
      - "Una oficina física con escritorio cuando aún no la necesitas"
      - "Servidor y dominio web"
      - "Sueldos del primer tutor que contratas"
      - "Pruebas de usabilidad con usuarios reales"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. La oficina física es gasto fijo prematuro. Los emprendedores serios empiezan con lo mínimo necesario.
    feedback_incorrecto: |-
      La oficina física antes de necesitarla es gasto fijo prematuro. Lean es empezar con lo mínimo y crecer con la evidencia.

  - id: "bp-008"
    bloom: analizar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué exige la ética digital del emprendedor en cuanto a datos de usuarios?
    opciones:
      - "Recolectar todos los datos posibles para uso futuro"
      - "Vender los datos a la mejor oferta"
      - "Recolectar solo los datos necesarios para el servicio, informar al usuario y proteger la información"
      - "Esconder qué datos se recolectan"
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Mínima recolección, transparencia y protección. Es la base de la ética digital y de la ley colombiana (1581/2012).
    feedback_incorrecto: |-
      Mínima recolección, transparencia y protección. La ley colombiana y la ética profesional lo exigen.

  - id: "bp-009"
    bloom: evaluar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Después del MVP inicial, ¿qué prioriza tu versión 2.0?
    opciones:
      - "Las funcionalidades que crees que son geniales"
      - "Cambiar el diseño completamente"
      - "Empezar de cero porque el MVP es feo"
      - "Las mejoras que pidieron los usuarios reales y que tus datos respaldan"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. La v2.0 se construye con datos del MVP + voz de los usuarios. No es expresión de gustos personales.
    feedback_incorrecto: |-
      Mejoras pedidas por usuarios reales y respaldadas por datos. La v2 no es ocurrencia, es continuación informada.

  - id: "bp-010"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Vas a sustentar tu proyecto frente a la comunidad. ¿Cuál es la propiedad MÁS importante de tu sustentación?
    opciones:
      - "Que sea muy creativa visualmente"
      - "Que prometa resultados grandes"
      - "Que sea honesta sobre qué funcionó, qué falló y qué aprendiste"
      - "Que sea más larga que la de tus compañeros"
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Honestidad sobre el proceso. La sustentación profesional cuenta los aciertos y los fallos con la misma claridad.
    feedback_incorrecto: |-
      Honestidad: qué funcionó, qué falló, qué aprendiste. La sustentación seria construye confianza al reconocer también los errores.

  - id: "bp-011"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué oficio ancestral conecta con la ideación basada en problemas reales?
    opciones:
      - "El comerciante de plaza"
      - "El fundador de la junta de acción comunal con su libreta"
      - "El profesor de matemáticas"
      - "El conductor de bus"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. El fundador comunal escuchaba antes de proponer. Iba con datos, no con opinión personal.
    feedback_incorrecto: |-
      El fundador de la junta de acción comunal. Su libreta con la voz de los vecinos era validación antes del software.

  - id: "bp-012"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuántas personas mínimo se entrevistan para una validación inicial seria?
    opciones:
      - "5-10 personas que vivan el problema directamente"
      - "1-2 personas"
      - "100+ personas para que sea estadístico"
      - "Solo a tu familia"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. 5-10 entrevistas profundas con quien vive el problema dan más insights que 100 encuestas superficiales.
    feedback_incorrecto: |-
      5-10 entrevistas profundas con afectados. Más es bienvenido pero menos no permite detectar patrones.

  - id: "bp-013"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Llenas el bloque "Segmento de clientes" del Canvas. ¿Cuál es la formulación más profesional?
    opciones:
      - "Jóvenes que quieren aprender"
      - "Personas en general"
      - "Usuarios de internet"
      - "Estudiantes de 10° y 11° de Cartago que se preparan para Saber 11 y no encuentran tutorías accesibles"
    respuesta_index: 3
    feedback_correcto: |-
      Exacto. Segmento bien definido = edad + ubicación + situación + necesidad concreta. Lo vago es inútil.
    feedback_incorrecto: |-
      Segmento bien definido incluye edad, ubicación, situación y necesidad concreta. "Jóvenes" es demasiado vago para construir.

  - id: "bp-014"
    bloom: analizar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Tu MVP es una página simple en Notion con un formulario de Google. ¿Es suficiente para validar la hipótesis?
    opciones:
      - "No, necesitas una app nativa con diseño profesional"
      - "Solo si tiene logo bonito"
      - "Sí, si permite que los usuarios reales prueben el servicio y dejen feedback"
      - "Depende del número de seguidores"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. La fidelidad técnica del MVP no importa: importa que permita aprender. Notion + Forms son MVPs válidos.
    feedback_incorrecto: |-
      Es suficiente si permite que usuarios reales prueben y den feedback. La técnica importa menos que la capacidad de aprender.

  - id: "bp-015"
    bloom: evaluar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Llevas 6 semanas con tu MVP. Tienes 50 usuarios pero ningún ingreso. ¿Qué evalúas?
    opciones:
      - "Cerrar inmediatamente"
      - "Si los 50 usuarios usan el servicio repetidamente; si lo recomiendan; qué dicen al preguntarles si pagarían"
      - "Cambiar de problema"
      - "Aumentar las funciones del producto"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Sin ingresos pero con uso real podría ser hipótesis de precio mal puesta o segmento sin poder de pago.
    feedback_incorrecto: |-
      Investigar el uso real y la disposición a pagar. La ausencia de ingresos puede ser de precio mal puesto, no de problema mal elegido.

  - id: "bp-016"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Tu pitch es para un docente con poder de decidir. ¿Cuál es la frase MÁS efectiva al abrir?
    opciones:
      - "Profe, encontré que el 60\\% de los 11° de Cartago no consigue tutoría para Saber 11. Quiero contarle qué hicimos al respecto."
      - "Hola, soy Andrea, me apasiona el emprendimiento desde niña..."
      - "Voy a presentarles un proyecto que va a cambiar el mundo."
      - "Buenas tardes, espero estén bien..."
    respuesta_index: 0
    feedback_correcto: |-
      Exacto. Empezar con un dato del problema real engancha. Hablar de pasión personal o promesas grandes pierde audiencia.
    feedback_incorrecto: |-
      Empezar con dato concreto del problema. La audiencia se conecta con realidad medible, no con biografía o promesas.

  - id: "bp-017"
    bloom: analizar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Tu presupuesto inicial debe ser realista. ¿Qué rubro NUNCA debe faltar?
    opciones:
      - "Marketing en TikTok"
      - "Oficina física"
      - "Reserva del 10-15\\% para imprevistos"
      - "Patente internacional"
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Reserva para imprevistos es regla profesional. Los proyectos sin colchón mueren al primer obstáculo.
    feedback_incorrecto: |-
      Reserva 10-15\\% para imprevistos es disciplina profesional. Sin ese colchón, cualquier obstáculo cierra el proyecto.

  - id: "bp-018"
    bloom: evaluar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Tu plataforma recolecta nombres y datos de contacto de menores de edad. ¿Qué marco legal aplicas?
    opciones:
      - "Ninguno, ya que es proyecto escolar"
      - "Ley 1581 de 2012 (protección de datos) + autorización expresa de padres/acudientes"
      - "Solo derechos de autor"
      - "Las leyes de los EE.UU."
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La Ley 1581 protege datos personales en Colombia; con menores se exige autorización de acudientes.
    feedback_incorrecto: |-
      Ley 1581/2012 + autorización de acudientes para menores. Es marco mínimo no negociable.

  - id: "bp-019"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu versión final del MVP tiene 8 mejoras pendientes. ¿Cuál priorizas?
    opciones:
      - "La que más usuarios pidieron y que mueve el KPI principal del proyecto"
      - "La más fácil de hacer"
      - "La que más te gusta a ti"
      - "Todas al mismo tiempo"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Priorización profesional combina demanda real (usuarios) con impacto (KPI). Es Kaizen aplicado a producto.
    feedback_incorrecto: |-
      Demanda de usuarios + impacto en KPI principal. Lo fácil o lo personal son criterios pobres de priorización.

  - id: "bp-020"
    bloom: crear
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Cierras tu sustentación pública. ¿Qué llevas como mejor herencia del proyecto?
    opciones:
      - "El producto terminado"
      - "El logo bonito"
      - "El número de likes en redes"
      - "El método: escuchar, validar, construir lo mínimo, medir, iterar, sustentar honestamente"
    respuesta_index: 3
    feedback_correcto: |-
      Exacto. El método es la herencia. El producto puede cambiar, el método se aplica a cualquier proyecto futuro.
    feedback_incorrecto: |-
      El método: escuchar, validar, MVP, medir, iterar, sustentar honestamente. Es aplicable a cualquier proyecto futuro.

  - id: "bp-021"
    bloom: crear
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      Después de 8 entrevistas de validación, descubres que el problema que creías no es el problema real. ¿Qué haces?
    opciones:
      - "Sigues con tu idea original porque ya la diseñaste"
      - "Abandonas el proyecto"
      - "Buscas usuarios que confirmen tu idea original"
      - "Pivotas: ajustas tu propuesta al problema real que la gente sí tiene"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Pivotar con datos es señal de madurez emprendedora. Sostener una idea desmentida es vanidad.
    feedback_incorrecto: |-
      Pivotar al problema real es lo correcto. Sostener una idea que los datos desmienten es vanidad disfrazada de constancia.

  - id: "bp-022"
    bloom: evaluar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Tus datos del MVP muestran que el 80\\% de los usuarios abandona después del segundo uso. ¿Qué hipótesis investigas primero?
    opciones:
      - "Que los usuarios son perezosos"
      - "Que algo en la segunda experiencia rompe la promesa hecha en la primera"
      - "Que los usuarios no entienden tecnología"
      - "Que necesitas más usuarios"
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Cuando hay churn alto entre primer y segundo uso, suele haber gap entre lo prometido y lo entregado.
    feedback_incorrecto: |-
      Hipótesis razonable: la segunda experiencia rompe la promesa. Churn entre uso 1 y 2 es señal clásica de gap producto-mercado.

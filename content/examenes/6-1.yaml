clave: "6-1"
grado: 6
periodo: 1
completo: true

titulo: "Examen final · Comunicación e identidad digital"
titulo_portada: |-
  Examen final ---
  Comunicación
  e identidad
  digital

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo entiendes lo aprendido, no cuánto repites.
  En las preguntas abiertas, justifica con ejemplos del periodo. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses celular ni internet durante el examen.

apertura:
  saber_ancestral: |-
    \textbf{En el centro de Cartago caminaba el pregonero del barrio.} Antes de los celulares, antes de la radio, antes de los periódicos en cada casa, \textbf{el pregonero era el ``medio social'' de las cuadras}. Tocaba una campanita y gritaba: \emph{``Reunión del barrio el sábado, traer ladrillos para arreglar el parque''}, \emph{``Don Aurelio busca obreros para la cosecha''}, \emph{``Velorio en casa de doña Rosa, hoy a las 6 de la tarde''}. La gente confiaba en el pregonero porque \emph{lo conocía}. Don Aurelio, el pregonero del barrio La Merced, llevaba 30 años haciendo el oficio. Su nombre era su identidad: \emph{``El pregonero Aurelio dijo X''} era prueba suficiente para creer el mensaje. Si Aurelio dañaba un mensaje, la cuadra le decía: \emph{``Don Aurelio, eso lo entregó mal''}. Si lo entregaba bien, la gente lo buscaba para el siguiente anuncio. \textbf{Su nombre y su voz eran su identidad}. La cuidaba porque la necesitaba para vivir. \emph{En internet hoy pasa lo mismo}: lo que firmas con tu nombre se queda. Si lo cuidas, te abre puertas. Si no, también se queda. Solo que en internet, mucha más gente te ve, y mucho más rápido.

  contexto: |-
    Este examen cierra el periodo 1 de grado 6°, donde aprendiste a \textbf{habitar la red con dignidad}: qué es identidad digital (S2), cómo escribir correos formales (S3), las 10 reglas de netiqueta (S4), historia de los medios (S5), tu huella digital (S6), privacidad y datos personales con la Ley 1581 (S7), reconocer riesgos digitales (S8), comunicar con los 3 filtros (S9) y presentar lo aprendido (S10).

  pregunta_marco: |-
    ¿Cómo cruza el oficio del pregonero del barrio de Cartago con tu identidad y tu palabra en internet?


examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un primo de 5° grado lo más importante que aprendiste en este periodo, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} concretas (no más, no menos). Evita frases vacías como ``hay que cuidarse en internet'': sé específico con vocabulario del periodo (identidad digital, huella, netiqueta, 5 partes del correo, 3 filtros, etc.).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas y específicas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo. (3) que se note \textbf{voz propia} (no copia de la guía).
    retroalimentacion: |-
      Una buena respuesta menciona conceptos del periodo (huella vs identidad, 5 partes del correo, 3 filtros, etc.) y cierra con una idea que un primo de 10 años pueda entender. Si solo dice ``hay que cuidarse'' sin especifico, falta voz propia.
    puntos: 1.0

  contexto:
    enunciado: |-
      Don Aurelio el pregonero cuidaba su nombre porque lo necesitaba para vivir. \textbf{Compara su situación con la tuya en internet}: ¿qué tienen en común? ¿En qué se diferencian? Responde en 6-8 renglones con un ejemplo concreto de tu vida digital (un perfil, un comentario, una foto).
    criterio: |-
      Se evalúa: (1) que reconozcas que ambos (pregonero y tú) cuidan su nombre porque queda. (2) que menciones al menos 1 diferencia importante (alcance, velocidad, audiencia). (3) que des un ejemplo concreto tuyo (no genérico).
    retroalimentacion: |-
      Una buena respuesta nota que el pregonero tenía 1 cuadra como audiencia; tú tienes el mundo. La velocidad: para Aurelio horas; para ti segundos. Pero el principio es el mismo: nombre + voz = identidad, y la cuidas porque la necesitas para vivir socialmente.
    puntos: 1.0

  practico:
    - numero: 1
      enunciado: |-
        \textbf{Caso}: María, estudiante de 6°, va a escribir un correo al rector pidiendo permiso para faltar a clases el viernes porque tiene cita médica. \textbf{Escribe el correo completo} de María en máximo 10 líneas. Debe tener las 5 partes obligatorias del correo formal que aprendiste en S3.
      criterio: |-
        Se evalúa que el correo tenga las 5 partes claras: (1) destinatario (``Para:''), (2) asunto específico, (3) saludo formal (``Estimado señor rector''), (4) cuerpo en 3 bloques cortos (qué pasa, por qué, qué pide), (5) despedida + firma (nombre completo + grado).
      retroalimentacion: |-
        Un correo bien escrito empieza con ``Buenos días señor rector'' o ``Estimado señor rector'', NO con ``Hola''. Asunto: ``Permiso médico para el viernes 24'' (no ``Es urgente'' ni vacío). Cuerpo: 3 bloques cortos. Firma: ``Atentamente, María Cárdenas, grado 6B''.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        \textbf{Caso}: en un chat de Roblox, un jugador desconocido le escribe a Pedro (12 años) varios días seguidos. Le dice cosas amables, le pregunta por sus pasatiempos, y le pide ``foto en uniforme del colegio para conocerlo mejor''. ¿Qué tipo de riesgo digital es este y qué debería hacer Pedro?
      tipo: opcion_multiple
      opciones:
        - "Es solo amistad nueva. Pedro debería enviar la foto para mostrar que es amable."
        - "Es probablemente grooming (un adulto haciéndose pasar por amigo). Pedro debe bloquear, no enviar foto y contarle a un adulto de confianza."
        - "No es nada importante. Pedro puede ignorar el chat y seguir jugando sin avisar a nadie."
        - "Pedro debería responder con un insulto para que el otro se aleje."
      respuesta_index: 1
      criterio: |-
        Pregunta de opción múltiple. La respuesta correcta es la 2 (grooming). Se evalúa que el estudiante reconozca el patrón: alguien adulto, halagos, petición de foto en uniforme = señales clásicas de grooming. La acción correcta es las 3 reglas de S8: bloquear + no enviar + contar a adulto.
      retroalimentacion: |-
        Las 5 señales de alerta de S8 están todas presentes: te halaga, mueve tus emociones, va rápido, pide algo que cruza un límite (foto en uniforme = info sensible), te aleja de adultos (no te pidió mostrar el chat a tu mamá). Es grooming. Bloquear + no enviar foto + contar a adulto.
      puntos: 1.0

  reflexivo:
    enunciado: |-
      \textbf{Lee las 3 voces siguientes}. Después escribe en 1 párrafo (8-10 renglones) cómo tu identidad y tu huella digital se conectan con las 3 ideas:
      (a) Dussel: tu voz cuenta tanto como cualquier otra; cuidarla es respeto a ti mismo.
      (b) Marco Aurelio: lo que escribes hoy queda; escribe como si fueras a leerlo en 10 años.
      (c) Floridi: internet es una conversación enorme; cada mensaje tuyo es parte de esa conversación.
    voces:
      dussel: |-
        ``Mi voz cuenta tanto como cualquier otra. Mi nombre vale lo mismo que cualquier nombre.''
      estoico: |-
        ``Lo que escribes hoy queda. Escribe entonces como si lo fueras a leer dentro de 10 años.''
      floridi: |-
        ``Internet es una conversación enorme entre muchas voces. Tú también eres una de esas voces.''
    criterio: |-
      Se evalúa: (1) que aplique las 3 voces (no solo una); (2) que conecte cada voz con un aspecto específico de identidad o huella digital; (3) que tenga voz propia (no parafraseo).
    retroalimentacion: |-
      Una buena respuesta usa Dussel para hablar de dignidad de su voz; Marco Aurelio para hablar de que la huella queda; Floridi para hablar de que su identidad participa en una red gigante. Las 3 voces deben dialogar en el párrafo, no aparecer como lista.
    puntos: 1.0

banco_practica:
  - id: "bp-025"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Por qué es importante la S1 (Apertura) de cada periodo, aunque no enseñe tema técnico?
    opciones:
      - "Porque es la única sesión fácil."
      - "Porque establece la ruta, el método MILC y el compromiso del año. Sin S1, las otras 10 sesiones se sienten dispersas."
      - "Porque no hay que llevar cuaderno."
      - "Porque solo se conversa."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. La S1 da estructura: ruta, método, reglas, compromiso. Sin esa base, el periodo entero pierde dirección.
    feedback_incorrecto: |-
      La S1 establece el marco: ruta del periodo, método MILC, compromiso firmado. Sin ese marco, las sesiones técnicas se sienten sueltas.

  - id: "bp-026"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué son los 5 acuerdos del compromiso que firmaste en la S1 del año?
    opciones:
      - "5 reglas para usar el celular."
      - "Cuaderno propio · asistencia · respeto digital · esfuerzo honesto · ayuda mutua."
      - "5 contraseñas del colegio."
      - "5 amigos obligatorios."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Los 5 acuerdos del año: cuaderno propio + asistencia + respeto digital + esfuerzo honesto + ayuda mutua. Firmados en la S1.
    feedback_incorrecto: |-
      Los 5 acuerdos: cuaderno propio para Tecnología, asistencia, respeto digital, esfuerzo honesto, ayuda mutua. Los firmaste en la S1 como compromiso del año.

  - id: "bp-001"
    bloom: recordar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es la identidad digital?
    opciones:
      - "Solo tu nombre real."
      - "El conjunto de cosas que la gente puede ver de ti cuando te busca en internet (foto, apodo, comentarios, videos)."
      - "Tu contraseña."
      - "Tu dirección de casa."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. La identidad digital es lo que muestras en internet: tu foto, apodo, lo que escribes, los grupos donde estás. Tú decides qué muestras.
    feedback_incorrecto: |-
      La identidad digital incluye tu foto, apodo, lo que escribes, los videos que subes, los grupos donde estás. No es solo tu nombre real ni tu contraseña.

  - id: "bp-002"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la diferencia clave entre identidad digital y huella digital?
    opciones:
      - "Son lo mismo."
      - "La identidad es lo que tú decides mostrar; la huella es todo lo demás que las apps registran sin que lo notes."
      - "La huella es para adultos; la identidad para niños."
      - "La huella se borra automáticamente."
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Identidad = lo que decides mostrar. Huella = lo que se registra sin que lo decidas (búsquedas, tiempo en apps, ubicación).
    feedback_incorrecto: |-
      Identidad la controlas tú (publicaciones). Huella la registran las apps sin que lo notes (búsquedas, tiempo, ubicación). Las dos importan, pero son distintas.

  - id: "bp-003"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Vas a escribir un correo al profe pidiendo aclaración sobre la próxima clase. ¿Cuál asunto es el mejor?
    opciones:
      - "Hola profe"
      - "Es urgente"
      - "Pregunta sobre la próxima clase de Tecnología"
      - "Profe profe profe"
    respuesta_index: 2
    feedback_correcto: |-
      Sí. Un buen asunto dice de qué trata el correo en una frase clara. El profe sabe qué esperar antes de abrirlo.
    feedback_incorrecto: |-
      El asunto debe ser específico: ``Pregunta sobre la próxima clase de Tecnología'' dice exactamente de qué se trata. ``Hola profe'' o ``Es urgente'' son vagos.

  - id: "bp-004"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Le escribes al coordinador del colegio. ¿Cómo lo saludas?
    opciones:
      - "Hey coordi"
      - "Qué más"
      - "Buenos días señor coordinador"
      - "Saludos mi rey"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. A una autoridad le hablas formal: ``Buenos días señor coordinador''. Eso abre puertas; lo informal las cierra.
    feedback_incorrecto: |-
      A una autoridad escolar le hablas con respeto: ``Buenos días señor coordinador''. ``Hey'' o ``qué más'' son informales y no se usan en correo formal.

  - id: "bp-005"
    bloom: recordar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuántos acuerdos de netiqueta aprendiste en la sesión 4?
    opciones:
      - "5"
      - "10"
      - "20"
      - "100"
    respuesta_index: 1
    feedback_correcto: |-
      Sí, los 10 acuerdos de netiqueta. Cada uno cuida cómo te llevas con otros en chats, juegos, redes y correos.
    feedback_incorrecto: |-
      Son 10: saluda, no grites con mayúsculas, no spam, cuida horarios, respeta lo privado, no publiques fotos de otros sin permiso, piensa antes de escribir, no insultes ni en broma, si algo está mal no lo reenvíes, cuéntale a un adulto si te asustas.

  - id: "bp-006"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Tu compañero escribe en el grupo de WhatsApp a las 11 de la noche pidiendo la tarea. ¿Qué haces según la netiqueta?
    opciones:
      - "Le respondo de inmediato porque vi el mensaje."
      - "No respondo. A las 11 de la noche se respeta el sueño. Le contesto al día siguiente."
      - "Le mando 5 mensajes para que no me olvide."
      - "Le mando un audio gritando."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Acuerdo 4 de netiqueta: cuida los horarios. A las 11 pm se respeta el sueño. Responder al día siguiente está bien.
    feedback_incorrecto: |-
      Acuerdo 4 de netiqueta: respetar horarios. A las 11 pm no se escriben mensajes salvo emergencias. El compañero recibe respuesta al día siguiente.

  - id: "bp-007"
    bloom: comprender
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿De qué medio antiguo viene la idea de ``destinatario, asunto, saludo, cuerpo y firma''?
    opciones:
      - "Del telégrafo."
      - "De la carta postal de hace más de 100 años."
      - "De WhatsApp."
      - "De la radio."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Las 5 partes vienen de la carta postal de hace más de 100 años. El correo electrónico solo las trasladó a la pantalla.
    feedback_incorrecto: |-
      De la carta postal. Esas 5 partes existen hace más de 100 años. El correo electrónico moderno las heredó tal cual de las cartas que iban en mula o tren.

  - id: "bp-008"
    bloom: analizar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué tienen en común el telégrafo del siglo XIX y los mensajes de chat de hoy?
    opciones:
      - "Los dos viajan por cables submarinos."
      - "Los dos usan abreviaciones porque hay que ser breves."
      - "Los dos cuestan dinero por cada letra."
      - "Los dos los maneja un operador en una oficina."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. El telégrafo enseñó a abreviar porque cada palabra costaba. Hoy abrevias en chats por costumbre de esa misma idea.
    feedback_incorrecto: |-
      Ambos abrevian. El telégrafo lo hacía porque cada palabra costaba dinero. Los chats heredaron ese hábito aunque ya no cobren por letra.

  - id: "bp-009"
    bloom: comprender
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Subes una foto a TikTok. ¿Qué tipo de huella digital es?
    opciones:
      - "Huella activa: tú decidiste subirla."
      - "Huella pasiva: la app la subió sola."
      - "Huella secundaria: alguien más la subió."
      - "No es huella, solo es un video."
    respuesta_index: 0
    feedback_correcto: |-
      Sí. Tú la subiste a propósito, entonces es huella activa. La controlas tú: si la cuidas, está bien; si no, te queda.
    feedback_incorrecto: |-
      Es huella activa porque TÚ decidiste publicarla. La pasiva la dejas sin notar (búsquedas, ubicación). La secundaria la dejan otros sobre ti (te etiquetan).

  - id: "bp-010"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Tu prima sube una foto vieja tuya sin pedirte permiso a Instagram. ¿Qué tipo de huella es?
    opciones:
      - "Huella activa: porque ahí estás tú."
      - "Huella pasiva: porque no lo notaste."
      - "Huella secundaria: porque la dejó otra persona sobre ti."
      - "No es huella, es una foto vieja."
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Huella secundaria es la que dejan otros sobre ti. Puedes pedirle a tu prima que la baje y eso es válido.
    feedback_incorrecto: |-
      Huella secundaria: la dejó otra persona sobre ti. Tienes derecho a pedirle a tu prima que la quite, especialmente si te sientes incómodo con la foto.

  - id: "bp-011"
    bloom: recordar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos es un dato PRIVADO (que casi nadie debería saber)?
    opciones:
      - "Tu nombre de pila."
      - "La ciudad donde vives."
      - "Tu contraseña del correo institucional."
      - "El grado escolar en que estás."
    respuesta_index: 2
    feedback_correcto: |-
      Sí. La contraseña es dato privado: solo tú la sabes. Si la das, alguien puede entrar a tu correo y hacerse pasar por ti.
    feedback_incorrecto: |-
      La contraseña es dato privado. Nombre, ciudad y grado son públicos. Los datos privados (contraseñas, cédula, dirección exacta) no se comparten con nadie.

  - id: "bp-012"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Una empresa te llama porque ``compró tu número''. Tú quieres que dejen de llamarte. ¿Qué ley colombiana te respalda?
    opciones:
      - "Ninguna, no hay ley sobre esto."
      - "La Ley 1581 de 2012 de protección de datos personales."
      - "La Constitución de 1810."
      - "La Ley de Derechos del Niño."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Ley 1581 de 2012 protege tus datos personales. Tienes derecho a pedir que borren tu información. Es tu derecho legal.
    feedback_incorrecto: |-
      La Ley 1581 de 2012 protege tus datos personales en Colombia. Puedes exigir que las empresas borren tus datos. No es opcional para ellas: es tu derecho legal.

  - id: "bp-013"
    bloom: analizar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Un amigo nuevo de un juego en línea te dice: ``No le cuentes a tus papás que hablamos, ellos no entienden estas cosas''. ¿Qué señal de alerta es?
    opciones:
      - "Ninguna, solo está siendo amable."
      - "Es señal de grooming: te pide secreto Y te aleja de tus adultos."
      - "Es señal de buen amigo: respeta tu privacidad."
      - "Es señal de que es un niño igual a ti."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Pedir secreto + alejarte de adultos son 2 señales clarísimas de grooming. Una persona honesta jamás te pide guardar secretos de tus papás.
    feedback_incorrecto: |-
      Es alerta grande. Pedir secreto + alejarte de tu familia es la señal más clara de grooming. Cuéntale a un adulto de confianza inmediatamente.

  - id: "bp-014"
    bloom: evaluar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Recibes un correo: ``Felicitaciones, ganaste 10 mil Robux. Escribe tu contraseña aquí para reclamar''. ¿Qué haces?
    opciones:
      - "Escribo mi contraseña rápido, no quiero perder el premio."
      - "Borro el correo. Roblox NUNCA pide tu contraseña por correo. Es phishing."
      - "Le pregunto al remitente por WhatsApp si es verdad."
      - "Reenvío a mis amigos para que también ganen."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Eso es phishing (estafa digital). Las empresas serias NUNCA piden contraseña por correo. Borrar es la salida correcta.
    feedback_incorrecto: |-
      Es phishing. Ninguna empresa real pide contraseña por correo. Borra el mensaje. Si caíste y entregaste contraseña, cámbiala YA y cuéntale a un adulto.

  - id: "bp-015"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Algo en internet te asustó. ¿Cuáles son las 3 acciones de oro?
    opciones:
      - "Respondo, peleo, y borro la conversación."
      - "Respiro y no respondo, capturo evidencia (pantallazo), cuento a un adulto de confianza."
      - "Lo guardo para mí, mañana se olvida."
      - "Bloqueo al usuario y nunca lo cuento."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Las 3 acciones de oro: respirar y no responder, capturar evidencia, contar a un adulto de confianza. En ese orden y los 3 juntos.
    feedback_incorrecto: |-
      Las 3 acciones de oro son: NO responder con prisa, capturar pantalla (evidencia), contar a un adulto. NO bloquear sin avisar a nadie; el adulto necesita saber.

  - id: "bp-016"
    bloom: comprender
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuáles son los 3 filtros antes de publicar algo en internet?
    opciones:
      - "¿Está chistoso? ¿Tiene likes? ¿Se ve bien?"
      - "¿Es verdad? ¿Es necesario? ¿Es amable?"
      - "¿Es corto? ¿Tiene emojis? ¿Tiene foto?"
      - "¿Es viral? ¿Es popular? ¿Es nuevo?"
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Los 3 filtros: verdad + necesario + amable. Si lo que vas a publicar falla en uno, lo piensas mejor o no lo publicas.
    feedback_incorrecto: |-
      Son: (1) ¿es verdad? (2) ¿es necesario? (3) ¿es amable? Los 3 filtros antes de publicar cualquier cosa. Si falla uno, no se publica como está.

  - id: "bp-017"
    bloom: aplicar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Quieres comentar ``esa cara está fea'' en una foto de Instagram. ¿Qué filtro falla?
    opciones:
      - "Falla el de ``¿es verdad?''."
      - "Falla el de ``¿es amable?''."
      - "Falla el de ``¿es necesario?''."
      - "No falla ninguno, está bien."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Aunque tú lo creas verdad, no es amable. Lo amable construye, no destruye. Reescribe o no publiques.
    feedback_incorrecto: |-
      Falla el filtro de amable. Aunque sea tu opinión, escribir ``fea'' destruye. Reescríbelo o no lo publiques. Lo amable construye relaciones.

  - id: "bp-018"
    bloom: aplicar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      En un chat empiezan a burlarse de Sara, una compañera. ¿Qué hace un ``upstander'' (lo opuesto a bystander)?
    opciones:
      - "Se suma a las burlas para no quedar fuera del grupo."
      - "Calla y mira sin escribir nada."
      - "Le escribe en privado a Sara: ``¿estás bien? vi lo que pasa''."
      - "Cierra el chat y se va sin avisar a nadie."
    respuesta_index: 2
    feedback_correcto: |-
      Sí. Upstander = el que NO calla cuando ataca a otro. Escribir en privado a la víctima la sostiene. No tienes que pelear; solo no callar.
    feedback_incorrecto: |-
      Upstander es el que actúa. Lo mínimo es escribirle en privado a la víctima (``¿estás bien?''). Eso cambia el clima del grupo y le da soporte a Sara.

  - id: "bp-019"
    bloom: aplicar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Te paras a hacer tu presentación digital de 2 minutos. ¿Cuál postura es la correcta?
    opciones:
      - "Encorvado, así me ven más tranquilo."
      - "De pie, pies firmes, manos relajadas. Mirando a 3 compañeros distintos durante los 2 minutos."
      - "Apoyado en una pared, así no me canso."
      - "Sentado, así no se nota si tiemblo."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. De pie + pies firmes + manos relajadas + mirar a 3 compañeros. La postura comunica seguridad antes de hablar.
    feedback_incorrecto: |-
      De pie con pies firmes y manos relajadas. Miras a 3 compañeros distintos durante los 2 minutos. Encorvarte o apoyarte transmite duda; la postura habla antes que tú.

  - id: "bp-020"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Te equivocas en una palabra durante el pitch. ¿Qué haces?
    opciones:
      - "Paro y pido disculpas largo rato."
      - "Empiezo de nuevo desde el inicio."
      - "Sigo. Una palabra no daña la presentación; un parón sí."
      - "Salgo de la clase corriendo."
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Sigue. Una palabra mal dicha es invisible si tú no le das importancia. Parar y disculparse hace el error 10 veces más grande.
    feedback_incorrecto: |-
      Sigues. La audiencia olvida la palabra al segundo siguiente. Parar y disculparte largo amplifica el error. Profesionalismo es seguir como si nada.

  - id: "bp-021"
    bloom: crear
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos NO debería ir en tu tarjeta de identidad digital del cuaderno?
    opciones:
      - "Tu nombre real."
      - "3 cosas que te gusta hacer."
      - "Tu contraseña del correo."
      - "Una frase que tú mismo inventes para describirte."
    respuesta_index: 2
    feedback_correcto: |-
      Sí. La contraseña NUNCA va en la tarjeta. La tarjeta es para mostrar quién eres; la contraseña queda en hoja aparte privada.
    feedback_incorrecto: |-
      La contraseña jamás va en la tarjeta de identidad. La tarjeta muestra quién eres (nombre, gustos, frase tuya); la contraseña queda en hoja aparte y solo tú la sabes.

  - id: "bp-022"
    bloom: analizar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Te llega una cadena que dice ``Reenvía esto a 10 amigos o algo malo te pasará''. ¿Qué haces?
    opciones:
      - "Reenvío de una para que no me pase nada."
      - "Reenvío solo a 3 amigos para ir despacio."
      - "Borro la cadena y no la reenvío. Es mentira."
      - "Reenvío a todo el grupo del salón."
    respuesta_index: 2
    feedback_correcto: |-
      Bien. Las cadenas son mentira. Borrarlas es lo correcto. Reenviarlas te hace parte del problema y molesta a tus amigos.
    feedback_incorrecto: |-
      Las cadenas son mentira. No te va a pasar nada. Borrar es la salida. Reenviar te hace cómplice de basura digital que llena chats de amigos.

  - id: "bp-023"
    bloom: evaluar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Una app de linterna te pide acceso a tu micrófono, tu cámara y tu lista de contactos. ¿Qué haces?
    opciones:
      - "Le doy todo, debe necesitarlo."
      - "Niego los permisos. Una linterna no necesita micrófono, cámara ni contactos. Si insiste, busco otra app."
      - "Le doy solo el micrófono, los otros no."
      - "Le doy todo por un día solamente."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Regla del mínimo necesario: si la app pide más de lo que su función requiere, sospecha y niégale. Una linterna solo necesita el flash.
    feedback_incorrecto: |-
      Una linterna NO necesita micrófono, cámara ni contactos. Niégale los permisos. Si la app insiste, busca otra. Los permisos innecesarios suelen ser para vender tus datos.

  - id: "bp-024"
    bloom: crear
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Estructura de tu pitch de 2 minutos. ¿Cuál es la más profesional?
    opciones:
      - "Hablo de lo que se me ocurra en el momento."
      - "4 momentos en orden: quién soy (15s) + cómo cuido datos (45s) + cómo me protejo (45s) + compromiso (15s)."
      - "Solo leo el cuaderno completo."
      - "Solo digo mi nombre y termino."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Los 4 momentos en 2 minutos: presentar 15s + cuidar datos 45s + protección 45s + compromiso 15s. Estructura clara, pitch profesional.
    feedback_incorrecto: |-
      4 momentos: 15s + 45s + 45s + 15s = 2 minutos. Estructura te ahorra improvisar. Cada momento con propósito claro. Leer todo no es presentación; es lectura.

cierre: |-
  Cierras el periodo 1 de grado 6° con tu identidad digital cuidada y tu palabra firmada. El periodo 2 te abre el computador por dentro: vas a entender qué hay adentro de la máquina que ya sabes usar con criterio.

clave: "6-2"
grado: 6
periodo: 2
completo: true

titulo: "Examen final · Hardware, software y la máquina por dentro"
titulo_portada: |-
  Examen final ---
  Hardware,
  software
  y la máquina
  por dentro

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo entiendes lo aprendido, no cuánto repites.
  En las preguntas abiertas, justifica con ejemplos del periodo. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses celular ni internet durante el examen.

apertura:
  saber_ancestral: |-
    \textbf{Antes de las máquinas modernas, en Cartago había maestros de oficio que conocían sus herramientas por dentro}. Don Lucho el \textbf{relojero}, en su vitrina de la calle 14, podía abrir un reloj de bolsillo y nombrar cada engranaje: el muelle, el volante, el escape, la corona. Doña Carmen la \textbf{costurera} entendía su Singer hasta la última bobina: por qué se rompía un hilo, cómo regular la tensión, qué pieza desgastaba primero. Don Aurelio el \textbf{panadero} reconocía cada parte de su horno de leña: la cámara, el tiro, la rejilla, las brasas. \emph{Cada maestro conocía su máquina por dentro, no solo por fuera.} Por eso resolvían problemas en minutos, no quedaban dependientes de un técnico, y elegían bien cuando compraban una pieza nueva. Hoy nuestras máquinas se llaman \emph{computador, celular, cajero, smart TV}. Son más complejas que el reloj de don Lucho, pero el principio sigue siendo el mismo: \textbf{quien las entiende por dentro es libre; quien solo aprieta botones es dependiente}. Este periodo te entregó el oficio de mirar adentro de la máquina inteligente.

  contexto: |-
    Este examen cierra el periodo 2 de grado 6°, donde aprendiste a \textbf{entender el computador por dentro}: las 4 funciones de toda máquina inteligente (S2), las piezas del gabinete (S3), los periféricos como manos y ojos (S4), la diferencia entre hardware y software (S5), el sistema operativo como gerente (S6), archivos y carpetas como biblioteca digital (S7), mantenimiento básico (S8), postura y vida útil del cuerpo y del equipo (S9), y cómo elegir un computador con criterio (S10).

  pregunta_marco: |-
    ¿Cómo cruza el oficio del relojero, la costurera o el panadero de Cartago con tu nuevo oficio de entender el computador por dentro?

aprendizajes:
  - sesion: 1
    titulo: "Apertura periodo 2: las máquinas inteligentes por dentro"
  - sesion: 2
    titulo: "¿Qué es un computador? Las 4 funciones (entrada, procesar, salida, guardar)"
  - sesion: 3
    titulo: "El gabinete por dentro: CPU, RAM, disco, fuente, tarjeta madre"
  - sesion: 4
    titulo: "Periféricos: entrada, salida y mixtos"
  - sesion: 5
    titulo: "Hardware vs software: el cuerpo y las instrucciones"
  - sesion: 6
    titulo: "El sistema operativo: el gerente del computador"
  - sesion: 7
    titulo: "Archivos y carpetas: ordenar mi biblioteca digital"
  - sesion: 8
    titulo: "Mantenimiento básico: limpieza, actualizaciones y respaldos"
  - sesion: 9
    titulo: "Postura y vida útil: cuidar el equipo y cuidarme yo"
  - sesion: 10
    titulo: "Mi computador ideal: ficha técnica con criterio"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un primo de 5° grado lo más importante que aprendiste en este periodo sobre el computador por dentro, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} concretas (no más, no menos). Evita frases vacías como ``el computador es importante'': sé específico con vocabulario del periodo (4 funciones, CPU, RAM, hardware, software, sistema operativo, periférico, etc.).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas y específicas. (2) que se nombre al menos \textbf{dos conceptos técnicos} del periodo (ej. RAM, CPU, sistema operativo, periférico). (3) que se note \textbf{voz propia} (no copia de la guía) y un ejemplo concreto.
    retroalimentacion: |-
      Una buena respuesta menciona conceptos del periodo (las 4 funciones, qué es RAM, qué hace el sistema operativo, qué diferencia hardware y software) y cierra con una idea que un primo de 10 años pueda entender. Si solo dice ``el computador tiene piezas'' sin nombrarlas, falta voz propia y vocabulario.
    puntos: 1.0

  contexto:
    enunciado: |-
      Don Lucho el relojero conocía cada engranaje del reloj porque lo necesitaba para vivir de su oficio. \textbf{Compara su situación con la tuya frente al computador}: ¿qué tienen en común? ¿En qué se diferencian? Responde en 6-8 renglones con \textbf{un ejemplo concreto} de algo que ya puedas mirar por dentro en el computador y antes no podías.
    criterio: |-
      Se evalúa: (1) que reconozcas el paralelo (conocer la máquina por dentro = no depender del técnico/vendedor). (2) que menciones al menos 1 diferencia importante (complejidad, cantidad de partes, velocidad de cambio). (3) que des un ejemplo concreto tuyo (ej. ``ahora sé qué pieza es la RAM'').
    retroalimentacion: |-
      Una buena respuesta nota que don Lucho y tú comparten un principio: \emph{conocer por dentro = libertad para decidir}. La diferencia: don Lucho trabajaba con piezas mecánicas grandes; tú trabajas con piezas electrónicas pequeñas que cambian cada año. Pero la actitud es la misma: abrir, mirar, entender.
    puntos: 1.0

  practico:
    - numero: 1
      enunciado: |-
        \textbf{Caso}: Mariana, estudiante de 6°, quiere comprar un computador para hacer tareas y editar fotos para su canal escolar. Su mamá le pregunta: ``¿qué le miramos en la ficha técnica para no equivocarnos?''. \textbf{Escribe a Mariana un mensaje de 8-10 líneas} explicándole los \textbf{4 componentes clave} que debe mirar en la ficha (CPU, RAM, disco, sistema operativo), qué hace cada uno, y un rango razonable para uso escolar.
      criterio: |-
        Se evalúa que el mensaje (1) nombre los 4 componentes (CPU, RAM, disco, SO); (2) explique en una línea qué hace cada uno con palabras propias; (3) sugiera un rango razonable (ej. RAM mínimo 8 GB, disco SSD 256 GB); (4) tenga voz propia (no copia de guía).
      retroalimentacion: |-
        Un buen mensaje dice: ``CPU = el cerebro que procesa, mira Intel i3/i5 o Ryzen 3/5; RAM = la mesa de trabajo, mínimo 8 GB para varias pestañas; disco = el archivero, mejor SSD 256 GB o más; sistema operativo = el gerente, Windows 11 o macOS son los más usados''. Voz propia: ``si quieres editar fotos, no escatimes en RAM''.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        \textbf{Caso}: el computador de la sala empieza a apagarse solo después de 10 minutos encendido. La rejilla de ventilación está cubierta de polvo y el ventilador suena muy fuerte. ¿Qué problema es y qué \textbf{NO debe hacer} el estudiante?
      tipo: opcion_multiple
      opciones:
        - "Es un virus. El estudiante debe abrir el gabinete con un destornillador y limpiar adentro él solo."
        - "Es sobrecalentamiento por polvo. El estudiante NO debe abrir el gabinete: reporta al profe y deja que el técnico limpie con aire comprimido."
        - "Es un problema de software. El estudiante debe instalar un antivirus pirata bajado de internet."
        - "No es nada grave. El estudiante debe seguir usándolo aunque se apague, ya volverá a funcionar."
      respuesta_index: 1
      criterio: |-
        Pregunta de opción múltiple. La respuesta correcta es la 2 (sobrecalentamiento + reportar). Se evalúa que el estudiante reconozca: (a) los síntomas (apagado por temperatura, polvo, ventilador ruidoso); (b) la regla de S8 (no abrir, reportar al profe); (c) el camino correcto (técnico con aire comprimido).
      retroalimentacion: |-
        Sobrecalentamiento clásico: polvo tapa rejilla → ventilador trabaja más → CPU se sobrecalienta → el equipo se apaga para protegerse. Regla de S8: tú \textbf{no abres el gabinete}, reportas al profe. El técnico limpia con aire comprimido. Abrir tú es romper la garantía y arriesgar daño mayor.
      puntos: 1.0

  reflexivo:
    enunciado: |-
      \textbf{Lee las 3 voces siguientes}. Después escribe en 1 párrafo (8-10 renglones) cómo tu nuevo conocimiento del computador por dentro se conecta con las 3 ideas:
      (a) Dussel: tú tienes derecho a saber qué hay adentro de tus máquinas; no es privilegio de técnicos ni de adultos.
      (b) Marco Aurelio: cuidar tu computador y tu postura hoy te ahorra dolor mañana; la disciplina pequeña gana en el tiempo.
      (c) Floridi: las máquinas hoy son parte del ambiente donde vives; entenderlas es ciudadanía digital.
    voces:
      dussel: |-
        ``Conocer las máquinas por dentro no es privilegio de pocos. Tú también tienes derecho a saber cómo funciona lo que usas cada día.''
      estoico: |-
        ``Lo que cuidas hoy con disciplina --- el computador, tu espalda, tus ojos --- te lo agradecerá tu yo del año entrante.''
      floridi: |-
        ``Hoy vives rodeado de máquinas inteligentes. Entenderlas es tu nuevo alfabeto. Quien no las entiende, no participa del mundo en que vive.''
    criterio: |-
      Se evalúa: (1) que aplique las 3 voces (no solo una); (2) que conecte cada voz con un aspecto específico del periodo 2 (hardware, mantenimiento, ergonomía o criterio de compra); (3) que tenga voz propia (no parafraseo de las citas).
    retroalimentacion: |-
      Una buena respuesta usa Dussel para defender que un estudiante de 6° puede entender RAM y CPU; Marco Aurelio para hablar de mantener postura y limpieza diaria; Floridi para conectar que entender máquinas es ciudadanía moderna. Las 3 voces dialogan en el párrafo, no aparecen como lista.
    puntos: 1.0

banco_practica:
  - id: "bp-001"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la idea central del periodo 2 según la apertura (S1)?
    opciones:
      - "Aprender a programar videojuegos."
      - "Entender las máquinas inteligentes por dentro para no depender de técnicos ni vendedores."
      - "Memorizar marcas de computadores."
      - "Aprender a usar redes sociales."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. P2 es el periodo de \emph{abrir la máquina y mirar adentro}: hardware, software, mantenimiento, criterio de compra. No es programación todavía.
    feedback_incorrecto: |-
      La idea central de P2: entender el computador por dentro --- piezas, software y cuidado --- para no quedar dependiente de quien sí sabe. La programación llega más adelante.

  - id: "bp-002"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Por qué el ejemplo del relojero, la costurera y el panadero ayuda a entender este periodo?
    opciones:
      - "Porque eran personas famosas en Cartago."
      - "Porque cada uno conocía su máquina por dentro, lo que les daba libertad para resolver problemas y elegir bien."
      - "Porque vendían herramientas baratas."
      - "Porque trabajaban gratis."
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. El relojero conocía el reloj por dentro; tú vas a conocer el computador por dentro. La actitud (\emph{mirar, entender, decidir}) es la misma.
    feedback_incorrecto: |-
      El paralelo no es histórico sino de oficio: \emph{conocer la máquina por dentro = libertad para decidir}. Eso vale para don Lucho con el reloj y para ti con el computador.

  - id: "bp-003"
    bloom: recordar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuáles son las 4 funciones básicas de toda máquina inteligente?
    opciones:
      - "Encender, apagar, cargar, descargar."
      - "Entrada, procesamiento, salida y almacenamiento."
      - "Internet, juegos, fotos y música."
      - "Hardware, software, red y disco."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Las 4 funciones: \emph{entrada} (recibe datos), \emph{procesamiento} (los transforma), \emph{salida} (los muestra) y \emph{almacenamiento} (los guarda). Desde un microondas hasta un computador, todas funcionan así.
    feedback_incorrecto: |-
      Son: entrada, procesamiento, salida y almacenamiento. Toda máquina inteligente cumple esas 4 funciones; cambia el ``cuerpo'' pero no el principio.

  - id: "bp-004"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      En un cajero electrónico, cuando metes tu tarjeta y digitas la clave, ¿qué función estás activando?
    opciones:
      - "Salida."
      - "Almacenamiento."
      - "Entrada."
      - "Procesamiento."
    respuesta_index: 2
    feedback_correcto: |-
      Bien. Meter tarjeta y digitar clave es \emph{entrada} (le das datos al cajero). Después él los procesa y te muestra saldo (salida).
    feedback_incorrecto: |-
      Es entrada. La tarjeta y la clave son datos que tú le das al cajero. Después él los procesa, consulta tu saldo (almacenamiento) y te muestra el resultado (salida).

  - id: "bp-005"
    bloom: analizar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos NO es un ejemplo de máquina inteligente con las 4 funciones?
    opciones:
      - "Microondas digital con teclado."
      - "Smart TV con control remoto."
      - "Una piedra del río."
      - "Cajero electrónico del banco."
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Una piedra no recibe ni procesa nada; no tiene las 4 funciones. Las otras tres sí (todas reciben datos, procesan, muestran y guardan algo).
    feedback_incorrecto: |-
      La piedra es objeto pasivo: no recibe datos, no procesa, no muestra. Las otras (microondas, smart TV, cajero) sí cumplen las 4 funciones aunque sean máquinas distintas.

  - id: "bp-006"
    bloom: recordar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la pieza del gabinete que se considera el ``cerebro'' del computador?
    opciones:
      - "La RAM."
      - "El disco duro."
      - "La CPU (procesador)."
      - "La fuente de poder."
    respuesta_index: 2
    feedback_correcto: |-
      Sí. La CPU (Unidad Central de Procesamiento) es el cerebro: ejecuta las instrucciones de los programas. Sin ella, nada se procesa.
    feedback_incorrecto: |-
      La CPU es el cerebro. La RAM es la mesa de trabajo (memoria de corto plazo). El disco es el archivero (largo plazo). La fuente es la que da electricidad. Las 4 trabajan juntas.

  - id: "bp-007"
    bloom: comprender
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Si la CPU es el cerebro, ¿qué papel cumple la RAM en la analogía?
    opciones:
      - "Es el archivero donde se guarda todo permanentemente."
      - "Es la mesa de trabajo donde la CPU pone lo que está usando ahora; se borra al apagar."
      - "Es el cable que conecta todo."
      - "Es la pantalla."
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. La RAM es la mesa de trabajo: donde la CPU pone lo que necesita en ese momento (programas abiertos). Al apagar se vacía. Por eso más RAM = más cosas abiertas al tiempo.
    feedback_incorrecto: |-
      RAM = mesa de trabajo (corto plazo, se borra al apagar). Disco = archivero (largo plazo, queda guardado). La gente confunde RAM y disco; son piezas distintas con funciones distintas.

  - id: "bp-008"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Tu computador se pone lento cuando abres muchas pestañas y un programa pesado. ¿Qué pieza probablemente está saturada?
    opciones:
      - "El disco duro."
      - "La RAM."
      - "El monitor."
      - "El teclado."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Muchas pestañas + programa pesado = RAM llena. Cerrar pestañas libera RAM y el equipo respira.
    feedback_incorrecto: |-
      Es la RAM. Como la mesa de trabajo se llena, la CPU empieza a buscar espacio en el disco (que es mucho más lento). Por eso el equipo se siente arrastrado. Cerrar pestañas libera RAM.

  - id: "bp-009"
    bloom: recordar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es un periférico?
    opciones:
      - "Una pieza interna del gabinete."
      - "Un dispositivo externo que se conecta al computador (entrada, salida o mixto)."
      - "Un programa de oficina."
      - "Un tipo de virus."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Periférico = lo que se conecta por fuera al computador. Teclado, ratón, parlantes, impresora, audífonos, USB.
    feedback_incorrecto: |-
      Periférico es lo externo que se conecta. Las piezas internas (CPU, RAM, disco) no son periféricos. Periférico viene de \emph{periferia}: el borde, lo que está alrededor.

  - id: "bp-010"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos es un periférico MIXTO (entrada y salida al tiempo)?
    opciones:
      - "Una impresora."
      - "Un parlante."
      - "Una pantalla táctil."
      - "Un teclado."
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. La pantalla táctil muestra (salida) y recibe tu dedo (entrada) al mismo tiempo. Es periférico mixto.
    feedback_incorrecto: |-
      La pantalla táctil es mixta. Teclado = solo entrada. Parlante e impresora = solo salida. Mixto significa que cumple las 2 funciones a la vez.

  - id: "bp-011"
    bloom: analizar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Un escáner que también imprime se llama ``multifuncional''. ¿Qué tipos de periférico combina?
    opciones:
      - "Dos de entrada."
      - "Dos de salida."
      - "Uno de entrada (escáner) + uno de salida (impresora)."
      - "Ninguno: el multifuncional no es periférico."
    respuesta_index: 2
    feedback_correcto: |-
      Sí. El escáner es entrada (captura imagen y la mete al computador); la impresora es salida (saca imagen del computador al papel). El multifuncional reúne ambos.
    feedback_incorrecto: |-
      Escáner = entrada (mete imagen al computador). Impresora = salida (saca imagen al papel). El multifuncional combina los dos en un solo aparato.

  - id: "bp-012"
    bloom: recordar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la diferencia clave entre hardware y software?
    opciones:
      - "Hardware se usa en el colegio; software en la casa."
      - "Hardware es lo físico (lo que puedes tocar); software es lo invisible (los programas y las instrucciones)."
      - "Hardware es caro; software es barato."
      - "Son lo mismo, solo cambian de nombre."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Hardware = cuerpo (CPU, RAM, pantalla, teclado). Software = instrucciones (Windows, Word, navegador, juegos). El cuerpo sin instrucciones no hace nada.
    feedback_incorrecto: |-
      Hardware = lo físico que tocas. Software = los programas que corren dentro. El computador necesita los dos para funcionar: el cuerpo (hardware) y las instrucciones (software).

  - id: "bp-013"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos es SOFTWARE?
    opciones:
      - "El teclado."
      - "La RAM."
      - "El navegador Chrome."
      - "El cable USB."
    respuesta_index: 2
    feedback_correcto: |-
      Bien. Chrome es un programa (software): instrucciones que la CPU ejecuta para mostrarte páginas web. Las otras 3 son hardware.
    feedback_incorrecto: |-
      Chrome es software (un programa). Teclado, RAM y cable USB son hardware (piezas físicas). Los programas son invisibles aunque corran en piezas reales.

  - id: "bp-014"
    bloom: recordar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es un sistema operativo (SO)?
    opciones:
      - "Un juego en línea."
      - "El programa principal que coordina todo el computador: hardware, software y usuario."
      - "Una pieza física del gabinete."
      - "Una marca de computador."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. El SO es \emph{el gerente} del computador: organiza la memoria, gestiona archivos, ejecuta programas y te muestra la pantalla. Ejemplos: Windows, macOS, Linux, Android, iOS.
    feedback_incorrecto: |-
      El SO es el gerente: coordina hardware (piezas) y software (programas) y te da la pantalla con ventanas. Sin SO, el computador no sabe qué hacer cuando lo enciendes.

  - id: "bp-015"
    bloom: analizar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos NO es un sistema operativo?
    opciones:
      - "Windows 11."
      - "macOS."
      - "Microsoft Word."
      - "Android."
    respuesta_index: 2
    feedback_correcto: |-
      Exacto. Word es una aplicación (procesador de texto), no un sistema operativo. Los otros tres sí son SO (Windows, macOS y Android coordinan toda la máquina).
    feedback_incorrecto: |-
      Word es aplicación, no SO. Los SO son: Windows, macOS, Linux (computador), Android, iOS (celular). Las aplicaciones (Word, Chrome, Spotify) corren \emph{dentro} de un SO.

  - id: "bp-016"
    bloom: recordar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la diferencia entre archivo y carpeta?
    opciones:
      - "Son lo mismo."
      - "Archivo = unidad de información (documento, foto, video); carpeta = caja que organiza archivos."
      - "Archivo es de Windows; carpeta es de Mac."
      - "Archivo es del colegio; carpeta es personal."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Archivo = el documento, foto o video. Carpeta = la caja que agrupa archivos. Las carpetas pueden contener otras carpetas (subcarpetas).
    feedback_incorrecto: |-
      Archivo = el contenido (documento, foto, video). Carpeta = el contenedor. Una carpeta puede tener varios archivos y otras carpetas dentro. Es la ``biblioteca digital''.

  - id: "bp-017"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Vas a organizar tus tareas del semestre. ¿Cuál estructura de carpetas es la más profesional?
    opciones:
      - "Una sola carpeta llamada ``cosas'' con todo adentro."
      - "Carpetas por año y dentro por materia (ej. 2026 → Tecnología → Periodo 2)."
      - "Archivos sueltos en el escritorio sin carpetas."
      - "Una carpeta por archivo (un archivo por carpeta)."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Estructura por año → materia → periodo es lo más usado por estudiantes y profesionales. Encuentras cualquier tarea en 3 clics.
    feedback_incorrecto: |-
      Por año + materia + periodo. Eso te deja buscar por contexto (\emph{``mi tarea de Tecno P2''}) en lugar de revolver una pila de archivos sueltos.

  - id: "bp-018"
    bloom: recordar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué incluye el mantenimiento básico de un computador?
    opciones:
      - "Solo limpiar la pantalla con jabón."
      - "Limpieza física (sin agua), actualizaciones del SO y respaldo de archivos importantes."
      - "Cambiar todas las piezas cada año."
      - "Nunca apagarlo para que no se dañe."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. 3 cosas básicas: \emph{limpiar} (paño seco, sin agua), \emph{actualizar} (instalar actualizaciones del SO) y \emph{respaldar} (copia de archivos importantes en USB o nube).
    feedback_incorrecto: |-
      Mantenimiento básico: limpieza física suave (paño seco, sin agua), actualizaciones del SO y respaldo de archivos importantes. Apagado correcto también suma. Nada de jabón ni de cambiar piezas porque sí.

  - id: "bp-019"
    bloom: evaluar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Tu hermano dice que para limpiar la pantalla del computador es mejor usar agua y jabón. ¿Qué le respondes con criterio de S8?
    opciones:
      - "Está bien, total el agua no daña."
      - "No: el agua puede dañar la pantalla. Lo correcto es un paño microfibra seco o ligeramente humedecido con limpiador especial."
      - "Mejor con thinner, eso saca todo."
      - "Mejor no limpiar nunca."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Agua + electrónica = riesgo. Lo correcto: paño microfibra seco o con limpiador especial para pantallas. Thinner o jabón dañan el recubrimiento.
    feedback_incorrecto: |-
      Agua daña electrónica. Lo correcto: paño microfibra seco o con limpiador especial. Nunca thinner, alcohol fuerte ni jabón. La pantalla tiene un recubrimiento que se borra con químicos agresivos.

  - id: "bp-020"
    bloom: recordar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la postura correcta frente al computador para cuidar tu cuerpo?
    opciones:
      - "Acostado en la cama con el laptop sobre el pecho."
      - "Espalda recta, pantalla a la altura de los ojos, codos en 90°, pies apoyados."
      - "De pie todo el tiempo, sin sillas."
      - "Inclinado a un lado para descansar la espalda."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Postura ergonómica: \emph{espalda recta, pantalla a nivel de ojos, codos 90°, pies apoyados}. Eso cuida tu columna, tu cuello y tus muñecas a largo plazo.
    feedback_incorrecto: |-
      Postura ergonómica: espalda recta, pantalla a nivel de ojos (ni alta ni baja), codos a 90°, pies apoyados en el piso. La mala postura no duele hoy pero deja consecuencias en 2-3 años.

  - id: "bp-021"
    bloom: aplicar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Llevas 2 horas seguidas frente al computador. ¿Qué te recomienda S9 hacer?
    opciones:
      - "Seguir sin parar, ya estoy concentrado."
      - "Aplicar la regla 20-20-20: cada 20 minutos miro algo a 20 pies (6 metros) por 20 segundos. Y descansar 5 minutos cada hora."
      - "Cerrar los ojos 5 minutos y ya."
      - "Cambiar el brillo al máximo."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Regla 20-20-20 + descansos cortos cada hora. Tus ojos y tu espalda lo agradecen. Pararse y caminar 2 minutos también renueva concentración.
    feedback_incorrecto: |-
      Regla 20-20-20: cada 20 minutos mira a algo lejano (6 metros) durante 20 segundos. Más: pausa de 5 min cada hora, párate, camina. Cuida vista y postura.

  - id: "bp-022"
    bloom: aplicar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Estás eligiendo computador para estudiar (tareas, navegar, mirar video). ¿Cuál ficha técnica es razonable como mínimo?
    opciones:
      - "CPU Celeron, RAM 2 GB, disco 32 GB HDD."
      - "CPU Intel i3 o Ryzen 3, RAM 8 GB, disco 256 GB SSD."
      - "CPU Intel i9, RAM 64 GB, disco 4 TB SSD (lo más caro)."
      - "Cualquier computador, no importa lo que tenga."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Mínimo razonable para estudiar: \emph{i3/Ryzen 3 + 8 GB RAM + 256 GB SSD}. El primero queda corto; el tercero es exagerado para tareas escolares.
    feedback_incorrecto: |-
      Para estudiar: i3/Ryzen 3 + 8 GB RAM + 256 GB SSD. Menos queda corto (lento, sin espacio). Más es exagerado para edad escolar (paga gama gamer sin necesidad). Criterio.

  - id: "bp-023"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Un vendedor te dice: ``Llévate este computador súper barato, tiene 4 GB de RAM y disco HDD''. ¿Qué decides con criterio de S10?
    opciones:
      - "Lo compro, está baratísimo."
      - "Lo descarto: 4 GB de RAM y HDD lo hacen muy lento para estudiar en 2026; busco mínimo 8 GB y SSD."
      - "Lo compro y le agrego RAM yo."
      - "Solo lo compro si el vendedor es amable."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. 4 GB de RAM hoy es muy poco (chrome solo consume eso). HDD es lento comparado con SSD. Lo barato sale caro: en 6 meses te frustras y necesitas otro.
    feedback_incorrecto: |-
      4 GB de RAM + HDD = computador lento desde el día 1. Lo barato sale caro: en pocos meses ya no rinde y tienes que cambiarlo. Criterio es elegir bien, no rápido.

  - id: "bp-024"
    bloom: crear
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Vas a crear el nombre de un archivo de tarea de tecnología. ¿Cuál nombre es el más profesional?
    opciones:
      - "documento1.docx"
      - "tarea.docx"
      - "2026-05-15_TIC_P2_Ficha-Computador-Ideal_Cardenas.docx"
      - "asdf.docx"
    respuesta_index: 2
    feedback_correcto: |-
      Bien. Nombre profesional incluye: fecha (YYYY-MM-DD) + materia + periodo + tema + apellido. Lo encuentras en segundos aunque tengas 100 archivos.
    feedback_incorrecto: |-
      Patrón profesional: \emph{fecha-materia-periodo-tema-apellido}. ``documento1'' y ``asdf'' no dicen nada; en 3 meses no sabrás qué contienen.

  - id: "bp-025"
    bloom: crear
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas analogías describe mejor la relación hardware-software?
    opciones:
      - "Hardware es el motor del carro; software es la gasolina."
      - "Hardware es el cuerpo (huesos, músculos); software es la mente (pensamientos, decisiones)."
      - "Hardware es la maestra; software es el alumno."
      - "Hardware es el almuerzo; software es el postre."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Cuerpo (hardware) + mente (software) es la analogía más clara: el cuerpo sin mente no decide; la mente sin cuerpo no actúa. Los dos se necesitan.
    feedback_incorrecto: |-
      La analogía cuerpo-mente es la más limpia: hardware = cuerpo físico que se toca; software = mente invisible que decide. Se necesitan mutuamente: uno sin otro no funciona.

cierre: |-
  Cierras el periodo 2 con un computador transparente: ya no es caja negra, sabes qué hay dentro y cómo cuidarlo. El periodo 3 te abre la puerta del oficio que viene: vas a aprender a buscar, evaluar y producir información con criterio en internet.

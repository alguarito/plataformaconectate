  - sesion: 10
    titulo: "Mi primer documento informativo: producto que reúne todo"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un primo de 5° grado lo más importante que aprendiste este periodo sobre escribir y buscar con criterio, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} concretas (no más, no menos). Evita frases vacías como ``hay que saber buscar'': sé específico con vocabulario del periodo (procesador de texto, formato, CRAAP, fuente confiable, operadores de búsqueda, fake news, etc.).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas y específicas. (2) que se nombren al menos \textbf{dos conceptos técnicos} del periodo (ej. CRAAP, formato, operadores de búsqueda). (3) que se note \textbf{voz propia} (no copia de la guía) y un ejemplo concreto.
    retroalimentacion: |-
      Una buena respuesta menciona conceptos del periodo (las partes de un procesador, las 5 letras de CRAAP, los operadores de búsqueda, las señales de fake news) y cierra con una idea que un primo de 10 años pueda entender. Si solo dice ``hay que ser cuidadoso'' sin nombres, falta voz propia y vocabulario.
    puntos: 1.0

  contexto:
    enunciado: |-
      Doña Mercedes le preguntaba al vecino 5 cosas antes de creer una noticia: ¿quién la escribió?, ¿cuándo?, ¿por qué?, ¿qué prueba tiene?, ¿quién más lo dice? \textbf{Compara su método con CRAAP que aprendiste en S9}: ¿qué tienen en común? ¿En qué se diferencian? Responde en 6-8 renglones con \textbf{un ejemplo concreto} de una vez que aplicaste (o debiste aplicar) esta forma de pensar con algo que viste en internet.
    criterio: |-
      Se evalúa: (1) que reconozcas el paralelo (las 5 preguntas de doña Mercedes ≈ las 5 letras de CRAAP); (2) que menciones al menos 1 diferencia importante (formato académico, alcance digital, velocidad); (3) que des un ejemplo concreto tuyo (un audio de WhatsApp, una noticia en TikTok, un video sospechoso).
    retroalimentacion: |-
      Una buena respuesta mapea cada pregunta de doña Mercedes con una letra de CRAAP: \emph{¿quién? = Authority; ¿cuándo? = Currency; ¿por qué? = Purpose; ¿qué prueba? = Accuracy; ¿quién más? = Relevance/triangulación}. La diferencia: doña Mercedes pensaba en periódicos lentos; tú piensas en redes que mueven mentiras en minutos. El principio es el mismo, la velocidad cambia.
    puntos: 1.0

  practico:
    - numero: 1
      enunciado: |-
        \textbf{Caso}: Sara, estudiante de 6°, debe entregar un documento informativo de 2 páginas sobre ``Cartago, mi ciudad'' al profe de Sociales. Sara quiere que se vea profesional, no como hoja improvisada. \textbf{Escribe a Sara una lista de 7-8 pasos concretos} con las decisiones de formato que debe tomar (fuente, tamaño, márgenes, alineación, lista, tabla o imagen, encabezado/pie, números de página, fuentes citadas).
      criterio: |-
        Se evalúa que la lista (1) incluya al menos 6 elementos de formato concretos; (2) cada paso tenga decisión específica (no ``ponle bonito''); (3) mencione la fuente o referencia (de S9); (4) tenga voz propia.
      retroalimentacion: |-
        Una buena lista dice: ``(1) fuente Arial/Calibri 12; (2) márgenes 2,5 cm; (3) interlineado 1,5; (4) título centrado en negrita; (5) usa 1 lista numerada para 5 lugares de Cartago; (6) incluye 1 imagen con pie de foto; (7) encabezado con tu nombre y pie con número de página; (8) cierra con la fuente: ej. Wikipedia consultada el [fecha], o página de la Alcaldía''.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        \textbf{Caso}: te llega por WhatsApp una imagen que dice ``Hospital de Cartago repartirá mercados gratis a todos los habitantes el próximo viernes, traer cédula''. El mensaje no tiene fuente y la imagen se ve editada. ¿Qué deberías hacer aplicando lo aprendido en S9?
      tipo: opcion_multiple
      opciones:
        - "Reenviarlo a todos mis contactos por si es verdad y para no perderme el mercado."
        - "Aplicar CRAAP: verificar autoría, fecha y prueba; buscar la fuente oficial en la página del hospital o la alcaldía; no reenviar hasta confirmar."
        - "Ir al hospital con mi cédula el viernes sin preguntar a nadie."
        - "Asumir que es verdad porque me lo mandó mi tía."
      respuesta_index: 1
      criterio: |-
        Pregunta de opción múltiple. La respuesta correcta es la 2 (aplicar CRAAP + verificación). Se evalúa que el estudiante reconozca: (a) que la noticia tiene señales de fake (sin fuente, imagen editada, urgencia, promesa gratis); (b) que el camino correcto es verificar antes de reenviar; (c) que la fuente oficial es lo que decide.
      retroalimentacion: |-
        Señales de fake news clásicas: \emph{promesa gratis + sin fuente + imagen editada + urgencia + pedir cédula}. Antes de reenviar, ve a la fuente oficial (hospital, alcaldía). Si no aparece allí, es mentira. Reenviarlo te hace cómplice de basura digital que llena chats y confunde a gente vulnerable.
      puntos: 1.0

  reflexivo:
    enunciado: |-
      \textbf{Lee las 3 voces siguientes}. Después escribe en 1 párrafo (8-10 renglones) cómo tu manera de escribir y buscar en internet se conecta con las 3 ideas:
      (a) Dussel: tu voz como adolescente cuenta tanto como cualquier otra; lo que escribes con criterio importa.
      (b) Marco Aurelio: antes de creer y reenviar, párate, respira y verifica; la prisa es enemiga del juicio.
      (c) Floridi: en la infoesfera tú no solo recibes información, también la produces; eres responsable de lo que aportas.
    voces:
      dussel: |-
        ``Mi escritura como adolescente cuenta. No es ensayo de adultos; es voz propia que merece formato cuidado y fuentes honestas.''
      estoico: |-
        ``Antes de creer y reenviar, párate, respira y verifica. La prisa es la enemiga del juicio.''
      floridi: |-
        ``En la infoesfera no solo recibes información: también la produces. Eres responsable de lo que aportas al ruido o a la claridad.''
    criterio: |-
      Se evalúa: (1) que aplique las 3 voces (no solo una); (2) que conecte cada voz con un aspecto específico del periodo 3 (escribir con criterio, verificar antes de reenviar, ser productor responsable); (3) que tenga voz propia (no parafraseo).
    retroalimentacion: |-
      Una buena respuesta usa Dussel para defender que un texto de 6° con buen formato es voz legítima; Marco Aurelio para hablar de no reenviar audios de WhatsApp en caliente; Floridi para reconocer que cada vez que escribes o compartes algo, sumas o restas claridad al mundo. Las 3 voces dialogan en el párrafo, no aparecen como lista.
    puntos: 1.0

banco_practica:
  - id: "bp-001"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuáles son los dos saberes principales del periodo 3 según la apertura (S1)?
    opciones:
      - "Aprender a programar y a jugar."
      - "Escribir bien con criterio y buscar/evaluar información con criterio."
      - "Memorizar páginas web y descargar juegos."
      - "Comprar computador y arreglarlo."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. P3 entrena el oficio doble de doña Mercedes: \emph{escribir bien + leer crítico}. Las herramientas cambiaron (de cuaderno y periódico a Word e internet), pero el saber es el mismo.
    feedback_incorrecto: |-
      Los dos saberes son: escribir bien con criterio (procesador de texto, formato) y buscar/evaluar información con criterio (búsqueda + CRAAP). Es el ``oficio doble'' del periodo.

  - id: "bp-002"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      Doña Mercedes preguntaba 5 cosas antes de creer una noticia. ¿Cuál NO era una de esas preguntas?
    opciones:
      - "¿Quién lo escribió?"
      - "¿Cuándo lo escribió?"
      - "¿Cuánto cuesta?"
      - "¿Qué prueba tiene?"
    respuesta_index: 2
    feedback_correcto: |-
      Bien. Doña Mercedes no preguntaba el precio; preguntaba: \emph{quién, cuándo, por qué, qué prueba, quién más lo dice}. Esas 5 preguntas siguen siendo CRAAP, 50 años después.
    feedback_incorrecto: |-
      Las 5 preguntas eran: quién, cuándo, por qué, qué prueba, quién más lo dice. El precio no entra. Esas 5 se mapean con CRAAP de S9.

  - id: "bp-003"
    bloom: recordar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es un procesador de texto?
    opciones:
      - "Un programa para hacer videojuegos."
      - "Un programa para escribir, editar y dar formato a documentos (Word, Google Docs, LibreOffice)."
      - "Un teclado especial."
      - "Un buscador de internet."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. El procesador de texto es el programa donde escribes documentos y les das formato. Word, Google Docs y LibreOffice son los más usados.
    feedback_incorrecto: |-
      Un procesador de texto = programa para escribir y dar formato a documentos. Word, Google Docs, LibreOffice Writer. No es buscador ni hardware: es software de escritura.

  - id: "bp-004"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      Estás en Word. ¿Dónde aparecen las opciones de \emph{fuente, tamaño, negrita, alineación}?
    opciones:
      - "En el menú \emph{Archivo}."
      - "En la cinta de la pestaña \emph{Inicio} (la primera y más usada)."
      - "Solo con clic derecho."
      - "En el escritorio del computador."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. La pestaña \emph{Inicio} es la cinta principal: fuente, tamaño, color, negrita, cursiva, subrayado, alineación. Es lo más usado.
    feedback_incorrecto: |-
      La pestaña \emph{Inicio} contiene fuente, tamaño, negrita, cursiva, alineación. \emph{Archivo} es para guardar/abrir/imprimir. Las dos son útiles, cada una con su función.

  - id: "bp-005"
    bloom: recordar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué fuente y tamaño son los más usados para texto académico/escolar?
    opciones:
      - "Comic Sans 18."
      - "Arial o Calibri 11-12 (Times New Roman 12 también)."
      - "Letra cursiva manuscrita."
      - "Cualquier fuente decorativa rara."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Arial/Calibri 11-12 o Times New Roman 12 son los estándares escolares y profesionales. Se leen fácil y se ven serias.
    feedback_incorrecto: |-
      Estándar académico: Arial/Calibri 11-12 o Times New Roman 12. Comic Sans no es académica (parece informal); las fuentes decorativas se ven poco serias en tareas.

  - id: "bp-006"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Tu profe te pide que ``el título quede destacado''. ¿Qué formato es el más razonable?
    opciones:
      - "Título en mayúscula sostenida, subrayado, cursiva y rojo brillante."
      - "Título centrado, en negrita, 2-4 puntos más grande que el cuerpo, en color sobrio."
      - "Título en letra muy pequeña al final del documento."
      - "Título con todos los emojis posibles."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Título centrado + negrita + 2-4 pt más grande es el estándar limpio. No abuses de mayúscula, subrayado y color brillante a la vez: cansa la vista.
    feedback_incorrecto: |-
      Centrado + negrita + 2-4 pt más grande basta. Sobrecargar (mayúscula + subrayado + rojo) se ve infantil y poco profesional. Menos es más en formato.

  - id: "bp-007"
    bloom: recordar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuándo es mejor usar una lista \emph{numerada} en lugar de viñetas?
    opciones:
      - "Cuando los ítems siguen un orden, secuencia o pasos."
      - "Cuando da igual el orden."
      - "Solo cuando hay menos de 3 ítems."
      - "Nunca."
    respuesta_index: 0
    feedback_correcto: |-
      Sí. Numerada = el orden importa (pasos, ranking, cronología). Viñetas = el orden no importa (lista de ideas paralelas).
    feedback_incorrecto: |-
      Numerada cuando hay orden (pasos 1, 2, 3 · ranking · secuencia). Viñetas cuando no (lista de cosas que comparten algo, sin jerarquía). Elegir bien es claridad.

  - id: "bp-008"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Vas a hacer un documento con ``5 lugares turísticos de Cartago, sin importar cuál es más bonito''. ¿Qué tipo de lista usas?
    opciones:
      - "Numerada (porque suena más serio)."
      - "Viñetas (porque no hay jerarquía entre los lugares)."
      - "Sin lista, solo texto corrido en un párrafo gigante."
      - "Lista de letras (A, B, C)."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Como no hay orden de importancia, viñetas es lo correcto. Numerar sugiere ranking, y el caso dice ``sin importar cuál''.
    feedback_incorrecto: |-
      Como no hay jerarquía (\emph{``sin importar cuál''}), van viñetas, no numeración. Numerar implicaría que el primero es ``más importante'', cosa que no quieres aquí.

  - id: "bp-009"
    bloom: recordar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Para qué sirve una \emph{tabla} en un documento?
    opciones:
      - "Para decorar la página."
      - "Para organizar datos en filas y columnas y compararlos fácilmente."
      - "Para hacer que el documento sea más largo."
      - "Para no escribir párrafos."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. La tabla organiza datos en filas y columnas para que la comparación sea inmediata. Por ejemplo: \emph{ciudades vs población}, \emph{años vs evento}.
    feedback_incorrecto: |-
      Una tabla compara datos rápido (filas + columnas). No es decoración: es herramienta de claridad. Si tus datos comparan algo, tabla. Si son texto narrativo, párrafo.

  - id: "bp-010"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Estás escribiendo sobre 5 ciudades del Valle y quieres comparar \emph{nombre, año de fundación y población}. ¿Qué eliges?
    opciones:
      - "Un párrafo largo con todos los datos seguidos."
      - "Una tabla de 6 filas (encabezado + 5 ciudades) y 3 columnas (nombre, año, población)."
      - "Una imagen sin datos."
      - "Solo viñetas, una por ciudad, sin comparar."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Tabla 6×3 hace la comparación inmediata. El lector ubica un dato en segundos. Un párrafo o viñetas no comparan tan claro.
    feedback_incorrecto: |-
      Tabla 6×3 (encabezado + 5 filas, 3 columnas). Cuando comparas datos numéricos o categorías equivalentes, tabla es la mejor herramienta de claridad.

  - id: "bp-011"
    bloom: recordar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué información típica va en el \emph{encabezado} y el \emph{pie de página}?
    opciones:
      - "Solo dibujos sin texto."
      - "Encabezado: nombre, materia, fecha. Pie de página: número de página y a veces fuente."
      - "Encabezado: chistes. Pie: emojis."
      - "Solo el color de fondo."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Encabezado = identifica el documento (nombre, materia, fecha). Pie = número de página y a veces fuente. Convención profesional desde hace décadas.
    feedback_incorrecto: |-
      Encabezado lleva identificación del documento (nombre, materia, fecha, título corto). Pie lleva número de página y a veces fuente. Es convención académica/profesional estable.

  - id: "bp-012"
    bloom: recordar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es internet?
    opciones:
      - "Un solo computador gigante en EE.UU."
      - "Una red mundial de computadoras y servidores conectados entre sí que intercambian datos."
      - "Una sola aplicación."
      - "Un cable submarino."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Internet = red global de redes (computadoras, servidores, routers) que intercambian datos por cables, satélites y antenas.
    feedback_incorrecto: |-
      Internet es una red de redes: computadoras y servidores en todo el mundo, conectados por cables, satélites y antenas, intercambiando datos en formato estándar (TCP/IP).

  - id: "bp-013"
    bloom: comprender
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Cuando entras a una página web, ¿qué ocurre en simplificado?
    opciones:
      - "El computador inventa la página solo."
      - "Tu navegador pide la página a un servidor; el servidor la envía por la red y tu navegador la muestra."
      - "El profe la copia y la pone."
      - "Internet la genera mágicamente."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Modelo cliente-servidor: tu navegador (cliente) pide; el servidor responde con los archivos (HTML, imágenes, video) y el navegador los muestra.
    feedback_incorrecto: |-
      Cliente-servidor: tu navegador pide, el servidor envía la página, tu navegador la muestra. Por eso si el servidor está caído, no ves nada aunque tengas internet.

  - id: "bp-014"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Quieres buscar páginas oficiales de la Alcaldía de Cartago. ¿Cuál búsqueda es más efectiva?
    opciones:
      - "``alcaldía''"
      - "``alcaldía cartago site:gov.co''"
      - "``alcaldía cartago feliz''"
      - "``alcaldía dijiste cartago me digo''"
    respuesta_index: 1
    feedback_correcto: |-
      Sí. El operador \emph{site:gov.co} restringe a dominios oficiales colombianos. Más preciso que la búsqueda libre.
    feedback_incorrecto: |-
      El operador \emph{site:gov.co} restringe a dominios .gov.co (oficiales colombianos). Es la forma más rápida y limpia de llegar a fuentes oficiales sin colarse propaganda.

  - id: "bp-015"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Quieres buscar la frase exacta ``identidad digital responsable'' (sin que Google la rompa en pedazos). ¿Cómo lo escribes?
    opciones:
      - "identidad digital responsable"
      - "``identidad digital responsable''"
      - "identidad+digital+responsable"
      - "identidad-digital-responsable"
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Las comillas dobles fuerzan a Google a buscar la frase tal cual, sin separar palabras. Útil para frases técnicas exactas.
    feedback_incorrecto: |-
      Las comillas \emph{``...''} buscan la frase exacta. Sin comillas, Google puede dispersar las palabras y traerte resultados que no son lo que buscas.

  - id: "bp-016"
    bloom: recordar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué significa CRAAP en evaluación de fuentes?
    opciones:
      - "Currency · Relevance · Authority · Accuracy · Purpose."
      - "Cualquier · Rápido · Asunto · Antiguo · Poco."
      - "Comer · Reír · Andar · Aplaudir · Pensar."
      - "Color · Ratón · Animal · Astro · Pesos."
    respuesta_index: 0
    feedback_correcto: |-
      Sí. CRAAP = \emph{Currency (cuán reciente), Relevance (qué tan pertinente), Authority (quién la firma), Accuracy (qué tan precisa), Purpose (con qué intención)}.
    feedback_incorrecto: |-
      CRAAP = \emph{Currency} (fecha), \emph{Relevance} (relevancia), \emph{Authority} (autoría/quién), \emph{Accuracy} (exactitud), \emph{Purpose} (intención). Las 5 letras evalúan una fuente.

  - id: "bp-017"
    bloom: analizar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Una página dice ``los teléfonos celulares causan cáncer al instante''. No tiene autor, no dice fecha, y la URL es \emph{tudoctorgratis.tk}. ¿Qué CRAAP falla más?
    opciones:
      - "Solo \emph{Currency}."
      - "Solo \emph{Authority}."
      - "Falla \emph{Authority} (sin autor), \emph{Currency} (sin fecha) y \emph{Accuracy} (afirmación extrema sin estudio)."
      - "No falla nada."
    respuesta_index: 2
    feedback_correcto: |-
      Sí. Sin autor, sin fecha y con afirmación extrema sin prueba, fallan 3 criterios CRAAP. Esa página no se cita; se descarta.
    feedback_incorrecto: |-
      Fallan al menos 3 letras de CRAAP: \emph{Authority} (sin autor), \emph{Currency} (sin fecha) y \emph{Accuracy} (afirmación extrema sin estudio). Página descartable; no se cita.

  - id: "bp-018"
    bloom: evaluar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Te llega un audio de WhatsApp con voz urgente que dice: ``Hay una alerta de bomba en el colegio, salgan todos''. ¿Qué haces?
    opciones:
      - "Reenviarlo a todos para alertar a más gente."
      - "Salir corriendo del colegio sin avisar a nadie."
      - "Verificar la fuente: ir al coordinador o profe inmediatamente y NO reenviar hasta confirmar."
      - "Borrarlo y no contarle a nadie."
    respuesta_index: 2
    feedback_correcto: |-
      Bien. Audios urgentes y sin fuente verificada son la receta clásica del rumor que cunde. Pregunta al coordinador o profe en persona; ellos saben si es real.
    feedback_incorrecto: |-
      Verificar primero con autoridad real del colegio (coordinador, profe). Reenviar audios urgentes sin verificar es la forma más rápida de generar pánico injustificado. Borrar sin avisar tampoco: la autoridad debe saber que circula.

  - id: "bp-019"
    bloom: analizar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas señales \emph{NO} es típica de una fake news?
    opciones:
      - "Promete algo demasiado bueno o demasiado terrible."
      - "Cita estudios concretos con autor, fecha y revista."
      - "URL rara con dominios .tk, .info exóticos o letras extrañas."
      - "Pide reenviarlo o actuar con urgencia."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Citar estudios reales con autor, fecha y revista es seña de fuente seria, no de fake. Las otras tres sí son señales típicas.
    feedback_incorrecto: |-
      Citar estudios con autor, fecha y revista es señal de calidad. Las fake suelen: prometer extremos, urgir reenvío, tener URL rara o nada de pruebas verificables.

  - id: "bp-020"
    bloom: aplicar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Estás cerrando tu documento informativo del periodo. ¿Qué NO debe faltar al final?
    opciones:
      - "Solo tu nombre."
      - "Sección de fuentes (al menos 2 fuentes reales con título, autor o entidad, fecha de consulta)."
      - "Solo emojis decorativos."
      - "Nada, se entrega sin firma."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Las fuentes son lo que separa un documento serio de un papel suelto. Mínimo 2, con título + autor/entidad + fecha de consulta.
    feedback_incorrecto: |-
      Sección de fuentes al final es obligatoria en un documento informativo serio. Mínimo 2 fuentes con título, autor o entidad y fecha de consulta. Es honestidad intelectual.

  - id: "bp-021"
    bloom: crear
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Vas a estructurar tu documento de 2 páginas. ¿Cuál orden es el más razonable?
    opciones:
      - "Cierre, título, contenido, introducción, fuentes."
      - "Título + introducción breve + 2-3 secciones con subtítulo + cierre + fuentes."
      - "Solo párrafos sin subtítulos."
      - "Páginas sueltas sin orden."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Estructura clara: título + intro corta + 2-3 secciones con subtítulo (cada una con su párrafo) + cierre + fuentes. Es la estructura más usada en informe escolar.
    feedback_incorrecto: |-
      Orden estándar: título → intro corta → 2-3 secciones con subtítulo → cierre → fuentes. Ese esqueleto lo entiende cualquier lector y te ahorra organizar caótico.

  - id: "bp-022"
    bloom: crear
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Vas a incluir una imagen en tu documento. ¿Qué le pones debajo?
    opciones:
      - "Nada, la imagen habla sola."
      - "Pie de imagen: descripción breve + fuente (de dónde la tomaste o autor)."
      - "El pie de la página."
      - "Solo emojis."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Pie de imagen estándar: \emph{Figura 1: descripción breve. Fuente: [autor o sitio web]}. Es honestidad sobre el origen.
    feedback_incorrecto: |-
      Pie de imagen profesional: descripción breve + fuente (de dónde proviene). Decir de dónde viene una imagen es básico de honestidad académica.

  - id: "bp-023"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Quieres excluir resultados de Wikipedia en una búsqueda de Google. ¿Cuál operador usas?
    opciones:
      - "+wikipedia"
      - "-wikipedia"
      - "*wikipedia*"
      - "&wikipedia"
    respuesta_index: 1
    feedback_correcto: |-
      Bien. El \emph{guion menos} excluye un término. Ejemplo: \emph{historia cartago -wikipedia} → resultados sin Wikipedia.
    feedback_incorrecto: |-
      El guion (\emph{-}) excluye. Útil cuando un término aparece en todos lados y enturbia tu búsqueda. \emph{-wikipedia} te muestra fuentes alternativas.

  - id: "bp-024"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Antes de entregar tu documento informativo, ¿cuál es la mejor verificación final?
    opciones:
      - "Solo revisar que tenga muchas páginas."
      - "Revisar formato (fuente/tamaño/alineación), ortografía, fuentes citadas, encabezado/pie/números y que cumpla lo pedido por el profe."
      - "Solo revisar el color del título."
      - "Mandarlo sin leerlo."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Checklist final: formato + ortografía + fuentes + encabezado/pie/numeración + cumplir lo pedido. 5 minutos de revisión te suben la nota entera.
    feedback_incorrecto: |-
      Checklist final: formato consistente, ortografía, fuentes citadas, encabezado/pie/números, cumplir lo pedido por el profe. Revisar 5 minutos antes de entregar es la mejor inversión.

  - id: "bp-025"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cómo insertas \emph{números de página} en Word?
    opciones:
      - "Escribiéndolos a mano uno por uno al pie de cada página."
      - "Pestaña Insertar → Número de página → eliges posición (pie, centro, derecha)."
      - "No se pueden insertar números."
      - "Solo con clic derecho en cualquier parte."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Pestaña \emph{Insertar} → \emph{Número de página}. Word los agrega automáticamente y los actualiza si agregas o quitas páginas. Profesional.
    feedback_incorrecto: |-
      Pestaña \emph{Insertar} → \emph{Número de página} → eliges posición. Word los pone automáticamente; nunca a mano (si agregas una página, se descuadra todo).

  - id: "bp-026"
    bloom: analizar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas afirmaciones sobre internet es FALSA?
    opciones:
      - "Internet es una red mundial de redes."
      - "Internet funciona por cables submarinos, antenas, satélites y servidores."
      - "Internet es lo mismo que la World Wide Web (las páginas web)."
      - "Internet tiene reglas técnicas (protocolos) para que computadoras de diferentes marcas se entiendan."
    respuesta_index: 2
    feedback_correcto: |-
      Bien. Internet $\neq$ Web. La Web es una capa de internet (páginas con URL). Internet también tiene correo, mensajería, videollamada, juegos en línea, etc.
    feedback_incorrecto: |-
      Internet es la red completa (cables, servidores, protocolos). La Web (páginas web) es una parte de internet. También están correo, mensajería, juegos, etc. Confundirlos es común.

cierre: |-
  Cierras el grado 6° con el oficio doble de doña Mercedes en versión digital: \emph{escribes con formato} y \emph{verificas antes de creer}. En grado 7° subes a colaborar en la nube (Microsoft 365), programar tus primeros pasos (Scratch) y conocer la IA con criterio.

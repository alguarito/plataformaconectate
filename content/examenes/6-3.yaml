clave: "6-3"
grado: 6
periodo: 3
completo: true

titulo: "Examen final · Escribir y buscar con criterio"
titulo_portada: |-
  Examen final ---
  Escribir
  y buscar
  con criterio

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo entiendes lo aprendido, no cuánto repites.
  En las preguntas abiertas, justifica con ejemplos del periodo. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses celular ni internet durante el examen.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural de la vereda La Plata de Cartago enseñaba dos cosas que valían oro: a escribir bien y a leer críticamente.} En su escuelita del campo, los niños aprendían primero a \textbf{ordenar las ideas en el cuaderno} antes de escribir (\emph{``primero pensar, después escribir''}, decía). Después aprendían a \textbf{verificar las noticias} que llegaban de fuera (\emph{``no todo lo que dice el periódico es verdad''}, repetía). Cuando un vecino le mostraba un papel con noticia sospechosa, doña Mercedes preguntaba cinco cosas: \emph{¿quién lo escribió?, ¿cuándo lo escribió?, ¿por qué lo escribió?, ¿qué prueba tiene?, ¿quién más lo dice?}. Ese saber doble --- \emph{escribir bien y leer crítico} --- la convirtió en figura respetada durante décadas. Sus exalumnos, ya adultos, sabían redactar cartas formales, escribir peticiones al alcalde y desconfiar de promesas falsas. Hoy, 50 años después, ese mismo saber doble sigue siendo el más útil, pero la herramienta cambió: ya no es solo cuaderno y periódico, ahora también es Word, Google Docs, Wikipedia, TikTok, WhatsApp. \textbf{Quien sabe escribir y leer crítico hoy, no lo engañan; quien no, queda a merced de cualquier audio falso.}

  contexto: |-
    Este examen cierra el periodo 3 de grado 6°, donde aprendiste \textbf{el oficio doble de escribir y buscar con criterio en internet}: el procesador de texto y sus partes (S2), formato básico (S3), listas y numeración (S4), tablas e imágenes (S5), encabezados, pies y numeración profesional (S6), qué es internet y cómo viajan los datos (S7), técnicas para buscar bien (S8), evaluar fuentes con CRAAP y detectar fake news (S9), y producir un documento informativo completo (S10).

  pregunta_marco: |-
    ¿Cómo cruza el oficio de doña Mercedes, la maestra rural de Cartago, con tu manera de escribir y buscar información en internet hoy?

aprendizajes:
  - sesion: 1
    titulo: "Apertura periodo 3: el oficio de escribir y buscar con criterio"
  - sesion: 2
    titulo: "¿Qué es un procesador de texto? Word, Google Docs y sus partes"
  - sesion: 3
    titulo: "Formato básico: fuente, tamaño, negrita, cursiva, alineación"
  - sesion: 4
    titulo: "Listas, viñetas y numeración"
  - sesion: 5
    titulo: "Tablas e imágenes en un documento"
  - sesion: 6

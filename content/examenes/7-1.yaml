examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un primo de 6° lo más importante que aprendiste este periodo sobre trabajar en equipo en la nube, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} concretas (no más, no menos). Evita frases vacías como ``la nube es buena'': sé específico con vocabulario del periodo (OneDrive, coautoría, permisos, historial de versiones, comentarios, etc.).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas y específicas. (2) que se nombren al menos \textbf{dos conceptos técnicos} del periodo (ej. coautoría, permisos, historial, OneDrive). (3) que se note \textbf{voz propia} (no copia de la guía) y un ejemplo concreto.
    retroalimentacion: |-
      Una buena respuesta menciona conceptos del periodo (qué es coautoría asincrónica, cómo se asignan permisos de \emph{ver/comentar/editar}, cómo recupera versiones antiguas) y cierra con una idea aterrizada. Si solo dice ``la nube ayuda'' sin nombres, falta voz propia y vocabulario.
    puntos: 1.0

  contexto:
    enunciado: |-
      La minga del Valle reunía 20-30 vecinos para una sola cosecha: trabajaban al tiempo, en surcos distintos, sin estorbarse, con reciprocidad. \textbf{Compara la minga con tu equipo de 3 trabajando en un Word compartido}: ¿qué tienen en común? ¿En qué se diferencian? Responde en 6-8 renglones con \textbf{un ejemplo concreto} de algo que ya hiciste en este periodo en Microsoft 365 que te recuerde a la minga.
    criterio: |-
      Se evalúa: (1) que reconozcas el paralelo (trabajo paralelo + reciprocidad + organización + no estorbarse); (2) que menciones al menos 1 diferencia importante (geografía, sincronía, escala); (3) que des un ejemplo concreto tuyo (\emph{``cuando hicimos el ensayo con María y Luis, cada uno en una sección''}).
    retroalimentacion: |-
      Una buena respuesta nota que la minga y la coautoría comparten \emph{trabajo paralelo + reciprocidad + organización + no estorbarse}. Diferencias: la minga era presencial, mismo día; la coautoría puede ser asincrónica y a distancia. Ejemplo: \emph{``con María y Luis hicimos el Word: cada uno una sección, mismo día, sin pelear por el archivo''}.
    puntos: 1.0

  practico:
    - numero: 1
      enunciado: |-
        \textbf{Caso}: tu equipo de 3 (Juan, Sara y tú) tiene que entregar un informe sobre los oficios de Cartago en Word para el viernes. Tienen 5 días. \textbf{Escribe un plan colaborativo de 8 pasos concretos} usando lo aprendido del periodo: crear archivo, ubicarlo en OneDrive, compartir con permisos correctos, dividir secciones, usar comentarios para revisar, usar historial si algo se daña, y entregar al profe.
      criterio: |-
        Se evalúa que el plan (1) incluya al menos 7 pasos concretos; (2) mencione OneDrive, permisos, división de secciones, comentarios, e historial; (3) tenga responsable claro en cada paso (\emph{``Juan abre el Word''}); (4) tenga voz propia.
      retroalimentacion: |-
        Un buen plan dice: ``(1) Juan crea el Word en OneDrive; (2) lo comparte con Sara y conmigo con permiso \emph{editar}; (3) acordamos en Teams que cada uno toma una sección; (4) Sara hace introducción, yo cuerpo, Juan cierre; (5) usamos comentarios para sugerir cambios; (6) si algo se daña, vamos al historial de versiones; (7) revisión final el jueves; (8) viernes Juan exporta a PDF y se lo envía al profe por Outlook''.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        \textbf{Caso}: en un trabajo en equipo, Sara borra sin querer un párrafo importante de la introducción que tú habías escrito. Es jueves en la tarde y faltan 18 horas para entregar al profe. ¿Qué deberías hacer aplicando S8?
      tipo: opcion_multiple
      opciones:
        - "Reescribir el párrafo de memoria a la carrera y regañar a Sara públicamente en el chat del equipo."
        - "Ir al \\emph{Historial de versiones} del archivo, recuperar la versión anterior con el párrafo, y avisar a Sara con calma para que no vuelva a pasar."
        - "Borrar todo el documento por venganza."
        - "Llamar al profe para acusar a Sara."
      respuesta_index: 1
      criterio: |-
        Pregunta de opción múltiple. La respuesta correcta es la 2 (historial de versiones + comunicación calmada). Se evalúa que el estudiante reconozca: (a) que en Microsoft 365 toda edición queda en el historial; (b) que la solución es técnica (recuperar versión) + relacional (avisar con calma); (c) que reescribir o castigar son respuestas pobres.
      retroalimentacion: |-
        Microsoft 365 guarda el historial de versiones automáticamente. Vas a \emph{Archivo → Historial} y restauras la versión anterior. Avisas a Sara con calma: \emph{``oye, recuperé el párrafo del historial, ten cuidado de no borrar al editar''}. Solución técnica + humana, no escándalo.
      puntos: 1.0

  reflexivo:
    enunciado: |-
      \textbf{Lee las 3 voces siguientes}. Después escribe en 1 párrafo (8-10 renglones) cómo tu equipo de 7° se conecta con las 3 ideas al colaborar en la nube:
      (a) Dussel: la voz de cada compañero del equipo cuenta; nadie sobra.
      (b) Marco Aurelio: lo que escribes en un Word compartido queda; escribe pensando en quien va a leer mañana.
      (c) Floridi: la nube es ambiente; cuidar lo que pones allí es cuidar la infoesfera de tu equipo.
    voces:
      dussel: |-
        ``Cada compañero del equipo es una voz que cuenta. Tu rol no es opacar; es sumar. Como en la minga: nadie estorba al otro.''
      estoico: |-
        ``Lo que escribes en un Word compartido queda en el historial. Escribe pensando en quien va a leer mañana.''
      floridi: |-
        ``La nube no es un cajón vacío: es ambiente compartido. Cuidar lo que pones allí es cuidar la infoesfera de tu equipo.''
    criterio: |-
      Se evalúa: (1) que aplique las 3 voces (no solo una); (2) que conecte cada voz con un aspecto específico del periodo 1 (coautoría, historial, comentarios, permisos); (3) que tenga voz propia (no parafraseo).
    retroalimentacion: |-
      Una buena respuesta usa Dussel para defender que cada compañero --- aun el tímido --- aporta; Marco Aurelio para hablar del historial y de escribir con cuidado; Floridi para reconocer que la nube es ambiente común que se cuida. Las 3 voces dialogan en el párrafo, no aparecen como lista.
    puntos: 1.0

banco_practica:
  - id: "bp-001"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es la \emph{minga} del Valle del Cauca según la apertura (S1)?
    opciones:
      - "Una fiesta del barrio sin trabajo."
      - "Un sistema de trabajo colaborativo donde 20-30 vecinos cosechan al tiempo, en surcos distintos, sin estorbarse, con reciprocidad."
      - "Una herramienta tecnológica reciente."
      - "Una marca de café del Valle."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. La minga es trabajo colectivo paralelo con reciprocidad. La metáfora ancla el periodo: Microsoft 365 es la \emph{minga digital}.
    feedback_incorrecto: |-
      La minga reúne 20-30 vecinos a trabajar al tiempo en una sola obra, sin estorbarse, con reciprocidad. Esa misma idea es la coautoría en la nube hoy.

  - id: "bp-002"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Por qué la minga sigue siendo buena metáfora para Microsoft 365?
    opciones:
      - "Porque ambos cuestan dinero."
      - "Porque comparten 4 ideas: trabajo paralelo, no estorbarse, organización y reciprocidad."
      - "Porque ambos se hacen los sábados."
      - "Porque ambos terminan con sancocho."
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Las 4 ideas (paralelo, no estorbar, organización, reciprocidad) son la columna vertebral de la minga y de la coautoría digital.
    feedback_incorrecto: |-
      Las 4 ideas que se cruzan: trabajo paralelo + no estorbarse + organización + reciprocidad. La herramienta cambió (de canasta a Word); la sabiduría es la misma.

  - id: "bp-003"
    bloom: recordar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es Microsoft 365?
    opciones:
      - "Un solo programa para escribir."
      - "Una suite de aplicaciones en la nube (Word, Excel, PowerPoint, OneDrive, Teams, Outlook) que funcionan desde el navegador."
      - "Una marca de computador."
      - "Un sistema operativo."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Microsoft 365 es un \emph{paquete} de aplicaciones en la nube: Word, Excel, PowerPoint, OneDrive, Teams, Outlook. Trabajan desde el navegador y se sincronizan.
    feedback_incorrecto: |-
      Microsoft 365 es una suite (varias aplicaciones juntas) en la nube. No es un solo programa ni un sistema operativo. Su gracia es que el archivo vive en la nube, no en tu disco.

  - id: "bp-004"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la diferencia clave entre Office tradicional y Microsoft 365?
    opciones:
      - "No hay diferencia, son lo mismo."
      - "Office tradicional vive en tu computador; Microsoft 365 vive en la nube y permite coautoría desde el navegador."
      - "Office tradicional es para niños; 365 para adultos."
      - "365 es solo para Mac."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. La diferencia es \emph{dónde vive el archivo}: en el disco local (Office) o en la nube con sincronización (365). El segundo permite coautoría real.
    feedback_incorrecto: |-
      Office tradicional = archivo en disco; 365 = archivo en nube + coautoría desde navegador. Ambos hacen Word, Excel, PowerPoint. La diferencia es la nube.

  - id: "bp-005"
    bloom: recordar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es OneDrive?
    opciones:
      - "Un disco duro externo físico."
      - "La nube personal asociada a tu cuenta de Microsoft (1 TB por estudiante en muchas licencias escolares)."
      - "Una aplicación para hacer videos."
      - "Un buscador de internet."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. OneDrive es tu nube personal: 1 TB típico para cuenta escolar. Tus archivos viven allí y se sincronizan al computador, celular o navegador.
    feedback_incorrecto: |-
      OneDrive = nube personal de Microsoft. No es disco físico ni un programa para videos. Es donde viven tus archivos del estudio, sincronizados en todos tus dispositivos.

  - id: "bp-006"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Tu laptop personal se daña la noche antes de entregar una tarea importante. Si tenías el archivo en OneDrive, ¿qué pasa?
    opciones:
      - "Pierdes la tarea, hay que rehacerla."
      - "El archivo está sano en OneDrive: lo abres desde otro computador, celular o el navegador y lo entregas."
      - "El archivo se borra automáticamente."
      - "Solo lo recupera un técnico."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Esa es la magia de la nube: el archivo no depende de tu computador. Se accede desde cualquier dispositivo con tu cuenta.
    feedback_incorrecto: |-
      Si el archivo está en OneDrive, el computador es solo una ventana. Entras desde el navegador en otro equipo, lo descargas o lo entregas directo. La nube es respaldo automático.

  - id: "bp-007"
    bloom: comprender
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la principal ventaja de usar Word, Excel o PowerPoint \emph{en línea} (en el navegador)?
    opciones:
      - "Tienen más funciones que la versión de escritorio."
      - "Permiten que varios editen el mismo archivo al tiempo (coautoría) sin instalarse en el computador."
      - "Son siempre más rápidos."
      - "Solo funcionan con internet por cable."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. La versión en línea es la puerta a la coautoría: 2-3 personas editando al tiempo desde el navegador. Tiene menos funciones avanzadas que escritorio pero gana en colaboración.
    feedback_incorrecto: |-
      La versión en línea permite coautoría real desde navegador sin instalar nada. Las versiones de escritorio tienen más funciones, pero la web tiene la ventaja de colaboración instantánea.

  - id: "bp-008"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Vas a compartir un Word con tu equipo. ¿Qué permiso le das a tus 2 compañeros que van a redactar contigo?
    opciones:
      - "Solo lectura: que vean pero no escriban."
      - "Edición: que puedan escribir y editar el documento."
      - "Comentarios: que solo puedan poner notas pero no editar."
      - "Ninguno, mejor no compartir."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Si van a redactar contigo, necesitan \emph{Edición}. Si fueran solo revisores, sería \emph{Comentarios}. Si fueran solo lectores, \emph{Lectura}.
    feedback_incorrecto: |-
      3 permisos: \emph{Lectura} (solo ver), \emph{Comentarios} (ver + comentar sin editar), \emph{Edición} (todo). Para coautores activos: edición. Para revisores: comentarios. Para audiencia: lectura.

  - id: "bp-009"
    bloom: analizar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Tu profe te pide compartir un documento ``con permiso de comentarios pero no de edición''. ¿Por qué crees que pide ese permiso específico?
    opciones:
      - "Porque le gusta complicar."
      - "Porque quiere revisar y sugerir cambios sin alterar lo que tú escribiste; la versión que se entrega sigue siendo tuya."
      - "Porque no sabe usar la edición."
      - "Porque siempre comenta antes de leer."
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Comentarios es perfecto para revisión: el revisor sugiere y opina sin tocar tu texto. Tú decides qué aceptar. Aprendizaje sin atropello.
    feedback_incorrecto: |-
      El permiso \emph{Comentarios} mantiene tu autoría intacta y permite que el revisor (el profe) opine. Es el permiso ideal para revisión académica.

  - id: "bp-010"
    bloom: recordar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es la \emph{coautoría asincrónica}?
    opciones:
      - "Dos personas editan al mismo segundo el mismo archivo."
      - "Varias personas editan el mismo archivo, pero en momentos distintos, sin pelear por el archivo ni perder cambios."
      - "Solo una persona puede editar a la vez."
      - "Edición que se hace solo de noche."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Asincrónica = en momentos distintos. Cada uno entra a su ritmo, edita su parte, guarda. Microsoft 365 fusiona los cambios automáticamente.
    feedback_incorrecto: |-
      Asincrónica = no al mismo tiempo. Cada coautor entra cuando puede y edita. La nube guarda los cambios y no pelean por el archivo. Es lo más usado en equipos reales.

  - id: "bp-011"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Sara está editando el Word a las 3 pm. Tú entras a las 7 pm a la misma sección. ¿Qué pasa?
    opciones:
      - "Pierdes los cambios de Sara."
      - "Ves sus cambios ya guardados (estaba a las 3, ya cerró); editas sobre lo último."
      - "El archivo se daña."
      - "Hay que pedir permiso por chat."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Sara guardó al cerrar; el archivo en nube tiene su versión última. Tú abres y editas sobre lo último. Asincronía limpia.
    feedback_incorrecto: |-
      Microsoft 365 sincroniza al guardar. Cuando entres a las 7 verás lo último de Sara. Editas sobre eso. Sin pelear por archivos ni perder versiones.

  - id: "bp-012"
    bloom: recordar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué herramienta usas para sugerir un cambio sin modificar el texto del compañero?
    opciones:
      - "Borrar y reescribir directamente."
      - "Insertar un \\emph{Comentario} (pestaña Revisar → Nuevo comentario) con tu sugerencia."
      - "Mandarle WhatsApp."
      - "Cambiar el color de toda la página."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. \emph{Insertar comentario} es la forma profesional de sugerir cambios sin pisar el texto del compañero. El autor decide si acepta.
    feedback_incorrecto: |-
      \emph{Comentarios} sirven para sugerir sin modificar. El autor lee, decide si acepta, y marca como resuelto. Respetar la autoría del otro es clave en coautoría.

  - id: "bp-013"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Un compañero pone un comentario en tu párrafo: ``revisar gramática''. ¿Qué haces?
    opciones:
      - "Ignorarlo siempre."
      - "Leer, corregir si tiene razón, responder al comentario o marcarlo como resuelto."
      - "Borrar el comentario sin mirar."
      - "Borrar el documento por venganza."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Lees, corriges si aplica, respondes y marcas como resuelto. Es ciclo de revisión sano: alguien ayuda, tú agradeces editando.
    feedback_incorrecto: |-
      Ciclo correcto: leer → evaluar → corregir si aplica → responder al comentario → marcarlo como resuelto. Ignorar o borrar es cerrarse al aprendizaje.

  - id: "bp-014"
    bloom: recordar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es el \emph{historial de versiones} en Microsoft 365?
    opciones:
      - "Una lista de los usuarios del archivo."
      - "Un registro automático de todas las versiones guardadas del archivo, que permite recuperar una versión anterior si algo se daña."
      - "Una papelera de archivos borrados."
      - "Un cuento sobre el archivo."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. El historial guarda copias automáticas. Si alguien borra o daña algo, puedes recuperar la versión previa con un par de clics.
    feedback_incorrecto: |-
      Historial = todas las versiones guardadas automáticamente. Útil cuando algo se daña: vas a \emph{Archivo → Historial}, eliges una versión y la restauras.

  - id: "bp-015"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Tu compañera borra sin querer un párrafo importante en el Word del equipo. ¿Cuál es el camino correcto?
    opciones:
      - "Reescribirlo de memoria a la carrera."
      - "Ir al \\emph{Historial de versiones}, restaurar la versión anterior con el párrafo, avisar al equipo con calma."
      - "Pelear con la compañera por chat."
      - "Borrar todo el documento."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Historial + comunicación con calma. Solución técnica + humana, no escándalo. Eso es trabajar en equipo en la nube.
    feedback_incorrecto: |-
      Historial recupera lo perdido. Después avisas con calma para que no vuelva a pasar (\emph{``oye, cuidado al editar, recuperé el párrafo del historial''}). Sin escándalos.

  - id: "bp-016"
    bloom: recordar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Para qué sirve Outlook en la suite de Microsoft 365?
    opciones:
      - "Para escribir documentos largos."
      - "Para gestionar correo, calendario y citas."
      - "Para editar fotos."
      - "Para jugar."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Outlook = correo + calendario + citas. Es la pieza de comunicación de M365: te avisa de reuniones, envía y recibe correos, organiza la agenda.
    feedback_incorrecto: |-
      Outlook es correo + calendario + citas. Es a Microsoft 365 lo que Gmail+Calendar es a Google. Permite comunicación formal y agenda compartida.

  - id: "bp-017"
    bloom: aplicar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu equipo de 3 va a hacer una reunión virtual de 30 minutos para alinear el proyecto. ¿Qué herramienta de M365 usas?
    opciones:
      - "PowerPoint."
      - "Microsoft Teams (videoconferencia, chat y compartir pantalla)."
      - "Excel."
      - "OneDrive a secas."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Teams es la pieza de reunión virtual: video, chat, compartir pantalla. PowerPoint es para presentaciones, no para conectar voz/video.
    feedback_incorrecto: |-
      Teams = videoconferencia + chat + compartir pantalla + grabar reunión. Es la herramienta para reunirse virtual. PowerPoint, Word y Excel son archivos, no reunión.

  - id: "bp-018"
    bloom: aplicar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu profe te invita a una reunión por Teams. ¿Cómo te aceptas la invitación correctamente?
    opciones:
      - "Ignorar la invitación."
      - "Abrir el correo (Outlook), aceptar la invitación; se agrega al calendario; el día de la reunión, hacer clic en el enlace de Teams."
      - "Llamar al profe por teléfono."
      - "Esperar a que el profe te recuerde."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Aceptar en Outlook → se agrega al calendario → clic al enlace el día de la reunión. Es flujo formal.
    feedback_incorrecto: |-
      Flujo: aceptar en Outlook → se agenda → el día, clic al enlace de Teams. Aceptar la invitación es cortesía profesional y confirma asistencia.

  - id: "bp-019"
    bloom: crear
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Vas a sustentar tu proyecto colaborativo del periodo. ¿Cuál estructura es la más profesional?
    opciones:
      - "Hablo de lo que se me ocurra."
      - "5 min con 4 partes: 1 min reto + 2 min producto colaborativo + 1 min cómo trabajamos (división, comentarios, historial) + 1 min cierre."
      - "Solo leo el documento entero."
      - "Solo dice el nombre del equipo."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Las 4 partes en 5 minutos: reto + producto + proceso + cierre. Estructura clara comunica trabajo serio, no improvisación.
    feedback_incorrecto: |-
      Estructura profesional en 5 min: reto (1) + producto (2) + proceso colaborativo (1) + cierre (1). Mostrar el \emph{cómo} (división, comentarios, historial) vale tanto como el qué.

  - id: "bp-020"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Tu equipo termina el proyecto pero un compañero hizo el 80\% del trabajo y los otros 2 muy poco. ¿Qué dice la rúbrica de trabajo colaborativo?
    opciones:
      - "Está bien, no importa quién hizo qué."
      - "Un proyecto colaborativo desigual no cumple la rúbrica: la nota baja, y el aprendizaje principal (trabajar como minga) no se logró."
      - "El compañero que más hizo merece toda la nota."
      - "Hay que castigar a los otros dos."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Coautoría desigual no cumple el aprendizaje del periodo. La rúbrica baja la nota porque la idea no era ``alguien lo hace por mí''. La minga es paralela y recíproca.
    feedback_incorrecto: |-
      Coautoría desigual no es coautoría. La rúbrica baja la nota porque el aprendizaje (trabajar como minga) no se logró. El historial muestra quién aportó qué.

  - id: "bp-021"
    bloom: analizar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas afirmaciones sobre Word, Excel y PowerPoint en línea es FALSA?
    opciones:
      - "Permiten coautoría desde el navegador."
      - "Sus archivos se guardan automáticamente en OneDrive."
      - "Tienen exactamente las mismas funciones que las versiones de escritorio."
      - "Son gratis con cuenta escolar de M365."
    respuesta_index: 2
    feedback_correcto: |-
      Bien. La versión web tiene MENOS funciones avanzadas que la de escritorio (faltan opciones de combinación de correspondencia, macros avanzadas, etc.). Pero gana en colaboración.
    feedback_incorrecto: |-
      La web tiene menos funciones avanzadas que escritorio (macros, opciones avanzadas, etc.). Su ventaja real es coautoría en tiempo real desde cualquier navegador.

  - id: "bp-022"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      Estás en la sala de sistemas. Tu cuenta escolar tiene Microsoft 365. ¿Cómo accedes a tu OneDrive desde el navegador?
    opciones:
      - "Descargas una app rara."
      - "Entras a \\emph{office.com}, inicias sesión con tu cuenta institucional y haces clic en OneDrive."
      - "Llamas al técnico."
      - "Pides clave a un compañero."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. \emph{office.com} + cuenta institucional + clic en el ícono de OneDrive. Es el flujo estándar para acceder desde cualquier navegador.
    feedback_incorrecto: |-
      \emph{office.com} → sesión con cuenta escolar → ícono OneDrive. Ese es el portal estándar. No descargas nada raro ni pides clave a otros (nunca compartas tu clave).

  - id: "bp-023"
    bloom: evaluar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Un compañero te pide que le des permiso de edición a un primo suyo que no es del colegio. ¿Qué haces aplicando criterio de S5?
    opciones:
      - "Le doy edición porque me lo pidieron."
      - "Niego o consulto al profe: el archivo escolar lo edita el equipo escolar, no externos sin permiso."
      - "Le doy edición y borro la cuenta del compañero."
      - "Lo ignoro y no respondo."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Criterio: archivos escolares = equipo escolar. Externos sin permiso, no entran. Si hay duda, se consulta al profe. Permisos no es regalo automático.
    feedback_incorrecto: |-
      Permisos se cuidan: archivos escolares se editan dentro del equipo escolar. Externos sin permiso, no entran. Si hay duda válida, se consulta al profe antes.

  - id: "bp-024"
    bloom: crear
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Vas a dividir el trabajo entre 3 coautores en un Word. ¿Cuál estrategia es la más limpia?
    opciones:
      - "Todos editan donde se les ocurra y veremos al final."
      - "Cada uno toma una sección distinta (intro, cuerpo, cierre); usamos comentarios para sugerencias; revisión final juntos."
      - "Uno solo hace todo."
      - "Hacemos 3 archivos separados y los uniremos a mano."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. División por secciones + comentarios para sugerencias + revisión final = coautoría limpia. Como en la minga: cada uno en su surco, todos en una sola obra.
    feedback_incorrecto: |-
      División por secciones, comentarios para sugerir, revisión final juntos. Esa es la coautoría que aprovecha M365. Editar caóticamente o hacer archivos separados anula la ventaja.

  - id: "bp-025"
    bloom: comprender
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué significa que OneDrive ``sincroniza'' tus archivos?
    opciones:
      - "Que los borra cada noche."
      - "Que mantiene la misma versión del archivo actualizada en la nube y en todos tus dispositivos conectados a tu cuenta."
      - "Que solo funciona en uno."
      - "Que te cobra cada vez."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Sincronizar = mantener todas las copias iguales. Si edito en el celular, al rato veo el cambio en el computador. La nube es el ``punto único de verdad''.
    feedback_incorrecto: |-
      Sincronizar significa que la versión más reciente está en todos lados (nube + dispositivos). Editas en uno, aparece en los otros. Sin sincronizar, tendrías versiones distintas.

cierre: |-
  Cierras el periodo 1 de grado 7° con la \emph{minga digital} en marcha: ya sabes cómo trabajar en equipo en la nube con criterio. El periodo 2 te lleva al oficio que viene: vas a aprender a \emph{pensar como computadora} (algoritmos, variables, Scratch) y a construir tu primer programa.

clave: "7-1"
grado: 7
periodo: 1
completo: true

titulo: "Examen final · Trabajo colaborativo en la nube"
titulo_portada: |-
  Examen final ---
  Trabajo
  colaborativo
  en la nube

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo entiendes lo aprendido, no cuánto repites.
  En las preguntas abiertas, justifica con ejemplos del periodo. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses celular ni internet durante el examen.

apertura:
  saber_ancestral: |-
    \textbf{Cuando un campesino del Valle del Cauca necesitaba cosechar 5 hectáreas de café, no lo hacía solo.} En las veredas alrededor de Cartago, antes de las máquinas grandes, existía \textbf{la minga} (también \emph{convite} o \emph{mano de vuelta}, según la zona). El dueño del cafetal mandaba aviso un sábado: llegaban 20 o 30 vecinos con sus canastas. Cada uno se ubicaba en un surco distinto. \emph{Nadie estorbaba al otro}: trabajaban al tiempo, en partes diferentes, pero \emph{en la misma obra}. Las mujeres preparaban sancocho grande y al mediodía todos se sentaban juntos a comer. La minga terminaba en un día lo que una sola persona habría hecho en un mes. Al siguiente sábado, los mismos vecinos iban a la finca del vecino. \textbf{Reciprocidad, organización, trabajo paralelo, comida compartida.} Esa idea --- muchos trabajando juntos en una sola obra, organizados y con reciprocidad --- es exactamente lo que hoy llamamos \textbf{trabajo colaborativo en la nube}. Microsoft 365 y OneDrive son la minga digital. Lo nuevo es la herramienta; lo viejo es la sabiduría.

  contexto: |-
    Este examen cierra el periodo 1 de grado 7°, donde aprendiste a \textbf{trabajar en equipo en la nube} usando Microsoft 365: qué es la nube y por qué cambia el trabajo en grupo (S2), tu OneDrive personal (S3), Word, Excel y PowerPoint en línea (S4), compartir con permisos correctos (S5), coautoría asincrónica (S6), comentarios y sugerencias (S7), versiones e historial (S8), Outlook y Teams (S9) y un proyecto colaborativo final (S10).

  pregunta_marco: |-
    ¿Cómo cruza la \emph{minga} de las veredas de Cartago con la forma en que tú y tus compañeros ahora colaboran en Microsoft 365?


clave: "7-2"
grado: 7
periodo: 2
completo: true

titulo: "Examen final · Algoritmia y pensamiento computacional"
titulo_portada: |-
  Examen final ---
  Algoritmia
  y pensamiento
  computacional

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo entiendes lo aprendido, no cuánto repites.
  En las preguntas abiertas, justifica con ejemplos del periodo. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses celular ni internet durante el examen.

apertura:
  saber_ancestral: |-
    \textbf{Antes de que existieran los computadores, las abuelas tejedoras del Valle del Cauca ya sabían ``programar''.} Cuando doña Sofía, en una vereda de Cartago, se sentaba a tejer un canasto de fibra de plátano, no improvisaba: \textbf{seguía un algoritmo}. Empezaba con 8 hebras cruzadas en el centro (\emph{paso 1}), pasaba la hebra de la derecha sobre 2 y por debajo de la siguiente (\emph{paso 2 que se repite}), contaba hasta 12 puntos (\emph{condicional: si llegó, cambio de hebra}), y volvía al patrón. En 1 hora salía la pared del canasto. Si te detenías a verla, descubrías: \emph{secuencia} (pasos en orden), \emph{repetición} (el patrón se repite cientos de veces), \emph{condicionales} (cuando se llega al borde, se cambia), \emph{variables} (contar puntos en la cabeza). \textbf{Eso es exactamente lo que hace un computador.} Las mochilas Wayuu, los sombreros aguadeños, los canastos del Cauca: todos son algoritmos visuales transmitidos durante siglos sin pantallas. Este periodo te entrenó en el mismo oficio en lenguaje computacional.

  contexto: |-
    Este examen cierra el periodo 2 de grado 7°, donde aprendiste a \textbf{pensar como computadora}: qué es un algoritmo (S2), las 4 técnicas del pensamiento computacional (S3), diagramas de flujo (S4), variables como cajas con etiqueta (S5), condicionales \emph{si... entonces} (S6), bucles (S7), tus primeros programas en Scratch (S8 y S9) y la cosecha (S10).

  pregunta_marco: |-
    ¿Cómo cruza el oficio de doña Sofía la tejedora del Valle con tu nuevo oficio de programar en Scratch?

aprendizajes:
  - sesion: 1
    titulo: "Apertura: las tejedoras como primeras programadoras"
  - sesion: 2
    titulo: "¿Qué es un algoritmo? Receta de cocina vs algoritmo"
  - sesion: 3
    titulo: "Pensamiento computacional: descomposición, patrones, abstracción, algoritmo"
  - sesion: 4
    titulo: "Diagramas de flujo: visualizar un algoritmo paso a paso"
  - sesion: 5
    titulo: "Variables: cajas con etiqueta que guardan valor"
  - sesion: 6
    titulo: "Condicionales si... entonces (y si no)"
  - sesion: 7
    titulo: "Bucles: repetir un bloque de pasos N veces"
  - sesion: 8
    titulo: "Scratch: mi primer programa con movimiento"
  - sesion: 9
    titulo: "Scratch: narrativa interactiva con condiciones"
  - sesion: 10
    titulo: "Cosecha: mi primer programa completo"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un primo de 6° lo más importante que aprendiste este periodo sobre algoritmia y Scratch, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} concretas (no más, no menos). Evita frases vacías como ``programar es chévere'': sé específico con vocabulario del periodo (algoritmo, secuencia, variable, condicional, bucle, descomposición, etc.).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas y específicas. (2) que se nombren al menos \textbf{dos conceptos técnicos} del periodo (ej. variable, bucle, condicional, descomposición). (3) que se note \textbf{voz propia} (no copia de la guía) y un ejemplo concreto.
    retroalimentacion: |-
      Una buena respuesta menciona conceptos del periodo (qué es un algoritmo, qué hacen las variables, los condicionales y los bucles) y cierra con una idea que un primo de 11 años entienda. Si solo dice ``programar es divertido'', falta voz propia.
    puntos: 1.0

  contexto:
    enunciado: |-
      Doña Sofía la tejedora hacía secuencia, repetición, condicionales y variables sin saber que eso era programar. \textbf{Compara su forma de tejer con un algoritmo en Scratch}: ¿qué tienen en común? ¿En qué se diferencian? Responde en 6-8 renglones con \textbf{un ejemplo concreto} de algo que ya programaste en Scratch que se parezca a una secuencia que doña Sofía haría.
    criterio: |-
      Se evalúa: (1) que reconozcas el paralelo (los 4 elementos básicos están en ambos lados); (2) que menciones al menos 1 diferencia importante (medio, velocidad, escala); (3) que des un ejemplo concreto tuyo de Scratch (\emph{``cuando programé al gato para moverse en círculo, usé un bucle como doña Sofía con las hebras''}).
    retroalimentacion: |-
      Una buena respuesta nota que el tejido y el programa comparten \emph{secuencia + repetición + condicionales + variables}. Diferencias: la tejedora usa hebras físicas a velocidad humana; Scratch usa bloques digitales a velocidad de máquina. La estructura mental es la misma.
    puntos: 1.0

  practico:
    - numero: 1
      enunciado: |-
        \textbf{Caso}: tu sobrina de 6 años quiere aprender a cepillarse los dientes sola. \textbf{Escribe el algoritmo paso a paso en máximo 10 instrucciones} para que ella pueda seguirlo sin ayuda. Debe tener: \textbf{(a) al menos 7 pasos en secuencia}; \textbf{(b) al menos 1 condicional (si... entonces...)}; \textbf{(c) al menos 1 repetición (``hacer N veces...'')}.
      criterio: |-
        Se evalúa que el algoritmo (1) tenga al menos 7 pasos numerados claros; (2) incluya 1 condicional con la palabra \emph{si}; (3) incluya 1 repetición con \emph{repetir} o \emph{N veces}; (4) sea ejecutable por una niña de 6 años (no instrucciones ambiguas como ``cepilla bien'').
      retroalimentacion: |-
        Un buen algoritmo dice: ``1. Toma el cepillo. 2. Pon una gota de crema (\emph{si la crema sale mucho, devuelve un poco}). 3. Abre la boca. 4. Cepilla los dientes de adelante moviendo el cepillo arriba y abajo, \emph{repite 10 veces}. 5. Cepilla los de la izquierda \emph{repite 10 veces}. 6. Cepilla los de la derecha \emph{repite 10 veces}. 7. Cepilla los de atrás 10 veces. 8. Enjuaga la boca con agua. 9. Si quedan restos, repite el paso 8. 10. Guarda el cepillo''.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        \textbf{Caso}: en un proyecto de Scratch quieres que un gato camine 10 pasos, después gire 90°, y repita esto 4 veces para hacer un cuadrado. ¿Cuál bloque o estructura es la más eficiente?
      tipo: opcion_multiple
      opciones:
        - "Repetir 40 veces ``mover 10 pasos''."
        - "Repetir 4 veces el bloque ``mover 10 pasos + girar 90 grados''."
        - "Escribir ``mover 10 pasos'' y ``girar 90'' una sola vez."
        - "Mover 90 pasos y girar 10 veces."
      respuesta_index: 1
      criterio: |-
        Pregunta de opción múltiple. La respuesta correcta es la 2 (bucle de 4 repeticiones). Se evalúa que el estudiante reconozca: (a) que el patrón ``mover + girar'' se repite 4 veces para formar un cuadrado; (b) que el bucle es más eficiente que repetir bloques sueltos; (c) que ``girar 90°'' es la clave para cambiar de lado.
      retroalimentacion: |-
        Un cuadrado tiene 4 lados iguales. Por eso el patrón \emph{mover 10 + girar 90} se repite 4 veces. La opción 1 (40 movimientos) no gira nunca. La opción 3 (un solo movimiento) no completa el cuadrado. Bucle de 4 = la elegancia de la repetición.
      puntos: 1.0

  reflexivo:
    enunciado: |-
      \textbf{Lee las 3 voces siguientes}. Después escribe en 1 párrafo (8-10 renglones) cómo tu nuevo oficio de programar en Scratch se conecta con las 3 ideas:
      (a) Dussel: las abuelas tejedoras del Valle ya programaban; el oficio te conecta con esa sabiduría, no te separa de ella.
      (b) Marco Aurelio: programar bien es paciencia + claridad; un programa caótico es como un canasto mal tejido --- se descose en uso.
      (c) Floridi: el código que escribes hoy se ejecuta automáticamente; eres responsable de lo que tu programa hace al usuario.
    voces:
      dussel: |-
        ``Las abuelas tejedoras ya programaban: secuencia, repetición, condicionales, variables. El oficio nuevo te conecta con esa sabiduría, no te separa de ella.''
      estoico: |-
        ``Programar bien es paciencia y claridad. Un programa caótico se descose en uso; uno claro perdura.''
      floridi: |-
        ``El código que escribes hoy se ejecuta solo después. Eres responsable de lo que tu programa hace al usuario, aunque no estés mirando.''
    criterio: |-
      Se evalúa: (1) que aplique las 3 voces (no solo una); (2) que conecte cada voz con un aspecto específico del periodo 2 (algoritmo, claridad del código, responsabilidad del programador); (3) que tenga voz propia (no parafraseo).
    retroalimentacion: |-
      Una buena respuesta usa Dussel para honrar a las tejedoras como primeras programadoras; Marco Aurelio para hablar de código limpio vs código caótico; Floridi para reconocer que el programa se ejecuta automáticamente y el autor responde por lo que haga. Las 3 voces dialogan en el párrafo.
    puntos: 1.0

banco_practica:
  - id: "bp-001"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      Según la apertura (S1), ¿qué hacía doña Sofía la tejedora del Valle que se parecía a programar?
    opciones:
      - "Solo improvisaba con las hebras."
      - "Aplicaba secuencia, repetición, condicionales y variables (en su cabeza) para tejer el canasto."
      - "Copiaba lo que veía en internet."
      - "Tejía sin patrón."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Doña Sofía aplicaba los 4 elementos básicos de un algoritmo: secuencia, repetición, condicionales y variables. La tejedora ya programaba sin saberlo.
    feedback_incorrecto: |-
      Doña Sofía hacía los 4 elementos: secuencia (pasos), repetición (patrón), condicionales (cuando llega al borde), variables (contar puntos). El tejido es algoritmo visual ancestral.

  - id: "bp-002"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué tienen en común las mochilas Wayuu, los sombreros aguadeños y los canastos del Cauca con un programa de Scratch?
    opciones:
      - "Nada, son cosas totalmente distintas."
      - "Todos siguen un algoritmo: secuencia de pasos repetidos con condicionales y variables."
      - "Todos cuestan lo mismo."
      - "Todos los hace una sola persona."
    respuesta_index: 1
    feedback_correcto: |-
      Exacto. Todos son algoritmos ejecutados: la tejedora ejecuta con las manos, Scratch ejecuta con la pantalla. Misma estructura lógica.
    feedback_incorrecto: |-
      Todos son algoritmos visuales: secuencia + repetición + condicionales + variables. Cambian las manos y la fibra por bloques y pantalla. La estructura es la misma.

  - id: "bp-003"
    bloom: recordar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es un algoritmo?
    opciones:
      - "Una palabra rara que solo usan los expertos."
      - "Una secuencia ordenada de pasos finitos para resolver un problema o ejecutar una tarea."
      - "Un programa de televisión."
      - "Una receta exclusiva de cocina."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Un algoritmo es una secuencia ordenada y finita de pasos. Una receta es un algoritmo, una rutina diaria también, y un programa de Scratch también.
    feedback_incorrecto: |-
      Algoritmo = secuencia ordenada de pasos finitos que resuelve un problema. Una receta de cocina sí es algoritmo; lo es también peinarse o cepillarse los dientes.

  - id: "bp-004"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿En qué se parece una receta de cocina a un algoritmo?
    opciones:
      - "No se parecen en nada."
      - "Ambos tienen pasos ordenados, ingredientes/datos de entrada, un resultado esperado, y deben ser claros y reproducibles."
      - "Solo se parecen en que se usan ambos en la casa."
      - "En que ambas son aburridas."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Receta = algoritmo de cocina: pasos ordenados + ingredientes (entrada) + plato terminado (salida) + claridad/reproducibilidad.
    feedback_incorrecto: |-
      Receta y algoritmo comparten: pasos en orden, entrada (ingredientes/datos), salida (resultado), claridad (no ambiguo), reproducibilidad. Por eso la receta es la mejor analogía intuitiva.

  - id: "bp-005"
    bloom: recordar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuáles son las 4 técnicas del pensamiento computacional?
    opciones:
      - "Pensar, escribir, leer, ejecutar."
      - "Descomposición, reconocimiento de patrones, abstracción y algoritmo."
      - "Encender, apagar, navegar, descargar."
      - "Sumar, restar, multiplicar, dividir."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Las 4 técnicas: \emph{descomposición} (partir en piezas), \emph{patrones} (ver lo que se repite), \emph{abstracción} (quedarse con lo esencial), \emph{algoritmo} (pasos para resolver).
    feedback_incorrecto: |-
      Las 4 técnicas: \emph{descomposición, reconocimiento de patrones, abstracción, algoritmo}. Son habilidades mentales antes que computacionales; sirven para programar y para resolver cualquier problema.

  - id: "bp-006"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Tu salón debe organizar la izada de bandera. Aplicar \emph{descomposición} significa:
    opciones:
      - "Hacer todo de golpe sin planear."
      - "Partir el problema grande en piezas más pequeñas: música, palabras, izada, formación, sonido."
      - "Pedir ayuda externa."
      - "Posponer la actividad."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Descomposición = partir el todo en piezas manejables. La izada se vuelve viable cuando se separa en (música, palabras, sonido, formación) y cada parte se asigna.
    feedback_incorrecto: |-
      Descomposición = partir el problema en piezas más pequeñas. Cada pieza se puede asignar a alguien y resolver por separado. Es la primera técnica del pensamiento computacional.

  - id: "bp-007"
    bloom: recordar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es un \emph{diagrama de flujo}?
    opciones:
      - "Una lista de palabras al azar."
      - "Una representación visual de un algoritmo con figuras (óvalo inicio/fin, rectángulo proceso, rombo decisión) y flechas que muestran el orden."
      - "Un dibujo decorativo."
      - "Una tabla numérica."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Diagrama de flujo = visualización del algoritmo. Óvalos para inicio/fin, rectángulos para procesos, rombos para decisiones (\emph{si...?}), flechas para el orden.
    feedback_incorrecto: |-
      Diagrama de flujo dibuja un algoritmo: óvalo inicio/fin, rectángulo proceso (un paso), rombo decisión (un \emph{si}), flechas indicando el flujo. Útil para mostrar lógica antes de codificar.

  - id: "bp-008"
    bloom: comprender
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      En un diagrama de flujo, ¿qué figura indica una \emph{decisión} (un condicional)?
    opciones:
      - "Óvalo."
      - "Rectángulo."
      - "Rombo (diamante)."
      - "Triángulo."
    respuesta_index: 2
    feedback_correcto: |-
      Bien. El rombo indica decisión (\emph{si... entonces...}). Tiene dos salidas (sí/no) que llevan a caminos distintos del algoritmo.
    feedback_incorrecto: |-
      Rombo = decisión. Tiene 2 salidas: una para ``sí'' y otra para ``no''. Es lo que permite que un algoritmo tome caminos distintos según una condición.

  - id: "bp-009"
    bloom: recordar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es una \emph{variable} en programación?
    opciones:
      - "Una palabra rara."
      - "Una caja con etiqueta que guarda un valor que puede cambiar (nombre, edad, puntaje, contador)."
      - "Un bloque que no sirve."
      - "Un dibujo decorativo."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Variable = caja con etiqueta. La etiqueta es el nombre (\emph{edad}); adentro va el valor (\emph{12}). El valor puede cambiar; la etiqueta no.
    feedback_incorrecto: |-
      Una variable es como una caja con etiqueta: la etiqueta no cambia (\emph{edad}), pero lo de adentro sí (\emph{12 hoy, 13 mañana}). Guardar y modificar valores es el corazón de programar.

  - id: "bp-010"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Vas a guardar el puntaje de un jugador en Scratch. ¿Cuál es el mejor nombre para esa variable?
    opciones:
      - "x"
      - "cosa"
      - "puntaje\\_jugador1"
      - "$@!"
    respuesta_index: 2
    feedback_correcto: |-
      Bien. \emph{puntaje\_jugador1} es claro: dice qué guarda y a quién pertenece. Una variable bien nombrada es como una caja bien etiquetada.
    feedback_incorrecto: |-
      Nombre profesional de variable: claro, sin espacios, dice qué guarda. \emph{x} es ambiguo; \emph{cosa} no dice nada; los caracteres raros confunden. \emph{puntaje\_jugador1} es legible y específico.

  - id: "bp-011"
    bloom: recordar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es un \emph{condicional}?
    opciones:
      - "Un bloque sin función."
      - "Una estructura ``si... entonces...'' que toma decisiones según se cumpla o no una condición."
      - "Una repetición."
      - "Un dibujo decorativo."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Condicional = decisión. \emph{Si la condición es verdadera, hacer A; si no, hacer B}. Permite que el programa cambie de comportamiento según la situación.
    feedback_incorrecto: |-
      Condicional \emph{si... entonces}: el programa decide qué hacer según una condición. Ejemplo: \emph{si vida = 0, entonces game over; si no, sigue jugando}. Le da inteligencia al algoritmo.

  - id: "bp-012"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      En Scratch quieres que el gato diga ``¡Hola!'' si toca a un compañero, y se quede quieto si no. ¿Cuál estructura usas?
    opciones:
      - "Un bucle infinito sin condiciones."
      - "Un bloque \\emph{si... entonces... si no...} con la condición ``tocando objeto''."
      - "Un bloque solo de movimiento."
      - "Nada, no se puede hacer."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. El bloque \emph{si... entonces... si no...} con condición ``tocando objeto'' permite dos comportamientos: decir hola (cuando toca) o quedarse quieto (cuando no).
    feedback_incorrecto: |-
      Bloque \emph{si... entonces... si no...} es el clásico para decidir entre 2 caminos. La condición es \emph{tocando objeto}; verdadero → decir hola; falso → quedarse quieto.

  - id: "bp-013"
    bloom: recordar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es un \emph{bucle} (también llamado ciclo)?
    opciones:
      - "Un bloque que solo se ejecuta una vez."
      - "Una estructura que repite un bloque de pasos N veces, o hasta que se cumpla una condición."
      - "Una variable rara."
      - "Una decisión."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Bucle = repetición. \emph{Repetir 10 veces}, \emph{repetir por siempre}, \emph{repetir hasta...}. Evita escribir el mismo bloque varias veces.
    feedback_incorrecto: |-
      Bucle = repetición controlada. Hay 3 tipos clásicos: \emph{repetir N veces}, \emph{repetir por siempre}, \emph{repetir hasta condición}. Hacen el código corto y elegante.

  - id: "bp-014"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Quieres que un personaje cuente del 1 al 10 en pantalla. ¿Cuál estrategia usa un bucle?
    opciones:
      - "Escribir 10 bloques de ``decir 1'', ``decir 2''... uno por uno."
      - "Usar una variable contador que empiece en 1, dentro de \\emph{repetir 10 veces} hacer ``decir contador'' y ``cambiar contador en 1''."
      - "Mostrar solo el 10."
      - "No se puede hacer."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Variable contador + bucle de 10 repeticiones + cambiar contador en 1 cada vez = del 1 al 10 elegante. Es la forma profesional.
    feedback_incorrecto: |-
      Contador + bucle es la solución elegante. Escribir 10 bloques sueltos funciona pero es ineficiente y caótico. Bucle + variable es lo que enseña el periodo.

  - id: "bp-015"
    bloom: recordar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es Scratch?
    opciones:
      - "Un juego solo."
      - "Un entorno de programación visual con bloques (creado por el MIT) para aprender a programar sin escribir texto."
      - "Una página de videos."
      - "Una hoja de cálculo."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Scratch = programación visual con bloques. Lo creó el MIT para enseñar programación a jóvenes. Los bloques se encajan como Lego, y el programa corre al instante.
    feedback_incorrecto: |-
      Scratch es entorno visual del MIT. Programas arrastrando bloques que se encajan; ves el resultado al instante. Ideal para aprender lógica de programación antes de pasar a texto.

  - id: "bp-016"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      En Scratch hay un bloque ``cuando se hace clic en la bandera verde''. ¿Para qué sirve?
    opciones:
      - "Solo decora."
      - "Es el bloque \\emph{inicio} del programa: lo que va debajo se ejecuta al hacer clic en la bandera verde."
      - "Hace ruido."
      - "Termina el programa."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. La bandera verde = botón de inicio. Lo que está debajo se ejecuta cuando el usuario hace clic. Es el equivalente al ``play''.
    feedback_incorrecto: |-
      La bandera verde inicia el programa. Cualquier bloque colocado debajo se ejecuta al hacer clic. Es la entrada de cada proyecto de Scratch.

  - id: "bp-017"
    bloom: comprender
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es una \emph{narrativa interactiva} en Scratch?
    opciones:
      - "Un video sin interacción."
      - "Una historia donde los personajes responden a clics o teclas del usuario, usando condicionales para cambiar de escena."
      - "Un texto sin imágenes."
      - "Solo música."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Narrativa interactiva = historia que responde al usuario. Click, tecla o evento → cambia de escena. Usa condicionales para decidir qué pasa.
    feedback_incorrecto: |-
      Una narrativa interactiva responde al usuario (clics, teclas) y cambia escenas con condicionales. Combina arte + lógica: es la forma más amigable de practicar condicionales en Scratch.

  - id: "bp-018"
    bloom: aplicar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Quieres que tu historia en Scratch cambie de escena cuando el usuario presiona la barra espaciadora. ¿Cuál bloque o estructura usas?
    opciones:
      - "Un bucle infinito sin condición."
      - "El evento \\emph{cuando se presione tecla [espacio]} + el bloque \\emph{cambiar fondo}."
      - "Un bloque de sonido."
      - "Una variable sola."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Evento de tecla + bloque de fondo = cambio de escena. Eventos son los que escuchan acciones del usuario en Scratch.
    feedback_incorrecto: |-
      Eventos (\emph{cuando se presione tecla...}, \emph{cuando se haga clic...}) escuchan acciones del usuario. Al combinarlos con \emph{cambiar fondo} o \emph{cambiar disfraz}, controlas la narrativa.

  - id: "bp-019"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Tu proyecto final de Scratch tiene 30 bloques apilados sin organización: variables sin nombre, bucles dentro de bucles sin sentido, condiciones repetidas. ¿Qué dirías de él aplicando criterio de programación?
    opciones:
      - "Funciona, está bien."
      - "Aunque corra, no aplica buen criterio: las variables deben tener nombre claro, los bucles deben tener propósito, y las condiciones no deben duplicarse."
      - "Es perfecto solo por ser largo."
      - "No importa cómo se vea."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Que un programa corra no significa que esté bien hecho. Buenos nombres de variables, bucles con propósito y condiciones sin duplicar son lo que separa un programa serio de un revoltijo.
    feedback_incorrecto: |-
      Funcionar y estar bien hecho son cosas distintas. Buenos nombres, lógica clara, sin duplicaciones son criterios profesionales. ``Funciona'' no es la única vara: claridad importa.

  - id: "bp-020"
    bloom: crear
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Vas a planear tu primer proyecto completo en Scratch. ¿Cuál orden es el más profesional?
    opciones:
      - "Empezar a poner bloques al azar."
      - "1) Descomponer la idea en piezas, 2) ver patrones, 3) hacer abstracción, 4) escribir el algoritmo en cuaderno, 5) programar en Scratch siguiendo ese algoritmo."
      - "Copiar el proyecto de un compañero."
      - "Solo dibujar sin programar."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Las 4 técnicas + diagrama en cuaderno antes de tocar Scratch. Pensar primero, programar después: ese es el oficio del periodo.
    feedback_incorrecto: |-
      Pensamiento computacional primero (descomponer, patrones, abstracción, algoritmo en cuaderno), Scratch después. Saltarse el pensamiento te lleva a programar caótico y debuguear horas.

  - id: "bp-021"
    bloom: analizar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Tu prima de 3° ya sabe el orden de hacer un sandwich (pan, mantequilla, jamón, queso, pan). ¿Qué técnica del pensamiento computacional aplicó al guardar la receta en su memoria?
    opciones:
      - "Solo descomposición."
      - "Algoritmo (secuencia ordenada de pasos para resolver un problema reproducible)."
      - "Solo patrones."
      - "Nada, no es pensamiento computacional."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Tu prima tiene en la cabeza un algoritmo de sandwich: pasos en orden, reproducibles. El pensamiento computacional vive en muchas cosas cotidianas.
    feedback_incorrecto: |-
      Memorizar una secuencia reproducible es algoritmo. Esa es la magia del periodo: el pensamiento computacional ya existe en tu vida; este periodo te lo hace consciente y lo lleva a Scratch.

  - id: "bp-022"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      En Scratch quieres llevar un contador de cuántas veces el gato saltó. ¿Cómo lo haces?
    opciones:
      - "Sin variable, contando con los dedos."
      - "Creando una variable llamada \\emph{saltos}, iniciándola en 0, y cada vez que el gato salte, usar \\emph{cambiar saltos en 1}."
      - "Cambiando el color del fondo."
      - "Usando un bucle vacío."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Variable contador + incremento de 1 en cada evento. Eso te permite mostrar el número en pantalla y usarlo para condicionales (\emph{si saltos > 10 entonces ganaste}).
    feedback_incorrecto: |-
      Variable contador + \emph{cambiar variable en 1} en cada salto. Es la forma estándar de contar eventos en Scratch. Sirve para puntajes, contadores, niveles, etc.

  - id: "bp-023"
    bloom: evaluar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Una compañera te muestra su narrativa en Scratch. Las escenas cambian al azar sin lógica clara. ¿Qué retroalimentación constructiva le das?
    opciones:
      - "Está perfecto, no toques nada."
      - "Le sugieres usar condicionales para que cada escena cambie por acción del usuario (clic o tecla), no al azar; eso le da estructura narrativa."
      - "Le dices que el proyecto está mal y debe rehacer todo."
      - "Le copias el proyecto."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Retroalimentación constructiva: identifica el problema (azar sin lógica) + sugiere solución concreta (condicionales por acción). Eso ayuda a aprender, no a destruir.
    feedback_incorrecto: |-
      Retroalimentación constructiva: identifica el problema concreto + propone solución específica. Decir ``está mal y rehazlo'' no enseña; sugerir condicionales por acción sí.

  - id: "bp-024"
    bloom: crear
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Quieres hacer un juego de Scratch donde el gato pierde si toca una bomba. ¿Qué condicional aplicas y dónde?
    opciones:
      - "Ninguno."
      - "Dentro de un bucle \\emph{por siempre}, un \\emph{si tocando bomba entonces decir ``perdiste'' + detener todo}."
      - "Solo un bucle infinito sin condición."
      - "Solo un evento de teclado."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Bucle infinito que vigila + condicional ``tocando bomba'' + acciones (decir + detener). Es el patrón clásico de juegos en Scratch.
    feedback_incorrecto: |-
      Patrón clásico: \emph{por siempre + si tocando X entonces hacer Y}. El bucle vigila constantemente; el condicional dispara la acción cuando se cumple. Aprenderás a usarlo en muchos juegos.

  - id: "bp-025"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas características NO tiene un buen algoritmo?
    opciones:
      - "Pasos en orden."
      - "Termina en un número finito de pasos."
      - "Cada paso es claro y no ambiguo."
      - "Puede usar 1.000.000 de pasos sueltos sin organización."
    respuesta_index: 3
    feedback_correcto: |-
      Bien. Un buen algoritmo: orden + finitud + claridad + eficiencia. Un millón de pasos sin organización viola la eficiencia y la claridad.
    feedback_incorrecto: |-
      Buen algoritmo: orden (secuencia) + finitud (termina) + claridad (no ambiguo) + eficiencia (no más pasos de los necesarios). Mil pasos caóticos no es algoritmo, es revoltijo.

cierre: |-
  Cierras el periodo 2 con la \emph{tejedora digital} despertada: ya sabes pensar como computadora y programar en Scratch. El periodo 3 te abre la puerta más nueva del oficio: vas a aprender qué es la inteligencia artificial, cómo aprende, qué son los LLMs, y a usarla con criterio.

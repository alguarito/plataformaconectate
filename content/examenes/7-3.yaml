clave: "7-3"
grado: 7
periodo: 3
completo: true

titulo: "Examen final · Inteligencia artificial con criterio"
titulo_portada: |-
  Examen final ---
  Inteligencia
  artificial
  con criterio

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo entiendes lo aprendido, no cuánto repites.
  En las preguntas abiertas, justifica con ejemplos del periodo. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses celular ni internet durante el examen.

apertura:
  saber_ancestral: |-
    \textbf{En el barrio de Cartago, cada cuadra tenía su consejero.} No era cargo formal --- era \emph{la persona mayor a quien todos acudían cuando había una decisión difícil}. Doña Mercedes era consejera para temas de niños y educación. Don Lucho el relojero era consejero para temas técnicos. Doña Esperanza la partera era consejera para temas de salud familiar. \textbf{¿Por qué la gente confiaba en ellos?} Porque tenían \emph{experiencia} (habían visto muchas vidas), \emph{paciencia} (escuchaban antes de aconsejar), \emph{honestidad} (no fingían saber lo que no sabían), \emph{discreción} (lo que se les contaba no se difundía). La gente preguntaba; el consejero respondía; la gente \textbf{verificaba con su propio criterio} y decidía. \emph{El consejero no decidía por ti; te ayudaba a decidir mejor}. Hoy hay un nuevo tipo de consejero al que millones acuden cada día: la \textbf{Inteligencia Artificial} (ChatGPT, Claude, Gemini). Te puede aconsejar sobre cualquier tema en segundos. Pero con la IA pasa lo mismo que con doña Mercedes: \emph{si preguntas bien, verificas con criterio y mantienes tu voz, te sirve. Si copias sin pensar, te perjudica}.

  contexto: |-
    Este examen cierra el periodo 3 de grado 7°, donde aprendiste a \textbf{usar la IA con criterio}: qué es la IA y dónde está (S2), tipos de IA (S3), cómo aprende una IA (S4), qué son los LLMs (S5), prompting básico (S6), prompting avanzado (S7), ética de la IA (S8), cómo usar IA en tus tareas sin trampa (S9) y un proyecto final con IA responsable (S10).

  pregunta_marco: |-
    ¿Cómo cruza el oficio del consejero del barrio de Cartago con tu nuevo oficio de usar la IA con criterio?

aprendizajes:
  - sesion: 1
    titulo: "Apertura: la IA como nueva consejera, y por qué necesita criterio"
  - sesion: 2
    titulo: "¿Qué es la IA? Dónde está hoy en tu vida diaria"
  - sesion: 3
    titulo: "Tipos de IA: estrecha vs general; supervisada vs no supervisada"
  - sesion: 4
    titulo: "Cómo aprende una IA: datos, entrenamiento, evaluación"
  - sesion: 5
    titulo: "Modelos de lenguaje (LLMs): ChatGPT, Claude, Gemini"
  - sesion: 6
    titulo: "Prompting básico: contexto, rol, ejemplo, formato"
  - sesion: 7
    titulo: "Prompting avanzado: pasos, restricciones, iteración"
  - sesion: 8
    titulo: "Ética de la IA: sesgo, alucinación, deshonestidad, privacidad"
  - sesion: 9
    titulo: "IA y mis tareas: declaración honesta de uso"
  - sesion: 10
    titulo: "Cosecha: proyecto con IA responsable"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un primo de 6° lo más importante que aprendiste este periodo sobre IA con criterio, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} concretas (no más, no menos). Evita frases vacías como ``la IA es chévere'': sé específico con vocabulario del periodo (LLM, prompt, alucinación, sesgo, declaración honesta, etc.).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas y específicas. (2) que se nombren al menos \textbf{dos conceptos técnicos} del periodo (ej. LLM, prompt, alucinación, sesgo). (3) que se note \textbf{voz propia} (no copia de la guía) y un ejemplo concreto.
    retroalimentacion: |-
      Una buena respuesta menciona conceptos del periodo (qué es un LLM, qué es prompt y por qué importa, qué son las alucinaciones, qué es declarar uso) y cierra con una idea aterrizada. Si solo dice ``la IA ayuda'' sin nombres, falta voz propia.
    puntos: 1.0

  contexto:
    enunciado: |-
      Don Lucho el consejero técnico del barrio te ayudaba a decidir, pero no decidía por ti. \textbf{Compara su oficio con tu manera de usar la IA hoy}: ¿qué tienen en común? ¿En qué se diferencian? Responde en 6-8 renglones con \textbf{un ejemplo concreto} de algo que ya usaste de IA en este periodo donde mantuviste tu voz y verificaste lo que dijo.
    criterio: |-
      Se evalúa: (1) que reconozcas el paralelo (consejero y IA aconsejan, pero no deciden); (2) que menciones al menos 1 diferencia importante (escala, velocidad, anonimato, alucinación); (3) que des un ejemplo concreto tuyo (un prompt que escribiste + cómo verificaste).
    retroalimentacion: |-
      Una buena respuesta nota: ambos aconsejan pero no deciden; ambos requieren que verifiques. Diferencias: don Lucho tenía 30 años de experiencia real; la IA habla seguro aun cuando alucina. La IA es muy útil si pides bien y verificas; peligrosa si copias sin pensar.
    puntos: 1.0

  practico:
    - numero: 1
      enunciado: |-
        \textbf{Caso}: tu prima de 6° debe escribir un ensayo de 1 página sobre los oficios de Cartago. Ella te pregunta cómo usar ChatGPT/Claude con criterio. \textbf{Escríbele en 8-10 líneas} (a) un prompt bien hecho con los 4 elementos de S6 (contexto, rol, ejemplo, formato); (b) qué hacer con la respuesta de la IA; (c) cómo declarar honestamente el uso.
      criterio: |-
        Se evalúa que la respuesta (1) muestre un prompt de ejemplo con los 4 elementos (contexto + rol + ejemplo + formato); (2) explique que la respuesta se lee, no se copia; (3) mencione la declaración honesta de uso al final del trabajo.
      retroalimentacion: |-
        Un buen prompt dice algo como: \emph{``Eres ayudante para una estudiante de 6° en Cartago, Colombia (rol). Va a escribir un ensayo sobre oficios tradicionales del barrio (contexto). Dame 5 oficios típicos + 1 línea por cada uno explicando qué hacían y por qué importaban (formato). Ejemplo de uno: ``Pregonero --- llevaba avisos por las cuadras antes de los celulares''.''} Después: leer, elegir 2-3 oficios que te gusten, escribir el ensayo con voz propia, y declarar al final: \emph{``Usé Claude para ideas iniciales sobre oficios. El ensayo está escrito en mi propia voz.''}
      puntos: 1.0

    - numero: 2
      enunciado: |-
        \textbf{Caso}: tu compañero le pide a ChatGPT que escriba un poema sobre el río La Vieja y lo entrega a la profe de Lengua como si fuera suyo, sin declarar el uso. La profe descubre la trampa. ¿Cuál afirmación es la MÁS correcta aplicando S8 y S9?
      tipo: opcion_multiple
      opciones:
        - "Es deshonestidad académica: la IA puede asistir pero el trabajo del estudiante debe ser suyo, declarado, y debe verificarse."
        - "Está bien, todos lo hacen."
        - "La profe exagera, es solo un poema."
        - "El compañero debió usar Claude en lugar de ChatGPT."
      respuesta_index: 0
      criterio: |-
        Pregunta de opción múltiple. La respuesta correcta es la 2 (deshonestidad académica + IA asiste pero no reemplaza + declaración). Se evalúa que el estudiante reconozca: (a) que entregar como propio lo que hizo la IA es trampa; (b) que la solución no es ``no usar IA'' sino usarla con declaración y trabajo humano visible; (c) que la profe tiene razón.
      retroalimentacion: |-
        La IA es asistente, no autor. Entregar como propio un poema que escribió la IA es trampa académica, igual a copiar de un compañero. El uso correcto: la IA da ideas o sugiere; tú escribes con tu voz; declaras al final. ``Todos lo hacen'' no es defensa.
      puntos: 1.0

  reflexivo:
    enunciado: |-
      \textbf{Lee las 3 voces siguientes}. Después escribe en 1 párrafo (8-10 renglones) cómo tu nuevo oficio de usar IA con criterio se conecta con las 3 ideas:
      (a) Dussel: tu voz como adolescente cuenta tanto como cualquier otra; la IA no debe silenciarla, debe amplificarla.
      (b) Marco Aurelio: la IA habla rápido y seguro; tú párate, respira y verifica antes de creer y de entregar.
      (c) Floridi: la IA convive contigo en la infoesfera; tú eres responsable de lo que entregas como tuyo.
    voces:
      dussel: |-
        ``Tu voz como adolescente cuenta. La IA no es para silenciarla --- es para amplificarla cuando tú decides cuándo y cómo usarla.''
      estoico: |-
        ``La IA habla rápido y con seguridad. Tú párate, respira, verifica. No todo lo que dice una IA es verdad: alucina.''
      floridi: |-
        ``La IA es parte de la infoesfera que habitas. Tú eres responsable de lo que entregas como tuyo --- declarar el uso es honestidad.''
    criterio: |-
      Se evalúa: (1) que aplique las 3 voces (no solo una); (2) que conecte cada voz con un aspecto específico del periodo 3 (voz propia, verificación, declaración); (3) que tenga voz propia (no parafraseo).
    retroalimentacion: |-
      Una buena respuesta usa Dussel para defender que la IA amplifica tu voz cuando tú decides; Marco Aurelio para hablar de verificar antes de creer y de copiar; Floridi para reconocer la responsabilidad de declarar el uso. Las 3 voces dialogan en el párrafo.
    puntos: 1.0

banco_practica:
  - id: "bp-001"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      Según la apertura (S1), ¿por qué la gente confiaba en los consejeros del barrio de Cartago?
    opciones:
      - "Porque eran famosos."
      - "Porque tenían experiencia, paciencia, honestidad y discreción."
      - "Porque cobraban."
      - "Porque siempre acertaban."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Las 4 virtudes del consejero: experiencia + paciencia + honestidad + discreción. La IA tiene 2 (experiencia masiva en datos, paciencia infinita) pero le faltan 2 (honestidad limitada, discreción cuestionable).
    feedback_incorrecto: |-
      Las 4 virtudes: experiencia, paciencia, honestidad, discreción. La IA solo tiene completas las dos primeras. Por eso necesita tu criterio para complementar lo que le falta.

  - id: "bp-002"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el paralelo principal entre el consejero del barrio y la IA?
    opciones:
      - "Ambos aconsejan pero no deciden por ti; tú debes verificar con criterio y mantener tu voz."
      - "Ambos cobran lo mismo."
      - "Ambos son adultos mayores."
      - "Ambos hablan español."
    respuesta_index: 0
    feedback_correcto: |-
      Sí. El consejero no decidía por ti; tampoco la IA debe decidir por ti. Tú escuchas, verificas, decides con criterio.
    feedback_incorrecto: |-
      Tanto el consejero como la IA aconsejan, no deciden. Tu trabajo: pedir bien, verificar lo que dicen, mantener tu voz. Eso vale para don Lucho y para ChatGPT.

  - id: "bp-003"
    bloom: recordar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es la Inteligencia Artificial?
    opciones:
      - "Un robot con cuerpo metálico."
      - "Una persona muy inteligente."
      - "Un programa que aprende patrones de datos para hacer tareas que antes solo hacían humanos (clasificar, traducir, responder, recomendar)."
      - "Un computador encendido."
    respuesta_index: 2
    feedback_correcto: |-
      Sí. IA = programa que aprende patrones para hacer tareas humanas. No necesita cuerpo metálico: vive como software en servidores y se accede por navegador o app.
    feedback_incorrecto: |-
      IA es programa, no cuerpo. Aprende patrones de muchísimos datos y ejecuta tareas que antes solo podían los humanos (clasificar fotos, traducir, responder texto, recomendar).

  - id: "bp-004"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos NO es ejemplo de IA en tu vida diaria?
    opciones:
      - "Recomendación de videos en TikTok o YouTube."
      - "Filtros y efectos de cámara en Instagram o Snapchat."
      - "Asistente de voz como Siri, Alexa o Google."
      - "Una calculadora de bolsillo de los años 80."
    respuesta_index: 3
    feedback_correcto: |-
      Bien. La calculadora vieja ejecuta operaciones fijas sin aprender. Las otras 3 sí son IA: aprenden patrones para recomendar, transformar imágenes o responder.
    feedback_incorrecto: |-
      Una calculadora vieja no aprende: ejecuta operaciones fijas. IA implica aprendizaje de patrones. TikTok, filtros y asistentes de voz son IA viva en tu vida diaria.

  - id: "bp-005"
    bloom: recordar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es la \emph{IA estrecha} (también llamada \emph{específica})?
    opciones:
      - "Una IA que hace todo lo que un humano puede hacer."
      - "Una IA diseñada para una tarea específica (recomendar videos, traducir, clasificar fotos)."
      - "Una IA que cabe en un celular pequeño."
      - "Una IA que solo entiende inglés."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. La IA estrecha (o específica) hace una tarea concreta muy bien. Es lo único que existe hoy. La IA general (hacer todo como humano) es teoría aún.
    feedback_incorrecto: |-
      IA estrecha = una tarea. IA general (AGI) = todas las tareas humanas. Hoy toda la IA real (incluso ChatGPT) es estrecha: especializada en lenguaje, en imágenes o en recomendar.

  - id: "bp-006"
    bloom: analizar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué diferencia hay entre aprendizaje \emph{supervisado} y \emph{no supervisado}?
    opciones:
      - "Ninguna."
      - "Supervisado es para niños; no supervisado para adultos."
      - "Solo cambian de nombre."
      - "Supervisado: la IA aprende con datos etiquetados (\\emph{esta foto es un gato}). No supervisado: la IA encuentra patrones en datos sin etiqueta."
    respuesta_index: 3
    feedback_correcto: |-
      Bien. Supervisado = aprende con respuestas correctas (etiquetas). No supervisado = encuentra patrones sin guía. Ambos son útiles para distintos problemas.
    feedback_incorrecto: |-
      Supervisado: alguien etiquetó los datos (\emph{esto es gato, esto es perro}) y la IA aprende. No supervisado: la IA se las arregla sola para encontrar patrones (\emph{estos 100 datos se parecen entre sí}).

  - id: "bp-007"
    bloom: recordar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuáles son las 3 etapas básicas para que una IA aprenda?
    opciones:
      - "Encender, apagar, reiniciar."
      - "Comprar, instalar, usar."
      - "Datos, entrenamiento, evaluación."
      - "Programar, jugar, descansar."
    respuesta_index: 2
    feedback_correcto: |-
      Sí. \emph{Datos} (ejemplos para aprender) → \emph{entrenamiento} (el modelo procesa los datos y ajusta sus parámetros) → \emph{evaluación} (se mide qué tan bien aprendió).
    feedback_incorrecto: |-
      Las 3 etapas: datos + entrenamiento + evaluación. Si los datos son malos, la IA aprende mal (\emph{garbage in, garbage out}). Si no se evalúa, no sabes si sirve.

  - id: "bp-008"
    bloom: comprender
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Si entrenas una IA con datos sesgados (por ejemplo, solo fotos de personas de un solo color de piel), ¿qué pasa?
    opciones:
      - "La IA queda sesgada: no reconoce bien a personas con otros colores de piel; comete errores graves al usarse en el mundo real."
      - "Nada, aprende igual."
      - "La IA borra los datos sesgados sola."
      - "La IA cambia los datos a algo neutral."
    respuesta_index: 0
    feedback_correcto: |-
      Sí. \emph{Garbage in, garbage out}: si los datos son sesgados, la IA es sesgada. Hay casos reales de IA de reconocimiento facial que no detectan bien a personas afro porque se entrenaron con datasets sesgados.
    feedback_incorrecto: |-
      Si los datos están sesgados, la IA aprende ese sesgo. Es un problema ético serio. Por eso S8 te enseña a sospechar de la IA: revisar de qué se alimentó.

  - id: "bp-009"
    bloom: recordar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué significa LLM?
    opciones:
      - "Large Language Model (modelo grande de lenguaje): IA entrenada con millones de textos para conversar."
      - "Lo que Lleva el Mensaje."
      - "Lista Larga de Mensajes."
      - "Línea Linda y Mejorada."
    respuesta_index: 0
    feedback_correcto: |-
      Sí. LLM = \emph{Large Language Model}. Modelos como ChatGPT, Claude y Gemini son LLMs entrenados con millones de textos para generar respuestas.
    feedback_incorrecto: |-
      LLM = Large Language Model = modelo grande de lenguaje. Aprende de millones de textos (libros, webs, conversaciones) y genera respuestas estadísticas a tus preguntas.

  - id: "bp-010"
    bloom: comprender
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Por qué un LLM puede ``alucinar'' (decir cosas falsas con seguridad)?
    opciones:
      - "Porque está enojado."
      - "Porque tiene poca memoria."
      - "Porque está apagado."
      - "Porque genera lenguaje probable estadísticamente, no verdad verificada. Si los datos eran incompletos o ambiguos, llena el hueco con algo que suena bien pero puede ser falso."
    respuesta_index: 3
    feedback_correcto: |-
      Bien. Un LLM genera palabras estadísticamente probables, no verdades. Por eso puede inventar fechas, nombres o citas con seguridad falsa. \emph{Verificar} es tu trabajo.
    feedback_incorrecto: |-
      Alucinación: el LLM da una respuesta estadísticamente probable, no necesariamente verdadera. Inventa fechas, nombres, fuentes. Por eso siempre se verifica contra fuente real lo importante.

  - id: "bp-011"
    bloom: recordar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es un \emph{prompt} en IA?
    opciones:
      - "Un botón rápido."
      - "La instrucción que le das a la IA: lo que pides + cómo lo pides + qué formato esperas."
      - "Un error del programa."
      - "Una contraseña."
    respuesta_index: 1
    feedback_correcto: |-
      Sí. Prompt = instrucción a la IA. La calidad de la respuesta depende mucho de la calidad del prompt: pedir bien es la mitad del trabajo.
    feedback_incorrecto: |-
      Prompt es lo que escribes a la IA. Un buen prompt incluye contexto, rol, ejemplo y formato. Un prompt vago da respuesta vaga; uno preciso da respuesta útil.

  - id: "bp-012"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Quieres ayuda de ChatGPT para tu ensayo de Sociales. ¿Cuál prompt es el mejor según S6?
    opciones:
      - "ayuda con un ensayo"
      - "porfi hazme el ensayo"
      - "Eres profesor de Sociales para grado 7° en Cartago, Colombia. Voy a escribir un ensayo de 1 página sobre los oficios tradicionales del Valle del Cauca. Dame 5 oficios + 1 línea por cada uno explicando qué hacían. Formato: lista numerada."
      - "rapido un ensayo"
    respuesta_index: 2
    feedback_correcto: |-
      Bien. Prompt con los 4 elementos: rol (profesor de Sociales), contexto (grado 7°, Cartago), formato (lista numerada con 5 ítems + 1 línea), tarea clara. Resultado útil.
    feedback_incorrecto: |-
      Buen prompt = rol + contexto + tarea concreta + formato. ``Ayuda con un ensayo'' es vago; el segundo prompt te da una lista útil de partida. Pedir bien es la mitad del trabajo.

  - id: "bp-013"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Pides a la IA un texto y queda muy largo y formal. ¿Qué haces aplicando S7?
    opciones:
      - "Lo aceptas como está."
      - "Iteras: \\emph{``Reescríbelo en 80 palabras, voz cercana, sin tecnicismos''}."
      - "Lo borras y empiezas de cero."
      - "Cambias de plataforma."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Iterar = pedir cambios sobre la primera respuesta. La IA mejora con instrucciones específicas (\emph{más corto, más cercano, sin tecnicismos}).
    feedback_incorrecto: |-
      Iteración: refinas la respuesta con un nuevo prompt (\emph{``más corto, sin tecnicismos, voz cercana''}). Es la habilidad central de S7. No tienes que aceptar la primera versión.

  - id: "bp-014"
    bloom: recordar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es una \emph{alucinación} de IA?
    opciones:
      - "Cuando la IA se duerme."
      - "Cuando la IA se apaga sola."
      - "Cuando la IA pide un descanso."
      - "Cuando la IA da una respuesta falsa pero la presenta con seguridad como si fuera verdad."
    respuesta_index: 3
    feedback_correcto: |-
      Sí. Alucinación = respuesta falsa con apariencia de verdad. La IA no sabe que mintió. Por eso siempre verificas datos importantes contra una fuente real.
    feedback_incorrecto: |-
      Alucinación es inventar datos con seguridad. Fechas, nombres, citas, leyes que no existen. La IA no sabe que se equivocó. Tu trabajo: verificar.

  - id: "bp-015"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ChatGPT te dice que la Ley 1581 de Colombia es de 2014. Tú sabes por S7 de 6° que es de 2012. ¿Qué haces?
    opciones:
      - "Creerle a ChatGPT porque suena seguro."
      - "Borrar la conversación."
      - "Corregirle internamente: alucinó. Verificar en página oficial del gobierno antes de usar el dato en tu trabajo."
      - "Pedirle disculpas a ChatGPT."
    respuesta_index: 2
    feedback_correcto: |-
      Bien. Caso clásico de alucinación. Tú ya sabías la fecha real (2012). Verificar contra fuente oficial es lo correcto, no creer ciegamente.
    feedback_incorrecto: |-
      ChatGPT alucinó con la fecha. Tú ya sabías que la Ley 1581 es de 2012. Verifica contra fuente oficial. La IA habla seguro aun cuando se equivoca: tu criterio es el filtro final.

  - id: "bp-016"
    bloom: evaluar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Un compañero usa ChatGPT para hacer todo su trabajo de Lengua sin escribir nada y sin declarar el uso. La profe lo descubre. Aplicando criterio de S8:
    opciones:
      - "Es deshonestidad académica: la IA puede asistir, pero el trabajo entregado como propio debe tener trabajo humano real y declarar el uso."
      - "Está bien, total el resultado quedó bonito."
      - "La profe exagera."
      - "Eso lo hace todo el mundo."
    respuesta_index: 0
    feedback_correcto: |-
      Sí. La IA asiste, no reemplaza. Entregar como propio lo que hizo la IA, sin declararlo, es trampa académica. Hay forma honesta de usar IA: declarar + editar a mano + tener voz propia.
    feedback_incorrecto: |-
      La IA asiste; tú produces. Entregar como propio lo que escribió la IA sin declararlo es trampa. La salida correcta: declarar uso + tu voz visible + edición humana.

  - id: "bp-017"
    bloom: recordar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es la \emph{declaración honesta} de uso de IA en una tarea?
    opciones:
      - "Decir que no usaste IA aunque la hayas usado."
      - "Borrar el historial."
      - "Indicar al final del trabajo qué herramienta usaste, en qué parte, y cuánto editaste a mano."
      - "Una contraseña secreta."
    respuesta_index: 2
    feedback_correcto: |-
      Sí. Declaración honesta = decir al final qué IA usaste, en qué parte y cuánto editaste a mano. Como citar una fuente: honestidad sobre el proceso.
    feedback_incorrecto: |-
      Declaración honesta: al final del trabajo, decir qué IA usaste (ChatGPT/Claude/Gemini), en qué parte (ideas, redacción inicial, ortografía) y cuánto editaste a mano. Como citar una fuente.

  - id: "bp-018"
    bloom: aplicar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Usaste Claude para que te sugiriera 5 ideas y de esas 5 elegiste 2, las desarrollaste tú en tu ensayo. ¿Cuál declaración es honesta?
    opciones:
      - "No declaro nada, fueron mis ideas."
      - "``Usé Claude para una lluvia inicial de 5 ideas; de esas elegí 2 y las desarrollé en mi voz. El ensayo está escrito por mí.''"
      - "``Claude me hizo todo''."
      - "``No usé IA''."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Declaración honesta: específica, breve, dice cómo participó la IA y qué hiciste tú. Eso te protege ante la profe y muestra criterio.
    feedback_incorrecto: |-
      Declaración honesta: específica + breve + qué hizo la IA + qué hiciste tú. La opción 2 cumple esos 4 criterios. Las otras o mienten u ocultan o exageran.

  - id: "bp-019"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Tu proyecto final del periodo usa IA para casi todo y tu trabajo humano es mínimo. ¿Qué nivel de la rúbrica obtendrías?
    opciones:
      - "Nivel 1 porque la rúbrica evalúa USO RESPONSABLE: voz humana clara + edición visible + declaración honesta + verificación de lo que dijo la IA."
      - "Nivel 5 porque queda muy bien."
      - "Nivel 3 porque al menos lo entregaste."
      - "Nivel 4 porque tiene IA."
    respuesta_index: 0
    feedback_correcto: |-
      Sí. La rúbrica de S10 valora el uso responsable de la IA, no la cantidad de IA. Trabajo humano + declaración + verificación + voz propia son lo central.
    feedback_incorrecto: |-
      Rúbrica de S10 evalúa USO RESPONSABLE: voz humana + edición + declaración + verificación. Si la IA hizo casi todo y tú casi nada, el proyecto falla la rúbrica aunque ``quede bonito''.

  - id: "bp-020"
    bloom: crear
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Vas a estructurar tu proyecto final con IA responsable. ¿Cuál orden es el más profesional?
    opciones:
      - "Le pido a la IA que me haga todo y lo entrego."
      - "Solo copio de internet."
      - "Lo dejo para última hora y la IA hace todo."
      - "1) Yo pienso el tema y el plan; 2) uso IA para ideas/borrador/ortografía; 3) edito en mi voz; 4) verifico datos contra fuentes; 5) declaro el uso al final."
    respuesta_index: 3
    feedback_correcto: |-
      Bien. El orden profesional: tú piensas primero, IA asiste, tú editas, verificas y declaras. Eso es uso responsable.
    feedback_incorrecto: |-
      Orden: planificas tú → IA asiste (no reemplaza) → editas en tu voz → verificas datos → declaras uso. Es el ciclo de IA responsable que enseña el periodo.

  - id: "bp-021"
    bloom: analizar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Si tu prima entrena una IA con solo 20 fotos de gatos blancos, ¿qué problema tendrá la IA?
    opciones:
      - "Ninguno."
      - "Será más rápida."
      - "Le encantarán los perros."
      - "Sesgo de datos: clasificará mal los gatos negros o naranjas porque nunca los vio. Aprende solo el patrón que le enseñaron."
    respuesta_index: 3
    feedback_correcto: |-
      Bien. Sesgo de datos: la IA solo aprende los patrones que vio. 20 fotos de gatos blancos no enseñan los demás colores. Para que sirva en el mundo real, los datos deben ser diversos.
    feedback_incorrecto: |-
      Sesgo de datos: la IA solo conoce lo que vio en entrenamiento. Datos limitados o desiguales = IA limitada o desigual. Por eso los datasets profesionales se cuidan en diversidad.

  - id: "bp-022"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Para mejorar un prompt corto, ¿qué agregas?
    opciones:
      - "Solo emojis."
      - "Muchas exclamaciones."
      - "Rol (\\emph{eres profesor de...}), contexto (\\emph{grado 7°, Cartago}), tarea concreta, formato esperado (\\emph{lista de 5, máximo 80 palabras})."
      - "Tu contraseña."
    respuesta_index: 2
    feedback_correcto: |-
      Bien. Los 4 ingredientes del buen prompt: rol + contexto + tarea + formato. Aplicarlos cambia la calidad de la respuesta drásticamente.
    feedback_incorrecto: |-
      Rol + contexto + tarea + formato. Esos 4 elementos elevan un prompt malo a útil. Sin contexto la IA inventa; con contexto la IA acierta más.

  - id: "bp-023"
    bloom: evaluar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu profe pregunta si usaste IA en un trabajo. Tú lo usaste pero no estás seguro si declararlo. ¿Qué haces?
    opciones:
      - "Mentir y decir que no."
      - "Declarar honestamente: ``Sí, usé Claude para X. Edité con mi voz y verifiqué Y''."
      - "Cambiar de tema."
      - "Decir que no me acuerdo."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Honestidad académica: declarar siempre. Si lo usaste bien, declararlo no es problema --- es prueba de criterio. Mentir es peor que el uso mismo.
    feedback_incorrecto: |-
      Declarar siempre. La mentira es deshonestidad académica, que pesa más que el uso de IA bien hecho. Si usaste bien la IA, declararlo te protege; mentir te perjudica.

  - id: "bp-024"
    bloom: comprender
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas afirmaciones sobre los LLMs es FALSA?
    opciones:
      - "Siempre dicen la verdad porque son inteligentes."
      - "Están entrenados con millones de textos."
      - "Generan respuestas estadísticamente probables, no verdades verificadas."
      - "Pueden alucinar y por eso necesitan verificación humana."
    respuesta_index: 0
    feedback_correcto: |-
      Bien. Los LLMs no garantizan verdad; generan lenguaje probable. Por eso la verificación humana sigue siendo esencial. Cualquier afirmación del estilo \emph{``siempre dice la verdad''} es falsa.
    feedback_incorrecto: |-
      Los LLMs generan lenguaje probable, no verdad. Pueden alucinar. La verificación humana es tu deber. Un LLM ``siempre verdadero'' no existe; eso es propaganda, no realidad técnica.

  - id: "bp-025"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Quieres que la IA genere un texto pero con restricciones (no más de 80 palabras, sin tecnicismos, voz de adolescente). ¿Cómo lo logras?
    opciones:
      - "Esperar a que adivine."
      - "Especificar las restricciones en el prompt: \\emph{``Máximo 80 palabras, sin tecnicismos, voz de adolescente de 13 años''}."
      - "Borrar partes a mano después."
      - "Pedir disculpas a la IA."
    respuesta_index: 1
    feedback_correcto: |-
      Bien. Restricciones en el prompt = control sobre la salida. Cantidad de palabras, tono, audiencia, formato: todo se declara para que la IA respete.
    feedback_incorrecto: |-
      Especifica las restricciones en el prompt. La IA respeta lo que escribes claro: cantidad de palabras, tono, audiencia, formato. Sin restricciones, te entrega lo más genérico posible.

cierre: |-
  Cierras el grado 7° con el oficio doble despertado: ya colaboras en la nube, ya programas en Scratch, y ahora usas IA con criterio. Como dijo el consejero del barrio: \emph{nadie decide por ti; tú decides con criterio amplificado}. En grado 8° vas a dar el siguiente salto: lógica avanzada, datos como tablas, y tu primera aproximación al pensamiento ético del oficio.

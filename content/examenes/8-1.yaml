clave: "8-1"
grado: 8
periodo: 1
completo: true

titulo: "Examen final · Phronesis con datos en hoja de cálculo"
titulo_portada: |-
  Examen final ---
  Phronesis
  con datos

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen.

apertura:
  saber_ancestral: |-
    En los pueblos cafeteros que rodean Cartago (Sevilla, Caicedonia, Riofrío, Trujillo) trabajó durante décadas \textbf{la acopiadora de café}: una mujer (casi siempre mujer) que en las semanas de cosecha abría las puertas de una bodega pequeña y recibía los bultos de café que los pequeños productores traían a vender. Tenía dos herramientas: \textbf{una balanza grande y una libreta cuadriculada}. Por cada productor que llegaba, anotaba en la libreta: \emph{nombre, vereda, fecha, kilos brutos, kilos limpios después del catador, calidad (suave/normal/fea), precio por kilo, total pagado}. Al final de la semana, sumaba columnas a mano, comparaba con la semana anterior y decidía: \emph{``El precio del Federación está a 3.200, yo pago 3.100 al productor para mi margen''} o \emph{``Esta semana don Aurelio trajo el café más limpio: en la próxima cosecha le doy primero el pago.''}. Esa práctica era \textbf{phronesis con datos}: criterio práctico aplicado a cifras concretas. No era estadística académica; era el saber del oficio cruzado con la columna sumada. La hoja de cálculo en Excel es la herencia digital de esa libreta de la acopiadora.

  contexto: |-
    Este examen cierra el periodo 1 de grado 8°, donde aprendiste a usar la \textbf{hoja de cálculo con phronesis}: preguntar antes de calcular (S1), tipos de datos y formato (S2), tablas limpias (S3), las 4 funciones básicas (S4), referencias relativas y absolutas (S5), fórmulas compuestas con PEMDAS (S6), gráficos honestos (S7), formato condicional y validación (S8), mini-estudio (S9) y sustentación (S10).

  pregunta_marco: |-
    ¿Qué cruza la libreta cuadriculada de la acopiadora de café del Valle con tu hoja de cálculo de Excel?

aprendizajes:
  - sesion: 1
    titulo: "Phronesis con datos: preguntar antes de calcular"
  - sesion: 2
    titulo: "Tipos de datos: número, texto, fecha, porcentaje"
  - sesion: 3
    titulo: "Tablas limpias: campos, registros y bitácora"
  - sesion: 4
    titulo: "4 funciones básicas: SUMA, PROMEDIO, MAX, MIN"
  - sesion: 5
    titulo: 'Referencias relativas y absolutas (A1 vs \$A\$1)'
  - sesion: 6
    titulo: "Fórmulas compuestas y jerarquía PEMDAS"
  - sesion: 7
    titulo: "Gráficos honestos: barras, líneas, circulares"
  - sesion: 8

  - sesion: 9
    titulo: "Mini-estudio del entorno escolar"
  - sesion: 10
    titulo: "Sustentación del mini-estudio en 4 minutos"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un adulto que aún hace cuentas a mano lo más importante que aprendiste en este periodo, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos). Evita frases hechas como ``Excel es importante'': se específico con vocabulario del periodo (phronesis, tabla limpia, fórmula, referencia absoluta, gráfico honesto).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo. (3) que se note \textbf{voz propia} de quien hizo el mini-estudio.
    retroalimentacion: |-
      Una buena respuesta: ``(1) primero la pregunta, después la fórmula: sin pregunta clara, las cifras son ruido. (2) tabla limpia (una columna = un tipo, una fila = un caso) es base de todo análisis posterior. (3) un gráfico honesto respeta al lector: eje desde cero y escala consistente.''
    puntos: 1.0

  contexto:
    enunciado: |-
      La acopiadora de café del Valle llevaba todo en una libreta cuadriculada y al final de la semana decidía precios y prioridades con base en lo anotado.

      Responde en 5-7 renglones: \textbf{¿qué del oficio de la acopiadora cruza con tu disciplina en Excel, y qué se gana al digitalizar sin perder la phronesis del cuaderno?} Da un ejemplo concreto de cada lado.
    criterio: |-
      Se evalúa: (1) identifica al menos una práctica concreta de la acopiadora (registro semanal, columnas claras, comparación entre semanas, decisión con criterio). (2) reconoce qué se gana al digitalizar (cálculo automático, gráficos, validación) sin caer en la trampa de creer que Excel reemplaza la disciplina del registro. (3) reflexión propia.
    retroalimentacion: |-
      Una buena respuesta: ``La acopiadora anotaba cada productor sin saltarse semanas. En Excel ese registro disciplinado es el mismo, solo que SUMA y PROMEDIO me dan totales automáticos. Lo que se gana es velocidad de cálculo; lo que sigue siendo del humano es la phronesis: decidir a quién pagar primero, qué precio sostener, qué semana comparar.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        En la celda B2 tienes el precio por kilo (3.100) y en la columna A los kilos de cada productor (A2=100, A3=85, A4=120). Quieres calcular el total pagado a cada productor copiando la fórmula desde C2 hacia abajo.

        \textbf{¿Cuál fórmula escribes en C2 para que al copiarla hacia abajo siga refiriéndose al precio en B2?}
      contexto: |-
        Recuerda: una referencia con \$ delante de la fila o columna se vuelve absoluta y NO cambia al copiar la fórmula.
      tipo: opcion_multiple
      opciones:
        - '=A2*B2'
        - '=\$A\$2*B2'
        - '=A2*\$B\$2'
        - '=A\$2*B2'
      respuesta_index: 2
      criterio: |-
        La opción C es correcta. \$B\$2 fija la referencia al precio. Al copiar la fórmula hacia abajo, A2 se vuelve A3, A4, etc., pero \$B\$2 sigue apuntando al precio.
      retroalimentacion: |-
        Las referencias absolutas (\$B\$2) NO cambian al copiar la fórmula. Es lo que necesitas para constantes como precios, tasas o tipos de cambio que aplican a todas las filas.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Vas a hacer un mini-estudio del consumo diario de agua de los grifos del colegio. Tu compañera de equipo te trae estos datos de 10 días en una tabla desordenada: \textbf{algunas filas tienen el día como ``lunes'' y otras como ``Lun'' o ``L''; los consumos están como ``120'', ``120 L'', ``ciento veinte''; faltan datos para 2 días; hay un dato extraño (980 L cuando los demás están entre 80 y 200)}.

        \textbf{Diseña en 6-8 renglones tu plan de trabajo} aplicando lo aprendido este periodo. Incluye: (a) cómo limpias los datos antes de analizar, (b) qué fórmula básica usarías para el análisis (promedio, máximo, mínimo), (c) qué gráfico es el más adecuado, (d) qué decisión razonada presentarías a la coordinación.

        Cierra con una sola frase de cuidado: \textbf{``Antes de presentar mis hallazgos, me aseguro de...''}
      criterio: |-
        Se evalúa: (1) limpieza concreta (unificar formato día, convertir consumos a número puro, decidir qué hacer con datos faltantes, marcar dato atípico). (2) fórmula adecuada (PROMEDIO + MAX + MIN). (3) gráfico justificado (líneas para tendencia temporal o barras por día). (4) decisión razonada (no estadística sola, sino qué hacer con eso). (5) frase de cuidado.
      retroalimentacion: |-
        Una buena respuesta: ``Limpio: unifico días como L/M/M/J/V, consumos como número puro (=VALOR), marco los 2 días faltantes como N/A, investigo el 980 L (probablemente error de captura o fuga real). PROMEDIO = 130 L, MAX = 200, MIN = 80. Gráfico de líneas para tendencia. Decisión: si el dato de 980 es real, hay fuga ese día; si es error, hay que mejorar la captura. Antes de presentar verifico el dato atípico con quien tomó las mediciones.''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto del oficio del análisis de datos. \textbf{Las 3 lentes deben aparecer explícitamente}.

      Cierra el texto con una sola frase de compromiso: \emph{``Para el periodo 2, me comprometo a...''}
    voces:
      dussel: |-
        ``Los datos pueden dignificar o cosificar a las personas que retratan. Saber a quién mi análisis deja sin voz es la primera ética del analista."
      estoico: |-
        ``Las cifras no se truncan. El analista disciplinado muestra los datos completos aunque no le favorezcan."
      floridi: |-
        ``En la infoesfera, todo gráfico publicado entra a la conversación común. Su honestidad es responsabilidad ética."
    criterio: |-
      Se evalúa: (1) las 3 lentes aplican a aspectos distintos. (2) identifica una tensión real. (3) el compromiso final es específico.
    retroalimentacion: |-
      Una buena respuesta: ``Mi mini-estudio mide consumo de agua (Floridi: información que entra a la conversación). La lente del nosotros me pregunta a quién dejé fuera del estudio: a quien usa el agua del aseo no medida. Lo estoico me recuerda que el 980 L no se borra solo porque sea incómodo: se investiga. Para P2 me comprometo a aplicar la misma disciplina a la lógica y los algoritmos del micro:bit.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 1 con phronesis para mirar datos. El periodo 2 (Lógica avanzada y micro:bit) te pedirá la misma disciplina aplicada a condiciones y algoritmos. La acopiadora del café se va contigo a programar.

# ─── BANCO DE PRÁCTICA · 22 preguntas ──────────────────────────────
banco_practica:
  - id: "bp-001"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué significa phronesis con datos?
    opciones:
      - "Hacer muchas fórmulas"
      - "Saber matemáticas avanzadas"
      - "Criterio práctico aplicado a cifras: preguntar antes de calcular"
      - "Usar Excel rápido"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Phronesis es criterio práctico. Sin pregunta clara, las cifras son ruido.
    feedback_incorrecto: |-
      Phronesis = criterio práctico. La pregunta viene antes que la fórmula; sin pregunta, no hay análisis útil.

  - id: "bp-002"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      En Excel, ¿qué tipo de dato debe tener una columna que guarda kilos de café?
    opciones:
      - "Texto"
      - "Fecha"
      - "Cualquiera"
      - "Número con decimales y formato consistente"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Número con decimales. Mezclar texto en columna numérica rompe las fórmulas.
    feedback_incorrecto: |-
      Número. Mezclar tipos (120 y "120 kg") en la misma columna impide sumar o promediar.

  - id: "bp-003"
    bloom: comprender
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué representa cada FILA en una tabla limpia de Excel?
    opciones:
      - "Un caso o registro individual"
      - "Un tipo de dato"
      - "Una fórmula"
      - "Un gráfico"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Fila = caso (un productor, un día, una venta). Columna = tipo de dato.
    feedback_incorrecto: |-
      Fila = caso individual. Columna = tipo. Esa estructura es base para fórmulas, filtros y gráficos.

  - id: "bp-004"
    bloom: recordar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué fórmula da el valor MÁS BAJO de un rango?
    opciones:
      - "=MAX()"
      - "=MIN()"
      - "=PROMEDIO()"
      - "=SUMA()"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. =MIN() da el valor mínimo. =MAX() el máximo.
    feedback_incorrecto: |-
      =MIN() para mínimo. Conoce las 4 básicas: SUMA, PROMEDIO, MAX, MIN.

  - id: "bp-005"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Tienes en B1 el IVA (19%) y en A2:A10 los precios sin IVA. Quieres calcular el IVA de cada producto. ¿Cuál fórmula escribes en B2 para copiarla hacia abajo?
    opciones:
      - '=A2*B1'
      - '=\$A\$2*B1'
      - '=A\$2*B1'
      - '=A2*\$B\$1'
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. \$B\$1 fija el IVA. A2 cambia a A3, A4... pero \$B\$1 sigue apuntando al 19%.
    feedback_incorrecto: |-
      \$B\$1 mantiene fija la referencia al IVA. Las constantes que aplican a todas las filas se escriben con \$.

  - id: "bp-006"
    bloom: analizar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el resultado de =3+5*2 según la jerarquía PEMDAS?
    opciones:
      - "16"
      - "13"
      - "10"
      - "8"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. PEMDAS: multiplicación antes que suma. 5*2 = 10; 3+10 = 13.
    feedback_incorrecto: |-
      Resultado: 13. PEMDAS dicta multiplicar antes de sumar. Si quieres sumar primero, usa paréntesis: =(3+5)*2.

  - id: "bp-007"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Quieres mostrar la evolución del consumo de agua durante 30 días. ¿Qué gráfico es el más adecuado?
    opciones:
      - "Gráfico circular"
      - "Histograma"
      - "Gráfico de líneas (muestra tendencia temporal)"
      - "Mapa"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Líneas para tendencia temporal. Circular para proporciones; barras para comparar categorías.
    feedback_incorrecto: |-
      Gráfico de líneas para evolución temporal. Es el estándar de tendencia día a día.

  - id: "bp-008"
    bloom: evaluar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál práctica VIOLA la honestidad visual?
    opciones:
      - "Eje Y truncado para inflar visualmente diferencias"
      - "Eje Y desde cero"
      - "Etiquetas claras"
      - "Título descriptivo"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Eje truncado es la trampa más común. Infla diferencias visualmente y engaña al lector.
    feedback_incorrecto: |-
      Eje truncado infla diferencias. Honestidad visual exige eje desde 0 (salvo justificación), escala consistente, sin 3D.

  - id: "bp-009"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Para qué sirve el formato condicional?
    opciones:
      - "Para decorar las celdas"
      - "Para resaltar visualmente valores que cumplen una condición (rojo si <0, verde si >100)"
      - "Para cambiar el idioma"
      - "Para imprimir"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Formato condicional = alertas visuales automáticas. Hace visibles los datos que necesitan atención.
    feedback_incorrecto: |-
      Alertas visuales automáticas. Permite ver de un vistazo qué celdas merecen atención sin leer todo.

  - id: "bp-010"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el primer paso al diseñar un mini-estudio del entorno escolar?
    opciones:
      - "Formular una pregunta concreta y verificable (qué quieres saber, de quién, con qué propósito)"
      - "Abrir Excel y hacer fórmulas"
      - "Encuestar a 100 personas"
      - "Hacer un gráfico"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Pregunta primero. Sin pregunta clara, los datos recolectados no responden nada útil.
    feedback_incorrecto: |-
      Formular la pregunta. Excel es herramienta; la pregunta es el inicio del oficio.

  - id: "bp-011"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el oficio ancestral que conecta con este periodo?
    opciones:
      - "El zapatero del centro"
      - "El cartero"
      - "La acopiadora de café del Valle con su libreta cuadriculada"
      - "El piloto de avión"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. La acopiadora llevaba productores, kilos, calidad y precios en libreta. Era phronesis con datos antes de Excel.
    feedback_incorrecto: |-
      La acopiadora de café. Su libreta cuadriculada con productores, kilos y precios es la herencia directa de Excel.

  - id: "bp-012"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos NO es un tipo de dato común en Excel?
    opciones:
      - "Número"
      - "Texto"
      - "Fecha"
      - "Sentimiento"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Excel maneja números, texto, fechas, porcentajes y booleanos. Los "sentimientos" no son tipo.
    feedback_incorrecto: |-
      Excel: número, texto, fecha, porcentaje, booleano. "Sentimiento" no es tipo de dato.

  - id: "bp-013"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Tu tabla tiene una columna mezcla con "120", "120 L", "ciento veinte". ¿Qué haces?
    opciones:
      - "Las uniformizo a número puro (=VALOR si hay strings) antes de aplicar fórmulas"
      - "Las dejo igual"
      - "Las borro todas"
      - "Cambio a Word"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Uniformar el tipo es paso obligado. Sin homogeneidad, las fórmulas devuelven errores o resultados falsos.
    feedback_incorrecto: |-
      Uniformar a número puro. Sin homogeneidad de tipos, las fórmulas básicas no funcionan correctamente.

  - id: "bp-014"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Tienes los kilos de café de 30 productores. Quieres saber el productor con MAYOR cosecha. ¿Qué fórmula usas?
    opciones:
      - "=PROMEDIO(B2:B31)"
      - "=SUMA(B2:B31)"
      - "=CONTAR(B2:B31)"
      - "=MAX(B2:B31)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. =MAX devuelve el valor más alto. Para saber QUIÉN, usar BUSCARV con ese valor.
    feedback_incorrecto: |-
      =MAX devuelve el valor más alto. Para saber QUIÉN, combinas MAX con BUSCARV o INDICE+COINCIDIR.

  - id: "bp-015"
    bloom: analizar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la diferencia entre referencia A1 y \$A\$1?
    opciones:
      - 'Son lo mismo'
      - '\$A\$1 cuesta dinero'
      - 'A1 es relativa (cambia al copiar); \$A\$1 es absoluta (NO cambia al copiar)'
      - 'A1 es para texto, \$A\$1 para números'
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. \$ fija la referencia. \$A\$1 no cambia al copiar la fórmula a otras celdas.
    feedback_incorrecto: |-
      A1 cambia al copiar (relativa); \$A\$1 no cambia (absoluta). \$ fija fila y/o columna.

  - id: "bp-016"
    bloom: analizar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el resultado de =(3+5)*2?
    opciones:
      - "13"
      - "16"
      - "10"
      - "8"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Los paréntesis se evalúan primero. (3+5) = 8; 8*2 = 16.
    feedback_incorrecto: |-
      Los paréntesis primero: (3+5)=8; 8*2=16. Sin paréntesis sería 13 (multiplicación antes que suma).

  - id: "bp-017"
    bloom: evaluar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Quieres comparar la cosecha de 5 productores. ¿Qué gráfico es el más adecuado?
    opciones:
      - "Líneas"
      - "Circular con 5 segmentos"
      - "Barras horizontales (compara categorías)"
      - "Dispersión"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Barras horizontales son ideales para comparar categorías. Circular también sirve con 5 o menos.
    feedback_incorrecto: |-
      Barras horizontales para comparar entre categorías. Circular es alternativa válida con pocas categorías (3-6).

  - id: "bp-018"
    bloom: aplicar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Quieres que las celdas con saldo negativo se vean automáticamente en rojo. ¿Qué herramienta usas?
    opciones:
      - "Borrar las celdas"
      - "Cambiar la fuente"
      - "Hacer un gráfico"
      - "Formato condicional con regla 'Valor menor que 0'"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Formato condicional = alertas visuales automáticas. Sin él hay que revisar celda por celda.
    feedback_incorrecto: |-
      Formato condicional con regla "Valor menor que 0". Excel pinta en rojo automáticamente sin revisar manualmente.

  - id: "bp-019"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu mini-estudio del consumo de agua del colegio termina con 30 mediciones. ¿Cuál es el siguiente paso responsable?
    opciones:
      - "Limpiar datos + analizar + visualizar honestamente + extraer 1 insight accionable + escribir conclusiones con limitaciones"
      - "Publicar de inmediato"
      - "Borrar todo"
      - "Hacer otro estudio"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Limpiar + analizar + visualizar + insight + conclusiones con límites reconocidos. Ese es el ciclo del oficio.
    feedback_incorrecto: |-
      Limpiar + analizar + visualizar + insight accionable + conclusiones con limitaciones. Publicar sin ese ciclo es prematuro.

  - id: "bp-020"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Durante tu sustentación de 4 minutos, ¿qué muestra MEJOR tu oficio?
    opciones:
      - "Hablar muy rápido para caber en 4 min"
      - "Mostrar 1 gráfico honesto + 1 insight accionable + reconocer limitaciones"
      - "Decir que el estudio es perfecto"
      - "Leer cifras una por una"
    respuesta_index: 1

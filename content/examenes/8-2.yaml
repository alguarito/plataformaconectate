clave: "8-2"
grado: 8
periodo: 2
completo: true

titulo: "Examen final · Lógica avanzada y computación física con micro:bit"
titulo_portada: |-
  Examen final ---
  Lógica avanzada
  y micro:bit

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen.

apertura:
  saber_ancestral: |-
    En los barrios de Cartago, hasta los años 90, hubo un personaje silencioso que llegaba a las casas con una caja de herramientas y un voltímetro: \textbf{el electricista del barrio}. Cuando se iba la luz de un solo bombillo o de toda una casa, su método no era cambiar piezas al azar: era \textbf{lógica aplicada paso a paso}. Empezaba por preguntar (\emph{``¿cuándo se fue?, ¿se fueron las otras casas también?''}), después medía con el voltímetro en distintos puntos (\emph{¿hay corriente AND el bombillo no enciende?, ¿hay corriente OR solo en algunos tomacorrientes?, ¿es NOT problema de la red, sino del circuito de la casa?}). Cada medición confirmaba o descartaba una hipótesis hasta llegar al fallo concreto: \emph{``El daño es el térmico de la cocina; los demás están bien''}. Esa práctica era \textbf{lógica condicional aplicada a un problema físico real}: el mismo if-else-if con AND/OR/NOT que ejecuta un micro:bit cuando lee sensores y dispara actuadores. La diferencia entre el electricista del barrio y un programador con MakeCode no es el oficio: es el medio. El método lógico es el mismo.

  contexto: |-
    Este examen cierra el periodo 2 de grado 8°, donde aprendiste a \textbf{usar lógica avanzada y computación física con el micro:bit}. Pasaste por: condicionales con AND/OR/NOT (S1), tablas de verdad (S2), algoritmos en pseudocódigo (S3), sensores (S4), actuadores (S5), variables y umbrales calibrados (S6), depuración como el relojero (S7), alertas con lógica compuesta (S8), proyecto de monitoreo (S9) y sustentación técnica (S10).

  pregunta_marco: |-
    ¿Qué cruza el oficio del electricista del barrio de Cartago con tu programa en MakeCode que lee sensores y dispara actuadores?

aprendizajes:
  - sesion: 1
    titulo: "Lógica avanzada: if-else con AND, OR y NOT"
  - sesion: 2
    titulo: "Tablas de verdad: AND, OR, NOT como reglas universales"
  - sesion: 3
    titulo: "Algoritmos: del pseudocódigo al diagrama de flujo"
  - sesion: 4
    titulo: "Sensores en MakeCode: micro:bit que siente"
  - sesion: 5
    titulo: "Actuadores: LEDs, sonido, coreografía"
  - sesion: 6
    titulo: "Sensores con variables y umbrales calibrados"
  - sesion: 7
    titulo: "Depuración: una hipótesis, una prueba, un resultado"
  - sesion: 8
    titulo: "Alertas con lógica compuesta y validación por escenarios"
  - sesion: 9
    titulo: "Proyecto de monitoreo: el micro:bit como vigía"
  - sesion: 10
    titulo: "Sustentación del proyecto técnico"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un compañero de grado 7° lo más importante que aprendiste este periodo sobre lógica avanzada y micro:bit, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos). Evita frases hechas como ``programar es fácil''. Sé específico con vocabulario del periodo (if-else, AND/OR/NOT, sensor, umbral, depuración, etc.).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo. (3) que se note \textbf{voz propia}.
    retroalimentacion: |-
      Una buena respuesta: ``(1) la lógica con AND/OR/NOT no es decoración: define qué decisiones toma el programa. (2) los umbrales se calibran con datos reales (no se inventan números) o el sistema da alarmas equivocadas. (3) depurar es ciencia: una hipótesis, una prueba, un resultado, no tocar al azar.''
    puntos: 1.0

  contexto:
    enunciado: |-
      El electricista del barrio de Cartago diagnosticaba fallas con lógica condicional paso a paso, sin tocar nada al azar.

      Responde en 5-7 renglones: \textbf{¿qué del método del electricista cruza con la disciplina de depuración (sesión 7) que aprendiste, y qué se gana al traducir esa lógica del cuerpo a un programa en MakeCode?} Da un ejemplo concreto.
    criterio: |-
      Se evalúa: (1) identifica al menos una práctica del electricista (preguntar primero, medir antes de actuar, descartar hipótesis con datos). (2) reconoce qué amplifica el medio digital (velocidad, repetibilidad, registro automático). (3) reflexión propia.
    retroalimentacion: |-
      Una buena respuesta: ``El electricista probaba una hipótesis a la vez con el voltímetro. En MakeCode hago lo mismo con `mostrar variable` y bloques `if`: agrego un punto de control para ver qué pasa antes de cambiar nada. Lo digital amplifica: puedo guardar logs y ver patrones; lo del cuerpo sigue ahí: la disciplina de NO tocar 5 cosas a la vez.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Diseñas una alarma para que tu micro:bit emita un sonido si \textbf{el sensor de luz indica oscuridad Y el sensor de movimiento detecta presencia} (alguien camina en un cuarto a oscuras de noche).

        \textbf{¿Cuál operador lógico usas y qué tabla de verdad describe la alarma?}
      contexto: |-
        Recuerda: AND es verdadero solo cuando AMBAS condiciones son verdaderas. OR cuando al menos una. NOT invierte.
      tipo: opcion_multiple
      opciones:
        - "OR — basta con que se cumpla una condición (luz baja o movimiento)."
        - "AND — la alarma suena solo cuando AMBAS condiciones son verdaderas (oscuridad Y movimiento)."
        - "NOT — invierte la lectura del sensor."
        - "Ninguno — no se puede combinar."
      respuesta_index: 1
      criterio: |-
        La opción B es correcta. AND exige las dos condiciones: oscuridad Y movimiento. OR daría falsas alarmas (cualquiera de las dos las disparaba). NOT es para invertir una sola lectura, no para combinar.
      retroalimentacion: |-
        AND combina dos condiciones para reducir falsas alarmas. Si usaras OR, sonaría cada vez que hay movimiento, incluso con luz: no es lo que pediste.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Tu proyecto de monitoreo es \textbf{un vigía de inundación} para tu casa: el micro:bit lee un sensor de humedad y enciende un LED rojo + emite un pitido si detecta agua. Después de 1 hora funcionando, descubres dos problemas: (a) el LED se enciende también con humedad ambiental alta (no solo con agua), (b) el pitido es tan corto que nadie lo nota.

        \textbf{Diseña en 6-8 renglones tu plan de mejora} aplicando lo aprendido este periodo. Incluye: (a) cómo calibras el umbral del sensor (S6), (b) qué hipótesis pruebas primero para depurar (S7), (c) qué actuador y patrón usarías para que la alarma sea perceptible (S5), (d) qué escenarios validarías antes de confiar en el sistema (S8).

        Cierra con una frase de cuidado: \textbf{``Antes de dejar el vigía en autónomo, me aseguro de...''}
      criterio: |-
        Se evalúa: (1) calibración con mediciones reales (humedad seca, humedad ambiente, agua directa) para fijar el umbral en el punto correcto. (2) hipótesis ordenada para depurar el umbral antes que el pitido. (3) actuador apropiado (LED parpadeante + pitido repetido cada 3 segundos). (4) escenarios validados (al menos 4: sin agua, humedad ambiente, gota, charco). (5) frase de cuidado coherente.
      retroalimentacion: |-
        Una buena respuesta: ``Calibro midiendo 3 veces en cada condición (seco, ambiente, agua) y fijo umbral por encima de ambiente. Hipótesis 1: umbral muy bajo. Pruebo subiéndolo en 10 unidades y observo. LED parpadeante + pitido cada 3s durante 30s para que se note. Valido 4 escenarios: sin agua, ambiente húmedo, gota directa, charco creciente. Antes de dejarlo en autónomo, verifico que en 1 hora de prueba sin lluvia el vigía no haga ninguna falsa alarma.''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto del oficio de programar computación física. \textbf{Las 3 lentes deben aparecer explícitamente}.

      Cierra el texto con una sola frase de compromiso: \emph{``Para el periodo 3, me comprometo a...''}
    voces:
      dussel: |-
        ``Toda alarma decide a quién protege y a quién deja desatendido. Saber a quién mi sensor no alcanza es la primera ética del oficio digital."
      estoico: |-
        ``Una hipótesis, una prueba, un resultado. La disciplina del relojero exige más oficio que la suposición rápida."
      floridi: |-
        ``En la infoesfera, cada sensor que despliegas entra a la cadena informacional. Su confiabilidad es responsabilidad ética del programador."
    criterio: |-
      Se evalúa: (1) las 3 lentes aplican a aspectos distintos del oficio. (2) identifica una tensión real (velocidad vs. rigor, suposición vs. medición, comodidad vs. quien queda fuera). (3) compromiso específico.
    retroalimentacion: |-
      Una buena respuesta: ``Mi vigía protege mi casa (Floridi: información que entra al hogar). La lente del nosotros me pregunta a quién no protege: a vecinos sin sensor. Lo estoico me recuerda que `parece funcionar' no es lo mismo que `validado en 4 escenarios'. Para P3 me comprometo a aplicar la misma disciplina a mis piezas multimedia: probar antes de publicar.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 2 con lógica avanzada y disciplina de programación. El periodo 3 (Multimedia y ciberética) te pedirá la misma rigurosidad aplicada a piezas audiovisuales. El electricista que diagnosticaba paso a paso se va contigo a contar historias con criterio.

# ─── BANCO DE PRÁCTICA · 22 preguntas ──────────────────────────────
banco_practica:
  - id: "bp-001"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué hace el operador AND?
    opciones:
      - "Es verdadero si AL MENOS UNA condición es verdadera"
      - "Invierte una condición"
      - "Es verdadero solo cuando AMBAS condiciones son verdaderas"
      - "Suma valores"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. AND es restrictivo: necesita las dos. OR es permisivo: basta una. NOT invierte.
    feedback_incorrecto: |-
      AND exige las dos. Si una falla, AND es falso. Es el operador restrictivo.

  - id: "bp-002"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      Para una tabla de verdad de "A AND B" con 2 entradas binarias, ¿cuántas filas tiene?
    opciones:
      - "2 filas"
      - "1 fila"
      - "8 filas"
      - "4 filas (2 entradas × 2 = 4 combinaciones)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Con n entradas binarias hay 2^n combinaciones. 2 entradas = 4 filas (FF, FV, VF, VV).
    feedback_incorrecto: |-
      4 filas. Cada entrada binaria duplica las combinaciones. Con 3 entradas hay 8 filas.

  - id: "bp-003"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué representa un ROMBO en un diagrama de flujo?
    opciones:
      - "Una decisión: el flujo se bifurca según una condición"
      - "El inicio del proceso"
      - "El final"
      - "Una variable"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Rombo = decisión. Rectángulo = proceso/acción. Óvalo = inicio/fin.
    feedback_incorrecto: |-
      Rombo = decisión. Es donde el flujo se bifurca según condición (sí/no, mayor/menor).

  - id: "bp-004"
    bloom: comprender
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      El micro:bit tiene sensor de luz integrado. ¿Qué valor devuelve cuando está en total oscuridad?
    opciones:
      - "Un valor cercano a 255"
      - "Un valor cercano a 0"
      - "Un valor cualquiera"
      - "No tiene sensor de luz"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. El sensor de luz va de 0 (oscuridad total) a 255 (luz fuerte). Es un rango lineal.
    feedback_incorrecto: |-
      0 = oscuridad total. 255 = luz fuerte. El sensor de luz integrado del micro:bit usa esa escala.

  - id: "bp-005"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos NO es un actuador típico que puedas conectar a un micro:bit?
    opciones:
      - "LEDs"
      - "Buzzer (parlante)"
      - "Sensor de temperatura"
      - "Servomotor"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. El sensor de temperatura es ENTRADA, no actuador. Los actuadores son salida: LED, buzzer, servo, etc.
    feedback_incorrecto: |-
      El sensor es entrada. Actuadores son salidas que hacen algo: LED, buzzer, servomotor. Sensor de temperatura es entrada.

  - id: "bp-006"
    bloom: analizar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Inventas un umbral para tu alarma de luz sin calibrar. La alarma se dispara cuando no debería. ¿Qué problema técnico tienes?
    opciones:
      - "Umbral inventado sin calibración: produce falsas alarmas porque no corresponde al contexto real"
      - "Ninguno"
      - "El sensor está roto"
      - "El micro:bit está descargado"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Umbral sin calibración = falsas alarmas. La calibración con 5 mediciones reales evita ese error.
    feedback_incorrecto: |-
      Umbral inventado sin calibración. El número correcto se obtiene midiendo en condiciones reales, no escribiendo el primer valor que viene a la cabeza.

  - id: "bp-007"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Tu programa no funciona y cambias 5 cosas al mismo tiempo. ¿Qué pasa?
    opciones:
      - "Vas más rápido"
      - "No puedes saber qué cambio arregló el problema (si lo arregla) ni qué cambio empeoró otras cosas"
      - "El programa va más estable"
      - "Es buena práctica"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Cambiar varias cosas a la vez es lo opuesto a depurar. Una hipótesis, una prueba, un resultado.
    feedback_incorrecto: |-
      Sin disciplina de una sola hipótesis a la vez, el cambio que arregla y el que empeora se mezclan. No aprendes nada.

  - id: "bp-008"
    bloom: evaluar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Tu sistema con 3 sensores binarios necesita validarse por escenarios. ¿Cuántos escenarios mínimos hay?
    opciones:
      - "3 escenarios"
      - "1 escenario"
      - "Infinitos"
      - "8 escenarios (2 × 2 × 2 = 8 combinaciones)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. 2^3 = 8 combinaciones posibles con 3 entradas binarias. Validación exige cubrir las 8.
    feedback_incorrecto: |-
      8 escenarios. Con n entradas binarias hay 2^n combinaciones. Validar por escenarios significa cubrirlas todas.

  - id: "bp-009"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu vigía de inundación funciona perfecto en pruebas controladas, pero después de 2 días reales en autónomo da falsas alarmas. ¿Qué haces?
    opciones:
      - "Borrar el proyecto"
      - "Quitar el sensor"
      - "Revisar log de mediciones para encontrar el patrón, recalibrar el umbral con datos del mundo real"
      - "Cambiar de proyecto"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. El mundo real revela problemas que las pruebas controladas no muestran. Recalibrar con datos reales es el oficio.
    feedback_incorrecto: |-
      Revisar logs + recalibrar. El mundo real es el laboratorio final; los umbrales se ajustan con sus datos.

  - id: "bp-010"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      En la sustentación de tu proyecto técnico, alguien pregunta por una limitación. ¿Qué respondes?
    opciones:
      - "Mi proyecto no tiene limitaciones"
      - "Reconozco honestamente la limitación, explico por qué existe y propongo cómo abordarla en próxima versión"
      - "Cambio de tema"
      - "No respondo"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La honestidad sobre limitaciones distingue al oficio profesional del aficionado.
    feedback_incorrecto: |-
      Reconocer + explicar + proponer mejora. La honestidad técnica fortalece la sustentación, no la debilita.

  - id: "bp-011"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál oficio ancestral conecta con la lógica avanzada y la depuración?
    opciones:
      - "El electricista del barrio de Cartago con su método paso a paso"
      - "El sastre del centro"
      - "El zapatero"
      - "El conductor de bus"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. El electricista usaba lógica AND/OR/NOT y depuración hipótesis-prueba antes de tocar cables.
    feedback_incorrecto: |-
      El electricista del barrio. Su método paso a paso (preguntar, medir, descartar hipótesis) es la lógica condicional aplicada.

  - id: "bp-012"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué hace el operador NOT?
    opciones:
      - "Combina dos condiciones"
      - "Suma valores"
      - "Detiene el programa"
      - "Invierte el valor de verdad de una condición"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. NOT invierte: V se vuelve F, F se vuelve V. Es operador unario (1 entrada).
    feedback_incorrecto: |-
      NOT invierte una condición. Si A es verdadero, NOT A es falso. Es operador unario.

  - id: "bp-013"
    bloom: analizar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      En "A OR B" con A=V y B=F, ¿cuál es el resultado?
    opciones:
      - "Falso"
      - "Indefinido"
      - "Error"
      - "Verdadero (basta con que una sea V)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. OR es permisivo: con que una sea V, el resultado es V. Solo es F cuando ambas son F.
    feedback_incorrecto: |-
      OR es V si al menos una es V. Solo es F cuando AMBAS son F. Es lo opuesto al AND.

  - id: "bp-014"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Para qué sirve un pseudocódigo antes de programar?
    opciones:
      - "Para perder tiempo"
      - "Para imprimir"
      - "Para escribir el algoritmo en lenguaje claro humano antes de traducirlo al editor de bloques"
      - "No sirve para nada"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Pseudocódigo organiza la lógica antes del código. Hace visibles errores de razonamiento que el código esconde.
    feedback_incorrecto: |-
      Organizar la lógica en humano antes del código. Los errores de razonamiento se ven más rápido en pseudocódigo que en bloques.

  - id: "bp-015"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Tu micro:bit lee temperatura. ¿Qué bloque MakeCode usas?
    opciones:
      - "mostrar texto"
      - "leer temperatura (sensor integrado)"
      - "establecer LED"
      - "tocar nota"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. El micro:bit tiene sensor de temperatura integrado. El bloque devuelve un valor en grados Celsius.
    feedback_incorrecto: |-
      El bloque "temperatura" devuelve los grados Celsius. El micro:bit tiene sensor integrado.

  - id: "bp-016"
    bloom: crear
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Quieres que un LED parpadee cada segundo durante 10 segundos. ¿Qué bloques combinas?
    opciones:
      - "Bucle 'repetir 10 veces' con bloques 'encender' + 'pausa 500ms' + 'apagar' + 'pausa 500ms'"
      - "Solo 'mostrar LED'"
      - "Solo 'apagar todo'"
      - "Bloques aleatorios"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Bucle + encendido + pausa + apagado + pausa. 500ms cada uno = parpadeo de 1 segundo total.
    feedback_incorrecto: |-
      Bucle "repetir 10 veces" con encendido + pausa + apagado + pausa de 500ms cada uno produce parpadeo de 1s por ciclo.

  - id: "bp-017"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Por qué declarar una VARIABLE con nombre descriptivo (ej: "temperatura_aula") en lugar de "x"?
    opciones:
      - "Es más bonito"
      - "El código se vuelve legible para quien lo lea después (incluido tú dentro de 6 meses)"
      - "El programa va más rápido"
      - "MakeCode lo exige"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Nombres descriptivos hacen el código mantenible. "x" no dice nada; "temperatura_aula" sí.
    feedback_incorrecto: |-
      Nombres descriptivos = código mantenible. En 6 meses tú mismo agradecerás que "temperatura_aula" sea legible.

  - id: "bp-018"
    bloom: evaluar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Tu hipótesis al depurar dice "el sensor está mal calibrado". ¿Qué prueba haces para verificar?
    opciones:
      - "Cambiar todo el programa"
      - "Reemplazar el micro:bit"
      - "Mostrar el valor del sensor en pantalla y compararlo con un termómetro conocido"
      - "Cerrar MakeCode"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Una prueba específica que confirma o descarta UNA hipótesis. No tocar otras partes del código.
    feedback_incorrecto: |-
      Mostrar el valor + comparar con referencia conocida. Una prueba que confirma o descarta la hipótesis sin tocar el resto.

  - id: "bp-019"
    bloom: analizar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Tu alarma combina humedad alta AND temperatura alta. ¿Cuántos escenarios validas?
    opciones:
      - "4 escenarios (2 condiciones binarias × 2 = 4 combinaciones FF, FV, VF, VV)"
      - "1 escenario"
      - "100 escenarios"
      - "0 escenarios"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. 2^2 = 4 escenarios. Cada uno debe verificarse para confirmar que la alarma actúa solo en el caso VV.
    feedback_incorrecto: |-
      4 escenarios. La validación exige verificar los 4 casos posibles, no solo el que dispara la alarma.

  - id: "bp-020"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu proyecto de monitoreo lee humedad y dispara alarma. ¿Qué documentas en una bitácora del proyecto?
    opciones:
      - "Nada, los proyectos no necesitan bitácora"
      - "Solo el código final"
      - "Solo el nombre del proyecto"
      - "Umbrales calibrados, escenarios validados, fallos encontrados y corregidos, decisiones de diseño"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. La bitácora hace mantenible el proyecto. Sin ella, nadie sabe por qué tomaste cada decisión.
    feedback_incorrecto: |-
      Bitácora documenta umbrales, escenarios, fallos y decisiones. Sin ella el proyecto es caja negra que nadie puede mantener.

  - id: "bp-021"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Sustentas tu proyecto en 4 minutos. ¿Qué muestra MEJOR tu oficio?
    opciones:
      - "Hablar muy rápido"
      - "Demo del micro:bit funcionando + 1 limitación reconocida + 1 mejora propuesta para próxima versión"
      - "Solo leer código"
      - "Mostrar muchos colores"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Demo en vivo + honestidad sobre limitaciones + plan de mejora. Eso es oficio maduro.
    feedback_incorrecto: |-
      Demo + limitación + mejora. La honestidad sobre lo que falta fortalece la sustentación, no la debilita.

  - id: "bp-022"
    bloom: crear
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      Diseñas un alarma con 3 sensores. ¿Cómo te aseguras de cubrir TODOS los casos?
    opciones:
      - "Pruebo solo el caso que dispara la alarma"
      - "No hace falta probar"
      - "Construyo la tabla de verdad con 2^3 = 8 filas y valido cada combinación"
      - "Solo pruebo el caso negativo"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Tabla de verdad completa + validación por escenarios. Cada combinación debe tener resultado predecible.
    feedback_incorrecto: |-
      Tabla de verdad con 8 filas. Cada combinación de las 3 entradas debe estar prevista en el diseño.

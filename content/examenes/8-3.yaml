clave: "8-3"
grado: 8
periodo: 3
completo: true

titulo: "Examen final · Multimedia y ciberética"
titulo_portada: |-
  Examen final ---
  Multimedia
  y ciberética

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen.

apertura:
  saber_ancestral: |-
    En los barrios del Pacífico colombiano (Tumaco, Buenaventura, Guapi) y también en los pueblos del Valle, sostiene la memoria comunitaria una figura que casi no aparece en los libros: \textbf{la narradora de cuentos de las veladas}. Era una mujer mayor que, en las noches de luna llena o en los velorios, sentaba a los niños y a los adultos en círculo y contaba las historias del barrio: la del río que se llevó al sastre, la del compadre que se hizo rico con la trampa, el chiste del cura mojado. La narradora tenía un oficio invisible pero severo: \textbf{decidía qué se contaba, cómo se contaba y a quién protegía la historia}. Sabía que un chiste sobre el vecino borracho podía hacerlo reír si estaba presente, o destruirlo si no estaba. Sabía que la historia de la vecina infiel podía contarse con dignidad o con burla, y \textbf{escogía las palabras-imagen}. Sabía cuándo bajar la voz para que los niños no oyeran lo sensible. La narradora era \textbf{editora visual antes de los pixels}: jerarquizaba la información, manejaba ritmo, conocía la diferencia entre dignificar y degradar al sujeto retratado. Esa práctica ancestral es la madre directa de todo lo que aprendiste este periodo: multimedia con ética, narrativa de alto impacto, edición de imagen respetuosa, prevención del ciberbullying, estética de la liberación.

  contexto: |-
    Este examen cierra el periodo 3 de grado 8°, donde aprendiste a producir \textbf{piezas multimedia con criterio ético}. Pasaste por: diseño visual y jerarquía (S1), animaciones e hipervínculos (S2), narrativa TED (S3), edición de imagen y derechos (S4), audio (S5), ciberbullying y Línea 141 (S6), grooming/sexting y Ley 1336 (S7), estética de la liberación (S8), proyecto integrador comunitario (S9) y sustentación pública + portafolio (S10).

  pregunta_marco: |-
    ¿Qué cruza el oficio de la narradora de cuentos de las veladas con tu proyecto multimedia integrador del cierre del grado 8°?

aprendizajes:
  - sesion: 1
    titulo: "Diseño visual y jerarquía de información"
  - sesion: 2
    titulo: "Animaciones e hipervínculos: narrativa interactiva"
  - sesion: 3
    titulo: "Narrativa de alto impacto estructura TED"
  - sesion: 4
    titulo: "Edición de imagen y ética visual + Ley 1581"
  - sesion: 5
    titulo: "Audio: captura, edición, formatos"
  - sesion: 6
    titulo: "Ciberbullying: prevención y Línea 141 ICBF"
  - sesion: 7
    titulo: "Grooming y sexting: Ley 1336 y protocolos"
  - sesion: 8
    titulo: "Estética de la liberación: cultura popular y producción ética"
  - sesion: 9
    titulo: "Proyecto integrador comunitario"
  - sesion: 10
    titulo: "Sustentación pública + portafolio digital del grado 8"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un compañero de grado 7° lo más importante que aprendiste sobre producir piezas multimedia con criterio ético, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos). Evita frases hechas como ``ser un buen youtuber''. Se específico con vocabulario del periodo (jerarquía visual, ética, derechos de imagen, Línea 141, estética de la liberación).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo. (3) que se note \textbf{voz propia} de quien hizo el proyecto comunitario.
    retroalimentacion: |-
      Una buena respuesta: ``(1) jerarquía visual decide qué se ve primero; no es decoración, es comunicación. (2) toda imagen de persona requiere consentimiento (Ley 1581) y dignidad. (3) la pieza no termina en el like: termina cuando dignifica a quien retrata.''
    puntos: 1.0

  contexto:
    enunciado: |-
      La narradora de cuentos de las veladas decidía qué se contaba, cómo y a quién protegía. Era editora visual antes de los pixels.

      Responde en 5-7 renglones: \textbf{¿qué del oficio de la narradora cruza con tu disciplina al producir piezas multimedia hoy, y qué se gana al pasar de la palabra-imagen a las herramientas digitales sin perder el criterio ético del cuento?} Da un ejemplo concreto.
    criterio: |-
      Se evalúa: (1) identifica al menos una práctica de la narradora (curar qué se cuenta, modular para audiencias, proteger al sujeto retratado). (2) reconoce qué amplifica lo digital (alcance, velocidad) y qué riesgo trae (publicar sin filtro, viralidad sin contexto). (3) reflexión propia.
    retroalimentacion: |-
      Una buena respuesta: ``La narradora decidía bajar la voz cuando había niños. En el video que hice del barrio decidí blurrear el rostro de un menor que aparecía de paso: lo digital amplifica el alcance, pero la responsabilidad de cuidar al sujeto retratado sigue siendo del autor. El oficio cambia de medio, no de ética.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Tu compañera Estefanía graba en su celular a un menor de edad que llora en la cafetería. \textbf{Sube el video a TikTok el mismo día para mostrar lo "absurda" que estaba la situación}. La pieza recibe 50.000 vistas en 24 horas. Al niño le hicieron memes durante toda la semana.

        Aplicando lo aprendido este periodo, ¿cuál es la observación MÁS importante sobre el caso?
      contexto: |-
        Recuerda: Ley 1581 de 2012 (datos personales) + Ley 1098 (Código de Infancia) + derecho a la imagen + Ley 1620 (convivencia escolar).
      tipo: opcion_multiple
      opciones:
        - "Está bien, era una situación absurda y graciosa."
        - "Violó múltiples normas: derecho a la imagen del menor sin autorización, ciberbullying causado por la publicación, posible incumplimiento de Ley 1581 y Ley 1098 de Infancia."
        - "El problema es que tuvo pocas vistas."
        - "Debió usar otra red social."
      respuesta_index: 1
      criterio: |-
        La opción B es correcta. Identifica las múltiples violaciones legales y éticas. A es la trampa común. C y D son irrelevantes.
      retroalimentacion: |-
        Publicar la imagen de un menor sin autorización + causar ciberbullying viola múltiples leyes en Colombia. Las vistas no exculpan el daño; el oficio multimedia exige criterio antes que viralidad.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Tu proyecto integrador comunitario es \textbf{un mini-documental de 3 minutos sobre el oficio del zapatero del centro de Cartago}, don Aurelio. Vas a publicar el video en YouTube del colegio.

        \textbf{Diseña en 6-8 renglones el plan ético-técnico de producción} aplicando lo aprendido este periodo. Incluye: (a) qué autorización pides (S4), (b) cómo estructuras la narrativa para que dignifique al sujeto sin folclorizarlo (S3, S8), (c) qué decisiones de edición de imagen y audio respetan al protagonista (S4, S5), (d) cómo manejas si don Aurelio aparece molesto en alguna toma (criterio editorial).

        Cierra con una frase de cuidado: \textbf{``Antes de publicar el documental, me aseguro de...''}
      criterio: |-
        Se evalúa: (1) autorización escrita firmada por don Aurelio con consentimiento informado. (2) estructura narrativa TED (gancho-cuerpo-cierre) que dignifique sin folclorizar (ni "el pintoresco zapatero" ni "el último de su oficio"). (3) decisiones de edición que no caricaturicen (no acelerar para ridiculizar, audio limpio de sus palabras, no usar tomas en mal estado físico). (4) descartar tomas donde aparece molesto o pedir consentimiento explícito. (5) frase de cuidado.
      retroalimentacion: |-
        Una buena respuesta: ``Autorización escrita firmada por don Aurelio describiendo dónde se publicará y por cuánto tiempo. Narrativa: 30 seg de su oficio actual, 2 min de la historia personal contada por él, 30 seg de cierre con su voz sobre el futuro. Edito sin filtros graciosos ni efectos que distraigan. Si aparece molesto, le muestro la toma y le pregunto si quiere que la conserve. Antes de publicar, paso el documental a don Aurelio para que dé su visto bueno final.''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto del oficio multimedia con criterio ético. \textbf{Las 3 lentes deben aparecer explícitamente}.

      Cierra el texto con una sola frase de compromiso para el grado 9°: \emph{``Para el próximo año del bachillerato, me comprometo a...''}
    voces:
      dussel: |-
        ``Toda pieza multimedia dignifica o cosifica al sujeto retratado. Saber a quién mi video deja en silencio o expone es la primera ética del oficio."
      estoico: |-
        ``La velocidad de la viralidad no justifica saltar la pregunta del consentimiento. La disciplina del autor exige pausa antes de publicar."
      floridi: |-
        ``En la infoesfera, cada video publicado entra a la conversación común. La calidad ética de la pieza es responsabilidad permanente del autor, no del algoritmo."
    criterio: |-
      Se evalúa: (1) las 3 lentes aplican a aspectos distintos del oficio multimedia. (2) identifica una tensión real (velocidad vs. consentimiento, viral vs. digno, alcance vs. responsabilidad). (3) el compromiso final para el grado 9° es específico.
    retroalimentacion: |-
      Una buena respuesta: ``Mi documental sobre don Aurelio dignifica un oficio (Floridi: información que entra a la conversación). Lente del nosotros me pregunta si lo presento como protagonista o como objeto pintoresco. Lo estoico me recuerda que la viralidad no exonera de pedir consentimiento. Para grado 9° me comprometo a aplicar el mismo criterio al rediseño editorial de la revista escolar.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 3 y, con él, el grado 8°. Lo que llevas no es saber editar video: es el oficio de la narradora de las veladas actualizado al medio digital. El grado 9° te pedirá llevar esa misma disciplina a la historia de la técnica, al diseño editorial y al análisis de datos. La palabra-imagen sigue siendo responsabilidad del autor.

# ─── BANCO DE PRÁCTICA · 22 preguntas ──────────────────────────────
banco_practica:
  - id: "bp-001"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es la jerarquía visual en diseño multimedia?
    opciones:
      - "Hacer todo del mismo tamaño"
      - "Usar muchos colores"
      - "Ordenar elementos para que el ojo recorra la información en el orden que el autor decide"
      - "Agregar efectos"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Jerarquía visual = orden intencional del recorrido del ojo. Es comunicación, no decoración.
    feedback_incorrecto: |-
      Jerarquía visual es orden intencional. Tamaño, color, ubicación: cada decisión guía el orden de lectura.

  - id: "bp-002"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Para qué sirven los hipervínculos en narrativa multimedia interactiva?
    opciones:
      - "Para dar al lector caminos alternativos según su interés (narrativa no lineal)"
      - "Para hacer la pieza más larga"
      - "Para decorar"
      - "Para nada"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Hipervínculos permiten narrativa no lineal: el lector elige caminos según interés.
    feedback_incorrecto: |-
      Narrativa no lineal: el lector elige rutas. Es lo opuesto al video pasivo de inicio a fin.

  - id: "bp-003"
    bloom: comprender
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la estructura típica de una narrativa TED?
    opciones:
      - "Solo datos"
      - "Gancho inicial + historia central + idea-llave + cierre con llamado a la acción"
      - "Solo conclusiones"
      - "Lectura de slides"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Gancho + historia + idea-llave + cierre. La emoción y los datos se entrelazan.
    feedback_incorrecto: |-
      Gancho + historia + idea-llave + cierre con CTA. Es la anatomía probada de la narrativa TED.

  - id: "bp-004"
    bloom: analizar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué ley colombiana regula el uso de imágenes con datos personales?
    opciones:
      - "Ley 100 (salud)"
      - "Ley 30 (educación superior)"
      - "Ley 23 (derechos de autor)"
      - "Ley 1581 de 2012 (protección de datos personales)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Ley 1581 de 2012. Exige consentimiento informado para uso de datos personales (incluyendo imagen).
    feedback_incorrecto: |-
      Ley 1581 de 2012. Marco principal de protección de datos personales en Colombia.

  - id: "bp-005"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Quieres usar la foto de un compañero en un afiche del colegio. ¿Qué necesitas?
    opciones:
      - "Solo tomar la foto"
      - "Pedir solo permiso al colegio"
      - "Nada"
      - "Autorización informada del compañero (y de sus acudientes si es menor)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Autorización informada del titular + acudiente si es menor. Sin eso, viola Ley 1581 y Ley 1098 (Infancia).
    feedback_incorrecto: |-
      Autorización informada. Para menores, también de los acudientes. Sin consentimiento, hay violación legal.

  - id: "bp-006"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Estás grabando audio para tu pieza. ¿Cuál formato es estándar para distribución web?
    opciones:
      - ".mp3 o .m4a (comprimidos, calidad razonable, tamaño manejable)"
      - ".docx"
      - ".jpg"
      - ".pdf"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. MP3 y M4A son estándar para distribución web. .wav es alta calidad pero archivos muy grandes.
    feedback_incorrecto: |-
      .mp3 o .m4a. Comprimidos, calidad razonable, manejables. .wav reservado para edición o archivo maestro.

  - id: "bp-007"
    bloom: recordar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el número de la Línea oficial del ICBF para denuncia y orientación en casos de maltrato a niños y adolescentes?
    opciones:
      - "123"
      - "911"
      - "141"
      - "112"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Línea 141 del ICBF. Atención 24/7 para casos de maltrato, abuso, violencia contra niños y adolescentes en Colombia.
    feedback_incorrecto: |-
      Línea 141 del ICBF. Es la línea nacional para protección de la infancia y adolescencia.

  - id: "bp-008"
    bloom: comprender
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es el ciberbullying?
    opciones:
      - "Un chiste virtual"
      - "Acoso repetido y sistemático a través de medios digitales con intención de causar daño"
      - "Cualquier mensaje en internet"
      - "Una pelea normal"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Ciberbullying = acoso repetido + sistemático + intencional + por medios digitales. Tiene impacto psicológico real.
    feedback_incorrecto: |-
      Acoso repetido, sistemático, intencional, por medios digitales. No es un chiste ni una pelea: es violencia con consecuencias.

  - id: "bp-009"
    bloom: analizar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué ley colombiana protege específicamente contra el grooming?
    opciones:
      - "Ley 100"
      - "Ley 30"
      - "Ley 1336 de 2009 (protección contra abuso sexual de menores online)"
      - "Ley 23"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Ley 1336 de 2009. Penaliza el grooming (acoso de adultos a menores en internet).
    feedback_incorrecto: |-
      Ley 1336 de 2009. Penaliza el grooming. Es marco principal junto con el Código Penal.

  - id: "bp-010"
    bloom: evaluar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es la estética de la liberación según Dussel?
    opciones:
      - "Hacer cosas bonitas"
      - "Producción cultural que dignifica al sujeto retratado en lugar de cosificarlo o folclorizarlo"
      - "Estilo gráfico moderno"
      - "Diseño con muchos colores"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Estética de la liberación = producir desde y con los retratados, no sobre ellos como objeto exótico.
    feedback_incorrecto: |-
      Producción que dignifica en lugar de cosificar. Es lo opuesto a la "estética del pintoresco" o el folclor turístico.

  - id: "bp-011"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál oficio ancestral conecta con la multimedia y la ciberética?
    opciones:
      - "La narradora de cuentos de las veladas del Pacífico y el Valle"
      - "El comerciante de plaza"
      - "El sastre"
      - "El piloto"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. La narradora era editora visual antes de los pixels: curaba qué contar, cómo y a quién proteger.
    feedback_incorrecto: |-
      La narradora de las veladas. Su oficio de decidir qué se cuenta y cómo cruza directamente con la edición multimedia ética.

  - id: "bp-012"
    bloom: aplicar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cómo se aplica la jerarquía visual en una infografía sobre prevención de ciberbullying?
    opciones:
      - "Todo del mismo tamaño"
      - "Solo texto sin imágenes"
      - "Muchos colores brillantes"
      - "El mensaje clave (qué hacer si te pasa) más grande arriba; detalles más pequeños abajo; teléfono 141 destacado"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Jerarquía pone primero lo más urgente (qué hacer, dónde llamar) y los detalles después.
    feedback_incorrecto: |-
      Mensaje clave + teléfono 141 destacados; detalles abajo. La jerarquía sirve a la urgencia del lector.

  - id: "bp-013"
    bloom: analizar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Tu narrativa TED de 3 minutos tiene 4 minutos. ¿Qué haces?
    opciones:
      - "La dejo así"
      - "Identifico qué partes son ornamento (no aportan al mensaje) y las recorto"
      - "Hablo más rápido"
      - "La hago de 5 minutos"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Recortar lo que sobra es disciplina TED. Lo esencial cabe; lo demás distrae.
    feedback_incorrecto: |-
      Recortar lo accesorio. Una narrativa TED bien hecha tiene la duración justa. Hablar rápido no respeta al oyente.

  - id: "bp-014"
    bloom: evaluar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas prácticas viola la ética visual?
    opciones:
      - "Pedir autorización al fotografiado"
      - "Borrar la foto si la persona se arrepiente"
      - "Editar a una persona para que se vea ridícula y publicar el meme"
      - "Citar la fuente de imágenes ajenas"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Editar para ridiculizar y publicar viola ética y leyes (derecho a la imagen, ciberbullying si es repetido).
    feedback_incorrecto: |-
      Editar para ridiculizar es violación ética. Las otras opciones son buenas prácticas profesionales.

  - id: "bp-015"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Tu audio tiene ruido de fondo molesto. ¿Qué haces?
    opciones:
      - "Lo publico igual"
      - "Grabo todo de nuevo siempre"
      - "Ignoro el ruido"
      - "Edito con reducción de ruido (Audacity, GarageBand) antes de publicar"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Audacity y GarageBand son gratuitos y permiten reducir ruido. Es paso obligado antes de publicar.
    feedback_incorrecto: |-
      Editar el audio (reducir ruido + normalizar volumen) antes de publicar. Es oficio mínimo.

  - id: "bp-016"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Un compañero te cuenta que recibe insultos diarios por WhatsApp de un grupo de la clase. ¿Qué haces?
    opciones:
      - "Le doy apoyo, le sugiero llamar al 141 / hablar con orientación escolar / Ley 1620 de convivencia escolar"
      - "No me meto"
      - "Le digo que se aguante"
      - "Le doy consejos genéricos"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Apoyar + dirigir a recursos oficiales (141, orientación, Ley 1620). Es ciudadanía digital activa.
    feedback_incorrecto: |-
      Apoyar + dirigir a recursos. 141 del ICBF, orientación escolar, Ley 1620 de convivencia escolar dan canales reales.

  - id: "bp-017"
    bloom: evaluar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Un adulto te contacta por Instagram pidiéndote fotos íntimas a cambio de regalos. ¿Qué haces?
    opciones:
      - "Bloquear, capturar evidencia, reportar a Línea 141 y a CAI Virtual (grooming es delito en Ley 1336)"
      - "Responder a ver qué quiere"
      - "Aceptar si los regalos son grandes"
      - "Ignorar sin más"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Bloquear + capturar evidencia + reportar a 141 y CAI Virtual. Es grooming penalizado por Ley 1336 de 2009.
    feedback_incorrecto: |-
      Bloquear, capturar evidencia, reportar a 141 y CAI Virtual. Es grooming, delito en Colombia (Ley 1336).

  - id: "bp-018"
    bloom: analizar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Quieres hacer un video sobre la salsa caleña. ¿Cuál enfoque sigue la estética de la liberación?
    opciones:
      - "Mostrarla como folclor exótico para turistas"
      - "Usar estereotipos viejos"
      - "Solo música sin contexto"
      - "Entrevistar a bailarines locales, dejarlos hablar de su oficio, mostrar el barrio como protagonista"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Producir CON los retratados (no SOBRE ellos), dejar que el sujeto sea protagonista de su propia historia.
    feedback_incorrecto: |-
      Entrevistar a los bailarines locales como protagonistas. Es la diferencia entre estética del folclor turístico y estética de la liberación.

  - id: "bp-019"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu proyecto comunitario combina los aprendizajes del periodo. ¿Cuál NO es elemento esencial?
    opciones:
      - "Idea con propósito social claro"
      - "Mucho efecto especial llamativo sin función comunicativa"
      - "Autorizaciones legales en orden"
      - "Pieza multimedia que respete al sujeto retratado"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Los efectos sin función son ornamento. Lo esencial es propósito + legalidad + respeto al sujeto.
    feedback_incorrecto: |-
      Los efectos por sí mismos no son esenciales. Lo esencial: propósito social, legalidad, respeto al sujeto retratado.

  - id: "bp-020"

clave: "9-1"
grado: 9
periodo: 1
completo: true

titulo: "Examen final · Técnica y tecnología en perspectiva histórica"
titulo_portada: |-
  Examen final ---
  Técnica y tecnología
  en perspectiva histórica

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen: tu firma como técnico crítico depende de eso.

apertura:
  saber_ancestral: |-
    En los valles altos del Quindío y el Valle del Cauca, los \textbf{alfareros Quimbayas} produjeron durante siglos piezas de cerámica que hoy se exhiben en museos del mundo. Para hacer una sola vasija, el alfarero dominaba una \textbf{cadena de técnicas} que ningún libro le enseñó: \emph{conocer la arcilla} (qué barranco da el barro fino, en qué época del año), \emph{prepararla} (golpear, amasar, dejar reposar), \emph{moldearla} (con las manos o con un torno simple de madera), \emph{decorarla} (con punzones de hueso, sellos de madera, pinturas vegetales), \emph{secarla} (al sol, a la sombra, según humedad), \emph{cocerla} (horno de leña a temperatura controlada por el oído y el ojo). Cada paso era \textbf{técnica}: conocimiento del cuerpo aplicado a un material concreto, transmitido de maestro a aprendiz por imitación y palabra. Cuando la rueda llegó al torno y después el horno eléctrico, esos instrumentos se llamaron \textbf{tecnología}: la técnica amplificada por un medio. Pero la sabiduría seguía siendo del alfarero, no del torno ni del horno. La diferencia entre técnica (saber del cuerpo) y tecnología (medio que amplifica la técnica) es la pregunta que atraviesa todo este periodo: \emph{¿quién decide cuándo y para qué se usa la tecnología?}.

  contexto: |-
    Este examen cierra el periodo 1 de grado 9°, donde recorriste la \textbf{historia de la técnica desde el cuerpo hasta el chip}: máquinas simples del campo (S1-S2), la balanza como acto político (S3), la línea del tiempo del fuego a la imprenta (S4), la Revolución Industrial (S5), la imprenta (S6), la electricidad (S7), la era digital (S8), las tecnologías propias de los pueblos andinos y afro-pacíficos (S9) y el manifiesto del técnico crítico (S10). La pregunta detrás de las 10 sesiones fue una sola: \emph{¿cómo se distingue entre técnica y tecnología, y por qué importa saber quién decide?}.

  pregunta_marco: |-
    ¿Qué cruza el oficio del alfarero Quimbaya con tu rol como técnico crítico contemporáneo que decide qué tecnologías adopta y cuáles cuestiona?

aprendizajes:
  - sesion: 1
    titulo: "¿Qué es técnica? Del cuerpo al instrumento"
  - sesion: 2
    titulo: "Máquinas simples del campo: rueda, agua"
  - sesion: 3
    titulo: "La balanza y el peso como acto político"
  - sesion: 4
    titulo: "Línea del tiempo de la técnica: del fuego a la imprenta"
  - sesion: 5
    titulo: "Revolución industrial: máquinas que cambian el trabajo"
  - sesion: 6
    titulo: "La imprenta: reproducir el texto a escala"
  - sesion: 7
    titulo: "La electricidad: luz, motor, comunicación"
  - sesion: 8
    titulo: "Era digital: del ábaco al chip"
  - sesion: 9
    titulo: "Tecnologías propias de pueblos del Valle, Pacífico y Andes"
  - sesion: 10
    titulo: "Manifiesto del técnico crítico"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que explicarle a un estudiante de grado 7° lo más importante que aprendiste en este periodo sobre la diferencia entre técnica y tecnología, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos). Evita frases hechas como ``la tecnología es lo nuevo'': se específico con vocabulario del periodo (técnica del cuerpo, instrumento, máquina, decisión técnica).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos una \textbf{distinción técnica} del periodo (técnica del cuerpo vs. tecnología como medio amplificador, ejemplos históricos concretos, la pregunta política del ``quién decide''). (3) que se note \textbf{voz propia} y no repetición de manual.
    retroalimentacion: |-
      Una buena respuesta cruza distinción con historia: ``(1) la técnica es saber del cuerpo (cómo amasar arcilla, cómo afinar un cuchillo); la tecnología es el medio que la amplifica (torno, máquina). (2) Tecnología sin técnica detrás es atajo que pierde la sabiduría del oficio. (3) Toda decisión técnica es política: la imprenta no es neutra, la electricidad no es neutra, el chip no es neutro; siempre hay alguien que decide.''
    puntos: 1.0

  contexto:
    enunciado: |-
      El alfarero Quimbaya dominaba una cadena de técnicas del cuerpo (conocer la arcilla, moldear, decorar, cocer) que ningún libro le enseñó: las aprendió de su maestro por imitación y palabra.

      Responde en 5-7 renglones: \textbf{¿qué del oficio del alfarero cruza con tu relación contemporánea con la tecnología digital, y qué se pierde cuando se adopta una tecnología sin haber comprendido primero la técnica que estaba detrás?} Da un ejemplo concreto de cada lado.
    criterio: |-
      Se evalúa: (1) que se identifique al menos una \textbf{práctica concreta} del alfarero (transmisión maestro-aprendiz, conocimiento del material, ajuste por experiencia). (2) que se nombre una pérdida real cuando la tecnología sustituye en lugar de amplificar (perder el saber del oficio, depender ciegamente del instrumento, no entender qué hace la máquina). (3) que se note reflexión propia.
    retroalimentacion: |-
      Una buena respuesta nombra la pérdida: ``El alfarero ajustaba el horno por el sonido y el color de la llama. Quien hoy usa un horno eléctrico digital con temperatura preestablecida obtiene la pieza, pero pierde la conversación con el material. Cuando uso ChatGPT para escribir sin haber escrito antes a mano, ocurre lo mismo: tengo el texto, pero no entiendo la técnica de la escritura, y eso me deja dependiente.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Tu compañera Sofía afirma en clase: \emph{``En el siglo XVIII, la Revolución Industrial inventó la idea misma de máquina. Antes no había tecnología.''}

        Aplicando lo aprendido este periodo, ¿cuál es la observación MÁS rigurosa sobre la afirmación de Sofía?
      contexto: |-
        Recuerda: la línea del tiempo de la técnica empieza con el fuego, no con la Revolución Industrial. Los pueblos pre-hispánicos del Valle y los Andes tenían tecnologías sofisticadas (alfarería, metalurgia, irrigación) siglos antes.
      tipo: opcion_multiple
      opciones:
        - "Sofía confunde técnica con máquina industrial; los pueblos pre-hispánicos ya tenían tecnologías (alfarería, metalurgia, irrigación) milenios antes."
        - "Sofía tiene razón: antes de 1760 no había tecnología propiamente dicha."
        - "La Revolución Industrial es solo un mito europeo."
        - "El error de Sofía es no mencionar Inglaterra."
      respuesta_index: 0
      criterio: |-
        La opción A es correcta. Es la observación histórica rigurosa que recupera el aporte de los pueblos pre-hispánicos del Valle y la ampliación adecuada del concepto de tecnología más allá de la industria. A repite el sesgo eurocéntrico. C es desmedida (la Rev. Industrial sí existió). D es trivial.
      retroalimentacion: |-
        Lo riguroso es ampliar el concepto: tecnología es cualquier medio que amplifica la técnica del cuerpo. La metalurgia muisca, la cerámica Quimbaya y la irrigación Tairona son tecnologías sofisticadas anteriores al motor a vapor.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Tu tío sembrador en la zona rural de Cartago tiene 60 años. Está pensando comprar una pequeña aplicación de celular para registrar siembras y ventas. Te pregunta: \emph{``¿Esa tecnología me va a ayudar o me va a quitar el oficio?''}

        \textbf{Diseña en 6-8 renglones tu respuesta como técnico crítico} aplicando lo aprendido este periodo. Tu respuesta debe (a) reconocer la sabiduría que el oficio ya tiene, (b) identificar qué amplificaría la tecnología y qué NO debe sustituir, (c) proponerle un plan razonable para probarla sin perder lo que ya sabe.

        Cierra con una sola frase de cuidado: \textbf{``Tío, recuerde que la herramienta sirve cuando...''}
      criterio: |-
        Se evalúa: (1) reconocer el oficio del tío como técnica del cuerpo (saber leer el clima, el suelo, el ciclo de la luna, etc.). (2) identificar claramente qué amplifica (memoria de fechas, cálculos de ingresos) y qué NO debe sustituir (juicio del agricultor sobre el cultivo). (3) plan razonable: probar 1 mes en paralelo con el cuaderno actual. (4) frase de cuidado que muestre criterio (la herramienta sirve cuando amplifica el oficio, no cuando lo reemplaza).
      retroalimentacion: |-
        Una buena respuesta: ``Tío, su oficio sabe cosas que ninguna app sabe: cuándo está la luna en mengua, cómo huele la tierra antes de la lluvia, cuándo el árbol cargado necesita poda. La app puede ayudar con el conteo (cuántas matas, qué le pagaron, cuándo sembró). Pero la decisión de qué sembrar, eso es suyo. Pruébela 1 mes en paralelo con su cuaderno; si después de ese mes le ahorra trabajo sin estorbar el oficio, sígala usando. Recuerde que la herramienta sirve cuando amplifica lo que usted ya sabe, no cuando lo reemplaza.''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto de la relación entre técnica y tecnología. \textbf{Las 3 lentes deben aparecer explícitamente}.

      Cierra el texto con una sola frase de compromiso: \emph{``Para el periodo 2, me comprometo a...''}
    voces:
      dussel: |-
        ``Toda tecnología trae con ella la decisión de qué saberes amplifica y cuáles deja silenciados. Saber qué oficio dignifica mi tecnología y cuál cosifica es la primera ética del técnico crítico."
      estoico: |-
        ``El instrumento no exime del oficio. El alfarero con torno sigue siendo alfarero; quien deja al instrumento decidir por él pierde su oficio."
      floridi: |-
        ``En la infoesfera, toda tecnología digital entra a la conversación común. Su éxito ético no es la velocidad: es la calidad del oficio humano que sostiene."
    criterio: |-
      Se evalúa: (1) las 3 lentes aparecen y se aplican a aspectos distintos. (2) identifica una tensión real (técnica que se pierde vs. tecnología que se gana, oficio del cuerpo vs. dependencia del instrumento). (3) el compromiso final es específico.
    retroalimentacion: |-
      Una buena respuesta: ``La lente del nosotros me pide preguntar qué oficios mi celular silencia (el cartero, el mensajero, el escribiente). La estoica me recuerda que tener WhatsApp no me hace comunicador: el oficio de escribir bien sigue siendo mío. Floridi me invita a entender que mi forma de usar tecnología contribuye a la infoesfera común. Para P2 me comprometo a aprender diseño editorial recordando que el oficio del tipógrafo está debajo del software.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 1 con perspectiva histórica de tu propio oficio digital. El periodo 2 (Diseño editorial) te pedirá aplicar la mirada del técnico crítico al oficio del tipógrafo: cómo la imprenta y los programas digitales heredan la misma disciplina de poner palabras y imágenes en una página con sentido.

# ─── BANCO DE PRÁCTICA · 22 preguntas ──────────────────────────────
banco_practica:
  - id: "bp-001"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la diferencia central entre técnica y tecnología?
    opciones:
      - "Técnica es saber del cuerpo aplicado a un material; tecnología es el medio que amplifica la técnica"
      - "Son lo mismo"
      - "Técnica es antigua, tecnología es moderna"
      - "Técnica es de pueblos pobres, tecnología es de ricos"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Técnica = saber del cuerpo. Tecnología = medio que amplifica la técnica. Esa distinción atraviesa todo el periodo.
    feedback_incorrecto: |-
      Técnica es saber del cuerpo (cómo amasar arcilla); tecnología es el medio que la amplifica (torno). No es cuestión de antiguo/moderno ni de clase.

  - id: "bp-002"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas NO es una máquina simple del campo colombiano?
    opciones:
      - "La rueda hidráulica del molino"
      - "La balanza del granero"
      - "La polea del pozo"
      - "El motor eléctrico industrial"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Las 3 primeras son máquinas simples (rueda, palanca, polea). El motor eléctrico es máquina compuesta industrial moderna.
    feedback_incorrecto: |-
      El motor eléctrico no es máquina simple. Las simples (rueda, palanca, polea, plano inclinado) son base del campo tradicional.

  - id: "bp-003"
    bloom: analizar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Por qué la sesión 3 dice que la balanza es "acto político"?
    opciones:
      - "Porque pesa cosas"
      - "Porque quien decide la unidad y la calibra define quién pierde y quién gana en cada transacción"
      - "Porque es de metal"
      - "Porque está en el granero"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La balanza no es neutra: la calibración decide la economía cotidiana. Por eso fue regulada históricamente por las autoridades.
    feedback_incorrecto: |-
      La balanza decide quién pierde y quién gana cada transacción. La calibración no es técnica neutra: es decisión política con consecuencias.

  - id: "bp-004"
    bloom: comprender
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál fue la primera técnica importante en la línea del tiempo del periodo?
    opciones:
      - "La imprenta"
      - "El motor a vapor"
      - "El fuego"
      - "El chip"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. El fuego es la primera técnica fundamental: transformación intencional de la materia.
    feedback_incorrecto: |-
      El fuego es la primera. Antes solo había uso de herramientas naturales; con fuego empieza la transformación intencional.

  - id: "bp-005"
    bloom: analizar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué cambió la Revolución Industrial respecto al trabajo del artesano?
    opciones:
      - "Nada"
      - "Hizo el oficio más fácil"
      - "Separó al trabajador del oficio completo: ya no hace toda la pieza, hace una parte"
      - "Aumentó el salario del artesano"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. División del trabajo: el artesano que sabía todo el oficio fue reemplazado por obreros que repiten una parte. Es el cambio estructural.
    feedback_incorrecto: |-
      Separó al trabajador del oficio completo. La división del trabajo perdió la sabiduría integral del artesano para ganar escala.

  - id: "bp-006"
    bloom: comprender
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál fue el aporte central de la imprenta de Gutenberg?
    opciones:
      - "Inventar el alfabeto"
      - "Crear los libros por primera vez"
      - "Reemplazar a los escritores"
      - "Reproducir el mismo texto muchas veces, masificando el acceso a la lectura"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. La imprenta no inventa el libro: lo reproduce a escala, haciendo accesible la lectura a más personas.
    feedback_incorrecto: |-
      Reproducción a escala. Los libros existían antes; la imprenta los multiplica y democratiza el acceso.

  - id: "bp-007"
    bloom: analizar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos NO fue un efecto histórico de la electricidad?
    opciones:
      - "Iluminación de ciudades y campos"
      - "Eliminación total de los oficios manuales"
      - "Funcionamiento de motores"
      - "Comunicaciones a distancia (telégrafo, teléfono, radio)"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La electricidad iluminó, dio motor y permitió comunicación. NO eliminó los oficios manuales (siguen vivos: panadero, sastre, herrero).
    feedback_incorrecto: |-
      Los oficios manuales no se eliminaron. La electricidad amplifica pero los oficios de cuerpo siguen vivos.

  - id: "bp-008"
    bloom: comprender
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es la línea de evolución que conecta el ábaco con el chip moderno?
    opciones:
      - "Ambos son herramientas de cálculo; el chip es la versión electrónica del ábaco mecánico"
      - "No tienen relación"
      - "El chip reemplazó a las manos"
      - "El ábaco era para niños"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. El ábaco, las calculadoras mecánicas y el chip son una misma línea: instrumentos que amplifican el cálculo.
    feedback_incorrecto: |-
      Ambos son instrumentos de cálculo. El chip es continuidad de una larga historia que empezó con piedras, ábacos y calculadoras mecánicas.

  - id: "bp-009"
    bloom: evaluar
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas es una tecnología propia de los pueblos colombianos?
    opciones:
      - "El microprocesador"
      - "El motor a vapor"
      - "La imprenta"
      - "Las técnicas Quimbaya de cerámica con barniz que el mundo está redescubriendo"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Las técnicas Quimbaya son sofisticación tecnológica propia: barnices vegetales, hornos de leña controlados, decoración por punzones.
    feedback_incorrecto: |-
      Las técnicas Quimbaya son tecnología propia avanzada. Hoy se redescubren y estudian en universidades internacionales.

  - id: "bp-010"
    bloom: crear
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Tu manifiesto del técnico crítico debe incluir...
    opciones:
      - "Una postura sobre cuándo adoptar, cuándo cuestionar, qué oficios proteger"
      - "Solo elogios a la tecnología"
      - "Solo rechazos a la modernidad"
      - "Una lista de aparatos electrónicos"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. El técnico crítico tiene postura: adopta con criterio, cuestiona con razones, protege lo que la tecnología no debería destruir.
    feedback_incorrecto: |-
      Postura clara: adoptar, cuestionar, proteger. El técnico crítico no es elogio ciego ni rechazo automático.

  - id: "bp-011"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el oficio ancestral que conecta con el periodo entero?
    opciones:
      - "El programador del siglo XX"
      - "El ingeniero industrial"
      - "El alfarero Quimbaya con su cadena de técnicas del cuerpo"
      - "El piloto de avión"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. El alfarero Quimbaya dominaba la técnica del cuerpo; el torno y el horno son tecnología que amplifica el oficio.
    feedback_incorrecto: |-
      El alfarero Quimbaya. Su cadena de técnicas (preparar arcilla, moldear, decorar, secar, cocer) es modelo de oficio integral.

  - id: "bp-012"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      Una palanca permite levantar 100 kg con esfuerzo de 25 kg. ¿Es máquina simple?
    opciones:
      - "No"
      - "Sí: amplifica la fuerza del cuerpo sin requerir energía externa"
      - "Solo si es metálica"
      - "Solo si es industrial"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Las máquinas simples (palanca, rueda, polea, plano inclinado, cuña, tornillo) amplifican el esfuerzo del cuerpo.
    feedback_incorrecto: |-
      Sí, la palanca es máquina simple. Amplifica la fuerza con solo geometría, sin energía externa.

  - id: "bp-013"
    bloom: analizar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Un comerciante calibra su balanza para mostrar 10% más peso. ¿Qué problema técnico-político tiene?
    opciones:
      - "Ninguno"
      - "Estafa al cliente porque modifica intencionalmente la unidad de medida"
      - "Mejor servicio"
      - "Es legal"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La balanza descalibrada es estafa: la unidad de medida debe ser fija. Por eso hay autoridades que la regulan.
    feedback_incorrecto: |-
      Es estafa. La balanza es acto político: quien manipula la unidad gana ilegítimamente. Existen leyes que lo prohíben.

  - id: "bp-014"
    bloom: comprender
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál orden cronológico es CORRECTO?
    opciones:
      - "Imprenta → fuego → electricidad → chip"
      - "Chip → fuego → rueda → imprenta"
      - "Fuego → rueda → imprenta → electricidad → chip"
      - "Todo al mismo tiempo"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Fuego (prehistoria) → rueda (Neolítico) → imprenta (s. XV) → electricidad (s. XIX) → chip (s. XX).
    feedback_incorrecto: |-
      Fuego (más antiguo) → rueda → imprenta → electricidad → chip (más reciente). Cada hito amplifica el anterior.

  - id: "bp-015"
    bloom: evaluar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿En qué siglo se ubica típicamente la Revolución Industrial?
    opciones:
      - "Siglos XVIII-XIX (a partir de Inglaterra y luego Europa y América)"
      - "Siglo XV"
      - "Siglo XXI"
      - "Antes de Cristo"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Inicios mediados del siglo XVIII en Inglaterra; expansión en los siglos XVIII y XIX.
    feedback_incorrecto: |-
      Siglos XVIII-XIX. Empezó en Inglaterra alrededor de 1760 con el motor a vapor y la mecanización textil.

  - id: "bp-016"
    bloom: analizar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué consecuencia social trajo la imprenta?
    opciones:
      - "Disminuyó la lectura"
      - "Eliminó a los autores"
      - "Hizo más caros los libros"
      - "Democratizó el acceso a libros y aceleró la difusión de ideas (Reforma, Ciencia, Educación)"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. La imprenta abarata libros, masifica lectura y acelera la difusión de ideas. La Reforma y la Ciencia moderna nacen gracias a ella.
    feedback_incorrecto: |-

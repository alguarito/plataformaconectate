clave: "9-2"
grado: 9
periodo: 2
completo: true

titulo: "Examen final · Diseño editorial y maquetación"
titulo_portada: |-
  Examen final ---
  Diseño editorial
  y maquetación

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen: tu firma como editor depende de eso.

apertura:
  saber_ancestral: |-
    Hasta finales del siglo XX, en una calle del centro de Cartago había una \textbf{tipografía artesanal}: un taller con olor a tinta donde tres hombres mayores trabajaban con \textbf{tipos móviles de plomo}. El \emph{tipógrafo} componía las páginas letra por letra, eligiendo cada carácter de un casillero, ajustando los espacios con láminas finas de bronce, decidiendo dónde caía cada palabra para que la página quedara con \textbf{ritmo de lectura}. No usaba reglas escritas: tenía la regla en el cuerpo. Sabía que una columna ancha cansa al ojo, que un título debe respirar, que el espacio en blanco no es desperdicio sino \emph{aire que el lector necesita}. Cuando aparecieron los computadores y los programas de diseño, todo eso se llamó \textbf{diseño editorial}, pero los principios eran los mismos: \emph{jerarquía, ritmo, accesibilidad, intención}. La diferencia entre un tipógrafo de los años 70 y un diseñador con Figma de hoy no es el oficio: es el medio. La regla en el cuerpo sigue siendo la misma.

  contexto: |-
    Este examen cierra el periodo 2 de grado 9°, donde aprendiste el \textbf{oficio del diseñador editorial} desde sus principios hasta producir una revista terminada. Pasaste por: ¿qué es diseñar? (S1), página y cuadrícula (S2), tipografía (S3), color con contraste y accesibilidad (S4), imagen y texto con ritmo de lectura (S5), herramientas digitales como Figma/Canva/Adobe Express (S6), accesibilidad lectora (S7), edición y corrección (S8), maquetar la revista completa (S9) y sustentación pública (S10).

  pregunta_marco: |-
    ¿Qué cruza el oficio del tipógrafo de Cartago con tu revista hecha en Canva o Figma?

aprendizajes:
  - sesion: 1
    titulo: "¿Qué es diseñar? Orden, jerarquía, intención"
  - sesion: 2
    titulo: "Página y cuadrícula: primer principio del orden"
  - sesion: 3
    titulo: "Tipografía: la voz visible de las palabras"
  - sesion: 4
    titulo: "Color editorial: contraste, jerarquía, accesibilidad"
  - sesion: 5
    titulo: "Imagen y texto: ritmo de la lectura"
  - sesion: 6
    titulo: "Herramientas digitales: Figma, Canva, Adobe Express"
  - sesion: 7
    titulo: "Accesibilidad lectora: WCAG, contraste AA, tamaños"
  - sesion: 8
    titulo: "Edición y corrección: el ojo crítico"
  - sesion: 9
    titulo: "Maquetar la revista completa: flujo de trabajo"
  - sesion: 10
    titulo: "Sustentación pública de la revista"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un compañero que solo sabe escribir en Word lo más importante que aprendiste este periodo, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos). Evita frases hechas como ``hacer cosas bonitas'': se específico con vocabulario del periodo (cuadrícula, jerarquía, contraste, accesibilidad, ritmo).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo (cuadrícula, jerarquía, tipografía, contraste WCAG, ritmo, etc.). (3) que se note \textbf{voz propia} de quien efectivamente diseñó una revista.
    retroalimentacion: |-
      Una buena respuesta cruza método con experiencia: ``(1) la cuadrícula es el primer principio del orden: sin ella, la página parece basurero visual. (2) la jerarquía dice al ojo qué leer primero (título grande, subtítulo mediano, cuerpo pequeño). (3) el espacio en blanco no es desperdicio: es aire que respira el lector.''
    puntos: 1.0

  contexto:
    enunciado: |-
      El tipógrafo de Cartago componía las páginas letra por letra y tenía la regla del diseño editorial ``en el cuerpo'', sin necesidad de software.

      Responde en 5-7 renglones: \textbf{¿qué del oficio del tipógrafo cruza con tu trabajo en Canva o Figma, y qué se gana o se pierde al pasar del tipo de plomo al programa digital?} Da un ejemplo concreto.
    criterio: |-
      Se evalúa: (1) identifica al menos un principio del tipógrafo que sigue vivo (jerarquía, ritmo, espacio en blanco, contraste). (2) reconoce qué se gana con lo digital (rapidez, deshacer, escalar) y qué riesgo trae (perder la conciencia del espacio, abusar de efectos, no entender qué hace cada decisión). (3) reflexión propia.
    retroalimentacion: |-
      Una buena respuesta: ``El tipógrafo ajustaba el espacio entre letras con láminas de bronce. En Figma yo aprieto un atajo y kerning se ajusta automático: gané rapidez, perdí la conciencia del milímetro. La regla en el cuerpo era saber que el espacio no se llena sin razón; en lo digital es fácil olvidar esa disciplina y rellenar todo con efectos.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Tu compañera Camila diseñó una revista de 12 páginas en Canva. Su página de inicio tiene: \textbf{título principal en tipografía cursiva ornamental rosa pastel sobre fondo blanco; subtítulo en mayúsculas azul claro; cuerpo de texto en fuente serif gris claro sobre fondo gris muy claro}.

        Aplicando lo aprendido este periodo, ¿cuál es el problema MÁS importante de su diseño?
      contexto: |-
        Recuerda los principios del periodo: jerarquía visual + contraste WCAG AA mínimo (4.5:1 para texto) + accesibilidad lectora.
      tipo: opcion_multiple
      opciones:
        - "Está bien, se ve muy creativa."
        - "Tiene problema de contraste insuficiente (rosa pastel sobre blanco, gris claro sobre gris claro) que viola accesibilidad WCAG AA y dificulta lectura."
        - "Le falta más cursiva."
        - "Debería usar Photoshop en lugar de Canva."
      respuesta_index: 1
      criterio: |-
        La opción B es correcta. Identifica el problema de accesibilidad (contraste insuficiente) que es el principio irrenunciable del periodo. A es la trampa estética común. C agrava el problema. D es irrelevante.
      retroalimentacion: |-
        Contraste insuficiente excluye a lectores con baja visión y dificulta la lectura para todos. WCAG AA exige 4.5:1 mínimo para texto. La revista debe poder leerse, no solo verse.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Vas a diseñar la portada de la próxima edición de tu revista escolar. El tema del número es \emph{``Saberes ancestrales de Cartago en el siglo XXI''}.

        \textbf{Diseña en 6-8 renglones la portada} aplicando lo aprendido este periodo. Incluye: (a) decisión de cuadrícula (cuántas columnas, dónde se ubica el título), (b) jerarquía tipográfica (tamaños y pesos relativos para título, subtítulo, autoría), (c) decisión de color con justificación de contraste, (d) elemento visual (foto, ilustración, símbolo) y dónde lo ubicas. Cierra explicando \textbf{a qué lector quieres llegar y cómo el diseño respeta su tiempo}.
      criterio: |-
        Se evalúa: (1) decisión de cuadrícula concreta (no genérica). (2) jerarquía con relaciones numéricas claras (ej. título 48pt, subtítulo 24pt, autor 12pt). (3) decisión de color con consciencia de contraste. (4) elemento visual con función (no decoración). (5) cierre que muestra criterio del lector concreto.
      retroalimentacion: |-
        Una buena respuesta: ``Cuadrícula de 3 columnas; título 'SABERES ANCESTRALES' a 2 columnas en la parte alta, tipografía sans-serif bold 48pt en negro sobre fondo crema. Subtítulo 'Cartago en el siglo XXI' a 16pt color tierra debajo. En la columna libre, ilustración de un molino de río. Autor abajo a la derecha 10pt. Quiero llegar a estudiantes de 14-16 años que ven la portada en 3 segundos y deciden si abrir; el contraste alto y la jerarquía clara respetan ese tiempo limitado.''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto del oficio del diseño editorial. \textbf{Las 3 lentes deben aparecer explícitamente}.

      Cierra el texto con una sola frase de compromiso: \emph{``Para el periodo 3, me comprometo a...''}
    voces:
      dussel: |-
        ``Toda revista incluye y excluye con su diseño: el contraste decide quién puede leer, la jerarquía decide qué voz se escucha primero, el idioma decide quién queda fuera."
      estoico: |-
        ``Cada elemento de la página tiene un porqué o sobra. El diseño disciplinado quita más de lo que añade."
      floridi: |-
        ``En la infoesfera, tu revista entra a la conversación común. Su accesibilidad no es opcional: es ética del oficio editorial."
    criterio: |-
      Se evalúa: (1) las 3 lentes se aplican a aspectos distintos. (2) identifica una tensión real (estética vs. accesibilidad, creatividad vs. disciplina, originalidad vs. legibilidad). (3) el compromiso final es específico.
    retroalimentacion: |-
      Una buena respuesta: ``La lente del nosotros me pregunta a quién mi revista deja fuera: a personas con baja visión por bajo contraste, a quienes no leen español, a quienes no entienden el tono. Lo estoico me recuerda que cada decoración debe justificarse o se elimina. Floridi me dice que cumplir WCAG AA no es trámite: es respeto. Para P3 me comprometo a aplicar la misma disciplina del diseño editorial a la presentación de mis hojas de cálculo: jerarquía clara, contraste honesto, sin adornos sin propósito.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 2 con el oficio del tipógrafo actualizado al medio digital. El periodo 3 (Datos y hojas de cálculo) te pedirá la misma disciplina del orden y la jerarquía, aplicada ahora a tablas, fórmulas y gráficos: el diseño editorial sigue ahí, solo que el contenido cambia.

# ─── BANCO DE PRÁCTICA · 22 preguntas ──────────────────────────────
banco_practica:
  - id: "bp-001"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué significa "diseñar" según la sesión 1?
    opciones:
      - "Hacer cosas bonitas"
      - "Ordenar elementos con jerarquía e intención para que comuniquen un mensaje al lector"
      - "Pintar"
      - "Programar"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Diseñar es ordenar con jerarquía e intención. Lo bonito puede surgir; lo necesario es comunicar.
    feedback_incorrecto: |-
      Diseñar es ordenar con jerarquía e intención. No es decorar; es comunicar con disciplina.

  - id: "bp-002"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Para qué sirve una cuadrícula en diseño editorial?
    opciones:
      - "Para decorar"
      - "Para dar orden visual a la página y mantener consistencia entre páginas"
      - "Para hacer la página más larga"
      - "Para llenar espacio"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La cuadrícula es el primer principio del orden. Define columnas, márgenes y espacios consistentes.
    feedback_incorrecto: |-
      Orden visual y consistencia. Sin cuadrícula, cada página parece de otra revista.

  - id: "bp-003"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas tipografías es típicamente más legible para cuerpos de texto largos?
    opciones:
      - "Cursiva ornamental decorativa"
      - "Sans-serif o serif clásicas (Inter, Helvetica, Georgia, Times)"
      - "Solo mayúsculas"
      - "Fuentes con sombras 3D"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Sans-serif limpia o serif clásica son las opciones legibles. Las decorativas se reservan para títulos.
    feedback_incorrecto: |-
      Sans-serif o serif clásica para cuerpos largos. Las decorativas cansan el ojo en lecturas extensas.

  - id: "bp-004"
    bloom: evaluar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué relación de contraste mínima exige WCAG AA para texto?
    opciones:
      - "1:1"
      - "4.5:1 (texto normal); 3:1 (texto grande)"
      - "10:1"
      - "Cualquiera"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. 4.5:1 para texto normal, 3:1 para texto grande. Es el estándar mínimo internacional de accesibilidad.
    feedback_incorrecto: |-
      4.5:1 para texto normal, 3:1 para texto grande. Bajar de ahí excluye a personas con baja visión.

  - id: "bp-005"
    bloom: analizar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué función cumple el espacio en blanco en una página editorial?
    opciones:
      - "Sobra y debe llenarse"
      - "Da aire al lector, jerarquiza elementos y permite que el ojo respire"
      - "Es error del diseñador"
      - "No tiene función"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. El espacio en blanco es funcional: jerarquiza, descansa al ojo y guía la lectura.
    feedback_incorrecto: |-
      El espacio en blanco es funcional. No es desperdicio: es aire que el lector necesita para no fatigarse.

  - id: "bp-006"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál herramienta es ideal para principiantes que quieren plantillas listas y arrastrar-soltar?
    opciones:
      - "Solo InDesign profesional pago"
      - "Canva (plantillas, drag-and-drop, gratis hasta cierto nivel)"
      - "Notepad"
      - "Excel"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Canva es ideal para empezar: plantillas listas, drag-and-drop, gratis. Después se sube a Figma o Adobe Express.
    feedback_incorrecto: |-
      Canva. Drag-and-drop, plantillas listas, gratis. Es el punto de entrada profesional accesible.

  - id: "bp-007"
    bloom: evaluar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Tu revista escolar tiene tipografía de 8 puntos sobre fondo gris claro. ¿Qué problema de accesibilidad tiene?
    opciones:
      - "Ninguno"
      - "Tamaño insuficiente (debe ser 11pt+) Y contraste posiblemente bajo: doble barrera para lectores con baja visión"
      - "Es muy grande"
      - "Solo se ve mal en celular"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. 8pt es muy pequeño para cuerpo de texto; combinado con bajo contraste, excluye a muchos lectores.
    feedback_incorrecto: |-
      Tamaño insuficiente + contraste bajo. La accesibilidad exige al menos 11pt y contraste 4.5:1 para no excluir lectores.

  - id: "bp-008"
    bloom: analizar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Tu compañero revisor encontró 8 errores ortográficos en tu revista lista para imprimir. ¿Qué haces?
    opciones:
      - "Igual la imprimo"
      - "Corrijo los 8 antes de imprimir y reviso si hay más; los errores debilitan toda la pieza"
      - "Solo corrijo los más graves"
      - "Echo la culpa al revisor"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Corrección antes de imprimir es disciplina del oficio. La revista con errores ortográficos pierde credibilidad.
    feedback_incorrecto: |-
      Corregir todos antes de imprimir. Los errores erosionan la autoridad de la pieza editorial.

  - id: "bp-009"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el flujo de trabajo recomendado para maquetar una revista de 12 páginas?
    opciones:
      - "Diseñar página por página desordenadamente"
      - "Definir cuadrícula y estilos primero → maquetar páginas → revisar coherencia global → corregir → exportar PDF"
      - "Solo escribir el texto"
      - "Imprimir y diseñar después"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Cuadrícula + estilos antes; coherencia global y corrección al final. Flujo profesional probado.
    feedback_incorrecto: |-
      Cuadrícula y estilos primero, después maquetar, después revisar coherencia, después corregir, después exportar. Saltar pasos cuesta caro.

  - id: "bp-010"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Durante la sustentación pública de tu revista, ¿qué muestra MEJOR tu oficio de diseño?
    opciones:
      - "Hablar de cuánto te esforzaste"
      - "Explicar las decisiones de cuadrícula, tipografía, color y accesibilidad y por qué las tomaste"
      - "Mostrar muchos colores"
      - "Leer el texto en voz alta"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. La sustentación muestra el criterio detrás de las decisiones. El producto se ve; el criterio se cuenta.
    feedback_incorrecto: |-
      Las decisiones justificadas. El producto se ve solo; lo que muestra tu oficio es por qué cada decisión.

  - id: "bp-011"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál oficio ancestral conecta con el diseño editorial de este periodo?
    opciones:
      - "El pescador"
      - "El tipógrafo de la imprenta de Cartago con los tipos móviles de plomo"
      - "El carpintero"
      - "El maestro de música"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. El tipógrafo componía las páginas letra por letra y tenía la regla del diseño editorial en el cuerpo.
    feedback_incorrecto: |-
      El tipógrafo de la imprenta artesanal. Su oficio de componer páginas con tipos móviles es el origen del diseño editorial.

  - id: "bp-012"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuántas columnas suele tener una revista de tamaño carta legible?
    opciones:
      - "1 columna gigante"
      - "2-4 columnas según contenido"
      - "20 columnas"
      - "Ninguna"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. 2-4 columnas según tipo de contenido. 1 sola es para libros literarios; muchas pierden legibilidad.
    feedback_incorrecto: |-
      2-4 columnas es el rango profesional para revistas tamaño carta. La cuadrícula define cuántas según contenido.

  - id: "bp-013"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Para qué se usa típicamente una tipografía display (decorativa)?
    opciones:
      - "Para todo el cuerpo del texto"
      - "Para títulos y elementos puntuales donde llama atención sin estorbar la lectura"
      - "Para no usarla nunca"
      - "Para pies de página"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Display solo para títulos. Usar display en cuerpos largos cansa al ojo.
    feedback_incorrecto: |-
      Display para títulos. Su carácter llama la atención y se reserva para acentos, no para texto extenso.

  - id: "bp-014"
    bloom: comprender
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      ¿Por qué el color en editorial es funcional, no solo decorativo?
    opciones:
      - "No es funcional"
      - "Crea jerarquía (qué se lee primero), guía al lector y comunica el tono"
      - "Solo decora"
      - "Hace la revista más larga"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Color funcional: jerarquía + guía + tono. Las decisiones de color afectan la lectura.
    feedback_incorrecto: |-
      Funcional: jerarquiza, guía, comunica tono. El color no es adorno: es parte del sistema de comunicación.

  - id: "bp-015"
    bloom: analizar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Cómo se relacionan imagen y texto en buena composición editorial?
    opciones:
      - "Imagen aleatoria"
      - "Imagen y texto dialogan: cada uno aporta lo que el otro no puede, sin redundar"
      - "Solo imagen, sin texto"
      - "Solo texto, sin imagen"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Imagen y texto dialogan. La imagen no repite el texto: lo amplía o lo concreta visualmente.
    feedback_incorrecto: |-
      Imagen y texto dialogan. Si la imagen solo repite el texto, ambos se vuelven redundantes.

  - id: "bp-016"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Quieres prototipar el diseño antes de maquetar la revista completa. ¿Qué herramienta es la más adecuada?
    opciones:
      - "Excel"
      - "Figma (gratis, diseño vectorial, prototipos interactivos)"
      - "WhatsApp"
      - "Word"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Figma es estándar profesional gratis para prototipado. Su tier gratuito es generoso para uso escolar.
    feedback_incorrecto: |-
      Figma. Estándar profesional gratis para diseño vectorial y prototipos. Adobe Express es alternativa válida.

  - id: "bp-017"
    bloom: evaluar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué significa WCAG?
    opciones:
      - "We Can Always Go"
      - "Web Content Accessibility Guidelines (lineamientos internacionales de accesibilidad)"
      - "World Color Art Group"
      - "Wireless Connection Access Grade"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. WCAG = Web Content Accessibility Guidelines. Nivel AA es el estándar mínimo profesional.
    feedback_incorrecto: |-
      WCAG = Web Content Accessibility Guidelines. Estándar internacional de accesibilidad para contenido publicado.

  - id: "bp-018"
    bloom: analizar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos NO es función del editor revisor?
    opciones:
      - "Verificar ortografía y gramática"
      - "Comprobar coherencia visual (cuadrícula respetada, tipografía consistente)"
      - "Detectar errores de hecho (datos verificables)"
      - "Hacer el diseño desde cero"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. El revisor revisa, no rediseña. Sus funciones: ortografía, gramática, coherencia visual y verificación de hechos.
    feedback_incorrecto: |-
      Rediseñar no es del revisor. El revisor revisa: ortografía, coherencia visual, datos verificables.

  - id: "bp-019"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Antes de maquetar la revista, ¿qué decisión es crítica?
    opciones:
      - "El color del logo"
      - "Definir cuadrícula y estilos de tipografía consistentes para todas las páginas"
      - "Cuántos amigos lo verán"
      - "Si imprimir o digital"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Cuadrícula + estilos consistentes ANTES de maquetar. Eso evita rediseñar página por página después.
    feedback_incorrecto: |-
      Cuadrícula + estilos consistentes desde el inicio. Sin esa decisión previa, cada página queda como de otra revista.

  - id: "bp-020"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Recibes una crítica dura durante la sustentación: "tu revista no se lee en celular." ¿Qué haces?
    opciones:
      - "Defenderme sin escuchar"
      - "Reconocer el problema (responsive es real), proponer cómo lo abordaría en próxima edición"
      - "Cambiar de tema"
      - "Decir que no importa"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Honestidad ante crítica legítima + plan de mejora. Eso es el oficio editorial maduro.
    feedback_incorrecto: |-
      Reconocer + proponer plan. La crítica honesta se acepta y se convierte en aprendizaje para la próxima edición.

  - id: "bp-021"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      Tu revista de 12 páginas decide usar cuadrícula de 3 columnas. ¿Por qué es buena elección?
    opciones:
      - "Porque hace la página más larga"
      - "Permite alternar entre 1, 2 o 3 columnas según el tipo de contenido, manteniendo consistencia"
      - "Está de moda"
      - "Porque el papel es cuadrado"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. 3 columnas permite versatilidad sin perder coherencia. Es estándar editorial flexible.
    feedback_incorrecto: |-
      3 columnas da versatilidad: 1 columna para textos largos, 2 para reportajes, 3 para ítems cortos. Versátil y consistente.

  - id: "bp-022"
    bloom: crear
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Diseñas una revista para tus compañeros de colegio. ¿Qué te asegura que la pueden leer todos?
    opciones:
      - "Si está en colores brillantes"
      - "Cumple WCAG AA: contraste 4.5:1, tamaños 11pt+ cuerpo, jerarquía clara, sin solo imágenes sin alt text"
      - "Si tiene muchas páginas"
      - "Si está en PDF"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. WCAG AA es el estándar mínimo profesional para asegurar lectura inclusiva.
    feedback_incorrecto: |-
      Cumplir WCAG AA. Sin ese mínimo, la revista excluye a lectores con baja visión, daltonismo o lectura con apoyo.

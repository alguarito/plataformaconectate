clave: "9-3"
grado: 9
periodo: 3
completo: true

titulo: "Examen final · Datos y hojas de cálculo con phronesis"
titulo_portada: |-
  Examen final ---
  Datos y hojas
  de cálculo

duracion_min: 45
ponderacion: 20
fecha_aplicacion: "Sesión 10"

instrucciones: |-
  Tienes 45 minutos. Responde con tu propia voz: el examen evalúa cómo razonas, no cuánto repites.
  En las preguntas abiertas, justifica brevemente. En la pregunta de opción múltiple, marca una sola respuesta.
  No uses IA durante el examen: tu firma como analista responsable depende de eso.

apertura:
  saber_ancestral: |-
    En los graneros del campo del Valle del Cauca trabajó durante décadas una figura silenciosa pero indispensable: \textbf{el contador de cosechas}. No era contador profesional con título: era un hombre o mujer mayor que llevaba un cuaderno cuadriculado donde anotaba, semana a semana, kilos de café cosechados, sacos vendidos, precios pagados, gastos de jornales. \emph{``Esta semana se cosecharon 380 kg; la pasada 410; la antepasada 290.''}. Al final del año, ese cuaderno tenía cientos de filas con fechas, kilos, precios, totales. Cuando el patrón preguntaba si valía la pena sembrar café o cambiar a aguacate, el contador no inventaba: \textbf{abría el cuaderno, recorría con el dedo las cifras, comparaba años, calculaba promedio y le presentaba un informe sin adornos}: \emph{``Don Roberto, en los últimos 3 años el café dejó X por hectárea, el aguacate dejaría Y según los vecinos. Hay que decidir.''}. Esa era \textbf{phronesis con datos}: criterio práctico aplicado a cifras concretas. La diferencia con un analista contemporáneo no es el oficio: es el medio. La hoja de cálculo es la versión digital del cuaderno cuadriculado del granero.

  contexto: |-
    Este examen cierra el periodo 3 de grado 9° y, con él, todo el grado. Recorriste el oficio del \textbf{análisis de datos con phronesis}: ¿qué es un dato? (S1), tablas y registros (S2), fórmulas básicas (S3), filtros y orden (S4), tablas dinámicas (S5), gráficos (S6), limpieza de datos (S7), visualización honesta (S8), insights y decisiones (S9) y sustentación pública del mini-estudio (S10).

  pregunta_marco: |-
    ¿Qué cruza el cuaderno del contador de cosechas del Valle con tu hoja de cálculo del mini-estudio del cierre de grado 9°?

aprendizajes:
  - sesion: 1
    titulo: "¿Qué es un dato? Recolección con propósito"
  - sesion: 2
    titulo: "Tablas y registros: columna como tipo, fila como caso"
  - sesion: 3
    titulo: "Fórmulas básicas: SUMA, PROMEDIO, MAX, MIN, CONTAR"
  - sesion: 4
    titulo: "Filtros y orden: hacer preguntas a los datos"
  - sesion: 5
    titulo: "Tablas dinámicas: agrupar y comparar"
  - sesion: 6
    titulo: "Gráficos: imagen de los datos según propósito"
  - sesion: 7
    titulo: "Limpieza de datos: el oficio del archivero"
  - sesion: 8
    titulo: "Visualización honesta: gráficos que NO mienten"
  - sesion: 9
    titulo: "Insights: del dato a la decisión razonada"
  - sesion: 10
    titulo: "Sustentación del mini-estudio: defensa de los hallazgos"

examen_formal:
  concreto:
    enunciado: |-
      Si tuvieras que enseñarle a un adulto que aún hace cuentas en papel lo más importante que aprendiste sobre datos y hojas de cálculo este periodo, ¿qué le dirías en 6 renglones?
      Concentra tu respuesta en \textbf{tres ideas} (no más, no menos). Evita frases hechas como ``Excel es importante'': se específico con vocabulario del periodo (recolección con propósito, tabla limpia, fórmula, insight, visualización honesta).
    criterio: |-
      Se evalúa: (1) que las 3 ideas sean distintas. (2) que se nombre al menos un \textbf{concepto técnico} del periodo (recolección con propósito, columna como tipo, fórmula básica, tabla dinámica, gráfico honesto, insight razonado, etc.). (3) que se note \textbf{voz propia} de quien hizo el mini-estudio.
    retroalimentacion: |-
      Una buena respuesta cruza método con experiencia: ``(1) los datos sin propósito son ruido; primero la pregunta, después la recolección. (2) una tabla limpia (1 columna = 1 tipo, 1 fila = 1 caso) es la diferencia entre análisis posible e imposible. (3) un gráfico debe respetar al lector: eje desde cero, escala honesta, sin 3D engañoso.''
    puntos: 1.0

  contexto:
    enunciado: |-
      El contador de cosechas del granero del Valle llevaba cifras en un cuaderno cuadriculado y, cuando el patrón preguntaba si valía la pena cambiar de cultivo, abría el cuaderno y entregaba un análisis simple pero riguroso.

      Responde en 5-7 renglones: \textbf{¿qué del oficio del contador cruza con tu trabajo en Google Sheets, y qué se gana al digitalizar sin perder la disciplina del cuaderno?} Da un ejemplo concreto de cada lado.
    criterio: |-
      Se evalúa: (1) identifica al menos una \textbf{práctica concreta} del contador (registro semanal disciplinado, columnas claras, comparación de años, presentación sin adornos). (2) reconoce qué gana lo digital (cálculo automático, gráficos, filtros, escala) sin caer en la trampa de creer que sustituye la disciplina del registro. (3) reflexión propia.
    retroalimentacion: |-
      Una buena respuesta: ``El contador anotaba cada semana sin saltarse fechas. Si una fila quedaba en blanco, lo notaba al revisar; si me salto un día de registro en Sheets, también lo noto al sumar y ver totales raros. La disciplina del registro diario sigue siendo del humano; lo que Sheets aporta es cálculo automático y la capacidad de comparar 3 años en segundos.''
    puntos: 1.0

  practico:
    - numero: 1
      tipo: opcion_multiple
      enunciado: |-
        Recibes esta tabla de ventas mensuales de una tienda escolar:

        \begin{tabular}{ll}
        Mes & Ventas (millones COP) \\
        Marzo & 8.5 \\
        Abril & 9.0 \\
        Mayo & 8.7 \\
        Junio & 9.2
        \end{tabular}

        Tu compañero hace un gráfico de barras pero pone el eje Y empezando en 8.0 millones. \textbf{El gráfico muestra que junio es MÁS DEL DOBLE de marzo.}

        Aplicando lo aprendido este periodo, ¿cuál es la observación MÁS importante?
      contexto: |-
        Recuerda los principios de visualización honesta: el eje Y de gráficos de barras debe partir de cero salvo justificación explícita.
      tipo: opcion_multiple
      opciones:
        - "El eje Y truncado engaña visualmente: el crecimiento real es solo 8.2% (de 8.5 a 9.2), no más del doble."
        - "El gráfico está bien, así se ven mejor las diferencias."
        - "El problema es que hay solo 4 meses."
        - "Debería usar gráfico circular."
      respuesta_index: 0
      criterio: |-
        La opción A es correcta. Identifica el problema clave: eje truncado infla visualmente las diferencias. Es trampa común en periodismo y empresa. A es la trampa estética. C y D no tocan el problema central.
      retroalimentacion: |-
        Eje Y truncado es la trampa más común de la visualización engañosa. Crecimiento real 8.2%; mostrado como 200%+ es deshonesto. El eje debe partir de 0 salvo justificación explícita y declarada.
      puntos: 1.0

    - numero: 2
      enunciado: |-
        Vas a hacer un mini-estudio sobre los hábitos de estudio de tus compañeros de grado 9°. Tienes una encuesta con 35 respuestas en una hoja de Sheets, pero los datos están sucios: \textbf{algunas filas tienen mayúsculas, otras minúsculas; las edades aparecen como ``14'', ``14 años'', ``catorce''; faltan respuestas en 5 filas; hay duplicados en 2 filas}.

        \textbf{Diseña en 6-8 renglones tu plan de trabajo} aplicando lo aprendido este periodo. Incluye: (a) qué pasos de limpieza haces antes de analizar, (b) qué fórmula básica usarías para el análisis principal (cuántos estudian de mañana vs. tarde, por ejemplo), (c) qué gráfico es el más adecuado, (d) cómo presentarás un \textbf{insight} accionable al final.

        Cierra con una sola frase de cuidado: \textbf{``Antes de presentar mis hallazgos, me aseguro de...''}
      criterio: |-
        Se evalúa: (1) plan de limpieza concreto (normalizar mayúsculas, unificar formato de edad, decidir qué hacer con datos faltantes, eliminar duplicados). (2) fórmula apropiada (CONTAR.SI o tabla dinámica). (3) gráfico justificado (barras para comparar categorías o circular para proporciones). (4) insight accionable (no estadística aislada, sino qué hacer con eso). (5) frase de cuidado que muestre criterio (verificar fuente, mostrar dato cruzado, no inflar conclusiones).
      retroalimentacion: |-
        Una buena respuesta: ``Limpieza: unifico mayúsculas con MINUSC(), edad con valores numéricos (14, 15, 16), elimino duplicados con Quitar duplicados, marco las 5 filas faltantes como N/A. Análisis: CONTAR.SI(rango, mañana) y CONTAR.SI(rango, tarde) para comparar. Gráfico: barras horizontales con eje desde 0. Insight: '17 de 30 estudian al final del día; 13 al mediodía; cero al amanecer. Si la coordinación quiere reforzar hábitos, puede agendar tutorías 5-7pm cuando ya hay densidad de estudiantes.' Frase: antes de presentar me aseguro de que las 30 respuestas válidas reflejan la población o aclaro la limitación.''
      puntos: 1.0

  reflexivo:
    enunciado: |-
      Lee las 3 citas que aparecen abajo. En 8-10 renglones, escribe cómo cada una de las tres lentes ilumina un aspecto distinto del oficio del análisis de datos. \textbf{Las 3 lentes deben aparecer explícitamente}.

      Cierra el texto con una sola frase de compromiso para grado 10°: \emph{``Para el próximo año, me comprometo a...''}
    voces:
      dussel: |-
        ``Los datos pueden cosificar a las personas que retratan o pueden dignificarlas. Saber a quién mi análisis deja sin voz es la primera ética del analista."
      estoico: |-
        ``Las cifras no se truncan. El analista disciplinado muestra los datos completos aunque no le favorezcan."
      floridi: |-
        ``En la infoesfera, todo gráfico publicado entra a la conversación común. Su honestidad es responsabilidad ética: lo que ocultas te traiciona después."
    criterio: |-
      Se evalúa: (1) las 3 lentes se aplican a aspectos distintos del análisis de datos. (2) identifica una tensión real (mostrar todo vs. ocultar lo incómodo, datos vs. personas, gráfico atractivo vs. gráfico honesto). (3) el compromiso final es específico.
    retroalimentacion: |-
      Una buena respuesta: ``Mi mini-estudio habla de hábitos de estudio (Floridi: información que entra a la conversación). Lente del nosotros me pregunta a quién dejé fuera: a estudiantes con trabajo después del colegio que no pudieron responder. Lo estoico me recuerda que mi gráfico no se trunca aunque la diferencia parezca pequeña. Para grado 10° me comprometo a aplicar la misma disciplina a mis informes de proyecto emprendedor: visualización honesta, datos limpios, insights accionables.''
    puntos: 1.0

cierre: |-
  Cierras el periodo 3 y, con él, el grado 9°. Lo que llevas no es Excel: es el oficio del contador del granero actualizado al medio digital. El grado 10° te pedirá esa misma disciplina aplicada a libros, informes profesionales y contabilidad. El cuaderno cuadriculado sigue vivo en cada hoja de cálculo bien llevada.

# ─── BANCO DE PRÁCTICA · 22 preguntas ──────────────────────────────
banco_practica:
  - id: "bp-001"
    bloom: comprender
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es un dato en sentido riguroso?
    opciones:
      - "Cualquier número que veas"
      - "Lo que sale en internet"
      - "Información recolectada con propósito que responde una pregunta específica"
      - "Una opinión"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Sin propósito, los datos son ruido. La pregunta viene antes que la recolección.
    feedback_incorrecto: |-
      Información con propósito que responde una pregunta. Sin pregunta clara, los datos no sirven a la decisión.

  - id: "bp-002"
    bloom: aplicar
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      En una tabla limpia, ¿qué representa cada FILA?
    opciones:
      - "Un tipo de dato"
      - "Un caso o registro individual"
      - "Una pregunta"
      - "Una fórmula"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Fila = caso individual (un estudiante, un día, una venta). Columna = tipo de dato.
    feedback_incorrecto: |-
      Fila = caso individual; columna = tipo. Esa estructura permite filtrar, ordenar y sumar.

  - id: "bp-003"
    bloom: recordar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué fórmula da el valor MÁS ALTO de un rango?
    opciones:
      - "=SUMA()"
      - "=PROMEDIO()"
      - "=CONTAR()"
      - "=MAX()"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. =MAX() da el valor máximo. =MIN() el mínimo. =PROMEDIO() la media. =SUMA() la suma. =CONTAR() el conteo.
    feedback_incorrecto: |-
      =MAX() para el máximo. Conoce las 5 básicas: SUMA, PROMEDIO, MAX, MIN, CONTAR.

  - id: "bp-004"
    bloom: aplicar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Tienes 200 filas de ventas. Quieres ver solo las del mes de marzo. ¿Qué herramienta usas?
    opciones:
      - "Filtro por columna Mes = marzo (no modifica los datos)"
      - "Borrar las demás filas"
      - "Crear otra hoja"
      - "Imprimir todo"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Filtros muestran/ocultan filas sin tocar los datos. Reversible y rápido.
    feedback_incorrecto: |-
      Filtros, no borrar. Filtrar oculta filas temporalmente sin perder datos.

  - id: "bp-005"
    bloom: analizar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      ¿Para qué sirve una tabla dinámica (pivot table)?
    opciones:
      - "Para escribir poemas"
      - "Para ordenar alfabéticamente"
      - "Para agrupar y comparar datos rápidamente (ventas por mes, alumnos por grado, etc.)"
      - "Para imprimir"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Tabla dinámica = agrupar + comparar. Es la herramienta más poderosa del análisis básico.
    feedback_incorrecto: |-
      Agrupar y comparar. Sirve para responder preguntas tipo "¿cuánto vendí por mes?" sin escribir fórmulas complejas.

  - id: "bp-006"
    bloom: aplicar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      Quieres mostrar la evolución de las ventas mensuales a lo largo de un año. ¿Qué gráfico es el más adecuado?
    opciones:
      - "Gráfico circular (pastel)"
      - "Gráfico de líneas (muestra tendencia temporal)"
      - "Histograma"
      - "Tabla sin gráfico"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Líneas para tendencia temporal. Circular para proporciones; barras para comparar categorías.
    feedback_incorrecto: |-
      Gráfico de líneas para tendencia en el tiempo. Es el gráfico estándar para evolución mensual.

  - id: "bp-007"
    bloom: analizar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál es el primer paso al recibir datos sucios para analizar?
    opciones:
      - "Limpiar: unificar formatos, eliminar duplicados, manejar datos faltantes, normalizar mayúsculas"
      - "Hacer el gráfico inmediato"
      - "Eliminar todas las filas"
      - "Imprimir"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Sin limpieza, el análisis es ficción. Los archiveros profesionales dedican 60-80% del tiempo a limpiar.
    feedback_incorrecto: |-
      Limpiar primero. Sin datos limpios, los análisis y gráficos son ficción.

  - id: "bp-008"
    bloom: evaluar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estas prácticas viola la visualización honesta?
    opciones:
      - "Etiquetas claras en los ejes"
      - "Título descriptivo del gráfico"
      - "Eje desde cero"
      - "Eje Y truncado para inflar visualmente las diferencias"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Eje truncado infla diferencias visualmente. Es la trampa más común de gráficos engañosos.
    feedback_incorrecto: |-
      Eje truncado es trampa. Visualización honesta exige eje desde 0, etiquetas claras, escala consistente, sin 3D engañoso.

  - id: "bp-009"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      ¿Qué es un "insight" en análisis de datos?
    opciones:
      - "Un número aleatorio"
      - "Un gráfico bonito"
      - "El total de la suma"
      - "Conclusión razonada a partir de los datos que sugiere una decisión accionable"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Un insight conecta el dato con la decisión. "El 70% estudia 5-7pm; agendar tutorías ahí" es insight; "el 70% estudia" es solo estadística.
    feedback_incorrecto: |-
      Insight = conclusión razonada que sugiere acción. Un número aislado no es insight; un patrón con propuesta de acción sí.

  - id: "bp-010"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Durante la sustentación de tu mini-estudio, ¿qué muestra MEJOR tu oficio?
    opciones:
      - "Hablar mucho"
      - "Mostrar 1 gráfico honesto + 1 insight accionable + reconocer limitaciones del estudio"
      - "Decir que no hay limitaciones"
      - "Solo leer cifras"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Gráfico honesto + insight + límites reconocidos. La honestidad sobre lo no resuelto distingue al analista maduro.
    feedback_incorrecto: |-
      Gráfico honesto + insight + límites reconocidos. Reconocer lo que el estudio NO responde es parte del oficio.

  - id: "bp-011"
    bloom: recordar
    sesion: 1
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál oficio ancestral conecta con el análisis de datos en este periodo?
    opciones:
      - "El cartero del barrio"
      - "El zapatero"
      - "El contador de cosechas del granero del Valle con su cuaderno cuadriculado"
      - "El maestro de música"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. El contador llevaba kilos, precios, gastos en cuaderno. Análisis de datos antes del software.
    feedback_incorrecto: |-
      El contador de cosechas. Su cuaderno cuadriculado es el ancestro directo de la hoja de cálculo.

  - id: "bp-012"
    bloom: comprender
    sesion: 2
    tipo: opcion_multiple
    enunciado: |-
      En una tabla limpia, ¿qué representa cada COLUMNA?
    opciones:
      - "Un tipo de dato (variable, atributo, campo)"
      - "Un registro completo"
      - "Una respuesta"
      - "Una fórmula"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Columna = tipo de dato. Todas las celdas de una columna son del mismo tipo (números, fechas, texto).
    feedback_incorrecto: |-
      Columna = tipo. Edad, nombre, fecha, monto: cada uno en su columna. Mezclar tipos en una columna rompe el análisis.

  - id: "bp-013"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Quieres saber cuántos estudiantes hay en una tabla con 200 filas. ¿Qué fórmula usas?
    opciones:
      - "=CONTAR(A2:A200) o =CONTARA(A2:A200) si son textos"
      - "=SUMA(A2:A200)"
      - "=PROMEDIO(A2:A200)"
      - "=MAX(A2:A200)"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. CONTAR cuenta números, CONTARA cuenta celdas no vacías (incluye texto).
    feedback_incorrecto: |-
      CONTAR para números, CONTARA para textos o mixto. SUMA totaliza valores numéricos, no cuenta filas.

  - id: "bp-014"
    bloom: analizar
    sesion: 4
    tipo: opcion_multiple
    enunciado: |-
      Filtras tu tabla por "Mes = marzo" y obtienes 50 filas. ¿Las otras 150 se borraron?
    opciones:
      - "Sí, las borró el filtro"
      - "No, solo están ocultas temporalmente; al quitar el filtro vuelven a aparecer"
      - "Se fueron a la papelera"
      - "Se duplicaron"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. Filtros NO borran datos. Solo ocultan filas temporalmente; al quitar el filtro, todo vuelve.
    feedback_incorrecto: |-
      Filtros ocultan, no borran. Al quitar el filtro las filas vuelven. Por eso es reversible y seguro.

  - id: "bp-015"
    bloom: aplicar
    sesion: 5
    tipo: opcion_multiple
    enunciado: |-
      Quieres saber cuántas ventas hubo POR MES y POR PRODUCTO al mismo tiempo. ¿Qué usas?
    opciones:
      - "Solo un filtro"
      - "Un gráfico circular"
      - "Una sola fórmula CONTAR"
      - "Tabla dinámica con Mes en filas y Producto en columnas"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Tabla dinámica es la herramienta para cruzar dos dimensiones (filas × columnas) y ver intersecciones.
    feedback_incorrecto: |-
      Tabla dinámica. Permite cruzar dimensiones (mes × producto) y ver el conteo en cada intersección.

  - id: "bp-016"
    bloom: evaluar
    sesion: 6
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál de estos gráficos NO debe usarse para más de 5-6 categorías?
    opciones:
      - "Tabla"
      - "Gráfico de líneas"
      - "Gráfico circular (pastel) — se vuelve ilegible con muchas categorías"
      - "Histograma"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Circular pierde claridad con muchas categorías. Para más de 6, usar barras horizontales.
    feedback_incorrecto: |-
      Circular es para 3-6 categorías. Con más, usar barras horizontales que se leen mejor.

  - id: "bp-017"
    bloom: aplicar
    sesion: 7
    tipo: opcion_multiple
    enunciado: |-
      Encuentras 4 filas duplicadas en tu tabla de 100 filas. ¿Qué haces?
    opciones:
      - "Las ignoro"
      - "Las copio 4 veces más"
      - "Cambio de tabla"
      - "Las elimino con Datos > Quitar duplicados (Sheets) o verifico si son legítimas antes de borrar"
    respuesta_index: 3
    feedback_correcto: |-
      Correcto. Quitar duplicados con criterio: confirmar primero si son legítimas o error de captura.
    feedback_incorrecto: |-
      Quitar duplicados con criterio. Antes verificar si son error de captura o registros legítimos repetidos.

  - id: "bp-018"
    bloom: evaluar
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      ¿Cuál NO es un principio de visualización honesta?
    opciones:
      - "Eje Y desde cero"
      - "Efectos 3D rotativos para que se vea más profesional"
      - "Escala consistente"
      - "Etiquetas legibles"
    respuesta_index: 1
    feedback_correcto: |-
      Correcto. 3D rotativo distorsiona proporciones. Los principios son eje desde cero, escala consistente, etiquetas claras, título descriptivo, sin 3D engañoso.
    feedback_incorrecto: |-
      El 3D distorsiona, no es principio. Los 5 principios honestos: eje desde 0, escala consistente, sin 3D, etiquetas legibles, título descriptivo.

  - id: "bp-019"
    bloom: crear
    sesion: 9
    tipo: opcion_multiple
    enunciado: |-
      Tu mini-estudio encuentra que el 65% de los estudiantes usa el celular para estudiar. ¿Cuál es un insight ACCIONABLE?
    opciones:
      - "Dado que 65% estudia en celular, la coordinación podría priorizar materiales formato móvil-first antes que PDFs A4"
      - "El 65% usa celular"
      - "Hay que prohibir celulares"
      - "Es interesante"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. Insight conecta dato + propuesta de acción específica. Estadística sola no es insight.
    feedback_incorrecto: |-
      Insight = dato + propuesta de acción. "El 65% usa celular" es estadística; insight conecta eso con qué hacer.

  - id: "bp-020"
    bloom: evaluar
    sesion: 10
    tipo: opcion_multiple
    enunciado: |-
      Durante tu sustentación, alguien señala que tu muestra de 30 estudiantes es pequeña. ¿Qué respondes?
    opciones:
      - "No es relevante"
      - "Cambiar de tema"
      - "Tiene razón: reconocer que es estudio exploratorio de mi grado, no representativo de toda la institución; proponer ampliar a más grados en futuras investigaciones"
      - "Decir que 30 es suficiente"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Honestidad sobre limitaciones + plan de ampliación. Esa es la postura madura del analista.
    feedback_incorrecto: |-
      Reconocer limitación + proponer ampliación. La honestidad fortalece el estudio; ocultarla lo debilita.

  - id: "bp-021"
    bloom: aplicar
    sesion: 3
    tipo: opcion_multiple
    enunciado: |-
      Quieres sumar SOLO las ventas mayores a 1000. ¿Qué fórmula usas?
    opciones:
      - "=SUMAR.SI(A2:A100; \">1000\")"
      - "=SUMA(A2:A100)"
      - "=CONTAR(A2:A100)"
      - "=MAX(A2:A100)"
    respuesta_index: 0
    feedback_correcto: |-
      Correcto. SUMAR.SI suma condicional. Permite criterios numéricos, de texto o referencias.
    feedback_incorrecto: |-
      SUMAR.SI con criterio ">1000". Es suma condicional, base para análisis filtrados.

  - id: "bp-022"
    bloom: crear
    sesion: 8
    tipo: opcion_multiple
    enunciado: |-
      Vas a publicar un gráfico de evolución de notas (4.0 a 4.5 en 6 meses). ¿Cómo lo diseñas honestamente?
    opciones:
      - "Eje Y de 3.9 a 4.6 para que se vean grandes las diferencias"
      - "Sin etiquetas para que no distraigan"
      - "Eje Y desde 0 a 5 (la escala de notas completa); etiquetas claras en cada punto"
      - "Con efecto 3D para verse profesional"
    respuesta_index: 2
    feedback_correcto: |-
      Correcto. Eje desde 0 hasta 5 (la escala completa), etiquetas claras. Eso muestra el crecimiento real proporcional al rango.
    feedback_incorrecto: |-
      Eje desde 0 a 5 (escala completa) + etiquetas claras. Truncar el eje infla diferencias y engaña al lector.

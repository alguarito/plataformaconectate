clave: 1-1
grado: 10
periodo: 1
sesion: 1
completo: true
titulo: ¿Sobre qué escribirías un libro? --- de la pasión al tema
titulo_portada: |-
  ¿Sobre qué
  escribirías
  un libro?
producto_final: Mapa de pasiones (5 temas con justificación) + evaluación comparativa de 3 candidatos + pitch del libro en una frase precisa

apertura:
  saber_ancestral: |-
    En el Valle del Cauca, el cuentero del fogón no improvisaba: sabía de qué iba a hablar mucho antes de abrir la boca. Su tema era su oficio, su tierra, su historia --- algo que llevaba en el cuerpo, no en la cabeza. La palabra que nace del cuerpo aguanta toda la noche; la palabra inventada para impresionar se cae en el tercer párrafo. Los pueblos del Pacífico colombiano conocen esto bien: el \emph{chigualo}, el \emph{currulao}, el relato de los mayores --- cada uno nace de alguien que tenía algo que decir porque lo había vivido.
  saber_contemporaneo: |-
    Hoy la pregunta ``¿sobre qué escribirías un libro?'' es la más difícil que enfrenta cualquier autor. Internet da acceso a todos los temas, pero produce contenido genérico en masa. Lo que corta el ruido es la voz que viene de la experiencia directa: alguien que sabe, que vivió, que le importa. La IA puede generar texto sobre cualquier tema --- pero no puede tener tu pasión, tu historia, tu perspectiva. Eso es lo único que la IA no reemplaza en la escritura.
  pregunta_puente: |-
    ¿Hay algo que sabes de primera mano que la mayoría de personas de tu edad no sabe? ¿Sobre qué podrías hablar durante tres horas sin cansarte --- y sin leer de un papel?
  saber_hacer: |-
    Al terminar esta guía podrás: (1) \textbf{identificar} tus 5 pasiones principales como semillas de escritura con honestidad; (2) \textbf{evaluar} cuál de tus 3 temas candidatos tiene más profundidad, audiencia y voz propia; (3) \textbf{crear} el pitch de tu libro en una frase precisa; (4) \textbf{explicar} por qué ese tema y no otro es el punto de partida de tu libro del periodo.

puentes:
  a_ruta: |-
    Antes de escribir la primera palabra del libro, mira el viaje completo del periodo: diez sesiones desde hoy --- en que eliges tu tema --- hasta G10, en que entregas un libro de mínimo 80 páginas. Cada sesión construye sobre la anterior; perder esta es perder el cimiento.
  a_escuta: |-
    La primera actividad no es escribir --- es escuchar. Escucharte a ti mismo: ¿de qué hablas cuando nadie te está evaluando?, ¿qué temas te hacen olvidar la hora? Antes de elegir el tema del libro, hay que mirar adentro sin filtro ni censura.
  a_sistematizacion: |-
    Ya tienes tus pasiones en el cuaderno. Ahora viene la parte crítica: no toda pasión tiene madera de libro de 80 páginas. Vamos a evaluar tus 3 temas más fuertes con criterios concretos para que la elección final sea razonada, no solo emocional.
  a_praxis: |-
    Tienes tu tema elegido. Ahora lo vas a comprimir en una sola frase --- el pitch. Un pitch claro te va a acompañar durante todo el periodo: es lo que dices cuando alguien te pregunta de qué va tu libro, y es la brújula que te devuelve al camino cuando te pierdes en el capítulo 6.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy y cómo se sabe si quedó bien. Léelo antes de cerrar el cuaderno: son los criterios con los que se evalúa el trabajo --- tuyo primero.
  a_evaluacion: |-
    Antes de cerrar, cinco dimensiones humanas para mirar lo que elegiste hoy. Evaluar no es la nota: es lo que se queda en ti cuando la emoción de la sesión pase.
  a_triangulo: |-
    Y para cerrar, tres voces que te acompañarán durante todo el periodo 1. Dussel, un estoico, Floridi --- tres lentes para mirar la decisión que acabas de tomar.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Mapa de mis pasiones} (15 min · individual). Abre tu cuaderno en una página en blanco. Escribe ``Mis pasiones'' en la parte de arriba. Pon un cronómetro de 5 minutos y escribe sin parar todo lo que te apasiona, te intriga, te molesta o te llama la atención --- deportes, música, tecnología, un lugar, una injusticia, un oficio, una pregunta sin respuesta. No filtres, no edites, no te censures. Cuando suene el cronómetro, lee todo lo que escribiste y encierra en círculo los 5 que sientes más tuyos.
  checks:
    - Escribí sin parar durante los 5 minutos completos sin detenerme a editar.
    - Tengo al menos 8 temas anotados antes de elegir los 5 circulados.
    - Los 5 elegidos son realmente míos, no los que creo que el profesor quiere ver.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mis 5 pasiones como semillas de escritura». \textbf{Formato:} lista de 5 ítems; cada uno con nombre de la pasión + 1 renglón explicando por qué es tuya (qué sabes, qué has vivido, qué te pregunta). \textbf{Extensión:} 10--15 renglones. \textbf{Sabes que terminaste cuando} cada pasión tiene su ``por qué es mía'' escrito con honestidad --- no con lo que suena bien en voz alta.

sistematizacion:
  intro: |-
    No toda pasión tiene madera de libro de 80 páginas. Hay temas que amamos pero que agotamos en 10 páginas; hay temas que nos apasionan \emph{y} también le interesan a alguien más. Vamos a evaluar tus 3 temas candidatos más fuertes con los pilares del pensamiento computacional.
  pilares:
    - |-
      \textbf{Descomposición:} ¿el tema tiene al menos 8 subtemas distintos que podrías convertir en capítulos? Si no puedes listar 8, el tema es demasiado estrecho para 80 páginas.
    - |-
      \textbf{Patrones:} ¿qué tipo de libro es? ¿Narrativo (cuenta una historia), expositivo (explica algo), argumentativo (defiende una posición)? Reconocer el patrón te dice qué tipo de autor necesitas ser.
    - |-
      \textbf{Abstracción:} ¿puedes resumir el tema en una frase sin que pierda su sentido? Si necesitas tres párrafos para explicarlo, todavía no lo has destilado.
    - |-
      \textbf{Algoritmo de decisión:} para cada uno de tus 3 temas candidatos, asigna 1--3 puntos en tres criterios: Profundidad · Audiencia · Voz propia. El que más sume es tu tema.
  anatomia:
    titulo: Tres criterios para saber si tu tema tiene madera de libro
    body: |-
      \textbf{Profundidad} --- ¿puedes escribir 8 capítulos distintos sobre este tema sin repetirte? \\[2mm] \textbf{Audiencia} --- ¿hay alguien que quiera leerlo además de ti? ¿Puedes describir a esa persona concretamente? \\[2mm] \textbf{Voz propia} --- ¿tienes experiencia o conocimiento directo de este tema, o solo lo amas desde afuera? \\[3mm] Un tema con los tres criterios altos = libro posible. Un tema con solo uno de los tres = riesgo alto de quedarse en el capítulo 3.
  errores_comunes: |-
    (1) Elegir el tema más impresionante, no el más propio. (2) Confundir ``me gusta leer sobre X'' con ``tengo algo que decir sobre X''. (3) Elegir un tema tan amplio que nunca se puede cerrar. (4) Elegir un tema tan específico que no tiene audiencia fuera de ti mismo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Evaluación de mis 3 temas candidatos». \textbf{Formato:} tabla de 3 filas (un tema por fila) $\times$ 4 columnas (Tema $|$ Profundidad 1--3 $|$ Audiencia 1--3 $|$ Voz propia 1--3) + total por tema + tema ganador subrayado + 2 renglones de decisión. \textbf{Sabes que terminaste cuando} la tabla está completa, el tema elegido tiene la puntuación más alta y los 2 renglones suenan a tuyo --- no a resumen de clase.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- El pitch de mi libro} (20 min · individual). Tienes tu tema. Ahora lo vas a comprimir en \emph{una sola frase} --- el pitch. Un pitch eficaz hace tres cosas a la vez: dice de qué va el libro, para quién es, y qué hace que valga la pena leerlo. Vas a escribir 3 versiones y elegir la más honesta.
  pilares:
    - |-
      \textbf{DE QUÉ:} el tema en 3--5 palabras, no en un párrafo. Si necesitas más de 5 palabras para nombrar el tema, todavía no está claro.
    - |-
      \textbf{PARA QUIÉN:} el lector ideal, concreto. No ``todo el mundo'' ni ``personas interesadas'' --- una persona específica con una situación específica.
    - |-
      \textbf{POR QUÉ vale:} qué aprenderá, sentirá o podrá hacer después de leerlo. El beneficio del lector en una frase.
    - |-
      \textbf{Algoritmo:} escribe 3 versiones del pitch con el patrón. Léelas en voz alta. La que no te da vergüenza y no te infla --- esa es la tuya.
  checklist:
    titulo: Checklist del pitch antes de cerrar el cuaderno
    items: |-
      \checkbox El pitch tiene máximo 2 renglones --- si necesita 3, todavía no está claro. \\[1mm] \checkbox Nombra un lector concreto, no ``todo el mundo''. \\[1mm] \checkbox El tema está en las primeras palabras, no enterrado al final. \\[1mm] \checkbox Lo puedes decir en voz alta sin titubear. \\[1mm] \checkbox No suena a descripción de Wikipedia --- suena a tu voz.
  plantilla_guion: |-
    «Un libro sobre \textit{[tema en 3--5 palabras]} para \textit{[lector ideal concreto]} que quiere \textit{[resultado o experiencia que el libro produce]}.» \\[3mm] \textbf{Ejemplo débil:} ``Un libro sobre tecnología para personas que quieren saber más.'' \\[1mm] \textbf{Ejemplo fuerte:} ``Un libro sobre cómo los jóvenes de Cartago usan el rap para hablar de lo que el colegio no les enseña, para estudiantes de bachillerato que sienten que su cultura no cabe en el aula.''
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- El pitch de mi libro». \textbf{Formato:} 3 versiones del pitch numeradas (1, 2, 3) siguiendo el patrón, con $\star$ marcando la elegida + 2 renglones explicando por qué esa versión y no las otras. \textbf{Extensión:} media página del cuaderno. \textbf{Sabes que terminaste cuando} las 3 versiones usan el patrón, la elegida es la más honesta, y la puedes decir en voz alta sin dudar.
  producto_titulo: Mapa de pasiones + evaluación de 3 temas + pitch del libro en una frase
  criterios:
    - El mapa de pasiones tiene 5 temas con «por qué es mío» escrito con honestidad, no con lo que suena bien
    - La tabla de evaluación aplica los 3 criterios (Profundidad, Audiencia, Voz propia) a los 3 candidatos con puntuación justificada
    - El pitch elegido nombra tema + audiencia concreta + resultado en máximo 2 renglones
    - El tema elegido tiene voz propia --- no es solo pasión de consumidor sino de alguien que sabe o ha vivido algo
    - Todo el cuaderno está escrito en primera persona sin disculpas ni inflación

triangulo:
  dussel:
    autor: Enrique Dussel
    cita: El que no habla desde su propia experiencia habla desde el poder ajeno.
    aplicacion: |-
      Un libro escrito sobre un tema ajeno --- elegido para impresionar en lugar de para dar --- no sirve al Otro: lo usa. Dussel diría que el primer acto ético del autor es elegir un tema que le pertenezca de verdad. En el Valle del Cauca, los saberes que más importaron fueron siempre los que venían de quien los había vivido: el agricultor hablando de la tierra, el pescador del río, la partera de la vida.
    pregunta_espejo: ¿El tema que elegiste te pertenece de verdad o lo elegiste para que suene bien ante los demás?
  estoico:
    autor: Epicteto
    cita: De las cosas que existen, unas dependen de nosotros y otras no.
    aplicacion: |-
      Tu pasión, tu experiencia, tu voz --- eso depende de ti y nadie puede quitártelo. El mercado editorial, los gustos del lector, si el libro se vuelve famoso --- eso no depende de ti. La decisión estoica del autor es escribir desde lo que le pertenece y soltar el resultado. Esa distinción --- lo mío vs. lo del mundo --- es la que hace que un libro se escriba hasta el final.
    pregunta_espejo: ¿Estás eligiendo tu tema desde lo que depende de ti o desde lo que imaginas que el mundo quiere leer?
  floridi:
    autor: Luciano Floridi
    cita: Cada acto informacional modifica la infoesfera para bien o para mal.
    aplicacion: |-
      Un libro sobre algo que realmente sabes añade información valiosa a la infoesfera --- enriquece el mundo compartido de ideas y perspectivas. Un libro sobre algo que no sabes añade ruido, y el ruido cuesta: desplaza lo valioso, confunde, desinforma. La elección del tema de tu libro es la primera decisión ética del inforg-autor.
    pregunta_espejo: ¿El libro que planeas escribir enriquece o ensucia la infoesfera? ¿Qué añade al mundo que ya no exista?

compromiso: |-
  \textbf{Para la próxima sesión.} Cuéntale a una persona de confianza --- familiar, amigo, alguien que te conoce bien --- el tema de tu libro y su pitch en una frase. Observa la reacción: ¿pregunta más?, ¿le genera curiosidad?, ¿o cambia de tema? Esa reacción vale más que cualquier puntaje de la tabla de evaluación. Anota la reacción en tu cuaderno en 3 renglones antes de llegar a la próxima sesión.

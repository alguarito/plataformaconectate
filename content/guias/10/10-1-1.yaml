clave: 1-1
grado: 10
periodo: 1
sesion: 1
completo: true
duracion_min: 90
titulo: El oficio del editor --- qué hace y qué no hace
titulo_portada: |-
  El oficio del editor ---
  qué hace y
  qué no hace
producto_final: Definición personal del rol de editor en 1 página, las 3 decisiones críticas declaradas, el análisis de 2 libros con lente editorial y un cierre sobre por qué editar no es escribir
apertura:
  saber_ancestral: |-
    En Cartago la reputación de un taller de bordado no la construye lo que se dice de él, sino lo que sale de sus manos. Los ornamentos que vistió el papa durante su visita a Colombia se bordaron allí (Chica García, 2019). Una prenda pasa por unas ocho artesanas y más de ocho horas de trabajo antes de llevar el nombre de un taller. En un oficio así el nombre no se defiende hablando: se defiende con la puntada, y una sola pieza mal hecha pesa más que cualquier rumor. La \textbf{cara de exclusión} está en ese mismo nombre. El taller lo sostienen ocho artesanas por prenda que rara vez aparecen en él, porque la reputación se acumula en el taller y no en quien borda. Firmar es quedar respondiendo por lo que otras manos hicieron. Y también es decidir a quién se nombra.
  origen: Talleres de bordado de Cartago · el nombre que firma lo que ocho manos hicieron
  fuente: |-
    Chica García, A. (2019, 17 de agosto). \emph{Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas}. Radio Nacional de Colombia.
  saber_contemporaneo: |-
    El oficio editorial existe desde que hubo libros, mucho antes de internet y de la IA. Un \textbf{editor} es quien toma las decisiones sobre una obra: qué entra y qué sale, cómo se ordena, para quién es, qué tono tiene, qué se acepta y qué se devuelve a corregir. En el oficio se dice corto: el editor no es el autor, pero firma como responsable de la pieza. En este periodo tú vas a ser el editor de tu propio libro. La IA generativa será tu escritor asistente y producirá primeros borradores. Tú decides, ordenas, refinas y firmas. Si pierdes esa distinción terminas con un libro que la IA escribió y tú presentaste. Si la sostienes, terminas con un libro tuyo, hecho con ayuda de IA.
  pregunta_puente: |-
    ¿Qué está aceptando un taller cuando pone su nombre en una prenda que pasó por ocho manos? ¿Y qué acepta quien firma un libro escrito con ayuda de una IA?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las tres decisiones que cualquier editor toma sobre una obra --- tema, audiencia y estructura --- en libros que ya conoces; (2) \textbf{analizar} qué decisión editorial sostiene principalmente a cada uno de esos libros; (3) \textbf{evaluar} qué responsabilidad estás aceptando al firmar como editor de tu propio libro.
puentes:
  a_ruta: |-
    Este periodo te lleva a producir un libro como editor responsable, con la IA generativa de escritor asistente. Las nueve sesiones que siguen se sostienen sobre la decisión que tomas hoy: aceptar el rol de editor.
  a_escuta: |-
    Antes de teorizar, vas a mirar dos libros que conoces de verdad. De cada uno vas a anotar quién lo escribió, para quién parece hecho, cómo está organizado y por qué te funcionó a ti.
  a_sistematizacion: |-
    Ya miraste dos libros. Ahora vas a entender la \textbf{anatomía del oficio}: las tres decisiones críticas, los errores típicos del editor novato con IA y la diferencia entre escribir y editar.
  a_praxis: |-
    Tienes el método. Toca aplicarlo. Escribes tu definición de editor, declaras tus tres decisiones, analizas los dos libros con esa lente y cierras con la diferencia entre escribir y editar.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: la definición, las tres decisiones, los dos análisis y el cierre. El criterio principal es que al terminar sepas qué responsabilidad estás aceptando para las nueve sesiones que vienen.
  a_evaluacion: |-
    Antes de cerrar, mira el oficio del editor desde las cinco dimensiones humanas. Aceptar el rol con honestidad es respeto por el oficio. Declararse «solo usuario de IA» es renunciar a la responsabilidad antes de empezar.
  a_triangulo: |-
    Y para terminar, tres voces sobre firmar lo que otras manos hicieron. Dussel sobre el trabajo que hay detrás de cada objeto, Séneca sobre que la vida no desdiga de la palabra, Floridi sobre artefactos que ya no solo obedecen instrucciones.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Dos libros bajo la lupa} (15 min · individual). (1) Anota dos libros que conozcas de verdad: un manga, una novela, un manual, un libro de divulgación o un cómic. (2) Para cada uno responde sin buscar nada: quién es el autor o autora. (3) Para quién parece hecho el libro, y en qué lo notas. (4) Cómo está organizado por dentro: capítulos, secciones, ilustraciones. (5) Qué hace que a ti te funcione, en una frase.
  checks:
  - |-
    Elegí dos libros que conozco bien, no dos que me suenan.
  - |-
    Respondí las cuatro preguntas sobre cada uno sin buscar información.
  - |-
    Escribí en una frase qué hace que cada libro me funcione a mí.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Dos libros bajo la lupa». \textbf{Formato:} una ficha por libro con autoría, audiencia, organización y la frase de por qué te funciona. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} ves que cada libro es resultado de decisiones y no de casualidades.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · ANALIZA --- Las tres decisiones y los cinco errores} (20 min · parejas). (1) Con tu pareja, escriban las tres decisiones críticas con un ejemplo propio de cada una. (2) Escriban los cinco errores del editor novato con IA. (3) Cada uno marca el error que más teme cometer y explica por qué. (4) Escriban en dos líneas la diferencia entre escribir y editar, con sus propias palabras.
  pilares:
  - |-
    Las tres decisiones más críticas se descomponen así. El \textbf{tema}: de qué trata el libro y qué pregunta responde, en una o dos frases. Si no cabe en dos frases, el tema todavía no está claro. La \textbf{audiencia}: para quién es, qué edad tiene y cuánto conocimiento previo se le supone. La \textbf{estructura}: cómo se ordena el contenido, cuántos capítulos, si es narrativo o temático. Las tres se toman antes de escribir la primera palabra.
  - |-
    La diferencia entre escribir y editar cabe en una imagen: quien escribe llena la página en blanco, y quien edita decide qué se queda en la página llena. Producir texto es justo lo que la IA hace con facilidad. Decidir qué texto merece quedarse sigue siendo trabajo humano, porque exige criterio cultural, ético y estético. La phronesis del editor consiste en no avergonzarse de pedirle a la IA, y en no delegarle la decisión.
  - |-
    Los cinco errores del editor novato con IA. Aceptar el primer borrador, que casi nunca es el definitivo. Delegarle a la IA las tres decisiones críticas. No leer lo que se firma. Ocultar que se usó IA. Y renunciar a la voz propia, con lo que el libro termina sonando a chatbot y no a ti.
  - |-
    Algoritmo del oficio editorial con IA: (1) toma las tres decisiones críticas tú; (2) genera borradores con la IA; (3) lee cada borrador como crítico y no como receptor; (4) reescribe lo que no suene a ti; (5) firma solo lo que puedes defender; (6) declara qué aportó la IA.
  anatomia:
    titulo: Anatomía del oficio editorial
    body: |-
      \textbf{Tema:} de qué trata, en una o dos frases. \\[1mm] \textbf{Audiencia:} para quién, con qué nivel previo. \\[1mm] \textbf{Estructura:} cómo se ordena el contenido. \\[1mm] \textbf{Regla de oro:} no escribes todo, pero firmas todo. \\[1mm] \textbf{Con IA:} la IA propone, tú decides, tú firmas y tú declaras.
  errores_comunes: |-
    (1) Aceptar el primer borrador sin editarlo. (2) Delegarle a la IA las tres decisiones críticas. (3) No leer lo que se firma. (4) Ocultar el uso de IA en el producto final. (5) Renunciar a la voz propia y dejar que el libro suene a chatbot.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} \textbf{Título:} «Actividad 2 --- Anatomía editorial». \textbf{Formato:} las tres decisiones con tu propio ejemplo, los cinco errores con el que más temes marcado, y la diferencia entre escribir y editar en dos líneas. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} podrías explicarle a un compañero qué hace un editor de libro.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Mi definición de editor} (30 min · individual). (1) Escribe a mano, sin pedirle nada a la IA, qué te comprometes a hacer como editor durante el periodo. (2) Declara tus tres decisiones preliminares: tema, audiencia y estructura. (3) Analiza los dos libros de la actividad 1 y di qué decisión editorial sostiene principalmente a cada uno. (4) Cierra con cinco líneas sobre por qué editar no es escribir. (5) Lee tu definición en voz alta y pregúntate si suena a ti o a respuesta de chatbot. (6) Fírmala con tu nombre.
  pilares:
  - |-
    Tu entrega se construye en cuatro piezas: la definición personal de una página, las tres decisiones críticas declaradas, el análisis de los dos libros y el párrafo de cierre. Las cuatro son tuyas, sin excepción.
  - |-
    Sigue el patrón «voz propia desde el principio». La definición se escribe a mano, sin IA. Es una declaración tuya sobre el oficio. Si desde la primera sesión la IA escribe por ti, vas a llegar a la última sin haber asumido el rol.
  - |-
    Las tres decisiones pueden ser preliminares. No tienes que cerrar hoy el tema del libro. Pero declararlas obliga a pensar antes de actuar, y eso es distinto de abrir un chat y preguntar qué libro hacer.
  - |-
    Algoritmo: (1) escribe la definición; (2) declara las tres decisiones; (3) analiza los dos libros con la lente editorial; (4) cierra con la diferencia entre escribir y editar; (5) léela en voz alta; (6) fírmala.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Definición personal de una página, escrita sin IA. \\[1mm] \checkbox Las tres decisiones críticas declaradas, aunque sean preliminares. \\[1mm] \checkbox Los dos libros analizados con lente editorial. \\[1mm] \checkbox Párrafo de cierre sobre escribir y editar. \\[1mm] \checkbox Leída en voz alta y reconocible como tu voz. \\[1mm] \checkbox Firmada con tu nombre.
  plantilla_guion: |-
    \textbf{Definición personal.} \textit{Qué me comprometo a hacer como editor.} \\[1mm] \textbf{Decisión 1 (tema).} \textit{De qué tratará mi libro.} \\[1mm] \textbf{Decisión 2 (audiencia).} \textit{Para quién es.} \\[1mm] \textbf{Decisión 3 (estructura).} \textit{Cómo se organiza.} \\[1mm] \textbf{Análisis de los dos libros.} \textit{Qué decisión editorial sostiene a cada uno.} \\[1mm] \textbf{Cierre.} \textit{Por qué editar no es escribir.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Mi definición de editor». \textbf{Formato:} la definición, las tres decisiones, los dos análisis y el cierre, firmados con tu nombre. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} podrías firmar ese texto con tu nombre sin incomodidad.
  producto_titulo: Definición personal de editor, 3 decisiones críticas, análisis de 2 libros y cierre
  criterios:
  - Definición personal de una página escrita sin asistencia de IA
  - Las tres decisiones críticas declaradas, aunque sean preliminares
  - Los dos libros analizados con lente editorial, no resumidos
  - Párrafo de cierre sobre la diferencia entre escribir y editar
  - Voz propia reconocible al leerla en voz alta
  - Entrega firmada con tu nombre
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.3.4.3
    cita: |-
      Los artefactos u objetos… que nos rodean en el mundo cotidiano… son entonces productos del trabajo humano… Si los entes son instrumentos producidos significa que fueron objeto de un cierto trabajo.
    aplicacion: |-
      Detrás de una prenda bordada hay ocho artesanas y más de ocho horas. Detrás de un libro hay lecturas, decisiones y descartes. Firmar como editor no es afirmar que lo escribiste todo: es responder por el trabajo que hay debajo, incluido el que no hiciste tú.
    pregunta_espejo: |-
      De lo que voy a firmar este periodo, ¿qué parte va a ser trabajo mío y qué parte de otros?
  estoico:
    autor: Séneca · Cartas a Lucilio, 20 (c. 64 d.C.)
    cita: |-
      La filosofía enseña a hacer, no a decir; y exige que cada uno viva según su propia ley, que la vida no desdiga de la palabra. (trad. propia)
    aplicacion: |-
      El taller de Cartago no defiende su nombre hablando: lo defiende con la puntada. Tu definición de editor no vale por lo bien redactada que quede hoy, sino por si dentro de nueve sesiones el libro se le parece. Lo que escribas hoy va a quedar como medida de lo que hagas después.
    pregunta_espejo: |-
      Lo que escribí hoy que me comprometo a hacer, ¿lo estoy haciendo en la sesión 5?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 3.2
    cita: |-
      En el mundo onlife, los artefactos han dejado de ser meras máquinas que simplemente operan según instrucciones humanas: pueden cambiar de estado de manera autónoma. (trad. propia)
    aplicacion: |-
      Una herramienta que propone texto por su cuenta no es un martillo. Por eso la pregunta de quién firma se volvió difícil justo ahora. La respuesta del oficio sigue siendo la misma que en el taller: firma quien decide, y quien decide responde.
    pregunta_espejo: |-
      Cuando la IA me proponga un capítulo entero, ¿voy a decidir sobre él o voy a aceptarlo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu definición de editor, las tres decisiones preliminares y el análisis de los dos libros. En la sesión 2 vas a concebir tu libro: género, audiencia precisa y escaleta. La decisión de hoy es la base de todo lo que sigue.
web:
  resumen: |-
    Asumes el rol de editor de tu propio libro: escribir es producir, editar es elegir, ordenar y responder. La IA será tu escritor asistente, no tu editor.
  subtema: Oficio editorial · Autoría y responsabilidad
  pre_lectura:
    por_que_importa: |-
      Cualquiera puede pedirle un texto a una IA. Lo que distingue a un editor es que decide qué se queda, qué se descarta y qué firma. Esa distinción sostiene todo el periodo.
    pregunta_detonante: |-
      Si un libro lo escribió en parte una IA y tú lo firmas, ¿de qué exactamente estás respondiendo?
    activacion:
      titulo: La prenda que pasó por ocho manos
      descripcion: |-
        En 3 minutos, piensa en algo que uses a diario y cuenta cuántas personas tuvieron que trabajar en ello. Después mira de quién es el nombre que aparece encima.
      duracion_min: 3
    conexion:
      anterior: |-
        Vienes de un año de producir piezas propias; ahora vas a coordinar una obra larga.
      siguiente: |-
        En la sesión 2 concibes tu libro: género, tema, audiencia precisa y escaleta de capítulos.

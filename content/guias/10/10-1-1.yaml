clave: 1-1
grado: 10
periodo: 1
sesion: 1
completo: true
titulo: El oficio del editor --- qué hace y qué no hace
titulo_portada: |-
  El oficio del editor ---
  qué hace
  y qué no hace
producto_final: |-
  Definición personal del rol de editor de libro en 1 página + listado de las 3 decisiones más importantes que un editor toma (tema, audiencia, estructura) + análisis de 2 libros que conoces (manga, novela, manual, cómic, libro escolar) identificando qué decisión editorial sostiene a cada uno + 1 párrafo de cierre sobre por qué \emph{``editar''} no es lo mismo que \emph{``escribir''}
apertura:
  saber_ancestral: |-
    En cada barrio del centro de Cartago hubo durante décadas un personaje silencioso que cualquier vecino mayor recuerda: \textbf{el editor de la gaceta barrial}. La gaceta no era diario profesional ni revista grande: era un cuadernillo impreso a mimeógrafo, después fotocopiado, que circulaba los sábados por las tiendas. Adentro venían noticias del barrio: cumpleaños, fallecimientos, fiestas patronales, ofertas de la tienda de la esquina, anuncios de extraviados. El editor no escribía todas las notas: \textbf{las recibía, las elegía, las corregía}. Cada semana llegaban a su mesa 30-40 notas mandadas por vecinos. El editor leía cada una y decidía: esta entra, esta no entra, esta se acorta, esta se publica al lado de aquella. Cuando salía la gaceta, su nombre aparecía abajo: \emph{``Editor: don Hernando Castaño''}. Esa firma no significaba \emph{``yo escribí esto''}; significaba \emph{``yo respondo por esta pieza''}. Si una nota tenía error, el editor respondía. Si alguien se quejaba, era con él. \textbf{El editor no escribía todo, pero firmaba todo}. Esa distinción es ancestral y exacta: \textbf{escribir es producir; editar es elegir, ordenar y responder}. El editor moderno con IA hace exactamente lo mismo.
  saber_contemporaneo: |-
    El \textbf{oficio editorial} es uno de los más antiguos del mundo del texto: existe desde que hubo libros, mucho antes de internet y mucho antes de la IA. Un \textbf{editor} es la persona que \textbf{toma decisiones sobre una obra}: qué entra y qué sale, cómo se ordena, para qué audiencia es, qué tono tiene, qué se acepta y qué se devuelve para corregir. La regla profesional: \textbf{el editor no es el autor, pero firma como responsable de la pieza}. Hay distintos tipos de editor: editor de adquisiciones (decide qué libros se publican), editor de mesa (corrige el texto), editor de estilo (afina la voz). En este periodo tú vas a asumir el rol de \textbf{editor de tu propio libro}: tú decides el tema, tú eliges qué entra, tú apruebas lo que la IA genera, tú firmas el producto final. La IA generativa (ChatGPT, Gemini, Bing, Claude) será tu \textbf{escritor asistente}: produce primeros borradores. Tú eres el editor: decides, ordenas, refinas, firmas. Esa distinción es la base de todo el periodo. Si la pierdes, terminas con un libro que la IA escribió y tú solo presentaste; si la mantienes, terminas con un libro tuyo, hecho con ayuda de IA.
  pregunta_puente: |-
    ¿Qué sabía don Hernando, editor de la gaceta del barrio, al firmar abajo sin haber escrito todas las notas? ¿Y por qué la diferencia entre \emph{``escribir''} y \emph{``editar''} es lo que separa al usuario casual de ChatGPT del editor profesional que asume la IA con criterio?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 3 decisiones más importantes que cualquier editor toma sobre una obra (tema, audiencia, estructura); (2) \textbf{analizar} libros reales que conoces detectando qué decisiones editoriales los sostienen; (3) \textbf{explicar} con tus palabras la diferencia entre escribir y editar y por qué importa en la era de la IA generativa; (4) \textbf{evaluar} tu propia disposición para asumir el rol de editor durante este periodo.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Este periodo te lleva a producir un \textbf{libro de 80 páginas} como editor responsable, usando IA generativa como tu escritor asistente. Las 9 sesiones que siguen (concebir el libro, prompting técnico, iterar texto, estructura editorial, derechos de autor, portada con IA, diagramación, producción, sustentación) se sostienen sobre la decisión que tomas hoy: \textbf{aceptar el rol de editor}.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{mirada honesta} a 2 libros que conoces (puede ser un manga, una novela, un manual, un libro escolar, un cómic). Para cada uno, anota qué te llama la atención: ¿por qué fue para ti?, ¿quién lo escribió y para quién?, ¿cómo está organizado?.
  a_sistematizacion: |-
    Ya miraste 2 libros. Ahora vas a entender la \textbf{anatomía del oficio editorial}: las 3 decisiones críticas, los 5 errores típicos del editor novato, la diferencia entre escribir y editar.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: defines tu rol de editor por escrito, listas las 3 decisiones críticas, analizas los 2 libros con esa lente, cierras con la diferencia entre escribir y editar.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: definición + 3 decisiones + análisis + cierre. El criterio principal: que después de esta sesión sepas con claridad qué tipo de responsabilidad estás aceptando para los próximos 9 encuentros del periodo.
  a_evaluacion: |-
    Antes de cerrar, mira el oficio del editor desde las cinco dimensiones humanas. Aceptar el rol con honestidad es respeto por el oficio; pretender ser \emph{``solo usuario de IA''} es renunciar a la responsabilidad antes de empezar.
  a_triangulo: |-
    Y para terminar, tres voces sobre el oficio que firma. Dussel sobre la autoría asumida en la era de la IA, Marco Aurelio sobre la responsabilidad como virtud, Floridi sobre el editor humano como ancla ética en la infosfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 2 libros que conoces} (15 min · individual). Anota 2 libros que conoces de verdad (los leíste completos o conoces a alguien que los leyó). Pueden ser: un manga (\emph{One Piece}, \emph{Naruto}), una novela (\emph{Cien años de soledad}, \emph{Crónica de una muerte anunciada}), un manual escolar, un libro de divulgación (de YouTubers, ej. \emph{El club de los emperadores}), un cómic. Para cada uno responde sin investigar: (1) ¿quién es el autor o autora? (2) ¿para qué audiencia crees que lo escribió? (3) ¿cómo está organizado el libro (capítulos cortos, capítulos largos, ilustraciones, mezcla de texto e imagen)? (4) ¿por qué a ti te interesó (o te aburrió)? Esa primera mirada revela decisiones editoriales que ya percibes intuitivamente.
  checks:
  - Elegí 2 libros que conozco bien.
  - Respondí 4 preguntas sobre cada uno.
  - Identifiqué qué los hace funcionar para mí.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 2 libros bajo la lupa». \textbf{Formato:} ficha por cada libro con autor, audiencia, organización, atractivo personal. \textbf{Sabes que terminaste cuando} ves que cada libro es resultado de decisiones, no de casualidades.
sistematizacion:
  intro: |-
    Tus observaciones intuitivas tienen estructura profesional detrás. Para que tu trabajo como editor sea consciente y no casual necesitas la \textbf{anatomía del oficio editorial}: las 3 decisiones críticas, los errores que cometen los editores novatos, la distinción entre escribir y editar.
  pilares:
  - |-
    Las \textbf{3 decisiones más críticas} que cualquier editor toma sobre una obra se descomponen así: (1) \textbf{Tema}: ¿de qué trata el libro?, ¿qué pregunta responde?, ¿qué problema explora? La respuesta debe poder darse en 1-2 frases. Si no se puede, el tema todavía no está claro. (2) \textbf{Audiencia}: ¿para quién es?, ¿qué edad?, ¿qué intereses previos?, ¿cuánto conocimiento del tema se asume? El mismo libro escrito para niños y para adultos sería completamente distinto. (3) \textbf{Estructura}: ¿cómo se ordena el contenido?, ¿cuántos capítulos?, ¿narrativo o por temas?, ¿con ilustraciones o solo texto?. Estas 3 decisiones se toman \textbf{antes de escribir la primera palabra}, no después.
  - |-
    La \textbf{diferencia entre escribir y editar} se puede resumir en una imagen: el escritor llena la página en blanco; el editor decide qué se queda en la página llena. Producir texto es lo que la IA generativa hace fácilmente; \textbf{decidir qué texto merece quedarse y qué texto se descarta es trabajo humano}. El editor profesional acepta esa asimetría: la IA escribe rápido, pero solo el humano puede decidir con criterio cultural, ético, estético. La phronesis del editor con IA consiste en \textbf{no avergonzarse de pedir a la IA, ni delegar en ella la decisión}.
  - |-
    Los \textbf{5 errores típicos} del editor novato con IA: (a) \textbf{Aceptar el primer borrador}: lo que la IA produce primero rara vez es lo definitivo. (b) \textbf{Delegar las 3 decisiones}: pedirle a la IA que decida tema, audiencia y estructura. (c) \textbf{No leer lo que firma}: aceptar capítulos enteros sin haberlos revisado. (d) \textbf{Ocultar el uso de IA}: pretender que escribiste solo cuando la IA hizo parte del trabajo. (e) \textbf{Renunciar a la voz propia}: dejar que el libro suene a IA en lugar de a ti.
  - |-
    Algoritmo del oficio editorial con IA: (1) tomar las 3 decisiones críticas en humano. (2) generar borradores con IA. (3) leer cada borrador como crítica, no como receptor pasivo. (4) reescribir lo que no suene a ti. (5) firmar solo lo que defiendes. (6) declarar abiertamente lo que la IA aportó.
  anatomia:
    titulo: Anatomía del oficio editorial
    body: |-
      \textbf{Tema:} de qué trata, en 1-2 frases. \\[1mm] \textbf{Audiencia:} para quién, con qué nivel previo. \\[1mm] \textbf{Estructura:} cómo se ordena el contenido. \\[1mm] \textbf{Regla de oro:} no escribes todo, pero firmas todo. \\[1mm] \textbf{Con IA:} la IA propone, tú decides, tú firmas.
  errores_comunes: |-
    (1) Aceptar el primer borrador sin editar. (2) Delegar a la IA las 3 decisiones críticas. (3) No leer lo que firmas como editor. (4) Ocultar el uso de IA en el producto final. (5) Renunciar a la voz propia y dejar que el libro suene a chatbot.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía editorial». \textbf{Formato:} (a) las 3 decisiones críticas con tu propio ejemplo; (b) los 5 errores con marca del que más temes; (c) diferencia escribir vs editar en 2 líneas. \textbf{Sabes que terminaste cuando} podrías explicarle a un compañero qué hace un editor de libro.
praxis:
  intro: |-
    \textbf{Actividad 3 · EXPLICA + EVALÚA --- Definición personal del editor + análisis} (30 min · individual). Hora de aplicar. Escribes la definición personal de tu rol como editor para este periodo, listas las 3 decisiones que tomarás sobre tu libro, analizas los 2 libros que elegiste con la lente editorial, cierras con la diferencia escribir-editar.
  pilares:
  - |-
    Tu entrega se construye en 4 piezas: (1) \textbf{Definición personal} (1 página): escribe con tus palabras qué te comprometes a hacer como editor durante el periodo. Incluye qué decidirás tú y en qué te ayudará la IA. (2) \textbf{3 decisiones críticas} (lista con descripción): tema (qué tipo de libro quieres hacer), audiencia (para quién), estructura (formato preliminar). (3) \textbf{Análisis de los 2 libros} (1 párrafo por cada uno): identifica qué decisión editorial sostiene principalmente a cada libro. (4) \textbf{Párrafo de cierre} (5 líneas): por qué editar no es lo mismo que escribir y por qué te importa la distinción.
  - |-
    Sigue el patrón \textbf{``voz propia desde el principio''}: la definición personal del editor se escribe a mano, sin pedir a la IA. Es declaración tuya sobre el oficio. Si desde la sesión 1 la IA escribe por ti, llegarás a la sesión 10 sin haber asumido el rol. La phronesis del editor consiste en \textbf{abrir el periodo con voz propia clara}.
  - |-
    Las 3 decisiones pueden ser preliminares: no tienes que cerrar el tema del libro hoy. Pero el ejercicio de declararlas obliga a pensar antes de actuar. En las sesiones siguientes podrás ajustar; lo importante es empezar el periodo con un punto de partida tuyo, no con \emph{``ChatGPT, dime qué libro hago''}.
  - |-
    Algoritmo: (1) escribir definición personal. (2) declarar 3 decisiones. (3) analizar los 2 libros con la lente editorial. (4) cerrar con la diferencia escribir-editar. (5) revisar en voz alta tu definición: ¿suena a ti o suena a respuesta de chatbot?
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Definición personal del editor de 1 página. \\[1mm] \checkbox 3 decisiones críticas declaradas (tema, audiencia, estructura). \\[1mm] \checkbox 2 libros analizados con lente editorial. \\[1mm] \checkbox Párrafo de cierre escribir vs editar. \\[1mm] \checkbox Definición escrita sin asistencia de IA. \\[1mm] \checkbox Texto leído en voz alta para verificar voz propia.
  plantilla_guion: |-
    \textbf{Definición personal.} \textit{Qué me comprometo a hacer como editor.} \\[1mm] \textbf{Decisión 1 (tema).} \textit{De qué tratará mi libro.} \\[1mm] \textbf{Decisión 2 (audiencia).} \textit{Para quién es.} \\[1mm] \textbf{Decisión 3 (estructura).} \textit{Cómo se organiza.} \\[1mm] \textbf{Análisis libro 1.} \textit{Qué decisión editorial lo sostiene.} \\[1mm] \textbf{Análisis libro 2.} \textit{Qué decisión editorial lo sostiene.} \\[1mm] \textbf{Cierre.} \textit{Por qué editar no es escribir.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EXPLICA + EVALÚA).} Título: «Actividad 3 --- Mi definición de editor». \textbf{Formato:} ficha con 7 partes (definición, 3 decisiones, 2 análisis, cierre). \textbf{Extensión:} 1-2 páginas de cuaderno. \textbf{Sabes que terminaste cuando} podrías firmarlo con tu nombre con orgullo.
  producto_titulo: Definición personal + 3 decisiones críticas + análisis de 2 libros + cierre
  criterios:
  - Definición personal de 1 página escrita sin IA
  - 3 decisiones críticas declaradas (preliminares)
  - 2 libros analizados con lente editorial
  - Párrafo de cierre sobre escribir vs editar
  - Voz propia reconocible en el texto
  - Entrega firmada con nombre
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Firmar como editor en la era de la IA es acto de autoría asumida, no de delegación cómoda.
    aplicacion: |-
      En la era de la IA generativa, es fácil esconderse detrás de \emph{``la IA lo escribió''}. La filosofía de la liberación pide lo opuesto: \textbf{asumir la autoría como decisión política}. Cuando firmas como editor, declaras: yo decidí qué entra, yo elegí la voz, yo respondo por la pieza. Esa firma es ya acto de dignidad cultural en un mundo donde el contenido generado por IA crece sin nombres responsables.
    pregunta_espejo: |-
      ¿Estoy dispuesto a firmar mi libro como editor responsable, o prefiero esconderme detrás de \emph{``lo hizo la IA''}?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La responsabilidad asumida es virtud; delegarla a la herramienta es debilidad disfrazada de modernidad.
    aplicacion: |-
      Es tentador pensar que usar IA significa que la IA es responsable del resultado. La disciplina estoica recomienda lo opuesto: \emph{las herramientas no asumen responsabilidad; los humanos sí}. El editor con IA conserva la responsabilidad completa sobre lo que firma. Esa virtud no es opcional: es lo que separa al profesional del usuario casual.
    pregunta_espejo: |-
      ¿Asumo la responsabilidad de mi libro como editor, o pretendo que la IA es co-autora con derechos y deberes que ella no tiene?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El editor humano es el ancla ética en la infosfera saturada de contenido generado por IA.
    aplicacion: |-
      En la era de la IA generativa, miles de páginas se producen por minuto sin autor humano declarado. La ética digital contemporánea exige editores humanos que firmen, decidan, descarten. Tu papel como editor de tu libro no es residual: es la pieza ética que sostiene la calidad informacional. Aunque sea proyecto escolar, las prácticas son las mismas que rigen toda producción profesional con IA.
    pregunta_espejo: |-
      ¿Mi rol de editor aporta calidad informacional al mundo, o solo agrega más contenido generado por IA disfrazado de obra humana?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu definición de editor, las 3 decisiones preliminares y el análisis de los 2 libros. En la sesión 2 vas a \textbf{concebir tu libro}: definir género, audiencia precisa y escaleta de 8-12 capítulos. La decisión editorial de hoy es la base; la concepción de mañana se monta sobre tu rol claro.
web:
  conceptos_clave:
    - termino: Editor
      definicion: |-
        Persona que toma decisiones sobre una obra: qué entra, qué sale, cómo se ordena, para qué audiencia. No es el autor, pero firma como responsable.
      ejemplo: |-
        Si la IA genera 3 capítulos pero tú decides cuál entra y cuál se devuelve a reescribir, ejerces el oficio editorial.
      emoji: "📝"
    - termino: Autor vs editor
      definicion: |-
        El autor escribe; el editor decide. En este periodo asumes el rol de editor de tu propio libro, no de escritor a mano.
      ejemplo: |-
        La IA actúa como autor asistente; tú como editor responsable. La firma final es tuya, no del modelo.
      emoji: "✍️"
    - termino: Escritor asistente (IA)
      definicion: |-
        Rol que asume la IA generativa cuando produce primeros borradores. No firma ni decide; sirve como apoyo bajo tu criterio.
      ejemplo: |-
        ChatGPT escribe el primer borrador del capítulo 3. Tú lo lees, decides qué sirve y qué reescribir.
      emoji: "🤖"
    - termino: Decisiones editoriales
      definicion: |-
        Qué tema, qué audiencia, qué tono, qué se acepta y qué se devuelve a corregir. Toda decisión deja huella en el libro final.
      ejemplo: |-
        Decides usar tono cercano en lugar de académico. Esa elección cambia cómo el lector vivirá el libro.
      emoji: "🧭"
    - termino: Responsabilidad firmada
      definicion: |-
        El editor firma como responsable de lo publicado. Si algo es impreciso o inadecuado, la responsabilidad recae en el editor, no en la IA.
      ejemplo: |-
        Si tu libro afirma un dato falso generado por la IA, tú respondes por la publicación, no el chatbot.
      emoji: "🪪"
  quiz:
    titulo: ¿Entiendes el oficio editorial?
    instrucciones: 5 preguntas para verificar que separas escritor y editor.
    preguntas:
      - enunciado: ¿Cuál es la principal diferencia entre autor y editor?
        opciones:
          - El editor escribe más rápido
          - Son lo mismo
          - El autor escribe; el editor decide qué entra y firma como responsable
          - El editor solo corrige comas
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. El autor escribe; el editor decide y firma como responsable de la obra publicada.
        feedback_incorrecto: |-
          El autor escribe; el editor decide qué entra y firma como responsable. Son roles distintos con funciones distintas.
      - enunciado: En este periodo, ¿qué rol asume la IA generativa?
        opciones:
          - Editor responsable
          - Escritor asistente que produce primeros borradores
          - Tu jefe
          - El director del colegio
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La IA es escritor asistente. Produce borradores; tú editas, decides y firmas como responsable.
        feedback_incorrecto: |-
          La IA es escritor asistente. Tú eres editor: decides, ordenas y firmas.
      - enunciado: Si pierdes la distinción autor/editor, ¿qué pasa con tu libro?
        opciones:
          - Lo terminas más rápido
          - Vendes más copias
          - No pasa nada
          - Termina con un libro que la IA escribió y tú solo presentaste
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Sin la distinción clara, terminas presentando lo que la IA generó. Con la distinción, terminas con un libro tuyo.
        feedback_incorrecto: |-
          Sin la distinción, terminas con un libro que la IA escribió y tú solo presentaste. Por eso el oficio editorial importa.
      - enunciado: ¿Quién firma como responsable del libro?
        opciones:
          - El editor (tú)
          - La IA que generó el texto
          - El servidor del modelo
          - Nadie en particular
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. El editor firma. La IA no tiene personalidad jurídica ni responsabilidad sobre lo publicado.
        feedback_incorrecto: |-
          El editor firma. La IA no asume responsabilidad sobre lo publicado; tú sí.
      - enunciado: ¿Cuál de estos NO es un tipo de editor?
        opciones:
          - Editor de adquisiciones
          - Editor de mesa
          - Editor de WhatsApp
          - Editor de estilo
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Adquisiciones, mesa y estilo son tipos reales. "Editor de WhatsApp" no es categoría editorial.
        feedback_incorrecto: |-
          Los tres primeros son tipos reales (adquisiciones, mesa, estilo). El cuarto no es categoría editorial.

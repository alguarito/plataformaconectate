  conceptos_clave:
  - categoria: El oficio
    termino: Editor
    definicion: |-
      Quien decide sobre una obra: qué entra, qué sale, cómo se ordena y para quién es. No escribe todo, pero firma todo.
    ejemplo: |-
      El editor devuelve un capítulo a corregir aunque no vaya a reescribirlo él mismo.
  - categoria: El oficio
    termino: Autor y editor
    definicion: |-
      Quien escribe llena la página en blanco. Quien edita decide qué se queda en la página llena.
    ejemplo: |-
      Un mismo texto puede tener tres autores y un solo editor que responde por el conjunto.
  - categoria: El oficio
    termino: Escritor asistente
    definicion: |-
      El papel de la IA en este periodo: produce primeros borradores que después tú decides si sirven.
    ejemplo: |-
      La IA propone tres aperturas de capítulo; tú eliges una, la reescribes y descartas dos.
  - categoria: Las tres decisiones
    termino: Tema
    definicion: |-
      De qué trata el libro y qué pregunta responde. Si no cabe en dos frases, todavía no está claro.
    ejemplo: |-
      «Cómo se armó el barrio donde vivo, contado por quienes llegaron primero.»
  - categoria: Las tres decisiones
    termino: Audiencia
    definicion: |-
      Para quién es el libro y cuánto conocimiento previo se le supone a quien lo lee.
    ejemplo: |-
      El mismo tema escrito para un niño de diez años y para un adulto son dos libros distintos.
  - categoria: Las tres decisiones
    termino: Responsabilidad firmada
    definicion: |-
      Poner el nombre significa responder por la pieza, incluido el trabajo que hicieron otros o una herramienta.
    ejemplo: |-
      Si un dato del libro está mal, quien responde es quien firma, no quien generó el borrador.
  cinco_dimensiones:
    personal: |-
      Decides con qué nombre vas a responder por un trabajo largo. Es la primera vez que asumes una obra entera y no una pieza suelta.
    emocional: |-
      Aceptar que vas a descartar buena parte de lo que se produzca cuesta. Editar es en gran medida soltar.
    ciudadana: |-
      Declarar qué aportó la IA es una forma de honestidad pública. Ocultarlo es el atajo que erosiona la confianza en lo que se lee.
    local: |-
      En el taller de Cartago el nombre se defiende con la puntada. La reputación por obra es lenta y verificable; la reputación por conversación es rápida y reversible.
    intergeneracional: |-
      Que quien firma responda es un acuerdo viejo entre oficios. Lo que cambia es que ahora parte del trabajo lo hace una herramienta que propone sola.
  post_lectura:
    transferencia: |-
      Llega a la próxima sesión con tu definición de editor, las tres decisiones preliminares y el análisis de los dos libros. Son la base de la concepción del libro.
  quiz:
    titulo: Verifica el oficio del editor
    instrucciones: 5 preguntas para confirmar que distingues escribir de editar. Necesitas 3/5 para continuar.
    preguntas:
    - enunciado: ¿Cuál es la diferencia principal entre autor y editor?
      opciones:
      - El editor trabaja más rápido porque no tiene que producir el texto desde cero
      - Quien escribe llena la página; quien edita decide qué se queda y firma como responsable
      - El editor se ocupa de la ortografía y la puntuación una vez el texto está listo
      - "No hay diferencia real: en un libro pequeño las dos funciones las hace la misma persona"
      respuesta_index: 1
      feedback_correcto: |-
        Correcto. Producir texto y decidir qué texto merece quedarse son dos trabajos distintos.
      feedback_incorrecto: |-
        No es velocidad ni corrección de comas. Es quién decide y quién responde por el conjunto.
    - enunciado: En este periodo, ¿qué papel cumple la IA generativa?
      opciones:
      - El de editor responsable, que decide qué entra al libro y qué queda fuera
      - El de corrector final, que revisa el libro una vez tú lo has terminado entero
      - El de escritor asistente, que produce primeros borradores que tú decides si sirven
      - El de consultor, que recomienda qué tema y qué audiencia conviene elegir
      respuesta_index: 2
      feedback_correcto: |-
        Exacto. Produce borradores. Las decisiones y la firma siguen siendo tuyas.
      feedback_incorrecto: |-
        Si la IA decide el tema, la audiencia o qué entra, dejaste de ser el editor.
    - enunciado: ¿Cuáles son las tres decisiones críticas que se toman antes de escribir?
      opciones:
      - Tema, audiencia y estructura, y las tres se deciden antes de la primera palabra
      - Título, portada y número de páginas, que definen el formato final del libro
      - Herramienta, plataforma y formato de exportación con que se va a trabajar
      - Presupuesto, cronograma y reparto de tareas entre quienes participan
      respuesta_index: 0
      feedback_correcto: |-
        Sí. Si el tema no cabe en dos frases o la audiencia no está definida, escribir es adivinar.
      feedback_incorrecto: |-
        El título y la herramienta vienen después. Primero: de qué trata, para quién y cómo se ordena.
    - enunciado: ¿Por qué declarar abiertamente que usaste IA en tu libro?
      opciones:
      - Porque de lo contrario la institución podría anular la entrega del producto final
      - Porque los modelos dejan marcas que cualquier detector automático puede reconocer
      - Porque así queda claro que el trabajo tomó menos tiempo del que aparenta
      - Porque quien firma responde, y responder incluye decir cómo se hizo la pieza
      respuesta_index: 3
      feedback_correcto: |-

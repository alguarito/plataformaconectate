clave: 1-10
grado: 10
periodo: 1
sesion: 10
completo: true
titulo: Sustentación + feria del libro escolar
titulo_portada: |-
  Sustentación +
  feria del libro
  escolar
producto_final: |-
  Sustentación pública de 6 minutos de tu libro frente al grupo con (a) presentación del libro (concepción + proceso + uso de IA + decisiones críticas), (b) lectura en voz alta de 1-2 minutos de un fragmento elegido, (c) muestra del PDF o libro impreso, (d) sesión de preguntas y respuestas de 5 minutos + participación activa en feria del libro escolar (puesto del libro, lectura de fragmentos de compañeros, intercambio honesto de comentarios) + autoevaluación final con 2 fortalezas y 2 mejoras
apertura:
  saber_ancestral: |-
    En los pueblos del Valle del Cauca y en los corregimientos cafeteros del Quindío, durante décadas existió una práctica cultural que reunía cada año al pueblo entero: \textbf{la feria del libro del pueblo}. No era feria de editorial grande: era encuentro local. Los autores barriales (poetas aficionados, cronistas del pueblo, maestros que habían escrito libros pedagógicos, párrocos con sermones recopilados) traían sus libros impresos en pequeño tiraje al parque principal. Ponían mesa con mantel sencillo, exhibían los ejemplares, se sentaban a esperar. Pero la feria no era solo exhibición: era \textbf{intercambio activo}. Los autores leían fragmentos en voz alta cuando llegaba alguien interesado. Los lectores preguntaban: \emph{``¿de qué trata?''}, \emph{``¿por qué lo escribió?''}, \emph{``¿está pasando lo que cuenta?''}. Los libros se vendían a precios bajos, se prestaban, se intercambiaban entre autores. Al cerrar el día, cada autor sabía algo nuevo sobre su propio libro: qué partes interesaban más, qué preguntas hacía el público, qué se vendía y qué no. La sabiduría era ancestral y simple: \textbf{el libro se completa con la audiencia, no antes}. La sustentación del periodo más la feria del libro escolar es esa práctica ancestral aplicada a tu grupo.
  saber_contemporaneo: |-
    La \textbf{sustentación pública} del libro es el acto formal donde el editor presenta su pieza ante el grupo. Tiene 4 propiedades irrenunciables: (1) \textbf{Tiempo controlado}: 6 minutos (similar a sustentación TED corta). Obliga a destilar lo esencial. (2) \textbf{Estructura clara}: concepción + proceso + decisiones + lectura de fragmento + muestra física o digital. (3) \textbf{Lectura en voz alta de un fragmento}: 1-2 minutos donde la audiencia escucha la voz del libro. Es la prueba de fuego: ¿suena a ti o suena a chatbot? (4) \textbf{Honestidad sobre uso de IA}: declarar abiertamente qué modelos usaste, qué porcentaje del texto generaste, qué porcentaje editaste o reescribiste a mano. La \textbf{feria del libro escolar} extiende la sustentación: los libros se exhiben, los compañeros se acercan a leer fragmentos, hay intercambio de comentarios. Es práctica de ciudadanía editorial: cada estudiante actúa como autor y como lector. La regla profesional del cierre: \textbf{el libro no termina cuando se firma; termina cuando se comparte con la audiencia}.
  pregunta_puente: |-
    ¿Qué sabían los autores de la feria del libro del pueblo al leer fragmentos en voz alta a quien se acercaba a la mesa, que el estudiante novato olvida cuando entrega el PDF sin sustentar? ¿Y por qué la lectura en voz alta es la prueba de fuego de tu voz propia?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} tu libro completo identificando los 2-3 fragmentos más representativos de tu voz propia; (2) \textbf{explicar} en sustentación pública la concepción, proceso, decisiones críticas y uso de IA; (3) \textbf{evaluar} con honestidad las preguntas duras de la audiencia; (4) \textbf{crear} la presentación del libro y participar activamente en la feria como autor y como lector de los compañeros.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Has recorrido 9 sesiones para producir un libro de 80 páginas. Hoy es el \textbf{día de la firma pública}: presentas el libro ante el grupo. Después de hoy, cierra el periodo 1. El periodo 2 abre con informes técnicos y comunicación profesional.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lectura crítica final} de tu libro completo: identifica 2-3 fragmentos donde sientas que tu voz propia se nota más. Esos son los candidatos a fragmento de lectura en sustentación. Léelos en voz alta para ti mismo: ¿suenan a ti?
  a_sistematizacion: |-
    Ya tienes fragmentos candidatos. Ahora vas a entender la \textbf{anatomía de la sustentación de 6 minutos + feria}: estructura, los 5 errores típicos del sustentante novato, las reglas de la feria escolar.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: preparas slides simples, ensayas cronometrado, sustentas en público, lees fragmento en voz alta, respondes preguntas, participas en feria, autoevalúas.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: sustentación ejecutada + feria participada + autoevaluación. El criterio principal: que la audiencia se vaya sabiendo qué libro hiciste y queriendo abrirlo.
  a_evaluacion: |-
    Antes de cerrar, mira la sustentación desde las cinco dimensiones humanas. Defender el libro con honestidad y orgullo es cierre del oficio editorial; entregar sin sustentar es desperdicio del periodo entero.
  a_triangulo: |-
    Y para terminar, tres voces sobre el cierre del oficio editorial. Dussel sobre el editor que devuelve a la comunidad lo aprendido, Marco Aurelio sobre la honestidad del cierre, Floridi sobre la sustentación como ética profesional contemporánea.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Selección de fragmentos para lectura en voz alta} (15 min · individual). Toma el PDF final de tu libro y elige 2-3 fragmentos de 1-2 minutos cada uno (aproximadamente 150-200 palabras) donde sientas que tu voz propia se nota más. Léelos en voz alta a ti mismo. Reglas: (1) eviten aperturas obvias de capítulo si la apertura fue muy IA. (2) busquen escenas con tu ejemplo personal, tu opinión clara, tu estilo. (3) lee cada candidato en voz alta y mide tiempo. Elige el que te enorgullezca más como editor responsable.
  checks:
  - Releí mi libro completo buscando fragmentos.
  - Seleccioné 2-3 candidatos de 1-2 minutos.
  - Leí cada uno en voz alta y elegí el final.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Fragmentos para sustentar». \textbf{Formato:} 2-3 fragmentos identificados con página + tiempo de lectura + elección final con razón. \textbf{Sabes que terminaste cuando} el fragmento elegido te enorgullezca leerlo en público.
sistematizacion:
  intro: |-
    Tu fragmento elegido es la prueba de tu voz propia. Ahora necesitas la \textbf{anatomía profesional} de la sustentación de 6 minutos y la feria escolar.
  pilares:
  - |-
    La \textbf{estructura de la sustentación de 6 minutos} se descompone así: (1) \textbf{Concepción y producto} (1 min): qué libro hiciste, género, audiencia, propósito (ficha editorial de S2). (2) \textbf{Proceso y decisiones críticas} (1.5 min): cómo lo concebiste, cómo usaste prompts, cómo iteraste a V3, qué decisiones editoriales tomaste. (3) \textbf{Lectura en voz alta de fragmento} (1.5-2 min): el fragmento elegido en la actividad 1. (4) \textbf{Uso de IA declarado con honestidad} (1 min): qué modelos, qué porcentaje, qué hiciste tú. (5) \textbf{Muestra física o digital + cierre} (0.5-1 min): mostrar el PDF abierto, la portada, el lomo si es físico. Total: 6 minutos. Después: 5 minutos de Q\&A.
  - |-
    Los \textbf{5 errores típicos} del sustentante novato: (a) \textbf{Leer las slides}: matar la sustentación en el primer minuto. (b) \textbf{Ocultar uso de IA}: pretender escritura puramente humana cuando IA fue significativa. (c) \textbf{Fragmento débil}: leer un párrafo plano sin voz propia, traicionando todo el periodo. (d) \textbf{Evadir preguntas duras}: \emph{``¿qué porcentaje generó la IA?''} requiere respuesta honesta, no esquive. (e) \textbf{Cierre apurado}: terminar con \emph{``gracias''} en lugar de invitación a la feria.
  - |-
    Las \textbf{reglas de la feria del libro escolar} (después de las sustentaciones): (a) cada autor pone su libro en un puesto (mesa, escritorio). (b) los compañeros recorren los puestos en grupos de 3-4. (c) en cada puesto el autor lee 30 segundos de un fragmento y responde 1-2 preguntas. (d) los lectores pueden tomar nota de qué libros les interesaron más para leerlos completos después. (e) al cerrar la feria, cada autor recibe 3-5 comentarios escritos de compañeros sobre su libro.
  - |-
    Algoritmo: (1) preparar slides simples (5-7 slides máximo o usar el propio PDF como apoyo). (2) escribir guion hablado de 800-900 palabras (= 6 min). (3) ensayar 2 veces cronometrado. (4) sustentar. (5) leer fragmento en voz alta. (6) responder Q\&A con honestidad. (7) participar en feria como autor y como lector. (8) autoevaluar.
  anatomia:
    titulo: Anatomía de sustentación + feria
    body: |-
      \textbf{Sustentación (6 min):} concepción + proceso + fragmento + IA + muestra. \\[1mm] \textbf{Q\&A (5 min):} honestidad ante preguntas duras. \\[1mm] \textbf{Feria:} puesto + lectura 30 seg + 3-5 comentarios recibidos. \\[1mm] \textbf{Cierre:} autoevaluación con fortalezas y mejoras.
  errores_comunes: |-
    (1) Leer las slides en vez de hablar. (2) Ocultar uso de IA. (3) Fragmento débil sin voz propia. (4) Evadir preguntas duras. (5) Cierre apurado sin invitar a la feria. (6) En la feria, no leer los libros de los compañeros (solo cuidar el propio puesto). (7) No tomar nota de los comentarios recibidos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía sustentación + feria». \textbf{Formato:} (a) plan minuto a minuto de los 6 + 5 minutos; (b) reglas de la feria; (c) los 7 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} tienes plan claro para mañana.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- Sustentación ejecutada + feria + autoevaluación} (90 min total · individual + colectivo). Hora de ejecutar. Preparas slides, ensayas, sustentas con lectura de fragmento, respondes Q\&A, participas en feria como autor y como lector, autoevalúas.
  pilares:
  - |-
    Tu sustentación se construye en 6 pasos: (1) preparar slides simples (5-7 slides o usar el propio PDF como apoyo visual). (2) escribir guion hablado en prosa de 800-900 palabras. (3) ensayar cronometrado al menos 2 veces. (4) sustentar en público con lectura de fragmento elegido. (5) responder 3-5 preguntas con honestidad técnica. (6) participar en feria como autor (puesto con tu libro) y como lector (recorrer los demás).
  - |-
    Sigue el patrón \textbf{``honestidad pública sobre uso de IA''}: la declaración del uso de IA en sustentación es momento delicado pero esencial. Modelo de respuesta: \emph{``Usé Bing Image Creator para la portada, ChatGPT para borradores de los capítulos 2-5, y escribí enteramente a mano los capítulos 1, 6 y la carta del editor. Aproximadamente el 40 por ciento del texto final pasó por IA, el 60 por ciento fue escrito o reescrito por mí''}. Esa precisión gana respeto.
  - |-
    La \textbf{autoevaluación final} tiene 4 elementos: (a) \textbf{2 fortalezas}: qué hiciste bien en la sustentación (manejo del tiempo, fragmento elegido, claridad de la declaración de IA). (b) \textbf{2 mejoras}: qué harías distinto en una próxima sustentación (más ensayo, mejor manejo del nervio, slides más simples). (c) \textbf{1 cosa aprendida del feedback de la feria}: qué te dijeron los compañeros que no esperabas. (d) \textbf{Compromiso para el periodo 2}: 1 acción concreta para el siguiente trimestre.
  - |-
    Algoritmo: (1) preparar slides. (2) ensayar. (3) sustentar. (4) responder Q\&A. (5) participar en feria 30 min (15 min como autor, 15 min como lector). (6) recoger comentarios recibidos. (7) autoevaluar al cerrar la sesión.
  checklist:
    titulo: Checklist antes de sustentar
    items: |-
      \checkbox Slides simples (5-7 o usando el PDF como apoyo). \\[1mm] \checkbox Guion hablado de 800-900 palabras. \\[1mm] \checkbox Fragmento elegido y cronometrado (1-2 min). \\[1mm] \checkbox 2 ensayos cronometrados hechos. \\[1mm] \checkbox Declaración de uso de IA preparada con porcentaje. \\[1mm] \checkbox Libro disponible para mostrar (PDF abierto o impreso). \\[1mm] \checkbox Puesto listo para la feria. \\[1mm] \checkbox Autoevaluación pendiente al cerrar.
  plantilla_guion: |-
    \textbf{Concepción (1 min).} \textit{Género + tema + audiencia + propósito.} \\[1mm] \textbf{Proceso (1.5 min).} \textit{Concepción + prompts + iteración + decisiones.} \\[1mm] \textbf{Lectura de fragmento (1.5-2 min).} \textit{Voz propia en escena.} \\[1mm] \textbf{Uso de IA (1 min).} \textit{Modelos + porcentajes + reparto humano.} \\[1mm] \textbf{Muestra y cierre (0.5-1 min).} \textit{PDF + invitación a la feria.} \\[1mm] \textbf{Q\&A (5 min).} \textit{Honestidad ante preguntas duras.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Mi sustentación + feria». \textbf{Formato:} (a) referencia a slides o PDF apoyo; (b) guion hablado; (c) preguntas recibidas con respuesta; (d) comentarios de la feria; (e) autoevaluación con 4 elementos. \textbf{Sabes que terminaste cuando} entregaste libro al docente y reservaste tiempo para reflexión.
  producto_titulo: Sustentación 6 min + lectura de fragmento + feria participada + autoevaluación
  criterios:
  - Sustentación dentro de 6 minutos
  - Estructura clara de 5 segmentos
  - Lectura de fragmento en voz alta
  - Declaración honesta de uso de IA con porcentajes
  - Participación en feria como autor y lector
  - Autoevaluación con 4 elementos
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El editor que sustenta su libro ante la comunidad devuelve oficio asumido, no archiva trabajo individual.
    aplicacion: |-
      Tu sustentación cierra el ciclo del periodo: el libro vuelve a la comunidad (el grupo) hecho voz propia firmada. La filosofía de la liberación pide ese cierre: \emph{el saber editorial no se guarda; se devuelve}. La feria del libro es ese acto de devolución colectiva. Cuando lees tu fragmento y muestras tu libro, estás haciendo lo que el editor de la gaceta barrial hacía cada semana: ofrecer la pieza terminada al público que la espera.
    pregunta_espejo: |-
      ¿Mi sustentación devuelve oficio asumido al grupo, o solo cumple con requisito escolar?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La honestidad del cierre es virtud del editor; ocultar el proceso es debilidad disfrazada de modestia.
    aplicacion: |-
      Es tentador minimizar el uso de IA al sustentar (\emph{``casi no usé IA''}) o exagerarlo (\emph{``todo lo hizo la IA''}). La sabiduría estoica recomienda lo opuesto: \emph{declara los porcentajes exactos con sobriedad}. Esa precisión gana respeto profesional que las versiones inflada o minimizada nunca ganan. La phronesis del cierre honra la honestidad numérica.
    pregunta_espejo: |-
      ¿Estoy declarando porcentajes honestos del uso de IA, o inflando o minimizando según convenga?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La sustentación con declaración honesta de IA es la nueva ética profesional del oficio editorial del siglo XXI.
    aplicacion: |-
      En la era de la IA generativa, los editores profesionales que declaran abiertamente el uso de IA en sus libros se posicionan en el modelo ético emergente. Quien oculta uso de IA acumula deuda ética que tarde o temprano se descubre. Tu sustentación de hoy te entrena en una práctica que rige toda producción editorial profesional emergente: \textbf{transparencia con porcentajes y modelos}.
    pregunta_espejo: |-
      ¿Mi sustentación contribuye al modelo editorial transparente del siglo XXI, o sostiene la opacidad heredada?
compromiso: |-
  \textbf{Para la próxima sesión.} Cierras el periodo 1 (escritura abierta con IA) y abre el periodo 2 (informes técnicos y comunicación profesional con IA). La sesión 1 del periodo 2 trabajará los \textbf{4 tipos de texto profesional}: del libro creativo a los informes que se usan en empresas, ONGs y administración pública.
web:
  conceptos_clave:
    - termino: Sustentación pública del libro
      definicion: |-
        Acto formal donde el editor presenta su pieza en 6 minutos con estructura clara y lectura de fragmento.
      ejemplo: |-
        Cuentas la concepción, el proceso, las decisiones; lees 1-2 minutos del libro; muestras la portada y exhibes el ejemplar.
      emoji: "🎤"
    - termino: Lectura de fragmento
      definicion: |-
        1-2 minutos donde la audiencia escucha la voz del libro. Prueba de fuego: si suena a chatbot, el oficio editorial falló.
      ejemplo: |-
        Eliges el párrafo del que más orgulloso te sientes y lo lees en voz alta sin disculparte.
      emoji: "📖"
    - termino: Honestidad sobre uso de IA
      definicion: |-
        Declaración abierta sobre qué modelos usaste, qué porcentaje del texto generaste y qué porcentaje editaste o reescribiste a mano.
      ejemplo: |-
        "Usé Claude para los borradores. Generé ~70% del texto. Reescribí a mano ~35% del final."
      emoji: "🤝"
    - termino: Feria del libro escolar
      definicion: |-
        Práctica colectiva donde los libros se exhiben e intercambian. Cada estudiante actúa como autor y como lector.
      ejemplo: |-
        Pones tu libro sobre la mesa; los compañeros se acercan, leen fragmentos, comentan. Editores leyendo editores.
      emoji: "🏛️"
    - termino: Ciudadanía editorial
      definicion: |-
        Práctica de leer y comentar el trabajo de otros con respeto y criterio. Es la cultura que sostiene el oficio editorial.
      ejemplo: |-
        En la feria, comentas el libro de un compañero señalando lo que admiraste y proponiendo algo concreto que mejorarías.
      emoji: "👥"
  quiz:
    titulo: ¿Sustentas como editor profesional?
    instrucciones: 5 preguntas para verificar que cierras el periodo con honestidad y rigor.
    preguntas:
      - enunciado: ¿Cuántos minutos dura la sustentación del libro?
        opciones:
          - "1"
          - "6"
          - "30"
          - "60"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 6 minutos. Tiempo controlado obliga a destilar lo esencial.
        feedback_incorrecto: |-
          Son 6 minutos. Tiempo controlado fuerza la curaduría del mensaje.
      - enunciado: ¿Qué prueba si el oficio editorial funcionó o no?
        opciones:
          - El precio del libro
          - La lectura en voz alta del fragmento
          - La cantidad de páginas
          - El color de la portada
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La lectura en voz alta revela si el texto tiene voz humana o suena a chatbot.
        feedback_incorrecto: |-
          La lectura en voz alta. Revela si el libro suena a ti o si quedó genérico.
      - enunciado: ¿Qué actitud profesional pide la declaración de uso de IA?
        opciones:
          - Ocultarlo para parecer más auténtico
          - Declarar modelos, porcentaje generado y porcentaje reescrito a mano
          - No mencionarlo
          - Exagerar el uso humano
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La honestidad gana respeto profesional y construye la nueva cultura editorial.
        feedback_incorrecto: |-
          La honestidad sobre uso de IA es estándar profesional contemporáneo. Ocultarlo erosiona la cultura.
      - enunciado: ¿Qué papel cumples en la feria del libro escolar?
        opciones:
          - Solo de autor
          - Solo de lector
          - Ambos: autor y lector que comenta otros libros
          - Solo de moderador
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Cada estudiante es autor y lector. Esa doble práctica es la ciudadanía editorial.
        feedback_incorrecto: |-
          Eres autor y lector. La feria entrena en ciudadanía editorial: leer a otros con criterio y respeto.
      - enunciado: La regla "el libro no termina cuando se firma; termina cuando se comparte" significa que...
        opciones:
          - Hay que vender pronto
          - El libro alcanza sentido pleno al circular y ser leído por otros
          - El libro nunca termina
          - El libro debe quedar guardado
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El libro vive al circular. Sin lector, queda como archivo sin propósito cumplido.
        feedback_incorrecto: |-
          Significa que el libro alcanza sentido pleno al ser leído. Compartir cierra el ciclo editorial.

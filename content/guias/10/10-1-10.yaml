titulo: Mi libro --- entrega del PDF editorial y presentación autoral
producto_final: |-
  Libro terminado de mínimo 80 páginas compilado desde LaTeX en Overleaf (PDF descargado): portada diseñada con IA, índice, cuerpo de capítulos con tipografía editorial + declaración de autoría de 1 página + presentación oral de 5 minutos al grupo
saber_ancestral_idea: |-
  El día del mercado el artesano expone su pieza maestra: no la explica con disculpas, la muestra con orgullo y dice lo que costó hacerla. El libro de 80 páginas con diseño editorial es esa pieza maestra --- el primer libro que alguien de 15 años publica con nombre propio.

clave: 1-2
grado: 10
periodo: 1
sesion: 2
completo: true
titulo: Concebir tu libro --- género, tema, audiencia y escaleta
titulo_portada: |-
  Concebir tu libro ---
  género, tema,
  audiencia y escaleta
producto_final: |-
  Ficha editorial completa de tu libro con 5 campos obligatorios (género específico, tema con frase de 1-2 líneas, audiencia precisa con edad y contexto, propósito en 1 frase, escaleta inicial con 8-12 capítulos numerados y descripción de 2-3 líneas cada uno) + justificación de 5 líneas sobre por qué este libro merece ser escrito por ti en este momento de tu vida
apertura:
  saber_ancestral: |-
    En las noches de fogón del Pacífico colombiano y en los corredores de las casas de los abuelos del Valle, había una práctica silenciosa que cualquier nieto reconoce: \textbf{el cuentista nunca empezaba a hablar sin saber qué historia iba a contar}. Antes de la primera palabra, el cuentista tomaba 30 segundos de silencio y decidía tres cosas en su cabeza: (1) \textbf{Qué tipo de historia}: ¿una de susto?, ¿una de animales?, ¿una de aventura del pueblo?, ¿una para enseñar lección? La elección del \emph{género} determinaba todo lo demás. (2) \textbf{Para quién}: si los nietos eran chiquitos, el cuento era distinto que si eran adolescentes; si había abuelos sentados, otra cosa. La elección de la \emph{audiencia} ajustaba el tono. (3) \textbf{Para qué}: ¿quería entretener, asustar, enseñar, hacer reír, hacer pensar? El \emph{propósito} marcaba el cierre. Solo después de esas 3 decisiones invisibles, el cuentista abría la boca. Si saltaba esos 30 segundos, el cuento salía confuso, sin rumbo, sin gracia. La sabiduría era ancestral y precisa: \textbf{toda historia exige concepción previa, no improvisación}. Esa práctica del cuentista del fogón es exactamente la concepción editorial que tu libro de 80 páginas exige hoy.
  saber_contemporaneo: |-
    La \textbf{concepción editorial} es la etapa donde se toman las decisiones que sostendrán toda la producción del libro. Antes de pedir un solo prompt a la IA, el editor profesional cierra 4 piezas clave: (1) \textbf{Género específico}: no basta con \emph{``ficción''}; debe ser \emph{``novela juvenil de aventura''}, \emph{``manual práctico paso a paso''}, \emph{``libro de cuentos cortos de terror urbano''}, \emph{``divulgación científica narrativa''}. Cuanto más específico, mejor. (2) \textbf{Tema}: en 1-2 frases, qué pregunta o problema explora el libro. (3) \textbf{Audiencia}: edad concreta + contexto cultural + nivel de conocimiento previo (\emph{``estudiantes de bachillerato del Valle que ya juegan videojuegos pero no programan''}). (4) \textbf{Propósito}: qué quieres lograr con el lector (entretener, enseñar, generar conversación, denunciar). A esto se suma la \textbf{escaleta}: la lista preliminar de capítulos, cada uno con su tema y peso aproximado. La regla profesional famosa: \textbf{el libro empieza a escribirse en la escaleta, no en el capítulo 1}.
  pregunta_puente: |-
    ¿Qué sabía el cuentista del fogón en esos 30 segundos de silencio antes de hablar, que el novato olvida cuando le pide a ChatGPT \emph{``escríbeme un libro\''} sin haber decidido género, audiencia ni propósito? ¿Y por qué la escaleta de 10 capítulos vale más como punto de partida que un primer capítulo improvisado?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué género se ajusta mejor a la idea de libro que quieres hacer y por qué; (2) \textbf{analizar} a tu audiencia concreta con edad, contexto y conocimiento previo asumido; (3) \textbf{crear} la ficha editorial completa con los 5 campos + escaleta de 8-12 capítulos; (4) \textbf{evaluar} si tu libro tiene razón de ser ahora, justificando en 5 líneas honestas.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 aceptaste el rol de editor. Hoy haces la \textbf{concepción editorial} de tu libro: las decisiones que sostendrán las 8 sesiones siguientes (prompting, iteración, derechos, portada, diagramación, producción, sustentación). Sin escaleta clara hoy, las próximas sesiones serán improvisación.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lluvia personal}: anota 5 temas que te apasionan o te molestan o te dan curiosidad. Sin filtrar por viabilidad ni por idea de capítulo. La regla: solo cosas que te importen de verdad, no temas que crees que \emph{``deberían''} importar.
  a_sistematizacion: |-
    Ya tienes 5 temas. Ahora vas a entender la \textbf{anatomía de la concepción editorial}: cómo se elige el género, cómo se afina la audiencia, cómo se construye una escaleta, los 5 errores típicos del editor novato (tema demasiado amplio, audiencia genérica, propósito difuso, escaleta inflada, libro que nadie pidió).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: eliges 1 tema entre tus 5 candidatos, cierras las 4 decisiones (género, tema, audiencia, propósito), construyes la escaleta de 8-12 capítulos, justificas por qué este libro merece ser escrito.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: ficha editorial completa + escaleta + justificación. El criterio principal: que un compañero leyendo tu ficha pueda imaginar el libro completo y decir \emph{``sí, lo leería''} o \emph{``no me interesa''} con honestidad.
  a_evaluacion: |-
    Antes de cerrar, mira la concepción desde las cinco dimensiones humanas. Concebir con criterio antes de escribir es respeto por la audiencia que esperas; improvisar es desperdicio del periodo entero.
  a_triangulo: |-
    Y para terminar, tres voces sobre la decisión previa. Dussel sobre los libros que dan voz a quien no la tiene, Séneca sobre la sobriedad de elegir el tema correcto, Floridi sobre el libro como acto editorial responsable.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Lluvia personal de 5 temas} (15 min · individual). Anota 5 temas que de verdad te importan, te molestan o te dan curiosidad. Reglas: (1) temas reales tuyos, no los que crees que \emph{``deberían''} importarte. (2) pueden ser amplios (\emph{``la salud mental de los jóvenes''}) o específicos (\emph{``por qué los videojuegos cooperativos funcionan mejor que los competitivos''}). (3) sin censurarlos por dificultad. Ejemplos válidos: la presión académica en bachillerato, los juegos de rol como herramienta de aprendizaje, la cultura del fútbol callejero en mi barrio, la salud mental en la era de TikTok, mi familia migrante y lo que aprendí de ellos.
  checks:
  - Anoté 5 temas reales que me importan.
  - No filtré por viabilidad ni dificultad.
  - Reconozco que cada uno podría ser un libro distinto.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 5 temas personales». \textbf{Formato:} lista numerada de 5 + 1 línea sobre por qué cada uno te importa. \textbf{Sabes que terminaste cuando} sientes que cualquiera de los 5 podría ser tu libro.
sistematizacion:
  intro: |-
    Tienes 5 candidatos. Ahora necesitas la \textbf{anatomía profesional} de la concepción editorial: las 4 decisiones críticas, la estructura de la escaleta, los errores típicos.
  pilares:
  - |-
    Las \textbf{4 decisiones de concepción} se descomponen así: (1) \textbf{Género específico}: \emph{novela juvenil de fantasía}, \emph{manual práctico de hábitos}, \emph{libro de cuentos cortos urbanos}, \emph{divulgación narrativa de ciencia}, \emph{ensayo personal con datos}. Más específico = más fácil de escribir. (2) \textbf{Tema}: en 1-2 frases declarativas. Si necesitas un párrafo para explicar el tema, el tema no está claro. (3) \textbf{Audiencia}: edad concreta (\emph{``estudiantes de 14-17 años''}), contexto (\emph{``de bachillerato urbano colombiano''}), conocimiento previo (\emph{``ya juegan videojuegos pero no programan''}). (4) \textbf{Propósito}: qué te llevas el lector después de leer (\emph{``entender que la ansiedad es manejable''}, \emph{``saber cómo construir su primer micro-emprendimiento''}, \emph{``conocer la historia del barrio Aguablanca''}).
  - |-
    La \textbf{escaleta} es la lista preliminar de capítulos. Para un libro de 80 páginas la escaleta típica tiene \textbf{8-12 capítulos}, cada uno de 6-10 páginas. Su estructura mínima: (a) \textbf{Número de capítulo}. (b) \textbf{Título tentativo}: corto, descriptivo o intrigante según el género. (c) \textbf{Resumen de 2-3 líneas}: qué pasa o qué se explora en ese capítulo. (d) \textbf{Páginas estimadas}. La escaleta no es definitiva: en las próximas sesiones podrás ajustarla. Pero como punto de partida, obliga a pensar el libro completo antes de escribir cualquier capítulo.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿este libro merece existir ahora?}. Tu justificación de 5 líneas debe responder: (a) por qué te importa a ti escribirlo, (b) por qué le importaría a tu audiencia leerlo, (c) qué tiene este libro que no tienen los que ya existen sobre el tema. Si no encuentras respuesta a las 3, el libro probablemente no tiene razón de ser. La phronesis del editor consiste en \textbf{no escribir libros que el mundo no necesita}.
  - |-
    Algoritmo: (1) evalúa los 5 temas con 3 filtros (me importa, podría escribirlo en 8-12 capítulos, le interesaría a alguien que conozco). (2) elige 1 finalista. (3) define género específico. (4) escribe tema en 1-2 frases. (5) define audiencia con edad y contexto. (6) declara propósito. (7) construye escaleta de 8-12 capítulos. (8) escribe justificación de 5 líneas.
  anatomia:
    titulo: Anatomía de la concepción editorial
    body: |-
      \textbf{Género:} específico, no \emph{``ficción''}. \\[1mm] \textbf{Tema:} 1-2 frases claras. \\[1mm] \textbf{Audiencia:} edad + contexto + nivel previo. \\[1mm] \textbf{Propósito:} qué se lleva el lector. \\[1mm] \textbf{Escaleta:} 8-12 capítulos con resumen. \\[1mm] \textbf{Justificación:} por qué ahora, por qué tú.
  errores_comunes: |-
    (1) \textbf{Tema demasiado amplio}: \emph{``la vida''} no se puede escribir en 80 páginas. (2) \textbf{Audiencia genérica}: \emph{``para todos''} significa \emph{``para nadie''}. (3) \textbf{Propósito difuso}: \emph{``compartir mis ideas''} no es propósito; es ego. (4) \textbf{Escaleta inflada}: 20 capítulos en 80 páginas dan 4 páginas cada uno, demasiado fragmentado. (5) \textbf{Libro que nadie pidió}: repetir un manual de hábitos que ya existe en 100 versiones.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía concepción». \textbf{Formato:} (a) las 4 decisiones; (b) estructura de la escaleta; (c) los 5 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías auditar la concepción de cualquier libro real.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Ficha editorial completa + escaleta + justificación} (35 min · individual). Hora de aplicar. Eliges tu tema, cierras las 4 decisiones, construyes la escaleta, justificas por qué este libro merece existir.
  pilares:
  - |-
    Tu ficha editorial se construye en 6 piezas: (1) \textbf{Género específico} con 3-5 palabras. (2) \textbf{Tema} en 1-2 frases declarativas. (3) \textbf{Audiencia} con edad + contexto + conocimiento previo. (4) \textbf{Propósito} en 1 frase con verbo de cambio (\emph{``entender''}, \emph{``aprender''}, \emph{``decidir''}, \emph{``reconsiderar''}). (5) \textbf{Escaleta} de 8-12 capítulos con título tentativo, resumen 2-3 líneas, páginas estimadas. (6) \textbf{Justificación} de 5 líneas con 3 ingredientes (por qué a ti, por qué a la audiencia, por qué distinto a lo que existe).
  - |-
    Sigue el patrón \textbf{``escaleta como mapa, no como cárcel''}: la escaleta es plan de partida, no compromiso definitivo. En las sesiones siguientes podrás ajustar capítulos: agregar, quitar, fusionar, reordenar. Pero hoy necesitas un mapa claro para empezar a generar borradores con IA en la sesión 3.
  - |-
    La justificación es la pieza más honesta: aquí te enfrentas a la pregunta \emph{¿por qué yo y por qué ahora?}. Ejemplos válidos: \emph{``Quiero contar lo que aprendí en 2 años cuidando a mi abuela con Alzheimer porque hay muchos jóvenes en esa situación y nadie les habla a nosotros''}. Ejemplo débil: \emph{``Me gusta escribir y pensé en hacer un libro''}.
  - |-
    Algoritmo: (1) elegir tema entre los 5. (2) declarar género específico. (3) afinar tema y audiencia. (4) declarar propósito. (5) escribir escaleta de 8-12 capítulos. (6) justificación honesta. (7) leer en voz alta toda la ficha: ¿suena clara?, ¿es defendible?
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Género específico declarado (no \emph{ficción} solo). \\[1mm] \checkbox Tema en 1-2 frases claras. \\[1mm] \checkbox Audiencia con edad y contexto. \\[1mm] \checkbox Propósito con verbo de cambio. \\[1mm] \checkbox Escaleta de 8-12 capítulos con resumen y páginas. \\[1mm] \checkbox Justificación de 5 líneas con 3 ingredientes. \\[1mm] \checkbox Ficha leída en voz alta para verificar coherencia.
  plantilla_guion: |-
    \textbf{Género.} \textit{Específico en 3-5 palabras.} \\[1mm] \textbf{Tema.} \textit{1-2 frases declarativas.} \\[1mm] \textbf{Audiencia.} \textit{Edad + contexto + nivel previo.} \\[1mm] \textbf{Propósito.} \textit{Verbo de cambio en 1 frase.} \\[1mm] \textbf{Escaleta.} \textit{8-12 capítulos con título + resumen + páginas.} \\[1mm] \textbf{Justificación.} \textit{Por qué tú, por qué la audiencia, por qué distinto.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Ficha editorial de mi libro». \textbf{Formato:} ficha completa con los 6 campos. \textbf{Extensión:} 2-3 páginas. \textbf{Sabes que terminaste cuando} podrías mostrar la ficha a un familiar y entendería qué libro vas a hacer.
  producto_titulo: Ficha editorial completa + escaleta 8-12 capítulos + justificación
  criterios:
  - Género específico (no genérico)
  - Tema en 1-2 frases declarativas
  - Audiencia precisa con edad y contexto
  - Propósito con verbo de cambio
  - Escaleta de 8-12 capítulos con resumen y páginas
  - Justificación con los 3 ingredientes
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un libro que da voz a quien no la tiene es liberador; uno que repite voces ya amplificadas reproduce el centro hegemónico.
    aplicacion: |-
      Tu elección de tema puede tener dos rumbos: (a) seguir la inercia del contenido que ya circula (otra novela juvenil distópica, otro manual de productividad genérico), o (b) abrir espacio a una voz, contexto o pregunta que no tiene libro propio. La filosofía de la liberación pide lo segundo. Pregunta concreta: ¿este libro le daría voz a alguien o algo que la cultura mainstream no ve?
    pregunta_espejo: |-
      ¿Mi libro amplifica una voz que falta, o repite contenido que ya está saturado en redes y librerías?
  estoico:
    autor: Séneca
    cita: |-
      Elegir bien el tema es virtud editorial; intentar abarcar todo es debilidad disfrazada de ambición.
    aplicacion: |-
      Es tentador elegir un tema enorme (\emph{``la juventud colombiana hoy''}) creyendo que más grande es más importante. La sabiduría estoica recomienda lo opuesto: \emph{elige específico, profundiza}. Un libro pequeño bien hecho vale más que uno grande mal hecho. La phronesis editorial consiste en \textbf{aceptar el tamaño del oficio que puedes asumir en 8-12 capítulos}.
    pregunta_espejo: |-
      ¿Mi tema es del tamaño que puedo profundizar en 80 páginas, o estoy intentando abarcar más de lo que puedo sostener?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Concebir un libro con propósito declarado es acto editorial ético en la era de la producción acelerada de contenido.
    aplicacion: |-
      En la era de la IA generativa, miles de libros se producen automáticamente con propósito vago o sin propósito. La ética editorial contemporánea pide concebir con propósito explícito: \textbf{este libro existe para que el lector aprenda, sienta o decida algo concreto}. Sin propósito declarado, el libro contribuye al ruido informacional; con propósito, agrega valor.
    pregunta_espejo: |-
      ¿Mi libro tiene propósito declarado que justifica su existencia, o solo va a sumar páginas al exceso ya existente?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu ficha editorial completa y la escaleta de 8-12 capítulos. En la sesión 3 vas a aprender a hacer \textbf{prompts profesionales} para generar primeros borradores con IA. La concepción de hoy es el plano; los prompts de mañana son las primeras palabras.
web:
  conceptos_clave:
    - termino: Género específico
      definicion: |-
        Categoría narrativa precisa. No "ficción", sino "novela juvenil de aventura" o "manual práctico paso a paso". Cuanto más específico, mejor.
      ejemplo: |-
        "Libro de cuentos cortos de terror urbano" guía toda la producción: tono, estructura, audiencia, ritmo.
      emoji: "📚"
    - termino: Tema
      definicion: |-
        Pregunta o problema central del libro, formulado en 1-2 frases. Da unidad a toda la obra.
      ejemplo: |-
        "El libro explora cómo los jóvenes del Valle hacen amistades profundas en la era de los celulares."
      emoji: "❓"
    - termino: Audiencia
      definicion: |-
        Edad concreta + contexto cultural + nivel de conocimiento previo del lector ideal. Define el tono y los ejemplos.
      ejemplo: |-
        "Estudiantes de bachillerato del Valle que juegan videojuegos pero no programan."
      emoji: "🎯"
    - termino: Propósito
      definicion: |-
        Qué quieres lograr con el lector: entretener, enseñar, generar conversación, denunciar. Sin propósito, el libro es ruido.
      ejemplo: |-
        "Quiero que el lector se ría y, al final, llame al amigo que lleva tiempo sin ver." Propósito claro.
      emoji: "🎬"
    - termino: Escaleta
      definicion: |-
        Lista preliminar de capítulos con tema y peso aproximado de cada uno. El libro empieza a escribirse aquí.
      ejemplo: |-
        Cap. 1 (10 págs.) "El primer chat", Cap. 2 (8 págs.) "La distancia que no se ve"... Mapa antes de escribir.
      emoji: "🗺️"
  quiz:
    titulo: ¿Concebiste tu libro como editor profesional?
    instrucciones: 5 preguntas para verificar que cerraste las 4 piezas clave.
    preguntas:
      - enunciado: ¿Cuáles son las 4 piezas obligatorias de la concepción editorial?
        opciones:
          - Título, autor, fecha, precio
          - Solo el género
          - Género específico, tema, audiencia y propósito
          - Solo el título
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Género específico, tema, audiencia y propósito. Sin las 4 cerradas, la producción se desordena.
        feedback_incorrecto: |-
          Son género específico, tema, audiencia y propósito. Las 4 sostienen toda la producción posterior.
      - enunciado: "¿Cuál de estas formulaciones de género es la más profesional?"
        opciones:
          - Manual práctico paso a paso de cocina vallecaucana para jóvenes
          - Ficción
          - Cosas
          - Libro de letras
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Cuanto más específico el género, mejor guía la producción.
        feedback_incorrecto: |-
          La más específica es la profesional. "Ficción" es demasiado amplio para guiar decisiones.
      - enunciado: ¿Qué pieza falta si solo defines "audiencia adolescente"?
        opciones:
          - Nada, está completo
          - Solo el precio
          - Solo el título
          - Edad concreta + contexto cultural + nivel de conocimiento previo
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. La audiencia profesional incluye edad concreta, contexto y conocimiento previo. "Adolescente" es vago.
        feedback_incorrecto: |-
          Falta edad concreta, contexto cultural y nivel previo. Sin esos detalles, el tono y los ejemplos son ciegos.
      - enunciado: La regla "el libro empieza a escribirse en la escaleta" significa que...
        opciones:
          - Hay que escribir muy rápido
          - Las decisiones estructurales se toman antes de escribir el capítulo 1
          - La escaleta es opcional
          - El libro se escribe en orden alfabético
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La escaleta define peso, orden y función de cada capítulo antes de poner una palabra.
        feedback_incorrecto: |-
          Significa que las decisiones estructurales se toman antes de redactar. Sin escaleta, el libro se construye al azar.
      - enunciado: ¿Cuántos capítulos suele tener un libro de 80 páginas?
        opciones:
          - "1"
          - "8-12"
          - "100"
          - "1000"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 8-12 capítulos para 80 páginas, cada uno con peso asignado según su función en el arco.
        feedback_incorrecto: |-
          Son 8-12 capítulos. Más fragmenta sin razón; menos hace capítulos demasiado largos.

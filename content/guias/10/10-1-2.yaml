    - La escaleta tiene entre ocho y doce capítulos, cada uno con resumen.
    - La justificación responde por qué tú, por qué ellos y por qué distinto.
  conceptos_clave:
  - categoria: Las cuatro decisiones
    termino: Género específico
    definicion: |-
      La forma concreta del libro, nombrada con precisión. «Ficción» no es un género: es una categoría.
    ejemplo: |-
      «Novela juvenil de aventura» o «manual práctico paso a paso» sí orientan cada decisión posterior.
  - categoria: Las cuatro decisiones
    termino: Tema
    definicion: |-
      Qué pregunta o problema explora el libro, dicho en una o dos frases declarativas.
    ejemplo: |-
      «Por qué los videojuegos cooperativos enganchan distinto que los competitivos.»
  - categoria: Las cuatro decisiones
    termino: Audiencia
    definicion: |-
      Edad concreta, contexto y conocimiento previo que se le supone a quien va a leer.
    ejemplo: |-
      «Estudiantes de bachillerato del Valle que ya juegan pero nunca han programado.»
  - categoria: Las cuatro decisiones
    termino: Propósito
    definicion: |-
      Qué se lleva quien lee, dicho con un verbo de cambio. No es «compartir mis ideas».
    ejemplo: |-
      «Que entienda por qué su barrio se llama como se llama y quién decidió ese nombre.»
  - categoria: El mapa del libro
    termino: Escaleta
    definicion: |-
      La lista preliminar de capítulos con título y resumen de cada uno. Es mapa de partida, no compromiso definitivo.
    ejemplo: |-
      Diez capítulos de ocho páginas, cada uno con dos o tres líneas de qué pasa dentro.
  - categoria: El mapa del libro
    termino: Justificación
    definicion: |-
      Las cinco líneas que responden por qué tú, por qué le importaría a tu audiencia y qué tiene de distinto.
    ejemplo: |-
      Si las tres respuestas no aparecen, conviene cambiar de tema hoy y no en la sesión 6.
  cinco_dimensiones:
    personal: |-
      Elegir un tema entre cinco obliga a saber qué te importa de verdad. Es una pregunta que pocas veces se hace en voz alta.
    emocional: |-
      Descartar cuatro temas que también te gustaban cuesta. Concebir es sobre todo renunciar a los libros que no vas a escribir.
    ciudadana: |-
      Definir para quién escribes es reconocer que hay alguien al otro lado. Un libro «para todos» suele estar escrito para nadie.
    local: |-
      El decimero declara su copla antes de empezar, y cada décima cierra volviendo a uno de esos versos. La forma se decide primero.
    intergeneracional: |-
      En la décima la autoría no es fija: cada quien añade o cambia. Tu escaleta también va a pasar por otras manos antes de ser libro.
  post_lectura:
    transferencia: |-
      Llega a la próxima sesión con la ficha completa y la escaleta de ocho a doce capítulos. Sin ellas, los prompts de la sesión 3 no tienen a qué agarrarse.
  quiz:
    titulo: Verifica la concepción editorial
    instrucciones: 5 preguntas para confirmar que puedes concebir un libro antes de escribirlo. Necesitas 3/5 para continuar.
    preguntas:
    - enunciado: ¿Cuál de estas formulaciones de género es la más útil para trabajar?
      opciones:
      - Ficción, que ya delimita bastante frente a los libros de no ficción existentes
      - Novela juvenil de aventura ambientada en el Pacífico colombiano
      - Un libro entretenido con personajes que la gente joven pueda sentir cercanos
      - Literatura, entendida como el conjunto de obras escritas con intención estética
      respuesta_index: 1
      feedback_correcto: |-
        Correcto. Cuanto más específico el género, más decisiones quedan resueltas de antemano.
      feedback_incorrecto: |-
        «Ficción» y «literatura» son categorías, no géneros. Un género dice qué forma tiene el libro.
    - enunciado: Defines tu audiencia como «adolescentes». ¿Qué le falta a esa definición?
      opciones:
      - Nada en particular, porque adolescentes ya acota bastante el rango de edad
      - Falta decir en qué país viven, que es lo único que cambia entre unos y otros
      - Falta el contexto y el conocimiento previo que se le supone a quien lee
      - Falta indicar cuántos lectores se espera alcanzar con la publicación del libro
      respuesta_index: 2
      feedback_correcto: |-
        Exacto. Un adolescente que ya programa y uno que nunca abrió un editor necesitan dos libros distintos.
      feedback_incorrecto: |-
        No es cuestión de país ni de cantidad. Falta qué contexto tiene y qué sabe ya quien va a leer.
    - enunciado: ¿Cuántos capítulos suele tener la escaleta de un libro de ochenta páginas?
      opciones:
      - Entre veinte y treinta, para que cada capítulo se lea rápido y de una sentada
      - Entre tres y cuatro, para desarrollar cada idea con toda la profundidad posible
      - Los que hagan falta, porque el número depende únicamente del tema que se trate
      - Entre ocho y doce, lo que deja entre seis y diez páginas para cada uno
      respuesta_index: 3
      feedback_correcto: |-
        Sí. Veinte capítulos en ochenta páginas dejan cuatro cada uno, y todo queda fragmentado.
      feedback_incorrecto: |-
        La cuenta es sencilla: ochenta páginas entre ocho y doce capítulos da un tamaño que se puede desarrollar.

clave: 1-2
grado: 10
periodo: 1
sesion: 2
completo: true
duracion_min: 90
titulo: Concebir tu libro --- género, tema, audiencia y escaleta
titulo_portada: |-
  Concebir tu libro ---
  género, tema, audiencia
  y escaleta
producto_final: Ficha editorial con género específico, tema, audiencia precisa y propósito, más una escaleta de 8 a 12 capítulos y una justificación de 5 líneas
apertura:
  saber_ancestral: |-
    Los decimeros del Pacífico, en Guapi y en el río Saija, componen décimas glosadas. La forma está decidida antes de la primera palabra. Se declara primero una copla de cuatro versos. Después vienen cuatro décimas, y cada una termina en el verso que le corresponde de esa copla. Son cuarenta y cuatro versos en total. Lo que se va a decir queda anunciado al comienzo, y cada parte cierra regresando a él. La autoría tampoco es fija: cada quien añade o cambia. Y no es folclor. Ulrich Oslender las estudia como discursos ocultos de resistencia de comunidades negras que disputan el reconocimiento de su territorio (Oslender, 2003). La \textbf{cara de exclusión} está en quién sostiene esa memoria, porque la tradición depende de mayores cada vez menos escuchados.
  origen: Decimeros del Pacífico · la copla que se declara antes de las cuatro décimas
  fuente: |-
    Oslender, U. (2003). «Discursos ocultos de resistencia»: tradición oral y cultura política en comunidades negras de la costa pacífica colombiana. \emph{Revista Colombiana de Antropología, 39}, 203--236.
  saber_contemporaneo: |-
    La \textbf{concepción editorial} es la etapa donde se toman las decisiones que sostienen toda la producción del libro. Antes de pedirle un solo prompt a la IA, se cierran cuatro piezas. El \textbf{género específico}: no basta «ficción», hace falta «novela juvenil de aventura» o «manual práctico paso a paso». El \textbf{tema}: en una o dos frases, qué pregunta explora el libro. La \textbf{audiencia}: edad concreta, contexto y conocimiento previo que se supone. Y el \textbf{propósito}: qué se lleva quien lo lea. A eso se suma la \textbf{escaleta}, la lista preliminar de capítulos con lo que va en cada uno. Sin escaleta, la IA genera capítulos que no conversan entre sí.
  pregunta_puente: |-
    ¿Por qué un decimero declara los cuatro versos antes de empezar, si podría improvisar sin anunciarlos? ¿Y qué pierde quien le pide un libro a una IA sin haber decidido género, audiencia ni propósito?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} entre varios temas propios cuál sostiene un libro de ocho a doce capítulos; (2) \textbf{analizar} tu audiencia concreta con edad, contexto y conocimiento previo, y el género que le corresponde; (3) \textbf{crear} la ficha editorial completa con escaleta y una justificación honesta de por qué este libro merece existir.
puentes:
  a_ruta: |-
    En la sesión 1 aceptaste el rol de editor. Hoy haces la concepción de tu libro: las decisiones que van a sostener las ocho sesiones siguientes. Todo lo que venga después se apoya en lo que decidas hoy.
  a_escuta: |-
    Antes de teorizar, vas a hacer una lluvia personal. Cinco temas que te importen, te molesten o te den curiosidad, sin filtrarlos por viabilidad. Solo cosas que te importen de verdad.
  a_sistematizacion: |-
    Ya tienes cinco temas. Ahora vas a entender la \textbf{anatomía de la concepción}: cómo se elige el género, cómo se afina la audiencia, cómo se construye una escaleta y qué errores comete el editor novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo. Eliges un tema entre los cinco, cierras las cuatro decisiones, construyes la escaleta y justificas por qué este libro merece escribirse.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: la ficha editorial, la escaleta y la justificación. El criterio principal es que un compañero que lea tu ficha pueda imaginar el libro completo y decir si lo leería.
  a_evaluacion: |-
    Antes de cerrar, mira la concepción desde las cinco dimensiones humanas. Decidir antes de escribir es respeto por quien va a leer. Improvisar desperdicia el periodo entero.
  a_triangulo: |-
    Y para terminar, tres voces sobre decidir antes de hablar. Dussel sobre el registro y el destinatario, Séneca sobre lo mucho que no nutre, Floridi sobre en qué proyecto estamos trabajando.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Cinco temas propios} (15 min · individual). (1) Anota cinco temas que de verdad te importen, te molesten o te den curiosidad. (2) Que sean tuyos, no los que crees que deberían importarte. (3) Pueden ser amplios o específicos, da igual por ahora. (4) No los censures por difíciles. (5) Escribe al lado de cada uno una línea sobre por qué te importa a ti.
  checks:
  - |-
    Anoté cinco temas reales míos, no los que quedan bien.
  - |-
    No filtré ninguno por difícil o por poco viable.
  - |-
    Escribí en una línea por qué me importa cada uno.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Cinco temas propios». \textbf{Formato:} lista numerada de cinco, con una línea por tema sobre por qué te importa. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} sientes que cualquiera de los cinco podría ser tu libro.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · ANALIZA --- Anatomía de la concepción} (20 min · parejas). (1) Con tu pareja, escriban las cuatro decisiones de concepción con un ejemplo de cada una. (2) Escriban la estructura mínima de una entrada de escaleta. (3) Escriban los cinco errores del editor novato. (4) Cada uno pasa sus cinco temas por los tres filtros y le explica al otro cuál queda de finalista.
  pilares:
  - |-
    Las cuatro decisiones se descomponen así. El \textbf{género} tiene que ser específico: novela juvenil de fantasía, manual práctico de hábitos, cuentos cortos urbanos, divulgación narrativa. El \textbf{tema} cabe en una o dos frases declarativas. La \textbf{audiencia} lleva edad, contexto y nivel previo. El \textbf{propósito} dice qué se lleva quien lee. Cuanto más específico el género, más fácil todo lo demás.
  - |-
    La \textbf{escaleta} es la lista preliminar de capítulos. Para un libro de ochenta páginas suelen ser entre ocho y doce, de seis a diez páginas cada uno. Cada entrada lleva número, título tentativo y un resumen de dos o tres líneas de lo que pasa o se explica ahí. La escaleta es el mapa que impide que la IA genere capítulos que no conversan entre sí.
  - |-
    Todo se juega en una pregunta: ¿este libro merece existir ahora? La justificación tiene que responder tres cosas. Por qué te importa a ti escribirlo. Por qué le importaría a tu audiencia leerlo. Y qué tiene este libro que no tengan los que ya existen sobre el tema. Si no encuentras las tres, conviene cambiar de tema hoy y no en la sesión 6.
  - |-
    Algoritmo: (1) pasa los cinco temas por tres filtros: me importa, cabe en ocho a doce capítulos, le interesaría a alguien que conozco; (2) elige un finalista; (3) declara el género específico; (4) escribe el tema en dos frases; (5) define la audiencia; (6) declara el propósito; (7) construye la escaleta; (8) escribe la justificación.
  anatomia:
    titulo: Anatomía de la concepción editorial
    body: |-
      \textbf{Género:} específico, no «ficción» a secas. \\[1mm] \textbf{Tema:} una o dos frases claras. \\[1mm] \textbf{Audiencia:} edad, contexto y nivel previo. \\[1mm] \textbf{Propósito:} qué se lleva quien lee. \\[1mm] \textbf{Escaleta:} de 8 a 12 capítulos con título y resumen. \\[1mm] \textbf{Justificación:} por qué tú, por qué ellos, por qué distinto.
  errores_comunes: |-
    (1) Tema demasiado amplio: «la vida» no cabe en ochenta páginas. (2) Audiencia genérica: «para todos» significa para nadie. (3) Propósito difuso: «compartir mis ideas» no es un propósito. (4) Escaleta inflada: veinte capítulos en ochenta páginas dejan cuatro páginas cada uno y todo queda fragmentado. (5) Un libro que nadie pidió: repetir un manual que ya existe, sin nada propio.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} \textbf{Título:} «Actividad 2 --- Anatomía de la concepción». \textbf{Formato:} las cuatro decisiones con ejemplo, la estructura de una entrada de escaleta, los cinco errores con el que más temes marcado y el tema finalista. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} podrías auditar la concepción de cualquier libro real.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Mi ficha editorial} (35 min · individual). (1) Declara el género específico en tres a cinco palabras. (2) Escribe el tema en una o dos frases declarativas. (3) Define la audiencia con edad, contexto y conocimiento previo. (4) Declara el propósito en una frase con un verbo de cambio. (5) Construye la escaleta de ocho a doce capítulos, cada uno con título y resumen de dos o tres líneas. (6) Escribe la justificación de cinco líneas y lee toda la ficha en voz alta.
  pilares:
  - |-
    Tu ficha se construye en seis piezas: género específico, tema en dos frases, audiencia con edad y contexto, propósito con verbo de cambio, escaleta de ocho a doce capítulos y justificación de cinco líneas. Si falta una, la sesión 3 arranca a ciegas.
  - |-
    Sigue el patrón «escaleta como mapa, no como cárcel». Es un plan de partida, no un compromiso definitivo. En las sesiones siguientes vas a poder agregar, quitar, fusionar y reordenar capítulos. Pero hoy hace falta un mapa para empezar a generar borradores.
  - |-
    La justificación es la pieza más honesta de la ficha. Aquí te enfrentas a por qué tú y por qué ahora. «Quiero contar lo que aprendí cuidando a mi abuela porque hay muchos jóvenes en esa situación y nadie les habla» funciona. «Me gusta el tema» no funciona, porque no dice nada de quien va a leer.
  - |-
    Algoritmo: (1) elige el tema finalista; (2) declara el género; (3) afina tema y audiencia; (4) declara el propósito; (5) escribe la escaleta completa; (6) escribe la justificación; (7) lee la ficha en voz alta y comprueba que se entiende sin que tú la expliques.
  checklist:
    titulo: Checklist antes de entregar la ficha
    items: |-
      \checkbox Género específico, no «ficción» a secas. \\[1mm] \checkbox Tema en una o dos frases declarativas. \\[1mm] \checkbox Audiencia con edad y contexto, no «para todos». \\[1mm] \checkbox Propósito con verbo de cambio. \\[1mm] \checkbox Escaleta de 8 a 12 capítulos, cada uno con resumen. \\[1mm] \checkbox Justificación con los tres ingredientes.
  plantilla_guion: |-
    \textbf{Género.} \textit{Específico, en tres a cinco palabras.} \\[1mm] \textbf{Tema.} \textit{Una o dos frases declarativas.} \\[1mm] \textbf{Audiencia.} \textit{Edad, contexto y nivel previo.} \\[1mm] \textbf{Propósito.} \textit{Un verbo de cambio en una frase.} \\[1mm] \textbf{Escaleta.} \textit{De 8 a 12 capítulos con título y resumen.} \\[1mm] \textbf{Justificación.} \textit{Por qué tú, por qué ellos, por qué distinto.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Ficha editorial de mi libro». \textbf{Formato:} la ficha con sus seis campos y la escaleta completa. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} podrías mostrarle la ficha a alguien de tu casa y entendería qué libro vas a hacer.
  producto_titulo: Ficha editorial con los cuatro campos, escaleta de 8 a 12 capítulos y justificación
  criterios:
  - Género específico y no genérico
  - Tema en una o dos frases declarativas
  - Audiencia precisa, con edad y contexto
  - Propósito con verbo de cambio
  - Escaleta de 8 a 12 capítulos, cada uno con su resumen
  - Justificación que responde por qué tú, por qué ellos y por qué distinto
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.2.4.4
    cita: |-
      Hay lengua cotidiana (la de todos los días), lengua de culturas ilustradas, de cultura de masas, lengua de cultura popular… lengua política (que se comprende no por lo que dice sino por lo que calla, contra quién lo dice, cuándo y por qué…).
    aplicacion: |-
      No hay una sola manera de escribir bien: hay registros, y cada uno le habla a alguien. Por eso «para todos» significa para nadie. Cuando defines la edad, el contexto y lo que ya sabe quien va a leer, estás eligiendo un registro. Y esa elección va a decidir cada frase del libro.
    pregunta_espejo: |-
      Si le leyera un capítulo a la persona que dije que era mi audiencia, ¿sonaría escrito para ella?
  estoico:
    autor: Séneca · Cartas a Lucilio, 2 (c. 64 d.C.)
    cita: |-
      Empalagarse con muchas cosas es lo propio de los estómagos hastiados. Lo mucho y lo muy diverso, no nutre: contamina.
    aplicacion: |-
      Tienes cinco temas y vas a escribir uno. Meter los cinco en el mismo libro es la tentación, y es la manera más segura de que ninguno quede dicho. El decimero declara cuatro versos, no cuarenta. La forma existe para obligar a elegir.
    pregunta_espejo: |-
      De los cinco temas, ¿elegí uno de verdad o metí pedazos de los otros cuatro en la escaleta?
  floridi:
    autor: Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 3.1
    cita: |-
      Una de las preguntas políticas apremiantes que enfrentamos en las sociedades de la información avanzadas es: ¿en qué clase de proyecto humano estamos trabajando? (trad. propia)
    aplicacion: |-
      La justificación de cinco líneas es tu versión pequeña de esa pregunta. Producir texto ya no cuesta nada, así que la pregunta dejó de ser si puedes hacer un libro. La pregunta es para qué vas a sumar uno más, y a quién le hace falta.
    pregunta_espejo: |-
      Si este libro no existiera, ¿qué se perdería, y quién lo notaría?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la ficha editorial completa y la escaleta de ocho a doce capítulos. En la sesión 3 vas a aprender a escribir prompts profesionales para generar los primeros borradores. La concepción de hoy es el plano de todo eso.
web:
  resumen: |-
    Cierras las cuatro decisiones que sostienen el libro --- género, tema, audiencia y propósito --- y construyes la escaleta de capítulos antes de pedirle un solo borrador a la IA.
  subtema: Oficio editorial · Concepción y escaleta
  pre_lectura:
    por_que_importa: |-
      Sin género, audiencia y propósito decididos, la IA produce capítulos que no conversan entre sí. La escaleta es lo que convierte diez textos sueltos en un libro.
    pregunta_detonante: |-
      Si tuvieras que decir en dos frases de qué trata tu libro y para quién es, ¿podrías hacerlo hoy?
    activacion:
      titulo: Cuatro versos antes de empezar
      descripcion: |-
        En 3 minutos, escribe en una sola frase de qué trataría tu libro. Después táchala y escríbela otra vez más corta. La segunda suele ser la buena.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 1 aceptaste el rol de editor y declaraste tres decisiones preliminares.
      siguiente: |-
        En la sesión 3 conviertes esa escaleta en prompts profesionales para los primeros borradores.

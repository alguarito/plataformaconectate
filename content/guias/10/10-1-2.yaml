clave: 1-2
grado: 10
periodo: 1
sesion: 2
completo: true
titulo: Del tema al proyecto editorial --- audiencia, propósito e índice tentativo
titulo_portada: |-
  Del tema al
  proyecto
  editorial
producto_final: Ficha de proyecto del libro (título tentativo, audiencia, propósito, frase de posicionamiento) + índice tentativo de 8–12 capítulos con título y subtema de cada uno

apertura:
  saber_ancestral: |-
    El carpintero del Valle del Cauca no clavaba un solo puntillo sin tener el plano completo en la cabeza. Sabía cuántas piezas, en qué orden, para qué función. El mueble que empieza sin plano termina con patas chuecas y cajones que no cierran. En los oficios tradicionales de la región --- la cerámica de La Chamba, la cestería del Pacífico, los sombreros de iraca del Cauca --- ningún maestro iniciaba la pieza sin tener clara su forma final. El plan no mata la creatividad: la encausa.
  saber_contemporaneo: |-
    Un libro sin estructura es un documento largo. La diferencia entre un libro que se lee hasta el final y uno que se abandona en el capítulo 2 no es el tema --- es la arquitectura. Los lectores del siglo XXI tienen atención corta y opciones infinitas: si el libro no sabe adónde va, el lector lo sabe antes que el autor y se va. El índice tentativo es la primera promesa que el libro le hace al lector.
  pregunta_puente: |-
    ¿Alguna vez dejaste de leer un libro a la mitad? ¿Recuerdas por qué? ¿Fue el tema o la forma en que estaba organizado? ¿Qué diferencia haría para tu propio libro saber eso antes de empezar a escribir?
  saber_hacer: |-
    Al terminar esta guía podrás: (1) \textbf{identificar} con precisión quién es el lector ideal de tu libro y qué necesita; (2) \textbf{analizar} el propósito del libro --- qué cambia en el lector después de leerlo; (3) \textbf{crear} la ficha de proyecto editorial y el índice tentativo de 8--12 capítulos; (4) \textbf{explicar} la lógica de la secuencia de capítulos: por qué ese orden y no otro.

puentes:
  a_ruta: |-
    En G01 elegiste tu tema y escribiste el pitch. Hoy construyes la arquitectura completa del libro: quién lo leerá, para qué existe y qué capítulos lo forman. Al final de esta sesión tendrás el mapa que te guiará durante las ocho sesiones de escritura que vienen.
  a_escuta: |-
    Antes de diseñar el libro, hay que saber para quién se diseña. Un libro escrito para ``todo el mundo'' no le habla a nadie. La primera actividad de hoy es definir al lector ideal --- no una categoría, sino una persona concreta con una situación concreta.
  a_sistematizacion: |-
    Ya sabes para quién escribes. Ahora viene la pregunta más difícil: ¿para qué? No basta con ``quiero compartir lo que sé''. El propósito del libro define qué capítulos son necesarios y cuáles sobran. Vamos a analizarlo con los pilares del pensamiento computacional.
  a_praxis: |-
    Tienes el lector y el propósito. Ahora toca construir la estructura: la ficha del proyecto y el índice tentativo. El índice es el contrato entre tú y el lector --- lo que prometes desarrollar. Hoy lo escribes por primera vez; en G09 lo revisarás cuando el libro esté terminado.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy. Léelo antes de cerrar el cuaderno.
  a_evaluacion: |-
    Antes de cerrar, cinco dimensiones para mirar las decisiones editoriales que tomaste hoy.
  a_triangulo: |-
    Tres voces para pensar el libro no solo como texto sino como proyecto que existe para alguien.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El lector ideal de mi libro} (15 min · individual). Cierra los ojos un momento y piensa: ¿quién debería leer tu libro? No ``estudiantes'' ni ``jóvenes'' ni ``personas interesadas'' --- alguien específico. Puede ser alguien que conoces o alguien que imaginaste. Abre el cuaderno y descríbelo: edad aproximada, situación de vida, qué problema tiene o qué quiere lograr, y por qué tu libro le sirve a esa persona más que a cualquier otra.
  checks:
    - Describí al lector ideal con al menos 4 características concretas, no con categorías generales.
    - La descripción del lector nombra un problema o deseo específico que mi libro puede atender.
    - Puedo explicar por qué mi libro le sirve a ESA persona más que a cualquier otra.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mi lector ideal». \textbf{Formato:} párrafo de 6--8 renglones describiendo al lector ideal (edad aproximada, situación de vida, qué problema tiene o qué quiere lograr, por qué mi libro le sirve). \textbf{Sabes que terminaste cuando} la descripción es tan concreta que podrías reconocer a esa persona si la encontraras en el colegio o en el barrio.

sistematizacion:
  intro: |-
    Saber para quién escribes es la mitad. La otra mitad es saber \emph{para qué}. El propósito no es ``compartir información'' --- eso lo hace Google. El propósito de un libro es producir un cambio en el lector: que sepa algo que antes no sabía, que pueda hacer algo que antes no podía, que sienta algo que necesitaba sentir. Vamos a precisarlo con los pilares del pensamiento computacional.
  pilares:
    - |-
      \textbf{Descomposición:} descomponer el propósito en tres preguntas: ¿qué \emph{sabrá} el lector que antes no sabía?, ¿qué \emph{podrá hacer} que antes no podía?, ¿qué \emph{sentirá} diferente después de leerlo?
    - |-
      \textbf{Patrones:} los libros que más impactan combinan al menos dos de los tres (saber + poder hacer, o poder hacer + sentir). ¿Cuál es el patrón de propósito que define tu libro?
    - |-
      \textbf{Abstracción:} el propósito completo en una frase que empiece por verbo: «Este libro permite al lector [verbo] [resultado concreto].» Sin verbo no hay propósito --- hay decoración.
    - |-
      \textbf{Algoritmo del índice:} (1) escribe el propósito en una frase con verbo; (2) lista 12 subtemas que llevan al lector desde donde está hasta ese propósito; (3) ordénalos de menor a mayor complejidad; (4) agrupa los relacionados hasta tener 8--12 capítulos con títulos claros.
  anatomia:
    titulo: Del propósito al índice en cuatro pasos
    body: |-
      \textbf{Paso 1.} Propósito en una frase: «Este libro permite al lector [resultado].» \\[2mm] \textbf{Paso 2.} Lista 12 subtemas sin orden todavía --- lluvia de ideas libre. \\[2mm] \textbf{Paso 3.} Ordénalos: ¿cuál va primero para que el lector entienda el segundo?, ¿cuál va al final porque requiere todo lo anterior? \\[2mm] \textbf{Paso 4.} Agrupa los que son parte del mismo tema más amplio. Cada grupo = un capítulo. Ponle título al capítulo, no al grupo.
  errores_comunes: |-
    (1) Propósito vago como ``inspirar a los jóvenes'' --- sin verbo concreto, sin resultado medible. (2) Índice con todos los capítulos del mismo peso --- en un buen libro hay capítulos-ancla y capítulos-puente. (3) Capítulos sin conexión entre sí --- el lector siente que está leyendo varios libros distintos. (4) Índice que copia la estructura de un libro que ya existe en lugar de responder al propósito propio.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Propósito e índice de mi libro». \textbf{Formato:} (a) Propósito en 1 frase que empiece por verbo + (b) índice tentativo de 8--12 capítulos numerados, cada uno con título y 1 renglón de subtema. \textbf{Extensión:} 1 página completa del cuaderno. \textbf{Sabes que terminaste cuando} el propósito tiene verbo concreto y el índice tiene entre 8 y 12 capítulos en un orden que puedes explicar en voz alta.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- La ficha de proyecto de mi libro} (20 min · individual). Vas a reunir todo lo de hoy en una sola ficha de media página --- el documento que te acompañará durante todo el periodo como brújula. Si en el capítulo 6 no sabes adónde vas, relees la ficha. Si alguien te pregunta de qué va tu libro, lees la ficha.
  pilares:
    - |-
      \textbf{Título tentativo:} el nombre del libro no tiene que ser perfecto hoy --- tiene que ser honesto. Puede cambiar en G09. Lo importante es que nombre el tema con precisión.
    - |-
      \textbf{Lector ideal + propósito:} una línea de cada uno, sacadas directamente de las actividades anteriores.
    - |-
      \textbf{Frase de posicionamiento:} combina el pitch de G01 con el propósito de hoy en una sola frase que responda «¿de qué va tu libro y para qué existe?»
    - |-
      \textbf{Índice definitivo tentativo:} los 8--12 capítulos en orden, cada uno con título. Este es el contrato del libro --- lo que le prometes al lector.
  checklist:
    titulo: Checklist de la ficha de proyecto antes de cerrar el cuaderno
    items: |-
      \checkbox La ficha tiene los 4 elementos: título tentativo, lector ideal, propósito con verbo, índice. \\[1mm] \checkbox El lector ideal es una persona concreta, no una categoría. \\[1mm] \checkbox El propósito empieza por verbo y tiene un resultado observable en el lector. \\[1mm] \checkbox El índice tiene entre 8 y 12 capítulos con títulos distintos en orden lógico. \\[1mm] \checkbox La frase de posicionamiento conecta el pitch de G01 con el propósito de hoy sin contradicción.
  plantilla_guion: |-
    \textbf{Título tentativo:} \textit{[nombre del libro]} \\[1mm] \textbf{Lector ideal:} \textit{[descripción concreta de 1 renglón]} \\[1mm] \textbf{Propósito:} Este libro permite al lector \textit{[verbo + resultado concreto]}. \\[1mm] \textbf{Frase de posicionamiento:} \textit{[pitch G01]} porque \textit{[propósito de hoy]}. \\[2mm] \textbf{Índice tentativo:} \\[1mm] Capítulo 1 --- \textit{[título]} · \textit{[subtema en 1 renglón]} \\[0.5mm] Capítulo 2 --- \textit{[título]} · \textit{[subtema]} \\[0.5mm] $\vdots$ \\[0.5mm] Capítulo 12 --- \textit{[título]} · \textit{[subtema]}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Ficha de proyecto de mi libro · versión 1». \textbf{Formato:} los 4 elementos de la plantilla en orden, con los títulos en negrita. \textbf{Extensión:} 1 página completa del cuaderno. \textbf{Sabes que terminaste cuando} la ficha está completa, el índice tiene entre 8 y 12 capítulos, y la puedes leer de corrido en voz alta sin que suene a tarea --- que suene a proyecto tuyo.
  producto_titulo: Ficha de proyecto editorial + índice tentativo de 8–12 capítulos
  criterios:
    - La ficha tiene los 4 elementos completos (título, lector, propósito, índice) sin ninguno en blanco
    - El lector ideal es concreto --- una persona con situación específica, no una categoría
    - El propósito empieza por verbo y tiene un resultado observable en el lector
    - El índice tiene entre 8 y 12 capítulos con títulos distintos y un orden que tiene lógica explicable
    - La frase de posicionamiento conecta el pitch de G01 con el propósito de hoy sin contradicción

triangulo:
  dussel:
    autor: Enrique Dussel
    cita: El proyecto que no parte de las necesidades del Otro es un proyecto de dominación, no de liberación.
    aplicacion: |-
      Un libro diseñado solo para el autor --- para demostrar lo que sabe, para ganar reconocimiento --- no sirve al Otro: lo usa como espejo. Dussel invita a preguntar: ¿este libro nace de lo que el lector necesita o de lo que yo quiero decir? La respuesta honesta define si el libro es un acto de liberación o un acto de poder disfrazado de generosidad.
    pregunta_espejo: ¿El libro que estás diseñando nace de lo que tu lector ideal necesita o de lo que tú quieres demostrar?
  estoico:
    autor: Marco Aurelio
    cita: Haz cada cosa como si fuera la última de tu vida, con plena concentración y sin afectación.
    aplicacion: |-
      El índice de un libro es un acto de plena concentración: cada capítulo en su lugar exacto, cada título diciendo exactamente lo que promete. Marco Aurelio llamaría a la distracción del diseñador lo mismo que llamaba a la dispersión en el campo --- el que no sabe adónde va pierde antes de empezar. La ficha de proyecto es la concentración antes del combate largo de las 80 páginas.
    pregunta_espejo: ¿Estás diseñando el índice con plena concentración o con la urgencia de terminar la tarea rápido?
  floridi:
    autor: Luciano Floridi
    cita: Diseñar la arquitectura de la información es un acto moral, no solo técnico.
    aplicacion: |-
      El orden en que presentas la información en tu libro no es neutral: determina cómo el lector construye su comprensión, qué puede entender y qué no. Un índice bien diseñado respeta la capacidad del lector para construir conocimiento; uno mal diseñado lo confunde o lo manipula. Floridi diría que la arquitectura del libro es la ética del autor hecha visible.
    pregunta_espejo: ¿El orden de tus capítulos respeta la inteligencia y el tiempo de tu lector, o lo obliga a seguir tu lógica sin explicación?

compromiso: |-
  \textbf{Para la próxima sesión.} Comparte tu índice tentativo --- solo los títulos de los capítulos --- con alguien que no sabe nada del tema de tu libro. Pregúntale: «¿Cuál capítulo leerías primero? ¿Cuál no tiene sentido junto a los otros?» Anota su respuesta en 2 renglones. No tienes que cambiar nada todavía --- solo escuchar.

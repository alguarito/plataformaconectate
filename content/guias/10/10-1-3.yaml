clave: 1-3
grado: 10
periodo: 1
sesion: 3
completo: true
titulo: Prompting técnico para escritura --- las 5 partes del prompt profesional
titulo_portada: |-
  Prompting técnico ---
  las 5 partes
  del prompt profesional
producto_final: |-
  Plantilla personal de prompt editorial con las 5 partes (rol, contexto, tarea, formato, restricciones) escrita como guía reutilizable + 3 prompts profesionales escritos siguiendo la plantilla y probados en al menos 2 herramientas distintas (ChatGPT, Gemini, Bing Copilot, Claude.ai) para generar primer borrador de 1 capítulo de tu libro + bitácora con comparación de respuestas, qué funcionó, qué no, y por qué la plantilla fue clave
apertura:
  saber_ancestral: |-
    Cuando entras a un restaurante del centro de Cartago y te sientas a pedir el almuerzo, hay una diferencia inmediata entre el comensal que sabe pedir y el que no. El comensal novato dice: \emph{``algo rico''}, \emph{``lo que sea''}, \emph{``sorpréndame''}. El cocinero, sin información, hace lo que cree o lo más barato del día. El plato sale, pero el comensal queda inconforme. El comensal experimentado, en cambio, pide diferente: \emph{``un sancocho de gallina, con yuca y mazorca, no muy salado, para 4 personas, sin cilantro porque a mi mamá no le gusta''}. El cocinero recibe \textbf{toda la información necesaria}: qué plato, qué ingredientes, qué nivel de sal, para cuántos, qué excluir. El plato sale como el comensal esperaba. La diferencia entre los dos comensales no es el dinero ni el conocimiento culinario: es \textbf{saber pedir con precisión}. Esa habilidad ancestral del cliente exigente del barrio Obrero es exactamente lo que la IA generativa moderna llama \textbf{prompting técnico}. El prompt es el pedido al cocinero; la IA es el cocinero; la respuesta es el plato. Quien sabe pedir, come bien. Quien no, come lo que sea.
  saber_contemporaneo: |-
    El \textbf{prompt} es el texto que le escribes a una IA generativa (ChatGPT, Gemini, Bing Copilot, Claude.ai) para que produzca una respuesta. La regla profesional famosa, conocida desde los primeros usos de GPT en 2022: \textbf{garbage in, garbage out} (basura entra, basura sale). Si tu prompt es \emph{``escríbeme algo sobre la salud mental''}, la IA te dará texto genérico que no sirve para nada. Si tu prompt es \textbf{técnico y completo}, la respuesta es útil. Los prompts profesionales tienen \textbf{5 partes obligatorias}: (1) \textbf{Rol}: qué tipo de profesional debe asumir la IA (\emph{``actúa como editor de literatura juvenil''}). (2) \textbf{Contexto}: la información de fondo que la IA necesita (\emph{``estoy escribiendo un libro de 80 páginas sobre X, audiencia Y, género Z''}). (3) \textbf{Tarea}: qué exactamente debe hacer en esta respuesta (\emph{``escribe el capítulo 1 de mi escaleta adjunta''}). (4) \textbf{Formato}: cómo quieres la respuesta (\emph{``en prosa, 6 páginas aproximadas, con subtítulos cada 2 páginas''}). (5) \textbf{Restricciones}: qué evitar (\emph{``sin clichés de novela distópica, sin frases hechas, evita el tono motivacional''}).
  pregunta_puente: |-
    ¿Qué sabía el comensal experimentado del restaurante al pedir con precisión todos los detalles, que el usuario novato de ChatGPT olvida cuando escribe \emph{``hazme un capítulo''}? ¿Y por qué un prompt de 100 palabras bien estructurado vale más que 1000 palabras de conversación con la IA?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 5 partes del prompt profesional y qué problema resuelve cada una; (2) \textbf{aplicar} las 5 partes para construir prompts que produzcan respuestas útiles, no genéricas; (3) \textbf{analizar} las diferencias entre las respuestas de distintas IAs al mismo prompt; (4) \textbf{evaluar} qué prompt funcionó mejor y por qué, documentándolo en bitácora.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 aceptaste el rol de editor; en la 2 concebiste tu libro. Hoy aprendes a \textbf{pedir profesionalmente} a la IA. Las próximas 7 sesiones (iterar, estructura, derechos, portada, diagramación, producción, sustentación) usarán prompts profesionales constantemente. Sin esta habilidad, las próximas sesiones serán frustración.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{experimento del comensal}: escribe en ChatGPT (o la IA que prefieras) este prompt simple: \emph{``escríbeme un capítulo sobre mi libro''}. Lee la respuesta. Después escribe este otro: \emph{``actúa como editor de literatura juvenil. Estoy escribiendo un libro sobre [tu tema], audiencia 14-17 años, género [tu género]. Escribe el primer borrador del capítulo 1 de mi escaleta adjunta [pega tu escaleta]. 800 palabras. Sin clichés.''}. Compara las 2 respuestas.
  a_sistematizacion: |-
    Ya hiciste el experimento. Ahora vas a entender la \textbf{anatomía de las 5 partes del prompt profesional}: rol, contexto, tarea, formato, restricciones. Cada una resuelve un problema distinto. Vas a verlas con ejemplos concretos.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: construyes tu plantilla personal con las 5 partes, escribes 3 prompts siguiendo la plantilla, los pruebas en 2+ herramientas, comparas resultados, documentas en bitácora.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: plantilla + 3 prompts probados + bitácora. El criterio principal: que cualquiera con tu plantilla pueda construir prompts profesionales sin repetir tu trabajo desde cero.
  a_evaluacion: |-
    Antes de cerrar, mira el prompting desde las cinco dimensiones humanas. Pedir con precisión es respeto por la conversación con la IA y por tu propio tiempo; pedir cualquier cosa es desperdicio del oficio.
  a_triangulo: |-
    Y para terminar, tres voces sobre el oficio de pedir. Dussel sobre la palabra precisa como acto de dignidad, Epicteto sobre la disciplina del detalle, Floridi sobre el prompting como nueva habilidad informacional del siglo XXI.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Experimento del comensal} (15 min · individual con dispositivo). Abre ChatGPT, Gemini o Bing Copilot. Haz 2 pruebas: (1) escribe el prompt vago: \emph{``escríbeme un capítulo sobre mi libro''}. Lee la respuesta. (2) escribe el prompt completo: \emph{``actúa como editor de literatura juvenil. Estoy escribiendo un libro sobre [tu tema concreto], audiencia 14-17 años, género [tu género específico]. Escribe el primer borrador del capítulo 1 con 800 palabras, en prosa, con un subtítulo cada 2 páginas. Sin clichés de novela distópica, sin tono motivacional, sin frases hechas''}. Lee la respuesta. Anota: ¿en qué cambió la calidad?, ¿qué información hizo la diferencia?
  checks:
  - Hice los 2 prompts en una IA generativa.
  - Comparé las 2 respuestas.
  - Identifiqué qué información cambió la calidad.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Experimento del comensal». \textbf{Formato:} 2 fragmentos de respuesta + observación de la diferencia en 3 líneas. \textbf{Sabes que terminaste cuando} ves que la precisión del prompt cambia todo.
sistematizacion:
  intro: |-
    El experimento te mostró que la precisión cambia la respuesta. Ahora necesitas la \textbf{anatomía profesional} de las 5 partes del prompt para construir respuestas útiles consistentemente.
  pilares:
  - |-
    Las \textbf{5 partes del prompt profesional} se descomponen así: (1) \textbf{Rol}: qué tipo de profesional asume la IA. \emph{``Actúa como editor de literatura juvenil''}, \emph{``actúa como periodista de divulgación científica''}, \emph{``actúa como mentor de emprendimiento''}. El rol activa el vocabulario y tono profesional correspondiente. (2) \textbf{Contexto}: el panorama que la IA necesita conocer. Incluye proyecto, audiencia, género, decisiones previas. Pegar la escaleta es buena práctica. (3) \textbf{Tarea}: qué exactamente debe hacer en esta respuesta concreta. Un verbo claro (\emph{``escribe''}, \emph{``revisa''}, \emph{``propone''}, \emph{``compara''}) seguido del objeto preciso. (4) \textbf{Formato}: cómo quieres la respuesta. Extensión (\emph{``800 palabras''}), tipo (\emph{``prosa''}, \emph{``lista numerada''}, \emph{``tabla''}), elementos (\emph{``con subtítulo cada 2 páginas''}). (5) \textbf{Restricciones}: qué evitar. Clichés del género, palabras prohibidas, formatos que no aceptarás, tonos a esquivar.
  - |-
    El patrón profesional se llama \textbf{``RCTFR''} (rol-contexto-tarea-formato-restricciones). No tienes que ponerlas en ese orden estricto en todos los prompts, pero las 5 deben aparecer. La regla: \textbf{si tu prompt no tiene las 5 partes, espera respuesta genérica}. La phronesis del prompting consiste en \textbf{invertir 2 minutos en escribir el prompt para ahorrar 30 minutos editando una respuesta mala}.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿la IA tiene toda la información que necesitaría un humano profesional para hacer este trabajo?}. Si tú le pidieras a un editor humano que escriba el capítulo 1 de tu libro y solo le dieras \emph{``escribe el capítulo 1''}, no podría hacerlo. La IA tampoco. El prompt es la información que un humano profesional necesitaría, escrita compacta para la IA.
  - |-
    Algoritmo de construcción de un prompt: (1) define el rol que necesitas. (2) escribe contexto: proyecto, audiencia, género, escaleta. (3) declara la tarea concreta. (4) especifica formato esperado. (5) lista restricciones. (6) envía. (7) lee la respuesta con criterio. (8) ajusta el prompt si hace falta y vuelve a probar.
  anatomia:
    titulo: Anatomía del prompt profesional
    body: |-
      \textbf{Rol:} qué profesional asume la IA. \\[1mm] \textbf{Contexto:} proyecto + audiencia + género + escaleta. \\[1mm] \textbf{Tarea:} verbo claro + objeto preciso. \\[1mm] \textbf{Formato:} extensión + tipo + elementos. \\[1mm] \textbf{Restricciones:} clichés y tonos a evitar.
  errores_comunes: |-
    (1) \textbf{Prompt sin rol}: la IA usa tono genérico de chatbot. (2) \textbf{Sin contexto}: la IA no sabe qué proyecto ni qué audiencia. (3) \textbf{Tarea vaga}: \emph{``algo sobre X''} produce algo sobre nada. (4) \textbf{Sin formato}: la respuesta llega en cualquier extensión y estructura. (5) \textbf{Sin restricciones}: la IA usa todos los clichés que conoce porque nadie le pidió evitarlos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía del prompt». \textbf{Formato:} (a) las 5 partes con su problema que resuelve; (b) plantilla en blanco lista para usar; (c) los 5 errores con marca del que más temes cometer. \textbf{Sabes que terminaste cuando} podrías construir un prompt profesional sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- Plantilla personal + 3 prompts probados + bitácora} (40 min · individual con dispositivo). Hora de aplicar. Construyes plantilla, escribes 3 prompts, los pruebas en al menos 2 herramientas, comparas resultados, documentas en bitácora.
  pilares:
  - |-
    Tu plantilla personal se construye así: (1) escribe en tu cuaderno los 5 nombres de las partes (Rol, Contexto, Tarea, Formato, Restricciones). (2) para cada parte, escribe 1 ejemplo de cómo se ve en un prompt típico de tu proyecto. (3) deja espacios en blanco para llenar en cada uso. Es una guía reutilizable, no un prompt fijo. La regla: la plantilla es tuya y se adapta a tu proyecto.
  - |-
    Los 3 prompts que vas a escribir y probar: (1) \textbf{Prompt 1}: generar primer borrador del capítulo 1 completo de tu libro. (2) \textbf{Prompt 2}: generar 3 posibles títulos alternativos para tu libro. (3) \textbf{Prompt 3}: generar una sinopsis de 200 palabras del libro para la contraportada. Cada uno sigue la plantilla con las 5 partes.
  - |-
    Pruebas en 2+ herramientas: ejecuta los 3 prompts en al menos 2 IAs distintas (puede ser ChatGPT + Gemini, o Bing Copilot + Claude.ai). Compara las respuestas. Anota cuál te gustó más y por qué. No siempre la misma IA es mejor para todo; algunas son mejores para creatividad, otras para precisión, otras para velocidad.
  - |-
    La bitácora tiene estructura mínima: (a) prompt usado, (b) IA probada, (c) respuesta resumida (no la pegues entera, solo lo clave), (d) qué funcionó, (e) qué no funcionó, (f) qué cambiarías del prompt. Una fila por cada combinación prompt-IA. Total: 6 filas (3 prompts × 2 IAs).
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Plantilla personal con las 5 partes. \\[1mm] \checkbox Prompt 1 (capítulo) escrito con las 5 partes. \\[1mm] \checkbox Prompt 2 (títulos) escrito con las 5 partes. \\[1mm] \checkbox Prompt 3 (sinopsis) escrito con las 5 partes. \\[1mm] \checkbox 3 prompts probados en al menos 2 IAs distintas. \\[1mm] \checkbox Bitácora con 6 filas (3 prompts por 2 IAs). \\[1mm] \checkbox Decisión final sobre cuál respuesta usar.
  plantilla_guion: |-
    \textbf{Plantilla.} \textit{Rol + Contexto + Tarea + Formato + Restricciones.} \\[1mm] \textbf{Prompt 1.} \textit{Capítulo 1 borrador.} \\[1mm] \textbf{Prompt 2.} \textit{3 títulos alternativos.} \\[1mm] \textbf{Prompt 3.} \textit{Sinopsis 200 palabras.} \\[1mm] \textbf{Bitácora.} \textit{Tabla 6 filas con resultado por cada IA.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- Plantilla + 3 prompts». \textbf{Formato:} (a) plantilla; (b) 3 prompts escritos; (c) bitácora 6 filas; (d) decisión final. \textbf{Sabes que terminaste cuando} tienes capítulo 1 borrador listo para iterar en la sesión 4.
  producto_titulo: Plantilla personal + 3 prompts profesionales + bitácora comparativa
  criterios:
  - Plantilla con las 5 partes claras
  - 3 prompts escritos siguiendo la plantilla
  - Cada prompt probado en 2+ IAs
  - Bitácora con 6 filas comparativas
  - Decisión final justificada
  - Capítulo 1 borrador como subproducto
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Pedir con palabra precisa es ya acto de dignidad en la era del contenido automatizado.
    aplicacion: |-
      Cuando le pides a la IA con palabra precisa, asumes el control de la conversación. Cuando le pides cualquier cosa, dejas que la IA decida por ti qué entregar. La filosofía de la liberación pide lo primero: \textbf{el humano dirige, la herramienta sirve}. El prompt es el lugar donde se decide quién manda. La phronesis del editor consiste en \textbf{nunca renunciar al timón del prompt}.
    pregunta_espejo: |-
      ¿Mis prompts dirigen a la IA, o la dejo dirigir el contenido que me devuelve?
  estoico:
    autor: Epicteto
    cita: |-
      Lo pequeño bien hecho cambia todo; el detalle del prompt separa la respuesta útil de la basura.
    aplicacion: |-
      Es tentador pensar que escribir prompts es perder tiempo y que basta con \emph{``hablar normal''} con la IA. La disciplina estoica recomienda lo opuesto: \emph{2 minutos puestos en el prompt ahorran 30 minutos editando la respuesta}. Esa disciplina parece lenta pero es la única que produce trabajo profesional sostenible. El prompt es el laboratorio del oficio digital contemporáneo.
    pregunta_espejo: |-
      ¿Estoy invirtiendo el tiempo justo en escribir el prompt, o quiero respuesta mágica con esfuerzo mínimo?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El prompting es la nueva alfabetización del siglo XXI; quien no sabe pedirle a la IA pierde poder informacional.
    aplicacion: |-
      En la era de la IA generativa, saber escribir prompts profesionales es habilidad equivalente a saber escribir correo profesional fue en 2005. No es opcional para tu vida laboral próxima. La ética digital pide que el prompting se aprenda con criterio: no para depender de la IA, sino para usarla con dignidad humana. Tu plantilla de hoy te entrena en esa práctica.
    pregunta_espejo: |-
      ¿Estoy aprendiendo prompting como habilidad profesional, o solo lo uso casual sin método?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu plantilla, los 3 prompts probados, la bitácora y el capítulo 1 borrador. En la sesión 4 vas a aprender a \textbf{iterar el texto con IA}: del primer borrador al capítulo terminado pasando por 3 versiones progresivas. El prompt de hoy es el primer disparo; la iteración de mañana es la afinación.
web:
  conceptos_clave:
    - termino: Prompt
      definicion: |-
        Texto que le escribes a una IA generativa para obtener una respuesta. Su calidad determina la calidad del resultado.
      ejemplo: |-
        Un prompt vago produce texto vago; un prompt técnico y completo produce respuestas útiles.
      emoji: "💬"
    - termino: Rol
      definicion: |-
        Primera parte del prompt profesional. Define qué tipo de profesional debe asumir la IA al responder.
      ejemplo: |-
        "Actúa como editor de literatura juvenil con 15 años de experiencia." Sitúa a la IA en una mirada concreta.
      emoji: "🎭"
    - termino: Contexto
      definicion: |-
        Información de fondo que la IA necesita para responder con precisión. Sin contexto, la respuesta es genérica.
      ejemplo: |-
        "Escribo un libro de 80 páginas sobre amistades jóvenes en el Valle, para bachillerato, género realismo cercano."
      emoji: "🧭"
    - termino: Tarea + Formato
      definicion: |-
        Tercera y cuarta partes. Qué debe hacer exactamente la IA y cómo quieres la respuesta (extensión, estructura).
      ejemplo: |-
        "Escribe el capítulo 1 en prosa, 6 páginas, con subtítulos cada 2 páginas."
      emoji: "📋"
    - termino: Restricciones
      definicion: |-
        Quinta parte. Qué evitar en la respuesta: clichés, tono, frases hechas, longitud excesiva.
      ejemplo: |-
        "Sin clichés de novela distópica, sin frases hechas, evita tono motivacional."
      emoji: "🚧"
  quiz:
    titulo: ¿Escribes prompts profesionales?
    instrucciones: 5 preguntas para verificar que aplicas las 5 partes del prompt.
    preguntas:
      - enunciado: ¿Qué significa "garbage in, garbage out"?
        opciones:
          - La IA siempre da respuestas mediocres
          - Si tu prompt es vago, la respuesta es vaga
          - Hay que limpiar el computador
          - No tiene relación con prompts
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La calidad de entrada determina la calidad de salida. Prompt vago, respuesta vaga.
        feedback_incorrecto: |-
          Significa que la calidad del prompt define la calidad de la respuesta. Prompt vago, respuesta vaga.
      - enunciado: ¿Cuántas partes obligatorias tiene un prompt profesional?
        opciones:
          - "1"
          - "5"
          - "10"
          - "20"
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. 5: rol, contexto, tarea, formato y restricciones.
        feedback_incorrecto: |-
          Son 5: rol, contexto, tarea, formato y restricciones. Cada una aporta precisión al resultado.
      - enunciado: La parte del prompt que define qué profesional asume la IA se llama...
        opciones:
          - Formato
          - Rol
          - Restricción
          - Saludo
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Rol. Sitúa a la IA en una mirada profesional concreta antes de responder.
        feedback_incorrecto: |-
          Es el rol. Define qué profesional asume la IA al responder, lo que afina el tono y enfoque.
      - enunciado: "¿Qué falta en este prompt: 'escríbeme algo sobre salud mental'?"
        opciones:
          - Nada, está completo
          - Rol, contexto, tarea precisa, formato y restricciones
          - Solo el saludo
          - Solo el punto final
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Falta todo el marco profesional. Por eso ese tipo de prompt produce texto genérico inservible.
        feedback_incorrecto: |-
          Falta el marco completo: rol, contexto, tarea precisa, formato y restricciones.
      - enunciado: La parte "restricciones" del prompt sirve para...
        opciones:
          - Bloquear la IA
          - Decirle qué evitar (clichés, tono, longitud)
          - Hacer la respuesta más larga
          - Decir gracias
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Las restricciones evitan que la IA caiga en clichés, tono inadecuado o longitud excesiva.
        feedback_incorrecto: |-
          Sirve para decirle qué evitar. Sin restricciones, la IA cae en clichés y frases hechas.

  conceptos_clave:
  - categoria: Las cinco partes
    termino: Rol
    definicion: |-
      Qué profesional debe asumir la herramienta. Activa el vocabulario y el tono de ese oficio.
    ejemplo: |-
      «Actúa como editor de literatura juvenil» da un texto muy distinto que no decir nada.
  - categoria: Las cinco partes
    termino: Contexto
    definicion: |-
      La información de fondo del proyecto: de qué trata el libro, para quién es y en qué género está.
    ejemplo: |-
      Sin contexto, la herramienta escribe para un lector promedio que no existe.
  - categoria: Las cinco partes
    termino: Tarea
    definicion: |-
      Qué hay que hacer exactamente, con un verbo claro y un objeto preciso.
    ejemplo: |-
      «Redacta el capítulo 3 según este resumen» en lugar de «algo sobre el capítulo 3».
  - categoria: Las cinco partes
    termino: Formato
    definicion: |-
      La extensión y la estructura esperadas: cuántas palabras, con subtítulos o sin ellos, en qué orden.
    ejemplo: |-
      «Ochocientas palabras, sin subtítulos, en tercera persona» evita tener que rehacerlo todo.
  - categoria: Las cinco partes
    termino: Restricciones
    definicion: |-
      Qué evitar: lugares comunes, tonos que no van, palabras que no quieres ver.
    ejemplo: |-
      «Sin frases de autoayuda y sin empezar con una pregunta retórica.»
  - categoria: Trabajar con la respuesta
    termino: Bitácora comparativa
    definicion: |-
      El registro de qué prompt se usó, en qué herramienta, qué funcionó, qué no y qué cambiarías.
    ejemplo: |-
      Una fila por combinación deja ver si el problema era el prompt o era la herramienta.
  cinco_dimensiones:
    personal: |-
      Aprendes a pedir con precisión, que sirve mucho más allá de una IA: sirve para encargar un trabajo, pedir ayuda o explicar qué necesitas.
    emocional: |-
      Dedicar dos minutos a escribir bien la petición, cuando la tentación es escribir tres palabras y darle enviar, es una forma de paciencia.
    ciudadana: |-
      Quien sabe qué pedir obtiene algo aprovechable de cualquier herramienta. Quien no lo sabe queda a merced de lo que le entreguen.
    local: |-
      La tejedora inga sabe cómo va a quedar la labor antes de pasar el primer hilo, porque en el telar no se improvisa a mitad de camino.
    intergeneracional: |-
      Planear antes de ejecutar es lo que enseñan los oficios donde el error se paga caro. La herramienta cambió; la disciplina no.
  post_lectura:
    transferencia: |-
      Llega a la próxima sesión con la plantilla, los tres prompts probados, la bitácora y el borrador del primer capítulo. Sin ese borrador no hay qué iterar.
  quiz:
    titulo: Verifica el prompting técnico
    instrucciones: 5 preguntas para confirmar que sabes pedir con precisión. Necesitas 3/5 para continuar.
    preguntas:
    - enunciado: ¿Qué parte del prompt define qué profesional debe asumir la herramienta?
      opciones:
      - El contexto, que describe el proyecto en el que se está trabajando ahora mismo
      - El rol, que activa el vocabulario y el tono propios de un oficio concreto
      - El formato, que indica con qué estructura debe llegar la respuesta esperada
      - La tarea, que dice con un verbo qué es lo que hay que producir exactamente
      respuesta_index: 1
      feedback_correcto: |-
        Correcto. Sin rol, la respuesta llega con el tono genérico de cualquier asistente.
      feedback_incorrecto: |-
        El contexto da el proyecto y la tarea da la acción. Quien fija el oficio es el rol.
    - enunciado: Escribes «hazme algo sobre salud mental». ¿Qué le falta a ese prompt?
      opciones:
      - Solo le falta indicar la extensión que debería tener la respuesta esperada
      - "Nada importante: la herramienta puede preguntar lo que necesite saber después"
      - Le falta precisar el tema, porque salud mental es un asunto demasiado delicado
      - "Le faltan las cinco partes: rol, contexto, tarea concreta, formato y restricciones"
      respuesta_index: 3
      feedback_correcto: |-
        Exacto. No falta un dato: falta la estructura entera, y por eso la respuesta será genérica.
      feedback_incorrecto: |-
        No es solo la extensión, y la herramienta no pregunta: rellena los huecos con lo más probable.
    - enunciado: ¿Para qué sirve la parte de restricciones?
      opciones:
      - "Para decirle a la herramienta qué evitar: lugares comunes, tonos y palabras que no van"
      - Para limitar la cantidad de veces que se puede consultar la misma herramienta al día
      - Para impedir que la herramienta acceda a información que no debería estar usando
      - Para indicar el plazo dentro del cual necesitas recibir la respuesta terminada
      respuesta_index: 0
      feedback_correcto: |-
        Sí. Si nadie pide evitar los lugares comunes, aparecen todos, porque son lo más probable.
      feedback_incorrecto: |-
        No tiene que ver con límites de uso ni con plazos. Es qué no quieres ver en la respuesta.
    - enunciado: ¿Por qué probar el mismo prompt en más de una herramienta?
      opciones:
      - Porque una de ellas siempre resulta claramente mejor que las demás para todo
      - Porque comparar las respuestas enseña más sobre tu prompt que sobre las herramientas
      - Porque así se puede escoger la respuesta más larga, que suele ser la más completa
      - Porque usar varias reparte el trabajo y hace que cada una responda más rápido
      respuesta_index: 1
      feedback_correcto: |-
        Correcto. Si las dos respuestas fallan igual, el problema estaba en el prompt.
      feedback_incorrecto: |-

clave: 1-3
grado: 10
periodo: 1
sesion: 3
completo: true
duracion_min: 90
titulo: Prompting técnico para escritura --- las 5 partes del prompt profesional
titulo_portada: |-
  Prompting técnico ---
  las 5 partes del
  prompt profesional
producto_final: Plantilla personal de prompt con las 5 partes, 3 prompts escritos siguiendo esa plantilla y probados en al menos 2 herramientas, y una bitácora comparativa
apertura:
  saber_ancestral: |-
    En Santiago-Manoy, en el Alto Putumayo, las tejedoras ingas hacen \textbf{chumbes}: fajas tejidas con pictogramas geométricos que ellas llaman \emph{labores}. Un trabajo de campo con las tejedoras documentó veinticinco chumbes y cuarenta y seis labores (Aldana Barahona y Sánchez Carballo, 2021). Lo que importa aquí no es el dibujo sino el método. Cada labor se planea en la mente antes de tejerse. La tejedora sabe cómo va a quedar la figura antes de pasar el primer hilo, porque en el telar no hay manera de improvisar a mitad de camino. Y un punto olvidado se nota. El chumbe tampoco es adorno: protege el vientre de la mujer. La \textbf{cara de exclusión} la dice una de las tejedoras, Ruby Rodríguez, en 2018: «estamos en amenaza de que tenemos que ser historia». Hay labores de chumbes antiguos cuyo significado ya nadie conoce.
  origen: Tejedoras ingas de Santiago-Manoy · la labor que se planea antes de pasar el primer hilo
  fuente: |-
    Aldana Barahona, G. M. y Sánchez Carballo, A. (2021). Tejer con la mente: el chumbe inga del Alto Putumayo colombiano como artefacto cultural y mental. \emph{Estudios Atacameños, 67}, e3521. https://doi.org/10.22199/issn.0718-1043-2021-0007
  saber_contemporaneo: |-
    Un \textbf{prompt} es el texto que le escribes a una IA generativa para que produzca una respuesta. Si el prompt es «escríbeme algo sobre la salud mental», lo que llega es texto genérico que no sirve. Los prompts que funcionan tienen cinco partes. El \textbf{rol}, que dice qué profesional debe asumir la IA. El \textbf{contexto}, con la información de fondo del proyecto. La \textbf{tarea}, con un verbo claro y un objeto preciso. El \textbf{formato}, con la extensión y la estructura esperadas. Y las \textbf{restricciones}, que dicen qué evitar. Un prompt de cien palabras bien armado rinde más que mil palabras de conversación con la herramienta.
  pregunta_puente: |-
    ¿Qué tiene decidido una tejedora inga antes de pasar el primer hilo? ¿Y qué le falta a quien le escribe a una IA «hazme un capítulo» sin haber decidido nada?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las cinco partes del prompt profesional y qué problema resuelve cada una; (2) \textbf{explicar} por qué un prompt sin alguna de esas partes produce respuestas genéricas; (3) \textbf{aplicar} la plantilla para escribir prompts propios, probarlos en más de una herramienta y documentar cuál funcionó mejor.
puentes:
  a_ruta: |-
    En la sesión 2 cerraste la ficha editorial y la escaleta. Hoy conviertes ese plano en instrucciones que una IA pueda seguir. Sin las cinco partes, la escaleta que armaste no le llega a la herramienta.
  a_escuta: |-
    Antes de teorizar, vas a hacer un experimento con dos prompts sobre lo mismo: uno vago y uno completo. La diferencia entre las dos respuestas es el argumento de toda la sesión.
  a_sistematizacion: |-
    Ya viste la diferencia. Ahora vas a entender la \textbf{anatomía del prompt}: las cinco partes, qué problema resuelve cada una y qué pasa cuando falta alguna.
  a_praxis: |-
    Tienes el método. Toca aplicarlo. Construyes tu plantilla, escribes tres prompts, los pruebas en al menos dos herramientas y documentas qué funcionó y qué no.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: la plantilla, los tres prompts y la bitácora comparativa. El criterio principal es que la bitácora diga qué cambiarías de cada prompt, no solo cuál te gustó más.
  a_evaluacion: |-
    Antes de cerrar, mira el prompting desde las cinco dimensiones humanas. Pedir con precisión es respeto por el trabajo propio. Pedir de cualquier manera y quejarse del resultado es empezar mal el oficio.
  a_triangulo: |-
    Y para terminar, tres voces sobre pedir bien. Dussel sobre codificar para que otro decodifique, Epicteto sobre decir solo lo necesario, Floridi sobre saber preguntar.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El experimento de los dos prompts} (15 min · individual). (1) Abre una IA generativa. (2) Escribe el prompt vago: «escríbeme un capítulo para mi libro», y lee la respuesta. (3) Escribe ahora el prompt completo, con el rol, tu tema concreto, tu audiencia, tu género, la extensión que quieres y lo que no quieres. (4) Lee la segunda respuesta. (5) Anota en tres líneas qué información fue la que cambió la calidad.
  checks:
  - |-
    Escribí los dos prompts sobre lo mismo, el vago y el completo.
  - |-
    Comparé las dos respuestas en lugar de quedarme con la segunda.
  - |-
    Identifiqué qué información concreta fue la que cambió el resultado.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- El experimento de los dos prompts». \textbf{Formato:} un fragmento corto de cada respuesta y tres líneas sobre la diferencia. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} puedes nombrar qué dato del segundo prompt hizo la diferencia.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Las cinco partes} (20 min · parejas). (1) Con tu pareja, escriban las cinco partes con el problema que resuelve cada una. (2) Escriban qué pasa cuando falta cada una, con un ejemplo. (3) Armen juntos una plantilla en blanco lista para llenar. (4) Cada uno marca la parte que más se le olvida y dice por qué.
  pilares:
  - |-
    Las cinco partes se descomponen así. El \textbf{rol} activa el vocabulario y el tono de un oficio: «actúa como editor de literatura juvenil». El \textbf{contexto} da el proyecto, la audiencia y el género. La \textbf{tarea} dice qué hacer, con un verbo y un objeto. El \textbf{formato} fija extensión y estructura. Las \textbf{restricciones} dicen qué evitar.
  - |-
    El patrón completo es rol, contexto, tarea, formato y restricciones. No hace falta ponerlas en ese orden estricto, pero las cinco tienen que aparecer. Si falta alguna, la herramienta rellena el hueco con lo más probable, que casi siempre es lo más genérico. Invertir dos minutos en escribir bien el prompt ahorra media hora de respuestas inservibles.
  - |-
    Todo se juega en una pregunta: ¿la IA tiene la información que necesitaría una persona para hacer este trabajo? Si le pidieras a un editor humano «escribe el capítulo 1» y no le dieras nada más, no podría. La herramienta tampoco. El prompt es exactamente esa información puesta por escrito.
  - |-
    Algoritmo: (1) define el rol; (2) escribe el contexto con proyecto, audiencia y género; (3) declara la tarea concreta; (4) especifica el formato esperado; (5) lista las restricciones; (6) envía; (7) lee la respuesta con criterio; (8) ajusta el prompt y vuelve a probar.
  anatomia:
    titulo: Anatomía del prompt profesional
    body: |-
      \textbf{Rol:} qué profesional asume la herramienta. \\[1mm] \textbf{Contexto:} proyecto, audiencia, género y escaleta. \\[1mm] \textbf{Tarea:} un verbo claro y un objeto preciso. \\[1mm] \textbf{Formato:} extensión, estructura y elementos. \\[1mm] \textbf{Restricciones:} qué evitar, qué tono no usar. \\[1mm] \textbf{Regla:} si falta una parte, la herramienta rellena con lo más genérico.
  errores_comunes: |-
    (1) Prompt sin rol: la respuesta llega con tono de chatbot genérico. (2) Sin contexto: la herramienta no sabe de qué proyecto ni para quién. (3) Tarea vaga: «algo sobre X» produce algo sobre nada. (4) Sin formato: la respuesta llega con cualquier extensión y estructura. (5) Sin restricciones: aparecen todos los lugares comunes, porque nadie pidió evitarlos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Las cinco partes». \textbf{Formato:} las cinco partes con el problema que resuelve cada una, la plantilla en blanco y la parte que más se te olvida, marcada. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} podrías construir un prompt profesional sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Plantilla, tres prompts y bitácora} (40 min · individual). (1) Escribe tu plantilla personal con las cinco partes y un ejemplo de cada una para tu proyecto. (2) Escribe el prompt del borrador del primer capítulo. (3) Escribe el prompt de tres títulos alternativos. (4) Escribe el prompt de la sinopsis de contraportada. (5) Prueba los tres en al menos dos herramientas distintas. (6) Llena la bitácora con una fila por combinación y anota qué cambiarías de cada prompt.
  pilares:
  - |-
    Tu plantilla se construye así: escribe los nombres de las cinco partes, pon debajo de cada una un ejemplo de cómo se ve en tu proyecto y deja el espacio en blanco para llenar en cada uso. Es una guía reutilizable, no un prompt fijo.
  - |-
    Los tres prompts que vas a probar son distintos a propósito: el borrador de un capítulo, tres títulos alternativos y una sinopsis de contraportada. Uno pide texto largo, otro pide opciones y el tercero pide síntesis. Las cinco partes cambian de contenido en cada caso, pero siguen estando las cinco.
  - |-
    Probar en más de una herramienta no es capricho. Las respuestas al mismo prompt difieren, y compararlas te enseña más sobre el prompt que sobre las herramientas. Anota cuál preferiste y por qué, con una razón que no sea «sonaba mejor».
  - |-
    La bitácora tiene una estructura mínima: prompt usado, herramienta, resumen de la respuesta, qué funcionó, qué no funcionó y qué cambiarías del prompt. Una fila por cada combinación de prompt y herramienta.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Plantilla personal con las cinco partes y un ejemplo de cada una. \\[1mm] \checkbox Los tres prompts escritos siguiendo la plantilla. \\[1mm] \checkbox Los tres probados en al menos dos herramientas. \\[1mm] \checkbox Bitácora con una fila por combinación. \\[1mm] \checkbox En cada fila está escrito qué cambiarías del prompt. \\[1mm] \checkbox Borrador del primer capítulo guardado para la sesión 4.
  plantilla_guion: |-
    \textbf{Plantilla.} \textit{Rol, contexto, tarea, formato y restricciones.} \\[1mm] \textbf{Prompt 1.} \textit{Borrador del primer capítulo.} \\[1mm] \textbf{Prompt 2.} \textit{Tres títulos alternativos.} \\[1mm] \textbf{Prompt 3.} \textit{Sinopsis de contraportada.} \\[1mm] \textbf{Bitácora.} \textit{Una fila por prompt y herramienta, con qué cambiarías.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} \textbf{Título:} «Actividad 3 --- Plantilla y tres prompts». \textbf{Formato:} la plantilla, los tres prompts completos, la bitácora comparativa y la decisión final con su razón. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} tienes el borrador del primer capítulo listo para iterarlo en la sesión 4.
  producto_titulo: Plantilla personal, 3 prompts profesionales y bitácora comparativa
  criterios:
  - Plantilla con las cinco partes y un ejemplo propio de cada una
  - Los tres prompts escritos siguiendo la plantilla
  - Cada prompt probado en al menos dos herramientas distintas
  - Bitácora con una fila por combinación de prompt y herramienta
  - Cada fila dice qué cambiarías del prompt, no solo si gustó
  - Borrador del primer capítulo guardado como subproducto
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.2.5.3
    cita: |-
      La información por transmitirse deberá codificarse semántica, sintáctica y fonéticamente, para ser, desde la recepción, decodificada fonética, sintáctica y semánticamente como información recibida.
    aplicacion: |-
      Un prompt es codificación pura. Lo que tienes en la cabeza --- el tema, la audiencia, el tono --- tiene que quedar escrito para que del otro lado se pueda decodificar. Lo que no codificaste no llega. Y la herramienta no pregunta: rellena el hueco con lo más probable.
    pregunta_espejo: |-
      De lo que yo tengo claro sobre mi libro, ¿cuánto quedó realmente escrito en el prompt?
  estoico:
    autor: Epicteto · Enquiridión, 33 (c. 125 d.C.)
    cita: |-
      Guarda el silencio cuanto te fuere posible. Nunca digas sino lo que absolutamente es necesario, y en ello emplea las menos palabras que pudieres.
    aplicacion: |-
      No es una invitación a escribir prompts cortos. Es una invitación a que no sobre nada. Las cinco partes son necesarias; lo que sobra son los rodeos, las cortesías y las explicaciones de por qué necesitas el texto. Cien palabras que hacen falta rinden más que mil que llenan.
    pregunta_espejo: |-
      En mi prompt más largo, ¿qué frase podría borrar sin que la respuesta cambie?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    cita: |-
      La partida la ganarán quienes «sepan preguntar y responder» (Platón, Crátilo 390c) y, por tanto, sepan qué datos pueden ser útiles y relevantes, y merecen recogerse y cuidarse. (trad. propia)
    aplicacion: |-
      Producir texto dejó de ser lo difícil. Lo escaso es saber qué pedir. Por eso la sesión no se trata de la herramienta sino de tu pregunta: quien sabe qué necesita obtiene algo aprovechable de cualquier modelo, y quien no lo sabe no lo obtiene de ninguno.
    pregunta_espejo: |-
      Si me quitaran la herramienta que uso, ¿sabría igual qué es lo que necesito pedir?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la plantilla, los tres prompts probados, la bitácora y el borrador del primer capítulo. En la sesión 4 vas a iterar ese borrador: del primer texto al capítulo terminado hay varias vueltas, y ninguna la hace sola la herramienta.
web:
  resumen: |-
    Aprendes las cinco partes del prompt profesional --- rol, contexto, tarea, formato y restricciones --- y las pruebas escribiendo tres prompts propios en más de una herramienta.
  subtema: Oficio editorial · Pedir con precisión
  pre_lectura:
    por_que_importa: |-
      Cuando falta una parte del prompt, la herramienta rellena el hueco con lo más probable, que casi siempre es lo más genérico. Pedir con precisión es lo que separa un borrador útil de un texto que no sirve.
    pregunta_detonante: |-
      Si le pidieras a una persona «escribe el capítulo 1» y nada más, ¿podría hacerlo?
    activacion:
      titulo: Antes del primer hilo
      descripcion: |-
        En 3 minutos, escribe todo lo que una persona necesitaría saber para escribir por ti el primer capítulo de tu libro. Esa lista es tu primer prompt.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 2 cerraste la ficha editorial y la escaleta de capítulos.
      siguiente: |-
        En la sesión 4 iteras el borrador que salga hoy hasta convertirlo en un capítulo terminado.

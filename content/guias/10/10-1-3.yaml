clave: 1-3
grado: 10
periodo: 1
sesion: 3
completo: true
titulo: Escritura inversa I --- desmontar un libro para entender su arquitectura
titulo_portada: |-
  Escritura
  inversa I ---
  desmontar
  un libro
producto_final: Análisis de 1 capítulo de un libro real del género propio (mapa de estructura, decisiones del autor documentadas) + tabla de decisiones de réplica para el libro propio

apertura:
  saber_ancestral: |-
    El cuentero del fogón en el Valle del Cauca no aprendía a narrar oyendo consejos sobre narración --- aprendía \emph{escuchando} cuentos ajenos con ojo de aprendiz. Desarmaba en silencio el cuento del maestro: ¿qué imagen usó al principio?, ¿cuándo aceleró el ritmo?, ¿cómo cerró sin que sonara a final de clase? En los oficios del Pacífico --- la lutería, la cestería, el tejido --- el aprendiz copiaba la pieza del maestro antes de hacer la propia. No era plagio: era el método más honesto de aprender.
  saber_contemporaneo: |-
    La escritura inversa es esa misma técnica aplicada al texto: leer un capítulo con ojo de autor, no de lector. El lector pregunta qué dice; el autor pregunta \emph{cómo está hecho}. ¿Cuántas palabras tiene el párrafo de apertura? ¿Cuándo aparece el primer dato concreto? ¿Dónde está el giro que cambia la dirección del capítulo? Desmontar un capítulo ajeno es la forma más rápida de aprender a construir el propio.
  pregunta_puente: |-
    Piensa en el último libro que no pudiste soltar. ¿Qué te enganchó en las primeras páginas? ¿Fue una imagen, una pregunta, una escena, un dato sorprendente? ¿Crees que el autor lo planeó o fue accidente?
  saber_hacer: |-
    Al terminar esta guía podrás: (1) \textbf{analizar} un capítulo real de un libro de tu género identificando su estructura (gancho, desarrollo, cierre); (2) \textbf{explicar} las decisiones del autor --- qué eligió incluir, en qué orden y con qué tono; (3) \textbf{evaluar} qué elementos de esa arquitectura vas a replicar en tu propio libro y cuáles no; (4) \textbf{identificar} al menos 3 técnicas de escritura que puedes nombrar, describir y usar.

puentes:
  a_ruta: |-
    En G01 elegiste tu tema y escribiste el pitch. En G02 diseñaste la arquitectura del libro con el índice tentativo. Hoy estudias cómo otro autor construyó un capítulo de un libro similar al tuyo. Es la preparación técnica antes de la escritura: aprender el oficio antes de ejercerlo.
  a_escuta: |-
    La primera actividad de hoy requiere un libro real --- físico o digital --- del género que elegiste para tu propio libro. La actividad empieza con lectura activa: lápiz en mano, ojo de autor. No lees para entretenerte --- lees para aprender cómo está hecho.
  a_sistematizacion: |-
    Ya leíste el capítulo con ojo de autor y anotaste lo que encontraste. Ahora vamos a organizar esas observaciones en un mapa de estructura claro --- un documento que puedas usar como referencia cuando escribas tus propios capítulos en G06, G07 y G08.
  a_praxis: |-
    Tienes el mapa del capítulo ajeno. Ahora la pregunta clave: ¿qué de todo eso vale para \emph{tu} libro? No todo lo que funciona en un libro funciona en cualquier libro. Vas a evaluar con criterio propio qué replicar, qué adaptar y qué descartar.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy. Léelo antes de cerrar el cuaderno.
  a_evaluacion: |-
    Antes de cerrar, cinco dimensiones para mirar lo que aprendiste hoy sobre el oficio de escribir.
  a_triangulo: |-
    Tres voces que hablan del aprendizaje por observación --- la vía más antigua y más honesta de aprender un oficio.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Leer con ojo de autor} (20 min · individual). Toma el capítulo que elegiste del libro de tu género. Léelo dos veces: la primera como lector normal, la segunda con lápiz en mano. En la segunda lectura, marca: (a) la primera oración o párrafo --- el gancho; (b) el momento en que el tema central aparece por primera vez; (c) cualquier cambio de ritmo, tono o dirección; (d) la última oración o párrafo --- el cierre. Anota al margen una palabra que describa qué \emph{hace} el autor en cada sección marcada.
  checks:
    - Leí el capítulo dos veces: una como lector, otra con lápiz marcando estructura.
    - Identifiqué el gancho, el momento de aparición del tema central y el cierre.
    - Tengo al menos 3 anotaciones al margen que describen lo que el autor HACE (no lo que DICE).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Lectura con ojo de autor». \textbf{Formato:} tabla de 3 columnas: Sección del capítulo $|$ Qué hace el autor $|$ Cómo lo hace (técnica). Mínimo 5 filas: gancho, aparición del tema, 2 momentos de desarrollo, cierre. \textbf{Sabes que terminaste cuando} la columna ``Qué hace'' describe acciones del autor (``presenta un dato inesperado'', ``hace una pregunta directa al lector'') --- no el contenido del capítulo.

sistematizacion:
  intro: |-
    Las observaciones del capítulo ajeno son el material en bruto. Ahora vamos a ordenarlas en un \textbf{mapa de arquitectura} --- un esquema que muestre cómo está construido ese capítulo de principio a fin. Este mapa es reutilizable: lo vas a usar como plantilla cuando escribas tus propios capítulos.
  pilares:
    - |-
      \textbf{Descomposición:} descomponer el capítulo en sus partes mínimas: Gancho · Presentación del tema · Desarrollo (bloques temáticos) · Transiciones · Cierre. ¿Cuántos párrafos tiene cada parte?
    - |-
      \textbf{Patrones:} ¿qué patrón usa el autor para organizar el desarrollo? ¿Problema-solución, causa-efecto, cronológico, comparativo? Nombrar el patrón te permite replicarlo conscientemente.
    - |-
      \textbf{Abstracción:} de todo lo que analizaste, ¿cuáles son las 3 decisiones del autor que más explican por qué el capítulo funciona? Solo 3, las más importantes.
    - |-
      \textbf{Algoritmo:} dibuja el mapa del capítulo como un diagrama de bloques: cada parte es un bloque, el tamaño relativo representa la extensión, las flechas muestran las transiciones. No necesita ser bonito --- necesita ser preciso.
  anatomia:
    titulo: Las 5 partes de un capítulo bien construido
    body: |-
      \textbf{1. Gancho} (1--3 párrafos): engancha al lector antes de que decida irse. Puede ser una imagen, una pregunta, un dato sorprendente, una escena o una contradicción. \\[2mm] \textbf{2. Presentación del tema} (1--2 párrafos): dice de qué va el capítulo sin decirlo todo todavía. La promesa del capítulo. \\[2mm] \textbf{3. Desarrollo} (el cuerpo): los bloques temáticos en el orden que el autor eligió. Aquí está el 80\% del capítulo. \\[2mm] \textbf{4. Transiciones} (entre bloques): las frases o párrafos cortos que conectan un bloque con el siguiente. Sin transiciones, el lector se pierde. \\[2mm] \textbf{5. Cierre} (1--2 párrafos): no resume --- transforma. Deja al lector con algo que no tenía al principio: una idea nueva, una pregunta abierta o un impulso de seguir leyendo.
  errores_comunes: |-
    (1) Confundir el contenido del capítulo con su estructura --- ``el capítulo habla de X'' no es análisis de arquitectura. (2) Creer que todos los capítulos buenos siguen la misma estructura --- no la siguen. (3) Analizar solo lo que confirma lo que ya pensabas y saltarse lo que desafía. (4) Analizar un capítulo de un género distinto al tuyo --- el patrón de un ensayo filosófico no sirve para un libro de aventuras.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Mapa de arquitectura del capítulo analizado». \textbf{Formato:} (a) diagrama de bloques del capítulo con las 5 partes etiquetadas + (b) lista de las 3 decisiones del autor más importantes con 1 renglón explicando por qué cada una funciona. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} el diagrama muestra 5 partes diferenciadas y las 3 decisiones están explicadas en términos de efecto sobre el lector.

praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- ¿Qué replico en mi libro?} (15 min · individual). Tienes el mapa del capítulo ajeno. Ahora viene la pregunta más importante del día: ¿qué de todo eso sirve para \emph{tu} libro? Tu género, tu tema y tu lector ideal son distintos. Vas a evaluar con criterio propio qué replicar, qué adaptar y qué descartar.
  pilares:
    - |-
      \textbf{Gancho:} ¿qué tipo de gancho usó el autor? ¿Ese mismo tipo funciona para tu tema y tu lector? Si no, ¿qué tipo de gancho sería más honesto para tu libro?
    - |-
      \textbf{Patrón de desarrollo:} ¿el patrón del autor (problema-solución, cronológico, comparativo) se puede aplicar a tus capítulos? Si no, ¿cuál patrón se ajusta mejor a tu índice tentativo?
    - |-
      \textbf{Transiciones y cierre:} ¿cómo conectó el autor los bloques? ¿Cómo cerró? ¿Puedes usar esas técnicas en tu propio libro o necesitas adaptarlas?
    - |-
      \textbf{Algoritmo de decisión:} para cada elemento analizado (gancho, patrón, transiciones, cierre), marca: REPLICO tal cual · ADAPTO así · DESCARTO porque. Esa decisión justificada es el comienzo de tu voz de autor.
  checklist:
    titulo: Checklist de la evaluación antes de cerrar el cuaderno
    items: |-
      \checkbox Evalué los 4 elementos: gancho, patrón de desarrollo, transiciones y cierre. \\[1mm] \checkbox Cada elemento tiene una decisión marcada (REPLICO · ADAPTO · DESCARTO) con justificación. \\[1mm] \checkbox La justificación menciona mi tema, mi lector o mi índice tentativo --- no solo preferencia personal. \\[1mm] \checkbox Tengo al menos 1 elemento que voy a ADAPTAR (no copiar igual ni descartar por completo). \\[1mm] \checkbox La reflexión final dice algo concreto que no sabía sobre escritura antes de esta sesión.
  plantilla_guion: |-
    \textbf{Gancho del capítulo analizado:} \textit{[tipo: imagen / pregunta / dato / escena / otro]} \\[1mm] \textbf{Mi decisión:} REPLICO / ADAPTO / DESCARTO --- porque \textit{[justificación de 1 renglón]}. \\[2mm] \textbf{Patrón de desarrollo:} \textit{[nombre del patrón]} \\[1mm] \textbf{Mi decisión:} REPLICO / ADAPTO / DESCARTO --- porque \textit{[justificación]}. \\[2mm] \textbf{Transiciones:} \textit{[descripción breve de cómo las usa el autor]} \\[1mm] \textbf{Mi decisión:} REPLICO / ADAPTO / DESCARTO --- porque \textit{[justificación]}. \\[2mm] \textbf{Cierre:} \textit{[descripción breve de cómo cierra el autor]} \\[1mm] \textbf{Mi decisión:} REPLICO / ADAPTO / DESCARTO --- porque \textit{[justificación]}. \\[2mm] \textbf{Reflexión final (3 renglones):} Antes de esta sesión no sabía que... Ahora puedo...
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} Título: «Actividad 3 --- Qué replico en mi libro». \textbf{Formato:} plantilla de 4 elementos con decisión y justificación + reflexión final de 3 renglones. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} cada decisión tiene justificación que menciona tu libro específico y la reflexión dice algo nuevo que aprendiste sobre escritura hoy.
  producto_titulo: Análisis de arquitectura de 1 capítulo real + decisiones de réplica para el libro propio
  criterios:
    - La tabla de análisis describe lo que el autor HACE (técnica) --- no solo lo que DICE (contenido)
    - El mapa de arquitectura muestra 5 partes diferenciadas con tamaño relativo y transiciones
    - Las 3 decisiones más importantes del autor están explicadas en términos de efecto sobre el lector
    - La evaluación de réplica tiene decisión justificada para los 4 elementos (gancho, patrón, transiciones, cierre)
    - La reflexión final nombra algo concreto aprendido sobre escritura --- no sobre el contenido del libro analizado

triangulo:
  dussel:
    autor: Enrique Dussel
    cita: Aprender del Otro es el primer acto de humildad que hace posible la sabiduría.
    aplicacion: |-
      Analizar el libro de otro autor no es reconocer su superioridad --- es reconocer que el Otro sabe algo que tú todavía no sabes, y que eso es valioso. Dussel llamaría a este acto ``escuchar la voz del Otro'': el que solo lee sus propios textos no aprende, circula. El cuentero del fogón que aprendía escuchando a los mayores practicaba esta humildad antes de que existiera la filosofía.
    pregunta_espejo: ¿Cuándo fue la última vez que aprendiste algo importante prestando atención a cómo otro hace lo que tú quieres aprender a hacer?
  estoico:
    autor: Séneca
    cita: Recoge y guarda el conocimiento que puede salvarte en la tormenta.
    aplicacion: |-
      El análisis del capítulo ajeno es una reserva para cuando venga la tormenta de la escritura --- el capítulo que no arranca, el párrafo que no cierra, el ritmo que se pierde. Tener nombradas las técnicas es tenerlas disponibles cuando más se necesitan. Séneca diría que el autor que no estudia a otros autores llega desarmado a su propia escritura.
    pregunta_espejo: ¿Qué técnica del capítulo que analizaste hoy guardarías como reserva para cuando la escritura se ponga difícil?
  floridi:
    autor: Luciano Floridi
    cita: Comprender la arquitectura de la información es condición necesaria para producirla con responsabilidad.
    aplicacion: |-
      Un libro es una arquitectura de información: cada párrafo, cada transición, cada cierre de capítulo es una decisión sobre cómo el lector construirá su comprensión. Entender cómo otros construyen esa arquitectura --- antes de construir la propia --- es lo que distingue al autor responsable del que produce sin conciencia. Floridi diría que la escritura inversa es ética antes de ser técnica.
    pregunta_espejo: ¿Cómo afecta al lector la arquitectura que elegiste para tu libro? ¿Lo guía o lo confunde?

compromiso: |-
  \textbf{Para la próxima sesión.} Busca un capítulo más --- del mismo libro o de otro del mismo género --- y léelo una sola vez con ojo de autor. No lo analices con la plantilla: solo lee y anota mentalmente qué te engancha y qué te pierde. Esa segunda observación informal confirmará o corregirá lo que encontraste hoy. Trae esa observación en 2 renglones a la próxima sesión.

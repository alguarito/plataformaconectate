grado: 10
periodo: 1
sesion: 4
completo: true
duracion_min: 90
titulo: Iterar y refinar texto con IA --- del borrador al capítulo terminado
titulo_portada: |-
  Iterar y refinar ---
  del borrador al
  capítulo terminado
producto_final: Un capítulo en 3 versiones progresivas, con bitácora de cambios, comparación lado a lado y una reflexión honesta sobre cuánto del texto final es tuyo
apertura:
  saber_ancestral: |-
    En el norte del Valle hay un oficio hermano del bordado que trabaja quitando en vez de poniendo: el \textbf{calado}. Ansermanuevo se llama a sí misma cuna del calado y el bordado, y lo celebra cada agosto en sus fiestas (Soy Valle, s. f.). La técnica base es el deshilado. Se retiran hilos de la trama o de la urdimbre de la tela y se reagrupan con puntadas los que quedan, hasta que el vacío mismo dibuja. Hay oficios enteros, entonces, donde parte del trabajo consiste en deshacer. Y donde lo que se ve por delante depende de lo que se hizo por detrás. La \textbf{cara de exclusión} es la misma del bordado. Es un oficio precario, y el reconocimiento patrimonial en curso no equivale a un ingreso digno para las artesanas.
  origen: Caladoras de Ansermanuevo · el deshilado, donde el vacío dibuja
  fuente: |-
    Soy Valle. (s.\,f.). \emph{Ruta del bordado y el calado: Ansermanuevo, Cartago}. Consultado en 2026.
  saber_contemporaneo: |-
    La \textbf{iteración} es refinar un texto en varias versiones, cada una con un propósito distinto. En el oficio editorial se sabe hace mucho que el primer borrador nunca es el definitivo, y con IA generativa eso es más cierto, no menos. Una iteración típica tiene tres versiones. La \textbf{V1} es el borrador que sale del prompt profesional: captura estructura e ideas, pero suele traer lugares comunes y voz de chatbot. La \textbf{V2} es la revisión, donde le pides a la herramienta cambios concretos sobre ese texto. La \textbf{V3} es la versión con tu voz, y esa lleva escritura tuya directa. Sin eso, la V3 es una V2 disfrazada.
  pregunta_puente: |-
    ¿Por qué un oficio entero se construye quitando hilos en vez de poniéndolos? ¿Y qué pasa cuando alguien entrega el primer borrador de una IA sin haberle quitado nada?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} en tu borrador qué material sirve y qué es relleno --- lugares comunes, repeticiones, frases vacías; (2) \textbf{aplicar} prompts de revisión concretos para producir una segunda versión mejor; (3) \textbf{evaluar} con honestidad cuánto de la versión final es tuyo y declararlo.
puentes:
  a_ruta: |-
    En la sesión 3 conseguiste un primer borrador con un prompt profesional. Hoy lo conviertes en un capítulo. Entre esas dos cosas hay varias vueltas, y ninguna la hace sola la herramienta.
  a_escuta: |-
    Antes de teorizar, vas a leer tu propio borrador con lápiz en mano y a marcarlo. Solo cuando veas cuánto sobra vas a saber qué pedirle a la herramienta en la segunda vuelta.
  a_sistematizacion: |-
    Ya marcaste el borrador. Ahora vas a entender la \textbf{anatomía de la iteración}: las tres versiones, cómo se escribe un prompt de revisión y qué errores hacen que la última versión no sea de nadie.
  a_praxis: |-
    Tienes el método. Toca aplicarlo. Generas la segunda versión con prompts de revisión, escribes a mano los puntos críticos de la tercera y documentas cada cambio.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: las tres versiones, la bitácora de cambios y la reflexión. El criterio principal es que la versión final te suene a ti al leerla en voz alta.
  a_evaluacion: |-
    Antes de cerrar, mira la iteración desde las cinco dimensiones humanas. Quitar lo que sobra de un texto propio cuesta, y esa dificultad es parte del oficio.
  a_triangulo: |-
    Y para terminar, tres voces sobre volver sobre lo hecho. Dussel sobre el rodeo que hace posible la cercanía, Marco Aurelio sobre cambiar de parecer, Floridi sobre no saber cuál mitad sobra.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El borrador bajo la lupa} (15 min · individual). (1) Abre o imprime el borrador que generaste en la sesión 3. (2) Recórrelo entero marcando cada fragmento con una etiqueta: lugar común, repetición, relleno, dato sin verificar, voz ajena o material que sirve. (3) Cuenta cuántas marcas hay de cada tipo. (4) Calcula qué parte del texto se queda y qué parte hay que reescribir. (5) Anota la frase que más te molestó al releerla.
  checks:
  - |-
    Marqué el borrador completo, no solo los primeros párrafos.
  - |-
    Conté cuántas marcas hay de cada tipo.
  - |-
    Estimé qué parte del texto se queda y qué parte se reescribe.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- El borrador bajo la lupa». \textbf{Formato:} tabla con una fila por etiqueta y su conteo, la parte del texto que se queda y la frase que más te molestó. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} sabes qué pedirle a la herramienta en la segunda vuelta.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- Prompts de revisión} (20 min · parejas). (1) Con tu pareja, escriban las tres versiones con el propósito de cada una. (2) A partir de tus marcas, escribe entre tres y cinco prompts de revisión concretos. (3) Intercambien los prompts y marquen cuáles son vagos. (4) Reescriban juntos los vagos hasta que digan un cambio verificable.
  pilares:
  - |-
    Las tres versiones se descomponen así. La \textbf{V1} sale de una sola pasada del prompt profesional: tu trabajo con ella es producirla y marcarla, no aprobarla. La \textbf{V2} nace de pedirle a la herramienta cambios concretos sobre ese texto. La \textbf{V3} lleva escritura tuya directa en los puntos donde la voz se nota.
  - |-
    Un prompt de revisión útil nombra un cambio verificable sobre un texto que le pegas. «Reescribe la primera oración como una pregunta» sirve. «Mejóralo» no sirve, porque no dice qué se va a comparar después. La diferencia entre los dos es si puedes decir, al leer la respuesta, si el cambio se hizo o no.
  - |-
    Todo se juega en una regla: una versión final sin mano humana directa no es final, es la segunda disfrazada. Los puntos donde más se nota la voz son la apertura, el cierre y los ejemplos propios. Si esos tres los escribió la herramienta, el capítulo va a sonar a herramienta por más vueltas que le des.
  - |-
    Algoritmo: (1) toma la V1 marcada; (2) escribe tres a cinco prompts de revisión; (3) genera la V2; (4) imprímela y toma lápiz; (5) reescribe a mano la apertura, el cierre y uno o dos ejemplos propios; (6) pasa a limpio la V3; (7) llena la bitácora con cada cambio y su razón.
  anatomia:
    titulo: Anatomía de la iteración
    body: |-
      \textbf{V1:} borrador de la herramienta con el prompt profesional. \\[1mm] \textbf{V2:} revisión con prompts concretos y verificables. \\[1mm] \textbf{V3:} voz propia, escrita a mano en los puntos críticos. \\[1mm] \textbf{Puntos críticos:} apertura, cierre y ejemplos propios. \\[1mm] \textbf{Regla:} sin mano humana no hay V3.
  errores_comunes: |-
    (1) Entregar la V1 como definitiva, cuando es material crudo. (2) Saltarse el marcado y pasar directo a pedir mejoras. (3) Escribir prompts de revisión vagos, que no permiten comprobar nada. (4) Dejar pasar los lugares comunes: «en un mundo donde», «cada vez más», «en pleno siglo XXI». (5) Producir una V3 sin una sola línea escrita por ti.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- Prompts de revisión». \textbf{Formato:} las tres versiones con su propósito, tus tres a cinco prompts de revisión y la corrección que hizo tu pareja de los que estaban vagos. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} cada prompt tuyo nombra un cambio que se puede comprobar.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Tres versiones y una reflexión} (40 min · individual). (1) Genera la V2 aplicando tus prompts de revisión. (2) Imprímela y reescribe a mano la apertura, el cierre y uno o dos ejemplos propios. (3) Pasa a limpio la V3 integrando lo que escribiste. (4) Llena la bitácora con versión, cambio, razón y resultado. (5) Arma la comparación de las tres versiones lado a lado. (6) Escribe cinco líneas sobre cuánto de este capítulo es tuyo, sin adornar la respuesta.
  pilares:
  - |-
    Tu trabajo se construye en tres piezas: las tres versiones del capítulo, la bitácora de cambios y la reflexión final. La bitácora es la que después te va a permitir iterar el capítulo 2 sin volver a esta guía.
  - |-
    Sigue el patrón «mano humana en los puntos críticos». No hace falta reescribir todo a mano. Basta con que la apertura, el cierre y uno o dos ejemplos propios los hayas escrito tú. Son los lugares donde quien lee reconoce si hay alguien detrás.
  - |-
    La bitácora tiene cuatro columnas: versión, cambio aplicado, razón del cambio y resultado. Al menos dos filas por versión. Lo que la hace útil es la columna de la razón, porque es la que se puede discutir.
  - |-
    Algoritmo: (1) V2 con los prompts de revisión; (2) V3 con mano propia en los puntos críticos; (3) bitácora; (4) comparación lado a lado por fragmento; (5) reflexión de cinco líneas. Si al escribirla tienes que decir que casi todo es de la herramienta, eso también es un resultado y hay que anotarlo.
  checklist:
    titulo: Checklist antes de entregar el capítulo
    items: |-
      \checkbox Borrador V1 con las marcas de lectura crítica. \\[1mm] \checkbox V2 generada con prompts de revisión concretos. \\[1mm] \checkbox V3 con apertura, cierre y ejemplos escritos a mano. \\[1mm] \checkbox Bitácora con al menos dos filas por versión. \\[1mm] \checkbox Comparación de las tres versiones lado a lado. \\[1mm] \checkbox Reflexión de cinco líneas sin adornos.
  plantilla_guion: |-
    \textbf{V1.} \textit{Borrador con marcas de lectura crítica.} \\[1mm] \textbf{V2.} \textit{Revisión con prompts concretos.} \\[1mm] \textbf{V3.} \textit{Voz propia en apertura, cierre y ejemplos.} \\[1mm] \textbf{Bitácora.} \textit{Versión, cambio, razón y resultado.} \\[1mm] \textbf{Comparación.} \textit{Las tres versiones, fragmento por fragmento.} \\[1mm] \textbf{Reflexión.} \textit{Cinco líneas sobre cuánto es tuyo.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Capítulo iterado». \textbf{Formato:} la referencia a las tres versiones, la bitácora, la comparación y la reflexión de cinco líneas. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} lees la V3 en voz alta y te suena a ti.
  producto_titulo: 3 versiones del capítulo, bitácora de cambios, comparación y reflexión
  criterios:
  - Tres versiones progresivas del capítulo, con propósito distinto cada una
  - Prompts de revisión que nombran cambios verificables
  - Apertura, cierre y ejemplos escritos a mano en la versión final
  - Bitácora con al menos dos cambios documentados por versión
  - Comparación de las tres versiones fragmento por fragmento
  - Reflexión honesta sobre cuánto del capítulo es propio
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.2.1.1
    cita: |-
      El maestro y el discípulo deben apartarse para preparar en la vida su discurso futuro… El rodeo de la lejanía hace posible la proximidad futura.
    aplicacion: |-
      Un texto recién escrito no se puede corregir bien. Hace falta apartarse: dejarlo, imprimirlo, leerlo en voz alta, verlo con otra letra. Ese rodeo es lo que permite leerlo como lo leería alguien más. Sin distancia, uno corrige comas y deja intacto lo que estaba mal desde el principio.
    pregunta_espejo: |-
      ¿Leí mi borrador como si fuera de otro, o lo leí defendiéndolo?
  estoico:
    autor: Marco Aurelio · Meditaciones VIII, 16 (c. 175 d.C.)
    cita: |-
      Acuérdate que igualmente te es libre el mudar de parecer y el seguir el aviso de quien te corrija.
    aplicacion: |-
      Iterar es cambiar de parecer sobre lo que uno mismo escribió. La resistencia no viene de la herramienta: viene de que ya invertiste tiempo en esa versión. En el calado, quitar hilos es parte del trabajo y nadie lo vive como una pérdida.
    pregunta_espejo: |-
      ¿Qué fragmento defendí solo porque me costó escribirlo?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    cita: |-
      Parafraseando un dicho de la publicidad: la mitad de nuestros datos es basura, solo que no sabemos cuál mitad. Lo que necesitamos es entender mejor qué datos vale la pena conservar. (trad. propia)
    aplicacion: |-
      Con un borrador generado pasa igual: buena parte sobra y el problema es saber cuál. Por eso la actividad 1 no es un trámite. Marcar el texto es lo que convierte una intuición vaga de que algo no está bien en una lista de cosas que se pueden pedir.
    pregunta_espejo: |-
      ¿Sabría señalar con el dedo qué mitad de mi borrador sobra, o solo siento que sobra algo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la versión final del capítulo, la bitácora y la reflexión. En la sesión 5 vas a afinar la estructura completa del libro: el arco, el ritmo y el peso de cada capítulo. Lo que aprendiste iterando uno se aplica a los diez.
web:
  resumen: |-
    Conviertes un borrador de IA en un capítulo tuyo en tres versiones: marcar lo que sobra, pedir cambios concretos y escribir a mano los puntos donde se nota la voz.
  subtema: Oficio editorial · Iterar y refinar
  pre_lectura:
    por_que_importa: |-
      El primer borrador nunca es el definitivo, ni siquiera para quien escribe hace años. Lo que decide la calidad del capítulo es qué le quitas, no cuánto le agregas.
    pregunta_detonante: |-
      Si tuvieras que borrar la mitad de tu borrador, ¿sabrías cuál mitad?
    activacion:
      titulo: La frase que más molesta
      descripcion: |-
        En 3 minutos, lee tu borrador y subraya la frase que más te incomoda al releerla. No la corrijas todavía. Solo mírala.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 3 conseguiste el primer borrador con un prompt de cinco partes.
      siguiente: |-
        En la sesión 5 pasas del capítulo suelto a la estructura del libro completo.

  conceptos_clave:
  - categoria: Las tres versiones
    termino: V1, el borrador
    definicion: |-
      Lo que sale de una sola pasada del prompt profesional. Es material crudo: se produce y se marca, no se aprueba.
    ejemplo: |-
      Trae la estructura y las ideas, y también los lugares comunes que nadie le pidió evitar.
  - categoria: Las tres versiones
    termino: V2, la revisión
    definicion: |-
      El texto que resulta de pedirle a la herramienta cambios concretos sobre el borrador marcado.
    ejemplo: |-
      «Reescribe la apertura como una escena, sin pregunta retórica» produce una V2 comparable.
  - categoria: Las tres versiones
    termino: V3, la voz propia
    definicion: |-
      La versión con escritura tuya directa en los puntos donde se nota la voz. Sin ella, es una V2 disfrazada.
    ejemplo: |-
      Apertura, cierre y un ejemplo tomado de tu propia experiencia, escritos a mano.
  - categoria: Cómo se pide un cambio
    termino: Prompt de revisión
    definicion: |-
      Una instrucción que nombra un cambio verificable sobre un texto que le pegas a la herramienta.
    ejemplo: |-
      «Mejóralo» no permite comprobar nada; «quita las tres frases de relleno del párrafo 2» sí.
  - categoria: Cómo se pide un cambio
    termino: Puntos críticos
    definicion: |-
      Los lugares donde quien lee reconoce si hay alguien detrás: la apertura, el cierre y los ejemplos propios.
    ejemplo: |-
      Un capítulo con buen cuerpo pero apertura genérica se lee como texto de máquina.
  - categoria: Cómo se pide un cambio
    termino: Bitácora de cambios
    definicion: |-
      El registro de qué cambió en cada versión, por qué y con qué resultado. La columna de la razón es la que vale.
    ejemplo: |-
      «Quité el ejemplo del comienzo porque repetía lo que el segundo párrafo ya decía.»
  cinco_dimensiones:
    personal: |-
      Aprendes a leer lo tuyo con distancia. Es la misma capacidad que hace falta para revisar un trabajo, una carta o una decisión.
    emocional: |-
      Quitar lo que costó escribir duele un poco. Reconocer esa resistencia es lo que impide que decida por ti.
    ciudadana: |-
      Declarar cuánto del texto es tuyo y cuánto de la herramienta es honestidad sobre el proceso, y hoy es una pregunta que se hace en serio.
    local: |-
      En el calado se retiran hilos hasta que el vacío dibuja. Hay oficios enteros donde parte del trabajo consiste en deshacer.
    intergeneracional: |-
      El reconocimiento patrimonial de un oficio no equivale a un ingreso digno para quien lo ejerce. Eso también se hereda.
  post_lectura:
    transferencia: |-
      Llega a la próxima sesión con la versión final, la bitácora y la reflexión. Lo que aprendiste iterando un capítulo se aplica a los diez que faltan.
  quiz:
    titulo: Verifica la iteración
    instrucciones: 5 preguntas para confirmar que sabes convertir un borrador en un capítulo. Necesitas 3/5 para continuar.
    preguntas:
    - enunciado: ¿En cuál de las tres versiones es indispensable que escribas tú directamente?
      opciones:
      - En la primera, para que el borrador salga desde el comienzo con tu manera de escribir
      - En la segunda, cuando ya sabes qué hay que corregir del borrador inicial
      - En la tercera, donde apertura, cierre y ejemplos propios se escriben a mano
      - "En ninguna: basta con dar instrucciones cada vez más precisas a la herramienta"
      respuesta_index: 2
      feedback_correcto: |-
        Correcto. Una versión final sin mano humana directa es una segunda versión disfrazada.
      feedback_incorrecto: |-
        La primera es material crudo y la segunda sigue siendo de la herramienta. La voz entra en la tercera.
    - enunciado: ¿Cuál de estos es un prompt de revisión útil?
      opciones:
      - «Mejora este texto y hazlo más interesante para quien vaya a leerlo»
      - «Quita las frases de relleno del segundo párrafo y deja la idea principal»
      - «Revisa el capítulo completo y corrige todo lo que consideres necesario»
      - «Haz que suene más profesional, con un tono acorde al tema tratado»
      respuesta_index: 1
      feedback_correcto: |-
        Sí. Nombra un cambio que puedes comprobar al leer la respuesta. Los otros tres no se pueden verificar.
      feedback_incorrecto: |-
        «Mejorar» y «sonar profesional» no se pueden comprobar. Un prompt de revisión nombra un cambio verificable.
    - enunciado: ¿Por qué marcar el borrador antes de pedirle cambios a la herramienta?
      opciones:
      - Porque el marcado convierte la intuición de que algo falla en una lista de cosas que pedir
      - Porque la herramienta funciona mejor si recibe el texto con anotaciones incorporadas
      - Porque es la forma de dejar constancia de que el trabajo se hizo en clase y no en casa
      - Porque leer en papel siempre resulta más cómodo que leer en la pantalla del equipo
      respuesta_index: 0
      feedback_correcto: |-
        Correcto. Sin marcar, uno pide «mejóralo», que es justo el prompt que no sirve.
      feedback_incorrecto: |-
        No es por la herramienta ni por el papel. Es para saber qué pedir exactamente.
    - enunciado: ¿Qué columna hace realmente útil la bitácora de cambios?
      opciones:
      - La de la versión, porque permite saber en qué orden ocurrió cada modificación
      - La del cambio, porque describe con precisión qué fue lo que se hizo en el texto
      - La del resultado, porque indica si el texto quedó mejor después del ajuste
      - La de la razón, porque es la única que se puede discutir con alguien más
      respuesta_index: 3
      feedback_correcto: |-
        Sí. Un cambio sin razón escrita no se puede evaluar después, ni por ti ni por nadie.

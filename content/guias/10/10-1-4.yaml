clave: 1-4
grado: 10
periodo: 1
sesion: 4
completo: true
titulo: Iterar y refinar texto con IA --- del borrador al capítulo terminado
titulo_portada: |-
  Iterar y refinar ---
  del borrador
  al capítulo terminado
producto_final: |-
  1 capítulo completo de tu libro iterado en al menos 3 versiones progresivas (v1 primer borrador con prompt profesional, v2 ajustes editoriales con prompt de revisión, v3 versión final con voz propia hecha a mano) + bitácora de cambios documentando cada decisión editorial tomada en cada iteración + comparación lado a lado de las 3 versiones identificando qué cambió y por qué + reflexión de 5 líneas sobre qué tanto del capítulo final es \emph{tuyo}
apertura:
  saber_ancestral: |-
    En los talleres de carpintería del barrio Obrero, hay un gesto que cualquier aprendiz aprende el primer mes: \textbf{el ebanista nunca lija una pieza con una sola lija}. Cuando termina de cortar y armar las uniones, la pieza queda áspera. El ebanista toma la \textbf{primera lija, grano grueso} (~80), y pasa firme. La pieza queda mejor pero aún áspera. Toma la \textbf{segunda, grano medio} (~150), y vuelve a pasar: ya se siente más suave. Toma la \textbf{tercera, grano fino} (~220), y pasa una última vez. Recién entonces la superficie está lista para el barniz. Si el ebanista se salta una lija, la pieza queda con marcas visibles. Si insiste con la gruesa, daña la madera. Cada lija quita lo justo y revela lo que el grano anterior dejó. La sabiduría es ancestral: \textbf{ninguna superficie buena se logra en un solo paso}. Iterar texto con IA es esa disciplina aplicada a las palabras: el primer borrador es áspero, el segundo más suave, el tercero está listo para firmar.
  saber_contemporaneo: |-
    La \textbf{iteración} es el proceso de refinar un texto en varias versiones progresivas, cada una con propósito distinto. La regla profesional del oficio editorial moderno: \textbf{el primer borrador nunca es el definitivo}, ni siquiera para escritores humanos veteranos. Con IA generativa esto es más cierto, no menos. Una iteración profesional típica tiene 3 versiones: (1) \textbf{V1 --- Borrador inicial}: producido con prompt profesional (sesión 3) en una sola pasada. Captura la estructura básica, las ideas principales, el tono aproximado. (2) \textbf{V2 --- Revisión editorial}: el editor (tú) le pide a la IA que revise el borrador con instrucciones específicas (\emph{``mejora la apertura, reduce el cliché en el párrafo 3, ajusta el tono para hacerlo más íntimo, elimina las frases hechas''}). (3) \textbf{V3 --- Versión final con voz propia}: el editor reescribe a mano (sin IA) los fragmentos clave para incrustar su voz, añadir ejemplos personales, ajustar el ritmo. La regla irrenunciable: \textbf{V3 nunca es generada por IA en su totalidad}; siempre tiene intervención humana directa en al menos un 20-30 por ciento del texto final.
  pregunta_puente: |-
    ¿Qué sabía el ebanista al pasar 3 lijas distintas en orden, que el usuario novato olvida cuando entrega el primer borrador de ChatGPT como capítulo final? ¿Y por qué V3 es donde el libro empieza a sonar a ti, no a la IA?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} en qué partes del primer borrador hay material útil y en qué partes hay relleno generativo (frases vacías, clichés, repeticiones); (2) \textbf{aplicar} prompts de revisión específicos para que la IA mejore el borrador en aspectos concretos; (3) \textbf{analizar} las diferencias entre las 3 versiones identificando qué decisiones editoriales tomaste; (4) \textbf{evaluar} qué tanto del capítulo final es realmente tuyo y declararlo con honestidad.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 3 aprendiste a pedir profesionalmente. Hoy aprendes a \emph{refinar} lo que la IA produce. Las próximas sesiones (estructura editorial, derechos, portada, diagramación) construyen sobre tu capacidad de iterar con criterio. Sin iteración, los capítulos quedan crudos.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lectura crítica}: toma el capítulo 1 borrador que generaste en la sesión 3 y léelo con lápiz rojo. Sin reescribir todavía, anota en los márgenes: cliché, repetición, frase vacía, idea buena, voz que no es mía, dato a verificar.
  a_sistematizacion: |-
    Ya tienes el borrador marcado. Ahora vas a entender la \textbf{anatomía de la iteración profesional}: las 3 versiones, los tipos de prompt de revisión, los 6 errores típicos del editor que se queda en V1 (delegar todo a la IA, no marcar el borrador, sin V3 escrita a mano, aceptar clichés, ocultar la voz propia, declarar como final lo que sigue siendo de la IA).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: produces V2 con prompt de revisión, V3 a mano con tu voz, bitácora de cambios, comparación lado a lado, reflexión sobre qué tanto del capítulo es tuyo.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: V1 + V2 + V3 + bitácora + comparación + reflexión. El criterio principal: que después de leer V3 cualquiera diga \emph{``esto suena a una persona real, no a un chatbot''}.
  a_evaluacion: |-
    Antes de cerrar, mira la iteración desde las cinco dimensiones humanas. Iterar con disciplina es respeto por el lector futuro; entregar V1 sin pasar por V3 es traicionar el oficio editorial.
  a_triangulo: |-
    Y para terminar, tres voces sobre el refinamiento. Dussel sobre la voz propia que se inscribe en el texto, Epicteto sobre la paciencia de las 3 lijas, Floridi sobre la edición humana como ancla de calidad.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Lectura crítica del borrador V1} (15 min · individual). Imprime o abre el capítulo 1 borrador que generaste con prompt profesional en la sesión 3. Con lápiz rojo o marcadores digitales, recorre el texto completo y marca cada fragmento con una de estas 6 etiquetas: \textbf{cliché} (frase usada hasta el cansancio), \textbf{repetición} (idea ya dicha antes), \textbf{frase vacía} (texto sin información), \textbf{idea buena} (algo que merece quedarse), \textbf{voz que no es mía} (suena a chatbot, no a ti), \textbf{dato a verificar} (afirmación que no sabes si es cierta). Cuenta cuántas marcas hay de cada tipo.
  checks:
  - Marqué el borrador completo con las 6 etiquetas.
  - Conté cuántas marcas de cada tipo hay.
  - Identifiqué qué porcentaje del texto pasa la primera lectura crítica.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Borrador bajo la lupa». \textbf{Formato:} tabla con 6 filas (etiqueta, conteo) + porcentaje aproximado de texto que se queda vs se reescribe. \textbf{Sabes que terminaste cuando} ves que el V1 necesita lijas.
sistematizacion:
  intro: |-
    El borrador marcado te muestra el material crudo. Ahora necesitas la \textbf{anatomía profesional} de la iteración: las 3 versiones, los prompts de revisión, los errores típicos.
  pilares:
  - |-
    Las \textbf{3 versiones} se descomponen así: (1) \textbf{V1 Borrador IA}: una sola pasada del prompt profesional. Captura estructura e ideas principales pero suele tener clichés, repeticiones, voz genérica de chatbot. Tu trabajo aquí es producir y marcar, no aprobar. (2) \textbf{V2 Revisión editorial con prompt específico}: le pides a la IA que mejore aspectos concretos del V1. Ejemplos de prompts de revisión: \emph{``mejora la apertura, hazla más impactante''}, \emph{``elimina los clichés marcados con \char91X\char93 ''}, \emph{``reduce las repeticiones del párrafo 3''}, \emph{``ajusta el tono para hacerlo más íntimo''}. (3) \textbf{V3 Versión final con voz propia}: tú reescribes a mano (sin IA) los fragmentos clave: aperturas, cierres, ejemplos personales, frases icónicas que llevan tu sello. V3 nunca es generada por IA en su totalidad.
  - |-
    Los \textbf{prompts de revisión} más útiles tienen formato simple: \textbf{``Aplica X cambio específico al texto siguiente: \char91pega texto\char93 ''}. Ejemplos: (a) \emph{``Aplica este cambio: reescribe la primera oración como una pregunta provocadora''}. (b) \emph{``Aplica este cambio: reduce este párrafo a la mitad sin perder la idea principal''}. (c) \emph{``Aplica este cambio: elimina todas las frases que empiecen con \char92 en un mundo donde\char92 o \char92 cada vez más\char92 ''}. (d) \emph{``Aplica este cambio: ajusta el tono para que suene como una conversación con un amigo de 16 años, no como un manual''}.
  - |-
    Lo esencial cabe en una regla: \textbf{V3 sin intervención humana directa no es V3, es V2 disfrazada}. Si tu \emph{``versión final''} no tiene al menos un 20-30 por ciento de texto que escribiste a mano, todavía no es tuya. La phronesis del editor consiste en \textbf{aceptar la disciplina de la escritura humana en los puntos críticos del capítulo}: la apertura, los cierres, las frases que se citarán, los ejemplos personales.
  - |-
    Algoritmo: (1) tomar V1 con marcas. (2) escribir 3-5 prompts de revisión específicos. (3) generar V2 aplicando cada uno. (4) imprimir V2. (5) tomar lápiz: reescribir a mano la apertura, el cierre, 1-2 ejemplos personales, 1-2 frases icónicas. (6) digitar V3 integrando lo escrito a mano. (7) llenar bitácora con cada cambio. (8) hacer comparación lado a lado en tabla.
  anatomia:
    titulo: Anatomía de la iteración
    body: |-
      \textbf{V1:} borrador IA con prompt profesional. \\[1mm] \textbf{V2:} revisión con prompts específicos. \\[1mm] \textbf{V3:} voz propia con escritura humana directa. \\[1mm] \textbf{Regla:} V3 sin mano humana no es V3. \\[1mm] \textbf{Mínimo:} 20-30 por ciento del texto final escrito por ti.
  errores_comunes: |-
    (1) \textbf{Entregar V1 como definitivo}: la IA produce material crudo, no final. (2) \textbf{No marcar el borrador}: pasar a la siguiente etapa sin lectura crítica. (3) \textbf{V3 sin escritura humana directa}: usar IA para todas las versiones. (4) \textbf{Aceptar clichés}: dejar pasar \emph{``en un mundo donde''}, \emph{``cada vez más''}, \emph{``en pleno siglo XXI''}. (5) \textbf{Ocultar la voz propia}: dejar que el capítulo suene a chatbot por miedo a equivocarse. (6) \textbf{Declarar como final lo que aún es IA}: presentar V2 como V3.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía de la iteración». \textbf{Formato:} (a) las 3 versiones con propósito; (b) ejemplos de prompts de revisión; (c) los 6 errores con marca del que más temes cometer. \textbf{Sabes que terminaste cuando} podrías iterar el capítulo 2 sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- 3 versiones del capítulo + bitácora + reflexión} (40 min en sesión + tiempo en casa · individual). Hora de aplicar. Generas V2 con prompts de revisión, escribes V3 a mano integrando tu voz, llenas bitácora, haces comparación, escribes reflexión final.
  pilares:
  - |-
    Tu trabajo se construye en 6 pasos: (1) tomar V1 marcado de la Actividad 1. (2) escribir 3-5 prompts de revisión específicos basados en las marcas. (3) generar V2 aplicando cada prompt. (4) imprimir V2 y tomar lápiz: reescribir a mano la apertura, el cierre, 1-2 ejemplos personales, 1-2 frases que quieras que sean icónicas del capítulo. (5) digitar V3 integrando lo escrito a mano. (6) llenar bitácora, comparación y reflexión.
  - |-
    Sigue el patrón \textbf{``mano humana en los puntos críticos''}: no necesitas reescribir todo a mano; basta con que la apertura del capítulo, el cierre y 1-2 ejemplos personales estén escritos por ti directamente. Esos puntos críticos son donde la voz se nota más. Si la IA escribe la apertura, el lector siente chatbot desde la primera frase. Si tú la escribes, el resto del capítulo se siente humano aunque haya pasado por IA.
  - |-
    La bitácora de cambios tiene 4 columnas: (a) \textbf{Versión}: V1, V2 o V3. (b) \textbf{Cambio aplicado}: descripción breve del ajuste. (c) \textbf{Razón}: por qué hiciste ese cambio. (d) \textbf{Resultado}: si mejoró o no. Al menos 6 filas (mínimo 2 por versión).
  - |-
    Algoritmo: (1) V2 con prompts de revisión. (2) V3 con mano humana en puntos críticos. (3) bitácora. (4) comparación lado a lado en tabla (V1 vs V2 vs V3, 3 columnas, fila por fragmento). (5) reflexión de 5 líneas: ¿qué tanto del capítulo final es tuyo? Si tienes que decir \emph{``casi todo es de la IA''}, vuelve a V3 y aumenta la mano humana.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox V1 borrador con marcas de lectura crítica. \\[1mm] \checkbox V2 generada con prompts de revisión específicos. \\[1mm] \checkbox V3 con apertura, cierre y ejemplos escritos a mano. \\[1mm] \checkbox Bitácora con 6+ filas de cambios documentados. \\[1mm] \checkbox Comparación lado a lado en tabla. \\[1mm] \checkbox Reflexión de 5 líneas sobre autoría real. \\[1mm] \checkbox V3 con al menos 20-30 por ciento de escritura humana directa.
  plantilla_guion: |-
    \textbf{V1.} \textit{Borrador IA con marcas críticas.} \\[1mm] \textbf{V2.} \textit{Revisión con prompts específicos.} \\[1mm] \textbf{V3.} \textit{Voz propia con apertura/cierre/ejemplos a mano.} \\[1mm] \textbf{Bitácora.} \textit{6+ filas Versión-Cambio-Razón-Resultado.} \\[1mm] \textbf{Comparación.} \textit{Tabla 3 columnas lado a lado.} \\[1mm] \textbf{Reflexión.} \textit{5 líneas sobre cuánto del capítulo es mío.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- Capítulo iterado». \textbf{Formato:} (a) las 3 versiones del capítulo (referencia a archivos); (b) bitácora; (c) comparación; (d) reflexión. \textbf{Extensión:} V3 debe tener 6-10 páginas. \textbf{Sabes que terminaste cuando} V3 te suena a ti y no a chatbot.
  producto_titulo: V1 + V2 + V3 + bitácora + comparación + reflexión
  criterios:
  - 3 versiones progresivas del capítulo
  - V3 con escritura humana directa en puntos críticos
  - Bitácora con 6+ cambios documentados
  - Comparación lado a lado
  - Reflexión honesta sobre autoría
  - V3 suena a voz propia
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La voz propia inscrita en el texto es acto de dignidad cultural; aceptar la voz de la IA sin intervención es renunciar a la propia.
    aplicacion: |-
      Cuando dejas que V1 sea tu capítulo final, la IA habla por ti y tu voz desaparece del libro. La filosofía de la liberación pide lo opuesto: \textbf{inscribir voz propia en el texto, especialmente en los puntos críticos}. La apertura del capítulo es el primer encuentro con el lector; si suena a chatbot, perdiste la conexión humana antes de empezar. La phronesis del editor consiste en \textbf{reservar los puntos críticos para la mano humana}.
    pregunta_espejo: |-
      ¿Mi V3 tiene voz propia en los puntos críticos, o suena a chatbot disfrazado de capítulo?
  estoico:
    autor: Epicteto
    cita: |-
      La paciencia de las 3 lijas es virtud del oficio; el atajo del una sola pasada es engaño que se nota en la pieza final.
    aplicacion: |-
      Es tentador entregar V1 como definitivo porque \emph{``ya está escrito''}. La disciplina estoica recomienda lo opuesto: \emph{pasa las 3 lijas aunque tome tiempo}. El ebanista nunca se ahorra una lija; el editor profesional tampoco. La phronesis del oficio acepta que la calidad se logra por iteración, no por velocidad.
    pregunta_espejo: |-
      ¿Estoy pasando las 3 lijas con paciencia, o intento entregar V1 disfrazado de V3?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La edición humana directa es el ancla de calidad en la era de la producción acelerada por IA.
    aplicacion: |-
      En la era de la IA, miles de libros se publican sin intervención humana real. La ética digital pide editores humanos que firmen, decidan, escriban directamente en los puntos críticos. Tu V3 con escritura humana directa es ejemplo de esa práctica: \textbf{aporta ancla de calidad humana a la infosfera saturada}. Aunque sea proyecto escolar, el principio es el mismo que rige toda producción editorial profesional.
    pregunta_espejo: |-
      ¿Mi V3 aporta ancla de calidad humana al texto, o solo agrega más contenido generado a la pila?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con V3 del capítulo 1, bitácora y reflexión. En la sesión 5 vas a afinar la \textbf{estructura editorial completa} del libro: arco narrativo, ritmo, peso de cada capítulo. La iteración de hoy es la herramienta; la estructura de mañana es el plano de los 8-12 capítulos.
web:
  conceptos_clave:
    - termino: Iteración
      definicion: |-
        Proceso de refinar un texto en versiones progresivas. Cada versión tiene propósito distinto y se construye sobre la anterior.
      ejemplo: |-
        V1 captura estructura, V2 ajusta lo defectuoso, V3 imprime voz humana. Tres pasadas con propósito.
      emoji: "🔁"
    - termino: V1 — Borrador inicial
      definicion: |-
        Primera versión producida con prompt profesional. Captura estructura básica, ideas principales y tono aproximado.
      ejemplo: |-
        Le pides a la IA el capítulo 1 con prompt completo. Resultado, texto pasable que aún no es bueno.
      emoji: "1️⃣"
    - termino: V2 — Revisión editorial
      definicion: |-
        Segunda versión donde le pides a la IA que mejore aspectos concretos del V1 (apertura, cliché, tono, frases hechas).
      ejemplo: |-
        "Mejora la apertura, reduce los clichés del párrafo 3, ajusta el tono a más íntimo." Instrucción específica.
      emoji: "2️⃣"
    - termino: V3 — Versión final con voz propia
      definicion: |-
        Versión donde tú (sin IA) reescribes fragmentos clave para incrustar tu voz y ejemplos personales. Mínimo 20-30% humano.
      ejemplo: |-
        En la mitad del capítulo, agregas un párrafo personal sobre tu propio recuerdo. Esa firma humana es V3.
      emoji: "3️⃣"
    - termino: Intervención humana mínima
      definicion: |-
        Regla profesional irrenunciable. El V3 nunca es 100% generado por IA; el editor interviene al menos en 20-30% del texto final.
      ejemplo: |-
        En un capítulo de 6 páginas, al menos 1,5 páginas deben tener intervención humana directa (no solo aprobación).
      emoji: "✋"
  quiz:
    titulo: ¿Iteras como editor profesional?
    instrucciones: 5 preguntas para verificar que produces V3 con voz propia.
    preguntas:
      - enunciado: ¿Cuál es la regla profesional sobre el primer borrador?
        opciones:
          - El primer borrador nunca es el definitivo
          - Es siempre el definitivo
          - Hay que publicarlo tal cual
          - Solo importa el primer borrador
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. El primer borrador nunca es el definitivo, ni siquiera para autores humanos veteranos.
        feedback_incorrecto: |-
          El primer borrador nunca es el definitivo. Esto es más cierto con IA, no menos.
      - enunciado: ¿Cuántas versiones tiene una iteración profesional típica?
        opciones:
          - "1"
          - "10"
          - "3"
          - "100"
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. 3 versiones, cada una con propósito distinto.
        feedback_incorrecto: |-
          Son 3: V1 borrador inicial, V2 revisión editorial, V3 versión con voz propia.
      - enunciado: ¿En cuál versión es OBLIGATORIA la intervención humana directa?
        opciones:
          - V1
          - V2
          - Ninguna
          - V3
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. V3 nunca se genera completamente con IA. La intervención humana es irrenunciable.
        feedback_incorrecto: |-
          En V3. Al menos 20-30% del texto final debe tener intervención humana directa.
      - enunciado: En V2, ¿qué pides a la IA?
        opciones:
          - Que repita lo mismo
          - Mejoras específicas (apertura, clichés, tono, frases hechas)
          - Que invente nuevos personajes
          - Que cambie todo
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. En V2 se piden mejoras específicas al borrador inicial, no reescritura completa.
        feedback_incorrecto: |-
          Se piden mejoras específicas. "Mejora la apertura, reduce clichés, ajusta tono." Instrucciones puntuales.
      - enunciado: ¿Qué porcentaje mínimo de intervención humana exige V3?
        opciones:
          - "0%"
          - "100%"
          - "20-30%"
          - "1%"
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Mínimo 20-30%. Sin esa firma humana, V3 deja de ser tuyo.
        feedback_incorrecto: |-
          Mínimo 20-30%. Es lo que distingue tu libro de un libro 100% generado por IA.

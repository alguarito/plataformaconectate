clave: 1-5
grado: 10
periodo: 1
sesion: 5
completo: true
titulo: Estructura editorial --- arco narrativo, ritmo y capítulos
titulo_portada: |-
  Estructura editorial ---
  arco narrativo,
  ritmo y capítulos
producto_final: |-
  Mapa estructural completo de tu libro de 80 páginas con (a) arco narrativo dividido en 3 actos (planteamiento ~25 por ciento, desarrollo ~50 por ciento, cierre ~25 por ciento), (b) 8-12 capítulos numerados con título definitivo y resumen de 2 líneas cada uno, (c) ritmo de páginas asignado por capítulo de manera coherente (no todos iguales: hay capítulos cortos y largos según función), (d) identificación de 3 capítulos pivote (apertura, mitad, cierre) que merecen más cuidado
apertura:
  saber_ancestral: |-
    En cualquier barrio del Valle del Cauca, cuando una familia decide construir su casa, el primer paso nunca es comprar ladrillos. El primer paso es \textbf{ir donde el arquitecto del barrio} (a veces un maestro de obra experimentado, a veces alguien con título formal). El arquitecto saca papel y lápiz, escucha a la familia (\emph{``somos 4, queremos 3 cuartos, una sala grande y un patio''}), pregunta por el terreno, mira el sol, dibuja. Lo que dibuja es \textbf{el plano}: dónde van las puertas para que se abran cómodas, dónde las ventanas para que entre luz al cuarto correcto, qué tan grande el patio para que no se ahogue la casa, qué pendiente del techo para que el agua corra. Solo después de aprobar el plano, la familia pide los ladrillos. Si la familia se salta el plano y empieza a poner ladrillos por entusiasmo, pasa lo conocido: la casa queda con cuartos oscuros, puertas que pegan, escaleras peligrosas, presupuesto desbordado. La sabiduría del barrio es ancestral y simple: \textbf{ningún edificio bueno se levanta sin plano previo}. Un libro es un edificio de palabras. La estructura editorial es ese plano antes de poner los capítulos.
  saber_contemporaneo: |-
    La \textbf{estructura editorial} es el plano del libro: cómo se ordena el contenido, qué peso tiene cada parte, qué papel cumple cada capítulo en el todo. Sus 3 piezas obligatorias son: (1) \textbf{Arco narrativo en 3 actos}: estructura heredada de Aristóteles que sigue vigente. \textbf{Acto 1 --- Planteamiento} (25 por ciento del libro, ~20 páginas de 80): presenta el tema, los personajes o conceptos clave, el conflicto o pregunta central. \textbf{Acto 2 --- Desarrollo} (50 por ciento, ~40 páginas): profundiza, desarrolla, complica, propone. Es la zona más larga. \textbf{Acto 3 --- Cierre} (25 por ciento, ~20 páginas): resuelve, concluye, propone. (2) \textbf{Capítulos numerados y titulados}: 8-12 capítulos para un libro de 80 páginas, cada uno con función específica y peso asignado (no todos iguales). (3) \textbf{Capítulos pivote}: 3 capítulos que merecen más cuidado: el primero (engancha o pierde al lector), el de la mitad (sostiene o pierde el interés), el último (cierra o deja inconforme). La regla profesional: \textbf{los pivotes se escriben primero o se reescriben más veces}.
  pregunta_puente: |-
    ¿Qué sabía el arquitecto del barrio al dibujar el plano antes de pedir ladrillos, que el editor novato olvida cuando empieza a escribir capítulos sin haber pensado el arco completo? ¿Y por qué los 3 capítulos pivote merecen más cuidado que los demás?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} la escaleta de la sesión 2 contra el arco narrativo en 3 actos, identificando si tu planteamiento es muy largo, tu desarrollo muy corto o tu cierre muy débil; (2) \textbf{explicar} con tus palabras por qué los 3 capítulos pivote requieren más trabajo que los demás; (3) \textbf{crear} el mapa estructural completo con arco, capítulos definitivos, ritmo y pivotes identificados; (4) \textbf{evaluar} si tu estructura sostiene un libro de 80 páginas o necesita ajuste.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 2 hiciste escaleta preliminar; en la 3 escribiste prompts; en la 4 iteraste el capítulo 1. Hoy \emph{cierras la estructura completa}. Las próximas 5 sesiones (derechos, portada, diagramación, producción, sustentación) asumen que tu estructura está definida. Sin estructura clara hoy, los próximos capítulos serán improvisación.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{auditoría rápida} de tu escaleta de la sesión 2. Cuenta cuántas páginas suman tus capítulos planteamiento, cuántas el desarrollo, cuántas el cierre. ¿Se parece a 25-50-25 por ciento? Si no, hay desbalance.
  a_sistematizacion: |-
    Ya hiciste la auditoría. Ahora vas a entender la \textbf{anatomía de la estructura editorial}: los 3 actos con sus porcentajes, los 3 capítulos pivote, los 6 errores típicos del libro mal estructurado.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: ajustas tu escaleta al arco de 3 actos, asignas ritmo de páginas por capítulo, identificas tus 3 pivotes, escribes el mapa estructural completo.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: mapa estructural completo con arco + capítulos + ritmo + pivotes. El criterio principal: que alguien viendo tu mapa pueda decir \emph{``sí, este libro está bien planeado''}, sin haber leído ningún capítulo.
  a_evaluacion: |-
    Antes de cerrar, mira la estructura desde las cinco dimensiones humanas. Estructurar antes de escribir es respeto por el lector futuro; improvisar es desperdicio del periodo entero.
  a_triangulo: |-
    Y para terminar, tres voces sobre el plano antes del ladrillo. Dussel sobre los libros que ordenan o desordenan el pensamiento del lector, Marco Aurelio sobre la disciplina del plan previo, Floridi sobre la estructura como ética del editor.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Auditoría rápida de tu escaleta} (15 min · individual). Toma la escaleta de 8-12 capítulos que hiciste en la sesión 2 y asigna a cada capítulo una de 3 etiquetas: \textbf{P} (planteamiento), \textbf{D} (desarrollo) o \textbf{C} (cierre). Suma las páginas estimadas de cada grupo. Compara con el arco ideal: planteamiento 25 por ciento (~20 pp), desarrollo 50 por ciento (~40 pp), cierre 25 por ciento (~20 pp). Calcula si tu escaleta está balanceada o tiene desproporciones. Anota qué descubriste.
  checks:
  - Etiqueté cada capítulo como P, D o C.
  - Sumé las páginas estimadas por grupo.
  - Comparé con el arco ideal y detecté desproporciones.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Auditoría de la escaleta». \textbf{Formato:} tabla con capítulos + etiqueta P/D/C + páginas + total por grupo + comparación con 25-50-25. \textbf{Sabes que terminaste cuando} ves si tu escaleta está balanceada.
sistematizacion:
  intro: |-
    Tu auditoría te muestra si la escaleta está balanceada o no. Ahora necesitas la \textbf{anatomía profesional} de la estructura: arco completo, ritmo, capítulos pivote, errores típicos.
  pilares:
  - |-
    El \textbf{arco narrativo en 3 actos} se descompone así para un libro de 80 páginas: (1) \textbf{Acto 1 Planteamiento (20 pp aprox)}: 2-3 capítulos. Presenta tema, personajes/conceptos, conflicto/pregunta central. Función: \emph{enganchar al lector y dejar claro de qué trata el libro}. (2) \textbf{Acto 2 Desarrollo (40 pp aprox)}: 4-6 capítulos. Profundiza, complica, explora, propone. Función: \emph{sostener el interés con material sustancioso}. (3) \textbf{Acto 3 Cierre (20 pp aprox)}: 2-3 capítulos. Resuelve, concluye, abre futuro. Función: \emph{dejar al lector con algo de valor}. Este arco aplica a novela, manual, divulgación, ensayo: cambian los contenidos pero la estructura funciona.
  - |-
    Los \textbf{3 capítulos pivote} se descomponen así: (a) \textbf{Capítulo 1 (apertura)}: en los primeros 5 minutos de lectura, el lector decide si seguir o no. Si la apertura falla, los 79 capítulos restantes no importan. (b) \textbf{Capítulo del medio (~capítulo 5 o 6)}: punto donde muchos lectores abandonan. Aquí debe haber un giro, un dato fuerte, un cambio de ritmo. (c) \textbf{Capítulo final}: cierra o deja sabor a inconforme. Debe tener mejor calidad que el promedio del libro. Estos 3 capítulos merecen escribirse primero o reescribirse más veces.
  - |-
    El \textbf{ritmo de páginas} no es uniforme. Capítulos cortos (4-6 pp) sirven para transiciones, ganchos, cierres impactantes. Capítulos largos (10-12 pp) sirven para desarrollo profundo, conceptos complejos, escenas extensas. La regla profesional: \textbf{varía el ritmo para sostener atención}. Si todos los capítulos tienen 8 páginas exactas, el libro se siente monótono.
  - |-
    Algoritmo: (1) revisar escaleta y balancear hacia 25-50-25. (2) numerar capítulos definitivos. (3) asignar páginas por capítulo con variación intencional. (4) marcar los 3 pivotes (primero, medio, último). (5) verificar que cada capítulo tenga función clara en el arco. (6) escribir mapa estructural en 1 página.
  anatomia:
    titulo: Anatomía de la estructura editorial
    body: |-
      \textbf{Acto 1 Planteamiento:} 25 por ciento, 2-3 caps. \\[1mm] \textbf{Acto 2 Desarrollo:} 50 por ciento, 4-6 caps. \\[1mm] \textbf{Acto 3 Cierre:} 25 por ciento, 2-3 caps. \\[1mm] \textbf{Pivotes:} primero, medio, último. \\[1mm] \textbf{Ritmo:} varía páginas con función.
  errores_comunes: |-
    (1) \textbf{Planteamiento muy largo}: 40 por ciento del libro presentando sin entrar al desarrollo. (2) \textbf{Desarrollo flojo}: capítulos del medio sin sustancia, todos parecidos. (3) \textbf{Cierre apurado}: 5 páginas para resolver un libro de 80, lector queda inconforme. (4) \textbf{Capítulos todos iguales}: 10 capítulos de 8 páginas exactas, sin variación de ritmo. (5) \textbf{Pivotes débiles}: capítulo 1 que no engancha o final que no cierra. (6) \textbf{Sin función clara por capítulo}: capítulos que parecen relleno.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía de la estructura». \textbf{Formato:} (a) los 3 actos con porcentaje y función; (b) los 3 pivotes con su papel; (c) los 6 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías auditar estructura de otro libro.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Mapa estructural completo} (35 min · individual). Hora de aplicar. Ajustas escaleta al arco, asignas páginas con variación, marcas pivotes, escribes mapa estructural definitivo de 1 página.
  pilares:
  - |-
    Tu mapa estructural se construye en 5 pasos: (1) tomar escaleta de la sesión 2 con los ajustes que ya quieras hacer. (2) reorganizar capítulos según el arco 25-50-25. (3) asignar páginas por capítulo con variación intencional (algunos cortos, otros largos, según función). (4) identificar y marcar con asterisco los 3 capítulos pivote. (5) escribir el mapa estructural en 1 página: lista de capítulos con título + función en el arco + páginas + indicación si es pivote + resumen de 2 líneas.
  - |-
    Sigue el patrón \textbf{``función antes que extensión''}: cada capítulo debe tener una función clara en el arco (enganchar, profundizar, contrastar, dar giro, cerrar). Si no puedes nombrar la función de un capítulo en 1 frase, ese capítulo necesita repensarse o eliminarse. La phronesis del editor consiste en \textbf{no incluir capítulos solo porque \emph{``hace falta llenar páginas''}}.
  - |-
    Los 3 pivotes merecen estrategia específica: (a) \textbf{Capítulo 1}: dedica más tiempo a la apertura. Vale la pena escribir 3 versiones y elegir la mejor. (b) \textbf{Capítulo del medio}: aquí va el dato más fuerte, el giro narrativo, el ejemplo más memorable. No lo desperdicies en información obvia. (c) \textbf{Capítulo final}: debe cerrar con algo que el lector se lleve. Mejor calidad que el promedio.
  - |-
    Algoritmo: (1) reorganizar escaleta al arco. (2) asignar páginas con variación. (3) marcar pivotes. (4) escribir mapa de 1 página. (5) leerlo en voz alta: ¿se entiende el viaje del lector?, ¿hay capítulos sin función?
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Arco en 3 actos respetado (25-50-25). \\[1mm] \checkbox 8-12 capítulos numerados con título definitivo. \\[1mm] \checkbox Resumen de 2 líneas por capítulo. \\[1mm] \checkbox Páginas asignadas con variación intencional. \\[1mm] \checkbox 3 pivotes identificados (primero, medio, último). \\[1mm] \checkbox Cada capítulo con función clara en el arco. \\[1mm] \checkbox Mapa estructural cabe en 1 página legible.
  plantilla_guion: |-
    \textbf{Acto 1 (planteamiento, ~25 por ciento).} \textit{Capítulos 1-2/3 con función.} \\[1mm] \textbf{Acto 2 (desarrollo, ~50 por ciento).} \textit{Capítulos 3/4 hasta 7/8 con función.} \\[1mm] \textbf{Acto 3 (cierre, ~25 por ciento).} \textit{Últimos 2-3 capítulos con función.} \\[1mm] \textbf{Pivotes:} \textit{capítulo 1, capítulo del medio, capítulo final.} \\[1mm] \textbf{Ritmo:} \textit{varía páginas con función.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Mapa estructural». \textbf{Formato:} mapa en 1 página con los 5 elementos (arco, capítulos, páginas, pivotes, función). \textbf{Sabes que terminaste cuando} puedes recorrer mentalmente el libro completo en 2 minutos.
  producto_titulo: Mapa estructural con arco + capítulos + ritmo + 3 pivotes
  criterios:
  - Arco 25-50-25 respetado
  - 8-12 capítulos con título y función
  - Resumen de 2 líneas por capítulo
  - Páginas con variación intencional
  - 3 pivotes marcados
  - Mapa cabe en 1 página legible
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un libro bien estructurado ordena el pensamiento del lector; uno mal estructurado lo desordena y desperdicia su atención.
    aplicacion: |-
      La estructura editorial no es trámite: es \textbf{respeto cognitivo por el lector}. Cuando el libro tiene arco claro, el lector camina seguro por el contenido. Cuando es desordenado, el lector se cansa y abandona. La filosofía de la liberación pide ese cuidado: no desordenar al lector con improvisación editorial. La phronesis del editor consiste en \textbf{cargar tú el peso de la estructura para que el lector solo cargue el del contenido}.
    pregunta_espejo: |-
      ¿Mi estructura ordena el camino del lector, o lo desordena con saltos sin propósito?
  estoico:
    autor: Marco Aurelio
    cita: |-
      El plan previo es disciplina; la improvisación editorial es vanidad disfrazada de espontaneidad.
    aplicacion: |-
      Es tentador empezar a escribir capítulos sin haber cerrado la estructura, con el argumento de \emph{``ya iré viendo''}. La sabiduría estoica recomienda lo opuesto: \emph{cierra el plano antes de los ladrillos}. La estructura previa parece lenta pero es lo único que produce libros coherentes. Los libros improvisados se notan en el desorden.
    pregunta_espejo: |-
      ¿Estoy cerrando la estructura antes de seguir escribiendo, o voy improvisando capítulos?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La estructura clara es ética del editor en la era del contenido infinito.
    aplicacion: |-
      En la era de la información, los lectores tienen miles de libros disponibles. La ética editorial pide estructurar para que el libro merezca el tiempo del lector. Quien publica libros mal estructurados desperdicia atención humana. Tu mapa estructural de hoy te entrena en esa práctica que rige toda producción editorial profesional: \textbf{respetar el tiempo del lector con estructura clara}.
    pregunta_espejo: |-
      ¿Mi estructura merece el tiempo del lector, o pide más atención de la que devuelve?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu mapa estructural completo. En la sesión 6 vas a aprender sobre \textbf{derechos de autor y propiedad intelectual con IA} (Ley 23 de 1982, obras derivadas, licencias Creative Commons). La estructura de hoy es el plano; los derechos de mañana son la firma legal del autor.
web:
  conceptos_clave:
    - termino: Arco narrativo de 3 actos
      definicion: |-
        Estructura heredada de Aristóteles. Acto 1 planteamiento (25%), Acto 2 desarrollo (50%), Acto 3 cierre (25%).
      ejemplo: |-
        En 80 páginas, planteamiento 20, desarrollo 40, cierre 20. La proporción sostiene el ritmo del lector.
      emoji: "🎭"
    - termino: Acto 1 — Planteamiento
      definicion: |-
        Primer 25% del libro. Presenta tema, personajes o conceptos clave y el conflicto o pregunta central.
      ejemplo: |-
        En el libro de amistades digitales, el acto 1 muestra al protagonista y su distancia con el amigo de la infancia.
      emoji: "🌱"
    - termino: Acto 2 — Desarrollo
      definicion: |-
        50% del libro. Profundiza, complica, propone. Zona más larga; aquí está la mayor responsabilidad del libro.
      ejemplo: |-
        El protagonista intenta retomar la amistad por chat, fracasa, prueba videollamada, fracasa, entiende algo.
      emoji: "🌳"
    - termino: Acto 3 — Cierre
      definicion: |-
        Últimos 25% del libro. Resuelve, concluye, propone. No necesita final cerrado; sí marca clara.
      ejemplo: |-
        El protagonista decide visitar al amigo en persona. No sabemos qué pasará, pero el lector queda con claridad.
      emoji: "🌲"
    - termino: Capítulos pivote
      definicion: |-
        Tres capítulos críticos: primero (engancha o pierde), mitad (sostiene o pierde), último (cierra o decepciona).
      ejemplo: |-
        Los reescribes más veces que los demás. Si esos 3 funcionan, el libro funciona.
      emoji: "📍"
  quiz:
    titulo: ¿Diseñas estructura editorial profesional?
    instrucciones: 5 preguntas para verificar que dominas el arco narrativo de 3 actos.
    preguntas:
      - enunciado: ¿Qué porcentaje del libro ocupa el Acto 2 (desarrollo)?
        opciones:
          - 10%
          - 25%
          - 50%
          - 90%
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. El Acto 2 ocupa el 50%. Es la zona más larga del libro y la de mayor responsabilidad.
        feedback_incorrecto: |-
          Son 50%. El desarrollo es la zona más larga; ahí se juega la mayor parte de la obra.
      - enunciado: ¿Cuántos capítulos pivote tiene un libro bien estructurado?
        opciones:
          - "1"
          - "3"
          - "10"
          - "30"
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. 3 pivotes: primero, mitad y último. Merecen más reescritura que los demás.
        feedback_incorrecto: |-
          Son 3: el primero, el de la mitad y el último. Si esos funcionan, el libro funciona.
      - enunciado: ¿De dónde viene la estructura de 3 actos?
        opciones:
          - De TikTok
          - De Aristóteles
          - De Microsoft Word
          - De los algoritmos
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Es estructura clásica que Aristóteles describió y sigue vigente.
        feedback_incorrecto: |-
          Viene de Aristóteles. Es estructura clásica con vigencia hasta hoy en literatura y cine.
      - enunciado: ¿Qué pasa si todos los capítulos pesan lo mismo?
        opciones:
          - El libro está perfecto
          - Pierde ritmo y peso editorial
          - Es más fácil de leer
          - No tiene consecuencias
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Pesos iguales aplanan el ritmo. La estructura profesional asigna pesos según función.
        feedback_incorrecto: |-
          Pierde ritmo. Pesos iguales aplanan; la estructura profesional asigna pesos según función de cada capítulo.
      - enunciado: El último capítulo de un libro bien diseñado...
        opciones:
          - Tiene que dar un final feliz cerrado
          - Cierra o deja inconforme; merece ser pivote y reescribirse más
          - Es opcional
          - Se copia del primero
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El último es pivote. Cierra o decepciona; por eso pide más reescritura.
        feedback_incorrecto: |-
          Es pivote. Cierra o decepciona al lector, por eso merece más cuidado y reescritura.

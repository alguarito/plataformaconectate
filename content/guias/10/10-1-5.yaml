clave: 1-5
grado: 10
periodo: 1
sesion: 5
completo: true
duracion_min: 90
titulo: Estructura editorial --- arco narrativo, ritmo y capítulos
titulo_portada: |-
  Estructura editorial ---
  arco narrativo, ritmo
  y capítulos
producto_final: Mapa estructural del libro en 1 página, con el arco en tres actos, los capítulos numerados con su función, las páginas repartidas con variación y los tres capítulos pivote marcados
apertura:
  saber_ancestral: |-
    El café no se recoge todo el año igual. Colombia tiene dos cosechas: la principal, hacia septiembre y diciembre, y una segunda más pequeña que llaman mitaca o traviesa, hacia abril y junio (Parada Sanabria, 2017). El Valle del Cauca está en traviesa durante el primer semestre, mientras otras regiones están en cosecha principal. En las veredas cafeteras de Caldas los campesinos llaman «tiempo frío» al periodo entre las dos. Y no es tiempo perdido: es la otra mitad del ciclo, la que hace posible la cosecha siguiente. La \textbf{cara de exclusión} está en de quién es ese descanso. Es del cultivo y del calendario, no del recolector: entre cosechas no hay jornal.
  origen: Campesinado cafetero de Caldas · las dos cosechas y el «tiempo frío» entre ellas
  fuente: |-
    Parada Sanabria, P. J. (2017). Práctica social y cultural del campesinado cafetero en cuatro municipios de Caldas (Colombia). \emph{Revista Colombiana de Sociología, 40}(1 Supl.), 193--212. https://doi.org/10.15446/rcs.v40n1Supl.65913
  saber_contemporaneo: |-
    La \textbf{estructura editorial} es el plano del libro: cómo se ordena el contenido, qué peso tiene cada parte y qué papel cumple cada capítulo en el conjunto. Tiene tres piezas. El \textbf{arco en tres actos}, donde el planteamiento ocupa cerca de una cuarta parte, el desarrollo cerca de la mitad y el cierre la cuarta parte restante. Los \textbf{capítulos}, numerados y con una función nombrable cada uno. Y el \textbf{ritmo}, que reparte las páginas con variación deliberada. A eso se suman tres \textbf{capítulos pivote} --- el primero, el del medio y el último --- que cargan más peso que los demás y merecen más trabajo.
  pregunta_puente: |-
    ¿Por qué un año cafetero no reparte el trabajo en partes iguales? ¿Y qué le pasa a un libro donde los diez capítulos pesan exactamente lo mismo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} tu escaleta contra el arco de tres actos y detectar si el planteamiento se alargó o el cierre quedó corto; (2) \textbf{explicar} por qué los tres capítulos pivote necesitan más trabajo que los demás; (3) \textbf{crear} el mapa estructural completo, con la función de cada capítulo y las páginas repartidas con variación.
puentes:
  a_ruta: |-
    En la sesión 4 iteraste un capítulo hasta dejarlo tuyo. Hoy subes al nivel del libro entero: cómo se reparte el peso entre los diez, y qué papel cumple cada uno en el conjunto.
  a_escuta: |-
    Antes de teorizar, vas a auditar tu propia escaleta. Etiquetar cada capítulo y sumar páginas te va a mostrar en dos minutos si el libro está desbalanceado.
  a_sistematizacion: |-
    Ya tienes la auditoría. Ahora vas a entender la \textbf{anatomía de la estructura}: el arco completo, los tres pivotes, el ritmo de las páginas y los errores que hacen que un libro se caiga a la mitad.
  a_praxis: |-
    Tienes el método. Toca aplicarlo. Reorganizas la escaleta hacia el arco, repartes las páginas con variación, marcas los pivotes y escribes el mapa en una página.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: el mapa estructural en una página. El criterio principal es que puedas recorrer el libro entero de memoria en dos minutos leyéndolo.
  a_evaluacion: |-
    Antes de cerrar, mira la estructura desde las cinco dimensiones humanas. Repartir bien el peso es respeto por quien lee. Un cierre apurado desperdicia todo lo anterior.
  a_triangulo: |-
    Y para terminar, tres voces sobre la forma del conjunto. Dussel sobre la coherencia entre forma y función, Marco Aurelio sobre mirar el todo, Floridi sobre la abundancia que satura.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Auditoría de mi escaleta} (15 min · individual). (1) Toma la escaleta de la sesión 2. (2) Etiqueta cada capítulo como planteamiento, desarrollo o cierre. (3) Suma las páginas estimadas de cada grupo. (4) Convierte esas sumas en proporciones y compáralas con el arco de una cuarta parte, la mitad y una cuarta parte. (5) Anota dónde está la mayor desproporción y qué capítulo la causa.
  checks:
  - |-
    Etiqueté cada capítulo como planteamiento, desarrollo o cierre.
  - |-
    Sumé las páginas estimadas por grupo y las convertí en proporciones.
  - |-
    Anoté dónde está la mayor desproporción y qué capítulo la causa.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} \textbf{Título:} «Actividad 1 --- Auditoría de mi escaleta». \textbf{Formato:} tabla con capítulo, etiqueta, páginas y total por grupo, más la comparación con el arco y la desproporción señalada. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} sabes qué acto de tu libro está desbalanceado.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- El arco, los pivotes y el ritmo} (20 min · parejas). (1) Con tu pareja, escriban los tres actos con su proporción y su función. (2) Escriban los tres capítulos pivote y qué carga cada uno. (3) Escriban los errores típicos de estructura. (4) Cada uno le explica al otro la función de cada capítulo de su libro, en una frase, y marca los que no la tienen.
  pilares:
  - |-
    El arco se descompone así en un libro de ochenta páginas. El \textbf{planteamiento} ocupa unas veinte y suele caber en dos o tres capítulos: presenta el tema, los conceptos y la pregunta central. El \textbf{desarrollo} ocupa unas cuarenta en cuatro a seis capítulos, y es la zona más larga. El \textbf{cierre} ocupa las veinte restantes en dos o tres capítulos: resuelve y propone.
  - |-
    Los tres \textbf{pivotes} cargan más que el resto. El \textbf{primer capítulo} decide si alguien sigue leyendo, y si falla, los otros nueve no importan. El \textbf{capítulo del medio} sostiene la parte más larga del libro, y es donde va el dato más fuerte o el giro. El \textbf{último} es lo que queda en la memoria. A esos tres conviene darles más vueltas que a los demás.
  - |-
    El ritmo de las páginas no es uniforme y no debería serlo. Los capítulos cortos sirven de transición, de gancho o de cierre seco. Los largos sostienen desarrollos y conceptos complejos. Diez capítulos de ocho páginas cada uno producen un libro que se lee plano, aunque cada capítulo por separado esté bien escrito.
  - |-
    Algoritmo: (1) revisa la escaleta y balancéala hacia el arco; (2) numera los capítulos definitivos; (3) reparte las páginas con variación deliberada; (4) marca los tres pivotes; (5) comprueba que cada capítulo tenga una función que quepa en una frase; (6) escribe el mapa en una página.
  anatomia:
    titulo: Anatomía de la estructura editorial
    body: |-
      \textbf{Planteamiento:} una cuarta parte, 2 o 3 capítulos. \\[1mm] \textbf{Desarrollo:} la mitad, 4 a 6 capítulos. \\[1mm] \textbf{Cierre:} una cuarta parte, 2 o 3 capítulos. \\[1mm] \textbf{Pivotes:} el primero, el del medio y el último. \\[1mm] \textbf{Ritmo:} páginas repartidas con variación, no en partes iguales. \\[1mm] \textbf{Prueba:} cada capítulo tiene una función que cabe en una frase.
  errores_comunes: |-
    (1) Planteamiento largo: media obra presentando sin entrar al desarrollo. (2) Desarrollo flojo: los capítulos del medio se parecen entre sí y no avanzan. (3) Cierre apurado: cinco páginas para resolver un libro de ochenta. (4) Todos los capítulos del mismo largo, que aplana la lectura. (5) Capítulos sin función nombrable, que están porque el tema los sugería.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- El arco, los pivotes y el ritmo». \textbf{Formato:} los tres actos con proporción y función, los tres pivotes con lo que carga cada uno, los errores con el que más temes marcado y la lista de tus capítulos sin función clara. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} podrías auditar la estructura de un libro ajeno.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Mi mapa estructural} (35 min · individual). (1) Reorganiza la escaleta hacia el arco de tres actos. (2) Numera los capítulos definitivos con su título. (3) Escribe la función de cada uno en una frase. (4) Reparte las páginas con variación deliberada, no en partes iguales. (5) Marca los tres pivotes y anota qué vas a poner en cada uno. (6) Escribe el mapa completo en una página y léelo en voz alta.
  pilares:
  - |-
    Tu mapa se construye en cinco piezas: el arco con sus proporciones, los capítulos numerados con título, la función de cada uno en una frase, el reparto de páginas con variación y los tres pivotes marcados. Todo tiene que caber en una página legible.
  - |-
    Sigue el patrón «función antes que extensión». Cada capítulo debe tener una función clara en el arco: enganchar, profundizar, contrastar, dar un giro o cerrar. Si no puedes nombrar la función de un capítulo en una frase, ese capítulo necesita revisión antes que páginas.
  - |-
    Los tres pivotes merecen una estrategia propia. Al primero conviene escribirle varias aperturas y elegir. En el del medio va lo más fuerte que tengas, porque sostiene la parte más larga. Y el último es lo que va a quedar cuando el libro se cierre.
  - |-
    Algoritmo: (1) reorganiza al arco; (2) reparte páginas con variación; (3) marca pivotes; (4) escribe el mapa en una página; (5) léelo en voz alta y comprueba si se entiende el recorrido y si hay capítulos sin función.
  checklist:
    titulo: Checklist antes de cerrar el mapa
    items: |-
      \checkbox Arco respetado en sus tres proporciones. \\[1mm] \checkbox Capítulos numerados con título definitivo. \\[1mm] \checkbox Una frase de función por capítulo. \\[1mm] \checkbox Páginas repartidas con variación deliberada. \\[1mm] \checkbox Los tres pivotes marcados con lo que va en cada uno. \\[1mm] \checkbox El mapa completo cabe en una página legible.
  plantilla_guion: |-
    \textbf{Planteamiento.} \textit{Capítulos con su función y sus páginas.} \\[1mm] \textbf{Desarrollo.} \textit{Capítulos con su función y sus páginas.} \\[1mm] \textbf{Cierre.} \textit{Capítulos con su función y sus páginas.} \\[1mm] \textbf{Pivotes.} \textit{El primero, el del medio y el último, con lo que carga cada uno.} \\[1mm] \textbf{Prueba.} \textit{El recorrido completo, leído en voz alta.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Mi mapa estructural». \textbf{Formato:} el mapa en una página con arco, capítulos, funciones, páginas y pivotes. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} puedes recorrer el libro completo de memoria en dos minutos.
  producto_titulo: Mapa estructural con arco, capítulos, funciones, ritmo y 3 pivotes
  criterios:
  - Arco de tres actos respetado en sus proporciones
  - Capítulos numerados con título definitivo
  - Una frase de función por capítulo, sin excepciones
  - Páginas repartidas con variación deliberada
  - Los tres pivotes marcados con lo que carga cada uno
  - El mapa completo cabe en una página legible
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.3.1.2
    cita: |-
      El tema esencial del diseño es el de dotar al producto de coherencia formal; incluye a la tecnología… por cuanto esto significa coherencia funcional: el del valor del uso; incluye a la estética, porque la coherencia formal, en cuanto tal, es la belleza del producto.
    aplicacion: |-
      Un libro bien estructurado se lee bien porque está bien resuelto, no al revés. Cuando cada capítulo tiene una función y el peso está repartido, la lectura fluye sin que quien lee sepa por qué. Y cuando el cierre queda en cinco páginas, se nota aunque el texto esté bien escrito.
    pregunta_espejo: |-
      ¿Cuál de mis capítulos está ahí por función y cuál está porque el tema lo sugería?
  estoico:
    autor: Marco Aurelio · Meditaciones VII, 47 (c. 175 d.C.)
    cita: |-
      Conduce mirar alrededor el curso de los astros, como quien gira con ellos, y contemplar también frecuentemente las mutuas conversiones de los elementos, porque las consideraciones de estas cosas purifican a uno de las manchas de esta vida terrestre.
    aplicacion: |-
      Hasta ahora trabajaste capítulo por capítulo. Hoy el ejercicio es el contrario: subir y mirar los diez a la vez. Desde ahí se ven cosas que desde adentro de un capítulo no aparecen, como que el planteamiento se comió media obra.
    pregunta_espejo: |-
      Al mirar el libro entero de una vez, ¿qué vi que no se veía capítulo por capítulo?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 2.3
    cita: |-
      La abundancia de información también puede producir sobrecarga cognitiva, distracción y amnesia (el presente olvidadizo). (trad. propia)
    aplicacion: |-
      El ritmo no es un adorno: es lo que permite que alguien retenga algo. Un libro de densidad pareja satura y se olvida. Los capítulos cortos, las transiciones y los cierres secos existen para que lo importante tenga dónde apoyarse.
    pregunta_espejo: |-
      Si alguien leyera mi libro entero, ¿qué tres cosas recordaría una semana después?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el mapa estructural completo. En la sesión 6 vas a trabajar derechos de autor y propiedad intelectual con IA: la Ley 23 de 1982, las licencias y qué significa firmar una obra hecha con ayuda de una herramienta.
web:
  resumen: |-
    Subes del capítulo suelto al libro entero: el arco en tres actos, la función de cada capítulo, el reparto de páginas con variación y los tres capítulos que cargan más peso.
  subtema: Oficio editorial · Estructura y ritmo
  pre_lectura:
    por_que_importa: |-
      Un cierre apurado desperdicia todo lo anterior, y diez capítulos del mismo largo producen un libro plano aunque cada uno esté bien escrito. La estructura decide cómo se lee el conjunto.
    pregunta_detonante: |-
      Si tu libro tuviera que perder veinte páginas, ¿de qué acto las quitarías?
    activacion:
      titulo: Las dos cosechas
      descripcion: |-
        En 3 minutos, dibuja una barra por cada capítulo de tu escaleta, con la altura de las páginas que estimaste. Mira el dibujo: ¿es plano o tiene relieve?
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 4 iteraste un capítulo hasta que sonara a tu voz.
      siguiente: |-
        En la sesión 6 defines quién firma la obra y bajo qué licencia circula.

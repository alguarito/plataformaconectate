    duracion_min: 15
  - numero: 3
    iconos:
    - 📖
    titulo: Actividad 2 · El arco, los pivotes y el ritmo
    duracion_min: 20
  - numero: 4
    iconos:
    - ✏️
    titulo: Actividad 3 · Mi mapa estructural
    duracion_min: 35
  - numero: 5

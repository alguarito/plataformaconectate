  conceptos_clave:
  - categoria: El arco
    termino: Planteamiento
    definicion: |-
      El primer acto, cerca de una cuarta parte del libro. Presenta el tema, los conceptos y la pregunta central.
    ejemplo: |-
      Dos o tres capítulos que dejan claro de qué va el libro y por qué vale la pena seguir.
  - categoria: El arco
    termino: Desarrollo
    definicion: |-
      El segundo acto, cerca de la mitad del libro. Profundiza, complica y propone. Es la zona más larga.
    ejemplo: |-
      Cuatro a seis capítulos donde cada uno agrega algo que el anterior no tenía.
  - categoria: El arco
    termino: Cierre
    definicion: |-
      El tercer acto, la cuarta parte restante. Resuelve y propone. No es un resumen de lo dicho.
    ejemplo: |-
      Cinco páginas para cerrar un libro de ochenta dejan a quien lee con la sensación de que faltó algo.
  - categoria: Peso y ritmo
    termino: Capítulos pivote
    definicion: |-
      El primero, el del medio y el último. Cargan más que los demás y merecen más trabajo.
    ejemplo: |-
      Si la apertura falla, lo que venga después casi no importa: nadie llega a leerlo.
  - categoria: Peso y ritmo
    termino: Ritmo de páginas
    definicion: |-
      El reparto deliberado de extensión entre capítulos. Cortos para transición y gancho, largos para desarrollo.
    ejemplo: |-
      Diez capítulos de ocho páginas producen una lectura plana aunque cada uno esté bien escrito.
  - categoria: Peso y ritmo
    termino: Función del capítulo
    definicion: |-
      Lo que ese capítulo hace en el arco: enganchar, profundizar, contrastar, dar un giro o cerrar.
    ejemplo: |-
      Si la función no cabe en una frase, el capítulo necesita revisión antes que páginas.
  cinco_dimensiones:
    personal: |-
      Aprendes a mirar un trabajo largo desde arriba, y no solo desde la parte que tienes entre manos. Sirve para cualquier proyecto que dure meses.
    emocional: |-
      Reconocer que un capítulo querido no tiene función cuesta. Es la misma incomodidad de la sesión anterior, pero a escala del libro.
    ciudadana: |-
      Repartir el peso es respeto por el tiempo de quien lee. Un libro que se cae a la mitad le hace perder algo a alguien.
    local: |-
      El año cafetero tiene dos cosechas de distinto tamaño y un tiempo entre ellas. El ciclo no reparte el trabajo en partes iguales.
    intergeneracional: |-
      Que el descanso sea del cultivo y no de quien recoge es una diferencia que conviene no borrar cuando se usa el ciclo como imagen.
  post_lectura:
    transferencia: |-
      Llega a la próxima sesión con el mapa estructural. Todo lo que produzcas de aquí en adelante se va a acomodar sobre ese plano.
  quiz:
    titulo: Verifica la estructura editorial
    instrucciones: 5 preguntas para confirmar que puedes repartir el peso de un libro. Necesitas 3/5 para continuar.
    preguntas:
    - enunciado: ¿Qué proporción del libro suele ocupar el desarrollo?
      opciones:
      - Cerca de una cuarta parte, igual que el planteamiento y que el cierre final
      - Cerca de la mitad, porque es donde el libro profundiza y avanza de verdad
      - Cerca de tres cuartas partes, dejando muy poco espacio para plantear y cerrar
      - No hay proporción fija, porque depende únicamente del género que se escriba
      respuesta_index: 1
      feedback_correcto: |-
        Correcto. El desarrollo es la zona más larga: ahí está el trabajo que sostiene el libro.
      feedback_incorrecto: |-
        No son tres partes iguales ni es libre. El desarrollo pesa cerca de la mitad.
    - enunciado: ¿Cuáles son los tres capítulos pivote?
      opciones:
      - Los tres primeros, porque son los que deciden si alguien continúa leyendo el libro
      - Los que el autor considere más importantes según el tema que esté tratando
      - Los tres del acto de desarrollo, que es donde se concentra el peso del libro
      - El primero, el del medio y el último, que cargan más que todos los demás
      respuesta_index: 3
      feedback_correcto: |-
        Sí. El primero decide si siguen leyendo, el del medio sostiene la parte larga y el último es lo que queda.
      feedback_incorrecto: |-
        No son los tres primeros ni los del desarrollo. Son el primero, el del medio y el último.
    - enunciado: ¿Qué pasa si todos los capítulos tienen el mismo largo?
      opciones:
      - La lectura queda plana, porque nada se destaca sobre el resto del libro
      - Nada relevante, porque la uniformidad hace el libro más fácil de seguir
      - El libro resulta más corto de lo que debería para el tema que trata
      - Se dificulta la maquetación posterior, porque las páginas no calzan bien
      respuesta_index: 0
      feedback_correcto: |-
        Correcto. Sin variación, lo importante no tiene dónde apoyarse y todo se lee igual.
      feedback_incorrecto: |-
        No es un problema de longitud ni de maquetación. Es que sin relieve nada se destaca.
    - enunciado: ¿Cuál es la prueba de que un capítulo merece estar en el libro?
      opciones:
      - Que trate un asunto relacionado con el tema general que anuncia el título
      - Que su función en el arco se pueda nombrar en una sola frase
      - Que tenga una extensión parecida a la de los capítulos que lo rodean
      - Que aporte información que no aparezca en ninguna otra parte del libro
      respuesta_index: 1
      feedback_correcto: |-
        Sí. Si la función no cabe en una frase, el capítulo está ahí porque el tema lo sugería.
      feedback_incorrecto: |-
        Estar relacionado con el tema no basta. La prueba es poder nombrar qué hace ese capítulo en el arco.
    - enunciado: El año cafetero tiene dos cosechas de distinto tamaño y un «tiempo frío» entre ellas. ¿Qué aplica eso a tu libro?
      opciones:
      - Que conviene escribir el libro en dos temporadas separadas por un periodo de descanso
      - Que los ciclos productivos del campo inspiraron las estructuras narrativas modernas
      - Que el ciclo no reparte el trabajo en partes iguales, y la estructura tampoco debería
      - Que todo proyecto largo necesita pausas para que quien lo hace no termine agotado
      respuesta_index: 2
      feedback_correcto: |-
        Correcto. Una cosecha grande, una pequeña y un periodo entre las dos: el peso está repartido con relieve.
      feedback_incorrecto: |-
        No es sobre el calendario de escritura ni sobre el descanso propio. Es sobre el reparto desigual del peso.

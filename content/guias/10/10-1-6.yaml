clave: 1-6
grado: 10
periodo: 1
sesion: 6
completo: true
duracion_min: 90
titulo: Derechos de autor y propiedad intelectual con IA --- Ley 23 de 1982 y obras derivadas
titulo_portada: |-
  Derechos de autor
  con IA --- Ley 23
  de 1982
producto_final: Ficha de derechos de tu libro con autoría, licencia justificada, declaración explícita del uso de IA y fuentes atribuidas, más el análisis de 3 casos recientes
apertura:
  saber_ancestral: |-
    En 1891 el Estado colombiano compró 122 piezas de oro hechas por orfebres prehispánicos del Cauca medio. Dos años después, el 4 de mayo de 1893, las regaló a la reina regente de España. En 2017 la Corte Constitucional ordenó repatriarlas o readquirirlas, por vulneración de la moralidad administrativa y de la defensa del patrimonio público (Corte Constitucional de Colombia, 2017). Las piezas siguen en Madrid. La \textbf{cara de exclusión} es doble. «Quimbaya» es un exónimo: el nombre se lo pusieron los coleccionistas, no quienes hicieron las piezas. Y esos orfebres no tienen voz en el pleito. Lo que se discute es entre Estados, sobre quién es dueño de lo que hicieron otros.
  origen: Colección Quimbaya · las 122 piezas regaladas en 1893 y la sentencia SU-649 de 2017
  fuente: |-
    Corte Constitucional de Colombia. (2017). \emph{Sentencia SU-649/17} (M. P. Alberto Rojas Ríos), 19 de octubre.
  saber_contemporaneo: |-
    En Colombia los \textbf{derechos de autor} se rigen por la Ley 23 de 1982 y la Decisión Andina 351 de 1993. Hay dos tipos. Los \textbf{derechos morales} son irrenunciables, intransferibles y perpetuos: ser reconocido como autor, que nadie altere la obra, decidir si se publica. Nunca dejan de ser tuyos. Los \textbf{derechos patrimoniales} sí se pueden ceder: reproducir, distribuir, traducir, adaptar, cobrar. Sobre IA hay tres consensos. Un modelo no es autor, porque no es una persona. Si la intervención humana es sustancial, la obra es de quien la hizo. Y declarar el uso de la herramienta es práctica profesional, aunque la ley todavía no lo exija.
  pregunta_puente: |-
    ¿De quién es una pieza cuando quienes la hicieron no tienen voz en el pleito? ¿Y de quién es un capítulo que una herramienta armó a partir de textos de miles de autores?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} en un libro real quién firma, bajo qué licencia circula y qué declara sobre su proceso; (2) \textbf{analizar} la diferencia entre derechos morales y patrimoniales, y tres casos recientes de disputa entre IA y derechos; (3) \textbf{crear} la ficha de derechos de tu libro, con la licencia justificada y el uso de IA declarado.
puentes:
  a_ruta: |-
    En la sesión 5 dejaste el plano del libro. Hoy defines quién lo firma y bajo qué condiciones circula. Es la sesión donde el libro deja de ser un ejercicio y se vuelve una obra con dueño declarado.
  a_escuta: |-
    Antes de teorizar, vas a abrir un libro real por la página de créditos. Ahí está, en letra pequeña, todo lo que hoy vas a aprender a escribir para el tuyo.
  a_sistematizacion: |-
    Ya viste una página de créditos. Ahora vas a entender la \textbf{anatomía de los derechos}: qué es intransferible y qué se puede ceder, qué ofrece cada licencia y qué se sabe hoy sobre IA y autoría.
  a_praxis: |-
    Tienes el método. Toca aplicarlo. Analizas tres casos recientes, escribes la ficha de derechos de tu libro y justificas la licencia que elegiste.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: los tres casos y la ficha de derechos. El criterio principal es que la declaración de uso de IA diga qué hiciste tú y qué hizo la herramienta, sin quedarse en una frase de compromiso.
  a_evaluacion: |-
    Antes de cerrar, mira los derechos desde las cinco dimensiones humanas. Firmar con claridad es respeto por quien lee y por quienes escribieron antes que tú.
  a_triangulo: |-
    Y para terminar, tres voces sobre de quién es lo que se hace. Dussel sobre quien queda fuera del sistema, Epicteto sobre lo que depende de uno, Floridi sobre no reducir a los demás a instrumentos.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Un libro y sus créditos} (15 min · individual). (1) Toma un libro que tengas a mano, en papel o digital. (2) Busca la página de créditos, que suele estar después de la portadilla. (3) Anota quién es el autor declarado con nombre completo. (4) Anota la editorial, el año y el país de edición. (5) Anota qué dice sobre derechos: si están todos reservados, si hay una licencia abierta, y si menciona traducción, ilustración o cualquier otra mano.
  checks:
  - |-
    Revisé la página de créditos de un libro real, no la portada.
  - |-
    Anoté autoría, editorial, año y qué dice sobre derechos.
  - |-
    Anoté si aparecen otras manos: traducción, ilustración, edición.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Un libro y sus créditos». \textbf{Formato:} ficha con autoría, editorial, año, qué dice sobre derechos y qué otras manos aparecen nombradas. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} reconoces que cada libro trae una firma legal explícita, aunque casi nadie la lea.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · ANALIZA --- Morales, patrimoniales y licencias} (20 min · parejas). (1) Con tu pareja, escriban los dos tipos de derecho con un ejemplo de cada uno. (2) Escriban las licencias abiertas más usadas y qué permite cada una. (3) Escriban los tres consensos sobre IA y autoría. (4) Cada uno decide qué licencia le conviene a su libro y le explica al otro por qué, y el otro le busca una objeción.
  pilares:
  - |-
    Los dos tipos de derecho se descomponen así. Los \textbf{morales} son irrenunciables, intransferibles y perpetuos: la paternidad de la obra, su integridad y la decisión de publicarla. Siguen siendo tuyos aunque cedas todo lo demás. Los \textbf{patrimoniales} sí se ceden: reproducción, distribución, traducción, adaptación y cobro. Son los que se negocian con una editorial.
  - |-
    Las licencias abiertas más usadas parten todas de la atribución. La más permisiva deja usar la obra incluso con fines comerciales, siempre que se dé crédito. Otra variante excluye el uso comercial. Otra obliga a que lo derivado circule con la misma licencia. Y otra impide además hacer obras derivadas. Elegir una sin leerla es el error más común.
  - |-
    Sobre IA y autoría hay tres consensos. Un modelo no es autor, porque la ley reconoce como autores a personas. Si la intervención humana es sustancial --- estructura, voz, edición, decisiones --- la obra es de quien la hizo. Y declarar el uso de la herramienta es práctica profesional aceptada, aunque en Colombia la ley todavía no lo exija.
  - |-
    Algoritmo para elegir licencia: (1) si tu objetivo es que el libro llegue a mucha gente, ve a una licencia abierta con atribución; (2) si quieres difundir pero no que otros lucren, añade la restricción comercial; (3) si quieres que lo derivado siga siendo abierto, usa la que obliga a mantener la licencia; (4) si piensas publicar comercialmente, reserva los derechos.
  anatomia:
    titulo: Anatomía de los derechos de una obra
    body: |-
      \textbf{Morales:} irrenunciables, intransferibles y perpetuos. \\[1mm] \textbf{Patrimoniales:} transferibles y negociables. \\[1mm] \textbf{Licencias abiertas:} todas parten de la atribución y varían en lo comercial y lo derivado. \\[1mm] \textbf{IA:} el modelo no es autor; la obra es de quien decidió. \\[1mm] \textbf{Declaración:} qué hizo la herramienta y qué hiciste tú.
  errores_comunes: |-
    (1) No declarar el uso de IA, que en el trabajo editorial se considera una falta. (2) Confundir morales con patrimoniales y creer que se cede todo. (3) Elegir una licencia sin haberla leído. (4) Usar texto o imágenes ajenas sin atribuir la fuente. (5) Declarar el uso de IA con una frase genérica que no dice qué se hizo con ella.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} \textbf{Título:} «Actividad 2 --- Morales, patrimoniales y licencias». \textbf{Formato:} los dos tipos de derecho con ejemplo, las licencias con lo que permite cada una, los tres consensos sobre IA y la objeción que te puso tu pareja a la licencia elegida. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} podrías explicarle a alguien de tu casa qué licencia elegiste y por qué.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- La ficha de derechos de mi libro} (40 min · individual). (1) Busca tres casos recientes de disputa entre IA y derechos de autor. (2) Resume cada uno en un párrafo: quién demanda a quién, qué se discute y en qué va. (3) Escribe la ficha de derechos de tu libro con autoría, licencia, uso de IA, fuentes atribuidas y contacto. (4) En la declaración de IA di qué modelos usaste y en qué partes del proceso. (5) Justifica la licencia en cinco líneas. (6) Comprueba que la ficha se entienda sin que tú la expliques.
  pilares:
  - |-
    Los tres casos tienen que ser recientes, porque el campo cambia rápido y una sentencia de hace cinco años puede estar superada. Resúmelos con quién, qué se discute y en qué va. Si un caso sigue abierto, dilo: un pleito sin fallo no es una respuesta.
  - |-
    La ficha de derechos tiene cinco piezas: autoría con nombre completo y año, licencia elegida y justificada, declaración del uso de IA, atribución de las fuentes que citaste y un contacto. Es la página de créditos de tu libro, escrita por ti.
  - |-
    Sigue el patrón «transparencia antes que opacidad». Aunque la ley no lo exija, declarar el uso de la herramienta fortalece lo que firmas. Y la declaración tiene que ser específica: qué modelos, en qué partes, qué decidiste tú. «Se usó inteligencia artificial» no declara nada.
  - |-
    Algoritmo: (1) busca los tres casos; (2) resume cada uno en un párrafo; (3) escribe la ficha con sus cinco piezas; (4) justifica la licencia en cinco líneas; (5) dásela a leer a alguien que no sepa de tu libro y comprueba si entiende qué puede y qué no puede hacer con él.
  checklist:
    titulo: Checklist antes de cerrar la ficha
    items: |-
      \checkbox Tres casos recientes resumidos, con su estado actual. \\[1mm] \checkbox Autoría con nombre completo y año. \\[1mm] \checkbox Licencia elegida y justificada en cinco líneas. \\[1mm] \checkbox Declaración de IA que dice qué modelos y en qué partes. \\[1mm] \checkbox Fuentes citadas atribuidas una por una. \\[1mm] \checkbox La ficha se entiende sin que tú la expliques.
  plantilla_guion: |-
    \textbf{Casos.} \textit{Tres, con quién, qué se discute y en qué va.} \\[1mm] \textbf{Autoría.} \textit{Nombre completo y año.} \\[1mm] \textbf{Licencia.} \textit{Cuál y por qué, en cinco líneas.} \\[1mm] \textbf{Uso de IA.} \textit{Qué modelos, en qué partes, qué decidiste tú.} \\[1mm] \textbf{Fuentes.} \textit{Lo citado, atribuido.} \\[1mm] \textbf{Contacto.} \textit{Cómo escribirte.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Los derechos de mi libro». \textbf{Formato:} los tres casos resumidos, la ficha completa y la justificación de la licencia. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} alguien que no conoce tu libro entiende, leyendo la ficha, qué puede y qué no puede hacer con él.
  producto_titulo: 3 casos recientes analizados y ficha de derechos con licencia justificada
  criterios:
  - Tres casos recientes resumidos, con su estado actual declarado
  - Autoría con nombre completo y año
  - Licencia elegida y justificada, no copiada
  - Declaración de IA que dice qué modelos y en qué partes del proceso
  - Fuentes citadas atribuidas una por una
  - La ficha se entiende sin explicación adicional
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.4.2
    cita: |-
      El otro se revela realmente como otro… como el pobre, el oprimido; el que a la vera del camino, fuera del sistema, muestra su rostro sufriente y sin embargo desafiante: «¡Tengo hambre!, ¡tengo derecho a comer!».
    aplicacion: |-
      En el pleito por las piezas de oro discuten dos Estados. Los orfebres que las hicieron no aparecen: quedaron fuera del sistema que decide de quién son. Con los textos que entrenaron una herramienta pasa algo parecido, y la pregunta de quién queda fuera del reparto sigue abierta.
    pregunta_espejo: |-
      De todo lo que hay detrás de mi libro, ¿quién no aparece nombrado en ninguna parte?
  estoico:
    autor: Epicteto · Enquiridión, 1 (c. 125 d.C.)
    cita: |-
      Hay ciertas cosas que dependen de nosotros mismos, como la opinión, la inclinación, los deseos, la aversión, y en una palabra, todas nuestras operaciones. Otras hay también que no dependen, como el cuerpo, las riquezas, la reputación, los imperios.
    aplicacion: |-
      Los derechos morales son de lo que depende de ti y no se puede ceder aunque quieras. Los patrimoniales son de lo otro: se negocian, se venden, se pierden. Saber cuál es cuál evita firmar un contrato creyendo que entregas menos de lo que entregas.
    pregunta_espejo: |-
      De lo que estoy declarando en mi ficha, ¿qué podría ceder mañana y qué seguirá siendo mío pase lo que pase?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.3
    cita: |-
      En una esfera pública plural, los demás no pueden reducirse a instrumentos, y hacen falta contención y respeto. (trad. propia, abreviada)
    aplicacion: |-
      Citar es lo contrario de instrumentalizar. Cuando atribuyes una idea a quien la escribió, la tratas como obra de alguien y no como material disponible. Es la misma diferencia entre comprar una pieza y llevársela porque estaba ahí.
    pregunta_espejo: |-
      ¿Hay algo en mi libro que tomé de alguien y que todavía no está atribuido?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la ficha de derechos completa y los tres casos resumidos. En la sesión 7 vas a generar la portada del libro, y ahí la pregunta de los derechos vuelve, esta vez sobre imágenes.
web:
  resumen: |-
    Defines quién firma tu libro y bajo qué licencia circula: qué derechos son intransferibles, cuáles se ceden y cómo se declara con precisión el uso de una IA.
  subtema: Oficio editorial · Autoría y licencias
  pre_lectura:
    por_que_importa: |-
      Firmar una obra hecha con ayuda de una herramienta obliga a decir qué hiciste tú y qué hizo ella. Y buena parte de lo que se discute hoy sobre IA es, en el fondo, de quién es lo que se produce.
    pregunta_detonante: |-
      Si una herramienta escribió el primer borrador y tú lo reescribiste entero, ¿de quién es el capítulo?
    activacion:
      titulo: La página que nadie lee
      descripcion: |-
        En 3 minutos, abre cualquier libro por la página de créditos y cuenta cuántos nombres aparecen ahí que no son el del autor.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 5 dejaste el mapa estructural del libro completo.
      siguiente: |-
        En la sesión 7 generas la portada, y la pregunta de los derechos vuelve sobre las imágenes.

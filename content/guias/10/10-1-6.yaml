  conceptos_clave:
  - categoria: Los dos tipos de derecho
    termino: Derechos morales
    definicion: |-
      Irrenunciables, intransferibles y perpetuos: ser reconocido como autor, que nadie altere la obra, decidir si se publica.
    ejemplo: |-
      Aunque cedas todo lo demás a una editorial, sigues siendo el autor y nadie puede alterar la obra sin permiso.
  - categoria: Los dos tipos de derecho
    termino: Derechos patrimoniales
    definicion: |-
      Transferibles y negociables: reproducir, distribuir, traducir, adaptar y cobrar por la obra.
    ejemplo: |-
      Son los que se negocian en un contrato editorial, y los que se pueden perder por firmarlo sin leerlo.
  - categoria: Cómo circula la obra
    termino: Licencia abierta
    definicion: |-
      Un permiso previo para que otros usen la obra bajo condiciones declaradas. Todas parten de dar crédito.
    ejemplo: |-
      Unas permiten uso comercial y otras no; unas obligan a que lo derivado siga siendo abierto.
  - categoria: Cómo circula la obra
    termino: Todos los derechos reservados
    definicion: |-
      La opción más cerrada: nadie puede usar la obra sin pedir permiso caso por caso.
    ejemplo: |-
      Tiene sentido si piensas publicar comercialmente; no lo tiene si tu objetivo es que el libro circule.
  - categoria: IA y autoría
    termino: El modelo no es autor
    definicion: |-
      La ley reconoce como autores a personas. Una herramienta no adquiere derechos sobre lo que produce.
    ejemplo: |-
      Un capítulo generado y luego reescrito por ti es tuyo, no de la herramienta que hizo el borrador.
  - categoria: IA y autoría
    termino: Declaración específica
    definicion: |-
      Decir qué modelos se usaron y en qué partes del proceso. Una frase genérica no declara nada.
    ejemplo: |-
      «Se usó inteligencia artificial» no dice nada; «los borradores de los capítulos 2 a 7 se generaron con X» sí.
  cinco_dimensiones:
    personal: |-
      Declaras con qué nombre respondes por tu trabajo y bajo qué condiciones dejas que circule. Es una decisión que hasta ahora no habías tenido que tomar.
    emocional: |-
      Decir qué parte hizo la herramienta cuesta cuando uno quisiera que todo fuera propio. Declararlo con precisión es lo que hace creíble el resto.
    ciudadana: |-
      Atribuir lo que se toma de otros es lo que sostiene la confianza en lo que se publica. Sin atribución, todo texto se vuelve sospechoso.
    local: |-
      Las 122 piezas se compraron y se regalaron sin que quienes las hicieron tuvieran voz. Siguen en Madrid, pese a la orden de 2017.
    intergeneracional: |-
      Que «quimbaya» sea un exónimo puesto por coleccionistas muestra que hasta el nombre de lo que alguien hizo puede terminar decidiéndolo otro.
  post_lectura:
    transferencia: |-
      Llega a la próxima sesión con la ficha de derechos y los tres casos. En la portada la pregunta vuelve, esta vez sobre imágenes generadas.
  quiz:
    titulo: Verifica derechos de autor
    instrucciones: 5 preguntas para confirmar que sabes bajo qué condiciones firma y circula tu libro. Necesitas 3/5 para continuar.
    preguntas:
    - enunciado: ¿Qué caracteriza a los derechos morales de una obra?
      opciones:
      - Que se pueden negociar con una editorial a cambio de un porcentaje de las ventas
      - Que caducan pasados unos años desde la muerte de quien escribió la obra
      - "Que son irrenunciables e intransferibles: siguen siendo tuyos pase lo que pase"
      - Que solo aplican a obras literarias y no a las obras musicales o visuales
      respuesta_index: 2
      feedback_correcto: |-
        Correcto. Aunque cedas todo lo patrimonial, sigues siendo el autor y la obra no se puede alterar sin tu permiso.
      feedback_incorrecto: |-
        Lo que se negocia son los patrimoniales. Los morales no se ceden ni caducan.
    - enunciado: Una IA generó el borrador y tú lo reescribiste entero. ¿De quién es la obra?
      opciones:
      - Tuya, porque la intervención humana fue sustancial y un modelo no es autor
      - De la empresa que desarrolló el modelo, según sus términos de servicio
      - "De nadie: una obra hecha con IA queda automáticamente en dominio público"
      - Compartida entre tú y el modelo, en la proporción en que cada uno aportó
      respuesta_index: 0
      feedback_correcto: |-
        Correcto. La ley reconoce como autores a personas, y la obra es de quien tomó las decisiones.
      feedback_incorrecto: |-
        Un modelo no adquiere derechos ni puede compartir autoría. Si tu intervención fue sustancial, la obra es tuya.
    - enunciado: ¿Qué tienen en común todas las licencias abiertas más usadas?
      opciones:
      - Que impiden cualquier uso comercial de la obra por parte de terceros
      - Que obligan a que las obras derivadas circulen con esa misma licencia
      - Que ceden los derechos morales junto con los derechos patrimoniales
      - Que parten de dar crédito a quien hizo la obra original
      respuesta_index: 3

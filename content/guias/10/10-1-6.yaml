grado: 10
periodo: 1
sesion: 6
completo: true
titulo: Derechos de autor y propiedad intelectual con IA --- Ley 23 de 1982 y obras derivadas
titulo_portada: |-
  Derechos de autor
  y propiedad intelectual ---
  Ley 23 de 1982 e IA
producto_final: |-
  Ficha de derechos de autor de tu libro completa con 6 elementos obligatorios (autor declarado con nombre completo y fecha, licencia elegida entre Creative Commons CC BY/CC BY-NC/CC BY-SA o todos los derechos reservados, declaración explícita de uso de IA con modelos y porcentaje aproximado, fuentes citadas si las hay, distinción explícita derechos morales vs patrimoniales, contacto del autor) + análisis de 3 casos reales recientes (2023-2026) de polémicas IA-derechos publicados en prensa colombiana o internacional + reflexión de 5 líneas sobre qué licencia elegirías y por qué
apertura:
  saber_ancestral: |-
    En los talleres de cestería del Pacífico, en los mercados artesanales de Pasto y Popayán, en los puestos de cerámica de Pijao, hay una práctica que cualquier cliente reconoce: \textbf{el artesano firma su pieza con marca distintiva}. La firma es \textbf{declaración de autoría y responsabilidad}. En la cestería de iraca del Cauca, cada artesana tiene un nudo característico al cierre. En la cerámica del Quindío, el alfarero deja marca con uña en la base. En las mochilas wayuu, cada tejedora tiene patrones que la identifican. Esa firma tiene dos efectos al mismo tiempo: (1) \textbf{Derecho moral}: declarar que esa pieza fue hecha por esa persona. Es \textbf{intransferible}: aunque la vendas, sigue siendo \emph{tu} pieza en autoría. (2) \textbf{Derecho patrimonial}: la pieza se puede vender, transferir, ceder. Es \textbf{negociable}: el comprador adquiere la pieza pero no el derecho a decir \emph{``yo la hice''}. La sabiduría del oficio distingue ambos derechos con claridad. La \textbf{Ley 23 de 1982} traduce esa distinción a lenguaje legal moderno, y se aplica también a libros generados con IA.
  saber_contemporaneo: |-
    En Colombia, los \textbf{derechos de autor} están regulados por la \textbf{Ley 23 de 1982} y la \textbf{Decisión Andina 351 de 1993}. Distinguen dos tipos: (1) \textbf{Derechos morales}: intransferibles, perpetuos. Incluyen ser reconocido como autor, preservar integridad de la obra, decidir si publicar, modificar, retirarla. Nunca dejan de ser tuyos aunque vendas el libro. (2) \textbf{Derechos patrimoniales}: transferibles, temporales, negociables. Incluyen reproducir, distribuir, traducir, adaptar, cobrar regalías. Estos sí se pueden ceder. En cuanto a \textbf{IA y derechos}, en 2024-2026 el panorama legal sigue en discusión, pero hay consensos: (a) el modelo de IA no tiene derechos de autor (no es persona jurídica). (b) Si usaste IA como herramienta y tu intervención editorial es sustancial, la obra es tuya con declaración honesta. (c) Si la obra es 100 por ciento generada por IA sin intervención humana significativa, su estatus es incierto. Las \textbf{licencias Creative Commons} (CC) son alternativa a \emph{``todos los derechos reservados''}: permiten compartir bajo condiciones (atribución, no comercial, sin obras derivadas, compartir igual).
  pregunta_puente: |-
    ¿Qué sabía la artesana wayuu al firmar su mochila con patrón propio, que el usuario novato de IA olvida cuando publica un texto generado sin declarar? ¿Y por qué los derechos morales son intransferibles aunque vendas todos los derechos patrimoniales del libro?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} la diferencia entre derechos morales y derechos patrimoniales aplicada a tu libro; (2) \textbf{analizar} 3 casos reales de polémica IA-derechos de los últimos 2 años para entender el panorama actual; (3) \textbf{evaluar} qué licencia te conviene (Creative Commons en alguna de sus variantes vs todos los derechos reservados) según tus objetivos; (4) \textbf{crear} la ficha de derechos completa de tu libro con declaración honesta de uso de IA.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 5 cerraste la estructura. Hoy aseguras la \textbf{dimensión legal y ética} del libro. Las próximas sesiones (portada, diagramación, producción) asumen que sabes cómo firmar y qué declarar. Sin claridad de derechos hoy, el libro queda con riesgo legal y ético.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio rápido}: piensa en 1 libro reciente cuyos derechos conozcas (puede ser un libro que compraste, o un libro Creative Commons que descargaste). Anota: ¿quién es el autor declarado?, ¿qué licencia tiene?, ¿se menciona uso de IA en algún lugar?
  a_sistematizacion: |-
    Ya tienes 1 ejemplo. Ahora vas a entender la \textbf{anatomía de los derechos de autor en Colombia}: morales vs patrimoniales, Ley 23 de 1982, Creative Commons, panorama actual de IA y derechos.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: analizas 3 casos reales de polémicas IA-derechos, eliges licencia para tu libro, escribes la ficha de derechos completa con declaración honesta de uso de IA.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: ficha + 3 casos + reflexión. El criterio principal: que tu ficha de derechos pueda ser revisada por un abogado y resista el examen legal y ético.
  a_evaluacion: |-
    Antes de cerrar, mira los derechos desde las cinco dimensiones humanas. Firmar con honestidad legal es respeto por la ley y por los futuros lectores; ocultar uso de IA es fraude editorial moderno.
  a_triangulo: |-
    Y para terminar, tres voces sobre la firma del autor. Dussel sobre la autoría asumida frente a la IA, Séneca sobre la honestidad del oficio, Floridi sobre la transparencia como nueva ética editorial.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Un libro y sus derechos} (15 min · individual). Toma 1 libro que conozcas físicamente (de tu casa, del colegio, de la biblioteca) o un libro digital que hayas descargado o comprado. Busca en las primeras páginas (créditos) y anota: (1) ¿quién es el autor declarado (nombre completo)? (2) ¿cuál es la editorial o quién publica? (3) ¿qué licencia tiene (todos los derechos reservados, Creative Commons, dominio público)? (4) ¿hay alguna mención de uso de IA? (probablemente no la haya, aún es práctica nueva). (5) ¿el copyright dice año? Si elegiste un libro Creative Commons gratuito (ej. de bibliotecasdigitales.gov.co), nota la diferencia en sus créditos.
  checks:
  - Examiné los créditos de 1 libro real.
  - Identifiqué autor, editorial, año, licencia.
  - Detecté si hay mención de IA o no.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Un libro bajo la lupa legal». \textbf{Formato:} ficha con 5 datos del libro elegido. \textbf{Sabes que terminaste cuando} reconoces que cada libro tiene firma legal explícita.
sistematizacion:
  intro: |-
    Tu observación de 1 libro real te da contexto. Ahora necesitas la \textbf{anatomía profesional} de los derechos de autor en Colombia y su intersección con IA.
  pilares:
  - |-
    Los \textbf{2 tipos de derecho} se descomponen así: (1) \textbf{Derechos morales} (Ley 23/1982, art. 30): irrenunciables, intransferibles, perpetuos. Incluyen paternidad (siempre eres el autor), integridad (nadie puede modificar tu obra sin autorización), inédito (decides cuándo publicar), modificación, retiro. Aunque vendas todos los derechos patrimoniales, los morales siguen siendo tuyos. (2) \textbf{Derechos patrimoniales} (Ley 23/1982, art. 12): transferibles, temporales (80 años después de la muerte), negociables. Incluyen reproducción, distribución, comunicación pública, traducción, adaptación, regalías. Estos son los que se ceden cuando firmas contrato con editorial.
  - |-
    Las \textbf{licencias Creative Commons} más usadas son 4: (a) \textbf{CC BY (Atribución)}: cualquiera puede usar tu obra, incluso comercialmente, mientras te dé crédito. La más permisiva. (b) \textbf{CC BY-NC (Atribución-No comercial)}: pueden usarla con crédito, pero no para fines comerciales. (c) \textbf{CC BY-SA (Atribución-Compartir igual)}: pueden usarla con crédito, pero obras derivadas deben tener la misma licencia. (d) \textbf{CC BY-NC-ND (Atribución-No comercial-Sin obras derivadas)}: la más restrictiva de las CC. Frente a estas, \emph{``todos los derechos reservados''} es lo más restrictivo posible: nadie puede usar tu obra sin permiso explícito. La elección depende de tu objetivo: difundir ampliamente vs proteger comercialmente.
  - |-
    En cuanto a \textbf{IA y derechos}, los consensos legales en 2026 son: (a) Los modelos de IA \textbf{no son autores legales} (no son personas naturales ni jurídicas). (b) Si la \textbf{intervención humana es sustancial} (estructura, voz, edición, decisiones), la obra es del humano con declaración honesta. (c) Si la obra es \textbf{100 por ciento generada por IA sin intervención significativa}, su estatus es incierto: en EE.UU. la USCO la considera no protegible; en Colombia y la mayoría de la UE, sigue en debate. (d) La \textbf{declaración explícita de uso de IA} es buena práctica ética siempre, aunque legalmente todavía no sea obligatoria en muchos países.
  - |-
    Algoritmo de elección de licencia: (1) si tu objetivo es difundir y que tu libro llegue a muchos lectores, elige CC BY o CC BY-SA. (2) si quieres difundir pero impedir uso comercial, CC BY-NC. (3) si quieres proteger comercialmente o piensas publicar con editorial tradicional, todos los derechos reservados. (4) escribe la ficha con los 6 elementos. (5) declara explícitamente uso de IA aunque no sea obligatorio.
  anatomia:
    titulo: Anatomía de los derechos
    body: |-
      \textbf{Morales:} intransferibles, perpetuos. \\[1mm] \textbf{Patrimoniales:} transferibles, 80 años. \\[1mm] \textbf{Creative Commons:} BY / BY-NC / BY-SA / BY-NC-ND. \\[1mm] \textbf{Todos los derechos reservados:} máxima protección. \\[1mm] \textbf{IA y derechos:} declaración honesta como buena práctica.
  errores_comunes: |-
    (1) \textbf{No declarar uso de IA}: puede constituir fraude editorial. (2) \textbf{Confundir morales y patrimoniales}: ceder todo sin saber que los morales son intransferibles. (3) \textbf{Elegir licencia sin entenderla}: usar CC BY pensando que es restrictiva. (4) \textbf{Olvidar atribuir fuentes citadas}: usar texto ajeno sin acreditar. (5) \textbf{Asumir que IA = no tiene derechos}: los modelos no son autores, pero los datos con los que fueron entrenados sí tienen derechos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía derechos». \textbf{Formato:} (a) morales vs patrimoniales con ejemplo; (b) 4 licencias CC con uso; (c) IA y derechos con 3 consensos; (d) los 5 errores con marca. \textbf{Sabes que terminaste cuando} podrías explicarle a tu familia qué licencia elegirás.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- 3 casos + ficha + reflexión} (40 min · individual). Hora de aplicar. Analizas 3 casos reales recientes de polémicas IA-derechos, escribes tu ficha de derechos con 6 elementos, reflexionas sobre la licencia elegida.
  pilares:
  - |-
    Los 3 casos a analizar deben ser de \textbf{2023-2026} (no más viejos, el campo cambia rápido). Ejemplos de búsqueda: \emph{``Getty Images vs Stability AI''}, \emph{``New York Times vs OpenAI''}, \emph{``escritores demandan a Meta IA''}, \emph{``Sarah Silverman demanda OpenAI''}, \emph{``polémica imagen IA premio Sony 2023''}, \emph{``Hollywood huelga IA 2023''}. Para cada caso, anota: (a) quién demanda a quién, (b) cuál es la disputa legal, (c) qué ha pasado o se espera. 1 párrafo por caso.
  - |-
    La ficha de derechos de tu libro tiene los 6 elementos en formato estándar: \textbf{(1) Autor:} nombre completo, año. \textbf{(2) Licencia:} elegida y justificada. \textbf{(3) Uso de IA:} qué modelos usaste, en qué partes del proceso, qué porcentaje aproximado del texto generaste con IA y editaste tú. \textbf{(4) Fuentes citadas:} si usaste citas de otros autores, lista de referencias. \textbf{(5) Derechos morales vs patrimoniales:} declaración explícita de cuáles conservas y cuáles podrías ceder. \textbf{(6) Contacto:} cómo te pueden encontrar para permisos.
  - |-
    Sigue el patrón \textbf{``transparencia sobre opacidad''}: aunque la ley no exija declarar IA en Colombia (en 2026), la práctica ética profesional sí lo pide. Declarar honestamente fortalece tu credibilidad como editor. Ocultar el uso de IA puede causar daño cuando se descubra (y se descubre tarde o temprano, las herramientas de detección de IA mejoran).
  - |-
    Algoritmo: (1) buscar 3 noticias 2023-2026. (2) resumir cada caso en 1 párrafo. (3) escribir ficha de derechos con los 6 elementos. (4) reflexionar 5 líneas sobre licencia elegida.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 3 casos reales analizados (2023-2026). \\[1mm] \checkbox Ficha con autor y fecha completos. \\[1mm] \checkbox Licencia elegida y justificada. \\[1mm] \checkbox Declaración explícita de uso de IA con porcentaje. \\[1mm] \checkbox Fuentes citadas (si aplica). \\[1mm] \checkbox Derechos morales y patrimoniales mencionados. \\[1mm] \checkbox Contacto del autor. \\[1mm] \checkbox Reflexión de 5 líneas sobre la licencia.
  plantilla_guion: |-
    \textbf{Caso 1.} \textit{Quién, qué disputa, qué pasó.} \\[1mm] \textbf{Caso 2.} \textit{Quién, qué disputa, qué pasó.} \\[1mm] \textbf{Caso 3.} \textit{Quién, qué disputa, qué pasó.} \\[1mm] \textbf{Ficha.} \textit{Autor + licencia + uso IA + fuentes + morales/patrimoniales + contacto.} \\[1mm] \textbf{Reflexión.} \textit{Por qué esta licencia.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Derechos de mi libro». \textbf{Formato:} (a) 3 casos analizados; (b) ficha completa; (c) reflexión sobre la licencia. \textbf{Sabes que terminaste cuando} podrías mostrar tu ficha a un asesor legal sin avergonzarte.
  producto_titulo: Análisis 3 casos + ficha de derechos + reflexión sobre licencia
  criterios:
  - 3 casos reales 2023-2026 analizados
  - Ficha con los 6 elementos completos
  - Declaración honesta de uso de IA
  - Licencia justificada con criterio
  - Distinción morales vs patrimoniales
  - Contacto del autor incluido
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Declarar autoría con honestidad en la era de la IA es acto de dignidad cultural y profesional.
    aplicacion: |-
      Cuando declaras explícitamente que usaste IA en tu libro, no estás debilitando tu autoría: la estás \textbf{fortaleciendo con honestidad}. La filosofía de la liberación pide ese acto: \emph{no esconder lo que hicimos con la herramienta}. La firma transparente respeta al lector, respeta el oficio editorial, y te entrena para una práctica profesional sostenible. Quien oculta uso de IA acumula deuda ética que tarde o temprano cobra.
    pregunta_espejo: |-
      ¿Mi ficha declara con honestidad el uso de IA, o intento ocultarlo por miedo o costumbre?
  estoico:
    autor: Séneca
    cita: |-
      La firma honesta es virtud del oficio; la firma engañosa es vicio que se descubre con el tiempo.
    aplicacion: |-
      Es tentador firmar un libro como \emph{``escrito por mí''} cuando la IA generó la mitad. La sabiduría estoica recomienda lo opuesto: \emph{declara con honestidad lo que hiciste tú y lo que hizo la herramienta}. La firma con asterisco honesto vale más que la firma limpia con engaño. El oficio del editor profesional se sostiene en la transparencia, no en la imagen.
    pregunta_espejo: |-
      ¿Estoy firmando con honestidad sobre cómo se hizo el libro, o quiero parecer más autor de lo que fui?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La transparencia editorial es la nueva ética en la era de la IA generativa; ocultar uso es fraude moderno disfrazado de autoría tradicional.
    aplicacion: |-
      En la era de la IA generativa, la transparencia sobre el uso de herramientas es la nueva norma ética profesional. Quien declara: \emph{``este libro fue escrito por mí con asistencia de IA en estos aspectos''}, se posiciona como profesional contemporáneo responsable. Quien finge autoría tradicional cuando la IA fue protagonista, comete fraude editorial moderno. Tu ficha de hoy te entrena en esa práctica que rige toda producción editorial profesional del siglo XXI.
    pregunta_espejo: |-
      ¿Mi ficha contribuye a la transparencia editorial contemporánea, o sostiene la opacidad heredada del modelo pre-IA?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu ficha de derechos completa y los 3 casos analizados. En la sesión 7 vas a aprender a generar la \textbf{portada de tu libro con IA generativa de imagen} usando herramientas gratuitas (Bing Image Creator, Adobe Express, Leonardo.ai, Microsoft Designer). Los derechos de hoy te dan el marco; la portada de mañana es la primera imagen pública del libro.
web:
  conceptos_clave:
    - termino: Ley 23 de 1982
      definicion: |-
        Ley colombiana que regula los derechos de autor. Distingue derechos morales (perpetuos) y patrimoniales (negociables).
      ejemplo: |-
        Cuando publicas tu libro, los derechos morales son tuyos siempre. Los patrimoniales puedes ceder a una editorial.
      emoji: "📜"
    - termino: Derechos morales
      definicion: |-
        Intransferibles y perpetuos. Incluyen ser reconocido como autor, preservar integridad de la obra, decidir si publicar.
      ejemplo: |-
        Aunque vendas todos los derechos patrimoniales, sigues siendo autor reconocido del libro.
      emoji: "🪪"
    - termino: Derechos patrimoniales
      definicion: |-
        Transferibles y negociables. Incluyen reproducir, distribuir, traducir, adaptar y cobrar regalías.
      ejemplo: |-
        Una editorial te paga por imprimir y vender tu libro: estás cediendo derechos patrimoniales, no morales.
      emoji: "💼"
    - termino: IA y autoría
      definicion: |-
        El modelo de IA no tiene derechos de autor. Si tu intervención editorial es sustancial, la obra es tuya con declaración honesta.
      ejemplo: |-
        Tu libro con 30% de intervención humana directa y declaración de uso de IA es obra tuya bajo el marco actual.
      emoji: "🤖"
    - termino: Licencia Creative Commons
      definicion: |-
        Alternativa a "todos los derechos reservados". Permite compartir bajo condiciones (atribución, no comercial, sin derivadas, compartir igual).
      ejemplo: |-
        CC BY-NC-SA permite que otros usen tu libro citándote, sin fines comerciales y compartiéndolo bajo la misma licencia.
      emoji: "🔓"
  quiz:
    titulo: ¿Conoces los derechos del autor con IA?
    instrucciones: 5 preguntas para verificar que distingues derechos morales, patrimoniales y licencias.
    preguntas:
      - enunciado: ¿Cuál es la ley colombiana que regula los derechos de autor?
        opciones:
          - Ley 23 de 1982
          - Ley 100 de 1993
          - Ley 30 de 1992
          - Ley 1581 de 2012
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Ley 23 de 1982, complementada por la Decisión Andina 351 de 1993.
        feedback_incorrecto: |-
          Es la Ley 23 de 1982. Es marco principal de derechos de autor en Colombia.
      - enunciado: Los derechos morales son...
        opciones:
          - Transferibles y temporales
          - Solo para mayores de edad
          - Nunca se reconocen
          - Intransferibles y perpetuos
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. Intransferibles y perpetuos. Nunca dejan de ser tuyos aunque vendas todo lo demás.
        feedback_incorrecto: |-
          Son intransferibles y perpetuos. No se pueden ceder ni se acaban con el tiempo.
      - enunciado: La IA generativa, ¿tiene derechos de autor?
        opciones:
          - Sí, son del modelo
          - No, el modelo no es persona jurídica
          - Sí, son de la empresa creadora
          - Depende del país
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El modelo no tiene personalidad jurídica, así que no puede tener derechos de autor.
        feedback_incorrecto: |-
          La IA no tiene derechos de autor: no es persona jurídica.
      - enunciado: Si usas IA con intervención editorial sustancial, ¿de quién es la obra?
        opciones:
          - De la IA
          - De OpenAI
          - Tuya con declaración honesta del uso de IA
          - De nadie
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Bajo el marco actual, con intervención sustancial y declaración honesta, la obra es tuya.
        feedback_incorrecto: |-
          La obra es tuya con declaración honesta. La intervención humana sustancial es lo que sostiene la autoría.
      - enunciado: ¿Qué permite una licencia Creative Commons (CC)?
        opciones:
          - Bloquear todo uso
          - Solo vender la obra
          - Eliminar al autor
          - Compartir la obra bajo condiciones específicas (atribución, no comercial, etc.)
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. CC permite compartir bajo condiciones claras, alternativa a "todos los derechos reservados".
        feedback_incorrecto: |-
          Permite compartir bajo condiciones (atribución, no comercial, sin derivadas, compartir igual).

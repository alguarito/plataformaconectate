clave: 1-7
grado: 10
periodo: 1
sesion: 7
completo: true
titulo: Portada con IA generativa de imagen --- herramientas gratuitas
titulo_portada: |-
  Portada con IA ---
  herramientas gratuitas
  para generar imagen
producto_final: |-
  Portada definitiva de tu libro creada con al menos 1 herramienta gratuita de IA generativa de imagen (Bing Image Creator, Adobe Express, Leonardo.ai, Microsoft Designer, ideogram.ai) + 3 versiones probadas con prompts distintos + decisión final justificada por escrito + composición final agregando título del libro y nombre del autor sobre la imagen + declaración del modelo usado y respeto a los términos de uso de la herramienta
apertura:
  saber_ancestral: |-
    En la carrera 5 del centro de Cartago, en los talleres de pintura de carteles que sostuvieron la comunicación visual del pueblo antes de las imprentas digitales, había un personaje que cualquier comerciante del barrio recuerda: \textbf{el pintor de carteles}. Cuando alguien quería anunciar tienda, velorio, fiesta patronal o publicación nueva, iba al pintor con la idea. El pintor nunca tomaba el pincel y empezaba. Tenía un ritual previo silencioso: \textbf{bocetaba 3 versiones a lápiz}. Primera versión: idea visual obvia. Segunda: variación con cambio de composición. Tercera: algo distinto, atrevido, inesperado. Ponía los 3 bocetos sobre la mesa, llamaba al cliente, pedía que escogiera. El cliente miraba, comentaba, a veces decía \emph{``mezcla la 1 con la 3''}. Solo después de la elección, el pintor tomaba el pincel. La sabiduría era simple: \textbf{una sola idea visual rara vez es la mejor; 3 versiones permiten elegir con criterio}. La portada con IA generativa es ese boceto multiplicado por 100. Pero el oficio del editor (elegir, decidir, firmar) sigue siendo humano.
  saber_contemporaneo: |-
    Las \textbf{herramientas gratuitas de IA generativa de imagen} en 2026 son varias, cada una con fortalezas distintas: (1) \textbf{Bing Image Creator} (\texttt{bing.com/images/create}): basado en DALL-E 3, gratis, requiere cuenta Microsoft. Bueno para estilos variados. (2) \textbf{Adobe Express} (\texttt{adobe.com/express}): incluye \emph{text to image} en plan gratuito limitado. (3) \textbf{Leonardo.ai}: 150 imágenes gratis al día con cuenta. Mucho control sobre estilo. (4) \textbf{Microsoft Designer}: integra IA con composición de portadas, gratis con cuenta. (5) \textbf{Ideogram.ai}: especializado en imágenes con texto integrado, gratis con límite diario. La regla profesional: \textbf{cada herramienta tiene su estética; conviene probar 2-3 antes de decidir}. La estructura del \textbf{prompt para imagen} es distinta del prompt para texto: importan más los descriptores visuales (estilo artístico, paleta de color, composición, atmósfera) que las instrucciones narrativas. Términos clave: \emph{realistic}, \emph{watercolor}, \emph{cinematic}, \emph{minimalist}, \emph{vibrant}, \emph{moody}. Cada herramienta tiene términos de uso propios que conviene leer antes de comercializar el resultado.
  pregunta_puente: |-
    ¿Qué sabía el pintor de carteles al bocetar 3 versiones antes de pintar la definitiva, que el usuario novato de DALL-E olvida cuando acepta la primera imagen que sale? ¿Y por qué el prompt para imagen requiere descriptores visuales en lugar de instrucciones narrativas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 3-4 herramientas gratuitas de IA generativa de imagen más útiles y sus diferencias de estilo; (2) \textbf{aplicar} los descriptores visuales correctos para construir prompts de imagen efectivos; (3) \textbf{crear} 3 versiones de portada con prompts distintos y elegir la definitiva con criterio editorial; (4) \textbf{evaluar} la portada final agregando título y autor en composición final.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Tienes texto en V3, estructura cerrada, derechos definidos. Hoy le pones la \textbf{primera imagen pública} a tu libro: la portada que verá quien lo encuentre. Las próximas 2 sesiones (diagramación, producción) integrarán la portada con el contenido.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{auditoría rápida} de portadas: piensa en 3 portadas de libros que recuerdas (de cualquier libro que conozcas) y anota qué imagen tienen, qué colores, qué tipografía, qué te llamó la atención cuando las viste por primera vez.
  a_sistematizacion: |-
    Ya tienes 3 portadas referencia. Ahora vas a entender la \textbf{anatomía del prompt para imagen}: descriptores visuales, estilos, atmósfera, los 5 errores típicos (prompt narrativo en lugar de visual, esperar texto perfecto en imagen, ignorar términos de uso, aceptar la primera imagen, sin composición final con título).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: escribes 3 prompts visuales distintos, los pruebas en 1-2 herramientas, eliges la versión definitiva, agregas título y autor en composición final.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 3 versiones + decisión + composición final + declaración del modelo. El criterio principal: que cualquiera viendo la portada entienda qué libro es y se sienta llamado a abrirlo.
  a_evaluacion: |-
    Antes de cerrar, mira la portada desde las cinco dimensiones humanas. Elegir entre 3 versiones es disciplina del oficio; aceptar la primera es renunciar al criterio editorial.
  a_triangulo: |-
    Y para terminar, tres voces sobre la imagen del libro. Dussel sobre las portadas que dignifican al lector o lo manipulan, Marco Aurelio sobre la simplicidad como virtud visual, Floridi sobre la transparencia del autor de imagen IA.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 3 portadas referencia} (15 min · individual). Piensa en 3 portadas de libros que recuerdas vívidamente (puede ser un libro escolar, una novela, un manga, un libro de YouTuber). Para cada una, anota: (1) ¿qué imagen tiene (persona, objeto, abstracta, paisaje)? (2) ¿qué paleta de colores domina? (3) ¿cómo aparece el título (grande arriba, integrado a la imagen, abajo)? (4) ¿qué te hizo recordarla (impacto, simplicidad, color, misterio)? Esa observación intuitiva te enseña qué hace funcionar una portada.
  checks:
  - Elegí 3 portadas que recuerdo.
  - Respondí 4 preguntas sobre cada una.
  - Identifiqué qué las hace memorables.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 portadas referencia». \textbf{Formato:} ficha por cada portada con imagen, color, tipografía, impacto. \textbf{Sabes que terminaste cuando} ves qué elementos comunes hacen funcionar a una buena portada.
sistematizacion:
  intro: |-
    Tus 3 referencias te dan vocabulario visual. Ahora necesitas la \textbf{anatomía profesional} del prompt para imagen y las herramientas disponibles.
  pilares:
  - |-
    Los \textbf{descriptores visuales} más útiles para el prompt de imagen se descomponen así: (1) \textbf{Sujeto principal}: qué se ve (\emph{a teenage girl with headphones}, \emph{a tropical bird in a forest}, \emph{an open book on a wooden desk}). (2) \textbf{Estilo artístico}: \emph{photorealistic}, \emph{watercolor}, \emph{digital illustration}, \emph{minimalist vector}, \emph{oil painting}, \emph{anime style}, \emph{pencil sketch}. (3) \textbf{Paleta y atmósfera}: \emph{vibrant warm colors}, \emph{moody dark tones}, \emph{pastel palette}, \emph{high contrast black and white}, \emph{golden hour lighting}. (4) \textbf{Composición}: \emph{centered}, \emph{rule of thirds}, \emph{close-up}, \emph{wide shot}, \emph{symmetrical}. (5) \textbf{Detalles contextuales}: ambiente, objetos secundarios, época, lugar.
  - |-
    Las \textbf{4 herramientas gratuitas} principales en 2026: (a) \textbf{Bing Image Creator}: rápido, basado en DALL-E 3, generoso con créditos gratuitos. Excelente como primera opción. (b) \textbf{Leonardo.ai}: 150 imágenes/día gratis, mucho control sobre modelos y estilos. (c) \textbf{Microsoft Designer}: bueno para combinar imagen IA + composición final con texto y plantillas. (d) \textbf{Ideogram.ai}: el mejor para integrar texto legible dentro de la imagen (otros modelos fallan con texto).
  - |-
    Lo esencial cabe en una pregunta: \emph{¿esta imagen captura la esencia del libro?}. Si tu libro habla de adolescentes y ansiedad, una imagen genérica de \emph{``persona sonriendo''} no captura. Si tu libro es manual de emprendimiento, una imagen \emph{``corporativa estándar''} tampoco. La phronesis del editor consiste en \textbf{rechazar imágenes que no representan el contenido, aunque sean técnicamente buenas}.
  - |-
    Algoritmo: (1) revisar tus 3 portadas referencia. (2) escribir 3 prompts distintos (3 enfoques visuales para tu libro). (3) probar cada prompt en al menos 1 herramienta gratuita. (4) generar al menos 3-4 imágenes por prompt. (5) elegir las 3 mejores en total. (6) decidir la definitiva con criterio. (7) agregar título y autor en composición final usando Canva o Microsoft Designer.
  anatomia:
    titulo: Anatomía del prompt para imagen
    body: |-
      \textbf{Sujeto:} qué se ve, en 3-5 palabras. \\[1mm] \textbf{Estilo:} artístico (foto, acuarela, digital, etc.). \\[1mm] \textbf{Paleta:} colores y atmósfera. \\[1mm] \textbf{Composición:} encuadre y enfoque. \\[1mm] \textbf{Detalles:} ambiente y contexto.
  errores_comunes: |-
    (1) \textbf{Prompt narrativo en vez de visual}: \emph{``una niña que está triste por algo''} en lugar de \emph{``close-up of a teenage girl, dim lighting, watercolor style, melancholic mood''}. (2) \textbf{Esperar texto perfecto en imagen}: la mayoría de modelos fallan con texto integrado (excepto Ideogram). (3) \textbf{Ignorar términos de uso}: cada herramienta tiene reglas distintas sobre uso comercial. (4) \textbf{Aceptar la primera imagen}: similar al primer borrador, casi nunca es la mejor. (5) \textbf{Sin composición final con título}: la imagen IA es solo la base; el título y autor se agregan después con Canva o similar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía prompt imagen». \textbf{Formato:} (a) los 5 descriptores con ejemplo; (b) 4 herramientas con su uso; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} podrías escribir un prompt visual sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- 3 versiones + portada definitiva + composición final} (40 min · individual con dispositivo). Hora de aplicar. Escribes 3 prompts visuales distintos, generas imágenes, eliges, compones con título y autor.
  pilares:
  - |-
    Tu portada se construye en 6 pasos: (1) escribir 3 prompts visuales distintos para tu libro (3 enfoques: realista, ilustrado, conceptual). (2) probar cada uno en al menos 1 herramienta (Bing Image Creator es buen primer paso). (3) generar 3-4 imágenes por prompt. (4) elegir las 3 mejores en total. (5) decidir la versión definitiva con criterio editorial (¿cuál representa mejor el libro?). (6) llevar la imagen elegida a Canva o Microsoft Designer y agregar título grande, autor más pequeño, en composición final.
  - |-
    Sigue el patrón \textbf{``imagen IA + composición humana''}: la imagen pura de la IA rara vez es portada final. Necesita agregarse título legible, nombre del autor, posiblemente subtítulo. Esa composición es trabajo humano del editor con herramientas gratuitas (Canva, Designer, Express). La portada final es la unión de imagen generada con composición curada.
  - |-
    La decisión justificada por escrito tiene 3 puntos: (a) cuál elegí, (b) por qué representa mejor el libro, (c) qué descarté de las otras dos y por qué. 1 párrafo total. Esta justificación demuestra criterio editorial, no aceptación pasiva de la IA.
  - |-
    Algoritmo: (1) escribir 3 prompts. (2) generar imágenes. (3) elegir 3 mejores. (4) decidir definitiva. (5) componer con título y autor. (6) justificar decisión. (7) declarar modelo usado y respetar términos de uso de la herramienta.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 3 prompts visuales distintos escritos. \\[1mm] \checkbox Probados en al menos 1 herramienta gratuita. \\[1mm] \checkbox 3 versiones de portada generadas. \\[1mm] \checkbox Decisión final justificada por escrito. \\[1mm] \checkbox Composición final con título y autor agregados. \\[1mm] \checkbox Modelo de IA declarado por escrito. \\[1mm] \checkbox Términos de uso de la herramienta verificados.
  plantilla_guion: |-
    \textbf{Prompt 1.} \textit{Enfoque realista o fotográfico.} \\[1mm] \textbf{Prompt 2.} \textit{Enfoque ilustrado o artístico.} \\[1mm] \textbf{Prompt 3.} \textit{Enfoque conceptual o abstracto.} \\[1mm] \textbf{Decisión.} \textit{Cuál elegí + por qué + qué descarté.} \\[1mm] \textbf{Composición.} \textit{Imagen + título + autor en herramienta gratuita.} \\[1mm] \textbf{Declaración.} \textit{Modelo IA usado + términos de uso.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Mi portada». \textbf{Formato:} (a) los 3 prompts; (b) referencias a las 3 versiones generadas; (c) portada definitiva con composición; (d) decisión justificada; (e) declaración del modelo. \textbf{Sabes que terminaste cuando} tienes portada lista para diagramación.
  producto_titulo: 3 versiones + portada definitiva + composición final + declaración del modelo
  criterios:
  - 3 prompts visuales distintos
  - Probados en herramientas gratuitas
  - 3 versiones de portada generadas
  - Decisión justificada con criterio editorial
  - Composición final con título y autor
  - Declaración del modelo usado
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Una portada que representa al libro con dignidad respeta al lector; una que engaña visualmente lo manipula.
    aplicacion: |-
      La portada es el primer contacto del lector con el libro. Si engaña sobre el contenido (imagen comercial que no representa el tema real), traiciona al lector. La filosofía de la liberación pide portadas que sean \textbf{anticipo honesto del contenido}, no carnada para venta. La phronesis del editor consiste en \textbf{elegir la portada que el lector aprobará después de leer, no la que más vende}.
    pregunta_espejo: |-
      ¿Mi portada anticipa con honestidad el contenido, o promete algo que el libro no cumple?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Lo simple comunica; lo recargado distrae. La virtud visual está en lo que se quita.
    aplicacion: |-
      Es tentador llenar la portada con elementos para que se vea \emph{``profesional''}. La sabiduría estoica recomienda lo opuesto: \emph{quita hasta que solo quede lo esencial}. Las portadas más memorables del mundo tienen pocos elementos pero precisos. La phronesis visual del editor consiste en \textbf{resistir la tentación del adorno innecesario}.
    pregunta_espejo: |-
      ¿Mi portada tiene solo lo esencial, o agregué cosas que se pueden quitar sin perder mensaje?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Declarar el uso de IA en la portada es transparencia editorial moderna; ocultarlo es fraude visual.
    aplicacion: |-
      En la era de IA generativa, declarar que la portada fue creada con asistencia de IA es práctica ética emergente. No te resta autoría como editor: te suma transparencia profesional. Tu declaración del modelo usado es ya acto ético que muchos autores aún no hacen. Te entrena para una práctica que será estándar en pocos años.
    pregunta_espejo: |-
      ¿Mi declaración del modelo IA es transparente, o intenté ocultarlo para parecer más \emph{``auténtico''}?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu portada definitiva, las 3 versiones probadas y la declaración del modelo. En la sesión 8 vas a aprender \textbf{diagramación con herramientas gratuitas}: Canva, Google Docs, LibreOffice. La portada de hoy es el rostro; la diagramación de mañana es el cuerpo del libro.
web:
  conceptos_clave:
    - termino: Bing Image Creator
      definicion: |-
        Generador gratuito basado en DALL-E 3. Acceso con cuenta Microsoft. Bueno para estilos variados.
      ejemplo: |-
        En bing.com/images/create escribes el prompt visual y obtienes 4 imágenes en pocos segundos.
      emoji: "🎨"
    - termino: Leonardo.ai
      definicion: |-
        Herramienta gratuita con 150 imágenes diarias. Ofrece mucho control sobre estilo, paleta y composición.
      ejemplo: |-
        Eliges un modelo, pasas el prompt y ajustas parámetros como aspect ratio y nivel de detalle.
      emoji: "🦁"
    - termino: Microsoft Designer
      definicion: |-
        Integra IA con composición de portadas. Permite combinar imagen generada con texto editorial gratis.
      ejemplo: |-
        Generas una imagen y la pones como fondo de una portada con el título de tu libro, todo en la misma herramienta.
      emoji: "🎯"
    - termino: Prompt para imagen
      definicion: |-
        Distinto al prompt de texto. Importan descriptores visuales: estilo, paleta, composición, atmósfera.
      ejemplo: |-
        "Portada minimalista, acuarela, paleta verde y dorado, cinematic light, atmósfera contemplativa, sin texto."
      emoji: "🖼️"
    - termino: Estética por herramienta
      definicion: |-
        Cada generador tiene su huella visual. Probar 2-3 antes de decidir cuál se ajusta mejor al libro.
      ejemplo: |-
        Mismo prompt en Bing, Leonardo e Ideogram da 3 estéticas distintas. Elige la que dialogue con tu libro.
      emoji: "🔬"
  quiz:
    titulo: ¿Generas portadas con criterio profesional?
    instrucciones: 5 preguntas para verificar que dominas las herramientas y el prompt visual.
    preguntas:
      - enunciado: ¿Cuál de estas herramientas es gratuita y basada en DALL-E 3?
        opciones:
          - Photoshop
          - Word
          - Bing Image Creator
          - WhatsApp
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Bing Image Creator usa DALL-E 3 con cuenta Microsoft, gratis.
        feedback_incorrecto: |-
          Es Bing Image Creator (bing.com/images/create). Gratis, basado en DALL-E 3.
      - enunciado: ¿Qué importa más en un prompt para imagen?
        opciones:
          - Descriptores visuales (estilo, paleta, composición, atmósfera)
          - La gramática perfecta
          - El idioma latín
          - El tamaño de letra
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. El prompt visual gira en torno a descriptores visuales, no en narrativa larga.
        feedback_incorrecto: |-
          Importan los descriptores visuales: estilo, paleta, composición, atmósfera, encuadre.
      - enunciado: ¿Por qué conviene probar 2-3 herramientas antes de decidir?
        opciones:
          - Para perder tiempo
          - Porque cada herramienta tiene su estética propia
          - Porque son todas iguales
          - Porque es obligatorio
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Cada herramienta tiene huella visual; probar varias permite elegir la que más dialoga con el libro.
        feedback_incorrecto: |-
          Cada herramienta tiene estética distinta. Probar 2-3 permite elegir la mejor para tu libro.
      - enunciado: ¿Qué término sirve para describir atmósfera dramática en un prompt visual?
        opciones:
          - bonita
          - bueno
          - normal
          - moody / cinematic
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. "Moody" o "cinematic" son descriptores estándar que entienden los generadores.
        feedback_incorrecto: |-
          Términos como "moody" o "cinematic" funcionan mucho mejor que adjetivos vagos como "bonita".
      - enunciado: Antes de usar la portada generada comercialmente, ¿qué hay que revisar?
        opciones:
          - Nada
          - El idioma de la imagen
          - El precio
          - Los términos de uso de la herramienta
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Cada herramienta tiene sus condiciones. Hay que leer antes de comercializar.
        feedback_incorrecto: |-
          Hay que leer los términos de uso. Algunas herramientas exigen atribución o limitan uso comercial.

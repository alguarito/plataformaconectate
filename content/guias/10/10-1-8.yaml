clave: 1-8
grado: 10
periodo: 1
sesion: 8
completo: true
titulo: Diagramación con herramientas gratuitas --- Canva, Google Docs, LibreOffice
titulo_portada: |-
  Diagramación ---
  Canva, Google Docs
  y LibreOffice
producto_final: |-
  Documento maquetado de tu libro con (a) plantilla profesional elegida y aplicada en Canva, Google Docs o LibreOffice, (b) tipografía coherente con 1-2 familias máximo (1 para títulos, 1 para cuerpo), (c) jerarquía visual clara con 4 niveles (título de libro, título de capítulo, subtítulo, cuerpo), (d) numeración de páginas automática y tabla de contenido autogenerada, (e) capítulo de muestra completamente diagramado de al menos 6 páginas con la maquetación final aplicada
apertura:
  saber_ancestral: |-
    En el centro de Cartago, en las imprentas pequeñas que sostuvieron las publicaciones locales antes de la era digital, había un oficio invisible para el cliente pero crucial para la calidad del libro: \textbf{el imprentero que organizaba los tipos}. Los \emph{tipos} eran las piezas físicas de metal, cada una con una letra grabada. Antes de imprimir cualquier página, el imprentero tomaba los tipos uno por uno y los acomodaba en una caja llamada \emph{platina}, en el orden exacto del texto. Si quería poner \emph{LIBRO}, tomaba L, I, B, R, O y los alineaba. Si los tipos quedaban desordenados, la página salía \emph{LBRIO} o peor. Cada letra tenía su cajón en una bandeja grande: las mayúsculas en cajones grandes (de ahí viene el nombre \emph{caja alta}), las minúsculas en cajones pequeños (\emph{caja baja}). El imprentero memorizaba la posición de cada letra: podía componer una línea sin mirar. La disciplina era estricta: \textbf{cada letra en su lugar, cada renglón en su orden, cada página alineada con la siguiente}. Si fallaba, el libro completo salía mal. Esa práctica ancestral de organización tipográfica es la misma disciplina que la diagramación moderna pide con herramientas digitales gratuitas.
  saber_contemporaneo: |-
    La \textbf{diagramación} (también llamada maquetación, layout o tipografía aplicada) es el arte de organizar texto e imagen en páginas para que sean legibles, coherentes y agradables. En 2026, hay 3 herramientas gratuitas que cubren la mayoría de necesidades: (1) \textbf{Canva} (\texttt{canva.com}): el más fácil para principiantes. Tiene plantillas de libros gratuitas, drag-and-drop, exportación a PDF. Ideal si tu libro tiene componente visual fuerte (manuales, libros ilustrados, fanzines). (2) \textbf{Google Docs} (\texttt{docs.google.com}): integrado con tu cuenta, colaborativo, exportación a PDF. Bueno para libros mayormente de texto (novelas, ensayos, memorias). Tiene estilos, tabla de contenido automática, numeración de páginas. (3) \textbf{LibreOffice Writer}: gratis, descargable, similar a Word. Bueno para control fino de la maquetación y para usuarios que prefieren trabajar offline. La regla profesional: \textbf{elige la herramienta según el tipo de libro, no según la moda}. Para tu libro de 80 páginas, las 3 funcionan; lo importante es aplicar bien los \textbf{4 principios fundamentales}: tipografía coherente, jerarquía visual clara, espacios respirables, numeración automática.
  pregunta_puente: |-
    ¿Qué sabía el imprentero al acomodar cada tipo en su cajón con disciplina, que el novato olvida cuando entrega un libro con 5 tipografías mezcladas y márgenes inconsistentes? ¿Y por qué los 4 principios de diagramación valen más que las plantillas elegantes mal aplicadas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuál herramienta gratuita conviene a tu tipo de libro; (2) \textbf{aplicar} los 4 principios fundamentales de diagramación (tipografía coherente, jerarquía visual, espacios respirables, numeración automática); (3) \textbf{crear} la maquetación completa del capítulo de muestra con todos los elementos; (4) \textbf{evaluar} la legibilidad y coherencia de tu diagramación antes de pasar a la producción final.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Tienes texto V3, estructura cerrada, derechos definidos, portada lista. Hoy le pones \textbf{cuerpo visual} al libro: tipografía, márgenes, jerarquía, numeración. La sesión 9 (producción final) integrará todo en el PDF final de 80 páginas.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{auditoría rápida} de un libro físico que tengas a mano (de tu casa, biblioteca o aula): anota qué tipografía usa para títulos vs cuerpo, qué tamaño tienen los márgenes, cómo numera las páginas, qué tipos de jerarquía visual hay (capítulo, subtítulo, etc.).
  a_sistematizacion: |-
    Ya tienes referencia visual. Ahora vas a entender la \textbf{anatomía de los 4 principios de diagramación}: tipografía coherente, jerarquía visual, espacios respirables, numeración automática. Y los 5 errores típicos del editor novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: eliges herramienta, aplicas plantilla profesional, configuras tipografía, defines jerarquía, agregas numeración, diagramas el capítulo de muestra completo.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: documento con plantilla + tipografía + jerarquía + numeración + capítulo diagramado. El criterio principal: que tu capítulo de muestra se vea como página de libro profesional, no como documento Word casual.
  a_evaluacion: |-
    Antes de cerrar, mira la diagramación desde las cinco dimensiones humanas. Maquetar con disciplina es respeto por el lector que verá tu libro; entregar texto crudo sin diagramación es desprecio del oficio editorial.
  a_triangulo: |-
    Y para terminar, tres voces sobre la organización visual. Dussel sobre los libros que respetan al lector apurado, Marco Aurelio sobre la coherencia tipográfica, Floridi sobre la diagramación como ética de la legibilidad.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Auditoría visual de un libro físico} (15 min · individual). Toma un libro físico que tengas a mano. Sin leer el contenido, examina la maquetación. Anota: (1) ¿qué tipografía usa para títulos de capítulo? ¿es la misma del cuerpo o distinta? (2) ¿qué tamaño aproximado tienen los márgenes (estrecho, mediano, ancho)? (3) ¿cómo numera las páginas (abajo centrado, arriba al lado, sin numeración)? (4) ¿cuántos niveles de jerarquía ves (título de libro, capítulo, subtítulo, cuerpo, pie de página)? (5) ¿hay encabezado con título del capítulo? Esa observación intuitiva te enseña el oficio de la maquetación.
  checks:
  - Examiné un libro físico con criterio visual.
  - Identifiqué tipografía, márgenes, numeración, jerarquía.
  - Reconozco que la maquetación se nota cuando funciona bien.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Auditoría visual de un libro». \textbf{Formato:} ficha con 5 datos observados + 1 línea sobre qué hace que se sienta profesional. \textbf{Sabes que terminaste cuando} reconoces los principios invisibles que sostienen un libro bien hecho.
sistematizacion:
  intro: |-
    Tu auditoría te da vocabulario visual. Ahora necesitas la \textbf{anatomía formal} de los 4 principios de diagramación profesional.
  pilares:
  - |-
    Los \textbf{4 principios fundamentales} de diagramación se descomponen así: (1) \textbf{Tipografía coherente}: máximo 2 familias en todo el libro. Una para títulos (puede ser sans-serif o serif distintiva, ej. Inter, Montserrat, Playfair), otra para cuerpo (típicamente serif legible, ej. Georgia, Lora, Merriweather). Tamaños tipo: título libro 28-36pt, capítulo 18-22pt, subtítulo 14-16pt, cuerpo 11-12pt, pie 9-10pt. (2) \textbf{Jerarquía visual clara}: cada nivel debe distinguirse a simple vista por tamaño, peso (bold) o color. El lector debe poder ubicarse sin esfuerzo. (3) \textbf{Espacios respirables}: márgenes de 2-2.5cm en libros, interlineado de 1.3-1.5, espacios entre párrafos. La página saturada cansa. (4) \textbf{Numeración automática}: nunca a mano. En Docs y LibreOffice: Insertar → Número de página. En Canva: usar plantilla que ya la tenga.
  - |-
    La \textbf{tabla de contenido automática} se genera en Docs/LibreOffice así: (a) marca cada título de capítulo con estilo \emph{Encabezado 1}. (b) marca subtítulos con \emph{Encabezado 2}. (c) ve al inicio del documento → Insertar → Tabla de contenidos. La tabla se genera sola y se puede actualizar si añades capítulos. En Canva la tabla de contenido se diseña a mano pero los enlaces internos también se pueden usar.
  - |-
    Las \textbf{plantillas profesionales} en Canva: busca \emph{``book interior''}, \emph{``ebook template''}, \emph{``novel layout''}. Hay decenas gratuitas. En Docs: usa los estilos predefinidos (Heading 1, Heading 2, Normal text) y configura márgenes en Archivo → Configuración de página. En LibreOffice: similar a Docs pero con más control fino de paginación.
  - |-
    Algoritmo: (1) elegir herramienta según tipo de libro. (2) abrir plantilla o documento nuevo. (3) configurar tamaño de página (típico A5 o carta personalizada). (4) elegir 2 tipografías (una para títulos, una para cuerpo). (5) aplicar estilos a los 4 niveles. (6) configurar márgenes y interlineado. (7) insertar numeración automática. (8) generar tabla de contenido. (9) diagramar capítulo de muestra completo.
  anatomia:
    titulo: Anatomía de la diagramación
    body: |-
      \textbf{Tipografía:} máximo 2 familias. \\[1mm] \textbf{Jerarquía:} 4 niveles distinguibles. \\[1mm] \textbf{Espacios:} márgenes + interlineado respirables. \\[1mm] \textbf{Numeración:} automática siempre. \\[1mm] \textbf{Tabla de contenido:} autogenerada con estilos.
  errores_comunes: |-
    (1) \textbf{Mezcla de tipografías}: 4-5 fuentes distintas hacen el libro caótico. (2) \textbf{Sin jerarquía clara}: el lector no sabe si está en capítulo nuevo o sigue en el anterior. (3) \textbf{Páginas saturadas}: márgenes mínimos, interlineado apretado, texto que asfixia. (4) \textbf{Numeración manual}: si añades una página, todo el resto queda mal. (5) \textbf{Sin tabla de contenido}: el lector no puede saltar entre capítulos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía diagramación». \textbf{Formato:} (a) los 4 principios con valores típicos; (b) las 3 herramientas con su uso; (c) los 5 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías diagramar otro libro sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Diagramación del capítulo de muestra} (40 min en sesión + tiempo en casa · individual con dispositivo). Hora de aplicar. Eliges herramienta, configuras plantilla, diagramas el capítulo de muestra completo de 6+ páginas con todos los elementos.
  pilares:
  - |-
    Tu diagramación se construye en 7 pasos: (1) elegir herramienta (recomiendo Google Docs para libros mayormente de texto, Canva para libros visuales). (2) abrir plantilla o crear documento nuevo configurando tamaño A5 o carta personalizada. (3) elegir tipografía: 1 para títulos, 1 para cuerpo. (4) aplicar estilos a los 4 niveles. (5) configurar márgenes (2-2.5cm) e interlineado (1.3-1.5). (6) insertar numeración automática. (7) diagramar el capítulo de muestra de 6+ páginas con todos los elementos visibles.
  - |-
    Sigue el patrón \textbf{``coherencia sobre variedad''}: el lector se beneficia de la coherencia visual, no de la variedad. Si tu capítulo 1 tiene tipografía X y tu capítulo 5 tipografía Y, el lector se desconcentra. La phronesis del diagramador consiste en \textbf{aplicar las mismas reglas a todo el libro sin excepción}.
  - |-
    El capítulo de muestra completo debe demostrar: (a) título de capítulo con estilo definido. (b) al menos 1 subtítulo intermedio. (c) cuerpo de texto con interlineado correcto. (d) numeración de páginas funcionando. (e) encabezado de página si lo usas. (f) espacios respirables al inicio y fin del capítulo. (g) ortografía y puntuación revisadas.
  - |-
    Algoritmo: (1) elegir herramienta. (2) configurar plantilla. (3) aplicar tipografía. (4) aplicar estilos. (5) configurar márgenes. (6) insertar numeración. (7) diagramar 6+ páginas del capítulo. (8) verificar legibilidad en pantalla y en PDF exportado.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Herramienta elegida y plantilla aplicada. \\[1mm] \checkbox 1-2 tipografías máximo (no más). \\[1mm] \checkbox 4 niveles de jerarquía visible. \\[1mm] \checkbox Márgenes 2-2.5cm e interlineado 1.3-1.5. \\[1mm] \checkbox Numeración de páginas automática. \\[1mm] \checkbox Tabla de contenido autogenerada (si aplica). \\[1mm] \checkbox Capítulo de muestra de 6+ páginas diagramado. \\[1mm] \checkbox PDF exportado y revisado.
  plantilla_guion: |-
    \textbf{Herramienta.} \textit{Canva / Docs / LibreOffice.} \\[1mm] \textbf{Tipografía.} \textit{1 para títulos, 1 para cuerpo.} \\[1mm] \textbf{Jerarquía.} \textit{4 niveles con estilos.} \\[1mm] \textbf{Espacios.} \textit{Márgenes + interlineado.} \\[1mm] \textbf{Numeración.} \textit{Automática.} \\[1mm] \textbf{TOC.} \textit{Autogenerada con estilos.} \\[1mm] \textbf{Capítulo muestra.} \textit{6+ páginas diagramadas.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Capítulo diagramado». \textbf{Formato:} (a) referencia al archivo Docs/Canva/LibreOffice; (b) capturas del capítulo diagramado; (c) decisiones tipográficas explicadas; (d) PDF exportado del capítulo de muestra. \textbf{Sabes que terminaste cuando} tu capítulo se ve como página de libro profesional.
  producto_titulo: Documento maquetado + capítulo de muestra de 6+ páginas + PDF
  criterios:
  - Herramienta gratuita aplicada correctamente
  - 1-2 tipografías coherentes
  - 4 niveles de jerarquía visible
  - Márgenes y interlineado respirables
  - Numeración automática funcionando
  - Capítulo de muestra de 6+ páginas
  - PDF exportado para revisión
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La diagramación clara respeta al lector apurado; la página saturada lo expulsa antes de leer.
    aplicacion: |-
      La mayoría de tus lectores leerán tu libro en condiciones imperfectas: en el bus, antes de dormir, entre clases. La filosofía de la liberación pide diseñar para esas condiciones: tipografía legible, espacios respirables, jerarquía clara. La página saturada exige condiciones ideales que el lector real no tiene. La phronesis del diagramador consiste en \textbf{respetar el contexto real de lectura, no el ideal académico}.
    pregunta_espejo: |-
      ¿Mi diagramación respeta al lector en condiciones reales, o asume lector ideal con tiempo ilimitado?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La coherencia tipográfica es virtud editorial; la mezcla caprichosa es debilidad disfrazada de creatividad.
    aplicacion: |-
      Es tentador usar varias tipografías \emph{``para que se vea variado''}. La disciplina estoica recomienda lo opuesto: \emph{coherencia sobre variedad}. Una sola familia para títulos y otra para cuerpo bastan para todo el libro. La variedad innecesaria desconcentra al lector. La phronesis del oficio honra la consistencia.
    pregunta_espejo: |-
      ¿Mi diagramación es coherente en todo el libro, o mezclé tipografías por capricho?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La legibilidad bien diseñada es ética informacional en la era de la atención escasa.
    aplicacion: |-
      En la era de la información, los lectores tienen miles de opciones de qué leer. La ética editorial pide que cuando alguien decide leer tu libro, la maquetación facilite la lectura, no la complique. Tu diagramación de hoy te entrena en esa práctica que rige toda producción editorial profesional: \textbf{cuidar la legibilidad como respeto por el lector}.
    pregunta_espejo: |-
      ¿Mi diagramación facilita la lectura, o pide al lector trabajo extra que no debería hacer?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el capítulo de muestra diagramado y el archivo de plantilla aplicado. En la sesión 9 vas a integrar \textbf{todos los capítulos en el PDF final de 80 páginas} con portada incluida. La diagramación de hoy es el patrón; la producción final de mañana lo aplica al libro completo.
web:
  conceptos_clave:
    - termino: Diagramación
      definicion: |-
        Arte de organizar texto e imagen en páginas para que sean legibles, coherentes y agradables. También llamada maquetación o layout.
      ejemplo: |-
        Una página con márgenes consistentes, tipografía única y numeración clara es buena diagramación; lo contrario fatiga al lector.
      emoji: "📐"
    - termino: Canva
      definicion: |-
        Herramienta gratuita drag-and-drop con plantillas de libros. Ideal para libros con componente visual fuerte (manuales, ilustrados).
      ejemplo: |-
        Eliges plantilla "libro de cuentos", arrastras texto e imágenes, exportas a PDF. Listo para distribuir.
      emoji: "🖌️"
    - termino: Google Docs
      definicion: |-
        Editor colaborativo gratuito. Bueno para libros mayormente de texto. Tiene estilos, tabla de contenido y numeración automática.
      ejemplo: |-
        Usas estilos "Título 1" para capítulos. Al final, Insertar → Tabla de contenidos genera el índice automáticamente.
      emoji: "📄"
    - termino: LibreOffice Writer
      definicion: |-
        Editor gratuito y descargable, similar a Word. Permite control fino de la maquetación y trabajo offline.
      ejemplo: |-
        Defines estilos de párrafo, configuras encabezados pares e impares y exportas a PDF directamente desde el menú.
      emoji: "📝"
    - termino: 4 principios de maquetación
      definicion: |-
        Tipografía coherente, jerarquía visual clara, espacios respirables, numeración automática. Cubren la mayoría de la calidad editorial.
      ejemplo: |-
        Si tu libro respeta estos 4, la lectura es cómoda aunque la herramienta sea modesta. Si los rompe, ni Photoshop salva.
      emoji: "🏛️"
  quiz:
    titulo: ¿Diagramas con criterio profesional?
    instrucciones: 5 preguntas para verificar que aplicas los 4 principios.
    preguntas:
      - enunciado: ¿Qué herramienta gratuita es mejor para un libro con muchas imágenes y plantillas?
        opciones:
          - Canva
          - WhatsApp
          - Calculadora
          - Paint
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Canva tiene plantillas listas y arrastrar-soltar. Ideal para libros con componente visual fuerte.
        feedback_incorrecto: |-
          Es Canva. Drag-and-drop, plantillas listas y exportación a PDF.
      - enunciado: ¿Cuántos principios fundamentales de maquetación cubren el 80% del oficio?
        opciones:
          - "1"
          - "4"
          - "20"
          - "100"
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. 4: tipografía coherente, jerarquía visual, espacios respirables, numeración automática.
        feedback_incorrecto: |-
          Son 4. Si los aplicas, la diagramación funciona aunque la herramienta sea modesta.
      - enunciado: Para un libro mayormente de texto y trabajo colaborativo, ¿qué herramienta conviene?
        opciones:
          - Solo Canva
          - Google Docs
          - Solo Paint
          - WhatsApp
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Google Docs permite colaboración en tiempo real, estilos, tabla de contenido y numeración automática.
        feedback_incorrecto: |-
          Google Docs. Ideal para texto y trabajo colaborativo, con estilos y tabla de contenido automática.
      - enunciado: ¿Por qué importa la tipografía coherente?
        opciones:
          - Porque es bonito
          - Porque cambios de fuente cansan al lector y dan apariencia amateur
          - Porque ahorra papel
          - No importa
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Cambios injustificados de fuente cansan al lector y dan apariencia amateur al libro.
        feedback_incorrecto: |-
          Cambios de fuente injustificados cansan al lector y restan profesionalismo.
      - enunciado: La regla "elige la herramienta según el tipo de libro, no según la moda" significa que...
        opciones:
          - Hay que usar Canva siempre
          - Cada libro pide su herramienta según sus necesidades visuales
          - Hay que usar la más cara
          - La herramienta no importa
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Manual con imágenes pide Canva; novela de texto pide Google Docs o LibreOffice.
        feedback_incorrecto: |-
          Cada libro pide su herramienta. Manuales con imágenes a Canva; novelas a Google Docs o LibreOffice.

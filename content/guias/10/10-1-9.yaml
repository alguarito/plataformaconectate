titulo: Maquetación editorial con IA --- prompts de diseño para el libro propio
producto_final: |-
  Template LaTeX del libro generado con prompts a Claude o Gemini: portada, tipografía, estilo de capítulos y numeración + libro completo transferido al template y compilado en Overleaf listo para descarga como PDF
saber_ancestral_idea: |-
  El encuadernador de Cartago elegía el cuero, el hilo y el cosido antes de poner la primera hoja: la cubierta no era decoración sino la promesa visible del contenido. El diseño editorial es ese encuadernado --- la forma que le da dignidad al texto y le dice al lector que lo que tiene en las manos vale la pena.

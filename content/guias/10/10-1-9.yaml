clave: 1-9
grado: 10
periodo: 1
sesion: 9
completo: true
titulo: Producción final del libro --- 80 páginas compiladas, revisadas y firmadas
titulo_portada: |-
  Producción final ---
  80 páginas compiladas,
  revisadas y firmadas
producto_final: |-
  Libro completo de al menos 80 páginas en formato PDF compilado integrando portada + tabla de contenido + 8-12 capítulos diagramados + página de créditos con declaración de derechos y uso de IA + carta del editor (tú) de 1 página firmada con nombre y fecha + revisión de calidad pasando los 12 puntos del checklist + bitácora del proceso completo del periodo documentando los 9 pasos recorridos hasta hoy
apertura:
  saber_ancestral: |-
    En los talleres antiguos de carpintería, cerámica y orfebrería, hubo durante siglos un momento ritual que separaba al aprendiz del oficial: \textbf{la firma de la pieza maestra}. Después de un año de trabajo bajo el maestro, el aprendiz producía una pieza final que demostraba el oficio aprendido: una mesa con todas las uniones, un jarrón con todas las técnicas, un anillo con todos los procesos. Esa pieza no se entregaba cualquier día. Había un acto formal en el taller con el maestro y los oficiales viejos sentados alrededor. El aprendiz traía la pieza, la ponía sobre la mesa, la explicaba: \emph{``aquí usé esta técnica, esto lo aprendí del maestro, esto lo decidí yo, esto aún no domino del todo''}. Los mayores hacían preguntas. Si la defensa era sólida, el aprendiz tomaba un punzón y \textbf{firmaba la pieza}: grabar su nombre o marca en la base. Esa firma significaba 3 cosas al mismo tiempo: \textbf{declarar autoría, asumir responsabilidad, certificar el oficio}. La pieza con firma era certificación de competencia profesional. El libro de 80 páginas que entregas hoy es exactamente esa pieza maestra: producto final del aprendizaje del periodo, firmado con tu nombre, defendible ante cualquier audiencia.
  saber_contemporaneo: |-
    La \textbf{producción final del libro} integra todo lo recorrido en las 8 sesiones anteriores en un \textbf{PDF compilado de al menos 80 páginas} listo para circular. Sus componentes obligatorios son: (1) \textbf{Portada} (sesión 7): con título, autor, imagen. (2) \textbf{Página de créditos}: año, autor, licencia de derechos (sesión 6), declaración de uso de IA. (3) \textbf{Tabla de contenido autogenerada} (sesión 8). (4) \textbf{8-12 capítulos diagramados} (sesiones 4-5-8): cada uno con texto V3, diagramación coherente, numeración correcta. (5) \textbf{Carta del editor} (1 página firmada): tu palabra como editor responsable del libro. (6) \textbf{Contraportada} opcional con sinopsis. La regla profesional: \textbf{el libro no se entrega antes de pasar checklist de revisión}. El checklist típico tiene 12 puntos que cubren contenido, forma, derechos, voz propia. La \textbf{carta del editor} es pieza nueva y esencial: declaración personal sobre el proceso del libro, el uso de IA, lo que se logró y lo que aún se considera mejorable. Firmada con nombre y fecha, es tu sello profesional sobre la pieza maestra.
  pregunta_puente: |-
    ¿Qué sabía el aprendiz al grabar su nombre en la pieza maestra ante el maestro y los oficiales viejos, que el estudiante novato olvida cuando entrega un PDF sin haber revisado ni firmado? ¿Y por qué la carta del editor es la pieza más profesional del libro, aunque sea solo 1 página?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} el material producido en las 8 sesiones anteriores y verificar que esté listo para integración; (2) \textbf{evaluar} el libro completo con el checklist de 12 puntos antes de declararlo final; (3) \textbf{crear} el PDF compilado de 80+ páginas con todos los componentes y la carta del editor firmada; (4) \textbf{explicar} en la carta del editor el proceso completo del libro con honestidad sobre uso de IA y decisiones tomadas.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Has recorrido 8 sesiones: editor, concepción, prompting, iteración, estructura, derechos, portada, diagramación. Hoy es el \textbf{día de la firma}: integras todo en el libro compilado. La sesión 10 será sustentación pública con feria del libro escolar.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{inventario completo}: lista lo que tienes producido (todos los capítulos en V3, portada definitiva, mapa estructural, ficha de derechos, declaración de IA, archivo de diagramación) y lo que aún falta (capítulos pendientes, créditos, carta del editor). Ese inventario es el plan de hoy.
  a_sistematizacion: |-
    Ya tienes el inventario. Ahora vas a entender la \textbf{anatomía del libro compilado profesional}: los 6 componentes obligatorios, el checklist de 12 puntos, los 5 errores típicos del editor que se apura en la producción final.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: integras componentes, pasas checklist, escribes carta del editor firmada, exportas PDF final, entregas bitácora del proceso completo del periodo.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: PDF de 80+ páginas + checklist + carta firmada + bitácora del proceso. El criterio principal: que cualquiera abriendo tu PDF reconozca una pieza profesional, no documento escolar improvisado.
  a_evaluacion: |-
    Antes de cerrar, mira la producción final desde las cinco dimensiones humanas. Firmar con honestidad lo que terminaste es honor del oficio; entregar sin revisar es desperdicio de las 8 sesiones anteriores.
  a_triangulo: |-
    Y para terminar, tres voces sobre la firma. Dussel sobre la pieza terminada que devuelve a la comunidad, Marco Aurelio sobre la disciplina del checklist, Floridi sobre el libro firmado como acto profesional contemporáneo.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Inventario completo de lo producido} (15 min · individual). Haz lista de lo que tienes y de lo que falta para el libro de 80 páginas. Reglas: (1) \textbf{Tengo}: cada capítulo en V3 que esté listo (con apertura/cierre escritos a mano), la portada definitiva con composición, la ficha de derechos, el archivo de diagramación con plantilla aplicada. (2) \textbf{Me falta}: capítulos sin V3, página de créditos, tabla de contenido aplicada al libro completo, carta del editor, revisión final. Para cada item de la columna \emph{me falta}, anota cuánto tiempo necesitas para terminarlo.
  checks:
  - Listé todo lo que tengo producido.
  - Listé todo lo que aún falta.
  - Estimé tiempo necesario para cada pendiente.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Inventario de producción». \textbf{Formato:} 2 listas (tengo, me falta) + cronograma para cerrar pendientes esta semana. \textbf{Sabes que terminaste cuando} tienes claro qué hacer en qué orden.
sistematizacion:
  intro: |-
    Tu inventario es el plan de la semana. Ahora necesitas la \textbf{anatomía profesional} del libro compilado para integrar todo con criterio.
  pilares:
  - |-
    Los \textbf{6 componentes obligatorios} del libro compilado se descomponen así: (1) \textbf{Portada}: imagen + título + autor. (2) \textbf{Página de créditos}: año de publicación, autor con nombre completo, licencia elegida (sesión 6), declaración de uso de IA con modelos y porcentaje aproximado, contacto del autor. (3) \textbf{Tabla de contenido} autogenerada con páginas correctas. (4) \textbf{8-12 capítulos diagramados}: cada uno con su título de estilo, texto V3, numeración correcta. (5) \textbf{Carta del editor}: 1 página, firmada con nombre y fecha, declarando proceso del libro y decisiones críticas. (6) \textbf{Contraportada} opcional con sinopsis de 200 palabras.
  - |-
    El \textbf{checklist de 12 puntos} de revisión final cubre 4 dimensiones: (a) \textbf{Contenido}: 8+ capítulos completos, V3 con voz propia, sin clichés evidentes. (b) \textbf{Forma}: tipografía coherente, jerarquía visual aplicada, numeración funcionando, márgenes respirables. (c) \textbf{Derechos}: créditos completos, licencia declarada, uso de IA explícito, fuentes citadas. (d) \textbf{Voz propia}: V3 con escritura humana en puntos críticos, sin que el libro suene a chatbot, carta del editor firmada.
  - |-
    La \textbf{carta del editor} es pieza profesional y emocional al mismo tiempo. Tiene 4 párrafos: (a) \textbf{Qué}: en 3-4 líneas, qué es este libro y para quién. (b) \textbf{Cómo}: el proceso seguido (concepción, prompts, iteración, voz propia, derechos). (c) \textbf{Declaración de IA}: qué modelos usaste, en qué partes, qué porcentaje aproximado de texto IA, qué porcentaje humano. (d) \textbf{Compromiso}: lo que asumes como autor responsable. Cierra con nombre completo, fecha, ciudad. Es tu firma profesional.
  - |-
    Algoritmo: (1) cerrar capítulos pendientes en V3. (2) integrar todos los capítulos en el archivo de diagramación. (3) generar tabla de contenido autogenerada. (4) agregar portada como página 1. (5) agregar página de créditos como página 2. (6) escribir carta del editor. (7) pasar checklist de 12 puntos. (8) corregir lo que falle. (9) exportar PDF final. (10) verificar PDF abierto en otra computadora.
  anatomia:
    titulo: Anatomía del libro compilado
    body: |-
      \textbf{Portada:} imagen + título + autor. \\[1mm] \textbf{Créditos:} año + licencia + IA + contacto. \\[1mm] \textbf{TOC:} autogenerada. \\[1mm] \textbf{Capítulos:} 8-12 diagramados. \\[1mm] \textbf{Carta editor:} 1 página firmada. \\[1mm] \textbf{Contraportada:} opcional.
  errores_comunes: |-
    (1) \textbf{Saltarse el checklist}: declarar como final lo que no se ha revisado. (2) \textbf{Tabla de contenido manual}: si añades una página, todo se rompe. (3) \textbf{Sin página de créditos}: el libro no declara derechos ni autor. (4) \textbf{Carta del editor genérica}: \emph{``espero les guste''} no es carta editorial. (5) \textbf{No verificar PDF en otra máquina}: a veces fuentes faltan en máquinas distintas y el libro se ve raro.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Anatomía del libro compilado». \textbf{Formato:} (a) los 6 componentes con su contenido; (b) checklist de 12 puntos imprimible; (c) plantilla de la carta del editor en 4 párrafos. \textbf{Sabes que terminaste cuando} podrías guiar a un compañero a compilar su libro con tu lista.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EXPLICA --- Libro compilado + carta firmada + bitácora} (60 min en sesión + tiempo en casa para cerrar pendientes · individual). Hora de aplicar. Integras componentes, pasas checklist, escribes carta, exportas PDF final, llenas bitácora del proceso completo del periodo.
  pilares:
  - |-
    Tu producción final se completa en 7 pasos: (1) cerrar capítulos pendientes en V3 (esta semana). (2) integrar todos los capítulos en el archivo de diagramación de la sesión 8. (3) agregar portada como página 1 y créditos como página 2. (4) generar tabla de contenido. (5) escribir y firmar carta del editor. (6) pasar checklist de 12 puntos uno a uno. (7) exportar PDF final y abrirlo en otra computadora o celular para verificar.
  - |-
    Sigue el patrón \textbf{``revisar antes de firmar''}: nunca declares el libro final sin haber pasado los 12 puntos del checklist. La firma sin revisión es firma sin valor. La phronesis del editor consiste en \textbf{aceptar la disciplina del checklist aunque tome 1 hora adicional}.
  - |-
    La bitácora del proceso completo del periodo es trabajo aparte: 1 página resumiendo las 9 sesiones recorridas. Para cada sesión: 1 línea sobre qué hiciste, 1 línea sobre qué aprendiste. Es la memoria del oficio que te llevas al grado 11 y a la vida profesional. Documenta el viaje completo, no solo el producto final.
  - |-
    Algoritmo: (1) cerrar capítulos. (2) integrar diagramación. (3) agregar portada y créditos. (4) TOC. (5) escribir carta. (6) checklist. (7) corregir. (8) exportar PDF. (9) verificar en otra máquina. (10) llenar bitácora del periodo. (11) prepararse mentalmente para sustentación en S10.
  checklist:
    titulo: Checklist final de los 12 puntos
    items: |-
      \checkbox 8-12 capítulos completos en V3. \\[1mm] \checkbox Voz propia visible en aperturas y cierres. \\[1mm] \checkbox Sin clichés evidentes. \\[1mm] \checkbox Tipografía coherente en todo el libro. \\[1mm] \checkbox Jerarquía visual aplicada consistente. \\[1mm] \checkbox Numeración de páginas correcta. \\[1mm] \checkbox Márgenes e interlineado respirables. \\[1mm] \checkbox Página de créditos con licencia declarada. \\[1mm] \checkbox Uso de IA explícitamente declarado. \\[1mm] \checkbox Fuentes citadas si las hay. \\[1mm] \checkbox Carta del editor firmada con nombre y fecha. \\[1mm] \checkbox PDF abierto en otra máquina y verificado.
  plantilla_guion: |-
    \textbf{Componentes.} \textit{Portada + créditos + TOC + 8-12 capítulos + carta + (contraportada).} \\[1mm] \textbf{Checklist.} \textit{12 puntos verificados.} \\[1mm] \textbf{Carta editor.} \textit{Qué + Cómo + IA + Compromiso, firmada.} \\[1mm] \textbf{Bitácora del periodo.} \textit{Resumen de las 9 sesiones.} \\[1mm] \textbf{PDF final.} \textit{Exportado y verificado.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EXPLICA).} Título: «Actividad 3 --- Libro compilado + bitácora del periodo». \textbf{Formato:} (a) referencia al PDF final; (b) checklist marcado; (c) carta del editor firmada; (d) bitácora del periodo. \textbf{Sabes que terminaste cuando} podrías mostrarle el PDF a un familiar y firmarías con orgullo.
  producto_titulo: PDF 80+ páginas + checklist 12 puntos + carta editor firmada + bitácora
  criterios:
  - PDF compilado de 80+ páginas
  - 6 componentes obligatorios presentes
  - Checklist de 12 puntos pasado
  - Carta del editor firmada con nombre y fecha
  - Bitácora del periodo completa
  - PDF verificado en otra máquina
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El libro firmado por el editor humano en la era de IA es acto de dignidad cultural que la cultura generativa necesita.
    aplicacion: |-
      Cuando firmas tu libro con nombre, fecha y declaración de uso de IA, estás haciendo lo que la cultura generativa contemporánea necesita: \textbf{seres humanos que asumen autoría con honestidad}. La filosofía de la liberación pide ese acto: no esconder lo hecho con IA, no fingir autoría pura, no diluir responsabilidad. Tu carta del editor firmada es modelo profesional contemporáneo que pocos autores aún practican.
    pregunta_espejo: |-
      ¿Mi carta del editor declara con honestidad el proceso, o intenta presentar el libro como obra puramente humana?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La disciplina del checklist antes de firmar es virtud profesional; el atajo de firmar sin revisar es vicio que se descubre con el tiempo.
    aplicacion: |-
      Es tentador exportar el PDF y declararlo final apenas se cierra el último capítulo. La sabiduría estoica recomienda lo opuesto: \emph{pasa el checklist antes de la firma}. Esa hora de revisión adicional separa al editor profesional del aficionado. La phronesis del oficio honra a quien revisa con disciplina.
    pregunta_espejo: |-
      ¿Estoy pasando el checklist completo antes de declarar el libro final, o quiero terminar rápido y firmar?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El libro firmado con declaración honesta de IA es el modelo editorial del siglo XXI; ocultar el uso de IA es modelo obsoleto.
    aplicacion: |-
      En 2026 y los años siguientes, los libros producidos con asistencia de IA serán mayoría. La ética editorial del siglo XXI exige declaración honesta, no ocultamiento. Tu libro con carta del editor firmada se posiciona en el modelo profesional emergente. Aunque sea proyecto escolar, las prácticas son las mismas que la industria editorial profesional adoptará obligatoriamente en pocos años.
    pregunta_espejo: |-
      ¿Mi libro contribuye al modelo editorial transparente del siglo XXI, o sostiene el modelo opaco que ya está obsoleto?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el PDF final del libro, la carta del editor firmada y la bitácora del periodo. En la sesión 10 vas a hacer la \textbf{sustentación pública + feria del libro escolar}: presentas tu libro al grupo, intercambian copias, leen fragmentos. Es el cierre ritual del proyecto editorial.
web:
  conceptos_clave:
    - termino: PDF compilado
      definicion: |-
        Documento final del libro en un solo archivo de al menos 80 páginas, listo para distribuir.
      ejemplo: |-
        Portada, créditos, índice, capítulos diagramados y contraportada en un PDF que se abre en cualquier lector.
      emoji: "📚"
    - termino: Página de créditos
      definicion: |-
        Página con año, autor, licencia (CC o reservados) y declaración de uso de IA. Es transparencia editorial.
      ejemplo: |-
        "Este libro se produjo con apoyo de ChatGPT. El editor intervino al menos en el 30% del texto final."
      emoji: "📃"
    - termino: Tabla de contenido autogenerada
      definicion: |-
        Índice de capítulos producido por la herramienta a partir de los estilos del libro. Mantiene numeración correcta automáticamente.
      ejemplo: |-
        En Google Docs, Insertar → Tabla de contenido la genera de los títulos marcados como "Título 1".
      emoji: "🗂️"
    - termino: Carta del editor
      definicion: |-
        Pieza nueva y esencial. 1 página en primera persona donde declaras el proceso, uso de IA, logros y mejoras posibles.
      ejemplo: |-
        "Este libro nació de la pregunta sobre amistades digitales. Usé Bing y Claude. Reescribí 35%. Lo firmo con orgullo."
      emoji: "✍️"
    - termino: Checklist de revisión (12 puntos)
      definicion: |-
        Lista que cubre contenido, forma, derechos y voz propia. El libro no se entrega antes de pasarlo todo.
      ejemplo: |-
        ¿Portada? ¿Créditos? ¿Índice? ¿Capítulos numerados? ¿Carta firmada? ¿Declaración de IA? Y así hasta 12.
      emoji: "✅"
  quiz:
    titulo: ¿Tu libro está listo para circular?
    instrucciones: 5 preguntas para verificar que tu PDF final cumple los 6 componentes.
    preguntas:
      - enunciado: ¿Cuántas páginas mínimas pide la producción final del libro?
        opciones:
          - "80"
          - "10"
          - "500"
          - "1000"
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. 80 páginas mínimas. Es escala que obliga a sostener voz, estructura y oficio editorial.
        feedback_incorrecto: |-
          Son 80 páginas mínimas. Es la escala que demuestra capacidad editorial sostenida.
      - enunciado: ¿Qué componente NUEVO introduce esta sesión, distinto del libro tradicional?
        opciones:
          - El índice
          - La portada
          - La contraportada
          - La carta del editor firmada
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. La carta del editor declara proceso, uso de IA y postura. Es transparencia editorial contemporánea.
        feedback_incorrecto: |-
          La carta del editor. Pieza esencial que declara honestamente el proceso y el uso de IA.
      - enunciado: ¿Cuántos puntos típicos tiene el checklist de revisión?
        opciones:
          - "1"
          - "12"
          - "100"
          - "1000"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 12 puntos. Cubren contenido, forma, derechos y voz propia.
        feedback_incorrecto: |-
          Son 12. Si los pasas todos, el libro está listo para entrega.
      - enunciado: La página de créditos debe incluir...
        opciones:
          - Solo el autor
          - Solo el precio
          - Año, autor, licencia y declaración de uso de IA
          - Solo el ISBN
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. La transparencia editorial pide declarar año, autor, licencia y uso de IA.
        feedback_incorrecto: |-
          Año, autor, licencia y declaración de uso de IA. Es transparencia editorial irrenunciable.
      - enunciado: La regla "el libro no se entrega antes de pasar checklist" significa que...
        opciones:
          - Hay que ahorrar tiempo saltando el checklist
          - El checklist es opcional
          - Solo hay que revisar la portada
          - El checklist es paso obligado de calidad antes de circular
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. El checklist es paso obligado. Saltarlo produce libros con detalles sueltos que dañan el oficio.
        feedback_incorrecto: |-
          El checklist es obligatorio antes de entregar. Saltarlo produce libros con detalles sueltos que dañan la pieza.

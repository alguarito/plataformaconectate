clave: 2-1
grado: 10
periodo: 2
sesion: 1
completo: true
titulo: 4 tipos de texto profesional --- informe, comercial, técnico, estudio de mercado
titulo_portada: |-
  4 tipos de texto
  profesional ---
  cada oficio su tono
producto_final: |-
  Tabla comparativa de los 4 tipos de texto profesional con (a) propósito específico, (b) audiencia típica, (c) estructura mínima, (d) tono apropiado + 1 ejemplo real por cada tipo capturado de prensa, redes profesionales (LinkedIn), publicaciones institucionales o publicidad + análisis breve de 5 líneas explicando qué diferencia concretamente un informe técnico de uno comercial + reflexión sobre cuál de los 4 tipos vas a usar más en tu vida laboral próxima
apertura:
  saber_ancestral: |-
    En el barrio Obrero de Cartago hubo \textbf{cuatro oficios de la palabra} que cualquier abuela distinguía al oído: (1) \textbf{El cuentista}: el que contaba historias a los nietos. Su palabra era \emph{para entretener y enseñar con ejemplo}. Tono cálido, ritmo variado, metáforas locales. (2) \textbf{El escribano}: el señor con sombrero que redactaba cartas y poderes frente a la notaría. Su palabra era \emph{para acreditar formalmente}. Tono respetuoso, frases largas, fórmulas legales precisas. (3) \textbf{El contador}: el que llevaba las cuentas del tendero, el zapatero, la modista. Su palabra era \emph{para calcular y reportar con números}. Tono seco, cifras exactas, sin adornos. (4) \textbf{El juez}: el que oficiaba en la inspección de policía cuando había pleito vecinal. Su palabra era \emph{para sentenciar con autoridad}. Tono firme, argumentación clara. Cualquier vecino mayor distinguía los 4 al instante: \textbf{cada oficio tenía tono propio}. Confundirlos era perder el oficio. Los 4 tipos de texto profesional moderno son la versión actualizada de esos 4 oficios del barrio.
  saber_contemporaneo: |-
    En el mundo profesional contemporáneo, hay \textbf{4 tipos de texto} que cualquier persona con vida laboral encontrará una y otra vez: (1) \textbf{Informe técnico}: documento que reporta datos, análisis, hallazgos. Propósito: informar a quien necesita tomar decisiones técnicas. Audiencia: especialistas, supervisores, comités. Estructura: introducción + metodología + resultados + conclusiones + recomendaciones. Tono: neutro, datos verificables, sin adornos. (2) \textbf{Texto comercial}: propuesta de venta, presentación de servicio, pitch. Propósito: persuadir a un cliente o inversionista a comprar, contratar o invertir. Audiencia: cliente potencial. Estructura: problema + solución + beneficios + propuesta + llamada a la acción. Tono: cálido pero profesional, claro, orientado al cierre. (3) \textbf{Texto comercial-técnico mixto} o estudio: combinación que se ve en propuestas a empresas con componente técnico. (4) \textbf{Estudio de mercado}: investigación que analiza un sector, audiencia o competencia. Propósito: dar contexto para decisiones estratégicas. Audiencia: gerencia, emprendedores, inversionistas. Estructura: contexto + metodología + análisis + conclusiones. Tono: analítico, basado en datos, neutro. La regla profesional: \textbf{usar el tono del oficio equivocado pierde la audiencia}. Un informe técnico con tono comercial parece superficial; un texto comercial con tono técnico no vende.
  pregunta_puente: |-
    ¿Qué sabían las abuelas del barrio al distinguir al cuentista del escribano y del contador, que el novato olvida cuando escribe todo con el mismo tono? ¿Y por qué un mismo dato presentado en informe técnico vs en texto comercial requiere palabras y estructuras completamente distintas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuál de los 4 tipos de texto profesional aplica a una situación concreta del mundo real; (2) \textbf{analizar} ejemplos reales detectando qué tono y estructura sostiene cada tipo; (3) \textbf{explicar} con tus palabras la diferencia entre informe técnico y comercial usando un mismo tema como ejemplo; (4) \textbf{evaluar} cuál de los 4 vas a usar más en tu próxima vida laboral y por qué.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Cerraste el proyecto del libro (P1). Hoy abre el periodo 2: \textbf{texto profesional con asistencia de IA}. Las próximas 9 sesiones (estructura del informe, Google Docs, Markdown, encuestas, análisis con IA, informe comercial, correo profesional, mini-proyecto, sustentación) construyen sobre la habilidad de distinguir los 4 tipos.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{auditoría rápida}: busca 4 textos reales (en LinkedIn, prensa, sitios institucionales, publicidad). Para cada uno, intenta identificar qué tipo es. Esa observación intuitiva te enseña los 4 tonos en uso.
  a_sistematizacion: |-
    Ya tienes 4 ejemplos. Ahora vas a entender la \textbf{anatomía de los 4 tipos}: propósito, audiencia, estructura, tono. Y los 5 errores típicos de confundir tipos.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: construyes tabla comparativa, agregas 1 ejemplo real por tipo, escribes análisis de diferencia informe vs comercial, reflexionas sobre cuál usarás más.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: tabla + 4 ejemplos + análisis + reflexión. El criterio principal: que puedas reconocer al instante qué tipo de texto te están pidiendo cuando alguien te diga \emph{``escríbeme un X''}.
  a_evaluacion: |-
    Antes de cerrar, mira los 4 tipos desde las cinco dimensiones humanas. Distinguir los tonos es respeto por la audiencia de cada texto; usar uno solo para todo es perder oficio profesional.
  a_triangulo: |-
    Y para terminar, tres voces sobre la palabra adecuada. Dussel sobre los textos que sirven a audiencias específicas, Séneca sobre la sobriedad del tono correcto, Floridi sobre la comunicación contextual como ética profesional.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Auditoría de 4 textos reales} (15 min · individual). Busca 4 textos reales en internet, redes profesionales (LinkedIn), prensa o publicidad. Idealmente uno de cada tipo: (1) un \textbf{informe técnico} (informe del DANE, informe de gestión escolar, reporte de Cámara de Comercio). (2) un \textbf{texto comercial} (propuesta comercial publicada, presentación de servicio, anuncio publicitario detallado). (3) un \textbf{estudio de mercado} (análisis sectorial, reporte de tendencias publicado). (4) un \textbf{informe técnico-comercial mixto} (caso de éxito empresarial, white paper). Para cada uno anota: ¿qué tipo crees que es?, ¿qué te indica el tono?.
  checks:
  - Encontré 4 textos reales (1 por tipo).
  - Identifiqué qué tipo es cada uno.
  - Reconocí qué tono distingue a cada tipo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 4 textos reales». \textbf{Formato:} 4 fichas (1 por texto) con link/captura + tipo identificado + tono observado. \textbf{Sabes que terminaste cuando} distingues los 4 al primer párrafo.
sistematizacion:
  intro: |-
    Tus 4 ejemplos te dan vocabulario. Ahora necesitas la \textbf{anatomía profesional} de los 4 tipos.
  pilares:
  - |-
    Los \textbf{4 tipos de texto profesional} se descomponen así: (1) \textbf{Informe técnico}: \emph{propósito} informar para decisión técnica; \emph{audiencia} especialistas o supervisores; \emph{estructura} intro + metodología + resultados + conclusiones + recomendaciones; \emph{tono} neutro, datos verificables, sin opiniones personales. Ejemplos cotidianos: informe de gestión escolar, reporte de proyecto. (2) \textbf{Texto comercial}: \emph{propósito} persuadir para vender o contratar; \emph{audiencia} cliente potencial; \emph{estructura} problema + solución + beneficios + propuesta + llamada a la acción; \emph{tono} cálido pero profesional, orientado al cierre. (3) \textbf{Estudio de mercado}: \emph{propósito} dar contexto estratégico; \emph{audiencia} gerencia, emprendedores, inversionistas; \emph{estructura} contexto sectorial + metodología + análisis + conclusiones; \emph{tono} analítico, basado en datos. (4) \textbf{Texto técnico-comercial mixto}: \emph{propósito} explicar técnicamente con propósito comercial; \emph{audiencia} cliente sofisticado; \emph{estructura} problema técnico + solución detallada + caso de éxito + propuesta; \emph{tono} riguroso pero accesible.
  - |-
    El patrón profesional clave: \textbf{el tono se elige por la audiencia, no por preferencia personal}. Si tu lector es un ingeniero, el tono técnico le inspira confianza. Si tu lector es un cliente novato, el tono técnico lo aleja. La phronesis del oficio consiste en \textbf{ajustar el registro a quien lee, no al que escribe}.
  - |-
    La \textbf{diferencia clave entre informe técnico y comercial} con el mismo tema: ej. \emph{``nueva máquina de café''}. (a) Informe técnico: \emph{``La cafetera modelo X-200 procesa 50 tazas/hora con consumo 1.2 kWh, presión 9 bar, tanque 3L. Tiempo medio entre fallos según pruebas: 1200 horas''}. (b) Texto comercial: \emph{``Imagine empezar cada mañana con café de cafetería en su casa. La X-200 lo hace posible en 60 segundos. Diseño elegante, manejo simple, garantía 2 años. Hoy con 20 por ciento de descuento''}. Mismo producto, distinta audiencia, distinto tono, distinta estructura.
  - |-
    Algoritmo de identificación: (1) leer el primer párrafo. (2) preguntar: ¿quién es el lector ideal? (3) preguntar: ¿qué quiere lograr el texto? (4) según la combinación lector + propósito, identificar el tipo. Una vez identificado, ajusta tu lectura: en informe técnico busca datos; en texto comercial busca beneficios; en estudio busca tendencias; en mixto busca rigor con cierre.
  anatomia:
    titulo: Anatomía de los 4 tipos
    body: |-
      \textbf{Informe técnico:} neutro, datos, decisión técnica. \\[1mm] \textbf{Comercial:} cálido, persuasivo, cierre de venta. \\[1mm] \textbf{Estudio de mercado:} analítico, contexto estratégico. \\[1mm] \textbf{Técnico-comercial mixto:} riguroso + accesible.
  errores_comunes: |-
    (1) \textbf{Tono comercial en informe técnico}: el informe parece publicidad y pierde credibilidad. (2) \textbf{Tono técnico en texto comercial}: el cliente novato no entiende y no compra. (3) \textbf{Sin estructura clara}: mezcla de todo en orden caprichoso. (4) \textbf{Audiencia mal identificada}: escribir para especialista cuando lee novato. (5) \textbf{Conclusiones sin datos en informe}: opinión disfrazada de análisis. (6) \textbf{Beneficios sin emoción en texto comercial}: lista seca de características sin conexión.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía 4 tipos». \textbf{Formato:} (a) los 4 tipos con propósito/audiencia/estructura/tono; (b) ejemplo informe vs comercial sobre mismo tema; (c) los 6 errores con marca. \textbf{Sabes que terminaste cuando} reconoces el tipo al primer párrafo.
praxis:
  intro: |-
    \textbf{Actividad 3 · EXPLICA + EVALÚA --- Tabla + ejemplos + análisis + reflexión} (35 min · individual). Hora de aplicar. Construyes tabla comparativa, agregas 1 ejemplo real por cada tipo, escribes análisis de diferencia, reflexionas sobre cuál usarás más en tu vida laboral.
  pilares:
  - |-
    Tu tabla comparativa tiene 4 filas (1 por tipo) × 5 columnas (Tipo, Propósito, Audiencia, Estructura, Tono). Llena cada celda con 1-2 frases concretas. Para cada tipo, agrega también un link o referencia al ejemplo real que encontraste en la Actividad 1.
  - |-
    El análisis de diferencia informe vs comercial se escribe en 5 líneas usando un mismo tema (puede ser un producto, un servicio, un evento). Muestra cómo cambia la palabra cuando cambia la audiencia. Ejemplo: \emph{``Una computadora portátil. En informe técnico: marca, modelo, especificaciones técnicas, consumo, garantía técnica. En texto comercial: \emph{lleva tu trabajo a cualquier parte}, batería todo el día, diseño elegante, precio promocional''}.
  - |-
    La reflexión final responde: \emph{¿cuál de los 4 tipos voy a usar más en mi vida laboral próxima?}. Esto depende de tu vocación: si vas a estudiar ingeniería, probablemente informes técnicos. Si emprendimiento, textos comerciales. Si administración pública, informes y estudios. La reflexión te ayuda a priorizar qué texto profesional dominar mejor en las próximas sesiones.
  - |-
    Algoritmo: (1) construir tabla 4 filas × 5 columnas. (2) agregar 1 ejemplo real por tipo. (3) escribir análisis de 5 líneas comparando informe vs comercial sobre mismo tema. (4) escribir reflexión sobre qué tipo usarás más. (5) verificar coherencia entre tabla y análisis.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Tabla con 4 tipos y 5 columnas. \\[1mm] \checkbox 1 ejemplo real por cada tipo (link o captura). \\[1mm] \checkbox Análisis informe vs comercial con mismo tema. \\[1mm] \checkbox Reflexión sobre qué tipo usarás más. \\[1mm] \checkbox Tabla coherente con análisis. \\[1mm] \checkbox Distingo los 4 tipos al primer párrafo.
  plantilla_guion: |-
    \textbf{Informe técnico.} \textit{Propósito + audiencia + estructura + tono + ejemplo.} \\[1mm] \textbf{Texto comercial.} \textit{Idem.} \\[1mm] \textbf{Estudio de mercado.} \textit{Idem.} \\[1mm] \textbf{Mixto técnico-comercial.} \textit{Idem.} \\[1mm] \textbf{Diferencia informe vs comercial.} \textit{Mismo tema, distinta palabra.} \\[1mm] \textbf{Reflexión.} \textit{Cuál usaré más y por qué.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EXPLICA + EVALÚA).} Título: «Actividad 3 --- Los 4 oficios de la palabra». \textbf{Formato:} tabla + 4 ejemplos + análisis + reflexión. \textbf{Extensión:} 2-3 páginas. \textbf{Sabes que terminaste cuando} podrías identificar al instante qué tipo te piden cuando te pidan \emph{``escríbeme un texto sobre X''}.
  producto_titulo: Tabla 4 tipos + 4 ejemplos + análisis + reflexión personal
  criterios:
  - Tabla comparativa con 5 columnas por tipo
  - 1 ejemplo real por cada tipo
  - Análisis informe vs comercial con mismo tema
  - Reflexión sobre uso futuro
  - Coherencia tabla con análisis
  - Distinción de tipos al primer párrafo
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El tono que respeta a la audiencia es liberador; el tono uniforme impuesto a toda audiencia es violencia comunicativa.
    aplicacion: |-
      Cuando escribes con el mismo tono para todas las audiencias, estás imponiendo tu manera de hablar a quien debe leer. La filosofía de la liberación pide lo opuesto: \textbf{ajustar el registro a quien lee}. El cliente novato merece tono accesible; el especialista merece tono técnico. La phronesis comunicativa consiste en \textbf{servir a la audiencia, no imponer la propia voz}.
    pregunta_espejo: |-
      ¿Mi escritura ajusta el tono a quien lee, o uso el mismo registro para todo?
  estoico:
    autor: Séneca
    cita: |-
      La sobriedad del tono correcto es virtud profesional; el adorno inadecuado a la audiencia es vicio del que escribe.
    aplicacion: |-
      Es tentador querer sonar elegante en todo texto. La sabiduría estoica recomienda lo opuesto: \emph{usa el tono justo para la audiencia, ni más ni menos}. Un informe técnico con prosa florida pierde credibilidad. Un texto comercial con frialdad técnica pierde clientes. La phronesis del oficio consiste en \textbf{aceptar la disciplina del registro apropiado}.
    pregunta_espejo: |-
      ¿Estoy usando el tono sobrio que cada tipo de texto exige, o lo adorno cuando no toca?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La comunicación contextual es la nueva ética profesional en la era de la información distribuida.
    aplicacion: |-
      En la era de la información, los textos circulan en contextos múltiples. La ética profesional pide que cada texto se ajuste al contexto de su lectura. Tu tabla comparativa de hoy te entrena en esa práctica que rige toda profesión que produzca documentos: \textbf{distinguir el tipo de texto según el contexto y la audiencia}.
    pregunta_espejo: |-
      ¿Sé reconocer en qué contexto y para quién escribe cada texto profesional que produzco?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu tabla y los 4 ejemplos. En la sesión 2 vas a aprender la \textbf{estructura del informe técnico}: introducción + desarrollo + conclusiones, aplicada a un caso real del colegio. Los tipos de hoy son el mapa; el informe técnico de mañana es la primera implementación específica.
web:
  conceptos_clave:
    - termino: Informe técnico
      definicion: |-
        Documento que reporta datos, análisis y hallazgos para que un especialista o supervisor tome decisiones técnicas. Tono neutro, datos verificables.
      ejemplo: |-
        Informe sobre el ruido del recreo con mediciones, análisis y recomendaciones para la rectoría.
      emoji: "📊"
    - termino: Texto comercial
      definicion: |-
        Propuesta de venta, presentación de servicio o pitch. Persuade a un cliente con poder de decidir. Tono cálido y profesional.
      ejemplo: |-
        Propuesta para que el colegio contrate un servicio de fotografía escolar. Termina con llamada a la acción.
      emoji: "💼"
    - termino: Texto técnico-comercial mixto
      definicion: |-
        Combinación que se ve en propuestas a empresas con componente técnico fuerte. Une rigor de datos y propósito persuasivo.
      ejemplo: |-
        Propuesta de instalación de paneles solares: especificaciones técnicas + beneficios económicos.
      emoji: "🔀"
    - termino: Estudio de mercado
      definicion: |-
        Investigación que analiza sector, audiencia o competencia. Da contexto a decisiones estratégicas. Tono analítico, basado en datos.
      ejemplo: |-
        Estudio sobre hábitos de consumo de jóvenes del Valle para una cafetería que evalúa abrir cerca del colegio.
      emoji: "🔎"
    - termino: Tono según oficio
      definicion: |-
        Cada tipo de texto exige su tono. Mezclarlos pierde la audiencia. Informe técnico con tono comercial parece superficial.
      ejemplo: |-
        Un informe técnico no debería abrir con "¡Hola amigos!"; un texto comercial no debería abrir con tres tablas de datos.
      emoji: "🎵"
  quiz:
    titulo: ¿Reconoces los 4 tipos de texto profesional?
    instrucciones: 5 preguntas para verificar que diferencias propósito, audiencia y tono.
    preguntas:
      - enunciado: ¿Cuál es el propósito principal del informe técnico?
        opciones:
          - Vender
          - Informar para que se tomen decisiones técnicas
          - Entretener
          - Saludar
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El informe técnico informa para decisión, no para venta ni entretenimiento.
        feedback_incorrecto: |-
          Es informar para decisiones técnicas. Su audiencia decide con base en datos verificables.
      - enunciado: El texto comercial debe terminar con...
        opciones:
          - Una despedida larga
          - Una llamada a la acción (CTA)
          - Una tabla de datos
          - Un poema
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El comercial termina pidiendo decisión: "Solicito autorización", "Apruebe la propuesta".
        feedback_incorrecto: |-
          Termina con llamada a la acción. Sin pedido claro, el texto comercial pierde su propósito.
      - enunciado: Un estudio de mercado se diferencia del informe técnico en que...
        opciones:
          - Es lo mismo
          - Analiza sector, audiencia o competencia para decisiones estratégicas
          - Es solo para colegios
          - Es solo en inglés
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El estudio de mercado da contexto estratégico; el informe técnico reporta hallazgos puntuales.
        feedback_incorrecto: |-
          El estudio de mercado analiza sector, audiencia o competencia. Es base para decisiones estratégicas.
      - enunciado: Mezclar el tono comercial en un informe técnico produce...
        opciones:
          - Mejor lectura
          - Pérdida de audiencia, parece superficial
          - Más datos
          - Más páginas
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El informe técnico con tono comercial pierde rigor a los ojos del lector especializado.
        feedback_incorrecto: |-
          Pierde audiencia. Un especialista que lee tono comercial en informe técnico desconfía del rigor.
      - enunciado: ¿Quién es la audiencia del informe técnico?
        opciones:
          - Clientes potenciales
          - Especialistas, supervisores, comités
          - Niños de primaria
          - Influencers
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Especialistas, supervisores o comités que necesitan datos para decidir.
        feedback_incorrecto: |-
          Son especialistas, supervisores o comités. Por eso el tono es neutro y los datos verificables.

clave: 2-10
grado: 10
periodo: 2
sesion: 10
completo: true
titulo: Sustentación del periodo 2 --- defensa del oficio
titulo_portada: |-
  Sustentación P2 ---
  defensa pública
  del oficio aprendido
producto_final: |-
  Sustentación pública de 5 minutos del mini-proyecto integrador del periodo + 4-5 slides simples como apoyo + demo de fragmento clave del informe técnico + sesión de Q\&A de 5 minutos con honestidad ante preguntas técnicas + autoevaluación final con 2 fortalezas concretas y 2 mejoras específicas para el periodo siguiente
apertura:
  saber_ancestral: |-
    En los gremios tradicionales del oficio (carpinteros, ebanistas, sastres, alfareros), hubo durante siglos un acto ritual que cualquier aprendiz aceptaba antes de recibir título de oficial: \textbf{la defensa pública de la pieza maestra ante los mayores del gremio}. El aprendiz no entregaba la pieza en silencio: la \textbf{defendía}. Se sentaba ante el maestro y los oficiales viejos, traía su pieza, la presentaba, explicaba cómo la había hecho, qué decisiones tomó, qué aprendió. Los mayores hacían preguntas técnicas y a veces incómodas: \emph{``¿por qué ese ensamble así?''}, \emph{``¿qué pasa si la madera trabaja?''}, \emph{``¿cómo responderías a un cliente que reclama por defecto a los 6 meses?''}. El aprendiz no podía decir \emph{``no sé''} sin perder la prueba: debía defender cada decisión con argumento técnico, ético, económico. Si la defensa era sólida, los mayores le entregaban el título de oficial. Si flaqueaba en algún punto, volvía al taller un año más. La sabiduría era inquebrantable: \textbf{el oficio se demuestra hablando, no solo haciendo}. Esa práctica ancestral del gremio es exactamente lo que la sustentación pública del periodo 2 te pide hoy.
  saber_contemporaneo: |-
    La \textbf{sustentación pública del periodo} es el acto formal donde el estudiante defiende el mini-proyecto integrador (sesión 9) ante el grupo. Tiene 3 propiedades irrenunciables: (1) \textbf{Tiempo controlado}: 5 minutos (similar a sustentación TED corta). Obliga a destilar lo esencial del periodo entero. (2) \textbf{Estructura clara}: tema del mini-proyecto + proceso + hallazgos clave + uso de IA declarado + recomendaciones. (3) \textbf{Honestidad ante Q\&A}: cuando la audiencia hace preguntas duras, responder con verdad técnica. La estructura típica de los 5 minutos: (a) \textbf{Introducción del proyecto} (1 min): qué es y para quién. (b) \textbf{Datos y metodología} (1 min): encuesta aplicada con cuántas respuestas. (c) \textbf{Hallazgos clave} (1 min): los 2-3 resultados más importantes con cifras. (d) \textbf{Recomendaciones} (1 min): qué propones y a quién. (e) \textbf{Declaración honesta de IA} (1 min): qué modelos, porcentajes, qué hiciste tú. Después: 5 minutos de Q\&A. La regla profesional: \textbf{lo que no puedes contar en 5 minutos, todavía no lo dominas del todo}.
  pregunta_puente: |-
    ¿Qué sabía el aprendiz del gremio al sentarse a defender su pieza ante los mayores, que el novato olvida cuando confunde sustentar con leer slides? ¿Y por qué la declaración honesta de uso de IA en la sustentación es más profesional que pretender autoría pura?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} tu mini-proyecto identificando los 2-3 puntos más fuertes para destacar y los 1-2 puntos débiles que aún sostienen revisión; (2) \textbf{explicar} en sustentación pública la concepción, el proceso, los hallazgos y el uso de IA; (3) \textbf{evaluar} con honestidad preguntas duras del grupo sin inventar respuestas; (4) \textbf{crear} las 4-5 slides simples y la autoevaluación final con compromisos para el periodo 3.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Has recorrido 9 sesiones del periodo 2. Hoy es el \textbf{día de defender lo aprendido}. Después de hoy, abre el periodo 3 (ofimática con IA, contabilidad, emprendimiento) que será el puente directo al grado 11.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{inventario honesto} de tu mini-proyecto: 2-3 puntos fuertes (lo que estás orgulloso de haber logrado) y 1-2 puntos débiles (lo que aún necesita revisión). Esa lista cruda es la base de la sustentación.
  a_sistematizacion: |-
    Ya tienes inventario. Ahora vas a entender la \textbf{anatomía de la sustentación de 5 minutos + Q\&A}: estructura, las 5 preguntas duras más típicas, los 5 errores del sustentante novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: armas slides simples, ensayas cronometrado, sustentas, respondes Q\&A, autoevalúas con compromisos para periodo 3.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: sustentación + slides + autoevaluación. El criterio principal: que la audiencia entienda lo que aprendiste y qué propones, en 5 minutos.
  a_evaluacion: |-
    Antes de cerrar, mira la sustentación desde las cinco dimensiones humanas. Defender el oficio aprendido con honestidad es respeto por las 9 sesiones del periodo; pasar la sustentación sin asumir lo que falta es traicionar al estudiante que fuiste.
  a_triangulo: |-
    Y para terminar, tres voces sobre el cierre del periodo. Dussel sobre el aprendiz que devuelve oficio a la comunidad, Epicteto sobre la honestidad ante preguntas duras, Floridi sobre la sustentación con declaración de IA como nueva ética profesional.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Inventario honesto del mini-proyecto} (10 min · individual). Toma tu mini-proyecto de la sesión 9 y anota con sinceridad: (a) \textbf{2-3 puntos fuertes}: lo que estás orgulloso de haber logrado (datos sólidos, análisis bien auditado, propuesta clara, voz propia en la carta del autor). (b) \textbf{1-2 puntos débiles}: lo que aún necesita revisión (muestra pequeña, alguna recomendación sin responsable, IA con porcentaje alto que no se declaró bien). Esa lista cruda es la materia prima honesta de la sustentación.
  checks:
  - Anoté 2-3 puntos fuertes específicos.
  - Anoté 1-2 puntos débiles honestos.
  - Reconozco la importancia de declarar ambos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Inventario honesto». \textbf{Formato:} 2 listas (fuertes, débiles). \textbf{Sabes que terminaste cuando} podrías declarar ambas en sustentación pública.
sistematizacion:
  intro: |-
    Tu inventario es la base. Ahora necesitas la \textbf{anatomía profesional} de la sustentación de 5 minutos + Q\&A.
  pilares:
  - |-
    La \textbf{estructura de la sustentación de 5 minutos} se descompone así (1 minuto por bloque): (1) \textbf{Introducción del proyecto}: nombre del mini-proyecto, tema, destinatario al que se dirige. (2) \textbf{Metodología y datos}: encuesta aplicada, cuántas respuestas, herramientas usadas. (3) \textbf{Hallazgos clave}: 2-3 hallazgos numéricos importantes con interpretación. (4) \textbf{Recomendaciones}: qué propones, a quién, con qué plazo. (5) \textbf{Declaración honesta de IA}: modelos usados, porcentajes aproximados, qué hiciste tú. Después: \textbf{Q\&A de 5 minutos} con 3-5 preguntas del grupo.
  - |-
    Las \textbf{5 preguntas duras} más típicas que recibirás: (a) \emph{``¿cuántas respuestas tuvo tu encuesta?''} (responder con cifra). (b) \emph{``¿cómo verificaste que la IA no se equivocó al clasificar?''} (responder con tabla auditoría). (c) \emph{``¿tu recomendación es realmente factible para el destinatario?''} (defender con argumentos). (d) \emph{``¿qué porcentaje del informe escribió la IA?''} (responder con honestidad numérica). (e) \emph{``¿qué cambiarías si tuvieras otra semana?''} (responder con autoevaluación honesta).
  - |-
    Los \textbf{5 errores típicos} del sustentante novato: (a) \textbf{Leer las slides}: matar la sustentación en el primer minuto. (b) \textbf{Ocultar uso de IA}: pretender autoría pura cuando IA fue significativa. (c) \textbf{Inflar hallazgos}: presentar 18 respuestas como \emph{``estudio amplio''}. (d) \textbf{Evadir preguntas duras}: \emph{``buena pregunta...''} y desviar el tema. (e) \textbf{Cierre apurado}: terminar con \emph{``gracias''} en lugar de invitar al destinatario a recibir el informe.
  - |-
    Algoritmo: (1) preparar 4-5 slides simples (1 por bloque del minuto). (2) escribir guion hablado de 700-800 palabras (= 5 min). (3) ensayar 2 veces cronometrado. (4) sustentar. (5) responder Q\&A con honestidad. (6) autoevaluar con 2 fortalezas + 2 mejoras + 1 compromiso para periodo 3.
  anatomia:
    titulo: Anatomía de la sustentación P2
    body: |-
      \textbf{1 min:} Introducción del proyecto. \\[1mm] \textbf{1 min:} Metodología y datos. \\[1mm] \textbf{1 min:} Hallazgos clave con cifras. \\[1mm] \textbf{1 min:} Recomendaciones. \\[1mm] \textbf{1 min:} Declaración honesta de IA. \\[1mm] \textbf{5 min Q\&A:} honestidad ante preguntas duras.
  errores_comunes: |-
    (1) Leer las slides. (2) Ocultar uso de IA. (3) Inflar hallazgos. (4) Evadir preguntas duras. (5) Cierre apurado. (6) Pasarse del tiempo. (7) Slides saturadas.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía sustentación». \textbf{Formato:} plan minuto a minuto + 5 preguntas duras con respuesta + 7 errores. \textbf{Sabes que terminaste cuando} podrías sustentar mañana.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- Sustentación ejecutada + autoevaluación} (45 min · individual + colectivo). Hora de ejecutar. Preparas slides, ensayas, sustentas, respondes Q\&A, autoevalúas con compromisos.
  pilares:
  - |-
    Tu sustentación se construye en 6 pasos: (1) preparar 4-5 slides simples (1 por bloque del minuto, máximo 25 palabras por slide). (2) escribir guion hablado de 700-800 palabras. (3) ensayar cronometrado 2 veces. (4) sustentar con honestidad técnica. (5) responder Q\&A con verdad. (6) autoevaluar con 2 fortalezas + 2 mejoras + 1 compromiso para el periodo 3 (ofimática y emprendimiento).
  - |-
    La \textbf{declaración honesta de uso de IA} es el momento crucial de la sustentación. Modelo: \emph{``Usé ChatGPT y Gemini para borradores iniciales del informe (capítulos 2-4 del mini-proyecto, aproximadamente 50 por ciento del texto generado), edité a mano todas las conclusiones y la carta del autor (50 por ciento restante), audité la clasificación de la IA respuesta por respuesta corrigiendo 6 de 18, y declaré modelos en la bitácora''}. Esa precisión gana respeto profesional.
  - |-
    La \textbf{autoevaluación final} tiene 5 elementos: (a) 2 fortalezas concretas (manejo del tiempo, claridad de los hallazgos, honestidad en declaración de IA). (b) 2 mejoras específicas (más ensayo, mejor manejo del nervio, slides más simples). (c) 1 compromiso concreto para el periodo 3: \emph{``En el periodo 3 voy a llegar con más práctica de presentación oral''}, \emph{``En el periodo 3 voy a aplicar el análisis con IA desde el primer dato, no al final''}.
  - |-
    Algoritmo: (1) preparar slides. (2) ensayar. (3) sustentar. (4) responder. (5) autoevaluar. (6) entregar al docente: archivo slides + guion + autoevaluación.
  checklist:
    titulo: Checklist antes de sustentar
    items: |-
      \checkbox 4-5 slides simples (máx. 25 palabras cada una). \\[1mm] \checkbox Guion hablado de 700-800 palabras. \\[1mm] \checkbox 2 ensayos cronometrados hechos. \\[1mm] \checkbox Declaración honesta de IA preparada. \\[1mm] \checkbox 5 preguntas duras con respuesta preparada. \\[1mm] \checkbox Sustentación dentro de 5 minutos. \\[1mm] \checkbox Autoevaluación con 2+2+1 elementos.
  plantilla_guion: |-
    \textbf{1 min Intro.} \textit{Mini-proyecto + destinatario.} \\[1mm] \textbf{1 min Metodología.} \textit{Encuesta + N respuestas.} \\[1mm] \textbf{1 min Hallazgos.} \textit{2-3 con cifras.} \\[1mm] \textbf{1 min Recomendaciones.} \textit{Qué + a quién + plazo.} \\[1mm] \textbf{1 min IA.} \textit{Modelos + porcentajes + lo humano.} \\[1mm] \textbf{Q\&A 5 min.} \textit{Honestidad ante 5 preguntas duras.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Mi sustentación P2». \textbf{Formato:} (a) archivo de slides; (b) guion hablado; (c) preguntas recibidas con respuestas; (d) autoevaluación con compromiso. \textbf{Sabes que terminaste cuando} entregaste materiales y reservaste tiempo para reflexión.
  producto_titulo: Sustentación 5 min + 4-5 slides + Q\&A + autoevaluación
  criterios:
  - Estructura de 5 minutos respetada
  - 4-5 slides simples
  - Declaración honesta de IA con porcentajes
  - Q\&A respondida con verdad técnica
  - Autoevaluación con 2 fortalezas + 2 mejoras + 1 compromiso
  - Compromiso específico para periodo 3
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El aprendiz que devuelve oficio asumido a la comunidad cierra el ciclo de la pedagogía liberadora.
    aplicacion: |-
      Tu sustentación cierra el periodo 2: lo aprendido vuelve al grupo hecho voz propia. La filosofía de la liberación pide ese acto. Cuando declaras con honestidad lo que hiciste y lo que aún te falta, estás devolviendo oficio asumido. La phronesis del cierre consiste en \textbf{compartir el aprendizaje, no guardarlo}.
    pregunta_espejo: |-
      ¿Mi sustentación devuelve oficio al grupo, o solo cumple con requisito?
  estoico:
    autor: Epicteto
    cita: |-
      La honestidad ante preguntas duras es virtud profesional; evadir es debilidad disfrazada de cortesía.
    aplicacion: |-
      Cuando alguien te pregunta \emph{``¿qué porcentaje del informe lo escribió la IA?''}, es tentador minimizar. La disciplina estoica recomienda lo opuesto: \emph{declara los porcentajes exactos con sobriedad}. Esa precisión gana respeto que el evasivo nunca gana. La phronesis del cierre honra la verdad numérica.
    pregunta_espejo: |-
      ¿Estoy respondiendo preguntas duras con honestidad numérica, o evadiendo por timidez?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La sustentación con declaración honesta de IA es el modelo profesional del siglo XXI.
    aplicacion: |-
      En la era de IA generativa, las sustentaciones profesionales que declaran abiertamente uso de IA con porcentajes y modelos se posicionan como ético emergente. Tu sustentación de hoy te entrena en esa práctica profesional que la industria adoptará obligatoriamente en pocos años.
    pregunta_espejo: |-
      ¿Mi sustentación contribuye al modelo transparente del siglo XXI, o sostiene la opacidad heredada?
compromiso: |-
  \textbf{Para la próxima sesión.} Cierra el periodo 2 (informes y comunicación profesional con IA) y abre el periodo 3 (ofimática con IA, contabilidad y emprendimiento). La sesión 1 del periodo 3 trabajará \textbf{ofimática con IA como copiloto del oficio digital cotidiano}: Google Sheets, IA aplicada a tareas reales de vida laboral próxima. Es el puente al grado 11.

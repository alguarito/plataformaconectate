clave: 2-2
grado: 10
periodo: 2
sesion: 2
completo: true
titulo: Estructura del informe técnico --- introducción, desarrollo, conclusiones
titulo_portada: |-
  Estructura del
  informe técnico ---
  intro, desarrollo, cierre
producto_final: |-
  Plantilla personal reutilizable de informe técnico con las 3 secciones obligatorias estructuradas (introducción con contexto, objetivo y alcance; desarrollo con datos, argumentos y análisis; conclusiones con hallazgos y recomendaciones accionables) + 1 informe técnico aplicado a un caso real del colegio (propuesta de mejora del recreo, análisis de uso del laboratorio, evaluación de la cafetería, estudio del tiempo de pantalla del grupo) con la estructura completa y 3-5 páginas
apertura:
  saber_ancestral: |-
    En cualquier cocina del Valle del Cauca, en las casas de los abuelos del Quindío y en las cocinas comunitarias del Pacífico, hay una práctica ancestral que cualquier receta seria respeta: \textbf{toda preparación tiene 3 tiempos}. (1) \textbf{Alistamiento}: antes de prender el fogón, la cocinera saca los ingredientes, los mide, los lava, los pica, los organiza por orden de uso. Sin alistamiento, el aceite se calienta sin la cebolla lista, la sal se olvida, el plato sale apurado. (2) \textbf{Cocción}: aquí pasa lo importante. Se sofríe, se hierve, se condimenta, se prueba, se ajusta. Es la zona más larga del proceso. (3) \textbf{Servido}: la cocinera prueba una última vez, ajusta sal o picante si hace falta, decora si es plato de visita, sirve. Recién entonces el plato existe para el comensal. Quien intenta cocinar saltándose el alistamiento o sin servir bien al final pierde el sabor de todo el trabajo. La receta ancestral exige los 3 tiempos en orden. La sabiduría es simple: \textbf{principio que prepara, medio que cocina, fin que entrega}. El informe técnico moderno hereda esa misma estructura: introducción que prepara, desarrollo que cocina, conclusiones que entregan.
  saber_contemporaneo: |-
    La \textbf{estructura del informe técnico} es la herramienta más estable del oficio profesional escrito: existe desde los primeros informes científicos del siglo XVII y sigue vigente. Sus 3 secciones obligatorias son: (1) \textbf{Introducción} (15-20 por ciento del informe): presenta el contexto (qué se estudió, por qué importa), el objetivo (qué se pretende mostrar o decidir) y el alcance (qué se cubre y qué queda fuera). Es la sección que orienta al lector apurado. (2) \textbf{Desarrollo} (60-70 por ciento): es el cuerpo del informe. Aquí van la metodología (cómo se hizo el análisis), los datos (qué se encontró), los argumentos (cómo se interpretan los datos). En informes con investigación se subdivide en secciones temáticas con subtítulos. (3) \textbf{Conclusiones} (15-20 por ciento): los hallazgos principales en 1-3 frases claras + recomendaciones accionables (qué se propone hacer con los hallazgos). La regla profesional: \textbf{cada sección tiene función única, no se debe mezclar}. Si pones datos en la introducción o conclusiones sin recomendaciones, el informe pierde rigor. La IA generativa puede ayudar a estructurar y revisar, pero el editor humano decide qué entra en cada sección.
  pregunta_puente: |-
    ¿Qué sabía la cocinera del Pacífico al respetar los 3 tiempos de la receta, que el novato olvida cuando escribe un informe sin estructura clara? ¿Y por qué un informe con introducción débil pierde al lector aunque el desarrollo sea brillante?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué información va en cada una de las 3 secciones obligatorias del informe técnico; (2) \textbf{explicar} con tus palabras la función de cada sección y qué pasa cuando se omite o se mezcla; (3) \textbf{aplicar} la estructura completa a un caso real del colegio en informe de 3-5 páginas; (4) \textbf{evaluar} tu informe con criterio de claridad y separación de funciones.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 distinguiste los 4 tipos de texto profesional. Hoy implementas el \textbf{primero de los 4}: el informe técnico. Las próximas 8 sesiones (Google Docs, Markdown, encuestas, análisis, comercial, correo, mini-proyecto, sustentación) usarán informes técnicos en algún momento. Sin estructura clara hoy, todo lo demás será borroso.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{relectura crítica}: toma el informe técnico real que encontraste en la sesión 1 (Actividad 1) y márcalo con 3 colores distintos: verde para introducción, amarillo para desarrollo, azul para conclusiones. ¿Las 3 secciones están claras? ¿Hay confusiones?
  a_sistematizacion: |-
    Ya analizaste 1 informe real. Ahora vas a entender la \textbf{anatomía profesional de las 3 secciones}: qué va en cada una, en qué proporción, los 5 errores típicos del informe novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: construyes tu plantilla personal, eliges caso real del colegio, escribes informe técnico completo de 3-5 páginas siguiendo la estructura.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: plantilla + informe aplicado. El criterio principal: que cualquier docente o coordinador leyendo tu informe pueda tomar decisión con base en él.
  a_evaluacion: |-
    Antes de cerrar, mira la estructura desde las cinco dimensiones humanas. Estructurar antes de escribir es respeto por el lector tomador de decisiones; entregar texto desordenado es traicionar el oficio profesional.
  a_triangulo: |-
    Y para terminar, tres voces sobre el orden. Dussel sobre los informes que dignifican al tomador de decisiones, Marco Aurelio sobre la disciplina de la estructura, Floridi sobre el informe como pieza de información cuidada.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Relectura crítica del informe real} (15 min · individual). Toma el informe técnico real que encontraste en la sesión 1 (Actividad 1). Imprímelo o ábrelo digital y márcalo con 3 colores distintos: \textbf{verde} para introducción, \textbf{amarillo} para desarrollo, \textbf{azul} para conclusiones. Para cada sección, anota: (1) ¿está claramente identificada (con subtítulo o transición)? (2) ¿qué proporción del informe ocupa? (3) ¿hay mezcla de contenido entre secciones?. Esta lectura crítica te muestra la estructura en uso real.
  checks:
  - Marqué un informe real con 3 colores.
  - Identifiqué las 3 secciones.
  - Detecté si hay mezcla o claridad.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 secciones bajo la lupa». \textbf{Formato:} captura del informe marcado + observaciones sobre claridad y proporción de cada sección. \textbf{Sabes que terminaste cuando} reconoces la estructura por colores y proporciones.
sistematizacion:
  intro: |-
    Tu lectura crítica te da contexto. Ahora necesitas la \textbf{anatomía profesional} de las 3 secciones del informe técnico.
  pilares:
  - |-
    Las \textbf{3 secciones obligatorias} se descomponen así: (1) \textbf{Introducción} (15-20 por ciento, ~0.5-1 página en informe de 3-5 pp): \emph{Contexto} (qué problema o tema se aborda, por qué importa ahora), \emph{Objetivo} (qué se pretende mostrar, decidir, recomendar), \emph{Alcance} (qué cubre, qué deja fuera explícitamente). Función: orientar al lector apurado que necesita decidir si seguir leyendo. (2) \textbf{Desarrollo} (60-70 por ciento, ~2-3 páginas): \emph{Metodología} (cómo se obtuvieron los datos: encuesta, observación, registro), \emph{Datos o evidencia} (números, observaciones, citas, gráficos), \emph{Análisis} (interpretación de los datos con argumentos). Puede subdividirse en 2-4 subsecciones según el tema. Función: sostener las conclusiones con evidencia verificable. (3) \textbf{Conclusiones} (15-20 por ciento, ~0.5-1 página): \emph{Hallazgos principales} (en 2-4 frases claras lo más importante encontrado), \emph{Recomendaciones accionables} (qué se propone hacer, quién es responsable, en qué plazo). Función: cerrar con propuesta clara para tomador de decisiones.
  - |-
    El patrón profesional clave: \textbf{cada sección responde una pregunta distinta}. Introducción responde \emph{``¿de qué trata y por qué importa?''}. Desarrollo responde \emph{``¿qué se encontró y por qué se cree?''}. Conclusiones responden \emph{``¿qué se propone hacer?''}. Si una sección no responde a su pregunta, está mal escrita. La phronesis del oficio consiste en \textbf{no mezclar las preguntas entre secciones}.
  - |-
    Lo esencial cabe en una regla simple: \textbf{no datos sin análisis, no recomendaciones sin datos}. Si en desarrollo pones solo cifras sin interpretarlas, el lector se pierde. Si en conclusiones recomiendas algo que no está sostenido por los datos del desarrollo, pierdes credibilidad. La estructura es cadena: introducción justifica el estudio, desarrollo aporta evidencia, conclusiones proponen acción con base en esa evidencia.
  - |-
    Algoritmo: (1) construir plantilla personal con las 3 secciones y subsecciones típicas. (2) elegir caso real del colegio. (3) recolectar datos básicos (observación, mini-encuesta, conteo manual). (4) escribir introducción con contexto/objetivo/alcance. (5) escribir desarrollo con metodología/datos/análisis. (6) escribir conclusiones con hallazgos/recomendaciones. (7) verificar proporciones (15/70/15 aproximado). (8) revisar coherencia: ¿las conclusiones se sostienen en los datos del desarrollo?
  anatomia:
    titulo: Anatomía del informe técnico
    body: |-
      \textbf{Introducción (~15-20 por ciento):} contexto + objetivo + alcance. \\[1mm] \textbf{Desarrollo (~60-70 por ciento):} metodología + datos + análisis. \\[1mm] \textbf{Conclusiones (~15-20 por ciento):} hallazgos + recomendaciones. \\[1mm] \textbf{Cadena:} introducción justifica, desarrollo aporta, conclusiones proponen.
  errores_comunes: |-
    (1) \textbf{Introducción muy larga o muy corta}: una página de intro en informe de 3 pp desproporciona; medio párrafo de intro pierde al lector. (2) \textbf{Datos en introducción}: la intro contextualiza, no aporta datos. (3) \textbf{Conclusiones sin recomendaciones}: hallazgos sueltos sin propuesta de acción. (4) \textbf{Recomendaciones sin sustento en datos}: opiniones disfrazadas de conclusión. (5) \textbf{Mezcla de funciones}: análisis en conclusiones, recomendaciones en desarrollo, datos en introducción. (6) \textbf{Sin alcance declarado}: el lector no sabe qué cubre y qué no.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía del informe técnico». \textbf{Formato:} (a) las 3 secciones con su pregunta clave y proporción; (b) ejemplo de cadena intro-desarrollo-conclusiones; (c) los 6 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías auditar la estructura de cualquier informe real.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- Plantilla personal + informe técnico aplicado} (40 min · individual). Hora de aplicar. Construyes plantilla reutilizable, eliges caso real del colegio, recolectas datos básicos, escribes informe técnico completo de 3-5 páginas.
  pilares:
  - |-
    Tu plantilla personal tiene 5 elementos: (1) Encabezado del informe (título + autor + fecha + destinatario). (2) Sección Introducción con 3 subsecciones (Contexto, Objetivo, Alcance). (3) Sección Desarrollo con 3 subsecciones (Metodología, Datos, Análisis). (4) Sección Conclusiones con 2 subsecciones (Hallazgos, Recomendaciones). (5) Espacio para firma y fecha al final. Esta plantilla la guardas en Google Docs como plantilla reutilizable.
  - |-
    Tu informe técnico aplicado se construye en 6 pasos: (1) elegir caso real del colegio (mejora del recreo, uso del laboratorio, estudio del tiempo de pantalla del grupo, evaluación de la cafetería, análisis de inasistencias). (2) recolectar datos básicos esta semana (mini-encuesta a 10-20 personas, conteo manual durante 3 días, observación estructurada). (3) escribir introducción con los 3 elementos. (4) escribir desarrollo con los 3 elementos. (5) escribir conclusiones con los 2 elementos. (6) revisar proporciones, coherencia y la cadena lógica.
  - |-
    Sigue el patrón \textbf{``datos verificables sobre opinión''}: en el desarrollo, cada afirmación debe sustentarse en un dato o una observación concreta. \emph{``El recreo es muy corto''} no es dato; \emph{``En encuesta a 15 estudiantes, 12 reportaron que 15 minutos no alcanzan para alimentarse''} sí es dato. La phronesis del informe técnico consiste en \textbf{no afirmar lo que no se puede sostener con evidencia}.
  - |-
    Algoritmo: (1) plantilla. (2) caso. (3) recolección de datos. (4) intro. (5) desarrollo. (6) conclusiones. (7) revisión final: ¿las 3 secciones están proporcionadas?, ¿hay datos que sustentan?, ¿las recomendaciones son accionables?
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Plantilla personal construida y guardada. \\[1mm] \checkbox Caso real del colegio elegido. \\[1mm] \checkbox Datos básicos recolectados. \\[1mm] \checkbox Introducción con contexto + objetivo + alcance. \\[1mm] \checkbox Desarrollo con metodología + datos + análisis. \\[1mm] \checkbox Conclusiones con hallazgos + recomendaciones. \\[1mm] \checkbox Proporciones 15-70-15 respetadas. \\[1mm] \checkbox Cadena lógica verificada.
  plantilla_guion: |-
    \textbf{Encabezado.} \textit{Título + autor + fecha + destinatario.} \\[1mm] \textbf{Introducción.} \textit{Contexto + Objetivo + Alcance.} \\[1mm] \textbf{Desarrollo.} \textit{Metodología + Datos + Análisis.} \\[1mm] \textbf{Conclusiones.} \textit{Hallazgos + Recomendaciones accionables.} \\[1mm] \textbf{Firma y fecha.} \textit{Cierre formal.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- Mi informe técnico». \textbf{Formato:} (a) plantilla personal; (b) informe completo de 3-5 páginas con la estructura aplicada; (c) revisión de proporciones y coherencia. \textbf{Sabes que terminaste cuando} tu informe podría ser leído por la coordinación y servir para una decisión.
  producto_titulo: Plantilla personal + informe técnico aplicado de 3-5 páginas
  criterios:
  - Plantilla con las 3 secciones y subsecciones
  - Caso real del colegio elegido
  - Datos básicos recolectados
  - Introducción/desarrollo/conclusiones con proporciones correctas
  - Recomendaciones accionables
  - Cadena lógica verificable
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un informe técnico estructurado dignifica al tomador de decisiones; uno caótico lo abruma y le quita el tiempo.
    aplicacion: |-
      Quien recibe tu informe (coordinador, rector, gerente futuro) suele tener poco tiempo. La filosofía de la liberación pide ese cuidado: \textbf{estructurar para que el lector tomador de decisiones encuentre lo que necesita rápido}. Las 3 secciones obligatorias permiten que el lector apurado lea solo introducción y conclusiones si no tiene tiempo. La phronesis del informe profesional consiste en \textbf{servir al tomador de decisiones, no abrumarlo}.
    pregunta_espejo: |-
      ¿Mi estructura sirve al lector tomador de decisiones, o le exige tiempo que no tiene?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La disciplina de la estructura es virtud del informe; la improvisación es vicio que se nota en la confusión final.
    aplicacion: |-
      Es tentador escribir el informe de corrido sin pensar las secciones. La sabiduría estoica recomienda lo opuesto: \emph{respeta la estructura aunque parezca lenta}. Esa disciplina parece formalismo pero es lo único que produce informes utilizables. Sin estructura el lector se pierde aunque el contenido sea bueno.
    pregunta_espejo: |-
      ¿Estoy respetando la estructura con disciplina, o improvisando porque parece más rápido?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El informe técnico bien estructurado es pieza de información cuidada en la era del exceso de datos.
    aplicacion: |-
      En la era de la información, los tomadores de decisiones reciben muchos informes. La ética profesional del oficio escrito pide informes bien estructurados que respeten el tiempo del lector. Tu informe técnico de hoy te entrena en una práctica que rige toda profesión técnica: \textbf{producir información cuidada con estructura clara para sostener decisiones reales}.
    pregunta_espejo: |-
      ¿Mi informe contribuye a la información cuidada, o agrega ruido al exceso ya existente?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu plantilla guardada y el informe técnico aplicado. En la sesión 3 vas a aprender a usar \textbf{Google Docs profesionalmente} con estilos, índice automático y citas. La estructura de hoy es el esqueleto; las herramientas de Docs de mañana son la forma profesional final.
web:
  conceptos_clave:
    - termino: Introducción
      definicion: |-
        Primera sección (15-20% del informe). Presenta contexto, objetivo y alcance. Orienta al lector apurado.
      ejemplo: |-
        "Este informe analiza el ruido durante el recreo. Objetivo: proponer medidas a rectoría. Alcance: aulas del piso 2."
      emoji: "🚪"
    - termino: Desarrollo
      definicion: |-
        Cuerpo del informe (60-70%). Aquí van metodología, datos y análisis. Se subdivide en secciones temáticas con subtítulos.
      ejemplo: |-
        Mediciones en 5 horarios, tabla de decibeles por aula, comparación con norma OMS, interpretación.
      emoji: "🔬"
    - termino: Conclusiones
      definicion: |-
        Última sección (15-20%). Hallazgos principales en 1-3 frases + recomendaciones accionables.
      ejemplo: |-
        "El ruido supera la norma en 3 aulas. Se recomienda redistribuir las pausas y aplicar paneles acústicos."
      emoji: "🏁"
    - termino: Recomendación accionable
      definicion: |-
        Propuesta concreta con responsable sugerido y plazo. No "habría que mejorar"; sí "se propone X a Y antes de Z".
      ejemplo: |-
        "Se propone que coordinación instale 2 paneles acústicos en aulas 201 y 202 antes de junio."
      emoji: "🎯"
    - termino: Función única por sección
      definicion: |-
        Cada sección cumple su rol. No se mezclan datos en la introducción ni conclusiones sin recomendaciones.
      ejemplo: |-
        Si pones la metodología en las conclusiones, el lector se desorienta y el informe pierde rigor.
      emoji: "🧩"
  quiz:
    titulo: ¿Dominas la estructura del informe técnico?
    instrucciones: 5 preguntas para verificar que respetas función de cada sección.
    preguntas:
      - enunciado: ¿Qué porcentaje del informe ocupa el desarrollo?
        opciones:
          - 10%
          - 60-70%
          - 100%
          - 5%
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 60-70%. Es la sección más larga porque contiene metodología, datos y análisis.
        feedback_incorrecto: |-
          Son 60-70%. El desarrollo concentra el peso del informe.
      - enunciado: ¿Qué debe contener obligatoriamente la introducción?
        opciones:
          - Solo el saludo
          - Solo conclusiones
          - Solo bibliografía
          - Contexto, objetivo y alcance
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. Contexto, objetivo y alcance. Ese trío orienta al lector apurado.
        feedback_incorrecto: |-
          Contexto, objetivo y alcance. Sin esos tres, el lector apurado no sabe qué leer.
      - enunciado: ¿Cuál es la regla profesional sobre las secciones?
        opciones:
          - Cada sección tiene función única, no se mezcla
          - Mezclar todo
          - Solo escribir desarrollo
          - Saltar conclusiones
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Función única por sección. Mezclar pierde rigor.
        feedback_incorrecto: |-
          Cada sección tiene función única. Mezclar datos en la introducción o conclusiones sin recomendaciones pierde rigor.
      - enunciado: ¿Qué hace una recomendación accionable?
        opciones:
          - Dice "habría que mejorar"
          - Solo describe el problema
          - Propone qué, quién y para cuándo
          - Es opcional
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Accionable significa qué se hace, quién lo hace y plazo concreto.
        feedback_incorrecto: |-
          Propone qué, quién y plazo. "Habría que mejorar" no es accionable; "Coordinación instala X antes de junio" sí.
      - enunciado: ¿Desde cuándo existe la estructura del informe técnico?
        opciones:
          - Siglo XVII (primeros informes científicos)
          - 2025
          - Solo en TikTok
          - 1500 a.C.
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Desde el siglo XVII con los primeros informes científicos. Sigue vigente.
        feedback_incorrecto: |-
          Existe desde el siglo XVII. Es de las herramientas más estables del oficio profesional escrito.

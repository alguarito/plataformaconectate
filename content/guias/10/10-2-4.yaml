clave: 2-4
grado: 10
periodo: 2
sesion: 4
completo: true
titulo: Markdown --- el formato del oficio digital portable
titulo_portada: |-
  Markdown ---
  el formato del oficio
  digital portable
producto_final: |-
  Documento profesional en Markdown con al menos 8 elementos distintos (encabezados de 3 niveles, listas ordenadas y no ordenadas, tabla, enlace, imagen, bloque de código, cita en bloque, énfasis con negrita o cursiva) escrito en un editor gratuito (StackEdit, Dillinger, Obsidian, VS Code) + conversión y exportación a al menos 2 formatos distintos (PDF y HTML) + comparación de 5 líneas con Word/Docs identificando 3 ventajas concretas de Markdown
apertura:
  saber_ancestral: |-
    En las sastrerías del centro de Cartago, en los talleres de costura del barrio Obrero, hay un secreto del oficio que separa al sastre profesional del aficionado: \textbf{el uso de patrón estandarizado}. Cuando llega un cliente a hacerse un saco, el sastre no improvisa cortes a ojo. Toma del cajón el \textbf{patrón base} de saco (papel manila grueso, con líneas precisas, calculado matemáticamente). Lo coloca sobre la tela del cliente, ajusta para la talla específica, marca con tiza, corta. El mismo patrón base sirve para 100 clientes distintos: cambia la tela, cambia el ajuste, pero la \textbf{estructura permanece}. Si el sastre intentara coser cada saco improvisando, cada pieza saldría desproporcionada, mal calzada, distinta. El patrón estandarizado da \textbf{portabilidad}: el oficio se puede transmitir, repetir, escalar. Esa práctica ancestral del sastre tiene equivalente en el oficio digital: se llama \textbf{Markdown}. Es el patrón estándar de la escritura digital, que permite que el mismo archivo se convierta a PDF, HTML, libro, presentación, sin perder estructura.
  saber_contemporaneo: |-
    \textbf{Markdown} es un lenguaje de marcado ligero creado por John Gruber en 2004. Su filosofía: \textbf{escribir texto plano que se convierta automáticamente a formato visual rico}. En lugar de hacer clic en botones para poner \emph{negrita} o \emph{título}, escribes símbolos simples: \texttt{**negrita**}, \texttt{\# Título}, \texttt{- elemento de lista}. El editor o conversor traduce esos símbolos a formato. Su valor profesional es la \textbf{portabilidad}: el mismo archivo \texttt{.md} se convierte a PDF, HTML, libro, presentación, blog. No depende de Word ni de Docs. Sus \textbf{8 elementos básicos} que todo profesional debe conocer: (1) \textbf{Encabezados}: \texttt{\#} para H1, \texttt{\#\#} para H2, \texttt{\#\#\#} para H3. (2) \textbf{Listas no ordenadas}: \texttt{-} o \texttt{*} al inicio de línea. (3) \textbf{Listas ordenadas}: \texttt{1.}, \texttt{2.}, \texttt{3.}. (4) \textbf{Énfasis}: \texttt{*cursiva*} o \texttt{**negrita**}. (5) \textbf{Enlaces}: \texttt{\char91texto\char93(url)}. (6) \textbf{Imágenes}: \texttt{!\char91alt\char93(url)}. (7) \textbf{Bloques de código}: backticks. (8) \textbf{Cita en bloque}: \texttt{>} al inicio. (9) \textbf{Tablas}: con \texttt{|} y guiones. Editores gratuitos: StackEdit (web), Dillinger (web), Obsidian (descargable), VS Code (descargable, gratuito).
  pregunta_puente: |-
    ¿Qué sabía el sastre al usar patrón estandarizado para clientes distintos, que el novato olvida cuando guarda su escritura solo en formato Word? ¿Y por qué Markdown es el patrón estándar del oficio digital aunque no se vea tan elegante como Word a primera vista?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 8 elementos básicos de Markdown y cuándo usar cada uno; (2) \textbf{explicar} con tus palabras qué diferencia hay entre escribir en Markdown y en Word/Docs en términos de portabilidad; (3) \textbf{aplicar} la sintaxis Markdown para producir un documento profesional con los 8 elementos; (4) \textbf{evaluar} el documento exportándolo a 2 formatos (PDF y HTML) y comparando con Word/Docs.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 3 trabajaste Google Docs profesional. Hoy aprendes Markdown como alternativa portable. No reemplaza a Docs: lo complementa. Las próximas sesiones (encuestas, análisis con IA, informe comercial, correo profesional) usarán según el caso una u otra.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{experimento simple}: abre StackEdit (\texttt{stackedit.io}, gratis sin cuenta) y en el panel izquierdo escribe: \texttt{\# Mi primer Markdown} en la primera línea, \texttt{\#\# Subtítulo} en la segunda, \texttt{- elemento 1} y \texttt{- elemento 2} debajo. Mira el panel derecho: se renderiza automáticamente. Acabas de hacer Markdown.
  a_sistematizacion: |-
    Ya hiciste el experimento. Ahora vas a entender la \textbf{anatomía de los 8 elementos básicos} y por qué Markdown es portable.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: escribir un documento profesional en Markdown usando los 8 elementos, exportar a PDF y HTML, comparar con Word/Docs.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: documento .md + PDF + HTML + comparación con Word. El criterio principal: que entiendas Markdown como herramienta útil y no como complicación innecesaria.
  a_evaluacion: |-
    Antes de cerrar, mira Markdown desde las cinco dimensiones humanas. Aprender un estándar abierto es libertad profesional; depender solo de Word es lock-in con una empresa.
  a_triangulo: |-
    Y para terminar, tres voces sobre los estándares abiertos. Dussel sobre las herramientas que liberan al usuario, Séneca sobre la simplicidad como virtud, Floridi sobre los formatos abiertos como ética informacional.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tu primer Markdown} (15 min · individual con dispositivo). Abre StackEdit en \texttt{stackedit.io} (gratis, sin cuenta). En el panel izquierdo escribe esto exactamente: línea 1: \texttt{\# Mi primer documento}, línea 2: \texttt{Soy estudiante de grado 10}, línea 3: \texttt{\#\# Mis materias favoritas}, línea 4: \texttt{- Tecnología}, línea 5: \texttt{- Literatura}, línea 6: \texttt{**Nota:** este texto está en formato Markdown}. Mira el panel derecho: el texto se renderiza automáticamente. Anota qué símbolo produjo cada efecto visual.
  checks:
  - Abrí StackEdit y escribí 6 líneas en Markdown.
  - Vi el renderizado en el panel derecho.
  - Identifiqué qué símbolo produjo qué efecto.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mi primer Markdown». \textbf{Formato:} captura de los 2 paneles (texto y renderizado) + tabla con símbolos y sus efectos. \textbf{Sabes que terminaste cuando} ves que escribir Markdown es como escribir texto con marcas simples.
sistematizacion:
  intro: |-
    Tu experimento te muestra cómo funciona Markdown. Ahora necesitas la \textbf{anatomía completa} de los 8 elementos profesionales.
  pilares:
  - |-
    Los \textbf{8 elementos básicos de Markdown} se descomponen así: (1) \textbf{Encabezados}: \texttt{\#} (H1, título grande), \texttt{\#\#} (H2), \texttt{\#\#\#} (H3). (2) \textbf{Énfasis}: \texttt{*cursiva*} o \texttt{\_cursiva\_}; \texttt{**negrita**} o \texttt{\_\_negrita\_\_}. (3) \textbf{Listas no ordenadas}: \texttt{-} o \texttt{*} al inicio de línea, con sangría para subniveles. (4) \textbf{Listas ordenadas}: \texttt{1.}, \texttt{2.}, \texttt{3.} (los números pueden ser todos 1, el renderizador los corrige). (5) \textbf{Enlaces}: \texttt{\char91texto del enlace\char93(url)}. (6) \textbf{Imágenes}: \texttt{!\char91texto alternativo\char93(url o ruta)}. (7) \textbf{Bloques de código}: 3 backticks al abrir y 3 al cerrar, o backtick simple para código en línea. (8) \textbf{Cita en bloque}: \texttt{>} al inicio de cada línea de la cita. Bonus: \textbf{tablas} con pipes \texttt{|} y guiones para separar encabezado.
  - |-
    La \textbf{portabilidad} de Markdown es su valor único. El mismo archivo \texttt{.md} puede: (a) abrirse en cualquier editor de texto (Bloc de notas, Vim, Sublime, VS Code). (b) renderizarse en GitHub automáticamente. (c) exportarse a PDF con Pandoc o desde StackEdit/Dillinger. (d) convertirse a HTML para publicar en web. (e) usarse en Obsidian para notas conectadas. (f) ser leído por IA con mejor estructura que Word. Word no tiene esta portabilidad: si pierdes Word, pierdes acceso fácil al archivo.
  - |-
    Las \textbf{3 ventajas concretas} de Markdown frente a Word/Docs: (a) \textbf{Portabilidad universal}: cualquier sistema operativo, cualquier editor, mismo resultado. (b) \textbf{Texto plano legible}: el archivo es lectura humana incluso sin programa especial. (c) \textbf{Versionable con Git}: el control de versiones funciona perfecto con texto plano, no con archivos binarios Word.
  - |-
    Algoritmo: (1) abrir editor (StackEdit es buen primer paso). (2) escribir documento con los 8 elementos. (3) verificar renderizado en panel derecho. (4) exportar a PDF (StackEdit tiene botón). (5) exportar a HTML. (6) abrir los 3 archivos (.md, .pdf, .html) y comparar visualmente. (7) escribir comparación con Word/Docs.
  anatomia:
    titulo: Anatomía de Markdown
    body: |-
      \textbf{Encabezados:} \#, \#\#, \#\#\#. \\[1mm] \textbf{Énfasis:} *cursiva* y **negrita**. \\[1mm] \textbf{Listas:} - / 1. \\[1mm] \textbf{Enlaces:} [texto](url). \\[1mm] \textbf{Imágenes:} ![alt](url). \\[1mm] \textbf{Código:} backticks. \\[1mm] \textbf{Cita:} >. \\[1mm] \textbf{Tabla:} | con guiones.
  errores_comunes: |-
    (1) \textbf{Mezclar Markdown con HTML innecesariamente}: si \texttt{\#} funciona, no uses \texttt{$<$h1$>$}. (2) \textbf{Encabezados sin línea en blanco}: muchos parsers exigen línea vacía antes y después de encabezado. (3) \textbf{Listas sin sangría correcta}: subniveles necesitan 2 o 4 espacios. (4) \textbf{Imágenes con ruta rota}: la ruta relativa o URL debe existir. (5) \textbf{No probar el render}: escribir Markdown sin verificar cómo se ve genera errores que solo se notan al exportar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía Markdown». \textbf{Formato:} (a) los 8 elementos con sintaxis; (b) las 3 ventajas; (c) los 5 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías escribir un documento profesional sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- Documento Markdown + exportación + comparación} (40 min · individual con dispositivo). Hora de aplicar. Escribes documento con los 8 elementos, exportas a PDF y HTML, comparas con Word.
  pilares:
  - |-
    Tu documento Markdown se construye en 5 pasos: (1) elegir tema (puede ser el informe técnico de la sesión 2, una mini-biografía de alguien que admires, una guía para algo cotidiano). (2) abrir StackEdit o Dillinger. (3) escribir el documento con al menos 8 elementos distintos. (4) exportar a PDF (botón en StackEdit). (5) exportar a HTML.
  - |-
    Los 8 elementos obligatorios en tu documento: encabezados H1 H2 H3, lista no ordenada, lista ordenada, énfasis bold/cursiva, enlace, imagen (puede ser placeholder como \texttt{!\char91Mi imagen\char93(imagen.png)}), bloque de código, cita en bloque. Bonus: tabla.
  - |-
    La comparación con Word/Docs se hace en 5 líneas escritas como cierre: \emph{``Markdown me parece útil para X, X, X. Word/Docs me sigue siendo útil para Y, Y. La principal ventaja de Markdown es Z''}. Esa reflexión te ayuda a entender cuándo usar uno u otro.
  - |-
    Algoritmo: (1) elegir tema. (2) abrir editor. (3) escribir con 8 elementos. (4) verificar render. (5) exportar PDF. (6) exportar HTML. (7) comparar visualmente los 3 archivos (.md, .pdf, .html). (8) escribir comparación con Word.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Documento Markdown con 8+ elementos distintos. \\[1mm] \checkbox Encabezados en 3 niveles. \\[1mm] \checkbox Listas ordenada y no ordenada. \\[1mm] \checkbox Enlace y imagen. \\[1mm] \checkbox Bloque de código y cita. \\[1mm] \checkbox Exportado a PDF. \\[1mm] \checkbox Exportado a HTML. \\[1mm] \checkbox Comparación con Word de 5 líneas.
  plantilla_guion: |-
    \textbf{Editor.} \textit{StackEdit, Dillinger, Obsidian, VS Code.} \\[1mm] \textbf{8 elementos.} \textit{Encabezados, listas, énfasis, enlace, imagen, código, cita, tabla.} \\[1mm] \textbf{Exportación.} \textit{PDF + HTML.} \\[1mm] \textbf{Comparación.} \textit{5 líneas Markdown vs Word.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- Mi documento Markdown». \textbf{Formato:} (a) referencia al archivo .md; (b) captura de PDF y HTML; (c) comparación con Word. \textbf{Sabes que terminaste cuando} entiendes cuándo Markdown te conviene más que Word.
  producto_titulo: Documento Markdown + PDF + HTML + comparación con Word
  criterios:
  - 8 elementos distintos en el documento
  - Exportado a PDF correctamente
  - Exportado a HTML correctamente
  - Comparación con Word de 5 líneas
  - 3 ventajas concretas identificadas
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Los estándares abiertos liberan al usuario; los formatos cerrados dependen de la empresa que los controla.
    aplicacion: |-
      Word es propiedad de Microsoft; si Microsoft cambia el formato, tus documentos viejos pueden quedar inservibles. Markdown es estándar abierto, no propiedad de nadie: tus archivos seguirán siendo legibles dentro de 50 años con cualquier editor. La filosofía de la liberación pide preferir estándares abiertos cuando es posible. La phronesis del oficio digital consiste en \textbf{no encerrarse en formatos propietarios cuando hay alternativas abiertas}.
    pregunta_espejo: |-
      ¿Estoy aprendiendo Markdown como acto de libertad profesional, o lo veo como complicación innecesaria?
  estoico:
    autor: Séneca
    cita: |-
      Lo simple es virtud; la complicación innecesaria es vicio del que prefiere lo difícil por orgullo.
    aplicacion: |-
      Markdown puede parecer demasiado simple comparado con Word. La sabiduría estoica recomienda lo opuesto: \emph{aprecia la simplicidad cuando hace el trabajo}. El sastre con patrón estándar produce trabajo igual de bueno que el que improvisa, pero más rápido y portable. Markdown es ese patrón estándar.
    pregunta_espejo: |-
      ¿Estoy apreciando la simplicidad de Markdown, o lo rechazo porque parece demasiado básico?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los formatos abiertos son la nueva ética informacional en la era del control corporativo de datos.
    aplicacion: |-
      En la era de la información, las grandes corporaciones controlan formatos (Word, Photoshop, PowerPoint). La ética digital pide alternativas abiertas que no dependan de una empresa específica. Markdown es ejemplo: gratuito, abierto, portable. Tu aprendizaje de hoy te entrena en una práctica que rige toda profesión técnica seria: \textbf{preferir formatos abiertos para tu información}.
    pregunta_espejo: |-
      ¿Estoy contribuyendo a la cultura de formatos abiertos, o sostengo el control corporativo de mis archivos?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu documento Markdown, PDF, HTML y comparación. En la sesión 5 vas a aprender a hacer \textbf{encuestas con phronesis} usando Google Forms más IA para detectar preguntas sesgadas. Markdown de hoy es para escribir; Forms de mañana es para preguntar bien.
web:
  conceptos_clave:
    - termino: Markdown
      definicion: |-
        Lenguaje de marcado ligero creado en 2004. Escribes texto plano con símbolos simples que se convierten a formato visual rico.
      ejemplo: |-
        Escribes ** para negrita y # para título. Un conversor traduce los símbolos a formato real al exportar.
      emoji: "📝"
    - termino: Portabilidad
      definicion: |-
        Propiedad clave de Markdown. El mismo archivo .md se convierte a PDF, HTML, libro o presentación sin perder estructura.
      ejemplo: |-
        Escribes una vez en .md y exportas a tres formatos distintos para Slack, blog y PDF impreso.
      emoji: "🔌"
    - termino: Encabezados con #
      definicion: |-
        Sintaxis para títulos. # equivale a H1, ## a H2, ### a H3. Cuantos más #, más profundo el nivel jerárquico.
      ejemplo: |-
        # Capítulo 1 → título grande. ## 1.1 Apertura → subtítulo. Estructura jerárquica visible.
      emoji: "🏷️"
    - termino: Listas y énfasis
      definicion: |-
        - o * para listas no ordenadas; 1. 2. 3. para ordenadas; *cursiva* o **negrita** para énfasis.
      ejemplo: |-
        - Punto A, - Punto B. **Importante**: la lista usa - al inicio de cada línea, no en cualquier lugar.
      emoji: "📌"
    - termino: Editor portable
      definicion: |-
        Programa que entiende Markdown. Gratuitos: StackEdit y Dillinger en web; Obsidian y VS Code en escritorio.
      ejemplo: |-
        Abres VS Code, creas archivo .md, escribes con sintaxis Markdown, exportas a HTML o PDF.
      emoji: "🖥️"
  quiz:
    titulo: ¿Escribes en Markdown como profesional?
    instrucciones: 5 preguntas para verificar la sintaxis básica.
    preguntas:
      - enunciado: ¿Para qué sirve "# Título"?
        opciones:
          - Para un comentario
          - Para un encabezado H1
          - Para borrar texto
          - Para hacer negrita
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Un # equivale a H1, ## a H2, ### a H3. Define la jerarquía.
        feedback_incorrecto: |-
          # crea encabezado H1. Más # bajan el nivel: ## H2, ### H3.
      - enunciado: ¿Cómo se hace negrita en Markdown?
        opciones:
          - '$$texto$$'
          - '**texto**'
          - '___texto___'
          - '<b>texto</b>'
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. **texto** produce negrita en Markdown estándar.
        feedback_incorrecto: |-
          Se usa **texto**. Dos asteriscos a cada lado, sin espacios.
      - enunciado: ¿Cuál es la mayor ventaja de Markdown frente a Word?
        opciones:
          - Es más bonito
          - Es portable: el mismo .md se convierte a PDF, HTML, libro
          - Es de pago
          - No tiene ventajas
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Portabilidad: el mismo archivo soporta múltiples salidas sin reescribir el contenido.
        feedback_incorrecto: |-
          Su mayor ventaja es la portabilidad. El mismo archivo .md se convierte a PDF, HTML, libro o presentación.
      - enunciado: ¿Cuál de estos editores entiende Markdown y es gratuito?
        opciones:
          - Photoshop
          - VS Code
          - Excel
          - WhatsApp
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. VS Code es gratuito y soporta Markdown nativamente con vista previa.
        feedback_incorrecto: |-
          VS Code es gratuito y soporta Markdown. También StackEdit, Dillinger y Obsidian.
      - enunciado: ¿Quién creó Markdown y cuándo?
        opciones:
          - Microsoft, 1995
          - John Gruber, 2004
          - Google, 2010
          - Anonymous, 2020
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. John Gruber lo creó en 2004 con filosofía de simplicidad y portabilidad.
        feedback_incorrecto: |-
          John Gruber, 2004. Filosofía: texto plano que se convierte automáticamente a formato visual.

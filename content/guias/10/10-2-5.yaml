clave: 2-5
grado: 10
periodo: 2
sesion: 5
completo: true
titulo: Encuestas con phronesis --- Google Forms más IA para preguntar bien
titulo_portada: |-
  Encuestas con phronesis ---
  Google Forms
  más IA
producto_final: |-
  Encuesta diseñada en Google Forms con al menos 10 preguntas (mezcla de tipos: opción única, opción múltiple, escala Likert 1-5, abiertas, sí/no) sobre un tema escolar real (vida del recreo, consumo de tienda escolar, tiempo de pantalla, transporte al colegio, gustos musicales del grupo) + revisión con IA del cuestionario completo para detectar preguntas sesgadas, ambiguas o capciosas con bitácora de los ajustes + plan de aplicación a 20-30 personas con cronograma y consentimiento informado
apertura:
  saber_ancestral: |-
    En cualquier barrio popular del Valle del Cauca, en cualquier vereda del Cauca o del Quindío, hay una figura silenciosa que cualquier vecino mayor reconoce con una mezcla de respeto y prudencia: \textbf{la persona que sabe preguntar sin parecer entrometida}. No es chismoso barato (\emph{``y a usted qué le importa''}); es el que averigua con método. Su técnica es ancestral y precisa: (1) \textbf{Pregunta indirecta primero}: empieza por algo aparentemente banal (\emph{``¿qué tal el tiempo hoy, doña Rosa?''}). (2) \textbf{Observa la cara}: ve si la persona se relaja, se incomoda, evade o se abre. (3) \textbf{Profundiza con calma}: si ve apertura, sigue. Si ve resistencia, retrocede. (4) \textbf{Nunca pregunta capciosa}: no induce respuestas con preguntas tendenciosas. (5) \textbf{Respeta el silencio}: deja espacio para que la otra persona piense. Esa persona logra enterarse de lo que pasa en el barrio sin que nadie se sienta interrogado. La sabiduría ancestral es phronesis pura: \textbf{preguntar bien es oficio antes que técnica}. Esa misma phronesis es la que pide una buena encuesta profesional: orden, neutralidad, respeto por el encuestado.
  saber_contemporaneo: |-
    Una \textbf{encuesta profesional} es instrumento de recolección de datos que requiere diseño cuidadoso. La regla profesional: \textbf{las respuestas dependen de cómo preguntas, no solo de a quién preguntas}. \textbf{Google Forms} (gratis con cuenta Gmail) es la herramienta más usada para encuestas digitales. Soporta varios \textbf{tipos de preguntas}: (1) \textbf{Opción única (multiple choice)}: el encuestado elige 1 de varias opciones. Útil para variables categóricas (sexo, transporte usado, grado). (2) \textbf{Opción múltiple (checkbox)}: el encuestado elige varias. Útil para opciones que no son excluyentes. (3) \textbf{Escala Likert 1-5}: medición de actitudes (1=muy en desacuerdo, 5=muy de acuerdo). (4) \textbf{Respuesta abierta corta}: para datos específicos (edad, número). (5) \textbf{Respuesta abierta larga}: para comentarios cualitativos. (6) \textbf{Cuadrícula}: para evaluar varios items con la misma escala. La regla profesional fundamental: \textbf{toda pregunta debe pasar el filtro de la IA antes de aplicarse}. ChatGPT, Gemini o Claude pueden detectar 5 problemas comunes: preguntas sesgadas, ambiguas, capciosas, doble cabeza, asumir conocimiento previo. Pedirle a la IA \emph{``analiza este cuestionario para detectar preguntas problemáticas''} es práctica profesional moderna.
  pregunta_puente: |-
    ¿Qué sabía el que pregunta bien del barrio al respetar el silencio y observar la cara, que el novato de Forms olvida cuando hace preguntas tendenciosas como \emph{``¿no le parece que el recreo es muy corto?''}? ¿Y por qué pasar el cuestionario por IA antes de aplicarlo evita 80 por ciento de los errores comunes?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 6 tipos de preguntas de Google Forms y cuándo usar cada uno; (2) \textbf{analizar} un cuestionario tuyo con asistencia de IA para detectar sesgos, ambigüedades y preguntas capciosas; (3) \textbf{aplicar} la phronesis del preguntón ancestral al diseño de preguntas neutras y útiles; (4) \textbf{evaluar} el cuestionario final ajustando según el análisis con IA.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 1-4 trabajaste textos profesionales escritos. Hoy aprendes a \emph{recolectar datos propios} con encuestas. Las sesiones 6-9 usarán los datos que recolectes hoy para análisis con IA y luego informe comercial. Sin buenos datos hoy, los análisis de mañana serán falsos.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{experimento del entrevistador novato}: imagina que quieres saber si los compañeros del grupo están de acuerdo con cambiar el horario del recreo. Escribe 3 preguntas que harías. Después, mírate críticamente: ¿alguna de tus preguntas induce la respuesta que tú esperas?
  a_sistematizacion: |-
    Ya tienes tus 3 preguntas críticas. Ahora vas a entender la \textbf{anatomía de las encuestas profesionales}: los 6 tipos de pregunta, los 5 errores comunes, el filtro de IA.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: diseñas encuesta en Forms con 10 preguntas, la pasas por IA para análisis, ajustas según hallazgos, preparas plan de aplicación a 20-30 personas.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: encuesta Forms + análisis IA + bitácora ajustes + plan de aplicación. El criterio principal: que las preguntas sean neutras y útiles para tomar decisión real.
  a_evaluacion: |-
    Antes de cerrar, mira la encuesta desde las cinco dimensiones humanas. Preguntar bien es respeto por el encuestado; preguntar mal es manipulación disfrazada de investigación.
  a_triangulo: |-
    Y para terminar, tres voces sobre la palabra que pregunta. Dussel sobre las encuestas que dignifican al encuestado, Séneca sobre la neutralidad como virtud, Floridi sobre el dato bien recolectado como ética informacional.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 3 preguntas críticas} (15 min · individual). Imagina que quieres saber qué piensa tu grupo sobre el horario actual del recreo (15 minutos). Sin investigar nada todavía, escribe 3 preguntas que harías. Después léelas con ojo crítico y verifica: (1) ¿alguna induce la respuesta que tú esperas? (\emph{``¿no le parece que 15 minutos es muy poco?''}). (2) ¿alguna asume conocimiento que el encuestado puede no tener? (3) ¿alguna tiene 2 preguntas dentro de una sola (doble cabeza)? Esa autocrítica te entrena el ojo para detectar sesgos.
  checks:
  - Escribí 3 preguntas iniciales sobre el recreo.
  - Las revisé críticamente.
  - Identifiqué si tienen sesgos, ambigüedades o doble cabeza.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 preguntas críticas». \textbf{Formato:} 3 preguntas iniciales + autocrítica de cada una. \textbf{Sabes que terminaste cuando} ves que tus propias preguntas iniciales tienen sesgos.
sistematizacion:
  intro: |-
    Tu autocrítica te mostró que los sesgos son fáciles de cometer. Ahora necesitas la \textbf{anatomía profesional} de las encuestas y el filtro de IA.
  pilares:
  - |-
    Los \textbf{6 tipos de preguntas de Google Forms} se descomponen así: (1) \textbf{Opción única}: \emph{``¿Cuál es tu medio de transporte al colegio?''} (a) Pie (b) Bus (c) Bicicleta (d) Moto (e) Otro. (2) \textbf{Opción múltiple}: \emph{``¿Qué actividades haces durante el recreo?''} (puede marcar varias). (3) \textbf{Escala Likert 1-5}: \emph{``Estoy satisfecho con la duración del recreo''} (1=muy en desacuerdo, 5=muy de acuerdo). (4) \textbf{Respuesta abierta corta}: \emph{``¿Cuántos minutos durmiste anoche?''} (5) \textbf{Respuesta abierta larga}: \emph{``Si pudieras cambiar algo del recreo, ¿qué sería y por qué?''}. (6) \textbf{Cuadrícula}: tabla que evalúa varios items con la misma escala (\emph{``Califica de 1 a 5 cada uno: cafetería, baños, recreo, biblioteca''}).
  - |-
    Los \textbf{5 errores comunes} en encuestas y cómo evitarlos: (a) \textbf{Pregunta sesgada}: \emph{``¿No le parece que el recreo debería ser más largo?''} (induce sí). \emph{Mejor:} \emph{``¿La duración actual del recreo es adecuada para ti?''}. (b) \textbf{Pregunta ambigua}: \emph{``¿Te gusta la cafetería?''}. ¿Te gusta qué de la cafetería? \emph{Mejor:} preguntar por aspectos específicos (precios, sabor, opciones, atención). (c) \textbf{Doble cabeza}: \emph{``¿La biblioteca y la sala de cómputo te parecen útiles?''} son 2 preguntas. \emph{Mejor:} separarlas. (d) \textbf{Asumir conocimiento previo}: \emph{``¿Apoyas el nuevo sistema MILC?''} sin explicar qué es. (e) \textbf{Opciones de respuesta incompletas}: si preguntas \emph{``¿qué transporte usas?''} debes incluir \emph{otro} para casos no previstos.
  - |-
    El \textbf{filtro de IA} es práctica profesional moderna. El prompt típico: \emph{``Actúa como experto en metodología de encuestas. Aquí está mi cuestionario sobre [tema] aplicado a [audiencia]. Analiza cada pregunta y detecta: (1) sesgos (preguntas que inducen respuesta), (2) ambigüedades, (3) preguntas de doble cabeza, (4) asunciones de conocimiento previo, (5) opciones de respuesta incompletas. Sugiere ajustes específicos''}. Pasa el resultado por ChatGPT, Gemini o Claude. La IA suele detectar el 80 por ciento de los problemas comunes.
  - |-
    Algoritmo: (1) elegir tema real del colegio. (2) escribir 10 preguntas iniciales con mezcla de tipos. (3) revisarlas a mano con la lista de 5 errores. (4) pasarlas por IA para análisis completo. (5) ajustar según hallazgos. (6) crear encuesta en Forms. (7) preparar plan de aplicación con consentimiento informado.
  anatomia:
    titulo: Anatomía de la encuesta profesional
    body: |-
      \textbf{6 tipos:} única / múltiple / Likert / abierta corta / abierta larga / cuadrícula. \\[1mm] \textbf{5 errores:} sesgo / ambigüedad / doble cabeza / asunción / opciones incompletas. \\[1mm] \textbf{Filtro IA:} análisis con prompt específico antes de aplicar. \\[1mm] \textbf{Consentimiento:} declarar propósito y anonimato.
  errores_comunes: |-
    (1) Pregunta sesgada que induce respuesta. (2) Pregunta ambigua sin especificar aspecto. (3) Doble cabeza (2 preguntas en 1). (4) Asumir conocimiento que el encuestado no tiene. (5) Opciones de respuesta incompletas (sin \emph{otro}). (6) Encuesta demasiado larga (más de 15 preguntas cansa). (7) Sin consentimiento informado al inicio.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía encuesta». \textbf{Formato:} (a) los 6 tipos con ejemplo; (b) los 5 errores con corrección; (c) prompt de filtro IA. \textbf{Sabes que terminaste cuando} sabes detectar los 5 errores en preguntas ajenas.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- Encuesta Forms + análisis IA + ajustes + plan} (40 min · individual con dispositivo). Hora de aplicar. Diseñas encuesta de 10 preguntas, la pasas por IA, ajustas, creas en Forms, preparas plan de aplicación.
  pilares:
  - |-
    Tu encuesta se construye en 6 pasos: (1) elegir tema real (recreo, cafetería, transporte, tiempo de pantalla, hábitos de estudio). (2) escribir 10 preguntas mezclando 4-5 tipos distintos. (3) pasar las 10 preguntas por IA usando el prompt de filtro. (4) ajustar según el análisis (corregir sesgos, especificar ambigüedades, separar dobles cabezas). (5) crear la encuesta en Google Forms agregando consentimiento informado al inicio. (6) preparar plan de aplicación con cronograma y lista de 20-30 personas a encuestar.
  - |-
    El \textbf{consentimiento informado al inicio} de la encuesta tiene 4 elementos: (a) propósito del estudio en 1-2 líneas. (b) anonimato declarado o nombre opcional. (c) tiempo estimado (\emph{``5 minutos''}). (d) opción de no participar. Sin estos 4 elementos, la encuesta es éticamente cuestionable.
  - |-
    La bitácora de ajustes tiene 3 columnas: (a) pregunta original. (b) error detectado por IA. (c) pregunta ajustada. Al menos 3-5 filas que demuestren cómo la IA te ayudó a mejorar.
  - |-
    Algoritmo: (1) tema. (2) 10 preguntas iniciales. (3) filtro IA. (4) ajustes con bitácora. (5) Forms con consentimiento. (6) plan de aplicación. (7) verificar tiempo total (debería tomar 5-7 min responder).
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 10 preguntas mezclando 4+ tipos. \\[1mm] \checkbox Filtro de IA aplicado al cuestionario completo. \\[1mm] \checkbox Bitácora con 3+ ajustes documentados. \\[1mm] \checkbox Encuesta creada en Google Forms. \\[1mm] \checkbox Consentimiento informado al inicio. \\[1mm] \checkbox Plan de aplicación a 20-30 personas. \\[1mm] \checkbox Tiempo total de respuesta verificado.
  plantilla_guion: |-
    \textbf{Tema.} \textit{Escolar real.} \\[1mm] \textbf{10 preguntas.} \textit{Mezcla de 4+ tipos.} \\[1mm] \textbf{Filtro IA.} \textit{Prompt de análisis.} \\[1mm] \textbf{Bitácora.} \textit{3+ ajustes documentados.} \\[1mm] \textbf{Forms.} \textit{Encuesta con consentimiento.} \\[1mm] \textbf{Plan.} \textit{20-30 personas + cronograma.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- Mi encuesta profesional». \textbf{Formato:} (a) link a la encuesta Forms; (b) bitácora de ajustes; (c) plan de aplicación. \textbf{Sabes que terminaste cuando} la encuesta está lista para enviar el lunes.
  producto_titulo: Encuesta Forms + análisis IA + bitácora + plan aplicación
  criterios:
  - 10 preguntas con 4+ tipos
  - Filtro de IA aplicado
  - Bitácora de ajustes documentada
  - Consentimiento informado al inicio
  - Plan de aplicación a 20-30 personas
  - Tiempo de respuesta razonable (5-7 min)
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Una encuesta neutra dignifica al encuestado; una tendenciosa lo manipula bajo disfraz de investigación.
    aplicacion: |-
      Cuando una encuesta tiene preguntas tendenciosas, no investiga: confirma lo que el encuestador ya quería oír. La filosofía de la liberación pide lo opuesto: \textbf{respetar al encuestado dejándole responder libremente}. La phronesis del preguntón ancestral hacía eso por instinto; la encuesta profesional moderna lo hace por método.
    pregunta_espejo: |-
      ¿Mi encuesta deja libertad al encuestado para responder honestamente, o lo induce a confirmar mi hipótesis?
  estoico:
    autor: Séneca
    cita: |-
      La neutralidad en la pregunta es virtud del que busca verdad; la tendenciosidad es vicio del que ya tiene conclusión.
    aplicacion: |-
      Es tentador formular preguntas que confirmen lo que tú piensas. La sabiduría estoica recomienda lo opuesto: \emph{si ya sabes la respuesta, no preguntes}. Si preguntas, prepárate para que el dato te sorprenda. La phronesis del oficio consiste en \textbf{preguntar para aprender, no para confirmar}.
    pregunta_espejo: |-
      ¿Estoy preguntando para aprender, o para que confirmen lo que ya pienso?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El dato bien recolectado es ética informacional en la era de la sobreinformación.
    aplicacion: |-
      En la era de la información, hay datos por todas partes pero pocos están bien recolectados. La ética profesional pide que cuando produces datos propios, los produzcas con rigor: pregunta neutra, consentimiento informado, anonimato si aplica, filtro de IA contra sesgos. Tu encuesta de hoy te entrena en esa práctica.
    pregunta_espejo: |-
      ¿Mis datos están siendo recolectados con rigor profesional, o solo replico la mala práctica que circula?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu encuesta aplicada y al menos 15-20 respuestas reales recolectadas. En la sesión 6 vas a aprender a hacer \textbf{análisis cualitativo con IA} de las respuestas abiertas. La encuesta de hoy es la materia prima; el análisis de mañana es donde se vuelve información útil.

clave: 2-6
grado: 10
periodo: 2
sesion: 6
completo: true
titulo: Análisis cualitativo con IA --- qué hace y qué no
titulo_portada: |-
  Análisis cualitativo
  con IA ---
  qué hace y qué no
producto_final: |-
  Análisis cualitativo con asistencia de IA de 15-20 respuestas abiertas reales de tu encuesta de la sesión 5 + clasificación temática automática propuesta por la IA (3-5 categorías emergentes) + tabla de auditoría con 3 columnas (a) lo que la IA clasificó correctamente, (b) lo que erró o malinterpretó, (c) cómo lo corregiste con criterio humano + reflexión final de 5 líneas sobre los límites del análisis automatizado con respuestas en español coloquial
apertura:
  saber_ancestral: |-
    En la cocina de los restaurantes pequeños del centro de Cartago, sostuvo durante décadas una práctica que cualquier comensal observador reconoce: \textbf{la cocinera muestra siempre las medidas antes de cocinar}. Cuando un cliente pide un plato especial o complejo, la cocinera no entra a la cocina directamente: saca la libra de pollo, los gramos de arroz, la taza de caldo, los pone sobre la mesa, y dice: \emph{``vea, esto es lo que va''}. El cliente mira, aprueba o sugiere ajuste (\emph{``menos sal''}, \emph{``más papa''}), y solo entonces la cocinera entra a la estufa. Ese gesto cumple 2 funciones simultáneas: (1) \textbf{Transparencia}: el cliente ve lo que va a comer antes de que esté cocinado. (2) \textbf{Verificación humana}: el cliente puede corregir antes del punto sin retorno. La sabiduría es ancestral: \textbf{quien cocina y quien come deciden juntos, no la cocinera sola}. Esa práctica del oficio se traduce directamente al análisis de datos con IA: la IA es buena agregando y proponiendo clasificaciones, pero puede errar en matices culturales o coloquiales. Tu papel como editor es \textbf{ver lo que propone la IA antes de servirlo como conclusión}.
  saber_contemporaneo: |-
    El \textbf{análisis cualitativo} es el proceso de extraer significado de respuestas abiertas (texto, no números). Tradicionalmente requería leer cada respuesta, agrupar manualmente por temas, codificar con etiquetas. Con IA generativa (ChatGPT, Gemini, Claude), el proceso se acelera: pegas las respuestas y le pides clasificación temática automática. La IA propone categorías emergentes (\emph{salud mental, presión académica, problemas de transporte, etc.}) y asigna cada respuesta a una categoría. La regla profesional famosa: \textbf{la IA propone, el humano dispone}. La IA es buena en: (a) detectar patrones obvios. (b) agrupar respuestas similares. (c) hacer resúmenes. La IA es mala en: (a) detectar sarcasmo (\emph{``perfecto, otro recreo de 5 minutos''} puede tomarse literal). (b) entender modismos locales (\emph{``estoy planchao''} = sin dinero en costa, no en interior). (c) captar contexto cultural específico. (d) detectar respuestas que parecen claras pero esconden ambigüedad. El editor humano debe \textbf{auditar la clasificación de la IA siempre}, especialmente con respuestas en español coloquial colombiano.
  pregunta_puente: |-
    ¿Qué sabía la cocinera al mostrar las medidas antes de cocinar, que el novato olvida cuando acepta la clasificación de la IA sin verificar? ¿Y por qué la IA puede equivocarse interpretando un \emph{``más o menos''} colombiano que es ambiguo a propósito?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué tipos de respuesta son fáciles para la IA y cuáles le dan problema; (2) \textbf{analizar} 15-20 respuestas abiertas con asistencia de IA para clasificación temática; (3) \textbf{evaluar} la clasificación de la IA respuesta por respuesta, detectando aciertos y errores; (4) \textbf{explicar} con honestidad los límites del análisis automatizado y cómo el criterio humano sigue siendo necesario.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 5 diseñaste encuesta con filtro de IA. Hoy aprendes a \emph{analizar los resultados} con IA pero con criterio humano. Las próximas sesiones (informe comercial, correo profesional, mini-proyecto, sustentación) usarán los hallazgos del análisis de hoy.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{prueba simple}: toma 5 respuestas abiertas de tu encuesta y léelas tú mismo a mano. Sin IA todavía. Anota qué temas detectas. Después harás el mismo análisis con IA y compararás resultados.
  a_sistematizacion: |-
    Ya tienes tu lectura humana. Ahora vas a entender la \textbf{anatomía del análisis cualitativo con IA}: cómo pedirle clasificación, cómo verificar, los 5 errores típicos de aceptar IA sin auditoría.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: análisis con IA de 15-20 respuestas, comparación con tu lectura humana, tabla de auditoría con 3 columnas, reflexión sobre límites.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: análisis IA + tabla auditoría + reflexión. El criterio principal: que la conclusión que escribas resista verificación humana paso a paso.
  a_evaluacion: |-
    Antes de cerrar, mira el análisis desde las cinco dimensiones humanas. Verificar la IA respuesta por respuesta es respeto por los encuestados; aceptar la clasificación ciegamente es negligencia profesional.
  a_triangulo: |-
    Y para terminar, tres voces sobre la verificación. Dussel sobre las clasificaciones que invisibilizan voces, Marco Aurelio sobre la disciplina de revisar, Floridi sobre la auditoría humana como ética del análisis con IA.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Lectura humana de 5 respuestas} (15 min · individual). Toma 5 respuestas abiertas de tu encuesta (sesión 5). Léelas con calma a mano (sin IA). Anota: (1) ¿qué tema dominante detectas en cada una? (2) ¿alguna tiene ironía o sarcasmo? (3) ¿alguna usa modismos colombianos que requieren contexto? (4) ¿qué clasificación temática propondrías para las 5? Esa lectura humana será tu referencia para comparar después con la IA.
  checks:
  - Leí 5 respuestas a mano sin IA.
  - Detecté tema, ironía, modismos.
  - Propuse mi propia clasificación.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mi lectura humana». \textbf{Formato:} 5 fichas (1 por respuesta) + clasificación propuesta a mano. \textbf{Sabes que terminaste cuando} tienes referencia humana para comparar con IA.
sistematizacion:
  intro: |-
    Tu lectura humana es la referencia. Ahora necesitas la \textbf{anatomía profesional} del análisis cualitativo con IA y sus límites.
  pilares:
  - |-
    El \textbf{análisis cualitativo con IA} sigue un proceso estándar: (1) \textbf{Preparar las respuestas}: copiar todas las respuestas abiertas en una sola lista numerada, anonimizadas si es necesario. (2) \textbf{Prompt de clasificación}: \emph{``Actúa como analista cualitativo. Aquí están 15 respuestas a la pregunta [X] de una encuesta a estudiantes de grado 10 en Colombia. Analízalas y propone (a) 3-5 categorías temáticas emergentes, (b) asigna cada respuesta a una categoría, (c) identifica patrones, (d) señala respuestas ambiguas que requieren revisión humana''}. (3) \textbf{Aplicar prompt}: en ChatGPT, Gemini o Claude. (4) \textbf{Auditar la clasificación}: comparar respuesta por respuesta tu lectura humana con la propuesta de la IA. (5) \textbf{Corregir}: ajustar categorías o reclasificar respuestas que la IA malinterpretó.
  - |-
    Los \textbf{5 errores típicos del análisis con IA} sin auditoría: (a) \textbf{IA toma sarcasmo como literal}: \emph{``buenísimo el recreo de 5 minutos''} clasificado como satisfacción. (b) \textbf{IA no entiende modismos locales}: \emph{``está chévere''} clasificado neutro cuando es positivo. (c) \textbf{IA inventa patrones que no están}: alucinación de tendencias. (d) \textbf{IA genera categorías muy amplias o muy estrechas}: a veces 2 categorías para 20 respuestas (demasiado amplio), a veces 12 (demasiado fragmentado). (e) \textbf{Aceptar el resumen sin verificar las respuestas individuales}: el resumen puede ser bonito pero no reflejar las respuestas reales.
  - |-
    La \textbf{tabla de auditoría} con 3 columnas se construye así: (a) \textbf{Respuesta} (texto resumido, número de orden). (b) \textbf{Clasificación de la IA}. (c) \textbf{Tu juicio}: \emph{correcto}, \emph{incorrecto}, \emph{ambiguo}. (d) \textbf{Si incorrecto o ambiguo}: tu clasificación corregida + razón breve. Esta auditoría demuestra que la IA fue herramienta, no fuente única.
  - |-
    Algoritmo: (1) preparar 15-20 respuestas anonimizadas. (2) escribir prompt de clasificación. (3) pasar a IA. (4) revisar la clasificación respuesta por respuesta. (5) llenar tabla de auditoría. (6) corregir errores. (7) escribir reflexión sobre límites.
  anatomia:
    titulo: Anatomía del análisis cualitativo con IA
    body: |-
      \textbf{Preparar:} respuestas anonimizadas. \\[1mm] \textbf{Prompt:} rol analista + clasificación pedida. \\[1mm] \textbf{Auditar:} respuesta por respuesta. \\[1mm] \textbf{Corregir:} reclasificar errores. \\[1mm] \textbf{Reflexión:} límites del análisis IA.
  errores_comunes: |-
    (1) IA toma sarcasmo como literal. (2) IA no entiende modismos locales. (3) IA alucina patrones que no están. (4) IA propone categorías muy amplias o estrechas. (5) Aceptar resumen sin verificar respuestas. (6) Sin tabla de auditoría: la IA queda como fuente única. (7) No declarar uso de IA en el informe final.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía análisis con IA». \textbf{Formato:} (a) los 5 pasos del proceso; (b) los 7 errores con marca; (c) plantilla de la tabla de auditoría. \textbf{Sabes que terminaste cuando} podrías auditar análisis ajeno con criterio.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + EXPLICA --- Análisis IA + tabla auditoría + reflexión} (40 min · individual con dispositivo). Hora de aplicar. Análisis con IA de 15-20 respuestas, comparación con tu lectura humana de la Actividad 1, tabla de auditoría completa, reflexión sobre límites.
  pilares:
  - |-
    Tu análisis se construye en 5 pasos: (1) tomar 15-20 respuestas abiertas de tu encuesta (incluir las 5 que ya leíste a mano). (2) escribir prompt de clasificación con rol + contexto + tarea específica. (3) ejecutar en ChatGPT, Gemini o Claude. (4) construir tabla de auditoría comparando lectura humana vs IA respuesta por respuesta. (5) escribir reflexión final.
  - |-
    Sigue el patrón \textbf{``confiar pero verificar''}: la IA es asistente útil pero no autoridad. Cada categoría que propone y cada asignación que hace debe pasar tu auditoría. La phronesis del oficio consiste en \textbf{usar la IA para acelerar el análisis, no para reemplazarlo}.
  - |-
    La reflexión final de 5 líneas responde: (a) ¿cuántas respuestas la IA clasificó correctamente? (b) ¿en qué tipos de respuestas erró más? (c) ¿qué modismos colombianos confundieron a la IA? (d) ¿qué cambiarías de tu prompt para mejorar? (e) ¿cuándo conviene IA y cuándo solo lectura humana?
  - |-
    Algoritmo: (1) preparar respuestas. (2) prompt. (3) IA. (4) tabla auditoría. (5) corregir. (6) reflexión. (7) declarar uso de IA en cualquier informe que use estos hallazgos.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 15-20 respuestas abiertas analizadas. \\[1mm] \checkbox Prompt de clasificación bien estructurado. \\[1mm] \checkbox Clasificación IA generada. \\[1mm] \checkbox Tabla de auditoría completa con 3 columnas. \\[1mm] \checkbox Errores de la IA identificados y corregidos. \\[1mm] \checkbox Reflexión final de 5 líneas. \\[1mm] \checkbox Uso de IA declarado para futuros informes.
  plantilla_guion: |-
    \textbf{Respuestas.} \textit{15-20 anonimizadas.} \\[1mm] \textbf{Prompt.} \textit{Rol + contexto + clasificación pedida.} \\[1mm] \textbf{Clasificación IA.} \textit{Categorías + asignaciones.} \\[1mm] \textbf{Tabla auditoría.} \textit{Respuesta + IA + Juicio + Corrección.} \\[1mm] \textbf{Reflexión.} \textit{Aciertos, errores, modismos, ajustes, cuándo IA y cuándo no.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + EXPLICA).} Título: «Actividad 3 --- Análisis con criterio humano». \textbf{Formato:} (a) prompt usado; (b) tabla auditoría; (c) reflexión. \textbf{Sabes que terminaste cuando} podrías defender cada clasificación final ante el grupo.
  producto_titulo: Análisis IA + tabla de auditoría + reflexión sobre límites
  criterios:
  - 15-20 respuestas analizadas
  - Tabla de auditoría con 3 columnas
  - Errores identificados y corregidos
  - Categorías finales defendibles
  - Reflexión honesta sobre límites
  - Uso de IA declarado
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Las clasificaciones automáticas pueden invisibilizar voces; la auditoría humana las rescata.
    aplicacion: |-
      Cuando la IA clasifica una respuesta sarcástica como literal o un modismo coloquial como neutro, está silenciando lo que el encuestado realmente quiso decir. La filosofía de la liberación pide auditar para \textbf{no permitir que el algoritmo invisibilice voces}. Cada respuesta que la IA malinterpreta es una persona que no fue escuchada bien. La phronesis del oficio consiste en \textbf{rescatar las voces que la IA pierde}.
    pregunta_espejo: |-
      ¿Mi auditoría rescató las voces que la IA malinterpretó, o acepté la clasificación sin verificar?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Revisar respuesta por respuesta es disciplina; aceptar el resumen sin verificar es vanidad.
    aplicacion: |-
      Es tentador aceptar el resumen bonito que produce la IA y pasar al siguiente paso. La sabiduría estoica recomienda lo opuesto: \emph{revisa cada respuesta antes de aceptar el resumen}. Esa disciplina parece lenta pero es la única que produce análisis confiables. La IA es buena ayudante; nunca es autoridad final.
    pregunta_espejo: |-
      ¿Estoy revisando con disciplina cada clasificación, o quiero saltar al resumen porque parece más rápido?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La auditoría humana del análisis con IA es la nueva ética profesional del oficio analítico contemporáneo.
    aplicacion: |-
      En la era de la IA generativa, miles de análisis se publican sin auditoría humana. La ética profesional pide lo opuesto: cuando usas IA para analizar, audita cada paso. Tu tabla de auditoría es ejemplo de esa práctica. Aunque sea proyecto escolar, la disciplina es la misma que rige toda análisis profesional serio con IA.
    pregunta_espejo: |-
      ¿Mi análisis tiene auditoría humana real, o solo pego lo que la IA me dijo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu análisis auditado y la reflexión sobre límites. En la sesión 7 vas a aprender a escribir \textbf{informe comercial para audiencia real}: propuesta concreta dirigida a alguien que pueda decidir. El análisis de hoy es la materia; el informe comercial de mañana es la propuesta basada en datos.
web:
  conceptos_clave:
    - termino: Análisis cualitativo
      definicion: |-
        Proceso de extraer significado de respuestas abiertas (texto, no números). Agrupa por temas y codifica con etiquetas.
      ejemplo: |-
        Lees 20 respuestas sobre la cafetería y descubres 4 temas que se repiten: precios, sabor, fila y horario.
      emoji: "📖"
    - termino: Categorías emergentes
      definicion: |-
        Etiquetas temáticas que surgen al leer las respuestas, no impuestas de antemano. La IA puede proponerlas en segundos.
      ejemplo: |-
        La IA agrupa 18 respuestas en: "precios altos", "filas largas", "menú poco variado", "personal amable".
      emoji: "🏷️"
    - termino: IA propone, humano dispone
      definicion: |-
        Regla profesional. La IA acelera la propuesta inicial; el editor humano audita, valida y corrige cuando hace falta.
      ejemplo: |-
        La IA dice "categoría: queja", pero al leer la respuesta literal, era ironía. El humano la reclasifica.
      emoji: "🤝"
    - termino: Límites de la IA
      definicion: |-
        Sarcasmo, modismos locales, contexto cultural, respuestas ambiguas. Áreas donde la IA falla y el humano debe intervenir.
      ejemplo: |-
        "Estoy planchao" significa sin dinero en costa, no plancha de ropa. La IA puede no entender el modismo.
      emoji: "🚧"
    - termino: Auditoría humana
      definicion: |-
        Revisión de la clasificación propuesta por la IA, especialmente con respuestas en español coloquial colombiano.
      ejemplo: |-
        Pasas las 20 respuestas con la clasificación de la IA y marcas las que reclasificaste a mano y por qué.
      emoji: "🔍"
  quiz:
    titulo: ¿Auditas el análisis de la IA?
    instrucciones: 5 preguntas para verificar que combinas velocidad y rigor.
    preguntas:
      - enunciado: ¿En qué es BUENA la IA para análisis cualitativo?
        opciones:
          - Detectar sarcasmo
          - Detectar patrones obvios y agrupar respuestas similares
          - Entender modismos locales
          - Captar contexto cultural específico
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Detectar patrones obvios y agrupar similares es donde la IA acelera el proceso.
        feedback_incorrecto: |-
          Es buena detectando patrones obvios y agrupando similares. En sarcasmo y modismos, falla.
      - enunciado: La regla "la IA propone, el humano dispone" significa que...
        opciones:
          - La IA decide todo
          - El humano audita, valida y corrige la propuesta inicial de la IA
          - El humano hace todo
          - No hay diferencia
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La IA acelera; el humano sostiene rigor con auditoría.
        feedback_incorrecto: |-
          El humano audita la propuesta de la IA. Acelera pero no decide finalmente.
      - enunciado: ¿Qué pasa si la IA clasifica un sarcasmo como respuesta literal?
        opciones:
          - No importa
          - El análisis pierde precisión; el humano debe corregir
          - Mejora el análisis
          - Es más rápido
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El sarcasmo escapa a la IA. Sin auditoría humana, el análisis introduce error.
        feedback_incorrecto: |-
          El análisis pierde precisión. Por eso la auditoría humana es irrenunciable.
      - enunciado: ¿Cuál es UN área donde la IA falla?
        opciones:
          - Modismos locales colombianos
          - Patrones obvios
          - Resúmenes
          - Agrupación simple
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Modismos como "planchao" o "embalado" pueden confundir a la IA.
        feedback_incorrecto: |-
          Falla con modismos locales. "Estoy embalado" en Cartago significa muy ocupado, no en una caja.
      - enunciado: ¿Cuál es producto de la auditoría humana del análisis?
        opciones:
          - Una lista sin cambios
          - Tabla con respuestas reclasificadas y razón del cambio
          - Borrar el análisis
          - Repetir la encuesta
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La auditoría documenta qué reclasificaste y por qué. Eso es rigor profesional.
        feedback_incorrecto: |-
          Producto: tabla con cambios y razones. Documentar la auditoría es parte del oficio.

clave: 2-7
grado: 10
periodo: 2
sesion: 7
completo: true
titulo: Informe comercial --- para audiencia real
titulo_portada: |-
  Informe comercial ---
  propuesta concreta
  para audiencia real
producto_final: |-
  Informe comercial completo dirigido a una audiencia real concreta (consejo estudiantil, rector, coordinación académica, organización del barrio, microempresario de la familia) sobre propuesta de mejora o iniciativa real con (a) resumen ejecutivo de 1 página, (b) cuerpo argumentativo de 2-3 páginas con datos del análisis (sesión 6), (c) recomendaciones accionables con responsables sugeridos, (d) presupuesto estimado si aplica + identificación clara del destinatario y plan de entrega
apertura:
  saber_ancestral: |-
    En las décadas del 60, 70 y 80 del siglo XX, cuando los bancos del centro de Cartago todavía atendían a los pequeños comerciantes del barrio, había una práctica que cualquier microempresario experimentado conocía: \textbf{cuando el tendero iba al banco a pedir un préstamo, no llegaba con palabras}. Llegaba con \textbf{un papel}. En ese papel venían: (a) las cuentas claras de la tienda los últimos 6 meses (ingresos y egresos por semana), (b) la propuesta concreta de qué iba a hacer con la plata pedida (comprar nevera, ampliar la tienda, traer mercancía nueva), (c) la cantidad exacta pedida en pesos, (d) cómo y en cuánto tiempo iba a pagar el préstamo. El gerente del banco recibía el papel, lo leía en 5 minutos, y decidía. Si el papel estaba bien hecho, el préstamo se aprobaba. Si era confuso o incompleto, el tendero volvía a su casa sin la plata. La sabiduría es ancestral y precisa: \textbf{frente a un tomador de decisiones, lo escrito vale más que lo hablado}. Ese papel que el tendero llevaba al banco era \textbf{informe comercial avant la lettre}: propuesta concreta dirigida a audiencia real con poder de decidir.
  saber_contemporaneo: |-
    Un \textbf{informe comercial} es texto profesional escrito para \textbf{persuadir a una audiencia específica con poder de decidir}. Se diferencia del informe técnico (sesión 2) en que su propósito principal es \emph{lograr que algo pase}: que aprueben un proyecto, que financien una iniciativa, que cambien una norma, que contraten un servicio. Sus 4 componentes obligatorios son: (1) \textbf{Resumen ejecutivo} (1 página): qué propones, a quién se dirige, qué se necesita decidir, qué beneficios trae. La regla profesional: el lector que solo lee el resumen ejecutivo debe poder decidir. (2) \textbf{Cuerpo argumentativo} (2-3 páginas): contexto, datos que sustentan, comparaciones, argumentos para superar objeciones probables. (3) \textbf{Recomendaciones accionables}: qué se propone hacer, quién es responsable, en qué plazo, con qué recursos. (4) \textbf{Presupuesto estimado} (si aplica): cuánto cuesta, de dónde sale el dinero, qué se obtiene. La regla profesional: \textbf{informe comercial sin pedido claro es informe perdido}. Debe terminar con \emph{``por lo tanto, solicito decisión sobre X''}.
  pregunta_puente: |-
    ¿Qué sabía el tendero al llevar el papel con cuentas claras al banco, que el novato olvida cuando hace propuesta verbal sin documento? ¿Y por qué el resumen ejecutivo de 1 página es la pieza más importante del informe comercial?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} qué audiencia real con poder de decidir podría recibir tu informe comercial; (2) \textbf{aplicar} la estructura de 4 componentes a una propuesta concreta del colegio o barrio; (3) \textbf{crear} el informe comercial completo de 3-4 páginas con resumen ejecutivo + cuerpo + recomendaciones + presupuesto si aplica; (4) \textbf{evaluar} si tu informe lograría decisión positiva si llegara a la audiencia real.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 2 aprendiste informe técnico (informar); en la 6, análisis con IA. Hoy aprendes informe comercial (persuadir para decidir). Las próximas sesiones (correo profesional, mini-proyecto, sustentación) integrarán todo en propuestas reales.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lluvia de propuestas}: anota 5 propuestas reales que harías a alguien con poder de decidir (consejo estudiantil, rector, JAC, microempresario familiar, alcaldía local). Cada una con su destinatario claro.
  a_sistematizacion: |-
    Ya tienes 5 candidatos. Ahora vas a entender la \textbf{anatomía profesional del informe comercial}: 4 componentes, los 5 errores típicos que evitan la decisión, la diferencia con informe técnico.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: eliges 1 propuesta de los 5, identificas destinatario real, escribes los 4 componentes, preparas plan de entrega.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: informe comercial completo + plan de entrega. El criterio principal: que el destinatario, recibiendo tu informe, pueda decidir en favor o en contra con base en lo que lee.
  a_evaluacion: |-
    Antes de cerrar, mira el informe comercial desde las cinco dimensiones humanas. Persuadir con datos es respeto por el tomador de decisiones; pedir sin sustento es pérdida de tiempo de todos.
  a_triangulo: |-
    Y para terminar, tres voces sobre la palabra que decide. Dussel sobre los informes que dan voz a propuestas necesarias, Marco Aurelio sobre la claridad como virtud comercial, Floridi sobre la propuesta documentada como ética profesional.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Lluvia de 5 propuestas a audiencia real} (15 min · individual). Anota 5 propuestas concretas que harías a alguien con poder de decidir en tu entorno cercano. Cada una con destinatario nombrado. Ejemplos: (1) Al consejo estudiantil: propuesta de mejora del recreo. (2) A la coordinación académica: propuesta de revisión del horario. (3) A la JAC del barrio: propuesta de campaña ambiental. (4) Al microempresario familiar (tendero, vendedor): propuesta de digitalización con IA. (5) A la coordinación de informática: propuesta de mejora del laboratorio. Para cada una, anota qué decidiría el destinatario si aprobara.
  checks:
  - Anoté 5 propuestas reales con destinatario nombrado.
  - Cada propuesta tiene decisión clara que se solicitaría.
  - Reconozco que las 5 podrían ser informe comercial.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 5 propuestas reales». \textbf{Formato:} lista de 5 con destinatario + decisión solicitada. \textbf{Sabes que terminaste cuando} eliges 1 con destinatario contactable.
sistematizacion:
  intro: |-
    Tus 5 propuestas tienen potencial. Ahora necesitas la \textbf{anatomía profesional} del informe comercial.
  pilares:
  - |-
    Los \textbf{4 componentes obligatorios} se descomponen así: (1) \textbf{Resumen ejecutivo} (1 página): qué se propone (1-2 frases), para quién (destinatario nombrado), qué se necesita decidir (verbo de acción), beneficios principales (3-4 puntos), costos aproximados si aplica. Es la pieza más leída. (2) \textbf{Cuerpo argumentativo} (2-3 páginas): contexto del problema, datos que sustentan la necesidad, análisis (puede usar los hallazgos de la sesión 6), comparación con alternativas, argumentos para superar objeciones probables del destinatario. (3) \textbf{Recomendaciones accionables}: qué se propone hacer en pasos concretos, quién es responsable de cada paso, en qué plazo. (4) \textbf{Presupuesto estimado}: cuánto cuesta, de dónde sale el dinero, qué se obtiene a cambio (retorno cuantificable cuando sea posible).
  - |-
    La \textbf{diferencia con informe técnico} es crucial: el informe técnico informa para que alguien sepa; el comercial persuade para que alguien decida. Tono más cálido pero profesional. Beneficios destacados. Estructura orientada al cierre. La phronesis del oficio comercial consiste en \textbf{no esconder el pedido en el último párrafo}: el resumen ejecutivo ya debe decirlo.
  - |-
    Los \textbf{5 errores típicos} del informe comercial novato: (a) \textbf{Resumen ejecutivo vago}: \emph{``este es un informe sobre el recreo''} no es propuesta. (b) \textbf{Sin destinatario claro}: el informe es \emph{a quien corresponda} en lugar de \emph{a Carlos Pérez, coordinador}. (c) \textbf{Argumentos sin datos}: opiniones disfrazadas de propuesta. (d) \textbf{Recomendaciones sin responsables}: \emph{``alguien debería hacer X''}. (e) \textbf{Sin presupuesto cuando se necesita}: pedir cambios estructurales sin estimar costos.
  - |-
    Algoritmo: (1) elegir 1 propuesta de los 5 candidatos. (2) identificar destinatario real con nombre y cargo. (3) escribir resumen ejecutivo (1 página) que ya diga el pedido. (4) escribir cuerpo argumentativo con datos. (5) escribir recomendaciones con responsables y plazos. (6) calcular presupuesto si aplica. (7) preparar plan de entrega (cómo hacer llegar el informe).
  anatomia:
    titulo: Anatomía del informe comercial
    body: |-
      \textbf{Resumen ejecutivo:} 1 página con pedido claro. \\[1mm] \textbf{Cuerpo argumentativo:} 2-3 páginas con datos. \\[1mm] \textbf{Recomendaciones:} pasos + responsables + plazos. \\[1mm] \textbf{Presupuesto:} costos + financiamiento + retorno. \\[1mm] \textbf{Plan de entrega:} cómo llegar al destinatario.
  errores_comunes: |-
    (1) Resumen ejecutivo vago sin pedido claro. (2) Sin destinatario nombrado. (3) Argumentos sin datos sustentables. (4) Recomendaciones sin responsables. (5) Sin presupuesto cuando se necesita. (6) Tono frío como informe técnico. (7) Pedido escondido al final.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía informe comercial». \textbf{Formato:} (a) los 4 componentes; (b) diferencia con informe técnico; (c) los 7 errores con marca. \textbf{Sabes que terminaste cuando} podrías auditar un informe comercial real.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Informe comercial completo + plan de entrega} (40 min · individual). Hora de aplicar. Eliges propuesta, identificas destinatario, escribes los 4 componentes, preparas plan de entrega.
  pilares:
  - |-
    Tu informe comercial se construye en 7 pasos: (1) elegir 1 propuesta entre los 5 candidatos. (2) identificar destinatario real con nombre, cargo, contexto. (3) escribir resumen ejecutivo de 1 página que ya contenga el pedido. (4) escribir cuerpo argumentativo de 2-3 páginas con datos (puedes usar los hallazgos de la encuesta de sesión 5 y análisis de sesión 6). (5) escribir recomendaciones con responsables y plazos. (6) calcular presupuesto si aplica. (7) preparar plan de entrega (correo, reunión, carta presentada en persona).
  - |-
    Sigue el patrón \textbf{``pedido en la primera página''}: el resumen ejecutivo no es introducción ni teaser; es el documento completo en miniatura. Quien lee solo el resumen ejecutivo debe poder decidir. La phronesis del informe comercial consiste en \textbf{no esconder el pedido}.
  - |-
    El plan de entrega es pieza pequeña pero crucial: ¿cómo va a llegar tu informe al destinatario? Opciones: (a) entregar impreso en persona después de pedir cita. (b) enviar por correo electrónico con mensaje breve. (c) presentar en reunión con copia para llevar. (d) compartir vía la coordinación. Cada opción tiene protocolo distinto. La phronesis profesional incluye \textbf{pensar la entrega tan cuidadosamente como el contenido}.
  - |-
    Algoritmo: (1) propuesta. (2) destinatario. (3) resumen ejecutivo. (4) cuerpo argumentativo. (5) recomendaciones. (6) presupuesto. (7) plan de entrega. (8) revisión final: ¿el destinatario podría decidir con base en este documento?
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Propuesta elegida y destinatario nombrado. \\[1mm] \checkbox Resumen ejecutivo de 1 página con pedido claro. \\[1mm] \checkbox Cuerpo argumentativo con datos. \\[1mm] \checkbox Recomendaciones con responsables y plazos. \\[1mm] \checkbox Presupuesto si aplica. \\[1mm] \checkbox Tono cálido pero profesional. \\[1mm] \checkbox Plan de entrega preparado.
  plantilla_guion: |-
    \textbf{Destinatario.} \textit{Nombre + cargo + contexto.} \\[1mm] \textbf{Resumen ejecutivo (1 pp).} \textit{Propuesta + pedido + beneficios + costos.} \\[1mm] \textbf{Cuerpo (2-3 pp).} \textit{Contexto + datos + argumentos.} \\[1mm] \textbf{Recomendaciones.} \textit{Pasos + responsables + plazos.} \\[1mm] \textbf{Presupuesto.} \textit{Costos + financiamiento + retorno.} \\[1mm] \textbf{Plan de entrega.} \textit{Cómo llegará al destinatario.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Informe comercial». \textbf{Formato:} (a) referencia al documento; (b) plan de entrega; (c) autoevaluación de si lograría decisión. \textbf{Sabes que terminaste cuando} podrías entregar el informe al destinatario esta semana.
  producto_titulo: Informe comercial completo + plan de entrega a destinatario real
  criterios:
  - Destinatario nombrado con cargo
  - Resumen ejecutivo de 1 página con pedido
  - Cuerpo argumentativo con datos
  - Recomendaciones con responsables
  - Presupuesto si aplica
  - Plan de entrega preparado
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Una propuesta documentada que sostiene voces necesarias es ya acto político; sin documento, la voz queda en queja.
    aplicacion: |-
      Cuando documentas una propuesta y la entregas al tomador de decisiones, estás transformando inconformidad en acción posible. La filosofía de la liberación pide ese paso: \textbf{convertir la queja en propuesta argumentada}. Sin documento, la voz se pierde en pasillos; con documento, queda registro que la institución debe responder.
    pregunta_espejo: |-
      ¿Mi informe transforma una necesidad real en propuesta argumentada, o solo es ejercicio escolar?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La claridad del pedido es virtud comercial; esconder lo que se quiere es debilidad disfrazada de cortesía.
    aplicacion: |-
      Es tentador dar muchas vueltas antes del pedido (\emph{``esperamos que esta humilde propuesta pueda ser considerada en su valiosa agenda...''}). La sabiduría estoica recomienda lo opuesto: \emph{dí lo que pides con claridad en el primer párrafo}. La cortesía está en el tono general, no en esconder el pedido. La phronesis comercial consiste en \textbf{respetar el tiempo del lector siendo claro}.
    pregunta_espejo: |-
      ¿Mi resumen ejecutivo dice claramente lo que pido, o lo escondo por timidez?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La propuesta bien documentada con datos verificables es ética profesional en la era de la sobreabundancia de opinión.
    aplicacion: |-
      En la era de las redes sociales, hay muchas opiniones pero pocas propuestas documentadas. La ética profesional pide lo contrario: cuando propones algo, súbelo con datos, responsables, plazos. Tu informe comercial de hoy te entrena en una práctica que rige toda profesión que produzca propuestas reales: \textbf{argumentar con rigor, no solo con sentimiento}.
    pregunta_espejo: |-
      ¿Mi propuesta tiene rigor profesional, o es opinión disfrazada de informe?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu informe comercial completo y plan de entrega. En la sesión 8 vas a aprender a escribir \textbf{correos profesionales con IA como asistente}: el complemento natural del informe comercial cuando se envía por correo electrónico. El informe de hoy es el documento; el correo de mañana es la primera impresión.
web:
  conceptos_clave:
    - termino: Informe comercial
      definicion: |-
        Texto profesional para persuadir a una audiencia con poder de decidir. Busca que algo pase (aprobar, financiar, contratar).
      ejemplo: |-
        Propuesta a rectoría para instalar bebederos en los pisos 1 y 2 con cronograma y presupuesto.
      emoji: "💼"
    - termino: Resumen ejecutivo
      definicion: |-
        1 página al inicio. Qué propones, a quién va, qué se necesita decidir, qué beneficios trae. El lector apurado decide aquí.
      ejemplo: |-
        Cabeza del documento que en 1 página dice todo lo importante. Si no leyera nada más, ya entendió.
      emoji: "📄"
    - termino: Cuerpo argumentativo
      definicion: |-
        2-3 páginas con contexto, datos, comparaciones y argumentos para superar objeciones probables.
      ejemplo: |-
        Aquí muestras los datos, comparas con otros colegios, anticipas las preguntas duras y respondes con evidencia.
      emoji: "📚"
    - termino: Recomendaciones accionables
      definicion: |-
        Qué se propone hacer, quién responde, en qué plazo, con qué recursos. Sin esa concreción, el informe pierde fuerza.
      ejemplo: |-
        "Se propone que coordinación instale 2 bebederos antes del 30 de junio con presupuesto de $X."
      emoji: "🎯"
    - termino: Pedido claro
      definicion: |-
        Regla clave del informe comercial. Debe terminar con frase del tipo "Por lo tanto, solicito decisión sobre X".
      ejemplo: |-
        "Solicito autorización del comité para iniciar la instalación de bebederos en agosto." Sin esa frase, falta el cierre.
      emoji: "🤝"
  quiz:
    titulo: ¿Escribes informes comerciales que se aprueban?
    instrucciones: 5 preguntas para verificar la estructura de propuesta profesional.
    preguntas:
      - enunciado: ¿Qué pieza del informe comercial debe poder leerse de manera independiente?
        opciones:
          - El índice
          - El resumen ejecutivo
          - La bibliografía
          - El pie de página
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El resumen ejecutivo es autosuficiente. Si solo se lee él, ya hay base para decidir.
        feedback_incorrecto: |-
          El resumen ejecutivo. Pieza de 1 página que el lector apurado puede leer y decidir.
      - enunciado: ¿Cómo debe terminar un informe comercial?
        opciones:
          - Con un poema
          - Con varios anexos
          - Con un pedido claro: "Solicito decisión sobre X"
          - Sin terminar
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Termina con pedido claro. Sin ese cierre, el informe queda sin propósito.
        feedback_incorrecto: |-
          Termina con pedido claro. "Informe comercial sin pedido es informe perdido."
      - enunciado: ¿Para qué sirve el cuerpo argumentativo?
        opciones:
          - Para rellenar páginas
          - Para hacerlo más largo
          - Para decorar
          - Para sostener la propuesta con datos y anticipar objeciones
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Sostiene la propuesta con evidencia y desarma objeciones probables antes de que aparezcan.
        feedback_incorrecto: |-
          Sostiene con datos y anticipa objeciones. Sin esos argumentos, la propuesta no convence.
      - enunciado: Una recomendación accionable debe especificar...
        opciones:
          - Qué, quién, plazo y recursos
          - Solo el qué
          - Solo el plazo
          - Solo el costo
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Qué se hace, quién lo hace, en qué plazo y con qué recursos. Las 4 piezas.
        feedback_incorrecto: |-
          Qué, quién, plazo y recursos. Faltar a una vuelve la recomendación vaga e inejecutable.
      - enunciado: ¿Cuántas páginas tiene típicamente el cuerpo argumentativo?
        opciones:
          - "2-3"
          - "0"
          - "100"
          - "1000"
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. 2-3 páginas. Suficientes para sostener; pocas para no perder al lector.
        feedback_incorrecto: |-
          Son 2-3 páginas. Suficientes para sostener la propuesta sin abrumar al lector decisor.

clave: 2-8
grado: 10
periodo: 2
sesion: 8
completo: true
titulo: Correo profesional con IA --- asistente, no reemplazo
titulo_portada: |-
  Correo profesional ---
  con IA como asistente,
  no como reemplazo
producto_final: |-
  3 correos profesionales escritos en colaboración con IA (uno solicitando información a una institución o persona, uno respondiendo a un cliente o usuario, uno declinando una propuesta con respeto) + bitácora detallada con 4 columnas por cada correo (a) el prompt usado, (b) la versión generada por la IA, (c) la versión final tras tu edición humana, (d) por qué cambiaste lo que cambiaste + ficha de 5 elementos del correo profesional ideal para uso futuro
apertura:
  saber_ancestral: |-
    En los pueblos del Valle del Cauca y del Quindío cafetero, antes del correo electrónico, hubo un oficio crucial para la comunicación a distancia: \textbf{el telegrafista del pueblo}. Sentado en la estación frente al aparato Morse, el telegrafista enviaba mensajes a través del país. Su negocio tenía regla simple: \textbf{cobraba por palabra}. Cada palabra costaba pesos al cliente. Por eso, el oficio del telegrafista entrenaba al cliente en algo que muchos modernos olvidan: \textbf{decir lo justo}. Si una señora quería avisar a su hija en Bogotá que iba en bus, no enviaba: \emph{``Querida hija, te escribo para informarte que el día de mañana saldré en el autobús de las 6...''}. Enviaba: \emph{``Salgo bus seis mañana. Llego cinco tarde. Mamá''}. \textbf{Siete palabras}. Toda la información necesaria. Cero desperdicio. La sabiduría del telegrafista era precisa: \textbf{máximo respeto al lector, mínimo desperdicio de palabras}. El correo electrónico profesional hereda esa disciplina: la pantalla del lector es la billetera del telegrafista. Cada palabra extra cuesta atención. La IA ayuda a redactar pero \textbf{tú decides el tono}.
  saber_contemporaneo: |-
    El \textbf{correo profesional electrónico} es el formato de comunicación escrita más usado del mundo laboral. Sus 5 elementos obligatorios son: (1) \textbf{Asunto claro}: en 5-7 palabras, qué espera el destinatario al abrir. \emph{``Propuesta de mejora del recreo''} mejor que \emph{``Hola''}. (2) \textbf{Saludo apropiado}: \emph{``Estimado/a [nombre]''} para formal, \emph{``Hola [nombre]''} para semi-formal. Evita \emph{``A quien corresponda''} salvo cuando no se conoce destinatario. (3) \textbf{Cuerpo conciso}: 3-5 párrafos cortos. Primer párrafo: motivo del correo. Párrafos del medio: detalles. Último párrafo: pedido o acción esperada. (4) \textbf{Cierre cordial}: \emph{``Cordialmente''}, \emph{``Quedo atento/a''}, \emph{``Gracias por su atención''}. (5) \textbf{Firma con datos}: nombre completo, cargo o rol (estudiante grado 10°), institución (IE Sor María Juliana), contacto si aplica. La regla profesional: \textbf{si el correo pasa de 200 palabras, conviene revisar si todo el contenido es necesario}. La IA puede ayudar a redactar el borrador inicial, pero el editor humano decide tono, pedido y matices culturales.
  pregunta_puente: |-
    ¿Qué sabía la señora del barrio al enviar telegrama de 7 palabras con toda la información necesaria, que el novato olvida cuando manda correo de 500 palabras sin pedido claro? ¿Y por qué la IA puede generar correos correctos pero culturalmente fríos para audiencias colombianas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 5 elementos obligatorios del correo profesional y qué tono usar según la situación; (2) \textbf{aplicar} la IA como asistente para redactar borradores iniciales sin renunciar al tono propio; (3) \textbf{analizar} las diferencias entre versión IA y versión final con tu voz; (4) \textbf{evaluar} qué tan profesional queda el correo final con criterio cultural colombiano.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 7 escribiste informe comercial. Hoy aprendes a \emph{enviar} ese informe profesionalmente o cualquier otro mensaje del mundo laboral. Las próximas sesiones (mini-proyecto, sustentación) consolidarán todo el periodo.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{experimento simple}: pídele a ChatGPT, Gemini o Bing que te escriba un correo a tu rector solicitando una reunión sobre el horario del recreo. Lee la respuesta. ¿Suena a ti o suena a chatbot genérico?
  a_sistematizacion: |-
    Ya tienes un correo IA. Ahora vas a entender la \textbf{anatomía del correo profesional}: los 5 elementos, los 5 errores típicos (saludo equivocado, asunto vago, sin pedido claro, demasiado largo, firma incompleta) y cómo editar la versión IA para que suene a ti.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: escribes 3 correos profesionales en 3 situaciones distintas (solicitar, responder, declinar), cada uno con borrador IA + versión final tuya + bitácora.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 3 correos + bitácora + ficha de 5 elementos. El criterio principal: que cualquiera de los 3 podría enviarse hoy a un destinatario real.
  a_evaluacion: |-
    Antes de cerrar, mira el correo profesional desde las cinco dimensiones humanas. Escribir con precisión es respeto por el lector ocupado; mandar correos largos sin pedido claro es desperdicio del tiempo ajeno.
  a_triangulo: |-
    Y para terminar, tres voces sobre la palabra justa. Dussel sobre los correos que respetan al destinatario, Séneca sobre la brevedad como virtud, Floridi sobre la comunicación profesional como ética informacional.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Experimento del correo IA puro} (15 min · individual con dispositivo). Abre ChatGPT, Gemini o Bing Copilot. Pídele: \emph{``Escríbeme un correo formal al rector de mi colegio solicitando reunión para discutir el horario del recreo''}. Lee la respuesta completa. Anota: (1) ¿usa fórmulas típicas de chatbot (\emph{``espero que se encuentre bien''}, \emph{``en pleno siglo XXI''})? (2) ¿el asunto es claro y específico? (3) ¿el pedido aparece pronto o se esconde? (4) ¿suena a estudiante colombiano de 16 años o a manual de protocolo?
  checks:
  - Le pedí a la IA que escriba un correo formal.
  - Leí la respuesta completa.
  - Identifiqué qué partes suenan a chatbot y cuáles a persona.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Correo IA puro». \textbf{Formato:} captura del correo IA + 4 observaciones críticas. \textbf{Sabes que terminaste cuando} ves que la IA produce borrador pero no versión final.
sistematizacion:
  intro: |-
    Tu lectura crítica te mostró los límites de la IA. Ahora necesitas la \textbf{anatomía profesional} del correo y cómo trabajar con IA como asistente.
  pilares:
  - |-
    Los \textbf{5 elementos obligatorios} del correo profesional se descomponen así: (1) \textbf{Asunto claro}: máximo 5-7 palabras que digan qué espera el destinatario. \emph{Mal:} \emph{``Hola''}, \emph{``Buenas''}. \emph{Bien:} \emph{``Solicitud reunión: horario recreo''}, \emph{``Propuesta mejora cafetería con anexo''}. (2) \textbf{Saludo}: formal (\emph{``Estimado Sr. Pérez:''} con dos puntos al final), semi-formal (\emph{``Hola Carlos,''}), informal (\emph{``Hola,''}). (3) \textbf{Cuerpo}: 3-5 párrafos cortos. Párrafo 1: identidad y motivo (\emph{``Soy María, estudiante grado 10. Le escribo para X''}). Párrafos 2-3: detalles concisos. Último párrafo: pedido o acción esperada (\emph{``Solicito reunión esta semana''} o \emph{``Quedo atenta a su respuesta''}). (4) \textbf{Cierre}: \emph{``Cordialmente''}, \emph{``Atentamente''}, \emph{``Quedo atento/a''}. (5) \textbf{Firma}: nombre completo + rol + institución + correo de contacto.
  - |-
    Los \textbf{3 tonos básicos} según destinatario: (a) \textbf{Formal}: rector, director, autoridad, persona que no conoces. Tratamiento de \emph{usted}, saludo completo, sin emojis. (b) \textbf{Semi-formal}: docente, coordinador, alguien que conoces poco. Tratamiento de \emph{usted} pero más cálido, saludo con nombre. (c) \textbf{Cordial-informal}: compañero que conoces, profesor cercano. Tratamiento de \emph{tú} si es costumbre, saludo amistoso, ocasional emoji aceptable. La regla profesional: \textbf{ante la duda, usa el tono más formal de los 2 posibles}.
  - |-
    Los \textbf{5 errores típicos} del correo profesional: (a) \textbf{Asunto vago}: \emph{``Una cosita''}, \emph{``Pregunta''}. (b) \textbf{Demasiado largo}: 500 palabras cuando 150 bastaban. (c) \textbf{Sin pedido claro}: cierre con \emph{``espero pueda considerarlo''} sin decir qué se pide. (d) \textbf{Mezcla de registros}: empezar formal y terminar informal. (e) \textbf{Firma incompleta}: solo nombre, sin rol ni institución.
  - |-
    El \textbf{flujo con IA como asistente} sigue 4 pasos: (1) Escribir prompt con las 5 partes (sesión 3: rol, contexto, tarea, formato, restricciones). (2) Recibir borrador de IA. (3) Editar a mano: corregir saludo si es muy formal/informal, ajustar tono colombiano, eliminar clichés chatbot, agregar pedido claro si falta, firmar con tus datos. (4) Releer en voz alta antes de enviar. La phronesis del oficio consiste en \textbf{usar IA para velocidad, conservar voz humana para profesionalismo}.
  anatomia:
    titulo: Anatomía del correo profesional
    body: |-
      \textbf{Asunto:} 5-7 palabras específicas. \\[1mm] \textbf{Saludo:} formal / semi-formal / cordial. \\[1mm] \textbf{Cuerpo:} 3-5 párrafos cortos + pedido claro. \\[1mm] \textbf{Cierre:} cordialmente / atentamente. \\[1mm] \textbf{Firma:} nombre + rol + institución + contacto.
  errores_comunes: |-
    (1) Asunto vago. (2) Correo demasiado largo. (3) Sin pedido claro. (4) Mezcla de registros formal/informal. (5) Firma incompleta. (6) Aceptar borrador de IA sin editar. (7) Mantener clichés de chatbot (\emph{``espero que se encuentre bien''} usado mecánicamente).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía correo profesional». \textbf{Formato:} (a) 5 elementos con ejemplo; (b) 3 tonos según destinatario; (c) 7 errores con marca. \textbf{Sabes que terminaste cuando} puedes redactar correo profesional sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- 3 correos + bitácora + ficha} (40 min · individual con dispositivo). Hora de aplicar. Escribes 3 correos en 3 situaciones distintas con flujo IA-asistente, bitácora documentando cambios, ficha de 5 elementos para uso futuro.
  pilares:
  - |-
    Los 3 correos a escribir representan 3 situaciones profesionales típicas: (1) \textbf{Solicitar información}: a una institución o persona pidiéndole datos, agenda, contacto. Ej. correo a la Cámara de Comercio pidiendo datos para tu estudio de mercado. (2) \textbf{Responder a un cliente o usuario}: contestar una consulta o queja con respeto y solución. Ej. respuesta a un cliente del microemprendimiento familiar. (3) \textbf{Declinar una propuesta con respeto}: rechazar amablemente algo (oferta, invitación, propuesta) sin ofender. Es la situación más difícil. Ej. declinar invitación a participar en un evento que no te conviene.
  - |-
    El \textbf{flujo de cada correo} sigue 5 pasos: (1) Escribir prompt completo con las 5 partes. (2) Recibir borrador de IA en ChatGPT/Gemini/Bing/Claude. (3) Copiar borrador IA a tu cuaderno. (4) Editar a mano la versión final con tu voz, ajustando tono y pedido. (5) Documentar en bitácora: prompt + versión IA + versión final + razones de cambio.
  - |-
    La bitácora de cada correo tiene 4 columnas: (a) \textbf{Prompt usado}: el texto exacto que le diste a la IA. (b) \textbf{Versión IA}: pegada tal cual la dio. (c) \textbf{Versión final tras tu edición}: tu correo definitivo. (d) \textbf{Razones de cambio}: \emph{``cambié el saludo porque era muy formal''}, \emph{``eliminé el cliché del primer párrafo''}, \emph{``agregué pedido claro al final''}.
  - |-
    Algoritmo: (1) escribir 3 prompts. (2) generar 3 borradores con IA. (3) editar 3 versiones finales. (4) bitácora para cada uno. (5) ficha de 5 elementos del correo profesional ideal para uso futuro.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 3 correos en 3 situaciones distintas. \\[1mm] \checkbox Borradores IA generados con prompt profesional. \\[1mm] \checkbox 3 versiones finales editadas a mano. \\[1mm] \checkbox Bitácora con 4 columnas por cada correo. \\[1mm] \checkbox Ficha de 5 elementos para uso futuro. \\[1mm] \checkbox Cada correo con asunto claro y pedido visible.
  plantilla_guion: |-
    \textbf{Correo 1 (Solicitar).} \textit{Prompt + IA + final + cambios.} \\[1mm] \textbf{Correo 2 (Responder).} \textit{Prompt + IA + final + cambios.} \\[1mm] \textbf{Correo 3 (Declinar).} \textit{Prompt + IA + final + cambios.} \\[1mm] \textbf{Ficha ideal.} \textit{5 elementos para reutilizar.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- 3 correos profesionales». \textbf{Formato:} (a) los 3 correos completos; (b) bitácora por cada uno; (c) ficha de 5 elementos. \textbf{Sabes que terminaste cuando} cualquiera de los 3 correos podrías enviarlo hoy a un destinatario real.
  producto_titulo: 3 correos profesionales + bitácora + ficha de 5 elementos
  criterios:
  - 3 correos en 3 situaciones distintas
  - Asunto claro en cada uno
  - Pedido visible en cada uno
  - Versión final con voz propia (no chatbot)
  - Bitácora con 4 columnas
  - Ficha reutilizable para uso futuro
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El correo que respeta el tiempo del destinatario es liberador; el extenso sin pedido claro es violencia comunicativa disfrazada de cortesía.
    aplicacion: |-
      Quien recibe un correo de 500 palabras sin pedido claro pierde tiempo doblemente: leyendo y descifrando qué se quiere. La filosofía de la liberación pide lo opuesto: \textbf{respetar el tiempo ajeno con claridad}. La phronesis del correo profesional consiste en \textbf{decir lo justo con respeto, ni más ni menos}.
    pregunta_espejo: |-
      ¿Mis correos respetan el tiempo del lector, o lo desperdicio con palabras innecesarias?
  estoico:
    autor: Séneca
    cita: |-
      La brevedad es virtud profesional; la extensión innecesaria es vicio del que escribe para impresionar.
    aplicacion: |-
      Es tentador escribir correos largos creyendo que parecen más profesionales. La sabiduría estoica recomienda lo opuesto: \emph{breve y preciso vale más que largo y elegante}. El telegrafista cobraba por palabra; el correo profesional moderno cobra atención. Cada palabra de más cuesta atención del lector. La phronesis del oficio honra la brevedad útil.
    pregunta_espejo: |-
      ¿Estoy escribiendo con la brevedad necesaria, o agrego palabras para parecer más profesional?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La comunicación profesional con IA bien usada es ética informacional contemporánea; depender de IA sin editar es renunciar al criterio humano.
    aplicacion: |-
      En la era de la IA, muchos correos se envían directamente como salen de ChatGPT. La ética profesional pide lo contrario: usar la IA como asistente para velocidad, conservar tono humano para criterio. Tus 3 correos de hoy te entrenan en esa práctica que rige toda comunicación profesional contemporánea: \textbf{IA como herramienta, humano como autor}.
    pregunta_espejo: |-
      ¿Mis correos suenan a mí con apoyo de IA, o suenan a IA pura sin mi criterio?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus 3 correos profesionales y la bitácora. En la sesión 9 vas a integrar todo el periodo en un \textbf{mini-proyecto: informe técnico con datos reales y IA documentada}. Es la cima del P2 antes de la sustentación de S10.

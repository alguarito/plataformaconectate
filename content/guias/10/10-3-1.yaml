clave: 3-1
grado: 10
periodo: 3
sesion: 1
completo: true
titulo: Ofimática con IA --- el copiloto del oficio digital cotidiano
titulo_portada: |-
  Ofimática con IA ---
  el copiloto
  del oficio cotidiano
producto_final: |-
  Lista personalizada de 10 tareas reales de ofimática que haces o harás en tu vida próxima (con la familia, en el colegio, en un primer trabajo, en emprendimiento personal) + para cada tarea, propuesta concreta de cómo la IA puede asistir (no reemplazar) + identificación de qué herramientas gratuitas usarías para cada caso (Google Sheets, Excel Online gratis, LibreOffice, Notion, ChatGPT, Gemini, Bing Copilot integrado en Microsoft 365) + reflexión personal de 5 líneas sobre cuáles 3 herramientas vas a priorizar este periodo
apertura:
  saber_ancestral: |-
    En las tiendas y microempresas del centro de Cartago, en las panaderías del barrio Obrero, en las modistas del Quindío y en las pequeñas oficinas de contabilidad de los pueblos cafeteros, hubo durante décadas una práctica que cualquier comerciante experimentado conocía: \textbf{la ofimática del oficio antes del computador}. Aunque no se llamaba así, los tenderos, sastres y contadores manejaban \textbf{herramientas de oficina} con disciplina: (1) \textbf{El cuaderno cuadriculado}: la hoja de cálculo ancestral. Filas para días, columnas para conceptos (\emph{venta-mañana, venta-tarde, gastos, saldo}). (2) \textbf{La calculadora de mano}: el procesador de cálculo. Sumar, restar, sacar porcentaje. (3) \textbf{La radio}: el correo en tiempo real. Conocer precios de mercado, noticias del sector. (4) \textbf{El cuaderno de direcciones}: la base de datos de clientes. Cada uno con teléfono, deuda, fecha de últimas compras. Esas 4 piezas (cuaderno + calculadora + radio + agenda) eran la \textbf{ofimática del oficio del barrio}. Quien las usaba con disciplina llevaba el negocio bien; quien improvisaba, se perdía. La sabiduría era ancestral: \textbf{ningún negocio sostenible se llevaba solo con la memoria}. La IA hoy agrega un \emph{copiloto}: el cuaderno digital ya no hace solo cálculos, ahora sugiere, analiza, propone. Pero la decisión sigue siendo del comerciante.
  saber_contemporaneo: |-
    La \textbf{ofimática asistida por IA} es la combinación de herramientas tradicionales de oficina (procesador de texto, hoja de cálculo, presentaciones, formularios) con asistencia de IA generativa para acelerar tareas, no para reemplazar el criterio. En 2026, las herramientas gratuitas disponibles incluyen: (1) \textbf{Google Sheets}: hoja de cálculo gratuita con cuenta Gmail. Tiene función \texttt{=GEMINI()} integrada en 2025+ para preguntar a IA dentro de celdas. (2) \textbf{Excel Online}: versión web gratuita de Microsoft Excel, incluye Copilot básico. (3) \textbf{LibreOffice}: paquete completo gratis descargable (Writer + Calc + Impress + Base). (4) \textbf{Notion}: base de datos y notas con IA integrada en plan gratuito limitado. (5) \textbf{ChatGPT, Gemini, Bing Copilot, Claude.ai}: asistentes generales gratuitos para preguntas, análisis, redacción. La regla profesional: \textbf{cada herramienta tiene su lugar; aprender a combinarlas vale más que dominar una sola}. Google Sheets para cálculos colaborativos, Notion para bases de datos personales, LibreOffice si prefieres trabajar offline. La IA acelera todas: \emph{``hazme una fórmula que calcule X''}, \emph{``analiza esta tabla''}, \emph{``escribe un correo basado en este registro''}.
  pregunta_puente: |-
    ¿Qué sabía el tendero al combinar cuaderno + calculadora + radio + agenda, que el novato olvida cuando intenta llevar microempresa solo con la memoria? ¿Y por qué tener IA como copiloto requiere primero conocer las herramientas que va a copilotar?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 10 tareas reales de ofimática que dominarán tu vida laboral próxima; (2) \textbf{analizar} cuál herramienta gratuita se ajusta mejor a cada tarea; (3) \textbf{evaluar} cómo la IA puede asistir cada tarea sin reemplazar tu criterio; (4) \textbf{explicar} por qué algunas tareas se benefician más de IA que otras y dónde la phronesis humana sigue siendo crucial.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Cerraste el periodo 2 (textos profesionales con IA). Hoy abre el periodo 3: \textbf{ofimática con IA, contabilidad, emprendimiento}. Las próximas 9 sesiones (contabilidad básica, Sheets + IA, flujo de caja, visualización, encuestas de mercado, Canvas, comunicación empresarial, proyecto integrador, sustentación) construyen sobre el panorama de hoy.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lluvia personal}: anota 10 tareas reales de ofimática que crees harás en los próximos 5 años (en tu casa, en el colegio, en un primer trabajo, en un emprendimiento). Sin filtrar por importancia: solo enumera lo que sospechas.
  a_sistematizacion: |-
    Ya tienes 10 candidatas. Ahora vas a entender la \textbf{anatomía de la ofimática con IA}: las 5 herramientas gratuitas principales, cuándo asistir con IA, cuándo solo herramienta tradicional, los 5 errores típicos.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: para cada una de las 10 tareas, propón herramienta gratuita y asistencia de IA. Reflexionas sobre las 3 herramientas que priorizarás este periodo.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: lista de 10 tareas + propuesta IA + 3 herramientas priorizadas + reflexión. El criterio principal: que tengas mapa claro de qué herramientas dominar primero según tu propio futuro.
  a_evaluacion: |-
    Antes de cerrar, mira la ofimática desde las cinco dimensiones humanas. Aprender herramientas gratuitas es libertad económica; depender solo de pagas es entregar capital a quien las controla.
  a_triangulo: |-
    Y para terminar, tres voces sobre el oficio digital. Dussel sobre las herramientas que liberan al microempresario, Séneca sobre la sobriedad de aprender lo necesario, Floridi sobre la IA como copiloto del oficio profesional.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 10 tareas reales de ofimática} (15 min · individual). Anota 10 tareas concretas de ofimática que crees harás en los próximos 5 años. Reglas: (1) tareas reales, no genéricas. (2) cubre 3 ámbitos: tu casa/familia (3-4 tareas), tu colegio o universidad (3-4 tareas), tu primer trabajo o emprendimiento (3-4 tareas). Ejemplos: \emph{llevar la cuenta de gastos familiares mensuales}, \emph{hacer hoja de cálculo del torneo deportivo del colegio}, \emph{registrar clientes del microemprendimiento familiar}, \emph{calcular precios de servicios para vender}, \emph{hacer factura simple para un cliente}, \emph{crear inventario de productos}, \emph{hacer presentación para clase o trabajo}, \emph{escribir hoja de vida}, \emph{enviar correos profesionales con datos adjuntos}, \emph{analizar resultados de encuesta familiar}.
  checks:
  - Listé 10 tareas reales en 3 ámbitos.
  - Cada tarea es específica, no genérica.
  - Reconozco que dominaré varias en mi vida próxima.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 10 tareas reales». \textbf{Formato:} lista numerada de 10 con ámbito (casa, colegio, trabajo). \textbf{Sabes que terminaste cuando} ves que tu vida próxima requiere ofimática.
sistematizacion:
  intro: |-
    Tus 10 tareas son el mapa. Ahora necesitas la \textbf{anatomía de las herramientas gratuitas} y cómo asignar IA a cada caso.
  pilares:
  - |-
    Las \textbf{5 herramientas gratuitas principales} se descomponen así: (1) \textbf{Google Sheets}: hoja de cálculo colaborativa con cuenta Gmail. Mejor para contabilidad personal, control de gastos, análisis simple. La función \texttt{=GEMINI()} permite preguntar a IA dentro de la celda (\emph{``=GEMINI(``analiza la columna B y propone categorías'')''}). (2) \textbf{Excel Online}: gratis con cuenta Microsoft. Incluye Copilot básico que genera fórmulas y analiza datos. (3) \textbf{LibreOffice}: paquete completo descargable, gratis, offline. Writer (texto), Calc (hojas), Impress (presentaciones), Base (bases de datos simples). Sin IA integrada nativa, pero compatible con ChatGPT externo. (4) \textbf{Notion}: notas y bases de datos personales con IA limitada en plan gratuito. Ideal para gestión personal de proyectos. (5) \textbf{Asistentes IA generales}: ChatGPT, Gemini, Bing Copilot, Claude.ai. Útiles para preguntas puntuales sobre fórmulas, análisis, redacción.
  - |-
    El patrón profesional \textbf{IA como copiloto, no como piloto}: la IA es buena para sugerir fórmulas, proponer análisis preliminares, generar primeros borradores. La IA es mala para: tomar decisiones finales sobre presupuesto, decidir qué categorías son significativas para tu negocio, evaluar consecuencias humanas de decisiones. La phronesis del oficio consiste en \textbf{usar IA donde acelera trabajo mecánico, conservar criterio humano donde hay consecuencias}.
  - |-
    Los \textbf{5 errores típicos} de la ofimática con IA: (a) \textbf{Aceptar fórmulas de IA sin verificar}: \texttt{=GEMINI()} puede sugerir fórmulas mal estructuradas. Siempre probar con casos conocidos. (b) \textbf{Pegar datos personales sensibles en IA pública}: nombres, números de cuenta, datos protegidos no van a ChatGPT. (c) \textbf{Depender de Excel/Sheets con suscripción cara}: hay alternativas gratis igual de buenas. (d) \textbf{No aprender las herramientas base}: pretender que la IA sustituye conocer fórmulas básicas. (e) \textbf{Mezclar herramientas sin propósito}: usar Notion + Sheets + Excel + LibreOffice cuando 2 bastan.
  - |-
    Algoritmo: (1) revisar las 10 tareas. (2) para cada una, identificar qué herramienta gratuita conviene. (3) para cada una, evaluar cómo IA puede asistir. (4) priorizar 3 herramientas que dominarás este periodo. (5) escribir reflexión sobre tu mapa personal.
  anatomia:
    titulo: Anatomía de la ofimática con IA
    body: |-
      \textbf{Sheets:} colaborativo + GEMINI integrada. \\[1mm] \textbf{Excel Online:} gratuito + Copilot básico. \\[1mm] \textbf{LibreOffice:} offline + paquete completo. \\[1mm] \textbf{Notion:} notas + bases simples. \\[1mm] \textbf{Asistentes IA:} ChatGPT, Gemini, Bing, Claude.
  errores_comunes: |-
    (1) Aceptar fórmulas IA sin verificar. (2) Pegar datos sensibles en IA pública. (3) Pagar suscripciones innecesarias. (4) No aprender herramientas base. (5) Mezclar herramientas sin propósito. (6) Asumir que IA reemplaza criterio. (7) Ignorar atajos de teclado que aceleran todo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía ofimática IA». \textbf{Formato:} (a) 5 herramientas con uso típico; (b) IA como copiloto, no piloto; (c) 7 errores con marca. \textbf{Sabes que terminaste cuando} puedes asignar herramienta a cualquier tarea.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + EXPLICA --- 10 tareas + propuesta IA + priorización + reflexión} (35 min · individual). Hora de aplicar. Para cada una de las 10 tareas, propón herramienta + asistencia IA. Prioriza 3 herramientas para este periodo. Reflexionas.
  pilares:
  - |-
    Tu mapa se construye en 5 pasos: (1) tomar las 10 tareas de la Actividad 1. (2) para cada una, asignar herramienta gratuita en columna. (3) para cada una, escribir 1-2 líneas sobre cómo IA puede asistir. (4) identificar las 3 herramientas que más necesitas dominar este periodo (las que aparecen en más tareas). (5) reflexión personal de 5 líneas sobre prioridades.
  - |-
    El patrón \textbf{``herramienta antes que asistente''}: aunque la IA es atractiva, primero debes dominar la herramienta base. No tiene sentido pedirle a Gemini que escriba fórmula compleja en Sheets si no conoces qué hace SUMAR.SI o BUSCARV. La phronesis del oficio consiste en \textbf{conocer la herramienta para evaluar lo que la IA propone}.
  - |-
    La reflexión final responde 3 preguntas: (a) ¿cuáles 3 herramientas vas a priorizar este periodo? (b) ¿qué tareas de las 10 ya sabes hacer bien y cuáles vas a aprender? (c) ¿cómo combinarás IA con criterio humano según el tipo de tarea?
  - |-
    Algoritmo: (1) tabla 10 tareas × 3 columnas (Tarea, Herramienta gratuita, Asistencia IA). (2) priorizar 3 herramientas. (3) reflexionar 5 líneas. (4) compartir mapa con compañero (opcional).
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 10 tareas reales en 3 ámbitos. \\[1mm] \checkbox Herramienta gratuita asignada a cada tarea. \\[1mm] \checkbox Propuesta de IA asistente a cada tarea. \\[1mm] \checkbox 3 herramientas priorizadas para el periodo. \\[1mm] \checkbox Reflexión de 5 líneas. \\[1mm] \checkbox Mapa coherente con tu vida próxima.
  plantilla_guion: |-
    \textbf{Tabla 10 tareas.} \textit{Tarea + Herramienta + IA asistente.} \\[1mm] \textbf{3 herramientas priorizadas.} \textit{Las que aparecen más.} \\[1mm] \textbf{Reflexión.} \textit{Qué priorizo y por qué.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + EXPLICA).} Título: «Actividad 3 --- Mi mapa ofimática IA». \textbf{Formato:} tabla 10 tareas + 3 priorizadas + reflexión. \textbf{Sabes que terminaste cuando} sabes con cuáles herramientas vas a trabajar este periodo.
  producto_titulo: Lista 10 tareas + herramienta + IA asistente + 3 priorizadas
  criterios:
  - 10 tareas reales en 3 ámbitos
  - Herramienta gratuita asignada por tarea
  - Propuesta de asistencia IA por tarea
  - 3 herramientas priorizadas
  - Reflexión coherente con vida próxima
  - Distinción IA copiloto vs piloto
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Las herramientas gratuitas liberan al microempresario; las suscripciones caras extraen valor de quien menos puede pagarlas.
    aplicacion: |-
      Muchos jóvenes asumen que Microsoft Office o Adobe son las únicas opciones serias. La filosofía de la liberación pide lo opuesto: \textbf{las herramientas gratuitas existen y son tan buenas como las pagas para la mayoría de tareas reales}. El microempresario del barrio que arranca su negocio no necesita pagar Microsoft 365: con Google Workspace gratis o LibreOffice puede llevar contabilidad, hacer presentaciones, gestionar clientes. La phronesis económica del oficio digital consiste en \textbf{conocer las alternativas gratuitas antes de comprometerse con suscripciones}.
    pregunta_espejo: |-
      ¿Estoy aprendiendo herramientas gratuitas como acto de libertad económica, o asumo que solo lo pago es bueno?
  estoico:
    autor: Séneca
    cita: |-
      Aprende lo necesario con sobriedad; el exceso de herramientas dispersa al que las usa.
    aplicacion: |-
      Es tentador querer dominar todas las herramientas disponibles. La sabiduría estoica recomienda lo opuesto: \emph{prioriza 2-3 que cubran el 80 por ciento de tus tareas}. Aprender mal 10 herramientas vale menos que aprender bien 3. La phronesis del oficio consiste en \textbf{elegir tu stack y dominarlo}.
    pregunta_espejo: |-
      ¿Estoy priorizando 3 herramientas para dominar, o intento aprender todo al mismo tiempo?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La IA como copiloto profesional es la nueva ética del oficio en la era de la automatización.
    aplicacion: |-
      En la era de la IA generativa, los profesionales que usan IA con criterio aceleran su trabajo sin perder calidad. Los que la usan sin criterio producen errores. Los que la rechazan se quedan atrás. La ética profesional del siglo XXI consiste en \textbf{usar IA como copiloto: ella sugiere, tú decides}. Tu mapa de hoy te entrena en esa práctica.
    pregunta_espejo: |-
      ¿Estoy usando la IA como copiloto con criterio, o intentando que sea piloto sin mi intervención?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu mapa de 10 tareas y las 3 herramientas priorizadas. En la sesión 2 vas a aprender \textbf{contabilidad básica}: ingresos, egresos y balance, llevando cuenta personal o familiar real durante 2 semanas. La ofimática de hoy es el panorama; la contabilidad de mañana es la primera implementación práctica.
web:
  conceptos_clave:
    - termino: Ofimática con IA
      definicion: |-
        Combinación de herramientas de oficina (Sheets, Docs, Forms) con IA generativa para acelerar tareas reales del oficio digital.
      ejemplo: |-
        Le pides a Gemini que cree una fórmula que sume gastos por categoría. La fórmula aparece, tú la aplicas y revisas.
      emoji: "🛠️"
    - termino: Google Sheets
      definicion: |-
        Hoja de cálculo gratuita con cuenta Gmail. Tiene =GEMINI() integrado en 2025+ para consultar IA dentro de celdas.
      ejemplo: |-
        Abres una hoja, cargas tus gastos, escribes =SUMA(B2:B30) y luego =GEMINI("propón categorías para estos gastos").
      emoji: "📊"
    - termino: Notion
      definicion: |-
        Base de datos y notas con IA integrada (plan gratuito limitado). Útil para organizar bases personales o de proyectos.
      ejemplo: |-
        Creas tabla con tus clientes potenciales, columnas para nombre, contacto, estado y notas. IA sugiere etiquetas.
      emoji: "📚"
    - termino: LibreOffice
      definicion: |-
        Paquete gratuito descargable: Writer, Calc, Impress, Base. Funciona offline, sin dependencia de cuenta.
      ejemplo: |-
        Lo usas si la conexión es inestable o si prefieres no subir información sensible a la nube.
      emoji: "💻"
    - termino: Copiloto IA
      definicion: |-
        Asistentes generales gratuitos (ChatGPT, Gemini, Bing, Claude) que ayudan a redactar, analizar y proponer.
      ejemplo: |-
        Le pides a la IA "redacta un correo basado en este registro" y obtienes borrador para editar.
      emoji: "🤖"
  quiz:
    titulo: ¿Combinas herramientas de ofimática con IA?
    instrucciones: 5 preguntas para verificar que conoces el panorama 2026.
    preguntas:
      - enunciado: "¿Qué función nueva tiene Google Sheets desde 2025?"
        opciones:
          - "=GEMINI()"
          - "=SUMA()"
          - "=PRINT()"
          - "=GUARDAR()"
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. =GEMINI() permite consultar IA directamente desde una celda.
        feedback_incorrecto: |-
          Es =GEMINI(). Integra IA generativa dentro de Sheets para análisis y propuestas.
      - enunciado: ¿Cuál herramienta es ideal para trabajar offline sin nube?
        opciones:
          - Solo Google Sheets
          - WhatsApp
          - LibreOffice descargable
          - Solo apps de pago
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. LibreOffice funciona offline y no requiere cuenta de nube.
        feedback_incorrecto: |-
          LibreOffice. Paquete gratuito descargable que funciona offline.
      - enunciado: La regla "cada herramienta tiene su lugar" significa que...
        opciones:
          - Hay que usar la más cara
          - Aprender a combinarlas vale más que dominar una sola
          - Solo se usa Word
          - Las herramientas son iguales
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Combinarlas según la tarea da más oficio que dominar una sola.
        feedback_incorrecto: |-
          Combinarlas vale más. Sheets para cálculos, Notion para bases, LibreOffice offline.
      - enunciado: ¿Cuál es el rol correcto de la IA en ofimática?
        opciones:
          - Reemplazar al usuario
          - Ser piloto sin supervisión
          - No tiene rol
          - Copiloto que acelera; el usuario decide
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. La IA acelera tareas; el usuario decide con criterio.
        feedback_incorrecto: |-
          Es copiloto, no piloto. La IA acelera y propone; el usuario decide y firma.
      - enunciado: ¿Cuál asistente NO es gratuito y general en 2026?
        opciones:
          - ChatGPT
          - Gemini
          - Una IA inventada
          - Bing Copilot
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Los 3 primeros son gratuitos y generales; el cuarto no existe en la sesión.
        feedback_incorrecto: |-
          ChatGPT, Gemini, Bing Copilot y Claude.ai son los 4 asistentes gratuitos mencionados.

clave: 3-10
grado: 10
periodo: 3
sesion: 10
completo: true
titulo: Sustentación final + feria de microempresas escolares
titulo_portada: |-
  Sustentación final ---
  graduación del grado 10
  y feria de microempresas
producto_final: |-
  Sustentación pública de 10 minutos del proyecto integrador frente a la comunidad escolar (compañeros, docentes y padres si es posible) + demo de los 3 productos digitales generados durante el año (libro de 80 páginas del P1, mini-proyecto del P2, micro-emprendimiento del P3) + carta abierta firmada de cierre del grado 10° + participación activa en feria de microempresas con stand del proyecto + autoevaluación final con compromiso para el grado 11°
apertura:
  saber_ancestral: |-
    En los talleres antiguos del oficio, en las comunidades indígenas del Pacífico, en los gremios tradicionales europeos heredados al continente, hubo durante siglos un acto ritual que marcaba la transición del aprendiz al oficial: \textbf{la graduación frente a los mayores del oficio}. El aprendiz que había trabajado durante todo un periodo presentaba sus piezas maestras: las que demostraban que el oficio había sido aprendido. Esa presentación ocurría en público, en un día señalado, ante \textbf{el maestro, los oficiales viejos y los otros aprendices del taller}. El aprendiz exponía sus piezas, contaba cómo las hizo, declaraba dónde aún tenía dudas. Los mayores hacían preguntas técnicas y a veces incómodas. Si la defensa era sólida, recibía el \textbf{título del oficio}: ya no era aprendiz, era \emph{oficial}. La sabiduría era inquebrantable: \textbf{el oficio se certifica ante quienes lo conocen, no en privado}. Ese ritual ancestral es exactamente lo que la sustentación final del grado 10° + feria de microempresas escolares cierra: la graduación moderna que abre el camino al proyecto emprendedor final del grado 11°.
  saber_contemporaneo: |-
    La \textbf{sustentación final del grado 10° + feria de microempresas escolares} es el acto formal donde el estudiante presenta los 3 productos del año (libro de 80 páginas del P1, mini-proyecto del P2, micro-emprendimiento del P3) ante la comunidad escolar. Tiene 4 propiedades irrenunciables: (1) \textbf{Tiempo controlado}: 10 minutos de sustentación + 5 minutos Q\&A + tiempo en feria. (2) \textbf{Demostración real}: los 3 productos disponibles (PDF, archivos, Canvas impreso). (3) \textbf{Honestidad sobre uso de IA}: declarar abiertamente qué modelos usaste durante el año, qué porcentaje aproximado de los textos generaste con IA. (4) \textbf{Carta abierta firmada}: declaración personal del cierre del grado con compromiso explícito para el grado 11°. La \textbf{feria de microempresas} extiende la sustentación: cada estudiante pone stand con su micro-emprendimiento (incluso si es hipotético), los visitantes (compañeros + docentes + padres) recorren, conversan, intercambian comentarios. La regla profesional: \textbf{el cierre del grado 10° no es ejercicio escolar; es puente serio al proyecto emprendedor del grado 11°}.
  pregunta_puente: |-
    ¿Qué sabía el aprendiz al exponer las piezas maestras ante los mayores del oficio, que el estudiante novato olvida cuando confunde cierre con \emph{``entregar tarea final''}? ¿Y por qué la feria de microempresas es la pieza más importante del cierre, aunque sea informal?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} los 3 productos del año identificando lo más representativo de cada periodo; (2) \textbf{explicar} en sustentación pública el viaje completo del año con honestidad técnica; (3) \textbf{evaluar} con honestidad preguntas duras de la audiencia; (4) \textbf{crear} la carta abierta firmada del cierre del grado con compromiso para el grado 11°.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Has recorrido 29 sesiones del grado 10° en 3 periodos. Hoy es el \textbf{día de la graduación}. Después de hoy, cierras el grado 10° y abres el grado 11° (proyecto emprendedor final del bachillerato técnico).
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{síntesis del año entero}: revisa los 3 productos (libro del P1, mini-proyecto del P2, micro-emprendimiento del P3) e identifica 1 cosa que estás orgulloso de cada uno + 1 cosa que mejorarías. Esa síntesis es la materia prima de la sustentación.
  a_sistematizacion: |-
    Ya tienes síntesis. Ahora vas a entender la \textbf{anatomía profesional} de la sustentación de 10 minutos + Q\&A + feria + carta abierta.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: preparas slides simples, ensayas, sustentas, participas en feria, lees carta abierta firmada, autoevaluación final.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: sustentación ejecutada + feria participada + carta firmada + autoevaluación con compromiso. El criterio principal: que la audiencia se vaya sabiendo qué construiste durante el año y para qué.
  a_evaluacion: |-
    Antes de cerrar, mira la sustentación desde las cinco dimensiones humanas. Cerrar el grado con honestidad y orgullo es respeto por las 29 sesiones; cerrar sin asumir lo que falta es traicionar al estudiante que fuiste durante el año.
  a_triangulo: |-
    Y para terminar, tres voces sobre el cierre del oficio. Dussel sobre el aprendiz que devuelve a la comunidad lo aprendido, Marco Aurelio sobre la honestidad del cierre, Floridi sobre la graduación con declaración de IA como modelo profesional emergente.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Síntesis del año en 3 productos} (15 min · individual). Revisa los 3 productos finales del año: (1) Libro de 80 páginas del P1. (2) Mini-proyecto del P2 (informe técnico con datos reales). (3) Micro-emprendimiento del P3 (proyecto integrador). Para cada uno, anota: (a) 1 cosa que estás orgulloso de haber logrado (lo que más representa tu aprendizaje). (b) 1 cosa que mejorarías si tuvieras más tiempo (lo que aún necesita revisión). Esa síntesis es la base de la sustentación.
  checks:
  - Revisé los 3 productos del año.
  - Anoté 1 orgullo y 1 mejora por cada uno.
  - Tengo síntesis del aprendizaje del año.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Síntesis del año». \textbf{Formato:} 3 fichas (1 por producto) con orgullo + mejora. \textbf{Sabes que terminaste cuando} podrías presentar los 3 con honestidad pública.
sistematizacion:
  intro: |-
    Tu síntesis es la base. Ahora necesitas la \textbf{anatomía profesional} de la sustentación + feria + carta.
  pilares:
  - |-
    La \textbf{estructura de la sustentación de 10 minutos} se descompone así (2 minutos por bloque): (1) \textbf{Introducción del año} (2 min): qué hicimos en el grado 10° (los 3 periodos), qué propósito tuvo. (2) \textbf{Libro del P1} (2 min): tema, proceso, fragmento corto leído en voz alta. (3) \textbf{Mini-proyecto del P2} (2 min): tema, datos clave, decisiones. (4) \textbf{Micro-emprendimiento del P3} (2 min): propuesta de valor, hallazgos del mercado, viabilidad. (5) \textbf{Declaración de uso de IA y carta abierta} (2 min): lectura de la carta firmada con compromiso para el grado 11°. Después: \textbf{Q\&A de 5 minutos} con preguntas de la audiencia + \textbf{feria de microempresas} con stand.
  - |-
    La \textbf{feria de microempresas} es la pieza más activa del cierre. Cada estudiante pone stand con su micro-emprendimiento del P3 (incluso si es hipotético): impresión de portada del libro, copia del Canvas, propuesta comercial. Los visitantes (compañeros + docentes + padres si pueden venir) recorren, conversan, hacen preguntas, dejan comentarios. Es práctica de comunicación profesional en contexto realista. La regla: \textbf{cada autor está 30 min en su stand y 30 min recorriendo otros}.
  - |-
    La \textbf{carta abierta firmada} es la pieza más personal del cierre. Tiene 5 párrafos: (a) \textbf{Apertura}: qué fue para mí este año en el grado 10°. (b) \textbf{Lo que aprendí del P1}: 1 aprendizaje concreto. (c) \textbf{Lo que aprendí del P2}: 1 aprendizaje concreto. (d) \textbf{Lo que aprendí del P3}: 1 aprendizaje concreto. (e) \textbf{Compromiso para el grado 11°}: 1 acción que me llevo. Firmada con nombre completo + fecha + ciudad. Leída en voz alta durante la sustentación.
  - |-
    Algoritmo: (1) preparar 5 slides (1 por bloque). (2) escribir guion hablado de 1500 palabras (= 10 min). (3) ensayar cronometrado. (4) sustentar. (5) responder Q\&A con honestidad. (6) participar en feria como autor y como visitante. (7) leer carta abierta. (8) autoevaluar.
  anatomia:
    titulo: Anatomía del cierre del grado 10
    body: |-
      \textbf{Sustentación 10 min:} intro + 3 productos + carta. \\[1mm] \textbf{Q\&A 5 min:} honestidad ante preguntas. \\[1mm] \textbf{Feria:} stand + recorrido a otros. \\[1mm] \textbf{Carta abierta:} 5 párrafos firmados.
  errores_comunes: |-
    (1) Leer las slides. (2) Ocultar uso de IA. (3) Carta genérica sin compromiso específico. (4) Sin stand preparado para la feria. (5) Visitar solo amigos cercanos en la feria. (6) Pasarse del tiempo. (7) Cierre apurado sin proyección al grado 11°.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía cierre». \textbf{Formato:} (a) estructura 10 min; (b) reglas de la feria; (c) plantilla carta abierta; (d) los 7 errores con marca. \textbf{Sabes que terminaste cuando} tienes plan claro de la sesión.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- Sustentación + feria + carta + autoevaluación} (90 min total · individual + colectivo). Hora de ejecutar. Preparas slides, ensayas, sustentas, participas en feria, lees carta firmada, autoevalúas con compromiso.
  pilares:
  - |-
    Tu cierre se construye en 8 pasos: (1) preparar 5 slides simples. (2) escribir guion hablado de 1500 palabras. (3) ensayar cronometrado. (4) preparar stand para la feria (impresiones, Canvas, productos). (5) sustentar en público con honestidad técnica. (6) responder Q\&A. (7) participar en feria 30 min como autor y 30 min recorriendo. (8) leer carta abierta firmada y autoevaluar con compromiso para el grado 11°.
  - |-
    Sigue el patrón \textbf{``orgullo honesto y mejora declarada''}: el cierre del año no es momento de inflar ni de subestimar. Reconoce con orgullo lo que lograste (\emph{``terminé el libro de 80 páginas''}, \emph{``apliqué encuesta a 18 personas''}) y declara con honestidad lo que aún te falta (\emph{``mi Canvas tiene supuestos sin verificar''}, \emph{``mi correo profesional aún suena formal''}). Ambos lados son virtud.
  - |-
    La \textbf{carta abierta firmada} es tu firma del año. Modelo de párrafo de cierre con compromiso: \emph{``Me llevo del grado 10° la habilidad de trabajar con IA respetando autoría. Me comprometo para el grado 11° a aplicar todo lo aprendido en proyecto emprendedor real con destinatario verificable, no hipotético''}. Específico, no genérico.
  - |-
    Algoritmo: (1) slides. (2) guion. (3) ensayo. (4) stand. (5) sustentación. (6) Q\&A. (7) feria. (8) carta abierta. (9) autoevaluación. (10) entrega al docente: link a los 3 productos + slides + guion + carta firmada.
  checklist:
    titulo: Checklist antes de sustentar
    items: |-
      \checkbox 5 slides simples preparadas. \\[1mm] \checkbox Guion hablado de 1500 palabras. \\[1mm] \checkbox Ensayo cronometrado hecho. \\[1mm] \checkbox Stand de feria preparado. \\[1mm] \checkbox Carta abierta de 5 párrafos firmada. \\[1mm] \checkbox Declaración de uso de IA del año preparada. \\[1mm] \checkbox Compromiso para el grado 11° específico.
  plantilla_guion: |-
    \textbf{2 min Intro.} \textit{Año en 3 periodos.} \\[1mm] \textbf{2 min Libro P1.} \textit{Tema + fragmento corto.} \\[1mm] \textbf{2 min Informe P2.} \textit{Datos + decisiones.} \\[1mm] \textbf{2 min Micro-emprendimiento P3.} \textit{Propuesta + viabilidad.} \\[1mm] \textbf{2 min Carta abierta.} \textit{Lectura + firma.} \\[1mm] \textbf{Q\&A 5 min.} \textit{Honestidad.} \\[1mm] \textbf{Feria.} \textit{Stand + recorrido.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Mi cierre del grado 10». \textbf{Formato:} (a) slides; (b) guion; (c) carta abierta firmada; (d) autoevaluación + compromiso para G11. \textbf{Sabes que terminaste cuando} entregaste materiales y tomaste tiempo para reflexionar.
  producto_titulo: Sustentación 10 min + 3 productos + feria + carta firmada + autoevaluación
  criterios:
  - Sustentación dentro de 10 minutos
  - 5 slides simples por bloque
  - 3 productos del año mostrados
  - Q\&A con honestidad técnica
  - Carta abierta de 5 párrafos firmada
  - Participación activa en feria como autor y visitante
  - Compromiso específico para grado 11
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El aprendiz que devuelve oficio asumido a la comunidad cierra el ciclo de la pedagogía liberadora.
    aplicacion: |-
      Tu sustentación cierra el grado 10°: lo que aprendiste vuelve a la comunidad escolar hecho voz propia firmada. La filosofía de la liberación pide ese acto. Cuando declaras con honestidad lo que lograste y lo que aún te falta, estás devolviendo oficio asumido. La phronesis del cierre consiste en \textbf{compartir el aprendizaje del año, no guardarlo}.
    pregunta_espejo: |-
      ¿Mi sustentación y mi participación en feria devuelven oficio a la comunidad escolar, o solo cumplen con requisito final?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Reconocer con honestidad lo aprendido y lo que falta es virtud final del año.
    aplicacion: |-
      Es tentador presentar el año como perfecto cuando hubo dificultades. La disciplina estoica recomienda lo opuesto: \emph{declara con honestidad lo que aprendiste y lo que aún te cuesta}. Esa precisión gana respeto. La phronesis del cierre honra la verdad sobre la imagen.
    pregunta_espejo: |-
      ¿Mi sustentación declara honestamente lo que aprendí y lo que aún me falta?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La graduación con declaración honesta de IA es modelo profesional emergente del siglo XXI.
    aplicacion: |-
      En la era de la IA generativa, los cierres profesionales que declaran abiertamente uso de IA durante el año se posicionan como ético contemporáneo. Tu cierre del grado 10° te entrena en esa práctica que la educación profesional adoptará obligatoriamente en pocos años: \textbf{transparencia con porcentajes y compromiso de mejora}.
    pregunta_espejo: |-
      ¿Mi cierre contribuye al modelo de graduación transparente del siglo XXI?
compromiso: |-
  \textbf{Después del grado 10°.} Tu carta abierta firmada es el cierre formal del grado, pero también el primer documento que llevas al grado 11°. Guarda copia personal. Al entrar al grado 11° (proyecto emprendedor final del bachillerato técnico), relee la carta: tu compromiso para el grado 11° es lo primero que aplicarás. El grado 10° preparó las herramientas; el grado 11° es donde se aplican a un proyecto emprendedor real con destinatario verificable.

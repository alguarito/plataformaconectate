clave: 3-2
grado: 10
periodo: 3
sesion: 2
completo: true
titulo: Contabilidad básica --- ingresos, egresos y balance personal o familiar
titulo_portada: |-
  Contabilidad básica ---
  ingresos, egresos
  y balance
producto_final: |-
  Cuaderno de cuentas personal o familiar real de 2 semanas con (a) tabla de ingresos por fuente (mesada, propinas, ventas, regalos) registrados día por día, (b) tabla de egresos por categoría (transporte, alimentación, ocio, ahorro, otros) registrados día por día, (c) cálculo del balance neto (ingresos menos egresos) semanal y total, (d) identificación de al menos 1 categoría donde podrías reducir gastos sin sacrificar lo importante + reflexión personal de 5 líneas sobre lo que descubriste de tus hábitos económicos
apertura:
  saber_ancestral: |-
    En las tiendas del centro de Cartago, en las panaderías del barrio Obrero, en las modistas del Quindío, hubo un \textbf{ritual nocturno} que cualquier microempresario practicaba sin falta: \textbf{la cuenta de la caja}. Cuando cerraban al final del día, no se iban a casa directo. Sacaban cuaderno cuadriculado, calculadora, los billetes y monedas, y hacían \textbf{3 operaciones del oficio}: (1) \textbf{Sumar lo que entró}: todas las ventas del día. (2) \textbf{Restar lo que salió}: todos los gastos. Mercancía, servicios, recursos. (3) \textbf{Calcular el saldo}: ingresos menos egresos. Si era positivo, el negocio iba bien. Si era negativo, había problema. Si se repetía el negativo, el negocio estaba en crisis. Esa contabilidad no era trámite: era \textbf{información que dirigía las decisiones del día siguiente}. Si los ingresos bajaban, había que cambiar algo. Si los egresos subían, había que revisar gastos. La sabiduría era precisa: \textbf{ningún negocio sostenible se llevaba solo con la memoria}. La contabilidad personal moderna hereda esa práctica del tendero.
  saber_contemporaneo: |-
    La \textbf{contabilidad básica} es la práctica de registrar sistemáticamente entradas y salidas de dinero para entender la salud económica de una persona, familia o negocio. Sus \textbf{3 elementos obligatorios} son: (1) \textbf{Ingresos}: todo dinero que entra. Para un joven: mesada, regalos, propinas, pequeños trabajos, ventas casuales. Para una familia: salarios, ingresos de microemprendimiento, rentas. (2) \textbf{Egresos}: todo dinero que sale. Categorías típicas: transporte, alimentación, ocio, ahorro, salud, vivienda, educación, otros. (3) \textbf{Balance neto}: ingresos menos egresos en un periodo (día, semana, mes). Si es positivo: ganancia o excedente. Si es negativo: déficit o pérdida. La regla profesional: \textbf{si no registras tus gastos, no los controlas; lo que no se mide, no se mejora}. El cuaderno de cuentas puede ser físico (cuaderno cuadriculado tradicional) o digital (Google Sheets, Excel, app móvil como Money Manager, Spendee, GnuCash). Lo importante es la \textbf{disciplina del registro diario}, no la herramienta. Empezar con cuaderno físico durante 2 semanas y después migrar a Sheets es estrategia común.
  pregunta_puente: |-
    ¿Qué sabía el tendero al hacer la cuenta de la caja cada noche, que el novato olvida cuando lleva sus finanzas \emph{``de memoria''}? ¿Y por qué llevar contabilidad personal a los 16 años puede ahorrarte décadas de problemas financieros?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} tus fuentes de ingresos y categorías de egresos personales o familiares; (2) \textbf{aplicar} el registro disciplinado de ingresos y egresos durante al menos 2 semanas; (3) \textbf{analizar} tus datos para identificar patrones (días de mayor gasto, categorías que dominan, momentos de déficit); (4) \textbf{evaluar} dónde podrías reducir gastos sin sacrificar lo importante.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 mapeaste las herramientas y tareas de ofimática con IA. Hoy aplicas la primera \textbf{contabilidad básica real}. Las próximas sesiones (Sheets + IA, flujo de caja, visualización, mercado, plan de negocio, comunicación empresarial, proyecto integrador, sustentación) usarán estos datos reales como materia prima.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lista honesta}: piensa en qué gastos tuviste el día de ayer (transporte, comida, ocio, etc.) y suma a mano. Después piensa en cuánto crees que recibes por semana entre mesada, propinas y otros. Esa estimación grosera es la línea base antes del registro disciplinado.
  a_sistematizacion: |-
    Ya tienes estimación. Ahora vas a entender la \textbf{anatomía de la contabilidad básica personal}: las 3 piezas, las categorías típicas de ingresos y egresos, los 5 errores típicos del registro novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: armas tu cuaderno (físico o digital), registras 2 semanas de ingresos y egresos día a día, calculas balance, identificas categoría a reducir.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas al final de la semana: cuaderno de 2 semanas + balance + análisis + reflexión. El criterio principal: que descubras algo concreto sobre tus hábitos económicos que no sabías.
  a_evaluacion: |-
    Antes de cerrar, mira la contabilidad desde las cinco dimensiones humanas. Llevar cuenta es respeto por tu propio futuro económico; ignorar las cuentas es entregarse a la deriva financiera.
  a_triangulo: |-
    Y para terminar, tres voces sobre el cálculo cotidiano. Dussel sobre la contabilidad personal que libera al microempresario, Séneca sobre la disciplina del registro, Floridi sobre el dato económico personal como información cuidada.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Estimación inicial de mis cuentas} (15 min · individual). Sin abrir cuaderno ni app aún, estima a memoria: (1) \textbf{Ingresos}: ¿cuánto recibo por semana entre todo? (mesada + propinas + pequeños trabajos + regalos ocasionales). Estima el promedio. (2) \textbf{Egresos}: piensa en los gastos del día de ayer. Anota cada uno y suma. (3) \textbf{Estimación de hábitos}: ¿en qué crees que se va la mayoría del dinero? Tu respuesta intuitiva. Esa estimación es tu línea base: después la compararás con los datos reales del registro.
  checks:
  - Estimé mis ingresos semanales a memoria.
  - Sumé los gastos de ayer a memoria.
  - Anoté mi hipótesis sobre dónde se va el dinero.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Estimación inicial». \textbf{Formato:} 3 fichas (ingresos estimados, gastos ayer, hipótesis de hábito). \textbf{Sabes que terminaste cuando} tienes hipótesis cruda para contrastar con datos reales.
sistematizacion:
  intro: |-
    Tu estimación es la hipótesis. Ahora necesitas la \textbf{anatomía profesional de la contabilidad básica personal}.
  pilares:
  - |-
    Los \textbf{3 elementos obligatorios} de la contabilidad personal se descomponen así: (1) \textbf{Ingresos por fuente}: tabla con columnas Fecha, Fuente, Monto. Fuentes típicas para joven: mesada (semanal o mensual), propinas (ocasionales), pequeños trabajos (ventas, servicios), regalos (cumpleaños, festividades). (2) \textbf{Egresos por categoría}: tabla con columnas Fecha, Categoría, Descripción, Monto. Categorías típicas: \emph{Transporte} (bus, gasolina), \emph{Alimentación} (cafetería, almuerzo, mecato), \emph{Ocio} (películas, salidas, suscripciones), \emph{Ahorro} (lo que apartas), \emph{Estudios} (útiles, materiales), \emph{Otros}. (3) \textbf{Balance neto}: por día, por semana, total. Fórmula: \texttt{balance = suma de ingresos menos suma de egresos}.
  - |-
    Las \textbf{6 categorías estándar} para egresos personales de joven colombiano: (a) \textbf{Transporte} (bus, gasolina, mototaxi). (b) \textbf{Alimentación} (tienda escolar, almuerzos fuera, mecato). (c) \textbf{Ocio} (cine, salidas, juegos, suscripciones streaming). (d) \textbf{Estudios} (útiles, materiales, fotocopias). (e) \textbf{Ahorro} (lo que apartas conscientemente). (f) \textbf{Otros} (regalos para otros, gastos médicos, etc.). La regla profesional: \textbf{usar las mismas categorías consistentemente}. Cambiar categorías cada semana hace el análisis imposible.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿lo que crees que pasa con tu dinero coincide con lo que realmente pasa?}. La mayoría de personas, cuando empiezan a registrar, descubren con sorpresa que el ocio o la alimentación informal son mucho más altos de lo que creían. Ese descubrimiento es el valor real de la contabilidad básica: \textbf{convierte la intuición en información}.
  - |-
    Algoritmo: (1) elegir herramienta de registro (cuaderno cuadriculado físico, hoja de Google Sheets, app móvil). (2) crear 2 tablas (ingresos y egresos) con las columnas correctas. (3) registrar cada día durante 2 semanas (todo: hasta los 500 pesos del dulce). (4) cada domingo, sumar ingresos y egresos de la semana y calcular balance. (5) al terminar las 2 semanas, analizar patrones. (6) identificar 1 categoría reducible.
  anatomia:
    titulo: Anatomía de la contabilidad personal
    body: |-
      \textbf{Ingresos:} fecha + fuente + monto. \\[1mm] \textbf{Egresos:} fecha + categoría + descripción + monto. \\[1mm] \textbf{6 categorías:} transporte / alimentación / ocio / estudios / ahorro / otros. \\[1mm] \textbf{Balance:} ingresos menos egresos por periodo. \\[1mm] \textbf{Disciplina:} registro diario sin saltarse días.
  errores_comunes: |-
    (1) \textbf{Saltarse días}: el cuaderno con huecos no permite análisis. (2) \textbf{Olvidar gastos pequeños}: los 500 pesos del dulce suman al final del mes. (3) \textbf{Mezclar contabilidad propia con familiar}: confunde el análisis. (4) \textbf{Cambiar categorías sin avisar}: imposibilita comparación. (5) \textbf{Hacer todo en la cabeza}: si no escribes, no controlas.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía contabilidad». \textbf{Formato:} (a) plantilla con 6 categorías; (b) regla de disciplina diaria; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} sabes registrar sin pensar mucho.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- Cuaderno de 2 semanas + análisis + reflexión} (15 min en sesión + 2 semanas de registro · individual). Hora de aplicar. Armas tu cuaderno, registras 2 semanas, analizas, identificas categoría a reducir, reflexionas.
  pilares:
  - |-
    Tu cuaderno se construye y se mantiene en 4 pasos: (1) elegir herramienta: cuaderno cuadriculado físico es buen primer paso; al periodo 3-4 puedes migrar a Sheets. (2) crear 2 tablas con encabezados. (3) registrar cada día durante 14 días seguidos: ingresos y egresos sin excepción. (4) cada domingo: sumar semana, calcular balance, anotar observaciones.
  - |-
    Sigue el patrón \textbf{``registrar antes de juzgar''}: las primeras 2 semanas son solo observación. No te juzgues por gastar en lo que gastas. Solo registra con honestidad. Cuando tengas 14 días completos, recién entonces analiza para encontrar patrones y decidir cambios. La phronesis del oficio consiste en \textbf{convertir hábitos invisibles en información visible antes de intentar cambiarlos}.
  - |-
    El \textbf{análisis al final de las 2 semanas} responde 5 preguntas: (a) ¿Cuál fue el ingreso total y promedio semanal? (b) ¿Cuál fue el egreso total y promedio semanal? (c) ¿Cuál fue el balance neto (positivo o negativo)? (d) ¿Qué categoría representó el mayor porcentaje de egresos? (e) ¿Dónde podría reducir sin sacrificar lo importante?
  - |-
    Algoritmo: (1) crear cuaderno. (2) registrar 14 días. (3) calcular totales y balance. (4) analizar categorías. (5) identificar 1 categoría reducible. (6) reflexión de 5 líneas sobre lo descubierto.
  checklist:
    titulo: Checklist al cerrar las 2 semanas
    items: |-
      \checkbox 14 días completos de registro (sin huecos). \\[1mm] \checkbox Ingresos por fuente registrados. \\[1mm] \checkbox Egresos por categoría registrados. \\[1mm] \checkbox Balance neto por semana calculado. \\[1mm] \checkbox Categoría dominante identificada. \\[1mm] \checkbox 1 categoría reducible declarada. \\[1mm] \checkbox Reflexión de 5 líneas sobre hábitos descubiertos.
  plantilla_guion: |-
    \textbf{Cuaderno.} \textit{Físico o digital, 2 tablas.} \\[1mm] \textbf{Registro.} \textit{14 días sin huecos.} \\[1mm] \textbf{Análisis.} \textit{Ingresos, egresos, balance, categoría dominante.} \\[1mm] \textbf{Decisión.} \textit{Categoría a reducir.} \\[1mm] \textbf{Reflexión.} \textit{5 líneas sobre hábitos descubiertos.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- Mi contabilidad de 2 semanas». \textbf{Formato:} (a) tablas completas; (b) cálculos; (c) reflexión final. \textbf{Sabes que terminaste cuando} descubriste algo sobre tus hábitos que no sabías.
  producto_titulo: Cuaderno 2 semanas + balance + análisis + reflexión
  criterios:
  - 14 días de registro sin huecos
  - Ingresos y egresos categorizados
  - Balance neto calculado
  - Categoría dominante identificada
  - 1 categoría reducible declarada
  - Reflexión sobre hábitos descubiertos
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La contabilidad personal libera al joven de la deriva financiera; ignorar las cuentas es entregarse al sistema que extrae sin información.
    aplicacion: |-
      Cuando llevas cuenta de tus ingresos y egresos, asumes control de tu vida económica. La filosofía de la liberación pide ese acto: \textbf{conocer tu economía es condición para decidir sobre ella}. Quien no lleva cuenta queda a merced de hábitos automáticos y publicidad. La phronesis financiera del joven consiste en \textbf{empezar el registro temprano, cuando los hábitos aún se pueden moldear}.
    pregunta_espejo: |-
      ¿Estoy asumiendo control de mi economía con el registro, o entrego mis decisiones a hábitos automáticos?
  estoico:
    autor: Séneca
    cita: |-
      La disciplina del registro diario es virtud; la negligencia económica es vicio que se descubre tarde.
    aplicacion: |-
      Es tentador saltarse el registro algunos días porque \emph{``no pasó nada importante''}. La sabiduría estoica recomienda lo opuesto: \emph{registra todo, incluso los días tranquilos}. La disciplina del registro continuo es lo único que produce información útil. Quien registra solo cuando se acuerda no controla nada.
    pregunta_espejo: |-
      ¿Estoy registrando con disciplina diaria, o salto días esperando que la memoria llene los huecos?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los datos económicos personales bien recolectados son información cuidada que fundamenta decisiones de vida.
    aplicacion: |-
      En la era de la información, llevar cuenta personal es ejercicio de soberanía sobre los propios datos. La ética informacional pide que cuides tus propios números antes de delegarlos a apps o entidades. Tu cuaderno de 2 semanas te entrena en una práctica que escalará a toda tu vida económica: \textbf{controlar tu información para controlar tus decisiones}.
    pregunta_espejo: |-
      ¿Estoy cuidando mis datos económicos como información profesional, o solo registro porque me lo pidieron?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu cuaderno de 2 semanas completo, balance calculado y análisis. En la sesión 3 vas a migrar tu cuaderno a \textbf{Google Sheets con asistencia de IA}: fórmulas automáticas, gráficos, análisis con \texttt{=GEMINI()}. La contabilidad a mano de hoy es la base; Sheets de mañana es la herramienta de escala.
web:
  conceptos_clave:
    - termino: Ingresos
      definicion: |-
        Todo dinero que entra. Para un joven: mesada, regalos, propinas, pequeños trabajos, ventas casuales.
      ejemplo: |-
        Recibes $20.000 de tu tía + $50.000 de un trabajito + $10.000 de mesada. Total de ingresos del periodo: $80.000.
      emoji: "💰"
    - termino: Egresos
      definicion: |-
        Todo dinero que sale, agrupado por categorías típicas: transporte, alimentación, ocio, ahorro, salud, vivienda, otros.
      ejemplo: |-
        Gastas $30.000 en transporte, $15.000 en almuerzos y $5.000 en salidas. Total egresos: $50.000 en 3 categorías.
      emoji: "🛒"
    - termino: Balance neto
      definicion: |-
        Ingresos menos egresos en un periodo. Positivo = excedente. Negativo = déficit.
      ejemplo: |-
        Con ingresos de $80.000 y egresos de $50.000, el balance neto del mes es +$30.000.
      emoji: "⚖️"
    - termino: Disciplina del registro diario
      definicion: |-
        Práctica de anotar cada entrada y salida el mismo día que ocurre. La memoria falla; el cuaderno no.
      ejemplo: |-
        Al final del día anotas en una línea: "Almuerzo $8.000". Sin esa rutina, el balance del mes es invento.
      emoji: "🗓️"
    - termino: Cuaderno físico vs Sheets
      definicion: |-
        Empezar con cuaderno físico 2 semanas y migrar a Sheets es estrategia común. Lo importante es la disciplina, no la herramienta.
      ejemplo: |-
        Llevas 14 días en libreta, después abres Sheets, copias categorías y montas fórmulas. La disciplina ya está.
      emoji: "📒"
  quiz:
    titulo: ¿Llevas contabilidad básica con disciplina?
    instrucciones: 5 preguntas para verificar que dominas los 3 elementos obligatorios.
    preguntas:
      - enunciado: ¿Cuáles son los 3 elementos obligatorios de la contabilidad básica?
        opciones:
          - Solo ingresos
          - Solo egresos
          - Ingresos, egresos y balance neto
          - Solo el saldo bancario
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Ingresos, egresos y balance neto. Los tres juntos cuentan la historia económica del periodo.
        feedback_incorrecto: |-
          Son ingresos, egresos y balance neto. Faltar a uno deja la contabilidad incompleta.
      - enunciado: La regla "lo que no se mide, no se mejora" significa que...
        opciones:
          - No vale la pena medir
          - Hay que medir solo a veces
          - El registro es opcional
          - Sin registro sistemático, no puedes controlar tus gastos
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. Sin registro sistemático, los gastos escapan a tu control.
        feedback_incorrecto: |-
          Sin registro, no hay control. Por eso la disciplina diaria del cuaderno es clave.
      - enunciado: Tu balance neto es -$15.000 al final del mes. ¿Qué significa?
        opciones:
          - Que tienes excedente
          - Que gastaste $15.000 más de lo que recibiste (déficit)
          - Que no pasó nada
          - Que ganaste $15.000
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Balance negativo significa déficit: egresos superaron ingresos en esa cantidad.
        feedback_incorrecto: |-
          Significa déficit: gastaste $15.000 más de lo que entró. Hay que ajustar para el próximo mes.
      - enunciado: ¿Qué importa más, el cuaderno físico o Google Sheets?
        opciones:
          - La disciplina del registro, no la herramienta
          - Solo Sheets
          - Solo papel
          - Nada importa
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Sin disciplina, ninguna herramienta sirve. Con disciplina, cualquiera funciona.
        feedback_incorrecto: |-
          Importa la disciplina del registro diario. La herramienta es secundaria.
      - enunciado: ¿Cuántas semanas mínimas de registro pide la sesión?
        opciones:
          - "1 día"
          - "1 año"
          - "10 años"
          - "2 semanas"
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. 2 semanas mínimas para producir un balance interpretable.
        feedback_incorrecto: |-
          Son 2 semanas mínimas. Suficientes para detectar patrones y producir un primer balance útil.

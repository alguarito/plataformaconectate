clave: 3-3
grado: 10
periodo: 3
sesion: 3
completo: true
titulo: Google Sheets + IA para contabilidad personal o microempresa
titulo_portada: |-
  Google Sheets + IA ---
  contabilidad personal
  o microempresa
producto_final: |-
  Plantilla funcional reutilizable de contabilidad en Google Sheets con (a) hoja de Ingresos con tabla y fórmulas, (b) hoja de Egresos con tabla y fórmulas, (c) hoja de Balance con dashboard automático usando SUMA, PROMEDIO, MAX, MIN, SUMAR.SI, (d) al menos 1 gráfico automático de gastos por categoría (circular o barras), (e) integración de tu cuaderno de la sesión 2 migrado a la plantilla + bitácora con al menos 1 duda técnica resuelta con asistencia de IA documentada
apertura:
  saber_ancestral: |-
    En las oficinas pequeñas del centro de Cartago, en las contadurías de barrio, hubo durante décadas un personaje que cualquier microempresario conocía: \textbf{el contador del barrio que llevaba la planilla cuadriculada}. No era contador titulado de empresa grande: era el señor con escritorio modesto, lápiz, regla, calculadora y \textbf{planillas cuadriculadas} (hojas grandes pre-impresas con columnas y filas). Cada microempresario del barrio le llevaba sus cuadernos de cuentas mensualmente. El contador desplegaba la planilla, organizaba los datos en columnas (ingresos por concepto, egresos por categoría, totales semanales, totales mensuales), hacía los cálculos con la calculadora, registraba con lápiz, sumaba. Al final del mes, entregaba al microempresario \textbf{el resumen}: balance, comparación con mes anterior, recomendaciones simples (\emph{``este mes subieron los gastos en transporte, revise rutas''}). La planilla cuadriculada era \textbf{la hoja de cálculo ancestral}; el contador era el \textbf{Excel humano} del barrio. Hoy, Google Sheets es esa planilla digital al alcance de cualquiera, y la IA es el aprendiz que ayuda cuando te trabas con una fórmula. Pero la regla del oficio sigue siendo la misma: \textbf{tú firmas las cuentas; la IA solo asiste}.
  saber_contemporaneo: |-
    \textbf{Google Sheets} es la hoja de cálculo gratuita más usada del mundo, integrada con cuenta Gmail. Sus 5 funciones básicas para contabilidad son: (1) \texttt{=SUMA(rango)}: suma valores. Ej. \texttt{=SUMA(B2:B30)} suma todos los egresos del mes. (2) \texttt{=PROMEDIO(rango)}: media aritmética. Ej. \texttt{=PROMEDIO(B2:B30)} promedio de egresos. (3) \texttt{=MAX(rango)} y \texttt{=MIN(rango)}: valor máximo y mínimo. (4) \texttt{=SUMAR.SI(rango criterio; criterio; rango suma)}: suma condicional. Ej. \texttt{=SUMAR.SI(C2:C30; ``Transporte''; B2:B30)} suma todos los egresos cuya categoría sea Transporte. (5) \texttt{=GEMINI("pregunta")}: integración nativa con IA Gemini desde 2025. Permite preguntar a la IA dentro de una celda. Ej. \texttt{=GEMINI("propone 3 categorías para estos egresos:" \&unir(B2:B20;","))}. La regla profesional: \textbf{las fórmulas dan velocidad; la IA da sugerencias; tú decides}. Los \textbf{gráficos automáticos} se generan con Insertar → Gráfico, eligiendo el tipo (barras para comparar, líneas para tendencia, circular para proporciones). La hoja de Balance integra todo: dashboard con totales, promedios, gráfico de gastos por categoría.
  pregunta_puente: |-
    ¿Qué sabía el contador del barrio al organizar la planilla cuadriculada con disciplina, que el novato olvida cuando intenta hacer Sheets sin estructura? ¿Y por qué \texttt{=GEMINI()} dentro de Sheets es asistente pero nunca decisor final?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 5 funciones básicas de Sheets útiles para contabilidad personal; (2) \textbf{aplicar} las fórmulas a tus datos del cuaderno de la sesión 2 ya migrados; (3) \textbf{analizar} el balance con gráficos automáticos para detectar patrones; (4) \textbf{evaluar} cuándo usar \texttt{=GEMINI()} y cuándo confiar solo en fórmulas propias.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 2 llevaste cuaderno de cuentas durante 2 semanas. Hoy migras al \textbf{formato digital con automatización}. Las próximas sesiones (flujo de caja, visualización, mercado, Canvas, comunicación, proyecto) usarán esta plantilla como base.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{primer Sheet}: abre Google Sheets, crea nuevo, y replica una columna de tus ingresos del cuaderno físico. En la celda debajo de los datos, escribe \texttt{=SUMA(B2:B10)} (ajusta el rango). Mira el resultado. Acabas de hacer tu primera fórmula.
  a_sistematizacion: |-
    Ya tienes primer cálculo. Ahora vas a entender la \textbf{anatomía de Sheets para contabilidad}: 5 fórmulas básicas, estructura de 3 hojas, integración con IA, los 5 errores típicos.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: armas la plantilla de 3 hojas (Ingresos, Egresos, Balance), migras los datos del cuaderno, aplicas fórmulas, generas gráfico, integras IA para 1 duda técnica.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: plantilla funcional + datos migrados + gráfico + bitácora IA. El criterio principal: que la plantilla puedas reusarla para los próximos meses sin tener que rehacerla.
  a_evaluacion: |-
    Antes de cerrar, mira Sheets desde las cinco dimensiones humanas. Automatizar cálculos con disciplina es respeto por tu propio tiempo futuro; hacer las cuentas a mano cuando hay herramienta gratuita es nostalgia mal entendida.
  a_triangulo: |-
    Y para terminar, tres voces sobre la planilla digital. Dussel sobre las herramientas que liberan al microempresario, Marco Aurelio sobre la disciplina de la fórmula correcta, Floridi sobre la IA como copiloto contable.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Mi primera fórmula en Sheets} (15 min · individual con dispositivo). Abre Google Sheets (\texttt{sheets.google.com} o desde Drive). Crea hoja nueva. En la columna B, escribe 5 valores de ingresos reales de tu cuaderno (uno por celda, B2 a B6). En la celda B8 escribe la fórmula: \texttt{=SUMA(B2:B6)} y presiona Enter. Mira el resultado: aparece el total de los 5 valores. Después prueba \texttt{=PROMEDIO(B2:B6)} en B9. Acabas de hacer 2 fórmulas básicas.
  checks:
  - Abrí Google Sheets y creé hoja nueva.
  - Escribí 5 valores reales en columna.
  - Apliqué =SUMA y =PROMEDIO y vi resultados.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Primera fórmula». \textbf{Formato:} captura de la hoja con las 2 fórmulas funcionando. \textbf{Sabes que terminaste cuando} ves que el cálculo automático es rápido.
sistematizacion:
  intro: |-
    Tu primera fórmula te muestra la velocidad de Sheets. Ahora necesitas la \textbf{anatomía profesional} para construir plantilla de contabilidad completa.
  pilares:
  - |-
    Las \textbf{5 fórmulas básicas} de contabilidad se descomponen así: (1) \texttt{=SUMA(B2:B30)}: suma todos los valores del rango. (2) \texttt{=PROMEDIO(B2:B30)}: media aritmética. (3) \texttt{=MAX(B2:B30)}: valor más alto (mayor gasto). (4) \texttt{=MIN(B2:B30)}: valor más bajo (menor gasto). (5) \texttt{=SUMAR.SI(C2:C30; "Transporte"; B2:B30)}: suma solo cuando la columna C contiene \emph{Transporte}. Esa última es crucial para totalizar por categoría.
  - |-
    La \textbf{estructura de 3 hojas} para contabilidad personal: (a) \textbf{Hoja Ingresos}: columnas Fecha, Fuente, Monto. (b) \textbf{Hoja Egresos}: columnas Fecha, Categoría, Descripción, Monto. (c) \textbf{Hoja Balance}: dashboard que usa fórmulas \texttt{=SUMAR.SI()} para totalizar por categoría, \texttt{=SUMA()} para totales generales, gráfico automático. Esta estructura es replicable: el mismo formato sirve para contabilidad personal o microempresa.
  - |-
    La \textbf{integración con IA} en Sheets tiene 2 vías: (a) \texttt{=GEMINI("pregunta")} directamente en celda. Útil para clasificación automática (\emph{=GEMINI("clasifica este gasto: " \&B2)}). Disponible desde 2025 con Workspace. (b) Pegar datos en ChatGPT/Gemini externos pidiendo análisis. Útil para análisis cualitativos. La regla profesional: \textbf{la IA propone, tú verificas con casos conocidos antes de confiar la fórmula}.
  - |-
    Algoritmo: (1) crear nueva hoja de Google Sheets con 3 pestañas. (2) configurar columnas en Ingresos y Egresos. (3) migrar datos del cuaderno físico de la sesión 2. (4) en Balance, aplicar \texttt{=SUMAR.SI()} para totalizar por categoría. (5) calcular balance neto. (6) generar gráfico automático de gastos por categoría. (7) cuando te trabes con alguna fórmula, preguntar a Gemini o ChatGPT. (8) documentar la duda y la respuesta en bitácora.
  anatomia:
    titulo: Anatomía de Sheets contable
    body: |-
      \textbf{5 fórmulas:} SUMA / PROMEDIO / MAX / MIN / SUMAR.SI. \\[1mm] \textbf{3 hojas:} Ingresos / Egresos / Balance. \\[1mm] \textbf{Gráfico:} Insertar → Gráfico automático. \\[1mm] \textbf{IA:} GEMINI integrada o ChatGPT externo. \\[1mm] \textbf{Regla:} IA propone, tú verificas.
  errores_comunes: |-
    (1) \textbf{Rango mal seleccionado}: \texttt{=SUMA(B:B)} cuando solo querías B2:B30 (incluye el encabezado). (2) \textbf{Fórmulas a mano celda por celda}: en lugar de arrastrar la fórmula para que se replique. (3) \textbf{Categorías inconsistentes}: \emph{``Transporte''} y \emph{``transporte''} con minúscula son distintas para SUMAR.SI. (4) \textbf{Aceptar fórmula de IA sin probar}: =GEMINI puede sugerir fórmulas mal estructuradas. (5) \textbf{Sin gráfico}: el dashboard sin visualización pierde su valor.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía Sheets contable». \textbf{Formato:} (a) las 5 fórmulas con ejemplo; (b) estructura 3 hojas; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} puedes construir plantilla básica sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- Plantilla Sheets contable + IA documentada} (40 min · individual con dispositivo). Hora de aplicar. Construyes plantilla de 3 hojas, migras datos, generas gráfico, documentas 1 duda resuelta con IA.
  pilares:
  - |-
    Tu plantilla se construye en 7 pasos: (1) crear nueva hoja en Sheets. (2) renombrar 3 pestañas: Ingresos, Egresos, Balance. (3) configurar encabezados en Ingresos (Fecha, Fuente, Monto) y Egresos (Fecha, Categoría, Descripción, Monto). (4) migrar los datos de tu cuaderno físico de la sesión 2 (las 2 semanas reales). (5) en la hoja Balance, crear celdas con fórmulas: total ingresos, total egresos, balance, sumas por categoría con \texttt{=SUMAR.SI()}. (6) seleccionar la tabla de sumas por categoría e Insertar → Gráfico (Sheets sugiere circular o barras automáticamente). (7) cuando te trabes con alguna fórmula, preguntar a IA y documentar.
  - |-
    Sigue el patrón \textbf{``plantilla reutilizable, no solo para hoy''}: tu plantilla debe servir para que el próximo mes solo cambies los datos. Las fórmulas se actualizan solas. Las categorías se mantienen iguales. El gráfico se regenera. Esa replicabilidad es lo que diferencia plantilla profesional de cálculo único.
  - |-
    La \textbf{bitácora de IA} documenta al menos 1 duda técnica que tuviste y cómo la IA te ayudó: (a) duda específica (\emph{``¿cómo sumo solo los egresos de transporte sin contar el resto?''}). (b) pregunta hecha a IA. (c) respuesta de IA (la fórmula que sugirió). (d) verificación (probaste con datos conocidos y funcionó o no). (e) decisión final.
  - |-
    Algoritmo: (1) crear plantilla con 3 pestañas. (2) migrar datos. (3) aplicar fórmulas. (4) generar gráfico. (5) bitácora IA. (6) guardar y compartir con tu correo institucional como respaldo.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Plantilla Google Sheets con 3 pestañas. \\[1mm] \checkbox Datos migrados del cuaderno físico. \\[1mm] \checkbox Fórmulas SUMA, PROMEDIO, MAX, MIN aplicadas. \\[1mm] \checkbox SUMAR.SI por cada categoría de egresos. \\[1mm] \checkbox Balance neto calculado automáticamente. \\[1mm] \checkbox Gráfico automático de gastos por categoría. \\[1mm] \checkbox Bitácora con 1+ duda resuelta con IA documentada.
  plantilla_guion: |-
    \textbf{Hoja Ingresos.} \textit{Fecha + Fuente + Monto.} \\[1mm] \textbf{Hoja Egresos.} \textit{Fecha + Categoría + Descripción + Monto.} \\[1mm] \textbf{Hoja Balance.} \textit{Sumas + Promedios + MAX/MIN + SUMAR.SI + Balance + Gráfico.} \\[1mm] \textbf{Bitácora IA.} \textit{Duda + Pregunta + Respuesta + Verificación.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- Mi plantilla Sheets». \textbf{Formato:} (a) link al archivo Sheets; (b) capturas de las 3 hojas; (c) bitácora IA. \textbf{Sabes que terminaste cuando} tu plantilla podría servirle a un microempresario.
  producto_titulo: Plantilla Sheets 3 hojas + datos + gráfico + bitácora IA
  criterios:
  - Plantilla con 3 pestañas funcionales
  - Datos reales migrados
  - 5 fórmulas básicas aplicadas
  - Gráfico automático generado
  - Bitácora IA con duda resuelta
  - Plantilla replicable para meses futuros
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Las herramientas digitales gratuitas con IA democratizan el oficio contable; el microempresario que las domina no depende de contadores caros.
    aplicacion: |-
      Tradicionalmente, los microempresarios pagaban contadores para tareas que ahora pueden hacer con Sheets gratis y asistencia de IA. La filosofía de la liberación pide aprovechar esa democratización: \textbf{la tecnología accesible es libertad económica}. La phronesis del oficio digital consiste en \textbf{usar las herramientas gratuitas con disciplina para no depender de servicios pagos innecesarios}.
    pregunta_espejo: |-
      ¿Estoy aprendiendo Sheets como acto de libertad económica futura, o solo como tarea escolar?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La fórmula correcta es virtud del oficio; copiar fórmula sin entenderla es vanidad técnica.
    aplicacion: |-
      Es tentador copiar fórmulas que la IA sugiere sin entenderlas. La sabiduría estoica recomienda lo opuesto: \emph{entiende cada fórmula antes de aceptarla}. Solo entendiendo qué hace =SUMAR.SI puedes detectar si la IA la sugirió mal. La phronesis del oficio consiste en \textbf{usar la IA para aprender, no para reemplazar el aprendizaje}.
    pregunta_espejo: |-
      ¿Entiendo cada fórmula de mi plantilla, o solo copié lo que la IA dijo?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La IA como copiloto contable es ética profesional en la era de la automatización accesible.
    aplicacion: |-
      Tu plantilla con \texttt{=GEMINI()} integrada es modelo del oficio contemporáneo: herramienta gratuita + IA como asistente + criterio humano para verificar. Esa combinación es ética porque produce resultados confiables sin depender de empresas caras. La phronesis profesional del siglo XXI consiste en \textbf{combinar herramientas accesibles con criterio propio}.
    pregunta_espejo: |-
      ¿Mi plantilla combina herramienta gratuita con criterio propio, o pretendo que solo la IA decida?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu plantilla Sheets funcional con los datos migrados y el gráfico generado. En la sesión 4 vas a aprender \textbf{flujo de caja y punto de equilibrio}: proyectar 3 meses adelante con la plantilla y calcular cuándo un microemprendimiento se equilibra. Los datos de hoy son la base; la proyección de mañana es la herramienta de decisión.
web:
  conceptos_clave:
    - termino: "=SUMA(rango)"
      definicion: |-
        Fórmula que suma valores. Base de la contabilidad en Sheets. Aplica a egresos del mes, ingresos por categoría, totales acumulados.
      ejemplo: |-
        "=SUMA(B2:B30)" suma todos los valores de la columna B entre la fila 2 y la 30.
      emoji: "➕"
    - termino: "=SUMAR.SI(rango;criterio;rango_suma)"
      definicion: |-
        Suma condicional. Permite agregar solo los valores que cumplen un criterio. Clave para categorías.
      ejemplo: |-
        "=SUMAR.SI(C2:C30;\"Transporte\";B2:B30)" suma los egresos cuya categoría sea Transporte.
      emoji: "🎯"
    - termino: "=PROMEDIO, =MAX, =MIN"
      definicion: |-
        Funciones estadísticas básicas. Promedio para tendencia, máximo y mínimo para detectar valores atípicos.
      ejemplo: |-
        "=PROMEDIO(B2:B30)" da el gasto medio. "=MAX(B2:B30)" identifica el gasto más alto del periodo.
      emoji: "📐"
    - termino: "=GEMINI(\"pregunta\")"
      definicion: |-
        Integración nativa con IA Gemini desde 2025. Permite consultar IA dentro de una celda con prompt entre comillas.
      ejemplo: |-
        "=GEMINI(\"clasifica estos gastos en 4 categorías: \"&UNIR(B2:B20;\",\"))" obtiene propuesta de categorización.
      emoji: "🤖"
    - termino: Gráfico automático
      definicion: |-
        Insertar → Gráfico genera visual del dato seleccionado. Barras para comparar, líneas para tendencia, circular para proporciones.
      ejemplo: |-
        Seleccionas la tabla de gastos por categoría, Insertar → Gráfico. Sheets sugiere "Circular"; lo aceptas.
      emoji: "📊"
  quiz:
    titulo: ¿Manejas Sheets profesional para contabilidad?
    instrucciones: 5 preguntas para verificar las fórmulas clave.
    preguntas:
      - enunciado: "¿Qué hace =SUMAR.SI?"
        opciones:
          - Suma todo
          - Suma condicional según un criterio
          - Resta valores
          - No existe
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Suma solo los valores que cumplen la condición especificada.
        feedback_incorrecto: |-
          Suma condicional. Útil para sumar solo los gastos de una categoría específica.
      - enunciado: "¿Qué función nativa permite preguntar a IA dentro de una celda?"
        opciones:
          - "=PRINT()"
          - "=GEMINI()"
          - "=GUARDAR()"
          - "=CALL()"
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. =GEMINI() consulta IA con prompt entre comillas.
        feedback_incorrecto: |-
          Es =GEMINI(). Integración nativa con IA desde 2025.
      - enunciado: ¿Qué tipo de gráfico es mejor para mostrar evolución del balance semanal?
        opciones:
          - Circular
          - Líneas
          - 3D rotativo
          - Mapa de calor
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Líneas muestra tendencia en el tiempo de forma clara.
        feedback_incorrecto: |-
          El gráfico de líneas es el adecuado para evolución temporal.
      - enunciado: La regla "las fórmulas dan velocidad; la IA da sugerencias; tú decides" significa que...
        opciones:
          - La IA reemplaza el criterio
          - El editor humano combina velocidad de fórmulas, propuesta de IA y criterio propio
          - Hay que evitar fórmulas
          - Las fórmulas son lo único válido
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Las 3 capas se combinan: fórmulas rápidas, IA propone, humano decide.
        feedback_incorrecto: |-
          Combinas las 3 capas: velocidad, propuesta y criterio. Ninguna sola basta.
      - enunciado: ¿Para qué sirve =MAX en una hoja de gastos?
        opciones:
          - Para borrar valores
          - Para identificar el gasto más alto del periodo
          - Para sumar
          - Para promediar
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. =MAX detecta el valor máximo, útil para identificar gastos atípicos.
        feedback_incorrecto: |-
          Identifica el valor máximo. Útil para detectar gastos atípicos o picos del periodo.

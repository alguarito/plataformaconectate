grado: 10
periodo: 3
sesion: 4
completo: true
titulo: Flujo de caja y punto de equilibrio --- proyectar con IA
titulo_portada: |-
  Flujo de caja y
  punto de equilibrio ---
  proyectar con IA
producto_final: |-
  Proyección financiera completa a 3 meses de un microemprendimiento real o hipotético en tu plantilla Sheets con (a) flujo de caja mes a mes detallado (ingresos proyectados menos costos fijos menos costos variables), (b) cálculo del punto de equilibrio en unidades vendidas usando la fórmula estándar, (c) 3 escenarios proyectados (pesimista 30 por ciento del realista, realista 60 por ciento del optimista, optimista 100 por ciento esperado), (d) decisión documentada de viabilidad (viable, viable con ajustes, requiere pivote, no viable) con justificación numérica
apertura:
  saber_ancestral: |-
    En las fincas del Valle del Cauca y en las parcelas cafeteras del Quindío, ningún campesino con experiencia sembraba sin antes hacer \textbf{la cuenta de la cosecha}. Esa cuenta no estaba en libros: estaba en la cabeza del mayor y se transmitía a los hijos en las tardes de patio. Tenía 3 columnas claras: (1) \textbf{La siembra}: lo que invertía antes de ver fruto (semilla, abono, jornales, herramienta, agua). (2) \textbf{La espera}: el tiempo entre siembra y cosecha (3 meses para frijol, 9 meses para café, 1 año para plátano). Durante ese tiempo no entraba peso, solo salían gastos. (3) \textbf{La cosecha}: lo que esperaba recoger en kilos, multiplicado por el precio probable del mercado, descontando plagas, lluvia y transporte. El campesino que no hacía esta cuenta era llamado \emph{loco} o \emph{novato}: casi siempre perdía la finca al primer año adverso. La \textbf{phronesis económica campesina} sabía algo que el emprendimiento moderno olvida: \textbf{el cálculo previo no enfría la pasión; la protege de la ruina}. El flujo de caja moderno formaliza esa cuenta de la cosecha aplicada al microemprendimiento contemporáneo.
  saber_contemporaneo: |-
    El \textbf{flujo de caja} y el \textbf{punto de equilibrio} son las 2 herramientas financieras más útiles para cualquier microemprendimiento. (1) \textbf{Flujo de caja}: tabla mes a mes que muestra \emph{Ingresos proyectados} menos \emph{Egresos proyectados} = \emph{Saldo del mes}. Acumulado, muestra cuándo el negocio tiene caja positiva (sobra plata) o negativa (necesita más capital). (2) \textbf{Costos fijos vs variables}: los \emph{fijos} ocurren cada mes existan o no ventas (arriendo, suscripciones SaaS, sueldos). Los \emph{variables} dependen del volumen (materia prima, comisiones, envíos). (3) \textbf{Punto de equilibrio}: la fórmula estándar es \emph{Punto de equilibrio (unidades) = Costos fijos / (Precio unitario - Costo variable unitario)}. Responde: ¿cuántas ventas necesito al mes para que los ingresos cubran los costos? Si tu modelo necesita 200 ventas mensuales para equilibrarse y tu microempresa apenas vende 50, hay problema estructural. (4) \textbf{3 escenarios}: pesimista 30 por ciento, realista 60 por ciento, optimista 100 por ciento del esperado. Decisiones se toman con realista, sostenibilidad con pesimista. La regla profesional: \textbf{ningún microemprendimiento sin proyección financiera a 3 meses sobrevive bien al cuarto mes}.
  pregunta_puente: |-
    ¿Qué sabía el campesino al hacer la cuenta de la cosecha antes de sembrar, que el emprendedor novato olvida cuando lanza microempresa con \emph{``ya veremos''}? ¿Y por qué el punto de equilibrio claro vale más que las proyecciones optimistas vagas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los componentes del flujo de caja (costos fijos, costos variables, ingresos proyectados, saldo); (2) \textbf{aplicar} la fórmula del punto de equilibrio a tu microemprendimiento real o hipotético; (3) \textbf{analizar} los 3 escenarios (pesimista, realista, optimista) con honestidad sobre supuestos; (4) \textbf{evaluar} la viabilidad de tu microemprendimiento con justificación numérica.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 2 y 3 trabajaste contabilidad personal y plantilla Sheets. Hoy proyectas \textbf{hacia el futuro}: 3 meses de un microemprendimiento. Las próximas sesiones (visualización, mercado, Canvas, comunicación, proyecto integrador) construyen sobre la proyección financiera de hoy.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{experimento mental simple}: imagina que quieres vender empanadas en el colegio durante 3 meses. Pregúntate: ¿cuánto cuesta cada empanada producir? ¿a cuánto la vendo? ¿cuántas debo vender al mes para no perder? Esa cuenta intuitiva es punto de equilibrio en versión simple.
  a_sistematizacion: |-
    Ya tienes ejemplo. Ahora vas a entender la \textbf{anatomía profesional del flujo de caja y punto de equilibrio}: 4 componentes, fórmula estándar, 3 escenarios, los 5 errores típicos.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: eliges microemprendimiento (real o hipotético), construyes flujo de caja 3 meses en Sheets, calculas punto de equilibrio, proyectas 3 escenarios, decides viabilidad.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: proyección 3 meses + punto de equilibrio + 3 escenarios + decisión. El criterio principal: que tu proyección permita decidir con honestidad si el microemprendimiento es viable.
  a_evaluacion: |-
    Antes de cerrar, mira la proyección desde las cinco dimensiones humanas. Calcular antes de emprender es respeto por tu tiempo y dinero; lanzar sin proyectar es invitar a la ruina con buenos modales.
  a_triangulo: |-
    Y para terminar, tres voces sobre la cuenta previa. Dussel sobre las proyecciones que protegen al microempresario, Séneca sobre la sobriedad del cálculo, Floridi sobre las decisiones basadas en datos como ética emprendedora.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Experimento de las empanadas} (15 min · individual). Imagina que vendes empanadas en el colegio. Calcula a mano (o con calculadora simple): (1) \textbf{Costo de producción por empanada}: harina + carne + aceite + envoltura. Estima 500 pesos por unidad. (2) \textbf{Precio de venta}: 1.500 pesos por empanada. (3) \textbf{Margen unitario}: 1500 - 500 = 1.000 pesos por empanada. (4) \textbf{Costos fijos mensuales}: imagina que pagas 100.000 pesos al mes en mejoras de cocina y permisos del colegio. (5) \textbf{Punto de equilibrio}: 100.000 dividido entre 1.000 = 100 empanadas/mes. ¿Es viable vender 100 empanadas en un mes en el colegio?
  checks:
  - Calculé costo unitario de empanada.
  - Calculé margen unitario.
  - Calculé punto de equilibrio en unidades.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Experimento empanadas». \textbf{Formato:} ficha con los 5 cálculos. \textbf{Sabes que terminaste cuando} entiendes la fórmula básica del punto de equilibrio.
sistematizacion:
  intro: |-
    Tu experimento muestra la lógica. Ahora necesitas la \textbf{anatomía profesional} del flujo de caja y punto de equilibrio.
  pilares:
  - |-
    Los \textbf{4 componentes del flujo de caja} se descomponen así: (1) \textbf{Ingresos proyectados por mes}: unidades vendidas × precio unitario. (2) \textbf{Costos fijos por mes}: arriendo (si aplica), suscripciones, sueldo propio si te lo asignas, internet, mantenimiento. (3) \textbf{Costos variables por mes}: materia prima × unidades, comisiones, envíos. (4) \textbf{Saldo del mes}: Ingresos menos (Fijos + Variables). Acumulado mes a mes muestra cuándo el negocio se sostiene.
  - |-
    La \textbf{fórmula del punto de equilibrio} (break-even) es la herramienta más importante: \texttt{Punto de equilibrio (unidades) = Costos fijos mensuales / Margen unitario}. El margen unitario es Precio menos Costo variable unitario. Ejemplo: si costos fijos son 200.000 pesos y vendes a 5.000 con costo variable 2.000 (margen 3.000), tu PE es 200.000/3.000 = 67 unidades al mes. Si esperas vender 100, hay margen. Si esperas vender 40, hay problema.
  - |-
    Los \textbf{3 escenarios} de proyección son disciplina profesional: (a) \textbf{Optimista}: si todo sale como esperas (100 por ciento de las ventas esperadas). (b) \textbf{Realista}: 60 por ciento del optimista (lo más probable según evidencia). (c) \textbf{Pesimista}: 30 por ciento del optimista (qué pasa si solo 3 de cada 10 cosas esperadas ocurren). La phronesis del emprendedor: \textbf{toma decisiones con base en el realista; planifica sostenibilidad con el pesimista}. El novato vive solo en el optimista y se quiebra.
  - |-
    Algoritmo: (1) elegir microemprendimiento (real o hipotético). (2) listar costos fijos mensuales. (3) calcular costo variable por unidad. (4) definir precio de venta. (5) calcular margen unitario. (6) calcular punto de equilibrio. (7) en Sheets, armar tabla de 3 meses con flujo de caja en 3 escenarios. (8) decidir viabilidad: viable / viable con ajustes / pivote / no viable.
  anatomia:
    titulo: Anatomía del flujo y punto de equilibrio
    body: |-
      \textbf{Flujo de caja:} ingresos menos fijos menos variables. \\[1mm] \textbf{Punto equilibrio:} fijos divididos entre margen unitario. \\[1mm] \textbf{3 escenarios:} pesimista 30 por ciento + realista 60 por ciento + optimista 100 por ciento. \\[1mm] \textbf{Decisión:} viable / ajustes / pivote / no viable.
  errores_comunes: |-
    (1) \textbf{Olvidar costos fijos invisibles}: dominio, suscripciones, mejoras. (2) \textbf{No separar fijos vs variables}: imposibilita calcular punto de equilibrio. (3) \textbf{Proyectar solo escenario optimista}: el novato siempre proyecta el techo. (4) \textbf{Confundir ingresos con utilidad}: ingresos brutos no son utilidad neta. (5) \textbf{Punto de equilibrio inalcanzable ignorado}: si necesitas vender 500 al mes y solo vendes 50, la respuesta no es \emph{``trabajar más''}; es replantear el modelo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía financiera». \textbf{Formato:} (a) 4 componentes del flujo; (b) fórmula del punto de equilibrio; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} podrías calcular punto de equilibrio de cualquier microemprendimiento.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- Proyección 3 meses + punto equilibrio + decisión} (40 min · individual con dispositivo). Hora de aplicar. Construyes flujo de caja 3 meses en Sheets, calculas PE, proyectas 3 escenarios, decides viabilidad.
  pilares:
  - |-
    Tu proyección se construye en 7 pasos: (1) elegir microemprendimiento (la idea de empanadas, o algo real que estés considerando, o uno hipotético: venta de postres, servicio de tutorías, microempresa familiar). (2) en Sheets, crear nueva hoja \emph{Proyección}. (3) tabla de costos fijos mensuales. (4) tabla de costo variable por unidad y precio. (5) calcular punto de equilibrio con fórmula. (6) tabla de flujo de caja 3 meses con 3 escenarios (3 columnas: pesimista, realista, optimista). (7) decidir viabilidad con justificación.
  - |-
    Sigue el patrón \textbf{``decidir con realista, planear sostenibilidad con pesimista''}: si tu escenario realista alcanza el punto de equilibrio en el mes 3, el negocio es viable. Si solo el optimista lo alcanza y el realista falla, requiere ajustes. Si ni el optimista alcanza, no es viable como está y necesita pivote (cambiar precio, mercado o producto).
  - |-
    Las \textbf{4 decisiones posibles} con criterios claros: (a) \textbf{Viable}: realista alcanza PE en mes 3 o antes. (b) \textbf{Viable con ajustes}: realista cerca del PE pero necesita reducir 1-2 costos o subir precio. (c) \textbf{Requiere pivote}: realista no alcanza PE en 6 meses; cambiar modelo. (d) \textbf{No viable}: ni el optimista alcanza PE; replantear desde cero.
  - |-
    Algoritmo: (1) elegir microemprendimiento. (2) costos fijos. (3) costo variable + precio. (4) margen. (5) punto de equilibrio. (6) flujo 3 meses en 3 escenarios. (7) decisión con justificación numérica.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Microemprendimiento elegido (real o hipotético). \\[1mm] \checkbox Costos fijos identificados. \\[1mm] \checkbox Costo variable y precio unitario calculados. \\[1mm] \checkbox Punto de equilibrio calculado con fórmula. \\[1mm] \checkbox Flujo de caja 3 meses en 3 escenarios. \\[1mm] \checkbox Decisión de viabilidad con justificación. \\[1mm] \checkbox Plantilla guardada para reuso.
  plantilla_guion: |-
    \textbf{Microemprendimiento.} \textit{Real o hipotético.} \\[1mm] \textbf{Costos fijos.} \textit{Lista mensual.} \\[1mm] \textbf{Margen unitario.} \textit{Precio menos costo variable.} \\[1mm] \textbf{Punto equilibrio.} \textit{Fijos divididos entre margen.} \\[1mm] \textbf{Flujo 3 meses.} \textit{3 escenarios.} \\[1mm] \textbf{Decisión.} \textit{Viable / ajustes / pivote / no viable.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- Mi proyección 3 meses». \textbf{Formato:} (a) link al Sheets; (b) cálculos clave; (c) decisión justificada. \textbf{Sabes que terminaste cuando} podrías defender tu decisión con números.
  producto_titulo: Flujo 3 meses + punto de equilibrio + 3 escenarios + decisión
  criterios:
  - Microemprendimiento concreto elegido
  - Costos fijos y variables separados
  - Punto de equilibrio calculado con fórmula
  - 3 escenarios proyectados
  - Decisión documentada con justificación numérica
  - Plantilla reusable
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Proyectar antes de emprender protege al microempresario de la ruina; lanzar sin números es entregarse a la suerte del sistema.
    aplicacion: |-
      Muchos microemprendimientos del barrio fracasan no por falta de esfuerzo, sino por falta de proyección previa. La filosofía de la liberación pide ese cuidado: \textbf{calcular antes de invertir tiempo y dinero}. La phronesis económica del emprendedor consiste en \textbf{no enamorarse de la idea sin verificar los números}.
    pregunta_espejo: |-
      ¿Mi proyección protege al microemprendedor de la ruina, o solo confirma lo que quería oír?
  estoico:
    autor: Séneca
    cita: |-
      La sobriedad del cálculo es virtud financiera; el optimismo sin números es vicio que se descubre tarde.
    aplicacion: |-
      Es tentador proyectar solo el escenario optimista y declarar el negocio viable. La sabiduría estoica recomienda lo opuesto: \emph{proyecta los 3 escenarios y decide con el realista}. La phronesis del emprendedor honra la verdad numérica sobre el deseo.
    pregunta_espejo: |-
      ¿Estoy proyectando los 3 escenarios honestamente, o vivo solo en el optimista?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Las decisiones empresariales basadas en datos verificables son la nueva ética emprendedora del siglo XXI.
    aplicacion: |-
      En la era de la información, los emprendedores que decidem con datos sobreviven más que los que deciden por intuición. La ética del emprendimiento contemporáneo pide proyecciones explícitas. Tu plantilla de hoy te entrena en esa práctica que rige todo emprendimiento profesional: \textbf{decidir con números, no con sentimientos}.
    pregunta_espejo: |-
      ¿Mis decisiones están sustentadas en datos verificables, o las tomo solo con corazonadas?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu proyección de 3 meses y la decisión justificada. En la sesión 5 vas a aprender \textbf{visualización de datos contables con IA}: gráficos automáticos honestos para presentar tu microemprendimiento. La proyección de hoy es la materia; los gráficos de mañana son la comunicación visual.
web:
  conceptos_clave:
    - termino: Flujo de caja
      definicion: |-
        Tabla mes a mes con ingresos proyectados - egresos proyectados = saldo. Acumulado, muestra cuándo el negocio tiene caja positiva o negativa.
      ejemplo: |-
        Mes 1, ingresos $300.000, egresos $400.000, saldo -$100.000. Mes 2, -$50.000 acumulado. Necesitas capital inicial.
      emoji: "💧"
    - termino: Costos fijos
      definicion: |-
        Ocurren cada mes existan o no ventas: arriendo, suscripciones SaaS, sueldos. Marcan el piso de gastos.
      ejemplo: |-
        Arriendo del local $200.000 + suscripción de Canva $30.000 = $230.000 fijos mensuales.
      emoji: "🏠"
    - termino: Costos variables
      definicion: |-
        Dependen del volumen de ventas: materia prima, comisiones, envíos. Suben con cada unidad vendida.
      ejemplo: |-
        Cada brownie cuesta $1.500 producir. Si vendes 50, los variables suman $75.000. Si vendes 100, $150.000.
      emoji: "📦"
    - termino: Punto de equilibrio
      definicion: |-
        Costos fijos / (Precio unitario - Costo variable unitario). Responde cuántas ventas necesitas para cubrir los costos.
      ejemplo: |-
        Fijos $200.000, precio $5.000, variable $1.500. PE = 200.000/3.500 = 57 ventas mensuales para equilibrarse.
      emoji: "⚖️"
    - termino: 3 escenarios
      definicion: |-
        Pesimista (30%), realista (60%) y optimista (100%) del esperado. Decides con realista; sostienes con pesimista.
      ejemplo: |-
        Esperas vender 100. Modelas con 30, 60 y 100. Si el negocio cae a pesimista, debe seguir vivo.
      emoji: "🎲"
  quiz:
    titulo: ¿Proyectas tu microemprendimiento con datos?
    instrucciones: 5 preguntas para verificar flujo de caja y punto de equilibrio.
    preguntas:
      - enunciado: ¿Cuál es la fórmula del punto de equilibrio?
        opciones:
          - Costos totales / 2
          - Costos fijos / (Precio unitario - Costo variable unitario)
          - Ventas + Ganancias
          - No tiene fórmula
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Costos fijos / (Precio - Costo variable). Da unidades mínimas para no perder.
        feedback_incorrecto: |-
          Es Costos fijos / (Precio unitario - Costo variable unitario). Da unidades mínimas a vender.
      - enunciado: Los costos que ocurren cada mes existan o no ventas se llaman...
        opciones:
          - Variables
          - Fijos
          - Imaginarios
          - Opcionales
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Fijos. Arriendo, suscripciones, sueldos.
        feedback_incorrecto: |-
          Costos fijos. Existan o no ventas, hay que cubrirlos cada mes.
      - enunciado: ¿Cuántos escenarios mínimos modela el flujo de caja profesional?
        opciones:
          - "1"
          - "3"
          - "100"
          - "0"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 3: pesimista, realista, optimista.
        feedback_incorrecto: |-
          Son 3 escenarios: pesimista (30%), realista (60%) y optimista (100%) del esperado.
      - enunciado: Tu PE es 200 ventas/mes y vendes 50. ¿Qué indica?
        opciones:
          - Negocio rentable
          - Problema estructural: necesitas reducir costos fijos o subir precio
          - Ya está bien
          - No importa
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Si el PE supera mucho las ventas reales, el modelo necesita ajuste.
        feedback_incorrecto: |-
          Indica problema estructural. Hay que reducir costos fijos, subir precio o cambiar producto.
      - enunciado: La regla "ningún microemprendimiento sin proyección a 3 meses sobrevive al cuarto" significa que...
        opciones:
          - Hay que cerrar todo
          - Sin proyección financiera, el negocio se sostiene por suerte hasta que falla
          - 3 meses es lo máximo
          - No hay que proyectar
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Sin proyección, las sorpresas matan al negocio. La proyección anticipa el problema.
        feedback_incorrecto: |-
          Sin proyección, el negocio se sostiene por suerte. La proyección anticipa problemas mientras hay tiempo.

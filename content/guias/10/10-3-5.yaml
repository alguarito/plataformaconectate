clave: 3-5
grado: 10
periodo: 3
sesion: 5
completo: true
titulo: Visualización de datos contables con IA --- gráficos honestos
titulo_portada: |-
  Visualización ---
  gráficos contables
  honestos con IA
producto_final: |-
  3 gráficos hechos sobre tus datos contables reales del periodo (sesiones 2-4) en Google Sheets (a) gráfico de barras comparando egresos por categoría, (b) gráfico de líneas mostrando evolución del balance semanal, (c) gráfico circular con proporción de cada categoría sobre el total + crítica analítica de 1 gráfico engañoso real (publicidad, prensa o redes sociales) identificando al menos 3 errores de honestidad visual + propuesta de cómo lo redibujarías para que sea honesto
apertura:
  saber_ancestral: |-
    En las plazas de mercado del centro de Cartago, en la galería de Pereira, en las ferias del Quindío, hubo una figura que sostenía la honestidad del comercio: \textbf{el pregonero del mercado}. No era el vendedor; era el que pregonaba productos y precios desde una caseta alta. \emph{``Llegó la naranja del Valle a mil quinientos el kilo, llegó el café del Quindío a quince mil la libra''}. Pero hacía algo más: cuando un comprador se acercaba con duda sobre peso o precio, el pregonero \textbf{mostraba la pesa visible al cliente}. Sacaba la balanza, ponía el producto, dejaba que el cliente leyera la cifra. La pesa visible era \textbf{prueba pública de honestidad}: \emph{``vea, dos kilos justos''}, decía señalando el contrapeso. El comprador miraba, aprobaba, pagaba. La sabiduría era inquebrantable: \textbf{el comerciante que ocultaba la pesa perdía la clientela del barrio entero en una semana}. Esa práctica ancestral se traduce al gráfico contable moderno: \textbf{el gráfico honesto muestra los datos como son; el manipulado los esconde o exagera}.
  saber_contemporaneo: |-
    La \textbf{visualización de datos} es la práctica de convertir números en imágenes que comuniquen información de manera rápida y precisa. Sus 3 tipos básicos para datos contables: (1) \textbf{Gráfico de barras}: ideal para comparar valores entre categorías (cuánto se gastó en cada categoría este mes). (2) \textbf{Gráfico de líneas}: ideal para mostrar evolución en el tiempo (balance semanal a lo largo del periodo). (3) \textbf{Gráfico circular} (pastel): ideal para proporciones del total (qué porcentaje de los egresos fue alimentación). En Google Sheets, los gráficos se generan automáticamente: seleccionar tabla → Insertar → Gráfico → Sheets sugiere el tipo o eliges tú. Los \textbf{5 principios de honestidad visual} son irrenunciables: (a) \textbf{Eje Y desde cero} en gráficos de barras (salvo justificación explícita). (b) \textbf{Escala consistente}: si el eje muestra miles, todos los valores en miles. (c) \textbf{Sin 3D engañoso}: el efecto 3D distorsiona proporciones. (d) \textbf{Etiquetas legibles}: cada barra o segmento con su nombre y valor. (e) \textbf{Título descriptivo}: que diga qué muestra el gráfico, no solo \emph{``Gráfico 1''}. La regla profesional: \textbf{si tu gráfico necesita explicación verbal extensa, está mal diseñado}.
  pregunta_puente: |-
    ¿Qué sabía el pregonero al mostrar la pesa visible al comprador, que el novato olvida cuando publica gráficos con eje Y truncado? ¿Y por qué los 5 principios de honestidad visual valen más que las plantillas elegantes mal aplicadas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuándo conviene barras, líneas o circular según el tipo de dato y la pregunta; (2) \textbf{analizar} un gráfico real (publicitario o periodístico) detectando errores de honestidad visual; (3) \textbf{crear} 3 gráficos honestos en Sheets sobre tus datos contables reales; (4) \textbf{evaluar} tu propio gráfico aplicando los 5 principios.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 2-4 produjiste contabilidad personal y proyección financiera. Hoy aprendes a \textbf{comunicar esos datos visualmente con honestidad}. Las próximas sesiones (encuestas de mercado, Canvas, comunicación empresarial, proyecto) usarán los gráficos honestos como base de presentación.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{auditoría rápida}: busca 1 gráfico real en una publicidad reciente (puede ser de un banco, una tienda, una marca de comida) y otro 1 en una noticia de periódico o canal. Anota qué te llama la atención de cada uno.
  a_sistematizacion: |-
    Ya tienes 2 gráficos reales. Ahora vas a entender la \textbf{anatomía de los 3 tipos básicos} y los 5 principios de honestidad visual.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: generas 3 gráficos honestos en Sheets con tus datos contables, criticas 1 gráfico engañoso real, propones cómo redibujarlo.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 3 gráficos honestos + crítica de 1 engañoso + propuesta de corrección. El criterio principal: que tus gráficos comuniquen los datos con honestidad y que sepas reconocer cuándo otros mienten visualmente.
  a_evaluacion: |-
    Antes de cerrar, mira los gráficos desde las cinco dimensiones humanas. Mostrar los datos como son es respeto por el lector; manipular visualmente es traición al oficio de la información.
  a_triangulo: |-
    Y para terminar, tres voces sobre la honestidad visual. Dussel sobre los gráficos que respetan al lector apurado, Marco Aurelio sobre la simplicidad como virtud visual, Floridi sobre la visualización honesta como ética informacional.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Auditoría de 2 gráficos reales} (15 min · individual con dispositivo). Busca en internet o redes: (1) \textbf{Gráfico publicitario}: una publicidad de banco, tienda, marca, política. (2) \textbf{Gráfico periodístico}: una noticia de prensa o canal con gráfico. Para cada uno, anota: (a) ¿qué tipo de gráfico es (barras, líneas, circular, otro)? (b) ¿el eje Y empieza en cero o en otro valor? (c) ¿hay efecto 3D? (d) ¿qué te llama la atención? (e) ¿alguno parece exagerar o esconder algo?.
  checks:
  - Encontré 2 gráficos reales (publicitario + periodístico).
  - Anoté tipo, ejes, efectos visuales.
  - Detecté si alguno parece manipulado.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 2 gráficos bajo la lupa». \textbf{Formato:} captura o referencia de cada gráfico + 5 preguntas respondidas. \textbf{Sabes que terminaste cuando} ves que la honestidad visual no se da por sentada.
sistematizacion:
  intro: |-
    Tu auditoría te muestra que la honestidad varía. Ahora necesitas la \textbf{anatomía profesional} de los 3 tipos básicos y los 5 principios de honestidad visual.
  pilares:
  - |-
    Los \textbf{3 tipos básicos} se descomponen así: (1) \textbf{Barras}: comparar valores entre categorías. Para tus egresos: cuánto en transporte vs alimentación vs ocio. Las barras pueden ser verticales u horizontales. (2) \textbf{Líneas}: mostrar evolución en el tiempo. Para tu balance: cómo cambió de la semana 1 a la 2 a la 3. Las líneas conectan puntos en orden cronológico. (3) \textbf{Circular} (pastel): mostrar proporción del total. Para tus egresos: qué porcentaje del total fue alimentación, transporte, ocio. Solo funciona con pocas categorías (3-6 máximo) y cuando la suma tiene sentido conceptual.
  - |-
    Los \textbf{5 principios de honestidad visual} son ley del oficio: (a) \textbf{Eje Y desde cero}: en gráficos de barras siempre. Empezar el eje en valor no cero exagera diferencias pequeñas. (b) \textbf{Escala consistente}: si miden miles, todos en miles. No mezclar millones con miles sin etiquetar. (c) \textbf{Sin 3D engañoso}: el efecto 3D distorsiona proporciones reales. Mantenerse en 2D. (d) \textbf{Etiquetas legibles}: nombres de categorías y valores numéricos visibles. (e) \textbf{Título descriptivo}: que diga qué muestra el gráfico (\emph{``Egresos por categoría, semana 1-4''} mejor que \emph{``Mi gráfico''}).
  - |-
    El patrón profesional fundamental: \textbf{cada tipo de gráfico responde una pregunta distinta}. Barras responden \emph{``¿cuánto es cada uno?''}. Líneas responden \emph{``¿cómo cambió en el tiempo?''}. Circular responde \emph{``¿qué porcentaje del total?''}. Elegir mal el tipo distorsiona la comunicación. La phronesis del oficio consiste en \textbf{elegir el tipo de gráfico según la pregunta, no según la estética}.
  - |-
    Algoritmo: (1) en tu plantilla de Sheets, seleccionar la tabla de datos. (2) Insertar → Gráfico. (3) Sheets sugiere tipo; verificar que es el correcto para tu pregunta. (4) verificar eje Y desde cero. (5) editar título descriptivo. (6) agregar etiquetas si Sheets no lo hizo. (7) eliminar efectos 3D si los hay. (8) verificar legibilidad imprimiendo o viendo en celular.
  anatomia:
    titulo: Anatomía de gráficos honestos
    body: |-
      \textbf{Barras:} comparar valores entre categorías. \\[1mm] \textbf{Líneas:} mostrar evolución en el tiempo. \\[1mm] \textbf{Circular:} proporciones del total (máx 3-6 categorías). \\[1mm] \textbf{5 principios:} eje cero / escala / no 3D / etiquetas / título.
  errores_comunes: |-
    (1) \textbf{Eje Y truncado}: empezar en valor distinto de cero exagera. (2) \textbf{3D que distorsiona}: las proporciones cambian con el ángulo. (3) \textbf{Circular con muchas categorías}: ilegible con más de 6. (4) \textbf{Tipo equivocado}: usar circular para evolución temporal. (5) \textbf{Sin título o título vago}: imposible saber qué muestra. (6) \textbf{Sin fuente declarada}: imposible verificar los datos. (7) \textbf{Colores arbitrarios sin propósito}.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía gráficos honestos». \textbf{Formato:} (a) 3 tipos con uso típico; (b) 5 principios; (c) los 7 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías auditar cualquier gráfico real.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- 3 gráficos honestos + crítica + propuesta} (40 min · individual con dispositivo). Hora de aplicar. Generas 3 gráficos en Sheets con tus datos contables, criticas 1 gráfico engañoso real, propones cómo redibujarlo.
  pilares:
  - |-
    Tus 3 gráficos se construyen en 5 pasos: (1) abrir tu plantilla Sheets contable con datos de las 2 semanas. (2) \textbf{Gráfico de barras}: seleccionar columna de categorías + columna de totales por categoría, Insertar Gráfico. (3) \textbf{Gráfico de líneas}: seleccionar fechas + columna de balance acumulado por semana. (4) \textbf{Gráfico circular}: seleccionar categorías + totales (Sheets sugiere circular si las categorías son pocas). (5) editar títulos descriptivos y verificar los 5 principios de honestidad en los 3.
  - |-
    La \textbf{crítica de 1 gráfico engañoso} se hace tomando un gráfico real (publicitario o periodístico) e identificando concretamente: (a) qué principio de honestidad viola. (b) qué impresión falsa genera al lector. (c) cómo lo redibujarías para que sea honesto. Ejemplo: \emph{``La publicidad del banco X muestra que las tasas de interés bajaron 0.5 por ciento, pero el gráfico hace parecer que bajaron 50 por ciento al usar eje Y desde 5 por ciento''}.
  - |-
    Sigue el patrón \textbf{``honestidad antes que estética''}: un gráfico funcional y honesto vale más que uno bonito y engañoso. La phronesis del oficio consiste en \textbf{rechazar el adorno que oculta la verdad}.
  - |-
    Algoritmo: (1) 3 gráficos en Sheets con tus datos. (2) verificación de los 5 principios en cada uno. (3) elección de gráfico engañoso real. (4) análisis de errores. (5) propuesta de redibujado.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 3 gráficos sobre datos contables reales. \\[1mm] \checkbox Tipo apropiado para cada pregunta. \\[1mm] \checkbox Eje Y desde cero en barras y líneas. \\[1mm] \checkbox Sin efecto 3D. \\[1mm] \checkbox Títulos descriptivos en los 3. \\[1mm] \checkbox 1 gráfico engañoso analizado con 3 errores. \\[1mm] \checkbox Propuesta de redibujado clara.
  plantilla_guion: |-
    \textbf{Gráfico 1 (barras).} \textit{Egresos por categoría.} \\[1mm] \textbf{Gráfico 2 (líneas).} \textit{Balance semanal.} \\[1mm] \textbf{Gráfico 3 (circular).} \textit{Proporción de egresos.} \\[1mm] \textbf{Crítica.} \textit{Gráfico real + 3 errores + redibujado.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- 3 gráficos honestos + crítica». \textbf{Formato:} (a) capturas de los 3 gráficos; (b) gráfico engañoso analizado; (c) propuesta de redibujado. \textbf{Sabes que terminaste cuando} tus 3 gráficos comunican tus datos con honestidad.
  producto_titulo: 3 gráficos honestos sobre datos reales + crítica + redibujado
  criterios:
  - 3 tipos distintos (barras, líneas, circular)
  - Datos contables reales del periodo
  - 5 principios de honestidad aplicados
  - Crítica de gráfico engañoso con 3 errores
  - Propuesta clara de redibujado
  - Títulos descriptivos en todos
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un gráfico honesto respeta al lector apurado; uno manipulado le quita el tiempo y le miente.
    aplicacion: |-
      La mayoría de las personas que verán tus gráficos los miran en redes, prensa rápida, presentaciones con luz baja. La filosofía de la liberación pide diseñar para esa condición: \textbf{gráficos que comuniquen verdad al primer vistazo}. La phronesis del oficio visual consiste en \textbf{no engañar a quien no tiene tiempo de verificar}.
    pregunta_espejo: |-
      ¿Mis gráficos respetan al lector apurado con verdad clara, o lo engañan exagerando con trucos visuales?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Mostrar los datos como son es virtud visual; manipular para impactar es vicio del comunicador.
    aplicacion: |-
      Es tentador exagerar diferencias para que el gráfico \emph{``impresione''}. La sabiduría estoica recomienda lo opuesto: \emph{muestra las diferencias como son, ni más grandes ni más pequeñas}. Si la diferencia es del 2 por ciento, el gráfico debe mostrarla del 2 por ciento. El impacto visual no debe contradecir la verdad de los datos.
    pregunta_espejo: |-
      ¿Mis gráficos muestran los datos como son, o los exagero para que impresionen?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La visualización honesta es ética informacional en la era de los gráficos virales.
    aplicacion: |-
      En la era de la información, los gráficos circulan más rápido que los datos. La gente comparte sin verificar. La ética digital pide que quien produce gráficos respete esa velocidad de circulación produciendo gráficos honestos que sigan siendo correctos al compartirse sin contexto.
    pregunta_espejo: |-
      Si mis gráficos se compartieran en redes sin mi explicación, ¿seguirían comunicando la verdad?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus 3 gráficos honestos y la crítica del engañoso. En la sesión 6 vas a aprender a hacer \textbf{encuestas y análisis de mercado con IA} para microemprendimiento. Los gráficos contables de hoy son tu economía personal; las encuestas de mercado de mañana son el ojo a tus clientes potenciales.
web:
  conceptos_clave:
    - termino: Gráfico de barras
      definicion: |-
        Ideal para comparar valores entre categorías. Cada barra representa una categoría con su altura proporcional al valor.
      ejemplo: |-
        Compara cuánto se gastó este mes en transporte, alimentación, ocio y salud con 4 barras lado a lado.
      emoji: "📊"
    - termino: Gráfico de líneas
      definicion: |-
        Ideal para mostrar evolución en el tiempo. Une los puntos con líneas para visualizar la tendencia.
      ejemplo: |-
        Balance semanal a lo largo de 12 semanas: una línea que sube y baja muestra la trayectoria de la cuenta.
      emoji: "📈"
    - termino: Gráfico circular
      definicion: |-
        Ideal para proporciones del total. Cada segmento es una porción del 100%. Útil con pocas categorías (3-6).
      ejemplo: |-
        Composición del egreso del mes: 40% alimentación, 30% transporte, 20% ocio, 10% ahorro.
      emoji: "🥧"
    - termino: Eje Y desde cero
      definicion: |-
        Principio de honestidad en gráficos de barras. Si el eje no parte de cero, las diferencias se exageran visualmente.
      ejemplo: |-
        Dos barras con valores 100 y 105 deberían parecer casi iguales; si el eje empieza en 99, parecen muy distintas.
      emoji: "0️⃣"
    - termino: Honestidad visual (5 principios)
      definicion: |-
        Eje Y desde cero, escala consistente, sin 3D engañoso, etiquetas legibles, título descriptivo. Reglas no negociables.
      ejemplo: |-
        Antes de presentar tu gráfico, lo revisas con los 5 principios. Si falla uno, lo arreglas, no lo defiendes.
      emoji: "🪞"
  quiz:
    titulo: ¿Diseñas gráficos honestos?
    instrucciones: 5 preguntas para verificar los 5 principios.
    preguntas:
      - enunciado: ¿Qué gráfico usarías para mostrar evolución del balance a lo largo de 12 semanas?
        opciones:
          - Circular
          - Barras 3D rotativas
          - Líneas
          - Ninguno
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. El gráfico de líneas muestra evolución en el tiempo de forma clara.
        feedback_incorrecto: |-
          Líneas. El gráfico de líneas es el indicado para tendencia temporal.
      - enunciado: ¿Por qué el eje Y debe partir de cero en barras?
        opciones:
          - Por costumbre
          - Porque ahorra tinta
          - Porque es obligatorio legal
          - Porque eje no nulo exagera las diferencias visuales
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. Si el eje no parte de cero, las diferencias se inflan visualmente y engañan al lector.
        feedback_incorrecto: |-
          Eje desde cero evita exagerar diferencias. Es regla de honestidad visual.
      - enunciado: ¿Cuántos principios de honestidad visual son irrenunciables?
        opciones:
          - "1"
          - "5"
          - "100"
          - "0"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 5: eje desde cero, escala consistente, sin 3D, etiquetas legibles, título descriptivo.
        feedback_incorrecto: |-
          Son 5 principios. Faltar a uno produce gráfico que comunica mal o engaña.
      - enunciado: La regla "si tu gráfico necesita explicación verbal extensa, está mal diseñado" significa que...
        opciones:
          - El gráfico no comunica por sí solo
          - Hay que hablar mucho siempre
          - Los gráficos son opcionales
          - Las palabras son lo único válido
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Un buen gráfico se entiende casi solo. Si necesita 5 minutos de aclaración, falló el diseño.
        feedback_incorrecto: |-
          Significa que el gráfico no comunica por sí solo. La explicación complementa, no reemplaza al diseño.
      - enunciado: ¿Qué tipo de gráfico es mejor para mostrar proporciones del egreso total?
        opciones:
          - Circular
          - Líneas
          - Barras
          - Ninguno
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. El circular es ideal para proporciones del 100% con pocas categorías.
        feedback_incorrecto: |-
          Circular. Muestra cada categoría como porcentaje del total.

clave: 3-6
grado: 10
periodo: 3
sesion: 6
completo: true
titulo: Encuestas y análisis de mercado con IA
titulo_portada: |-
  Encuestas y análisis
  de mercado
  con IA
producto_final: |-
  Mini-estudio de mercado completo para un microemprendimiento real o hipotético (puede ser el mismo de la sesión 4) con (a) encuesta de 8-10 preguntas diseñada en Google Forms y revisada con IA (siguiendo método de la sesión 5 del P2), (b) aplicación a 15-20 personas del entorno cercano (familia, vecinos, compañeros, clientes potenciales), (c) análisis cualitativo y cuantitativo con asistencia de IA auditada, (d) 3 hallazgos numéricos clave, (e) 1 decisión razonada y documentada sobre qué producto o servicio ofrecer y con qué características
apertura:
  saber_ancestral: |-
    En las tiendas, panaderías y talleres del centro de Cartago, hubo durante décadas una práctica que cualquier comerciante experimentado conocía: \textbf{nunca pedir mercancía sin antes preguntar a la clientela}. Antes de hacer pedido grande al proveedor, el tendero hablaba con sus clientes habituales: \emph{``¿qué les hace falta últimamente?''}, \emph{``¿qué les gustaría que trajera?''}, \emph{``¿qué precio pagarían?''}. La panadera preguntaba si querían más pan blanco o más integral. La modista preguntaba si la moda local iba hacia colores claros u oscuros. El tendero del barrio Obrero conocía a sus 50 clientes habituales por nombre y sabía qué preferían. Esa práctica tenía un nombre que los microempresarios no usaban pero practicaban: \textbf{investigación de mercado}. La sabiduría era ancestral y precisa: \textbf{el comerciante que no escucha a su clientela pierde la clientela}. La investigación de mercado moderna formaliza con IA lo que el tendero hacía de manera intuitiva: preguntar a la audiencia antes de invertir tiempo y dinero en un producto.
  saber_contemporaneo: |-
    Un \textbf{estudio de mercado} es la investigación que precede al lanzamiento de cualquier microemprendimiento. Responde 5 preguntas básicas: (1) \textbf{¿Quién es el cliente?}: edad, contexto, hábitos, ubicación. (2) \textbf{¿Qué necesita?}: problema real, no inventado. (3) \textbf{¿Cuánto está dispuesto a pagar?}: rango de precios aceptable. (4) \textbf{¿Cuál es la competencia?}: qué alternativas existen ya. (5) \textbf{¿Cómo nos enteramos?}: por qué canal el cliente conoce productos similares. La regla profesional: \textbf{ningún microemprendimiento sin estudio de mercado previo sobrevive a competencia básica}. El estudio combina: (a) \textbf{Encuesta cuantitativa}: Google Forms con preguntas cerradas a 15-20 personas. (b) \textbf{Análisis cualitativo}: respuestas abiertas analizadas con IA siguiendo método auditado de S6 del P2. (c) \textbf{Síntesis con hallazgos numéricos}: 3-5 cifras clave que dirijan decisión. (d) \textbf{Decisión razonada}: qué producto o servicio ofrecer, a qué precio, con qué características. La IA acelera análisis pero la decisión final sigue siendo del emprendedor.
  pregunta_puente: |-
    ¿Qué sabía el tendero al preguntar a sus 50 clientes antes de hacer pedido grande, que el emprendedor novato olvida cuando lanza microempresa basado en \emph{``yo creo que la gente quiere esto''}? ¿Y por qué 15-20 entrevistados reales valen más que mil suposiciones?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 5 preguntas básicas que todo estudio de mercado debe responder; (2) \textbf{analizar} las respuestas de tu encuesta con asistencia de IA auditada; (3) \textbf{aplicar} las habilidades de S5 del P2 (encuesta con phronesis) al contexto comercial; (4) \textbf{evaluar} qué producto o servicio lanzar con criterio basado en datos reales.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 4 proyectaste flujo de caja de un microemprendimiento. Hoy validas si tu microemprendimiento tiene mercado real. Las próximas sesiones (Canvas, comunicación, proyecto integrador, sustentación) usarán los hallazgos del estudio de mercado.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{conversación corta}: piensa en el microemprendimiento de la sesión 4 (real o hipotético) y conversa 5 minutos con 1 persona de tu entorno (mamá, hermano, vecino) sobre si compraría el producto o servicio. Anota qué te dijo.
  a_sistematizacion: |-
    Ya tienes 1 conversación. Ahora vas a entender la \textbf{anatomía del estudio de mercado}: 5 preguntas básicas, estructura de la encuesta, análisis con IA.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: diseñas encuesta de 8-10 preguntas, la aplicas a 15-20 personas durante la semana, analizas con IA auditada, sacas 3 hallazgos, decides.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: estudio de mercado completo + hallazgos + decisión. El criterio principal: que tu decisión final tenga sustento en datos, no en intuición.
  a_evaluacion: |-
    Antes de cerrar, mira el estudio desde las cinco dimensiones humanas. Preguntar a la audiencia antes de lanzar es respeto por el cliente potencial; inventar lo que quiere es desperdicio garantizado.
  a_triangulo: |-
    Y para terminar, tres voces sobre la escucha al mercado. Dussel sobre los estudios que escuchan a comunidades reales, Marco Aurelio sobre la disciplina de preguntar antes de afirmar, Floridi sobre el dato del cliente como ética emprendedora.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Conversación corta con 1 cliente potencial} (15 min · individual). Toma el microemprendimiento de la sesión 4. Conversa 5-10 minutos con 1 persona de tu entorno (mamá, hermano, vecino, amigo) que podría ser cliente potencial. Pregunta de manera natural: (1) ¿usarías un producto como X? (2) ¿qué pagarías por él? (3) ¿qué te detendría de comprarlo? (4) ¿qué alternativas conoces ya? (5) ¿cómo te enteras de productos similares? Anota textualmente lo que te dijo (en sus palabras, no tu interpretación).
  checks:
  - Tuve conversación de 5-10 min con 1 persona.
  - Hice las 5 preguntas con naturalidad.
  - Anoté las respuestas textuales.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Conversación 1 cliente». \textbf{Formato:} ficha con las 5 preguntas y respuestas textuales. \textbf{Sabes que terminaste cuando} tienes voz real de un cliente potencial.
sistematizacion:
  intro: |-
    Tu conversación te dio voz real. Ahora necesitas la \textbf{anatomía profesional} del estudio de mercado con asistencia de IA.
  pilares:
  - |-
    Las \textbf{5 preguntas básicas} del estudio de mercado se descomponen así: (1) \textbf{Cliente}: ¿quién es la persona típica que compraría? Edad, contexto, hábitos. (2) \textbf{Necesidad}: ¿qué problema real resuelve mi producto? No invento; verifico. (3) \textbf{Precio}: ¿cuánto está dispuesto a pagar? Rango de precios aceptable. (4) \textbf{Competencia}: ¿qué alternativas existen? (otros productos, marcas, formas de resolver el mismo problema). (5) \textbf{Canal}: ¿cómo se entera el cliente de productos similares? (redes, voz a voz, publicidad).
  - |-
    La \textbf{estructura de la encuesta de mercado} en Google Forms: (a) \textbf{Sección demográfica} (2-3 preguntas): edad, contexto, hábito relacionado. (b) \textbf{Sección de necesidad} (2-3 preguntas): ¿enfrentas el problema X?, ¿con qué frecuencia? (c) \textbf{Sección de oferta} (2-3 preguntas): ¿usarías un producto como Y?, ¿qué pagarías? (d) \textbf{Sección abierta} (1-2 preguntas): ¿qué te detendría de comprar?, ¿qué mejorarías? Total: 8-10 preguntas. Tiempo de respuesta: 5-7 minutos.
  - |-
    El \textbf{análisis con IA auditada} sigue el método de S6 del P2: (1) recolectar 15-20 respuestas. (2) pasar respuestas abiertas a ChatGPT/Gemini con prompt de clasificación. (3) auditar respuesta por respuesta. (4) sacar hallazgos numéricos: \emph{``17 de 20 personas dijeron que pagarían entre 5.000 y 8.000''}, \emph{``12 mencionaron que les gustaría versión vegetariana''}. La regla: \textbf{los hallazgos son cifras, no opiniones del emprendedor}.
  - |-
    Algoritmo: (1) tomar microemprendimiento de S4. (2) diseñar encuesta 8-10 preguntas siguiendo S5 del P2 (con filtro de IA contra sesgos). (3) aplicar a 15-20 personas durante la semana. (4) analizar con IA auditada. (5) sacar 3 hallazgos numéricos clave. (6) decidir qué ajustar en tu microemprendimiento.
  anatomia:
    titulo: Anatomía del estudio de mercado
    body: |-
      \textbf{5 preguntas básicas:} cliente / necesidad / precio / competencia / canal. \\[1mm] \textbf{Encuesta:} 8-10 preguntas en 4 secciones. \\[1mm] \textbf{Aplicación:} 15-20 personas del entorno. \\[1mm] \textbf{Análisis:} IA auditada como en S6 del P2. \\[1mm] \textbf{Hallazgos:} 3-5 cifras clave para decisión.
  errores_comunes: |-
    (1) \textbf{Encuesta a solo amigos cercanos}: dirán que sí por cortesía. Incluir 3+ desconocidos. (2) \textbf{Preguntas hipotéticas sin precio}: \emph{``¿comprarías?''} sin decir cuánto cobra produce sí falsos. (3) \textbf{No analizar respuestas abiertas}: solo cuantitativo pierde matices. (4) \textbf{Aceptar lo que la IA dice sin auditar}. (5) \textbf{Decisión sin sustento numérico}: \emph{``creo que vendería bien''} no es decisión.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía estudio mercado». \textbf{Formato:} (a) las 5 preguntas básicas; (b) estructura encuesta; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} sabes diseñar encuesta de mercado sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- Estudio de mercado completo} (40 min en sesión + semana de aplicación · individual). Hora de aplicar. Diseñas encuesta, la aplicas a 15-20 personas, analizas con IA auditada, sacas hallazgos, decides.
  pilares:
  - |-
    Tu estudio se construye en 7 pasos: (1) tomar microemprendimiento de S4. (2) diseñar 8-10 preguntas en Forms cubriendo las 5 preguntas básicas. (3) revisar con filtro de IA para sesgos (S5 del P2). (4) durante la semana, aplicar a 15-20 personas. Mezclar: 5 cercanos, 5 menos cercanos, 5 desconocidos cuando se pueda. (5) analizar respuestas con IA + auditoría. (6) sacar 3 hallazgos numéricos clave. (7) decidir cambios al microemprendimiento basados en hallazgos.
  - |-
    Sigue el patrón \textbf{``pivotar con datos''}: el objetivo del estudio no es confirmar tu idea, es \textbf{descubrir si necesita ajuste}. Si los hallazgos indican que el precio que pensabas era muy alto, baja el precio. Si la mayoría no enfrenta el problema, replantea audiencia o producto. La phronesis del emprendedor consiste en \textbf{escuchar los datos aunque contradigan la idea inicial}.
  - |-
    Los \textbf{3 hallazgos numéricos} se formulan como afirmaciones con cifra. Ejemplos: (a) \emph{``17 de 20 encuestados (85 por ciento) enfrentan el problema X al menos 1 vez por semana''}. (b) \emph{``El precio promedio que están dispuestos a pagar es 6.500 pesos''}. (c) \emph{``12 de 20 (60 por ciento) prefieren versión sin gluten''}. Estos hallazgos dirigen decisiones.
  - |-
    Algoritmo: (1) diseñar encuesta. (2) filtro IA contra sesgos. (3) aplicar a 15-20 personas. (4) análisis con IA + auditoría. (5) 3 hallazgos numéricos. (6) decisión documentada de ajustes al microemprendimiento.
  checklist:
    titulo: Checklist al cerrar el estudio
    items: |-
      \checkbox Encuesta de 8-10 preguntas diseñada. \\[1mm] \checkbox Filtro IA contra sesgos aplicado. \\[1mm] \checkbox 15-20 respuestas recolectadas. \\[1mm] \checkbox Mezcla de cercanos, menos cercanos y desconocidos. \\[1mm] \checkbox Análisis con IA auditado. \\[1mm] \checkbox 3 hallazgos numéricos claros. \\[1mm] \checkbox Decisión documentada de ajustes.
  plantilla_guion: |-
    \textbf{Microemprendimiento.} \textit{Real o hipotético, de S4.} \\[1mm] \textbf{Encuesta.} \textit{8-10 preguntas en 4 secciones.} \\[1mm] \textbf{Aplicación.} \textit{15-20 personas mixtas.} \\[1mm] \textbf{Análisis.} \textit{IA + auditoría humana.} \\[1mm] \textbf{Hallazgos.} \textit{3 afirmaciones con cifra.} \\[1mm] \textbf{Decisión.} \textit{Ajustes documentados.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- Estudio de mercado». \textbf{Formato:} (a) link encuesta Forms; (b) tabla resultados; (c) análisis auditado; (d) 3 hallazgos; (e) decisión justificada. \textbf{Sabes que terminaste cuando} sabes con datos si tu microemprendimiento tiene mercado.
  producto_titulo: Estudio mercado + 15-20 respuestas + análisis IA + 3 hallazgos + decisión
  criterios:
  - Encuesta 8-10 preguntas con filtro IA
  - 15-20 respuestas con mezcla de audiencias
  - Análisis IA auditado
  - 3 hallazgos numéricos
  - Decisión documentada con ajustes
  - Microemprendimiento alineado con datos
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Escuchar al cliente potencial antes de lanzar es respeto por la comunidad que se pretende servir.
    aplicacion: |-
      Cuando preguntas a 15-20 personas reales antes de lanzar microempresa, estás respetando a esa comunidad como sujeto, no objeto de venta. La filosofía de la liberación pide ese acto: \textbf{escuchar antes de ofrecer}. La phronesis del emprendedor consiste en \textbf{ajustar el producto a la voz del cliente, no imponer lo que el emprendedor quiere vender}.
    pregunta_espejo: |-
      ¿Estoy escuchando a mis clientes potenciales antes de lanzar, o impongo lo que yo creo que quieren?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Preguntar antes de afirmar es virtud emprendedora; lanzar sin estudio es vanidad que se paga caro.
    aplicacion: |-
      Es tentador saltarse el estudio porque \emph{``ya sé lo que la gente quiere''}. La sabiduría estoica recomienda lo opuesto: \emph{pregunta antes de afirmar}. La intuición del emprendedor a veces acierta y muchas veces no. El estudio convierte intuición en información verificable.
    pregunta_espejo: |-
      ¿Estoy haciendo estudio honesto, o me lo salto creyendo que ya sé la respuesta?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los datos del cliente bien recolectados son ética emprendedora en la era de la información distribuida.
    aplicacion: |-
      En la era de la información, los emprendedores que tienen datos sobre sus clientes ganan ventaja sobre los que no. La ética emprendedora exige recolectar esos datos con respeto: consentimiento informado, preguntas neutras, análisis honesto. Tu estudio de hoy te entrena en esa práctica que rige todo emprendimiento serio del siglo XXI.
    pregunta_espejo: |-
      ¿Mis datos del cliente están recolectados con rigor profesional o solo con encuestas casuales?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu estudio de mercado completo y los 3 hallazgos. En la sesión 7 vas a usar esos datos para construir el \textbf{Business Model Canvas} con IA: el lienzo del negocio en 9 casillas. El estudio de hoy es la voz del mercado; el Canvas de mañana es la arquitectura del modelo.
web:
  conceptos_clave:
    - termino: Estudio de mercado
      definicion: |-
        Investigación previa al lanzamiento de un microemprendimiento. Responde 5 preguntas básicas sobre cliente, necesidad, precio, competencia y canal.
      ejemplo: |-
        Antes de vender brownies en el colegio, encuestas a 20 estudiantes sobre gustos, precios aceptables y dónde comprarían.
      emoji: "🔬"
    - termino: 5 preguntas básicas
      definicion: |-
        Quién es el cliente, qué necesita, cuánto está dispuesto a pagar, cuál es la competencia y por dónde se entera.
      ejemplo: |-
        Cliente, estudiantes de bachillerato. Necesidad, almuerzo rápido. Precio, $3.000-$5.000. Competencia, cafetería. Canal, voz a voz.
      emoji: "❓"
    - termino: Encuesta cuantitativa
      definicion: |-
        Google Forms con preguntas cerradas aplicada a 15-20 personas. Produce datos numéricos para detectar patrones.
      ejemplo: |-
        15 estudiantes responden "¿Cuánto pagarías por un brownie?" con opciones 2000, 3000, 4000, 5000.
      emoji: "📋"
    - termino: Análisis cualitativo auditado
      definicion: |-
        Respuestas abiertas clasificadas con IA y verificadas por el editor humano. Hereda método de S6 del P2.
      ejemplo: |-
        La IA agrupa comentarios en "precios", "sabor" y "presentación". Tú auditas: la categoría "sabor" tenía 2 ironías que reclasificas.
      emoji: "🔍"
    - termino: Decisión razonada
      definicion: |-
        Conclusión del estudio: qué producto o servicio ofrecer, a qué precio, con qué características. Sustentada en hallazgos concretos.
      ejemplo: |-
        "Ofrezco brownies a $3.500 con opción de glaseado, vendiendo en el descanso porque 70% prefiere comprar ahí."
      emoji: "🎯"
  quiz:
    titulo: ¿Diseñas estudios de mercado profesionales?
    instrucciones: 5 preguntas para verificar las 5 piezas obligatorias.
    preguntas:
      - enunciado: ¿Cuántas preguntas básicas responde un estudio de mercado?
        opciones:
          - "1"
          - "5"
          - "50"
          - "100"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 5: cliente, necesidad, precio, competencia y canal.
        feedback_incorrecto: |-
          Son 5. Sin respuesta a las 5, el estudio queda incompleto.
      - enunciado: ¿Cuántas respuestas mínimas pide la encuesta cuantitativa?
        opciones:
          - "15-20"
          - "1"
          - "1000"
          - "10000"
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. 15-20 respuestas mínimas dan base para detectar patrones.
        feedback_incorrecto: |-
          Son 15-20. Suficientes para análisis sin esfuerzo desproporcionado.
      - enunciado: ¿Qué pasa con un microemprendimiento sin estudio de mercado previo?
        opciones:
          - Tiene mejor suerte
          - No hay diferencia
          - No sobrevive a competencia básica
          - Llega más rápido
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Sin estudio, las decisiones se toman a ciegas y la competencia básica lo derrota.
        feedback_incorrecto: |-
          No sobrevive a competencia básica. El estudio previo es regla profesional.
      - enunciado: ¿Quién hace la decisión final del estudio?
        opciones:
          - La IA
          - El cliente
          - Nadie
          - El emprendedor con los datos en la mano
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. La IA acelera análisis; la decisión final es del emprendedor responsable.
        feedback_incorrecto: |-
          El emprendedor decide. La IA acelera análisis, pero la decisión y la firma son humanas.
      - enunciado: ¿Cuáles son las 4 piezas del estudio profesional?
        opciones:
          - Encuesta cuantitativa, análisis cualitativo auditado, síntesis y decisión razonada
          - Solo la encuesta
          - Solo el Canvas
          - Solo el balance
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Las 4 juntas convierten la curiosidad en decisión sustentada.
        feedback_incorrecto: |-
          Las 4: encuesta cuantitativa, análisis cualitativo auditado, síntesis y decisión razonada.

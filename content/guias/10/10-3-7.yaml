clave: 3-7
grado: 10
periodo: 3
sesion: 7
completo: true
titulo: Plan de negocio con IA --- Business Model Canvas asistido
titulo_portada: |-
  Plan de negocio ---
  Business Model Canvas
  asistido por IA
producto_final: |-
  Business Model Canvas completo del microemprendimiento con los 9 bloques llenos (segmento de clientes, propuesta de valor, canales, relaciones con clientes, fuentes de ingresos, recursos clave, actividades clave, socios clave, estructura de costos) + asistencia de IA para refinar al menos 3 bloques específicos + 3 supuestos críticos identificados que requerirán verificación con MVP en futuro + dibujo o documento del Canvas en formato visual (Canva, hoja apaisada, plantilla online gratuita)
apertura:
  saber_ancestral: |-
    En la galería del mercado del centro de Cartago, en las plazas comerciales de Cali y Buenaventura, en los pueblos del Pacífico colombiano, hubo durante siglos un oficio que cualquier comerciante del barrio practicaba sin llamarlo \emph{modelo de negocio}: \textbf{el trueque}. La señora traía racimo de plátano y se iba con pescado; el pescador llegaba con corvinas y volvía con queso; el quesero bajaba con cuajada y subía con frutas. Ese intercambio ancestral tenía una arquitectura silenciosa que cualquier emprendedor moderno reconocería: había un \textbf{segmento} (quién intercambiaba con quién), una \textbf{propuesta de valor} (qué daba cada uno), un \textbf{canal} (la plaza, el día, la hora), una \textbf{relación} (la confianza acumulada de años), una \textbf{moneda implícita} (volumen, calidad, frescura) y unos \textbf{recursos clave} (terreno, semilla, embarcación, conocimiento). El \textbf{Business Model Canvas} moderno no inventa nada nuevo: \textbf{ordena en 9 casillas lo que el trueque hacía intuitivamente}. La diferencia es la escala y la urgencia de hacerlo explícito. La IA hoy ayuda a refinar el Canvas, pero el criterio sigue siendo del emprendedor.
  saber_contemporaneo: |-
    El \textbf{Business Model Canvas} (BMC) fue creado por Alex Osterwalder en 2010 y es la herramienta visual más usada para diseñar modelos de negocio. Sus \textbf{9 bloques} se organizan en una hoja apaisada: (1) \textbf{Segmento de clientes}: para quién creas valor. (2) \textbf{Propuesta de valor}: qué problema resuelves o qué deseo satisfaces. (3) \textbf{Canales}: cómo entregas el valor (físico, digital, mixto). (4) \textbf{Relaciones con clientes}: cómo te relacionas con ellos (personal, automatizado, comunidad). (5) \textbf{Fuentes de ingresos}: de dónde sale el dinero (venta única, suscripción, comisión, etc.). (6) \textbf{Recursos clave}: qué necesitas tener (físico, intelectual, humano, financiero). (7) \textbf{Actividades clave}: qué haces para entregar el valor. (8) \textbf{Socios clave}: quién colabora contigo. (9) \textbf{Estructura de costos}: qué te cuesta operar. La regla profesional: \textbf{el Canvas se llena con datos verificables, no con suposiciones}. Los hallazgos del estudio de mercado (S6) alimentan al menos 3 bloques: segmento, propuesta de valor, fuentes de ingresos. La \textbf{IA como copiloto} ayuda a refinar bloques específicos con prompts como: \emph{``Actúa como mentor de emprendimiento. Aquí está el bloque X de mi Canvas: [pegar]. Sugiere 3 mejoras concretas''}.
  pregunta_puente: |-
    ¿Qué sabía el comerciante del trueque al tener clara la arquitectura silenciosa del intercambio, que el emprendedor novato olvida cuando arma negocio sin estructura? ¿Y por qué los \emph{supuestos críticos} del Canvas son más importantes que los bloques mismos?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 9 bloques del BMC y qué responde cada uno; (2) \textbf{analizar} qué bloques se sostienen en datos del estudio de mercado y cuáles aún son suposiciones; (3) \textbf{crear} el Canvas completo con asistencia de IA en al menos 3 bloques; (4) \textbf{evaluar} qué 3 supuestos críticos requerirán verificación con MVP futuro.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 6 hiciste estudio de mercado real. Hoy lo formalizas en el \textbf{lienzo del negocio}: 9 bloques que describen el modelo completo. Las próximas sesiones (comunicación empresarial, proyecto integrador, sustentación) usarán el Canvas como base de la propuesta final.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio del trueque}: pensar en el microemprendimiento de S4-S6 y responder en 1 frase cada una de las 9 preguntas del Canvas. Sin profundizar; solo identificar.
  a_sistematizacion: |-
    Ya tienes versión cruda. Ahora vas a entender la \textbf{anatomía profesional del Business Model Canvas}: 9 bloques, conexión con estudio de mercado, los 5 errores típicos.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: armas el Canvas completo en formato visual, usas IA para refinar 3 bloques específicos, identificas 3 supuestos críticos.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: Canvas visual + IA aplicada a 3 bloques + 3 supuestos críticos. El criterio principal: que el Canvas refleje datos reales del estudio de mercado, no suposiciones del emprendedor.
  a_evaluacion: |-
    Antes de cerrar, mira el Canvas desde las cinco dimensiones humanas. Diseñar el modelo con claridad es respeto por uno mismo y por futuros socios; improvisar el negocio es invitar al fracaso con buenos modales.
  a_triangulo: |-
    Y para terminar, tres voces sobre la arquitectura del negocio. Dussel sobre los modelos que sirven al cliente, Marco Aurelio sobre la disciplina de los 9 bloques, Floridi sobre el Canvas como instrumento de claridad estratégica.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Versión cruda del Canvas en 9 frases} (15 min · individual). Toma el microemprendimiento de S4-S6. Responde en 1 frase cada bloque del Canvas: (1) Segmento: ¿quién es mi cliente? (2) Propuesta de valor: ¿qué problema le resuelvo? (3) Canales: ¿cómo le entrego? (4) Relaciones: ¿cómo me relaciono con él? (5) Ingresos: ¿cómo me paga? (6) Recursos: ¿qué necesito tener? (7) Actividades: ¿qué hago? (8) Socios: ¿quién me ayuda? (9) Costos: ¿qué me cuesta? Sin profundizar; solo identificar.
  checks:
  - Respondí las 9 preguntas en 1 frase cada una.
  - Identifiqué dónde tengo claridad y dónde tengo dudas.
  - Reconozco que algunos bloques se sostienen en datos y otros aún no.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Canvas en 9 frases». \textbf{Formato:} 9 frases identificadas + marca de cuáles se sostienen en datos de S6 y cuáles aún son suposiciones. \textbf{Sabes que terminaste cuando} ves qué bloques necesitan más trabajo.
sistematizacion:
  intro: |-
    Tu Canvas crudo te muestra el panorama. Ahora necesitas la \textbf{anatomía profesional} de los 9 bloques y la conexión con datos reales.
  pilares:
  - |-
    Los \textbf{9 bloques del Canvas} se descomponen así: (1) \textbf{Segmento de clientes}: \emph{¿para quién creo valor?}. Pueden ser 1-3 segmentos distintos. (2) \textbf{Propuesta de valor}: \emph{¿qué problema resuelvo, qué beneficio entrego?}. La pieza más importante del Canvas. (3) \textbf{Canales}: \emph{¿cómo llego al cliente?} (físico, digital, mixto). (4) \textbf{Relaciones con clientes}: \emph{¿cómo me relaciono?} (personal, automatizado, comunidad, autoservicio). (5) \textbf{Fuentes de ingresos}: \emph{¿cómo cobro?} (venta única, suscripción, comisión, freemium). (6) \textbf{Recursos clave}: \emph{¿qué necesito?} (físico: local; intelectual: receta, marca; humano: personal; financiero: capital). (7) \textbf{Actividades clave}: \emph{¿qué hago?} (producción, marketing, atención). (8) \textbf{Socios clave}: \emph{¿quién me ayuda?} (proveedores, aliados, distribuidores). (9) \textbf{Estructura de costos}: \emph{¿qué me cuesta?} (fijos + variables, sesión 4).
  - |-
    La \textbf{conexión con estudio de mercado} (S6) es crucial. Los hallazgos numéricos alimentan al menos 3 bloques: (a) Segmento se afina con la demografía de los encuestados que mostraron interés. (b) Propuesta de valor se ajusta con lo que dijeron que necesitan. (c) Fuentes de ingresos se valida con el precio que dijeron pagar. El resto de bloques se construye con criterio del emprendedor + asistencia de IA.
  - |-
    Los \textbf{supuestos críticos} son los bloques cuyo error rompería todo el modelo. Típicamente: (a) \textbf{Propuesta de valor}: supuesto de que el cliente quiere lo que ofrezco. (b) \textbf{Canales}: supuesto de que sé dónde encontrarlo. (c) \textbf{Fuentes de ingresos}: supuesto de que pagará lo que pido. Estos 3 son los blancos preferidos del MVP que verificarías en S9.
  - |-
    Algoritmo: (1) tomar Canvas crudo de Actividad 1. (2) refinar bloques con datos de S6. (3) usar IA para refinar 3 bloques específicos. (4) crear versión visual en Canva, hoja apaisada o plantilla online gratuita (canvanizer.com es gratis). (5) identificar 3 supuestos críticos a verificar con MVP. (6) verificar coherencia entre bloques.
  anatomia:
    titulo: Anatomía del BMC
    body: |-
      \textbf{9 bloques:} segmento / propuesta / canales / relaciones / ingresos / recursos / actividades / socios / costos. \\[1mm] \textbf{Datos:} S6 alimenta 3 bloques principales. \\[1mm] \textbf{IA:} refina 3 bloques específicos. \\[1mm] \textbf{Supuestos críticos:} 3 que requieren verificación.
  errores_comunes: |-
    (1) \textbf{Segmento muy amplio}: \emph{``todo el mundo''} es ningún cliente. (2) \textbf{Propuesta de valor genérica}: \emph{``mejor calidad''} no es propuesta. (3) \textbf{Ingresos sin sustento}: precio basado en \emph{``creo que es justo''} sin estudio. (4) \textbf{Sin identificar supuestos críticos}: el Canvas se ve completo pero no se sabe qué validar. (5) \textbf{Aceptar todo lo que la IA propone}: la IA puede sugerir bloques irrealistas para tu contexto.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía BMC». \textbf{Formato:} (a) los 9 bloques con su pregunta; (b) conexión con S6; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} podrías auditar Canvas de otro proyecto.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Canvas completo + IA + supuestos críticos} (40 min · individual con dispositivo). Hora de aplicar. Construyes Canvas visual con los 9 bloques, usas IA para refinar 3 específicos, identificas 3 supuestos críticos.
  pilares:
  - |-
    Tu Canvas se construye en 6 pasos: (1) abrir Canva con plantilla \emph{Business Model Canvas} (gratis), hoja apaisada en Docs/LibreOffice, o canvanizer.com (gratuito en línea). (2) llenar los 9 bloques con frases concisas (3-7 palabras por idea), conectando con los hallazgos del estudio de mercado. (3) elegir 3 bloques específicos para refinar con IA. (4) escribir prompt para cada uno: \emph{``Actúa como mentor de emprendimiento. Mi microemprendimiento es [X]. El bloque \emph{[nombre]} de mi Canvas actualmente dice [pegar]. Sugiere 3 mejoras concretas basadas en lo que dirían 17 de 20 clientes que entrevisté que [pegar hallazgos]''}. (5) integrar las mejores sugerencias de la IA. (6) identificar 3 supuestos críticos que requerirán MVP en futuro.
  - |-
    Sigue el patrón \textbf{``datos sobre suposiciones''}: cada bloque debe poder responder a la pregunta \emph{``¿en qué dato me baso para afirmar esto?''}. Si la respuesta es \emph{``en mi intuición''}, hay supuesto crítico que verificar. Si la respuesta es \emph{``en el hallazgo de mi estudio''}, el bloque tiene sustento.
  - |-
    Los \textbf{3 supuestos críticos} se identifican así: (a) ¿qué afirmación del Canvas, si fuera falsa, haría caer el modelo entero? (b) ¿qué supuesto no está verificado todavía con datos? (c) ¿qué supuesto sería el más caro de equivocarse? Esos 3 supuestos serán los blancos del MVP de la sesión 9 (proyecto integrador).
  - |-
    Algoritmo: (1) Canvas en formato visual con 9 bloques. (2) refinar con IA 3 bloques. (3) identificar 3 supuestos críticos. (4) verificar coherencia entre bloques. (5) versión final del Canvas guardada para compartir.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 9 bloques llenos en formato visual. \\[1mm] \checkbox 3 bloques refinados con IA documentada. \\[1mm] \checkbox Datos del estudio de mercado conectados al Canvas. \\[1mm] \checkbox 3 supuestos críticos identificados. \\[1mm] \checkbox Coherencia entre bloques verificada. \\[1mm] \checkbox Canvas guardado y compartible.
  plantilla_guion: |-
    \textbf{9 bloques.} \textit{Cada uno con frase concisa.} \\[1mm] \textbf{3 bloques con IA.} \textit{Refinados con prompts específicos.} \\[1mm] \textbf{Conexión datos.} \textit{Hallazgos S6 alimentando Canvas.} \\[1mm] \textbf{3 supuestos críticos.} \textit{A verificar en MVP futuro.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Mi Canvas con IA». \textbf{Formato:} (a) imagen o link del Canvas; (b) prompts usados con IA; (c) 3 supuestos críticos identificados. \textbf{Sabes que terminaste cuando} alguien viendo tu Canvas entiende el modelo en 5 minutos.
  producto_titulo: BMC completo + 3 bloques refinados con IA + 3 supuestos críticos
  criterios:
  - 9 bloques llenos con frases concisas
  - Datos del estudio de mercado integrados
  - 3 bloques refinados con IA documentada
  - 3 supuestos críticos identificados
  - Coherencia entre bloques
  - Canvas visual compartible
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un modelo de negocio que sirve al cliente sin extraer es liberador; uno que solo busca lucro reproduce la lógica colonial.
    aplicacion: |-
      Tu Canvas puede diseñarse de 2 maneras: (a) servir al cliente entregando valor proporcional a lo que cobra. (b) extraer del cliente más de lo que entrega. La filosofía de la liberación pide la primera. Las microempresas del barrio que duran 30 años son las que servían honestamente; las que se quebraban rápido eran las que extraían sin entregar. La phronesis emprendedora consiste en \textbf{diseñar modelos que sirven, no que solo extraen}.
    pregunta_espejo: |-
      ¿Mi Canvas diseña negocio que sirve al cliente, o solo busca extraer valor de él?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Llenar los 9 bloques con disciplina es virtud emprendedora; saltarse alguno es debilidad que se descubre al lanzar.
    aplicacion: |-
      Es tentador saltarse bloques que \emph{``ya pensaré después''} (socios, costos). La sabiduría estoica recomienda lo opuesto: \emph{llena los 9, aunque algunos sean preliminares}. La incompletitud del Canvas se traduce en sorpresas costosas al lanzar.
    pregunta_espejo: |-
      ¿Mis 9 bloques están todos llenos, o salté alguno por comodidad?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El Canvas con IA como copiloto es la nueva práctica del emprendimiento del siglo XXI.
    aplicacion: |-
      Tradicionalmente, el Canvas se llenaba a mano o con mentor humano. Hoy la IA puede asistir refinando bloques específicos. La phronesis emprendedora contemporánea consiste en \textbf{usar la IA donde acelera, conservar el criterio donde decide}. La decisión final sobre el modelo es del emprendedor, no de la IA.
    pregunta_espejo: |-
      ¿Estoy usando IA como copiloto del Canvas, o le delego la decisión sobre el modelo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu Canvas visual y los 3 supuestos críticos identificados. En la sesión 8 vas a aprender \textbf{comunicación empresarial profesional con IA}: cómo presentar el Canvas y la propuesta a clientes y aliados. El Canvas de hoy es la arquitectura; la comunicación de mañana es cómo se cuenta.

clave: 3-8
grado: 10
periodo: 3
sesion: 8
completo: true
titulo: Comunicación empresarial profesional con IA
titulo_portada: |-
  Comunicación
  empresarial profesional
  con IA
producto_final: |-
  3 piezas de comunicación empresarial del microemprendimiento producidas con asistencia de IA (a) propuesta comercial breve de 1 página dirigida a cliente potencial real o hipotético, (b) correo de presentación profesional para abrir relación comercial con cliente, (c) infografía o publicación visual para redes sociales con el resumen de la propuesta de valor + declaración explícita por cada pieza de qué generó la IA, qué editaste tú y por qué
apertura:
  saber_ancestral: |-
    En las tiendas, panaderías y modisterías del centro de Cartago, había un concepto que sostenía el comercio del barrio durante décadas: \textbf{la palabra empeñada}. Cuando un tendero le decía a un cliente regular \emph{``el lunes le tengo la harina especial''}, esa frase no era promesa vaga: era \textbf{compromiso público}. Si no llegaba el lunes, el tendero perdía credibilidad y el cliente cambiaba de tienda. La palabra empeñada tenía 3 propiedades inquebrantables: (1) \textbf{Claridad}: nada de ambigüedades. Día, hora, producto específicos. (2) \textbf{Realismo}: solo se prometía lo que se podía cumplir. (3) \textbf{Honor}: el cumplimiento era cuestión de respeto, no de contrato legal. Los clientes regulares del barrio no firmaban papeles; trabajaban con palabra empeñada porque sabían que el tendero respondería con su nombre. Cuando alguien decía \emph{``ese tendero tiene palabra''}, era el mayor elogio comercial posible. Esa misma palabra empeñada es la base de la comunicación empresarial profesional moderna: cada propuesta, cada correo, cada publicación son \textbf{compromisos públicos del emprendedor}. La IA ayuda a redactarlos; tú asumes lo prometido.
  saber_contemporaneo: |-
    La \textbf{comunicación empresarial profesional} es el conjunto de piezas escritas y visuales que un emprendedor produce para relacionarse con clientes, aliados, inversionistas. Sus 3 piezas más usadas en microemprendimiento son: (1) \textbf{Propuesta comercial breve}: 1 página dirigida a cliente potencial con problema + solución + propuesta + precio + llamada a la acción. (2) \textbf{Correo de presentación}: contacto inicial profesional con asunto claro, presentación breve, propuesta de valor, pedido de reunión o respuesta. (3) \textbf{Publicación visual para redes}: infografía o post con la propuesta de valor en formato consumible (visual, claro, llamado a acción). La regla profesional: \textbf{las 3 piezas deben ser coherentes entre sí}: si tu correo dice X y tu propuesta dice Y, el cliente se confunde. La \textbf{IA como asistente} acelera la redacción de las 3, pero el emprendedor: (a) ajusta tono al contexto colombiano, (b) garantiza coherencia con el Canvas, (c) asume compromisos prometidos. Herramientas: ChatGPT/Gemini para texto, Canva para visual.
  pregunta_puente: |-
    ¿Qué sabía el tendero al cumplir su palabra empeñada el lunes, que el novato olvida cuando promete en correo lo que no podrá cumplir? ¿Y por qué la coherencia entre las 3 piezas es lo que diferencia al emprendedor profesional del improvisado?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{aplicar} las habilidades de S8 del P2 (correo profesional con IA) al contexto empresarial; (2) \textbf{analizar} las 3 piezas de comunicación buscando coherencia y honestidad; (3) \textbf{crear} las 3 piezas con asistencia de IA y voz propia; (4) \textbf{evaluar} si las 3 piezas funcionan juntas como sistema coherente.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 7 cerraste el Canvas. Hoy creas las \textbf{piezas comunicativas} que llevan el Canvas al cliente. La sesión 9 será el proyecto integrador completo y la 10 sustentación.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{revisión rápida}: lee tu Canvas de la sesión 7 e identifica la propuesta de valor en 1 frase. Esa frase es el corazón de las 3 piezas que vas a crear hoy.
  a_sistematizacion: |-
    Ya tienes propuesta de valor en 1 frase. Ahora vas a entender la \textbf{anatomía profesional} de las 3 piezas de comunicación empresarial y cómo mantener coherencia entre ellas.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: creas las 3 piezas con asistencia de IA, garantizas coherencia entre ellas, declaras uso de IA en cada una.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 3 piezas coherentes + declaración de IA. El criterio principal: que las 3 piezas podrían enviarse hoy mismo a un cliente potencial real.
  a_evaluacion: |-
    Antes de cerrar, mira la comunicación desde las cinco dimensiones humanas. Mantener palabra empeñada digital es respeto por el cliente; prometer lo que no se puede cumplir es traición al oficio.
  a_triangulo: |-
    Y para terminar, tres voces sobre la palabra empeñada digital. Dussel sobre la comunicación que dignifica al cliente, Marco Aurelio sobre la coherencia entre las piezas, Floridi sobre la transparencia empresarial como ética emprendedora.
escuta:
  escena: |-
    \textbf{Actividad 1 · APLICA --- Propuesta de valor en 1 frase} (15 min · individual). Toma tu Canvas de la sesión 7 e identifica la propuesta de valor de tu microemprendimiento. Reduce a 1 frase específica de máximo 15-20 palabras. Estructura: \emph{``Ofrezco [producto/servicio] a [cliente específico] que resuelve [problema concreto] mediante [diferencial clave]''}. Ejemplo: \emph{``Ofrezco empanadas vegetarianas a estudiantes universitarios del Valle que quieren almuerzo rápido sin carne mediante delivery por WhatsApp en 30 minutos''}.
  checks:
  - Tomé propuesta de valor del Canvas.
  - La reduje a 1 frase de máximo 20 palabras.
  - La frase incluye producto, cliente, problema, diferencial.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · APLICA).} Título: «Actividad 1 --- Propuesta en 1 frase». \textbf{Formato:} la frase final + 2-3 versiones previas descartadas con razón. \textbf{Sabes que terminaste cuando} esa frase suena clara y específica.
sistematizacion:
  intro: |-
    Tu propuesta en 1 frase es el corazón. Ahora necesitas la \textbf{anatomía profesional} de las 3 piezas de comunicación empresarial.
  pilares:
  - |-
    Las \textbf{3 piezas de comunicación empresarial} se descomponen así: (1) \textbf{Propuesta comercial breve} (1 página): título atractivo, problema del cliente en 2-3 líneas, solución que ofreces en 2-3 líneas, beneficios principales en 3-4 puntos, precio claro, llamada a la acción específica. Tono: cálido pero profesional. (2) \textbf{Correo de presentación}: asunto claro y específico, saludo apropiado, 3-4 párrafos cortos (quién eres + propuesta de valor + pedido), cierre con llamada a acción concreta. Tono: profesional pero accesible. (3) \textbf{Publicación visual para redes}: imagen o infografía con propuesta de valor en gran formato, beneficios principales como 3-4 íconos o frases cortas, llamada a acción visible. Diseñada en Canva con plantillas gratuitas.
  - |-
    La \textbf{coherencia entre las 3 piezas} es crucial. Las 3 deben: (a) comunicar la misma propuesta de valor con palabras similares (no idénticas, pero alineadas). (b) usar el mismo tono general. (c) hacer la misma promesa al cliente. (d) llamar a la misma acción final. Si la propuesta dice \emph{``delivery en 30 minutos''}, el correo y la publicación también deben decirlo. La incoherencia entre piezas confunde al cliente y erosiona la palabra empeñada.
  - |-
    El \textbf{flujo con IA} para cada pieza sigue 4 pasos: (1) escribir prompt completo con las 5 partes (rol, contexto, tarea, formato, restricciones), incluyendo tu propuesta de valor en 1 frase. (2) recibir borrador de IA en ChatGPT/Gemini/Bing. (3) editar a mano: ajustar tono colombiano, eliminar clichés, garantizar coherencia con las otras piezas. (4) verificar que la pieza compromete lo que efectivamente puedes cumplir. La phronesis del emprendedor consiste en \textbf{no usar IA para prometer lo que no podrás entregar}.
  - |-
    Algoritmo: (1) revisar propuesta de valor en 1 frase. (2) escribir prompt para propuesta comercial. (3) recibir borrador IA, editar, finalizar. (4) escribir prompt para correo de presentación. (5) recibir borrador, editar, finalizar. (6) escribir prompt para concepto de publicación visual. (7) usar Canva con plantilla para crear publicación. (8) revisar coherencia entre las 3 piezas.
  anatomia:
    titulo: Anatomía de las 3 piezas
    body: |-
      \textbf{Propuesta comercial:} 1 pp con problema-solución-precio. \\[1mm] \textbf{Correo de presentación:} asunto + 3-4 párrafos + llamada. \\[1mm] \textbf{Publicación redes:} infografía Canva con propuesta visual. \\[1mm] \textbf{Coherencia:} misma propuesta, mismo tono, misma promesa.
  errores_comunes: |-
    (1) \textbf{Incoherencia entre piezas}: la propuesta dice algo, el correo otro. (2) \textbf{Prometer lo que no se puede cumplir}: la IA puede sugerir promesas atractivas pero irrealistas. (3) \textbf{Tono inconsistente}: propuesta formal con correo casual. (4) \textbf{Sin llamada a acción clara}: la pieza termina sin pedir nada concreto. (5) \textbf{Publicación visual sin propuesta clara}: bonito pero vacío.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía comunicación empresarial». \textbf{Formato:} (a) 3 piezas con estructura; (b) regla de coherencia; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} sabes producir las 3 piezas sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- 3 piezas + declaración de IA} (40 min · individual con dispositivo). Hora de aplicar. Creas las 3 piezas con asistencia de IA, garantizas coherencia, declaras uso de IA en cada una.
  pilares:
  - |-
    Tus 3 piezas se construyen en 6 pasos: (1) escribir prompt completo para propuesta comercial: \emph{``Actúa como mentor de emprendimiento. Mi propuesta de valor es [frase de S1]. Escribe propuesta comercial de 1 página dirigida a [cliente potencial] con problema, solución, 3 beneficios, precio y llamada a acción''}. (2) editar el borrador IA. (3) prompt para correo de presentación. (4) editar. (5) prompt para concepto de publicación visual + crear en Canva con plantilla. (6) revisar coherencia entre las 3.
  - |-
    Sigue el patrón \textbf{``palabra empeñada digital''}: cada palabra de las 3 piezas es compromiso público. Si tu propuesta promete \emph{``entrega en 30 minutos''}, mejor que puedas cumplirlo. La IA puede sugerir promesas atractivas pero irrealistas; tu trabajo como emprendedor es \textbf{rechazar lo que no podrías cumplir}. La phronesis comercial consiste en \textbf{prometer poco y cumplir mucho}.
  - |-
    La \textbf{declaración de uso de IA por pieza} tiene 3 elementos: (a) qué modelo IA usaste (ChatGPT, Gemini, etc.). (b) qué porcentaje del texto generó la IA y qué porcentaje editaste tú. (c) qué partes específicas cambiaste y por qué. Esa declaración por pieza es transparencia profesional contemporánea.
  - |-
    Algoritmo: (1) propuesta comercial. (2) correo presentación. (3) publicación visual. (4) verificación de coherencia. (5) declaración IA por cada pieza.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Propuesta comercial de 1 página completa. \\[1mm] \checkbox Correo de presentación con asunto y llamada. \\[1mm] \checkbox Publicación visual en Canva. \\[1mm] \checkbox 3 piezas coherentes entre sí. \\[1mm] \checkbox Promesas realistas en cada pieza. \\[1mm] \checkbox Declaración de IA por cada pieza.
  plantilla_guion: |-
    \textbf{Pieza 1.} \textit{Propuesta comercial 1 página.} \\[1mm] \textbf{Pieza 2.} \textit{Correo de presentación.} \\[1mm] \textbf{Pieza 3.} \textit{Publicación visual.} \\[1mm] \textbf{Coherencia.} \textit{Misma propuesta + tono + promesa.} \\[1mm] \textbf{IA.} \textit{Declaración por cada pieza.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- 3 piezas empresariales». \textbf{Formato:} (a) las 3 piezas; (b) verificación coherencia; (c) declaración IA. \textbf{Sabes que terminaste cuando} las 3 piezas podrían enviarse a cliente potencial real.
  producto_titulo: 3 piezas empresariales coherentes + declaración de IA
  criterios:
  - Propuesta comercial 1 página
  - Correo de presentación profesional
  - Publicación visual en Canva
  - Coherencia entre las 3 piezas
  - Promesas realistas
  - Declaración IA por pieza
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La palabra empeñada digital es respeto por el cliente; prometer lo no cumplible es violencia comercial moderna.
    aplicacion: |-
      Cuando tus piezas prometen al cliente algo que no podrás cumplir, traicionas la palabra empeñada. La filosofía de la liberación pide lo opuesto: \textbf{prometer solo lo cumplible}. Las microempresas del barrio que duran décadas son las que mantienen palabra; las que truenan son las que prometen lo que no entregan. La phronesis empresarial consiste en \textbf{cumplir más de lo prometido, no menos}.
    pregunta_espejo: |-
      ¿Mis 3 piezas prometen lo que efectivamente puedo cumplir, o prometen más por verse atractivas?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La coherencia entre las piezas comunicativas es virtud profesional; la incoherencia es debilidad disfrazada de creatividad.
    aplicacion: |-
      Es tentador hacer cada pieza con tono distinto creyendo que \emph{``así llega a más audiencias''}. La sabiduría estoica recomienda lo opuesto: \emph{coherencia es respeto por el cliente que ve todas las piezas}. La phronesis del oficio consiste en \textbf{decir lo mismo con palabras adaptadas, no cosas distintas según conveniencia}.
    pregunta_espejo: |-
      ¿Mis 3 piezas son coherentes, o cada una promete cosa distinta?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La transparencia empresarial con declaración honesta de IA es ética emprendedora del siglo XXI.
    aplicacion: |-
      En la era de la IA generativa, las microempresas que declaran abiertamente uso de IA se posicionan como ético emergente. Ocultar uso de IA mientras se promete \emph{``hecho a mano''} es fraude moderno. Tu declaración por pieza es práctica que rige todo emprendimiento serio contemporáneo.
    pregunta_espejo: |-
      ¿Mi comunicación empresarial declara honestamente uso de IA, o esconde la asistencia?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus 3 piezas coherentes y declaración de IA. En la sesión 9 vas a integrar todo el periodo en un \textbf{proyecto integrador completo del micro-emprendimiento}: Canvas + flujo de caja + estudio mercado + comunicación + plan de validación. La comunicación de hoy es una pieza; el proyecto integrador es la integración total.
web:
  conceptos_clave:
    - termino: Propuesta comercial breve
      definicion: |-
        1 página dirigida a cliente potencial. Estructura: problema + solución + propuesta + precio + llamada a la acción.
      ejemplo: |-
        Una página con el problema del almuerzo escolar, tu solución de brownies, propuesta de venta diaria y CTA "Reserva el lunes".
      emoji: "📄"
    - termino: Correo de presentación
      definicion: |-
        Primer contacto profesional. Asunto claro + presentación breve + propuesta de valor + pedido de reunión o respuesta.
      ejemplo: |-
        Asunto: "Propuesta colaboración almuerzo escolar". Cuerpo en 4 párrafos cortos cerrando con pedido de reunión.
      emoji: "✉️"
    - termino: Publicación visual para redes
      definicion: |-
        Infografía o post con la propuesta de valor en formato consumible: visual, claro, con llamada a la acción.
      ejemplo: |-
        Post de Instagram con imagen del producto, precio destacado, días de entrega y "DM para reservar".
      emoji: "📱"
    - termino: Coherencia entre piezas
      definicion: |-
        Las 3 piezas deben decir lo mismo. Si el correo dice X y la propuesta dice Y, el cliente desconfía.
      ejemplo: |-
        Si el correo promete entrega martes y jueves, la publicación visual y la propuesta también deben decirlo.
      emoji: "🔗"
    - termino: IA como asistente, no piloto
      definicion: |-
        La IA acelera la redacción de las 3 piezas; el emprendedor ajusta tono, garantiza coherencia y asume compromisos.
      ejemplo: |-
        Pides borradores a la IA, revisas el tono local, verificas que las 3 piezas digan lo mismo y las firmas.
      emoji: "🤝"
  quiz:
    titulo: ¿Comunicas tu microempresa con coherencia?
    instrucciones: 5 preguntas para verificar las 3 piezas y su coherencia.
    preguntas:
      - enunciado: ¿Cuántas piezas obligatorias tiene la comunicación empresarial básica?
        opciones:
          - "1"
          - "100"
          - "0"
          - "3"
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. 3: propuesta comercial breve, correo de presentación, publicación visual.
        feedback_incorrecto: |-
          Son 3 piezas básicas. Coherentes entre sí.
      - enunciado: ¿Qué pasa si tu correo dice precio $5.000 y tu publicación visual dice $4.500?
        opciones:
          - Mejor para ventas
          - El cliente desconfía por incoherencia
          - No pasa nada
          - Hay que poner el más bajo
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La incoherencia entre piezas erosiona la confianza inmediatamente.
        feedback_incorrecto: |-
          El cliente desconfía. Las 3 piezas deben decir exactamente lo mismo.
      - enunciado: ¿Cómo termina una propuesta comercial breve?
        opciones:
          - Con una despedida
          - Sin terminar
          - Con llamada a la acción (CTA)
          - Con un poema
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Con CTA específica. Sin pedido claro, la propuesta queda sin propósito.
        feedback_incorrecto: |-
          Con CTA clara. "Reserva el lunes en este link" es ejemplo de CTA concreto.
      - enunciado: ¿Cuál es el rol correcto de la IA en estas piezas?
        opciones:
          - Acelerar redacción; el humano ajusta tono y coherencia
          - Reemplazar al emprendedor
          - No tiene rol
          - Decidir el precio
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. La IA acelera, el emprendedor ajusta tono local, coherencia y firma.
        feedback_incorrecto: |-
          Acelera redacción; el humano ajusta tono, coherencia y compromiso.
      - enunciado: ¿Qué herramienta gratuita es ideal para la publicación visual?
        opciones:
          - Solo Photoshop pago
          - Calculadora
          - Canva
          - WhatsApp Web
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Canva tiene plantillas listas para post de redes sociales.
        feedback_incorrecto: |-
          Es Canva. Plantillas listas, drag-and-drop, exportación a JPG o PNG.

clave: 3-9
grado: 10
periodo: 3
sesion: 9
completo: true
titulo: Proyecto integrador --- micro-emprendimiento con plan completo
titulo_portada: |-
  Proyecto integrador ---
  micro-emprendimiento
  con plan completo
producto_final: |-
  Proyecto integrador final del grado 10° (puente directo al proyecto emprendedor del grado 11°): micro-emprendimiento personal o grupal completo en documento integrador de 8-12 páginas con (a) idea con problema real identificado y validado por estudio de mercado, (b) Business Model Canvas completo, (c) contabilidad proyectada a 3 meses con flujo de caja y punto de equilibrio, (d) las 3 piezas de comunicación empresarial (propuesta, correo, publicación), (e) plan de validación con 5 personas reales para próximas semanas, (f) bitácora del proceso completo del año
apertura:
  saber_ancestral: |-
    En los barrios populares del Valle del Cauca, en los corregimientos cafeteros del Quindío, en las cabeceras municipales del Pacífico colombiano, hay una figura que cualquier vecino mayor recuerda con respeto: \textbf{el aprendiz emprendedor que abre su primer puestico}. No el comerciante experimentado con 30 años de oficio; el joven o joven adulto que comienza. Ese aprendiz tenía una práctica que cualquier microempresario veterano del barrio reconocía: \textbf{no improvisaba}. Antes de poner el primer puestico de empanadas en la esquina, antes de abrir la primera papelería, antes de salir con la primera carga de aguacates a vender, el aprendiz \textbf{preparaba 5 cosas con disciplina}: (1) \textbf{Estudiaba la calle}: a qué hora pasa más gente, qué edad tienen, qué compran. (2) \textbf{Calculaba los costos}: cuánto cuesta cada empanada producir, cuánto la papel, cuánto el cajón. (3) \textbf{Ahorraba el capital inicial}: no se lanzaba con préstamo caro; ahorraba al menos lo necesario para 2 meses sin venta. (4) \textbf{Preparaba el lugar}: permiso del dueño, espacio limpio, presentación cuidada. (5) \textbf{Hablaba con vecinos}: les contaba la idea, escuchaba sus consejos. Esa preparación ancestral del aprendiz emprendedor es \textbf{exactamente lo que el proyecto integrador del grado 10° formaliza}. No improvisar es disciplina del oficio.
  saber_contemporaneo: |-
    El \textbf{proyecto integrador del periodo 3} es la pieza final del grado 10°: el aprendiz integra todas las habilidades del año (escritura con IA, informes técnicos, ofimática contable, estudio de mercado, Canvas, comunicación empresarial) en un \textbf{plan completo de micro-emprendimiento}. Sus 6 componentes obligatorios: (1) \textbf{Idea con problema real}: validada por estudio de mercado (S6) con datos verificables. (2) \textbf{Business Model Canvas completo} (S7) con los 9 bloques. (3) \textbf{Contabilidad proyectada a 3 meses} (S4) con flujo de caja, punto de equilibrio, 3 escenarios y decisión de viabilidad. (4) \textbf{Las 3 piezas de comunicación empresarial} (S8): propuesta, correo, publicación. (5) \textbf{Plan de validación}: 5 personas reales con quienes conversar en las próximas 2-3 semanas para verificar supuestos críticos del Canvas. (6) \textbf{Bitácora del proceso del año}: 1-2 páginas reflexionando sobre lo aprendido en los 3 periodos. La regla profesional: \textbf{este proyecto no es ejercicio escolar; es preparación seria para iniciar microempresa o como puente al proyecto emprendedor del grado 11°}.
  pregunta_puente: |-
    ¿Qué sabía el aprendiz emprendedor del barrio al preparar 5 cosas con disciplina antes de abrir su primer puestico, que el novato olvida cuando lanza microempresa solo con \emph{``ya veremos''}? ¿Y por qué el proyecto integrador del grado 10° es realmente preparación para la vida real, no solo nota escolar?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cómo integrar las 8 sesiones del periodo en un documento coherente; (2) \textbf{analizar} qué componentes ya tienes producidos y cuáles requieren refinamiento; (3) \textbf{crear} el documento integrador completo con los 6 componentes; (4) \textbf{evaluar} la viabilidad real del micro-emprendimiento y el plan de validación de próximas semanas.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Has recorrido 8 sesiones del periodo 3. Hoy es el día de \textbf{integrar el año entero} en una sola pieza maestra. La sesión 10 será sustentación pública + feria de microempresas, cierre del grado 10°.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{inventario completo}: lista lo que tienes producido del periodo 3 (cuaderno de cuentas, plantilla Sheets, proyección de flujo, gráficos, estudio mercado, Canvas, 3 piezas comunicación) y lo que falta para el documento integrador.
  a_sistematizacion: |-
    Ya tienes inventario. Ahora vas a entender la \textbf{anatomía del proyecto integrador} y la cadena lógica entre componentes.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: integras componentes en documento único, agregas plan de validación de 5 personas, escribes bitácora del año.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: documento integrador 8-12 páginas + plan validación + bitácora del año. El criterio principal: que el documento sirva realmente como base para iniciar microempresa o como puente al proyecto emprendedor del grado 11°.
  a_evaluacion: |-
    Antes de cerrar, mira el proyecto integrador desde las cinco dimensiones humanas. Integrar con disciplina es respeto por el oficio del año entero; entregar piezas sueltas es desperdicio de 8 sesiones de trabajo.
  a_triangulo: |-
    Y para terminar, tres voces sobre la pieza maestra emprendedora. Dussel sobre los micro-emprendimientos que dan voz a comunidades, Marco Aurelio sobre la integración con disciplina, Floridi sobre el proyecto como acto profesional contemporáneo.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario completo del periodo 3} (15 min · individual). Haz lista de lo que tienes producido en las 8 sesiones del periodo 3. Reglas: (1) \textbf{Tengo}: mapa ofimática (S1), cuaderno cuentas 2 semanas (S2), plantilla Sheets (S3), proyección flujo 3 meses (S4), 3 gráficos honestos (S5), estudio mercado con hallazgos (S6), Canvas completo (S7), 3 piezas comunicación (S8). (2) \textbf{Me falta}: integración en documento único, plan de validación de 5 personas, bitácora del año.
  checks:
  - Listé lo producido en las 8 sesiones.
  - Listé lo que falta para integrar.
  - Estimé tiempo necesario para cerrar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Inventario completo». \textbf{Formato:} 2 listas con cronograma. \textbf{Sabes que terminaste cuando} tienes plan claro de integración.
sistematizacion:
  intro: |-
    Tu inventario es el plan. Ahora necesitas la \textbf{anatomía del proyecto integrador}.
  pilares:
  - |-
    Los \textbf{6 componentes obligatorios} se descomponen así: (1) \textbf{Idea con problema real}: 1 página presentando el microemprendimiento, problema validado, audiencia. (2) \textbf{Business Model Canvas}: imagen o tabla del Canvas con los 9 bloques. (3) \textbf{Contabilidad proyectada}: tabla de flujo de caja 3 meses, punto de equilibrio, decisión de viabilidad. (4) \textbf{Comunicación empresarial}: las 3 piezas (propuesta comercial, correo, publicación visual). (5) \textbf{Plan de validación}: lista de 5 personas reales con nombres y contexto para conversar en las próximas 2-3 semanas verificando los supuestos críticos del Canvas. (6) \textbf{Bitácora del proceso del año}: 1-2 páginas reflexivas sobre lo aprendido en los 3 periodos del grado 10° (libro con IA, informes profesionales, ofimática emprendedora).
  - |-
    La \textbf{cadena lógica} entre componentes es crucial: (a) Idea sostenida por estudio mercado (S6). (b) Canvas alimentado por estudio mercado en al menos 3 bloques. (c) Contabilidad coherente con Canvas (precios, costos, escala). (d) Comunicación que refleja la propuesta de valor del Canvas. (e) Plan de validación dirigido a supuestos críticos del Canvas. Si rompes la cadena, el proyecto parece pero no es coherente.
  - |-
    Los \textbf{5 errores típicos} del proyecto integrador novato: (a) \textbf{Piezas yuxtapuestas sin integración}: pegar Canvas + flujo + comunicación sin conectarlos. (b) \textbf{Plan de validación con familia solamente}: incluir solo amigos cercanos. (c) \textbf{Sin bitácora del año}: el documento llega sin reflexión sobre lo aprendido. (d) \textbf{Decisión de viabilidad inflada}: pretender viabilidad cuando el flujo dice lo contrario. (e) \textbf{Sin uso explícito de IA documentado}: ocultar que hubo asistencia de IA.
  - |-
    Algoritmo: (1) crear documento integrador (Google Docs profesional de S3 del P2). (2) sección 1: idea + problema. (3) sección 2: Canvas. (4) sección 3: contabilidad proyectada. (5) sección 4: 3 piezas de comunicación. (6) sección 5: plan de validación 5 personas. (7) sección 6: bitácora del año. (8) revisión final de coherencia.
  anatomia:
    titulo: Anatomía del proyecto integrador
    body: |-
      \textbf{6 componentes:} idea / Canvas / contabilidad / comunicación / validación / bitácora. \\[1mm] \textbf{Cadena lógica:} cada pieza sostiene la siguiente. \\[1mm] \textbf{Extensión:} 8-12 páginas. \\[1mm] \textbf{Plan validación:} 5 personas reales con nombres. \\[1mm] \textbf{Bitácora del año:} reflexión personal.
  errores_comunes: |-
    (1) Piezas yuxtapuestas sin integración. (2) Validación solo con familia cercana. (3) Sin bitácora del año. (4) Decisión de viabilidad inflada. (5) Sin uso explícito de IA documentado. (6) Sin plan concreto para próximas semanas.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía proyecto integrador». \textbf{Formato:} (a) 6 componentes con función; (b) cadena lógica; (c) 6 errores con marca. \textbf{Sabes que terminaste cuando} sabes integrar el año en 1 documento coherente.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Documento integrador completo} (60 min en sesión + tiempo en casa · individual o parejas). Hora de integrar. Construyes documento único de 8-12 páginas con los 6 componentes.
  pilares:
  - |-
    Tu documento se construye en 8 pasos: (1) abrir Google Docs con plantilla profesional. (2) escribir Sección 1: Idea + problema validado (1-2 páginas). (3) integrar Sección 2: Canvas (imagen del Canvas + explicación de 1 página). (4) Sección 3: Contabilidad proyectada (2 páginas con flujo, PE, escenarios, decisión). (5) Sección 4: 3 piezas de comunicación (2-3 páginas). (6) Sección 5: Plan de validación con 5 personas reales (1 página). (7) Sección 6: Bitácora del año (1-2 páginas). (8) revisión de coherencia + exportar PDF.
  - |-
    El \textbf{plan de validación con 5 personas reales} es la pieza puente al grado 11°. Tiene 5 filas (1 por persona) con: nombre, contexto (¿es cliente potencial?, ¿es socio potencial?, ¿es experto?), qué supuesto crítico del Canvas verificarás con esa persona, cómo contactarás, cuándo conversarás. La phronesis del oficio consiste en \textbf{tener nombres reales contactables, no \emph{``algún emprendedor que conozca''}}.
  - |-
    La \textbf{bitácora del año} responde 5 preguntas reflexivas: (a) ¿qué aprendí del P1 (escritura con IA)? (b) ¿qué del P2 (informes profesionales)? (c) ¿qué del P3 (ofimática y emprendimiento)? (d) ¿qué cambió en mi forma de usar IA durante el año? (e) ¿qué me llevo al grado 11°? Esa bitácora es la firma personal del año.
  - |-
    Algoritmo: (1) abrir Docs. (2) las 6 secciones en orden. (3) plan validación con nombres. (4) bitácora del año. (5) revisión coherencia. (6) PDF exportado.
  checklist:
    titulo: Checklist al cerrar el proyecto
    items: |-
      \checkbox Idea con problema validado por estudio mercado. \\[1mm] \checkbox Canvas completo integrado. \\[1mm] \checkbox Contabilidad proyectada 3 meses con decisión. \\[1mm] \checkbox 3 piezas comunicación coherentes. \\[1mm] \checkbox Plan validación con 5 nombres reales. \\[1mm] \checkbox Bitácora del año completa. \\[1mm] \checkbox 8-12 páginas en PDF exportado.
  plantilla_guion: |-
    \textbf{1. Idea + problema.} \textit{1-2 páginas.} \\[1mm] \textbf{2. Canvas.} \textit{Imagen + 1 página.} \\[1mm] \textbf{3. Contabilidad.} \textit{Flujo + PE + decisión, 2 páginas.} \\[1mm] \textbf{4. Comunicación.} \textit{3 piezas, 2-3 páginas.} \\[1mm] \textbf{5. Plan validación.} \textit{5 personas reales.} \\[1mm] \textbf{6. Bitácora del año.} \textit{Reflexión personal.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Proyecto integrador G10». \textbf{Formato:} (a) link al PDF; (b) verificación de los 6 componentes; (c) plan validación con nombres. \textbf{Sabes que terminaste cuando} el documento sirve realmente para iniciar microempresa.
  producto_titulo: Proyecto integrador 8-12 pp + plan validación + bitácora del año
  criterios:
  - 6 componentes obligatorios presentes
  - Cadena lógica entre piezas verificable
  - Plan validación con 5 nombres reales
  - Bitácora del año completa
  - Coherencia entre Canvas, contabilidad y comunicación
  - PDF exportado profesional
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un proyecto emprendedor que sirve a la comunidad y se sostiene financieramente es liberador; uno que solo extrae es opresor.
    aplicacion: |-
      Tu micro-emprendimiento puede ser una de 2 cosas: (a) servicio real al barrio con sostenibilidad económica, (b) extracción disfrazada de emprendimiento. La filosofía de la liberación pide la primera. La phronesis del oficio consiste en \textbf{diseñar emprendimiento que dignifique al cliente y sostenga al emprendedor}.
    pregunta_espejo: |-
      ¿Mi micro-emprendimiento sirve realmente o solo busca extraer valor?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Integrar el año con disciplina es virtud emprendedora; pegar piezas sin coherencia es vanidad.
    aplicacion: |-
      Es tentador pegar los 6 componentes en orden sin integrar. La sabiduría estoica recomienda lo opuesto: \emph{teje las piezas en un solo argumento coherente}. La phronesis del oficio honra la integración sobre la agregación.
    pregunta_espejo: |-
      ¿Mi proyecto integrador es realmente integrado, o solo es agregación de 6 piezas?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El proyecto emprendedor con IA documentada honestamente es el modelo profesional emergente.
    aplicacion: |-
      En la era de la IA generativa, los micro-emprendimientos que declaran abiertamente el uso de IA se posicionan como ético contemporáneo. Tu proyecto te entrena en una práctica que rige todo emprendimiento serio: \textbf{transparencia con porcentajes y modelos}.
    pregunta_espejo: |-
      ¿Mi proyecto contribuye al modelo emprendedor transparente del siglo XXI?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu proyecto integrador completo en PDF, plan de validación con 5 nombres y bitácora del año. En la sesión 10 vas a hacer la \textbf{sustentación pública del grado 10° + feria de microempresas escolares}: cierre del grado y puente al proyecto emprendedor del grado 11°.
web:
  conceptos_clave:
    - termino: Proyecto integrador del periodo 3
      definicion: |-
        Pieza final de grado 10°. Integra escritura, informes, ofimática contable, estudio de mercado, Canvas y comunicación en un plan de microemprendimiento.
      ejemplo: |-
        Microempresa de almuerzos saludables con estudio de mercado, flujo de caja a 3 meses, Canvas y 3 piezas de comunicación.
      emoji: "🏗️"
    - termino: Idea con problema real
      definicion: |-
        Validada por el estudio de mercado con datos verificables, no opinión personal. Atiende necesidad concreta de alguien.
      ejemplo: |-
        "Estudiantes pierden tiempo en filas de la cafetería" verificado con 18 encuestas que reportan promedio de 15 min de espera.
      emoji: "💡"
    - termino: Contabilidad proyectada a 3 meses
      definicion: |-
        Flujo de caja, punto de equilibrio y 3 escenarios. Decisión razonada sobre viabilidad del negocio.
      ejemplo: |-
        Proyectas 3 meses, PE en 60 ventas/mes, esperas 80 en realista. Conclusión, viable con margen estrecho.
      emoji: "📈"
    - termino: Plan de validación
      definicion: |-
        Lista de 5 personas reales con quienes conversarás en 2-3 semanas para verificar supuestos críticos del Canvas.
      ejemplo: |-
        Andrea (cliente potencial), Marcos (proveedor de insumos), tía Lucía (mentor), don Jaime (rectoría), María (compañera).
      emoji: "📞"
    - termino: Bitácora del año
      definicion: |-
        1-2 páginas reflexionando sobre lo aprendido en los 3 periodos. Cierra el grado con autoevaluación honesta.
      ejemplo: |-
        "En P1 aprendí oficio editorial; en P2 método de informes; en P3 me sorprendió la contabilidad. Lo más difícil fue X."
      emoji: "📓"
  quiz:
    titulo: ¿Tu proyecto integrador articula el grado 10°?
    instrucciones: 5 preguntas para verificar los 6 componentes obligatorios.
    preguntas:
      - enunciado: ¿Cuántos componentes obligatorios tiene el proyecto integrador?
        opciones:
          - "1"
          - "6"
          - "20"
          - "100"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 6: idea con problema real, Canvas, contabilidad, comunicación, plan de validación, bitácora.
        feedback_incorrecto: |-
          Son 6 componentes. Faltar a uno deja el proyecto incompleto.
      - enunciado: La idea del proyecto debe estar...
        opciones:
          - Validada por estudio de mercado con datos verificables
          - Inventada
          - Copiada
          - Sin estudiar
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Validación con datos del estudio de mercado, no opinión personal.
        feedback_incorrecto: |-
          Validada por estudio con datos. Sin esa base, la idea es opinión disfrazada de propuesta.
      - enunciado: El plan de validación incluye conversar con...
        opciones:
          - Nadie
          - Solo amigos
          - 1000 personas
          - 5 personas reales en 2-3 semanas
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. 5 personas reales para verificar supuestos críticos del Canvas.
        feedback_incorrecto: |-
          Son 5 personas reales. Conversaciones cortas pero específicas, no encuestas masivas.
      - enunciado: ¿Qué declara la bitácora del año?
        opciones:
          - Solo lo bueno
          - Solo lo malo
          - Reflexión honesta sobre lo aprendido en los 3 periodos
          - Nada
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Reflexión honesta sobre los 3 periodos. Cierra el grado con autoevaluación.
        feedback_incorrecto: |-
          Reflexión honesta. Lo que aprendiste, lo que costó, qué llevas al grado 11°.
      - enunciado: La regla "este proyecto no es ejercicio escolar; es preparación seria" significa que...
        opciones:
          - Es base para el proyecto emprendedor del grado 11° o microempresa real
          - Es opcional
          - Es solo para nota
          - No tiene importancia
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Es puente al grado 11° o base para microempresa real fuera del colegio.
        feedback_incorrecto: |-
          Es preparación seria para el grado 11° o microempresa real. No es ejercicio desechable.

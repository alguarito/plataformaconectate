clave: 1-1
grado: 11
periodo: 1
sesion: 1
completo: true
titulo: Mi marca digital --- del oficio heredado a la huella propia
titulo_portada: |-
  Mi marca digital ---
  del oficio heredado
  a la huella propia
producto_final: Manifiesto de marca personal en una página de cuaderno
apertura:
  saber_ancestral: |-
    En el Valle del Cauca, el Pacífico y el campo colombiano, una persona se conocía por dos cosas: su \textbf{oficio} y su \textbf{palabra}. ``Es el hijo del panadero'', ``los Cárdenas son maestros'', ``esa familia es seria''. Una marca nunca nació en internet --- nació en la plaza del pueblo, en la voz que pasa de vecino a vecino. La marca, en el fondo, es \emph{la promesa que tu nombre sostiene cuando no estás presente}.
  saber_contemporaneo: |-
    Hoy esa promesa se construye en redes, perfiles, búsquedas de Google y huella digital. Un futuro empleador, un jurado de universidad o un cliente potencial te lee \emph{antes} de conocerte. Tu marca personal trabaja por ti --- o en tu contra --- 24 horas al día. Construirla con intención hoy te ahorra borrar errores mañana.
  pregunta_puente: |-
    ¿Qué prometía el nombre de tu familia en su barrio o vereda hace 50 años? ¿Qué promete hoy en redes el nombre que tú llevas?
  saber_hacer: |-
    Al terminar esta guía podrás: (1) \textbf{identificar} qué huella digital tienes hoy; (2) \textbf{explicar} tu propuesta de valor en una frase concreta; (3) \textbf{crear} tu manifiesto de marca personal con cinco bloques fijos; (4) \textbf{evaluar} con criterios el manifiesto de un compañero.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Cinco estaciones, una promesa: al final de la guía habrás escrito --- de tu propia mano --- el manifiesto de marca personal que va a ser tu ancla durante todo el periodo.
  a_escuta: |-
    Una marca no se construye al aire: se levanta sobre lo que ya existe. Antes de proyectar quién quieres ser, vamos a mirar la huella que ya dejaste en internet. Es el espejo más duro y el más útil que tienes hoy.
  a_sistematizacion: |-
    Ya viste lo que la red dice de ti hoy. Ahora vamos a entender qué hace fuerte a una marca, para que la tuya tenga \textbf{criterio}, no \textbf{instinto}. Cuatro pilares del pensamiento computacional aplicados a una sola pregunta: ¿qué prometo, a quién, y por qué?
  a_praxis: |-
    Ya tienes tu propuesta de valor en una frase. Bien. Ahora la vas a convertir en un manifiesto completo --- una página de tu cuaderno que será tu ancla durante todo el periodo 1. Cada guía siguiente lo desarrolla; hoy lo dejas escrito.
  a_producto: |-
    Lo que sigue es el resumen de \emph{qué} entregas hoy y \emph{cómo se sabe} si quedó bien hecho. Léelo antes de cerrar el cuaderno: son los criterios con los que el manifiesto se evalúa --- a ti mismo, primero.
  a_evaluacion: |-
    Antes de cerrar, mira tu trabajo desde cinco dimensiones humanas. Evaluar no es la nota: es lo que se queda en ti cuando esta guía pase. Personal, emocional, ciudadana, local, intergeneracional --- cinco preguntas pequeñas que cambian con el tiempo.
  a_triangulo: |-
    Y para terminar, tres voces antiguas que te van a acompañar durante toda la secundaria. Dussel, un estoico, Floridi. No los memorices --- escúchalos. Cada uno te ofrece un lente distinto para mirar la marca personal que acabas de escribir.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Audita tu huella digital actual} (20 min · individual). En tu celular, abre Google en una pestaña de incógnito y busca tu nombre completo entre comillas. Revisa los primeros 10 resultados de Google y los primeros 5 de Google Imágenes. Luego revisa las últimas 20 publicaciones de tus 3 redes principales (Instagram, TikTok, Facebook o las que uses) con ojo de futuro empleador.
  checks:
  - |-
    Busqué mi nombre completo en Google incógnito y revisé los primeros 10 resultados.
  - |-
    Revisé las últimas 20 publicaciones de mis 3 redes principales con ojo de futuro empleador.
  - 'Clasifiqué cada elemento en: suma, neutro o resta a mi marca.'
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1).} Título: «Actividad 1 --- Auditoría de mi huella digital». \textbf{Formato:} tabla de 3 columnas (Suma~|~Neutro~|~Resta), mínimo 3 elementos por columna, más un párrafo de diagnóstico de 5--8 renglones. \textbf{Sabes que terminaste cuando} cada elemento es específico (URL, post, foto, comentario --- no genérico) y el párrafo responde con honestidad, reconociendo al menos un sesgo de tu propia mirada.
sistematizacion:
  intro: |-
    Una marca personal se compone de cuatro elementos. Vamos a descomponerlos con los pilares del pensamiento computacional para construir tu \textbf{propuesta de valor} con criterio --- no por instinto ni por copia.
  pilares:
  - |-
    \textbf{Descomposición.} Separamos la marca en sus 4 piezas para no diluirla: \textbf{identidad} (quién soy hoy, no quién quisiera ser), \textbf{audiencia} (a quién hablo, lo más concreto posible: ``estudiantes de mi universidad que buscan prácticas'', no ``personas''), \textbf{promesa} (qué resuelvo, en términos del beneficio que recibe el otro, no del esfuerzo que invierto yo) y \textbf{evidencia} (cómo se prueba, con ejemplos reales que ya existen, no con futuros condicionales).
  - |-
    \textbf{Reconocimiento de patrones.} Toda marca fuerte sigue el patrón ``Ayudo a [X] a [resolver/lograr Y] gracias a [Z]''. Una marca de panadería del barrio: ``Ayudo a familias de Cartago a celebrar lo importante con pan recién hecho gracias a la receta de mi abuela''. Cambia cualquiera de las tres variables y la marca pierde nitidez: si dices ``ayudo a personas'' pierdes audiencia, si dices ``con calidad'' pierdes el qué.
  - |-
    \textbf{Abstracción.} Lo esencial de tu marca cabe en \emph{una frase} --- si necesitas tres párrafos para explicar quién eres, todavía no la has abstraído. Esa frase es tu \emph{elevator pitch}: la que dirías en un ascensor, en una cita rápida, en la primera línea de tu LinkedIn. Si la tienes clara, todo lo demás (sitio, redes, perfil) se vuelve consecuencia natural. Si no, cualquier decisión visual o textual se sentirá improvisada.
  - |-
    \textbf{Algoritmo.} Pasos para construirla: (1) lista 3 audiencias posibles --- lo más concretas que puedas (``estudiantes de comunicación que quieren agencia'', no ``jóvenes''); (2) lista 3 resultados que sabes producir, verificables con evidencia ya existente en tu vida; (3) combínalos en 3 frases con el patrón ``Ayudo a [X] a [Y] gracias a [Z]''; (4) léelas en voz alta --- la que no te avergüenza ni te infla es la auténtica. Esa es tu propuesta de valor.
  anatomia:
    titulo: Anatomía de una propuesta de valor sólida
    body: |-
      \textbf{Ayudo a} [audiencia concreta, no ``personas''] \textbf{a} [resolver/lograr resultado específico, no ``ayudar''] \textbf{gracias a} [tu fortaleza distintiva, no ``ser creativo'']. \\[2mm] \textbf{Ejemplo débil:} ``Soy creativo y me gusta el diseño.'' \\[1mm] \textbf{Ejemplo fuerte:} ``Ayudo a pequeños negocios de Cartago a contar su historia en video corto.''
  errores_comunes: |-
    (1) Frases genéricas tipo ``soy proactivo y trabajador'': suenan a CV de los noventa, no diferencian a nadie. (2) Audiencia vaga (``personas'', ``jóvenes'', ``profesionales''): tan amplia que no le sirve a nadie en concreto; la audiencia útil cabe en una habitación. (3) Inflar logros que no sostienes con evidencia: el primer encuentro real expone la inflación. (4) Copiar la marca de alguien que admiras: tu autenticidad es lo único que no se puede copiar. (5) Esperar a tener ``cosas que mostrar'' para definir la marca: la marca se construye antes de la primera evidencia, no después --- es lo que ordena qué evidencia producir.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Mi propuesta de valor». \textbf{Formato:} 3 versiones de tu propuesta numeradas (1, 2, 3) siguiendo el patrón ``Ayudo a [X] a [Y] gracias a [Z]'', cambiando cada vez la audiencia o la fortaleza. Luego marca con $\star$ la versión elegida y escribe 2 renglones explicando por qué esa. \textbf{Sabes que terminaste cuando} cada frase nombra una audiencia concreta (no ``personas''), un resultado específico (no ``ayudar''), y la elegida la puedes decir en voz alta sin titubear.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu Manifiesto de Marca Personal} (30 min · individual). En una página del cuaderno vas a escribir 5 bloques cortos con títulos fijos. Este manifiesto será tu ancla durante todo el periodo 1 --- cada guía siguiente lo desarrolla.
  pilares:
  - |-
    \textbf{Descomposición.} Tu manifiesto se descompone en 5 bloques fijos, cada uno con función pedagógica distinta: \textbf{Quién soy} (te ancla en lo real, sin currículum), \textbf{A quién sirvo} (compromete a una audiencia concreta), \textbf{Qué prometo} (declara el valor entregado), \textbf{Qué NO soy} (delimita los rechazos --- crucial para tu identidad), \textbf{Cómo me reconocerán} (vuelve la promesa observable). Los 5 bloques actúan juntos; si falta cualquiera, la marca queda incompleta.
  - |-
    \textbf{Patrones.} Sigue el patrón clásico de manifiestos fuertes: \textbf{lenguaje directo} (sin adjetivos vacíos como ``apasionado''), \textbf{primera persona} (yo, no ``el alumno''), \textbf{frases cortas} (no más de una idea por oración), \textbf{evidencia concreta} (un proyecto real, una pieza terminada). El opuesto se reconoce fácil: lleno de promesas vagas y sin un solo ejemplo verificable.
  - |-
    \textbf{Abstracción.} Cada bloque expresa una sola idea --- si un bloque tuyo dice tres cosas distintas, todavía no abstrajiste lo esencial. Es el momento más difícil del manifiesto: el primer borrador siempre dice de más. Releerlo al día siguiente con un lápiz para tachar es lo que separa una marca confusa de una nítida. El test final: léelo en voz alta a alguien que te conoce y mira si te reconoce.
  - |-
    \textbf{Algoritmo.} Pasos para no perderte: (1) escribe los 5 títulos en blanco en la página, dejando espacio entre cada uno; (2) llena ``Quién soy'' primero, en 2-3 renglones --- sin currículum, sin inflar; (3) cierra con ``Qué NO soy'' usando 3 cosas concretas (``no soy el que diseña carteles en una hora'', no ``no soy malo''); (4) ``Cómo me reconocerán'' con 3 evidencias observables (manera de escribir, temas que repites, una marca visual que ya tienes).
  checklist:
    titulo: Checklist del manifiesto antes de cerrar el cuaderno
    items: |-
      \checkbox Los 5 bloques están presentes y titulados. \\[1mm] \checkbox ``Qué NO soy'' tiene al menos 3 cosas concretas (no ``no soy malo''). \\[1mm] \checkbox ``Cómo me reconocerán'' da 3 evidencias observables (manera de escribir, temas que repites, una marca visual). \\[1mm] \checkbox Lo puedes leer en voz alta sin avergonzarte ni inflarte. \\[1mm] \checkbox Tu propuesta de valor (Actividad 2) se refleja de forma coherente.
  plantilla_guion: |-
    \textbf{Quién soy.} \textit{En 2--3 renglones, quién eres hoy sin currículum.} \\[1mm] \textbf{A quién sirvo.} \textit{La audiencia concreta de tu marca en este momento.} \\[1mm] \textbf{Qué prometo.} \textit{El resultado que sabes producir.} \\[1mm] \textbf{Qué NO soy.} \textit{3 cosas con las que no quieres que te confundan.} \\[1mm] \textbf{Cómo me reconocerán.} \textit{3 evidencias observables --- no abstracciones.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Manifiesto de marca personal · versión 1». \textbf{Formato:} 5 bloques titulados (Quién soy · A quién sirvo · Qué prometo · Qué NO soy · Cómo me reconocerán), 3--5 renglones cada uno. \textbf{Extensión:} una página completa de cuaderno. \textbf{Sabes que terminaste cuando} los 5 bloques están presentes con sus títulos exactos, ``Qué NO soy'' tiene al menos 3 cosas concretas, ``Cómo me reconocerán'' da 3 evidencias observables, y puedes leerlo en voz alta sin avergonzarte ni inflarte.
  producto_titulo: Manifiesto de marca personal en una página de cuaderno
  criterios:
  - Los 5 bloques están presentes y titulados con el nombre exacto
  - '``Qué NO soy'''' tiene al menos 3 cosas concretas'
  - '``Cómo me reconocerán'''' da 3 evidencias observables (no abstracciones)'
  - El manifiesto suena a ti --- ni inflado ni copiado
  - Tu propuesta de valor de la Actividad 2 se refleja con coherencia
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: Sin reconocimiento del Otro no hay justicia, sólo poder.
    aplicacion: |-
      Una marca personal puede ser un acto de reconocimiento o un acto de poder. Si tu marca solo te promociona a ti, ejerce poder; si abre espacio a otros, encuentra justicia. En el Valle, las marcas familiares más respetadas eran las que sostuvieron una comunidad.
    pregunta_espejo: ¿A quién sirve mi marca? ¿Reconozco al Otro o solo me promociono?
  estoico:
    autor: Marco Aurelio
    cita: Tu vida es lo que tus pensamientos hagan de ella.
    aplicacion: |-
      Lo que publicas, cómo respondes a un mensaje incómodo, cómo manejas un comentario hostil: todo \emph{eso} depende de ti. Los algoritmos, los juicios ajenos, el clima de las redes: \emph{eso no}. Distinguir las dos columnas es la ataraxia digital.
    pregunta_espejo: |-
      ¿La huella que dejo coincide con quien quiero ser? ¿Distingo lo que depende de mí de lo que no?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Somos inforgs en una infoesfera que cuidamos o degradamos con cada acto informacional.
    aplicacion: |-
      Cada publicación tuya es un acto informacional: añade valor a la infoesfera o la ensucia. Tu marca personal, en términos de Floridi, es una responsabilidad sobre el bien común informacional. No es vanidad: es ética digital aplicada.
    pregunta_espejo: |-
      ¿Mi marca enriquece o ensucia la infoesfera? ¿Lo que añado al mundo digital agrega valor a otros?
compromiso: |-
  \textbf{Para la próxima semana.} Antes de cada publicación en cualquier red, pregúntate: ¿esto suma o resta a la marca que escribí hoy en mi manifiesto? Si no suma, no se publica. Esa disciplina de una semana vale más que mil consejos. El próximo lunes traes tu manifiesto al aula y le añades los aprendizajes de la semana.

producto_final: Sitio público anunciado en 3 redes + bitácora del cuaderno de marca · semana 1
apertura:
  saber_ancestral: |-
    La \textbf{inauguración del taller} era un ritual del oficio. El carpintero, panadero o sastre que terminaba su aprendizaje y abría su propio espacio para el barrio invitaba a los vecinos, al maestro que lo enseñó, a la familia. Había nervios, había errores, había curiosos que asomaban. Pero el ritual mismo --- abrir las puertas, anunciar el oficio, recibir la primera mirada externa --- era más importante que la perfección. \emph{Lo importante era empezar; el resto se aprende sirviendo a los primeros clientes.}
  origen: Tradición de la inauguración del taller en pueblos del Valle y el Pacífico
  saber_contemporaneo: |-
    Hoy el ritual cambia de plaza pero conserva el espíritu: \textbf{anunciar tu sitio público en tres redes}, escribir el primer post que cuenta tu propuesta, iniciar tu \textbf{bitácora de marca} (cuaderno donde anotas lo que aprendes semana a semana). Y sobre todo: aceptar que la primera versión es imperfecta. El error más común no es lanzar mal --- es no lanzar.
  pregunta_puente: |-
    ¿Qué de los antiguos rituales de inauguración del taller sigue siendo necesario hoy para lanzar una marca? ¿Por qué empezar imperfecto venció a esperar perfecto?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} cómo lanzaron 3 marcas que admiras (post inicial, redes elegidas, copy); (2) \textbf{explicar} por qué empezar imperfecto siempre vence a esperar perfecto; (3) \textbf{crear} tu post de lanzamiento + bitácora semana 1; (4) \textbf{evaluar} el lanzamiento de un compañero con criterios.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hoy cierras el Periodo 1 --- nueve guías te trajeron hasta aquí. Hora de abrir las puertas del taller.
  a_escuta: |-
    Antes de lanzar tu propio sitio, vas a leer cómo lanzaron otros. Buenos y malos lanzamientos enseñan algo distinto. La diferencia entre los dos suele ser pequeña y decidible.
  a_sistematizacion: |-
    Ya viste 3 lanzamientos reales. Ahora vamos a entender por qué \textbf{empezar imperfecto vence a esperar perfecto}: las 4 razones que la psicología, el emprendimiento y el oficio confirman.
  a_praxis: |-
    Tienes el principio. Toca lanzar de verdad: post de presentación en 3 redes, enlace a tu sitio (Guía 4), tu propuesta de valor (Guía 1), tu imagen (Guía 7), tu voz (Guía 5). Todo lo que has construido converge en este momento.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy y cierras el Periodo 1: sitio anunciado + bitácora iniciada. El criterio principal: que el siguiente lunes puedas mirar atrás y decir ``empecé''.
  a_evaluacion: |-
    Antes de cerrar, mira el lanzamiento desde las cinco dimensiones humanas. Publicar tiene costo emocional y consecuencias ciudadanas que vale la pena nombrar.
  a_triangulo: |-
    Y para terminar, tres voces sobre lanzar al mundo. Dussel sobre servir vs destacar, Marco Aurelio sobre los errores del primer día, Floridi sobre añadir a la infoesfera con responsabilidad.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Cómo lanzaron 3 marcas que admiras} (15 min · individual). Busca en redes \textbf{el primer post} de 3 perfiles profesionales que admiras (puedes revisar publicaciones antiguas o buscar ``cuando lancé''). Para cada uno: ¿qué decían? ¿qué pedían (o no pedían)? ¿cuántas reacciones tuvieron? ¿se sentía honesto o inflado?
  checks:
  - Encontré el primer post de 3 marcas/personas profesionales que admiro.
  - Los comparé en honestidad, especificidad y tono.
  - Identifiqué el patrón común a los 3 lanzamientos que se sintieron buenos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 3 lanzamientos que admiro». \textbf{Formato:} 3 fichas, una por marca, cada una con: copy textual (o paráfrasis), tono, reacciones recibidas, y qué lección personal te llevas. Al final un párrafo de 3 renglones con el patrón común. \textbf{Sabes que terminaste cuando} las 3 fichas tienen observaciones específicas, no generalidades, y el patrón común se puede aplicar a tu propio lanzamiento.
sistematizacion:
  intro: |-
    El principio del oficio digital: ``empezar imperfecto siempre vence a esperar perfecto''. Vamos a descomponer las 4 razones --- psicológicas, prácticas y éticas --- por las que esto es cierto.
  pilares:
  - |-
    \textbf{Descomposición.} El argumento de ``empezar imperfecto vence a esperar perfecto'' se descompone en 4 razones independientes pero complementarias: (1) \textbf{aprendizaje} (solo el lanzamiento real genera feedback real; las simulaciones mentales no enseñan lo que enseña una reacción auténtica); (2) \textbf{tiempo} (cada mes que esperas es un mes que no \emph{compounding} aprendizajes ni reputación); (3) \textbf{visibilidad} (quien no lanza no existe en la infoesfera; el algoritmo solo conoce a quien publica); (4) \textbf{ego} (esperar la perfección es miedo disfrazado de criterio; el perfeccionismo es a veces solo postergación elegante).
  - |-
    \textbf{Patrones.} El patrón del lanzamiento sano sigue la fórmula \textbf{``v1 honesto > v0 perfecto''}: una primera versión sencilla pero real publicada hoy es más valiosa que una versión \emph{master} planificada para el próximo año. Lo confirman desde el Lean Startup de Eric Ries hasta los lanzamientos iniciales de Apple en los 70 (con teclado expuesto y sin caja final) o de Twitter en 2006 (solo 140 caracteres y sin enlaces clickables). El primer lanzamiento es siempre la línea base, no la meta final.
  - |-
    \textbf{Abstracción.} Lo esencial del lanzamiento cabe en una pregunta: \emph{¿qué se rompe si lanzo hoy mi v1?}. Si la respuesta honesta es ``nada irreversible'' (un error tipográfico se corrige, un comentario incómodo se aprende, una foto pixelada se cambia), entonces lo estás postergando por miedo, no por criterio. La pregunta opuesta es: \emph{¿qué se rompe si NO lanzo este año?}. La respuesta también honesta es: ``mucho más''. El miedo se llama por su nombre.
  - |-
    \textbf{Algoritmo.} Pasos del lanzamiento mínimo viable: (1) elige 3 redes donde tu audiencia real está (LinkedIn para profesional, Instagram para visual, WhatsApp para cercanía); (2) escribe 1 post de presentación coherente con tu marca (los 5 bloques del manifiesto en versión corta); (3) adapta el copy a cada red (LinkedIn más texto, Instagram más imagen, WhatsApp más cercano); (4) publica los 3 posts en una sola hora --- no acumules ni esperes momentos ``perfectos''; (5) responde a los primeros comentarios esa misma semana con humildad y curiosidad, no con defensa.
  anatomia:
    titulo: Anatomía de un post de lanzamiento sólido
    body: |-
      \textbf{Frase 1 (gancho):} algo que detenga el scroll, no una autopromoción obvia. \\[1mm] \textbf{Frase 2 (qué hago):} tu propuesta de valor en una línea (Guía 1). \\[1mm] \textbf{Frase 3 (a quién sirvo):} la audiencia concreta para la que es útil. \\[1mm] \textbf{Frase 4 (qué pido):} una pequeña acción específica (visitar el sitio, dejar feedback). \\[1mm] \textbf{Enlace:} URL de tu sitio. \textbf{Imagen:} tu retrato de la Guía 7.
  errores_comunes: |-
    (1) Esperar a tener \emph{todo} listo: la perfección es enemiga del lanzamiento; siempre habrá un detalle más que pulir, y ese ``uno más'' nunca termina. (2) Post genérico tipo ``hola mundo, mírenme'' o ``apenas empezando, sean amables'': muerte instantánea --- no genera interés ni invitación a actuar. (3) Lanzar en 1 sola red y olvidar las otras 2: pierdes alcance fácil; cada red tiene una audiencia parcial distinta. (4) No responder a los primeros comentarios: parece que abandonas el taller recién inaugurado; los primeros comentarios son los que más pesan algorítmicamente. (5) Disculparte por la imperfección (``perdón por lo simple'', ``apenas estoy empezando''): le quita energía al lanzamiento y comunica que tú mismo no crees en lo que muestras.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Por qué empezar imperfecto vence a esperar perfecto». \textbf{Formato:} 4 fichas, una por razón (aprendizaje / tiempo / visibilidad / ego), cada una con: argumento + ejemplo concreto de tu propia experiencia. \textbf{Sabes que terminaste cuando} reconoces en ti al menos UN proyecto que postergaste por perfeccionismo y puedes nombrarlo honestamente.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu lanzamiento real} (40 min · individual). Hora de abrir las puertas del taller. Vas a redactar 3 posts adaptados a 3 redes distintas, publicarlos en una hora, y escribir la primera entrada de tu bitácora de marca --- el cierre del Periodo 1.
  pilares:
  - |-
    \textbf{Descomposición.} Tu lanzamiento se descompone en 4 piezas distintas pero coherentes: (1) \textbf{post LinkedIn} (tono profesional, texto sustantivo de 4-6 frases con enlace al sitio); (2) \textbf{post Instagram} (tono visual, foto profesional de la Guía 7, caption breve con URL en bio); (3) \textbf{post personal} en WhatsApp/Telegram (tono cercano para tu círculo familiar y amigos cercanos); (4) \textbf{bitácora semana 1} (entrada escrita el mismo día del lanzamiento, capturando cómo te sentiste, qué reacciones recibiste y qué decisión tomas para la próxima publicación).
  - |-
    \textbf{Patrones.} Sigue el patrón \textbf{``adaptación, no copia''}: el mismo mensaje base pero ajustado al tono y formato de cada red. LinkedIn más texto y formal, Instagram más imagen y emocional, WhatsApp más cercano y conversacional. Es el mismo principio que usan los pregoneros antiguos cuando cambiaban el tono según pasaban por la plaza, el mercado o la esquina del barrio. El contenido es el mismo; la voz se modula.
  - |-
    \textbf{Abstracción.} Cada post expresa una sola idea principal: \emph{``abrí mi sitio, esto es lo que hago, mira si te sirve''}. Sin alardes. Sin promesas que no cumples. Sin disculpas por la imperfección. Una sola idea, una sola acción pedida (visitar el sitio), una sola imagen. El post de lanzamiento que intenta decir 5 cosas no dice ninguna; el que dice 1 con claridad se recuerda.
  - |-
    \textbf{Algoritmo.} Lanzamiento en orden: (1) escribe el post LinkedIn primero (es el más largo y sustantivo); (2) condénsalo para Instagram en una caption breve más visual; (3) adáptalo al tono cercano de WhatsApp; (4) publica los 3 en una sola hora --- no programes, no acumules; (5) responde TODOS los comentarios esa misma semana con curiosidad, no con defensa; (6) escribe la bitácora del día 1 antes de dormir, capturando emociones y reacciones en caliente.
  checklist:
    titulo: Checklist antes de declarar el lanzamiento hecho
    items: |-
      \checkbox 3 posts publicados (LinkedIn + Instagram + grupo cercano). \\[1mm] \checkbox Cada post enlaza al sitio público de la Guía 4. \\[1mm] \checkbox Cada post incluye una imagen profesional de la Guía 7. \\[1mm] \checkbox Cero ``perdón por lo imperfecto'' o ``apenas empiezo'': lanzar es lanzar. \\[1mm] \checkbox Primera entrada de bitácora escrita (cómo me siento, qué aprendí hoy).
  plantilla_guion: |-
    \textbf{Post LinkedIn.} \textit{Texto completo, 4 frases + enlace + imagen.} \\[1mm] \textbf{Post Instagram.} \textit{Caption breve + imagen + URL en bio.} \\[1mm] \textbf{Mensaje cercano.} \textit{Texto adaptado para tu grupo de WhatsApp.} \\[1mm] \textbf{Bitácora día 1.} \textit{¿Cómo me sentí lanzando? ¿Qué reacción esperaba? ¿Qué reacción recibí?}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi lanzamiento P1». \textbf{Formato:} las 3 versiones del post + la entrada de bitácora día 1 + capturas de las publicaciones reales. \textbf{Extensión:} una página de cuaderno. \textbf{Sabes que terminaste cuando} los 3 posts están publicados (no programados) y la bitácora está escrita en tiempo real.
  producto_titulo: Sitio anunciado en 3 redes + bitácora del cuaderno de marca · semana 1
  criterios:
  - Los 3 posts están publicados en redes reales, no en borrador
  - Cada post enlaza al sitio y tiene imagen profesional
  - Cero disculpas por imperfección en los textos
  - Primera entrada de bitácora escrita el mismo día del lanzamiento
  - |-
    Has decidido un horario semanal fijo para escribir la bitácora durante el próximo periodo
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: Toda comunidad de comunicación se hace plena cuando incluye la voz del excluido.
    aplicacion: |-
      Lanzar puede ser un acto de promoción individual o un acto de servicio comunitario. Si tu primer post solo dice ``mírenme'', no abres puerta para nadie. Si dice ``aquí estoy, esto sé hacer, dime si te sirvo'', invitas. El primer lanzamiento define el tono de los próximos cien.
    pregunta_espejo: |-
      ¿Mi lanzamiento es una invitación a servir o una promoción de mí mismo? ¿A quién abro la puerta hoy y a quién la cierro sin querer?
  estoico:
    autor: Marco Aurelio
    cita: El obstáculo en el camino se vuelve el camino.
    aplicacion: |-
      Algo va a salir mal en tu primer lanzamiento: un error de tipografía, una imagen pixelada, un comentario incómodo, un silencio que esperabas más sonoro. Eso no es el fracaso del lanzamiento --- es el lanzamiento. La calma estoica te permite leer cada error como información, no como golpe.
    pregunta_espejo: |-
      Lo que salió mal del lanzamiento, ¿depende de mí corregirlo, o no? ¿Qué error concreto se convierte en lección si lo miro sin drama?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Cada lanzamiento añade un agente más a la infoesfera; cuídala como cuidas tu firma.
    aplicacion: |-
      Tu post de lanzamiento es información permanente en la red. Los archivos del futuro lo guardarán, los buscadores lo indexarán, alguien lo leerá en 10 años. Floridi nos pediría preguntarnos: ¿este post de hoy es algo que mi yo de 30 años va a defender o lamentar?
    pregunta_espejo: |-
      ¿Mi lanzamiento aporta algo útil a la infoesfera o solo añade ruido? ¿Lo defenderé en 10 años?
compromiso: |-
  \textbf{Para la próxima semana --- y el cierre del Periodo 1.} Lunes a las 7 p. m., abre tu cuaderno de marca y escribe la \textbf{bitácora semana 2}: ¿qué dijeron del lanzamiento? ¿cuántas visitas tuviste? ¿qué decisión tomas para la próxima publicación? Esa disciplina semanal es lo que diferencia una marca real de una publicación aislada. Próximo lunes: arrancamos el Periodo 2 --- Automatización y procesos. \emph{Felicitaciones por terminar el primero.}
web:
  resumen: |-
    Cierras el Periodo 1: anuncias tu sitio en 3 redes, abres tu bitácora de marca y aceptas que empezar imperfecto siempre vence a esperar perfecto.
  subtema: Cosecha · Cierre del Periodo 1
  pre_lectura:
    por_que_importa: |-
      Nueve guías te trajeron hasta aquí. Tienes manifiesto, sistema visual, sitio publicado, copy, SEO, imagen, LinkedIn y métricas. Hoy abres las puertas del taller. El error más común no es lanzar mal — es no lanzar.
    pregunta_detonante: |-
      Si tu yo de hace 10 semanas viera tu sitio hoy, ¿qué sentiría? Y si tu yo de dentro de 1 año mira lo que NO publicaste por miedo a la imperfección, ¿qué te diría?
    activacion:
      titulo: El test del año perdido
      descripcion: |-
        En 3 minutos, escribe 3 proyectos personales que postergaste alguna vez "hasta que estén perfectos" y nunca lanzaste. Mira esa lista. Esa lista es contra lo que vas a luchar hoy — porque lo que NO publicas no existe en la infoesfera.
      duracion_min: 4
    conexion:
      anterior: En la sesión 9 instalaste métricas. Ya tienes ojos para leer lo que pase después del lanzamiento.
      siguiente: |-
        En el Periodo 2 arrancas Automatización y procesos. La presencia digital queda viva — la mejoras desde la práctica.
  conceptos_clave:
    - termino: v1 honesto > v0 perfecto
      definicion: |-
        Una primera versión sencilla pero publicada hoy es más valiosa que una versión perfecta planificada para el próximo año. La perfección es enemiga del lanzamiento.
      ejemplo: |-
        Tu sitio v1 con 3 secciones publicado hoy genera más aprendizaje que tu sitio "perfecto" de 10 secciones que sigue en borrador 6 meses después.
      emoji: "🚀"
    - termino: Las 4 razones para empezar imperfecto
      definicion: |-
        Aprendizaje (feedback real), tiempo (compounding semanal), visibilidad (existencia en infoesfera), ego (esperar la perfección es miedo disfrazado de criterio).
      ejemplo: |-
        Cada mes que esperas, otro lanza imperfecto, recibe feedback, ajusta, y avanza 4 ciclos delante de ti. El compounding del lanzamiento es real.
      emoji: "⏳"
    - termino: Post de lanzamiento (anatomía)
      definicion: |-
        5 piezas mínimas: gancho que detenga el scroll + propuesta de valor + audiencia + pequeña acción solicitada + enlace al sitio. Sin alardes, sin disculpas.
      ejemplo: |-
        "Estuve 10 semanas construyendo esto. Ayudo a [audiencia] a [resultado]. Si te sirve, échale una mirada y dime qué piensas → [URL]".
      emoji: "📝"
    - termino: Adaptación, no copia (3 redes)
      definicion: |-
        El mismo mensaje base pero ajustado al tono y formato de cada red. LinkedIn más texto, Instagram más imagen, WhatsApp más cercano.
      ejemplo: |-
        LinkedIn: texto largo + reflexión. Instagram: imagen + caption breve. WhatsApp grupo cercano: texto en voz íntima de tu propio círculo.
      emoji: "🔁"
    - termino: Bitácora de marca
      definicion: |-
        Cuaderno o documento donde anotas semana a semana qué pasó con tu marca: visitas, sorpresas, decisiones tomadas, aprendizajes. Sin bitácora, la marca no aprende.
      ejemplo: |-
        Lunes 7 p. m., 15 minutos: ¿qué dijeron del lanzamiento? ¿cuántas visitas? ¿qué decisión tomo esta semana? Esa disciplina hace la diferencia.
      emoji: "📓"
    - termino: Cero disculpas
      definicion: |-
        Tu post de lanzamiento NO incluye "perdón por lo imperfecto" ni "apenas empiezo". Lanzar es lanzar — disculparte ANTES debilita lo que ofreces.
      ejemplo: |-
        Mal: "Disculpen lo simple, apenas empiezo en esto". Bien: "Aquí está, esto es lo que sé hacer. Si te sirve, escríbeme".
      emoji: "🙅"
  quiz:
    titulo: "✅ Cierre del Periodo 1"
    instrucciones: |-
      5 preguntas para cerrar P1 y confirmar que dominas el principio del lanzamiento sano. Necesitas 4/5 para sentir el cierre del periodo completo.
    preguntas:
      - enunciado: ¿Cuál es el error más grave en un post de lanzamiento?
        opciones:
          - Que sea muy corto
          - Disculparte por la imperfección antes de mostrar lo que ofreces
          - Que tenga imagen
          - Que enlace a tu sitio
        respuesta_index: 1
        feedback_correcto: |-
          Sí. "Disculpen lo simple, apenas empiezo" debilita ANTES de mostrar. Lanzar es lanzar — sin disculpas.
        feedback_incorrecto: |-
          Disculparte por la imperfección. Esa frase debilita el post antes de mostrar lo que ofreces. Lanza sin disculpas — el sitio habla por sí mismo.
      - enunciado: ¿Por qué empezar imperfecto vence a esperar perfecto?
        opciones:
          - Porque la imperfección es bonita
          - Porque solo el lanzamiento real genera feedback real y aprendizaje compounding
          - Porque es más rápido
          - Porque es más fácil
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Sin lanzamiento no hay feedback; sin feedback no hay aprendizaje. Cada mes esperando es un mes sin compounding.
        feedback_incorrecto: |-
          Solo el lanzamiento genera feedback real. Sin feedback no aprendes — y mientras esperas, otros avanzan 4 ciclos delante de ti.
      - enunciado: ¿Cuántas piezas mínimas tiene un post de lanzamiento sólido?
        opciones:
          - "2: gancho + enlace"
          - "5: gancho + propuesta de valor + audiencia + pequeña acción + enlace"
          - "10: muchos detalles"
          - Las que sean necesarias
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 5 piezas: gancho, propuesta de valor, audiencia, pequeña acción, enlace. Sin alguna, el post pierde fuerza.
        feedback_incorrecto: |-
          5 piezas: gancho + propuesta de valor + audiencia + pequeña acción + enlace. Cada una cumple una función — quitar alguna debilita el post.
      - enunciado: ¿Qué es la "bitácora de marca"?
        opciones:
          - Un blog en tu sitio
          - Cuaderno donde anotas semana a semana qué pasa con tu marca y qué decisión tomas
          - Una herramienta de IA
          - Tu calendario
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Bitácora = cuaderno semanal de aprendizaje. Sin ella, la marca no aprende — recibe feedback y lo olvida.
        feedback_incorrecto: |-
          Bitácora de marca: cuaderno semanal donde anotas qué pasó, qué te sorprendió y qué decides. Es lo que convierte feedback en aprendizaje.
      - enunciado: |-
          En el saber del ritual de inauguración del taller, ¿qué aplica directamente a tu lanzamiento digital?
        opciones:
          - Nada — los talleres no tienen que ver con redes
          - Que el ritual mismo (abrir las puertas, anunciar) es más importante que la perfección
          - Que se servía comida
          - Que se firmaba un contrato
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El maestro del taller no esperaba a ser perfecto: abría puertas, recibía la primera mirada, aprendía sirviendo a los primeros clientes. Mismo principio hoy.
        feedback_incorrecto: |-
          El ritual mismo importa más que la perfección. El maestro abría con nervios, errores y curiosos. Tú haces lo mismo hoy, en formato digital.
  post_lectura:
    transferencia: |-
      Esta semana — y el cierre del Periodo 1. Lunes a las 7 p. m., abre tu cuaderno de marca y escribe la bitácora semana 2: ¿qué dijeron del lanzamiento? ¿cuántas visitas tuviste? ¿qué decisión tomas para la próxima publicación? Esa disciplina semanal es lo que diferencia una marca real de una publicación aislada. Próximo lunes arrancamos el Periodo 2 — Automatización y procesos. Felicitaciones por terminar el primero.
  cinco_dimensiones:
    personal: Cerraste 10 semanas de construcción con un lanzamiento real — pasaste del cuaderno al mundo.
    emocional: Resististe la tentación del perfeccionismo y elegiste empezar con la disciplina de cero disculpas.
    ciudadana: Tu primer post define el tono de los próximos cien — eligió servir antes que destacar.
    local: |-
      Tu lanzamiento llevó señales del Valle a una infoesfera global que premia lo genérico — pequeña victoria.
    intergeneracional: |-
      Heredaste el ritual de inauguración del taller y lo actualizaste en formato 2026: el principio sobrevive.

clave: 1-2
grado: 11
periodo: 1
sesion: 2
completo: true
titulo: Identidad visual --- del grafismo ancestral a la paleta propia
titulo_portada: |-
  Identidad visual ---
  del grafismo ancestral
  a la paleta propia
producto_final: 'Sistema visual mínimo: 1 paleta (3-5 colores) · 1 par tipográfico · 1 lockup'
apertura:
  saber_ancestral: |-
    Mucho antes de los ``manuales de marca'', los pueblos ya tenían identidad visual. La \textbf{orfebrería Quimbaya}, los \textbf{tejidos Wayuu}, las \textbf{molas guna} y los grafismos del Pacífico colombiano transmitían, en una sola pieza, quién era el pueblo que la había hecho. Sin firma, sin texto. Solo geometría, color y proporción. Esa gramática visual sostenía el reconocimiento entre generaciones.
  origen: Grafismos ancestrales — Quimbaya, Wayuu, Guna, Pacífico colombiano
  saber_contemporaneo: |-
    Las marcas modernas usan exactamente el mismo principio en formato digital: una \textbf{paleta} de 3 a 5 colores (no más), un \textbf{par tipográfico} (una fuente para titulares y una para cuerpo) y un \textbf{lockup} (cómo se firma el nombre y el logo). Esa pieza mínima identifica tu marca antes de que el espectador lea una palabra.
  pregunta_puente: |-
    ¿Qué señales visuales hacen que reconozcas inmediatamente a una familia, a un equipo del barrio o a tu colegio sin leer su nombre? ¿Por qué esas señales funcionan?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} gramáticas visuales en tu entorno cercano (ancestrales, populares, comerciales); (2) \textbf{analizar} el sistema visual de tres marcas que admiras; (3) \textbf{crear} tu propio sistema visual mínimo coherente con tu manifiesto; (4) \textbf{evaluar} el sistema de un compañero con criterios de coherencia y diferenciación.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hoy le pondrás \emph{cara} a la marca que definiste la semana pasada --- la promesa que escribiste necesita una piel visual que la sostenga.
  a_escuta: |-
    Toda identidad visual nace de \emph{ver primero}. Antes de diseñar la tuya, vas a entrenar el ojo: cómo se reconocen pueblos, oficios y barrios sin necesidad de palabras. Sin ese entrenamiento, cualquier paleta que elijas será aleatoria.
  a_sistematizacion: |-
    Ya viste cómo otros transmiten identidad sin palabras. Ahora vamos a entender los \textbf{tres componentes} que toda marca digital usa para hacerlo: paleta, tipografía y lockup. Tres piezas, una decisión coherente.
  a_praxis: |-
    Tienes el vocabulario y los referentes. Toca decidir: ¿qué paleta, qué tipografía y qué lockup hablan por la marca que escribiste la semana pasada? Esto es lo que vas a entregar hoy.
  a_producto: |-
    Lo que sigue es el resumen de \emph{qué} entregas y \emph{cómo se sabe} si tu sistema visual es coherente. El primer criterio: que un extraño pueda mirarlo y sentir tu marca sin que tú la expliques.
  a_evaluacion: |-
    Antes de cerrar, mira tu sistema visual desde las cinco dimensiones humanas. Las decisiones estéticas tienen consecuencias personales, ciudadanas, locales --- aunque a primera vista no lo parezca.
  a_triangulo: |-
    Y para terminar, tres voces sobre la imagen. Dussel sobre la belleza descolonizada, Marco Aurelio sobre la belleza propia, Floridi sobre la responsabilidad visual en la infoesfera. Cada uno te ofrece un lente distinto para mirar el sistema que acabas de crear.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Gramáticas visuales en tu entorno} (15 min · individual). Sin moverte de donde estás, observa con atención \textbf{tres ejemplos} de identidad visual cercana: (1) un objeto de tradición ancestral o popular (tejido, cerámica, ropa de fiesta), (2) un negocio del barrio (panadería, peluquería, taller), (3) una marca global presente en tu cotidianidad (zapatillas, app, café). Para cada uno: ¿qué colores usa? ¿qué formas? ¿qué transmite sin palabras?
  checks:
  - Encontré un ejemplo de identidad visual ancestral o popular en mi entorno.
  - Encontré un ejemplo de identidad visual de un negocio local que reconozco.
  - Encontré un ejemplo de identidad visual global presente en mi cotidianidad.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Gramáticas visuales en mi entorno». \textbf{Formato:} tabla de 4 columnas (Ejemplo | Colores principales | Formas y patrones | Qué transmite). \textbf{Extensión:} 3 filas, una por ejemplo. \textbf{Sabes que terminaste cuando} cada fila menciona colores específicos (no ``varios''), formas concretas (no ``diseños bonitos'') y un mensaje que el sistema visual transmite sin texto.
sistematizacion:
  intro: |-
    Todo sistema visual moderno se compone de tres piezas mínimas. Vamos a descomponerlas con los pilares del pensamiento computacional para que puedas diseñar el tuyo con criterio.
  pilares:
  - |-
    \textbf{Descomposición.} Una identidad visual se descompone en 3 piezas mínimas: (1) \textbf{paleta} de 3-5 colores con función clara (no decorativos al azar; uno domina, uno acompaña, uno acentúa); (2) \textbf{tipografía} con una fuente display para titulares y una fuente cuerpo para texto largo (nunca dos display compitiendo); (3) \textbf{lockup}, la firma de tu nombre con su tratamiento visual fijo (color, fuente, espacios definidos). Sin las 3 piezas, la identidad se siente improvisada.
  - |-
    \textbf{Reconocimiento de patrones.} Toda identidad fuerte sigue patrones medibles de contraste y proporción: un color dominante a \textasciitilde 60\%, uno de soporte a \textasciitilde 30\%, uno de acento a \textasciitilde 10\%; un tipo display contrastado contra el cuerpo (si el display es serif geométrica, el cuerpo es sans humanista); espacio en blanco generoso. Mira NASA, Apple o el Banco de la República: las proporciones aguantan décadas. Cambia las proporciones y la identidad se rompe en semanas.
  - |-
    \textbf{Abstracción.} Lo esencial de un sistema visual cabe en \emph{una sola pieza}: si tu lockup, reducido al tamaño de una uña y en blanco y negro, todavía dice quién eres, has abstraído bien. Si necesita color y tamaño grande para funcionar, todavía es decoración --- no identidad. Esa prueba (lockup en miniatura y monocromo) la han usado diseñadores desde Paul Rand hasta hoy.
  - |-
    \textbf{Algoritmo.} Pasos para construirla: (1) elige una emoción principal de tu marca (calidez, rigor, frescura, audacia --- una palabra, no tres); (2) escoge la paleta que la transmita usando coolors.co o paletton.com como referencia; (3) escoge el par tipográfico en Google Fonts con tipos complementarios (probar 3-4 combinaciones); (4) dibuja a mano 3 versiones del lockup y elige la más legible a tamaño chico. Si dudas, la versión más simple gana.
  anatomia:
    titulo: Anatomía de un sistema visual mínimo
    body: |-
      \textbf{Paleta:} 3-5 colores con jerarquía (uno dominante, uno secundario, 1-3 acentos). Evita colores neón puros para texto. \\[1mm] \textbf{Tipografía:} 1 display + 1 cuerpo. Si tu display es fuerte, tu cuerpo debe ser neutro --- nunca dos display al mismo tiempo. \\[1mm] \textbf{Lockup:} la firma de tu nombre con tratamiento fijo (color, fuente, espacios). Debe funcionar a 16 píxeles y a 2 metros de pared.
  errores_comunes: |-
    (1) Más de 5 colores en la paleta: la identidad se diluye --- el ojo no encuentra dónde mirar primero. (2) Dos fuentes display compitiendo (Bricolage + Playfair, por ejemplo): el sistema se siente caótico, sin jerarquía. (3) Color neón saturado para texto: hermoso decorativamente, ilegible funcionalmente --- mata la accesibilidad. (4) Copiar la paleta exacta de una marca global (los azules de Facebook, los naranjas de SoundCloud): tu marca pierde identidad y se vuelve un eco. (5) Olvidar el contraste WCAG mínimo (4.5:1 para texto): tu sistema visual deja afuera a personas con baja visión.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Tres sistemas visuales que admiro». \textbf{Formato:} 3 fichas, una por marca, con 4 datos cada una: Nombre · Paleta (3-5 códigos HEX) · Par tipográfico · Qué transmite (1 frase). \textbf{Sabes que terminaste cuando} las 3 marcas son distintas entre sí (no las 3 deportivas), y la frase ``qué transmite'' es específica (no ``se ve cool'').
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu sistema visual mínimo} (30 min · individual). Tienes el vocabulario y los referentes. Hora de tomar decisiones para tu marca. Recuerda: tu manifiesto (Guía 1) prometió algo --- tu sistema visual debe sostener esa promesa, no contradecirla.
  pilares:
  - |-
    \textbf{Descomposición.} Tu sistema se descompone en 3 piezas que responden a 3 preguntas distintas: \textbf{paleta} (¿qué emoción transmite la marca?), \textbf{tipografía} (¿qué jerarquía organiza el texto?), \textbf{lockup} (¿cómo firma todo en una pieza memorable?). Tomar las 3 decisiones por separado y después coordinarlas es más limpio que mezclarlas. Decide en ese orden: paleta → tipografía → lockup.
  - |-
    \textbf{Patrones.} Sigue el patrón \textbf{60-30-10} en color (un dominante, uno secundario, un acento), el patrón \textbf{display + cuerpo} en tipografía (nunca dos display juntos), y el patrón \textbf{``nombre + tratamiento fijo''} en lockup (siempre con los mismos colores, fuente y espacios). Estos tres patrones son la columna vertebral del diseño de marca desde el siglo XX --- no los inventes, aplícalos.
  - |-
    \textbf{Abstracción.} Cada decisión expresa una sola idea. Si no puedes decir en una frase corta por qué elegiste ese color, ese tipo o ese lockup, vuelve atrás. ``Elegí naranja porque mi marca conecta con la energía de la mañana y con los amaneceres del Valle'' es una razón; ``elegí naranja porque me gusta'' no lo es.
  - |-
    \textbf{Algoritmo.} (1) Elige la emoción principal de tu marca en una palabra; (2) prueba 3 paletas en coolors.co con esa emoción como filtro; (3) prueba 3 pares tipográficos en fonts.google.com filtrando por estilo; (4) dibuja a mano 3 versiones de tu lockup en una hoja; (5) muestra las combinaciones a 3 personas que te conocen y pregunta cuál ``suena más a ti''. La votación informa la decisión, no la reemplaza.
  checklist:
    titulo: Checklist del sistema visual antes de cerrar el cuaderno
    items: |-
      \checkbox Paleta de 3 a 5 colores con códigos HEX anotados. \\[1mm] \checkbox Par tipográfico nombrado (ej.: Bricolage Grotesque + Inter). \\[1mm] \checkbox Lockup dibujado a mano o en herramienta digital. \\[1mm] \checkbox Justificación de 1 línea por cada decisión (color, tipo, lockup). \\[1mm] \checkbox Tu manifiesto de la Guía 1 se refleja coherente en este sistema.
  plantilla_guion: |-
    \textbf{Mi paleta.} \textit{HEX codes + para qué sirve cada color (dominante/secundario/acento).} \\[1mm] \textbf{Mi par tipográfico.} \textit{Display + cuerpo, nombres y dónde se encuentran.} \\[1mm] \textbf{Mi lockup.} \textit{Cómo firma tu marca: dibujo, tratamiento, tamaños.} \\[1mm] \textbf{Por qué estas decisiones.} \textit{1 frase por elemento.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi sistema visual · versión 1». \textbf{Formato:} una página con 4 secciones (Paleta · Tipografía · Lockup · Justificación), cada una con datos concretos y una frase de decisión. \textbf{Extensión:} una página de cuaderno. \textbf{Sabes que terminaste cuando} los 4 elementos están presentes, cada decisión tiene su frase de justificación, y tu lockup se puede dibujar a mano sin guías.
  producto_titulo: 'Sistema visual mínimo en una página: paleta + par tipográfico + lockup'
  criterios:
  - La paleta tiene 3-5 colores con jerarquía clara
  - El par tipográfico es uno display + uno cuerpo, no dos display
  - El lockup tiene tratamiento fijo y funciona a tamaño chico
  - Cada decisión tiene una frase de justificación que la conecta con tu manifiesto
  - Un extraño puede mirar el sistema y sentir tu marca sin que tú la expliques
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: La belleza estética nace donde una voz silenciada encuentra forma.
    aplicacion: |-
      Tu sistema visual puede repetir las paletas de moda global (azules tech, naranjas startup) o puede atreverse a recuperar colores y formas de tu lugar --- los amarillos del Valle, los rojos del Pacífico, los grafismos del oficio. La descolonización estética empieza por mirar antes de copiar.
    pregunta_espejo: |-
      ¿Mi sistema visual incluye señales de mi lugar y mi gente, o copia el estándar global? ¿A qué voz le doy forma cuando elijo estos colores?
  estoico:
    autor: Marco Aurelio
    cita: Toda cosa tiene su belleza propia, pero no todos la ven.
    aplicacion: |-
      La tentación más fuerte en diseño visual es seguir tendencias. Pero las tendencias pasan; la belleza propia de tu marca se descubre cuando dejas de mirar lo que está de moda y miras lo que de verdad transmite tu promesa. Eso depende de ti.
    pregunta_espejo: |-
      ¿Estoy eligiendo lo que de verdad expresa mi marca o estoy persiguiendo una estética que vi en otra parte? ¿Cuál es mi belleza propia?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Cada acto de diseño es un acto informacional: añade o resta a la infoesfera visual común.
    aplicacion: |-
      Tu sistema visual va a aparecer en feeds, presentaciones, perfiles. Va a competir por atención en una infoesfera ya saturada. La pregunta no es ``¿llama la atención?'' sino ``¿añade algo útil o agrega ruido visual?''. El diseño tiene ética informacional.
    pregunta_espejo: |-
      ¿Mi sistema visual aporta claridad a quien lo mira o le suma ruido a un mundo ya saturado? ¿Qué responsabilidad tengo sobre la atención de quienes lo verán?
compromiso: |-
  \textbf{Para la próxima semana.} Aplica tu paleta a 3 productos cotidianos: la portada de tu próximo trabajo, tu foto de perfil con un filtro de color coherente, y la firma de tu correo institucional. Ese ensayo te mostrará si tu sistema funciona o necesita ajustes. El próximo lunes traes esos 3 productos al aula.
web:
  resumen: |-
    Le pones cara a tu marca: un sistema visual mínimo con paleta, par tipográfico y lockup coherentes con tu manifiesto.
  subtema: Presencia y marca digital · Sistema visual
  pre_lectura:
    por_que_importa: |-
      Las marcas modernas usan el mismo principio que las identidades ancestrales: una paleta de 3 a 5 colores, un par tipográfico y un lockup. Esa pieza mínima identifica tu marca antes de que el espectador lea una palabra.
    pregunta_detonante: ¿Qué señales visuales hacen que reconozcas a un equipo o a un colegio sin leer su nombre?
    activacion:
      titulo: Reconoce sin leer
      descripcion: |-
        En 3 minutos, escribe en una hoja 3 marcas que reconoces solo con su color o forma — sin texto. Al lado de cada una anota qué señal específica te basta para reconocerla.
      duracion_min: 3
    conexion:
      anterior: "En la sesión 1 escribiste tu Manifiesto de Marca Personal: la promesa que sostiene tu nombre."
      siguiente: En la sesión 3 construirás la estructura semántica de tu sitio web personal (HTML).
  conceptos_clave:
    - termino: Paleta
      definicion: |-
        3 a 5 colores con jerarquía clara: un dominante (~60%), uno secundario (~30%), uno o dos acentos (~10%).
      ejemplo: |-
        Para una marca de comida saludable del Valle: verde hoja dominante, crema secundario, mango como acento.
      emoji: "🎨"
    - termino: Par tipográfico
      definicion: |-
        Una fuente display para titulares + una fuente cuerpo para texto. Nunca dos display compitiendo al mismo tiempo.
      ejemplo: Bricolage Grotesque para titulares + Inter para el cuerpo. Contrastan sin pelearse.
      emoji: "🔤"
    - termino: Lockup
      definicion: |-
        La firma de tu nombre con tratamiento fijo (color, fuente, espacios). Debe funcionar a 16 píxeles y a 2 metros de pared.
      ejemplo: Tu nombre en mayúsculas + un símbolo a la izquierda en color de acento, siempre igual.
      emoji: "✍️"
    - termino: Patrón 60-30-10
      definicion: |-
        Regla de proporción de color: 60% dominante, 30% secundario, 10% acento. Cámbiala y se rompe la armonía.
      ejemplo: |-
        Si tu acento aparece en el 50% de la pantalla, deja de ser acento y empieza a competir con el dominante.
      emoji: "⚖️"
    - termino: Coherencia con el manifiesto
      definicion: |-
        Cada decisión visual debe sostener la promesa de tu marca. Una marca seria con paleta neón es incoherente.
      ejemplo: Si tu manifiesto dice "rigor y cuidado", una paleta de neones saturados contradice esa promesa.
      emoji: "🧭"
    - termino: Test del tamaño chico
      definicion: |-
        Si tu lockup, en blanco y negro y del tamaño de una uña, todavía dice quién eres, has abstraído bien.
      ejemplo: El símbolo de Nike funciona a 1 cm. El de muchas marcas que solo usan texto, no.
      emoji: "🔍"
  quiz:
    titulo: "✅ Verifica el vocabulario visual"
    instrucciones: |-
      5 preguntas para confirmar que dominas las piezas del sistema visual antes de avanzar. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: Una marca que dice "soy seria y rigurosa" pero usa paleta de neones saturados, ¿qué problema tiene?
        opciones:
          - Le faltan colores
          - Incoherencia entre promesa y sistema visual
          - Le sobran tipografías
          - Ninguno — los neones siempre funcionan
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El sistema visual debe sostener la promesa del manifiesto. Si la promesa es "rigor" y la paleta grita "fiesta", la marca pierde credibilidad.
        feedback_incorrecto: El problema es coherencia. Tu sistema visual debe sostener la promesa de tu marca, no contradecirla.
      - enunciado: ¿Cuántos colores debe tener una paleta sólida de marca?
        opciones:
          - 1 o 2
          - 3 a 5
          - 6 a 10
          - Más de 10
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. 3-5 colores con jerarquía (un dominante, un secundario, 1-2 acentos) mantienen la identidad clara sin diluirse.
        feedback_incorrecto: |-
          Una paleta de marca sólida usa 3-5 colores con jerarquía. Más se diluye, menos se queda sin contraste.
      - enunciado: En el patrón 60-30-10, ¿qué representa el 10%?
        opciones:
          - El color dominante
          - El color secundario
          - El color de acento
          - El color del texto
        respuesta_index: 2
        feedback_correcto: Sí. El 10% es el acento — el color que aparece poco pero llama la atención cuando aparece.
        feedback_incorrecto: |-
          El 10% es el acento. El 60% es dominante, el 30% secundario, el 10% acento. Si tu acento aparece más, deja de serlo.
      - enunciado: ¿Qué es un par tipográfico bien construido?
        opciones:
          - Dos fuentes display llamativas
          - Una fuente display + una fuente cuerpo
          - Una sola fuente para todo
          - Tres fuentes para tener variedad
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Una display fuerte para titulares + una cuerpo neutra para texto largo. Dos display compiten y cansan.
        feedback_incorrecto: |-
          Un par tipográfico es display + cuerpo. Dos display pelean, una sola fuente para todo se siente plana.
      - enunciado: ¿Cuál es la prueba definitiva de un buen lockup?
        opciones:
          - Tener muchos colores
          - Funcionar a 16 píxeles y a 2 metros de pared
          - Tener un logo grande
          - Cambiar según el contexto
        respuesta_index: 1
        feedback_correcto: Correcto. Un lockup que sobrevive al tamaño chico y al tamaño grande está bien abstraído.
        feedback_incorrecto: |-
          La prueba es escalabilidad: 16 píxeles (favicon, app icon) y 2 metros (cartel impreso). Si funciona en ambos, sirve.
  post_lectura:
    transferencia: |-
      Esta semana, aplica tu paleta a 3 productos cotidianos: la portada de tu próximo trabajo, tu foto de perfil con un filtro de color coherente, y la firma de tu correo institucional. El próximo lunes traes esos 3 productos al aula.
  cinco_dimensiones:
    personal: Tomaste decisiones estéticas con criterio, no por impulso ni por imitación.
    emocional: Identificaste la emoción que tu marca quiere transmitir y la sostuviste en cada decisión.
    ciudadana: Cada elección visual habla de tu lugar y tu gente en una infoesfera ya saturada.
    local: |-
      Anclaste tu paleta y tus formas en los grafismos del Valle, el Pacífico y la tradición popular colombiana.
    intergeneracional: Recuperaste una gramática visual que viene de la orfebrería Quimbaya y los tejidos del Pacífico.

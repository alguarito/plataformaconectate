sesion: 3
completo: true
titulo: Sitio web personal --- fundamentos de la casa digital
titulo_portada: |-
  Sitio web personal ---
  fundamentos de
  la casa digital
producto_final: Wireframe a mano + archivo index.html con estructura HTML semántica
apertura:
  saber_ancestral: |-
    Los \textbf{caminos prehispánicos} (la red del oro Quimbaya en el Valle, los caminos incas, los senderos de los chasquis) no eran trazos al azar: cada uno tenía un propósito y conectaba un lugar específico con otro. El que caminaba sabía adónde iba porque la ruta estaba pensada. Esa misma intención organiza un buen sitio web.
  origen: Caminos prehispánicos del Valle del Cauca, redes Quimbaya y chasquis del Tahuantinsuyu
  saber_contemporaneo: |-
    Una página web bien construida usa \textbf{HTML semántico}: \texttt{header}, \texttt{nav}, \texttt{main}, \texttt{article}, \texttt{aside}, \texttt{footer}. Cada etiqueta no solo dibuja: \emph{le dice al navegador} qué función cumple ese bloque. Sin semántica, los lectores de pantalla, los buscadores y las personas se pierden.
  pregunta_puente: |-
    ¿Qué hacía que los caminos antiguos llevaran a la gente al lugar correcto sin GPS? ¿Qué señales usaban y por qué funcionaban?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} la estructura semántica de sitios reales; (2) \textbf{explicar} qué función cumple cada etiqueta semántica; (3) \textbf{crear} el wireframe y el HTML de tu página personal; (4) \textbf{evaluar} la estructura del sitio de un compañero.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hoy le construyes \emph{la casa} a tu marca --- una página web con estructura semántica clara, lista para crecer en las guías siguientes.
  a_escuta: |-
    Antes de construir tu propia casa digital, vas a aprender a leer las que ya existen. Detrás de cada sitio bien hecho hay una estructura semántica --- visible solo si sabes mirar.
  a_sistematizacion: |-
    Ya viste cómo se organizan los sitios reales. Ahora vamos a aprender el \textbf{vocabulario exacto} que usa HTML para esa organización. Cinco o seis etiquetas semánticas resuelven el 90\% de los casos.
  a_praxis: |-
    Tienes el vocabulario y los referentes. Toca decidir: ¿qué secciones tendrá tu sitio y cómo se distribuirán? Vas a dibujar primero a mano (wireframe), después convertir a HTML.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: un wireframe a mano y un archivo HTML. El criterio principal: que un extraño pueda leer tu HTML sin estilos y entender la página.
  a_evaluacion: |-
    Antes de cerrar, mira tu sitio desde las cinco dimensiones humanas. Una página web también incluye o excluye personas; piensa en quién \emph{no} podría leerla y por qué.
  a_triangulo: |-
    Y para terminar, tres voces sobre las casas digitales. Dussel sobre quién entra y quién no, Séneca sobre el orden como disciplina, Floridi sobre la web como espacio común.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Lee la estructura semántica de 3 sitios} (15 min · individual). Visita 3 sitios distintos: un periódico, una página de universidad, un sitio de empresa. En cada uno: ¿qué hay en el header (logo, menú)? ¿qué en el main (contenido principal)? ¿qué en el footer (créditos, contacto)? Toma capturas y márcalas a lápiz si puedes.
  checks:
  - Visité un sitio de noticias y reconocí header, main y footer.
  - Visité un sitio de universidad y reconocí su nav principal.
  - Visité un sitio de empresa y reconocí su jerarquía visual.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Estructura semántica de 3 sitios». \textbf{Formato:} tabla de 4 columnas (Sitio | Header | Main | Footer), con qué contiene cada zona en una frase corta. \textbf{Extensión:} 3 filas, una por sitio. \textbf{Sabes que terminaste cuando} cada celda nombra elementos concretos (no ``varias cosas'') y reconoces el patrón común a los 3.
sistematizacion:
  intro: |-
    HTML semántico organiza una página en bloques con significado. Vamos a descomponerlo con los pilares del pensamiento computacional para que sepas qué etiqueta usar en cada lugar.
  pilares:
  - |-
    \textbf{Descomposición.} Una página se descompone en bloques semánticos con función fija: \texttt{header} (cabecera con logo y navegación), \texttt{nav} (menú principal), \texttt{main} (contenido único de esta página --- uno solo por documento), \texttt{section} (secciones temáticas dentro del main), \texttt{article} (contenido autónomo que tendría sentido por sí solo), \texttt{aside} (información complementaria al lado), \texttt{footer} (pie con créditos y contacto). Cada etiqueta dice al navegador y a los lectores de pantalla qué función cumple ese bloque --- la decoración la hace el CSS, no el HTML.
  - |-
    \textbf{Reconocimiento de patrones.} Todo sitio sigue un patrón heredado del periódico impreso: \textbf{header arriba}, \textbf{footer abajo}, \textbf{main en el centro} con secciones temáticas. La razón es psicológica: el ojo del lector occidental escanea de arriba a abajo y de izquierda a derecha. Romper ese patrón sin razón cuesta clics y atención. La buena variación (un sidebar fijo, un hero a pantalla completa) es excepción justificada, no regla.
  - |-
    \textbf{Abstracción.} Lo esencial de una página cabe en su \emph{esqueleto semántico}: si abres tu HTML en el navegador sin CSS y todavía se lee como un documento ordenado (un h1 claro, h2 que estructuran, párrafos, listas), tu abstracción está bien. Ese ``test sin estilos'' es el que usan los lectores de pantalla, los buscadores y los archivos del futuro. Si tu sitio depende de CSS para tener sentido, tu HTML está mal pensado.
  - |-
    \textbf{Algoritmo.} (1) Dibuja a mano la jerarquía en papel (header / nav / main / footer); (2) decide qué \texttt{section}s irán dentro del main y nómbralas; (3) traduce el esquema a HTML semántico sin pensar en estilos; (4) prueba el resultado en el navegador \emph{sin CSS} --- si se entiende, hiciste bien; (5) recién después agrega los estilos. Diseñar el HTML antes que el CSS es el orden correcto, aunque parezca al revés.
  anatomia:
    titulo: Anatomía de una página HTML semántica
    body: |-
      \texttt{header}: logo + nav (cabecera del sitio). \\[1mm] \texttt{nav}: menú principal (puede ir dentro de header). \\[1mm] \texttt{main}: contenido único de esta página. \\[1mm] \texttt{section}: agrupaciones temáticas dentro de main. \\[1mm] \texttt{article}: contenido autónomo (post, ficha, item). \\[1mm] \texttt{aside}: complemento lateral o relacionado. \\[1mm] \texttt{footer}: créditos, contacto, navegación secundaria.
  errores_comunes: |-
    (1) Usar \texttt{div} para todo, también llamado \emph{divitis}: pierdes semántica, pierdes accesibilidad, pierdes SEO. (2) Múltiples \texttt{h1} por página: confunde a lectores de pantalla y a los buscadores --- un único h1 por documento es la regla. (3) \texttt{main} repetido: solo debe haber UNO por página, marca el contenido único de esta URL. (4) Confundir \texttt{section} con \texttt{article}: \texttt{section} agrupa contenido relacionado dentro de la página, \texttt{article} es autónomo (se podría compartir en otro sitio y seguir teniendo sentido). (5) Olvidar el atributo \texttt{lang="es"} en \texttt{html}: traductores automáticos y lectores de pantalla pierden la pista del idioma.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Vocabulario semántico HTML». \textbf{Formato:} 7 fichas, una por etiqueta (header / nav / main / section / article / aside / footer), cada ficha con nombre + para qué sirve (1 frase con tus palabras) + un ejemplo concreto de tu propio sitio. \textbf{Sabes que terminaste cuando} puedes explicar cada etiqueta sin mirar notas y dar un ejemplo específico de cómo la usarás.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Wireframe + HTML semántico de tu home} (35 min · individual). Hora de construir. Primero dibujas a mano (wireframe), después conviertes a HTML real. El resultado es tu \texttt{index.html} con la estructura semántica de la página de inicio de tu sitio personal.
  pilares:
  - |-
    \textbf{Descomposición.} Tu home se descompone en 4 zonas con funciones distintas: \textbf{header} (tu nombre o lockup + nav corto de 3-5 enlaces), \textbf{main} (un h1 con tu propuesta de valor + 2-3 secciones temáticas), \textbf{aside} opcional (información complementaria como bio corta o destacados), \textbf{footer} (contacto, redes profesionales, créditos). Cada zona tiene un propósito; si lo dudas, esa zona no debería existir todavía.
  - |-
    \textbf{Patrones.} Sigue el patrón clásico de una home: \textbf{header arriba} con tu nombre y un nav corto (idealmente 3-5 enlaces; más de 7 ya es un menú que oculta), \textbf{main} con un h1 claro y secciones bien delimitadas por \texttt{section}, \textbf{footer al final} con email institucional y 2-3 redes profesionales. Es el patrón que sigue el 90\% de los sitios personales bien construidos --- desde portafolios de diseñadores hasta sitios de profesores universitarios.
  - |-
    \textbf{Abstracción.} Cada \texttt{section} expresa una sola idea. Si tu \texttt{section} contiene 3 temas distintos (``mis proyectos, mi blog y mi contacto'' en uno solo), pártela --- son 3 secciones. Si una sección es muy corta (3 líneas sueltas), fusiónala con la adyacente o conviértela en un \texttt{aside}. El test: cada h2 debería tener al menos un párrafo de contenido sustantivo debajo.
  - |-
    \textbf{Algoritmo.} (1) Dibuja a mano la estructura en una hoja --- caja por caja, sin colores, sin tipografías; (2) abre un archivo \texttt{index.html} en VS Code con el snippet \texttt{html:5} de Emmet; (3) escribe el esqueleto semántico vacío (\texttt{header}, \texttt{main}, \texttt{section}s, \texttt{footer}); (4) llena cada bloque con texto real --- sin CSS todavía, sin clases, solo HTML puro; (5) abre el HTML en Chrome y verifica: si se lee bien sin estilos, está bien hecho.
  checklist:
    titulo: Checklist del HTML antes de cerrar el cuaderno
    items: |-
      \checkbox Wireframe a mano con header / main / footer claramente delimitados. \\[1mm] \checkbox Archivo \texttt{index.html} con doctype, html, head y body completos. \\[1mm] \checkbox Un solo \texttt{h1} por página. \\[1mm] \checkbox Etiquetas semánticas en lugar de \texttt{div} cuando aplica. \\[1mm] \checkbox Sin CSS, la página todavía se lee como un documento ordenado en Chrome.
  plantilla_guion: |-
    \textbf{Header.} \textit{Tu nombre o lockup + nav corto.} \\[1mm] \textbf{Main / Hero.} \textit{h1 con tu propuesta de valor + breve presentación.} \\[1mm] \textbf{Main / Sobre mí.} \textit{section con 1 párrafo personal.} \\[1mm] \textbf{Main / Proyectos o servicios.} \textit{section con 2-3 articles.} \\[1mm] \textbf{Footer.} \textit{Email, redes profesionales, derechos.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi home semántico v1». \textbf{Formato:} (1) wireframe a mano en la página izquierda, (2) transcripción del HTML real en la página derecha. \textbf{Extensión:} dos páginas enfrentadas. \textbf{Sabes que terminaste cuando} tu HTML carga en Chrome sin errores, tiene un solo h1, y sin CSS la página se entiende como documento estructurado.
  producto_titulo: Wireframe a mano + archivo index.html con estructura HTML semántica
  criterios:
  - El wireframe muestra las 3 zonas (header / main / footer) claramente
  - El HTML usa al menos 5 etiquetas semánticas distintas
  - Existe un único \texttt{h1}
  - Sin CSS, el navegador todavía muestra una jerarquía clara
  - El HTML pasa el validador W3C sin errores estructurales
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: La analéctica supera a la dialéctica al partir del Otro como Otro.
    aplicacion: |-
      Tu sitio web es una puerta. Cada decisión de diseño define a quién deja entrar y a quién deja afuera. La accesibilidad (etiquetas semánticas, contraste, texto alternativo) no es un ``extra técnico'': es la diferencia entre invitar al Otro o ignorarlo.
    pregunta_espejo: |-
      ¿Quién no puede leer mi sitio? ¿Una persona con lector de pantalla, con conexión lenta, que no maneja bien el español, lo logra navegar?
  estoico:
    autor: Séneca
    cita: Nada se construye bien sin orden; sin él, la abundancia es ruina.
    aplicacion: |-
      Un sitio web mal estructurado se siente ``hecho a la carrera''. Ordenar el HTML es un acto de disciplina --- pocas decisiones, en el orden correcto --- y depende solo de ti. Nadie te ordena el código; tú decides.
    pregunta_espejo: |-
      ¿Mi sitio refleja una estructura ordenada y deliberada, o se siente improvisado? ¿Qué dice eso de mi disciplina?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La web es un patrimonio informacional común; cada sitio bien construido lo enriquece, cada sitio mal hecho lo erosiona.
    aplicacion: |-
      Cuando publicas tu sitio, te sumas a la infoesfera pública. Tu HTML será leído por buscadores, lectores de pantalla, archivos del futuro. Construirlo con cuidado es ética informacional aplicada --- el equivalente moderno a sembrar bien.
    pregunta_espejo: |-
      ¿Mi sitio enriquece o ensucia el patrimonio digital común? ¿Estoy publicando algo de lo que el internet del futuro se beneficiará?
compromiso: |-
  \textbf{Para la próxima semana.} Comparte tu \texttt{index.html} con un compañero por correo. Pídele que lo abra en Chrome y te diga, en 1 frase, qué entendió. Si esa frase coincide con lo que querías comunicar, tu estructura semántica funciona. El próximo lunes traes ese feedback al aula.
web:
  resumen: |-
    Construyes la casa digital de tu marca: un wireframe a mano + un index.html con estructura HTML semántica clara.
  subtema: Presencia y marca digital · HTML semántico
  pre_lectura:
    por_que_importa: |-
      Una página web bien construida usa HTML semántico: header, nav, main, article, aside, footer. Cada etiqueta no solo dibuja: le dice al navegador qué función cumple ese bloque. Sin semántica, los lectores de pantalla, los buscadores y las personas se pierden.
    pregunta_detonante: |-
      Si quitaras todos los estilos a tu sitio favorito, ¿se entendería igual? ¿O quedaría un montón de texto sin pies ni cabeza?
    activacion:
      titulo: Modo lectura
      descripcion: |-
        En tu navegador abre un sitio de noticias y activa el "modo lectura" o "vista de lector". Lo que sobrevive ES la estructura semántica. Compara con lo que se pierde — los anuncios, sidebars decorativos. Eso te muestra qué queda cuando solo importa el contenido.
      duracion_min: 4
    conexion:
      anterior: |-
        En la sesión 2 creaste tu sistema visual mínimo: paleta, tipografía y lockup. Tu marca ya tiene cara.
      siguiente: |-
        En la sesión 4 elegirás una plantilla web profesional y la adaptarás con tu identidad para publicarla.
  conceptos_clave:
    - categoria: Estructura semántica
      termino: HTML semántico
      definicion: |-
        Etiquetas que tienen significado: header, nav, main, article, footer. No solo dibujan — le dicen al navegador y al lector de pantalla qué función cumple cada bloque.
      ejemplo: |-
        Un <header> contiene logo + nav. Un <article> es contenido autónomo (post, ficha). Un <footer> cierra con créditos y contacto.
      emoji: "🧱"
    - categoria: Estructura semántica
      termino: <header>
      definicion: |-
        La cabecera del sitio: nombre o logo + navegación principal. Va arriba de todo. Puede repetirse dentro de articles, pero el principal solo aparece una vez.
      ejemplo: <header><h1>Tu nombre</h1><nav>...</nav></header> — el bloque que un visitante ve primero.
      emoji: "🎩"
    - categoria: Estructura semántica
      termino: <main>
      definicion: |-
        El contenido único y central de la página. Solo debe haber UN <main> por página. Es lo que cambia de una página a otra.
      ejemplo: |-
        En la home, <main> contiene el hero + las secciones únicas. En una página "sobre mí", el <main> sería tu biografía.
      emoji: "🎯"
    - categoria: Estructura semántica
      termino: <section> vs <article>
      definicion: |-
        Section agrupa contenido temático relacionado. Article es contenido autónomo que se entiende solo (post, ficha de producto, item de feed).
      ejemplo: Una página de blog tiene una <section class="posts"> que contiene varios <article>, uno por entrada.
      emoji: "📑"
    - categoria: Buenas prácticas
      termino: Un solo <h1>
      definicion: |-
        Cada página debe tener exactamente un <h1>. Es el título principal — los lectores de pantalla lo usan como ancla.
      ejemplo: En la home, el <h1> suele ser tu nombre o tu propuesta de valor. Los subtítulos van con <h2>, <h3>.
      emoji: "1️⃣"
    - categoria: Buenas prácticas
      termino: Test sin CSS
      definicion: |-
        Si tu HTML, sin estilos, todavía se lee como un documento ordenado, tu estructura semántica está bien. Si parece sopa de letras, faltan etiquetas.
      ejemplo: |-
        Abre el index.html en Chrome con DevTools → Disable CSS. Si los títulos, párrafos y listas siguen jerarquizados, pasaste el test.
      emoji: "👁"
  quiz:
    titulo: "✅ Verifica el vocabulario HTML"
    instrucciones: |-
      5 preguntas para confirmar que dominas la semántica antes de pasar a la sesión 4. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Cuántos <h1> debe tener una página HTML bien construida?
        opciones:
          - Tantos como quieras
          - Exactamente 1
          - Mínimo 3
          - Ninguno
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Un solo <h1> por página. Los lectores de pantalla lo usan como ancla principal — varios confunden.
        feedback_incorrecto: Un solo <h1>. Es el título principal de la página. Los subtítulos van con <h2>, <h3>.
      - enunciado: ¿Cuál es la diferencia clave entre <section> y <article>?
        opciones:
          - No hay diferencia
          - <article> es contenido autónomo, <section> agrupa contenido temático
          - <section> es más grande que <article>
          - <article> solo sirve para blogs
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Article se entiende solo (post, ficha, item). Section agrupa varios articles o contenido temático relacionado.
        feedback_incorrecto: |-
          Article = contenido autónomo. Section = agrupación temática. Una section puede contener varios articles.
      - enunciado: Si abres tu HTML sin CSS y queda una sopa de letras sin jerarquía, ¿qué te dice eso?
        opciones:
          - Que necesitas más CSS
          - Que tu estructura semántica está incompleta
          - Que el navegador está roto
          - Que necesitas más colores
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El CSS solo decora. Si sin CSS no se entiende, faltan etiquetas semánticas (h1-h6, section, article, etc).
        feedback_incorrecto: |-
          La estructura semántica está incompleta. El CSS solo decora — si sin él se pierde la jerarquía, faltan h1-h6, sections, etc.
      - enunciado: ¿Cuántos <main> debe tener una página HTML?
        opciones:
          - Cualquier cantidad
          - Exactamente 1
          - Mínimo 2
          - Ninguno — está obsoleto
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Un único <main> por página. Es el contenido único y central — lo que cambia de una página a otra.
        feedback_incorrecto: Exactamente 1 <main> por página. Es el contenido único y central, no se repite.
      - enunciado: En el saber ancestral de los caminos prehispánicos, ¿qué aplica directamente a un sitio web?
        opciones:
          - Nada — los caminos no tienen que ver con HTML
          - "La intención: cada ruta tiene un propósito y conduce a un lugar específico"
          - Que los caminos eran de tierra
          - Que solo los chasquis los usaban
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. Una página web bien hecha tiene intención: cada section lleva al visitante a un lugar concreto, como los chasquis sabían a dónde llevaban.
        feedback_incorrecto: "La intención: una ruta sin propósito pierde gente. Un sitio sin estructura semántica también."
  post_lectura:
    transferencia: |-
      Esta semana, comparte tu index.html con un compañero por correo. Pídele que lo abra en Chrome y te diga en 1 frase qué entendió de la página. Si esa frase coincide con lo que querías comunicar, tu estructura semántica funciona. El próximo lunes traes ese feedback al aula.
  cinco_dimensiones:
    personal: "Aprendiste a ver una página web por dentro: la estructura que sostiene lo que el usuario ve."
    emocional: Sentiste la diferencia entre construir con orden y construir improvisando — y elegiste el orden.
    ciudadana: "Entendiste que la accesibilidad no es un extra: es la diferencia entre invitar al Otro o ignorarlo."
    local: |-
      Conectaste la lógica de los caminos prehispánicos del Valle con la lógica de un sitio web bien estructurado.
    intergeneracional: |-
      Tu HTML será leído por buscadores, lectores de pantalla y archivos del futuro. Construirlo bien es siembra a largo plazo.

clave: 1-4
grado: 11
periodo: 1
sesion: 4
completo: true
titulo: Plantillas web --- elegir y adaptar sin perderse uno mismo
titulo_portada: |-
  Plantillas web ---
  elegir y adaptar
  sin perderse uno mismo
producto_final: Sitio publicado en GitHub Pages (o equivalente) con plantilla adaptada
apertura:
  saber_ancestral: |-
    Los oficios heredados se aprenden con \textbf{moldes}: la receta de la abuela, el corte del sastre, el patrón del tejedor, las décimas del Pacífico. El maestro no enseña con palabras: enseña con un molde que el aprendiz debe usar primero igual, y después adaptar a su mano. Lo que cambia es la firma; lo que se conserva es la estructura.
  origen: Tradición de oficios y moldes en el Valle del Cauca y el Pacífico colombiano
  saber_contemporaneo: |-
    En la web moderna existen \textbf{plantillas} en GitHub Pages, Carrd, Notion sites, Webflow, Astro starters. Son moldes profesionales que aceleran tu trabajo --- siempre y cuando los adaptes con criterio en lugar de dejarlos genéricos.
  pregunta_puente: |-
    ¿Qué se mantiene y qué cambia cuando tú haces la receta de tu abuela? ¿Qué la sigue convirtiendo en \emph{esa} receta y no en una copia genérica?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} 3 plantillas similares e identificar qué tienen en común; (2) \textbf{explicar} qué se conserva y qué cambia al adaptar un molde; (3) \textbf{aplicar} una plantilla a tu identidad de marca y publicarla; (4) \textbf{evaluar} si tu sitio adaptado sigue siendo ``tuyo''.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hoy publicas tu sitio en internet --- por primera vez ya no será un archivo en tu computador, será una URL que cualquiera puede abrir.
  a_escuta: |-
    Antes de elegir tu plantilla, vas a aprender a mirar otras. Compararlas te enseña la gramática común de las plantillas modernas --- y revela qué espacio hay para hacerla tuya.
  a_sistematizacion: |-
    Ya viste tres plantillas. Ahora vamos a entender el \textbf{principio} detrás de adaptar un molde sin perderse: qué se queda fijo, qué se cambia, y qué decisión convierte una plantilla genérica en \emph{tu} sitio.
  a_praxis: |-
    Tienes el criterio. Hora de ejecutar: eliges una plantilla, la adaptas a tu identidad (usando tu paleta y tipografía de la guía anterior) y la publicas en GitHub Pages.
  a_producto: |-
    Lo que sigue es el resumen de \emph{qué} entregas hoy: una URL pública con tu sitio adaptado. Es el primer ``hola mundo'' real de tu marca en internet.
  a_evaluacion: |-
    Antes de cerrar, mira tu sitio publicado desde las cinco dimensiones humanas. Publicar tiene costo emocional y ciudadano --- estás haciendo pública tu identidad.
  a_triangulo: |-
    Y para terminar, tres voces sobre los moldes y la identidad. Dussel sobre copiar vs encontrar, Epicteto sobre lo que depende de ti, Floridi sobre estándares y diversidad.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Tres plantillas, qué tienen en común} (15 min · individual). Visita 3 sitios construidos sobre plantillas (puedes mirar catálogos de GitHub Pages templates, Carrd showcase, o Astro themes). Para cada uno: ¿qué partes son intercambiables (logo, paleta, tipografía, fotos)? ¿qué partes son estructura fija (orden de secciones, jerarquía)?
  checks:
  - Revisé 3 plantillas distintas en uno de los catálogos sugeridos.
  - Distinguí qué partes son intercambiables y cuáles son fijas.
  - Tomé nota del nombre y URL de la plantilla que más se acerca a mi marca.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Tres plantillas comparadas». \textbf{Formato:} tabla de 4 columnas (Plantilla | URL | Partes intercambiables | Partes fijas), 3 filas. Al final un párrafo de 3-4 renglones eligiendo una plantilla y justificando por qué. \textbf{Sabes que terminaste cuando} tu elección es coherente con tu paleta y tipografía de la Guía 2.
sistematizacion:
  intro: |-
    Adaptar una plantilla es un acto de criterio, no de pereza. Vamos a descomponer ese criterio en cuatro decisiones que diferencian un sitio único de uno genérico.
  pilares:
  - |-
    \textbf{Descomposición.} Una adaptación se descompone en 4 decisiones tomadas en orden: (1) qué \textbf{conservar} de la plantilla (estructura semántica, layout, jerarquía visual --- lo que ya funciona); (2) qué \textbf{cambiar} (colores, fuentes, fotos, copy genéricos por los tuyos del manifiesto y el sistema visual); (3) qué \textbf{agregar} (un detalle único de tu marca: un símbolo, una sección propia, un microcopy especial); (4) qué \textbf{eliminar} (secciones genéricas que la plantilla trae y que tú no necesitas --- testimonios falsos, ``newsletter'' que no tendrás, etc.). Las 4 decisiones se toman antes de tocar el código.
  - |-
    \textbf{Reconocimiento de patrones.} Toda buena adaptación sigue el patrón \textbf{70-20-10}: \textasciitilde 70~\% queda como vino la plantilla (estructura, layout, retícula), \textasciitilde 20~\% se personaliza (colores, fuentes, copy), \textasciitilde 10~\% se agrega o quita (lo único de tu marca). Cambia el patrón y el resultado se siente o copiado (90/0/10) o frankenstein (30/40/30). Este patrón vale para plantillas de Astro, Hugo, Jekyll, Notion, Webflow --- es agnóstico de tecnología.
  - |-
    \textbf{Abstracción.} Lo esencial de tu adaptación cabe en una pregunta: \emph{¿en qué se nota que este sitio es tuyo y no de otro que use la misma plantilla?}. Si no tienes 3 respuestas concretas (``el morado del Pacífico en el navbar'', ``la sección de saber ancestral'', ``el microcopy en jerga del Valle''), todavía no lo has hecho tuyo. La adaptación termina cuando un amigo abriría tu sitio y otro con la misma plantilla y vería diferencias claras en 5 segundos.
  - |-
    \textbf{Algoritmo.} (1) Haz fork de la plantilla en tu GitHub para mantener la trazabilidad; (2) clónala localmente y ábrela en VS Code; (3) identifica el archivo de variables CSS o el tema --- ahí cambias colores y fuentes por los de tu sistema visual de la Guía 2; (4) reemplaza fotos placeholder y copy genéricos por los tuyos --- usa la página ``Sobre mí'' coescrita con IA si aún no la tienes; (5) commit y push, después configura GitHub Pages desde Settings; (6) verifica la URL pública en pestaña incógnita y desde el celular.
  anatomia:
    titulo: Anatomía de una buena adaptación
    body: |-
      \textbf{Conservar:} estructura semántica de la plantilla. No reinventes la rueda. \\[1mm] \textbf{Cambiar:} paleta y tipografía a las tuyas (de la Guía 2). Copy a tu voz. \\[1mm] \textbf{Agregar:} un detalle único de tu marca (un símbolo, un microcopy especial, una sección propia). \\[1mm] \textbf{Eliminar:} cualquier sección genérica que la plantilla traiga y que tú no necesites. \emph{Menos es más.}
  errores_comunes: |-
    (1) Dejar copy genérico (``Welcome to my site!'', ``Lorem ipsum dolor sit amet''): muerte instantánea de credibilidad --- el visitante asume que es un sitio sin terminar y se va. (2) Cambiar TODO y romper la coherencia visual de la plantilla: pierdes la principal ventaja (un diseño ya equilibrado). (3) Conservar fotos placeholder o nombres de prueba (``John Doe'', ``Jane Smith''): se nota a kilómetros que es plantilla recién clonada. (4) No probar el sitio en móvil: la mayoría de tus visitantes te leerán ahí, y muchas plantillas se ven bien en desktop pero rotas a 360 px. (5) Olvidar cambiar el favicon: el ícono pequeño en la pestaña sigue siendo el de la plantilla y rompe la identidad antes de que el visitante entre.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Plan de adaptación de mi plantilla». \textbf{Formato:} 4 columnas (Conservar | Cambiar | Agregar | Eliminar), cada una con 3-5 elementos específicos de tu plantilla elegida. \textbf{Sabes que terminaste cuando} las 4 columnas tienen contenido concreto (no ``el color'' sino ``el azul \#0066FF del navbar por mi naranja \#FF6B35'').
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Publicar tu sitio adaptado} (40 min · individual). Hora de ejecutar. Vas a clonar la plantilla, adaptarla con tu paleta y tu copy, y publicarla en GitHub Pages. Al final tendrás una URL pública que cualquiera puede abrir desde el mundo --- el primer ``hola mundo'' real de tu marca.
  pilares:
  - |-
    \textbf{Descomposición.} Tu publicación se descompone en pasos secuenciales: fork del repo → clonar localmente → cambiar archivos clave (paleta CSS, fuentes, copy del hero, imágenes) → commit con mensaje claro → push a main → activar GitHub Pages desde Settings → esperar 1-2 min → verificar URL pública en incógnito. Cada paso es atómico y reversible.
  - |-
    \textbf{Patrones.} Sigue el patrón de despliegue moderno: \textbf{rama main} para producción, configurar \textbf{Pages desde Settings → Pages → Branch: main}, esperar 1-2 minutos a que GitHub Actions despliegue, abrir la URL pública (\texttt{usuario.github.io/repo}) en pestaña incógnita o desde otro dispositivo --- nunca verifiques solo en tu navegador habitual porque las cookies te engañan.
  - |-
    \textbf{Abstracción.} Cada commit expresa una sola idea: ``colores a mi paleta'', ``copy del header'', ``foto personal en hero''. Si haces commits gigantes (``Initial commit + cambios''), no podrás revertir cambios específicos cuando algo se rompa. Esta disciplina (un cambio = un commit) la aprenderás dolorosamente la primera vez que necesites revertir solo una cosa.
  - |-
    \textbf{Algoritmo.} (1) Fork de la plantilla a tu GitHub; (2) \texttt{git clone} en local; (3) abrir en VS Code y leer el README; (4) cambiar paleta en el archivo de CSS variables o tema; (5) reemplazar copy y fotos con tu contenido real; (6) \texttt{git commit -m "mensaje claro"} y \texttt{git push}; (7) en GitHub: Settings → Pages → main branch → save; (8) esperar URL pública (1-2 min); (9) verificar en móvil con DevTools a 360 px y en desktop a 1440 px.
  checklist:
    titulo: Checklist antes de declarar el sitio publicado
    items: |-
      \checkbox La URL pública carga sin errores 404. \\[1mm] \checkbox Cero ``Lorem ipsum'' o copy de placeholder. \\[1mm] \checkbox Los colores son los de tu paleta (Actividad 3, Guía 2). \\[1mm] \checkbox La tipografía es tu par (Actividad 3, Guía 2). \\[1mm] \checkbox Se ve bien en móvil (revisa con DevTools a 360 px). \\[1mm] \checkbox Tu nombre y propuesta de valor aparecen en el hero.
  plantilla_guion: |-
    \textbf{Plantilla elegida.} \textit{Nombre + URL.} \\[1mm] \textbf{Mi sitio.} \textit{La URL pública en GitHub Pages.} \\[1mm] \textbf{Cambios aplicados.} \textit{4 columnas como en Actividad 2.} \\[1mm] \textbf{Captura.} \textit{Pega o dibuja una captura de tu home en el cuaderno.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi sitio publicado». \textbf{Formato:} (1) URL pública en grande arriba, (2) tabla de cambios aplicados, (3) captura impresa o dibujada del home. \textbf{Sabes que terminaste cuando} la URL carga en móvil de un compañero, sin lorem ipsum, con tu paleta y tu tipografía.
  producto_titulo: Sitio personal publicado en GitHub Pages con plantilla adaptada
  criterios:
  - La URL pública es accesible para cualquiera con internet
  - Cero contenido placeholder (texto, imágenes, nombres de prueba)
  - La paleta y la tipografía coinciden con tu sistema visual (Guía 2)
  - En móvil se lee y navega sin problemas
  - |-
    Hay al menos UN detalle único (símbolo, sección propia, microcopy) que no estaba en la plantilla original
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: El sur global piensa desde su propia herida y desde ahí ofrece mundo.
    aplicacion: |-
      Las plantillas son productos del norte tecnológico (Silicon Valley, Europa). Usarlas tal cual te invisibiliza; adaptarlas con tu identidad local --- tus colores del Valle, tu copy en español de Colombia, tus historias reales --- es un acto pequeño de soberanía digital.
    pregunta_espejo: |-
      ¿Mi sitio publicado se siente como un sitio del Valle o como un clon de plantilla global? ¿Qué señales locales le agregué?
  estoico:
    autor: Epicteto
    cita: |-
      Algunas cosas dependen de nosotros y otras no --- distinguir esto es la libertad.
    aplicacion: |-
      Que la plantilla traiga ciertas decisiones de diseño \emph{no depende de ti}. Pero qué conservas, qué cambias, qué agregas y qué eliminas: eso sí depende. Adaptar bien es ejercer la libertad estoica sobre la propia identidad digital.
    pregunta_espejo: |-
      ¿Estoy ejerciendo mi libertad sobre la plantilla, o me dejé llevar por todo lo que venía? ¿Qué partes son auténticamente mías?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La estandarización facilita la cooperación; la diversidad sostiene la riqueza informacional.
    aplicacion: |-
      Usar plantillas es bueno: estandariza la web, hace que más gente publique. Pero si todos los sitios se ven iguales, la infoesfera se empobrece. Adaptar es contribuir a la diversidad sin abandonar el beneficio de la estandarización.
    pregunta_espejo: |-
      ¿Mi adaptación aporta diversidad a la infoesfera o solo replica un patrón estándar? ¿Qué de mi sitio enriquece el panorama digital común?
compromiso: |-
  \textbf{Para la próxima semana.} Comparte tu URL pública con 3 personas: un familiar, un compañero, un docente. Pídeles a cada uno una observación. No discutas las observaciones: anótalas. La próxima guía empezamos con esas tres voces externas.
web:
  resumen: |-
    Eliges una plantilla profesional, la adaptas con tu identidad y la publicas en GitHub Pages. Por primera vez tu marca tiene URL pública.
  subtema: Presencia y marca digital · Plantillas y publicación
  pre_lectura:
    por_que_importa: |-
      Las plantillas son moldes profesionales que aceleran tu trabajo. Usarlas tal cual te invisibiliza; adaptarlas con tu identidad —tus colores, tu copy, tus historias— es un acto pequeño de soberanía digital. Hoy tu marca pasa de archivo local a URL pública.
    pregunta_detonante: |-
      Si dos personas usan la misma plantilla, ¿en qué se va a notar que un sitio es tuyo y el otro de otra persona?
    activacion:
      titulo: El mismo molde, distinta firma
      descripcion: |-
        En 4 minutos abre 3 sitios de tu universidad o colegio que evidentemente usan la misma plantilla. Anota qué se nota igual y qué se nota distinto en cada uno. Esa diferencia es lo que vas a buscar en tu propia adaptación.
      duracion_min: 4
    conexion:
      anterior: |-
        En la sesión 3 construiste el index.html con estructura semántica clara: la casa digital ya tenía planos.
      siguiente: |-
        En la sesión 5 usarás IA para redactar el copy comercial de tu sitio: inicio, servicios, preguntas frecuentes.
  conceptos_clave:
    - categoria: Las 4 decisiones de adaptación
      termino: Conservar
      definicion: |-
        Lo que se queda igual: estructura semántica, layout principal, sistema de grilla. No reinventes la rueda — eso es lo que te da la plantilla.
      ejemplo: Si la plantilla tiene un layout de 3 columnas para servicios, consérvalo. Es el esqueleto probado.
      emoji: "🏛"
    - categoria: Las 4 decisiones de adaptación
      termino: Cambiar
      definicion: |-
        Lo que se personaliza: paleta y tipografía a las tuyas (Guía 2), copy a tu voz, fotos por imágenes reales tuyas.
      ejemplo: |-
        El azul tech de la plantilla por tu naranja Valle. El "Welcome to my site!" por tu propuesta de valor.
      emoji: "✏️"
    - categoria: Las 4 decisiones de adaptación
      termino: Agregar
      definicion: |-
        Un detalle único de tu marca que no estaba en la plantilla: un símbolo, un microcopy, una sección propia, un easter egg.
      ejemplo: |-
        Una pequeña sección "Por qué Cartago" o un microcopy en español del Valle que ninguna plantilla traerá nunca.
      emoji: "✨"
    - categoria: Las 4 decisiones de adaptación
      termino: Eliminar
      definicion: |-
        Las secciones genéricas que la plantilla trae y tú no necesitas. Menos es más — eliminar lo que sobra acelera la lectura del visitante.
      ejemplo: |-
        Si la plantilla trae 6 secciones y tú solo necesitas 3, borra las otras 3. No las dejes "por si acaso".
      emoji: "🗑"
    - categoria: Despliegue público
      termino: GitHub Pages
      definicion: |-
        Servicio gratuito de GitHub que publica los archivos de un repositorio como sitio web público con URL fija.
      ejemplo: |-
        Tu repo "tunombre.github.io" se publica automáticamente como tunombre.github.io. Cualquiera con internet lo abre.
      emoji: "🌐"
    - categoria: Despliegue público
      termino: Patrón 70-20-10
      definicion: |-
        Proporción saludable de una buena adaptación: ~70% queda como la plantilla (estructura), ~20% se personaliza (colores, copy), ~10% se agrega o quita.
      ejemplo: Si cambias el 80%, rompes la coherencia de la plantilla. Si cambias el 5%, no se nota que es tuya.
      emoji: "⚖️"
  quiz:
    titulo: "✅ Verifica los principios de adaptación"
    instrucciones: |-
      5 preguntas para confirmar que distingues adaptar de copiar antes de publicar. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: En el patrón 70-20-10 de adaptación, ¿qué representa el 70%?
        opciones:
          - Lo que cambias
          - Lo que conservas de la plantilla
          - Lo que eliminas
          - Lo que agregas único
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El 70% queda como vino la plantilla (estructura, layout). El 20% se personaliza, el 10% se agrega o quita.
        feedback_incorrecto: El 70% se conserva. La plantilla es un molde probado; cambiar demasiado rompe su coherencia.
      - enunciado: ¿Cuál es el error más grave al usar una plantilla?
        opciones:
          - Cambiar los colores
          - Dejar copy genérico tipo "Welcome to my site!"
          - Cambiar la tipografía
          - Eliminar una sección
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Dejar copy placeholder es la señal #1 de un sitio sin trabajar. El visitante lo nota en 3 segundos y cierra.
        feedback_incorrecto: |-
          El copy genérico es el error mortal. "Welcome to my site!" o "John Doe" son banderas rojas que dicen "no me tomé el trabajo".
      - enunciado: Si dos personas usan la misma plantilla, ¿qué hace que un sitio sea reconocible como tuyo?
        opciones:
          - Que cambies la estructura HTML
          - "Tus decisiones de identidad: paleta, tipografía, copy, detalles únicos"
          - Que tenga más secciones
          - Que sea más larga
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La identidad —tu paleta, tu voz, tus detalles únicos— es lo que firma tu adaptación. La estructura puede ser idéntica.
        feedback_incorrecto: |-
          La identidad. Tu paleta + tipografía + copy + detalles únicos. La estructura HTML puede ser igual a la del compañero y aun así reconocerse como tuya.
      - enunciado: ¿Qué es GitHub Pages?
        opciones:
          - Un editor de código
          - Servicio gratuito que publica los archivos de un repo como sitio web con URL pública
          - Una red social para programadores
          - Un sistema de control de versiones
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Publicas un repo y GitHub te da una URL pública gratuita. Ideal para sitios estáticos y portafolios.
        feedback_incorrecto: |-
          GitHub Pages publica los archivos de un repo como sitio público con URL fija. Es gratis y soporta dominios estáticos.
      - enunciado: En el saber ancestral del molde y la firma, ¿qué aplica directamente a adaptar una plantilla?
        opciones:
          - Nada — los moldes tradicionales no tienen que ver con la web
          - Que la estructura se conserva (molde) y la firma personal cambia
          - Que solo los maestros usan moldes
          - Que los moldes son del pasado
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La receta de la abuela enseñada con molde y firma = la plantilla web adaptada con tu identidad.
        feedback_incorrecto: |-
          Lo que conservas (estructura) es el molde; lo que cambias (identidad) es la firma. Mismo principio del oficio heredado.
  post_lectura:
    transferencia: |-
      Esta semana, comparte tu URL pública con 3 personas: un familiar, un compañero, un docente. Pídele a cada uno UNA observación. No discutas las observaciones: anótalas tal cual. La próxima guía empezamos con esas tres voces externas como insumo de redacción.
  cinco_dimensiones:
    personal: |-
      Pasaste de tener una marca en cuaderno a tener una marca con URL pública: tu primera presencia real en la web.
    emocional: |-
      Sentiste lo que cuesta publicar algo público y la satisfacción de hacerlo con criterio, no improvisando.
    ciudadana: |-
      Te sumaste a la infoesfera pública aportando un sitio propio en vez de un clon más de plantilla genérica.
    local: |-
      Llevaste señales del Valle —colores, copy en español de Colombia, referencias locales— a un molde diseñado en otra parte.
    intergeneracional: |-
      Tu URL queda en internet — los archivos del futuro la leerán. Es tu primera huella permanente en la web.

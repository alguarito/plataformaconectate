clave: 1-5
grado: 11
periodo: 1
sesion: 5
completo: true
titulo: Copywriting con IA --- escribir con criterio, no a ciegas
titulo_portada: |-
  Copywriting con IA ---
  escribir con criterio,
  no a ciegas
producto_final: Página ``Sobre mí'' del sitio, coescrita con IA y revisada con criterio personal
apertura:
  saber_ancestral: |-
    La \textbf{tradición oral} de los pueblos del Pacífico, los Andes y el Valle no era una transmisión pasiva: cada generación tomaba la historia de la anterior, la adaptaba a su contexto y se la pasaba a la siguiente. Lo que llegaba a tus abuelos no era exactamente lo que sus abuelos contaron --- pero conservaba la esencia. La autoría era \emph{compartida} entre generaciones, con la voz viva del que cuenta hoy.
  origen: Tradición oral del Pacífico, los Andes y el Valle colombiano
  saber_contemporaneo: |-
    Hoy tienes un nuevo ``ancestro colaborador'': la IA generativa (ChatGPT, Claude, Gemini). Te puede ayudar a escribir más rápido y mejor estructurado. Pero como cualquier coautor, necesita que tú aportes lo único que ella no tiene: \textbf{quién eres y por qué importa}. Sin esa voz tuya encima, la IA escribe textos pasables que no son de nadie.
  pregunta_puente: |-
    ¿Cómo se hereda la voz de una generación a otra sin que se diluya su identidad? ¿Y cómo escribes con una herramienta que puede sonar a cualquiera?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} patrones únicos de tu voz al escribir; (2) \textbf{analizar} cómo cambia un texto cuando lo escribe la IA en lugar de ti; (3) \textbf{crear} la página ``Sobre mí'' del sitio en colaboración con IA y revisión tuya; (4) \textbf{evaluar} si el resultado final suena a ti.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hoy le pones \emph{voz} a tu sitio --- escribirás la página ``Sobre mí'' en colaboración con IA, sin perder lo que solo tú puedes decir.
  a_escuta: |-
    Antes de pedirle a la IA que escriba contigo, tienes que conocer tu propia voz. ¿Qué palabras repites? ¿Qué giros usas? Solo así notarás cuándo la IA escribe como tú y cuándo escribe como nadie.
  a_sistematizacion: |-
    Ya identificaste tu voz. Ahora vamos a ver \textbf{qué pasa cuando un texto pasa por la IA} --- qué se conserva, qué se gana, qué se pierde. Es el experimento clave para decidir cómo vas a colaborar con ella.
  a_praxis: |-
    Tienes el diagnóstico. Toca escribir el texto real: la página ``Sobre mí'' del sitio, en una conversación con la IA donde TÚ diriges y ella ejecuta.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas: una página ``Sobre mí'' lista para pegar en el sitio. El criterio principal: que alguien que te conoce pueda leerla y reconocer tu voz.
  a_evaluacion: |-
    Antes de cerrar, mira el proceso desde las cinco dimensiones humanas. Coescribir con IA es un acto profundamente personal, ciudadano y ético --- aunque parezca solo técnico.
  a_triangulo: |-
    Y para terminar, tres voces sobre la autoría con IA. Dussel sobre la voz colonizada, Marco Aurelio sobre la coherencia interna, Floridi sobre la IA como otro inforg en la infoesfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tu voz al escribir} (15 min · individual). Mira los últimos 20 mensajes de WhatsApp que escribiste (no copies-pegues los que te enviaron). Identifica: ¿qué palabras o frases repites? ¿usas comas o frases cortas? ¿usas emojis, cuáles? ¿hablas con tono formal, informal, irónico? Tu voz al escribir es ese patrón.
  checks:
  - Revisé mis últimos 20 mensajes de WhatsApp con ojo de ``observador''.
  - Identifiqué al menos 3 patrones repetidos en mi forma de escribir.
  - 'Anoté qué tono predomina en mi voz: formal, informal, irónico, cálido.'
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mi voz al escribir». \textbf{Formato:} lista de 5 patrones repetidos en tu manera de escribir, cada uno con un ejemplo real tuyo (frase textual). \textbf{Extensión:} 5 patrones + 5 ejemplos. \textbf{Sabes que terminaste cuando} los ejemplos son tuyos (no inventados), específicos (no ``hablo informal''), y un compañero que te conoce podría reconocerte por esos patrones.
sistematizacion:
  intro: |-
    Toda colaboración con IA tiene cuatro pilares. Vamos a descomponerlos para que sepas exactamente cómo dirigir a la IA en lugar de que ella te dirija a ti.
  pilares:
  - |-
    \textbf{Descomposición.} Una buena colaboración con IA se descompone en 4 capas que actúan como una conversación: (1) \textbf{contexto} (le dices quién eres, qué haces, para qué es el texto, dónde se publica); (2) \textbf{voz} (le compartes 2-3 ejemplos reales de tu manera de escribir --- mensajes, posts antiguos, fragmentos donde te reconoces); (3) \textbf{tarea} (le pides algo concreto y específico, no ``ayúdame''); (4) \textbf{iteración} (revisas la respuesta, marcas lo que funciona, le pides cambios precisos, vuelves a revisar). Sin las 4 capas, sale texto genérico.
  - |-
    \textbf{Reconocimiento de patrones.} Toda IA generativa sigue el patrón básico ``\emph{le das señal, ella amplía}''. Si tu señal es genérica (``escribe un Sobre mí''), su respuesta será un promedio estadístico de millones de ``Sobre mí'' que vio --- mediocre por construcción. Si tu señal es rica (contexto + ejemplos + tono específico + restricciones explícitas), su respuesta puede acercarse a tu voz. La diferencia entre un texto IA mediocre y uno bueno no está en la IA: está en la calidad del prompt.
  - |-
    \textbf{Abstracción.} Lo esencial de tu colaboración con IA cabe en una pregunta: \emph{¿estoy usándola como espejo o como autora?}. Si la IA es \textbf{espejo}, tú decides --- ella refleja, amplifica, propone variaciones y tú firmas con criterio. Si la IA es \textbf{autora}, tú firmas algo que no es tuyo, y la diferencia entre las dos posiciones es ética, no técnica. Detectar en qué posición estás cada vez que abres ChatGPT es una habilidad crítica del siglo XXI.
  - |-
    \textbf{Algoritmo.} Estructura mínima de un prompt para coescritura: (1) ``Eres un editor que me ayuda a escribir [tipo de texto]''; (2) ``Aquí están 3 ejemplos reales de mi manera de escribir: [ejemplos]''; (3) ``Necesito que me ayudes a redactar [tarea concreta] de [longitud específica] para [audiencia]''; (4) ``Conserva mi tono. Evita estas palabras: [lista negra]. Dame 3 versiones para elegir.''. Itera con peticiones específicas: ``más corto'', ``menos cliché en el párrafo 2'', ``cambia la metáfora''.
  anatomia:
    titulo: Anatomía de un prompt para coescritura con IA
    body: |-
      \textbf{Rol:} ``Eres un editor de textos personales...'' \\[1mm] \textbf{Voz:} ``Aquí están 3 fragmentos que escribí. Conserva este tono.'' \\[1mm] \textbf{Tarea:} ``Ayúdame a escribir mi `Sobre mí' en 3 párrafos cortos.'' \\[1mm] \textbf{Restricciones:} ``Evita clichés como `apasionado', `creativo', `innovador'.'' \\[1mm] \textbf{Iteración:} ``Dame 3 versiones para elegir una y luego refinarla.''
  errores_comunes: |-
    (1) Pedirle a la IA que escriba sin darle ejemplos de tu voz: sale genérico, suena a manual de ventas estándar. (2) Aceptar la primera versión sin iterar: te quedas con el promedio estadístico, nunca con tu voz. (3) Usar las palabras que la IA mete por defecto (``apasionado'', ``transformador'', ``viaje'', ``aventura'', ``empoderar''): se notan a kilómetros y delatan que el texto es de IA, no tuyo. (4) Firmar como tuyo un texto que no revisaste línea por línea: estás firmando algo que no puedes defender si te preguntan. (5) Pedirle a la IA que ``sea creativa'': la creatividad no se le pide, se le restringe --- ``no uses metáforas obvias'' produce mejor resultado que ``sé creativo''.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Mi voz vs. la IA». \textbf{Formato:} (1) un prompt sencillo (``escribe un Sobre mí para una persona como yo''), pega la respuesta de la IA. (2) Anota 3 cosas que se parecen a tu voz y 3 que no. (3) Reescribe la respuesta a mano corrigiendo lo que no suena a ti. \textbf{Sabes que terminaste cuando} puedes señalar palabras específicas que la IA usó y que tú no usarías nunca.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu ``Sobre mí'' coescrito con IA} (35 min · individual). Hora de escribir el texto que va al sitio. Vas a tener una conversación con la IA donde TÚ diriges: le das contexto, ejemplos, tarea, iteras, y al final firmas un texto que puedes defender línea por línea.
  pilares:
  - |-
    \textbf{Descomposición.} Tu sesión con la IA se descompone en 4 turnos secuenciales: (1) \textbf{prompt inicial} con rol + voz + tarea + restricciones; (2) \textbf{respuesta IA} que lees críticamente subrayando lo que sí suena a ti; (3) \textbf{tu revisión + petición de cambios} específicos (no ``mejóralo'', sí ``el párrafo 2 suena cliché, reemplaza'la metáfora del viaje''); (4) \textbf{versión final que tú reescribes} agregando lo único que la IA no puede saber (una anécdota local, una manía propia).
  - |-
    \textbf{Patrones.} Sigue el patrón \textbf{``espejo''}: la IA produce, tú diriges. Si en algún momento sientes que estás copiando y pegando sin pensar, detén el flujo --- ya estás dejando que ella sea la autora. La señal de alerta: si lees el texto y no sientes nada particular (ni reconocimiento ni rechazo), es texto IA puro disfrazado de tuyo. Bórralo y vuelve a empezar con más contexto.
  - |-
    \textbf{Abstracción.} Cada párrafo expresa una sola idea sobre ti. Si un párrafo de la IA dice 3 cosas distintas (``soy creativo, ordenado y comunicativo''), pártelo o bórralo. Si dice nada concreto (puro adjetivo sin sustento), bórralo. La prueba: cada párrafo debería poder defenderse con una evidencia real --- una pieza, un proyecto, una situación verificable. Sin evidencia, es inflación.
  - |-
    \textbf{Algoritmo.} (1) Abre ChatGPT, Claude o Gemini; (2) prompt inicial completo (rol + voz con ejemplos + tarea + restricciones) usando la plantilla de la Sist; (3) lee la respuesta con marcador en mano y subraya lo que sí suena a ti; (4) pide una segunda versión con esas direcciones específicas; (5) reescribe \emph{a mano} la versión final en el cuaderno --- agregar 1 frase que la IA nunca podría escribir (una referencia a tu barrio, una manía tuya, una anécdota mínima). Esa frase es la firma humana.
  checklist:
    titulo: Checklist antes de cerrar el cuaderno
    items: |-
      \checkbox El texto final cabe en 3 párrafos cortos. \\[1mm] \checkbox Cero palabras de la lista negra (``apasionado'', ``creativo'', ``innovador'', ``transformador''). \\[1mm] \checkbox Hay al menos 1 frase que solo tú podrías escribir (referencia concreta a tu lugar, tu historia, tu manía). \\[1mm] \checkbox Lo lees en voz alta y suena a ti --- ni inflado ni copiado. \\[1mm] \checkbox Coherente con tu propuesta de valor (Guía 1) y sistema visual (Guía 2).
  plantilla_guion: |-
    \textbf{Párrafo 1 · Quién soy.} \textit{En una frase corta, sin currículum.} \\[1mm] \textbf{Párrafo 2 · Qué hago.} \textit{Tu propuesta de valor en voz propia.} \\[1mm] \textbf{Párrafo 3 · Cómo conectar.} \textit{Email + una invitación cálida y específica.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Sobre mí · versión final». \textbf{Formato:} (1) el prompt completo que usaste con la IA (arriba), (2) el texto final de 3 párrafos cortos (abajo). \textbf{Extensión:} una página de cuaderno. \textbf{Sabes que terminaste cuando} cero palabras de la lista negra, al menos 1 frase irrepetible, y un compañero que te conoce te reconoce al leerlo.
  producto_titulo: Página ``Sobre mí'' coescrita con IA y firmada con tu voz
  criterios:
  - 3 párrafos cortos, no más
  - |-
    Cero palabras clichés (``apasionado'', ``creativo'', ``innovador'', ``transformador'')
  - |-
    Al menos 1 frase que solo tú podrías escribir (referencia local, anécdota, manía)
  - Coherente con tu propuesta de valor y sistema visual de las guías anteriores
  - |-
    Pasa el ``read aloud test'': al leerlo en voz alta a alguien que te conoce, te reconoce
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: Toda comunidad de comunicación se hace plena cuando incluye la voz del excluido.
    aplicacion: |-
      La IA fue entrenada principalmente con textos del norte global, en inglés. Su voz por defecto está sesgada hacia ese mundo. Si la dejas escribir sin dirigirla, te dará frases neutras que diluyen tu identidad latinoamericana. Coescribir con criterio es un acto de inclusión de tu propia voz en la infoesfera dominante.
    pregunta_espejo: |-
      ¿La IA está incluyendo mi voz local o me la está borrando suavemente? ¿Estoy permitiendo que escriba por mí en lugar de conmigo?
  estoico:
    autor: Marco Aurelio
    cita: No es lo que dices, es lo que haces lo que define quién eres.
    aplicacion: |-
      La tentación con IA es publicar lo que escribió y firmar como tuyo. Pero firmar es un acto: estás diciéndole al mundo ``esto soy yo''. La integridad estoica te pide que firmes solo lo que puedes defender línea por línea --- y eso depende solo de ti.
    pregunta_espejo: |-
      ¿Puedo defender cada línea de este texto como mía? Si me preguntan ``¿por qué pusiste esta frase?'', ¿tengo respuesta?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Cuando un agente delega su voz a otro, ambos quedan transformados en la infoesfera.
    aplicacion: |-
      Cada vez que aceptas un texto de la IA sin revisarlo, le delegas tu voz. La IA se convierte en un coautor invisible de tu identidad digital. Floridi llama a eso \emph{re-ontologisation informacional}: cambias quién eres digitalmente al cambiar quién escribe por ti.
    pregunta_espejo: |-
      ¿Estoy usando la IA como herramienta o le estoy entregando mi voz? ¿Quién está firmando cuando publico este texto?
compromiso: |-
  \textbf{Para la próxima semana.} Antes de publicar cualquier texto coescrito con IA esta semana (redes, correos, ensayos), aplícale el ``read aloud test'': léelo en voz alta a alguien que te conoce. Si te reconoce, publícalo. Si no, reescríbelo. El próximo lunes traes 3 textos pasados por ese filtro.
web:
  resumen: |-
    Coescribes con IA la página "Sobre mí" de tu sitio sin perder tu voz. La IA ejecuta, tú diriges y firmas.
  subtema: Presencia y marca digital · IA generativa con criterio
  pre_lectura:
    por_que_importa: |-
      La IA puede ayudarte a escribir más rápido y mejor estructurado. Pero como cualquier coautor, necesita que tú aportes lo único que ella no tiene: quién eres y por qué importa. Sin tu voz encima, la IA escribe textos pasables que no son de nadie.
    pregunta_detonante: Si publicas un texto que escribió la IA y nadie sabe — ¿quién firmó realmente?
    activacion:
      titulo: El test del eco
      descripcion: |-
        En 3 minutos, pídele a ChatGPT o Claude: "escribe un Sobre mí para un estudiante de grado 11 en Colombia". Lee la respuesta y subraya 3 palabras que TÚ jamás usarías. Eso es la voz por defecto de la IA — el eco genérico que vamos a desmontar.
      duracion_min: 4
    conexion:
      anterior: "En la sesión 4 publicaste tu sitio adaptado en GitHub Pages: tu marca ya tiene URL pública."
      siguiente: En la sesión 6 optimizarás el sitio para SEO básico — para que Google encuentre lo que escribiste.
  conceptos_clave:
    - termino: Voz al escribir
      definicion: |-
        Tu patrón único al escribir: palabras que repites, ritmo de frase, tono, manías. Es lo que hace que un compañero te reconozca sin ver tu nombre.
      ejemplo: |-
        Si usas "parce", abrevias "porq", terminas con "jaja" — eso es tu voz. Reconocible y distinta a la de cualquier otro.
      emoji: "🗣"
    - termino: Prompt con voz
      definicion: |-
        Un prompt que NO solo pide algo: aporta tu rol, ejemplos de tu manera de escribir, restricciones de tono y palabras a evitar. La IA solo puede sonar a ti si le das insumo de cómo suenas tú.
      ejemplo: |-
        "Eres mi editor. Aquí van 3 mensajes míos: [...]. Conserva ese tono. Evita: apasionado, creativo, innovador. Escribe un Sobre mí en 3 párrafos."
      emoji: "📝"
    - termino: Iteración
      definicion: |-
        Pedirle a la IA varias versiones y refinar. Aceptar la primera respuesta es quedarse con el promedio — siempre. Las buenas conversaciones con IA son 3-5 turnos, no uno.
      ejemplo: |-
        "Dame 3 versiones distintas. Elijo la 2 pero quítale el adjetivo del primer párrafo y agrega una referencia a Cartago."
      emoji: "🔁"
    - termino: Lista negra de clichés
      definicion: |-
        Palabras que la IA mete por defecto y que delatan que un texto no es humano: "apasionado", "creativo", "innovador", "transformador", "comprometido", "fanático de los retos".
      ejemplo: |-
        Si tu Sobre mí dice "soy un apasionado por la tecnología", todos en el aula sabrán que lo escribió ChatGPT.
      emoji: "🚫"
    - termino: Frase irrepetible
      definicion: |-
        Una línea que solo tú podrías escribir: una referencia local concreta, una manía, una anécdota mínima. Es la firma humana que la IA jamás podrá imitar.
      ejemplo: |-
        "Crecí oyendo la lluvia en techos de zinc en Cartago" — la IA puede acercarse, pero no es lo mismo que escribirla tú.
      emoji: "✨"
    - termino: Read aloud test
      definicion: |-
        Antes de publicar un texto coescrito con IA, léelo en voz alta a alguien que te conoce. Si te reconoce al oírlo, está listo. Si no, vuelve al prompt.
      ejemplo: |-
        Tu mamá oye el texto y dice "sí, suena a ti" → publica. Tu hermana dice "esto no eres tú" → reescribe.
      emoji: "🔊"
  quiz:
    titulo: "✅ Verifica el criterio de coautoría"
    instrucciones: |-
      5 preguntas para confirmar que dominas la diferencia entre usar IA como espejo y delegarle tu voz. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Por qué la primera respuesta de la IA suena genérica?
        opciones:
          - Porque la IA es mala
          - Porque sin tu insumo (voz, ejemplos), te entrega el promedio entrenado
          - Porque tiene errores
          - Porque es lenta
        respuesta_index: 1
        feedback_correcto: Exacto. La IA es buena promediando. Si no le das voz tuya, te entrega lo más común — que no es tuyo.
        feedback_incorrecto: |-
          La IA entrega el promedio cuando no le das insumo de tu voz. No es mala — es que necesita tu material para sonar a ti.
      - enunciado: ¿Cuál de estas palabras NO debería aparecer en tu Sobre mí coescrito con IA?
        opciones:
          - Cartago
          - Apasionado
          - Música
          - Mi familia
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. "Apasionado" es la palabra estrella de los clichés que mete la IA por defecto. Junto con "creativo", "innovador", "transformador", "comprometido".
        feedback_incorrecto: |-
          "Apasionado" es bandera roja: aparece en el 80% de los Sobre mí generados por IA. Si lo dejas, todos sabrán quién escribió.
      - enunciado: ¿Qué es una "frase irrepetible" en tu texto?
        opciones:
          - Una frase muy larga
          - Una línea que solo tú podrías escribir (referencia local, anécdota, manía)
          - Una frase con palabras raras
          - Una frase en otro idioma
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La firma humana que la IA jamás podrá imitar: una referencia a tu Cartago, una manía, una anécdota mínima.
        feedback_incorrecto: |-
          La frase irrepetible es la que solo tú podrías escribir: referencia local, anécdota, manía. Es tu firma humana.
      - enunciado: ¿Cuál es el "read aloud test"?
        opciones:
          - Leer rápido el texto
          - Leer el texto en voz alta a alguien que te conoce y ver si te reconoce
          - Hacer que la IA lea el texto
          - Leer el texto a un desconocido
        respuesta_index: 1
        feedback_correcto: Correcto. Si te reconoce al oírlo, está listo. Si no, vuelve al prompt.
        feedback_incorrecto: "El read aloud test: léeselo a alguien que te conoce. Si te reconoce, publícalo. Si no, reescribe."
      - enunciado: En el saber ancestral de la tradición oral, ¿qué aplica a coescribir con IA?
        opciones:
          - Nada — la tradición oral no tiene que ver con IA
          - Autoría compartida entre generaciones, con voz viva del que cuenta hoy
          - Que las historias se inventaban
          - Que solo los mayores las contaban
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La IA es como un ancestro colaborador: te entrega material que tú adaptas con tu voz viva.
        feedback_incorrecto: |-
          La tradición oral: autoría compartida con voz viva. Coescribir con IA es exactamente eso — material que tú firmas con tu voz.
  post_lectura:
    transferencia: |-
      Esta semana, antes de publicar cualquier texto coescrito con IA (redes, correos, ensayos), aplica el read aloud test: léelo en voz alta a alguien que te conoce. Si te reconoce, publica. Si no, reescribe. El próximo lunes traes 3 textos pasados por ese filtro.
  cinco_dimensiones:
    personal: Reconociste tu voz al escribir y aprendiste a dirigir a la IA en lugar de dejarte dirigir.
    emocional: |-
      Sentiste la tentación de aceptar la primera versión y elegiste el camino más lento pero más auténtico.
    ciudadana: Coescribir con criterio es resistir la homogeneización lingüística de la infoesfera global.
    local: |-
      Cada frase irrepetible tuya —Valle, Cartago, español de Colombia— es un acto de inclusión en una IA entrenada en otro mundo.
    intergeneracional: |-
      Heredaste la tradición de autoría compartida (oral) y la usaste en formato 2026: tú diriges, la IA ejecuta, tú firmas.

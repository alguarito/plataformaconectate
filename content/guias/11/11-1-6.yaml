titulo: SEO básico --- hacerme visible sin engaños
titulo_portada: |-
  SEO básico ---
  hacerme visible
  sin engaños
producto_final: Plan de palabras clave + meta-etiquetas configuradas + sitemap.xml del sitio
apertura:
  saber_ancestral: |-
    En las plazas del Valle, el \textbf{pregonero} era el oficio de hacer llegar el mensaje correcto a la gente correcta. No gritaba: \emph{pregonaba}. Anunciaba con voz clara, a la hora justa, en el lugar donde lo necesitaban escuchar. ``Los huevos del corral de Don Tobías'', ``el agua bendita del padre Antonio'', ``el pan tibio de la señora Inés''. El que lo oía iba; el que no lo necesitaba seguía su camino. Pregón honesto, no grito desesperado.
  saber_contemporaneo: |-
    El \textbf{SEO} (Search Engine Optimization) es el pregón digital. No truquillos para engañar a Google: técnica honesta para que tu sitio aparezca cuando alguien busca lo que tú ofreces. Tres piezas: \textbf{palabras clave} (qué busca la gente), \textbf{meta-etiquetas} (cómo te presentas en el resultado), y \textbf{sitemap} (el mapa que le entregas al buscador).
  pregunta_puente: |-
    ¿Qué hacía que el pregonero antiguo lograra que la gente \emph{correcta} lo escuchara entre el ruido de la plaza? ¿Por qué a algunos los oían y a otros no?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las palabras clave que la gente buscaría para encontrar a alguien como tú; (2) \textbf{explicar} con tus palabras cómo decide un buscador qué mostrar primero; (3) \textbf{aplicar} meta-etiquetas, sitemap y alt text en tu sitio; (4) \textbf{evaluar} si apareces al buscarte.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hoy le abrirás la \emph{voz} a tu sitio --- haces que Google y otros buscadores lo encuentren cuando alguien busca lo que tu marca ofrece.
  a_escuta: |-
    Antes de optimizar tu sitio para Google, hay que entender cómo busca la gente real. Vas a ponerte en los zapatos de quien podría buscarte: ¿qué palabras escribiría en Google si nunca te ha oído nombrar?
  a_sistematizacion: |-
    Ya pensaste como quien busca. Ahora vamos a entender \textbf{cómo decide Google} qué mostrar primero. No es magia ni suerte: hay reglas claras y un puñado de decisiones técnicas que sí dependen de ti.
  a_praxis: |-
    Conoces el principio. Toca aplicarlo a \emph{tu} sitio: meta-etiquetas, sitemap, alt text en imágenes. Cinco cambios pequeños que multiplican tu visibilidad sin ningún engaño.
  a_producto: |-
    Lo que sigue es el resumen de \emph{qué} entregas hoy. El criterio simple: que al buscar tu nombre o tu propuesta de valor en Google, tu sitio aparezca en la primera página.
  a_evaluacion: |-
    Antes de cerrar, mira tu trabajo desde las cinco dimensiones humanas. El SEO es técnico pero tiene cara ética: invitar o engañar, servir o saturar.
  a_triangulo: |-
    Y para terminar, tres voces sobre la visibilidad. Dussel sobre incluir vs promocionarse, Marco Aurelio sobre los algoritmos que cambian, Floridi sobre la búsqueda como acto cooperativo.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Palabras clave del que te busca} (15 min · individual). Imagina que alguien (futuro empleador, cliente, profesor) quiere encontrar a alguien como tú pero no te conoce. Anota \textbf{10 frases o palabras} que esa persona escribiría en Google. No tus términos técnicos: los términos que usaría alguien que apenas sabe lo que necesita.
  checks:
  - Pensé en al menos 3 perfiles distintos de personas que podrían buscarme.
  - Anoté frases largas (3+ palabras) no solo términos sueltos.
  - Probé en Google una de esas frases para ver qué aparece hoy.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Palabras clave de mi marca». \textbf{Formato:} lista numerada de 10 frases de búsqueda, agrupadas en 3 perfiles imaginados (quién busca cada frase). Después un párrafo de 3 renglones eligiendo las 3 frases más estratégicas. \textbf{Sabes que terminaste cuando} las frases suenan a búsquedas reales (3+ palabras, lenguaje cotidiano, no jerga técnica) y las 3 elegidas son las que tu sitio podría sostener honestamente.
sistematizacion:
  intro: |-
    Google decide qué mostrar primero según un puñado de señales que tú puedes controlar. Vamos a descomponerlas con los pilares del pensamiento computacional.
  pilares:
  - |-
    \textbf{Descomposición.} El SEO se descompone en 4 capas que cada buscador evalúa: (1) \textbf{contenido} (las palabras reales de tu sitio --- responde a lo que la gente busca con texto sustantivo, no relleno); (2) \textbf{metadatos} (title de 50-60 caracteres + description de 140-160 caracteres que Google muestra como resultado --- son tu cartel en la plaza); (3) \textbf{estructura} (HTML semántico, jerarquía clara de encabezados h1 → h2 → h3, navegación predecible); (4) \textbf{accesibilidad} (alt text en imágenes, contraste WCAG, sitio móvil-friendly). Las 4 capas pesan; ignorar una baja el ranking.
  - |-
    \textbf{Reconocimiento de patrones.} Los buscadores siguen un patrón consistente desde Google PageRank hasta hoy: dan más peso a \textbf{coincidencia + autoridad + experiencia (E-E-A-T)}. \textbf{Coincidencia}: tu sitio menciona lo que se buscó en lenguaje cercano al del que busca. \textbf{Autoridad}: otros sitios reputados te enlazan (link building honesto). \textbf{Experiencia}: la gente se queda en tu sitio, navega, no rebota a los 3 segundos. Los algoritmos de Google premian estos 3 factores combinados; un sitio rica en uno solo no escala.
  - |-
    \textbf{Abstracción.} Lo esencial del SEO cabe en una pregunta: \emph{¿le facilito a Google entender de qué se trata mi sitio en 5 segundos?}. Si la respuesta es sí, vas bien. Si el bot tiene que adivinar (title genérico, h1 ambiguo, descripción vacía, imágenes sin alt), tu posición caerá sin importar cuánto contenido tengas. El SEO bueno hace lo opuesto al SEO de los noventa (que escondía palabras clave); hoy, claridad gana sobre truco.
  - |-
    \textbf{Algoritmo.} (1) Elige 3 frases-clave estratégicas que combinen tu nombre + tu propuesta de valor; (2) ponlas en tu title y description sin sonar a relleno; (3) úsalas naturalmente en H1, H2 y párrafos --- una vez es suficiente, repetirlas 20 veces es \emph{keyword stuffing} y te penaliza; (4) escribe alt text en cada imagen describiendo lo que muestra (sirve a lectores de pantalla y a Google); (5) genera \texttt{sitemap.xml} y subelo a la raíz; (6) verifica todo en search.google.com/search-console.
  anatomia:
    titulo: Anatomía de una página optimizada para buscadores
    body: |-
      \textbf{Title (50-60 caracteres):} ``Tu nombre --- tu propuesta de valor''. Aparece en la pestaña y en el resultado de Google. \\[1mm] \textbf{Meta description (140-160 caracteres):} resumen claro de qué encontrará quien entre. \\[1mm] \textbf{H1 único:} con tu palabra clave principal de forma natural. \\[1mm] \textbf{Alt text en imágenes:} describe lo que la imagen muestra (sirve a lectores de pantalla \emph{y} a Google). \\[1mm] \textbf{Sitemap.xml:} lista de todas tus páginas, en la raíz de tu dominio.
  errores_comunes: |-
    (1) Title genérico (``Inicio'' o ``Home''): pierdes el 90\% del SEO porque el title es la señal más fuerte que Google lee primero. (2) Repetir la palabra clave 20 veces en el contenido (\emph{keyword stuffing}): Google lo detecta desde 2012 y lo penaliza. (3) Imágenes sin alt text: invisibles para Google y para lectores de pantalla --- doble penalización ética y de SEO. (4) Promesas en el title o description que tu sitio no cumple: la gente entra, sale rápido (bounce rate alto) y tu posición cae en cuestión de semanas. (5) No tener versión móvil bien hecha: Google indexa móvil primero desde 2018; si tu sitio se rompe a 360 px, es como si no existiera.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Cómo decide Google qué mostrar primero». \textbf{Formato:} 4 fichas, una por capa del SEO (contenido / metadatos / estructura / accesibilidad), cada ficha con: qué es (1 frase con tus palabras) + un ejemplo concreto de cómo lo aplicarías a tu sitio. \textbf{Sabes que terminaste cuando} puedes explicar cada capa sin mirar notas y dar un ejemplo de tu propio caso.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Optimizar tu sitio en 5 pasos} (35 min · individual). Tienes el principio. Hora de ejecutar en \emph{tu} sitio: meta-tags, alt text en imágenes, jerarquía de encabezados y sitemap. Al final, tu sitio estará listo para que Google lo encuentre cuando alguien busque lo que ofreces honestamente.
  pilares:
  - |-
    \textbf{Descomposición.} Tu optimización se descompone en 5 cambios atómicos y secuenciales: (1) \textbf{title} de 50-60 caracteres específico; (2) \textbf{meta description} de 140-160 caracteres clara; (3) \textbf{H1 único} con tu palabra clave principal de forma natural; (4) \textbf{alt text} descriptivo en todas las imágenes; (5) \textbf{sitemap.xml} en la raíz del dominio. Hechos en orden y verificados uno a uno, son la base del SEO técnico básico para cualquier sitio personal.
  - |-
    \textbf{Patrones.} Sigue el patrón \textbf{``honestidad SEO''}: cada palabra clave que pongas debe estar sostenida por contenido real y verificable. Si prometes en el title ``programador full stack'' pero tu sitio no tiene proyectos de programación visibles, Google te baja en cuestión de semanas porque el comportamiento de los visitantes (rebote rápido) le dice al algoritmo que no cumples. La regla de oro: SEO sin contenido honesto detrás es como un cartel sin tienda.
  - |-
    \textbf{Abstracción.} Cada meta-etiqueta expresa una sola idea esencial. Si tu description dice 3 cosas distintas (``soy programador, también diseño, también escribo''), Google la corta y muestra un fragmento aleatorio --- pierdes la primera impresión. Mejor una description que dice una cosa con claridad: ``Diseño sitios web para pequeños negocios de Cartago. 12 proyectos, 3 años de oficio''. Una idea, datos concretos, ninguna inflación.
  - |-
    \textbf{Algoritmo.} (1) Abre tu sitio en VS Code; (2) edita \texttt{<title>} y \texttt{<meta name="description">} en el \texttt{<head>} de \texttt{index.html}; (3) revisa que existe UN \texttt{<h1>} con tu palabra clave usada con naturalidad (no forzada); (4) recorre todas las imágenes y agrega \texttt{alt="descripción específica"}; (5) crea \texttt{sitemap.xml} con la lista de tus URLs; (6) commit y push; (7) sube el sitemap a Google Search Console para que lo indexe rápido.
  checklist:
    titulo: Checklist antes de declarar el SEO básico hecho
    items: |-
      \checkbox Title de 50-60 caracteres con tu propuesta de valor. \\[1mm] \checkbox Description de 140-160 caracteres clara y específica. \\[1mm] \checkbox H1 único con tu palabra clave principal de forma natural. \\[1mm] \checkbox Todas las imágenes tienen \texttt{alt} descriptivo. \\[1mm] \checkbox \texttt{sitemap.xml} en la raíz, validado en search.google.com/test.
  plantilla_guion: |-
    \textbf{Title.} \textit{Tu fórmula final, 50-60 caracteres.} \\[1mm] \textbf{Description.} \textit{Tu resumen final, 140-160 caracteres.} \\[1mm] \textbf{Palabras clave estratégicas.} \textit{Las 3 elegidas, dónde aparecen en el sitio.} \\[1mm] \textbf{Sitemap.} \textit{URL pública del sitemap.xml.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi SEO básico aplicado». \textbf{Formato:} 4 secciones (Title · Description · Palabras clave aplicadas · Sitemap), cada una con sus datos finales y captura del código real. \textbf{Extensión:} una página de cuaderno. \textbf{Sabes que terminaste cuando} al buscar tu title en Google (búsqueda con comillas) tu sitio aparece en los primeros resultados.
  producto_titulo: Sitio optimizado con title, description, alt text y sitemap.xml
  criterios:
  - Title específico (no ``Inicio''), 50-60 caracteres
  - Description única, 140-160 caracteres, sin promesas que no cumples
  - UN H1 con palabra clave principal usada naturalmente
  - Cien por ciento de imágenes con alt descriptivo
  - Sitemap.xml accesible y validado
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: Toda comunidad de comunicación se hace plena cuando incluye la voz del excluido.
    aplicacion: |-
      El SEO es la diferencia entre que tu sitio sea encontrado por la gente que de verdad lo necesita o que se pierda en la marea de internet. Pero también puede ser usado para empujar voces hacia abajo: cuando un negocio grande compra términos que podrían servirle a uno pequeño del barrio. La pregunta ética está en a quién sirve tu visibilidad.
    pregunta_espejo: |-
      ¿Mi sitio aparece para servir a quien lo busca, o solo para promocionarme yo? ¿A quién dejo afuera con las palabras clave que elijo?
  estoico:
    autor: Marco Aurelio
    cita: El obstáculo en el camino se vuelve el camino.
    aplicacion: |-
      Los algoritmos de Google cambian todos los meses. Si tu estrategia depende de trucos, se desmorona. Lo que sí depende de ti --- la calidad del contenido, la honestidad de las promesas, la claridad del sitio --- sobrevive los cambios. La paciencia estoica vence al algoritmo.
    pregunta_espejo: |-
      ¿Mi SEO depende de trucos que cualquier cambio de algoritmo derriba, o de calidad que aguanta el tiempo? ¿Qué de mi sitio sobrevive a Google?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La búsqueda es un acto cooperativo entre el que busca, el que ofrece, y la infoesfera que los conecta.
    aplicacion: |-
      Cada vez que optimizas honestamente, aportas a que la infoesfera funcione mejor para todos. Cada vez que haces SEO de spam (palabras clave irrelevantes, descripciones engañosas), la rompes un poco. Floridi llamaría a esto \emph{degradación informacional}.
    pregunta_espejo: |-
      ¿Mi SEO aporta a la cooperación de búsqueda en la infoesfera, o la degrada con ruido? ¿Estoy ayudando a que la gente encuentre lo que necesita?
compromiso: |-
  \textbf{Para la próxima semana.} Cada día, abre Google y busca una de tus 3 frases clave estratégicas. Anota en una hoja qué posición ocupa tu sitio y cómo se ve tu resultado (title y description) en el listado. Esa bitácora te enseña a leer cómo te ve Google. El próximo lunes traes la bitácora de 7 días al aula.

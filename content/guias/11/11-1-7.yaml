clave: 1-7
grado: 11
periodo: 1
sesion: 7
completo: true
titulo: Imagen propia --- cómo se ve mi marca en foto y video
titulo_portada: |-
  Imagen propia ---
  cómo se ve mi marca
  en foto y video
producto_final: 3 fotos de perfil profesional + 1 video corto ($\leq$60 s) de presentación
apertura:
  saber_ancestral: |-
    El \textbf{retrato del oficio} era un género visual con propósito: el panadero con su pan, el pescador con su atarraya, la tejedora con su telar, el campesino con su azadón. No era \emph{selfie}. Era una imagen que decía sin palabras quién hacía qué, dónde, y con qué orgullo. La foto comunicaba dignidad, oficio y competencia antes de que la persona dijera su nombre.
  origen: Tradición del retrato del oficio en el Valle, el Pacífico y el campo colombiano
  saber_contemporaneo: |-
    Hoy tu marca necesita lo mismo en formato digital: una \textbf{foto de perfil} que comunique tu oficio, una \textbf{foto de ambiente} que muestre dónde trabajas, y un \textbf{video corto} (60 segundos máximo) donde te presentas. En redes y perfiles, esa pieza visual habla por ti antes que tu texto. Quien te ve decide en menos de 3 segundos si quiere leerte.
  pregunta_puente: |-
    ¿Qué hacía que una foto antigua de oficio comunicara dignidad y competencia sin decir una palabra? ¿Qué de eso puedes replicar hoy con un celular?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué señales visuales transmite una imagen profesional vs una casual; (2) \textbf{analizar} 3 fotos profesionales que admiras; (3) \textbf{crear} tus 3 fotos + 1 video con criterio; (4) \textbf{evaluar} la imagen propia de un compañero.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hoy le pones \emph{cara} a tu marca --- no la selfie de tu cumpleaños, una imagen que comunique quién eres profesionalmente.
  a_escuta: |-
    Antes de tomarte tu foto, vas a leer otras. Las imágenes que funcionan tienen decisiones técnicas atrás: encuadre, fondo, mirada, iluminación. Entrenar el ojo es el primer paso.
  a_sistematizacion: |-
    Ya viste qué hace fuerte una imagen de oficio moderna. Ahora vamos a aprender las \textbf{cuatro decisiones técnicas} que la diferencian de una foto casual: encuadre, fondo, luz, intención.
  a_praxis: |-
    Tienes el criterio. Toca producir: 3 fotos y 1 video corto con celular y un par de minutos. Sin presupuesto, sin sesión profesional --- con decisiones acertadas.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy y \emph{cómo se sabe} si tu imagen funciona. El criterio principal: que un extraño pueda mirarla 3 segundos y entender qué haces.
  a_evaluacion: |-
    Antes de cerrar, mira tu imagen desde las cinco dimensiones humanas. La foto profesional toca temas profundos: cómo te ves, cómo te ven, qué expectativa construyes.
  a_triangulo: |-
    Y para terminar, tres voces sobre la imagen pública. Dussel sobre la voz visual silenciada, Epicteto sobre lo que depende de ti, Floridi sobre la imagen como información en la infoesfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Foto profesional vs foto casual} (15 min · individual). Busca en LinkedIn (o portafolios en línea) \textbf{3 fotos profesionales} de personas que admiras y \textbf{3 fotos casuales} (Instagram, TikTok) de cualquier persona. Para cada par: ¿qué diferencias notas en encuadre, fondo, mirada, luz?
  checks:
  - Encontré 3 fotos profesionales que comunican oficio o competencia.
  - Las contrasté con 3 fotos casuales de mi propio feed.
  - Identifiqué 4 diferencias técnicas concretas (encuadre/fondo/luz/intención).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Foto profesional vs casual». \textbf{Formato:} tabla de 5 columnas (Foto | Encuadre | Fondo | Luz | Qué transmite), 6 filas (3 profesionales + 3 casuales). \textbf{Sabes que terminaste cuando} cada celda nombra una decisión técnica concreta (no ``se ve mejor''), y al final puedes resumir en 2 renglones qué diferencia visual hace la categoría ``profesional''.
sistematizacion:
  intro: |-
    Toda imagen profesional sigue 4 decisiones técnicas. Vamos a descomponerlas con los pilares del pensamiento computacional para que puedas hacer las tuyas con criterio y un celular.
  pilares:
  - |-
    \textbf{Descomposición.} Una imagen profesional se descompone en 4 decisiones técnicas que se toman antes de disparar: (1) \textbf{encuadre} (plano medio para retrato, plano general para ambiente, primer plano para detalle); (2) \textbf{fondo} (limpio o intencionalmente narrativo, nunca distractor --- una pared blanca o tu lugar de trabajo, no un cuarto desordenado); (3) \textbf{luz} (natural frontal o lateral suave mejor que flash, evitar contraluces fuertes que oscurecen la cara); (4) \textbf{intención} (sabes exactamente qué transmitir antes de levantar el celular). Si una de las 4 falla, la foto falla aunque las otras 3 estén bien.
  - |-
    \textbf{Reconocimiento de patrones.} Toda imagen profesional sigue patrones repetibles que la fotografía heredó del retrato clásico: la \textbf{regla de los tercios} (divide mentalmente la imagen en 9 partes con líneas imaginarias y pon el sujeto en una de las líneas; el centro exacto se siente plano, la línea se siente equilibrado), el \textbf{plano americano} (de la cintura para arriba, mirada al lente o a 45°), y la \textbf{luz natural} de la mañana o la tarde (la del mediodía aplasta los rasgos). Estos patrones tienen 100 años; no los inventes, aplícalos.
  - |-
    \textbf{Abstracción.} Lo esencial de tu imagen cabe en una pregunta: \emph{¿qué dirá esta foto si la ve alguien que no me conoce, en 3 segundos?}. Si la respuesta es ``algo cualquiera'' o ``no sé'', todavía no abstrajiste tu propuesta visual. Si la respuesta es ``esta persona enseña algo'', ``esta persona escribe'', ``esta persona trabaja con sus manos'', vas bien. La foto profesional es información, no decoración.
  - |-
    \textbf{Algoritmo.} (1) Decide qué quieres comunicar antes de levantar el celular (oficio, ambiente, acción --- escoge uno); (2) elige fondo limpio y hora con luz natural (mañana o atardecer); (3) usa el temporizador del celular (no selfie con brazo extendido --- distorsiona la cara); (4) pide a un compañero que tome las fotos o usa trípode improvisado; (5) toma 20 o más fotos por cada categoría --- la diferencia entre amateur y profesional es la cantidad de tomas que descartas, no la cámara; (6) descarta el 95\% y queda solo con las 3 mejores.
  anatomia:
    titulo: Anatomía de una foto profesional con celular
    body: |-
      \textbf{Retrato (perfil):} plano medio, mirada al lente o a 45°, fondo limpio, luz natural lateral. \\[1mm] \textbf{Ambiente:} plano más abierto que muestra dónde trabajas, sujeto a un tercio del encuadre. \\[1mm] \textbf{Acción:} foto tomada \emph{mientras} haces tu oficio (no posada), con un objeto característico. \\[1mm] \textbf{Edición:} ajustes mínimos (exposición + contraste). Sin filtros agresivos. Sin filtros de cara.
  errores_comunes: |-
    (1) Selfie con brazo extendido: la distorsión de la lente gran-angular hace ver mal hasta a un modelo profesional. (2) Fondos caóticos (cuarto desordenado, mucha gente, ropa colgando): pierdes el foco visual y la mirada del espectador se distrae. (3) Filtros agresivos (saturación alta, ``glamour'', ``vintage''): rompen la coherencia con cualquier marca seria y envejecen mal --- en 5 años se verán claramente fechados. (4) Tomar una sola foto: nunca sabrás si pudiste hacerlo mejor; siempre hay variación entre toma y toma. (5) Olvidar el ojo: en retrato, los ojos deben estar nítidos antes que cualquier otra parte; si están borrosos, la foto se descarta.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Análisis de 3 imágenes que admiro». \textbf{Formato:} 3 fichas, una por foto, cada una con: (a) descripción de la foto en 1 frase, (b) las 4 decisiones técnicas (encuadre/fondo/luz/intención), (c) qué transmite. \textbf{Sabes que terminaste cuando} las 3 fichas tienen las 4 decisiones identificadas con precisión, no con generalidades.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tus 3 fotos + 1 video corto} (40 min · individual o con un compañero que tome las fotos). Hora de producir. Vas a generar 3 fotos (retrato + ambiente + acción) y 1 video de presentación de máximo 60 segundos --- con celular, sin presupuesto, con criterio.
  pilares:
  - |-
    \textbf{Descomposición.} Tu sesión se descompone en 4 piezas con propósito distinto: \textbf{retrato} (perfil, plano medio, mirada al lente, transmite quién eres), \textbf{ambiente} (plano más abierto que muestra dónde trabajas, transmite contexto), \textbf{acción} (foto tomada mientras haces tu oficio, no posada, transmite competencia), \textbf{video corto} de 30-60 segundos (transmite voz, presencia y energía). Cada pieza juega un rol en la marca completa; juntas, forman tu imagen profesional.
  - |-
    \textbf{Patrones.} Sigue el patrón \textbf{``20 fotos por foto final''}: nunca te quedes con la primera toma. La diferencia entre amateur y profesional no es la cámara ni el presupuesto: es la cantidad de tomas que descartas. Los fotógrafos de National Geographic descartan 99 por cada 1 que publican. Tú no necesitas tanto, pero 1/20 es mínimo. La selección final pesa más que la captura.
  - |-
    \textbf{Abstracción.} Cada foto comunica una sola idea sobre ti. Si tu retrato muestra ``soy serio'' y tu video dice ``soy divertido'', la marca pierde coherencia y el visitante se confunde sobre qué esperar. Decide \emph{antes} qué quieres transmitir y mantén esa decisión en las 4 piezas. La coherencia se siente; la incoherencia se nota inmediatamente, aunque no se sepa nombrar por qué.
  - |-
    \textbf{Algoritmo.} (1) Elige lugar y hora con luz natural (mañana o atardecer; nunca mediodía); (2) pide a un compañero que tome las fotos o usa el temporizador del celular con trípode improvisado; (3) toma 20 o más fotos por cada una de las 3 categorías; (4) graba 5 takes del video de 60 segundos máximo, queda con 1; (5) edición mínima en el celular (exposición + contraste, nada de filtros agresivos); (6) sube las 4 piezas a tu sitio o portafolio en una sola sesión.
  checklist:
    titulo: Checklist antes de cerrar la sesión de fotos
    items: |-
      \checkbox 3 fotos finales seleccionadas (retrato + ambiente + acción). \\[1mm] \checkbox 1 video de presentación de 30-60 segundos, audio limpio. \\[1mm] \checkbox Cero fotos con brazo extendido (selfie clásica). \\[1mm] \checkbox Fondos limpios o intencionalmente narrativos. \\[1mm] \checkbox Edición mínima, sin filtros de cara ni colores agresivos. \\[1mm] \checkbox Coherente con tu sistema visual (paleta, tono) de la Guía 2.
  plantilla_guion: |-
    \textbf{Retrato.} \textit{Descripción breve + decisiones técnicas usadas + URL/captura.} \\[1mm] \textbf{Ambiente.} \textit{Lo mismo.} \\[1mm] \textbf{Acción.} \textit{Lo mismo.} \\[1mm] \textbf{Video (60 s).} \textit{Guion de 3 ideas + URL del video subido.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi imagen de marca · v1». \textbf{Formato:} ficha por cada uno de los 4 entregables (3 fotos + 1 video) con descripción y URL/captura. \textbf{Extensión:} una página de cuaderno. \textbf{Sabes que terminaste cuando} un extraño que mira los 4 entregables puede decir, en 1 frase, qué haces y cómo te ves haciéndolo.
  producto_titulo: 3 fotos profesionales + 1 video corto coherentes con tu marca
  criterios:
  - Las 3 fotos tienen propósito distinto (retrato / ambiente / acción)
  - Cero selfies con brazo extendido o filtros de cara
  - El video tiene audio limpio y mensaje claro en máximo 60 segundos
  - Las 4 piezas son coherentes con tu sistema visual (paleta, tono) de la Guía 2
  - Un extraño puede entender qué haces en 3 segundos de mirada
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: La belleza estética nace donde una voz silenciada encuentra forma.
    aplicacion: |-
      Las fotos de moda en redes responden a un canon visual del norte global (luminosidad alta, fondos minimalistas, sonrisa estandarizada). Tu imagen propia puede repetir ese canon o atreverse a la dignidad del retrato latinoamericano: el color del Valle en tu ropa, el contexto real de tu lugar, una mirada que no necesita aprobación. La descolonización empieza por la fotografía propia.
    pregunta_espejo: |-
      ¿Mi imagen propia repite el canon global o se atreve a mostrar mi lugar? ¿Qué de mi contexto invisibilizo cuando elijo el fondo?
  estoico:
    autor: Epicteto
    cita: No nos perturban las cosas, sino las opiniones que tenemos de ellas.
    aplicacion: |-
      La trampa con la imagen propia es buscar la aprobación de los demás (likes, comentarios, comparación). Eso no depende de ti. Lo que sí depende: la decisión de transmitir dignidad y oficio, no caza de likes. Una foto que tú puedes defender es más valiosa que una con 1000 likes que no representa quién eres.
    pregunta_espejo: |-
      ¿Estoy tomando esta foto para mí o para perseguir la aprobación de otros? ¿Puedo defenderla en 5 años como representativa de quien era?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Cada imagen publicada se vuelve dato en la infoesfera; cuídala como cuidarías un legado.
    aplicacion: |-
      Tu imagen profesional, una vez publicada, alimenta sistemas de reconocimiento facial, archivos del futuro, búsquedas inversas. Es información de tu identidad biométrica. Floridi nos pediría preguntarnos: ¿qué pasa con esta imagen cuando tenga 40 años? ¿qué legado dejo en la infoesfera?
    pregunta_espejo: |-
      ¿Esta imagen va a envejecer bien? Si dentro de 10 años un sistema la encuentra, ¿me representará? ¿Mis decisiones de hoy honran a mi yo futuro?
compromiso: |-
  \textbf{Para la próxima semana.} Cambia tu foto de perfil en WhatsApp, Instagram, correo institucional y LinkedIn por tu nuevo retrato. Anota durante 3 días si te dicen algo distinto las personas con las que interactúas. Esa respuesta te dice si tu imagen funciona o necesita ajuste. El próximo lunes traes las observaciones.
web:
  resumen: |-
    Produces 3 fotos profesionales (retrato, ambiente, acción) + 1 video corto de presentación con celular y criterio. Sin presupuesto, sin sesión de estudio.
  subtema: Presencia y marca digital · Foto y video propios
  pre_lectura:
    por_que_importa: |-
      Hoy tu marca necesita imagen propia en formato digital: foto de perfil, foto de ambiente y video corto. En redes y perfiles, esa pieza visual habla por ti antes que tu texto. Quien te ve decide en menos de 3 segundos si quiere leerte.
    pregunta_detonante: |-
      Si dejaras tu foto actual de perfil sin texto al lado, ¿qué entendería un extraño de ti en 3 segundos? ¿Coincide con quien quieres ser profesionalmente?
    activacion:
      titulo: El test de los 3 segundos
      descripcion: |-
        En 3 minutos, abre tu perfil de Instagram y de WhatsApp. Mira tu foto actual como si la vieras por primera vez. Escribe en una hoja qué te transmite — sin pensar mucho. Esa primera impresión es lo que un futuro empleador o cliente ve.
      duracion_min: 4
    conexion:
      anterior: "En la sesión 6 optimizaste tu sitio para SEO básico: Google ya sabe qué ofreces."
      siguiente: En la sesión 8 producirás contenido para redes — piezas promocionales coherentes con tu marca.
  conceptos_clave:
    - termino: Encuadre
      definicion: |-
        Decisión de qué cabe en la foto y qué queda fuera. Plano medio para retrato, plano abierto para ambiente, plano cerrado para acción.
      ejemplo: |-
        Para tu retrato: del pecho hacia arriba. Para tu ambiente: te ves entero con tu lugar de trabajo. No mezcles los dos.
      emoji: "🎞"
    - termino: Fondo
      definicion: |-
        Lo que aparece detrás del sujeto. Limpio o intencionalmente narrativo, nunca distractor. Un cuarto desordenado mata cualquier retrato.
      ejemplo: |-
        Una pared lisa de color de tu paleta + iluminación natural lateral = retrato pro. Una cocina con platos sucios atrás = ruido.
      emoji: "🖼"
    - termino: Luz natural lateral
      definicion: |-
        La mejor luz para foto sin presupuesto: cerca de una ventana, con el sol entrando de lado. Evita flash directo y contraluces fuertes.
      ejemplo: |-
        A las 8 AM o 5 PM, párate con la ventana a tu izquierda o derecha. Esa luz "suave" hace ver bien a cualquier persona.
      emoji: "💡"
    - termino: Regla de los tercios
      definicion: |-
        Divide mentalmente la imagen en 9 partes (3×3). Pon el sujeto en una de las 4 líneas, no en el centro exacto. El centro se siente plano; la línea, equilibrado.
      ejemplo: |-
        En la cámara del celular activa la cuadrícula y alinea tus ojos con la línea superior. Tu rostro queda en la zona fuerte.
      emoji: "📐"
    - termino: 20 tomas por foto final
      definicion: |-
        La diferencia entre amateur y profesional no es la cámara: es la cantidad de tomas que descartas. Toma 20 por cada foto final.
      ejemplo: |-
        Para tu retrato pro: usa temporizador del celular, toma 20-30, luego selecciona LA que mejor te representa. El descarte es la técnica.
      emoji: "📸"
    - termino: Coherencia con sistema visual
      definicion: |-
        Tu foto debe convivir con tu paleta y tu tipografía (Guía 2). Si tu marca es serena, no salgas con filtros saturados ni edición agresiva.
      ejemplo: |-
        Si tu paleta es verde + crema, evita una foto con fondo rojo intenso. La incoherencia rompe la marca completa.
      emoji: "🎨"
  quiz:
    titulo: "✅ Verifica las decisiones técnicas"
    instrucciones: |-
      5 preguntas para confirmar que dominas las decisiones de imagen profesional antes de avanzar. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Cuál es la mejor luz para foto de retrato con celular y sin presupuesto?
        opciones:
          - Flash directo del celular
          - Luz natural lateral cerca de una ventana
          - Sol directo del mediodía
          - Solo luz artificial blanca
        respuesta_index: 1
        feedback_correcto: Correcto. Luz natural lateral, 8-10 AM o 4-6 PM. Suave, halagadora, gratis.
        feedback_incorrecto: |-
          Luz natural lateral. El flash directo aplana, el sol del mediodía endurece sombras. La ventana a tu lado es tu mejor aliada.
      - enunciado: ¿Por qué se evita la selfie con brazo extendido para foto profesional?
        opciones:
          - Porque cansa el brazo
          - Porque la distancia corta del lente distorsiona el rostro
          - Porque consume batería
          - Porque es ilegal en algunos países
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La distancia corta del lente distorsiona — nariz grande, cara ancha. Temporizador + apoyo es la solución sin presupuesto.
        feedback_incorrecto: |-
          La selfie con brazo distorsiona el rostro: nariz más grande, frente ancha. Usa temporizador apoyando el celular.
      - enunciado: ¿Qué es la regla de los tercios?
        opciones:
          - Tomar 3 fotos seguidas
          - Dividir la imagen en 9 partes y poner el sujeto en una de las líneas
          - Editar con 3 filtros
          - Imprimir en 3 tamaños
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Divide en 3×3 y alinea al sujeto con una línea. Activa la cuadrícula del celular y aplícalo.
        feedback_incorrecto: |-
          Regla de los tercios: divide en 9 partes y alinea el sujeto con una línea. El centro exacto se siente plano.
      - enunciado: ¿Cuántas tomas debes hacer por cada foto final?
        opciones:
          - 1 — la primera
          - "5"
          - 20 o más
          - "100"
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. La técnica está en el descarte. Toma 20+, queda con la mejor. La cámara no te hace pro — el ojo crítico sí.
        feedback_incorrecto: 20+ tomas por foto final. La diferencia amateur vs pro no es la cámara — es cuántas descartas.
      - enunciado: En el saber del retrato del oficio, ¿qué aplica a tu foto profesional hoy?
        opciones:
          - Nada — los retratos antiguos eran de pintura
          - "Mostrar el oficio con dignidad: quién hace qué, dónde, con qué orgullo"
          - Que solo los adultos podían retratarse
          - Que las fotos eran caras
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El retrato del oficio mostraba dignidad y competencia antes de palabras. Tu foto profesional 2026 hace lo mismo.
        feedback_incorrecto: |-
          El retrato del oficio comunicaba quién, qué y con qué orgullo. Tu foto profesional sigue ese principio en formato digital.
  post_lectura:
    transferencia: |-
      Esta semana cambia tu foto de perfil en WhatsApp, Instagram, correo institucional y LinkedIn por tu nuevo retrato. Durante 3 días anota si las personas con las que interactúas te dicen algo distinto. Esa respuesta te dice si tu imagen funciona o necesita ajuste. El próximo lunes traes las observaciones al aula.
  cinco_dimensiones:
    personal: Tomaste el control de tu imagen pública — del retrato improvisado al retrato con criterio.
    emocional: |-
      Resististe la tentación de la selfie fácil y la búsqueda de likes — elegiste la dignidad del retrato del oficio.
    ciudadana: Tu imagen pública es un dato en la infoesfera — la cuidaste como cuidarías un legado.
    local: |-
      Anclaste tu retrato en tu lugar real (Cartago, Valle) en vez de imitar el canon visual del norte global.
    intergeneracional: |-
      Heredaste la tradición del retrato del oficio y la actualizaste con celular — el principio sobrevive.

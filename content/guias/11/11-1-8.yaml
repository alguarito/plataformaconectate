grado: 11
periodo: 1
sesion: 8
completo: true
titulo: Perfiles profesionales --- LinkedIn y portafolio coherentes
titulo_portada: |-
  Perfiles profesionales ---
  LinkedIn y portafolio
  coherentes
producto_final: Perfil de LinkedIn completo + portafolio mínimo (3 piezas) enlazado al sitio
apertura:
  saber_ancestral: |-
    En el Valle, el Pacífico y los pueblos andinos, las \textbf{``señas''} de identidad abrían o cerraban puertas en segundos. Tu apellido (``los Cárdenas''), tu oficio (``soy hijo del herrero''), tu procedencia (``vengo del Cauca''), tu padrino o tu maestro. Bastaba una conversación de 30 segundos en la plaza para que te ubicaran social y profesionalmente. Las señas eran el \emph{handshake} tradicional: confianza basada en red verificada.
  saber_contemporaneo: |-
    Hoy ese \emph{handshake} sucede en \textbf{LinkedIn} y en tu \textbf{portafolio público}. Tu foto, tu titular, tu sección ``acerca'', tus experiencias, tus recomendaciones --- todo eso compone tus señas digitales. Cada elemento suma o resta credibilidad. Un perfil incompleto cierra puertas que un perfil sólido abre en segundos.
  pregunta_puente: |-
    ¿Qué hacían las ``señas'' tradicionales que abrían puertas profesionales en segundos? ¿Qué se conserva, qué cambia, en la versión digital?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} 3 perfiles profesionales que admiras y extraer su patrón; (2) \textbf{explicar} qué hace coherentes (o no) los elementos de un perfil; (3) \textbf{crear} tu perfil LinkedIn + portafolio mínimo; (4) \textbf{evaluar} el perfil de un compañero con criterios.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hoy le das forma a tu \emph{handshake digital} --- el primer contacto profesional con quien no te conoce todavía.
  a_escuta: |-
    Antes de armar tu propio LinkedIn, vas a leer otros. Detrás de cada perfil que transmite seriedad hay decisiones coherentes; detrás de los confusos, improvisación.
  a_sistematizacion: |-
    Ya viste 3 perfiles fuertes. Ahora vamos a entender los \textbf{6 elementos} que tiene todo perfil profesional sólido: foto, titular, sobre mí, experiencia, destacado, recomendaciones.
  a_praxis: |-
    Tienes el patrón. Toca aplicarlo a \emph{tu} perfil: foto profesional (de la Guía 7), titular con propuesta de valor (de la Guía 1), texto coherente con tu voz (de la Guía 5). Todo lo que has construido converge aquí.
  a_producto: |-
    Lo que sigue es el resumen de \emph{qué} entregas hoy. El criterio principal: que tu LinkedIn y tu portafolio cuenten la misma historia, con la misma voz, sin inflar ni desmerecer.
  a_evaluacion: |-
    Antes de cerrar, mira tu identidad profesional digital desde las cinco dimensiones humanas. LinkedIn parece técnico pero toca temas profundos de clase, acceso, autenticidad.
  a_triangulo: |-
    Y para terminar, tres voces sobre la presencia profesional. Dussel sobre quién está en LinkedIn y quién no, Séneca sobre el tiempo y la reputación, Floridi sobre la identidad como capital reputacional.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 3 perfiles que admiras} (15 min · individual). En LinkedIn busca \textbf{3 personas} cuyo perfil te transmita seriedad y competencia (no necesariamente famosas; profesionales con 3-10 años de carrera). Para cada perfil: ¿cómo es la foto? ¿qué dice su titular? ¿qué tono usa su ``Acerca de''? ¿qué destaca?
  checks:
  - Encontré 3 perfiles distintos en mi área de interés.
  - |-
    Observé los 6 elementos clave (foto/titular/sobre/experiencia/destacado/recomendaciones).
  - Anoté qué tienen en común y qué los diferencia.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 3 perfiles profesionales que admiro». \textbf{Formato:} 3 fichas, una por perfil, con los 6 elementos clave + una columna ``qué transmite''. Al final 1 párrafo de 4 renglones con el patrón común. \textbf{Sabes que terminaste cuando} los 6 elementos están analizados en cada perfil con observaciones específicas (no ``buena foto'').
sistematizacion:
  intro: |-
    Todo perfil profesional sólido se compone de 6 elementos coherentes entre sí. Vamos a descomponerlos con los pilares del pensamiento computacional para que tu perfil sostenga la promesa que tu marca hace.
  pilares:
  - |-
    \textbf{Descomposición.} Tu perfil se descompone en 6 elementos, cada uno con función específica: (1) \textbf{foto profesional} (de la Guía 7, retrato no selfie); (2) \textbf{titular} (no tu cargo formal, sino tu propuesta de valor de la Guía 1, 220 caracteres máximo); (3) \textbf{sobre mí} (3 párrafos coescritos con IA como en la Guía 5, sin clichés); (4) \textbf{experiencia} (cargos + logros medibles, no descripción de tareas); (5) \textbf{destacado} (3 piezas tangibles de portafolio --- tu sitio de la Guía 4 califica); (6) \textbf{recomendaciones} (1-2 de profesores, mentores o colegas que confirmen tu historia). Sin alguno de los 6, el perfil se siente incompleto.
  - |-
    \textbf{Patrones.} Todo perfil fuerte sigue el patrón \textbf{``coherencia transversal''}: lo que dice tu titular se sostiene en tu sobre mí, se demuestra en tu experiencia, se evidencia en tu destacado, y otros lo confirman en tus recomendaciones. Es el principio del ``cinco caras dicen lo mismo''. Si los 6 elementos cuentan historias distintas (titular dice ``creativo'', experiencia dice ``analítico''), la marca se rompe y el reclutador automático pasa de largo en 7 segundos.
  - |-
    \textbf{Abstracción.} Lo esencial de tu perfil cabe en una pregunta: \emph{¿después de leer mis 6 elementos, alguien sabe quién soy, qué hago y por qué confiar en mí?}. Si después de leer tu perfil esa persona todavía duda, falta coherencia. El test definitivo: pídele a un compañero que lea tu perfil 30 segundos y luego cierre la pestaña; si puede decirte qué haces en una frase, está bien hecho.
  - |-
    \textbf{Algoritmo.} (1) Sube tu foto de retrato profesional (Guía 7); (2) escribe titular con tu propuesta de valor de la Guía 1, 220 caracteres máximo; (3) pega tu ``sobre mí'' coescrito con IA (Guía 5) en el campo ``Acerca de''; (4) llena 1-3 experiencias con logros concretos y medibles (``aumenté X en Y\%'', no ``trabajé en X''); (5) sube 3 piezas a Destacado --- puede ser tu sitio de la Guía 4 más 2 proyectos académicos; (6) escribe a 2 docentes o mentores pidiendo recomendación específica (1 párrafo cada uno, no ``escribe lo que quieras''); (7) publica tu primer post anunciando tu sitio.
  anatomia:
    titulo: Anatomía de un perfil profesional coherente
    body: |-
      \textbf{Foto:} retrato profesional, no selfie de fiesta. \\[1mm] \textbf{Titular (220 caracteres):} ``Tu propuesta de valor'' --- no tu cargo. \\[1mm] \textbf{Sobre mí:} tu voz coescrita de la Guía 5, sin clichés. \\[1mm] \textbf{Experiencia:} cada cargo con 3 logros medibles, no descripción de tareas. \\[1mm] \textbf{Destacado:} 3 piezas tangibles (sitio, portafolio, proyecto). \\[1mm] \textbf{Recomendaciones:} 1-2 voces externas que confirmen lo anterior.
  errores_comunes: |-
    (1) Titular tipo cargo (``Estudiante de 11°'', ``Buscando oportunidades''): cierra puertas porque no comunica valor; mejor: tu propuesta de valor de la Guía 1. (2) Sobre mí lleno de clichés (``apasionado por aprender'', ``creativo y proactivo''): se nota a kilómetros que es texto IA sin revisar o copy de plantilla. (3) Experiencia sin logros concretos: solo tareas sin resultados (``responsable de redes sociales'' vs ``aumenté el alcance del grupo de 200 a 800 seguidores en 3 meses''). (4) Sin recomendaciones: tu propio perfil no se valida solo, necesita voces externas que confirmen. (5) Foto inadecuada (selfie de fiesta, filtro agresivo): contradice la formalidad profesional y cierra puertas antes de que el reclutador lea una palabra.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Los 6 elementos de mi perfil». \textbf{Formato:} 6 fichas, una por elemento, cada una con: definición (1 frase tuya), error común a evitar, ejemplo de cómo lo aplicarás a tu propio LinkedIn. \textbf{Sabes que terminaste cuando} cada ficha tiene tu propio ejemplo específico, no plantilla genérica.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu perfil de LinkedIn + portafolio mínimo} (40 min · individual). Hora de armar tu \emph{handshake digital}. Vas a configurar los 6 elementos de tu perfil con todo lo que ya tienes de las guías anteriores: foto, propuesta de valor, voz, sitio. Todo converge aquí.
  pilares:
  - |-
    \textbf{Descomposición.} Tu sesión se descompone en 6 pasos --- uno por elemento del perfil. No hagas todo de una vez en bloque caótico: avanza por orden (foto → titular → sobre mí → experiencia → destacado → recomendaciones), revisando cada elemento antes de pasar al siguiente. Esta disciplina pequeña diferencia un perfil ordenado de uno improvisado, y los reclutadores lo notan.
  - |-
    \textbf{Patrones.} Sigue el patrón \textbf{``crea hoy, refina mañana''}: tu primer perfil no será perfecto, y eso está bien. Lo importante es que esté completo y coherente; ya lo refinarás con feedback en las semanas siguientes. El error opuesto (esperar a tenerlo perfecto para abrirlo) es lo que mantiene al 80\% de los estudiantes sin perfil cuando salen al mercado laboral. Empezar imperfecto vence a esperar perfecto.
  - |-
    \textbf{Abstracción.} Cada elemento expresa una sola idea de ti. Si tu titular dice ``diseñador'' y tu sobre mí lo contradice diciendo ``ingeniero en formación'', tienes 2 marcas en un solo perfil --- eliges una y ajustas el otro. La coherencia se construye eligiendo qué dejar afuera, no agregando más cosas. Un perfil con 3 áreas distintas es un perfil con 0 marca clara.
  - |-
    \textbf{Algoritmo.} (1) Entra a LinkedIn o crea cuenta con tu correo institucional; (2) sube foto + titular + sobre mí (15 min); (3) llena 1-3 experiencias con logros concretos y medibles (10 min); (4) sube destacado con enlace a tu sitio de la Guía 4 (5 min); (5) escribe a 2 docentes pidiendo recomendación específica (5 min); (6) publica tu primer post anunciando tu sitio (5 min); (7) revisa el perfil en pestaña incógnita para ver qué muestra a quien no está logueado.
  checklist:
    titulo: Checklist antes de declarar el perfil publicado
    items: |-
      \checkbox Foto profesional subida (no selfie). \\[1mm] \checkbox Titular con tu propuesta de valor (no ``estudiante''). \\[1mm] \checkbox Sobre mí coescrito de la Guía 5, sin clichés. \\[1mm] \checkbox 1-3 experiencias con logros concretos, no tareas. \\[1mm] \checkbox 3 piezas en Destacado, incluyendo tu sitio. \\[1mm] \checkbox 2 solicitudes de recomendación enviadas a docentes/mentores.
  plantilla_guion: |-
    \textbf{Mi titular final.} \textit{220 caracteres máximo, mi propuesta de valor.} \\[1mm] \textbf{Mi sobre mí.} \textit{3 párrafos coescritos de la Guía 5.} \\[1mm] \textbf{Mis 3 logros principales.} \textit{Uno por experiencia, medible.} \\[1mm] \textbf{Mi destacado.} \textit{3 piezas con URL.} \\[1mm] \textbf{Recomendaciones pendientes.} \textit{2 nombres + fechas de envío.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi perfil LinkedIn · v1». \textbf{Formato:} 6 secciones con el contenido final de cada elemento + URL pública de tu perfil. \textbf{Extensión:} una página de cuaderno. \textbf{Sabes que terminaste cuando} alguien que abre tu URL entiende en 30 segundos qué haces y siente coherencia entre los 6 elementos.
  producto_titulo: Perfil LinkedIn completo + portafolio mínimo enlazado al sitio
  criterios:
  - URL pública del perfil accesible para quien no esté logueado
  - Los 6 elementos están presentes y completos (no ``estudiante'' como titular)
  - |-
    Coherencia transversal: foto + titular + sobre mí + experiencia se sostienen entre sí
  - Mínimo 3 piezas en Destacado, incluyendo el sitio de la Guía 4
  - 2 solicitudes de recomendación enviadas (aunque aún no se hayan recibido)
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: El sur global piensa desde su propia herida y desde ahí ofrece mundo.
    aplicacion: |-
      LinkedIn fue diseñado por y para profesionales del norte global, con un canon de carrera lineal (universidad → primer empleo → ascenso → MBA). Esa narrativa invisibiliza la realidad latinoamericana: trabajos paralelos, emprendimientos informales, oficios familiares heredados. Tu perfil puede reproducir ese canon o puede romperlo nombrando con orgullo lo que en otro lugar ocultarían.
    pregunta_espejo: |-
      ¿Mi perfil reproduce un modelo de carrera del norte o reconoce mi historia real del Valle? ¿Qué de mi vida estoy borrando para encajar?
  estoico:
    autor: Séneca
    cita: Mientras esperamos vivir, la vida pasa.
    aplicacion: |-
      El error más común con LinkedIn en grado 11 es esperar a tener ``algo que mostrar'' para abrirse el perfil. La reputación profesional se construye con tiempo --- empezar hoy con un perfil honesto y sencillo es ganar 2 años contra quien espera a graduarse para abrirlo.
    pregunta_espejo: |-
      ¿Estoy postergando construir mi reputación profesional digital esperando un momento ideal? ¿Qué pierdo cada mes que paso sin perfil?
  floridi:
    autor: Luciano Floridi
    cita: La identidad profesional digital es capital reputacional en la infoesfera.
    aplicacion: |-
      Tu LinkedIn es activo informacional: aporta señales que otros sistemas (algoritmos de búsqueda, recruiters automáticos, redes de recomendación) usan para ubicarte. Cuanto más coherente y veraz, más valioso es ese capital. Cuanto más inflado, más frágil.
    pregunta_espejo: |-
      ¿Mi perfil construye capital reputacional honesto o capital inflado fácil de derrumbar? ¿Qué de mi perfil puedo defender en 5 años?
compromiso: |-
  \textbf{Para la próxima semana.} Cada día, dedica 10 minutos a interactuar con contenido profesional en LinkedIn (no scrollear; comentar 1 post con criterio y compartir 1 con tu opinión). Esa práctica diaria construye más reputación que un perfil estático impecable. El próximo lunes traes la bitácora de 7 interacciones.

grado: 11
periodo: 1
sesion: 9
completo: true
titulo: Métricas básicas --- quién entra a mi sitio y qué busca
titulo_portada: |-
  Métricas básicas ---
  quién entra a mi sitio
  y qué busca
producto_final: Dashboard de 5 indicadores configurado (Plausible/Umami/GA4) + lectura semanal
apertura:
  saber_ancestral: |-
    El \textbf{conteo de la cosecha} era una práctica seria en el campo: la abuela anotaba en una libreta cuántos racimos de café por mata, cuántas mazorcas por surco, cuántas mantas terminadas por luna, cuántos días llovió. No era vanidad ni estadística académica. Era información para \emph{decidir}: cuánto sembrar el próximo ciclo, a quién pedir ayuda, qué reservar. Sin conteo, no había aprendizaje del oficio.
  saber_contemporaneo: |-
    El conteo digital de tu marca son las \textbf{métricas} de tu sitio: visitas únicas, fuentes (de dónde viene la gente), comportamiento (qué páginas miran), conversión (qué acción toman), tiempo en sitio. Herramientas: Plausible o Umami (privadas, sencillas) o Google Analytics 4 (potente, complejo). El error más común es perseguir likes (vanidad); el oficio digital es leer las \textbf{cinco métricas que sí importan} para decidir.
  pregunta_puente: |-
    ¿Qué hacían los abuelos con los conteos del año anterior que muchos hoy NO hacen con sus métricas digitales? ¿Por qué tener datos no es lo mismo que aprender de ellos?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 5 métricas que sí importan para una marca personal; (2) \textbf{explicar} la diferencia entre métricas de vanidad y métricas de decisión; (3) \textbf{analizar} 1 semana de datos reales de tu sitio; (4) \textbf{evaluar} qué decisión tomarías con esos datos.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hoy le abres los \emph{ojos} a tu marca --- aprendes a leer qué pasa en tu sitio, no por curiosidad sino para decidir mejor.
  a_escuta: |-
    Antes de configurar tu propio dashboard, vas a entender qué \emph{no} es una métrica útil. La diferencia entre vanidad y decisión es la línea que separa al que aprende del que solo cuenta.
  a_sistematizacion: |-
    Ya viste qué es métrica de vanidad. Ahora vamos a entender las \textbf{5 métricas que sí importan} para una marca personal en construcción --- ni más ni menos.
  a_praxis: |-
    Tienes el principio. Toca instalar la herramienta en \emph{tu} sitio y leer la primera semana real de datos. La instalación toma 10 minutos; la lectura, una vida de oficio.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: dashboard configurado + primera lectura semanal escrita. El criterio: que cada dato lleve a una decisión concreta, no solo a un sentimiento.
  a_evaluacion: |-
    Antes de cerrar, mira tus métricas desde las cinco dimensiones humanas. Lo que mides moldea lo que valoras --- y eso tiene consecuencias éticas.
  a_triangulo: |-
    Y para terminar, tres voces sobre las métricas. Dussel sobre lo que no se mide y se invisibiliza, Marco Aurelio sobre la obsesión por las cifras, Floridi sobre tracking y privacidad.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Métricas de vanidad vs métricas de decisión} (15 min · individual). Mira tus 3 redes personales y anota \textbf{6 cifras visibles} (likes, seguidores, vistas, comentarios, comparticiones, tiempo de pantalla). Para cada cifra pregúntate: ¿qué decisión concreta tomé alguna vez basándome en ese número? Si la respuesta es ``ninguna'', es vanidad.
  checks:
  - Anoté 6 cifras visibles de mis redes personales.
  - Identifiqué cuáles han generado alguna decisión real y cuáles no.
  - 'Distinguí mentalmente: vanidad (mira y olvida) vs decisión (mira y actúa).'
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Vanidad vs decisión». \textbf{Formato:} tabla de 3 columnas (Cifra | ¿Genera decisión? Sí / No | Si sí: qué decisión), 6 filas. Al final un párrafo de 3 renglones: ¿qué proporción de tus cifras son vanidad? \textbf{Sabes que terminaste cuando} reconoces honestamente cuántas cifras miras y nunca decides nada con ellas.
sistematizacion:
  intro: |-
    Una marca personal en construcción necesita exactamente \textbf{5 métricas}. Más es ruido; menos es ceguera. Vamos a descomponerlas con los pilares del pensamiento computacional.
  pilares:
  - |-
    \textbf{Descomposición.} Las 5 métricas se descomponen así, cada una respondiendo una pregunta distinta: (1) \textbf{visitas únicas} (cuántas personas distintas entraron en la semana --- volumen real); (2) \textbf{fuentes} (de dónde vinieron --- Google, redes, directo, otros sitios; te dice qué canal funciona); (3) \textbf{páginas más vistas} (qué les interesó realmente --- a veces no es lo que tú esperabas); (4) \textbf{tiempo promedio en sitio} (si se quedan o rebotan a los 3 segundos --- mide calidad de contenido); (5) \textbf{conversiones} (cuántos tomaron la acción que quieres --- contactar, suscribirse, descargar). Las 5 juntas componen el dashboard mínimo.
  - |-
    \textbf{Reconocimiento de patrones.} Toda métrica útil sigue el patrón \textbf{``observa-decide''}: una cifra que no lleva a una decisión es vanidad disfrazada de información. Antes de mirar la métrica, pregúntate: \emph{¿qué haría diferente si esta cifra fuera el doble o la mitad?}. Si la respuesta es ``nada'', no la mires. Es el filtro que separa al estudiante que aprende con datos del que se obsesiona con likes. La diferencia: el aprendiz pregunta ``¿qué haré distinto?''; el adicto al feed pregunta ``¿cuánto subió?''.
  - |-
    \textbf{Abstracción.} Lo esencial del análisis cabe en una pregunta: \emph{¿esta cifra confirma o desafía mi hipótesis sobre quién visita mi sitio y por qué?}. Si solo confirma, no aprendes nada nuevo (solo te sientes bien). Si desafía, ajustas tu hipótesis --- ahí está el aprendizaje. Las métricas que más enseñan son las que te sorprenden. Si nunca te sorprenden, probablemente no estás midiendo lo que importa.
  - |-
    \textbf{Algoritmo.} Pasos semanales: (1) lunes 7 PM, abrir el dashboard; (2) anotar las 5 cifras de la semana en el cuaderno; (3) compararlas con la semana anterior (no en absoluto, sino en tendencia: \texttt{+}, \texttt{-}, \texttt{=}); (4) identificar una sorpresa (algo que no esperabas); (5) escribir 1 decisión concreta y accionable que tomarás esta semana basada en esos datos; (6) cerrar el dashboard hasta el próximo lunes --- la disciplina semanal vence al refresh diario.
  anatomia:
    titulo: Anatomía de un dashboard de 5 indicadores
    body: |-
      \textbf{Visitas únicas:} ¿creció o decreció vs la semana pasada? \\[1mm] \textbf{Fuentes:} ¿qué porcentaje viene de Google? ¿de redes? \\[1mm] \textbf{Páginas más vistas:} ¿coinciden con las que tú considerabas más importantes? \\[1mm] \textbf{Tiempo en sitio:} ¿menos de 30 s = rebote? ¿más de 2 min = lectura real? \\[1mm] \textbf{Conversiones:} ¿cuántos tomaron la acción esperada (clic en email, envío de formulario, descarga)?
  errores_comunes: |-
    (1) Mirar el dashboard todos los días: ruido sin señal --- la variación diaria no informa nada, una vez por semana es suficiente y saludable. (2) Comparar con cifras absolutas en lugar de tendencias: 30 visitas en una semana no dicen nada sin contexto comparativo; mejor ``creció 20\% respecto a la anterior''. (3) Configurar GA4 sin entender qué métricas usar: te metes en un bosque de 200 informes y no aprendes a leer ninguno. (4) Tracking invasivo sin consentimiento: legal (RGPD, Ley colombiana de datos) y éticamente problemático --- usa Plausible o Umami que respetan privacidad por diseño. (5) Confundir métricas de vanidad (likes, seguidores) con métricas de marca (visitas reales, tiempo en sitio, conversiones a contacto): las primeras son sociales, las segundas son profesionales.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Las 5 métricas que sí importan». \textbf{Formato:} 5 fichas, una por métrica, cada una con: qué mide (1 frase) + qué decisión te llevaría a tomar (ejemplo concreto). \textbf{Sabes que terminaste cuando} para cada métrica tienes anticipada al menos UNA decisión específica que tomarías si esa cifra subiera o bajara.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA --- Tu primera semana de datos reales} (35 min · individual). Instala Plausible, Umami o GA4 en tu sitio (10 min) y, si ya hace una semana que tu sitio está vivo, lee los datos reales. Si no, deja la instalación lista y vuelve la próxima semana con datos para analizar.
  pilares:
  - |-
    \textbf{Descomposición.} Tu instalación se descompone en pasos atómicos y secuenciales: (1) crear cuenta en la herramienta elegida (Plausible o Umami son las más simples; GA4 es la más completa pero compleja); (2) copiar el script de tracking que la herramienta te da; (3) pegarlo en el \texttt{<head>} de tu sitio (\texttt{index.html} o template del CMS); (4) hacer commit y push para desplegar; (5) verificar que la herramienta empieza a registrar visitas (visita tu propio sitio desde otro dispositivo o pestaña incógnita).
  - |-
    \textbf{Patrones.} Sigue el patrón \textbf{``privacy first''}: usa Plausible o Umami antes que Google Analytics 4 si te importa respetar a tus visitantes. Son herramientas \emph{sin cookies}, \emph{sin tracking transversal}, agregadas y anonimizadas por diseño. Más simples, más éticas, alineadas con la ley colombiana de protección de datos y con el RGPD europeo. GA4 es más potente pero exige banner de cookies y política de privacidad.
  - |-
    \textbf{Abstracción.} Cada lectura semanal de datos expresa una sola pregunta: \emph{¿qué decisión concreta tomo esta semana basada en estos datos?}. Si miras tus métricas y no salen decisiones, las miraste mal o todavía no hay suficiente data (mínimo 2 semanas para tener tendencia legible). Los datos sin decisiones son entretenimiento; las decisiones sin datos son intuición. La intersección de ambos es oficio.
  - |-
    \textbf{Algoritmo.} Lectura semanal en 15 minutos los lunes: (1) abrir dashboard; (2) anotar las 5 cifras en el cuaderno (no en una hoja suelta que se pierda); (3) comparar con semana anterior en tendencia (\texttt{+}, \texttt{-}, \texttt{=}); (4) identificar 1 sorpresa (algo que no esperabas); (5) escribir 1 decisión concreta y accionable para la próxima semana; (6) cerrar el dashboard hasta el próximo lunes --- nada de chequeos diarios.
  checklist:
    titulo: Checklist antes de cerrar el dashboard
    items: |-
      \checkbox Herramienta instalada (Plausible / Umami / GA4) en tu sitio. \\[1mm] \checkbox Script de tracking pegado en \texttt{<head>} y commitado. \\[1mm] \checkbox Las 5 métricas configuradas y visibles en el dashboard. \\[1mm] \checkbox Política de privacidad publicada si recolectas datos personales. \\[1mm] \checkbox Primera lectura semanal escrita en cuaderno (mínimo 1 decisión extraída).
  plantilla_guion: |-
    \textbf{Herramienta elegida.} \textit{Plausible / Umami / GA4 y por qué.} \\[1mm] \textbf{Mis 5 métricas (esta semana).} \textit{Tabla con las 5 cifras.} \\[1mm] \textbf{Una sorpresa.} \textit{Algo que no esperabas.} \\[1mm] \textbf{Mi decisión.} \textit{Lo que vas a cambiar la próxima semana basado en estos datos.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA).} Título: «Actividad 3 --- Mi primera lectura semanal». \textbf{Formato:} tabla de las 5 cifras + 1 párrafo con la sorpresa + 1 párrafo con la decisión. \textbf{Extensión:} una página de cuaderno. \textbf{Sabes que terminaste cuando} tienes una decisión concreta y accionable basada en los datos, no una observación vaga.
  producto_titulo: Dashboard de 5 indicadores instalado + primera lectura semanal escrita
  criterios:
  - Herramienta de analytics instalada y registrando visitas
  - |-
    Las 5 métricas (visitas únicas / fuentes / páginas / tiempo / conversiones) están visibles
  - Si recolectas datos personales, política de privacidad publicada
  - Primera lectura semanal escrita en cuaderno con 1 decisión derivada
  - Has decidido no mirar el dashboard hasta el próximo lunes
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: Lo que no se mide no existe; lo que no se mide bien se inventa.
    aplicacion: |-
      Lo que decides medir y lo que decides ignorar es una decisión política. Si solo mides ``conversiones'' te ciegas a quien visita pero no compra (estudiantes, investigadores, gente que no puede pagar). Si solo mides ``visitas'' te ciegas a la calidad. Las métricas que eliges revelan a quién privilegias.
    pregunta_espejo: |-
      ¿A quién hace visible mi dashboard y a quién deja invisible? ¿Qué de los visitantes que NO convierten merece ser visto y nombrado?
  estoico:
    autor: Marco Aurelio
    cita: Tu vida es lo que tus pensamientos hagan de ella.
    aplicacion: |-
      El peligro con métricas es obsesionarse: revisar el dashboard 10 veces al día, celebrar likes, sufrir caídas. Eso no depende de ti. Lo que sí depende: la decisión semanal informada, calma, sin drama. Que la cifra suba o baje no es la noticia; la decisión que tomes con esa cifra sí lo es.
    pregunta_espejo: |-
      ¿Estoy mirando mis métricas para aprender o para sentir? ¿Cuántas veces a la semana las miro --- y cuántas decisiones tomé con ellas?
  floridi:
    autor: Luciano Floridi
    cita: Tracking sin consentimiento es robo informacional.
    aplicacion: |-
      Cada vez que pones un tracker en tu sitio, recopilas información de personas reales. Floridi nos pediría preguntarnos: ¿esas personas saben que las estoy midiendo? ¿les puedo explicar qué hago con sus datos? Por eso herramientas como Plausible (sin cookies, agregadas, sin perfil individual) son éticamente superiores.
    pregunta_espejo: |-
      ¿Mi sistema de medición respeta a quien visita mi sitio? ¿Puedo explicar en 2 frases qué datos recojo y para qué?
compromiso: |-
  \textbf{Para la próxima semana.} Lunes a las 7 PM, dedica 15 minutos a leer tu dashboard y escribir 1 decisión accionable. No mires los datos entre semana. Que la disciplina sea semanal, no diaria. El próximo lunes traes el cuaderno con esa lectura.

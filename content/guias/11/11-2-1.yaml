clave: 2-1
grado: 11
periodo: 2
sesion: 1
completo: true
titulo: Mapeo de procesos --- ver dónde se pierde el tiempo
titulo_portada: |-
  Mapeo de procesos ---
  ver dónde
  se pierde el tiempo
producto_final: Mapa visual de un proceso real (escuela, casa, microempresa cercana) con todos los pasos, responsables, tiempos estimados y al menos 2 cuellos de botella marcados con justificación de por qué lo son
apertura:
  saber_ancestral: |-
    El \textbf{maestro carpintero} de Cartago no necesita reloj para saber dónde se traba el taller: lo ve. Sabe que el aserrado se demora porque la sierra está mal afilada, que el lijado se acumula porque solo un aprendiz lo hace, que el barnizado se traba porque no hay ventilación. La \textbf{cocinera mayor} de una fonda de mercado ve el cuello de botella sin medirlo: \emph{``el sancocho se demora porque solo hay una estufa''}. El \textbf{maestro del oficio} no necesita lenguaje técnico para ver el flujo: lleva en la mirada el saber acumulado de cien repeticiones. Esa mirada es el primer acto de toda automatización: \emph{antes de cambiar el proceso, hay que verlo}.
  origen: Mirada del maestro carpintero y de la cocinera mayor de fonda de mercado en el Valle del Cauca
  saber_contemporaneo: |-
    El \textbf{mapeo de procesos} es la representación visual de cómo se hace algo, paso a paso, con responsables y tiempos. Es la traducción técnica de la mirada del maestro al lenguaje del análisis. Un mapa de proceso responde a 4 preguntas: \emph{¿qué pasos hay?}, \emph{¿quién hace cada uno?}, \emph{¿cuánto tarda cada uno?}, \emph{¿dónde se acumula el trabajo?}. El cuarto punto --- el \textbf{cuello de botella} --- es donde se pierde la mayoría del tiempo total. La regla del oficio: \emph{automatizar antes de mapear es perder el tiempo en lo que no importa}. Sin mapa, terminas comprando un robot para el paso que tardaba 2 minutos en lugar de arreglar el que tardaba 20.
  pregunta_puente: |-
    ¿Cómo sabía la cocinera mayor, sin cronómetro, que el sancocho era el cuello de botella de la fonda? ¿Y qué pierde un emprendedor novato cuando compra software de automatización sin haber mapeado primero su proceso?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los pasos, responsables y tiempos de un proceso real cercano; (2) \textbf{analizar} dónde se acumula el trabajo y por qué (cuello de botella); (3) \textbf{explicar} con tus palabras qué cambia si se interviene en el cuello de botella vs en otro paso; (4) \textbf{evaluar} qué 2 cuellos de botella son los más graves y qué tipo de intervención (automatizar, redistribuir, eliminar) tendría más impacto.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En el periodo 1 construiste tu presencia digital personal/marca. En este periodo 2 vas a mirar adentro de un proceso real: cómo funciona, dónde falla, qué se puede automatizar. Hoy abres ese trabajo con la mirada del maestro: \emph{ver antes de cambiar}.
  a_escuta: |-
    Antes de teorizar, vas a observar un proceso real de tu día (preparar el desayuno, llegar al colegio, registrar la nota de un examen) y a anotar todos los pasos sin filtrar. El reconocimiento del flujo en bruto es la materia prima del mapa.
  a_sistematizacion: |-
    Ya viste el flujo. Ahora vas a entender la \textbf{anatomía} de un mapa de proceso: cómo representar pasos, responsables y tiempos; cómo detectar cuellos de botella; cómo no confundir \emph{``tarda mucho''} con \emph{``es el más importante para optimizar''}.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: elegir un proceso real cercano, mapear sus pasos, marcar tiempos, identificar responsables, encontrar al menos 2 cuellos de botella y justificarlos. Producto que puedes usar como evidencia ante un emprendedor real.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 1 mapa visual + 2 cuellos de botella justificados. El criterio principal: que un emprendedor del barrio, al ver tu mapa, pueda \textbf{decidir} dónde intervenir primero sin pedirte explicación.
  a_evaluacion: |-
    Antes de cerrar, mira el mapeo desde las cinco dimensiones humanas. Mapear bien es respeto al oficio; mapear mal es desprecio por la sabiduría acumulada del que ya hace el trabajo.
  a_triangulo: |-
    Y para terminar, tres voces sobre ver el proceso. Dussel sobre los procesos que invisibilizan a quien sostiene el trabajo, Marco Aurelio sobre la disciplina de observar antes de intervenir, Floridi sobre el mapa como infraestructura cognitiva del oficio contemporáneo.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Caza el cuello de botella} (15 min · individual). Elige un proceso real de tu día (preparar el desayuno, llegar al colegio, registrar la nota de un examen en la plataforma, despachar un pedido en una tienda del barrio). Sin filtro, anota TODOS los pasos en orden, desde el primero hasta el último. Junto a cada paso, escribe quién lo hace y cuánto tarda. Al final, marca con 🐌 el paso que \emph{intuyes} que es el cuello de botella, sin medirlo aún.
  checks:
  - Listé todos los pasos del proceso en orden, sin omitir ninguno.
  - Anoté quién hace cada paso y cuánto estimo que dura.
  - Marqué con 🐌 mi candidato a cuello de botella e intenté justificar por qué.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Caza el cuello de botella». \textbf{Formato:} tabla 4 columnas (Paso~|~Responsable~|~Tiempo estimado~|~Notas), 8-15 filas según el proceso. Al final marca 🐌 en el paso sospechoso. \textbf{Sabes que terminaste cuando} puedes contarle a un compañero el proceso completo sin volver a mirar la tabla.
sistematizacion:
  intro: |-
    Un mapa de proceso bien hecho no parece complicado, pero su anatomía es estricta. Vamos a descomponerla con los pilares del pensamiento computacional para que no quede al ojo del aprendiz, sino al rigor del oficio.
  pilares:
  - |-
    El mapa se descompone en 4 elementos visibles: (1) \textbf{Pasos}: cada acción concreta numerada (no \emph{``trabajar''}, sino \emph{``cortar la tabla a 50 cm''}); (2) \textbf{Responsables}: quién hace cada paso (persona, rol, máquina); (3) \textbf{Tiempos}: cuánto tarda cada paso en promedio; (4) \textbf{Flujo}: las flechas que muestran qué pasa después de qué (incluye bucles, esperas, decisiones).
  - |-
    Todo cuello de botella sigue el patrón \textbf{``el paso lento $\to$ marca el ritmo del todo''}: si un paso tarda 20 min y todos los demás 2 min, la velocidad de \emph{todo el proceso} es la velocidad del paso de 20 min. Aumentar la velocidad de los pasos rápidos no cambia el total. \emph{Optimizar lo que no es cuello de botella es perder el tiempo}. Esa es la regla del oficio que distingue al ingeniero del que solo \emph{``compra herramientas nuevas''}.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué pasaría con todo el proceso si el cuello se resuelve?}. Si la respuesta es \emph{``baja el tiempo total a la mitad''}, el cuello es grave. Si la respuesta es \emph{``ahorro 2 minutos pero el total queda igual''}, el cuello no era el cuello. La phronesis del análisis exige medir el impacto, no la severidad subjetiva.
  - |-
    Algoritmo para encontrar el cuello: (1) suma los tiempos de todos los pasos; (2) calcula qué porcentaje del total ocupa cada paso; (3) identifica el paso que ocupa más de 30\% del total (el primer candidato); (4) verifica si tiene espera, acumulación o requiere intervención manual; (5) compara con el segundo candidato; (6) marca los 2 cuellos más graves.
  anatomia:
    titulo: Anatomía de un mapa de proceso bien hecho
    body: |-
      \textbf{Título:} nombre del proceso en 1 frase. \\[1mm] \textbf{Pasos numerados:} en orden, cada uno con verbo de acción concreto. \\[1mm] \textbf{Responsables:} persona, rol o máquina por paso. \\[1mm] \textbf{Tiempos:} duración estimada por paso. \\[1mm] \textbf{Flujo:} flechas + decisiones + bucles si los hay. \\[1mm] \textbf{Cuello de botella:} marcado con color, con justificación de cuánto ocupa del total.
  errores_comunes: |-
    (1) Confundir \emph{``el paso que más me molesta''} con \emph{``el cuello de botella''}: lo que te molesta puede ser irrelevante para el tiempo total. (2) Omitir las esperas: si entre el paso 3 y el 4 hay 1 hora de espera porque \emph{``el papel debe secar''}, esa hora cuenta. (3) Confundir responsable con beneficiario: el responsable es quien \emph{ejecuta} el paso, no quien recibe el resultado. (4) Mapear con tiempos imaginarios: si no mediste, declara \emph{``estimado''}; si mediste, declara la fuente. (5) Marcar 5 cuellos: si todo es cuello, nada es cuello.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía del cuello de botella». \textbf{Formato:} ficha con las 6 partes del mapa (título, pasos, responsables, tiempos, flujo, cuello) aplicadas al proceso de Actividad 1 + 1 cálculo de \% del total que ocupa cada paso. \textbf{Sabes que terminaste cuando} puedes señalar con números cuál es el cuello y cuál es solo un paso \emph{``molesto pero rápido''}.
praxis:
  intro: |-
    \textbf{Actividad 3 · EXPLICA + EVALÚA --- Mapa con 2 cuellos justificados} (30 min · individual). Hora de aplicar. Elige un proceso real cercano (preferiblemente de un negocio del barrio, una microempresa familiar o un proceso escolar) y produce el mapa completo con 2 cuellos de botella identificados y justificados.
  pilares:
  - |-
    Tu mapa se descompone en 5 piezas: (1) título del proceso + responsable general; (2) tabla de pasos con tiempo y responsable; (3) representación visual (diagrama a mano alzada o digital); (4) cálculo de \% del total por paso; (5) 2 cuellos de botella marcados con justificación.
  - |-
    Sigue el patrón \textbf{``observa primero, mapea después''}: si el proceso no es tuyo, ve y observa al menos una corrida completa antes de mapear. Mapear de memoria o por suposición produce mapas inventados. La observación directa toma 30 min pero ahorra 3 horas de mal análisis.
  - |-
    Cada justificación expresa una sola idea: \emph{``Este es cuello porque ocupa X\% del tiempo total Y por la espera de Z''}. Si tu justificación tiene 3 razones, parte el cuello en 2: probablemente son 2 problemas distintos juntos.
  - |-
    Algoritmo: (1) elige el proceso; (2) observa una corrida completa (o entrevista a quien lo hace); (3) lista pasos con tiempos; (4) dibuja el flujo; (5) calcula \%; (6) identifica los 2 cuellos; (7) justifica cada uno en 1 frase con número + razón.
  checklist:
    titulo: Checklist antes de entregar el mapa
    items: |-
      \checkbox Proceso observado al menos 1 vez completo (no mapeado de memoria). \\[1mm] \checkbox Todos los pasos numerados con responsable y tiempo estimado. \\[1mm] \checkbox Diagrama visual con flujo y decisiones marcadas. \\[1mm] \checkbox Cálculo de \% del tiempo total por paso. \\[1mm] \checkbox 2 cuellos marcados con justificación en 1 frase cada uno. \\[1mm] \checkbox Un emprendedor podría decidir dónde intervenir sin pedirte explicación.
  plantilla_guion: |-
    \textbf{Proceso.} \textit{Nombre + responsable general + dónde se ejecuta.} \\[1mm] \textbf{Pasos (tabla).} \textit{Cada uno con número, descripción, responsable, tiempo, \% del total.} \\[1mm] \textbf{Diagrama.} \textit{Boceto del flujo (rectángulos para pasos, rombos para decisiones).} \\[1mm] \textbf{Cuello 1.} \textit{Paso N + justificación numérica.} \\[1mm] \textbf{Cuello 2.} \textit{Paso M + justificación numérica.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EXPLICA + EVALÚA).} Título: «Actividad 3 --- Mapa de proceso con cuellos de botella». \textbf{Formato:} 1 página con título + tabla de pasos + boceto del diagrama + 2 cuellos justificados. \textbf{Extensión:} 1 página A4 o 2 páginas de cuaderno. \textbf{Sabes que terminaste cuando} podrías presentar el mapa al responsable real del proceso y proponer una conversación de mejora basada en evidencia.
  producto_titulo: 1 mapa de proceso real con 2 cuellos de botella justificados
  criterios:
  - Proceso real elegido y observado (no inventado de memoria)
  - Tabla de pasos con responsable y tiempo por paso
  - Diagrama visual con flujo y decisiones
  - Cálculo de \% del tiempo total por paso
  - 2 cuellos de botella marcados con justificación numérica
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Todo mapa de proceso decide quién aparece como protagonista del trabajo y quién queda invisible.
    aplicacion: |-
      Cuando mapeas un proceso de una panadería y nombras \emph{``el panadero''} pero no nombras a \emph{``la señora que limpia el horno cada noche para que el panadero pueda trabajar mañana''}, tu mapa invisibiliza el trabajo de cuidado. La phronesis del mapeo exige nombrar a todos los responsables, incluyendo los del trabajo invisible (limpieza, mantenimiento, abastecimiento, transporte). Un mapa que solo nombra al protagonista repite la estructura social que lo hace protagonista.
    pregunta_espejo: |-
      En mi mapa, ¿quién aparece nombrado y quién quedó como \emph{``ya estaba listo''} sin responsable? ¿Qué cambia si nombro al trabajo invisible que sostiene el proceso?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Antes de cambiar el flujo del trabajo, observa el flujo del trabajo.
    aplicacion: |-
      Es tentador llegar con propuestas de automatización antes de haber visto el proceso. La sabiduría estoica recomienda lo contrario: \emph{quien interviene sin observar daña más de lo que arregla}. El maestro del oficio sabe que el aprendiz que llega con soluciones está más perdido que el que llega con preguntas. Mapear es la disciplina de \emph{observar antes de intervenir}.
    pregunta_espejo: |-
      ¿Llegué al mapa con la respuesta ya decidida o llegué con preguntas? ¿Qué descubrí en la observación que no habría podido inventar desde el escritorio?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El mapa de procesos es la infraestructura cognitiva con que toda organización contemporánea se entiende a sí misma.
    aplicacion: |-
      Cualquier organización pública o privada que automatiza, optimiza o se transforma digitalmente parte de un mapa de sus procesos. Sin mapa, las decisiones tecnológicas son adivinanzas caras. Aprender a mapear procesos a los 16 años es alfabetización profesional anticipada: el lenguaje con el que la ingeniería, la administración y la gestión pública entienden las organizaciones.
    pregunta_espejo: |-
      ¿Cuántos procesos cotidianos podría mejorar (en mi casa, mi colegio, el negocio familiar) si me tomara 1 hora de mapeo en lugar de quejarme de su lentitud?
compromiso: |-
  \textbf{Para la próxima semana.} Mapea un segundo proceso de tu vida cotidiana (estudiar para un examen, organizar un evento, hacer las compras) y comparte el mapa con quien comparta el proceso contigo (madre, padre, hermano, compañero). La phronesis del mapeo no se queda en el cuaderno: se conversa con quien sostiene el trabajo.
web:
  resumen: |-
    Antes de automatizar hay que ver. Aprendes a mapear un proceso real con pasos, responsables y tiempos, y a detectar el cuello de botella que marca el ritmo del todo.
  subtema: Automatización · Mirada del oficio
  pre_lectura:
    por_que_importa: |-
      Optimizar lo que no es cuello de botella es perder el tiempo. La regla del oficio: mapear primero, intervenir después. Sin esta disciplina, automatizar es comprar herramientas caras para el problema equivocado.
    pregunta_detonante: |-
      Si tu proceso de matrícula escolar tarda 4 horas, ¿dónde se pierde el tiempo: en escribir el nombre o en esperar la firma del rector?
    activacion:
      titulo: El ojo del maestro
      descripcion: |-
        En 3 minutos: cada estudiante nombra el "cuello de botella" de su mañana (desde despertar hasta llegar al colegio). Comparten en grupo y descubren que casi todos tienen el mismo cuello no donde creían.
      duracion_min: 3
    conexion:
      anterior: |-
        En el periodo 1 trabajaste tu presencia digital personal. Hoy abres el periodo 2 mirando hacia adentro: cómo funciona un proceso, dónde falla, qué se podría automatizar.
      siguiente: |-
        En la sesión 2 tomas este mapa y lo conviertes en un diagrama BPMN profesional con notación estándar.
  conceptos_clave:
    - termino: Paso (actividad)
      definicion: Cada acción concreta del proceso, nombrada con verbo + objeto. Numeradas en orden.
      ejemplo: "\"Cortar la tabla a 50 cm\" (sí); \"trabajar la madera\" (no — demasiado vago)."
      emoji: "🪜"
    - termino: Responsable
      definicion: Persona, rol o máquina que ejecuta cada paso. No confundir con beneficiario.
      ejemplo: "Responsable de \"verificar stock\": el vendedor. Beneficiario: el cliente."
      emoji: "👤"
    - termino: Tiempo estimado
      definicion: Duración promedio de cada paso. Si fue medido, declara la fuente; si es estimación, márcalo.
      ejemplo: "\"Hornear pan: 35 min (medido) / Lijar tabla: 10 min (estimado)\"."
      emoji: "⏱️"
    - termino: Cuello de botella
      definicion: El paso lento que marca el ritmo del proceso completo. Suele ocupar más del 30% del tiempo total.
      ejemplo: |-
        En el sancocho, "ablandar el grano de maíz" puede tomar 50% del tiempo total — todo lo demás depende.
      emoji: "🐌"
    - termino: Espera / acumulación
      definicion: |-
        Tiempo en que nada visible ocurre pero el proceso no avanza. Suele ser invisible y por eso peligroso.
      ejemplo: |-
        Entre "enviar solicitud" y "recibir respuesta" hay 3 días de espera — eso cuenta como tiempo del proceso.
      emoji: "⌛"
    - termino: Impacto de la intervención
      definicion: "La pregunta que define si vale la pena optimizar: \"¿qué cambia en el total si resuelvo este paso?\"."
      ejemplo: |-
        Reducir 50% el cuello que ocupa 30% del total ahorra 15% del tiempo global. Reducir 50% un paso del 3% solo ahorra 1.5%.
      emoji: "💡"
  quiz:
    titulo: "✅ Verifica mapeo de procesos"
    instrucciones: 5 preguntas para confirmar que mapas con criterio del oficio. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: Si reduces a la mitad un paso que ocupa 5% del tiempo total, ¿cuánto ahorras del proceso completo?
        opciones:
          - 50%
          - 25%
          - 5%
          - 2.5%
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. 50% de 5% = 2.5%. Por eso optimizar pasos pequeños es perder el tiempo: solo el cuello mueve el total.
        feedback_incorrecto: |-
          2.5%. Reducir a la mitad un paso que ya era pequeño produce un ahorro mínimo. El cuello es donde está la palanca.
      - enunciado: En el mapeo, ¿cómo se trata la espera entre dos pasos?
        opciones:
          - No cuenta porque no es trabajo
          - Cuenta como tiempo del proceso — es invisible y por eso peligrosa
          - Solo cuenta si pasa de 1 hora
          - Depende del proceso
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La espera es tiempo real del proceso. Omitirla produce mapas mentirosos donde el total parece menor de lo que es.
        feedback_incorrecto: |-
          Cuenta siempre. La espera invisible es lo que más alarga procesos reales y por eso debe aparecer en el mapa.
      - enunciado: Una compuerta de mapa muestra 5 cuellos de botella marcados. ¿Qué problema tiene?
        opciones:
          - Ninguno, mejor mucho cuello que poco
          - Si todo es cuello, nada es cuello — falta priorización
          - Solo significa proceso complejo
          - Es siempre correcto
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Marcar todo como crítico es no priorizar. Selecciona los 2 más graves para que el responsable sepa por dónde empezar.
        feedback_incorrecto: Si todo es prioritario, nada lo es. El mapa profesional prioriza para que la acción sea posible.
      - enunciado: ¿Qué hace de "cortar tabla a 50 cm" una mejor tarea que "trabajar la madera"?
        opciones:
          - Es más corta
          - Tiene verbo + objeto concretos y medibles
          - Suena más profesional
          - Da lo mismo
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Verbo de acción + objeto medible permite asignar responsable, tiempo y verificar ejecución. "Trabajar" es demasiado vago.
        feedback_incorrecto: Verbo + objeto. La concreción es la diferencia entre un mapa accionable y uno decorativo.
      - enunciado: En el saber ancestral del maestro carpintero, ¿qué aplica al mapeo?
        opciones:
          - Nada — son oficios distintos
          - Antes de cambiar el flujo, hay que verlo — la observación es el primer acto del oficio
          - Que mapear es rápido
          - Que la intuición basta
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La mirada del maestro es la disciplina de observar antes de intervenir. El mapa la pone en lenguaje técnico.
        feedback_incorrecto: |-
          Ver antes de cambiar. La phronesis del oficio está en la observación paciente antes de la propuesta apurada.
  post_lectura:
    transferencia: |-
      Esta semana, mapea un segundo proceso de tu vida cotidiana (estudiar para examen, organizar evento, hacer compras) y comparte el mapa con quien comparte el proceso contigo.
  cinco_dimensiones:
    personal: |-
      Adquiriste una habilidad transferible a cualquier carrera: observar procesos antes de proponer cambios. Ingeniería, administración, salud, educación — todas usan mapeo.
    emocional: |-
      Toleraste la disciplina de observar en lugar de saltar a soluciones. Esa paciencia es virtud profesional escasa.
    ciudadana: |-
      Todo trámite estatal es un proceso mapeable. Saber mapear te permite criticar burocracias con evidencia, no con queja.
    local: |-
      El maestro carpintero y la cocinera de fonda saben ver el cuello sin medirlo. Tú lo aprendes con números — misma sabiduría, distinto método.
    intergeneracional: |-
      Lo que el abuelo veía con la mirada del oficio, tú lo registras con tabla y diagrama. Mismo gesto, distinto medio.

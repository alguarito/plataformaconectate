titulo: Mapeo de procesos --- ver dónde se pierde el tiempo
producto_final: |-
  Mapa visual de un proceso real (escuela, casa o negocio cercano) con cuellos de botella marcados
saber_ancestral_idea: |-
  El maestro del oficio "ve" el flujo completo del trabajo de un vistazo: dónde se traba la madera, dónde se pierde la harina, dónde se enfría el horno. Esa mirada es el primer paso para automatizar.

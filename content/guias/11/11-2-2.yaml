completo: true
titulo: Diagramas de flujo --- lenguaje BPMN básico
titulo_portada: |-
  Diagramas de flujo ---
  lenguaje
  BPMN básico
producto_final: Diagrama BPMN del proceso mapeado en sesión 1, hecho en draw.io o Lucidchart, usando correctamente los 5 símbolos básicos (inicio/fin, tarea, decisión, flecha, swimlane) y exportado en PDF para entrega
apertura:
  saber_ancestral: |-
    Las \textbf{recetas familiares} del Valle son diagramas de flujo escritos sin saberlo: \emph{``primero el sofrito, luego el caldo, después el grano, al final el cilantro''}. La \textbf{cocinera de la fonda} sabe que cambiar el orden daña el sancocho; el \textbf{maestro carpintero} sabe que lijar antes de cortar arruina la madera; el \textbf{tejedor Wayuu} sabe que cada rombo del chinchorro se hace en una secuencia precisa, no negociable. Las recetas, los manuales del oficio y los pasos heredados son \emph{flujos formalizados por la experiencia colectiva}. BPMN no inventó los diagramas de flujo: les puso un alfabeto común para que un ingeniero en Bogotá entienda el flujo de una fábrica en Cartago sin necesidad de visitarla.
  origen: Recetas familiares, oficio del maestro carpintero y tejido Wayuu como flujos heredados
  saber_contemporaneo: |-
    \textbf{BPMN} (\emph{Business Process Model and Notation}) es un estándar internacional para diagramar procesos de negocio. Como las partituras musicales o los planos arquitectónicos, BPMN tiene un \emph{vocabulario cerrado} que cualquier profesional del mundo lee igual. Los 5 símbolos básicos del nivel introductorio son: (1) \textbf{círculo}: inicio (verde) o fin (rojo); (2) \textbf{rectángulo}: tarea o actividad; (3) \textbf{rombo}: decisión (\emph{``¿sí o no?''}); (4) \textbf{flecha}: flujo de secuencia; (5) \textbf{swimlane}: carril que agrupa por responsable. Dominar estos 5 símbolos te permite leer y producir el 80\% de los diagramas profesionales.
  pregunta_puente: |-
    ¿Cómo sabía la cocinera, sin haberlo escrito, qué pasos del sancocho admiten desorden y cuáles no? ¿Y qué pierde un emprendedor novato cuando inventa su propio \emph{``lenguaje gráfico''} en lugar de aprender el estándar que todos los profesionales del mundo ya leen?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 5 símbolos básicos de BPMN y qué representa cada uno; (2) \textbf{explicar} con tus palabras la diferencia entre tarea, decisión, evento y swimlane; (3) \textbf{aplicar} BPMN al proceso que mapeaste en sesión 1, convirtiendo tu boceto en un diagrama profesional; (4) \textbf{evaluar} si tu diagrama es legible para alguien que NO conoce tu proceso (criterio de profesionalidad).
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 mapeaste a mano alzada un proceso real con sus cuellos de botella. Hoy le pones \emph{lenguaje profesional}: el mismo proceso, pero diagramado en BPMN para que un consultor, un ingeniero o un emprendedor lo lea sin verte explicar.
  a_escuta: |-
    Antes de teorizar, vas a leer 3 diagramas BPMN reales sin instrucción previa y a inferir qué hace cada uno. Esa lectura sin guía mide qué tan intuitivo es el lenguaje (mucho más de lo que parece a primera vista).
  a_sistematizacion: |-
    Ya descifraste 3 diagramas. Ahora vamos a entender la \textbf{anatomía} de los 5 símbolos básicos y las reglas mínimas que distinguen un BPMN profesional de un dibujito desordenado: un solo inicio, un solo fin (idealmente), flechas que no se cruzan si se puede evitar, decisiones que siempre dan dos salidas etiquetadas.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: abrir draw.io o Lucidchart, recrear el proceso de sesión 1 con los 5 símbolos, organizar por swimlanes según responsables, y exportar en PDF.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 1 diagrama BPMN en PDF + 1 archivo editable. El criterio principal: que un profesional que NO conoce tu proceso pueda \textbf{entenderlo} solo con el diagrama, sin tu explicación.
  a_evaluacion: |-
    Antes de cerrar, mira el diagrama desde las cinco dimensiones humanas. Un BPMN bien hecho es respeto al lector profesional; uno mal hecho es desperdicio de tiempo colectivo.
  a_triangulo: |-
    Y para terminar, tres voces sobre el lenguaje compartido. Dussel sobre los lenguajes técnicos que excluyen, Epicteto sobre la disciplina del estándar, Floridi sobre BPMN como infraestructura de la economía digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Lee 3 BPMN sin guía} (15 min · individual). El docente proyecta 3 diagramas BPMN reales (ej. \emph{registro de un nuevo cliente en banco}, \emph{pedido en una pizzería}, \emph{trámite de matrícula escolar}). Sin saber qué símbolo significa qué, intenta describir con tus palabras qué hace cada diagrama: ¿dónde empieza?, ¿qué decisiones aparecen?, ¿quiénes están involucrados?, ¿dónde termina? Anota lo que entiendes y lo que te confunde.
  checks:
  - Describí en mis palabras qué hace cada uno de los 3 diagramas.
  - Identifiqué inicio, fin y al menos 1 decisión en cada diagrama.
  - Anoté qué símbolo o flecha me resultó confusa para preguntar después.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Lee 3 BPMN sin guía». \textbf{Formato:} tabla 3 filas (un diagrama por fila) × 3 columnas (Qué hace el proceso~|~Decisiones que detecté~|~Lo que me confunde). \textbf{Sabes que terminaste cuando} reconoces que BPMN es más intuitivo de lo que parece y puedes señalar dónde te trabaste.
sistematizacion:
  intro: |-
    Los 5 símbolos básicos de BPMN se aprenden en 15 minutos pero el rigor de su uso es lo que distingue un diagrama profesional. Vamos a descomponerlos con los pilares del pensamiento computacional.
  pilares:
  - |-
    Los 5 símbolos se descomponen así: (1) \textbf{Eventos} (círculos): inicio (verde, fino), fin (rojo, grueso), evento intermedio (doble línea); marcan el comienzo y el cierre de un flujo. (2) \textbf{Tareas} (rectángulos redondeados): cada acción concreta del proceso (\emph{``recibir pedido''}, \emph{``verificar stock''}). (3) \textbf{Compuertas} (rombos): decisiones; deben tener mínimo 2 salidas etiquetadas con condición (\emph{``sí / no''}, \emph{``pago aprobado / rechazado''}). (4) \textbf{Flujos de secuencia} (flechas continuas): qué pasa después de qué. (5) \textbf{Swimlanes} (carriles horizontales): agrupan tareas por responsable (\emph{cliente, vendedor, sistema}).
  - |-
    Todo BPMN sigue el patrón \textbf{``un solo inicio, un solo fin (idealmente)''}: si tu diagrama tiene 3 puntos de inicio, probablemente son 3 procesos distintos mezclados. Si tiene 4 fines, alguno es solo un cierre parcial. La regla profesional: \emph{procesos limpios = pocos eventos extremos}. Los expertos a veces rompen esta regla con razón, pero al principiante le sirve como disciplina.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿alguien que no conoce mi proceso puede seguir las flechas y entender el flujo completo?}. Si la respuesta es no, el diagrama no es profesional aunque sea bonito. La prueba final es la legibilidad ciega: \emph{darle el diagrama a un compañero sin explicación}.
  - |-
    Algoritmo para construir un BPMN: (1) lista responsables (van en swimlanes); (2) marca inicio (círculo verde); (3) traduce cada paso a tarea (rectángulo); (4) cada \emph{``si X, hacemos A, si Y, hacemos B''} a compuerta (rombo); (5) conecta con flechas; (6) marca fin (círculo rojo); (7) revisa que no haya flechas sueltas ni cruces evitables.
  anatomia:
    titulo: Anatomía de un BPMN profesional
    body: |-
      \textbf{Título:} nombre del proceso. \\[1mm] \textbf{Swimlanes:} responsables como carriles horizontales. \\[1mm] \textbf{Inicio:} círculo verde único. \\[1mm] \textbf{Tareas:} rectángulos con verbo de acción y objeto (\emph{``verificar stock''}, no \emph{``stock''}). \\[1mm] \textbf{Compuertas:} rombos con condición + 2 salidas etiquetadas. \\[1mm] \textbf{Fin:} círculo rojo (idealmente uno). \\[1mm] \textbf{Flechas:} continuas, sin cruces evitables.
  errores_comunes: |-
    (1) Rombos con una sola salida: no son decisión, son tareas mal dibujadas. (2) Tareas con sustantivos en lugar de verbos: \emph{``factura''} no es tarea; \emph{``emitir factura''} sí. (3) Flechas que no etiquetan las decisiones: el lector no sabe cuál camino es cuál. (4) Múltiples inicios sin justificación: confunde al lector. (5) Olvidar swimlanes: si hay más de 1 responsable, los carriles son obligatorios para legibilidad.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía BPMN». \textbf{Formato:} ficha con los 5 símbolos dibujados + qué representa cada uno + 1 error frecuente por símbolo. \textbf{Sabes que terminaste cuando} podrías corregir un BPMN ajeno señalando con vocabulario técnico qué está mal.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tu proceso en BPMN profesional} (30 min · individual). Hora de aplicar. Abre draw.io (gratuito, sin cuenta) o Lucidchart, recrea el proceso de sesión 1 con los 5 símbolos básicos, organiza por swimlanes según responsables, y exporta en PDF.
  pilares:
  - |-
    Tu diagrama se descompone en 5 piezas: (1) título del proceso al inicio del lienzo; (2) swimlanes con cada responsable; (3) inicio + tareas + compuertas + fin correctamente ubicados en su carril; (4) flechas etiquetadas en las decisiones; (5) exportación en PDF lista para entrega.
  - |-
    Sigue el patrón \textbf{``flujo de izquierda a derecha, sin retrocesos visuales innecesarios''}: el lector recorre el diagrama como un texto. Si una flecha vuelve atrás, debe ser un bucle real (\emph{``rechazado $\to$ corregir''}), no un capricho de diseño. Cuanto más lineal el flujo, más legible.
  - |-
    Cada compuerta debe etiquetar sus salidas: \emph{sí/no}, \emph{aprobado/rechazado}, \emph{cliente nuevo/cliente recurrente}. Si una compuerta tiene 3 salidas, las 3 deben tener etiqueta. El lector profesional debe poder seguir cada rama sin adivinar.
  - |-
    Algoritmo: (1) abre draw.io; (2) crea swimlanes; (3) coloca inicio en el carril correspondiente; (4) arrastra tareas, compuertas, flechas; (5) etiqueta cada decisión; (6) ubica el fin; (7) revisa cruces y limpieza visual; (8) exporta a PDF.
  checklist:
    titulo: Checklist antes de entregar el BPMN
    items: |-
      \checkbox Título del proceso visible. \\[1mm] \checkbox Swimlanes por responsable si hay más de uno. \\[1mm] \checkbox Inicio único (círculo verde) y fin único (círculo rojo). \\[1mm] \checkbox Tareas con verbo + objeto. \\[1mm] \checkbox Compuertas con condición y salidas etiquetadas. \\[1mm] \checkbox Sin flechas sueltas, sin cruces innecesarios. \\[1mm] \checkbox Exportado como PDF legible.
  plantilla_guion: |-
    \textbf{Proceso.} \textit{Nombre + responsable general.} \\[1mm] \textbf{Swimlanes.} \textit{Cliente / Vendedor / Sistema / etc.} \\[1mm] \textbf{Inicio.} \textit{Evento que dispara el proceso.} \\[1mm] \textbf{Tareas principales.} \textit{5-10 tareas con verbo + objeto.} \\[1mm] \textbf{Compuertas.} \textit{2-3 decisiones con salidas etiquetadas.} \\[1mm] \textbf{Fin.} \textit{Estado final del proceso.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- BPMN de mi proceso». \textbf{Formato:} pantallazo del diagrama pegado o impreso + checklist completa marcada + 1 línea con qué fue lo más difícil. \textbf{Extensión:} 1 página de cuaderno con el diagrama. \textbf{Sabes que terminaste cuando} un compañero que no vio el proceso original puede explicarte cómo funciona leyendo solo tu diagrama.
  producto_titulo: 1 diagrama BPMN profesional en draw.io/Lucidchart, exportado a PDF
  criterios:
  - Título y swimlanes presentes
  - 5 símbolos básicos usados con corrección
  - Inicio y fin únicos
  - Compuertas con salidas etiquetadas
  - Exportado a PDF, archivo editable conservado
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Todo lenguaje técnico decide quién entra a la conversación y quién queda fuera por desconocer el alfabeto.
    aplicacion: |-
      BPMN abre puertas profesionales, pero también las cierra a quienes no han tenido acceso a la formación. La phronesis del que aprende el lenguaje técnico exige: (1) aprenderlo bien para no quedar excluido; (2) traducirlo a quien no lo conoce para no excluir. Un BPMN bonito que el responsable real del proceso no entiende es un BPMN mudo. Saber BPMN obliga a saber explicarlo en castellano sencillo cuando el contexto lo pide.
    pregunta_espejo: |-
      ¿Puedo explicar mi BPMN a la cocinera real de la fonda o al maestro carpintero real del taller en su lenguaje, o solo lo entienden los \emph{``del oficio digital''}?
  estoico:
    autor: Epicteto
    cita: |-
      Aprender el estándar es aceptar que el oficio es más grande que tu preferencia.
    aplicacion: |-
      Es tentador \emph{``inventar mi propio sistema de diagramación porque me parece más claro''}. La sabiduría estoica recomienda lo contrario: \emph{el estándar es la humildad del oficio profesional}. BPMN no es la única forma posible de diagramar, pero es la que el mundo profesional acordó. Quien se niega a aprenderlo se queda fuera de la conversación; quien lo aprende entra al diálogo de la ingeniería contemporánea.
    pregunta_espejo: |-
      ¿Resistí la tentación de inventar mi propio lenguaje y acepté el estándar profesional? ¿Qué libertad gano al hablar la lengua que todos hablan?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los estándares de notación son la infraestructura invisible de toda economía digital colaborativa.
    aplicacion: |-
      Cada vez que un equipo internacional diseña un software, cada vez que un consultor evalúa una empresa, cada vez que un ingeniero entrega un proyecto, BPMN aparece. Es la lengua franca de los procesos. Aprenderlo a los 16 años es alfabetización profesional adelantada: el lenguaje con el que vas a comunicarte en cualquier empleo que involucre procesos, sistemas o transformación digital.
    pregunta_espejo: |-
      ¿Cuántas conversaciones profesionales futuras (con un consultor, un ingeniero, un emprendedor) dependerán de que comparta el lenguaje BPMN? ¿Cuánto me cuesta no aprenderlo bien ahora?
compromiso: |-
  \textbf{Para la próxima semana.} Toma una receta familiar de tu casa (sancocho, sopa, plato emblema) y diagrámala en BPMN en draw.io. Incluye swimlanes (cocinero principal, ayudante, comensal que pide), decisiones (\emph{``¿hay yuca? sí/no''}) y eventos. La phronesis del lenguaje técnico se entrena traduciéndolo a lo cotidiano.
web:
  resumen: |-
    BPMN es el alfabeto profesional para diagramar procesos. Aprendes los 5 símbolos básicos (inicio/fin, tarea, decisión, flecha, swimlane) y traduces tu mapa de Sesión 1 a un diagrama legible por cualquier profesional del mundo.
  subtema: Automatización · Lenguaje profesional
  pre_lectura:
    por_que_importa: |-
      BPMN es la lengua franca de los procesos. Cualquier consultor, ingeniero o emprendedor profesional lo lee. Aprenderlo a los 16 años es ventaja profesional decisiva.
    pregunta_detonante: |-
      Si pudieras mostrarle a un consultor en Bogotá cómo funciona el negocio de tu familia sin verte explicar, ¿qué lenguaje gráfico usarías?
    activacion:
      titulo: La receta como diagrama
      descripcion: |-
        En 3 minutos: cada estudiante describe una receta familiar (sancocho, arroz, sopa) en voz alta como secuencia de pasos. Los demás identifican mentalmente dónde está la decisión ("¿hay yuca?") y dónde el bucle ("revolver hasta que espese").
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 1 mapeaste un proceso a mano alzada. Hoy le pones lenguaje profesional: el mismo proceso en BPMN estándar.
      siguiente: |-
        En la sesión 3 automatizas el primer paso del proceso — la captura de información — con un formulario digital.
  conceptos_clave:
    - termino: Evento (círculo)
      definicion: |-
        Inicio (verde, fino) marca el comienzo del proceso; fin (rojo, grueso) marca el cierre. Idealmente uno de cada.
      ejemplo: "Inicio: \"Cliente llega al mostrador\". Fin: \"Cliente recibe el pedido\"."
      emoji: "⚪"
    - termino: Tarea (rectángulo redondeado)
      definicion: Cada acción concreta del proceso, nombrada con verbo + objeto.
      ejemplo: "\"Verificar stock\", \"emitir factura\", \"preparar pedido\"."
      emoji: "🔲"
    - termino: Compuerta (rombo)
      definicion: Decisión con mínimo 2 salidas etiquetadas con condición (sí/no, aprobado/rechazado).
      ejemplo: "\"¿Pago aprobado?\" → sí (continúa), no (cancela)."
      emoji: "🔷"
    - termino: Flujo de secuencia (flecha)
      definicion: Flecha continua que conecta elementos en el orden temporal del proceso.
      ejemplo: "De \"tarea A\" a \"tarea B\" significa: tras A, sigue B."
      emoji: "➡️"
    - termino: Swimlane (carril)
      definicion: Carril horizontal que agrupa tareas por responsable (persona, rol, sistema).
      ejemplo: "3 carriles: Cliente | Vendedor | Sistema — cada tarea va en el carril del que la ejecuta."
      emoji: "🏊"
    - termino: Legibilidad ciega
      definicion: |-
        Prueba clave: ¿alguien que no conoce mi proceso puede seguir el flujo y entenderlo solo con el diagrama?
      ejemplo: Le das tu BPMN a un compañero sin explicación. Si lo entiende, está bien hecho.
      emoji: "👁️"
  quiz:
    titulo: "✅ Verifica BPMN básico"
    instrucciones: 5 preguntas para confirmar que usas BPMN con rigor profesional. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Qué símbolo se usa para representar una decisión "sí/no"?
        opciones:
          - Círculo
          - Rectángulo
          - Rombo
          - Flecha
        respuesta_index: 2
        feedback_correcto: Correcto. Rombo = compuerta = decisión. Debe tener 2+ salidas etiquetadas.
        feedback_incorrecto: El rombo. Cada compuerta debe etiquetar sus salidas para que el lector siga la rama correcta.
      - enunciado: Una tarea se nombra "factura". ¿Qué problema tiene?
        opciones:
          - Es muy corta
          - "Es un sustantivo: las tareas se nombran con verbo + objeto (\"emitir factura\")"
          - No tiene problema
          - Falta el responsable
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Verbo + objeto. "Emitir factura", "verificar factura", "archivar factura" son tareas distintas que un sustantivo solo no distingue.
        feedback_incorrecto: |-
          Las tareas se nombran con verbo + objeto. Un sustantivo solo es ambiguo: no se sabe qué acción se ejecuta sobre él.
      - enunciado: ¿Para qué sirven los swimlanes?
        opciones:
          - Para hacer el diagrama más bonito
          - Para agrupar tareas por responsable y mostrar quién hace qué
          - Son obligatorios siempre
          - No sirven
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Los swimlanes muestran la división del trabajo entre roles. Si hay un solo responsable no son necesarios; si hay más, son obligatorios para legibilidad.
        feedback_incorrecto: |-
          Agrupan por responsable. Sin swimlanes, un proceso con 3 actores se vuelve ilegible aunque el flujo sea correcto.
      - enunciado: ¿Qué hace que un BPMN sea "profesional" vs "dibujito"?
        opciones:
          - Que esté hecho en computador
          - Que use el estándar correctamente y sea legible para alguien sin explicación
          - Que sea grande
          - Que tenga colores
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Estándar + legibilidad ciega. Un BPMN profesional puede leerlo cualquier consultor del mundo sin tu ayuda.
        feedback_incorrecto: |-
          Estándar + legibilidad. La herramienta es lo de menos; lo que importa es que cumple las reglas y se entiende sin explicación.
      - enunciado: En el saber ancestral de las recetas, ¿qué aplica a BPMN?
        opciones:
          - Nada — son tecnologías distintas
          - "Las recetas son diagramas de flujo antiguos: BPMN les puso alfabeto común"
          - Que las recetas son obsoletas
          - Que cocinar no es proceso
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La cocinera diagrama mentalmente; el ingeniero lo dibuja en BPMN. Mismo oficio, distinto medio.
        feedback_incorrecto: |-
          Las recetas son flujos heredados. BPMN solo agregó el lenguaje compartido para que el flujo viaje entre profesionales.
  post_lectura:
    transferencia: |-
      Esta semana, toma una receta familiar y diagrámala en BPMN en draw.io con swimlanes (cocinero, ayudante, comensal), decisiones ("¿hay yuca?") y eventos.
  cinco_dimensiones:
    personal: |-
      Aprendiste un lenguaje profesional usado en cualquier carrera con procesos. Es ventaja transferible al primer empleo o al primer emprendimiento.
    emocional: |-
      Aceptaste el estándar en lugar de inventar el tuyo. Esa humildad es virtud profesional contra el ego del autodidacta.
    ciudadana: |-
      Los procesos públicos también se diagraman en BPMN. Saber leerlos te permite criticar trámites con vocabulario, no con queja.
    local: |-
      La cocinera, el carpintero, el tejedor Wayuu — todos manejaban flujos heredados. BPMN traduce esa sabiduría al diálogo profesional.
    intergeneracional: |-
      Lo que la abuela transmitía oralmente, tú lo diagramas en software. Mismo gesto, distinto medio — y ahora viaja al mundo.

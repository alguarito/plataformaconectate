clave: 2-5
grado: 11
periodo: 2
sesion: 5
completo: true
titulo: Automatización con triggers --- Zapier, Make, n8n
titulo_portada: |-
  Automatización ---
  con triggers
  Zapier, Make, n8n
producto_final: 1 flujo automático funcionando (Zap en Zapier, escenario en Make o workflow en n8n) que conecta 2 servicios reales mediante un trigger (ej. nueva fila en Sheet → enviar email; nuevo Form → registrar en CRM; mensaje WhatsApp → guardar en hoja), con captura de ejecución exitosa
apertura:
  saber_ancestral: |-
    La \textbf{campana de la iglesia} de los pueblos del Valle era un sistema de triggers: cuando sonaba en cierto patrón, todo el pueblo sabía qué hacer (\emph{tres golpes y silencio = misa}; \emph{tañidos continuos rápidos = incendio o emergencia}; \emph{repique alegre = matrimonio o bautizo}). El sonido era el \emph{evento que dispara la cadena de acciones}: el sacristán prendía las velas, el padre tomaba la sotana, las cocineras del almuerzo bajaban el fuego. La \textbf{cocinera mayor} también gritaba \emph{``sancocho listo''} y desde ese grito se encadenaban acciones (servir, poner mesa, llamar comensales). Los \textbf{triggers digitales} son las campanas del XXI: un evento (un nuevo correo, una nueva fila, un mensaje) activa una secuencia automatizada sin tu intervención.
  origen: Campana de la iglesia y grito de la cocinera mayor como sistemas de triggers heredados
  saber_contemporaneo: |-
    Un \textbf{trigger} (\emph{disparador}) es el evento que inicia una automatización. La estructura mínima es: \texttt{TRIGGER $\to$ ACCIÓN}. Los servicios más usados en Colombia son: (1) \textbf{Zapier} (\emph{zapier.com}, gratuito limitado, conecta 6.000+ apps), (2) \textbf{Make} (antes Integromat, más visual, plan gratuito generoso), (3) \textbf{n8n} (open source, autoinstalable, gratis si lo hospedas). Los triggers típicos: \emph{nueva fila en Google Sheets}, \emph{nuevo envío de Form}, \emph{nuevo email con asunto X}, \emph{nuevo mensaje en WhatsApp}, \emph{calendario: hora exacta}. Las acciones típicas: \emph{enviar email}, \emph{escribir fila en Sheet}, \emph{enviar WhatsApp}, \emph{crear tarea en Trello}, \emph{llamar a una API}. Aprender el patrón \texttt{trigger $\to$ acción} es la puerta de entrada a toda la automatización contemporánea sin código.
  pregunta_puente: |-
    ¿Cómo sabía el pueblo del Valle qué hacer al oír la campana sin que nadie diera la orden explícita? ¿Y qué pierde un emprendedor novato cuando hace todo a mano (copiar respuestas del Form a un Sheet, escribir emails uno a uno) en lugar de automatizar la cadena \texttt{trigger $\to$ acción}?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} qué tareas repetitivas de un proceso son candidatas a automatización; (2) \textbf{explicar} con tus palabras la diferencia entre trigger, acción y filtro, y cómo se enlazan; (3) \textbf{crear} un flujo automatizado funcional en Zapier, Make o n8n con al menos 1 trigger y 1 acción reales; (4) \textbf{evaluar} si la automatización ahorra tiempo real, qué errores podría producir, y qué supervisión humana requiere.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 mapeaste un proceso; en la 2 lo diagramaste en BPMN; en la 3 capturaste su información con Form; en la 4 estructuraste su base de datos. Hoy automatizas la \emph{cadena de acciones} que se dispara cuando llega un nuevo dato. Es el corazón de la automatización: el momento en que la herramienta deja de ser un archivo y se vuelve un sistema vivo.
  a_escuta: |-
    Antes de teorizar, vas a observar (en video o en vivo) un flujo automatizado real funcionando: alguien envía un Form $\to$ aparece fila en Sheet $\to$ llega email automático al responsable. Vas a anotar cuántos pasos hizo el humano y cuántos hizo el sistema. Esa relación es la métrica del valor real de la automatización.
  a_sistematizacion: |-
    Ya viste el flujo. Ahora vas a entender la \textbf{anatomía} del trigger: cómo se elige bien, qué condiciones aplicar (filtros), qué acciones encadenar, cómo manejar errores y cuándo el flujo necesita supervisión humana.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: crear cuenta en Zapier (o Make), conectar 2 servicios reales (el Form de sesión 3 + email, o el Sheet de sesión 4 + WhatsApp), configurar el trigger, definir la acción, probar el flujo con datos reales y capturar la ejecución exitosa.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 1 flujo automatizado activo + captura de ejecución exitosa + 1 frase de uso. El criterio principal: que el flujo \textbf{funcione sin tu intervención} para al menos 3 ejecuciones consecutivas con datos reales.
  a_evaluacion: |-
    Antes de cerrar, mira la automatización desde las cinco dimensiones humanas. Automatizar bien libera tiempo humano para tareas humanas; automatizar mal multiplica errores a escala invisible.
  a_triangulo: |-
    Y para terminar, tres voces sobre triggers y automatización. Dussel sobre las automatizaciones que excluyen, Epicteto sobre los límites de delegar al sistema, Floridi sobre la automatización como infraestructura de la economía digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Observa un flujo en acción} (15 min · grupos de 3). El docente ejecuta en vivo (o muestra video) un flujo automatizado real: un compañero envía un Google Form, todos ven cómo en segundos aparece una fila en el Sheet enlazado y llega un email automático al responsable. Anota: \emph{¿cuántos pasos hizo el humano?, ¿cuántos hizo el sistema?, ¿cuánto tiempo se ahorró respecto a hacerlo manual?}. Discute con tu grupo qué tareas repetitivas de tu proceso de sesión 1 podrías automatizar igual.
  checks:
  - Anoté pasos del humano vs pasos del sistema en el flujo demostrado.
  - Estimé el tiempo ahorrado por ejecución y por mes (si se ejecuta 30 veces).
  - Identifiqué al menos 2 tareas de mi proceso de sesión 1 que serían candidatas a automatización.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Observa un flujo en acción». \textbf{Formato:} tabla 3 columnas (Tarea~|~Hace humano~|~Hace sistema) + 1 línea con tiempo ahorrado mensual estimado + 2 candidatos para automatización de tu proceso. \textbf{Sabes que terminaste cuando} reconoces qué tareas \emph{deben} seguir siendo humanas y cuáles \emph{deberían} ser sistema.
sistematizacion:
  intro: |-
    El patrón \texttt{trigger $\to$ acción} es simple en su núcleo y rico en sus variantes. Vamos a descomponerlo con los pilares del pensamiento computacional para que toda automatización tuya tenga arquitectura, no improvisación.
  pilares:
  - |-
    La automatización se descompone en 4 piezas: (1) \textbf{Trigger} (evento que dispara): \emph{nueva fila en Sheet}, \emph{nuevo Form}, \emph{nuevo email}, \emph{hora del día}, \emph{webhook}. (2) \textbf{Filtro} (condición que decide si continuar): \emph{``solo si el campo Ciudad = Cartago''}, \emph{``solo si monto $>$ 100.000''}. (3) \textbf{Acción} (qué hace el sistema): \emph{enviar email}, \emph{escribir en Sheet}, \emph{crear evento}, \emph{enviar WhatsApp}, \emph{llamar API}. (4) \textbf{Manejo de errores}: qué pasa si la acción falla; notificación al humano, reintento, registro.
  - |-
    Toda automatización sigue el patrón \textbf{``trigger específico, filtro pertinente, acción única''}: un solo trigger por flujo, un filtro claro cuando aplique, una acción primaria (puede llevar acciones secundarias encadenadas). Triggers ambiguos producen flujos que se disparan cuando no deben; filtros vagos producen falsos positivos; acciones múltiples sin orden producen efectos cruzados.
  - |-
    Lo esencial cabe en una regla: \emph{automatizar lo que ya está mapeado y validado a mano, nunca al revés}. Si todavía no sabes cómo se hace el proceso a mano paso a paso, automatizarlo es multiplicar errores. La automatización es \emph{aceleración de lo que ya entiendes}, no atajo para no entender.
  - |-
    Algoritmo: (1) revisa el BPMN de sesión 2; (2) identifica el primer paso repetitivo que sigue al trigger natural del proceso; (3) crea cuenta en Zapier o Make; (4) configura el trigger; (5) configura la acción; (6) prueba con datos reales; (7) agrega filtro si hay falsos positivos; (8) documenta el flujo en 1 línea para quien herede el sistema.
  anatomia:
    titulo: Anatomía de una automatización bien hecha
    body: |-
      \textbf{Nombre:} qué hace el flujo en 1 frase. \\[1mm] \textbf{Trigger:} servicio + evento. \\[1mm] \textbf{Filtro:} condición si aplica. \\[1mm] \textbf{Acción principal:} servicio + qué hace. \\[1mm] \textbf{Acciones encadenadas:} (opcional) qué sigue. \\[1mm] \textbf{Manejo de error:} a quién notificar si falla. \\[1mm] \textbf{Frecuencia esperada:} cuántas veces al día/mes.
  errores_comunes: |-
    (1) Trigger demasiado amplio: \emph{``cualquier email''} en vez de \emph{``email con asunto X''}, produce ejecuciones falsas. (2) Sin filtro cuando se necesita: la acción se dispara para casos no deseados. (3) Acción no probada: el flujo \emph{``se activó''} pero la acción falló silenciosamente. (4) Sin manejo de errores: cuando algo falla, nadie se entera. (5) Automatizar antes de mapear: el flujo está bien pero el proceso no servía.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía del trigger». \textbf{Formato:} ficha con las 4 piezas (trigger, filtro, acción, manejo de error) aplicadas al flujo que vas a construir + 5 errores comunes con marca 🚨 del que más temes. \textbf{Sabes que terminaste cuando} puedes explicar a un compañero por qué cada pieza es necesaria sin recurrir a la herramienta.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu primer flujo automatizado} (30 min · individual). Hora de crear. Vas a abrir Zapier (o Make o n8n según preferencia), conectar 2 servicios reales relacionados con tu proceso (típicamente: el Form de sesión 3 + email, o el Sheet de sesión 4 + WhatsApp/email), configurar el flujo y probarlo con 3 ejecuciones reales.
  pilares:
  - |-
    Tu flujo se descompone en 5 piezas: (1) cuenta gratuita en Zapier o Make; (2) trigger conectado al servicio de origen (Form, Sheet, email); (3) acción configurada en el servicio de destino (email, otro Sheet, WhatsApp); (4) 3 pruebas reales documentadas con captura; (5) 1 línea de documentación que explique qué hace el flujo.
  - |-
    Sigue el patrón \textbf{``probar con 1 dato real antes de activar para producción''}: nunca uses datos sintéticos para validar el flujo; usa al menos 1 ejecución con dato real. La diferencia entre lo que parece funcionar y lo que funciona la encuentras solo con datos reales.
  - |-
    Cada acción debe ser reversible o tener manejo de error: si tu acción es \emph{``enviar 1.000 emails''}, una falla silenciosa puede mandar 1.000 emails equivocados. Para principiantes: empezar con acciones pequeñas (1 email, 1 fila) y escalar gradualmente.
  - |-
    Algoritmo: (1) abre zapier.com y crea cuenta; (2) clic en \emph{Create Zap}; (3) elige el trigger (servicio + evento) y conecta tu cuenta; (4) elige la acción y conecta el servicio destino; (5) mapea los campos del trigger a la acción; (6) prueba; (7) activa; (8) ejecuta 3 veces con datos reales.
  checklist:
    titulo: Checklist antes de entregar el flujo
    items: |-
      \checkbox Cuenta creada en Zapier/Make/n8n. \\[1mm] \checkbox 2 servicios conectados con OAuth o token. \\[1mm] \checkbox Trigger configurado con evento específico (no genérico). \\[1mm] \checkbox Acción configurada y probada con dato real. \\[1mm] \checkbox 3 ejecuciones exitosas documentadas con captura. \\[1mm] \checkbox 1 línea de documentación legible para quien hereda el sistema.
  plantilla_guion: |-
    \textbf{Flujo.} \textit{Nombre + servicios involucrados.} \\[1mm] \textbf{Trigger.} \textit{Servicio + evento exacto.} \\[1mm] \textbf{Filtro.} \textit{Si aplica: columna + condición.} \\[1mm] \textbf{Acción.} \textit{Servicio + qué hace + mapeo de campos.} \\[1mm] \textbf{Pruebas.} \textit{3 ejecuciones reales + captura.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi primer flujo automatizado». \textbf{Formato:} pantallazos del flujo (trigger, acción, ejecuciones exitosas) + 1 línea de uso + tiempo ahorrado estimado. \textbf{Extensión:} 1-2 páginas de cuaderno. \textbf{Sabes que terminaste cuando} alguien externo a ti envía un dato real al trigger y la acción se ejecuta sin tu intervención.
  producto_titulo: 1 flujo automatizado activo + 3 ejecuciones exitosas documentadas
  criterios:
  - Cuenta gratuita en Zapier/Make/n8n
  - 2 servicios reales conectados
  - Trigger específico (no genérico)
  - Acción probada con dato real
  - 3 ejecuciones exitosas documentadas
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda automatización decide qué errores se vuelven masivos y qué errores se quedan locales.
    aplicacion: |-
      Una automatización mal hecha puede enviar 1.000 emails con error de nombre, rechazar 500 solicitudes legítimas por filtro mal puesto, o invisibilizar 200 casos por no caber en la categoría. Lo que un humano detecta en la fila 3, el sistema lo repite hasta la fila 1.000. La phronesis de la automatización exige supervisión humana periódica: nunca \emph{``activar y olvidar''}.
    pregunta_espejo: |-
      ¿Cuánto supervisarás mi flujo después de activarlo? ¿Quién detectará si empieza a fallar para casos que el filtro nunca contempló?
  estoico:
    autor: Epicteto
    cita: |-
      Lo que delegas al sistema dejas de aprender a hacer tú mismo.
    aplicacion: |-
      Es tentador automatizar todo \emph{``para no tener que pensarlo nunca más''}. La sabiduría estoica recomienda lo contrario: \emph{automatiza lo repetitivo que ya dominas, no lo complejo que aún no entiendes}. Quien automatiza sin haber aprendido a mano queda dependiente del flujo y pierde criterio cuando falla. La automatización libera tiempo para tareas humanas; no reemplaza el oficio.
    pregunta_espejo: |-
      ¿Estoy automatizando tareas repetitivas que ya domino o estoy escondiendo bajo automatización procesos que aún no entiendo?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La automatización con triggers es la infraestructura invisible de la economía digital contemporánea.
    aplicacion: |-
      Cada vez que recibes un email automático de una compra, una notificación de un trámite o una respuesta al instante de una consulta, hay un trigger detrás. Aprender a construirlos a los 16 años es alfabetización profesional decisiva: el lenguaje con el que la economía digital ejecuta sus procesos. Quien no los entiende los recibe pasivamente; quien los entiende los diseña.
    pregunta_espejo: |-
      ¿Cuántos triggers automáticos me afectaron esta semana sin que yo notara? ¿Cuánto cambia mi posición si yo soy quien los diseña, no quien solo los recibe?
compromiso: |-
  \textbf{Para la próxima semana.} Comparte tu flujo con 3 personas reales que envíen datos al trigger; revisa las 3 ejecuciones, detecta cualquier error y ajusta el flujo. La phronesis de la automatización se entrena con datos reales, no con datos sintéticos.
web:
  resumen: |-
    Un trigger es el evento que dispara una cadena de acciones automáticas. Aprendes el patrón trigger → acción y construyes tu primer flujo funcional en Zapier, Make o n8n que conecte 2 servicios reales.
  subtema: Automatización · Triggers y acciones
  pre_lectura:
    por_que_importa: |-
      Cada email automático que recibes, cada notificación instantánea, cada respuesta inmediata es un trigger en acción. Aprender a construirlos es el lenguaje con el que la economía digital ejecuta sus procesos.
    pregunta_detonante: |-
      Si tu primo recibe 30 pedidos al día por WhatsApp y los copia a mano a un Sheet, ¿cuántas horas a la semana podrías ahorrarle con un trigger bien hecho?
    activacion:
      titulo: La campana digital
      descripcion: |-
        En 3 minutos: el docente demuestra en vivo un Zap funcionando. Un compañero envía Form → el grupo ve aparecer una fila en Sheet → llega un email automático. Cuántos pasos hizo el humano vs el sistema.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 4 estructuraste tu hoja como base de datos. Hoy automatizas la cadena que se dispara cuando llega un dato nuevo.
      siguiente: |-
        En la sesión 6 das el salto a IA: que el sistema no solo reaccione, sino que interprete con criterio (clasificación con prompt).
  conceptos_clave:
    - termino: Trigger
      definicion: |-
        Evento que dispara el flujo. Tipos comunes: nueva fila, nuevo Form, nuevo email con asunto X, hora exacta, webhook.
      ejemplo: "\"Nueva respuesta en Google Forms\" → dispara el resto del flujo automáticamente."
      emoji: "🔔"
    - termino: Acción
      definicion: |-
        Lo que el sistema hace tras el trigger. Tipos comunes: enviar email, escribir fila, enviar WhatsApp, crear tarea, llamar API.
      ejemplo: "Acción: \"enviar email a coordinacion@colegio.edu con los datos del Form\"."
      emoji: "⚡"
    - termino: Filtro
      definicion: Condición que decide si la acción se ejecuta o no. Evita disparar el flujo en casos no deseados.
      ejemplo: "Filtro: \"solo si Monto > 100.000\" — los pedidos pequeños no disparan email al gerente."
      emoji: "🎚️"
    - termino: Mapeo de campos
      definicion: |-
        Cómo se llenan los campos de la acción con los datos del trigger. Sin mapeo, la acción no sabe qué información usar.
      ejemplo: "Mapeo: campo \"Para\" del email ← campo \"email_cliente\" del Form."
      emoji: "🔗"
    - termino: Manejo de errores
      definicion: |-
        Qué pasa cuando la acción falla. Sin manejo, los errores se acumulan silenciosamente y nadie los detecta.
      ejemplo: "Si el email rebota → enviar notificación al humano + registrar en hoja de errores."
      emoji: "🚨"
    - termino: Supervisión humana
      definicion: |-
        Revisión periódica de las ejecuciones para detectar casos invisibles al filtro. Nunca "activar y olvidar".
      ejemplo: |-
        "Revisar hoja de respuestas cada lunes para detectar mensajes que el flujo marcó como rutinarios pero eran urgentes".
      emoji: "👁️"
  quiz:
    titulo: "✅ Verifica triggers y acciones"
    instrucciones: "5 preguntas para confirmar que dominas el patrón trigger → acción. Necesitas 3/5 para continuar."
    preguntas:
      - enunciado: Tu Zap se dispara cada vez que recibes CUALQUIER email. ¿Qué problema tiene?
        opciones:
          - Ninguno, es lo correcto
          - |-
            Trigger demasiado amplio — produce ejecuciones falsas; necesita filtro o trigger específico (asunto, remitente)
          - Solo necesita más velocidad
          - No tiene problema si funciona
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Trigger demasiado amplio dispara la acción para 100 emails irrelevantes por cada email importante. Usa filtro o trigger más específico.
        feedback_incorrecto: |-
          Demasiado amplio. Filtra por asunto, remitente o etiqueta para que el flujo solo se active en los casos relevantes.
      - enunciado: ¿Cuándo se justifica un filtro en el flujo?
        opciones:
          - Nunca
          - Cuando el trigger captura casos que no quieres procesar (ej. solo pagos > 100.000)
          - Solo en Make
          - Siempre
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El filtro evita ejecutar la acción cuando el caso no aplica. Sin filtro, el sistema actúa para todos los disparos.
        feedback_incorrecto: |-
          Cuando el trigger captura casos irrelevantes. El filtro es la disciplina de no actuar para todo lo que llega.
      - enunciado: ¿Por qué probar con datos reales y no sintéticos?
        opciones:
          - Es lo mismo
          - |-
            Los datos reales descubren problemas (formatos inesperados, vacíos, caracteres raros) que los sintéticos no muestran
          - Por curiosidad
          - Es opcional
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Los datos sintéticos suelen ser "ideales"; los reales tienen tildes, espacios, mayúsculas extrañas, campos vacíos. Solo lo real valida.
        feedback_incorrecto: Realidad vs idealización. Lo sintético hace que "parezca funcionar"; lo real prueba si funciona.
      - enunciado: Tu flujo se activó pero el email no llegó. ¿Cuál puede ser la causa más probable?
        opciones:
          - Magia
          - |-
            Falla silenciosa en la acción (token expirado, formato inválido, destinatario rechazó) sin manejo de errores
          - Falla del trigger
          - Falla de internet
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La acción falló silenciosamente. Sin manejo de errores, nadie se entera. Agregar notificación al humano cuando falla es indispensable.
        feedback_incorrecto: |-
          Falla silenciosa de la acción. El sistema debe tener manejo de errores: notificación al humano cuando algo no se ejecuta.
      - enunciado: En el saber ancestral de la campana, ¿qué aplica al trigger digital?
        opciones:
          - Nada
          - |-
            Un evento conocido dispara una cadena de acciones acordadas previamente — la campana es trigger heredado
          - Las campanas eran ineficientes
          - Los pueblos no usaban triggers
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El pueblo del Valle ya entendía que un evento (campana) dispara una cadena. Zapier solo lo automatiza con software.
        feedback_incorrecto: Evento conocido + cadena acordada. La sabiduría comunitaria del XX antecede al software del XXI.
  post_lectura:
    transferencia: |-
      Esta semana, comparte tu flujo con 3 personas reales, revisa las ejecuciones y ajusta. La phronesis de la automatización se entrena con datos reales y supervisión continua.
  cinco_dimensiones:
    personal: |-
      Aprendiste el lenguaje base de toda automatización contemporánea. Es ventaja transferible a cualquier emprendimiento o empleo digital.
    emocional: |-
      Resististe la tentación de "automatizar todo". El criterio sobre qué delegar al sistema es disciplina ética.
    ciudadana: |-
      Los servicios públicos automatizados usan triggers. Saber cómo funcionan te permite reclamar cuando fallan con vocabulario técnico.
    local: |-
      La campana del pueblo, el grito de la cocinera: triggers heredados. El software solo digitalizó el patrón antiguo.
    intergeneracional: |-
      Lo que tu abuelo coordinaba con campanas y avisos, tú lo coordinas con Zaps. Mismo gesto, distinto medio.

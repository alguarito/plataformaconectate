completo: true
titulo: IA en mensajería --- clasificar y responder con criterio
titulo_portada: |-
  IA en mensajería ---
  clasificar
  con criterio
producto_final: 1 sistema de clasificación de mensajes (mínimo 20 mensajes reales o simulados) con prompt afinado que separa los mensajes en 3 categorías (urgente / útil / ignorar) con justificación de cada decisión y métrica de aciertos del modelo
apertura:
  saber_ancestral: |-
    El \textbf{intermediario respetado de la plaza} de los pueblos del Valle cumplía una función social precisa: filtraba qué noticia se contaba, a quién, en qué momento. Cuando llegaba una novedad al pueblo, no se difundía cruda: pasaba por el \emph{filtro del vecino respetado} (el sacristán, la matrona, el tendero antiguo) que decidía con criterio si era \emph{urgente} (\emph{``hay que avisar al alcalde''}), \emph{útil} (\emph{``el domingo lo cuento en misa''}) o \emph{ignorable} (\emph{``rumor sin verificar''}). La \textbf{abuela jefa de la casa} hacía lo mismo con los mensajes para los niños: filtraba qué noticias del barrio se compartían en la mesa y cuáles se guardaban. Filtrar mensajes con criterio es oficio antiguo. La \textbf{IA en mensajería} es ese filtro --- pero solo es buena si el humano define las reglas con ética.
  origen: Intermediario respetado de la plaza y abuela jefa de la casa como filtros heredados
  saber_contemporaneo: |-
    La \textbf{clasificación de mensajes con IA} usa modelos de lenguaje (ChatGPT, Claude, Gemini, locales como Llama) para etiquetar automáticamente mensajes según categorías que tú defines. El insumo clave no es el modelo: es el \textbf{prompt} (la instrucción que le das al modelo). Un prompt afinado contiene: (1) \textbf{rol del modelo} (\emph{``actúa como asistente de atención al cliente''}); (2) \textbf{categorías exhaustivas y excluyentes} (\emph{urgente / útil / ignorar}); (3) \textbf{criterios precisos} para cada categoría con ejemplos; (4) \textbf{formato de salida} estructurado (JSON, etiqueta + justificación); (5) \textbf{borde de duda} (\emph{``si dudas, marca útil y deja nota''}). La regla del oficio: \emph{el modelo es solo tan bueno como el prompt; el prompt es solo tan ético como la cabeza que lo escribe}.
  pregunta_puente: |-
    ¿Cómo sabía la abuela qué noticia merecía atención inmediata, cuál podía esperar y cuál no valía la pena contar? ¿Y qué pierde un emprendedor novato cuando deja a la IA clasificar sus mensajes sin haber definido criterios éticos y reglas claras?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 5 elementos de un prompt afinado para clasificación; (2) \textbf{analizar} 10 mensajes reales y clasificarlos a mano antes de pasarlos al modelo (línea base humana); (3) \textbf{aplicar} el prompt al lote de mensajes y comparar el resultado del modelo con tu clasificación manual; (4) \textbf{evaluar} la tasa de acierto y los tipos de error del modelo, y decidir si el sistema sirve para producción o necesita afinar el prompt.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 5 automatizaste un trigger simple (\emph{``si X, haz Y''}). Hoy das el salto cualitativo: no solo \emph{detectar} un evento, sino \emph{interpretarlo} con IA para decidir qué hacer. La diferencia entre regla rígida y criterio aprendido es lo que distingue automatización clásica de IA aplicada.
  a_escuta: |-
    Antes de teorizar, vas a clasificar 10 mensajes reales (o simulados con bandeja de entrada típica) a mano, sin IA. Esa línea base es la referencia con la que evaluarás al modelo después. Sin línea base humana, no se puede medir si la IA es buena o mala.
  a_sistematizacion: |-
    Ya tienes tu clasificación humana. Ahora vas a entender la \textbf{anatomía} del prompt afinado: los 5 elementos que separan un prompt amateur de uno profesional, los errores típicos que producen alucinaciones o clasificaciones inconsistentes, los principios éticos no negociables (\emph{transparencia, supervisión, derecho a corrección}).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: redactar un prompt afinado para clasificar 20+ mensajes, ejecutarlo (ChatGPT / Claude / Gemini gratuito o en Apps Script), comparar con tu clasificación manual, medir la tasa de acierto y proponer 2 ajustes al prompt.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 1 prompt afinado + 1 hoja con 20+ mensajes clasificados por humano y por IA + métrica de aciertos + 2 ajustes propuestos. El criterio principal: que la métrica permita \textbf{decidir} si el sistema sirve para producción o no.
  a_evaluacion: |-
    Antes de cerrar, mira el sistema desde las cinco dimensiones humanas. Clasificar bien con IA libera tiempo humano; clasificar mal a escala produce daño silencioso a personas reales que nunca verás.
  a_triangulo: |-
    Y para terminar, tres voces sobre la IA en mensajería. Dussel sobre los mensajes invisibilizados por categorías, Séneca sobre la prudencia del juicio, Floridi sobre la IA como infraestructura ética de la comunicación digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Clasifica 10 mensajes a mano} (15 min · individual). El docente entrega 10 mensajes reales o simulados de una bandeja típica (chat de WhatsApp de negocio, correo de atención al cliente, comentarios de redes). Clasifica cada uno en una de 3 categorías: \emph{urgente} (requiere acción en menos de 2 horas), \emph{útil} (acción en el día), \emph{ignorar} (no aporta o es spam). Para cada uno, anota 1 frase de justificación. Esta es tu línea base humana, sin IA.
  checks:
  - Clasifiqué los 10 mensajes en una de las 3 categorías.
  - Cada mensaje tiene justificación de 1 frase.
  - Anoté qué mensajes me costaron más decidir (zona gris).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Línea base humana». \textbf{Formato:} tabla 10 filas × 4 columnas (Mensaje (resumen)~|~Categoría~|~Justificación~|~Dudoso?). \textbf{Sabes que terminaste cuando} reconoces qué mensajes son claros y cuáles caen en zona gris donde tu propio criterio dudó.
sistematizacion:
  intro: |-
    Un prompt amateur produce clasificaciones inconsistentes. Un prompt afinado produce clasificaciones reproducibles. Vamos a descomponer los 5 elementos con los pilares del pensamiento computacional para que tu prompt tenga rigor profesional.
  pilares:
  - |-
    El prompt afinado se descompone en 5 elementos: (1) \textbf{Rol}: \emph{``Eres un clasificador de mensajes de atención al cliente de una panadería del barrio''}; (2) \textbf{Categorías}: exhaustivas (cubren todos los casos) y excluyentes (cada mensaje cae en una sola). \emph{urgente / útil / ignorar}; (3) \textbf{Criterios con ejemplos}: para cada categoría, 2-3 ejemplos reales: \emph{urgente: ``llegué y la panadería está cerrada''; útil: ``¿hacen sin azúcar?''; ignorar: ``Hola \emph{emoji}''}; (4) \textbf{Formato de salida}: estructurado y máquina-legible (\emph{``responde solo en JSON: \texttt{\{categoria: ``...'', justificacion: ``...''\}}''}); (5) \textbf{Borde de duda}: qué hacer cuando el modelo no está seguro (\emph{``si dudas entre urgente y útil, marca útil y agrega flag\_revision: true''}).
  - |-
    Todo prompt sigue el patrón \textbf{``categorías exhaustivas + criterios precisos + ejemplos + borde de duda''}: si falta alguno, el modelo improvisa. Categorías incompletas producen mensajes \emph{``perdidos''}; criterios vagos producen inconsistencia; falta de ejemplos produce alucinaciones; falta de borde de duda produce sobreconfianza falsa.
  - |-
    Lo esencial cabe en una regla: \emph{el modelo nunca clasifica mejor de lo que el humano define}. Si tu prompt es ambiguo, las salidas serán ambiguas. Si tu prompt es ético, las salidas pueden ser éticas (pero hay que supervisar). Si tu prompt es discriminatorio, las salidas serán discriminatorias. La responsabilidad ética nunca se delega al modelo.
  - |-
    Algoritmo para afinar un prompt: (1) escribe primera versión con los 5 elementos; (2) pásalo por el modelo con 10 mensajes; (3) compara con tu línea base humana; (4) identifica los errores (falsos urgentes, falsos ignorables); (5) ajusta criterios y ejemplos del prompt; (6) repite hasta lograr 80\%+ de acierto en la muestra; (7) documenta la versión final con número de iteración.
  anatomia:
    titulo: Anatomía de un prompt afinado para clasificación
    body: |-
      \textbf{Rol:} contexto + autoridad del modelo. \\[1mm] \textbf{Categorías:} exhaustivas y excluyentes, con definición operativa. \\[1mm] \textbf{Criterios con ejemplos:} 2-3 ejemplos por categoría. \\[1mm] \textbf{Formato de salida:} estructurado (JSON o etiqueta+justificación). \\[1mm] \textbf{Borde de duda:} qué hacer cuando el modelo no está seguro. \\[1mm] \textbf{Restricciones éticas:} qué NO clasificar (datos sensibles, no estereotipar). \\[1mm] \textbf{Versión:} fecha + iteración del prompt.
  errores_comunes: |-
    (1) Prompt vago: \emph{``clasifica el mensaje''} sin categorías ni criterios. (2) Categorías solapadas: \emph{urgente / importante} confunden al modelo. (3) Sin ejemplos: el modelo improvisa y produce alucinaciones. (4) Sin borde de duda: el modelo \emph{``decide''} con falsa confianza. (5) Sin supervisión humana: nadie revisa los falsos positivos. (6) Asumir que el modelo entiende contexto cultural: \emph{``listo''} significa cosas distintas en Colombia y en España.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía del prompt». \textbf{Formato:} ficha con los 5 elementos del prompt aplicados a tu caso + 5 errores comunes con marca 🚨 del que más temes + 1 línea sobre el riesgo ético principal de tu sistema. \textbf{Sabes que terminaste cuando} puedes corregir un prompt ajeno señalando vocabulario técnico (\emph{``aquí faltan categorías excluyentes''}, \emph{``aquí no hay borde de duda''}).
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- Sistema de clasificación con métrica} (30 min · individual). Hora de aplicar. Redacta el prompt afinado, ejecútalo sobre 20+ mensajes reales, compara con tu línea base humana, calcula la tasa de acierto y propón 2 ajustes al prompt.
  pilares:
  - |-
    Tu sistema se descompone en 5 piezas: (1) 20+ mensajes reales o simulados de tu contexto; (2) clasificación humana hecha por ti (línea base); (3) prompt afinado con los 5 elementos; (4) clasificación del modelo aplicada al mismo lote; (5) tabla comparativa con métrica de acierto + 2 ajustes propuestos.
  - |-
    Sigue el patrón \textbf{``mide antes de creer''}: nunca asumas que el modelo clasifica bien sin medir. La tasa de acierto sobre línea base humana es el único dato confiable para decidir si el sistema sirve. Sin métrica, todo es opinión.
  - |-
    Cada ajuste al prompt se valida con re-ejecución: cambias el prompt, vuelves a ejecutar, re-mides. Si la métrica sube, el ajuste sirvió; si baja, revierte. La afinación es iterativa, no creativa: \emph{ciclo prompt $\to$ ejecutar $\to$ medir $\to$ ajustar}.
  - |-
    Algoritmo: (1) prepara tabla con 20+ mensajes; (2) clasifica a mano (línea base); (3) escribe el prompt v1; (4) pásalo por el modelo (ChatGPT, Claude, Gemini --- en chat o vía API); (5) compara y calcula \% de acierto; (6) identifica los errores; (7) ajusta prompt (v2); (8) re-ejecuta y re-mide; (9) escribe 2 propuestas concretas de mejora.
  checklist:
    titulo: Checklist antes de entregar el sistema
    items: |-
      \checkbox 20+ mensajes reales o simulados en tabla. \\[1mm] \checkbox Línea base humana completa con justificación. \\[1mm] \checkbox Prompt con los 5 elementos del oficio. \\[1mm] \checkbox Clasificación del modelo capturada. \\[1mm] \checkbox Métrica de acierto calculada (\% sobre línea base). \\[1mm] \checkbox 2 ajustes concretos al prompt con razón. \\[1mm] \checkbox Riesgo ético principal identificado y nombrado.
  plantilla_guion: |-
    \textbf{Caso.} \textit{Contexto + dueño del proceso.} \\[1mm] \textbf{Mensajes.} \textit{20+ con resumen.} \\[1mm] \textbf{Prompt v1.} \textit{Texto completo del prompt.} \\[1mm] \textbf{Resultado.} \textit{Tabla comparativa humano vs IA + \% acierto.} \\[1mm] \textbf{Ajustes propuestos.} \textit{2 mejoras al prompt con razón.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- Sistema de clasificación». \textbf{Formato:} ficha con el prompt completo + tabla 20+ filas con humano vs modelo + métrica final + 2 ajustes propuestos. \textbf{Extensión:} 1-2 páginas de cuaderno. \textbf{Sabes que terminaste cuando} puedes decir con número si tu sistema está listo para producción o necesita más afinación.
  producto_titulo: 1 sistema de clasificación con prompt afinado + métrica de acierto
  criterios:
  - 20+ mensajes con clasificación humana (línea base)
  - Prompt con los 5 elementos
  - Clasificación del modelo aplicada al mismo lote
  - Métrica de acierto calculada
  - 2 ajustes concretos propuestos con razón
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda categoría automatizada decide qué personas y qué mensajes son visibles para la institución.
    aplicacion: |-
      Una IA que clasifica reclamos como \emph{``ignorar''} en cierta jerga puede silenciar a las víctimas que no escriben con el lenguaje formal esperado. Una IA que marca como \emph{``urgente''} solo lo que viene de cierto código postal puede priorizar barrios ricos sin querer. La phronesis del clasificador exige preguntar: \emph{¿qué tipo de mensaje y qué tipo de persona queda invisibilizado por mi categoría ``ignorar''?}. La responsabilidad ética es del humano que define el prompt, no del modelo que lo ejecuta.
    pregunta_espejo: |-
      En mi sistema, ¿quién quedaría silenciado por la categoría \emph{ignorar}? ¿Qué cambia si reviso manualmente al menos 1 vez por semana lo que el modelo marcó como ignorable?
  estoico:
    autor: Séneca
    cita: |-
      El juicio prudente exige tiempo --- la IA solo simula prudencia.
    aplicacion: |-
      La IA clasifica en milisegundos, lo cual es útil para escalar pero peligroso para casos de matiz. La sabiduría estoica recomienda \emph{escalar la velocidad solo donde la velocidad no daña}. Para mensajes con matiz emocional, contexto cultural o ambigüedad, la IA debe \emph{escalar al humano} en lugar de decidir. El borde de duda en el prompt es la traducción técnica de la prudencia.
    pregunta_espejo: |-
      ¿Mi prompt tiene borde de duda real o asume que el modelo siempre puede decidir? ¿Qué tipo de mensaje merece siempre escalar a humano?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La IA aplicada a la mensajería es infraestructura ética de la comunicación digital contemporánea.
    aplicacion: |-
      Bancos, hospitales, gobiernos, plataformas usan IA para filtrar millones de mensajes diarios. Las decisiones de qué categoría asignar afectan a personas reales: deniegan créditos, retrasan diagnósticos, archivan reclamos. Aprender a diseñar estos sistemas con ética a los 16 años es alfabetización cívica decisiva: el lenguaje con el que se ejerce el poder digital sobre millones de personas.
    pregunta_espejo: |-
      ¿Cuántos sistemas de clasificación IA me afectaron esta semana sin que yo los viera? ¿Qué cambia si yo soy quien los diseña con criterios éticos explícitos?
compromiso: |-
  \textbf{Para la próxima semana.} Comparte tu sistema con un docente o emprendedor real que reciba mensajes diariamente; pide retroalimentación sobre falsos positivos o casos invisibilizados, y ajusta el prompt. La phronesis de la IA aplicada se entrena con datos reales y supervisión continua.
web:
  resumen: |-
    La IA aplicada a mensajería clasifica mensajes según categorías que tú defines. Aprendes a redactar un prompt afinado (rol + categorías + criterios + formato + borde de duda), a medir el acierto del modelo y a supervisar éticamente.
  subtema: Automatización · IA aplicada
  pre_lectura:
    por_que_importa: |-
      Bancos, hospitales, gobiernos y plataformas usan IA para clasificar millones de mensajes. Las decisiones afectan a personas reales: deniegan créditos, retrasan diagnósticos, archivan reclamos. Diseñar estos sistemas con ética es alfabetización cívica decisiva.
    pregunta_detonante: |-
      Si tu tía pierde un mensaje urgente porque su IA lo clasificó como "spam", ¿quién tiene la responsabilidad: el modelo, el ingeniero, la abuela?
    activacion:
      titulo: El filtro del barrio
      descripcion: |-
        En 3 minutos: el grupo identifica quién fue, en su barrio, el "intermediario respetado" — esa persona que filtraba noticias con criterio. ¿Qué hacía bien? ¿Qué errores cometía? La IA repite el oficio.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 5 automatizaste con triggers reglas rígidas (si X, haz Y). Hoy das el salto a IA: interpretar con criterio aprendido.
      siguiente: |-
        En la sesión 7 conectarás IA con APIs para que las decisiones del modelo disparen acciones concretas en otros servicios.
  conceptos_clave:
    - termino: Línea base humana
      definicion: |-
        Tu clasificación manual de un lote de mensajes. Es la referencia para medir si el modelo clasifica bien o mal.
      ejemplo: 10 mensajes clasificados a mano como urgente/útil/ignorar antes de pasarlos por la IA.
      emoji: "👤"
    - termino: "Prompt: Rol"
      definicion: Le dices al modelo qué función cumple. Da contexto y autoridad para responder con criterio.
      ejemplo: "\"Eres un clasificador de mensajes de atención al cliente de una panadería del barrio\"."
      emoji: "🎭"
    - termino: "Prompt: Categorías exhaustivas"
      definicion: |-
        Cubren todos los casos posibles y son excluyentes (un mensaje cae en una sola). Sin esto, el modelo improvisa.
      ejemplo: |-
        urgente / útil / ignorar — exhaustivas y excluyentes. NO usar "urgente / importante / relevante" (solapadas).
      emoji: "🗂️"
    - termino: "Prompt: Criterios con ejemplos"
      definicion: 2-3 ejemplos reales por categoría. Sin ejemplos, las clasificaciones son inconsistentes.
      ejemplo: "urgente: \"llegué y la panadería está cerrada\"; útil: \"¿hacen sin azúcar?\"; ignorar: \"Hola\"."
      emoji: "🪞"
    - termino: "Prompt: Formato de salida"
      definicion: |-
        JSON estructurado o etiqueta + justificación. Sin formato, no se puede automatizar lo que viene después.
      ejemplo: "\"Responde solo: {categoria: ..., justificacion: ..., flag_revision: ...}\"."
      emoji: "📋"
    - termino: "Prompt: Borde de duda"
      definicion: Qué hacer cuando el modelo no está seguro. Sin borde, la IA finge confianza que no tiene.
      ejemplo: "\"Si dudas entre urgente y útil, marca útil y agrega flag_revision: true para que un humano revise\"."
      emoji: "🤔"
  quiz:
    titulo: "✅ Verifica IA en mensajería"
    instrucciones: 5 preguntas para confirmar que diseñas prompts con criterio ético. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Por qué hacer línea base humana antes de pasar los mensajes por la IA?
        opciones:
          - Por trámite
          - Porque sin línea base no se puede medir si el modelo clasifica bien o mal
          - Para perder tiempo
          - No es necesario
        respuesta_index: 1
        feedback_correcto: Correcto. La línea base es la referencia. Sin ella, "el modelo clasifica bien" es opinión, no dato.
        feedback_incorrecto: |-
          Sin línea base no hay métrica. La opinión de que la IA funciona no equivale a medir su tasa de acierto.
      - enunciado: ¿Qué problema tiene usar categorías "urgente / importante / relevante"?
        opciones:
          - Ninguno
          - Son solapadas (no excluyentes); el modelo no puede decidir cuál asignar
          - Son muchas
          - Suenan formales
        respuesta_index: 1
        feedback_correcto: "Sí. Solapadas confunden al modelo. Categorías deben ser excluyentes: cada mensaje en una sola."
        feedback_incorrecto: |-
          Categorías solapadas. Si "urgente" e "importante" se traslapan, el modelo improvisa y produce inconsistencia.
      - enunciado: ¿Para qué sirve el "borde de duda" en un prompt?
        opciones:
          - Decoración
          - Para que el modelo escale al humano cuando no está seguro, en vez de fingir confianza
          - Para hacer el prompt más largo
          - No sirve
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El borde de duda es prudencia técnica. La IA debe decir "no sé, revisen humanos" en vez de adivinar.
        feedback_incorrecto: |-
          Prudencia técnica. Sin borde de duda, el modelo finge certeza que no tiene — los errores se vuelven invisibles.
      - enunciado: Tu IA clasifica como "ignorar" los reclamos en jerga callejera. ¿Cuál es el riesgo ético?
        opciones:
          - Ninguno
          - |-
            Silencia a las personas que no escriben con lenguaje formal — los más vulnerables suelen ser los más invisibilizados
          - Solo problema técnico
          - Se arregla con más datos
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Las categorías automatizadas reproducen sesgos. La phronesis exige revisar manualmente lo que el modelo marcó como "ignorar" para detectar exclusiones.
        feedback_incorrecto: |-
          Riesgo ético grave. La IA puede silenciar a quienes la institución ya silencia. Supervisión humana de la categoría "ignorar" es indispensable.
      - enunciado: En el saber ancestral del intermediario de la plaza, ¿qué aplica a la IA?
        opciones:
          - Nada
          - |-
            Filtrar mensajes con criterio ético es oficio antiguo; la IA solo escala el gesto si el humano define bien las reglas
          - Que los intermediarios eran perfectos
          - Que hoy ya no se necesita
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El intermediario filtraba con criterio comunitario; la IA escala con criterio que tú defines. La responsabilidad ética siempre es humana.
        feedback_incorrecto: |-
          Criterio ético humano. La IA solo replica las reglas que tú escribes — la ética sigue siendo de quien diseña el prompt.
  post_lectura:
    transferencia: |-
      Esta semana, comparte tu sistema con un docente o emprendedor que reciba mensajes a diario; pide retroalimentación sobre falsos positivos o casos invisibilizados, y ajusta el prompt.
  cinco_dimensiones:
    personal: |-
      Aprendiste a aplicar IA con disciplina técnica y ética. Es ventaja transferible a cualquier emprendimiento o empleo que use IA.
    emocional: |-
      Resististe la tentación de "confiar ciegamente en la IA". El criterio sobre cuándo escalar al humano es virtud profesional.
    ciudadana: |-
      Las instituciones que te afectan usan IA. Saber diseñarla con ética te permite criticarla con argumento y construirla con responsabilidad.
    local: |-
      El intermediario de la plaza, la abuela jefa de la casa: filtros heredados con criterio comunitario. La IA traduce ese oficio a escala.
    intergeneracional: |-
      Lo que tu abuela hacía a mano con criterio comunitario, tú lo escalas con prompt afinado. La phronesis es la misma; el medio, nuevo.

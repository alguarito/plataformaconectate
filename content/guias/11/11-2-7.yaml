clave: 2-7
grado: 11
periodo: 2
sesion: 7
completo: true
titulo: Chatbots sin código --- flujos de conversación
titulo_portada: |-
  Chatbots ---
  sin código
  flujos de conversación
producto_final: 1 bot conversacional funcional construido en ManyChat o Landbot (planes gratuitos) con un mínimo de 5 ramas lógicas, captura de información estructurada hacia hoja de cálculo, mensaje de bienvenida cordial y \emph{escape humano} explícito (botón o frase que entrega la conversación a una persona real)
apertura:
  saber_ancestral: |-
    El \textbf{loro} que repetía las palabras del dueño, el \textbf{muñeco oracular} de los abuelos al que se le hacían preguntas y respondía con frases ensayadas, las \textbf{tarjeticas de respuesta rápida} del comerciante de plaza que tenía 7 frases listas para 7 preguntas frecuentes (\emph{``¿cuánto cuesta?''}, \emph{``¿hay descuento?''}, \emph{``¿lo trae a domicilio?''}): todos son antecesores del chatbot. Compartían una sabiduría: \emph{cuando la pregunta se repite, la respuesta se prepara}. La \textbf{tendera del barrio} respondía 50 veces al día \emph{``no, el yogurt llegó dañado, devuélvalo''}; el chatbot moderno responde lo mismo, pero a 5.000 personas al mismo tiempo. Es el \emph{loro escalable}.
  origen: Loro repetidor, muñeco oracular, tarjeticas del comerciante y tendera del barrio
  saber_contemporaneo: |-
    Un \textbf{chatbot} es un sistema conversacional que responde mensajes siguiendo un \emph{flujo} de preguntas y respuestas predefinidas (con o sin IA). Las plataformas \emph{sin código} más usadas en Colombia son: (1) \textbf{ManyChat} (especializado en WhatsApp Business e Instagram); (2) \textbf{Landbot} (más visual, para webs y WhatsApp); (3) \textbf{Tidio} (chat web + WhatsApp); (4) \textbf{Chatfuel} (Facebook Messenger). Un buen flujo conversacional tiene: bienvenida cordial, opciones claras (botones o respuestas rápidas), recopilación de información estructurada, ramificación lógica según respuestas, y --- regla innegociable --- un \textbf{escape humano} explícito (\emph{``escribe AGENTE para hablar con una persona''}). Sin escape, el bot deja de ser servicio y se vuelve trampa.
  pregunta_puente: |-
    ¿Cómo sabía la tendera qué 7 preguntas frecuentes valía la pena memorizar y cuáles no? ¿Y qué pierde un emprendedor novato cuando arma un chatbot infinito sin botón de escape, que atrapa al cliente en un laberinto del que no puede salir?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 5 partes de un flujo conversacional bien diseñado y sus reglas mínimas; (2) \textbf{explicar} con tus palabras la diferencia entre flujo lineal y flujo con ramificación, y cuándo conviene cada uno; (3) \textbf{crear} un bot funcional en ManyChat o Landbot con 5 ramas + escape humano + captura a hoja; (4) \textbf{evaluar} la calidad del bot probándolo con 3 personas reales y midiendo \emph{tasa de finalización} y \emph{frustración subjetiva}.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 5 automatizaste triggers; en la 6 aprendiste a clasificar mensajes con IA. Hoy unes ambas en una sola interfaz conversacional: el chatbot. Es el momento donde la automatización deja de ser \emph{``detrás del escenario''} y se vuelve \emph{frente al cliente}.
  a_escuta: |-
    Antes de teorizar, vas a conversar con 2 chatbots reales (uno bueno, uno malo) y a anotar cuál te resolvió y cuál te frustró. Esa experiencia de usuario es la mejor escuela de diseño conversacional.
  a_sistematizacion: |-
    Ya viste el contraste. Ahora vas a entender la \textbf{anatomía} del flujo bien diseñado: bienvenida, ramificación, captura de información, escape humano, despedida; y los errores típicos: laberinto sin salida, opciones ambiguas, captura excesiva de datos, ausencia de fallback.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: elegir plataforma (ManyChat o Landbot, ambas gratuitas), diseñar el flujo con 5 ramas + escape humano + conexión a hoja, probarlo personalmente, ajustar y compartir URL pública.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 1 bot conversacional funcional + URL pública + captura del flujo + 3 conversaciones de prueba. El criterio principal: que un usuario externo termine la conversación con \textbf{problema resuelto} o con \textbf{conexión a un humano} --- nunca atrapado.
  a_evaluacion: |-
    Antes de cerrar, mira el chatbot desde las cinco dimensiones humanas. Conversar bien es respeto por el tiempo del cliente; conversar mal es robo escalado de minutos a miles de personas.
  a_triangulo: |-
    Y para terminar, tres voces sobre la conversación automatizada. Dussel sobre los bots que excluyen al cliente vulnerable, Marco Aurelio sobre la cortesía como virtud técnica, Floridi sobre el chatbot como infraestructura de atención del XXI.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Conversa con 2 bots reales} (15 min · individual). El docente comparte 2 chatbots reales activos (uno bien hecho de una empresa colombiana, otro mal hecho que da vueltas sin resolver). Mantén una conversación de 5 minutos con cada uno intentando resolver una consulta concreta. Anota: cuánto demoraste, cuántas veces te repetiste, si te atascaste en un bucle, si hubo escape humano disponible, si tu problema se resolvió.
  checks:
  - Mantuve conversación real con los 2 bots durante al menos 5 minutos cada uno.
  - Anoté para cada uno: tiempo, repeticiones, bucles, escape disponible, resolución.
  - Identifiqué al menos 2 diferencias concretas de diseño entre el bot bueno y el malo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Conversa con 2 bots». \textbf{Formato:} tabla 2 filas (un bot por fila) × 5 columnas (Tiempo~|~Repeticiones~|~Bucles~|~Escape humano~|~Resuelto). Al final 2 líneas con diferencias clave. \textbf{Sabes que terminaste cuando} puedes describir qué hace bueno o malo a un chatbot sin recurrir a vocabulario técnico.
sistematizacion:
  intro: |-
    Un flujo conversacional bien diseñado parece simple pero tiene reglas estrictas. Vamos a descomponerlas con los pilares del pensamiento computacional para que cada decisión del flujo tenga razón profesional, no improvisación.
  pilares:
  - |-
    El flujo se descompone en 5 partes: (1) \textbf{Bienvenida}: 1-2 frases cordiales que dicen quién es el bot y qué puede hacer. (2) \textbf{Opciones iniciales}: 3-5 botones que cubren las consultas más frecuentes. (3) \textbf{Ramificación}: cada opción lleva a un sub-flujo distinto (lineal o con sub-opciones). (4) \textbf{Captura de información}: cuando el bot pide datos del usuario (nombre, email, pedido) se guardan en hoja de cálculo. (5) \textbf{Cierre + escape humano}: cada rama termina con resolución o con \emph{``escribe AGENTE''} para hablar con persona real.
  - |-
    Todo flujo sigue el patrón \textbf{``profundidad máxima de 3 niveles''}: si el usuario tiene que apretar más de 3 botones para llegar a su respuesta, el flujo está mal diseñado. Cada nivel multiplica la tasa de abandono. La regla del oficio: \emph{tres clicks o escape}.
  - |-
    Lo esencial cabe en una regla: \emph{el escape humano es derecho del usuario, no decisión del diseñador}. Cada rama del flujo debe tener salida hacia un humano disponible. Sin escape, el chatbot deja de ser servicio y se vuelve obstáculo. Esta regla es ética antes que técnica.
  - |-
    Algoritmo para construir un flujo: (1) lista las 5-7 consultas más frecuentes del proceso real; (2) prioriza por volumen; (3) diseña la pantalla de bienvenida con 3-5 botones; (4) construye cada rama hasta profundidad 3; (5) agrega escape humano en cada rama; (6) conecta captura a hoja; (7) prueba personalmente la conversación 3 veces.
  anatomia:
    titulo: Anatomía de un flujo conversacional
    body: |-
      \textbf{Bienvenida:} 1-2 frases con identidad del bot. \\[1mm] \textbf{Menú principal:} 3-5 botones u opciones rápidas. \\[1mm] \textbf{Ramas:} hasta profundidad 3, cada una con propósito claro. \\[1mm] \textbf{Captura:} pregunta datos cuando es necesario y los guarda en hoja. \\[1mm] \textbf{Cierre:} resolución o escape humano explícito. \\[1mm] \textbf{Fallback:} qué dice el bot cuando no entiende (no \emph{``error''}, sino \emph{``permite que te conecte con un humano''}).
  errores_comunes: |-
    (1) Bucles infinitos: rama que regresa al menú sin avanzar. (2) Opciones ambiguas (\emph{``más''}, \emph{``otro''}): el usuario no sabe qué eligen. (3) Sin escape humano: el usuario queda atrapado. (4) Captura excesiva (pedir 12 datos para responder \emph{``¿qué horario tienen?''}): el usuario abandona. (5) Profundidad mayor a 3 niveles: pérdida de paciencia exponencial.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía del flujo». \textbf{Formato:} ficha con las 5 partes + 5 errores comunes con marca 🚨 del que más temes + 1 boceto a mano alzada del flujo de tu bot. \textbf{Sabes que terminaste cuando} podrías auditar un chatbot ajeno señalando con vocabulario técnico qué falla.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu chatbot funcional} (30 min · individual). Hora de aplicar. Eliges plataforma (ManyChat o Landbot, ambas gratuitas con cuenta), diseñas el flujo con 5 ramas + escape humano + captura a hoja, lo pruebas tú mismo, ajustas y lo compartes con compañeros.
  pilares:
  - |-
    Tu bot se descompone en 5 piezas: (1) cuenta gratuita en ManyChat o Landbot; (2) flujo con bienvenida, menú y 5 ramas claras; (3) captura de al menos 2 datos en hoja enlazada; (4) escape humano configurado en cada rama; (5) 3 conversaciones de prueba documentadas con captura.
  - |-
    Sigue el patrón \textbf{``cortesía + brevedad + escape''}: cada mensaje del bot debe ser cordial, breve y debe tener al menos 1 opción de avance + 1 opción de escape. Ningún mensaje del bot debe quedar sin salida.
  - |-
    Cada rama termina con resolución (\emph{``listo, tu pedido se registró''}) o con escape (\emph{``te conecto con un asesor''}). Nunca con \emph{``opción inválida, vuelve al menú''} sin salida humana. Ese es el bot tramposo.
  - |-
    Algoritmo: (1) crea cuenta; (2) elige plantilla (FAQ, captura de leads, pedidos); (3) personaliza bienvenida; (4) configura 5 ramas con sus respuestas; (5) agrega botón \emph{``Hablar con humano''} en cada rama; (6) enlaza captura a hoja (Google Sheets); (7) prueba 3 veces como usuario; (8) comparte URL pública.
  checklist:
    titulo: Checklist antes de entregar el bot
    items: |-
      \checkbox Bienvenida cordial con identidad clara. \\[1mm] \checkbox 3-5 botones en el menú principal. \\[1mm] \checkbox 5 ramas con profundidad máxima de 3 niveles. \\[1mm] \checkbox Captura de al menos 2 datos enlazada a hoja. \\[1mm] \checkbox Escape humano disponible en cada rama. \\[1mm] \checkbox 3 conversaciones de prueba completadas exitosamente. \\[1mm] \checkbox URL pública lista para compartir.
  plantilla_guion: |-
    \textbf{Bot.} \textit{Nombre + propósito + dueño del proceso.} \\[1mm] \textbf{Bienvenida.} \textit{Frase exacta.} \\[1mm] \textbf{Menú principal.} \textit{3-5 botones con texto exacto.} \\[1mm] \textbf{Rama 1-5.} \textit{Cada una con sub-flujo + escape humano + captura si aplica.} \\[1mm] \textbf{Hoja enlazada.} \textit{URL + columnas que recibe.} \\[1mm] \textbf{Pruebas.} \textit{3 conversaciones reales.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi chatbot funcional». \textbf{Formato:} pantallazos del flujo + URL pública + checklist marcado + 1 línea por rama explicando qué consulta resuelve. \textbf{Extensión:} 1-2 páginas de cuaderno. \textbf{Sabes que terminaste cuando} compartiste el bot con 3 compañeros y los 3 terminaron la conversación con problema resuelto o con conexión a humano.
  producto_titulo: 1 chatbot conversacional con 5 ramas + escape humano + captura a hoja
  criterios:
  - Bienvenida cordial e identidad clara
  - 5 ramas con profundidad máxima de 3 niveles
  - Captura enlazada a hoja
  - Escape humano en cada rama
  - 3 pruebas exitosas con conversaciones reales
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Todo chatbot decide quién recibe respuesta humana y quién queda atrapado en el laberinto del menú.
    aplicacion: |-
      Un chatbot sin escape humano deja a las personas de mayor edad, con menor alfabetización digital o con consultas complejas en una trampa: dan vueltas, no resuelven, abandonan. La phronesis del diseño exige que el escape humano sea visible, fácil y disponible en todo momento. Quien diseña un bot sin escape excluye a quienes más necesitan atención personal: la población vulnerable no entra en los 5 botones del menú.
    pregunta_espejo: |-
      ¿Mi bot ofrece escape humano en cada rama o solo en el menú principal? ¿Quién quedaría atrapado si el escape estuviera oculto o demasiado lejos del flujo?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La cortesía es virtud técnica antes que adorno social.
    aplicacion: |-
      Es tentador escribir mensajes técnicos secos (\emph{``ingrese cédula''}, \emph{``opción no válida''}). La sabiduría estoica recomienda lo contrario: \emph{la cortesía en cada mensaje del bot es respeto al usuario que escribe del otro lado}. Un \emph{``por favor''}, un \emph{``gracias''}, un \emph{``te entendí''} no son adornos: son la diferencia entre un servicio que cuida y uno que procesa. La cortesía a escala es virtud política.
    pregunta_espejo: |-
      ¿Los mensajes de mi bot tratan al usuario como persona o como código a procesar? ¿Qué pasaría si los leo en voz alta a mi abuela: ¿le sonarían cordiales?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los chatbots son la primera línea de atención al ciudadano en la economía digital contemporánea.
    aplicacion: |-
      Bancos, EPS, alcaldías, plataformas educativas: la mayoría de la atención al ciudadano contemporáneo inicia con un chatbot. Diseñarlos con criterio a los 16 años es alfabetización profesional decisiva: el lenguaje con el que las organizaciones reciben a las personas. Quien diseña bots cuida o daña al ciudadano antes de que llegue al humano detrás.
    pregunta_espejo: |-
      ¿Cuántos chatbots me atendieron esta semana? ¿Cuántos me ayudaron y cuántos me obligaron a abandonar? ¿Qué aprendí del diseño respondiéndolos?
compromiso: |-
  \textbf{Para la próxima semana.} Comparte tu bot con 3 personas reales (familiares, vecinos, compañeros) y mide la tasa de finalización: \emph{¿cuántos terminaron con problema resuelto?, ¿cuántos abandonaron?, ¿cuántos usaron el escape humano?}. Ajusta el flujo según los resultados. La phronesis del bot se entrena con conversaciones reales.
web:
  resumen: |-
    Un chatbot es el "loro escalable" del oficio digital. Aprendes a diseñar un flujo conversacional con 5 ramas, captura a hoja y escape humano explícito, sin escribir una sola línea de código.
  subtema: Automatización · Conversación automatizada
  pre_lectura:
    por_que_importa: |-
      Bancos, EPS, alcaldías y plataformas inician la atención al ciudadano con un chatbot. Diseñarlos con criterio decide si la institución cuida o atrapa al usuario.
    pregunta_detonante: |-
      Si tu primo recibe 100 mensajes al día por WhatsApp con preguntas repetidas, ¿cómo le ahorras horas sin perder cortesía con sus clientes?
    activacion:
      titulo: El loro escalable
      descripcion: |-
        En 3 minutos: los estudiantes nombran qué 5-7 preguntas frecuentes recibe la portería del colegio. Reconocen que esos son los candidatos naturales a chatbot.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 6 aprendiste a clasificar mensajes con IA. Hoy unes esa lógica con automatización de triggers en una sola interfaz: el chatbot.
      siguiente: |-
        En la sesión 8 mides si el sistema completo funciona, con 5 KPIs que digan con número la salud del proceso.
  conceptos_clave:
    - termino: Bienvenida
      definicion: 1-2 frases cordiales que identifican al bot y describen qué puede hacer.
      ejemplo: "\"¡Hola! Soy el asistente de Panadería Cartago. Puedo ayudarte con pedidos, horarios o reclamos.\""
      emoji: "👋"
    - termino: Menú principal
      definicion: 3-5 botones u opciones rápidas que cubren las consultas más frecuentes.
      ejemplo: "[Hacer pedido] [Ver horarios] [Reclamo] [Hablar con humano]."
      emoji: "📋"
    - termino: Ramificación con profundidad máxima 3
      definicion: Cada opción lleva a un sub-flujo. Más de 3 niveles produce abandono exponencial.
      ejemplo: "Pedido → ¿tipo? → confirmar → fin (3 niveles, OK)."
      emoji: "🌳"
    - termino: Captura de información
      definicion: El bot pide datos del usuario (nombre, email, pedido) y los guarda en hoja enlazada.
      ejemplo: "Bot: \"¿Cuál es tu nombre?\" → guarda en hoja \"Pedidos\" automáticamente."
      emoji: "📝"
    - termino: Escape humano
      definicion: "Regla innegociable: cada rama debe tener salida hacia un humano disponible."
      ejemplo: "En cada paso: botón [Hablar con humano] o frase \"escribe AGENTE para hablar con persona real\"."
      emoji: "🆘"
    - termino: Fallback
      definicion: Mensaje cuando el bot no entiende. No "error", sino conexión a humano.
      ejemplo: "\"Disculpa, no entendí. Te conecto con un asesor\" (no \"Opción inválida\")."
      emoji: "🤝"
  quiz:
    titulo: "✅ Verifica chatbots sin código"
    instrucciones: 5 preguntas para confirmar que diseñas flujos conversacionales con criterio. Necesitas 3/5.
    preguntas:
      - enunciado: Tu bot tiene un menú con 12 opciones. ¿Cuál es el problema?
        opciones:
          - Ninguno, más es mejor
          - El usuario no procesa más de 5-7 opciones a la vez — abandona
          - Es lento
          - Faltan colores
        respuesta_index: 1
        feedback_correcto: Correcto. 3-5 botones es el rango funcional. 12 produce fatiga inmediata y abandono.
        feedback_incorrecto: Demasiadas opciones. El cerebro humano prioriza 5-7 max. Agrupa en categorías o usa sub-menús.
      - enunciado: ¿Por qué el escape humano es regla innegociable?
        opciones:
          - Por capricho
          - |-
            Porque sin escape, el bot atrapa al usuario que necesita atención personal — especialmente a los más vulnerables
          - Solo si es legal
          - No es necesario
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El escape humano es derecho del usuario, no decisión del diseñador. Sin él, el bot deja de ser servicio.
        feedback_incorrecto: |-
          Es derecho del usuario. Las personas mayores, con baja alfabetización o con consultas complejas necesitan salida hacia un humano.
      - enunciado: Tu bot dice "Opción inválida, vuelve al menú" cuando no entiende. ¿Qué corrige?
        opciones:
          - Nada
          - |-
            Cambiar el fallback por "Disculpa, no entendí. Te conecto con un asesor" — conectar a humano en vez de rebotar
          - Quitarlo
          - Hacerlo más bonito
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. "Opción inválida" trata al usuario como error; el fallback debe ofrecer humano, no castigo.
        feedback_incorrecto: "Conectar a humano. El bot no entiende → no es culpa del usuario → ofrece salida cordial."
      - enunciado: ¿Cuándo tiene sentido pedir 10 datos al inicio de la conversación?
        opciones:
          - Siempre
          - "Casi nunca: la captura excesiva produce abandono; pide solo lo necesario para la rama elegida"
          - Si el bot es comercial
          - En todas las plataformas
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Pedir datos sin justificación = abandono. Pide solo lo necesario para resolver la consulta actual.
        feedback_incorrecto: |-
          Captura mínima. Cada dato adicional aumenta abandono. Pregunta solo cuando vas a usar la respuesta de inmediato.
      - enunciado: En el saber ancestral del loro y la tendera, ¿qué aplica al chatbot?
        opciones:
          - Nada
          - |-
            Cuando la pregunta se repite, la respuesta se prepara — la tendera ya era chatbot, solo cambió la escala
          - Que los loros son obsoletos
          - Las tarjeticas no servían
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La tendera respondía 50 veces al día las mismas frases. El bot lo hace a 5.000. Mismo gesto, distinta escala.
        feedback_incorrecto: |-
          Gesto antiguo a escala nueva. El oficio de preparar respuestas frecuentes existe hace siglos; el software solo lo escala.
  post_lectura:
    transferencia: |-
      Esta semana, comparte tu bot con 3 personas reales y mide tasa de finalización. Ajusta el flujo según resultados.
  cinco_dimensiones:
    personal: |-
      Aprendiste a construir un servicio conversacional sin código. Es ventaja transferible a cualquier emprendimiento.
    emocional: Resististe la tentación de "atrapar" al usuario en menús. La cortesía técnica es disciplina ética.
    ciudadana: |-
      Los bots públicos atienden o atrapan a millones. Diseñar con escape humano es ejercicio de cuidado ciudadano.
    local: |-
      El loro, el muñeco oracular, la tendera con sus 7 respuestas: oficios del XX que el software escala al XXI.
    intergeneracional: |-
      Lo que la tendera repetía cara a cara, tú lo automatizas con cortesía. Mismo cuidado, distinta escala.

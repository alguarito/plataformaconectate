clave: 3-1
grado: 11
periodo: 3
sesion: 1
completo: true
titulo: Ideación --- un problema real de mi comunidad
titulo_portada: |-
  Ideación ---
  un problema real
  de mi comunidad
producto_final: Lista de 10 problemas observados en Cartago/Valle del Cauca + 1 problema elegido con justificación de 1 párrafo (dolor concreto, a quién afecta, por qué a ti) + ficha de oportunidad inicial con 5 campos (problema, afectados, causa visible, consecuencia medible, hipótesis de solución)
apertura:
  saber_ancestral: |-
    En los pueblos del Valle del Cauca, los oficios no nacían de la imaginación de un emprendedor genial: nacían de \textbf{escuchar la queja del vecino}. El \textbf{tendero} abría tienda porque la abuela del barrio caminaba dos horas para comprar panela; el \textbf{ebanista} ponía taller porque las casas nuevas necesitaban puertas que duraran; la \textbf{partera} aprendía el oficio porque las mujeres morían dando a luz lejos del hospital. El emprendimiento campesino y barrial empezaba con tres prácticas: (1) \textbf{caminar} el territorio escuchando lo que falta; (2) \textbf{nombrar} con claridad el dolor concreto, no la idea abstracta; (3) \textbf{responder} con un oficio reproducible, no con una solución improvisada. No había \emph{startup} ni \emph{pitch}: había necesidad real más oficio que respondía. Esa tradición se traduce hoy en una palabra fea pero exacta: \emph{ideación basada en observación}.
  saber_contemporaneo: |-
    La \textbf{ideación} en emprendimiento contemporáneo es exactamente lo opuesto de \emph{``se me ocurrió una idea genial''}. Es la práctica disciplinada de \textbf{observar problemas reales antes de proponer soluciones}. Los métodos modernos (Design Thinking, Lean Startup, Customer Discovery) ponen la observación al inicio y la idea al final, no al revés. La regla profesional: \textbf{enamórate del problema, no de la solución}. Un problema bien definido tiene 5 partes: (1) \emph{quién} lo sufre con nombre y oficio; (2) \emph{qué duele} en términos medibles (tiempo perdido, dinero gastado, oportunidad cerrada); (3) \emph{cuándo} ocurre el dolor (frecuencia); (4) \emph{por qué} aún no se ha resuelto; (5) \emph{qué hace} la persona hoy para sobrellevarlo. Si las 5 partes no están claras, todavía no tienes problema: tienes una idea suelta.
  pregunta_puente: |-
    ¿Cómo sabía el tendero del barrio que su oficio era necesario antes de abrir la tienda? ¿Y qué pierde un estudiante de grado 11 cuando arranca su proyecto emprendedor con \emph{``se me ocurrió una idea''} en lugar de \emph{``observé este dolor concreto en mi comunidad''}?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 10 problemas reales observados en Cartago, en tu casa, colegio o barrio, sin censurarlos por dificultad; (2) \textbf{analizar} cada problema con la rejilla de 5 partes (quién, qué duele, cuándo, por qué no resuelto, qué hace hoy); (3) \textbf{evaluar} los 10 candidatos con 3 criterios objetivos (dolor real, viabilidad de medición, cercanía); (4) \textbf{crear} la ficha de oportunidad de 1 problema elegido con justificación honesta de por qué a ti, no a otro estudiante.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Este periodo cierra el bachillerato técnico: construirás un \textbf{proyecto emprendedor} de punta a punta. Hoy abrimos con lo más difícil y lo más subestimado: \textbf{elegir el problema correcto}. Las próximas 9 sesiones (validación, modelo, prototipo, marca, finanzas, pitch, sustentación) dependen de la calidad de la elección de hoy.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{caminata mental} por tu territorio. Vas a anotar 10 problemas observados con tus propios ojos en Cartago, sin filtrar todavía por viabilidad ni por idea de solución. La regla: solo dolores que has \textbf{visto pasar}, no dolores que crees que existen.
  a_sistematizacion: |-
    Ya tienes 10 candidatos. Ahora vas a entender la \textbf{anatomía} de un problema bien definido: las 5 partes obligatorias, los errores típicos (problema vago, problema importado de internet, problema sin afectados nombrables) y la diferencia entre \emph{problema} y \emph{tema}.
  a_praxis: |-
    Tienes el método. Toca elegir: aplicar los 3 criterios objetivos a tus 10 candidatos, descartar los 9 más débiles con honestidad, y redactar la ficha de oportunidad del problema ganador. Es trabajo de selección, no de adición.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 10 problemas observados + 1 elegido con ficha de 5 campos completos + justificación de 1 párrafo de \emph{por qué a ti}. El criterio principal: que un emprendedor o consultor leyendo tu ficha pueda decir \emph{``este problema existe y vale la pena resolverlo''} sin pedirte explicaciones adicionales.
  a_evaluacion: |-
    Antes de cerrar, mira la elección desde las cinco dimensiones humanas. Elegir un problema real es respeto por el oficio entero; elegir un problema cómodo es engañar al periodo entero.
  a_triangulo: |-
    Y para terminar, tres voces sobre la observación y la elección. Dussel sobre los dolores que el sistema invisibiliza, Marco Aurelio sobre la disciplina de mirar sin ilusión, Floridi sobre la responsabilidad ética de elegir qué problema atender en un mundo lleno de necesidades.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 10 problemas observados en mi territorio} (20 min · individual). Sin filtrar todavía por viabilidad ni por idea de solución, anota 10 problemas reales que has \emph{visto pasar} en Cartago en los últimos 6 meses. Tres reglas: (1) problemas \textbf{observados}, no leídos en internet ni copiados de otro emprendimiento; (2) cada problema con \textbf{una persona concreta} que lo sufra (un familiar, un vecino, un docente, un compañero); (3) sin proponer todavía solución, solo describir el dolor en 1-2 líneas. Cubre 3 escenarios: tu casa (3 problemas), tu colegio o barrio (4 problemas), tu ciudad o un microemprendimiento que conoces (3 problemas).
  checks:
  - Anoté 10 problemas observados directamente, sin copiar de internet.
  - Cada problema tiene una persona concreta que lo sufre.
  - No propuse solución todavía: solo describí el dolor.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 10 problemas observados». \textbf{Formato:} tabla 10 filas × 3 columnas (Problema observado~|~Persona concreta que lo sufre~|~Dónde lo vi pasar). \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} tienes 10 dolores reales con nombres reales, no temas abstractos.
sistematizacion:
  intro: |-
    Diez candidatos sin orden son ruido. Para elegir bien necesitas la \textbf{anatomía del problema profesional}: las 5 partes que separan un dolor real de una idea suelta. Esta sección descompone el oficio para que tu elección de hoy sostenga las 9 sesiones siguientes.
  pilares:
  - |-
    Un problema bien definido se descompone en 5 partes: (1) \textbf{Afectado}: persona concreta con oficio y contexto (no \emph{``los jóvenes''}, sino \emph{``María, vendedora de empanadas del parque, 47 años''}). (2) \textbf{Dolor medible}: tiempo, dinero, frecuencia (no \emph{``pierde plata''}, sino \emph{``pierde 30 mil pesos a la semana en mercancía que se daña''}). (3) \textbf{Frecuencia}: diaria, semanal, mensual; problemas raros no merecen oficio entero. (4) \textbf{Causa visible}: por qué el problema persiste hoy (no es ignorancia ni pereza; es un sistema que falla). (5) \textbf{Apaño actual}: qué hace la persona hoy para sobrellevarlo (esto revela el verdadero costo).
  - |-
    El patrón profesional se llama \textbf{``problema vs tema''}: un \emph{tema} es \emph{``la educación en Cartago''}; un \emph{problema} es \emph{``Carlos, docente de la sede rural, gasta 4 horas semanales transcribiendo notas a mano porque no hay sistema digital''}. La diferencia: el tema invita a ensayo filosófico; el problema invita a oficio. Tu proyecto necesita problema, no tema. La phronesis del emprendedor consiste en \textbf{bajar de la nube del tema a la tierra del problema}.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿puedo llamar por teléfono a la persona afectada esta semana?}. Si la respuesta es no, todavía no tienes problema. Tienes una hipótesis. La validación de la próxima sesión exige al menos 5 personas reales contactables. Sin nombres concretos hoy, no hay validación posible mañana.
  - |-
    Algoritmo de evaluación: (1) revisa tus 10 candidatos; (2) marca con check los que tienen afectado nombrable; (3) marca con check los que tienen dolor medible en tiempo o dinero; (4) marca con check los que ocurren al menos una vez por semana; (5) descarta los que no tienen 3 marcas; (6) entre los que quedan, elige el que más te \emph{importa a ti} (no el más fácil, no el más rentable, el que te exige el oficio que quieres aprender).
  anatomia:
    titulo: Anatomía del problema bien definido
    body: |-
      \textbf{Afectado:} nombre + oficio + edad. \\[1mm] \textbf{Dolor:} cuánto cuesta (tiempo o dinero). \\[1mm] \textbf{Frecuencia:} cada cuánto ocurre. \\[1mm] \textbf{Causa visible:} qué sostiene el problema hoy. \\[1mm] \textbf{Apaño actual:} qué hace la persona para sobrellevarlo.
  errores_comunes: |-
    (1) Problema sin afectado nombrable (\emph{``los jóvenes no leen''}): no se puede validar. (2) Problema importado de TikTok o internet: no es tu observación. (3) Tema en lugar de problema (\emph{``la salud mental''}): demasiado amplio para 10 sesiones. (4) Problema sin dolor medible: no podrás demostrar mejora. (5) Solución disfrazada de problema (\emph{``la falta de una app de delivery''} no es problema; es ya tu hipótesis de solución; el problema sería \emph{``los tenderos del barrio pierden ventas porque no tienen forma de avisar a sus clientes regulares''}). (6) Problema que no te importa a ti: lo abandonarás en la sesión 5.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía del problema». \textbf{Formato:} para tus 10 candidatos, columna de evaluación con 3 marcas (afectado nombrable, dolor medible, frecuencia semanal o mayor). Al final, lista de los que pasaron las 3 marcas. \textbf{Sabes que terminaste cuando} tienes una lista corta de 2-4 finalistas justificada con datos, no con corazonadas.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- Ficha de oportunidad del problema elegido} (25 min · individual). Hora de elegir y redactar. De los finalistas que pasaron las 3 marcas, elige uno aplicando un cuarto criterio: \emph{¿este problema me importa a mí?}. Luego redacta la ficha de oportunidad con 5 campos completos y la justificación honesta de por qué te lo quedas tú.
  pilares:
  - |-
    Tu ficha de oportunidad se descompone en 5 campos: (1) \textbf{Problema}: 1 oración con afectado + dolor + frecuencia. (2) \textbf{Afectados}: nombres concretos (al menos 3 personas que podrías llamar esta semana). (3) \textbf{Causa visible}: por qué el problema persiste hoy (sistema, costo, desconocimiento, etc.). (4) \textbf{Consecuencia medible}: tiempo o dinero perdido por semana o mes. (5) \textbf{Hipótesis de solución inicial}: 1-2 líneas con la dirección, sin comprometerse todavía (la validación de S2 puede cambiarla).
  - |-
    Sigue el patrón \textbf{``primero ficha, después idea''}: nunca escribas la hipótesis de solución antes de los otros 4 campos. Si la solución sale primero, el problema se distorsionará para encajar con la solución. Esa disciplina de orden es lo que diferencia al emprendedor novato del profesional.
  - |-
    La justificación de \emph{``por qué a ti''} se redacta en 3 ingredientes: (1) \textbf{Relación}: tu vínculo personal con el problema (lo viste en tu casa, en tu barrio, en alguien cercano). (2) \textbf{Curiosidad}: por qué te genera ganas de aprender el oficio asociado. (3) \textbf{Compromiso}: qué estás dispuesto a invertir (tiempo, dinero, conversaciones difíciles) para resolverlo en estas 10 sesiones. Sin estos 3 ingredientes, el proyecto se cae en la sesión 5.
  - |-
    Algoritmo: (1) marca con asterisco tu finalista emocional; (2) llena los 5 campos de la ficha en orden; (3) redacta la justificación con los 3 ingredientes; (4) léela en voz alta y pregúntate \emph{¿es honesta?}; (5) si dudas, pídele a un compañero o familiar que la lea y diga si suena real; (6) ajusta hasta que suene a observación, no a tarea.
  checklist:
    titulo: Checklist antes de entregar la ficha
    items: |-
      \checkbox 10 problemas observados con persona concreta en cada uno. \\[1mm] \checkbox Filtro de 3 marcas aplicado a los 10. \\[1mm] \checkbox 1 problema elegido entre los finalistas. \\[1mm] \checkbox Ficha de oportunidad con los 5 campos completos. \\[1mm] \checkbox Justificación con relación + curiosidad + compromiso. \\[1mm] \checkbox Al menos 3 personas contactables nombradas. \\[1mm] \checkbox Ficha leída en voz alta y ajustada por honestidad.
  plantilla_guion: |-
    \textbf{Problema.} \textit{[Afectado] sufre [dolor medible] cada [frecuencia] porque [causa visible].} \\[1mm] \textbf{Afectados.} \textit{Tres personas con nombre + oficio + cómo contactarlas.} \\[1mm] \textbf{Causa visible.} \textit{Por qué el sistema actual produce este dolor.} \\[1mm] \textbf{Consecuencia medible.} \textit{X horas o X pesos perdidos por semana.} \\[1mm] \textbf{Hipótesis inicial.} \textit{Posible dirección de solución, sin compromiso todavía.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Ficha de oportunidad». \textbf{Formato:} ficha con los 5 campos + párrafo de justificación de \emph{por qué a ti}. \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} podrías llamar a uno de los afectados esta tarde sin avergonzarte de la ficha.
  producto_titulo: 10 problemas observados + ficha de oportunidad del problema elegido + justificación
  criterios:
  - 10 problemas observados con persona concreta
  - Filtro de 3 marcas aplicado a los 10 candidatos
  - 1 problema elegido entre finalistas
  - Ficha con 5 campos completos
  - Justificación honesta con los 3 ingredientes
  - Al menos 3 personas reales contactables
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Los problemas que el sistema invisibiliza son los que más merecen oficio.
    aplicacion: |-
      Tu elección de hoy es ética. Cuando ordenas tus 10 candidatos, el sistema te invita a quedarte con el más \emph{rentable} o el más \emph{visible}. La filosofía de la liberación pide otra cosa: mirar también los dolores que nadie cuenta porque las víctimas no tienen voz pública (la abuela que camina dos horas por la panela, el tendero que pierde clientes por no tener celular, la madre soltera que no puede dejar al niño para ir al médico). La phronesis del emprendedor consiste en \textbf{no confundir lo invisible con lo inexistente}.
    pregunta_espejo: |-
      De mis 10 problemas, ¿cuál elegí por rentabilidad y cuál por dolor humano real? ¿Mi elección honra a quien sufre o a mi comodidad?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Mira las cosas como son, no como te gustaría que fueran.
    aplicacion: |-
      Es tentador inflar el problema elegido para que parezca grande, o reducirlo para que parezca fácil. La disciplina estoica recomienda lo contrario: \emph{describe el problema como es, ni más grande ni más pequeño}. Esa precisión es virtud técnica. El emprendedor que se engaña con su propio problema construye una solución sobre arena. La validación de la próxima sesión castiga sin piedad esa autoindulgencia.
    pregunta_espejo: |-
      En mi ficha, ¿estoy describiendo el problema como lo vi, o como me conviene que sea para que mi idea funcione?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Elegir qué problema atender es la primera decisión ética del oficio digital.
    aplicacion: |-
      En un mundo lleno de necesidades, cada hora invertida en un problema es una hora no invertida en otro. La ética digital contemporánea exige conciencia de esa elección: \emph{¿por qué este problema y no otro?, ¿a quién beneficia mi atención?, ¿quién queda sin atender por mi elección?}. Tu justificación honesta de \emph{por qué a ti} no es relleno: es la declaración ética que abre el periodo. Te entrena en una práctica profesional que rige toda carrera técnica del siglo XXI.
    pregunta_espejo: |-
      ¿Mi proyecto atiende un problema porque importa, o porque era el más conveniente para sacar la nota? ¿Soy capaz de declararlo con honestidad?
compromiso: |-
  \textbf{Para la próxima sesión.} Lleva la ficha de oportunidad lista y los datos de contacto de al menos 3 personas afectadas: en la sesión 2 vas a hacer entrevistas reales y necesitas \textbf{poder llamarlas esta semana}. La validación no se puede improvisar el día anterior. Empieza hoy.

web:
  conceptos_clave:
    - termino: Ideación basada en observación
      definicion: |-
        Práctica disciplinada de identificar problemas reales antes de proponer soluciones. Lo opuesto a "se me ocurrió una idea genial". Métodos modernos (Design Thinking, Lean Startup) ponen observación al inicio.
      ejemplo: |-
        En lugar de inventar una app porque suena cool, caminas el barrio 3 días observando qué falta. La idea sale de lo observado, no de la imaginación.
      emoji: "👀"
    - termino: Problema bien definido (5 partes)
      definicion: |-
        Problema con 5 elementos: quién lo sufre, qué duele medible, cuándo ocurre, por qué no resuelto, qué hacen hoy para sobrellevarlo. Sin las 5 partes, es idea suelta, no problema.
      ejemplo: |-
        Bien: "Don Aurelio (tendero) pierde 2h/lunes haciendo cuentas a mano; sin Excel; la academia más cercana queda a 40 min". Las 5 partes claras.
      emoji: "🎯"
    - termino: Enamórate del problema, no de la solución
      definicion: |-
        Regla profesional. Quien se enamora de su idea defiende soluciones que nadie pidió; quien se enamora del problema pivotea hasta encontrar la solución que funciona.
      ejemplo: |-
        Te enamoras del problema "abuelas con dificultad en cajero". Si la app falla porque no usan smartphone, pivoteas a "voluntarios en el banco". El problema sigue; la solución cambia.
      emoji: "💝"
    - termino: Ficha de oportunidad
      definicion: |-
        Documento corto con 5 campos: problema, afectados, causa visible, consecuencia medible, hipótesis de solución. Primer entregable del proceso emprendedor y base de las entrevistas de validación.
      ejemplo: |-
        Problema: cuentas manuales en tiendas. Afectados: 3 tenderos La Merced. Causa: falta capacitación Excel. Consecuencia: 8h/semana perdidas. Hipótesis: tutorial práctico 90 min.
      emoji: "📋"
    - termino: Tradición campesina del emprendimiento
      definicion: |-
        El tendero, ebanista, partera del Valle del Cauca empezaban con: caminar territorio + nombrar dolor concreto + responder con oficio reproducible. Sabiduría que precede al método moderno.
      ejemplo: |-
        El ebanista de Cartago no abrió taller "porque se le ocurrió". Lo abrió porque las casas necesitaban puertas duraderas y él sabía trabajar madera. Necesidad real + oficio respondedor.
      emoji: "🪚"

  quiz:
    titulo: "¿Sabes identificar un buen problema para emprender?"
    instrucciones: "5 preguntas para verificar que entiendes la ideación basada en observación."
    preguntas:
      - enunciado: "Tu amigo dice 'tengo una idea de app genial, vamos a hacerla'. ¿Qué le respondes?"
        opciones:
          - "Vamos, programémosla ya."
          - "Pidamos plata a un inversionista."
          - "Antes de programar: ¿qué problema resuelve? ¿A quién duele? ¿Entrevistamos primero?"
          - "Subámosla a Instagram primero."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Enamorarse del problema, no de la idea. Primero validas que el problema existe y duele; después construyes.
        feedback_incorrecto: |-
          Antes de construir: observa y valida. Regla moderna: problema primero, solución después. Tu amigo se enamoró de la idea sin verificar.
      - enunciado: "¿Cuál es un problema BIEN definido?"
        opciones:
          - "Las abuelas (60+) del barrio La Merced pierden 45 min en cada visita al banco porque las filas no priorizan adultos mayores; lo asumen como inevitable."
          - "La gente pierde tiempo en el banco."
          - "Internet es lento."
          - "Necesitamos una app."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. Tiene las 5 partes: quién, qué duele, cuándo, por qué no resuelto, qué hacen hoy. Eso es problema bien definido.
        feedback_incorrecto: |-
          Un problema bien definido tiene 5 partes específicas: quién, qué duele medible, cuándo, por qué no resuelto, qué hacen hoy.
      - enunciado: "Tu idea inicial no convence en las entrevistas. ¿Qué haces?"
        opciones:
          - "Insisto, mi idea es buena."
          - "Pivoteo: mantengo el problema, busco otra solución."
          - "Cambio de problema."
          - "Abandono el proyecto."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Pivotear es señal de emprendedor maduro. Te enamoraste del problema; la solución es ajustable.
        feedback_incorrecto: |-
          Pivotear: cambias solución, mantienes problema. Insistir en una solución que no funciona es enamoramiento, no oficio.
      - enunciado: "¿Qué tienen en común el ebanista de Cartago y un emprendedor digital?"
        opciones:
          - "Nada."
          - "El ebanista usaba computador."
          - "Es metáfora forzada."
          - "Ambos parten de necesidad real + oficio respondedor. No de 'idea genial'."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. La sabiduría del oficio campesino antecede al método moderno. El método Lean Startup redescubre lo que las abuelas ya sabían.
        feedback_incorrecto: |-
          Necesidad real + oficio respondedor = emprendimiento sano. Aplica al ebanista de 1950 y al emprendedor digital de 2026.
      - enunciado: "Tu ficha de oportunidad debe tener..."
        opciones:
          - "Solo el problema."
          - "Solo la solución."
          - "Problema + afectados + causa + consecuencia + hipótesis (5 campos)."
          - "Solo la idea genial."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Los 5 campos te obligan a especificar. Una ficha incompleta produce entrevistas pobres.
        feedback_incorrecto: |-
          5 campos: problema + afectados + causa + consecuencia + hipótesis. Saltar uno hace que el proyecto se construya sobre arenas movedizas.

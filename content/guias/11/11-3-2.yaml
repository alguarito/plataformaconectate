clave: 3-2
grado: 11
periodo: 3
sesion: 2
completo: true
titulo: Validación --- hablar antes de construir
titulo_portada: |-
  Validación ---
  hablar antes
  de construir
producto_final: 5 entrevistas a personas afectadas por el problema elegido en la sesión 1 (con guion de 7 preguntas + audio o notas + nombre y oficio del entrevistado) + síntesis de hallazgos en 1 página estructurada en 4 bloques (lo que confirmé, lo que descarté, lo que no esperaba, decisión de seguir o pivotar)
apertura:
  saber_ancestral: |-
    En las veredas del Valle del Cauca y en los cabildos indígenas del Pacífico, antes de iniciar cualquier obra nueva había una costumbre obligatoria: \textbf{ir a hablar con los mayores}. Antes de sembrar un cultivo nuevo, se consultaba a la abuela campesina que conocía la luna; antes de construir una casa, se hablaba con el albañil viejo que sabía la pendiente; antes de abrir un negocio en la plaza, se preguntaba a los vendedores del lugar qué pasaba con sus clientes. No era trámite ni cortesía: era \textbf{validación de la realidad}. La persona que actuaba sin consultar a quien sabía era llamada \emph{terco} o \emph{novato}, y casi siempre fracasaba en el primer año. La sabiduría barrial y rural sostiene una verdad incómoda para el emprendedor moderno: \textbf{lo que tú crees del mundo y lo que el mundo es no coinciden hasta que preguntas}.
  saber_contemporaneo: |-
    La \textbf{validación} en metodologías contemporáneas (Customer Discovery de Steve Blank, Mom Test de Rob Fitzpatrick, Lean Startup de Eric Ries) es la práctica de \textbf{conversar con afectados reales antes de construir nada}. El error más caro del emprendedor novato es \emph{enamorarse de su hipótesis} y construir 6 meses sin haber hablado con un solo afectado. La regla profesional: \textbf{5 entrevistas valen más que 50 horas de planeación}. Una entrevista de validación bien hecha tiene 3 propiedades: (1) pregunta por \textbf{pasado concreto}, no por futuro hipotético (no \emph{``¿usarías una app que…?''} sino \emph{``cuéntame la última vez que tuviste este problema''}); (2) busca \textbf{información}, no \textbf{aprobación} (el entrevistado no debe sentir que te tiene que dar la razón); (3) deja \textbf{silencio} para que la persona se extienda (el oro está en lo que dice de más, no en lo que responde literal).
  pregunta_puente: |-
    ¿Qué sabía el campesino al consultar a la abuela antes de sembrar, que el emprendedor novato olvida cuando lanza su proyecto sin hablar con un afectado? ¿Y por qué \emph{``¿usarías mi app?''} es la peor pregunta de validación posible, aunque parezca la más natural?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 5 personas afectadas reales y agendarlas para entrevista esta semana; (2) \textbf{analizar} la diferencia entre preguntas malas (hipotéticas, sugerentes, de aprobación) y preguntas buenas (de pasado concreto, abiertas, neutras); (3) \textbf{explicar} qué dice el método Mom Test y cómo aplica a tu proyecto; (4) \textbf{evaluar} tus 5 entrevistas con un cuadro de hallazgos y decidir con honestidad si tu hipótesis inicial \emph{sobrevive}, \emph{pivota} o \emph{muere}.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 elegiste un problema con ficha de oportunidad. Hoy lo \textbf{contrastas con la realidad}: 5 entrevistas a personas reales que sufren ese problema. La validación es el filtro más severo del periodo. Si tu hipótesis no sobrevive a 5 entrevistas, mejor descubrirlo hoy que en la sesión 8 cuando ya tengas prototipo.
  a_escuta: |-
    Antes de teorizar, vas a hacer la \emph{escucha del territorio}: revisar tu ficha de la sesión 1 y agendar las 5 entrevistas concretas. Vas a confirmar quiénes son, cómo los contactas y cuándo hablas con cada uno esta semana.
  a_sistematizacion: |-
    Ya tienes los entrevistados. Ahora vas a entender la \textbf{anatomía de la entrevista profesional}: las 7 preguntas del guion, los 5 errores mortales (preguntas hipotéticas, sugerentes, de aprobación, cerradas, sobre tu idea), y la diferencia entre \emph{entrevista} y \emph{encuesta}.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: redactar el guion de 7 preguntas adaptado a tu problema y producir la matriz de hallazgos donde anotarás lo dicho por cada entrevistado. Las entrevistas se hacen durante la semana; la sesión termina con el material listo.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas al final de la semana: 5 entrevistas reales documentadas + síntesis de hallazgos en 1 página + decisión de seguir, pivotar o descartar el problema. El criterio principal: que un consultor leyendo tu síntesis pueda decir \emph{``con esta evidencia, la decisión está bien tomada''}, sin tener que confiar en tu palabra.
  a_evaluacion: |-
    Antes de cerrar, mira la validación desde las cinco dimensiones humanas. Conversar con afectados reales es respeto por el oficio; saltarse las entrevistas y inventarlas es la manera más rápida de perder un periodo entero.
  a_triangulo: |-
    Y para terminar, tres voces sobre la escucha y la verdad. Dussel sobre el lugar epistémico del afectado, Séneca sobre la valentía de aceptar evidencia contraria, Floridi sobre la ética de tomar decisiones sin datos cuando los datos están al alcance.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Lista cerrada de 5 entrevistados} (15 min · individual). Revisa la ficha de oportunidad de la sesión 1 y la lista de personas contactables. Cierra una lista de 5 entrevistados con: (1) nombre completo y oficio; (2) relación con el problema (\emph{lo sufre, lo ve sufrir, lo intenta resolver}); (3) canal de contacto (presencial, WhatsApp, llamada); (4) cuándo lo entrevistas esta semana (día y hora tentativa); (5) variación entre ellos: al menos 3 perfiles distintos (no entrevistar 5 amigos del mismo grupo). La diversidad fortalece la validación.
  checks:
  - Cerré lista de 5 entrevistados con nombre y oficio.
  - Al menos 3 perfiles distintos (no entrevisté solo amigos).
  - Cada entrevistado tiene día y hora tentativa esta semana.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mis 5 entrevistados». \textbf{Formato:} tabla 5 filas × 5 columnas (Nombre + oficio~|~Relación con el problema~|~Canal~|~Día/hora~|~Por qué este perfil). \textbf{Sabes que terminaste cuando} podrías mandar los 5 mensajes de agendamiento esta misma noche.
sistematizacion:
  intro: |-
    Una entrevista mal hecha es peor que no entrevistar: produce \textbf{falsa validación}. Para evitarlo necesitas la anatomía profesional: 7 preguntas del Mom Test adaptadas a tu problema, y los 5 errores que matan la información antes de obtenerla.
  pilares:
  - |-
    El guion profesional se descompone en 7 preguntas: (1) \textbf{Contexto}: \emph{``cuéntame de tu día/semana en relación con [tema del problema]''}. (2) \textbf{Última vez}: \emph{``¿cuándo fue la última vez que te pasó X?, cuéntame cómo fue''}. (3) \textbf{Qué hiciste}: \emph{``¿qué hiciste tú en ese momento?''} (revela el apaño actual). (4) \textbf{Qué intentaste antes}: \emph{``¿qué soluciones probaste y por qué no funcionaron?''}. (5) \textbf{Cuánto te costó}: \emph{``¿cuánto tiempo o dinero te costó esa última vez?''} (revela el tamaño del dolor). (6) \textbf{Qué te frenó}: \emph{``¿qué te impidió resolverlo bien?''}. (7) \textbf{Quién más}: \emph{``¿conoces a alguien más que viva lo mismo? ¿podrías presentármelo?''} (cadena de validación).
  - |-
    Los 5 errores mortales del entrevistador novato son: (a) \textbf{Pregunta hipotética}: \emph{``¿usarías una app que…?''} (las personas mienten sobre el futuro, no sobre el pasado). (b) \textbf{Pregunta sugerente}: \emph{``¿no te parece terrible que…?''} (induce la respuesta). (c) \textbf{Pregunta sobre tu idea}: \emph{``¿qué te parece mi solución?''} (la persona no tiene contexto y dirá algo amable). (d) \textbf{Pregunta cerrada}: \emph{``¿estás de acuerdo con…?''} (cierra el flujo en sí o no). (e) \textbf{Pregunta colectiva}: \emph{``¿qué hace la gente cuando…?''} (los individuos no saben qué hace \emph{la gente}; saben qué hicieron ellos).
  - |-
    Lo esencial cabe en una frase: \textbf{pregunta por hechos del pasado, no por opiniones del futuro}. Steve Blank lo llamó \emph{``get out of the building''}; Rob Fitzpatrick lo llamó \emph{``Mom Test''} (preguntas tan bien hechas que ni siquiera tu mamá te puede mentir respondiéndolas). Es el mismo principio: la verdad vive en el pasado concreto, la ilusión en el futuro hipotético.
  - |-
    Algoritmo: (1) adapta las 7 preguntas a tu problema específico; (2) léelas en voz alta y elimina las que sean hipotéticas o sugerentes; (3) prepara una matriz de hallazgos vacía con 7 columnas (una por pregunta) y 5 filas (una por entrevistado); (4) durante cada entrevista llena la matriz en tiempo real; (5) después de cada entrevista, anota 1-2 frases textuales del entrevistado que te sorprendieron.
  anatomia:
    titulo: Anatomía de la entrevista de validación
    body: |-
      \textbf{Contexto:} día o semana de la persona en relación al tema. \\[1mm] \textbf{Última vez:} narrativa concreta del último episodio. \\[1mm] \textbf{Qué hiciste:} apaño actual real. \\[1mm] \textbf{Qué intentaste antes:} soluciones fallidas. \\[1mm] \textbf{Cuánto te costó:} tiempo o dinero del último episodio. \\[1mm] \textbf{Qué te frenó:} barrera real (no imaginada). \\[1mm] \textbf{Quién más:} cadena de referidos.
  errores_comunes: |-
    (1) Preguntar \emph{``¿usarías…?''} en lugar de \emph{``¿cuándo fue la última vez…?''}. (2) Hablar más que el entrevistado (regla profesional: el entrevistado habla 80\%, tú 20\%). (3) Defender tu idea cuando aparece evidencia contraria. (4) Quedarse en preguntas demográficas (edad, ciudad) sin entrar al dolor. (5) No pedir referidos al final (perder la cadena de validación). (6) Entrevistar solo a amigos que te dirán que sí (sesgo de complacencia). (7) Anotar después de la entrevista en lugar de durante (se pierde el 70\% del detalle).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA + EXPLICA).} Título: «Actividad 2 --- Anatomía de la entrevista». \textbf{Formato:} (a) las 7 preguntas adaptadas a tu problema; (b) los 5 errores mortales con marca de cuál te tienta más; (c) matriz de hallazgos vacía (5 filas × 7 columnas). \textbf{Sabes que terminaste cuando} tienes el guion impreso o en celular, listo para usar en la primera entrevista.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Síntesis de hallazgos y decisión} (30 min · individual, después de las 5 entrevistas). Esta actividad se completa al final de la semana, cuando ya entrevistaste a las 5 personas. Aquí no se inventa: se sintetiza la matriz, se nombran los hallazgos y se toma una decisión con honestidad: \emph{sigo, pivoto o descarto}.
  pilares:
  - |-
    Tu síntesis se estructura en 4 bloques: (1) \textbf{Lo que confirmé}: hipótesis de la sesión 1 que sobrevivieron a las 5 entrevistas (ejemplo: \emph{``confirmo que los tenderos sí pierden ventas por no avisar a clientes regulares''}). (2) \textbf{Lo que descarté}: hipótesis que el campo rechazó (ejemplo: \emph{``creía que el problema era el inventario, pero ningún entrevistado lo mencionó: era la comunicación''}). (3) \textbf{Lo que no esperaba}: hallazgos nuevos no previstos en la ficha original (las mejores entrevistas siempre tienen sorpresas). (4) \textbf{Decisión}: \emph{sigo} (la hipótesis sobrevivió), \emph{pivoto} (cambio el problema o el afectado), \emph{descarto} (el problema no existe como yo lo describí).
  - |-
    Sigue el patrón \textbf{``cita textual sobre interpretación''}: en la síntesis, prioriza frases textuales de los entrevistados sobre tus interpretaciones. Si 3 de 5 dijeron \emph{``ya intenté hacer eso y no funcionó''}, esa frase vale más que tu párrafo explicando por qué crees que sí funcionaría. La phronesis del emprendedor consiste en \textbf{escuchar lo que el dato dice, no lo que uno quiere que diga}.
  - |-
    Pivotar no es fracasar: es la decisión profesional más respetada en el método Lean. Pivotar a tiempo (sesión 2) ahorra 8 sesiones de trabajo construido sobre supuestos falsos. La phronesis del oficio respeta a quien pivota con evidencia más que a quien sostiene su idea original por orgullo. Tu rúbrica del periodo valora más una decisión de pivote bien argumentada que una hipótesis original mal validada.
  - |-
    Algoritmo: (1) recopila las 5 matrices llenas; (2) marca con highlighter las frases textuales más fuertes; (3) cuenta cuántos entrevistados mencionaron espontáneamente cada dolor (la frecuencia es el dato más importante); (4) redacta los 4 bloques de síntesis en 1 página; (5) toma la decisión por escrito con justificación de 2 líneas; (6) si pivotas, redacta la nueva ficha de oportunidad antes de cerrar la sesión.
  checklist:
    titulo: Checklist antes de entregar la síntesis
    items: |-
      \checkbox 5 entrevistas realizadas a 5 personas distintas. \\[1mm] \checkbox Matriz de hallazgos llena durante cada entrevista (no después). \\[1mm] \checkbox Citas textuales destacadas de cada entrevistado. \\[1mm] \checkbox Síntesis en 4 bloques (confirmé, descarté, no esperaba, decisión). \\[1mm] \checkbox Decisión explícita: sigo, pivoto o descarto. \\[1mm] \checkbox Si pivotas, ficha de oportunidad actualizada. \\[1mm] \checkbox Síntesis cabe en 1 página de cuaderno o documento.
  plantilla_guion: |-
    \textbf{Lo que confirmé.} \textit{Hipótesis de S1 que sobrevivieron + cuántos entrevistados las apoyaron.} \\[1mm] \textbf{Lo que descarté.} \textit{Hipótesis que el campo rechazó + evidencia textual.} \\[1mm] \textbf{Lo que no esperaba.} \textit{Hallazgos nuevos + 1 cita textual por hallazgo.} \\[1mm] \textbf{Decisión.} \textit{Sigo / Pivoto / Descarto + justificación de 2 líneas.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} Título: «Actividad 3 --- Síntesis de validación». \textbf{Formato:} 1 página con 4 bloques de síntesis + decisión + (si pivotas) nueva ficha de oportunidad. \textbf{Sabes que terminaste cuando} podrías presentar la decisión a un asesor externo y defenderla con citas textuales en mano.
  producto_titulo: 5 entrevistas + matriz de hallazgos + síntesis con decisión
  criterios:
  - 5 entrevistas a personas reales y diversas
  - Guion de 7 preguntas sin errores mortales
  - Matriz de hallazgos llena durante cada entrevista
  - Síntesis en 4 bloques con citas textuales
  - Decisión explícita (sigo, pivoto, descarto) con justificación
  - Si pivota, ficha de oportunidad actualizada
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El afectado es el primer epistemólogo del problema; nadie sabe del dolor mejor que quien lo sufre.
    aplicacion: |-
      Tu validación es ética antes de ser metodológica. El emprendedor que decide \emph{por} el afectado, sin escucharlo primero, repite la lógica colonial de quien sabe más que el pueblo. La filosofía de la liberación pide lo opuesto: \textbf{el lugar epistémico privilegiado es el del afectado}, no el del que diseña la solución. Cuando entrevistas a tus 5 personas con respeto y silencio, no estás haciendo trámite metodológico: estás reconociendo que ellas saben de su problema más que tú.
    pregunta_espejo: |-
      En mis entrevistas, ¿escuché de verdad o solo busqué confirmación? ¿Hablé yo más o habló el entrevistado? ¿Acepté lo que dijo cuando contradijo mi idea?
  estoico:
    autor: Séneca
    cita: |-
      La evidencia contraria es regalo, no insulto. El sabio cambia de opinión cuando los datos lo exigen.
    aplicacion: |-
      Es tentador defender tu hipótesis cuando un entrevistado la contradice. La sabiduría estoica recomienda lo opuesto: \emph{recibe la evidencia contraria como regalo}. Cambiar de opinión por datos no es debilidad: es disciplina racional. El emprendedor que sostiene su idea contra 5 entrevistas adversas no muestra valor: muestra terquedad. La phronesis del oficio honra a quien pivota con evidencia más que a quien insiste sin ella.
    pregunta_espejo: |-
      Si mis 5 entrevistas contradijeran mi hipótesis, ¿tendría la valentía de pivotar hoy, o seguiría adelante por orgullo?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Decidir sin datos cuando los datos están al alcance es la nueva forma de irresponsabilidad profesional.
    aplicacion: |-
      Antes de internet, decidir sin datos era inevitable: la información era costosa. Hoy es lo opuesto: hablar con 5 personas reales cuesta una semana, y la mayoría de los emprendedores no lo hace. La ética digital contemporánea declara esa omisión como irresponsable. El profesional que invierte horas en una solución sin haber hablado con un afectado tira a la basura el principio básico del oficio: \textbf{los datos primero, las decisiones después}.
    pregunta_espejo: |-
      ¿Estoy decidiendo mi proyecto con base en 5 conversaciones reales, o con base en lo que yo imagino del mundo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con las 5 entrevistas hechas y la síntesis lista. En la sesión 3 vas a transformar lo validado en \textbf{modelo de negocio} con el Business Model Canvas. Si pivotaste, llega con la ficha de oportunidad actualizada. La validación se honra construyendo sobre ella, no archivándola.

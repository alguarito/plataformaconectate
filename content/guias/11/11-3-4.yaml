clave: 3-4
grado: 11
periodo: 3
sesion: 4
completo: true
titulo: MVP digital --- una versión imperfecta para probar
titulo_portada: |-
  MVP digital ---
  una versión imperfecta
  para probar
producto_final: MVP funcional (Producto Mínimo Viable) que combine al menos 3 piezas digitales (sitio simple o landing + formulario de captura + flujo de respuesta) y que pueda ser probado por al menos 1 usuario real esta misma semana, con criterios explícitos de qué se considera \emph{``funcionó''} y qué se considera \emph{``falló''} antes de construirlo
apertura:
  saber_ancestral: |-
    En los talleres alfareros de Cartago la Vieja, en La Tebaida, en el Quindío profundo, ningún maestro saca jamás una serie de 50 piezas sin antes hacer \textbf{la pieza de muestra}. Esa pieza tiene un nombre antiguo: \emph{la primera}. La primera es deliberadamente imperfecta: el barro elegido es del montón principal, pero el horneado se hace a temperatura menor para verificar antes de invertir leña; la forma se hace rápida para validar la mano; el esmalte se aplica solo en una zona para ver cómo se comporta. Si la primera quiebra, no se quema la serie. Si la primera se ve sólida, recién entonces el maestro invierte 3 días en producir las 50. La sabiduría es ancestral y económica: \textbf{nadie quema 50 piezas para descubrir que el barro no servía}. La misma lógica opera con la \textbf{partera} que prueba un té antes de prescribirlo, con el \textbf{ebanista} que entalla una muestra antes del juego de comedor, con el \textbf{sastre} que arma el patrón en papel antes de cortar la tela buena. El oficio profesional siempre ha sabido que \emph{una versión imperfecta para probar} ahorra meses de error.
  saber_contemporaneo: |-
    El \textbf{MVP, Producto Mínimo Viable} (Eric Ries, \emph{The Lean Startup}, 2011) es la versión digital exacta de la \emph{primera} del alfarero: la versión más pequeña posible del producto que permita aprender algo real sobre los supuestos críticos del Canvas. La regla profesional es famosa y dolorosa: \textbf{si no te avergüenza tu MVP, lo lanzaste demasiado tarde} (Reid Hoffman, fundador de LinkedIn). Un MVP digital tiene 3 propiedades irrenunciables: (1) \textbf{Funciona end-to-end}: un usuario puede recorrer la propuesta de valor de inicio a fin, aunque sea con costuras visibles. (2) \textbf{Verifica un supuesto crítico}: cada MVP está diseñado para probar 1 o 2 de los 3 supuestos críticos identificados en la sesión 3. (3) \textbf{Se construye en días, no en meses}: si tu MVP toma más de 2 semanas en estar listo, no es mínimo. Las herramientas modernas (Google Sites, Tally, Carrd, Notion, WhatsApp Business, Zapier) permiten construir MVP funcionales en una tarde sin escribir código.
  pregunta_puente: |-
    ¿Qué sabía el alfarero al hacer \emph{la primera} antes de la serie, que el emprendedor novato olvida cuando se obsesiona con \emph{``lanzar perfecto''}? ¿Y por qué Reid Hoffman dice que la vergüenza por tu MVP es señal de buena disciplina, no de mal trabajo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuál de tus 3 supuestos críticos vale más la pena probar primero y por qué; (2) \textbf{aplicar} el patrón MVP combinando 3 piezas digitales accesibles (landing + formulario + flujo de respuesta); (3) \textbf{crear} tu MVP funcional, end-to-end, en una sola tarde de trabajo concentrado; (4) \textbf{evaluar} tu MVP con criterios explícitos de éxito y fracaso escritos \emph{antes} de mostrárselo al primer usuario.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 3 cerraste el Canvas con 3 supuestos críticos. Hoy construyes el \textbf{primer artefacto} que pondrá uno de esos supuestos contra el mundo. La sesión 5 medirá lo que pase con 10 usuarios reales; la sesión 6 contará la historia en pitch. Sin MVP funcional hoy, las dos sesiones siguientes no tienen materia prima.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lectura honesta} de tus 3 supuestos críticos: ¿cuál es el más \textbf{caro de equivocarse}?, ¿cuál es el más \textbf{rápido de verificar}?, ¿cuál es el más \textbf{barato de construir como MVP}? Elegirás uno aplicando la regla de \emph{máximo aprendizaje por hora invertida}.
  a_sistematizacion: |-
    Ya tienes el supuesto que vas a probar. Ahora vas a entender la \textbf{anatomía del MVP digital}: las 3 piezas obligatorias (captura, valor, respuesta), los 5 errores que matan al MVP novato (perfeccionismo, alcance gigante, falta de medición, sin canal de captura, sin criterio de éxito), y los \textbf{4 tipos de MVP} reconocibles en el mercado actual.
  a_praxis: |-
    Tienes el método. Toca construir. Vas a ensamblar tu MVP en una sola tarde de trabajo combinando 3 herramientas no-code accesibles desde el colegio. Antes de mostrar el MVP a tu primer usuario, escribirás el criterio de éxito explícito: \emph{``este MVP funciona si X usuarios hacen Y dentro de Z días''}.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: MVP funcional + criterio de éxito por escrito + plan para probar con 1 usuario real esta semana. El criterio principal: que un emprendedor experimentado, viendo tu MVP, pueda decir \emph{``entendí qué prueba y cómo se mide''} sin necesidad de explicaciones adicionales.
  a_evaluacion: |-
    Antes de cerrar, mira el MVP desde las cinco dimensiones humanas. Construir un MVP honesto es respeto por el oficio; construir uno solo para mostrar al docente es desperdicio de la sesión.
  a_triangulo: |-
    Y para terminar, tres voces sobre la imperfección útil. Dussel sobre los MVPs que respetan al usuario o lo usan como conejillo de indias, Epicteto sobre la disciplina de soltar la perfección, Floridi sobre la ética del MVP transparente.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- ¿Cuál de mis 3 supuestos críticos pruebo primero?} (15 min · individual). Toma la tabla de la sesión 3 con tus 3 supuestos críticos formulados como afirmaciones falsables. Para cada supuesto, evalúa 3 dimensiones en escala 1-5: (a) \textbf{Costo de equivocarse}: si este supuesto fuera falso y yo no lo supiera hasta el final, ¿qué tan grave sería? (b) \textbf{Rapidez de verificación}: ¿en cuántos días puedo probarlo con un MVP simple? (c) \textbf{Barato de construir}: ¿qué tan accesible es montar un MVP que lo pruebe? Calcula \textbf{Prioridad = Costo × Rapidez × Accesibilidad} (multiplicación de los 3) y elige el supuesto con mayor prioridad como el que probarás hoy.
  checks:
  - Evalué los 3 supuestos críticos en las 3 dimensiones.
  - Elegí 1 supuesto para probar con MVP, justificado con números.
  - El supuesto está formulado como afirmación falsable (no como pregunta).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Supuesto a probar con MVP». \textbf{Formato:} tabla 3 filas × 4 columnas (Supuesto~|~Costo~|~Rapidez~|~Accesibilidad), con producto y elección final marcada. Al final: 1 línea con el supuesto elegido formulado como afirmación falsable. \textbf{Sabes que terminaste cuando} tienes claro qué prueba tu MVP, no solo qué hace.
sistematizacion:
  intro: |-
    Un MVP novato es un sitio bonito que no prueba nada. Un MVP profesional es un dispositivo de aprendizaje barato y rápido. Para que el tuyo sea del segundo tipo necesitas la \textbf{anatomía del MVP digital}: las 3 piezas obligatorias, los 4 tipos reconocidos y los errores que matan el aprendizaje antes de empezar.
  pilares:
  - |-
    Todo MVP digital se descompone en 3 piezas mínimas: (1) \textbf{Captura}: la puerta de entrada donde el usuario \emph{aterriza} (landing en Google Sites, Carrd, Notion público, post de Instagram con link, mensaje pinned de WhatsApp Business). (2) \textbf{Valor}: lo que el usuario \emph{recibe o experimenta} (descarga, formulario para inscripción, video explicativo, demo interactiva, conversación con bot). (3) \textbf{Respuesta}: el flujo que se dispara cuando el usuario actúa (correo automático con Tally, mensaje en WhatsApp, agenda con Calendly, registro en Sheets vía Zapier). Sin los 3, no hay MVP: hay una pieza suelta.
  - |-
    Existen \textbf{4 tipos de MVP} en el mercado contemporáneo: (a) \textbf{Landing de validación}: página con propuesta y formulario \emph{``quiero esto''}; mide intención. (b) \textbf{Mago de Oz}: la automatización es manual detrás del telón (tú respondes a mano lo que parece automático); mide demanda sin construir tecnología. (c) \textbf{Conserje}: atiendes 1-3 usuarios uno a uno antes de escalar; mide proceso completo a baja escala. (d) \textbf{Pieza única funcional}: construyes solo la función más importante (no el sistema completo); mide si esa función basta para resolver el dolor. Tu MVP elegirá uno de los 4, no los 4.
  - |-
    Lo esencial cabe en una frase: \emph{el MVP no se construye para vender; se construye para aprender}. Si el resultado del MVP no te enseña algo verdadero sobre tu supuesto crítico, está mal hecho aunque se vea bonito. La phronesis del emprendedor consiste en \textbf{soltar el orgullo del acabado a cambio de la información del experimento}.
  - |-
    Algoritmo: (1) elige el tipo de MVP (de los 4) según tu supuesto; (2) elige 3 herramientas no-code para captura, valor, respuesta; (3) construye end-to-end en una sola sesión de 3-4 horas; (4) prueba tu MVP contigo mismo como primer usuario antes de mostrar a otros; (5) escribe el criterio de éxito \emph{antes} de invitar a un usuario real; (6) prepara la pregunta única que harás al usuario después de usar el MVP: \emph{``¿qué te llevó a hacer X / a no hacer X?''}.
  anatomia:
    titulo: Anatomía del MVP digital
    body: |-
      \textbf{Captura:} dónde aterriza el usuario. \\[1mm] \textbf{Valor:} qué recibe o experimenta. \\[1mm] \textbf{Respuesta:} qué se dispara cuando actúa. \\[1mm] \textbf{Tipo:} landing / Mago de Oz / Conserje / Pieza funcional. \\[1mm] \textbf{Criterio de éxito:} cuántos usuarios hacen qué cosa en cuánto tiempo. \\[1mm] \textbf{Pregunta posterior:} qué le preguntas al usuario después.
  errores_comunes: |-
    (1) \textbf{Perfeccionismo}: gastar 3 semanas puliendo el MVP en vez de lanzarlo en 3 días. (2) \textbf{Alcance gigante}: construir 5 funcionalidades cuando 1 bastaba para probar el supuesto. (3) \textbf{Sin medición}: no definir qué se considera éxito \emph{antes} del lanzamiento. (4) \textbf{Sin canal de captura}: tener MVP listo pero no saber cómo llevar usuarios. (5) \textbf{Sin criterio de fracaso}: no tener escrito \emph{``si esto ocurre, mi hipótesis está muerta''}. (6) \textbf{Construir para impresionar al docente}: el MVP es para el usuario, no para la rúbrica.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía de mi MVP». \textbf{Formato:} ficha con los 6 campos de la anatomía aplicados a tu proyecto (captura, valor, respuesta, tipo, criterio de éxito, pregunta posterior). \textbf{Sabes que terminaste cuando} podrías delegar la construcción de tu MVP a otro compañero solo con esa ficha.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- MVP funcional listo para probar} (40 min en sesión, 2-4 horas de construcción durante la semana · individual). Hora de construir. Ensamblas tu MVP combinando 3 herramientas no-code, lo pruebas contigo mismo, escribes el criterio de éxito por adelantado, y agendas al primer usuario real para esta semana.
  pilares:
  - |-
    Tu MVP se construye en 5 pasos: (1) \textbf{Elige stack no-code}: para captura (Google Sites, Carrd, Notion, Instagram post con link), para valor (Tally, Typeform, video Loom, página con texto, demo con Canva), para respuesta (Zapier, ManyChat, correo automático, WhatsApp Business). (2) \textbf{Conecta las piezas} con 2-3 enlaces simples: captura, valor, respuesta. (3) \textbf{Recorre el MVP tú mismo} simulando ser el usuario; anota cada fricción. (4) \textbf{Arregla las 3 fricciones más graves} (ignora las demás por ahora). (5) \textbf{Genera el link único} que enviarás al primer usuario.
  - |-
    Sigue el patrón \textbf{``cinta adhesiva sobre código''}: tu MVP es 80\% pegado con cinta adhesiva digital (Zapier conectando 2 apps, copy-paste manual, automatización con un botón humano detrás) y 20\% automatizado. Está bien. Eric Ries llamó esto \emph{``concierge MVP''}: si la operación detrás del telón es manual mientras el frontal se ve automatizado, sigue siendo un MVP válido. La elegancia técnica viene después de validar.
  - |-
    El criterio de éxito se escribe \emph{antes} de lanzar y tiene formato fijo: \emph{``Este MVP funcionó si [N] usuarios hacen [acción específica] dentro de [tiempo]''}. Ejemplos reales: \emph{``Si 5 tenderos se inscriben en el formulario en 1 semana''}, \emph{``Si 3 padres de familia agendan demo de Calendly en 3 días''}, \emph{``Si 8 de 10 usuarios completan el formulario sin abandonarlo a mitad''}. Sin número específico y plazo concreto, no hay criterio: hay deseo.
  - |-
    Algoritmo de validación interna del MVP: (1) ¿el usuario entiende la propuesta en menos de 10 segundos al aterrizar? (2) ¿puede hacer la acción principal en menos de 2 minutos? (3) ¿la respuesta llega en menos de 1 hora (automática) o 24 horas (manual)? (4) ¿tienes manera de saber qué hizo el usuario (analytics simple, conteo manual, log en Sheets)? Si las 4 respuestas son sí, tu MVP está listo para el primer usuario real.
  checklist:
    titulo: Checklist antes de invitar al primer usuario
    items: |-
      \checkbox MVP funciona end-to-end (yo lo recorrí completo). \\[1mm] \checkbox 3 piezas conectadas (captura + valor + respuesta). \\[1mm] \checkbox Link único listo para compartir. \\[1mm] \checkbox Criterio de éxito escrito (N usuarios + acción + tiempo). \\[1mm] \checkbox Criterio de fracaso escrito (qué consideraría hipótesis muerta). \\[1mm] \checkbox Manera de saber qué hizo el usuario (sheet, log, analytics). \\[1mm] \checkbox Primer usuario real agendado para esta semana.
  plantilla_guion: |-
    \textbf{Supuesto a probar.} \textit{Afirmación falsable de la sesión 3.} \\[1mm] \textbf{Tipo de MVP.} \textit{Landing / Mago de Oz / Conserje / Pieza funcional.} \\[1mm] \textbf{Stack.} \textit{Captura + Valor + Respuesta con herramientas concretas.} \\[1mm] \textbf{Link.} \textit{URL única del MVP.} \\[1mm] \textbf{Criterio de éxito.} \textit{N usuarios + acción + tiempo.} \\[1mm] \textbf{Criterio de fracaso.} \textit{Qué resultado mataría la hipótesis.} \\[1mm] \textbf{Primer usuario.} \textit{Nombre + cuándo lo invitas.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Mi MVP funcional». \textbf{Formato:} ficha con los 7 campos del guion + captura de pantalla impresa o pegada del MVP en cada pieza (captura, valor, respuesta). \textbf{Extensión:} 1-2 páginas. \textbf{Sabes que terminaste cuando} le mandarías el link a un familiar o amigo esta noche sin avergonzarte.
  producto_titulo: MVP funcional + criterio de éxito + primer usuario agendado
  criterios:
  - MVP funciona end-to-end con 3 piezas conectadas
  - Construido en menos de 4 horas con herramientas no-code
  - Diseñado para probar 1 supuesto crítico específico
  - Criterio de éxito y de fracaso escritos antes de lanzar
  - Sistema de medición simple implementado
  - Primer usuario real agendado para esta semana
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Todo MVP decide si respeta al usuario como sujeto o lo usa como objeto de experimento.
    aplicacion: |-
      Tu MVP entra en contacto con personas reales. Hay dos formas de pensarlas: como \emph{conejillos de indias} (objetos de prueba para tu aprendizaje) o como \emph{co-investigadores} (sujetos que aceptan ayudarte porque les explicaste el propósito). La filosofía de la liberación pide lo segundo: declara al usuario que es un MVP, que estás aprendiendo, que su retroalimentación es valiosa, que su tiempo no es gratis. La phronesis del oficio digital consiste en \textbf{nunca ocultar al usuario su rol en el experimento}.
    pregunta_espejo: |-
      Cuando invite a mi primer usuario al MVP, ¿le voy a decir con honestidad que es una versión imperfecta para probar, o se lo voy a presentar como producto terminado para impresionar?
  estoico:
    autor: Epicteto
    cita: |-
      Lo que está en tu poder es construir; lo que no está en tu poder es que sea perfecto la primera vez.
    aplicacion: |-
      Es tentador retrasar el lanzamiento del MVP \emph{``hasta que esté mejor''}. La disciplina estoica recomienda lo contrario: \emph{distingue lo que depende de ti (construir y soltar) de lo que no (que sea perfecto)}. El MVP es ejercicio de soltar el control sobre la apariencia para mantener el control sobre el aprendizaje. La perfección es enemiga del oficio cuando ocurre antes que la validación.
    pregunta_espejo: |-
      ¿Estoy retrasando mi MVP por mejoras reales o por miedo a que se vea imperfecto? ¿Qué dejaría en el MVP que hoy quiero pulir, si tuviera que lanzarlo en 4 horas?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El MVP transparente es la nueva ética del experimento digital con humanos.
    aplicacion: |-
      Antes de internet, los experimentos con personas requerían comités de ética. Hoy cualquier emprendedor lanza MVPs a miles de usuarios sin declarar su naturaleza experimental. La ética digital contemporánea exige un mínimo: el usuario debe saber que está participando en un experimento, qué datos se recogen, qué se hace con ellos. Tu MVP tiene esa obligación a pequeña escala: declara al usuario que es prueba, no producto.
    pregunta_espejo: |-
      ¿Mi MVP declara su naturaleza experimental al usuario, o lo disfraza de producto terminado? ¿Estoy entrenándome en una ética que escalaré, o en una que tendré que desaprender?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu MVP funcional probado por al menos 1 usuario real y los primeros datos de uso registrados. En la sesión 5 vas a montar el \textbf{plan de medición riguroso} y procesarás los primeros 10 datos. Sin uso real esta semana, la sesión siguiente no tiene materia prima.

web:
  conceptos_clave:
    - termino: MVP (Producto Mínimo Viable)
      definicion: |-
        Versión más simple del producto que aún permite probar la hipótesis principal. No es prototipo ni producto final: es la versión mínima que se puede poner en manos de usuarios reales para aprender. Acuñado por Eric Ries (Lean Startup).
      ejemplo: |-
        En vez de construir app completa, MVP puede ser: landing + formulario de captura + responder manual cada email. Funciona para probar si la propuesta convence; si sí, se automatiza después.
      emoji: "🚧"
    - termino: 3 piezas digitales del MVP
      definicion: |-
        Combinación mínima típica de un MVP digital: (1) sitio simple o landing, (2) formulario de captura, (3) flujo de respuesta (manual al inicio, automatizable después).
      ejemplo: |-
        Landing en Carrd o Notion + Google Form como captura + responder cada solicitud por correo en menos de 24h. Total: 1 día de armado. Funciona para validar.
      emoji: "🔧"
    - termino: Criterios de éxito y falla
      definicion: |-
        Antes de construir, definir EXPLÍCITAMENTE qué se considera "funcionó" y qué se considera "falló". Sin criterios previos, todo resultado se interpreta como éxito (sesgo de confirmación).
      ejemplo: |-
        Éxito: 10+ formularios en 1 semana con 3+ ofreciendo pagar. Falla: <5 formularios o ningún ofrecimiento de pago. Decidir antes de medir.
      emoji: "🎯"
    - termino: Imperfecto pero real
      definicion: |-
        Filosofía del MVP: mejor lanzar imperfecto y aprender que perfeccionar sin lanzar. Reid Hoffman (LinkedIn): "si no te avergüenza la primera versión de tu producto, lanzaste tarde".
      ejemplo: |-
        Versión 1 fea con bugs pero funcional > versión imaginaria perfecta nunca lanzada. La 1 te enseña; la imaginaria no.
      emoji: "🐛"
    - termino: Build-Measure-Learn (Lean Startup)
      definicion: |-
        Ciclo de Eric Ries. Construir lo mínimo (Build) → medir uso real (Measure) → aprender qué ajustar (Learn) → repetir. Cada ciclo es semanas, no meses.
      ejemplo: |-
        Semana 1: armas MVP. Semana 2: 10 usuarios lo prueban. Semana 3: ajustas según datos. Semana 4: vuelves a probar. Aprendizaje continuo.
      emoji: "🔄"

  quiz:
    titulo: "¿Sabes qué es un MVP?"
    instrucciones: "5 preguntas sobre el Producto Mínimo Viable."
    preguntas:
      - enunciado: "¿Qué es un MVP?"
        opciones:
          - "Producto final perfecto."
          - "Prototipo sin usuarios."
          - "Versión más simple que aún permite probar la hipótesis principal."
          - "Una idea sin construir."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. MVP = versión mínima en manos de usuarios reales para aprender. Acuñado por Eric Ries. Lo opuesto al producto final pulido.
        feedback_incorrecto: |-
          MVP = mínima versión real para usuarios reales. Ni prototipo (sin usuarios) ni producto final (perfecto). Punto medio que permite aprender rápido.
      - enunciado: "Antes de construir el MVP, ¿qué defines?"
        opciones:
          - "Criterios EXPLÍCITOS de éxito y falla (qué se considera 'funcionó' o 'falló')."
          - "Solo la idea general."
          - "El precio."
          - "El logo."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Criterios definidos antes de medir. Sin esto, todo resultado se interpreta como éxito (sesgo de confirmación). Define éxito numérico.
        feedback_incorrecto: |-
          Criterios de éxito y falla antes de construir. Ejemplo: éxito = 10 formularios, falla = <5. Sin meta clara, la medición se sesga.
      - enunciado: "¿Qué dice Reid Hoffman sobre la primera versión de tu producto?"
        opciones:
          - "Debe ser perfecta."
          - "Nunca lances algo imperfecto."
          - "Espera 2 años a perfeccionar."
          - "Si no te avergüenza la primera versión, lanzaste tarde."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Imperfecto pero real > perfecto imaginario nunca lanzado. El MVP debe avergonzarte un poco para que estés aprendiendo.
        feedback_incorrecto: |-
          Reid Hoffman: si no avergüenza, tardaste demasiado. Lanzar imperfecto y aprender > perfeccionar sin lanzar. Filosofía del MVP.
      - enunciado: "Tu MVP de captura de demanda con 3 piezas digitales típicas son..."
        opciones:
          - "App nativa + SDK + backend."
          - "Landing simple + formulario + flujo de respuesta (manual al inicio)."
          - "5 microservicios en AWS."
          - "Sistema empresarial completo."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. 3 piezas mínimas: landing + formulario + flujo. Manual al inicio, automatizable después. Funciona para validar en 1 semana.
        feedback_incorrecto: |-
          MVP típico = landing + formulario + flujo manual. No necesitas infraestructura compleja para validar. 1 semana de armado.
      - enunciado: "Build-Measure-Learn. ¿Cuánto debe durar 1 ciclo?"
        opciones:
          - "1 año."
          - "Semanas, no meses. Cada ciclo entrega aprendizaje."
          - "1 día."
          - "5 años."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Semanas. Construir > medir > aprender > ajustar. Si toma meses, ya no es Lean. La velocidad del ciclo es el activo.
        feedback_incorrecto: |-
          Ciclos cortos (semanas). Lean Startup: aprender rápido > construir lento. Si el ciclo dura meses, ya perdiste la ventaja del método.

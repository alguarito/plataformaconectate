clave: 3-5
grado: 11
periodo: 3
sesion: 5
completo: true
titulo: Datos del MVP --- recoger evidencia con rigor
titulo_portada: |-
  Datos del MVP ---
  recoger evidencia
  con rigor
producto_final: Plan de medición del MVP (3-5 indicadores definidos como ratios o valores absolutos con meta numérica) + tabla con los primeros 10 datos reales recolectados de usuarios del MVP de la sesión 4 + análisis de 1 página con 3 hallazgos numéricos + decisión por escrito (sigo, ajusto, pivoto, descarto) anclada a los datos
apertura:
  saber_ancestral: |-
    En los caminos del Valle del Cauca, antes de los hospitales modernos, había una figura que dominaba un oficio que hoy llamaríamos \emph{``medicina basada en evidencia''}: \textbf{el médico tradicional, la sobandera, la curandera del barrio}. Su práctica nunca empezaba con la receta: empezaba con \textbf{observar}. La sobandera, antes de tocar la mano luxada, pedía caminar al paciente para ver la postura. La curandera, antes de dar el agua de violetas para la tos, escuchaba la respiración 3 minutos completos. El partero del campo, antes de decidir cualquier maniobra, contaba los latidos del bebé y los movimientos del vientre durante una hora. La sabiduría era rigurosa: \textbf{observar antes de actuar, medir antes de intervenir, escuchar antes de hablar}. La diferencia entre un médico tradicional respetado y un curandero novato no era el conocimiento de las plantas: era la \emph{disciplina de la observación previa}. Esa virtud ancestral es la misma que separa al emprendedor que decide con datos del que decide con corazonadas.
  saber_contemporaneo: |-
    La \textbf{medición rigurosa del MVP} es lo que separa el experimento profesional del experimento desperdiciado. Sin medición no hay aprendizaje; con medición caótica hay confusión peor que la ignorancia. La regla profesional, conocida como \textbf{ciclo Construir-Medir-Aprender} (Eric Ries), exige que cada MVP esté acompañado de 3-5 \textbf{indicadores explícitos}, definidos antes del lanzamiento, con \textbf{meta numérica} y \textbf{método de recolección} concretos. Los indicadores se distinguen en dos familias: \textbf{vanity metrics} (métricas de vanidad: número total de visitas, seguidores, likes) que se ven bien pero no dirigen decisiones, y \textbf{actionable metrics} (métricas accionables: tasa de conversión, costo de adquisición, retención semanal) que sí dirigen decisiones. La phronesis del emprendedor consiste en elegir métricas accionables sobre métricas de vanidad, aunque las segundas suenen mejor en una presentación.
  pregunta_puente: |-
    ¿Qué sabía la sobandera del barrio al observar la postura del paciente durante 3 minutos antes de tocarlo, que el emprendedor novato olvida cuando salta del MVP a la \emph{``conclusión''} sin medir nada? ¿Y por qué \emph{``tuvimos 500 visitas''} es la peor manera de reportar el resultado de un MVP, aunque suene a éxito?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 3-5 indicadores accionables (no de vanidad) para tu MVP, cada uno con meta numérica y método de recolección; (2) \textbf{analizar} los primeros 10 datos reales recogidos del MVP de la sesión 4 con un mínimo de rigor estadístico apropiado para muestras pequeñas; (3) \textbf{explicar} qué dicen los datos sobre el supuesto crítico que estabas probando; (4) \textbf{evaluar} la evidencia con honestidad y tomar una decisión documentada: sigo, ajusto, pivoto, descarto.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 4 te dio un MVP funcional probado por al menos 1 usuario. Hoy le pones encima la \textbf{disciplina de la medición}: indicadores definidos, datos recolectados, análisis honesto. La sesión 6 tomará lo que aprendas hoy como insumo para construir el pitch. Sin datos hoy, el pitch será cuento, no evidencia.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{auditoría rápida} de lo que ya tienes: ¿qué datos te dejó la sesión 4?, ¿quiénes son los primeros usuarios?, ¿qué hicieron en el MVP?, ¿qué te dijeron después? Esa auditoría revela las preguntas que tu plan de medición tiene que responder.
  a_sistematizacion: |-
    Ya tienes el material crudo. Ahora vas a entender la \textbf{anatomía del plan de medición profesional}: las 3 familias de indicadores (adquisición, activación, retención), la diferencia entre vanity y actionable metrics, los 6 errores típicos del análisis novato (muestra pequeña interpretada como definitiva, sesgo de confirmación, datos sin baseline, indicador único, métricas de vanidad como prueba).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: redactar el plan de medición con 3-5 indicadores, recolectar los primeros 10 datos reales (durante la semana), procesarlos en una tabla, escribir 3 hallazgos numéricos y tomar la decisión.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas al final de la semana: plan de medición + tabla de 10 datos reales + análisis de 1 página + decisión documentada. El criterio principal: que un analista de datos junior, mirando tu tabla, pueda confirmar o cuestionar tu decisión sin tener que confiar en tu palabra.
  a_evaluacion: |-
    Antes de cerrar, mira la medición desde las cinco dimensiones humanas. Recoger evidencia con rigor es respeto por el oficio entero; saltar a conclusiones sin datos es engaño al docente, al usuario y a uno mismo.
  a_triangulo: |-
    Y para terminar, tres voces sobre el rigor y la verdad. Dussel sobre las decisiones que respetan a quien sufre el problema, Marco Aurelio sobre la disciplina de ver las cosas como son, Floridi sobre la ética del dato bien recolectado en la era de la información.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 3-5 indicadores accionables para mi MVP} (20 min · individual). Toma tu MVP de la sesión 4 y define los indicadores que medirán si \emph{funcionó} respecto al supuesto crítico. Reglas: (1) cada indicador es un \textbf{ratio o un valor absoluto con meta} (no \emph{``más visitas''}, sino \emph{``20\% de los visitantes completan el formulario''} o \emph{``al menos 5 usuarios agendan demo en 7 días''}). (2) cada indicador tiene un \textbf{método de recolección} concreto (Google Analytics, conteo manual en Sheets, exportar Tally, ManyChat dashboard). (3) cubre al menos 2 de las 3 familias: \textbf{adquisición} (cuántos llegan), \textbf{activación} (cuántos hacen la acción principal), \textbf{retención} (cuántos vuelven o responden). (4) elige indicadores accionables, no de vanidad.
  checks:
  - Definí 3-5 indicadores con meta numérica explícita.
  - Cada indicador tiene método de recolección concreto.
  - Cubro al menos 2 de las 3 familias (adquisición, activación, retención).
  - No incluyo métricas de vanidad como indicador principal.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Plan de medición de mi MVP». \textbf{Formato:} tabla de 3-5 filas × 4 columnas (Indicador~|~Familia~|~Meta numérica~|~Método de recolección). \textbf{Sabes que terminaste cuando} podrías pedirle a otro compañero que recolecte los datos siguiendo tu tabla, sin pedirte aclaraciones.
sistematizacion:
  intro: |-
    Un plan de medición sin teoría detrás es lista de números sueltos. Para que tu medición tenga rigor profesional necesitas la \textbf{anatomía del marco AAR} (Adquisición, Activación, Retención) y la \textbf{distinción crítica} entre métricas de vanidad y métricas accionables. Estas dos piezas conceptuales separan al analista del coleccionista de números.
  pilares:
  - |-
    Las métricas se organizan en 3 familias del modelo \textbf{AARRR} (popularizado por Dave McClure y simplificado aquí a las 3 más críticas para MVP): (1) \textbf{Adquisición}: cuántas personas llegan al MVP (visitas únicas, clicks en link, mensajes recibidos). Responde: ¿el canal funciona? (2) \textbf{Activación}: cuántas hacen la acción principal del MVP (completar formulario, agendar demo, descargar, conversar con bot). Responde: ¿la propuesta de valor enganchó? (3) \textbf{Retención}: cuántas vuelven o responden cuando las contactas después (apertura de correo de seguimiento, respuesta a WhatsApp, reuso del MVP). Responde: ¿hubo valor real o curiosidad pasajera?
  - |-
    La \textbf{distinción vanity vs actionable} es la línea que separa al profesional del aficionado: (a) \textbf{Vanity metric}: número grande que se ve bien pero no permite decidir nada (\emph{``500 visitas''}, \emph{``100 likes''}, \emph{``mucha gente vio mi post''}). (b) \textbf{Actionable metric}: ratio o valor que dirige una decisión concreta (\emph{``de 100 visitantes, 12 completaron formulario = 12\%''}, \emph{``costo por usuario adquirido = \$3.000''}, \emph{``retención semana 1 = 40\%''}). La phronesis profesional consiste en \textbf{reportar siempre las accionables}, aunque las de vanidad suenen mejor.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿esta métrica me hace cambiar lo que haría mañana?}. Si la respuesta es no, es métrica de vanidad. Si la respuesta es sí (\emph{``si la activación es menor a 10\%, cambio el copy''}, \emph{``si la retención semana 1 es menor a 30\%, repienso el valor''}), es accionable. Esa simple pregunta filtra el 80\% de las métricas que circulan en presentaciones de emprendedores.
  - |-
    Algoritmo de análisis para 10 datos (muestra pequeña): (1) recoge los datos en una tabla (1 fila por usuario, columnas con los indicadores); (2) calcula los ratios de cada familia (no solo totales); (3) marca con asterisco los usuarios que se comportaron como esperabas; (4) busca patrones cualitativos (¿hay algo común en los que sí, en los que no?); (5) acepta la regla estadística básica: con n=10 no se hacen afirmaciones definitivas, se identifican \emph{tendencias} que sugieren la siguiente prueba; (6) declara explícitamente las limitaciones de la muestra en tu informe.
  anatomia:
    titulo: Anatomía del plan de medición
    body: |-
      \textbf{Adquisición:} cuántos llegan + meta. \\[1mm] \textbf{Activación:} cuántos hacen la acción principal + meta. \\[1mm] \textbf{Retención:} cuántos vuelven o responden + meta. \\[1mm] \textbf{Método:} dónde se recoge cada dato. \\[1mm] \textbf{Baseline:} valor inicial de referencia. \\[1mm] \textbf{Umbral de decisión:} qué resultado disparará qué acción.
  errores_comunes: |-
    (1) \textbf{Muestra pequeña interpretada como definitiva}: con n=10 no se concluye, se sugiere. (2) \textbf{Sesgo de confirmación}: leer los datos buscando la conclusión que ya quieres. (3) \textbf{Datos sin baseline}: reportar \emph{``20 inscritos''} sin decir si eso es mucho o poco respecto a la meta. (4) \textbf{Indicador único}: medir solo \emph{``visitas''} y no medir activación ni retención (te quedas en adquisición). (5) \textbf{Métricas de vanidad como prueba}: usar likes o seguidores como evidencia de validación. (6) \textbf{Mezclar datos de distintos canales} sin separar: si 5 vienen de Instagram y 5 de WhatsApp, son dos pruebas distintas. (7) \textbf{No documentar el contexto}: no anotar qué día se lanzó, qué cambió en el camino, qué pasó en el entorno (la fecha y el contexto cambian todo).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA + EXPLICA).} Título: «Actividad 2 --- Anatomía de la medición». \textbf{Formato:} (a) los 6 campos de la anatomía aplicados a tu MVP; (b) lista de los 7 errores con marca del que más temes; (c) tabla preparada para llenar con 10 filas y columnas de tus indicadores. \textbf{Sabes que terminaste cuando} la tabla está lista para recibir los datos esta semana.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Análisis y decisión basada en datos} (30 min en sesión, recolección a lo largo de la semana · individual). Esta actividad se completa al final de la semana, cuando los 10 primeros datos están en la tabla. Aquí no se inventa: se procesa lo recogido, se nombran 3 hallazgos numéricos y se toma una decisión documentada respaldada por la evidencia.
  pilares:
  - |-
    Tu análisis se estructura en 4 bloques de informe: (1) \textbf{Datos crudos}: la tabla con los 10 usuarios y sus comportamientos en cada indicador. (2) \textbf{Cálculos}: ratios y medias por indicador (adquisición \%, activación \%, retención \%). (3) \textbf{3 hallazgos numéricos}: las 3 frases más importantes que dicen los datos (ejemplo: \emph{``de 10 visitantes, 4 completaron formulario = 40\% activación''}, \emph{``de 10 usuarios, 3 respondieron al correo de seguimiento = 30\% retención''}, \emph{``80\% de los inscritos vinieron de WhatsApp, 20\% de Instagram''}). (4) \textbf{Decisión}: \emph{sigo} (el MVP confirma el supuesto), \emph{ajusto} (la dirección es correcta, hay que mejorar X), \emph{pivoto} (los datos sugieren cambiar el supuesto), \emph{descarto} (la evidencia es contraria).
  - |-
    Sigue el patrón \textbf{``hallazgo sobre interpretación''}: en el análisis, prioriza la frase del hallazgo numérico sobre la interpretación. La interpretación viene después y es honestamente provisional con n=10. Por ejemplo: \emph{``Hallazgo: 4/10 completaron el formulario. Interpretación posible: la activación está en un rango razonable para MVP en etapa temprana; conviene confirmar con n=30 antes de decidir''}.
  - |-
    Las 4 decisiones tienen criterios profesionales claros: (a) \textbf{Sigo} si los indicadores cumplieron al menos 70\% de las metas. (b) \textbf{Ajusto} si los indicadores están cerca pero falta refinamiento (50-70\% de meta). (c) \textbf{Pivoto} si los indicadores fallaron pero los datos revelan otro patrón (alguien se inscribió pero por razón distinta a la esperada, algún segmento no previsto respondió). (d) \textbf{Descarto} si los indicadores fallaron y los datos no revelan caminos alternativos. \textbf{Pivotar no es fracasar}; descartar a tiempo tampoco lo es. El fracaso real es seguir adelante sin evidencia.
  - |-
    Algoritmo: (1) calcula los ratios; (2) compara con las metas; (3) escribe los 3 hallazgos numéricos en orden de relevancia; (4) declara las limitaciones (n pequeño, sesgo de canal, sesgo de selección); (5) toma la decisión con justificación de 2 líneas anclada en números, no en sensaciones; (6) si pivotas o ajustas, formula el nuevo supuesto y el plan para la siguiente iteración.
  checklist:
    titulo: Checklist antes de cerrar el análisis
    items: |-
      \checkbox 10 datos reales recogidos durante la semana. \\[1mm] \checkbox Tabla con 1 fila por usuario y columnas de indicadores. \\[1mm] \checkbox Ratios calculados (no solo totales). \\[1mm] \checkbox 3 hallazgos numéricos escritos como frases concretas. \\[1mm] \checkbox Limitaciones de la muestra declaradas explícitamente. \\[1mm] \checkbox Decisión explícita (sigo, ajusto, pivoto, descarto) con justificación numérica. \\[1mm] \checkbox Informe cabe en 1 página.
  plantilla_guion: |-
    \textbf{Datos crudos.} \textit{Tabla 10 filas × N columnas.} \\[1mm] \textbf{Cálculos.} \textit{Adquisición \% + Activación \% + Retención \%.} \\[1mm] \textbf{Hallazgo 1.} \textit{Frase numérica relevante.} \\[1mm] \textbf{Hallazgo 2.} \textit{Frase numérica relevante.} \\[1mm] \textbf{Hallazgo 3.} \textit{Frase numérica relevante.} \\[1mm] \textbf{Limitaciones.} \textit{Tamaño de muestra y sesgos.} \\[1mm] \textbf{Decisión.} \textit{Sigo / Ajusto / Pivoto / Descarto + justificación numérica.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} Título: «Actividad 3 --- Análisis del MVP». \textbf{Formato:} 1 página con tabla de 10 filas + cálculos + 3 hallazgos + limitaciones + decisión documentada. \textbf{Sabes que terminaste cuando} podrías mostrarle el informe a un consultor de datos y defender la decisión solo con la tabla en mano.
  producto_titulo: Plan de medición + 10 datos reales + análisis con 3 hallazgos + decisión documentada
  criterios:
  - 3-5 indicadores accionables con meta y método
  - 10 datos reales recolectados de usuarios del MVP
  - Ratios calculados por indicador
  - 3 hallazgos numéricos escritos como frases concretas
  - Limitaciones de la muestra declaradas explícitamente
  - Decisión documentada (sigo, ajusto, pivoto, descarto) con justificación numérica
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Decidir sobre el otro sin escuchar el dato que el otro produce es repetir la lógica del poder sin verdad.
    aplicacion: |-
      Tu MVP recogió datos de usuarios reales. Esos datos no son tuyos: son la voz numérica de personas que te confiaron 2 minutos de su tiempo. La filosofía de la liberación pide tomarlos en serio aunque contradigan tu hipótesis. Cuando un emprendedor descarta datos adversos porque \emph{``la muestra era pequeña''} mientras acepta datos favorables sin objeción, repite la lógica colonial: solo escucha al otro cuando le da la razón. La phronesis del oficio consiste en \textbf{aceptar el dato con el mismo rigor cuando confirma que cuando contradice}.
    pregunta_espejo: |-
      ¿Estoy tratando los datos adversos con el mismo rigor que los favorables, o solo acepto la evidencia que me da la razón?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Ve las cosas como son, no como te gustaría que fueran; ese es el principio del juicio recto.
    aplicacion: |-
      Es tentador inflar los hallazgos numéricos para que el MVP parezca exitoso, o subestimarlos para tener excusa de pivotar. La disciplina estoica recomienda lo contrario: \emph{describe los números como son, ni más grandes ni más pequeños}. Esa precisión es virtud profesional. El emprendedor que se engaña con sus propios datos toma decisiones sobre arena. La sesión 6 (pitch) y las siguientes castigan sin piedad esa autoindulgencia con un fracaso público.
    pregunta_espejo: |-
      ¿Estoy interpretando los datos como son, o como me conviene que sean para que mi MVP parezca exitoso ante el docente?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Recolectar datos con rigor y limitaciones declaradas es la nueva ética del oficio en la era de la información.
    aplicacion: |-
      La era de la información produce datos por toneladas, pero la calidad ética del dato depende de cómo se recolecta y cómo se comunica. Un análisis profesional declara siempre: el tamaño de la muestra, el método de recolección, los sesgos posibles, las limitaciones. Esa transparencia es virtud técnica contemporánea. Los análisis opacos producen decisiones malas con apariencia de certeza, que es la peor combinación posible.
    pregunta_espejo: |-
      ¿Mi informe declara honestamente las limitaciones (n=10, sesgo de canal, sesgo de selección) o las esconde para sonar más convincente?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el plan de medición, los 10 datos y la decisión documentada. En la sesión 6 vas a construir el \textbf{pitch}: 7 slides + 3 minutos hablados que cuenten la historia del proyecto. Los hallazgos de hoy son la columna vertebral del pitch. Sin datos hoy, el pitch será cuento; con datos hoy, será evidencia.

web:
  conceptos_clave:
    - termino: Indicadores del MVP (3-5)
      definicion: |-
        Métricas específicas con meta numérica que dicen si el MVP funcionó. Ratios (% de conversión) o valores absolutos (cantidad de inscritos). Sin métricas, las decisiones son intuiciones disfrazadas.
      ejemplo: |-
        Para landing: (1) % de visitantes que llenan formulario, (2) cantidad absoluta semanal, (3) % que ofrece pagar. 3 métricas, cada una con meta.
      emoji: "📈"
    - termino: Datos vs anécdotas
      definicion: |-
        Diferencia clave del Lean: anécdota es "una persona me dijo X"; dato es "8 de 10 personas dicen Y". Las decisiones se basan en datos agregados, no en anécdotas memorables.
      ejemplo: |-
        Anécdota: "Don Aurelio dijo que pagaría $50.000". Dato: "8 de 10 tenderos dicen entre $20-30K". Decisión: precio entre $25K. El dato gana.
      emoji: "📊"
    - termino: Decisión binaria con datos
      definicion: |-
        Después de medir, decisión en 4 vías: SIGO (los datos confirman), AJUSTO (ajustes pequeños), PIVOTO (cambio mayor de solución), DESCARTO (problema no es lo que pensaba). La decisión se documenta por escrito.
      ejemplo: |-
        10 datos: 7 confirman tesis, 3 sugieren mejora menor. Decisión: AJUSTO. Cambio el precio y vuelvo a medir 1 semana. La decisión queda registrada con su razón.
      emoji: "🎯"
    - termino: Sesgo del optimista emprendedor
      definicion: |-
        Tendencia natural a interpretar datos ambiguos en sentido positivo. Para evitar: definir criterios antes de medir (S4), tener un compañero crítico que cuestione, mirar números fríos sin narrativa.
      ejemplo: |-
        7 conversiones de 100 visitas. Optimista: "vamos por buen camino". Realista: "es 7%, menor a la meta de 15%; revisar mensaje del landing".
      emoji: "🤔"
    - termino: Conteo riguroso vs aproximaciones
      definicion: |-
        La medición seria cuenta cada dato: cuántos visitaron, cuántos formularios, cuántos ofrecieron pagar. No "varios" ni "muchos" ni "algunos". Números exactos con fecha.
      ejemplo: |-
        Mal: "varios tenderos respondieron interés". Bien: "12 tenderos visitaron el landing entre lunes y viernes; 4 dejaron correo; 2 ofrecieron pagar $25K".
      emoji: "🧮"

  quiz:
    titulo: "¿Sabes recoger datos del MVP con rigor?"
    instrucciones: "5 preguntas sobre medición y análisis de datos."
    preguntas:
      - enunciado: "Tu MVP recibe 100 visitas y 7 formularios. Tu meta era 15 conversiones. ¿Es éxito?"
        opciones:
          - "Sí, recibí formularios."
          - "Depende del clima."
          - "No. 7 < 15. Es por debajo de meta. Hay que ajustar."
          - "Solo si me siento bien."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Meta definida antes (S4) = decisión clara después. 7 < 15, está por debajo. Hay que ajustar (cambiar mensaje, precio, audiencia) antes de seguir.
        feedback_incorrecto: |-
          7 < 15 (meta). Datos por debajo de meta = no éxito. Sin criterios previos cae en sesgo del optimista. Con criterios, decisión clara.
      - enunciado: "Un tendero te dice 'pagaría $50.000'. Otros 9 dicen entre $20-30K. ¿Qué precio fijas?"
        opciones:
          - "$50.000, el de Don Aurelio."
          - "Entre $25-30K, lo que la mayoría aceptaría."
          - "$100.000 a ver."
          - "Gratis."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Datos > anécdota. 9 de 10 dicen $20-30K. La excepción no define precio; la mayoría sí. Anécdotas memorables sesgan; datos agregados deciden.
        feedback_incorrecto: |-
          Datos agregados > anécdota memorable. Don Aurelio es 1 dato; los 9 son 9 datos. Decisión basada en mayoría con datos: $25-30K.
      - enunciado: "Después de medir, las 4 decisiones posibles son..."
        opciones:
          - "Sigo o me rindo."
          - "Espero a ver."
          - "Solo sigo."
          - "Sigo, ajusto, pivoto, descarto."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Las 4 con sus criterios: sigo (datos confirman), ajusto (cambios menores), pivoto (cambio mayor), descarto (no es problema real).
        feedback_incorrecto: |-
          4 decisiones: SIGO + AJUSTO + PIVOTO + DESCARTO. Cada una basada en datos. Documentar la decisión con su razón y referencia a datos.
      - enunciado: "¿Cuál es 'dato' y no 'anécdota'?"
        opciones:
          - "8 de 10 entrevistados pagarían entre $20-30K."
          - "Una persona me dijo que sí."
          - "Mi mamá cree en mi idea."
          - "Sentí buena vibra."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Dato = números agregados con muestra. Anécdota = caso aislado memorable. Las decisiones serias se basan en datos, no anécdotas.
        feedback_incorrecto: |-
          Dato agregado con muestra (8/10) > anécdota individual. Anécdotas son memorables pero sesgan. Datos agregados con números son la base de decisión.
      - enunciado: "Cómo describes tu medición: 'algunos tenderos respondieron interés'. ¿Está bien?"
        opciones:

clave: 3-6
grado: 11
periodo: 3
sesion: 6
completo: true
titulo: Pitch --- contar la historia de tu proyecto
titulo_portada: |-
  Pitch ---
  contar la historia
  de tu proyecto
producto_final: Pitch deck de 7 slides estructurado (problema, afectados, solución, MVP, datos, modelo, llamada) + guion escrito de 3 minutos con tiempos por slide + grabación de ensayo de 3 minutos exactos hecha con celular, escuchada y autocorregida al menos 2 veces
apertura:
  saber_ancestral: |-
    En los corregimientos del Valle del Cauca, en las veredas del Chocó, en las noches de fogón del Pacífico, hay un oficio que sostuvo la educación cuando no había escuelas: \textbf{contar el cuento}. La abuela que enseñaba a los nietos por qué no se camina solo de noche; el abuelo que explicaba el origen del nombre del pueblo; la mayora que transmitía la receta de la viuda de pescado con un relato y no con una lista de ingredientes. El cuento ancestral tenía una arquitectura silenciosa que toda comunidad oral conocía sin nombrarla: (1) \textbf{un comienzo que enganchaba} con una imagen concreta o una pregunta; (2) \textbf{un conflicto que dolía} (alguien quería algo, algo se interpuso); (3) \textbf{una resolución que dejaba enseñanza}. Aristóteles llamó a esto \emph{principio, medio y fin}; los abuelos del Valle lo conocían siglos antes de que el filósofo griego lo escribiera. Quien sabía contar bien era escuchado, recordado, replicado; quien no sabía, hablaba al vacío. \textbf{La narrativa es estructura ancestral, no truco moderno de marketing.}
  saber_contemporaneo: |-
    El \textbf{pitch} (en inglés, \emph{lanzamiento}) es la forma contemporánea más exigente de la narrativa: contar un proyecto entero en 3-5 minutos con estructura narrativa, evidencia y llamada a la acción. Los pitch profesionales más reconocidos (Y Combinator, Sequoia, Bogotá Pitch Fest) comparten una arquitectura de \textbf{7 slides estándar}: (1) Problema, (2) Afectados, (3) Solución, (4) MVP/Producto, (5) Datos/Tracción, (6) Modelo/Negocio, (7) Llamada/Pedido. La regla profesional famosa: \textbf{si no puedes contar tu proyecto en 3 minutos, todavía no lo entiendes}. El pitch no es presentación: es \textbf{filtro narrativo}. Te obliga a destilar 10 sesiones de trabajo en su esencia narrativa más pura, con un comienzo que enganche, un conflicto que duela, una resolución que inspire y una acción concreta que pidas a quien escucha (inversión, alianza, retroalimentación, voto, contratación). El pitch es donde se compromete o se pierde el respeto profesional.
  pregunta_puente: |-
    ¿Qué sabía la abuela del Valle al contar el cuento del fogón, que el emprendedor novato olvida cuando llena 20 slides con tablas y gráficos? ¿Y por qué los pitch más exitosos del mundo se parecen estructuralmente más a un cuento de fogón que a una clase universitaria?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} la \emph{historia mínima} de tu proyecto, capaz de sostener un pitch de 3 minutos: el problema que duele, la solución que alivia, la evidencia que prueba; (2) \textbf{analizar} la arquitectura de 7 slides estándar y aplicarla a tu proyecto con honestidad (no inflando ni inventando); (3) \textbf{crear} tu pitch deck de 7 slides + guion escrito + grabación de ensayo de 3 minutos exactos; (4) \textbf{evaluar} tu pitch escuchándolo grabado, identificando 3 debilidades concretas (verbosidad, rigidez, miedo, falta de evidencia) y corrigiendo al menos 2.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Llevas 5 sesiones de trabajo silencioso: problema (S1), validación (S2), modelo (S3), MVP (S4), datos (S5). Hoy todo eso \textbf{se convierte en historia} de 3 minutos. La sesión 7 trabajará marca, la 8 finanzas; pero el pitch de hoy es la primera vez que el proyecto se vuelve público. Las próximas sesiones afinan; esta sesión define el tono narrativo del cierre.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{destilación}: en 3 minutos personales, cuéntale a un compañero o a ti mismo en voz alta lo que has hecho en las sesiones 1-5. Sin guion, sin slides, sin filtros. Esa primera versión cruda revela qué partes naturalmente recuerdas como importantes y qué partes están floja o ausente.
  a_sistematizacion: |-
    Ya tienes la versión cruda. Ahora vas a entender la \textbf{anatomía del pitch profesional}: los 7 slides estándar con su contenido específico, la regla de tiempo (1 slide ≈ 25-30 segundos), los 6 errores típicos del pitch novato (slide repleta de texto, hablar de uno y no del usuario, datos sin baseline, sin pedido al final, voz monótona, exceso de detalle técnico).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: construir las 7 slides con frases cortas y 1 idea visual por slide, escribir el guion hablado de 3 minutos, ensayar en voz alta sin público, grabarte con el celular, escucharte 2 veces y corregir 2 debilidades.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: pitch deck de 7 slides + guion escrito + grabación de ensayo de 3 minutos. El criterio principal: que un familiar que no conoce tu proyecto, después de ver tu pitch, pueda contarlo en sus propias palabras a otra persona en 1 minuto. Si no puede, el pitch falló su misión.
  a_evaluacion: |-
    Antes de cerrar, mira el pitch desde las cinco dimensiones humanas. Contar tu proyecto con honestidad narrativa es respeto por la audiencia entera; inflar los datos para impresionar es traición al oficio.
  a_triangulo: |-
    Y para terminar, tres voces sobre la palabra y la verdad. Dussel sobre el pitch que da voz al afectado o se la quita, Séneca sobre la sobriedad narrativa, Floridi sobre la ética de comunicar evidencia en la era de la atención escasa.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Cuento crudo de mi proyecto en 3 minutos} (15 min · individual). Sin slides, sin guion escrito, sin filtros: cuéntate a ti mismo (en voz alta, frente al cuaderno o a un espejo, o grabándote con el celular sin editar) lo que has hecho en las sesiones 1 a 5. Reglas: (1) máximo 3 minutos cronometrados; (2) cuenta como si le hablaras a un familiar o amigo, no a un profesor; (3) no leas de la guía: \emph{recuerda}. Al terminar, anota: ¿qué naturalmente recordé primero?, ¿qué olvidé?, ¿qué parte sonó floja o vacía? Esta primera versión cruda es la materia prima del pitch.
  checks:
  - Conté el proyecto en voz alta sin leer guion.
  - Me ajusté a 3 minutos cronometrados.
  - Anoté qué recordé primero, qué olvidé, qué sonó flojo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Cuento crudo de mi proyecto». \textbf{Formato:} 3 párrafos: (a) qué recordé naturalmente primero, (b) qué olvidé que probablemente importa, (c) qué parte sonó floja o vacía. \textbf{Sabes que terminaste cuando} sabes cuáles son tus 2-3 partes débiles narrativamente.
sistematizacion:
  intro: |-
    Un pitch novato es 20 slides desordenadas. Un pitch profesional es 7 slides con arquitectura narrativa. Para que el tuyo sea del segundo tipo necesitas la anatomía estándar del Y Combinator y los errores típicos que matan la atención del oyente en el segundo 20.
  pilares:
  - |-
    El pitch profesional se descompone en 7 slides: (1) \textbf{Problema} (25 seg): el dolor real, con persona concreta y dato (sesión 1-2). (2) \textbf{Afectados} (20 seg): cuántas personas viven este dolor y dónde están. (3) \textbf{Solución} (25 seg): qué propones, en 1 frase con verbo de cambio. (4) \textbf{MVP/Producto} (30 seg): imagen del MVP de la sesión 4 + las 3 piezas (captura, valor, respuesta). (5) \textbf{Datos/Tracción} (30 seg): los 3 hallazgos numéricos de la sesión 5 con honestidad de muestra. (6) \textbf{Modelo} (25 seg): cómo gana plata el proyecto (Canvas reducido a 1 línea). (7) \textbf{Llamada/Pedido} (25 seg): qué le pides al oyente concretamente (alianza, retroalimentación, contacto, inversión, voto, contratación).
  - |-
    La \textbf{regla de tiempo} es ley de oficio: 7 slides × 25-30 segundos = 3 a 3,5 minutos. Si una slide te toma 1 minuto, otras dos quedaron sin tiempo. La phronesis del pitch consiste en \textbf{distribuir el tiempo equitativamente}, con 5 segundos extra solo para la slide de datos (la más importante junto con el problema). El cronómetro es tu mejor crítico.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿el oyente se interesará por el problema antes del segundo 20?}. Si la respuesta es no, perdiste el pitch entero. La slide 1 (problema) es la más importante: tiene que enganchar con imagen concreta, persona real, dato medible, no con generalidades. Los pitch que arrancan con \emph{``en Colombia hay X millones de…''} pierden a la audiencia antes de la primera idea.
  - |-
    Algoritmo: (1) escribe el guion de 3 minutos en prosa antes de hacer las slides (el guion manda, las slides ilustran); (2) descompón el guion en 7 párrafos correspondientes a los 7 slides; (3) reduce cada slide a \emph{1 idea visual + máximo 7 palabras} (regla 7×7 invertida: no más de 7 palabras por slide); (4) diseña con consistencia visual mínima (1 tipografía, 2-3 colores, espacios respirables); (5) ensaya en voz alta sin público; (6) graba con celular y escúchate; (7) corrige 2 debilidades concretas (verbosidad, voz monótona, rigidez, miedo, falta de evidencia).
  anatomia:
    titulo: Anatomía del pitch de 7 slides
    body: |-
      \textbf{1. Problema (25 seg):} dolor con persona y dato. \\[1mm] \textbf{2. Afectados (20 seg):} cuántos y dónde. \\[1mm] \textbf{3. Solución (25 seg):} qué propones en 1 frase. \\[1mm] \textbf{4. MVP (30 seg):} imagen + 3 piezas. \\[1mm] \textbf{5. Datos (30 seg):} 3 hallazgos numéricos. \\[1mm] \textbf{6. Modelo (25 seg):} cómo gana plata. \\[1mm] \textbf{7. Pedido (25 seg):} qué le pides al oyente.
  errores_comunes: |-
    (1) \textbf{Slide repleta de texto}: el oyente lee o escucha, no las dos; si lees lo de la slide, no estás pitcheando. (2) \textbf{Hablar de uno y no del usuario}: \emph{``mi proyecto, mi idea, yo creo''} en lugar de \emph{``María, la tendera, pierde…''}. (3) \textbf{Datos sin baseline ni contexto}: decir \emph{``5 inscritos''} sin comparar con meta ni muestra. (4) \textbf{Sin pedido al final}: cerrar con \emph{``muchas gracias''} en lugar de \emph{``los invito a…''}. (5) \textbf{Voz monótona o leyendo}: leer mata el pitch incluso con datos buenos. (6) \textbf{Exceso de detalle técnico}: explicar la arquitectura Zapier-Sheets-ManyChat a una audiencia que solo quería saber qué hace para el usuario. (7) \textbf{Pasarse del tiempo}: pasar de 3,5 min indica falta de preparación, no de contenido.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía del pitch». \textbf{Formato:} (a) plantilla de 7 slides con título y duración; (b) los 7 errores típicos con marca del que más temes cometer; (c) el guion de 3 minutos en prosa antes de hacer slides. \textbf{Sabes que terminaste cuando} podrías delegar el diseño visual del deck a otro compañero con solo ese guion.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Pitch deck + grabación + autocrítica} (45 min en sesión, 1-2 horas de ensayo en casa · individual). Hora de armar. Construyes el deck de 7 slides en Canva, Google Slides o Keynote; escribes el guion de 3 minutos en prosa; ensayas frente al espejo; grabas con celular; te escuchas 2 veces; identificas 3 debilidades; corriges 2.
  pilares:
  - |-
    Tu pitch deck se construye en 6 pasos: (1) escribir el guion completo en prosa (700-800 palabras = 3 minutos hablados); (2) dividir en 7 párrafos correspondientes a slides; (3) diseñar cada slide con la regla de 7 palabras o menos + 1 imagen o gráfico; (4) usar plantilla mínima consistente (1 tipografía, 2-3 colores, espacios respirables); (5) ensayar 3 veces en voz alta sin grabar para que el cuerpo aprenda; (6) grabar con celular en horizontal, escucharse completo, corregir.
  - |-
    Sigue el patrón \textbf{``palabra hablada sobre slide leída''}: las slides son apoyo visual, no transcripción. Si el oyente puede leer tu slide y entender, no necesita escucharte. La phronesis del pitch consiste en que la slide diga lo mínimo y tu voz diga lo importante. Steve Jobs llamó a esto \emph{``demand attention, not divide it''}.
  - |-
    La autocrítica al escuchar la grabación se estructura en 4 dimensiones: (a) \textbf{Tiempo}: ¿pasé de 3,5 min? ¿alguna slide se llevó demasiado tiempo? (b) \textbf{Voz}: ¿soné monótono o vivo? ¿leí o conté? (c) \textbf{Estructura}: ¿el oyente entendió el problema antes del segundo 20? ¿hice el pedido al final? (d) \textbf{Evidencia}: ¿los 3 hallazgos numéricos quedaron claros con contexto?
  - |-
    Algoritmo: (1) escribe el guion; (2) construye las slides; (3) ensaya 3 veces sin grabar; (4) graba; (5) escúchate completo sin pausar; (6) escúchate de nuevo anotando las 3 debilidades; (7) corrige las 2 más graves antes de la próxima sesión; (8) opcional: pide a un familiar que vea el pitch y te diga si entendió el problema.
  checklist:
    titulo: Checklist antes de entregar el pitch
    items: |-
      \checkbox 7 slides construidas con título y máximo 7 palabras de texto. \\[1mm] \checkbox Guion escrito en prosa de 700-800 palabras. \\[1mm] \checkbox Estructura: Problema, Afectados, Solución, MVP, Datos, Modelo, Pedido. \\[1mm] \checkbox Ensayado 3 veces en voz alta sin grabar. \\[1mm] \checkbox Grabación de 3 minutos exactos hecha con celular. \\[1mm] \checkbox Escucharon la grabación al menos 2 veces. \\[1mm] \checkbox 3 debilidades identificadas, 2 corregidas.
  plantilla_guion: |-
    \textbf{Slide 1 --- Problema (25 seg).} \textit{Persona + dolor + dato.} \\[1mm] \textbf{Slide 2 --- Afectados (20 seg).} \textit{Cuántos y dónde.} \\[1mm] \textbf{Slide 3 --- Solución (25 seg).} \textit{Una frase con verbo de cambio.} \\[1mm] \textbf{Slide 4 --- MVP (30 seg).} \textit{Imagen + las 3 piezas.} \\[1mm] \textbf{Slide 5 --- Datos (30 seg).} \textit{Los 3 hallazgos numéricos.} \\[1mm] \textbf{Slide 6 --- Modelo (25 seg).} \textit{Cómo gana plata.} \\[1mm] \textbf{Slide 7 --- Pedido (25 seg).} \textit{Qué le pides al oyente.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Mi pitch». \textbf{Formato:} (a) guion completo escrito (700-800 palabras); (b) miniaturas de las 7 slides dibujadas o pegadas; (c) ficha de autocrítica con 3 debilidades identificadas y 2 corregidas; (d) link de la grabación o referencia al archivo. \textbf{Sabes que terminaste cuando} la grabación corregida dura entre 3 y 3,5 minutos exactos.
  producto_titulo: Pitch deck de 7 slides + guion escrito + grabación de ensayo de 3 min
  criterios:
  - Estructura de 7 slides estándar respetada
  - Cada slide con máximo 7 palabras + 1 elemento visual
  - Guion escrito en prosa de 700-800 palabras
  - Grabación de 3 minutos exactos hecha con celular
  - Autocrítica con 3 debilidades identificadas
  - Al menos 2 debilidades corregidas antes de cerrar
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Todo pitch decide si da voz al afectado o se la quita; no hay narrativa neutra.
    aplicacion: |-
      Tu pitch puede tener al afectado en el centro (\emph{``María, la tendera del barrio Obrero, pierde 30 mil pesos a la semana porque…''}) o puede tenerse a sí mismo en el centro (\emph{``mi idea es genial porque…''}). La filosofía de la liberación pide lo primero: que la persona que sufre el problema aparezca con nombre, oficio y voz en la slide 1. Sin afectado nombrado, el pitch es propaganda. Con afectado nombrado, el pitch es honesto.
    pregunta_espejo: |-
      En mi slide 1, ¿está el afectado con nombre y voz, o estoy yo con \emph{``mi proyecto''} como protagonista?
  estoico:
    autor: Séneca
    cita: |-
      Habla sobrio o no hables; el discurso inflado revela carácter inflado.
    aplicacion: |-
      Es tentador inflar los datos (\emph{``500 visitas''} cuando fueron 50), exagerar el impacto (\emph{``revolucionario''} cuando es solo útil), prometer escala (\emph{``escalable a millones''} cuando aún no tienes 10 usuarios). La sobriedad estoica recomienda lo contrario: \emph{di lo que es, ni más grande ni más pequeño}. El oyente experimentado detecta la inflación en el segundo 30 y deja de escuchar. La sobriedad es la mayor demostración de seguridad profesional.
    pregunta_espejo: |-
      En mi pitch, ¿estoy diciendo los datos como son (n=10, decisión preliminar), o los estoy inflando para sonar más exitoso?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Comunicar evidencia con honestidad es la nueva ética profesional en la era de la atención escasa.
    aplicacion: |-
      La era de la información compite por atención: cada oyente tiene 100 pitches por mes pidiendo sus 3 minutos. La ética digital contemporánea exige no engañar para retener atención. Pitches que inflan, exageran o ocultan limitaciones erosionan la confianza colectiva en el ecosistema emprendedor. Tu pitch, aunque sea escolar, es entrenamiento ético: si te acostumbras a inflar hoy, lo harás cuando los montos sean reales.
    pregunta_espejo: |-
      ¿Mi pitch declara las limitaciones (muestra pequeña, etapa temprana) o las esconde para sonar más maduro?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el pitch deck terminado, guion escrito y grabación corregida. En la sesión 7 vas a trabajar la \textbf{marca e identidad visual} del proyecto: nombre, paleta, logo, tono. La marca se construye sobre la narrativa del pitch; sin pitch claro hoy, la marca de la próxima sesión será adorno sin alma.

web:
  conceptos_clave:
    - termino: Pitch deck (7 slides)
      definicion: |-
        Presentación corta del proyecto con estructura estándar: problema + afectados + solución + MVP + datos + modelo + llamada. 7 slides es el formato estándar del mundo emprendedor.
      ejemplo: |-
        Slide 1: problema. Slide 2: afectados. Slide 3: tu solución. Slide 4: el MVP. Slide 5: datos de validación. Slide 6: modelo de negocio. Slide 7: llamada a la acción.
      emoji: "🎤"
    - termino: Storytelling emprendedor
      definicion: |-
        El pitch no recita datos: cuenta una historia. Empieza con un humano concreto que tiene un problema, sigue con la solución, cierra con visión. Conecta emocionalmente antes que racionalmente.
      ejemplo: |-
        Mal: "78% de tenderos pierden tiempo en cuentas". Bien: "Don Aurelio, 58 años, pierde 8h cada semana haciendo cuentas a mano que un Excel resuelve en 15 min. Su caso no es único".
      emoji: "📖"
    - termino: Tiempos del pitch (3 minutos)
      definicion: |-
        Pitch de 3 minutos = ~25-30 segundos por slide. Estructura típica: 30s problema + 30s afectados + 60s solución/MVP + 30s datos + 30s modelo + 30s cierre. Practicar con cronómetro.
      ejemplo: |-
        Grabas tu pitch de 3 min con celular. Si sales en 2:30, faltó contenido. Si en 3:30, sobró. Ajustas hasta llegar a 3:00 exactos con todo lo necesario.
      emoji: "⏱️"
    - termino: Llamada a la acción (CTA)
      definicion: |-
        Última frase del pitch que dice exactamente qué quieres del oyente: visitar el sitio, descargar app, dar feedback, comprar, invertir. Sin CTA, el pitch queda colgando.
      ejemplo: |-
        Mal: "Gracias por escuchar". Bien: "Visita cartas-cuentas.com hoy y prueba la herramienta gratis los primeros 7 días". CTA específico, accionable.
      emoji: "👉"
    - termino: Iteración del pitch (mínimo 2 ensayos)
      definicion: |-
        El primer pitch nunca es el final. Grabar, escuchar, ajustar lenguaje, ajustar tiempos. Mínimo 2 ensayos con grabación. Cada iteración mejora claridad y confianza.
      ejemplo: |-
        Primer ensayo: 4 min, voz tensa. Escuchas, cortas 1 min, ensayas con tono más natural. Segundo ensayo: 3 min exactos, fluido. Tercer ensayo: 2:45, sólido.
      emoji: "🔁"

  quiz:
    titulo: "¿Sabes hacer un pitch de 3 minutos?"
    instrucciones: "5 preguntas sobre el pitch emprendedor."
    preguntas:
      - enunciado: "¿Cuántos slides tiene un pitch estándar?"
        opciones:
          - "7"
          - "1"
          - "30"
          - "50"
        respuesta_index: 0
        feedback_correcto: |-
          Sí. 7 slides es el estándar. Estructura: problema + afectados + solución + MVP + datos + modelo + llamada. Lo que no cabe en 7 sobra.
        feedback_incorrecto: |-
          7 slides. Estructura estándar mundial. 30 slides en 3 min = caos. 7 con estructura clara = pitch profesional.
      - enunciado: "¿Cuál es buen storytelling para arrancar?"
        opciones:
          - "78% de tenderos pierden tiempo."
          - "Mi solución revolucionará el mundo."
          - "Don Aurelio, 58 años, pierde 8h cada semana haciendo cuentas a mano que un Excel resolvería en 15 min."
          - "Hay un problema importante."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Humano concreto con nombre + dolor específico. Conecta emocionalmente. El dato 78% va después; el humano va primero.
        feedback_incorrecto: |-
          Storytelling = humano concreto primero, datos después. Don Aurelio con nombre y edad y pérdida específica > estadísticas frías.
      - enunciado: "Tu pitch dura 4 minutos en lugar de 3. ¿Qué haces?"
        opciones:
          - "Lo dejo así, tengo mucho que decir."
          - "Recorto. Cada minuto extra pierde atención. Tres minutos exactos."
          - "Pido más tiempo."
          - "Hablo rápido."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Recortar. 3 minutos es estándar; 4 pierde audiencia. Mejor menos contenido bien dicho que más contenido apresurado.
        feedback_incorrecto: |-
          Recortar siempre. 3 min es estándar. Lo que sobra es secundario. Hablar más rápido se siente acelerado y ansioso.
      - enunciado: "Tu pitch termina con 'Gracias por escuchar'. ¿Está bien?"
        opciones:
          - "Sí, suena cortés."
          - "Sí, los pitches terminan así."
          - "Solo si es viernes."
          - "No. Falta la CTA: qué quieres del oyente (visitar sitio, dar feedback, comprar, invertir)."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. CTA específica. "Gracias" no acciona; "Visita el sitio y prueba gratis" sí. El pitch sin CTA queda colgando.
        feedback_incorrecto: |-
          CTA siempre. Sin llamada a la acción, el pitch no acciona. "Visita X, descarga Y, dame feedback Z" es CTA específica.
      - enunciado: "Tu primer ensayo del pitch fue tenso. ¿Qué haces?"
        opciones:
          - "Pitcho así nomás."
          - "Me rindo."
          - "Grabo, escucho, ajusto. Mínimo 2 ensayos con grabación. Cada uno mejora claridad y confianza."
          - "Pido que pitchee otro."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Iteración con grabación. Primer ensayo es borrador; segundo se afina; tercero es sólido. Sin iteración, el pitch queda crudo.
        feedback_incorrecto: |-
          Iteración con grabación. Escuchar tu propia voz revela tensiones que no sentías. 2-3 ensayos = pitch profesional.

clave: 3-7
grado: 11
periodo: 3
sesion: 7
completo: true
titulo: Presupuesto --- cuánto siembras, cuánto cosechas
titulo_portada: |-
  Presupuesto ---
  cuánto siembras,
  cuánto cosechas
producto_final: Presupuesto detallado del MVP a 3 meses con (a) tabla de costos fijos y variables (con cifras realistas en pesos colombianos), (b) proyección de ingresos en 3 escenarios (pesimista, realista, optimista), (c) cálculo del punto de equilibrio mensual, (d) flujo de caja mes a mes de los próximos 3 meses, y (e) decisión por escrito sobre la viabilidad financiera mínima del proyecto
apertura:
  saber_ancestral: |-
    En las veredas del Valle del Cauca y en las fincas cafeteras del Quindío, ningún campesino sembraba sin antes hacer la \textbf{cuenta de la cosecha}. Esa cuenta no estaba escrita en libros: estaba en la cabeza del mayor y se transmitía a los hijos en las tardes de patio. Tenía 3 columnas claras: (1) \textbf{la siembra}, lo que se invertía antes de ver fruto (semilla, abono, jornales, herramienta, agua). (2) \textbf{la espera}, el tiempo que mediaba entre siembra y cosecha (3 meses para frijol, 9 meses para café, 1 año para plátano), durante el cual no entraba un peso. (3) \textbf{la cosecha}, lo que se esperaba recoger en kilos o en bultos, multiplicado por el precio del mercado más probable, descontando lo que se perdería por plaga, lluvia, transporte. El campesino que no hacía esta cuenta no era llamado \emph{emprendedor visionario}: era llamado \emph{loco} o \emph{novato}, y casi siempre perdía la finca al primer año adverso. La \textbf{phronesis económica campesina} sabía algo que el emprendimiento moderno suele olvidar: \textbf{el cálculo previo no enfría la pasión; la protege de la ruina}.
  saber_contemporaneo: |-
    El \textbf{presupuesto del emprendimiento digital} es exactamente la cuenta de la cosecha aplicada al MVP. Sus 3 piezas son las mismas con otros nombres: \textbf{costos} (lo que siembras), \textbf{horizonte temporal} (la espera), \textbf{ingresos proyectados} (lo que cosechas). A esto se suma una pieza moderna: el \textbf{punto de equilibrio} (break-even), el momento mensual en que los ingresos cubren los costos y dejan de exigir capital nuevo. La regla profesional: \textbf{ningún emprendimiento sin presupuesto a 3 meses sobrevive al cuarto mes}. Los costos se clasifican en dos familias: (a) \textbf{fijos}: ocurren cada mes existan o no ventas (alquiler de dominio, plataforma SaaS, sueldo propio si aplica, internet). (b) \textbf{variables}: dependen del volumen de operación (comisiones por transacción, costos de adquisición por usuario, materia prima, envíos). La phronesis financiera distingue ambos porque la viabilidad del proyecto depende de la \textbf{relación} entre costos fijos altos y margen variable bajo.
  pregunta_puente: |-
    ¿Qué sabía el campesino al hacer la cuenta de la cosecha antes de sembrar, que el emprendedor novato olvida cuando se lanza con \emph{``ya veremos cómo nos va''}? ¿Y por qué un punto de equilibrio claro a 3 meses es señal de oficio profesional, no de pesimismo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los costos fijos y variables reales de tu MVP, con cifras en pesos colombianos verificables; (2) \textbf{explicar} la diferencia entre costos fijos, costos variables, ingresos, margen y punto de equilibrio aplicado a tu proyecto; (3) \textbf{aplicar} la fórmula del punto de equilibrio y construir el flujo de caja mes a mes de los próximos 3 meses; (4) \textbf{evaluar} con honestidad si tu proyecto es viable financieramente o necesita ajustar el modelo antes de seguir.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 5 te dio datos de uso del MVP y la sesión 6 los convirtió en pitch. Hoy le pones \textbf{números financieros} a la propuesta: cuánto cuesta sostenerla, cuánto puede generar, cuándo se equilibra. Las sesiones 8 (ética), 9 (versión final) y 10 (sustentación) se apoyarán en el presupuesto de hoy para hablar con seriedad de futuro.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{inventario honesto} de tus costos reales: qué herramientas usaste para el MVP, cuáles son gratuitas hasta cierto umbral, cuáles cobran desde el primer día, qué tiempo personal estás invirtiendo. Esa lista cruda es el insumo del presupuesto.
  a_sistematizacion: |-
    Ya tienes los costos crudos. Ahora vas a entender la \textbf{anatomía financiera mínima}: las 3 columnas del presupuesto (costos, ingresos, flujo), la distinción entre fijos y variables, la fórmula del punto de equilibrio, los 3 escenarios de proyección (pesimista, realista, optimista) y los 6 errores típicos del presupuesto novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: construir la tabla de costos, proyectar ingresos en 3 escenarios, calcular el punto de equilibrio, dibujar el flujo de caja mes a mes y declarar la decisión financiera por escrito.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: presupuesto a 3 meses + 3 escenarios + punto de equilibrio + flujo de caja + decisión de viabilidad. El criterio principal: que un familiar emprendedor o un asesor financiero, mirando tu hoja, pueda decir en 3 minutos \emph{``este proyecto se sostiene''} o \emph{``a este proyecto le faltan X y Y''}.
  a_evaluacion: |-
    Antes de cerrar, mira el presupuesto desde las cinco dimensiones humanas. Hacer la cuenta con rigor es respeto por uno mismo, por el inversionista futuro y por los usuarios; saltarse la cuenta es invitar a la ruina con buenos modales.
  a_triangulo: |-
    Y para terminar, tres voces sobre la prudencia económica. Dussel sobre los modelos que se sostienen sin extraer, Séneca sobre la sobriedad del cálculo, Floridi sobre la transparencia financiera como ética profesional contemporánea.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario de costos reales del MVP} (20 min · individual). Toma tu MVP de la sesión 4 y lista en una tabla todos los costos que has tenido o tendrás en los próximos 3 meses. Reglas: (1) usa pesos colombianos (COP) con cifras verificables (no inventes, busca el precio real). (2) separa en \textbf{fijos} (cada mes, hayas vendido o no) y \textbf{variables} (dependen del volumen). (3) incluye tu \textbf{tiempo personal} valorado a un costo de oportunidad (mínimo 8.000 pesos por hora si calculas con SMMLV 2026). (4) cubre 7 categorías típicas: dominio/hosting, plataformas SaaS, marketing pagado, herramientas no-code (Tally, Zapier, ManyChat), papelería/impresión, comisiones de pago, tiempo personal. Si una categoría es cero pesos, ponla con 0 (no la omitas).
  checks:
  - Listé costos en pesos colombianos verificables.
  - Separé fijos vs variables.
  - Incluí el costo del tiempo personal.
  - No omití categorías que tienen 0 pesos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Inventario de costos». \textbf{Formato:} tabla 7 filas × 4 columnas (Categoría~|~Fijo o variable~|~Costo mensual COP~|~Fuente del dato). Total mensual al final. \textbf{Sabes que terminaste cuando} los totales suman números reales que podrías defender en una sustentación.
sistematizacion:
  intro: |-
    Una lista de costos sin estructura financiera es ruido contable. Para que tus números tomen forma profesional necesitas la \textbf{anatomía del presupuesto mínimo}: 3 piezas (costos, ingresos, flujo), 2 conceptos (margen, punto de equilibrio), 3 escenarios. Estas piezas son universales: las usa el campesino, el tendero y el emprendedor digital con las mismas matemáticas.
  pilares:
  - |-
    El presupuesto mínimo se descompone en 3 piezas: (1) \textbf{Costos totales}: suma de fijos + variables mensuales. (2) \textbf{Ingresos proyectados}: cuánto entra al mes según número de clientes multiplicado por ticket promedio. (3) \textbf{Flujo de caja}: cuánto queda neto cada mes (Ingresos menos Costos) y cómo se acumula mes a mes. Estas 3 piezas se calculan para los próximos 3 meses, no para 1 año (el primer año es demasiado especulativo en MVP).
  - |-
    El \textbf{punto de equilibrio} (break-even) tiene una fórmula sencilla: \emph{Punto de equilibrio (unidades) = Costos fijos dividido entre (Precio unitario menos Costo variable unitario)}. En palabras: ¿cuántas ventas necesito al mes para que los ingresos cubran los costos? Si tu modelo necesita 200 ventas mensuales para equilibrarse y tu MVP solo ha producido 5 inscripciones en 1 semana, tienes un problema financiero estructural. Detectarlo hoy es phronesis; descubrirlo en el mes 5 es ruina.
  - |-
    Los \textbf{3 escenarios de proyección} son disciplina profesional irrenunciable: (a) \textbf{Pesimista}: 30\% de la meta optimista (qué pasa si solo 3 de cada 10 cosas esperadas ocurren). (b) \textbf{Realista}: 60\% de la meta optimista (el escenario más probable según evidencia actual). (c) \textbf{Optimista}: 100\% de la meta optimista (si todo sale como esperas). La phronesis del emprendedor consiste en \textbf{tomar decisiones con base en el escenario realista, sostenibilidad en el pesimista, ambición en el optimista}. El novato vive solo en el optimista y se quiebra.
  - |-
    Algoritmo: (1) calcula costos totales mensuales; (2) define precio unitario y costo variable unitario; (3) aplica fórmula del punto de equilibrio; (4) define meta optimista de ventas mensuales según evidencia del MVP; (5) calcula los 3 escenarios (30\%, 60\%, 100\%); (6) construye flujo de caja mes 1, 2, 3 para cada escenario; (7) declara la decisión: ¿proyecto financieramente viable o necesita ajustar modelo?
  anatomia:
    titulo: Anatomía del presupuesto a 3 meses
    body: |-
      \textbf{Costos fijos:} mensuales sin ventas. \\[1mm] \textbf{Costos variables:} unitarios por venta. \\[1mm] \textbf{Precio unitario:} cuánto cobras por unidad. \\[1mm] \textbf{Margen unitario:} Precio menos Costo variable. \\[1mm] \textbf{Punto de equilibrio:} Costos fijos divididos entre Margen. \\[1mm] \textbf{3 escenarios:} pesimista 30\% + realista 60\% + optimista 100\%. \\[1mm] \textbf{Flujo de caja:} Ingresos menos Costos mes a mes.
  errores_comunes: |-
    (1) \textbf{Olvidar costos fijos invisibles}: dominio, suscripciones, tiempo personal. (2) \textbf{No separar fijos vs variables}: hace imposible calcular el punto de equilibrio. (3) \textbf{Proyectar solo escenario optimista}: el emprendimiento novato siempre proyecta el techo. (4) \textbf{Confundir ingresos con utilidad}: ingresos brutos no son utilidad neta. (5) \textbf{No incluir el costo del tiempo personal}: el emprendedor se autoexplota y cree que el proyecto es rentable. (6) \textbf{Punto de equilibrio nunca calculado}: imposible decidir si el modelo es viable sin esa cifra. (7) \textbf{Cifras inventadas sin fuente}: los números deben tener fuente verificable.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía financiera». \textbf{Formato:} (a) las 7 piezas de la anatomía aplicadas a tu MVP; (b) los 7 errores con marca del que más temes cometer; (c) cálculo escrito del punto de equilibrio con la fórmula y datos reales. \textbf{Sabes que terminaste cuando} podrías explicarle la lógica del punto de equilibrio a tu familia con ejemplo concreto.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- Presupuesto completo y decisión de viabilidad} (35 min · individual). Hora de aplicar. Construyes la tabla completa en Sheets o cuaderno: 3 meses, 3 escenarios, flujo de caja, punto de equilibrio. Cierras con la decisión documentada: \emph{proyecto viable, viable con ajustes, requiere pivote financiero, no viable}.
  pilares:
  - |-
    Tu presupuesto se construye en 5 pasos: (1) tabla de costos fijos y variables mensuales (de la Actividad 1); (2) cálculo del punto de equilibrio en unidades vendidas; (3) proyección de ventas para 3 escenarios; (4) flujo de caja mes 1, 2, 3 para el escenario realista; (5) decisión de viabilidad financiera por escrito.
  - |-
    Sigue el patrón \textbf{``escenario realista para decidir, pesimista para resistir''}: la decisión sobre seguir o ajustar se toma con base en el escenario realista (60\%); la pregunta sobre cuánto efectivo necesitas tener guardado se calcula con el pesimista (30\%). Esa disciplina dual evita dos errores opuestos: el optimismo ingenuo y el pesimismo paralizante.
  - |-
    Las 4 decisiones financieras posibles tienen criterios claros: (a) \textbf{Viable}: el escenario realista alcanza el punto de equilibrio en el mes 3 o antes. (b) \textbf{Viable con ajustes}: el escenario realista está cerca del punto de equilibrio pero requiere reducir 1-2 costos o subir el precio. (c) \textbf{Requiere pivote financiero}: el escenario realista no alcanza el punto de equilibrio en 6 meses; hay que cambiar segmento, precio o modelo. (d) \textbf{No viable como está}: incluso el optimista no alcanza el punto de equilibrio; el modelo necesita repensarse desde cero.
  - |-
    Algoritmo de cierre: (1) declara la decisión en 1 frase; (2) justifica con 2 cifras concretas (\emph{``decido que es viable con ajustes porque el punto de equilibrio son 80 ventas/mes y el escenario realista proyecta 60''}); (3) anota el cambio que harías si decidiste ajustar; (4) calcula cuánto efectivo necesitas para sostener el escenario pesimista los primeros 3 meses.
  checklist:
    titulo: Checklist antes de cerrar el presupuesto
    items: |-
      \checkbox Tabla de costos fijos y variables con cifras verificables. \\[1mm] \checkbox Costo del tiempo personal incluido. \\[1mm] \checkbox Punto de equilibrio calculado con fórmula. \\[1mm] \checkbox 3 escenarios proyectados (pesimista, realista, optimista). \\[1mm] \checkbox Flujo de caja mes 1, 2, 3 para escenario realista. \\[1mm] \checkbox Decisión de viabilidad escrita y justificada con cifras. \\[1mm] \checkbox Efectivo mínimo de respaldo calculado.
  plantilla_guion: |-
    \textbf{Costos fijos.} \textit{Total mensual COP.} \\[1mm] \textbf{Costos variables.} \textit{Por unidad COP.} \\[1mm] \textbf{Precio.} \textit{Unitario COP.} \\[1mm] \textbf{Punto de equilibrio.} \textit{Costos fijos divididos entre margen unitario = unidades por mes.} \\[1mm] \textbf{Escenarios.} \textit{Pesimista 30\%, realista 60\%, optimista 100\%.} \\[1mm] \textbf{Flujo de caja.} \textit{Mes 1, 2, 3 en escenario realista.} \\[1mm] \textbf{Decisión.} \textit{Viable / Viable con ajustes / Pivote / No viable + justificación.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- Mi presupuesto a 3 meses». \textbf{Formato:} (a) tabla completa de costos, ingresos, flujo; (b) cálculo del punto de equilibrio; (c) los 3 escenarios; (d) decisión de viabilidad en 3 líneas. \textbf{Extensión:} 2 páginas. \textbf{Sabes que terminaste cuando} podrías presentarle el presupuesto a tu familia y defender por qué tu proyecto se sostiene o no.
  producto_titulo: Presupuesto a 3 meses + punto de equilibrio + 3 escenarios + decisión documentada
  criterios:
  - Costos fijos y variables con cifras verificables
  - Tiempo personal incluido en costos
  - Punto de equilibrio calculado con fórmula
  - 3 escenarios proyectados con honestidad
  - Flujo de caja mes a mes para escenario realista
  - Decisión de viabilidad escrita con justificación numérica
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un presupuesto que se sostiene sin extraer es ya una toma de posición ética.
    aplicacion: |-
      Tu presupuesto puede sostenerse de dos maneras: (a) cobrando un margen justo al usuario por valor real entregado, o (b) extrayendo valor más allá del beneficio que devuelves (comisiones ocultas, dependencia generada, precios que aprovechan falta de opciones). La filosofía de la liberación pide la primera vía. Un presupuesto extractivo se ve rentable a corto plazo y se derrumba cuando el cliente encuentra opciones; un presupuesto justo se sostiene a largo plazo aunque el margen sea menor.
    pregunta_espejo: |-
      ¿Mi presupuesto cobra por valor entregado o se sostiene extrayendo más de lo que aporta? ¿Mi cliente, si viera todos mis números, los aprobaría?
  estoico:
    autor: Séneca
    cita: |-
      Calcular antes es virtud; lamentar después es vicio del que se ahorra el cálculo previo.
    aplicacion: |-
      Es tentador saltarse el presupuesto porque \emph{``ya veremos''}. La sobriedad estoica recomienda lo opuesto: \emph{calcula antes, lamenta menos}. El presupuesto no enfría la pasión: la protege. Quien se prohíbe el cálculo previo no está siendo audaz; está siendo perezoso. La phronesis financiera honra a quien hace la cuenta aunque duela, no a quien la evita para mantener el optimismo intacto.
    pregunta_espejo: |-
      ¿Estoy haciendo el cálculo aunque revele problemas, o lo estoy evitando para no enfrentar lo que muestra?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La transparencia financiera es la nueva ética profesional en el oficio digital.
    aplicacion: |-
      Un presupuesto que el cliente o el inversionista nunca podría ver sin escándalo no es modelo sostenible: es modelo opaco. La ética digital contemporánea exige que el emprendedor pueda mostrar sus cifras y defenderlas. Esa transparencia financiera te entrena para una práctica profesional que rige toda carrera técnica del siglo XXI: \textbf{el dato económico bien presentado y bien defendido}.
    pregunta_espejo: |-
      Si mi familia, mi cliente o un inversionista vieran mi presupuesto completo, ¿lo aprobarían o detectarían algo que oculté?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el presupuesto cerrado y la decisión documentada. En la sesión 8 vas a trabajar la \textbf{dimensión ética y legal} del proyecto: política de privacidad, términos de uso, responsabilidad sobre datos. Sin presupuesto sólido hoy, los compromisos éticos de mañana flotarán sin sostén económico.

web:
  conceptos_clave:
    - termino: Presupuesto del MVP
      definicion: |-
        Tabla detallada con todos los costos del proyecto a 3 meses. Separa costos fijos (que no varían con usuarios) y variables (que crecen con uso). Sin presupuesto, el proyecto es esperanza, no plan.
      ejemplo: |-
        Costos fijos: dominio $50K/año, hosting $20K/mes. Variables: $500 por email enviado, $1000 por usuario nuevo. Total mes 1: $80K. Mes 3: $300K con 100 usuarios.
      emoji: "💰"
    - termino: Punto de equilibrio
      definicion: |-
        Cantidad de ventas o usuarios necesarios para que ingresos igualen costos. Antes del punto de equilibrio, pierdes dinero; después, ganas. Sin saberlo, vuelas a ciegas financieramente.
      ejemplo: |-
        Costos fijos $300K/mes + variable $5K/usuario. Precio $30K/usuario. Punto de equilibrio: 12 usuarios/mes (12 × $30K - 12 × $5K = $300K). Por debajo, pérdida.
      emoji: "⚖️"
    - termino: 3 escenarios (pesimista, realista, optimista)
      definicion: |-
        Proyectar ingresos en 3 versiones. Pesimista: 30% de la meta. Realista: 70%. Optimista: 100%+. Si solo proyectas optimista, te sorprende el realista. Si proyectas los 3, decides con base sólida.
      ejemplo: |-
        Meta: 100 usuarios/mes. Pesimista: 30 usuarios = $750K. Realista: 70 usuarios = $1.75M. Optimista: 120 usuarios = $3M. Decides con los 3 a la vista.
      emoji: "📊"
    - termino: Flujo de caja mensual
      definicion: |-
        Tabla mes a mes que muestra entradas y salidas de dinero. Permite ver si en algún momento la caja llega a cero (quiebra). El flujo de caja es lo que mata startups, no la falta de ideas.
      ejemplo: |-
        Mes 1: ingresos $200K, costos $300K, balance -$100K. Mes 2: ingresos $400K, costos $350K, balance +$50K acumulado -$50K. Mes 3: ingresos $700K, costos $400K, balance +$300K acumulado $250K.
      emoji: "📅"
    - termino: Decisión de viabilidad financiera
      definicion: |-
        Conclusión escrita después del presupuesto: ¿el proyecto se sostiene financieramente al menos en el escenario realista? Si la respuesta es no, pivotar el modelo (precio, costos, segmento) antes de continuar.
      ejemplo: |-
        Análisis: en escenario realista, mes 3 = $250K acumulado. Es positivo pero ajustado. Decisión: viable con condición de bajar costos variables 20% antes del lanzamiento.
      emoji: "🎯"

  quiz:
    titulo: "¿Sabes hacer un presupuesto del MVP?"
    instrucciones: "5 preguntas sobre presupuestos y finanzas básicas del emprendimiento."
    preguntas:
      - enunciado: "¿Cuál es diferencia entre costo FIJO y VARIABLE?"
        opciones:
          - "El fijo cambia, el variable no."
          - "El fijo NO cambia con usuarios (renta, dominio). El variable SÍ crece con usuarios (servidor, soporte)."
          - "Son lo mismo."
          - "El variable es siempre más grande."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Fijo = constante mes a mes. Variable = crece con uso. Distinguirlos es clave para escalar bien.
        feedback_incorrecto: |-
          Fijo = no cambia con usuarios. Variable = crece con usuarios. Diferencia fundamental para entender qué pasa cuando creces.
      - enunciado: "Tu costo fijo es $300K/mes, variable $5K/usuario, precio $30K/usuario. ¿Cuál es punto de equilibrio?"
        opciones:
          - "1 usuario."
          - "12 usuarios (12 × ($30K - $5K) = $300K, iguala fijo)."
          - "300 usuarios."
          - "No se puede calcular."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. (Precio - costo variable) × cantidad = costos fijos. ($30K - $5K) × X = $300K → X = 12 usuarios. Por encima ganas; por debajo pierdes.
        feedback_incorrecto: |-
          Punto de equilibrio: 12 usuarios. Fórmula: costos fijos ÷ (precio - costo variable) = 300K ÷ 25K = 12. Sin este número vuelas a ciegas.
      - enunciado: "¿Por qué proyectar 3 escenarios (pesimista, realista, optimista)?"
        opciones:
          - "Para llenar páginas."
          - "Porque si solo proyectas optimista, te sorprende la realidad. 3 escenarios = decisión con piso, techo y centro."
          - "Para impresionar."
          - "Por moda."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. 3 escenarios te protegen del optimismo emprendedor. Pesimista (piso seguro), realista (apuesta), optimista (techo posible). Decides con los 3.
        feedback_incorrecto: |-
          3 escenarios protegen contra el optimismo natural. Si solo proyectas optimista, la realidad es decepción. Con piso definido, decides con seguridad.
      - enunciado: "¿Qué mata startups según el dicho del Lean?"
        opciones:
          - "Falta de ideas."
          - "El flujo de caja (cuando llega a cero, quiebran)."
          - "Falta de creatividad."
          - "No tener logo bonito."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. El flujo de caja mata startups, no la falta de ideas. Si en algún mes la caja llega a cero, se acabó. Proyectar flujo mes a mes es supervivencia.
        feedback_incorrecto: |-
          Flujo de caja = oxígeno. Cero caja = quiebra. La proyección mes a mes detecta dónde puedes morir antes de morir. Sin ese análisis, vuelas ciego.
      - enunciado: "Tu análisis muestra escenario realista en negativo el mes 3. ¿Qué haces?"
        opciones:
          - "Sigo igual, ya veré."
          - "Pivotar el modelo: bajar costos, subir precios, cambiar segmento o postergar lanzamiento."
          - "Pedir más crédito."
          - "Cerrar todo."
        respuesta_index: 1
        feedback_correcto: |-

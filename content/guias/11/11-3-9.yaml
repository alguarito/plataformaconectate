clave: 3-9
grado: 11
periodo: 3
sesion: 9
completo: true
titulo: Versión final del MVP
titulo_portada: |-
  Versión final
  del MVP ---
  la firma del aprendiz
producto_final: MVP versión final integrando todo el aprendizaje del periodo (a) correcciones aplicadas a partir de los hallazgos de la sesión 5, los ajustes financieros de la sesión 7 y los compromisos éticos de la sesión 8, (b) bitácora de cambios documentando cada ajuste con su razón y referencia a la sesión que lo originó, (c) recorrido de calidad por checklist de 12 puntos verificado, (d) carta abierta de 1 página firmada con nombre y fecha que el aprendiz pueda defender públicamente ante cualquier audiencia
apertura:
  saber_ancestral: |-
    En los talleres antiguos del Valle del Cauca y en la tradición de los oficios europeos importada al continente, había un acto ritual que marcaba el paso de aprendiz a oficial: \textbf{firmar la pieza}. El ebanista joven que llevaba tres años de aprendizaje no se llamaba todavía \emph{maestro}: era \emph{aprendiz}. El día que terminaba su primera pieza completa (una mesa, un armario, una silla), el maestro examinaba el trabajo durante una semana: revisaba uniones, lijado, ensamblaje, terminaciones. Si la pieza pasaba el examen, el maestro le permitía al aprendiz \textbf{grabar su nombre en la base con un punzón}. Esa firma era el acto público del oficio: significaba que el aprendiz se hacía responsable de la pieza para siempre, ante cualquier cliente, ante cualquier defecto futuro. Firmar implicaba 3 compromisos: (1) \textbf{defender la pieza ante cualquier crítica}; (2) \textbf{repararla si fallaba}; (3) \textbf{mantener el nombre limpio en el siguiente trabajo}. El aprendiz que rehusaba firmar no era llamado \emph{humilde}: era llamado \emph{inseguro}, y el maestro lo mandaba a rehacer la pieza hasta que pudiera firmarla con orgullo. \textbf{La firma era el verdadero examen, no el diseño.}
  saber_contemporaneo: |-
    La \textbf{versión final del MVP} es exactamente la firma del aprendiz aplicada al oficio digital. Después de 8 sesiones de trabajo (problema, validación, modelo, MVP, datos, pitch, presupuesto, ética), el aprendiz integra todos los aprendizajes en \textbf{una sola entrega defendible}. La regla profesional: \textbf{si no puedes firmar tu MVP con nombre y fecha, todavía no es versión final}. La versión final tiene 3 propiedades irrenunciables: (1) \textbf{Integra los hallazgos}: las correcciones de los datos de S5, los ajustes financieros de S7, los compromisos éticos de S8 están \emph{aplicados}, no solo \emph{prometidos}. (2) \textbf{Bitácora visible}: el aprendiz documenta cada cambio con su razón, demostrando que el MVP evolucionó por evidencia y no por capricho. (3) \textbf{Carta abierta firmada}: el aprendiz redacta una declaración pública de 1 página que pueda defender ante cualquier audiencia (familia, docentes, usuarios, asesores). La phronesis del oficio digital consiste en \textbf{firmar solo lo que se puede sostener en cualquier interrogatorio profesional}.
  pregunta_puente: |-
    ¿Qué sabía el aprendiz al firmar su primera pieza ante el maestro, que el emprendedor novato olvida cuando entrega versión final sin aplicar los hallazgos? ¿Y por qué la firma es más exigente que el diseño, en cualquier oficio antiguo o contemporáneo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} qué hallazgos del periodo (S5 datos, S7 finanzas, S8 ética) exigen ajustes concretos en el MVP; (2) \textbf{evaluar} cada cambio aplicado con un checklist de calidad de 12 puntos; (3) \textbf{crear} la versión final del MVP con todos los ajustes aplicados, documentada en bitácora de cambios; (4) \textbf{explicar} en una carta abierta de 1 página firmada el qué, el porqué y el para qué de tu proyecto, lista para ser leída en cualquier sustentación.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Llevas 8 sesiones de construcción incremental. Hoy es el penúltimo paso: \textbf{integrar todo}. La sesión 10 será sustentación pública; sin versión final lista hoy, la sustentación de mañana será improvisación. La firma del aprendiz es siempre antes del ritual público, no durante.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lectura cruzada} de tus 3 últimas entregas: el análisis de datos (S5), el presupuesto (S7) y la autoevaluación ética (S8). Cada una declaró ajustes pendientes. Vas a listar todos los ajustes prometidos y a marcar cuáles están aplicados, cuáles a medias, cuáles pendientes.
  a_sistematizacion: |-
    Ya tienes la lista de ajustes. Ahora vas a entender la \textbf{anatomía de la versión final}: las 3 piezas obligatorias (MVP ajustado, bitácora de cambios, carta abierta firmada), el \textbf{checklist de 12 puntos} de calidad, y los 6 errores que delatan un MVP \emph{``casi final''}.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: aplicar los ajustes pendientes, llenar la bitácora con cada cambio y su razón, recorrer el checklist de 12 puntos, redactar la carta abierta y firmarla con nombre y fecha.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: MVP versión final + bitácora de cambios + checklist verificado + carta abierta firmada. El criterio principal: que el aprendiz pueda decir con sinceridad \emph{``firmo este proyecto y lo defiendo''} ante cualquier audiencia. Si hay duda al firmar, falta trabajo, no falta valentía.
  a_evaluacion: |-
    Antes de cerrar, mira la versión final desde las cinco dimensiones humanas. Firmar el oficio terminado es respeto por el proceso entero; entregar sin aplicar hallazgos es traicionar las 8 sesiones anteriores.
  a_triangulo: |-
    Y para terminar, tres voces sobre la firma y la responsabilidad. Dussel sobre los productos que asumen al usuario, Marco Aurelio sobre la coherencia del oficio bien hecho, Floridi sobre la responsabilidad digital como ética del autor.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Inventario de ajustes pendientes por aplicar} (15 min · individual). Revisa tus 3 últimas entregas (S5 análisis de datos, S7 presupuesto, S8 ética) y lista todos los ajustes que declaraste pendientes. Para cada ajuste anota: (1) ¿está aplicado, a medias o pendiente?; (2) ¿qué se necesita para terminarlo?; (3) ¿es bloqueante para la sustentación de la próxima sesión? El objetivo es entrar a la actividad 3 con la lista cerrada de \textbf{qué falta} y \textbf{en qué orden} aplicarlo.
  checks:
  - Listé todos los ajustes prometidos en S5, S7, S8.
  - Marqué estado (aplicado, a medias, pendiente) de cada uno.
  - Identifiqué cuáles son bloqueantes para la sustentación.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Ajustes pendientes». \textbf{Formato:} tabla 3+ filas × 4 columnas (Ajuste~|~Sesión origen~|~Estado~|~Bloqueante sí/no). \textbf{Sabes que terminaste cuando} tienes claro qué orden seguirás para aplicar los ajustes esta semana.
sistematizacion:
  intro: |-
    Una versión final sin método de cierre es un MVP cansado, no terminado. Para que tu firma de hoy tenga peso necesitas la \textbf{anatomía profesional del cierre}: 3 piezas, 12 puntos de calidad, 6 errores típicos del aprendiz que firma sin haber pulido.
  pilares:
  - |-
    La versión final se descompone en 3 piezas: (1) \textbf{MVP ajustado}: la versión actualizada con los ajustes aplicados (no solo prometidos); cambios visibles en captura, valor o respuesta. (2) \textbf{Bitácora de cambios}: documento corto donde cada ajuste tiene una fila (fecha, qué cambió, por qué, referencia a la sesión que lo originó). (3) \textbf{Carta abierta firmada}: declaración pública de 1 página estructurada en 3 párrafos (qué hace el proyecto, por qué importa, qué se compromete a entregar el aprendiz) cerrada con nombre y fecha.
  - |-
    El \textbf{checklist de 12 puntos} de calidad cubre 4 dimensiones, 3 puntos cada una: (a) \textbf{Producto}: (1) el MVP funciona end-to-end sin fricciones graves, (2) el copy de cada pantalla es claro y honesto, (3) los enlaces internos no están rotos. (b) \textbf{Datos}: (4) la captura registra correctamente, (5) la base de datos está organizada y consultable, (6) los datos pueden eliminarse a petición del usuario. (c) \textbf{Finanzas}: (7) los precios están visibles si aplica, (8) los costos del MVP están actualizados, (9) el punto de equilibrio mes 3 es alcanzable según escenario realista. (d) \textbf{Ética}: (10) Política de Privacidad accesible desde el MVP, (11) Términos de Uso accesibles, (12) ajuste ético declarado en S8 está aplicado.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿firmaría este MVP con mi nombre y mi fecha hoy mismo?}. Si la respuesta es no, todavía no es versión final. La phronesis del aprendiz consiste en \textbf{no firmar lo que no se puede defender}. Firmar antes de tiempo erosiona el oficio; no firmar nunca por inseguridad también.
  - |-
    Algoritmo: (1) aplica los ajustes pendientes en orden de bloqueo; (2) recorre el checklist de 12 puntos marcando OK o pendiente; (3) corrige los pendientes hasta tener 12/12; (4) llena la bitácora de cambios con cada ajuste; (5) redacta la carta abierta de 1 página; (6) firma con nombre y fecha; (7) léela en voz alta para verificar que la podrías defender ante cualquier audiencia.
  anatomia:
    titulo: Anatomía de la versión final
    body: |-
      \textbf{MVP ajustado:} con cambios aplicados, no solo prometidos. \\[1mm] \textbf{Bitácora de cambios:} fecha + cambio + razón + sesión origen. \\[1mm] \textbf{Checklist de calidad:} 12 puntos en 4 dimensiones. \\[1mm] \textbf{Carta abierta firmada:} 1 página + nombre + fecha. \\[1mm] \textbf{Criterio interno:} ¿firmaría con orgullo hoy?
  errores_comunes: |-
    (1) \textbf{Prometer ajustes y no aplicarlos}: la versión final sin ajustes aplicados es la misma de la sesión 4. (2) \textbf{Bitácora vacía o decorativa}: cada fila debe tener razón y referencia, no descripción genérica. (3) \textbf{Checklist marcado sin revisar}: marcar OK sin probar es autoengaño. (4) \textbf{Carta abierta genérica}: \emph{``este proyecto busca mejorar la vida de las personas''} sin contenido específico es relleno. (5) \textbf{Firma sin convicción}: firmar dudando es señal de trabajo incompleto. (6) \textbf{Carta sin fecha}: la fecha es parte de la firma profesional, no detalle.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Anatomía del cierre». \textbf{Formato:} (a) las 3 piezas anatómicas explicadas; (b) checklist de 12 puntos listo para marcar; (c) los 6 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} entiendes que la firma es el examen real, no el diseño.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EXPLICA --- Versión final firmada} (45 min en sesión, 3-4 horas de trabajo distribuido en la semana · individual). Hora de aplicar y firmar. Aplicas los ajustes pendientes, recorres el checklist hasta 12/12, llenas la bitácora, redactas la carta y firmas.
  pilares:
  - |-
    Tu versión final se produce en 6 pasos: (1) aplicar los ajustes pendientes en orden de bloqueo (los bloqueantes primero); (2) recorrer el checklist marcando cada punto con OK o pendiente; (3) corregir los pendientes hasta 12/12; (4) escribir la bitácora con 1 fila por cambio aplicado; (5) redactar la carta abierta de 1 página en 3 párrafos (qué, por qué, compromiso); (6) firmar con nombre y fecha.
  - |-
    Sigue el patrón \textbf{``aplicación sobre declaración''}: en la versión final, no vale decir \emph{``haré X''}; debe decir \emph{``hice X el día Y''}. La diferencia entre versión final y borrador es esa: la versión final es performativa (lo que dice, ya ocurrió), el borrador es declarativa (lo que dice, todavía no ocurre).
  - |-
    La carta abierta tiene estructura mínima de 3 párrafos: (a) \textbf{Qué}: \emph{``Este proyecto se llama X, atiende el problema de Y, está dirigido al segmento Z, y se sostiene con el modelo W''}. (b) \textbf{Por qué}: \emph{``Lo construí porque [relación personal con el problema]. Aprendí en 10 sesiones que [hallazgo más importante]. Las personas que validaron el proyecto fueron [referencia a las 5 entrevistas]''}. (c) \textbf{Compromiso}: \emph{``Me comprometo a [cumplir lo prometido en Política, Términos, Autoevaluación]. Si el proyecto crece, mantendré [los compromisos éticos]. Si falla, [cómo asumo responsabilidad]''}. Firma con nombre completo + fecha.
  - |-
    Algoritmo final: (1) aplica ajustes; (2) checklist; (3) corrige; (4) bitácora; (5) carta; (6) firma; (7) lee la carta en voz alta y verifica si la podrías defender ante alguien que no te conoce; (8) si dudas, vuelve a 1.
  checklist:
    titulo: Checklist final de los 12 puntos
    items: |-
      \checkbox MVP end-to-end sin fricciones graves. \\[1mm] \checkbox Copy claro y honesto en cada pantalla. \\[1mm] \checkbox Enlaces internos funcionando. \\[1mm] \checkbox Captura de datos registrando bien. \\[1mm] \checkbox Base de datos organizada y consultable. \\[1mm] \checkbox Datos eliminables a petición del usuario. \\[1mm] \checkbox Precios visibles (si aplica). \\[1mm] \checkbox Costos actualizados. \\[1mm] \checkbox Punto de equilibrio alcanzable según escenario realista. \\[1mm] \checkbox Política de Privacidad accesible desde el MVP. \\[1mm] \checkbox Términos de Uso accesibles. \\[1mm] \checkbox Ajuste ético declarado en S8 aplicado.
  plantilla_guion: |-
    \textbf{Bitácora.} \textit{Fecha + cambio + razón + sesión origen.} \\[1mm] \textbf{Checklist.} \textit{12 puntos marcados con OK.} \\[1mm] \textbf{Carta párrafo 1 (qué).} \textit{Nombre del proyecto + problema + segmento + modelo.} \\[1mm] \textbf{Carta párrafo 2 (por qué).} \textit{Relación personal + hallazgo principal + validación.} \\[1mm] \textbf{Carta párrafo 3 (compromiso).} \textit{Compromisos éticos + responsabilidad si falla.} \\[1mm] \textbf{Firma.} \textit{Nombre completo + fecha.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EXPLICA).} Título: «Actividad 3 --- Versión final firmada». \textbf{Formato:} (a) bitácora completa de cambios; (b) checklist de 12 puntos verificado; (c) carta abierta de 1 página firmada con nombre y fecha. \textbf{Extensión:} 2-3 páginas. \textbf{Sabes que terminaste cuando} podrías mostrar tu MVP final a cualquier persona y leer la carta sin dudar.
  producto_titulo: MVP versión final + bitácora + checklist 12/12 + carta abierta firmada
  criterios:
  - Ajustes pendientes de S5, S7, S8 aplicados
  - Bitácora con 1 fila por cambio (fecha, qué, por qué, sesión origen)
  - Checklist de 12 puntos completado en las 4 dimensiones
  - Carta abierta de 1 página en 3 párrafos
  - Firma con nombre completo y fecha
  - Capacidad de defender el MVP ante audiencia desconocida
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Firmar un proyecto es asumir al usuario como prójimo, no como cliente abstracto.
    aplicacion: |-
      Cuando firmas con nombre y fecha, declaras públicamente que tu proyecto tiene una persona responsable detrás, no una entidad anónima. La filosofía de la liberación pide ese acto: nombrarse para asumir responsabilidad por el otro. Las empresas grandes a menudo se esconden detrás de razones sociales y términos legales para diluir responsabilidad; el aprendiz que firma su MVP con su nombre propio hace lo contrario. La phronesis del oficio consiste en \textbf{no esconderse detrás del sistema cuando se firma}.
    pregunta_espejo: |-
      ¿Estoy dispuesto a poner mi nombre real y mi fecha real en la carta abierta? ¿O quisiera firmar bajo seudónimo para no asumir la responsabilidad?
  estoico:
    autor: Marco Aurelio
    cita: |-
      El oficio bien hecho es la única firma que dura; los atajos firman con tinta que se borra.
    aplicacion: |-
      Es tentador firmar la versión final sin haber aplicado los ajustes, esperando que la audiencia no se dé cuenta. La disciplina estoica recomienda lo opuesto: \emph{firma solo lo que se puede sostener bajo examen}. La coherencia entre lo prometido y lo entregado es virtud profesional irrenunciable. Quien firma con descuido pierde la única autoridad que la vida le ofrece: el respeto del oficio bien terminado.
    pregunta_espejo: |-
      Si alguien revisara mi MVP punto por punto contra mis 3 últimas entregas, ¿encontraría coherencia entre lo prometido y lo hecho?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Firmar digitalmente con responsabilidad es la nueva forma de la autoría ética en la infosfera.
    aplicacion: |-
      En la era de la información, los proyectos digitales suelen ser anónimos o colectivos diluidos; identificar al autor es ya un acto de ética. La carta abierta firmada te entrena en una práctica que la cultura digital contemporánea ha erosionado: la autoría asumida. Quien firma su MVP escolar con su nombre y fecha hoy se entrena para firmar sus decisiones profesionales mañana. La autoría es la primera línea de la responsabilidad digital.
    pregunta_espejo: |-
      ¿Mi carta firmada me identifica como autor responsable o me diluye en lenguaje impersonal que esconde quién decide qué?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el MVP versión final, bitácora, checklist verificado y carta abierta firmada. En la sesión 10 vas a hacer la \textbf{sustentación pública}: 15 minutos frente a la audiencia (compañeros, docentes, posiblemente padres y asesores externos) + preguntas + manifiesto final del grado 11. Sin versión final firmada hoy, la sustentación de mañana será defensa de algo todavía en construcción.

web:
  conceptos_clave:
    - termino: Versión final del MVP
      definicion: |-
        Integración de TODOS los aprendizajes del periodo en la versión definitiva del MVP. Aplica las correcciones de la S5 (datos), ajustes de la S7 (presupuesto), compromisos de la S8 (ética).
      ejemplo: |-
        V1 falló por precio alto. Ajustaste a $25K (S5). V2 no cubría costos. Subiste plan anual (S7). V3 excluía sin-smartphone. Agregaste versión SMS (S8). V4 = versión final integrando todo.
      emoji: "🎯"
    - termino: Bitácora de cambios
      definicion: |-
        Documento que registra cada ajuste hecho al MVP, con su razón y referencia a la sesión que lo motivó. Permite trazabilidad y aprendizaje futuro: ¿por qué decidí esto?
      ejemplo: |-
        "Cambio: precio $30K → $25K. Razón: datos S5 mostraron mayoría aceptaba $25K. Referencia: tabla de datos sesión 5. Fecha: 10 mayo 2026".
      emoji: "📓"
    - termino: Checklist de calidad (12 puntos)
      definicion: |-
        Lista verificable de 12 puntos de calidad a revisar antes de declarar la versión final: funcionalidad básica, accesibilidad, privacidad, performance, etc.
      ejemplo: |-
        12 puntos típicos: (1) funciona en móvil, (2) carga <3s, (3) política privacidad visible, (4) términos visible, (5) email funcional, (6) sin bugs críticos, (7-12) específicos del proyecto.
      emoji: "✓"
    - termino: Carta abierta firmada
      definicion: |-
        Documento de 1 página donde el aprendiz declara qué construyó, por qué, qué aprendió, y qué está dispuesto a defender públicamente. Firmar con nombre y fecha implica responsabilidad real.
      ejemplo: |-
        "Yo, María Cárdenas, declaro haber construido [proyecto] entre febrero y mayo de 2026. Su propósito es [X]. Aprendí que [Y]. Defiendo públicamente este proyecto. Firmado. María Cárdenas, 19 mayo 2026."
      emoji: "✒️"
    - termino: Integración de aprendizajes
      definicion: |-
        La versión final NO es solo el último prototipo: es la síntesis de aprendizajes de los 10 sesiones. Cada decisión del proyecto se rastrea a una sesión específica.
      ejemplo: |-
        Decisión: precio $25K. Origen: datos S5. Decisión: pagar plan anual. Origen: análisis presupuesto S7. Cada elemento tiene rastro de qué sesión lo justifica.
      emoji: "🧩"

  quiz:
    titulo: "¿Sabes integrar aprendizajes en la versión final?"
    instrucciones: "5 preguntas sobre la versión final del MVP."
    preguntas:
      - enunciado: "Tu versión final del MVP es..."
        opciones:
          - "Síntesis de aprendizajes de las 10 sesiones, con cada decisión rastreada a su sesión origen."
          - "Solo el último prototipo."
          - "Una nueva idea distinta."
          - "Una copia del primero."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Síntesis con trazabilidad. Cada decisión tiene rastro a la sesión que la motivó. Eso convierte el MVP en versión INTEGRADA, no solo iteración.
        feedback_incorrecto: |-
          Versión final = síntesis integrada de los 10 aprendizajes. Cada decisión rastreada. Sin esa integración, es solo otro prototipo.
      - enunciado: "¿Para qué sirve la bitácora de cambios?"
        opciones:
          - "Para parecer organizado."
          - "Para registrar qué cambió, por qué, y referencia a la sesión. Permite trazabilidad y aprendizaje futuro."
          - "Para llenar páginas."
          - "Solo para impresionar."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Bitácora = memoria razonada del proyecto. Sin ella, en 6 meses no recuerdas por qué decidiste algo. Con ella, defiendes cada decisión.
        feedback_incorrecto: |-
          Bitácora = trazabilidad. Cambio + razón + referencia a sesión. Sin esto, en 3 meses no defiendes tu proyecto porque olvidaste el porqué.
      - enunciado: "Tu MVP pasó el checklist de 12 puntos. ¿Está listo?"
        opciones:
          - "Sí, listo para sustentar."
          - "No, falta meses."
          - "Mejor empiezo de cero."
          - "Casi: falta la carta abierta firmada como cierre."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Checklist + carta abierta firmada. La carta es el compromiso público; sin ella, el proyecto no está cerrado formalmente.
        feedback_incorrecto: |-
          Checklist + carta firmada. La carta implica que defiendes públicamente. Sin firma, queda en buenas intenciones, no compromiso.
      - enunciado: "Tu carta abierta debe decir... (escoge lo más completo)"
        opciones:
          - "Solo el nombre del proyecto."
          - "Solo agradecimientos."
          - "Qué construí, por qué, qué aprendí, qué defiendo públicamente. Firmado con nombre y fecha."
          - "Solo el slogan."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. 4 elementos: qué + por qué + aprendí + defiendo. Firma con nombre y fecha. La carta es declaración pública de autoría.
        feedback_incorrecto: |-
          Carta abierta = qué + por qué + aprendí + defiendo + firma. Sin esos elementos, es decoración. Con ellos, declaración pública de responsabilidad.
      - enunciado: "Decides agregar una función nueva en V4 sin registrarla en bitácora. ¿Qué pasa después?"
        opciones:
          - "Nada, da igual."
          - "Te dan más nota."
          - "En 1 mes no recordarás por qué la agregaste. Si falla, no sabes a qué decisión revertir. La bitácora es memoria operativa."
          - "Es mejor improvisar."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Sin bitácora, pierdes razón de las decisiones. La bitácora es disciplina adulta de profesional, no burocracia.
        feedback_incorrecto: |-
          Sin bitácora, las decisiones se vuelven misterios. Cada cambio + razón + sesión origen. Es 30 segundos por decisión que te ahorra horas de re-aprendizaje.

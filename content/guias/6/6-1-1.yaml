clave: "1-1"
grado: 6
periodo: 1
sesion: 1
completo: true

titulo: "Bienvenida a Tecnología --- cómo aprenderemos este año"
titulo_portada: |-
  Bienvenida ---
  cómo aprenderemos
  Tecnología
  este año

producto_final: |-
  Tu \textbf{cuaderno inaugural de Tecnología} listo para todo el año: portada con tu nombre + grado + año + materia (formato libre pero claro); índice de las \textbf{10 sesiones del periodo 1} (vas a llenar los títulos según la ruta que conozcas hoy); \textbf{compromiso firmado} de 5 acuerdos para trabajar bien este año (asistencia, cuaderno, respeto digital, esfuerzo, ayuda mutua). Más \textbf{en el cuaderno}: una pregunta que te llevas para investigar durante el periodo.

apertura:
  saber_ancestral: |-
    \textbf{En los talleres de Cartago, recibir a un aprendiz nuevo era ritual.} Cuando un muchacho del campo llegaba donde el relojero don Lucho, donde la costurera doña Carmen o donde el panadero don Aurelio, \textbf{el primer día no se trabajaba}. Se conversaba. El maestro le mostraba el taller, le explicaba las herramientas, le decía qué se esperaba de él, qué horario, qué ritmo. \emph{``Aprenda primero a estar en el taller; después aprenderá el oficio''}, decía don Lucho a sus nuevos aprendices. Sin ese día de \textbf{bienvenida y orientación}, el aprendiz se sentía perdido y se iba la primera semana. Con ese día, se quedaba 5 años aprendiendo. \textbf{Nuestra sala de Tecnología es ese taller. Tú eres el aprendiz nuevo}. Hoy no vamos a empezar con Word, ni con internet, ni con hardware. Hoy nos conocemos, vemos el taller, hacemos el pacto. La próxima clase ya empieza el oficio.

  saber_contemporaneo: |-
    Este año en \textbf{Tecnología e Informática} vas a recorrer 3 grandes territorios. \textbf{Periodo 1 (Comunicación e identidad digital):} cómo presentarte en internet, cómo usar correo, cómo cuidarte de riesgos. \textbf{Periodo 2 (Hardware y software):} cómo funciona el computador por dentro y por fuera. \textbf{Periodo 3 (Procesador de texto e Internet):} cómo escribir documentos profesionales y cómo buscar información con criterio. En cada periodo tendrás \textbf{10 sesiones} (la 1 es esta apertura y la 10 cosecha lo aprendido) más una sesión 11 de cierre formal. Cada sesión sigue una estructura MILC: \textbf{saber ancestral} (cómo se hacía antes en Cartago), \textbf{saber contemporáneo} (lo técnico), \textbf{3 actividades} (escuchar, explicar, hacer), y \textbf{triángulo de pensamiento}. Tu cuaderno es la herramienta principal. El computador es el laboratorio. Aprender bien aquí te abre puertas para toda tu vida adulta.

  pregunta_puente: |-
    Si tuvieras que explicarle a tu mamá \emph{en qué consiste el grado 6° en Tecnología}, ¿\textbf{cómo lo harías} con lo que sabes hasta ahora? ¿Tienes una idea, o esperas que el año te lo muestre poco a poco?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} la ruta del periodo 1 (los 10 temas); (2) sabrás \textbf{explicar} qué es el método MILC con tus palabras; (3) podrás \textbf{aplicar} las 5 reglas del cuaderno y del aula; (4) habrás \textbf{firmado} tu compromiso del año.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: te presentas al curso, descubres la ruta del periodo, firmas el compromiso, y dejas el cuaderno listo.
  a_escuta: |-
    Empezamos con un círculo de la palabra: cada uno dice qué espera del año.
  a_sistematizacion: |-
    Después conoces la ruta del periodo 1 (los 10 temas) y las reglas del trabajo.
  a_praxis: |-
    Con todo claro, organizas tu cuaderno y firmas el compromiso.
  a_producto: |-
    El producto es tu cuaderno inaugural + el compromiso firmado.
  a_evaluacion: |-
    Antes de salir, miras tu cuaderno: ¿está listo para empezar la próxima clase sin perder tiempo?
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué llegar bien es la mitad del camino.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Círculo de la palabra} (10 min · individual + grupo). Sentados en U o en círculo, cada estudiante responde 3 preguntas en voz alta (1 frase corta cada una): \emph{(1) ¿Cómo te llamas y de qué barrio vienes?} \emph{(2) ¿Qué esperas de la materia de Tecnología este año?} \emph{(3) ¿Qué te gustaría aprender a hacer en el computador?}. El profe escribe en el tablero \textbf{3 palabras clave} que se repitan entre las respuestas (ejemplo: \emph{``jugar''}, \emph{``Word''}, \emph{``internet''}). Esas palabras se vuelven tu radar del año. \textbf{En el cuaderno:} apunta tus 3 respuestas. Después escribe las 3 palabras clave del grupo.

  checks:
  - Respondí las 3 preguntas en voz alta.
  - Escuché las respuestas de los demás.
  - Anoté en el cuaderno mis respuestas y las 3 palabras del grupo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Círculo de la palabra». \textbf{Formato:} mis 3 respuestas en bloques + las 3 palabras clave del grupo. \textbf{Extensión:} 4 líneas. \textbf{Sabes que terminaste cuando} tienes registro escrito de quién eres y qué esperas, no solo en la cabeza.

sistematizacion:
  intro: |-
    Ahora conoce \textbf{la ruta del periodo 1} y las reglas del trabajo. Esto convierte la materia de \emph{misterio} en \emph{mapa}.

  pilares:
  - |-
    \textbf{La ruta del periodo 1 --- los 10 temas.} \emph{(S1) Hoy: Bienvenida.} \emph{(S2) Mi identidad digital.} \emph{(S3) Mi correo institucional.} \emph{(S4) Netiqueta: 10 acuerdos.} \emph{(S5) Historia de los medios.} \emph{(S6) Mi huella digital.} \emph{(S7) Privacidad y datos personales.} \emph{(S8) Riesgos digitales.} \emph{(S9) Comunicación responsable.} \emph{(S10) Mi presentación digital.} \emph{(S11) Cosecha y evaluación.} Cada una de S2 a S10 es \textbf{una sesión de 60-90 minutos} con un producto en el cuaderno. Si cumples las 10, sales del periodo 1 con la base sólida.
  - |-
    \textbf{El método MILC explicado simple.} Cada sesión empieza con un \textbf{saber ancestral} (cómo se hacía algo en Cartago antes), pasa por \textbf{3 actividades} (una de identificar, una de explicar, una de hacer), cierra con un \textbf{triángulo de pensamiento} (3 voces filosóficas: Dussel, Marco Aurelio o un estoico, y Floridi). \emph{No es decoración:} cada parte tiene un propósito. La ancestral te conecta con tu raíz; las actividades te entrenan en el oficio; el triángulo te entrena a pensar con voces que no son las tuyas. Al final, eres más libre y más sabio.
  - |-
    \textbf{Las 5 reglas del cuaderno y del aula.} \textbf{(1) Cuaderno propio:} 1 cuaderno solo para Tecnología, con cada sesión en página nueva, encabezado fijo. \textbf{(2) Asistencia:} las sesiones se construyen unas sobre otras. Si faltas una, te toca recuperarla solo. \textbf{(3) Respeto digital:} dentro y fuera del aula. Las reglas que aprenderás (netiqueta, privacidad) las aplicas también en tu día. \textbf{(4) Esfuerzo proporcional al objetivo:} no se pide perfección, se pide intento honesto. \textbf{(5) Ayuda mutua:} si terminas, ayuda al de al lado. Si no entiendes, pregunta sin pena. Aquí no se compite; se aprende juntos.
  - |-
    \textbf{Encabezado fijo del cuaderno (cópialo en cada sesión nueva).} En la primera línea de cada sesión escribe: \emph{``Guía: 6° · Periodo [N] · Guía [N]''}. Segunda línea: \emph{``Tema: [título de la guía]''}. Tercera línea: \emph{``Fecha: \_\_/\_\_/2026''}. Esto te entrena en disciplina y le permite a tu yo de fin de año encontrar cualquier sesión en 30 segundos.

  anatomia:
    titulo: Ruta P1 + método MILC + 5 reglas
    body: |-
      \textbf{Ruta P1:} S1 (Bienvenida) → S2 (Identidad digital) → S3 (Correo) → S4 (Netiqueta) → S5 (Historia medios) → S6 (Huella) → S7 (Privacidad) → S8 (Riesgos) → S9 (Comunicación) → S10 (Presentación). \\[1mm]
      \textbf{Método MILC:} saber ancestral + 3 actividades + triángulo. \\[1mm]
      \textbf{5 reglas:} cuaderno propio · asistencia · respeto digital · esfuerzo honesto · ayuda mutua.

  errores_comunes: |-
    \textbf{Errores frecuentes del primer día que te cuestan todo el año.} (1) \emph{No traer cuaderno propio o usar uno compartido con otra materia} --- todo se desorganiza rápido. (2) \emph{Faltar a la S1 pensando ``es solo bienvenida''} --- te pierdes la ruta y el pacto, y te cuesta meses ponerte al día. (3) \emph{Empezar sin compromiso firmado} --- no hay claridad de lo que se espera de ti. (4) \emph{Pensar que la materia es solo ``computador''} --- buena parte del oficio se hace en cuaderno físico. El computador es laboratorio, no televisor. (5) \emph{No preguntar cuando algo no está claro} --- las dudas iniciales se acumulan en confusiones grandes.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- La ruta del periodo y mi compromiso». \textbf{Formato:} 2 bloques. Bloque A: lista numerada de los 10 temas del periodo. Bloque B: las 5 reglas con marca SÍ/NO si me comprometo con cada una. \textbf{Extensión:} 15 líneas. \textbf{Sabes que terminaste cuando} podrías decirle a tu mamá los 10 temas que vas a ver este periodo.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tu cuaderno inaugural + compromiso firmado} (30 min · individual). Vas a dejar tu cuaderno LISTO para empezar el año. Es trabajo manual: portada, índice y compromiso, todo a mano.

  pilares:
  - |-
    \textbf{Paso 1 --- Portada del cuaderno.} En la \textbf{primera hoja} (la de adentro de la tapa o la primera página) escribe en grande: \textbf{``Cuaderno de Tecnología e Informática''}. Debajo: tu nombre completo, grado y letra (6A, 6B, 6C, etc.), I.E. Sor María Juliana, año 2026. Decora la portada como tú quieras (dibujos, colores), pero el nombre y el grado deben ser legibles a 1 metro.
  - |-
    \textbf{Paso 2 --- Índice del periodo 1.} En la \textbf{segunda hoja} escribe \textbf{``Índice --- Periodo 1''}. Debajo, lista numerada de las 10 sesiones del periodo (S1 a S10) con sus títulos cortos. Deja \textbf{una columna a la derecha vacía} con encabezado \emph{``Fecha de la sesión''} --- la llenarás cada vez que veas una sesión. Esto te da una vista del periodo completo.
  - |-
    \textbf{Paso 3 --- Compromiso del año.} En la \textbf{tercera hoja} escribe el título \textbf{``Mi compromiso del año en Tecnología''}. Debajo, escribe las 5 reglas (cuaderno propio, asistencia, respeto digital, esfuerzo honesto, ayuda mutua) y al lado de cada una, una palomita ✓ si te comprometes a cumplirla. Si dudas con alguna, conversa con el profe antes de firmar.
  - |-
    \textbf{Paso 4 --- Pregunta-radar.} Debajo del compromiso, escribe: \textbf{``Pregunta que me llevo para investigar este periodo''}. Después escribe \emph{1 pregunta tuya} que esperarías que se respondiera durante el periodo 1. Ejemplo: \emph{``¿Cómo me protejo de adultos extraños en internet?''}, o \emph{``¿De dónde sale realmente WhatsApp?''}. Esta pregunta te orienta durante las 10 sesiones.
  - |-
    \textbf{Paso 5 --- Encabezado de la S1 (esta sesión).} En la \textbf{cuarta hoja} (o donde te quede natural) escribe el encabezado fijo: \emph{``Guía: 6° · Periodo 1 · Guía 1 --- Bienvenida. Fecha: \_\_/\_\_/2026''}. Debajo, el registro de la Actividad 1 (Círculo de la palabra) que ya hiciste, más el de la Actividad 2 (ruta y reglas), más el de esta misma Actividad 3 (portada, índice, compromiso, pregunta).
  - |-
    \textbf{Paso 6 --- Firma y cierre.} En la última línea de la sesión 1, firma con tu nombre completo y la fecha de hoy. Esa firma cierra el ritual: \emph{eres aprendiz oficial del taller}. La próxima clase empieza el oficio.

  checklist:
    titulo: Antes de salir de la sala
    items: |-
      \checkbox Mi cuaderno tiene portada con nombre, grado, año, materia. \\[1mm]
      \checkbox Hay un índice del periodo 1 con los 10 temas. \\[1mm]
      \checkbox Las 5 reglas del compromiso están firmadas. \\[1mm]
      \checkbox Tengo una pregunta-radar para el periodo. \\[1mm]
      \checkbox La sesión 1 tiene su encabezado y las 3 actividades registradas. \\[1mm]
      \checkbox Firmé con nombre y fecha al final.

  plantilla_guion: |-
    \textbf{Estructura del cuaderno inaugural.} \textit{Hoja 1:} portada (nombre + grado + año + materia). \textit{Hoja 2:} índice P1 (10 temas + columna de fecha). \textit{Hoja 3:} compromiso (5 reglas con palomita + pregunta-radar). \textit{Hoja 4+:} sesión 1 con encabezado fijo + 3 actividades + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Cuaderno inaugural firmado». \textbf{Formato:} portada + índice + compromiso + pregunta + sesión 1 registrada. \textbf{Extensión:} 3-4 hojas. \textbf{Sabes que terminaste cuando} tu cuaderno está listo para empezar la próxima clase sin perder tiempo organizando.

  producto_titulo: Cuaderno inaugural de Tecnología · portada + índice + compromiso firmado
  criterios:
  - La portada tiene nombre completo, grado, año y materia legibles.
  - El índice lista las 10 sesiones del periodo 1 con columna de fecha.
  - Las 5 reglas del compromiso tienen palomita o firma.
  - Hay 1 pregunta-radar personal escrita.
  - La S1 tiene su encabezado fijo y las 3 actividades registradas.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del aprender como acto de dignidad)"
    cita: |-
      ``Llegar a un aula con cuaderno propio, nombre escrito y compromiso firmado, es declararse persona que aprende.''
    aplicacion: |-
      Cuando ponees tu nombre en la portada y firmas el compromiso, no estás haciendo \emph{``trámite''}. Estás declarando: \emph{``yo soy estudiante de Tecnología este año, este es mi cuaderno, esta es mi voz''}. \textbf{Esa declaración es la primera forma de dignidad académica}. Los muchachos del taller de don Lucho hacían lo mismo cuando firmaban el contrato de aprendices. Tú hoy firmas el tuyo.
    pregunta_espejo: |-
      ¿Llegué hoy como persona que aprende, o como persona que pasa por la sala?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Cada principio importa. El que empieza bien camina largo. El que empieza distraído, llega tarde toda la temporada.''
    aplicacion: |-
      Marco Aurelio sabía que \textbf{el primer día marca el tono de los siguientes}. Si hoy llegas con cuaderno listo, atención puesta, compromiso firmado, has aprovechado bien la S1. Si llegas distraído, te demorará semanas ponerte al día. \emph{El primer día NO se recupera}. Por eso es la sesión más importante del periodo, aunque parezca solo bienvenida.
    pregunta_espejo: |-
      ¿Le di a hoy la importancia que tiene, o lo traté como un día cualquiera?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la educación digital)"
    cita: |-
      ``Tecnología no se aprende sola. Se aprende con maestro, con compañeros, con cuaderno, con ritmo. La primera condición es haberlo entendido.''
    aplicacion: |-
      Algunos estudiantes creen que \emph{``aprender computadores se hace solo viendo YouTube''}. Falso. \textbf{Se aprende con todo el ecosistema}: maestro que orienta, compañeros que dan retroalimentación, cuaderno que estructura, ritmo semanal que asienta. La S1 de hoy te enseñó eso: \emph{el oficio se aprende juntos, no en solitario}. Por eso la asistencia, el cuaderno físico y el compromiso son esenciales.
    pregunta_espejo: |-
      ¿Voy a tratar este año como solitario o como aprendizaje en comunidad?

compromiso: |-
  \textbf{Para la próxima sesión.} Trae tu \textbf{cuaderno listo} (portada + índice + compromiso firmado) y tu \textbf{lápiz/lapicero}. Mantén la pregunta-radar en la cabeza. La próxima clase empezamos el oficio: \emph{Mi identidad digital --- cómo me presento en la red sin perderme}. Vas a crear tu primera tarjeta de identidad digital. Hoy te recibiste como aprendiz; la próxima clase entras al taller.

web:
  conceptos_clave:
    - termino: Apertura del periodo
      definicion: |-
        La primera sesión de un periodo de Tecnología (S1). Aquí no se enseña tema técnico todavía: se recibe al estudiante, se muestra la ruta, se establece el pacto. Es la sesión más importante para tener un año exitoso.
      ejemplo: |-
        Hoy en esta S1 no aprendiste Word ni internet. Aprendiste a recibir el año: cuaderno, ruta, compromiso, pregunta-radar. Eso vale más que un tema técnico aislado.
      emoji: "🌱"
    - termino: Método MILC
      definicion: |-
        Estructura pedagógica usada en Plataforma Conéctate. Cada guía tiene: saber ancestral (cómo se hacía en Cartago antes), 3 actividades (identificar, explicar, hacer), triángulo de pensamiento (3 filósofos). Apertura + cosecha cierran cada periodo.
      ejemplo: |-
        En cada sesión que veas: empieza con un saber del barrio (pregonero, relojero, costurera) y termina con 3 voces (Dussel, estoico, Floridi). Eso es MILC.
      emoji: "🎯"
    - termino: Compromiso del año
      definicion: |-
        Acuerdo firmado por el estudiante el primer día de la materia. Establece 5 reglas básicas: cuaderno propio, asistencia, respeto digital, esfuerzo honesto, ayuda mutua. No es opcional: es el pacto.
      ejemplo: |-
        Firmar el compromiso no es trámite. Es declarar "yo soy estudiante de Tecnología este año, asumo estos 5 acuerdos". Si lo firmas con conciencia, te ayuda a sostenerte cuando algo se ponga difícil.
      emoji: "✍️"
    - termino: Cuaderno propio
      definicion: |-
        Un cuaderno usado SOLO para Tecnología (no compartido con otras materias). Cada sesión empieza en página nueva con encabezado fijo (grado, periodo, sesión, tema, fecha). Es la herramienta principal del año.
      ejemplo: |-
        Si usas el cuaderno de Tecnología también para Lenguaje, las páginas se mezclan, los apuntes se pierden, no encuentras nada. Un cuaderno propio te ahorra horas durante el año.
      emoji: "📔"
    - termino: Pregunta-radar
      definicion: |-
        Una pregunta personal que el estudiante define al inicio de cada periodo. Espera respuesta durante las 10 sesiones del periodo. Funciona como brújula: orienta la atención hacia lo que realmente te importa.
      ejemplo: |-
        Tu pregunta-radar podría ser "¿cómo me protejo de extraños en internet?" Las sesiones de privacidad (S6, S7, S8) la responderán. Tener pregunta hace el aprendizaje más activo.
      emoji: "🧭"

  quiz:
    titulo: "¿Tu primer día de Tecnología quedó bien?"
    instrucciones: "5 preguntas para verificar que llegaste bien al año y firmaste el compromiso."
    preguntas:
      - enunciado: "¿Por qué la S1 de cada periodo es importante aunque no enseñe tema técnico?"
        opciones:
          - "Porque es la única sesión fácil del año."
          - "Porque establece la ruta, el método, las reglas y el compromiso. Sin S1, las otras 10 sesiones son difíciles de aprovechar."
          - "Porque no hay que llevar cuaderno."
          - "Porque solo se conversa."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La S1 te da la ruta, el método y el compromiso. Sin esa base, las sesiones técnicas se sienten dispersas. Con esa base, todo se conecta.
        feedback_incorrecto: |-
          La S1 da estructura al periodo: ruta, método, reglas, compromiso. Sin esa apertura, las sesiones se sienten sueltas. Por eso es la más importante.
      - enunciado: "Tu compañero te dice 'no llevemos cuaderno de Tecnología, usemos el de Sociales'. ¿Qué le respondes?"
        opciones:
          - "Tienes razón, ahorramos plata."
          - "Mejor cuaderno propio para Tecnología. Si se mezcla con Sociales, no encontramos nada después y se desorganiza."
          - "Da igual, ningún cuaderno sirve."
          - "Mejor usar el del año pasado."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. El cuaderno propio para Tecnología es regla 1. Mezclar materias hace perder apuntes y desorganiza. Pequeña disciplina, gran ahorro.
        feedback_incorrecto: |-
          Cuaderno propio para Tecnología. Si lo mezclas con otra materia, las páginas se desordenan y no encuentras nada en marzo. Cuaderno separado es regla.
      - enunciado: "El método MILC tiene 3 partes principales en cada guía. ¿Cuáles?"
        opciones:
          - "Solo lectura de texto."
          - "Saber ancestral + 3 actividades + triángulo de pensamiento."
          - "Solo ver videos."
          - "Solo el computador."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Saber ancestral (cómo se hacía antes) + 3 actividades (identificar, explicar, hacer) + triángulo (3 filósofos). Esa estructura se repite en cada sesión.
        feedback_incorrecto: |-
          MILC = saber ancestral + 3 actividades + triángulo. Cada sesión tiene esa estructura. Conocerla te hace aprovecharla mejor.
      - enunciado: "¿Qué es la 'pregunta-radar' del periodo?"
        opciones:
          - "Una pregunta de examen difícil."
          - "Una pregunta personal que tú escoges y esperas responder durante las 10 sesiones. Funciona como brújula."
          - "Una pregunta de la profesora a la clase."
          - "Una pregunta para Google."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Tu pregunta-radar te orienta. Ejemplo: '¿cómo me protejo en internet?' Las sesiones del periodo la responden. Tener pregunta personal hace el aprendizaje activo.
        feedback_incorrecto: |-
          Pregunta-radar = la pregunta que TÚ escoges al inicio del periodo. Las 10 sesiones la responden poco a poco. Es tu brújula del aprendizaje.
      - enunciado: "Acabas de firmar el compromiso. ¿Qué cambió?"
        opciones:
          - "Nada, fue un trámite."
          - "Asumiste 5 acuerdos: cuaderno, asistencia, respeto, esfuerzo, ayuda mutua. Ahora hay claridad de lo que se espera de ti."
          - "El cuaderno te lo regalan."
          - "El profe ya no te puede regañar."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Firmar es declarar 'asumo estos 5 acuerdos'. Te da claridad de qué se espera y a ti te sostiene cuando algo se ponga difícil. No es trámite: es pacto.
        feedback_incorrecto: |-
          Firmar el compromiso es asumir los 5 acuerdos conscientemente. No es decoración: es un pacto que te sostiene cuando algo se ponga difícil en el año.

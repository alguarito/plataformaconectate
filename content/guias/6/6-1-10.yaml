clave: "1-10"
grado: 6
periodo: 1
sesion: 10
completo: true

titulo: "Mi presentación digital --- 2 minutos para mostrar lo que aprendí"
titulo_portada: |-
  Mi presentación
  digital ---
  2 minutos
  para mostrar
  lo aprendido

producto_final: |-
  Una \textbf{mini presentación de 2 minutos} que tú expones de pie ante el grupo. La presentación tiene 4 partes: \textbf{(1) quién soy --- tarjeta de identidad digital (15 seg)}, \textbf{(2) cómo cuido mi correo y mi privacidad (45 seg)}, \textbf{(3) cómo me protejo de riesgos y comunico bien (45 seg)}, \textbf{(4) un compromiso firmado para el resto del año (15 seg)}. Apoyo en \textbf{una sola hoja del cuaderno} con los puntos clave (sin leerla, solo como soporte). Te calificas tú y te califica un compañero usando la rúbrica de la guía.

apertura:
  saber_ancestral: |-
    \textbf{En las casas de la abuela, contar lo aprendido era de respeto.} Cuando un niño volvía del primer viaje a Cali, lo sentaban en la mesa del domingo y le decían: \emph{``Cuente, mijo, qué aprendió''}. No era examen: era forma de honrar el aprendizaje. La familia escuchaba con atención, hacía preguntas, y al final el niño se sentía mayor. \textbf{Lo que se aprende y no se cuenta se olvida; lo que se aprende y se cuenta, queda}. En el centro de Cartago hasta hace poco los abuelos hacían lo mismo: los nietos volvían de la escuela y antes de jugar tenían que contar UNA cosa nueva. Ese hábito fortalece la memoria y el carácter al mismo tiempo. Hoy te toca a ti: \textbf{contar en 2 minutos lo que aprendiste en este primer periodo de Tecnología}.

  saber_contemporaneo: |-
    Hoy es la sesión de \textbf{síntesis}. No es examen ni evaluación final --- esa es la próxima clase (sesión 11). Hoy preparas y presentas una \textbf{mini exposición personal} de 2 minutos donde muestras: quién eres digitalmente, cómo cuidas tu correo y tu privacidad, cómo te proteges y comunicas bien. Lo importante no es decir todo lo que viste --- es escoger 4 ideas claras y comunicarlas \textbf{con voz propia y propósito}. Esta habilidad (presentar tu pensamiento ante otros en pocos minutos) se llama \textbf{pitch} en inglés y se usa toda la vida: en universidad, en trabajo, en proyectos sociales. Hoy haces tu primer pitch.

  pregunta_puente: |-
    Si tu mamá te preguntara esta tarde \emph{``mijo, ¿qué aprendiste este periodo en tecnología?''}, ¿\textbf{podrías responderle en 2 minutos seguidos} sin enredarte? Esta clase te prepara para eso.

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 4 momentos clave de un pitch de 2 minutos; (2) sabrás \textbf{aplicar} las reglas de hablar en público (postura, voz, mirada); (3) habrás \textbf{creado} tu guion de presentación en 1 hoja; (4) habrás \textbf{evaluado} la presentación de un compañero con rúbrica.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: aprendes la estructura del pitch, escribes tu guion, ensayas con un compañero, y presentas al grupo.
  a_escuta: |-
    Empezamos identificando los 4 momentos que toda presentación buena tiene.
  a_sistematizacion: |-
    Después de la estructura, aprendes las 3 reglas de hablar bien en público (postura, voz, mirada).
  a_praxis: |-
    Con la estructura y las reglas, escribes tu guion de 1 hoja y ensayas con un compañero.
  a_producto: |-
    El producto es la presentación de 2 minutos ante el grupo + la hoja de soporte.
  a_evaluacion: |-
    Te autoevalúas y otro compañero te evalúa con la misma rúbrica de 5 criterios.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué saber hablar de lo que sabes te abre puertas.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Los 4 momentos del pitch} (10 min · individual). Imagina que un youtuber famoso visita el colegio y te dice: \emph{``Tienes 2 minutos para contarme qué eres como persona digital y qué aprendiste este periodo. Empieza''}. En el cuaderno escribe \textbf{los 4 momentos} que TÚ usarías para organizar esos 2 minutos. Sin copiar de la guía. Pon: \emph{Momento 1 (15 seg): ...}, \emph{Momento 2 (45 seg): ...}, etc. Después compara con los 4 que vas a aprender en la siguiente actividad.

  checks:
  - Imaginé al youtuber y los 2 minutos.
  - Escribí los 4 momentos con mi propio orden.
  - Respeté los tiempos (15-45-45-15 segundos).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mis 4 momentos del pitch». \textbf{Formato:} 4 viñetas con tiempo y contenido. \textbf{Extensión:} 4 líneas. \textbf{Sabes que terminaste cuando} la suma de tiempos da 2 minutos justos.

sistematizacion:
  intro: |-
    Compara tu propuesta con los 4 momentos que se usan en cualquier pitch de 2 minutos. Es probable que tengas 2 o 3 igual de lo que vas a leer --- esa coincidencia es buena, significa que ya pensabas bien.

  pilares:
  - |-
    \textbf{Momento 1 --- ABRO con quién soy (15 segundos).} Como en una carta: te presentas. Nombre, grado, una frase corta tuya. \textbf{No leas} la tarjeta de identidad digital --- usa una frase corta basada en ella. Ejemplo: \emph{``Soy Lara, de sexto B. En internet me cuido como me cuidaría mi abuela: con criterio.''}.
  - |-
    \textbf{Momento 2 --- CUIDO mis datos y mi privacidad (45 segundos).} Cuenta 3 cosas concretas: (a) cómo configuras tu correo institucional, (b) qué app reconfiguraste en privacidad esta semana, (c) un permiso que le quitaste a una app y por qué. \textbf{No es teoría}, son ejemplos tuyos.
  - |-
    \textbf{Momento 3 --- ME PROTEJO y comunico bien (45 segundos).} Cuenta 3 cosas: (a) las 5 señales de alerta que aprendiste a reconocer, (b) cuáles son tus 3 adultos de confianza (sin dar los nombres si no quieres), (c) los 3 filtros que pasas antes de publicar. Hablas con seguridad porque ya escribiste todo eso en tu cuaderno.
  - |-
    \textbf{Momento 4 --- CIERRO con compromiso (15 segundos).} Termina con tu compromiso firmado: \emph{``Yo me comprometo a [acción concreta] durante el resto del año. Esa es mi promesa.''}. La acción concreta puede ser \emph{``revisar la privacidad de mis apps cada primer sábado del mes''} o \emph{``pasar por mis 3 filtros antes de publicar''}. Lo que tú decidas.

  anatomia:
    titulo: Estructura del pitch de 2 minutos
    body: |-
      \textbf{0:00-0:15} · ABRO --- quién soy en 1 frase. \\[1mm]
      \textbf{0:15-1:00} · CUIDO --- 3 ejemplos de privacidad y datos. \\[1mm]
      \textbf{1:00-1:45} · ME PROTEJO --- 5 señales, 3 adultos, 3 filtros. \\[1mm]
      \textbf{1:45-2:00} · CIERRO --- mi compromiso firmado. \\[1mm]
      \textbf{Total: 2:00 minutos.}

  errores_comunes: |-
    \textbf{Errores que cometen los chicos al hablar en público por primera vez.} (1) \textbf{Leer todo} de la hoja --- la audiencia se aburre. La hoja es soporte, no guion completo. (2) \textbf{Mirar al piso o al techo} --- mira a las personas, una persona por momento. (3) \textbf{Hablar bajito o muy rápido} --- voz normal, pausa entre ideas, respiración tranquila. (4) \textbf{Disculparse al inicio} (\emph{``No sé si lo voy a hacer bien''}) --- llegas, te paras, hablas. (5) \textbf{Memorizar palabra por palabra} --- aprende las ideas, no las palabras. Si te equivocas en una palabra, sigues.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Las 3 reglas para hablar en público». \textbf{Formato:} 3 viñetas con regla + ejemplo personal. \textbf{Extensión:} 3 líneas de 2 frases cada una. \textbf{Sabes que terminaste cuando} sabes qué vas a hacer con tu cuerpo, voz y mirada cuando te toque pararte.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tu guion + ensayo + presentación} (35 min en total: 15 min guion, 5 min ensayo, 15 min presentaciones del grupo). Vas a hacer 3 cosas en orden. Primero escribes tu \textbf{guion en 1 hoja} con los 4 momentos en frases cortas. Después \textbf{ensayas} 1 vez con un compañero (él te escucha, tú lo escuchas a él). Después \textbf{presentas} ante el grupo, 2 minutos.

  pilares:
  - |-
    \textbf{Paso 1 --- Hoja de soporte (no guion completo).} En una hoja del cuaderno escribe los 4 momentos en bloques separados. Para cada momento NO escribas el texto completo --- escribe \textbf{las palabras clave} (4-5 por momento). Ejemplo, Momento 2: \emph{``configurar correo / quitar GPS a TikTok / privado por defecto''}. Esas palabras clave te recuerdan qué decir sin que tengas que leer.
  - |-
    \textbf{Paso 2 --- Practica las 3 reglas de hablar en público.} \emph{Regla 1 (postura):} de pie, pies firmes, manos relajadas (no en los bolsillos). \emph{Regla 2 (voz):} habla un poco más fuerte de lo normal, con pausas. \emph{Regla 3 (mirada):} no mires el piso, mira a 3 compañeros distintos durante los 2 minutos --- 30 segundos cada uno aproximadamente.
  - |-
    \textbf{Paso 3 --- Ensayo en parejas.} Tú le presentas a un compañero (él toma tiempo con el celular). Después él te presenta a ti. \textbf{No corrijan el contenido}; solo díganse 1 cosa que estuvo bien y 1 cosa para mejorar. Ejemplo: \emph{``Buena tu voz, pero me miraste solo a mí. Trata de mirar a 2 más.''}.
  - |-
    \textbf{Paso 4 --- Presentación ante el grupo.} Cuando te toque, vas al frente, te paras tranquilo, respiras una vez, y empiezas con el Momento 1 (quién eres). El profe lleva el tiempo. Si te equivocas en una palabra, no pares: sigues. Si te ríes o te pones nervioso, está bien --- eso le pasa a todos la primera vez.
  - |-
    \textbf{Paso 5 --- Mientras escuchas a otros, evalúa.} Cuando estés sentado oyendo presentaciones de compañeros, evalúa \textbf{a 2 de ellos} con la rúbrica de la próxima actividad. No es para criticar; es para entrenarte a oír con criterio. La evaluación es honesta y amable.
  - |-
    \textbf{Paso 6 --- Autoevaluación al final.} Después de tu presentación, en el cuaderno escribe: \emph{``Lo que me salió bien: ...''}, \emph{``Lo que mejoraría la próxima vez: ...''}. Una frase para cada cosa. Esto es metacognición --- pensar sobre tu propio aprendizaje.

  checklist:
    titulo: Antes de pararte al frente
    items: |-
      \checkbox Tengo la hoja de soporte con los 4 momentos. \\[1mm]
      \checkbox Las palabras clave de cada momento son 4-5 (no es un texto completo). \\[1mm]
      \checkbox Practiqué con un compañero al menos una vez. \\[1mm]
      \checkbox Sé qué voy a decir en cada uno de los 4 momentos. \\[1mm]
      \checkbox Tengo un compromiso concreto para el cierre. \\[1mm]
      \checkbox Estoy listo para mirar a 3 personas distintas durante la exposición.

  plantilla_guion: |-
    \textbf{Hoja de soporte (1 hoja).} \textit{Bloque 1 (15 seg).} Palabras clave del Momento 1. \textit{Bloque 2 (45 seg).} Palabras clave del Momento 2. \textit{Bloque 3 (45 seg).} Palabras clave del Momento 3. \textit{Bloque 4 (15 seg).} Mi compromiso. \textbf{Cada bloque: 4-5 palabras, no más.}

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi pitch de 2 minutos». \textbf{Formato:} hoja de soporte con 4 bloques + autoevaluación al final. \textbf{Extensión:} 1 hoja + 4 líneas de autoevaluación. \textbf{Sabes que terminaste cuando} podrías hacer tu pitch a tu mamá esta noche sin abrir el cuaderno.

  producto_titulo: Pitch de 2 minutos + hoja de soporte + autoevaluación
  criterios:
  - El pitch dura entre 1:45 y 2:15 minutos (cerca de los 2 minutos).
  - Hace los 4 momentos en orden (abro, cuido, protejo, cierro).
  - Usa ejemplos concretos suyos (no teoría).
  - Aplica las 3 reglas (postura, voz, mirada a 3 personas).
  - Cierra con un compromiso concreto y firmado.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del aprendizaje liberador)"
    cita: |-
      ``Saber sin decirlo, no es saber. Decirlo con tu voz lo termina de hacer tuyo.''
    aplicacion: |-
      Hay personas que saben muchas cosas pero no las pueden contar. Esa sabiduría está incompleta. \textbf{Lo que aprendiste este periodo solo se vuelve realmente tuyo cuando lo cuentas con tu voz}, frente a otros. Por eso este pitch no es \emph{``otra tarea''}: es la cosecha. Las plantas crecen en el patio, pero la cosecha se trae a la mesa.
    pregunta_espejo: |-
      ¿Estoy guardando lo que sé para mí, o lo estoy compartiendo para hacerlo realmente mío?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Habla más de lo que has hecho que de lo que vas a hacer. Lo hecho ya te respalda.''
    aplicacion: |-
      En tu pitch no estás \textbf{prometiendo} cosas: estás \textbf{contando lo que ya hiciste}. Hiciste la tarjeta. Configuraste el correo. Auditaste apps. Escribiste el decálogo. \textbf{Eso ya está hecho}. Cuando hablas de cosas ya hechas, hablas con seguridad, porque la prueba es tu cuaderno. La voz se afirma cuando lo dicho ya está respaldado.
    pregunta_espejo: |-
      ¿Estoy hablando de lo que hice (con respaldo) o solo de lo que prometo hacer?

  floridi:
    autor: "Luciano Floridi (filósofo italiano que estudia comunicación)"
    cita: |-
      ``En 2 minutos no se puede decir todo. Se puede decir lo más importante. La habilidad es escoger.''
    aplicacion: |-
      Aprendiste mucho este periodo --- mucho más de lo que cabe en 2 minutos. \textbf{La habilidad valiosa no es saber todo: es saber escoger qué decir cuando el tiempo es corto}. Esa habilidad la vas a necesitar siempre: para una entrevista, para presentar un proyecto, para defender una idea. Hoy fue tu primer pitch. Vendrán muchos más.
    pregunta_espejo: |-
      Si solo tuviera 2 minutos para que mi audiencia se quedara con UNA idea, ¿cuál escogería?

compromiso: |-
  \textbf{Para la próxima sesión.} La sesión 11 (la próxima) es la \textbf{evaluación de cosecha} del periodo: te miras todo lo que hiciste, te autoevalúas con rúbrica, vemos el examen final del periodo, y miras al periodo 2 que empieza. Hoy mostraste lo que sabes. La próxima clase consolidas y te preparas para el siguiente capítulo de tu vida digital.

web:
  conceptos_clave:
    - termino: Pitch
      definicion: |-
        Una presentación corta (2 minutos) donde cuentas con claridad qué eres y qué sabes. Se usa en universidades, empresas y proyectos sociales. Tu primer pitch es esta clase.
      ejemplo: |-
        Un emprendedor pitchea su idea a inversionistas en 2 minutos para que decidan si invierten. Tú haces lo mismo: pitcheas tu aprendizaje a tus compañeros.
      emoji: "🎤"
    - termino: Hoja de soporte
      definicion: |-
        Una hoja con palabras clave (no texto completo) que te ayuda a recordar qué decir sin tener que leer. Es bastón, no muleta. La miras de vez en cuando, no todo el tiempo.
      ejemplo: |-
        Para tu Momento 2 escribes "correo / GPS / TikTok / mensual". Esas 4 palabras te recuerdan toda la idea, no tienes que leer un párrafo.
      emoji: "📋"
    - termino: Postura
      definicion: |-
        Cómo se ve tu cuerpo cuando hablas. De pie, pies firmes, manos relajadas (no en los bolsillos, no cruzadas). La postura comunica seguridad antes de que abras la boca.
      ejemplo: |-
        Pararte derecho con pies a la anchura de los hombros transmite calma. Encorvarte transmite duda. La audiencia lo nota en el primer segundo.
      emoji: "🧍"
    - termino: Mirada distribuida
      definicion: |-
        En vez de mirar a una sola persona (o al piso o al techo), mueves la mirada entre 3 personas durante la presentación. Cada una te recibe un momento. Eso conecta con todos.
      ejemplo: |-
        En 2 minutos miras 30 segundos a tres compañeros distintos: el del fondo derecho, el del centro, el de adelante izquierda. Todos se sienten incluidos.
      emoji: "👀"
    - termino: Autoevaluación
      definicion: |-
        Mirar tu propio trabajo con criterio y honestidad. Decir qué hiciste bien y qué mejorarías. No es para castigarte; es para crecer. Es una de las habilidades adultas más importantes.
      ejemplo: |-
        Después de tu pitch escribes "lo bueno: hablé con voz firme; a mejorar: me olvidé mirar al grupo del fondo". Eso te entrena.
      emoji: "🪞"

  quiz:
    titulo: "¿Sabes hacer un pitch de 2 minutos?"
    instrucciones: "5 preguntas para verificar que dominas la estructura y las reglas del pitch."
    preguntas:
      - enunciado: "Tienes 2 minutos para presentar lo aprendido. ¿Cuántos bloques debería tener tu pitch?"
        opciones:
          - "Un solo bloque seguido sin pausas."
          - "4 momentos: abro, cuido, protejo, cierro."
          - "10 partes para no olvidar nada."
          - "Solo 2: introducción y conclusión."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. 4 momentos en orden: presentarte (15s), datos y privacidad (45s), protección y comunicación (45s), compromiso (15s). Total 2 min.
        feedback_incorrecto: |-
          4 momentos: abrir (15s) + cuidar (45s) + protegerme (45s) + cerrar con compromiso (15s). Simple y claro.
      - enunciado: "Te paras al frente. ¿Cómo debe ser tu postura?"
        opciones:
          - "De pie, pies firmes, manos relajadas."
          - "Encorvado, así me ven más tranquilo."
          - "Apoyado en una pared, así no me canso."
          - "Sentado, así no se nota si tiemblo."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. De pie, pies firmes a la anchura de los hombros, manos relajadas. La postura comunica seguridad antes de hablar.
        feedback_incorrecto: |-
          De pie, pies firmes, manos relajadas. Encorvarte o apoyarte comunica duda. La postura habla antes que tú.
      - enunciado: "Durante los 2 minutos, ¿a dónde miras?"
        opciones:
          - "Al piso, así no me pongo nervioso."
          - "Al techo, parece que estoy pensando."
          - "A 3 compañeros distintos, 30-40 segundos cada uno."
          - "Solo al profe, los demás no importan."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Mirar a 3 compañeros distintos durante los 2 minutos conecta con todo el grupo. Nadie se siente ignorado.
        feedback_incorrecto: |-
          Miras a 3 compañeros distintos. El piso y el techo te aíslan. Mirar solo al profe deja al grupo de lado.
      - enunciado: "La hoja de soporte debería tener..."
        opciones:
          - "El texto completo de los 2 minutos, palabra por palabra."
          - "Solo el título 'Mi presentación'."
          - "Toda la guía resumida."
          - "4-5 palabras clave por cada momento, no texto seguido."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. Palabras clave (no oraciones completas). La hoja es bastón, no muleta: la miras de vez en cuando, no la lees toda.
        feedback_incorrecto: |-
          Palabras clave, no texto completo. Si escribes oraciones enteras vas a terminar leyendo, y la audiencia se pierde.
      - enunciado: "Te equivocas en una palabra durante el pitch. ¿Qué haces?"
        opciones:
          - "Sigo. Una palabra no daña la presentación; un parón sí."
          - "Paro y pido disculpas."
          - "Empiezo de nuevo desde el inicio."
          - "Salgo de la clase corriendo."
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Equivocarse en una palabra es normal. Seguir es lo profesional. La audiencia ya olvidó la palabra al segundo siguiente.
        feedback_incorrecto: |-
          Sigues. Una palabra mal dicha es invisible si tú no le das importancia. Parar y disculparte hace el error 10 veces más grande.

clave: "1-2"
grado: 6
periodo: 1
sesion: 2
completo: true

titulo: "Mi identidad digital --- cómo me presento en la red sin perderme"
titulo_portada: |-
  Mi identidad
  digital ---
  quién soy en la red

producto_final: |-
  Una \textbf{tarjeta de identidad digital} hecha en el cuaderno, con tu nombre, tu foto-dibujo, 3 cosas que te gusta hacer, 2 cosas que cuidas (que NO le cuentas a desconocidos), y \textbf{1 frase que te describa que tú mismo escribas} (no la copies de internet). Producto físico, no digital todavía. Lo muestras al final de la clase.

apertura:
  saber_ancestral: |-
    \textbf{¿Sabes qué hacía el pregonero del barrio?} Antes de los celulares, en cada cuadra del centro de Cartago caminaba el pregonero. Tocaba una campanita y gritaba: \emph{``Reunión del barrio el sábado, traer ladrillos para arreglar el parque.''} Llevaba mensajes casa a casa. Su voz lo identificaba: \textbf{ese pregonero era ese pregonero}. Si dañaba un mensaje, lo conocían y le decían: \emph{``Don Aurelio, esa noticia no la entregó bien.''} Si la entregaba bien, lo buscaban para más. \textbf{Su nombre y su voz eran su identidad}. La cuidaba porque la necesitaba para vivir. En internet pasa parecido: lo que firmas con tu nombre se queda. Si lo cuidas, te abre puertas. Si no, también se queda. Solo que en internet, mucha más gente te ve.

  saber_contemporaneo: |-
    Tu \textbf{identidad digital} es el grupo de cosas que la gente puede ver de ti cuando te buscan en la red. No es solo tu nombre. Es: \textbf{tu foto, tu apodo, lo que escribes, lo que comentas, los videos que subes, los grupos donde estás}. Cada vez que pones algo en internet, agregas un pedacito a esa identidad. Algunas cosas se borran fácil. Otras no. Por eso esta sesión es importante: \textbf{antes de poner algo en la red, decide tú qué quieres que esa identidad cuente de ti}. Empezamos hoy con un ejercicio muy concreto: vas a hacer una \emph{tarjeta de identidad digital} en tu cuaderno. Sin computador, sin celular. Solo lápiz.

  pregunta_puente: |-
    Si alguien te buscara en internet hoy mismo, ¿qué \textbf{cosas tuyas} encontraría? ¿Te gusta lo que vería?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{decir con tus palabras} qué es identidad digital; (2) sabrás \textbf{distinguir} cosas que sí se cuentan en la red de cosas que no; (3) habrás \textbf{hecho} tu tarjeta de identidad digital en el cuaderno.

puentes:
  a_ruta: |-
    Hoy vas a hacer 3 cosas: leer un poco, pensar un poco y dibujar tu tarjeta de identidad digital.
  a_escuta: |-
    Empezamos con un juego mental: imagina que un primo lejano te busca en internet por primera vez.
  a_sistematizacion: |-
    Después de pensar en el primo, vas a aprender 4 reglas para cuidar tu identidad digital sin esfuerzo.
  a_praxis: |-
    Con las 4 reglas, dibujas tu propia tarjeta de identidad en el cuaderno.
  a_producto: |-
    El producto es esa tarjeta: la pegas en la primera página del cuaderno de Tecnología.
  a_evaluacion: |-
    Antes de terminar, miras tu tarjeta y te preguntas: \emph{``Si mi mamá viera esto, ¿le gustaría cómo me presento?''}
  a_triangulo: |-
    Y para cerrar, 3 voces antiguas tienen algo que decirte sobre cuidar la palabra propia.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Imagina al primo curioso} (10 min · individual). Cierra los ojos un momento. Imagina esto: un primo tuyo de otra ciudad, al que casi no conoces, escucha que estás en Cartago y \textbf{te busca en internet}. Ahora abre los ojos y \textbf{escribe en el cuaderno} qué cosas crees que encontraría sobre ti: \emph{¿Una foto? ¿Tu nombre? ¿Algún video tuyo? ¿Comentarios en juegos? ¿Tu Tik Tok? ¿Nada?}. \textbf{Anota 5 cosas} que crees que tu primo encontraría. No tienen que ser todas verdaderas; pueden ser cosas que tú \emph{sospechas} que hay.

  checks:
  - Cerré los ojos y pensé en el primo.
  - Escribí 5 cosas que él encontraría de mí.
  - No me dio pena escribir las verdaderas.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- El primo curioso». \textbf{Formato:} lista numerada de 5 cosas. \textbf{Extensión:} 5 viñetas cortas, una línea cada una. \textbf{Sabes que terminaste cuando} tienes 5 cosas escritas y ninguna te dio risa o pena al escribirla.

sistematizacion:
  intro: |-
    Lo que acabaste de hacer es mirar tu identidad digital actual. Ahora vas a aprender \textbf{4 reglas} para cuidarla. Son simples y van a servirte toda la vida.

  pilares:
  - |-
    \textbf{Regla 1 --- Tu nombre completo no se regala.} Tu nombre y apellidos completos son tuyos. No los pongas en sitios desconocidos. Para juegos y apps usa un \emph{apodo}: \texttt{LaraDelValle12} es mejor que \texttt{Lara Cárdenas Martínez}.
  - |-
    \textbf{Regla 2 --- Las fotos quedan.} Una foto que subes hoy puede aparecer en 10 años. Antes de subir una foto: ¿la mostrarías en clase? Si la respuesta es no, no la subas.
  - |-
    \textbf{Regla 3 --- Lo que escribes te firma.} Cada comentario, cada mensaje, lleva tu nombre o apodo. Si vas a escribir algo, léelo dos veces y pregunta: \emph{``¿Esto suena a mí o suena raro?''}.
  - |-
    \textbf{Regla 4 --- Lo importante NO se cuenta en internet.} Tu dirección, tu colegio exacto, los horarios que llegas a casa, fotos donde se ve el uniforme: esas cosas se cuentan en persona, a quien conoces de verdad.

  anatomia:
    titulo: Las 4 reglas para recordar
    body: |-
      \textbf{Regla 1.} Mi nombre completo no se regala. \\[1mm]
      \textbf{Regla 2.} Las fotos quedan. \\[1mm]
      \textbf{Regla 3.} Lo que escribo me firma. \\[1mm]
      \textbf{Regla 4.} Lo importante se cuenta en persona.

  errores_comunes: |-
    \textbf{Errores que cometen tus compañeros (y a veces tú también).} (1) Usar el nombre completo en juegos en línea --- los adultos malos buscan así. (2) Subir fotos donde se ve el uniforme del colegio --- cualquiera sabe dónde estás cada día. (3) Compartir contraseña con \emph{``mi mejor amigo''} --- la amistad cambia, la contraseña queda. (4) Aceptar solicitudes de gente que no conoces porque ``tienen muchos amigos en común''.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Las 4 reglas con mis palabras». \textbf{Formato:} las 4 reglas re-escritas \emph{con tu propia voz}, una por línea. Después dibuja 1 ícono al lado de cada una (lo que quieras). \textbf{Extensión:} 4 frases cortas + 4 íconos. \textbf{Sabes que terminaste cuando} podrías explicarle las 4 reglas a un hermano menor sin abrir el cuaderno.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Mi tarjeta de identidad digital} (30 min · individual). Hora de hacer la tarjeta. Vas a usar \textbf{una hoja del cuaderno completa}, no media. Vas a dibujar, escribir y firmar. Sigue los 6 pasos con calma. No hay prisa.

  pilares:
  - |-
    \textbf{Paso 1.} En la parte superior de la hoja escribe en grande: \textbf{``Mi identidad digital''}. Debajo, tu nombre real (porque esta tarjeta es para ti, no para subir a internet).
  - |-
    \textbf{Paso 2.} Dibuja un cuadro grande en el centro de la hoja. Adentro dibuja un \textbf{retrato tuyo} (un dibujo, no foto). No tiene que estar perfecto. La idea es que se parezca a ti, no a alguien más.
  - |-
    \textbf{Paso 3.} Al lado del retrato, escribe \textbf{3 cosas que te gusta hacer}. Pueden ser cualquier cosa: jugar fútbol, dibujar mangas, oír reguetón, cocinar con tu abuela, hablar con tu hermana. Cosas reales, no las que ``deberías'' decir.
  - |-
    \textbf{Paso 4.} Debajo, escribe \textbf{2 cosas que cuidas}. Son cosas que NO le cuentas a desconocidos. Ejemplo: tu dirección, una historia familiar, una contraseña, un secreto pequeño. No las escribas explícitas en la tarjeta, escribe solo \textbf{el tema}: \emph{``mi dirección''}, \emph{``mi familia''}.
  - |-
    \textbf{Paso 5.} Abajo, escribe \textbf{1 frase} que te describa. Una frase que tú mismo inventes, no copiada de TikTok. Ejemplo: \emph{``Soy Lara, me gustan los gatos y las matemáticas raras.''}.
  - |-
    \textbf{Paso 6.} En la esquina inferior derecha, firma con \textbf{tu nombre completo y la fecha de hoy}. Esta tarjeta queda firmada como tuya. La vas a pegar en la primera página del cuaderno de Tecnología.

  checklist:
    titulo: Antes de pegar la tarjeta
    items: |-
      \checkbox La tarjeta cabe en una hoja entera del cuaderno. \\[1mm]
      \checkbox Hay un retrato tuyo dibujado. \\[1mm]
      \checkbox Están 3 cosas que te gusta hacer (cosas reales). \\[1mm]
      \checkbox Están 2 cosas que cuidas (solo el tema, no el contenido). \\[1mm]
      \checkbox La frase que te describe la escribiste tú. \\[1mm]
      \checkbox Firmaste con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura de la tarjeta.} \textit{Arriba:} título + tu nombre. \textit{Centro:} retrato dibujado. \textit{Lado derecho:} 3 cosas que te gustan. \textit{Abajo:} 2 cosas que cuidas + 1 frase tuya. \textit{Esquina:} firma + fecha.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi tarjeta de identidad digital». \textbf{Formato:} dibujo de hoja completa con texto y retrato. \textbf{Extensión:} 1 página entera del cuaderno. \textbf{Sabes que terminaste cuando} muestras la tarjeta al profe y él dice ``esa eres tú''.

  producto_titulo: Tarjeta de identidad digital · firmada y pegada en el cuaderno
  criterios:
  - La tarjeta ocupa una hoja completa.
  - Tiene los 5 elementos (título, retrato, gustos, cuidados, frase).
  - La frase que describe al estudiante fue inventada por él/ella.
  - Está firmada con nombre y fecha.
  - Cumple las 4 reglas aprendidas hoy (no datos sensibles visibles).

triangulo:
  dussel:
    autor: "Enrique Dussel (un pensador colombiano-argentino que escribió mucho sobre dignidad)"
    cita: |-
      ``Mi voz cuenta tanto como cualquier otra. Mi nombre vale lo mismo que cualquier nombre.''
    aplicacion: |-
      Hay un montón de gente en internet con nombres famosos, con miles de seguidores, con voces muy ruidosas. Pero \textbf{tu voz también cuenta}. Tu identidad digital no necesita parecerse a la de un youtuber para tener valor. Vale por ser tuya. Cuídala como vale.
    pregunta_espejo: |-
      ¿Estoy intentando parecer alguien más en internet, o estoy contando quién soy de verdad?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Lo que escribes hoy queda. Escribe entonces como si lo fueras a leer dentro de 10 años.''
    aplicacion: |-
      Hay cosas que escribes hoy de las que dentro de 10 años te vas a arrepentir. Otras te van a gustar leerlas. La diferencia está en cuidar lo que escribes, no en cuántos likes te dan ahora. Antes de subir algo, pregúntate: \emph{``¿Yo en 10 años, leyendo esto, me sentiría orgulloso?''}.
    pregunta_espejo: |-
      ¿Lo que voy a escribir aguanta el paso del tiempo, o me daría pena dentro de unos años?

  floridi:
    autor: "Luciano Floridi (un filósofo italiano que piensa mucho sobre internet)"
    cita: |-
      ``Internet es una conversación enorme entre muchas voces. Tú también eres una de esas voces.''
    aplicacion: |-
      Cada vez que escribes algo en internet, lo metes a una conversación gigante donde millones de personas hablan. Tu identidad digital es \textbf{tu manera de meterte a esa conversación}. Puedes meterte con respeto o gritando. Las dos formas cuentan, pero hacen mundos distintos.
    pregunta_espejo: |-
      Cuando me meto a internet, ¿estoy aportando algo o solo agregando ruido?

compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu \textbf{tarjeta pegada en la primera página del cuaderno}. La próxima clase activas tu correo institucional --- la primera dirección que firmas como tuya. Lo que aprendiste hoy te va a servir: el correo lleva tu nombre. Cuídalo como cuidas tu tarjeta.

web:
  conceptos_clave:
    - termino: Identidad digital
      definicion: |-
        Es el grupo de cosas que la gente puede ver de ti cuando te busca en internet. Tu nombre, tus fotos, lo que escribes, los grupos donde estás.
      ejemplo: |-
        Si alguien busca tu apodo en TikTok y encuentra 5 videos tuyos cantando, esos videos son parte de tu identidad digital.
      emoji: "🪪"
    - termino: Pregonero
      definicion: |-
        Persona que en los pueblos antes de los celulares iba casa por casa llevando mensajes. Su nombre y su voz eran su identidad.
      ejemplo: |-
        En el centro de Cartago caminaba el pregonero con campanita gritando reuniones del barrio. Si dañaba un mensaje, todos sabían quién había sido.
      emoji: "📣"
    - termino: Apodo (nickname)
      definicion: |-
        Nombre corto que usas en juegos, apps y chats. No es tu nombre real. Te protege porque nadie sabe quién eres por completo.
      ejemplo: |-
        En lugar de poner "Lara Cárdenas Martínez" en un juego, pon "LaraDelValle12". Sigues siendo tú, pero te cuidas más.
      emoji: "🎭"
    - termino: Foto digital
      definicion: |-
        Una foto que subes a internet ya no es solo tuya. Otras personas pueden guardarla, copiarla, compartirla. Aunque tú la borres después, copias pueden quedar.
      ejemplo: |-
        Si subes una foto de tu cumpleaños y un amigo le da captura, esa foto vive en su celular aunque tú la borres del tuyo.
      emoji: "📸"
    - termino: Dato sensible
      definicion: |-
        Una información tuya que es mejor NO publicar en internet. Tu dirección, tu colegio exacto, los horarios en que estás solo en casa.
      ejemplo: |-
        Decir "vivo en Cartago" está bien. Decir "vivo en la carrera 14 con calle 8 frente a la panadería" no está bien.
      emoji: "🔒"

  quiz:
    titulo: "¿Cuidas tu identidad digital?"
    instrucciones: "5 preguntas para verificar que entiendes cómo cuidarte en la red. Si dudas, vuelve a leer la guía."
    preguntas:
      - enunciado: "Tu primo lejano te busca en internet por primera vez. ¿Qué encuentra de ti?"
        opciones:
          - "Mi nombre real, mi colegio y mi dirección."
          - "Las cosas que yo decidí compartir: apodo, gustos, comentarios."
          - "Solo mi cara en una cámara apagada."
          - "Mi número de cédula y el de mi mamá."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Tu identidad digital es lo que TÚ decides compartir. Por eso esta sesión es importante: tú eliges.
        feedback_incorrecto: |-
          Tu identidad digital no debería incluir tu dirección ni datos sensibles. Es lo que tú decides compartir con criterio.
      - enunciado: "¿Cuál de estas cosas SÍ se puede contar en internet?"
        opciones:
          - "Tu dirección exacta de la casa."
          - "Tu colegio con el número del aula."
          - "Tu apodo y las cosas que te gusta hacer."
          - "Los horarios en que estás solo en casa."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Apodo + gustos sí van. Dirección, colegio exacto y horarios cuando estás solo NUNCA en internet.
        feedback_incorrecto: |-
          Lo que sí va: apodo y gustos. Lo que NO: dirección, colegio exacto, horarios solo. Esos son datos sensibles.
      - enunciado: "Acabas de subir una foto a TikTok y te arrepientes. La borras. ¿Desapareció?"
        opciones:
          - "Sí, ya no existe en ningún lado."
          - "No, alguien pudo haberle dado captura o haberla descargado antes."
          - "Solo si la borras del WhatsApp también."
          - "Depende del color del fondo."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Las fotos quedan. Por eso la regla es: antes de subir, pregúntate si la mostrarías en clase.
        feedback_incorrecto: |-
          Las fotos quedan. Aunque tú las borres, otras personas pueden tenerlas. Por eso piensas ANTES de subir.
      - enunciado: "Tu mejor amigo te pide tu contraseña de Roblox para entrar un rato. ¿Qué haces?"
        opciones:
          - "Se la doy porque es mi mejor amigo."
          - "Le digo que no, pero le presto el celular mientras juega."
          - "Le digo que sí pero le cambio la contraseña al día siguiente."
          - "Le digo que sí porque no tiene importancia."
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Contraseña NO se comparte aunque la amistad sea fuerte. La amistad cambia, la contraseña queda.
        feedback_incorrecto: |-
          La regla es clara: contraseña no se comparte. Si tu amigo quiere jugar, le prestas el celular mientras lo miras.
      - enunciado: "Quieres usar tu nombre real o un apodo en un juego en línea. ¿Cuál es mejor?"
        opciones:
          - "Nombre real, así me identifican rápido."
          - "Apodo que invento yo (LaraDelValle12)."
          - "Nombre de un famoso para parecer cool."
          - "El nombre de mi mamá."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Apodo inventado por ti. Te protege porque nadie sabe exactamente quién eres pero sigues siendo tú.
        feedback_incorrecto: |-
          Apodo inventado por ti. No nombre real (te expone), no famoso (es engañar), no de tu mamá (no es tu identidad).

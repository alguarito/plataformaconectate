clave: "1-3"
grado: 6
periodo: 1
sesion: 3
completo: true

titulo: "Mi correo institucional --- la primera dirección que firmas como tuya"
titulo_portada: |-
  Mi correo
  institucional ---
  mi primera
  dirección propia

producto_final: |-
  \textbf{Correo institucional configurado y funcionando} (sabes el usuario, sabes la contraseña, sabes cómo abrirlo). Más \textbf{3 correos formales escritos en el cuaderno}: uno al profe de Tecnología, uno al coordinador del colegio, uno a un familiar lejano. Los 3 correos siguen las 5 partes que vas a aprender. Lo muestras antes de salir de la sala.

apertura:
  saber_ancestral: |-
    \textbf{Vuelve el pregonero, pero esta vez con cartas.} Antes de los celulares, las cartas viajaban semanas. Para que una carta llegara, tenía que llevar \textbf{una dirección clara}: \emph{``Señor Aurelio Martínez, casa de tapia blanca, frente al palo de mango, vereda La Plata, Cartago.''}. Si la dirección estaba mal escrita, la carta se perdía o llegaba tarde. El cartero, igual que el pregonero, conocía a las personas por sus direcciones: la dirección era casi parte del nombre. La gente cuidaba mucho cómo escribía esa dirección y a quién se la daba. \textbf{Una buena carta tenía cinco cosas:} a quién va, de parte de quién, sobre qué tema, el mensaje, y la firma. Hoy las cartas se llaman \textbf{correos electrónicos}, y siguen necesitando esas mismas cinco cosas para llegar bien.

  saber_contemporaneo: |-
    Tu \textbf{correo institucional} es tu primera dirección propia en internet. Termina en \texttt{@sormariajuliana.edu.co} (o el dominio del colegio). No la elegiste por gusto: el colegio te la asignó porque eres parte de la institución. Por eso es \textbf{seria}, no es como un correo de juego. La vas a usar para: recibir tareas del profe, enviar trabajos, comunicarte con coordinación, registrarte en plataformas educativas. Y --- esto es importante --- vas a aprender a \textbf{escribir un correo formal} con las 5 partes correctas. Esa habilidad la vas a usar toda la vida: para pedir un trabajo, para escribirle a un profesor de universidad, para hacer un reclamo en serio.

  pregunta_puente: |-
    Si tuvieras que escribirle al director del colegio para pedirle algo importante, ¿\textbf{cómo empezarías} el correo? ¿``Hola, qué más''? ¿``Buenas tardes''? ¿``Estimado señor director''? La respuesta importa.

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} las 5 partes de un correo formal; (2) sabrás \textbf{explicar} con tus palabras por qué cada parte importa; (3) habrás \textbf{configurado} tu correo institucional con contraseña segura; (4) habrás \textbf{escrito 3 correos formales} en el cuaderno.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: lees un ejemplo de correo, aprendes las 5 partes, activas tu correo institucional, y escribes 3 correos formales.
  a_escuta: |-
    Empezamos viendo un correo real para descubrir sus partes.
  a_sistematizacion: |-
    Después de ver el ejemplo, vas a aprender las 5 partes con sus reglas exactas.
  a_praxis: |-
    Con las 5 partes claras, activas tu correo y escribes los 3 correos formales en el cuaderno.
  a_producto: |-
    El producto es doble: el correo configurado en el computador y los 3 correos escritos.
  a_evaluacion: |-
    Antes de salir, miras tus 3 correos y verificas que cada uno tiene las 5 partes completas.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué la palabra escrita pesa más de lo que crees.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Detectar las partes del correo} (10 min · individual). Lee con calma el siguiente correo de ejemplo. Después \textbf{en el cuaderno} dibuja un cuadro y adentro escribe las \textbf{5 partes que descubriste}. No tienes que saber los nombres técnicos todavía; descríbelas con tus palabras: \emph{``La parte de arriba que dice de qué trata el correo''}, \emph{``El saludo''}, etc. \textbf{Ejemplo a leer:} \texttt{Para: lcardenas@sormariajuliana.edu.co} · \texttt{Asunto: Permiso para faltar el viernes 22} · ``Buenos días profe Álvaro. Le escribo porque el viernes 22 tengo cita médica a las 9 de la mañana y voy a faltar a su clase. Me comprometo a ponerme al día con las actividades de la semana. Por favor avíseme qué debo traer la próxima clase. Muchas gracias por su atención. Atentamente, Lara Cárdenas Martínez, grado 6B.''

  checks:
  - Leí el correo de ejemplo completo.
  - Identifiqué 5 partes diferentes.
  - Las describí con mis palabras (no con palabras técnicas).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Las partes del correo». \textbf{Formato:} 5 frases numeradas, una por parte que descubriste. \textbf{Extensión:} 5 líneas, una por parte. \textbf{Sabes que terminaste cuando} tienes 5 cosas escritas y sabes señalarlas en el correo de ejemplo.

sistematizacion:
  intro: |-
    Lo que descubriste solo es la base. Ahora vas a aprender los \textbf{nombres técnicos} de esas 5 partes y \textbf{una regla} para cada una. Son las mismas 5 partes que se usan en cualquier correo formal, desde un colegio hasta una empresa.

  pilares:
  - |-
    \textbf{Parte 1 --- Destinatario (``Para:'').} El correo de la persona que va a recibir. Regla: \textbf{revísalo dos veces} antes de enviar. Un punto o letra de más y el correo se va a un desconocido. Ejemplo: \texttt{lcardenas@sormariajuliana.edu.co}, no \texttt{lcardenas@sormariajuliana.com}.
  - |-
    \textbf{Parte 2 --- Asunto.} Una frase corta que dice de qué trata el correo. Regla: \textbf{escribe el asunto pensando en el que recibe}, no en ti. Bien: \emph{``Permiso para faltar el viernes 22''}. Mal: \emph{``Hola profe''} o \emph{``Es urgente''}.
  - |-
    \textbf{Parte 3 --- Saludo formal.} Cómo empiezas. Regla: \textbf{usa el nombre y el cargo}. Bien: \emph{``Buenos días profe Álvaro''}, \emph{``Estimada señora rectora''}. Mal: \emph{``Qué más''}, \emph{``Hola''} a secas.
  - |-
    \textbf{Parte 4 --- Cuerpo.} Lo que quieres decir. Regla: \textbf{tres bloques cortos}. Bloque 1: qué pides o cuentas. Bloque 2: por qué. Bloque 3: qué pides que pase ahora. No más de 5 líneas en total. Nadie quiere leer un correo larguísimo.
  - |-
    \textbf{Parte 5 --- Despedida y firma.} Cómo cierras. Regla: \textbf{despedida cortés + tu nombre completo + tu curso}. Bien: \emph{``Muchas gracias por su atención. Atentamente, Lara Cárdenas Martínez, grado 6B''}. Mal: \emph{``Chao''} sin nombre.

  anatomia:
    titulo: Las 5 partes del correo formal
    body: |-
      \textbf{1. Destinatario} (``Para:'') --- a quién va. \\[1mm]
      \textbf{2. Asunto} --- de qué trata, en una línea. \\[1mm]
      \textbf{3. Saludo formal} --- nombre + cargo. \\[1mm]
      \textbf{4. Cuerpo} --- 3 bloques cortos, máximo 5 líneas. \\[1mm]
      \textbf{5. Despedida y firma} --- cortesía + tu nombre completo + curso.

  errores_comunes: |-
    \textbf{Errores que se repiten cuando empiezas a escribir correos.} (1) Asunto vacío o solo ``Hola'' --- el que recibe no sabe de qué se trata. (2) Saludo informal a un adulto que no conoces --- \emph{``Hey profe''} no abre puertas. (3) Cuerpo enorme con muchas explicaciones --- la persona ocupada no termina de leer. (4) Firmar solo con apodo o nombre incompleto --- la persona no sabe quién escribió. (5) Escribir \textbf{TODO EN MAYÚSCULAS} --- en internet eso es como gritar.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Las 5 partes con sus reglas». \textbf{Formato:} tabla de 2 columnas. Columna 1: nombre de la parte. Columna 2: la regla con tus palabras (no copiada). \textbf{Extensión:} 5 filas (una por parte). \textbf{Sabes que terminaste cuando} podrías corregir el correo de un compañero solo mirando tu tabla.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tu correo activo + 3 correos formales} (35 min · individual). Vas a hacer 2 cosas. \textbf{Primero:} activar tu correo institucional en el computador (\textbf{Paso A}). \textbf{Segundo:} escribir 3 correos formales en el cuaderno (\textbf{Paso B}). El profe te entrega tu usuario y contraseña inicial. Sigue los pasos en orden y con calma.

  pilares:
  - |-
    \textbf{Paso A.1 --- Abre el navegador.} En el computador abre Chrome o Edge. En la barra de arriba escribe \texttt{gmail.com} y pulsa Enter. Si te pide cuenta, escribe el correo que te dio el profe: \texttt{tunombre@sormariajuliana.edu.co}.
  - |-
    \textbf{Paso A.2 --- Ingresa la contraseña inicial.} El profe te dio una contraseña temporal (ejemplo: \texttt{Sormaria2026}). Escríbela exactamente igual, respetando mayúsculas y números. Si te equivocas, pulsa \emph{``Olvidé mi contraseña''} y pide ayuda al profe.
  - |-
    \textbf{Paso A.3 --- Cambia la contraseña inicial.} El sistema te pedirá una contraseña nueva. \textbf{Reglas de contraseña fuerte:} mínimo 8 caracteres, mezcla mayúsculas y minúsculas, agrega 2 números, agrega 1 signo (\texttt{!} o \texttt{?}). Ejemplo válido: \texttt{Mango2026!}. Ejemplo malo: \texttt{lara123}. \textbf{Escríbela en el cuaderno en una hoja aparte y no la muestres a nadie}.
  - |-
    \textbf{Paso B.1 --- Correo 1 al profe de Tecnología.} En el cuaderno, escribe en formato de correo (las 5 partes) un mensaje al profe Álvaro pidiéndole que te recuerde la actividad de la próxima clase. Asunto sugerido: \emph{``Pregunta sobre la actividad de la próxima clase''}.
  - |-
    \textbf{Paso B.2 --- Correo 2 al coordinador.} Escribe un correo al coordinador del colegio (\emph{``Buenos días señor coordinador''}) explicándole por qué crees que la sala de tecnología debería tener algo (un ventilador, mejor luz, etc.). Asunto sugerido: \emph{``Sugerencia para la sala de Tecnología''}.
  - |-
    \textbf{Paso B.3 --- Correo 3 a un familiar lejano.} Escribe un correo a un tío o abuela que vive lejos contándole 3 cosas que estás aprendiendo este año. Asunto: \emph{``Contándote cómo voy en el colegio''}. Saludo: \emph{``Querida tía Marta''} (formal pero familiar).

  checklist:
    titulo: Antes de mostrar al profe
    items: |-
      \checkbox Mi correo institucional abre sin problemas. \\[1mm]
      \checkbox Cambié la contraseña por una fuerte (la anoté en hoja aparte). \\[1mm]
      \checkbox Los 3 correos están escritos en el cuaderno. \\[1mm]
      \checkbox Cada correo tiene las 5 partes (destinatario, asunto, saludo, cuerpo, firma). \\[1mm]
      \checkbox El asunto de cada correo dice de qué se trata sin abrir el correo. \\[1mm]
      \checkbox Firmé con nombre completo y grado.

  plantilla_guion: |-
    \textbf{Plantilla del correo formal en el cuaderno.} \textit{Para:} (correo de la persona). \textit{Asunto:} (frase corta). \textit{Saludo:} ``Buenos días/tardes [nombre + cargo]''. \textit{Cuerpo:} 3 bloques cortos --- qué pasa, por qué, qué pides. \textit{Despedida:} ``Muchas gracias por su atención. Atentamente, [nombre completo], grado [tu curso]''.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi correo activo + 3 correos formales». \textbf{Formato:} en hoja aparte (privada): contraseña. En hoja del cuaderno: los 3 correos uno debajo del otro, con las 5 partes claras. \textbf{Extensión:} 1 página y media. \textbf{Sabes que terminaste cuando} cualquier compañero puede leer tu correo y entender exactamente qué pides.

  producto_titulo: Correo institucional activo + 3 correos formales en el cuaderno
  criterios:
  - El correo institucional abre y la contraseña nueva es fuerte (8+ caracteres, mayúsculas, números, signo).
  - Los 3 correos están escritos completos en el cuaderno.
  - Cada uno tiene las 5 partes exactas (destinatario, asunto, saludo, cuerpo, despedida).
  - Los asuntos son frases que cuentan de qué trata, no genéricos.
  - El cuerpo de cada correo cabe en 5 líneas o menos.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo que escribió sobre el respeto que merece cada voz)"
    cita: |-
      ``Escribir con cortesía no es agacharse: es respetar al otro y respetarte a ti mismo.''
    aplicacion: |-
      Cuando escribes un correo formal, no estás siendo \emph{``ñoño''} ni perdiendo tu estilo. Estás haciendo lo contrario: estás diciendo \textbf{``yo merezco respeto y te respeto a ti''}. Por eso saludas, por eso firmas. Cuanto más serio el asunto, más cuidadoso el correo. Esa es la regla en cualquier lugar del mundo.
    pregunta_espejo: |-
      Cuando le escribo a un adulto, ¿le escribo como si yo mismo mereciera que me lean en serio?

  estoico:
    autor: "Séneca"
    cita: |-
      ``Antes de enviar una carta, léela tres veces. La primera para corregir, la segunda para acortar, la tercera para asegurarte de que dice lo que querías decir.''
    aplicacion: |-
      Hace 2000 años, en Roma, ya se sabía esto: las cartas (hoy correos) se mandan después de leerse varias veces. Antes de pulsar ``enviar'', léelo. ¿Tiene las 5 partes? ¿Cabe en 5 líneas? ¿Suena cortés? \textbf{El que envía sin releer manda errores en serio.} El que relee, manda mensajes que funcionan.
    pregunta_espejo: |-
      ¿Estoy enviando con prisa, o estoy revisando lo que digo antes de mandarlo?

  floridi:
    autor: "Luciano Floridi (filósofo italiano que estudia internet y la comunicación)"
    cita: |-
      ``Cada correo es una pequeña promesa: prometes que lo que dices es verdad y que estarás del otro lado para responder.''
    aplicacion: |-
      Cuando mandas un correo institucional, no es como un mensaje de WhatsApp que se borra. \textbf{Queda guardado, queda firmado, queda contigo.} Si pides algo, lo que dices te compromete. Por eso el correo institucional es serio: lo que escribes ahí es como tu palabra escrita.
    pregunta_espejo: |-
      Lo que estoy escribiendo en este correo, ¿lo voy a sostener si me preguntan después?

compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu correo activo y los 3 correos escritos en el cuaderno. La próxima clase vas a conocer la \textbf{netiqueta}: 10 acuerdos básicos para comportarte con respeto en internet. Lo que aprendiste hoy ya cuenta como netiqueta sin que te dieras cuenta: saludo, cortesía, cuidar lo que dices. Ahora vas a verlo completo.

web:
  conceptos_clave:
    - termino: Correo institucional
      definicion: |-
        Tu primera dirección oficial en internet. Termina en el dominio del colegio. La usas para tareas, trabajos y comunicación con profes. Es seria, no es como un correo de juego.
      ejemplo: |-
        Si te llamas Lara Cárdenas, tu correo puede ser lcardenas@sormariajuliana.edu.co. Esa es tu dirección oficial este año.
      emoji: "✉️"
    - termino: Asunto
      definicion: |-
        Una frase corta que dice de qué trata el correo. Es lo primero que la persona ve. Si el asunto está bien, abre el correo; si está vacío o vago, lo deja para después.
      ejemplo: |-
        Bien: "Permiso para faltar el viernes 22". Mal: "Hola profe" o estar vacío.
      emoji: "🏷️"
    - termino: Saludo formal
      definicion: |-
        Cómo empiezas el correo. A un adulto desconocido o a una autoridad le dices buenos días o estimado, nunca "qué más". Usa el nombre y el cargo.
      ejemplo: |-
        Para el profe Álvaro: "Buenos días profe Álvaro". Para el coordinador: "Estimado señor coordinador". Para una tía: "Querida tía Marta".
      emoji: "🙋"
    - termino: Cuerpo del correo
      definicion: |-
        El mensaje en sí. Se escribe en 3 bloques cortos. Bloque 1: qué pasa. Bloque 2: por qué. Bloque 3: qué pides que pase. Máximo 5 líneas.
      ejemplo: |-
        "Le escribo porque tengo cita médica el viernes (qué pasa). Es a las 9 a. m. y no puedo venir a la primera hora (por qué). Por favor avíseme qué actividad debo recuperar (qué pido)."
      emoji: "📝"
    - termino: Contraseña fuerte
      definicion: |-
        Una contraseña que es difícil de adivinar. Tiene mínimo 8 caracteres, mezcla mayúsculas y minúsculas, números y al menos un signo. No se comparte con nadie, ni con tu mejor amigo.
      ejemplo: |-
        Fuerte: "Mango2026!" o "ColombiaVerde9?". Débil: "lara123" o "qwerty" o "12345678".
      emoji: "🔐"

  quiz:
    titulo: "¿Sabes escribir un correo formal?"
    instrucciones: "5 preguntas para verificar que dominas las 5 partes del correo y las reglas de seguridad."
    preguntas:
      - enunciado: "¿Cuál de estos asuntos es el mejor para un correo al profe pidiendo permiso?"
        opciones:
          - "Hola"
          - "Es urgente"
          - "Permiso para faltar el viernes 22"
          - "Profe profe profe"
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Un buen asunto dice de qué trata el correo en una frase corta. El profe sabe qué esperar antes de abrirlo.
        feedback_incorrecto: |-
          El asunto debe decir de qué trata el correo. "Permiso para faltar el viernes 22" deja claro el tema antes de abrir.
      - enunciado: "Le escribes al coordinador del colegio. ¿Cómo lo saludas?"
        opciones:
          - "Hey coordi"
          - "Qué más"
          - "Saludos cordiales mi rey"
          - "Buenos días señor coordinador"
        respuesta_index: 3
        feedback_correcto: |-
          Bien. A una autoridad le hablas con respeto: buenos días + nombre o cargo. Eso abre puertas; lo otro las cierra.
        feedback_incorrecto: |-
          A un adulto con autoridad le hablas formal: "Buenos días señor coordinador". El respeto en el saludo importa.
      - enunciado: "¿Cuál de estas contraseñas es fuerte?"
        opciones:
          - "lara123"
          - "Mango2026!"
          - "qwerty"
          - "mi nombre completo"
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Mezcla mayúscula, minúsculas, números y un signo. Ocho caracteres o más. Eso es fuerte.
        feedback_incorrecto: |-
          Una contraseña fuerte mezcla mayúsculas, minúsculas, números y un signo. "Mango2026!" cumple todo.
      - enunciado: "Tu mejor amigo te pide la contraseña de tu correo institucional. ¿Qué haces?"
        opciones:
          - "No se la doy. La contraseña es solo mía."
          - "Se la doy porque confío en él."
          - "Se la doy pero la cambio mañana."
          - "Se la doy a medias, solo la mitad."
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. La contraseña no se comparte. Si tu amigo necesita algo en internet, que use su propia cuenta.
        feedback_incorrecto: |-
          La regla es clara: la contraseña no se comparte. La amistad cambia; los problemas si la dan también.
      - enunciado: "Acabas de escribir un correo. Antes de pulsar 'enviar' deberías..."
        opciones:
          - "Mandarlo de inmediato para no demorar."
          - "Agregar muchos signos de admiración."
          - "Escribirlo TODO EN MAYÚSCULAS para que se note."
          - "Leerlo dos veces y revisar las 5 partes."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Releer antes de enviar evita errores. Verificas que están las 5 partes y que el cuerpo es claro y corto.
        feedback_incorrecto: |-
          Antes de enviar, relees. Verificas las 5 partes y que el cuerpo es corto. Mayúsculas en todo es como gritar.

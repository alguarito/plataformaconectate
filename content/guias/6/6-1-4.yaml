clave: "1-4"
grado: 6
periodo: 1
sesion: 4
completo: true

titulo: "Netiqueta --- los 10 acuerdos para llevarte bien en internet"
titulo_portada: |-
  Netiqueta ---
  los 10 acuerdos
  para llevarte bien
  en internet

producto_final: |-
  Un \textbf{cartel personal de los 10 acuerdos de netiqueta} dibujado en hoja completa del cuaderno. Cada acuerdo va con \textbf{un ejemplo de cumplirlo} y \textbf{un ejemplo de romperlo} con tus propias palabras. Más \textbf{una promesa firmada} al final: \emph{``Me comprometo a respetar estos 10 acuerdos en todos los chats, juegos y redes en que esté.''} Lo muestras antes de salir.

apertura:
  saber_ancestral: |-
    \textbf{Hay reglas que no están escritas pero todos las saben.} En tu casa hay normas que nadie te enseñó por escrito: no se grita en la mesa, no se interrumpe al que está hablando, se saluda al entrar. Esas reglas tu mamá o tu abuela no te las leyeron de un libro: las aprendiste viendo. En las cuadras del centro de Cartago pasaba parecido: cuando llegaba el pregonero, los niños se callaban. Era una regla no escrita pero todos la respetaban porque así el mensaje llegaba completo. Si alguien gritaba o se reía, otra persona le decía: \emph{``Cállese mijo, déjelo hablar''}. \textbf{Esas reglas no escritas se llaman acuerdos de convivencia}. En internet también existen --- pero como nadie te las enseña por verlas, te las tienen que enseñar a propósito. Se llaman \textbf{netiqueta}: la etiqueta (las reglas de cortesía) en la red.

  saber_contemporaneo: |-
    \textbf{Netiqueta} viene de juntar dos palabras: \emph{net} (red en inglés) + \emph{etiqueta} (reglas de cortesía). Son los acuerdos para tratarte bien con otros cuando estás en chats, juegos, comentarios, correos y grupos. \textbf{No son una ley:} nadie te lleva a la cárcel si las rompes. Son algo más fuerte: \textbf{son la forma en que la gente decide si quiere o no juntarse contigo en línea}. Quien las cumple acumula confianza y respeto. Quien las rompe va perdiendo gente. Hoy vas a aprender 10 acuerdos básicos. Son pocos, son claros y van a servirte en cada chat de Roblox, cada grupo de WhatsApp, cada comentario de TikTok, cada correo institucional, durante toda tu vida en línea.

  pregunta_puente: |-
    Cuando alguien escribe \textbf{``ESTÁS TODO LOCO''} en mayúsculas en un chat de juego, ¿\textbf{cómo te sientes}? ¿Sientes que te están hablando bonito o sientes que te están gritando?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 10 acuerdos de netiqueta; (2) sabrás \textbf{explicar} con tus palabras por qué cada uno cuida la convivencia; (3) habrás \textbf{evaluado} 6 mensajes reales y dirás si cumplen o rompen los acuerdos; (4) habrás \textbf{creado} tu cartel personal con tus propios ejemplos.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: lees situaciones reales, descubres los 10 acuerdos, evalúas mensajes, y haces tu cartel.
  a_escuta: |-
    Empezamos viendo 3 situaciones de chats que tal vez te suenan familiares.
  a_sistematizacion: |-
    Después de las situaciones, aprendes los 10 acuerdos exactos con su nombre.
  a_praxis: |-
    Con los 10 acuerdos en mente, dibujas tu cartel personal en el cuaderno.
  a_producto: |-
    El producto es el cartel firmado: lo guardas como compromiso tuyo.
  a_evaluacion: |-
    Antes de salir, revisas que tu cartel tiene los 10 acuerdos, los ejemplos y la firma.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué el respeto pesa más en pantalla que cara a cara.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Tres situaciones que ya viste} (10 min · individual). Lee estas 3 escenas y en el cuaderno escribe \textbf{qué se hizo mal} en cada una. No tienes que saber los nombres técnicos; cuéntalo con tus palabras. \textbf{Escena A:} En un grupo de WhatsApp del salón, alguien escribe a las 11 de la noche: \emph{``oigan quien tiene la tarea de mate'' --- ``oigan respondan'' --- ``oigan estoy preguntando algo''} (tres mensajes seguidos). \textbf{Escena B:} En Roblox, un jugador escribe en el chat: \emph{``ERES UN MAL JUGADOR APRENDE A JUGAR INÚTIL''}. \textbf{Escena C:} En un grupo de TikTok, alguien comparte una foto de un compañero del salón que se cayó, sin pedirle permiso, con risas.

  checks:
  - Leí las 3 escenas con calma.
  - Identifiqué qué se hizo mal en cada una.
  - Lo escribí con mis palabras, no copié de otro lado.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Tres escenas para mirar». \textbf{Formato:} 3 párrafos cortos, uno por escena. Cada párrafo dice qué se hizo mal y qué hubieras hecho tú. \textbf{Extensión:} 3 párrafos de 3-4 líneas cada uno. \textbf{Sabes que terminaste cuando} si un compañero leyera tu cuaderno, entendería tu opinión sin que tú la explicaras.

sistematizacion:
  intro: |-
    Las 3 escenas que acabaste de leer rompen 3 acuerdos distintos. Pero hay más. En total son \textbf{10 acuerdos básicos de netiqueta} que todo estudiante de tu edad debería conocer. Los vas a aprender ahora.

  pilares:
  - |-
    \textbf{1. Saluda y despídete.} Como en la vida real: empiezas con un saludo (\emph{``Buenos días''}, \emph{``Hola''}) y terminas con una despedida (\emph{``Gracias''}, \emph{``Hasta mañana''}). No mandes mensajes pelados. \textbf{2. No grites con mayúsculas.} ESCRIBIR TODO EN MAYÚSCULAS es gritar. Solo se usa para una palabra que necesita énfasis, no para frases enteras. \textbf{3. No spam.} No mandes el mismo mensaje 5 veces seguidas. Si nadie responde, espera; si es urgente, llama por teléfono.
  - |-
    \textbf{4. Cuida los horarios.} No mandes mensajes a horas raras (11 de la noche a 7 de la mañana) salvo emergencia real. Hay personas durmiendo. \textbf{5. Respeta lo que se dice en privado.} Si alguien te cuenta algo en chat privado, no lo compartas con el grupo sin permiso. \textbf{6. No publiques fotos de otros sin pedirles permiso.} Aunque la foto sea graciosa. Aunque la persona ``no se vaya a dar cuenta''. Pedir permiso es regla básica.
  - |-
    \textbf{7. Piensa antes de escribir.} En la vida real, las palabras se las lleva el viento. En internet, las palabras quedan. Antes de enviar algo molesto o brusco, lee otra vez: \emph{``¿De verdad quiero decir esto así?''}. \textbf{8. No insultes ni humilles, ni en broma.} Lo que en persona puede ser broma, en pantalla suele leerse como insulto. No hay tono de voz, no hay sonrisa. Mejor evítalo.
  - |-
    \textbf{9. Si algo está mal, no lo reenvíes.} Cadenas falsas, fotos íntimas de alguien, noticias raras, retos peligrosos. \textbf{Reenviarlo te hace parte del problema}. La regla es: si lo dudas, no lo mandes. \textbf{10. Habla con un adulto cuando te asustes.} Si alguien en internet te molesta, te amenaza, te pide fotos raras, te dice cosas que te hacen sentir mal --- cuéntale a un adulto de confianza (mamá, papá, profe, abuela). No estás solo.

  anatomia:
    titulo: Los 10 acuerdos de netiqueta
    body: |-
      \textbf{1.} Saluda y despídete. \\[1mm]
      \textbf{2.} No grites con mayúsculas. \\[1mm]
      \textbf{3.} No spam (no mandes lo mismo 5 veces). \\[1mm]
      \textbf{4.} Cuida los horarios (nada de mensajes a las 11pm). \\[1mm]
      \textbf{5.} Lo privado se queda privado. \\[1mm]
      \textbf{6.} No publiques fotos de otros sin permiso. \\[1mm]
      \textbf{7.} Piensa antes de escribir. \\[1mm]
      \textbf{8.} No insultes ni humilles, ni en broma. \\[1mm]
      \textbf{9.} Si algo está mal, no lo reenvíes. \\[1mm]
      \textbf{10.} Cuéntale a un adulto cuando algo te asuste.

  errores_comunes: |-
    \textbf{Mitos sobre netiqueta que vas a oír de tus compañeros.} (1) \emph{``Si no contesta es porque es altanero''} --- No. Hay clases, vidas, sueño. Esperar es respeto. (2) \emph{``Si no escribo en mayúsculas no se nota lo que digo''} --- Sí se nota. Usa una palabra puntual en mayúscula, no frases enteras. (3) \emph{``Si yo lo recibí, lo puedo reenviar''} --- Falso. Solo porque te lo mandaron no significa que ya es público. (4) \emph{``Si alguien me molesta, le respondo con otro insulto''} --- Eso enciende más el problema. La salida es bloquear o avisar a un adulto. (5) \emph{``Es solo internet, no es real''} --- Es muy real. Lo que pasa en pantalla afecta cómo te sientes y cómo te ven.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Los 10 acuerdos con mis palabras». \textbf{Formato:} lista numerada del 1 al 10, cada acuerdo en una sola línea, escrito con \emph{tu propia voz}, no copiado. \textbf{Extensión:} 10 líneas. \textbf{Sabes que terminaste cuando} podrías recitar los 10 sin abrir el cuaderno.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu cartel personal de netiqueta} (25 min · individual). Vas a hacer en una hoja completa del cuaderno un \textbf{cartel personal} con los 10 acuerdos. Cada acuerdo lleva 2 ejemplos pequeños: uno de \textbf{cumplir} y uno de \textbf{romper} el acuerdo. Vas a inventar los ejemplos tú; no los copies del libro. Al final, firmas el cartel con tu nombre como una promesa.

  pilares:
  - |-
    \textbf{Paso 1.} En la parte superior de la hoja escribe el título grande: \textbf{``Mis 10 acuerdos de netiqueta''} y debajo: \emph{``Promesa de [tu nombre], grado 6[tu letra], año 2026''}. Subraya el título.
  - |-
    \textbf{Paso 2.} Divide la hoja en \textbf{10 cuadritos} (2 columnas, 5 filas, por ejemplo) o haz una lista bien ordenada. Cada cuadrito o renglón es para 1 acuerdo. Numéralos del 1 al 10.
  - |-
    \textbf{Paso 3.} En cada cuadrito escribe: arriba el \textbf{nombre del acuerdo} (corto, máximo 5 palabras). Abajo \textbf{un ejemplo de cumplirlo} (\emph{``Cumpliendo: ...''}) y \textbf{un ejemplo de romperlo} (\emph{``Rompiendo: ...''}). Los ejemplos los inventas tú, deben ser cosas que pasan en tu vida.
  - |-
    \textbf{Paso 4.} Para los acuerdos que tienen que ver con grupos del colegio (por ejemplo el acuerdo 3 o el 6), trata de que el ejemplo sea del salón de 6° o de una situación que ya viste o que podría pasar. Esto hace tu cartel \emph{tuyo}.
  - |-
    \textbf{Paso 5.} Al lado de cada acuerdo dibuja un \textbf{ícono pequeño} que te recuerde de qué trata. Cualquier ícono que tú entiendas. Ejemplo: el acuerdo 2 (no gritar) puede tener una boca tachada. El 9 (no reenviar lo malo) puede tener un mensaje con una flecha tachada.
  - |-
    \textbf{Paso 6.} Al final de la hoja, en la esquina inferior derecha, escribe la promesa: \emph{``Me comprometo a respetar estos 10 acuerdos en chats, juegos, redes y correos.''} y firma con tu nombre completo + fecha. Esa firma cuenta como compromiso tuyo.

  checklist:
    titulo: Antes de mostrar tu cartel
    items: |-
      \checkbox El cartel ocupa una hoja entera del cuaderno. \\[1mm]
      \checkbox Están los 10 acuerdos numerados del 1 al 10. \\[1mm]
      \checkbox Cada acuerdo tiene un ejemplo de cumplir y uno de romper. \\[1mm]
      \checkbox Los ejemplos los inventaste tú (no son copias). \\[1mm]
      \checkbox Cada acuerdo tiene un ícono pequeño. \\[1mm]
      \checkbox La promesa está firmada con nombre y fecha.

  plantilla_guion: |-
    \textbf{Plantilla de cada cuadrito.} \textit{Número}: 1 al 10. \textit{Nombre del acuerdo}: máximo 5 palabras. \textit{Cumpliendo}: 1 frase. \textit{Rompiendo}: 1 frase. \textit{Ícono pequeño}: el que tú quieras.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mis 10 acuerdos de netiqueta». \textbf{Formato:} hoja completa del cuaderno con 10 cuadritos, ejemplos y firma. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} cualquier compañero de otro salón podría leerlo y entenderlo sin que tú lo expliques.

  producto_titulo: Cartel personal de los 10 acuerdos de netiqueta · firmado
  criterios:
  - El cartel ocupa una página completa.
  - Están los 10 acuerdos en orden del 1 al 10.
  - Cada acuerdo tiene su ejemplo de cumplirlo y de romperlo.
  - Los ejemplos son inventados por el estudiante, contextualizados.
  - El cartel está firmado y con fecha.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del respeto entre culturas)"
    cita: |-
      ``Antes de hablar a otro, primero hay que reconocer que el otro es persona como tú.''
    aplicacion: |-
      En internet no ves la cara del otro. No ves si está cansado, si llora, si tiene un mal día. \textbf{Por eso la regla es más fuerte ahí}: tratar al otro como persona, no como avatar. Cada nombre que aparece en un chat es un ser humano del otro lado. Saludarlo, escribirle con cuidado, no humillarlo --- eso es reconocer a la persona.
    pregunta_espejo: |-
      Cuando escribo en línea, ¿\textbf{recuerdo que el del otro lado es una persona} o trato a las personas como si fueran nombres en una pantalla?

  estoico:
    autor: "Epicteto"
    cita: |-
      ``No es lo que te dicen lo que te hace daño, es cómo respondes a lo que te dicen.''
    aplicacion: |-
      Si alguien te escribe algo molesto en un chat, lo que te enciende es \emph{cómo reaccionas tú}, no lo que dijo el otro. \textbf{Tienes 3 caminos:} (1) responder con otro insulto y encender el problema, (2) ignorar y bloquear, (3) avisarle a un adulto si es serio. Los caminos 2 y 3 son los inteligentes. La rabia se enfría con un vaso de agua, no escribiendo.
    pregunta_espejo: |-
      Cuando algo me molesta en línea, ¿\textbf{respondo de una vez} o tomo un momento antes de escribir?

  floridi:
    autor: "Luciano Floridi (filósofo italiano que estudia internet)"
    cita: |-
      ``Cada mensaje que envías deja huella. La gente recordará no lo que dijiste, sino cómo lo dijiste.''
    aplicacion: |-
      De todos los mensajes que envíes en tu vida, \textbf{la gente se acordará más del tono que del contenido}. Pueden no recordar exactamente qué pediste, pero recordarán si pediste con respeto o si llegaste empujando. La netiqueta no es debilidad: es saber que el tono pesa.
    pregunta_espejo: |-
      Si la gente solo recordara cómo me hablo en internet, ¿\textbf{qué pensarían} de mí?

compromiso: |-
  \textbf{Para la próxima sesión.} Guarda tu cartel en el cuaderno. Esta semana, cada vez que entres a un chat, mira mentalmente uno de los 10 acuerdos y pregúntate: \emph{``¿Lo estoy cumpliendo?''}. La próxima clase vamos a viajar al pasado: vas a descubrir \textbf{cómo eran los medios de comunicación} antes de internet --- desde el pregonero hasta la radio y la televisión --- y por qué esta historia te ayuda a entender mejor TikTok y WhatsApp.

web:
  conceptos_clave:
    - termino: Netiqueta
      definicion: |-
        Las reglas de cortesía en internet. No son leyes, pero quien las cumple acumula respeto y quien las rompe pierde gente alrededor. Son 10 acuerdos básicos para llevarte bien en chats, juegos, redes y correos.
      ejemplo: |-
        Saludar al entrar a un grupo, no escribir todo en mayúsculas, no reenviar fotos de otros sin permiso. Eso es netiqueta básica.
      emoji: "🤝"
    - termino: Spam
      definicion: |-
        Mandar el mismo mensaje muchas veces seguidas. O escribir cosas repetidas que nadie pidió. En grupos es molesto y rompe la conversación.
      ejemplo: |-
        En un grupo de WhatsApp escribir "oigan respondan" 5 veces seguidas porque nadie contestó en 3 minutos. Eso es spam.
      emoji: "📢"
    - termino: Permiso de imagen
      definicion: |-
        Antes de publicar la foto de otra persona, le preguntas si está bien. Aunque sea graciosa. Aunque sean amigos. Aunque crees que no se va a enterar. Pedir permiso es regla básica.
      ejemplo: |-
        Si tu amigo se cayó y le tomaste una foto, antes de subirla al estado le mandas un mensaje: "¿Puedo subir esta?". Si dice no, no la subes.
      emoji: "📸"
    - termino: Cadena viral
      definicion: |-
        Un mensaje que la gente reenvía rápido sin verificar si es verdad. Pueden ser noticias falsas, retos peligrosos, fotos íntimas o cosas inventadas para asustar. La regla es: si lo dudas, no lo mandes.
      ejemplo: |-
        Un audio que dice "reenvía esto a 10 amigos o te pasará algo malo". Eso es cadena. No se reenvía.
      emoji: "⛓️"
    - termino: Adulto de confianza
      definicion: |-
        Una persona mayor a la que puedes contarle cuando algo en internet te asusta o te incomoda. Puede ser mamá, papá, abuela, tía, profe. Lo importante es que sea alguien que te escucha sin juzgar.
      ejemplo: |-
        Si un desconocido te empieza a pedir fotos por un juego, le cuentas al profe Álvaro o a tu mamá. No te quedas callado por miedo a regaño.
      emoji: "🛡️"

  quiz:
    titulo: "¿Conoces los 10 acuerdos de netiqueta?"
    instrucciones: "5 preguntas para verificar que entiendes cómo llevarte bien en chats, juegos y redes."
    preguntas:
      - enunciado: "Tu compañero te pregunta algo en el grupo de WhatsApp del salón a las 11 de la noche. ¿Qué haces?"
        opciones:
          - "Le respondo de inmediato porque vi el mensaje."
          - "No respondo. A las 11 ya nadie debería estar escribiendo. Le contesto mañana."
          - "Le mando 5 mensajes para que no me olvide."
          - "Le mando un audio gritando."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Hay horarios y hay sueño. Lo del grupo se contesta al otro día. La amistad no se mide por la rapidez nocturna.
        feedback_incorrecto: |-
          A las 11 de la noche se respeta el sueño. Responder al día siguiente está bien. No es altanería, es netiqueta.
      - enunciado: "Tu mejor amigo se cayó en el descanso y le tomaste una foto graciosa. ¿La subes al estado?"
        opciones:
          - "Sí, porque es gracioso y todos se van a reír."
          - "Sí, pero le tapo la cara con un emoji."
          - "Primero le pregunto si está bien que la suba. Si dice no, no la subo."
          - "Sí, porque mi amigo no se va a dar cuenta."
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Antes de subir la foto de otro, le preguntas. Eso es respeto básico, aunque sea tu mejor amigo.
        feedback_incorrecto: |-
          Antes de subir la foto de otro, le pides permiso. Aunque sea tu mejor amigo. Aunque crees que no se entera. Es la regla.
      - enunciado: "En Roblox un jugador te escribe: 'ERES UN INÚTIL APRENDE A JUGAR'. ¿Qué haces?"
        opciones:
          - "Le respondo con otro insulto fuerte para que se calle."
          - "Le digo que es un perdedor y le mando emojis burlones."
          - "Bloqueo al jugador y sigo jugando. Si vuelve, le aviso a un adulto."
          - "Me pongo a llorar y dejo el juego para siempre."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Bloquear es lo más sano. Si el problema es grande, aviso a un adulto. Responder con otro insulto solo enciende.
        feedback_incorrecto: |-
          La salida sana es bloquear. Si vuelve o asusta más, le cuentas a un adulto. Insultar de vuelta enciende más.
      - enunciado: "Te llega una cadena que dice: 'Reenvía esto a 10 amigos o te pasará algo malo'. ¿Qué haces?"
        opciones:
          - "La reenvío de una para que no me pase nada."
          - "La reenvío solo a 3 amigos para ir despacio."
          - "Borro la cadena y no la reenvío. Es mentira."
          - "La reenvío al grupo del salón completo."
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Las cadenas son mentira. No te va a pasar nada. Lo que pasa es que estás llenando los chats de basura.
        feedback_incorrecto: |-
          Las cadenas son mentira. Borrarlas es lo correcto. Reenviarlas te hace parte del problema y molesta a tus amigos.
      - enunciado: "Un desconocido en TikTok te empieza a pedir fotos en ropa de calle. ¿Qué haces?"
        opciones:
          - "Le mando una foto rápida porque no quiero ser grosero."
          - "Le digo que no me joda y sigo hablando con él."
          - "Bloqueo, no respondo, y le cuento a un adulto de confianza ya."
          - "Le pido que primero me mande él una foto."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Bloquear + contar a un adulto. No estás solo. Estas cosas son serias y los adultos sabemos qué hacer.
        feedback_incorrecto: |-
          La salida es bloquear y avisar a un adulto de confianza. Estas cosas son serias. No respondas, no te quedes callado.

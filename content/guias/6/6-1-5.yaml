clave: "1-5"
grado: 6
periodo: 1
sesion: 5
completo: true

titulo: "Historia de los medios --- del pregonero al chat de WhatsApp"
titulo_portada: |-
  Historia de
  los medios ---
  del pregonero
  al WhatsApp

producto_final: |-
  Una \textbf{línea de tiempo dibujada en hoja completa} del cuaderno, con \textbf{8 medios de comunicación} en orden cronológico (1850 hasta hoy). Cada medio lleva: año aproximado, dibujo pequeño, 1 frase de qué hacía, y \textbf{una flecha que conecta dos medios diciendo qué se conservó} (saludo, asunto, firma, audiencia, etc.). Más \textbf{una conclusión escrita} de 3-4 líneas: ¿qué cambió y qué sigue igual desde el pregonero hasta WhatsApp?

apertura:
  saber_ancestral: |-
    \textbf{Tu bisabuela escuchaba radio --- y antes de la radio escuchaba al pregonero.} Si pudieras viajar al Cartago de 1920, no había radio en cada casa. Había \textbf{el pregonero} en el centro, había \textbf{el periódico} (\emph{El Diario del Valle}) que pasaba el cartero los lunes, y había \textbf{las cartas familiares} que viajaban semanas. Después, en los años 40, llegó la radio: la gente se reunía alrededor del aparato a oír noticias y radionovelas. En los años 60 entró la televisión en blanco y negro, y las familias del barrio se juntaban en la casa del único vecino que la tenía. En los 90 llegó internet a los café-internet. En el 2010 explotó WhatsApp. \textbf{Cada paso de esa historia trajo algo nuevo, pero también guardó algo del paso anterior.} La radio guardó la voz del pregonero. WhatsApp guarda el saludo de la carta. Internet no nació de la nada: es el último capítulo de una historia muy larga.

  saber_contemporaneo: |-
    Un \textbf{medio de comunicación} es cualquier herramienta que las personas usan para mandarse mensajes a distancia o a muchas personas a la vez. Hoy hay muchos --- WhatsApp, TikTok, YouTube, Instagram --- pero \textbf{todos vienen de medios más antiguos}. Saber esa historia te ayuda a entender 2 cosas: (1) las cosas que parecen \emph{``modernas''} muchas veces vienen de hace siglos --- el asunto del correo viene de la carta postal; (2) cada medio nuevo trae \emph{problemas nuevos} pero también \emph{cuidados antiguos} que ya conocemos. Hoy vas a recorrer 8 medios desde 1850 hasta hoy y vas a descubrir el hilo que los une.

  pregunta_puente: |-
    Si tu bisabuela viviera, ¿\textbf{le explicarías} qué es WhatsApp? ¿Cómo lo harías? ¿Con qué medio antiguo lo compararías para que entienda?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} 8 medios de comunicación importantes en orden cronológico; (2) sabrás \textbf{analizar} qué cambió y qué se conservó entre dos medios; (3) habrás \textbf{creado} una línea de tiempo personal con dibujos y conexiones; (4) podrás \textbf{evaluar} con criterios cuál de los 8 medios trajo el cambio más profundo para tu comunidad.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: imaginas viajar en el tiempo, descubres los 8 medios principales, analizas qué se conservó, y dibujas tu línea de tiempo.
  a_escuta: |-
    Empezamos con un viaje mental al Cartago de tu bisabuela.
  a_sistematizacion: |-
    Después del viaje, ves los 8 medios principales con sus fechas y características.
  a_praxis: |-
    Con los 8 medios claros, dibujas tu propia línea de tiempo con conexiones.
  a_producto: |-
    El producto es esa línea de tiempo dibujada y la conclusión sobre qué se conservó.
  a_evaluacion: |-
    Antes de salir, miras tu línea y verificas que están los 8 medios y las flechas de conexión.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué saber historia te protege en el presente.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Viaje al Cartago de 1920} (10 min · individual). Cierra los ojos un momento e imagina: estás en Cartago, año 1920. No hay celulares, no hay radio en tu casa, no hay televisión, no hay internet. Tu prima vive en Pereira. \textbf{¿Cómo le mandarías un mensaje?}. Después abre los ojos y \textbf{en el cuaderno} responde estas 3 preguntas con tus palabras: (1) ¿Qué medio usarías para mandarle un mensaje urgente? (2) ¿Cuánto tardaría en llegar? (3) ¿Cómo sabrías si lo recibió? Imagina con calma, no busques en internet.

  checks:
  - Cerré los ojos e imaginé el viaje al pasado.
  - Respondí las 3 preguntas con mis palabras.
  - No me ayudé de internet ni del compañero.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Viaje a 1920». \textbf{Formato:} 3 preguntas con sus respuestas, en bloques cortos. \textbf{Extensión:} 3 párrafos de 2-3 líneas cada uno. \textbf{Sabes que terminaste cuando} te imaginaste tan bien la escena que pudiste responder sin dudar.

sistematizacion:
  intro: |-
    Lo que imaginaste te conecta con el primer eslabón. Ahora vas a recorrer \textbf{8 medios de comunicación clave} desde 1850 hasta hoy. No tienes que memorizar las fechas exactas; lo importante es el orden y qué hacía cada uno.

  pilares:
  - |-
    \textbf{1. Carta postal (siglo XIX, antes de 1900).} Mensajes en papel que viajaban en barco, en tren o en mula. Llegar a Pereira desde Cartago podía tardar 1 semana. \textbf{Lo que aportó:} la idea de \emph{destinatario, asunto, saludo y firma} --- las 5 partes del correo de hoy. \textbf{2. Telégrafo (1844 en EEUU, 1865 en Colombia).} Mensajes cortos que viajaban por cables eléctricos. Cada palabra costaba dinero, entonces se escribía con palabras pegadas: \emph{``LLEGOBIEN HERMANOENFERMO VENPRONTO''}. \textbf{Lo que aportó:} la idea de \emph{abreviar para enviar rápido} --- abuelo del SMS y del chat.
  - |-
    \textbf{3. Teléfono fijo (1876, Alexander Graham Bell).} Hablar con otra persona a distancia, en tiempo real, por voz. \textbf{Lo que aportó:} la idea de \emph{conversación a distancia} --- abuelo de las videollamadas. En Cartago llegó masivamente en los años 60. \textbf{4. Radio (años 1920 en Colombia).} Una sola persona habla y muchas personas escuchan al mismo tiempo. \textbf{Lo que aportó:} la idea de \emph{audiencia masiva} --- abuelo de TikTok y YouTube.
  - |-
    \textbf{5. Televisión (1954 en Colombia).} Como la radio, pero con imagen. La gente se sentaba a verla. \textbf{Lo que aportó:} la idea de \emph{ver + oír al mismo tiempo} --- abuelo del video. \textbf{6. Internet temprano (años 1990).} Computadores que se conectan unos con otros. En Cartago llegaron los café-internet en el 2000. \textbf{Lo que aportó:} la idea de \emph{cualquiera puede publicar} --- antes solo periódicos y TV publicaban.
  - |-
    \textbf{7. Celular y SMS (años 2000).} El teléfono móvil reemplazó al fijo. Mensajes de texto cortos. \textbf{Lo que aportó:} la idea de \emph{tener el medio en el bolsillo} --- el medio ya no está en una sala, está contigo. \textbf{8. Redes sociales y WhatsApp (2009-hoy).} Mezcla todo: voz como teléfono, imagen como TV, audiencia masiva como radio, texto como carta. \textbf{Lo que aportan:} la idea de \emph{participar como audiencia y como emisor a la vez} --- ya no solo escuchas, también respondes.

  anatomia:
    titulo: Línea de tiempo de los medios
    body: |-
      \textbf{1850} · Carta postal --- 1 semana de viaje. \\[1mm]
      \textbf{1865} · Telégrafo en Colombia --- minutos, pero caro. \\[1mm]
      \textbf{1876} · Teléfono fijo --- voz en tiempo real. \\[1mm]
      \textbf{1920s} · Radio --- audiencia masiva. \\[1mm]
      \textbf{1954} · Televisión --- voz e imagen. \\[1mm]
      \textbf{1990s} · Internet --- todos publican. \\[1mm]
      \textbf{2000s} · Celular y SMS --- medio en el bolsillo. \\[1mm]
      \textbf{2009+} · Redes sociales y WhatsApp --- todo mezclado.

  errores_comunes: |-
    \textbf{Confusiones frecuentes sobre la historia de los medios.} (1) \emph{``Internet inventó la comunicación masiva''} --- Falso, la radio y la TV ya la habían inventado. (2) \emph{``Antes de WhatsApp nadie sabía abreviar''} --- Falso, el telégrafo abreviaba hace 150 años. (3) \emph{``Las redes sociales son lo más nuevo que existe''} --- Cierto pero engañoso: las redes son \emph{una mezcla} de medios anteriores, no algo completamente nuevo. (4) \emph{``Las cartas son cosa muerta''} --- Falso, el correo electrónico es una carta y se sigue usando todos los días.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Cuál medio sirve mejor para qué». \textbf{Formato:} tabla de 3 columnas. Columna 1: característica. Columna 2: cómo era en la \emph{carta postal} de 1900. Columna 3: cómo es en \emph{WhatsApp} de hoy. Compara 5 características: velocidad, costo, audiencia, qué se conserva, qué se pierde. Al final escribe un \textbf{veredicto razonado de 3-4 líneas}: ¿cuál de los dos medios sirve mejor para mandarle a tu prima un mensaje urgente desde Cartago? ¿Y para celebrar los 90 años de tu abuela? Justifica cada elección con 2 razones. \textbf{Extensión:} 5 filas + veredicto. \textbf{Sabes que terminaste cuando} tu veredicto distingue \emph{rápido} de \emph{adecuado} --- no siempre lo más rápido es lo mejor.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu línea de tiempo personal} (25 min · individual). Vas a dibujar en \textbf{una hoja completa del cuaderno} una línea de tiempo con los 8 medios de comunicación, en orden cronológico. No es solo una lista: vas a agregar dibujos pequeños y \textbf{flechas que conectan medios} mostrando qué se conservó del uno al otro.

  pilares:
  - |-
    \textbf{Paso 1.} Pon la hoja \emph{horizontal} (apaisada). Dibuja \textbf{una línea horizontal larga} en el centro. En el extremo izquierdo escribe \textbf{1850}, en el extremo derecho escribe \textbf{2026}. Marca con líneas verticales pequeñas las fechas: 1850, 1865, 1876, 1920, 1954, 1990, 2000, 2010.
  - |-
    \textbf{Paso 2.} En cada marca de fecha escribe \textbf{el nombre del medio} (Carta, Telégrafo, Teléfono, Radio, TV, Internet, SMS, WhatsApp). Alterna: unos arriba de la línea, otros abajo, para que no se amontonen.
  - |-
    \textbf{Paso 3.} Al lado de cada nombre dibuja \textbf{un ícono pequeño} de ese medio: un sobre para la carta, una bocina para el teléfono, una antena para la radio, un televisor cuadrado para la TV, un computador para internet, un celular para SMS, un círculo verde con el rayo para WhatsApp. Dibujos simples, no tienen que estar perfectos.
  - |-
    \textbf{Paso 4.} Bajo cada nombre escribe \textbf{una frase corta} (máximo 8 palabras) de qué hacía ese medio. Ejemplo: \emph{``Carta: viaja en mula, 1 semana''}, \emph{``Radio: una voz, miles oyendo''}.
  - |-
    \textbf{Paso 5.} \textbf{Lo más importante:} dibuja \textbf{4 flechas curvas} que conecten un medio antiguo con uno nuevo, mostrando \textbf{qué se conservó}. Ejemplo: una flecha del telégrafo a SMS con la palabra \emph{``abreviar''}. Una flecha de la carta al correo electrónico con la palabra \emph{``saludo, asunto, firma''}. Tú decides las otras 2 conexiones.
  - |-
    \textbf{Paso 6.} En la esquina inferior derecha escribe tu \textbf{conclusión personal} de 3-4 líneas. Empieza con: \emph{``En 176 años cambió...''} y termina con: \emph{``...pero sigue igual...''}. Ejemplo: \emph{``En 176 años cambió la velocidad, el alcance y el costo, pero sigue igual la necesidad de saludar, identificar al destinatario y firmar lo que escribimos.''}.

  checklist:
    titulo: Antes de mostrar la línea de tiempo
    items: |-
      \checkbox La línea ocupa una hoja completa horizontal. \\[1mm]
      \checkbox Están los 8 medios con su fecha y nombre. \\[1mm]
      \checkbox Cada medio tiene un ícono dibujado. \\[1mm]
      \checkbox Cada medio tiene una frase corta de lo que hacía. \\[1mm]
      \checkbox Hay al menos 4 flechas de conexión con su palabra. \\[1mm]
      \checkbox Está la conclusión personal de 3-4 líneas firmada.

  plantilla_guion: |-
    \textbf{Estructura del eje}: 1850 --- 1865 --- 1876 --- 1920s --- 1954 --- 1990s --- 2000s --- 2010+. \textbf{Cada medio}: fecha + nombre + ícono + frase corta. \textbf{Flechas}: conectan medio antiguo con moderno, llevan una palabra (lo que se conservó). \textbf{Conclusión}: 3-4 líneas en la esquina inferior derecha.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi línea de tiempo de los medios». \textbf{Formato:} hoja entera horizontal con línea de tiempo, dibujos pequeños, flechas y conclusión. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} podrías explicársela a tu bisabuela y ella entendería en 1 minuto cómo llegamos de su carta postal a tu WhatsApp.

  producto_titulo: Línea de tiempo de los medios · 8 medios con conexiones · firmada
  criterios:
  - La línea ocupa una hoja entera horizontal.
  - Están los 8 medios en orden cronológico correcto.
  - Cada medio tiene fecha, nombre, ícono y frase corta.
  - Hay mínimo 4 flechas de conexión entre medios antiguos y modernos.
  - La conclusión final responde qué cambió y qué se conservó.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo que estudió cómo los pueblos guardan memoria)"
    cita: |-
      ``El que no sabe de dónde viene una herramienta, fácil cae en pensar que la herramienta lo gobierna a él, y no al revés.''
    aplicacion: |-
      Cuando \textbf{sabes que WhatsApp viene de la carta postal}, dejas de tratarlo como magia. Es un medio. Tiene reglas viejas (el saludo, la firma, el destinatario). Tú lo manejas, no él a ti. \textbf{La historia te devuelve poder sobre la herramienta}: te muestra que los humanos llevan 200 años pasándose mensajes y que tú no eres la primera generación con ese desafío.
    pregunta_espejo: |-
      ¿Uso las herramientas digitales con criterio, o dejo que ellas me usen a mí porque no sé de dónde vienen?

  estoico:
    autor: "Marco Aurelio (emperador que escribió sobre lo que cambia y lo que no)"
    cita: |-
      ``Las formas cambian rápido. Lo que cuenta --- el saludo, la honestidad, el respeto --- es lo mismo desde hace milenios.''
    aplicacion: |-
      Mira tu línea de tiempo: \textbf{las formas cambiaron} --- mula, cable, ondas, satélite, fibra óptica --- pero \textbf{lo importante sigue igual}. Se saluda, se identifica el destinatario, se firma, se respeta al otro. Si dominas eso, dominas cualquier medio nuevo que aparezca dentro de 10 años. La forma cambiará otra vez. Lo bueno --- el respeto --- no.
    pregunta_espejo: |-
      ¿Estoy aprendiendo lo que dura, o solo lo que está de moda esta semana?

  floridi:
    autor: "Luciano Floridi (filósofo italiano que estudia el cambio tecnológico)"
    cita: |-
      ``Cada generación cree que su medio es el más importante. Después llega otro medio y se vuelven el medio anterior. La sabiduría es ver venir el cambio.''
    aplicacion: |-
      Tu bisabuela vivió un mundo \textbf{sin radio}. Tu abuela vivió un mundo \textbf{sin TV}. Tu mamá vivió un mundo \textbf{sin WhatsApp}. Tú vas a vivir un mundo \textbf{sin algún medio que apenas se va a inventar}. La pregunta no es \emph{``qué medio voy a usar siempre''}: la pregunta es \emph{``cómo aprendo a aprender medios nuevos sin enredarme''}. La línea de tiempo te enseña eso.
    pregunta_espejo: |-
      ¿Estoy aprendiendo a \textbf{cambiarme} de medio cuando llegue uno nuevo, o me voy a quedar pegado al que conozco hoy?

compromiso: |-
  \textbf{Para la próxima sesión.} Guarda tu línea de tiempo en el cuaderno. Esta semana, observa: ¿cuántos medios distintos usaste en un día? Cuéntalos. La próxima clase vas a aprender sobre tu \textbf{huella digital}: el rastro de cosas que dejas cuando navegas, posteas y juegas. Hoy viste la historia. La próxima clase vas a ver el presente: lo que va quedando con tu nombre.

web:
  conceptos_clave:
    - termino: Medio de comunicación
      definicion: |-
        Cualquier herramienta que las personas usan para mandarse mensajes a distancia o a muchas personas a la vez. El pregonero era un medio. WhatsApp también es un medio.
      ejemplo: |-
        Carta, telégrafo, radio, televisión, WhatsApp, TikTok. Todos son medios; lo único que cambia es la velocidad, el alcance y el costo.
      emoji: "📡"
    - termino: Carta postal
      definicion: |-
        El medio más antiguo de la lista. Mensajes en papel que viajaban en mula, barco o tren. Trajo la idea de destinatario, asunto, saludo y firma --- las 5 partes del correo de hoy.
      ejemplo: |-
        En 1900 una carta de Cartago a Pereira tardaba 1 semana. Tenía sello, sobre, dirección a quién y firma de quién.
      emoji: "✉️"
    - termino: Telégrafo
      definicion: |-
        Medio inventado en 1844 que mandaba mensajes muy cortos por cables eléctricos. Cada palabra costaba dinero, por eso se escribían abreviadas y pegadas. Abuelo del SMS y del chat.
      ejemplo: |-
        En vez de "Llegué bien y mi hermano está enfermo, ven pronto" se enviaba "LLEGOBIEN HERMENF VENYA". Cada palabra contaba.
      emoji: "📜"
    - termino: Audiencia masiva
      definicion: |-
        La idea de que una sola persona habla o publica y muchas miles escuchan o ven al mismo tiempo. La radio fue el primero en lograrlo a gran escala. Hoy TikTok y YouTube hacen lo mismo.
      ejemplo: |-
        En los años 30 una familia se reunía alrededor del radio a escuchar a Hitler, Roosevelt o el partido de fútbol. Una voz, miles oyendo.
      emoji: "📻"
    - termino: Medio en el bolsillo
      definicion: |-
        La gran novedad del celular. Antes los medios estaban en lugares fijos: la radio en la sala, la TV en la sala, el teléfono colgado en la pared. El celular hizo que el medio viajara contigo a todas partes.
      ejemplo: |-
        Tu mamá de niña tenía que ir a la sala a llamar por teléfono fijo. Tú llevas el teléfono en el bolsillo --- y radio, TV, cámara y enciclopedia adentro.
      emoji: "📱"

  quiz:
    titulo: "¿Conoces la historia de los medios?"
    instrucciones: "5 preguntas para verificar que entiendes de dónde vienen WhatsApp, TikTok y los chats."
    preguntas:
      - enunciado: "¿De qué medio antiguo viene la idea de 'destinatario, asunto, saludo, cuerpo y firma'?"
        opciones:
          - "Del telégrafo, porque mandaba mensajes cortos."
          - "De la carta postal, donde nacieron esas 5 partes."
          - "De WhatsApp, que las inventó hace poco."
          - "De la radio, porque se grababa la voz."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Las 5 partes vienen de la carta postal de hace más de 100 años. WhatsApp solo las modernizó.
        feedback_incorrecto: |-
          De la carta postal. Esas 5 partes existen hace más de 100 años. El correo electrónico solo las trasladó a la pantalla.
      - enunciado: "¿Cuál de estos medios es el más antiguo?"
        opciones:
          - "Televisión"
          - "Telégrafo"
          - "Radio"
          - "Teléfono celular"
        respuesta_index: 1
        feedback_correcto: |-
          Bien. El telégrafo (1844) llegó antes que la radio, la TV y el celular. Era cables y código Morse.
        feedback_incorrecto: |-
          El telégrafo (1844) es el más antiguo de la lista. Después vino el teléfono, la radio, la TV y el celular.
      - enunciado: "¿Qué tienen en común el telégrafo y los mensajes de chat de hoy?"
        opciones:
          - "Los dos viajan por cables submarinos."
          - "Los dos usan abreviaciones porque hay que ser breves."
          - "Los dos cuestan dinero por cada letra."
          - "Los dos los maneja un operador en una oficina."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El telégrafo enseñó a abreviar porque cada palabra costaba. Hoy abrevias en chats por costumbre de esa misma idea.
        feedback_incorrecto: |-
          Los dos abrevian. El telégrafo lo hacía porque cada palabra costaba dinero. Los chats heredaron ese hábito.
      - enunciado: "Tu bisabuela quiere entender qué es WhatsApp. ¿Cómo se lo explicas mejor?"
        opciones:
          - "Es magia, abuela, no te preocupes."
          - "Es como mandar muchas cartitas rápido por el aire, en vez de mula."
          - "Es algo que solo entendemos los jóvenes."
          - "Es un programa que se inventó solo."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Saber comparar lo nuevo con lo antiguo te ayuda a entenderlo tú y a explicarlo a quien no lo conoce.
        feedback_incorrecto: |-
          Comparar lo nuevo con lo antiguo es la mejor explicación: WhatsApp es cartas rápidas por el aire, igual de simple.
      - enunciado: "¿Qué medio trajo por primera vez la idea de 'cualquiera puede publicar'?"
        opciones:
          - "La radio."
          - "La televisión."
          - "Internet."
          - "El teléfono fijo."
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Antes de internet, solo periódicos y canales de TV podían publicar masivamente. Internet abrió esa puerta a cualquiera.
        feedback_incorrecto: |-
          Internet fue el primer medio donde cualquier persona podía publicar. Radio y TV exigían ser parte de una empresa para emitir.

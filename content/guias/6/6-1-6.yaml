grado: 6
periodo: 1
sesion: 6
completo: true

titulo: "Mi huella digital --- el rastro que dejas sin darte cuenta"
titulo_portada: |-
  Mi huella
  digital ---
  el rastro
  que dejas
  sin notarlo

producto_final: |-
  Un \textbf{mapa personal de la huella digital de un día tuyo}: en una hoja del cuaderno dibujas un \emph{reloj de 24 horas} en círculo, y en cada hora marcas \textbf{qué apps abriste, qué buscaste, dónde estuviste} (según tu celular). Después clasificas cada huella en 3 colores: \textbf{verde} (huella que tú decidiste dejar), \textbf{amarillo} (huella que dejaste sin pensar), \textbf{rojo} (huella que tal vez te conviene borrar o evitar). Más \textbf{3 compromisos escritos} para reducir las huellas rojas en la próxima semana.

apertura:
  saber_ancestral: |-
    \textbf{En el río Cauca el pescador sabía dónde estaban los peces porque leía huellas.} Antes de los sonares y los celulares, el pescador del Pacífico y del Cauca leía el agua para saber qué había debajo: las \textbf{ondas pequeñas} mostraban un cardumen, las \textbf{burbujas} contaban dónde dormía el bocachico, las \textbf{ramas mordidas} de la orilla decían \emph{``aquí estuvo un capibara hace dos horas''}. Cada criatura, sin querer, dejaba un rastro. Por ese rastro la gente sabía exactamente quién había pasado, cuándo y a dónde iba. En internet pasa parecido: \textbf{cada vez que entras a una app, buscas algo, das me gusta, dejas un rastro}. No lo ves, pero está. Otros sí lo leen --- algunos para cuidarte (tus papás), otros para venderte cosas (las empresas), y a veces personas malas para hacerte daño.

  saber_contemporaneo: |-
    Tu \textbf{huella digital} es el rastro que dejas cuando usas internet. \textbf{No es lo mismo que la identidad digital.} La identidad es lo que TÚ decides mostrar de ti (tu foto, tu apodo, tus videos). La huella es \textbf{todo lo demás}: lo que buscas, dónde estuviste según el GPS, cuánto tiempo viste cada TikTok, qué apps usas, en qué horarios, hasta cómo deslizas el dedo. Las empresas guardan esa huella para venderte cosas. \textbf{Tú casi no la ves}, pero ahí queda. Hay 3 tipos de huella, y hoy las vas a reconocer. Cuando entiendes tu huella, puedes \emph{borrar las que no te sirven, cuidar las que sí}, y empezar a moverte por internet con criterio en vez de a ciegas.

  pregunta_puente: |-
    Si tu mamá pudiera ver \textbf{todo lo que hiciste en el celular ayer} --- cada video, cada búsqueda, cada chat, cada lugar donde estuviste según el GPS --- ¿le gustaría lo que vería? ¿O hay cosas que preferirías que no viera?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} 3 tipos distintos de huella digital; (2) sabrás \textbf{explicar} la diferencia entre identidad digital y huella digital; (3) habrás \textbf{evaluado} las huellas de un día tuyo y las clasificarás en verde-amarillo-rojo; (4) habrás \textbf{escrito} 3 compromisos para reducir tus huellas rojas.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas las apps que usaste ayer, descubres los 3 tipos de huella, evalúas tus huellas, y firmas compromisos.
  a_escuta: |-
    Empezamos con un inventario de tu día de ayer en el celular.
  a_sistematizacion: |-
    Después del inventario, aprendes los 3 tipos de huella digital.
  a_praxis: |-
    Con los 3 tipos claros, dibujas tu reloj de 24 horas y clasificas tus huellas por color.
  a_producto: |-
    El producto es ese reloj clasificado más los 3 compromisos para reducir huellas rojas.
  a_evaluacion: |-
    Antes de salir, miras tus 3 compromisos y verificas que sean concretos (no \emph{``voy a portarme mejor''}, sino \emph{``voy a desactivar el GPS de TikTok''}).
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué te conviene saber qué rastro dejas.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario de tu día de ayer} (12 min · individual). En el cuaderno, dibuja una tabla de 2 columnas. En la columna izquierda escribe estas \textbf{6 horas} de un día normal: \emph{6 am (despertar), 8 am (camino al cole), 12 m (descanso), 4 pm (al volver a casa), 7 pm (después de comer), 10 pm (antes de dormir)}. En la columna derecha escribe \textbf{qué hiciste en el celular en cada hora}: ¿qué app abriste? ¿qué buscaste? ¿con quién chateaste? ¿qué video viste? Sé honesto; este cuaderno no se publica. Si no usaste el celular en una hora, escribe \emph{``no lo toqué''} --- esa también es una respuesta.

  checks:
  - Hice la tabla de 6 horas.
  - Anoté con honestidad qué hice en el celular en cada una.
  - Si en alguna hora no usé el celular, lo anoté también.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mi día de ayer en el celular». \textbf{Formato:} tabla de 2 columnas, 6 filas. \textbf{Extensión:} 6 filas con honestidad. \textbf{Sabes que terminaste cuando} tu tabla refleja un día real tuyo, no un día imaginario \emph{``perfecto''}.

sistematizacion:
  intro: |-
    Lo que acabaste de hacer es \textbf{ver tu huella}. Casi nunca te detienes a verla. Ahora vas a aprender que esa huella tiene 3 tipos distintos. Saberlos te ayuda a saber cuál cuidar y cuál borrar.

  pilares:
  - |-
    \textbf{Tipo 1 --- Huella activa.} Es la huella que dejas \emph{a propósito}, porque tú decidiste dejarla. \textbf{Ejemplos:} publicar un TikTok, subir una historia a Instagram, escribir un comentario, mandar un mensaje en WhatsApp. \textbf{Lo importante:} esta huella la controlas tú. Si eres cuidadoso al publicar, no hay problema. Si publicas sin pensar, te queda.
  - |-
    \textbf{Tipo 2 --- Huella pasiva.} Es la huella que dejas \emph{sin darte cuenta}, simplemente por usar las apps. \textbf{Ejemplos:} TikTok sabe cuántos segundos ves cada video, Google guarda cada cosa que buscas, Maps sabe dónde estuviste, Instagram registra cuántas veces abriste su app y a qué hora. \textbf{Lo importante:} esta huella casi no la ves, pero las empresas sí. Sirve para venderte cosas.
  - |-
    \textbf{Tipo 3 --- Huella secundaria.} Es la huella que dejan \emph{otros sobre ti}. \textbf{Ejemplos:} un amigo te toma una foto y la sube; alguien te menciona en un comentario; tu prima te etiqueta en una historia; un familiar publica fotos tuyas de pequeño. \textbf{Lo importante:} esta huella no la controlas directamente. Pero puedes pedirle a la persona que la baje, o usar opciones de privacidad para que no te etiqueten sin permiso.
  - |-
    \textbf{Las 4 reglas para cuidar tu huella.} (1) \textbf{Revisa los permisos:} entra a Ajustes del celular y mira qué apps tienen acceso al GPS, micrófono y cámara. Quita los que no tengan sentido (¿por qué una linterna necesita GPS?). (2) \textbf{Borra de vez en cuando:} el historial de búsqueda, los mensajes viejos, las cuentas que ya no usas. Lo que no borras, se acumula. (3) \textbf{Piensa antes de publicar (huella activa):} si tu mamá no quisiera verlo, no lo publiques. (4) \textbf{Pide permiso, da permiso:} antes de publicar fotos de otros, pides; antes de aceptar que te etiqueten, miras dónde te etiquetan.

  anatomia:
    titulo: Los 3 tipos de huella digital
    body: |-
      \textbf{1. Huella activa} --- la que dejas a propósito (publicar, comentar). \\[1mm]
      \textbf{2. Huella pasiva} --- la que dejas sin notar (búsquedas, ubicación, tiempo en apps). \\[1mm]
      \textbf{3. Huella secundaria} --- la que dejan otros sobre ti (fotos donde te etiquetan, comentarios).

  errores_comunes: |-
    \textbf{Mitos sobre la huella digital que escucharás.} (1) \emph{``Si uso modo incógnito, nadie me ve''} --- Falso. El modo incógnito esconde el historial \emph{de tu computador}, pero la app y el sitio web te siguen viendo igual. (2) \emph{``Si borro la app, se borra todo''} --- Falso. La empresa guarda tus datos aunque tú borres la app. Tienes que pedir formalmente que borren tu cuenta. (3) \emph{``Yo no soy famoso, a nadie le importa mi huella''} --- Falso. A las empresas SÍ les importa: tus datos se venden a publicistas. Tu huella vale dinero. (4) \emph{``Si no tengo nada que esconder, no importa''} --- Falso. Privacidad no es esconder; es escoger qué muestras y a quién.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Los 3 tipos de huella con ejemplos míos». \textbf{Formato:} tabla de 2 columnas, 3 filas. Columna 1: nombre del tipo. Columna 2: \emph{un ejemplo tuyo} de huella de ese tipo del día de ayer (saca del inventario que ya hiciste). \textbf{Extensión:} 3 filas. \textbf{Sabes que terminaste cuando} podrías explicarle a un primo más pequeño qué es huella activa, pasiva y secundaria.

praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Tu reloj de 24 horas con colores} (25 min · individual). Vas a dibujar en una hoja del cuaderno tu \textbf{huella digital de un día} en forma de reloj. Lo dividirás en 24 horas, marcarás qué hiciste en cada una con el celular, y \textbf{clasificarás cada acción con un color}: verde (sano), amarillo (cuidado), rojo (peligro). Al final firmas 3 compromisos.

  pilares:
  - |-
    \textbf{Paso 1.} Dibuja un \textbf{círculo grande en el centro de la hoja}. Divídelo en 24 partes (como un reloj pero con 24 horas en vez de 12). Marca las horas en el borde: 6am, 8am, 10am, 12m, 2pm, 4pm, 6pm, 8pm, 10pm, 12am, etc.
  - |-
    \textbf{Paso 2.} En cada hora del círculo, escribe (o dibuja con un ícono) \textbf{lo que hiciste con el celular} en esa hora ayer. Usa la tabla de la Actividad 1 como base. Si no usaste el celular en una hora, deja la hora en blanco --- ese vacío también cuenta.
  - |-
    \textbf{Paso 3.} Ahora viene la parte importante. Pinta \textbf{el borde de cada hora con un color} según esta regla: \textbf{verde} si lo que hiciste fue sano (chat con familia, estudiar, jugar con amigos conocidos). \textbf{Amarillo} si fue dudoso (ver muchos videos seguidos, perder horas sin notar, chats con desconocidos). \textbf{Rojo} si fue riesgoso (compartir info personal, hablar con extraños, ver cosas que no deberías).
  - |-
    \textbf{Paso 4.} Cuenta los colores. ¿Cuántas horas verdes hay? ¿Cuántas amarillas? ¿Cuántas rojas? Anótalo al lado del círculo: \emph{``Verde: 4h. Amarillo: 6h. Rojo: 1h.''}. Sin trampa --- cuenta lo que realmente hiciste.
  - |-
    \textbf{Paso 5.} Mira las horas \textbf{amarillas y rojas}. Escoge las 3 acciones que más te preocupan o que más quieres cambiar. Anótalas: \emph{``Acción a reducir 1: ver TikTok más de 1h seguida. Acción a reducir 2: revisar el celular antes de dormir.''}.
  - |-
    \textbf{Paso 6.} Para cada acción, escribe un \textbf{compromiso concreto} para la próxima semana. \textbf{Concreto significa medible:} no \emph{``voy a usar menos el celular''}, sino \emph{``voy a poner cronómetro de 20 minutos en TikTok''}. Tres compromisos. Firma con tu nombre y fecha.

  checklist:
    titulo: Antes de mostrar el mapa
    items: |-
      \checkbox El reloj de 24 horas ocupa el centro de la hoja. \\[1mm]
      \checkbox Cada hora tiene anotado lo que hice (o un vacío si no usé el celular). \\[1mm]
      \checkbox Cada hora está pintada con verde, amarillo o rojo. \\[1mm]
      \checkbox Conté cuántas horas tuve de cada color. \\[1mm]
      \checkbox Identifiqué 3 acciones a reducir (de amarillas o rojas). \\[1mm]
      \checkbox Escribí 3 compromisos concretos y los firmé.

  plantilla_guion: |-
    \textbf{Estructura del reloj:} círculo grande, 24 divisiones, hora marcada en el borde, acción adentro, color en el borde. \textbf{Estructura del compromiso:} \emph{``Acción a reducir [N]: [qué hago hoy]. Compromiso: [qué voy a hacer en cambio, medible].''}.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} Título: «Actividad 3 --- Mi huella digital de un día». \textbf{Formato:} reloj circular de 24 horas con colores + lista de 3 compromisos. \textbf{Extensión:} 1 hoja entera del cuaderno. \textbf{Sabes que terminaste cuando} mirando el reloj puedes decir en voz alta \emph{``estas son las horas que necesito cuidar más''} y tienes 3 compromisos medibles para hacerlo.

  producto_titulo: Reloj de 24 horas + 3 compromisos firmados
  criterios:
  - El reloj cubre las 24 horas del día.
  - Cada hora con actividad tiene su anotación.
  - Las horas están clasificadas en verde, amarillo o rojo.
  - El conteo de colores está hecho con honestidad.
  - Los 3 compromisos son medibles (con tiempo, con número, con acción concreta).

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la dignidad de las personas)"
    cita: |-
      ``No eres lo que las empresas creen que eres por tus búsquedas. Eres más que tu huella.''
    aplicacion: |-
      Las empresas que recogen tu huella creen que pueden predecir todo de ti: qué te gusta, qué vas a comprar, qué te asusta. \textbf{Pero tú eres mucho más} que esa huella. La huella es una sombra muy pequeña de quien eres. Conocer tu huella te ayuda a no dejar que esa sombra te defina. Tú decides qué partes del río de tu vida quieres que se vean.
    pregunta_espejo: |-
      ¿Estoy \textbf{dejándome describir} por mis búsquedas y mis likes, o sigo siendo yo el que decide quién soy?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Lo que haces a solas habla más fuerte de ti que lo que muestras en público.''
    aplicacion: |-
      Marco Aurelio escribió esto hace 1800 años, pero parece escrito ayer. \textbf{Tu huella digital es lo que haces ``a solas'' con el celular}: nadie te ve, pero el celular sí. Cuida tu huella como cuidarías tu cuaderno privado: si tu mamá lo abriera, ¿te sentirías bien con lo que ve? Esa pregunta es el espejo.
    pregunta_espejo: |-
      ¿Hago en el celular cosas que coinciden con quien soy, o cosas que me darían pena si las viera mi familia?

  floridi:
    autor: "Luciano Floridi (filósofo italiano que estudia la privacidad en internet)"
    cita: |-
      ``Privacidad no es esconder; privacidad es decidir qué se cuenta de ti y a quién.''
    aplicacion: |-
      Mucha gente dice \emph{``no tengo nada que esconder''} para justificar no cuidar la huella. Pero \textbf{privacidad no es esconder}: privacidad es \textbf{tú escoges} qué muestras, a quién, y cuándo. Es libertad. Cuando alguien recoge tu huella sin que tú decidas, te están quitando esa libertad. Cuidar la huella es defender la libertad de seguir decidiendo.
    pregunta_espejo: |-
      Cuando entrego mis datos sin pensar, ¿estoy regalando libertad sin notarlo?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, antes de dormir, mira el reloj de tu cuaderno. Cumple los 3 compromisos que firmaste. La próxima clase vas a aprender sobre \textbf{privacidad y datos personales}: qué son, por qué importan, y cómo configurar tu celular y tus apps para protegerte. Hoy viste tu huella. La próxima ves cómo cerrar las puertas para que solo entre quien tú quieres.

web:
  conceptos_clave:
    - termino: Huella digital
      definicion: |-
        El rastro que dejas cuando usas internet. No es lo mismo que la identidad: la identidad es lo que tú decides mostrar; la huella es todo lo demás (búsquedas, ubicación, tiempo en apps, cosas que otros publican de ti).
      ejemplo: |-
        Tu identidad digital incluye tu foto de perfil. Tu huella incluye que el martes viste 47 videos de TikTok entre 10 y 11 pm.
      emoji: "👣"
    - termino: Huella activa
      definicion: |-
        La que dejas a propósito. Tú decides publicar un TikTok, subir una historia, escribir un comentario. Como tú la controlas, depende de ti que sea buena o no.
      ejemplo: |-
        Subir una foto a Instagram con tu nombre es huella activa. Comentar un video con tu apodo también lo es.
      emoji: "✍️"
    - termino: Huella pasiva
      definicion: |-
        La que dejas sin darte cuenta. Las apps registran cuánto tiempo las usas, qué buscas, dónde estás (si tienen GPS), a qué hora abres el celular. Las empresas la guardan y la venden.
      ejemplo: |-
        TikTok sabe que te detienes 8 segundos en cada video de gatos. Google guarda cada palabra que has buscado este año.
      emoji: "🔍"
    - termino: Huella secundaria
      definicion: |-
        La que dejan otros sobre ti. Un amigo te etiqueta en una foto, una prima te menciona, un familiar publica fotos viejas tuyas. Tú no la controlas directamente, pero puedes pedir que la quiten.
      ejemplo: |-
        Tu tía sube una foto tuya de cuando tenías 5 años a Facebook. Es tu huella aunque tú no la publicaste.
      emoji: "👥"
    - termino: Permisos de la app
      definicion: |-
        La lista de cosas que una app puede ver de tu celular: GPS, cámara, micrófono, contactos. Cada app pide los suyos. Algunos tienen sentido (Maps necesita GPS); otros no (una linterna no necesita micrófono).
      ejemplo: |-
        Si una app de juego pide tu lista de contactos, eso no tiene sentido. Mejor le niegas el permiso o no la instalas.
      emoji: "🔓"

  quiz:
    titulo: "¿Conoces tu huella digital?"
    instrucciones: "5 preguntas para verificar que sabes qué rastro dejas en internet y cómo cuidarlo."
    preguntas:
      - enunciado: "¿Cuál es la diferencia entre identidad digital y huella digital?"
        opciones:
          - "Son lo mismo, solo cambia el nombre."
          - "La identidad es lo que tú muestras; la huella es lo que queda sin que tú decidas."
          - "La identidad es para adultos; la huella es para niños."
          - "La huella es buena; la identidad es mala."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La identidad la decides tú. La huella se va dejando casi sin notar. Cuidar las dos requiere cosas distintas.
        feedback_incorrecto: |-
          La identidad es lo que tú decides mostrar. La huella es lo que las apps registran sin que tú lo notes.
      - enunciado: "Subes una foto a TikTok. ¿Qué tipo de huella es?"
        opciones:
          - "Huella activa: tú decidiste subirla."
          - "Huella pasiva: la app la subió sola."
          - "Huella secundaria: alguien más la subió."
          - "No es huella, es solo un video."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. Tú la subiste a propósito, entonces es activa. La controlas tú: si la cuidas, está bien; si no, te queda.
        feedback_incorrecto: |-
          Si tú la subiste a propósito, es huella activa. La pasiva la dejas sin notar; la secundaria la dejan otros sobre ti.
      - enunciado: "Tu prima sube una foto vieja tuya sin pedirte permiso. ¿Qué tipo de huella es?"
        opciones:
          - "Huella activa: porque ahí estás tú."
          - "Huella pasiva: porque no lo notaste."
          - "Huella secundaria: porque la dejó otra persona sobre ti."
          - "No es huella, es solo una foto vieja."
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. La huella secundaria es la que dejan otros. Puedes pedirle a tu prima que la baje y eso es válido.
        feedback_incorrecto: |-
          Es huella secundaria porque la dejó otra persona. Tienes derecho a pedirle a tu prima que la quite si no te gusta.
      - enunciado: "Una app de linterna te pide permiso para usar tu micrófono y tu lista de contactos. ¿Qué haces?"
        opciones:
          - "Le doy permiso, debe necesitarlo."
          - "Le niego los permisos. Una linterna no necesita micrófono ni contactos."
          - "Le doy solo el micrófono pero no los contactos."
          - "Borro todas las apps de linterna por si acaso."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Si el permiso no tiene sentido con lo que hace la app, lo niegas. Una linterna solo necesita la luz del flash.
        feedback_incorrecto: |-
          Niegas permisos que no tienen sentido. Una linterna no necesita micrófono ni contactos. Si insiste, mejor borra esa app.
      - enunciado: "Alguien te dice 'si no tienes nada que esconder, no necesitas privacidad'. ¿Qué piensas?"
        opciones:
          - "Tiene razón, si me porto bien no necesito privacidad."
          - "Privacidad no es esconder; es escoger qué se cuenta de mí y a quién."
          - "Solo los famosos necesitan privacidad."
          - "La privacidad ya no existe, da igual."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Privacidad es libertad de decidir. No es ocultar cosas malas; es proteger tu espacio para escoger qué muestras.
        feedback_incorrecto: |-
          Privacidad es libertad de decidir qué se sabe de ti. No tiene que ver con esconder cosas malas, sino con poder escoger.

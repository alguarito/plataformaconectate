grado: 6
periodo: 1
sesion: 7
completo: true

titulo: "Privacidad y datos personales --- cerrar las puertas con criterio"
titulo_portada: |-
  Privacidad y
  datos personales ---
  cerrar las
  puertas con
  criterio

producto_final: |-
  Un \textbf{mapa de los 3 niveles de datos personales} en el cuaderno, con \textbf{10 datos tuyos clasificados} (públicos / semi-privados / privados). Más \textbf{una bitácora de configuración} de 2 apps que uses, donde anotas paso a paso \textbf{qué ajuste cambiaste y por qué}. Más \textbf{una promesa}: \emph{``Reviso la privacidad de mis apps cada mes durante este año.''} firmada con nombre y fecha.

apertura:
  saber_ancestral: |-
    \textbf{En el patio de tu abuela había muros, no por miedo: por respeto.} Si alguna vez fuiste a la casa de campo de un abuelo, viste que el patio tenía un cerco bajito, una verja, una puerta. No estaba ahí porque la abuela tuviera miedo. Estaba ahí porque \textbf{cada espacio tenía sus reglas}: el zaguán era para los vecinos, la sala para las visitas, el patio para la familia, el cuarto sólo para ella. Tres niveles distintos de \emph{quién puede entrar}. Cuando llegaba un desconocido, lo atendían en el zaguán; cuando llegaba un amigo, pasaba a la sala; cuando llegaba un hijo, iba directo al patio. \textbf{Era una arquitectura de la confianza}: las puertas decían quién entra y hasta dónde. En internet pasa lo mismo, solo que las puertas no son de madera, son \textbf{ajustes de configuración} en tus apps. Si no las cierras tú, todo el mundo entra hasta tu cuarto.

  saber_contemporaneo: |-
    Un \textbf{dato personal} es cualquier información que diga algo de ti como persona. \textbf{No son todos iguales:} hay 3 niveles. \textbf{Datos públicos}: los que se pueden conocer sin problema (tu nombre, el grado en que estás, la ciudad donde vives). \textbf{Datos semi-privados}: solo amigos cercanos y familia deberían saberlos (tu número de celular, dónde estudias exacto, tu correo personal). \textbf{Datos privados}: nadie debería saberlos salvo tus padres o tú (contraseñas, número de cédula, dirección exacta, datos médicos, fotos íntimas). En Colombia hay incluso una \textbf{ley} (la Ley 1581 de 2012) que protege tus datos personales --- significa que ninguna empresa o persona puede recogerlos o usarlos sin permiso. Hoy vas a aprender a usar tus apps con criterio, decidiendo TÚ qué dato vive en cada nivel.

  pregunta_puente: |-
    ¿Tu nombre real se puede saber en internet? ¿Tu número de celular? ¿Tu dirección exacta? Si \textbf{los 3} están al mismo nivel, hay un problema. ¿Cuál es?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 3 niveles de datos personales con ejemplos; (2) sabrás \textbf{aplicar} las 4 reglas del dato personal; (3) habrás \textbf{configurado} la privacidad de 2 apps que usas; (4) podrás \textbf{evaluar} si una app o sitio respeta tu privacidad.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: clasificas 10 datos tuyos, aprendes las 4 reglas, configuras 2 apps, y firmas promesa.
  a_escuta: |-
    Empezamos con un ejercicio rápido de clasificar 10 datos en 3 niveles.
  a_sistematizacion: |-
    Después del ejercicio aprendes las 4 reglas que protegen los datos personales.
  a_praxis: |-
    Con las 4 reglas en mente, abres 2 apps y cambias los ajustes con criterio.
  a_producto: |-
    El producto es la bitácora de los cambios + la promesa de revisar cada mes.
  a_evaluacion: |-
    Antes de salir, revisas que cada cambio que hiciste tenga su razón anotada.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué la privacidad protege tu libertad.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Clasifica 10 datos tuyos} (10 min · individual). En el cuaderno, dibuja 3 columnas. Encabezados: \textbf{PÚBLICO} (cualquiera puede saber), \textbf{SEMI-PRIVADO} (solo amigos cercanos y familia), \textbf{PRIVADO} (sólo padres y tú). Después clasifica estos \textbf{10 datos} en una de las 3 columnas: \emph{(1) tu nombre real, (2) tu apodo en juegos, (3) la ciudad donde vives, (4) tu colegio exacto, (5) tu número de celular, (6) tu dirección exacta, (7) tu fecha de cumpleaños, (8) tu cédula o tarjeta de identidad, (9) tu correo institucional, (10) la contraseña de tu correo}. No hay respuestas mal-mal, pero hay clasificaciones más cuidadosas que otras.

  checks:
  - Dibujé las 3 columnas en el cuaderno.
  - Clasifiqué los 10 datos en alguna de las 3 columnas.
  - Hice mis propias decisiones (no copié del compañero).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mis 10 datos personales clasificados». \textbf{Formato:} tabla de 3 columnas. \textbf{Extensión:} los 10 datos distribuidos. \textbf{Sabes que terminaste cuando} cada dato tiene una columna y tú puedes justificar la decisión en voz alta si te preguntan.

sistematizacion:
  intro: |-
    Lo que acabaste de hacer fue \textbf{decidir tus niveles}. Ahora vas a aprender las \textbf{4 reglas} que se usan en cualquier país del mundo para cuidar los datos personales. Son reglas legales, no opiniones.

  pilares:
  - |-
    \textbf{Regla 1 --- Mínimo necesario.} Cuando una app o sitio te pide datos, dale \emph{solo los que la app necesita para funcionar}. Una app de juego no necesita tu dirección. Una linterna no necesita tu correo. Si pide más de lo necesario, sospecha. \textbf{Regla 2 --- Por defecto, privado.} Cuando instalas una app nueva, todos los ajustes deberían empezar en \emph{``privado''} y tú los abres a más gente solo si decides. La mayoría de apps hacen lo contrario (empiezan abiertas) --- por eso hay que cambiar los ajustes a mano.
  - |-
    \textbf{Regla 3 --- Borra lo que ya no usas.} Si te bajaste una app y no la abriste en 3 meses, bórrala. Si tienes un correo viejo que no usas, ciérralo. Si tienes una cuenta de juego abandonada, elimínala. \textbf{Cada cuenta abierta es una puerta abierta}. Menos puertas = menos riesgo. \textbf{Regla 4 --- Tienes derecho a saber y a borrar.} La ley colombiana (Ley 1581 de 2012) dice que TÚ puedes pedirle a cualquier empresa \emph{``muéstrame qué datos míos tienes''} y también \emph{``bórralos''}. No es opcional para la empresa: es tu derecho.
  - |-
    \textbf{Configuraciones que TODA app debería tener cerradas:} (1) Cuenta privada o cuenta pública --- empieza en privada. (2) ¿Quién puede mandarme mensajes? --- solo amigos. (3) ¿Quién puede etiquetarme en fotos? --- solo amigos o nadie. (4) ¿Se ve mi ubicación? --- desactivado. (5) ¿Quién puede ver mi número de teléfono? --- nadie. (6) ¿Pueden los buscadores encontrar mi perfil? --- no.
  - |-
    \textbf{Errores de privacidad que te pueden costar caro.} (1) Aceptar todas las cookies de cada sitio que abres --- son ojos que te siguen. (2) Vincular tu Instagram con tu Facebook con tu TikTok con tu Google: si te hackean uno, caen todos. (3) Subir foto del carnet del colegio o de la cédula a un chat --- nunca se sabe quién más lo verá. (4) Usar la misma contraseña en todo --- si te la roban en un sitio, caen todos. (5) Decir que sí a \emph{``compartir mi ubicación con todos''} sin saber lo que significa.

  anatomia:
    titulo: Las 4 reglas del dato personal
    body: |-
      \textbf{Regla 1.} Mínimo necesario: solo das los datos que la app realmente necesita. \\[1mm]
      \textbf{Regla 2.} Por defecto, privado: empiezas cerrado y abres con criterio. \\[1mm]
      \textbf{Regla 3.} Borra lo que ya no usas: cuentas viejas son puertas abiertas. \\[1mm]
      \textbf{Regla 4.} Tienes derecho a saber y a borrar (Ley 1581 de 2012, Colombia).

  errores_comunes: |-
    \textbf{Mitos sobre privacidad que escucharás.} (1) \emph{``Si tengo cuenta privada, ya estoy seguro''} --- Falso. Privacidad es muchos ajustes, no uno solo. (2) \emph{``Si no soy famoso, nadie me busca''} --- Falso. Los datos se venden por paquetes. Vales como dato. (3) \emph{``La ley no aplica a redes sociales''} --- Falso. La Ley 1581 aplica a TODA empresa que tenga datos tuyos en Colombia, incluso si está en otro país. (4) \emph{``Borrar es imposible''} --- Falso. Tienes derecho. A veces hay que insistir y pedir formalmente, pero se puede.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Las 4 reglas con un ejemplo mío». \textbf{Formato:} 4 párrafos cortos numerados. Cada uno: nombre de la regla (1 línea) + tu propio ejemplo de aplicarla en tu vida (1-2 líneas). \textbf{Extensión:} 4 párrafos de 2-3 líneas. \textbf{Sabes que terminaste cuando} cada regla tiene un ejemplo tuyo, no uno copiado del libro.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Configura la privacidad de 2 apps que usas} (30 min · individual o parejas). Vas a abrir el celular (o el computador), entrar a \textbf{2 apps que usas regularmente} (WhatsApp, Instagram, TikTok, Roblox --- escoge tú), e ir a sus ajustes de privacidad. Para cada app vas a hacer \textbf{una bitácora} en el cuaderno: qué ajuste cambiaste, qué estaba antes, qué quedó ahora, por qué cambió.

  pilares:
  - |-
    \textbf{Paso 1 --- Elige las 2 apps.} Las que más usas. Pueden ser WhatsApp, Instagram, TikTok, Roblox, Discord, Snapchat. En el cuaderno escribe \textbf{App 1: \_\_\_\_\_\_} y \textbf{App 2: \_\_\_\_\_\_}. Si no tienes ninguna app instalada, escoge YouTube y Gmail (vienen en todos los celulares).
  - |-
    \textbf{Paso 2 --- App 1, abrir ajustes.} Entra a la app. Busca el ícono de \emph{Ajustes} o \emph{Configuración} (suele ser un engrane o las 3 rayitas). Luego busca \emph{Privacidad}. En tu cuaderno escribe el camino que recorriste: \emph{``Abrí WhatsApp, toqué los 3 puntos arriba, fui a Ajustes, después a Privacidad''}.
  - |-
    \textbf{Paso 3 --- App 1, revisa estos 4 ajustes.} En tu cuaderno haz una tabla con 4 columnas: \textbf{Ajuste} | \textbf{Estaba en} | \textbf{Cambié a} | \textbf{Por qué}. Revisa: (a) ¿quién ve mi foto de perfil? (b) ¿quién ve mi última conexión? (c) ¿quién me puede agregar a grupos? (d) ¿mi ubicación está activada? Llena las 4 filas.
  - |-
    \textbf{Paso 4 --- App 2, mismo proceso.} Repite el Paso 2 y 3 con la otra app. Es probable que los nombres cambien (\emph{``Cuenta privada''}, \emph{``Quién puede comentar''}), pero las ideas son las mismas: quién ve qué.
  - |-
    \textbf{Paso 5 --- Audita los permisos del celular.} Ve a los Ajustes generales del celular (no de la app), busca \emph{Permisos de las apps}. Mira cuáles tienen acceso a tu \emph{ubicación, micrófono y cámara}. Si una app no necesita esos accesos para funcionar, \textbf{quítaselos}. En el cuaderno escribe: \emph{``Le quité GPS a [app] porque [razón]''}.
  - |-
    \textbf{Paso 6 --- Promesa.} Al final del cuaderno escribe: \emph{``Me comprometo a revisar la privacidad de mis apps el primer sábado de cada mes durante este año. Yo decido qué se ve de mí.''} Firma con nombre completo y fecha de hoy.

  checklist:
    titulo: Antes de mostrar la bitácora
    items: |-
      \checkbox Escogí 2 apps que uso de verdad. \\[1mm]
      \checkbox Para cada app, anoté el camino para llegar a Ajustes. \\[1mm]
      \checkbox Llené la tabla de 4 columnas (ajuste, estado antes, estado nuevo, por qué). \\[1mm]
      \checkbox Audité los permisos del celular. \\[1mm]
      \checkbox Quité al menos un permiso que no tenía sentido. \\[1mm]
      \checkbox Escribí la promesa y la firmé.

  plantilla_guion: |-
    \textbf{Plantilla de la bitácora:} App 1: [nombre]. Camino: [pasos para llegar a privacidad]. Tabla: [4 filas con ajustes revisados]. \textbf{App 2}: igual. \textbf{Permisos del celular}: [apps a las que quité permisos]. \textbf{Promesa firmada}.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi bitácora de privacidad». \textbf{Formato:} 2 bloques (uno por app) con tabla de 4 columnas, más sección de permisos del celular, más promesa firmada. \textbf{Extensión:} 1 página y media. \textbf{Sabes que terminaste cuando} podrías mostrarle la bitácora a tu mamá y ella sabría qué cambiaste y por qué.

  producto_titulo: Bitácora de privacidad de 2 apps + permisos del celular + promesa firmada
  criterios:
  - Hay 2 apps revisadas con sus 4 ajustes cada una.
  - Cada ajuste tiene su razón anotada.
  - Los permisos del celular fueron revisados.
  - Se quitó al menos un permiso innecesario.
  - La promesa está firmada con nombre completo y fecha.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la liberación)"
    cita: |-
      ``El que decide qué se sabe de él, es libre. El que entrega todo sin pensar, ya no lo es.''
    aplicacion: |-
      Cuando aceptas todos los permisos sin leer, cuando entregas todos tus datos sin pensar, estás \textbf{regalando libertad}. No se nota al principio. Pero a largo plazo te quedas sin decisión: las apps deciden por ti qué te muestran, qué te venden, qué te recomiendan. \textbf{Cuidar la privacidad es cuidar tu libertad de decidir.}
    pregunta_espejo: |-
      ¿Estoy decidiendo yo qué se sabe de mí, o estoy dejando que las apps lo decidan por mí?

  estoico:
    autor: "Epicteto"
    cita: |-
      ``Cuida lo que depende de ti --- tu palabra, tu casa, tu cuerpo, tus datos. Lo que no depende de ti, suéltalo.''
    aplicacion: |-
      No puedes controlar todo internet. Pero \textbf{sí puedes controlar} qué publicas, qué permisos das, qué apps usas y cómo las configuras. Eso depende de ti. Si gastas energía culpando a las empresas, pierdes tiempo. Si gastas energía configurando lo tuyo, ganas seguridad.
    pregunta_espejo: |-
      ¿Estoy quejándome de cosas que no controlo, o estoy actuando sobre las que sí?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la información)"
    cita: |-
      ``Los datos no son neutros. Quien los tiene, tiene poder sobre ti.''
    aplicacion: |-
      Cuando una empresa tiene muchos datos tuyos, no es solo \emph{``información''}: es \textbf{poder} para influenciar lo que ves, lo que compras, lo que piensas. Por eso cuidas tus datos: porque también estás cuidando \emph{quién tiene poder sobre tus decisiones}. La privacidad no es un capricho moderno, es defensa.
    pregunta_espejo: |-
      ¿A quién le estoy dando poder sobre mis decisiones, simplemente por entregarle mis datos sin pensar?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, antes de instalar una app nueva, te haces 2 preguntas: ``¿qué datos pide?'' y ``¿los necesita de verdad?''. La próxima clase vas a aprender sobre \textbf{riesgos digitales}: ciberacoso, grooming, retos peligrosos. Hoy aprendiste a cerrar puertas. La próxima clase aprendes a reconocer las amenazas que vienen del otro lado.

web:
  conceptos_clave:
    - termino: Dato personal
      definicion: |-
        Cualquier información que diga algo de ti como persona. Tu nombre, tu edad, tu cara, tu ubicación, tu correo, tu contraseña. No todos son iguales: hay 3 niveles según quién debería poder verlos.
      ejemplo: |-
        Tu nombre es dato personal. Tu cara también. Tu cédula también. Tu contraseña también. Cada uno tiene su nivel.
      emoji: "📋"
    - termino: Dato público
      definicion: |-
        El que se puede saber sin problema. Tu nombre, tu ciudad, el grado escolar en que estás. Esto no es información peligrosa si lo combinas con sentido común.
      ejemplo: |-
        "Soy Lara, estoy en sexto, vivo en Cartago" son datos públicos. No comprometen seguridad.
      emoji: "🌍"
    - termino: Dato semi-privado
      definicion: |-
        El que solo deberían saber amigos cercanos y familia. Tu número de celular, tu correo personal, tu colegio exacto, fotos cotidianas tuyas. No los pones públicos en redes sociales.
      ejemplo: |-
        Tu número de WhatsApp es semi-privado: lo das a quien conoces, no lo publicas en tu bio de Instagram.
      emoji: "🔑"
    - termino: Dato privado
      definicion: |-
        El que no debería saber casi nadie aparte de tus padres y tú. Contraseñas, número de cédula, dirección exacta de casa, datos médicos, fotos íntimas. Estos son intocables.
      ejemplo: |-
        Tu contraseña, tu número de tarjeta de identidad, tu dirección exacta. Nada de esto va a internet.
      emoji: "🔒"
    - termino: Ley 1581 de 2012
      definicion: |-
        La ley colombiana que protege tus datos personales. Dice que ninguna empresa puede usar tus datos sin tu permiso, y que tú tienes derecho a saber qué datos tienen de ti y a pedirles que los borren.
      ejemplo: |-
        Si una empresa de marketing te llama porque "compró" tu número, tú puedes pedirle que borre tu información. La ley te respalda.
      emoji: "⚖️"

  quiz:
    titulo: "¿Sabes cuidar tus datos personales?"
    instrucciones: "5 preguntas para verificar que sabes clasificar y proteger tus datos personales."
    preguntas:
      - enunciado: "¿Cuál de estos es un dato privado (que casi nadie debería saber)?"
        opciones:
          - "Tu nombre de pila"
          - "La ciudad donde vives"
          - "Tu contraseña del correo institucional"
          - "El grado escolar en que estás"
        respuesta_index: 2
        feedback_correcto: |-
          Sí. La contraseña es dato privado: solo tú la sabes. Si la das, alguien puede entrar a tu correo y hacerse pasar por ti.
        feedback_incorrecto: |-
          La contraseña es dato privado. Nombre, ciudad y grado son públicos. Los datos privados no se comparten con nadie.
      - enunciado: "Una app de linterna pide acceso a tu ubicación, micrófono y contactos. ¿Qué piensas?"
        opciones:
          - "Le doy todo, debe necesitarlo."
          - "Le niego los permisos porque una linterna no necesita eso. Si insiste, mejor busco otra app."
          - "Le doy solo la ubicación, los otros no."
          - "Le doy todo pero solo por un día."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Regla del mínimo necesario: si la app pide más de lo que su función necesita, sospecha y di que no.
        feedback_incorrecto: |-
          Una linterna NO necesita ubicación, micrófono ni contactos. Niégalo. Si la app insiste, busca otra que respete el mínimo.
      - enunciado: "Tu compañero te pide tu cédula para 'apuntarte a un sorteo'. ¿Qué haces?"
        opciones:
          - "Se la doy, es mi compañero."
          - "No se la doy. La cédula es dato privado, ni a un amigo."
          - "Se la doy a medias, solo los primeros números."
          - "Se la digo en voz baja para que nadie más oiga."
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La cédula es dato privado. Ni a un amigo se la das. Los sorteos legales no piden cédula a menores.
        feedback_incorrecto: |-
          La cédula es dato privado, no se comparte con nadie aparte de papás. Los sorteos legales no piden cédula a niños.
      - enunciado: "Acabas de instalar Instagram. ¿Cómo deberían estar los ajustes por defecto?"
        opciones:
          - "Abiertos para todos, así me encuentran rápido."
          - "Cerrados (cuenta privada), y los abro solo si decido."
          - "Solo con foto de perfil bloqueada."
          - "Da igual, los ajustes no cambian nada."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La regla es 'por defecto privado': empiezas cerrado y abres con criterio. Es más fácil abrir después que cerrar después.
        feedback_incorrecto: |-
          La regla es 'por defecto privado'. Empieza con la cuenta cerrada, y abres a más gente solo si tú decides.
      - enunciado: "Una empresa te llamó porque 'compró tu número'. ¿Qué puedes hacer?"
        opciones:
          - "Aceptar la llamada, ya tienen mi número."
          - "Pedirles que borren mis datos. La Ley 1581 de Colombia me respalda."
          - "Cambiarme de número urgente."
          - "Bloquearlos sin decir nada."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. En Colombia la Ley 1581 te respalda. Tienes derecho a pedir que borren tus datos. No es opcional para la empresa.
        feedback_incorrecto: |-
          La Ley 1581 de 2012 te da derecho a pedirle a cualquier empresa que borre tus datos. Es tu derecho legal.

clave: "1-8"
grado: 6
periodo: 1
sesion: 8
completo: true

titulo: "Riesgos digitales --- reconocer la trampa antes de caer"
titulo_portada: |-
  Riesgos
  digitales ---
  reconocer
  la trampa
  antes de caer

producto_final: |-
  Una \textbf{tabla de los 4 riesgos más comunes} para chicos de tu edad, con \textbf{una señal de alerta y una acción concreta} para cada uno. Más \textbf{tu plan personal de protección} en el cuaderno: \textbf{3 adultos de confianza} con su nombre y la forma de contactarlos, \textbf{3 acciones} que harás si algo te asusta, y \textbf{una frase de cierre} firmada: \emph{``No estoy solo. Si algo en internet me asusta, le cuento a un adulto.''}.

apertura:
  saber_ancestral: |-
    \textbf{Tu abuela decía: ``en la calle, mejor caminas con alguien''.} Cuando tu mamá era niña, antes de salir del barrio le decían cosas que parecen del campo pero protegen: \emph{``no le abras a desconocidos''}, \emph{``si alguien te ofrece dulce, no aceptes''}, \emph{``si te pierdes, busca un policía o una señora''}, \emph{``avísale a alguien antes de irte''}. No eran reglas para asustarla; eran \textbf{señales para reconocer una trampa antes de caer}. Las personas que han vivido más, conocen las trampas y nos las enseñan. En internet pasa igual. \textbf{Hay trampas digitales} --- la mayoría se pueden ver venir si sabes las señales. La diferencia con la calle es que en internet la trampa puede llegar sin que tú salgas de tu cuarto. Por eso esta clase es de las más importantes del periodo.

  saber_contemporaneo: |-
    Los \textbf{riesgos digitales} son situaciones de internet que pueden hacerte daño. \textbf{No son raras:} le pasan a chicos de tu edad cada semana en Cartago y en toda Colombia. Hay 4 que vas a aprender a reconocer hoy: \textbf{ciberacoso} (cuando otros chicos se ensañan contigo en línea), \textbf{grooming} (cuando un adulto se hace pasar por amigo para hacerte daño), \textbf{retos peligrosos} (challenges que pueden lastimarte), y \textbf{estafas} (engaños para robarte dinero o datos). \textbf{Lo importante no es asustarte}, es que sepas: (1) las 5 señales que se repiten en todos los riesgos, (2) qué hacer cuando aparecen, y (3) que \textbf{nunca tienes que enfrentarlo solo}. Siempre hay un adulto de confianza que sabe ayudarte.

  pregunta_puente: |-
    Si un compañero que no conoces te empezara a escribir todos los días por TikTok preguntándote cosas personales, ¿\textbf{cómo sabrías} si quiere ser tu amigo o si está intentando algo malo? ¿Hay señales que se pueden ver?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 4 riesgos digitales más comunes; (2) sabrás \textbf{explicar} las 5 señales universales de alerta; (3) habrás \textbf{aplicado} las señales a 4 escenas reales; (4) habrás \textbf{creado} tu plan personal de protección con 3 adultos de confianza.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas los 4 riesgos, aprendes las 5 señales, las aplicas a escenas reales, y firmas tu plan.
  a_escuta: |-
    Empezamos leyendo 4 escenas que pueden suceder en cualquier celular.
  a_sistematizacion: |-
    Después de las escenas, aprendes las 5 señales que se repiten en cualquier trampa.
  a_praxis: |-
    Con las señales claras, escribes tu plan de protección personal.
  a_producto: |-
    El producto son las 4 escenas analizadas + el plan personal con 3 adultos.
  a_evaluacion: |-
    Antes de salir, te aseguras de tener los teléfonos y formas de contactar a los 3 adultos.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué pedir ayuda es de valiente, no de débil.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 4 escenas reales de chicos de tu edad} (12 min · individual). Lee con calma las 4 escenas. Para cada una, en el cuaderno escribe: (a) \textbf{qué riesgo es} (ciberacoso, grooming, reto, estafa), y (b) \textbf{qué haría yo}. \textbf{Escena A:} Sara, 12 años, recibe en TikTok mensajes de un grupo de su salón burlándose de cómo se peinó. Le mandan memes feos cada día. \textbf{Escena B:} Daniel, 11 años, jugando Roblox, se hace amigo de \emph{``Lucas''}, otro jugador. Lucas dice tener 13 años y le pide foto en uniforme del colegio para \emph{``conocerlo mejor''}. \textbf{Escena C:} En un grupo de WhatsApp, le pasan a Lucía un video de un reto: aguantar la respiración hasta desmayarse. Le dicen que si no lo hace, es \emph{``floja''}. \textbf{Escena D:} A Carlos le llega un correo que dice ser de \emph{``Roblox oficial''}: \emph{``Felicitaciones, ganaste 10 mil Robux. Ingresa tu contraseña aquí para reclamar.''}.

  checks:
  - Leí las 4 escenas con calma.
  - Identifiqué qué tipo de riesgo era cada una.
  - Escribí qué haría yo, sin esperar consejo del compañero.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 4 escenas y sus riesgos». \textbf{Formato:} 4 bloques (uno por escena), cada uno con 2 líneas: tipo de riesgo + qué harías. \textbf{Extensión:} 8 líneas en total. \textbf{Sabes que terminaste cuando} podrías compararle tu análisis a un compañero y defenderlo con razones.

sistematizacion:
  intro: |-
    Las 4 escenas que leíste son distintas, pero \textbf{comparten 5 señales} que se repiten en casi cualquier riesgo digital. Si aprendes a reconocer las 5, vas a detectar trampas que ni tú sabías que existían.

  pilares:
  - |-
    \textbf{Señal 1 --- Te pide secreto.} \emph{``No le digas a nadie''}, \emph{``Esto queda entre nosotros''}, \emph{``Tus papás no entenderían''}. Toda persona que te pide secreto sobre lo que pasa en internet está intentando algo. La gente honesta no necesita secretos. \textbf{Señal 2 --- Te pide algo que cruza un límite.} Foto de tu cuerpo, tu contraseña, encontrarse en persona, mucho dinero, datos privados. Cualquier persona que pida cosas que sientes raras, está cruzando un límite.
  - |-
    \textbf{Señal 3 --- Mueve tus emociones a propósito.} Te halaga mucho (\emph{``eres especial''}), te asusta (\emph{``si no lo haces te pasa X''}), te culpa (\emph{``por tu culpa estoy triste''}), te aísla (\emph{``tus amigos no te entienden''}). Manejarte por las emociones es la trampa. \textbf{Señal 4 --- Es muy rápido.} Una persona normal se conoce despacio. Si en una semana ya te dice \emph{``somos almas gemelas''} o te insiste mucho en cosas serias, eso es señal. La gente honesta da tiempo.
  - |-
    \textbf{Señal 5 --- Te aleja de los adultos de confianza.} \emph{``Si le cuentas a tu mamá, me boqueas''}, \emph{``Los profes son aburridos''}, \emph{``No le digas, te vas a meter en problemas''}. Quien quiere protegerte NUNCA pide que te alejes de tu familia. \textbf{Las 3 acciones de oro cuando aparece una señal.} (a) \textbf{Bloquea} a la persona o sal de la situación. (b) \textbf{Guarda evidencia}: captura de pantalla, mensajes guardados. (c) \textbf{Cuéntale a un adulto} de tu lista de confianza.
  - |-
    \textbf{4 errores que cometen los chicos de tu edad cuando aparece una trampa.} (1) Pensar \emph{``Yo no soy tonto, yo no caigo''} --- las trampas están diseñadas para gente lista. (2) Esperar a que se solucione solo --- nunca pasa. (3) Culparse \emph{``yo tuve la culpa''} --- nunca. La culpa es de quien hace daño. (4) No contar por miedo a quitar el celular --- ningún adulto serio te quita el celular por contar; te quita el celular si NO cuentas.

  anatomia:
    titulo: Las 5 señales de alerta universales
    body: |-
      \textbf{1.} Te pide secreto. \\[1mm]
      \textbf{2.} Te pide algo que cruza un límite. \\[1mm]
      \textbf{3.} Mueve tus emociones a propósito. \\[1mm]
      \textbf{4.} Va muy rápido. \\[1mm]
      \textbf{5.} Te aleja de los adultos de confianza. \\[1mm]
      \textbf{Acciones de oro:} bloquea + guarda evidencia + cuéntale a un adulto.

  errores_comunes: |-
    \textbf{Mitos sobre los riesgos digitales que escucharás.} (1) \emph{``Eso solo le pasa a las niñas''} --- Falso. A los niños les pasa igual o más. (2) \emph{``Solo le pasa a chicos que ya tienen problemas''} --- Falso. Cualquier chico bueno puede ser víctima. (3) \emph{``Si cuento, me van a quitar el celular''} --- Falso. Los adultos sensatos te dan más confianza si cuentas, no menos. (4) \emph{``Los retos son juegos''} --- Falso. Hay retos que han llevado a la cuenta el hospital y peor. (5) \emph{``Yo lo manejo solo''} --- No. Estos asuntos los manejan adultos con experiencia. Tú das la voz; ellos hacen el resto.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Qué tan peligrosa es cada escena y qué haría». \textbf{Formato:} 2 partes. Parte A: las 5 señales numeradas con \emph{tu propia explicación de qué significa cada una} (1 línea por señal). Parte B: las 3 acciones de oro escritas con tus palabras. \textbf{Veredicto final (3 líneas):} de las 4 escenas leídas (Sara, Daniel, Lucía, Carlos), ¿cuál es la \textbf{más peligrosa} y por qué? Justifica con 2 razones usando las 5 señales aprendidas. \textbf{Extensión:} 8 líneas + veredicto. \textbf{Sabes que terminaste cuando} tu veredicto distingue gravedad real de incomodidad pasajera.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu plan personal de protección} (25 min · individual). Vas a hacer en una hoja del cuaderno tu \textbf{plan personal}: los \textbf{3 adultos de confianza} a los que les contarías si algo pasa, sus datos para contactarlos, y \textbf{3 acciones específicas} que harías si una señal de alerta aparece. Este plan se queda en tu cuaderno, es solo tuyo, y te lo aprendes para que cuando lo necesites no tengas que pensar.

  pilares:
  - |-
    \textbf{Paso 1 --- Mis 3 adultos de confianza.} En la parte superior de la hoja escribe el título: \textbf{``Mis 3 adultos de confianza''}. Después haz una tabla de 3 filas y 3 columnas. Columna 1: nombre. Columna 2: relación contigo (mamá, papá, profe, abuela, tía, coordinadora). Columna 3: cómo lo contacto (celular, donde lo veo cada día, su correo). \textbf{Llena las 3 filas} con personas reales.
  - |-
    \textbf{Paso 2 --- Reglas para escoger.} Los 3 adultos deben cumplir esto: (a) que tú \emph{de verdad} confíes en él o ella (no solo que sea adulto), (b) que sepa escucharte sin gritarte de entrada, (c) que tenga forma rápida de localizarse. Si alguno no cumple, cámbialo por otro.
  - |-
    \textbf{Paso 3 --- Mis 3 acciones cuando aparece una señal.} Debajo de la tabla escribe el subtítulo: \textbf{``Mis 3 acciones''}. Lista numerada con: (1) \emph{``Lo primero: respiro, no respondo, no envío fotos''}; (2) \emph{``Capturo pantalla y guardo el chat sin borrar''}; (3) \emph{``Le cuento a uno de mis 3 adultos hoy mismo, hoy mismo''}. Puedes escribirlas en tus palabras pero las 3 ideas tienen que estar.
  - |-
    \textbf{Paso 4 --- Mis líneas de ayuda.} Después de tus 3 acciones, escribe \textbf{3 líneas oficiales gratuitas} que existen en Colombia para denunciar: \emph{``Te Protejo Colombia: teprotejo.org''}, \emph{``Policía CAI Virtual: 123''}, \emph{``ICBF: 141 (Bienestar Familiar)''}. Las anotas aunque nunca las uses --- saber que existen ya protege.
  - |-
    \textbf{Paso 5 --- Frase de cierre.} En el centro inferior de la hoja, escribe en grande la frase: \emph{``No estoy solo. Si algo en internet me asusta, le cuento a un adulto.''}. Subráyala. Esta frase es como tu mantra cuando pase algo difícil.
  - |-
    \textbf{Paso 6 --- Firma.} En la esquina inferior derecha, firma con tu nombre completo y la fecha de hoy. Este plan se queda en el cuaderno. La idea es que NO lo tengas que volver a leer hasta que lo necesites --- pero cuando lo necesites, esté ahí.

  checklist:
    titulo: Antes de cerrar tu plan
    items: |-
      \checkbox La tabla tiene 3 adultos con sus 3 datos cada uno. \\[1mm]
      \checkbox Los 3 adultos cumplen las reglas (confianza, escucha, contacto rápido). \\[1mm]
      \checkbox Están las 3 acciones de oro escritas. \\[1mm]
      \checkbox Están las 3 líneas de ayuda anotadas (Te Protejo, CAI, ICBF). \\[1mm]
      \checkbox La frase de cierre está subrayada. \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura del plan.} \textit{Arriba:} Título. \textit{Centro arriba:} Tabla de 3 adultos. \textit{Centro:} Mis 3 acciones. \textit{Centro abajo:} 3 líneas oficiales. \textit{Centro inferior:} frase subrayada. \textit{Esquina:} firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi plan personal de protección». \textbf{Formato:} hoja completa del cuaderno con tabla de adultos, lista de acciones, líneas oficiales y frase firmada. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} sabrías exactamente qué hacer y a quién acudir si en este momento te pasara algo en una app.

  producto_titulo: Plan personal de protección · 3 adultos · 3 acciones · firmado
  criterios:
  - Los 3 adultos son personas reales con datos correctos de contacto.
  - Las 3 acciones están claras y son ejecutables.
  - Están las 3 líneas oficiales de ayuda con su forma de contacto.
  - La frase de cierre está visible y subrayada.
  - Está firmado y fechado.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del cuidado mutuo)"
    cita: |-
      ``No nacimos para enfrentar todo solos. Ser persona es saber pedir ayuda y darla.''
    aplicacion: |-
      Hay una mentira común: que pedir ayuda es de cobardes y aguantarse solo es de valientes. \textbf{Es al revés.} Los adultos que más respetas en tu vida --- tu papá, tu abuela, tu profe --- pidieron ayuda cuando fue necesario. Si no lo hubieran hecho, no estarían bien hoy. \textbf{Pedir ayuda es lo más valiente que puedes hacer cuando algo te asusta.} Especialmente en internet, donde a veces lo que parece pequeño esconde algo grande.
    pregunta_espejo: |-
      ¿Estoy creyendo el mito de que ``si pido ayuda parezco débil''? ¿O ya entendí que pedir ayuda es lo más valiente?

  estoico:
    autor: "Séneca"
    cita: |-
      ``Lo que te asusta de noche, en silencio, pierde fuerza cuando se lo cuentas a otra persona.''
    aplicacion: |-
      Cuando algo te asusta en el celular y te lo guardas, \textbf{crece}. Cuando se lo cuentas a un adulto, \textbf{se reduce} a su tamaño real. Casi siempre lo que parecía gigante se vuelve manejable. La diferencia entre crecer y reducirse depende de un solo paso: contarlo.
    pregunta_espejo: |-
      ¿Estoy cargando algo solo en silencio? Si lo cuento, ¿quién está listo para escucharme?

  floridi:
    autor: "Luciano Floridi (filósofo italiano que estudia internet y vulnerabilidad)"
    cita: |-
      ``Tu mejor protección en internet no es saber más tecnología que el adversario. Es tener una red humana detrás de ti.''
    aplicacion: |-
      Algunos chicos creen que la mejor protección es \emph{``saber más que los malos''} de tecnología. Es bueno, pero no es suficiente. \textbf{Tu mejor protección es tu red humana}: mamá, papá, profe, hermana, abuela. La gente que te conoce a ti. Los hackers más expertos del mundo siguen teniendo redes humanas detrás. Tú también deberías.
    pregunta_espejo: |-
      ¿Estoy construyendo mi red humana, o creo que puedo manejar todo solo con mi celular?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana habla con UNO de tus 3 adultos de confianza. Dile: \emph{``profe (mamá/abuela/tía), te quería avisar que si alguna vez en internet me pasa algo raro, te voy a contar a ti.''}. No tiene que pasar nada, solo dejar claro que existe el camino. La próxima clase aprenderás sobre \textbf{comunicación responsable}: cómo escribir y hablar en línea de manera que sumes en lugar de hacer daño. Hoy aprendiste a recibir; la próxima clase aprendes a emitir bien.

web:
  conceptos_clave:
    - termino: Ciberacoso
      definicion: |-
        Cuando un grupo o una persona se ensaña contigo en internet: te molestan, te humillan, se ríen de ti, te excluyen. Pasa en chats, comentarios, redes sociales o juegos. Puede ser de compañeros conocidos o de desconocidos.
      ejemplo: |-
        Un grupo de tu salón te manda memes burlones cada día por WhatsApp. O te etiquetan en publicaciones para que todos se rían.
      emoji: "🚫"
    - termino: Grooming
      definicion: |-
        Cuando un adulto se hace pasar por amigo o por chico de tu edad para ganarse tu confianza y después pedirte cosas que no debería: fotos, encuentros, dinero, secretos.
      ejemplo: |-
        En Roblox un jugador dice tener 13 años, te trata muy bien por varios días, y de a poco te pide foto en uniforme o tu dirección.
      emoji: "🐺"
    - termino: Reto peligroso
      definicion: |-
        Un challenge o reto que circula en redes y que puede lastimarte. Aguantar la respiración, tomar cosas raras, hacer trucos peligrosos. La presión es que si no lo haces, los demás se burlan.
      ejemplo: |-
        Te llega un video pidiéndote aguantar la respiración hasta desmayarte. Si no lo haces, te dicen 'eres flojo'. Eso es presión, no juego.
      emoji: "⚠️"
    - termino: Estafa digital (phishing)
      definicion: |-
        Un mensaje o correo que se hace pasar por una empresa conocida (Roblox, banco, Gmail) para que tú entregues tu contraseña o tu dinero pensando que es real. El truco es engañarte.
      ejemplo: |-
        Llega un correo "Felicitaciones ganaste 10 mil Robux. Escribe tu contraseña aquí." Roblox real NUNCA pide contraseña por correo.
      emoji: "🎣"
    - termino: Línea oficial de ayuda
      definicion: |-
        Servicios gratuitos del gobierno colombiano donde puedes denunciar de forma anónima si algo malo te pasa en internet. Son la red de protección institucional.
      ejemplo: |-
        Te Protejo (teprotejo.org), Policía Virtual (CAI 123), ICBF (141). Funcionan 24 horas, son gratis y son anónimas si lo pides.
      emoji: "📞"

  quiz:
    titulo: "¿Sabes reconocer una trampa digital?"
    instrucciones: "5 preguntas para verificar que sabes detectar señales de riesgo y qué hacer."
    preguntas:
      - enunciado: "Un amigo nuevo de un juego te dice: 'No le cuentes a tus papás que hablamos, ellos no entienden estas cosas'. ¿Qué señal es?"
        opciones:
          - "Es señal de grooming: te pide secreto y te aleja de tus adultos."
          - "Ninguna, solo está siendo amable."
          - "Es señal de buen amigo: respeta tu privacidad."
          - "Es señal de que es un niño igual a ti."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Pedir secreto + alejarte de adultos son 2 señales clarísimas. Una persona honesta jamás te pide guardar secretos de tus papás.
        feedback_incorrecto: |-
          Es alerta grande. Pedir secreto + alejarte de tu familia es la señal más clara de grooming. Cuéntale a un adulto YA.
      - enunciado: "Un grupo de tu salón te manda memes burlándose de tu pelo cada día. ¿Es eso ciberacoso?"
        opciones:
          - "No, es solo broma entre amigos."
          - "Solo sería ciberacoso si te golpean en persona."
          - "Sí, es ciberacoso. Aunque parezca broma, lo repetitivo y burlón hace daño."
          - "Es tu culpa por peinarte así."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. El ciberacoso se reconoce por ser repetido y por hacerte sentir mal. La broma sana no se repite todos los días.
        feedback_incorrecto: |-
          Es ciberacoso. Algo repetido que te hace sentir mal NO es broma. Cuenta a un adulto, guarda capturas, bloquea al grupo.
      - enunciado: "Te llega un correo: 'Felicitaciones, ganaste 10 mil Robux. Escribe tu contraseña aquí para reclamar.' ¿Qué haces?"
        opciones:
          - "Escribo mi contraseña rapidito, no quiero perder el premio."
          - "Borro el correo. Roblox nunca pide tu contraseña por correo."
          - "Le pregunto al remitente por WhatsApp si es verdad."
          - "Le mando el correo a mis amigos para que también ganen."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Las empresas serias NUNCA piden tu contraseña por correo. Eso es phishing, una estafa digital. Borrar es la salida.
        feedback_incorrecto: |-
          Eso es phishing. Ninguna empresa pide tu contraseña por correo. Borrar el mensaje es lo correcto. No respondas, no escribas.
      - enunciado: "Llegó un reto viral: 'aguanta la respiración hasta desmayarte'. Tus amigos te dicen flojo si no lo haces. ¿Qué decides?"
        opciones:
          - "Lo hago, no quiero quedar como flojo."
          - "Lo hago a medias para que se calmen."
          - "Le respondo con otro reto peor."
          - "No lo hago. Mi salud es más importante que su opinión. Y le aviso a un adulto."
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Los retos peligrosos no se hacen aunque te digan cualquier cosa. Tu salud vale más que cualquier opinión. Avisa.
        feedback_incorrecto: |-
          Tu salud es lo primero. Los retos peligrosos no se hacen, aunque te digan flojo. Avisa al profe o a un adulto.
      - enunciado: "Pasó algo en internet que te asustó. ¿Cuáles son las 3 acciones de oro?"
        opciones:
          - "Respondo, peleo, y borro la conversación."
          - "Lo guardo para mí, mañana se olvida."
          - "Respiro/no respondo, capturo evidencia, cuento a un adulto de confianza."
          - "Bloqueo al usuario y nunca lo cuento."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Las 3 acciones de oro: respirar y no responder, capturar evidencia, contarle a un adulto. En ese orden y los 3 juntos.
        feedback_incorrecto: |-
          Las 3 acciones: NO responder, capturar evidencia, contar a un adulto de confianza. Las 3 son necesarias, no una sola.

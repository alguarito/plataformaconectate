grado: 6
periodo: 1
sesion: 9
completo: true

titulo: "Comunicación responsable --- los 3 filtros antes de publicar"
titulo_portada: |-
  Comunicación
  responsable ---
  los 3 filtros
  antes de
  publicar

producto_final: |-
  Un \textbf{decálogo personal del comunicador responsable} en una hoja del cuaderno con \textbf{tus 3 filtros} (¿es verdad? ¿es necesario? ¿es amable?), \textbf{2 técnicas para no estar de acuerdo con respeto}, y \textbf{1 estrategia para defender a alguien que están atacando}. Más \textbf{3 mensajes reales} que tú reescribes en el cuaderno aplicando los filtros (un comentario, un chat, una historia). Firma de cierre: \emph{``Antes de pulsar enviar, paso por mis 3 filtros.''}.

apertura:
  saber_ancestral: |-
    \textbf{En la cocina de la abuela había un colador.} Si alguna vez viste a tu abuela hacer agua de panela o jugo, sabe que el colador era pieza clave. Por ahí pasaba el agua después de hervir la panela, y el colador atrapaba las piedritas, el polvo y los pedazos. \textbf{Lo que pasa el colador llega a la mesa; lo que no pasa, se bota.} La abuela no botaba todo: solo lo que no servía. \textbf{En la cabeza de las personas sensatas hay otro colador}: pasa por ahí lo que van a decir, lo que van a publicar, lo que van a reenviar. La idea no es callar: la idea es \textbf{filtrar}. Decir lo que sirve, dejar de lado lo que no. En internet ese colador es más importante que en cualquier otra parte, porque lo que sale ya no vuelve.

  saber_contemporaneo: |-
    Hasta ahora aprendiste mucho sobre \emph{recibir}: identidad, huella, riesgos, privacidad. Hoy le toca al \emph{emitir}: \textbf{lo que TÚ publicas, escribes, reenvías y comentas}. Comunicar responsablemente no significa callar; significa \textbf{pasar por 3 filtros} antes de publicar: \emph{(1) ¿Es verdad? (2) ¿Es necesario? (3) ¿Es amable?}. Si pasa los 3, está listo. Si falla en uno, lo piensas mejor. También vas a aprender 2 técnicas para \textbf{discrepar sin pelear} (puedes no estar de acuerdo y seguir siendo amigo) y 1 estrategia para \textbf{defender} a alguien que están atacando (ser \emph{upstander}, no \emph{bystander}). Estos saberes son tan útiles en internet como en la mesa con tu familia.

  pregunta_puente: |-
    Si todo lo que has escrito en chats este mes fuera leído en voz alta el lunes en la izada de bandera del colegio, ¿\textbf{cómo te sentirías}? ¿Habría cosas que cambiarías? ¿Cuáles?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{aplicar} los 3 filtros a cualquier mensaje antes de enviarlo; (2) sabrás \textbf{explicar} 2 técnicas para no estar de acuerdo con respeto; (3) podrás \textbf{analizar} cuándo es momento de defender a alguien en línea; (4) habrás \textbf{creado} tu decálogo personal y 3 mensajes reescritos.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: aplicas los 3 filtros a mensajes reales, aprendes a discrepar sin pelear, decides cuándo defender a alguien, y firmas tu decálogo.
  a_escuta: |-
    Empezamos analizando 5 mensajes que parecen normales pero rompen los filtros.
  a_sistematizacion: |-
    Después de los mensajes, aprendes las 3 técnicas: filtrar, discrepar con respeto, ser \emph{upstander}.
  a_praxis: |-
    Con las técnicas en mente, escribes tu decálogo y reescribes 3 mensajes propios.
  a_producto: |-
    El producto es el decálogo + los 3 mensajes reescritos.
  a_evaluacion: |-
    Antes de salir, miras tus 3 mensajes nuevos: ¿pasan los 3 filtros sin trampa?
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué hablar bien es un acto de valentía.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 5 mensajes que parecen normales} (12 min · individual). Lee los 5 mensajes y para cada uno, en el cuaderno, escribe: \textbf{(a) ¿Pasaría el filtro de ``es verdad''?} \textbf{(b) ¿Pasaría el de ``es necesario''?} \textbf{(c) ¿Pasaría el de ``es amable''?}. Después decide \emph{sí, lo envío} o \emph{no, lo reescribo}. \textbf{M1:} \emph{``Vi que Pedro lloró en clase, mándeselo al grupo''}. \textbf{M2:} \emph{``Profe, su clase de hoy estuvo aburridísima.''} (en el chat del salón). \textbf{M3:} \emph{``Reenvío: en Cartago hay un virus que mata por mensajes, no abran links''}. \textbf{M4:} \emph{``Lara, no entendí el ejercicio 3, ¿me lo explicas?''}. \textbf{M5:} \emph{``El uniforme de Sara hoy estaba feo''} (en una historia pública).

  checks:
  - Leí los 5 mensajes con calma.
  - Apliqué los 3 filtros a cada uno.
  - Decidí cuáles enviaría y cuáles reescribiría, con razones.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 5 mensajes por el colador». \textbf{Formato:} tabla de 5 filas con 4 columnas (mensaje, ¿verdad?, ¿necesario?, ¿amable?). \textbf{Extensión:} 5 filas. \textbf{Sabes que terminaste cuando} tienes claro qué falla en cada mensaje que no pasaría.

sistematizacion:
  intro: |-
    Los 3 filtros son la base. Pero también necesitas \textbf{2 técnicas más} para los momentos difíciles: cuando no estás de acuerdo con alguien, y cuando ves que están atacando a otro. Hoy aprendes las 3 herramientas.

  pilares:
  - |-
    \textbf{Técnica 1 --- Los 3 filtros antes de publicar.} \emph{Filtro 1: ¿Es verdad?} Verifico que lo que digo o reenvío sea cierto. Si no estoy seguro, no lo mando. Las cadenas falsas, las noticias raras, los rumores --- no pasan. \emph{Filtro 2: ¿Es necesario?} ¿Aporta algo? ¿Suma? Si solo es ruido o chisme, no pasa. \emph{Filtro 3: ¿Es amable?} ¿Lo diría en persona, frente a la persona? ¿Lo diría delante de mi mamá? Si no, no pasa.
  - |-
    \textbf{Técnica 2 --- Discrepar sin pelear.} Puedes pensar diferente sin convertir todo en pelea. \emph{Paso A:} antes de responder con rabia, espera 5 minutos. \emph{Paso B:} usa la fórmula \textbf{``Yo siento... cuando... porque...''} en vez de \textbf{``Tú eres... siempre...''}. Ejemplo: en vez de \emph{``Eres un mentiroso''}, di \emph{``Yo siento que no me crees cuando dices eso, porque vi otra cosa''}. \emph{Paso C:} acepta que el otro puede no cambiar de opinión --- y aun así pueden seguir hablando.
  - |-
    \textbf{Técnica 3 --- Ser \emph{upstander} (no \emph{bystander}).} Cuando ves que están atacando a alguien en internet, hay 3 opciones: (a) callar y mirar (\emph{bystander} = espectador), (b) unirse al ataque, (c) defender al atacado (\emph{upstander} = el que se para). \textbf{Defender no es pelear:} es escribirle \emph{en privado} a la víctima (\emph{``vi lo que pasa, ¿estás bien?''}), avisar a un adulto si es grave, o decir en el grupo algo neutral como \emph{``Eso no me parece justo''}. Cada vez que tú defiendes, los otros también se animan a hacerlo.
  - |-
    \textbf{4 errores en comunicación digital que destruyen amistades.} (1) \textbf{Escribir con rabia caliente} --- siempre se sale peor. La regla es: si tienes rabia, espera. (2) \textbf{Sacar conversaciones de contexto} --- mandar capturas a otros mostrando solo una parte. La parte completa cambia todo. (3) \textbf{Reenviar lo que te contaron en privado} --- rompe la confianza más rápido que nada. (4) \textbf{Sumarte a un ataque por miedo} --- pasa todo el tiempo: alguien empieza a burlarse de un compañero y otros se suman para no quedar mal. Eso te hace cómplice.

  anatomia:
    titulo: Las 3 técnicas del comunicador responsable
    body: |-
      \textbf{1.} Los 3 filtros antes de publicar: ¿verdad? + ¿necesario? + ¿amable? \\[1mm]
      \textbf{2.} Discrepar sin pelear: \emph{``Yo siento... cuando... porque...''} \\[1mm]
      \textbf{3.} Ser upstander, no bystander: cuando atacan a otro, no callas.

  errores_comunes: |-
    \textbf{Frases tóxicas que se repiten en chats y qué decir en cambio.} (1) \emph{``Eres un tonto''} → \emph{``No estoy de acuerdo con lo que hiciste''}. (2) \emph{``Nadie te quiere''} → \emph{``Yo me siento incómodo cuando me dices eso''}. (3) \emph{``Es solo broma''} (cuando otro se queja) → \emph{``Entiendo que te molestó, te pido disculpas''}. (4) \emph{``Si fueras mi amigo me apoyarías''} → \emph{``Yo necesito apoyo, ¿puedes escucharme un momento?''}. La diferencia: \textbf{las frases de la derecha no destruyen relaciones, las cuidan}.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Las 3 técnicas y cuándo cada una funciona mejor». \textbf{Formato:} 3 bloques numerados. Cada uno: nombre de la técnica + cuándo se usa + ejemplo personal + \textbf{cuándo NO funciona}. \textbf{Veredicto final (2 líneas):} en una pelea típica de WhatsApp del salón, ¿\emph{cuál de las 3 técnicas} aplicarías primero y por qué? Justifica con 2 razones. \textbf{Extensión:} 3 párrafos + veredicto. \textbf{Sabes que terminaste cuando} podrías recomendarle a un primo más pequeño cuál técnica usar para su problema concreto.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu decálogo personal + 3 mensajes reescritos} (28 min · individual). Vas a hacer en una hoja del cuaderno tu \textbf{decálogo del comunicador responsable} (10 reglas tuyas) y vas a \textbf{reescribir 3 mensajes} reales que tú o un compañero hayan enviado, aplicando los 3 filtros y las 2 técnicas.

  pilares:
  - |-
    \textbf{Paso 1 --- Encabezado y formato.} En la parte superior escribe el título: \textbf{``Mi decálogo del comunicador responsable''} y debajo: \emph{``[Tu nombre], grado 6[tu letra], año 2026''}. Subraya el título. Numera del 1 al 10 en la hoja antes de empezar a escribir el contenido.
  - |-
    \textbf{Paso 2 --- Las 10 reglas.} Escribe 10 reglas \textbf{con tus palabras}. Las 3 primeras son los 3 filtros (verdad, necesario, amable). Las siguientes 7 son tuyas: pueden incluir cosas como \emph{``Espero 5 minutos antes de responder con rabia''}, \emph{``No reenvío cadenas''}, \emph{``Si veo a alguien siendo atacado, escribo en privado a la víctima''}, etc. No copies; piensa cuáles aplican a tu vida.
  - |-
    \textbf{Paso 3 --- Bloque de mensajes reescritos.} Debajo del decálogo, escribe el subtítulo \textbf{``3 mensajes reescritos''}. Vas a tomar 3 mensajes que \textbf{tú o un compañero hayan enviado} en los últimos días (sin nombrarlos), uno por cada tipo: un \emph{comentario en redes}, un \emph{chat de grupo}, una \emph{historia o publicación}.
  - |-
    \textbf{Paso 4 --- Mensaje 1.} Escribe el mensaje original (sin nombres) en \emph{itálicas}. Debajo escribe: \emph{``Falla el filtro de [verdad/necesario/amable] porque [razón]''}. Después escribe \textbf{tu versión nueva} que sí pasa los 3 filtros. Comparas las 2 versiones uno al lado del otro si quieres.
  - |-
    \textbf{Paso 5 --- Mensaje 2 y 3.} Repite el Paso 4 con los otros 2 mensajes. Procura que los 3 sean de \emph{distintos contextos}: chat, comentario público, historia. Eso te entrena para los 3 espacios distintos.
  - |-
    \textbf{Paso 6 --- Firma de cierre.} En la esquina inferior derecha escribe la frase: \textbf{``Antes de pulsar enviar, paso por mis 3 filtros.''}. Subráyala. Firma con nombre completo y fecha. La idea es que veas esa hoja antes de mandar algo que dudes.

  checklist:
    titulo: Antes de cerrar tu decálogo
    items: |-
      \checkbox El decálogo tiene 10 reglas numeradas. \\[1mm]
      \checkbox Las 3 primeras son los 3 filtros (verdad, necesario, amable). \\[1mm]
      \checkbox Las otras 7 son escritas con mis palabras. \\[1mm]
      \checkbox Hay 3 mensajes reescritos (uno por cada contexto). \\[1mm]
      \checkbox Cada mensaje tiene la versión original y la versión nueva. \\[1mm]
      \checkbox La firma de cierre está subrayada con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura del decálogo.} \textit{Título.} \textit{10 reglas numeradas.} \textit{Subtítulo: ``3 mensajes reescritos''.} \textit{3 bloques: mensaje original + filtro que falla + versión nueva.} \textit{Esquina: frase de cierre subrayada + firma.}

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi decálogo del comunicador responsable». \textbf{Formato:} hoja completa con decálogo + 3 mensajes reescritos + firma. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} podrías mostrarle el decálogo a tu mamá y ella diría: \emph{``ese eres tú escribiendo con cabeza''}.

  producto_titulo: Decálogo personal + 3 mensajes reescritos · firmado
  criterios:
  - El decálogo tiene exactamente 10 reglas numeradas.
  - Las 3 primeras son los 3 filtros, las 7 siguientes son personalizadas.
  - Hay 3 mensajes reescritos en 3 contextos distintos.
  - Cada uno muestra la versión original y la versión nueva.
  - Está firmado, fechado y con la frase de cierre visible.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la palabra ética)"
    cita: |-
      ``Decir la verdad sin amabilidad es violencia. Decirla con amabilidad es justicia.''
    aplicacion: |-
      Hay personas que se creen \emph{honestas} solo por decir cualquier cosa cruda: \emph{``yo digo lo que pienso''}. Pero decir la verdad sin cuidado no es honestidad, es violencia. \textbf{La verdad amable existe y es posible}: la usan los buenos profes, los médicos sensatos, los amigos verdaderos. La técnica de los 3 filtros te entrena para eso: poder decir lo que piensas sin destruir al otro.
    pregunta_espejo: |-
      ¿Estoy confundiendo \emph{``decir lo que pienso''} con violencia? ¿Cómo puedo decir lo mismo con cuidado?

  estoico:
    autor: "Marco Aurelio (emperador romano que escribió sobre la palabra)"
    cita: |-
      ``El que habla pensando, manda dos veces. El que habla sin pensar, se arrepiente dos veces.''
    aplicacion: |-
      Pensar antes de hablar es más rápido que arrepentirse después. \textbf{Cada minuto pensando ahorra horas explicando.} El comunicador responsable no es lento: es \emph{eficiente}. Filtra de una, dice lo que sirve, no tiene que pedir disculpas todo el tiempo. Tu yo del futuro te lo agradece.
    pregunta_espejo: |-
      ¿Estoy ahorrándome arrepentimientos al pensar antes, o estoy gastando energía borrando lo que dije sin pensar?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la comunicación digital)"
    cita: |-
      ``Cada mensaje que envías construye o destruye relaciones, sin punto medio. No hay mensajes neutros.''
    aplicacion: |-
      Hay gente que cree que un mensaje es solo un mensaje, que ``no es para tanto''. \textbf{En realidad cada mensaje suma o resta} a una relación. Los chats con tus amigos del salón están hechos de \emph{cientos de mensajes pequeños}, cada uno construyó o desgastó confianza. Si vas mensaje por mensaje cuidando, la amistad crece. Si vas descuidando, se va apagando sin que nadie sepa cuándo.
    pregunta_espejo: |-
      Mis últimos 10 mensajes en mi grupo principal, ¿\textbf{sumaron o restaron} a las relaciones de ese grupo?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, antes de enviar cada mensaje, pasa por los 3 filtros. \emph{¿Verdad? ¿Necesario? ¿Amable?}. La próxima clase es la \textbf{Sesión 10 --- Mi presentación digital}: vas a cosechar todo lo aprendido en una mini exposición de 2 minutos para tus compañeros. Hoy aprendiste a comunicar; la próxima clase muestras todo lo que aprendiste en P1 a tu audiencia.

web:
  conceptos_clave:
    - termino: Los 3 filtros
      definicion: |-
        Las 3 preguntas que pasas mentalmente antes de publicar, escribir o reenviar: ¿es verdad? ¿es necesario? ¿es amable? Si pasa los 3, va. Si falla en uno, lo piensas mejor.
      ejemplo: |-
        Vas a comentar "esa cara está fea". Filtro 3 (amable) falla. Reescribes: "creo que tienes mejores fotos que esa". Eso sí pasa los 3.
      emoji: "🧠"
    - termino: Discrepar con respeto
      definicion: |-
        Decir que no estás de acuerdo sin atacar a la persona. La fórmula es "Yo siento... cuando... porque..." en vez de "Tú eres... siempre...". Cambia todo.
      ejemplo: |-
        En vez de "eres egoísta", dices "yo me siento de lado cuando no me invitas, porque me importa el grupo". El otro escucha sin ponerse a la defensiva.
      emoji: "🤔"
    - termino: Upstander
      definicion: |-
        Persona que ve un ataque (en clase o en línea) y NO calla. No tiene que pelear: puede escribir en privado a la víctima, decir algo neutral en el grupo, o avisarle a un adulto si es grave.
      ejemplo: |-
        En un chat empiezan a burlarse de Sara. Tú le escribes en privado: "vi lo que pasa, ¿estás bien?". Eso es upstander. Pequeño pero importantísimo.
      emoji: "🛡️"
    - termino: Bystander
      definicion: |-
        El que ve un ataque y se queda callado por miedo o por incomodidad. Su silencio le da fuerza al que ataca. Todos hemos sido bystander alguna vez; la idea es entrenarse para ser upstander.
      ejemplo: |-
        Estar en el grupo donde se burlan de un compañero y no escribir nada. Tu silencio es como un permiso. Mejor escribir aunque sea privado.
      emoji: "👁️"
    - termino: Fórmula yo-siento
      definicion: |-
        La estructura de habla que no daña: "Yo siento [emoción] cuando [acción del otro] porque [razón]". Reemplaza al "tú eres" que pone al otro a la defensiva de inmediato.
      ejemplo: |-
        No "eres pesado". Sí "yo siento que me quedo sin espacio cuando hablamos siempre del mismo tema, porque también me gusta otra cosa".
      emoji: "💬"

  quiz:
    titulo: "¿Comunicas con responsabilidad?"
    instrucciones: "5 preguntas para verificar que pasas los 3 filtros antes de publicar."
    preguntas:
      - enunciado: "Quieres comentar 'esa cara está fea' en una foto de Instagram. ¿Qué filtro falla?"
        opciones:
          - "Falla el de '¿es verdad?'."
          - "Falla el de '¿es amable?'."
          - "Falla el de '¿es necesario?'."
          - "No falla ninguno, está bien."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Aunque tú lo creas, no es amable. Lo amable construye, no destruye. Reescribe o no lo publiques.
        feedback_incorrecto: |-
          Falla el filtro de amable. Aunque sea tu opinión, escribir 'fea' destruye. Reescribe o calla.
      - enunciado: "Llega una cadena: 'En Cartago hay un virus que mata por mensajes, no abran links'. ¿Qué filtro falla?"
        opciones:
          - "Falla '¿es amable?': asusta a la gente."
          - "Falla '¿es verdad?': no se ha verificado y suena inventado."
          - "Falla '¿es necesario?': nadie lo pidió."
          - "Fallan los 3."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Cadenas así fallan los 3: no es verdad, no es necesario, asusta. La regla es: si dudas, no lo mandas.
        feedback_incorrecto: |-
          Fallan los 3 filtros. Las cadenas alarmistas siempre fallan. Borrar es la mejor respuesta.
      - enunciado: "Tu compañero te dice algo que te molesta. ¿Cómo le respondes con la fórmula yo-siento?"
        opciones:
          - "Eres un grosero, siempre haces lo mismo."
          - "Yo me siento mal cuando me dices eso, porque no es justo conmigo."
          - "Cállate, no me hables más."
          - "Voy a contarles a todos lo que dijiste."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. La fórmula 'yo siento... cuando... porque...' no pone al otro a la defensiva. Cuida la relación.
        feedback_incorrecto: |-
          La fórmula es 'yo siento... cuando... porque...'. Eso explica sin atacar y deja espacio para que el otro escuche.
      - enunciado: "En un chat empiezan a burlarse de Sara. ¿Qué hace un upstander?"
        opciones:
          - "Se suma a las burlas para que no se metan con él."
          - "Calla y mira sin escribir nada."
          - "Le escribe en privado a Sara: '¿estás bien? vi lo que pasa.'"
          - "Cierra el chat y se va."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Upstander es el que actúa. Escribir en privado a la víctima la sostiene. No tienes que pelear; solo no callar.
        feedback_incorrecto: |-
          Upstander es el que NO calla. Lo mínimo es escribir en privado a la víctima. Eso ya cambia la situación.
      - enunciado: "Acabas de escribir algo con rabia. ¿Qué deberías hacer antes de pulsar enviar?"
        opciones:
          - "Mandarlo de una para que entienda."
          - "Esperar 5 minutos, releer, y pasar los 3 filtros."
          - "Agregarle más signos de exclamación para que se note."
          - "Mandarlo en mayúsculas para que se entienda mi rabia."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La regla de los 5 minutos + los 3 filtros. La rabia se enfría, y muchas veces ya no quieres mandar lo que escribiste.
        feedback_incorrecto: |-
          Antes de enviar con rabia: esperas 5 minutos. Después relees con cabeza fría. Después pasas los 3 filtros. Casi siempre cambias el mensaje.

clave: "2-1"
grado: 6
periodo: 2
sesion: 1
completo: true

titulo: "Apertura periodo 2 --- las máquinas que nos rodean por dentro"
titulo_portada: |-
  Apertura
  periodo 2 ---
  las máquinas
  que nos
  rodean

producto_final: |-
  Un \textbf{inventario de las máquinas inteligentes} que tú usas o ves cada día: \textbf{tabla en el cuaderno de 10 máquinas} (computador, celular, cajero, microondas, lavadora moderna, etc.), con columnas para \emph{nombre, dónde está, qué hace, qué partes le conozco}. Más \textbf{lista de 5 preguntas} que esperas que el periodo 2 te responda sobre las máquinas (puede ser \emph{``¿cómo funciona por dentro mi celular?''}, \emph{``¿por qué se calientan los computadores?''}). Más \textbf{compromiso firmado} de cuidar la sala de sistemas durante el periodo.

apertura:
  saber_ancestral: |-
    \textbf{Antes de que las máquinas modernas llegaran a Cartago, había maestros de oficio en cada cuadra que entendían sus herramientas por dentro.} El \textbf{relojero} don Lucho, en su vitrina de la calle 14, conocía cada engranaje del reloj. La \textbf{costurera} doña Carmen, sentada en su Singer, entendía por qué a veces se rompía el hilo y cómo arreglarlo. El \textbf{panadero} don Aurelio, frente a su horno de leña, sabía a qué temperatura crecía la masa. \textbf{Cada uno conocía su máquina por dentro}, no solo por fuera. Por eso resolvían problemas, no quedaban esclavos del aparato. Hoy nuestras máquinas se llaman \emph{computador}, \emph{celular}, \emph{cajero electrónico}. Son más complejas que el reloj de don Lucho, pero el principio es el mismo: \textbf{quien las entiende por dentro es libre; quien solo las usa es dependiente}. Este periodo 2 es tu entrada al oficio de \emph{entender las máquinas inteligentes}. No vas a aprender a programar (eso vendrá en otros grados): vas a aprender qué hay adentro, cómo funciona, cómo cuidarlo, cómo elegirlo.

  saber_contemporaneo: |-
    En el \textbf{Periodo 2 (Hardware y software)} vas a recorrer 10 sesiones organizadas así: \textbf{(S1) Hoy: Apertura del periodo.} \textbf{(S2) ¿Qué es un computador? --- las 4 funciones básicas.} \textbf{(S3) El gabinete por dentro --- CPU, RAM, disco.} \textbf{(S4) Periféricos --- entrada, salida, mixtos.} \textbf{(S5) Hardware vs software --- el cuerpo y las instrucciones.} \textbf{(S6) El sistema operativo --- el gerente del computador.} \textbf{(S7) Archivos y carpetas --- organizar mi biblioteca digital.} \textbf{(S8) Mantenimiento básico --- cuidar el equipo.} \textbf{(S9) Postura y vida útil --- cuidarme yo.} \textbf{(S10) Mi computador ideal --- ficha técnica con criterio.} Al final del periodo serás capaz de \emph{abrir un computador, nombrar sus piezas, explicar qué hace cada una, mantenerlo, y elegir uno con presupuesto}. Esa habilidad la usarás toda tu vida adulta.

  pregunta_puente: |-
    Cuando una persona dice \emph{``mi computador está lento, le voy a meter más RAM''}, ¿\textbf{sabes lo que dijo}? ¿Sabes qué es RAM? ¿Por qué meter más ayudaría? Si no, este periodo te lo va a enseñar.

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} la ruta del periodo 2 (los 10 temas); (2) sabrás \textbf{explicar} por qué entender las máquinas por dentro te hace más libre; (3) podrás \textbf{aplicar} 5 reglas de cuidado de la sala de sistemas; (4) habrás \textbf{creado} un inventario de las máquinas que conoces + pregunta-radar.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: recuerdas las máquinas que usas, descubres la ruta del P2, firmas el compromiso de cuidar la sala, y planteas tu pregunta-radar.
  a_escuta: |-
    Empezamos con un inventario de 10 máquinas inteligentes de tu vida.
  a_sistematizacion: |-
    Después aprendes la ruta del periodo 2 y las reglas de la sala de sistemas.
  a_praxis: |-
    Con todo claro, completas tu inventario, eliges tus 5 preguntas, y firmas el compromiso.
  a_producto: |-
    El producto es ese inventario + pregunta-radar + compromiso firmado.
  a_evaluacion: |-
    Antes de salir, verifica que el inventario tiene 10 máquinas reales tuyas y las 5 preguntas son sinceras.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué conocer las máquinas es ciudadanía moderna.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario de las máquinas que conoces} (12 min · individual). En el cuaderno, dibuja una tabla de \textbf{10 filas y 4 columnas}. Encabezados: \emph{Nombre de la máquina}, \emph{¿Dónde está? (casa, cole, calle)}, \emph{¿Qué hace?}, \emph{¿Qué partes le conozco?}. Llena \textbf{10 máquinas inteligentes} que veas o uses normalmente. Sugerencias: \emph{tu celular, computador del colegio, microondas de casa, cajero automático del banco, caja registradora del supermercado, neveras nuevas, lavadora moderna, parlante Bluetooth, smart TV, GPS del carro}. Si tienes otras, las pones tú. En la última columna sé honesto: si no le conoces ninguna parte, escribe \emph{``ninguna''}; si conoces algo, anótalo.

  checks:
  - Hice la tabla con 4 columnas en el cuaderno.
  - Listé 10 máquinas reales que veo o uso.
  - Para cada una, anoté las partes que ya conozco (aunque sean pocas).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Inventario de mis máquinas». \textbf{Formato:} tabla 10x4 con datos reales. \textbf{Extensión:} 10 filas. \textbf{Sabes que terminaste cuando} sabes cuántas máquinas inteligentes te rodean cada día (suelen ser muchas más de las que crees).

sistematizacion:
  intro: |-
    Tu inventario muestra que \textbf{vives rodeado de máquinas inteligentes} (probablemente más de 10). Pero muy pocas de ellas las entiendes por dentro. Eso es lo que este periodo busca cambiar. Conoce la ruta y las reglas.

  pilares:
  - |-
    \textbf{La ruta del periodo 2 --- los 10 temas.} \emph{(S1) Hoy: Apertura.} \emph{(S2) ¿Qué es un computador? Las 4 funciones.} \emph{(S3) El gabinete por dentro.} \emph{(S4) Periféricos.} \emph{(S5) Hardware vs software.} \emph{(S6) Sistema operativo.} \emph{(S7) Archivos y carpetas.} \emph{(S8) Mantenimiento.} \emph{(S9) Postura y vida útil.} \emph{(S10) Mi computador ideal.} \emph{(S11) Cosecha + evaluación.} El periodo conecta hardware (lo físico), software (lo invisible), uso responsable (mantenimiento + ergonomía) y criterio de compra (computador ideal).
  - |-
    \textbf{Por qué entender máquinas te hace libre.} En el siglo XXI, vives rodeado de tecnología. La mayoría de la gente \emph{usa} sin entender: aprieta botones y espera que funcione. Cuando algo falla, dependen de un técnico, de un youtuber, de un vendedor. Cuando alguien quiere venderles algo, no saben si vale la pena. \textbf{Entender las máquinas por dentro te quita esa dependencia}: puedes resolver problemas básicos, decidir con criterio cuando compras, y no caer en estafas. Es como saber leer en una sociedad letrada. Quien no sabe, depende. Quien sabe, decide.
  - |-
    \textbf{Las 5 reglas de la sala de sistemas (no negociables).} (1) \textbf{Manos limpias y secas} antes de tocar teclado o ratón. (2) \textbf{No comer ni beber} cerca del computador. (3) \textbf{Cuidar la postura} (espalda recta, pantalla a nivel de ojos, codos 90°). (4) \textbf{Apagar correctamente} desde el menú, nunca con el botón de fuerza. (5) \textbf{Reportar daños}: si algo no funciona o está suelto, decir al profe inmediatamente. Estas 5 reglas multiplican la vida útil de la sala y respetan el trabajo de quienes vendrán después de ti.
  - |-
    \textbf{Las 4 herramientas del oficio en P2.} (1) \textbf{El cuaderno físico}: para diagramas, planos, tablas, notas. Es el principal. (2) \textbf{El computador real}: para ver, abrir el explorador, mirar la sala. (3) \textbf{Imágenes y diagramas}: muchos temas del P2 se entienden mejor con dibujos (gabinete por dentro, viaje de la información). (4) \textbf{Comparación y analogía}: \emph{relojero = ingeniero de hardware; costurera = programadora}. Las analogías te entrenan a entender lo nuevo desde lo conocido.

  anatomia:
    titulo: Ruta P2 + 5 reglas de la sala
    body: |-
      \textbf{Ruta P2:} S1 (Apertura) → S2 (4 funciones) → S3 (Gabinete) → S4 (Periféricos) → S5 (HW vs SW) → S6 (SO) → S7 (Archivos) → S8 (Mantenimiento) → S9 (Postura) → S10 (Computador ideal). \\[1mm]
      \textbf{5 reglas:} manos limpias · sin comer · postura · apagado correcto · reportar daños.

  errores_comunes: |-
    \textbf{Errores frecuentes al iniciar P2.} (1) \emph{``Hardware es solo para técnicos''} --- Falso. Es ciudadanía: cualquiera que use computador o celular debería entender lo básico. (2) \emph{``No necesito saber las piezas, solo usar''} --- Cierto a corto plazo, pero te hace dependiente a largo plazo. Quien sabe las piezas resuelve problemas en minutos en lugar de horas. (3) \emph{``Si me sé el nombre del computador, ya sé todo''} --- Falso. Hay marcas, modelos, componentes. Diferenciarlos es saber realmente. (4) \emph{``La sala de sistemas no se cuida, ya es del colegio''} --- Falso. Tu yo del próximo año la heredará. Si la dañas hoy, te perjudicas a ti mismo después.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Ruta y reglas del periodo 2». \textbf{Formato:} bloque A con los 10 temas del P2 (lista). Bloque B con las 5 reglas de la sala (lista con palomita si te comprometes). \textbf{Extensión:} 15 líneas. \textbf{Sabes que terminaste cuando} podrías recitar los 10 temas y las 5 reglas sin abrir el cuaderno.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Pregunta-radar + compromiso del periodo} (25 min · individual). Vas a definir las 5 preguntas que te llevas al periodo 2 y firmar el compromiso de cuidar la sala. Es el contrato que firmas como aprendiz del oficio.

  pilares:
  - |-
    \textbf{Paso 1 --- Tu inventario ya está listo.} Repasa la tabla de 10 máquinas que hiciste en Actividad 1. Marca con un círculo las \textbf{3 que más te dan curiosidad} entender por dentro.
  - |-
    \textbf{Paso 2 --- Tus 5 preguntas-radar.} En una hoja nueva del cuaderno escribe el título: \textbf{``Mis 5 preguntas del periodo 2''}. Debajo, lista numerada de 5 preguntas que esperas que el periodo te responda. Pueden venir de tu inventario o de cosas que siempre te preguntaste. Ejemplos: \emph{``¿Cómo funciona el celular por dentro?''}, \emph{``¿Por qué se calientan los computadores?''}, \emph{``¿Para qué sirve la RAM?''}, \emph{``¿Cuál computador me conviene comprar?''}. Las preguntas son TUYAS, no copies.
  - |-
    \textbf{Paso 3 --- Las 5 reglas de la sala con tu firma.} Debajo de las preguntas, escribe el título: \textbf{``Mi compromiso con la sala de sistemas''}. Reproduce las 5 reglas (manos limpias, sin comer, postura, apagado correcto, reportar daños). Al lado de cada una, ponle palomita ✓ si te comprometes. Si dudas, mejor no firmar y hablar con el profe.
  - |-
    \textbf{Paso 4 --- Tu compromiso con el oficio.} Debajo de las reglas, escribe esta frase: \textbf{``Me comprometo a entender las máquinas que uso, no solo a usarlas. A traer mi cuaderno cada clase. A preguntar cuando algo no esté claro.''}. Subráyala.
  - |-
    \textbf{Paso 5 --- Sesión 1 con encabezado fijo.} En el cuaderno principal escribe el encabezado de la sesión 1: \emph{``Guía: 6° · Periodo 2 · Guía 1 --- Apertura. Fecha: \_\_/\_\_/2026''}. Debajo, anota lo trabajado en las 3 actividades (inventario, ruta, compromiso). Guarda la hoja de preguntas-radar y compromiso aparte si quieres, o intégrala como anexo.
  - |-
    \textbf{Paso 6 --- Firma y cierre.} Al final, firma con tu nombre completo y fecha. La próxima clase empezamos con \emph{``¿Qué es un computador? Las 4 funciones básicas''}. Trae el cuaderno, trae la curiosidad, trae las 5 preguntas en la cabeza.

  checklist:
    titulo: Antes de cerrar la S1 del periodo 2
    items: |-
      \checkbox La tabla de inventario tiene 10 máquinas. \\[1mm]
      \checkbox Marqué con círculo las 3 máquinas que más me dan curiosidad. \\[1mm]
      \checkbox Tengo 5 preguntas-radar reales mías. \\[1mm]
      \checkbox Las 5 reglas de la sala están firmadas. \\[1mm]
      \checkbox Está la sesión 1 con encabezado y registro de las 3 actividades. \\[1mm]
      \checkbox Firmé con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Hoja 1:} tabla 10 máquinas inventariadas. \textit{Hoja 2:} 5 preguntas-radar + 5 reglas firmadas + compromiso del oficio subrayado. \textit{Hoja 3:} sesión 1 con encabezado fijo + registro de actividades.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mis preguntas-radar + compromiso del P2». \textbf{Formato:} 2 hojas (inventario + preguntas/compromiso) + sesión 1 registrada. \textbf{Extensión:} 2 hojas + sesión. \textbf{Sabes que terminaste cuando} tu cuaderno está listo para empezar la S2 sin organizar nada más.

  producto_titulo: Inventario + 5 preguntas + compromiso del periodo 2 · firmado
  criterios:
  - El inventario tiene 10 máquinas reales con sus 4 datos cada una.
  - Las 5 preguntas-radar son personales y honestas.
  - Las 5 reglas de la sala tienen firma de compromiso.
  - La sesión 1 tiene encabezado fijo y registro de las 3 actividades.
  - Está firmado y fechado.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del saber popular)"
    cita: |-
      ``El campesino que entiende su tierra es libre. El que solo la trabaja sin entenderla, vive con miedo de perderla.''
    aplicacion: |-
      Lo mismo aplica a las máquinas. \textbf{El que entiende su computador es libre frente a él}: resuelve problemas, escoge piezas, no se deja engañar. \emph{El que solo lo usa sin entender vive con miedo}: miedo a dañarlo, miedo a comprar mal, miedo a que se le pierda algo. \textbf{Este periodo es para que dejes de tener miedo y empieces a tener criterio}. Como el campesino que conoce su parcela.
    pregunta_espejo: |-
      ¿Vivo con miedo de las máquinas que uso, o con criterio? ¿Qué cosa me dejaría de dar miedo si la entendiera mejor?

  estoico:
    autor: "Marco Aurelio (emperador que entendía sus instrumentos)"
    cita: |-
      ``Saber el nombre y la función de cada herramienta que usas es la primera virtud del que actúa bien en el mundo.''
    aplicacion: |-
      \textbf{Marco Aurelio era emperador romano}, pero también conocía a fondo sus herramientas: la pluma, el papiro, la armadura, el caballo. Sabía que \emph{nadie puede actuar bien con herramientas que no entiende}. Tú no eres emperador (todavía), pero usas máquinas que en sus tiempos parecerían magia. Este periodo te entrena en esa virtud antigua: \emph{nombrar y comprender lo que uso}.
    pregunta_espejo: |-
      ¿Cuántas herramientas uso todos los días sin saber su nombre ni su función? ¿Cómo me afecta eso?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la era digital)"
    cita: |-
      ``En el siglo XXI, no entender hardware es como en el siglo XX no saber leer. Te excluye de decisiones importantes en tu propia vida.''
    aplicacion: |-
      Floridi lo dice fuerte porque es real: \textbf{una persona que no entiende mínimamente cómo funciona su computador y su celular va a tomar peores decisiones} (compra equipos equivocados, se deja estafar, no entiende noticias técnicas, no participa en decisiones sobre tecnología). \emph{Este periodo es alfabetización del siglo XXI}. No es opcional. Por eso vale la pena dedicarle atención.
    pregunta_espejo: |-
      ¿Estoy convirtiéndome en ciudadano técnicamente alfabetizado, o me quedo en el grupo de los que aprietan botones sin saber?

compromiso: |-
  \textbf{Para la próxima sesión.} Trae el cuaderno con el inventario + preguntas + compromiso firmado. La próxima clase es la S2: \emph{¿Qué es un computador? Las 4 funciones básicas}. Vas a entender cómo cualquier máquina inteligente sigue el mismo patrón (entrada, proceso, almacenamiento, salida). Después de esa clase, vas a reconocer el patrón en tu celular, en el cajero, en el microondas. Hoy te recibiste como aprendiz del oficio de hardware; la próxima clase empezamos.

web:
  conceptos_clave:
    - termino: Hardware
      definicion: |-
        Todo lo que se puede tocar en el computador y otras máquinas inteligentes: la pantalla, el teclado, los chips por dentro, los cables. Si lo puedes golpear o llevar en la mano, es hardware.
      ejemplo: |-
        El teclado, monitor, ratón, gabinete, parlante: todo eso es hardware. Lo aprendes a fondo durante el periodo 2.
      emoji: "💻"
    - termino: Software
      definicion: |-
        Las instrucciones y archivos que viven dentro del hardware. No se tocan, pero existen guardados en memoria. Sistema operativo, programas, apps, archivos: todo es software.
      ejemplo: |-
        Windows, Word, Chrome, WhatsApp, tus fotos: todos son software. Necesitan hardware para existir y funcionar.
      emoji: "📦"
    - termino: Sala de sistemas
      definicion: |-
        El espacio físico del colegio donde están los computadores. Tiene reglas de cuidado: manos limpias, sin comer, postura correcta, apagado adecuado, reportar daños. Cuidarla es respetar a quienes vendrán después.
      ejemplo: |-
        Cada vez que entras a la sala de sistemas, miras alrededor: ¿hay un cable suelto? ¿algún equipo descuidado? Reportarlo al profe es parte del cuidado colectivo.
      emoji: "🏛️"
    - termino: Inventario de máquinas
      definicion: |-
        Lista de las máquinas inteligentes que usas o ves cada día. Te ayuda a darte cuenta de que vives rodeado de tecnología (computador, celular, cajeros, electrodomésticos modernos, GPS).
      ejemplo: |-
        Mi inventario podría ser: celular, computador del cole, microondas, cajero del banco, smart TV de la casa, GPS del bus, parlante Bluetooth, lavadora, nevera nueva, caja registradora. Suelen ser muchas más de las que uno nota.
      emoji: "📋"
    - termino: Pregunta-radar del periodo
      definicion: |-
        Pregunta personal que tú escoges al inicio del periodo. Espera respuesta durante las 10 sesiones. En P2 puede ser sobre máquinas: cómo funcionan, por qué se calientan, qué computador conviene comprar.
      ejemplo: |-
        Tu pregunta-radar del P2 podría ser '¿qué computador debería comprar?' Las sesiones del periodo (especialmente S10) te darán las herramientas para responderla con criterio.
      emoji: "🧭"

  quiz:
    titulo: "¿Llegaste bien al periodo 2?"
    instrucciones: "5 preguntas para verificar que conoces la ruta y firmaste el compromiso."
    preguntas:
      - enunciado: "¿Por qué entender el hardware del computador te hace más libre?"
        opciones:
          - "Porque puedes presumir de saber mucho."
          - "Porque resuelves problemas sin depender de técnicos, decides con criterio cuando compras, no te dejas engañar."
          - "Porque ya no necesitas usarlo."
          - "Porque ahorra electricidad."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Entender te quita dependencia. El que sabe decide; el que no sabe depende. Esa es la libertad técnica del siglo XXI.
        feedback_incorrecto: |-
          Entender te hace libre: decides cuando compras, resuelves problemas básicos, no te estafan. Sin entender, dependes de otros para todo.
      - enunciado: "Cuál es una de las 5 reglas de la sala de sistemas?"
        opciones:
          - "Puedo comer chocolate frente al computador."
          - "Apagar el computador con el botón de fuerza."
          - "Manos limpias y secas antes de tocar teclado o ratón."
          - "Usar el computador descalzo."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Manos limpias y secas: una de las 5 reglas. La humedad y la suciedad dañan electrónica. Pequeña disciplina, gran ahorro.
        feedback_incorrecto: |-
          Manos limpias y secas es regla 1. Otras: sin comer, buena postura, apagado correcto, reportar daños. Cuidar la sala es ciudadanía.
      - enunciado: "Tu primo dice 'mi computador está lento, le voy a comprar más RAM'. ¿Sabes qué le quiere meter?"
        opciones:
          - "No tengo idea, suena difícil."
          - "Una memoria que ayuda al equipo a tener más programas abiertos a la vez. Lo aprenderás en P2."
          - "Le va a comprar un programa nuevo."
          - "Algo decorativo."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. La RAM es la memoria de trabajo del computador. Más RAM = más programas abiertos sin lentitud. Lo verás en S3 del periodo 2.
        feedback_incorrecto: |-
          RAM es memoria de trabajo. Más RAM permite más programas abiertos sin que se trabe. Lo aprenderás en detalle en S3 del P2.
      - enunciado: "¿Cuántos temas tiene el periodo 2 según la ruta presentada?"
        opciones:
          - "5 temas."
          - "10 sesiones de S1 a S10 + S11 de cosecha."
          - "20 temas."
          - "Solo 1 tema."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. P2 tiene 10 sesiones (S1 a S10) más S11 de cosecha. Cada sesión es un tema cerrado pero conectado con los anteriores.
        feedback_incorrecto: |-
          10 sesiones (S1 a S10) más S11 de cosecha. Es el patrón de los 3 periodos del año. Conoces la ruta = caminas con mapa.
      - enunciado: "Tu pregunta-radar del periodo es '¿cuál computador me conviene comprar?'. ¿Qué sesión te ayudará más a responderla?"
        opciones:
          - "Ninguna."
          - "S10 (Mi computador ideal), pero también todas las anteriores porque te dan el contexto."
          - "Solo la S1 que es hoy."
          - "Una clase fuera del colegio."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. S10 es la sesión específica, pero las anteriores te dan el contexto (hardware, software, mantenimiento) para tomar la decisión con criterio.
        feedback_incorrecto: |-
          S10 (Mi computador ideal) responde directo. Las anteriores te dan contexto para no decidir a ciegas. Todo el periodo te prepara para esa pregunta.

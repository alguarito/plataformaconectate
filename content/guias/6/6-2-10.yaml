clave: "2-10"
grado: 6
periodo: 2
sesion: 10
completo: true

titulo: "Mi computador ideal --- diseñar la máquina que yo necesito"
titulo_portada: |-
  Mi computador
  ideal ---
  diseñar la
  máquina que
  yo necesito

producto_final: |-
  Una \textbf{ficha técnica de tu computador ideal} en una hoja del cuaderno, con: \textbf{(a) perfil de uso} (¿para qué lo necesitas? colegio, juegos, edición, ofimática), \textbf{(b) lista de componentes recomendados} (CPU, RAM, disco, GPU, monitor, periféricos), \textbf{(c) presupuesto aproximado} (puedes consultar precios en internet o estimar), \textbf{(d) justificación con criterio} de por qué escogiste cada componente, y \textbf{(e) sugerencia de software inicial} (sistema operativo + 5 programas que vas a usar). Cierre: \emph{``Si tuviera el dinero, este es el equipo que compraría, y sé por qué.''}.

apertura:
  saber_ancestral: |-
    \textbf{Don Lucho el relojero no vendía un solo modelo de reloj a todos sus clientes.} Cuando alguien entraba a la vitrina de la calle 14 de Cartago, lo primero que don Lucho hacía era \textbf{preguntar}: \emph{``¿Para qué lo quiere usted, mijo? ¿Para el trabajo? ¿Para regalar? ¿Para el campo o la ciudad?''}. Si era para un campesino que iba al cafetal, recomendaba uno \emph{resistente al sudor y al polvo}, sencillo. Si era para una secretaria, uno \emph{elegante de pulsera fina}. Si era para un abuelo que ya no veía bien, uno con \emph{números grandes}. \textbf{El relojero sabio sabe que no hay UN reloj para todos, hay EL reloj para cada quién}. Por eso preguntaba primero, vendía después. Hoy con los computadores pasa lo mismo. No hay UN computador mejor: hay \textbf{el computador correcto para lo que TÚ vas a hacer}. Diseñar tu equipo ideal es la prueba de fuego de todo lo aprendido en este periodo: combinar hardware, software, mantenimiento y ergonomía para decidir con criterio.

  saber_contemporaneo: |-
    \textbf{Diseñar el computador ideal} no es elegir el más caro --- es elegir el que se adapta a TU uso. Hay \textbf{4 perfiles típicos} y cada uno requiere componentes distintos. \textbf{(1) Ofimática y colegio}: navegar, escribir documentos, ver videos educativos. Computador básico, RAM 8 GB, disco SSD 256 GB, sin tarjeta gráfica dedicada. \textbf{(2) Edición media}: editar fotos, videos cortos, presentaciones complejas. RAM 16 GB, SSD 512 GB, tarjeta gráfica básica. \textbf{(3) Gamer}: jugar juegos pesados (Fortnite, Minecraft con shaders, GTA V). RAM 16-32 GB, SSD 1 TB, tarjeta gráfica dedicada (GTX o RTX). \textbf{(4) Creador profesional}: editar videos largos, programación, modelado 3D. RAM 32 GB+, SSD 1 TB+, tarjeta gráfica de gama alta. \textbf{Saber tu perfil te ahorra dinero}: si solo vas a hacer tareas, no necesitas un computador gamer; si vas a jugar, no compres un básico. Esta clase te entrena en \emph{decidir con criterio} en vez de \emph{dejarte llevar por la publicidad}.

  pregunta_puente: |-
    Si tus papás te dijeran \emph{``escoge tu primer computador propio, tienes 2 millones de pesos''}, ¿\textbf{qué le preguntarías al vendedor} primero? ¿Sabrías qué componentes pedir?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} tu propio perfil de uso; (2) sabrás \textbf{aplicar} criterios de hardware a los 4 perfiles; (3) podrás \textbf{evaluar} si una oferta de computador conviene o no; (4) habrás \textbf{creado} tu ficha técnica con justificación.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas tu perfil de uso, aprendes los 4 perfiles típicos y sus componentes, diseñas tu ficha técnica, y firmas tu propuesta.
  a_escuta: |-
    Empezamos preguntándote: ¿para qué usarías TÚ el computador?
  a_sistematizacion: |-
    Después aprendes los 4 perfiles con sus componentes recomendados y rangos de precio.
  a_praxis: |-
    Con todo claro, diseñas la ficha técnica de tu computador ideal con justificación.
  a_producto: |-
    El producto es esa ficha completa con perfil, componentes, presupuesto, justificación y software.
  a_evaluacion: |-
    Antes de salir, miras tu ficha: ¿coincide el perfil con los componentes? ¿La justificación tiene criterio?
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué decidir con criterio es libertad.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- ¿Cuál es TU perfil?} (10 min · individual). En el cuaderno, responde estas \textbf{5 preguntas} con sinceridad: \emph{(1) ¿Qué actividades haces más en el computador (escoge las 3 principales): hacer tareas, ver videos, jugar, editar fotos/videos, programar, otra?} \emph{(2) ¿Cuánto tiempo lo usas al día?} \emph{(3) ¿Necesitas que sea portátil para llevarlo al colegio?} \emph{(4) ¿Tu casa tiene buen internet o necesitas un equipo que aguante mucho local?} \emph{(5) ¿Te gusta jugar videojuegos pesados o solo casuales?}. Estas respuestas determinan tu perfil. Sé honesto: si no juegas mucho, no inventes que sí solo porque suena \emph{cool}.

  checks:
  - Respondí las 5 preguntas con honestidad.
  - Mis respuestas reflejan mi uso real, no un uso imaginado.
  - Identifiqué cuáles 3 actividades son las que más hago.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mi perfil de usuario». \textbf{Formato:} 5 preguntas respondidas en bloques cortos. \textbf{Extensión:} 5 respuestas de 1-2 líneas cada una. \textbf{Sabes que terminaste cuando} tu perfil queda claro: si alguien lee esto, sabe para qué usas el computador.

sistematizacion:
  intro: |-
    Las 5 respuestas te ubican en uno de los \textbf{4 perfiles típicos}. Conocer tu perfil te ayuda a saber qué hardware necesitas (y qué no). \textbf{No hay perfil mejor}: hay perfil correcto para cada quién.

  pilares:
  - |-
    \textbf{Perfil 1 --- Ofimática + colegio (el más común para 6° grado).} Usas el computador para tareas, Word, navegar, ver videos educativos, oír música. \textbf{Componentes ideales:} CPU intermedia (Intel Core i3 o i5; AMD Ryzen 3 o 5). RAM 8 GB (lo justo). Disco SSD 256 GB (rápido, suficiente). Sin tarjeta gráfica dedicada (la del CPU basta). Monitor 14-15 pulgadas (portátil) o 22 pulgadas (escritorio). \textbf{Rango de precio en Colombia 2026:} 1.500.000 a 2.500.000 pesos.
  - |-
    \textbf{Perfil 2 --- Edición media (presentaciones, foto, videos cortos).} Usas el equipo para tareas Y edición ligera: fotos en Canva, videos cortos en CapCut, presentaciones con efectos. \textbf{Componentes ideales:} CPU media-alta (i5 o Ryzen 5). RAM 16 GB. Disco SSD 512 GB. Tarjeta gráfica básica integrada o dedicada de entrada (GTX 1650 o equivalente). Monitor de buena resolución (Full HD). \textbf{Rango de precio:} 2.500.000 a 4.000.000 pesos.
  - |-
    \textbf{Perfil 3 --- Gamer (juegos pesados regulares).} Usas el equipo para jugar Fortnite, Roblox con shaders, Minecraft modeado, GTA V, juegos con gráficos exigentes. \textbf{Componentes ideales:} CPU alta (i5 o i7; Ryzen 5 o 7). RAM 16 GB mínimo, 32 GB ideal. Disco SSD 1 TB. \textbf{Tarjeta gráfica dedicada} (GTX 1660, RTX 3060 o superior). Monitor con buena tasa de refresco (75 Hz+). \textbf{Rango de precio:} 4.000.000 a 7.000.000 pesos.
  - |-
    \textbf{Perfil 4 --- Creador profesional (videos largos, programación, 3D).} Usas el equipo para edición de video largo en Premiere o DaVinci, programación, modelado 3D en Blender. \textbf{Componentes ideales:} CPU alta (i7 o i9; Ryzen 7 o 9). RAM 32 GB+. Disco SSD 1 TB + HDD 2 TB para almacenamiento. Tarjeta gráfica de gama alta (RTX 3070+ o equivalente). Monitor 27 pulgadas o doble monitor. \textbf{Rango de precio:} 7.000.000 a 12.000.000+ pesos. \emph{Este perfil rara vez se necesita en 6°}; es para adultos con trabajo específico.

  anatomia:
    titulo: 4 perfiles + componentes clave
    body: |-
      \textbf{P1 · Ofimática + colegio:} i3/i5, 8 GB RAM, SSD 256 GB, sin GPU. \\[1mm]
      \textbf{P2 · Edición media:} i5, 16 GB RAM, SSD 512 GB, GPU básica. \\[1mm]
      \textbf{P3 · Gamer:} i5/i7, 16-32 GB RAM, SSD 1 TB, GPU dedicada. \\[1mm]
      \textbf{P4 · Creador pro:} i7/i9, 32 GB+ RAM, SSD 1 TB+ HDD 2 TB, GPU alta.

  errores_comunes: |-
    \textbf{Errores frecuentes al elegir computador.} (1) \emph{``Compro el más caro y ya''} --- Falso. El más caro suele ser más de lo que necesitas. Pagas por componentes que nunca usarás. (2) \emph{``Compro el más barato''} --- Falso al otro extremo. Si es muy básico, se vuelve lento en 6 meses y lo terminas cambiando. (3) \emph{``Solo importa la marca''} --- Falso. Lo que importa son los componentes (CPU, RAM, disco). Una marca \emph{cool} con malos componentes es peor que una marca menos famosa con buenos componentes. (4) \emph{``Me dejo llevar por la publicidad del vendedor''} --- Falso. El vendedor quiere ganar comisión. Tú quieres el equipo correcto para ti. Lleva tu perfil escrito y pide componentes específicos.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Los 4 perfiles con sus componentes». \textbf{Formato:} tabla de 4 filas, 5 columnas. Columnas: perfil, CPU, RAM, disco, GPU. \textbf{Extensión:} 4 filas. \textbf{Sabes que terminaste cuando} puedes decir en voz alta qué componentes necesita cada perfil.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu ficha técnica del computador ideal} (32 min · individual). En una hoja completa del cuaderno vas a hacer la \textbf{ficha técnica de TU computador ideal}. Combina lo aprendido en todo el periodo: hardware, software, mantenimiento, ergonomía. Esta es la cosecha del periodo 2.

  pilares:
  - |-
    \textbf{Paso 1 --- Título y mi perfil.} Arriba escribe: \textbf{``Mi computador ideal --- ficha técnica''} y debajo: \emph{``[Tu nombre], grado 6[tu letra], año 2026''}. Subraya el título. Luego escribe en un cuadro: \textbf{``Mi perfil:''} y completa con tu perfil de la Actividad 1 (ofimática, edición media, gamer, o mezcla). Sé honesto: \emph{``ofimática 60~\% + gamer casual 40~\%''} es válido.
  - |-
    \textbf{Paso 2 --- Lista de componentes.} En una tabla de \textbf{6 filas, 3 columnas}, lista los componentes principales. Columnas: \emph{componente}, \emph{lo que elijo}, \emph{por qué}. Filas: \emph{CPU, RAM, disco, GPU, monitor, periféricos}. Para cada uno, escribe qué eliges (ejemplo: \emph{``CPU: Intel Core i5''}) y por qué con tus palabras (\emph{``Porque necesito que abra Word, Chrome y Minecraft con shaders sin pegarse''}).
  - |-
    \textbf{Paso 3 --- Presupuesto estimado.} Debajo de la tabla, escribe \textbf{``Presupuesto aproximado:''} con un rango (\emph{``$2.000.000 a $2.800.000 pesos colombianos''}). Si no sabes precios, mira el rango sugerido por perfil y ajusta. La idea es que sepas que un computador no son $300.000 pero tampoco $20.000.000.
  - |-
    \textbf{Paso 4 --- Software inicial.} Lista los \textbf{5 programas} que vas a usar más en este equipo (más el sistema operativo). Ejemplo: \emph{Sistema operativo: Windows 11. Programas: (1) Microsoft Word, (2) Chrome, (3) Spotify, (4) Roblox, (5) CapCut.}. Esta lista te recuerda que el hardware sin software no sirve.
  - |-
    \textbf{Paso 5 --- Mantenimiento y ergonomía.} En la mitad inferior, escribe en 2-3 líneas \textbf{cómo lo vas a mantener} (ya sabes las acciones del S8) y \textbf{cómo lo vas a usar bien físicamente} (postura del S9). Esto cierra el círculo del periodo.
  - |-
    \textbf{Paso 6 --- Justificación final + firma.} Al final escribe un párrafo de 3-4 líneas que diga: \emph{``Este computador no es el más caro ni el más barato. Es el que necesito para [tu perfil]. Si lo cuido bien, me va a durar X años. Lo elegí porque [razón principal].''}. Firma con nombre y fecha. Esta es \textbf{la prueba de que aprendiste a decidir con criterio}.

  checklist:
    titulo: Antes de mostrar tu ficha
    items: |-
      \checkbox Mi perfil está descrito con honestidad arriba. \\[1mm]
      \checkbox La tabla de 6 componentes está completa con justificación. \\[1mm]
      \checkbox El presupuesto tiene rango (no precio único exacto). \\[1mm]
      \checkbox Lista de software inicial con SO + 5 programas. \\[1mm]
      \checkbox Mantenimiento y ergonomía mencionados al menos en 2 líneas. \\[1mm]
      \checkbox Justificación final firmada y fechada.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Arriba:} título + mi perfil. \textit{Tabla:} 6 componentes (CPU/RAM/disco/GPU/monitor/periféricos) con elección y razón. \textit{Presupuesto:} rango en pesos. \textit{Software:} SO + 5 programas. \textit{Mantenimiento + ergonomía:} 2-3 líneas. \textit{Final:} justificación de 3-4 líneas + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi computador ideal». \textbf{Formato:} ficha técnica completa con perfil, componentes, precio, software, mantenimiento y justificación. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} podrías ir a una tienda con esta hoja y comprar el equipo correcto, sin que te vendan algo distinto.

  producto_titulo: Ficha técnica del computador ideal · perfil + componentes + presupuesto + software · firmada
  criterios:
  - El perfil de usuario es honesto y específico.
  - Los 6 componentes están justificados por el perfil.
  - El presupuesto tiene rango realista.
  - El software inicial incluye SO + 5 programas.
  - La justificación final muestra criterio (no solo gusto).

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del consumo crítico)"
    cita: |-
      ``Quien sabe qué necesita, escapa de la trampa del consumo. Quien no, compra lo que le venden, no lo que necesita.''
    aplicacion: |-
      La publicidad de computadores te dice \emph{``compra el último modelo''}, \emph{``el más rápido''}, \emph{``el más cool''}. Pero TÚ ahora sabes que \textbf{no necesitas el último modelo}: necesitas el que se adapta a tu perfil. \emph{Saber esto es libertad}: no te dejas llevar por el marketing, decides con criterio. Esa es la diferencia entre consumir y elegir.
    pregunta_espejo: |-
      ¿Las cosas que quiero comprar las necesito, o me las quieren vender porque están de moda?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Mide cada decisión por su propósito, no por el ruido a su alrededor.''
    aplicacion: |-
      Cuando vas a comprar un computador (o cualquier cosa importante), \textbf{el ruido es enorme}: vendedores, publicidad, youtubers, amigos que dicen \emph{``compra el mismo que yo''}. El sabio se detiene y pregunta: \emph{``¿para qué lo necesito yo?''}. Si tu respuesta es clara, decides bien. Si no, te enredan.
    pregunta_espejo: |-
      Mis últimas 3 compras importantes, ¿las decidí por mi propósito o por el ruido?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del consumo digital sostenible)"
    cita: |-
      ``El equipo correcto te dura años. El equipo equivocado te genera el deseo de comprar otro en meses.''
    aplicacion: |-
      Si compras un computador que NO se adapta a tu uso, vas a sentir frustración: \emph{``es muy lento''}, \emph{``no me aguanta lo que quiero hacer''}. La frustración te lleva a querer comprar otro. \textbf{El equipo correcto te dura 5-8 años sin necesidad de cambio}. Decidir bien hoy es ahorrar dinero, tiempo y recursos del planeta durante años.
    pregunta_espejo: |-
      ¿La compra que estoy pensando me va a durar años o me va a generar ganas de cambiar en meses?

compromiso: |-
  \textbf{Para la próxima sesión.} Guarda tu ficha. Si algún día tus papás o tú van a comprar un computador, esta hoja es tu guía. La próxima sesión (S11) es la \textbf{cosecha del periodo}: te autoevalúas con rúbrica, vemos el examen integrador y miramos al periodo 3 que empieza (Procesador de texto e Internet). Hoy cerraste el ciclo del hardware. La próxima clase cierras formalmente el periodo.

web:
  conceptos_clave:
    - termino: Perfil de usuario
      definicion: |-
        El conjunto de actividades para las que vas a usar tu computador. Define qué componentes necesitas. Hay 4 perfiles típicos: ofimática, edición media, gamer, creador profesional.
      ejemplo: |-
        Tu perfil: 70% tareas + 30% ver videos = ofimática. El computador ideal para ti es básico con SSD, RAM 8 GB, sin tarjeta gráfica dedicada.
      emoji: "👤"
    - termino: Ofimática
      definicion: |-
        El perfil más común para estudiantes. Incluye navegar, escribir documentos (Word), ver videos educativos, oír música, chats. No requiere componentes potentes ni tarjeta gráfica dedicada.
      ejemplo: |-
        Si tu uso principal son tareas + Chrome + YouTube + Spotify, eres perfil ofimática. Un equipo de 1.500.000 a 2.500.000 pesos te alcanza.
      emoji: "📊"
    - termino: Componentes clave
      definicion: |-
        Las 6 cosas en las que fijarse al elegir un computador: CPU (procesador), RAM (memoria), disco (almacenamiento), GPU (tarjeta gráfica), monitor y periféricos. Cada uno se elige según el perfil.
      ejemplo: |-
        Para gamer: GPU dedicada es lo más importante. Para ofimática: SSD para que prenda rápido. Para creador: RAM alta para procesar pesado.
      emoji: "⚙️"
    - termino: SSD vs HDD
      definicion: |-
        Dos tipos de disco duro. SSD (estado sólido): rápido, silencioso, caro. HDD (mecánico): lento, sonoro, barato. Hoy es estándar tener SSD en el disco principal; HDD se usa para guardar archivos grandes.
      ejemplo: |-
        Con SSD el computador prende en 10 segundos. Con HDD del mismo tamaño, en 60 segundos. La diferencia se siente todos los días.
      emoji: "💾"
    - termino: Tarjeta gráfica dedicada
      definicion: |-
        Una GPU separada de la CPU, con su propia memoria. Necesaria para juegos pesados, edición de video y trabajo gráfico. Para ofimática no es necesaria (la CPU ya trae una integrada que basta).
      ejemplo: |-
        Tarjetas comunes: GTX 1650 (juegos medios), RTX 3060 (juegos pesados), RTX 4070+ (juegos exigentes). Las RTX hacen ray tracing (gráficos realistas).
      emoji: "🎮"

  quiz:
    titulo: "¿Sabes diseñar tu computador ideal?"
    instrucciones: "5 preguntas para verificar que entiendes cómo elegir el equipo correcto para tu uso."
    preguntas:
      - enunciado: "Tu primo va a comprar un computador y dice 'voy a llevar el más caro'. ¿Qué le dices?"
        opciones:
          - "Buena idea, así te dura más."
          - "Compra mejor el más barato."
          - "El más caro tiene componentes que tal vez no usas. Primero pensar tu perfil, después comprar."
          - "Compra cualquiera, todos son iguales."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. El más caro tiene componentes para perfiles avanzados (gamer, creador pro). Si solo haces tareas, pagas por lo que no usas.
        feedback_incorrecto: |-
          El más caro suele tener componentes que no usarás. Primero piensas tu perfil, después eliges según necesidad. Decisión con criterio.
      - enunciado: "Tu perfil es 'hacer tareas + ver YouTube'. ¿Necesitas tarjeta gráfica dedicada?"
        opciones:
          - "Sí, sin ella no se ve YouTube."
          - "No, la CPU ya trae una integrada que basta para ver videos."
          - "Solo si es de Apple."
          - "Solo en computadores de escritorio."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Ofimática + videos no requiere GPU dedicada. La integrada en la CPU mueve YouTube y todo lo normal. Te ahorras 1-2 millones.
        feedback_incorrecto: |-
          Ofimática no necesita GPU dedicada. La CPU trae una integrada suficiente. Ahorras dinero y consume menos electricidad.
      - enunciado: "Vas a jugar Roblox con shaders y Minecraft con mods pesados. ¿Cuál perfil eres?"
        opciones:
          - "Ofimática."
          - "Creador profesional."
          - "Edición media."
          - "Gamer (juegos pesados)."
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Juegos pesados = perfil gamer. Necesitas GPU dedicada, RAM 16 GB+, SSD rápido. Rango $4-7 millones.
        feedback_incorrecto: |-
          Eres perfil gamer. Roblox con shaders y mods exigentes requieren GPU dedicada + RAM 16 GB+ + SSD rápido.
      - enunciado: "¿Qué es más importante en un computador para ofimática: SSD o HDD?"
        opciones:
          - "SSD, porque hace que el equipo prenda y abra programas rápido."
          - "HDD, porque guarda más."
          - "Da lo mismo, son iguales."
          - "Solo HDD, los SSD son para gamers."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. SSD hace toda la diferencia: prende en 10s en vez de 60s, abre Word en segundos. Para ofimática, SSD es la mejor inversión.
        feedback_incorrecto: |-
          SSD es lo más importante. Prende rápido, abre rápido. HDD es más barato y guarda más, pero lento. Para principal, siempre SSD.
      - enunciado: "Tus papás te dan $2.500.000 pesos para tu primer computador y tu perfil es ofimática + estudiante. ¿Qué pides?"
        opciones:
          - "Computador gamer con RTX 4090."
          - "El más barato posible para guardar el resto."
          - "Computador de creador profesional."
          - "Portátil con Intel i5, 8-16 GB RAM, SSD 256 GB, sin GPU dedicada."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. Para ofimática + colegio con 2.5 millones: i5 + 16 GB RAM + SSD 256 GB es el dulce punto. Te durará 5-6 años bien.
        feedback_incorrecto: |-
          Para tu perfil + presupuesto: i5 + 16 GB RAM + SSD 256 GB. Gastas todo el dinero en componentes útiles, sin pagar lo innecesario.

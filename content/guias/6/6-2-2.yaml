titulo: "¿Qué es un computador? --- las 4 funciones básicas de toda máquina inteligente"
titulo_portada: |-
  ¿Qué es un
  computador? ---
  las 4 funciones
  de toda máquina
  inteligente

producto_final: |-
  Un \textbf{diagrama del computador con las 4 funciones etiquetadas} (entrada, proceso, almacenamiento, salida), hecho en una hoja del cuaderno. El diagrama incluye \textbf{flechas entre las funciones} mostrando el flujo de la información, \textbf{2 ejemplos concretos por cada función} (10 ejemplos en total contando una función adicional), y \textbf{un caso completo aplicado}: el recorrido de la información cuando juegas Roblox, desde tu dedo en la pantalla hasta el sonido que sale del altavoz.

apertura:
  saber_ancestral: |-
    \textbf{En cada barrio de Cartago vivía un relojero.} Hasta hace pocas décadas, en una vitrina pequeña de la calle 12 o la calle 14 trabajaba el relojero. Don Lucho, don Aurelio, doña Rita --- cada barrio tenía el suyo. \textbf{El relojero no era un mago: era un sabio de las máquinas pequeñas}. Sabía exactamente qué pieza hacía qué dentro del reloj. Conocía los engranajes que recibían la cuerda (\emph{entrada}), las ruedas que la transmitían (\emph{proceso}), el resorte que guardaba la energía (\emph{almacenamiento}), y las manecillas que mostraban la hora (\emph{salida}). Si una pieza fallaba, sabía cuál era. Si el reloj se atrasaba, sabía cuál engranaje ajustar. Las personas le tenían respeto porque \textbf{conocía la máquina por dentro}. Hoy el reloj de tu abuela ya casi no existe; hoy todos cargamos otra máquina por dentro: el computador y el celular. Aprender qué hay dentro te convierte en algo parecido al relojero: alguien que entiende la máquina, no alguien que solo la usa.

  saber_contemporaneo: |-
    Un \textbf{computador} es una máquina que hace siempre lo mismo: recibe datos, los procesa, los guarda y muestra resultados. Esas son las \textbf{4 funciones básicas}. Las hace tu computador del aula, las hace tu celular, las hace una caja registradora del supermercado, las hace un cajero electrónico. Cualquier máquina inteligente sigue ese mismo patrón. \textbf{Función 1 --- Entrada:} la información que entra (lo que escribes en el teclado, lo que dices al micrófono, lo que tocas en la pantalla). \textbf{Función 2 --- Proceso:} lo que el cerebro de la máquina (la CPU) hace con esa información. \textbf{Función 3 --- Almacenamiento:} dónde la guarda (memoria temporal --- RAM --- o memoria permanente --- disco duro). \textbf{Función 4 --- Salida:} cómo te muestra el resultado (pantalla, altavoz, impresora). Aprender estas 4 funciones es el primer paso para entender por dentro cualquier máquina.

  pregunta_puente: |-
    Cuando juegas Roblox en el celular y mueves tu personaje con el dedo en la pantalla, \textbf{¿qué partes del celular están trabajando en ese instante}? ¿Sabrías nombrar al menos 3?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} las 4 funciones básicas de un computador; (2) sabrás \textbf{explicar} con tus palabras qué hace cada una; (3) podrás \textbf{aplicar} las 4 funciones a un caso real (un juego, un programa, una acción cotidiana); (4) habrás \textbf{creado} un diagrama propio del computador con las 4 funciones etiquetadas.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: clasificas 10 acciones cotidianas según función, aprendes las 4 funciones con sus piezas, aplicas todo a un juego que conoces, y dibujas tu diagrama.
  a_escuta: |-
    Empezamos con un mini-cuestionario: 10 acciones cotidianas para clasificar en 4 funciones.
  a_sistematizacion: |-
    Después del cuestionario, aprendes el nombre de cada función con la pieza del computador que la cumple.
  a_praxis: |-
    Con las 4 funciones claras, dibujas tu diagrama y trazas el recorrido completo de una acción real (jugar Roblox o escribir un correo).
  a_producto: |-
    El producto es el diagrama firmado con las 4 funciones, las piezas y el caso completo.
  a_evaluacion: |-
    Antes de salir, verificas que tu diagrama no tenga flechas perdidas: cada flecha conecta una función con la siguiente.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué saber cómo funcionan las máquinas te hace más libre frente a ellas.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 10 acciones para clasificar} (10 min · individual). En el cuaderno, dibuja una tabla de 2 columnas. Encabezado izquierda: \textbf{Acción}. Encabezado derecha: \textbf{¿Qué función es?} (entrada / proceso / almacenamiento / salida). Clasifica estas \textbf{10 acciones} que pasan cuando usas un computador o celular: (1) \emph{tocar la pantalla del celular para abrir TikTok}; (2) \emph{el celular busca el video que escribiste en RAM}; (3) \emph{aparece el video en la pantalla}; (4) \emph{el altavoz reproduce el sonido}; (5) \emph{escribes con el teclado un mensaje a tu mamá}; (6) \emph{el computador guarda el mensaje en el disco}; (7) \emph{la cámara del celular toma una foto}; (8) \emph{el procesador piensa cuánto demora el sol en salir mañana}; (9) \emph{la impresora saca una hoja con tu tarea}; (10) \emph{el computador recuerda tu contraseña guardada}. \emph{Tip:} algunas pueden parecer dos cosas; escoge la principal.

  checks:
  - Dibujé la tabla en el cuaderno.
  - Clasifiqué las 10 acciones en una de las 4 funciones.
  - No miré la siguiente actividad ni le copié al compañero.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 10 acciones y sus funciones». \textbf{Formato:} tabla de 10 filas, 2 columnas. \textbf{Extensión:} 10 filas. \textbf{Sabes que terminaste cuando} cada una de las 10 acciones tiene su función asignada y puedes justificarla en voz alta.

sistematizacion:
  intro: |-
    Lo que acabaste de clasificar fueron \textbf{las 4 funciones} de cualquier máquina inteligente. Ahora vas a aprender el nombre técnico de cada función y \textbf{qué pieza del computador la cumple}. Esto es como el relojero: cada engranaje tiene su pieza, cada pieza tiene su función.

  pilares:
  - |-
    \textbf{Función 1 --- ENTRADA (\emph{input} en inglés).} Es por donde llega la información al computador. \textbf{Piezas:} teclado, ratón (mouse), pantalla táctil, micrófono, cámara, escáner, joystick de juegos. \textbf{Cómo reconocerla:} si tú estás \emph{dándole algo} al computador (tocando, escribiendo, hablando, mostrándole), es entrada. \emph{Ejemplo:} cuando tocas la pantalla para abrir TikTok, esa es la entrada.
  - |-
    \textbf{Función 2 --- PROCESO.} Es donde el computador \emph{piensa}: hace cálculos, busca, decide, compara. \textbf{Piezas:} la CPU (\emph{unidad central de proceso}, es el ``cerebro'' del computador) y la GPU (la que se encarga de los gráficos pesados de los juegos). \textbf{Cómo reconocerla:} si la información se está \emph{transformando} en algo nuevo, eso es proceso. \emph{Ejemplo:} TikTok busca un video que coincide con lo que escribiste; ese trabajo de búsqueda es proceso.
  - |-
    \textbf{Función 3 --- ALMACENAMIENTO.} Es donde el computador \emph{guarda} la información. Hay 2 tipos. \textbf{RAM (memoria temporal):} guarda lo que estás usando AHORA. Si apagas el equipo, se borra. \textbf{Disco duro (memoria permanente):} guarda los archivos, las fotos, los videos, los programas. Aunque apagues el equipo, queda. \textbf{Cómo reconocerla:} si el computador \emph{recuerda} algo, eso es almacenamiento. \emph{Ejemplo:} la lista de tus videos vistos queda guardada (disco). Tu contraseña queda en RAM mientras la digitas.
  - |-
    \textbf{Función 4 --- SALIDA (\emph{output} en inglés).} Es como el computador \emph{te muestra} el resultado. \textbf{Piezas:} pantalla, altavoces, audífonos, impresora, vibrador del celular. \textbf{Cómo reconocerla:} si el computador \emph{te está mostrando algo}, eso es salida. \emph{Ejemplo:} cuando el video de TikTok aparece en pantalla y suena en el altavoz, eso es salida (visual + auditiva al mismo tiempo).

  anatomia:
    titulo: Las 4 funciones del computador
    body: |-
      \textbf{1. ENTRADA} (input) --- por donde llega la información. \\[1mm]
      \textbf{2. PROCESO} --- donde el computador piensa (CPU). \\[1mm]
      \textbf{3. ALMACENAMIENTO} --- donde guarda (RAM y disco duro). \\[1mm]
      \textbf{4. SALIDA} (output) --- por donde muestra el resultado.

  errores_comunes: |-
    \textbf{Confusiones frecuentes entre las 4 funciones.} (1) \emph{``La pantalla es solo salida''} --- Falso si es pantalla táctil: ahí es entrada (cuando tocas) Y salida (cuando muestra). (2) \emph{``El disco duro y la RAM son lo mismo''} --- Falso. RAM es corto plazo (se borra al apagar); disco duro es largo plazo (queda). (3) \emph{``El cerebro es el disco''} --- Falso. El cerebro es la CPU. El disco es solo memoria. (4) \emph{``El celular y el computador son distintos''} --- Falso. Tienen las mismas 4 funciones, solo varía el tamaño.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Las 4 funciones con sus piezas». \textbf{Formato:} tabla de 4 filas, 3 columnas. Columna 1: nombre de la función. Columna 2: 2 piezas que la cumplen. Columna 3: 1 ejemplo tuyo de tu día. \textbf{Extensión:} 4 filas. \textbf{Sabes que terminaste cuando} podrías mostrarle la tabla a un primo más pequeño y él entendería las 4 funciones en 2 minutos.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tu diagrama del computador en una hoja completa} (28 min · individual). Vas a dibujar en una hoja del cuaderno un \textbf{diagrama del computador} con las 4 funciones, las piezas que las cumplen, las flechas del flujo, y \textbf{un caso completo aplicado}: el recorrido de la información cuando juegas Roblox (o cuando ves un video, escoge tú).

  pilares:
  - |-
    \textbf{Paso 1 --- Título y formato.} En la parte superior de la hoja escribe: \textbf{``Mi diagrama del computador''} y debajo: \emph{``[Tu nombre], grado 6[tu letra], año 2026''}. Subraya el título. Pon la hoja en formato \emph{horizontal} (apaisada) porque vas a necesitar espacio a lo ancho.
  - |-
    \textbf{Paso 2 --- Dibuja un rectángulo grande en el centro.} Adentro escribe \textbf{``COMPUTADOR''}. Divide el rectángulo en 4 cuadrantes (líneas horizontales y verticales en el medio). Etiqueta cada cuadrante con una función: arriba-izquierda \textbf{ENTRADA}, arriba-derecha \textbf{PROCESO}, abajo-derecha \textbf{ALMACENAMIENTO}, abajo-izquierda \textbf{SALIDA}.
  - |-
    \textbf{Paso 3 --- Pon 2 piezas por función.} En cada cuadrante dibuja un ícono pequeño de \textbf{2 piezas que cumplen esa función}. \emph{Entrada:} teclado y pantalla táctil (o ratón y micrófono). \emph{Proceso:} CPU (un chip cuadrado) y GPU. \emph{Almacenamiento:} RAM (rectángulo delgado) y disco duro (cilindro). \emph{Salida:} pantalla y altavoz. Etiqueta cada ícono.
  - |-
    \textbf{Paso 4 --- Flechas del flujo.} Con flechas curvas conecta: \textbf{Entrada → Proceso → Almacenamiento → Proceso → Salida}. Sí, el proceso aparece 2 veces porque la CPU trabaja antes y después de guardar. Si no entendieron del todo el flujo, así se aclara: la información entra, se procesa, se guarda lo que se necesita, se vuelve a procesar para mostrarla, y sale.
  - |-
    \textbf{Paso 5 --- Caso aplicado: ``Juego Roblox''.} A la derecha del rectángulo grande, escribe un caso completo de 5 líneas. Una línea por función. \emph{Ejemplo:} \emph{(1) Toco la pantalla del celular para entrar a Roblox --- ENTRADA. (2) La CPU del celular busca el juego en el disco --- PROCESO. (3) El juego se carga en la RAM para usarse rápido --- ALMACENAMIENTO. (4) La CPU calcula los movimientos del personaje --- PROCESO. (5) La pantalla muestra el juego y el altavoz reproduce los sonidos --- SALIDA.}.
  - |-
    \textbf{Paso 6 --- Firma de cierre.} En la esquina inferior derecha escribe: \emph{``Ahora entiendo qué pasa dentro del computador cuando lo uso.''} y firma con tu nombre completo y fecha. La idea es que esta hoja se vuelva un mapa de consulta cuando necesites entender un programa o un juego en el futuro.

  checklist:
    titulo: Antes de mostrar tu diagrama
    items: |-
      \checkbox El diagrama ocupa una hoja completa horizontal. \\[1mm]
      \checkbox Están las 4 funciones etiquetadas en cuadrantes. \\[1mm]
      \checkbox Cada función tiene 2 piezas dibujadas con su nombre. \\[1mm]
      \checkbox Hay flechas que conectan las funciones (entrada → proceso → almacenamiento → proceso → salida). \\[1mm]
      \checkbox Está el caso aplicado de 5 líneas (Roblox u otro). \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura del diagrama.} \textit{Centro:} rectángulo grande dividido en 4 cuadrantes con etiquetas. \textit{En cada cuadrante:} 2 piezas dibujadas. \textit{Flechas:} entrada → proceso → almacenamiento → proceso → salida. \textit{Lado derecho:} caso aplicado de 5 líneas. \textit{Esquina inferior:} frase de cierre + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi diagrama del computador». \textbf{Formato:} hoja completa horizontal con rectángulo de 4 cuadrantes, piezas dibujadas, flechas y caso aplicado. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} usando tu diagrama puedes explicar lo que pasa adentro del computador cuando juegas, escribes o ves un video.

  producto_titulo: Diagrama del computador con las 4 funciones · caso aplicado · firmado
  criterios:
  - El diagrama cubre la hoja completa horizontal.
  - Las 4 funciones están etiquetadas con sus piezas dibujadas.
  - Las flechas conectan las funciones en el orden correcto.
  - El caso aplicado tiene 5 líneas, una por función.
  - El diagrama está firmado y fechado.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo que escribió sobre saber técnico y dignidad)"
    cita: |-
      ``Quien conoce su herramienta por dentro, la usa libre. Quien no la conoce, depende de quien sí.''
    aplicacion: |-
      Hay 2 maneras de usar un computador: como \emph{mago} (\textbf{aprietas botones sin entender}, esperando que funcione) o como \emph{relojero} (\textbf{sabes qué hace cada parte}, entonces puedes resolver, ajustar, escoger). \textbf{La segunda manera te hace libre frente a la máquina.} La primera te hace dependiente. Hoy diste el primer paso para ser relojero: aprendiste las 4 funciones.
    pregunta_espejo: |-
      ¿Quiero seguir siendo mago con las máquinas (apretar y esperar), o quiero ser relojero (entender y decidir)?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Pregunta siempre qué es la cosa en sí misma, no qué te parece que es. Esa pregunta separa al sabio del distraído.''
    aplicacion: |-
      Cuando ves un computador, lo fácil es pensar \emph{``es un aparato que sirve para esto''}. Lo sabio es preguntar: \emph{``¿qué es por dentro?''}. Lo mismo con un celular, una nevera inteligente, un cajero electrónico. Detrás de cualquier máquina hay esas mismas 4 funciones. \textbf{Saber esto te entrena a no asustarte con tecnología nueva}: si tiene esas 4 funciones, las puedes entender.
    pregunta_espejo: |-
      ¿Me conformo con saber qué \emph{hace} una cosa, o también me pregunto qué \emph{es} por dentro?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la información)"
    cita: |-
      ``Vivimos en una sociedad de máquinas inteligentes. Quien no entiende cómo funcionan, las usa sin ser su dueño.''
    aplicacion: |-
      En 20 años habrá máquinas que ni se han inventado. Pero \textbf{las 4 funciones siguen siendo las mismas}: entrada, proceso, almacenamiento, salida. Si dominas este modelo, dominas cualquier máquina futura. Esto no es teoría: es preparación para una vida entera de tecnologías nuevas.
    pregunta_espejo: |-
      ¿Estoy aprendiendo lo de hoy o las ideas que sirven para 30 años?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, cuando uses tu celular, juega a identificar las 4 funciones. Por ejemplo, al ver un TikTok: ¿qué es entrada? ¿qué es proceso? ¿qué es salida? Si lo haces 3 veces, ya lo tendrás claro. La próxima clase abrimos el gabinete del computador y vemos las piezas internas: CPU, RAM y disco duro por dentro.

web:
  conceptos_clave:
    - termino: Las 4 funciones del computador
      definicion: |-
        Cualquier máquina inteligente hace siempre lo mismo: recibe información (entrada), la procesa, la guarda y muestra resultados (salida). Computadores, celulares, cajeros, registradoras: todos siguen este patrón.
      ejemplo: |-
        Al jugar Roblox: tu dedo en la pantalla (entrada), CPU calcula movimientos (proceso), juego guardado en disco (almacenamiento), gráficos en pantalla y sonido en altavoz (salida).
      emoji: "🔄"
    - termino: Entrada (input)
      definicion: |-
        Por donde llega la información al computador. Si tú le das algo a la máquina (tocas, escribes, hablas, muestras), eso es entrada. Las piezas que cumplen esto: teclado, ratón, pantalla táctil, micrófono, cámara.
      ejemplo: |-
        Cuando escribes en WhatsApp, el teclado es la entrada. Cuando dices "Hola Siri", el micrófono es la entrada.
      emoji: "⬆️"
    - termino: Proceso (CPU)
      definicion: |-
        Donde el computador piensa: hace cálculos, busca cosas, decide, compara. La pieza principal se llama CPU (Unidad Central de Proceso). Es el "cerebro" de la máquina. La GPU procesa los gráficos pesados de los juegos.
      ejemplo: |-
        Cuando Google te muestra resultados de búsqueda, su CPU procesa millones de páginas en milésimas de segundo para encontrar las relevantes.
      emoji: "🧠"
    - termino: Almacenamiento
      definicion: |-
        Donde el computador guarda la información. Hay 2 tipos. RAM (memoria temporal): guarda lo que usas AHORA, se borra al apagar. Disco duro (memoria permanente): guarda archivos, fotos, programas; queda aunque apagues.
      ejemplo: |-
        Tus videos en TikTok están en el disco duro de Google (permanente). Lo que estás viendo ahora mismo está cargado en RAM (rápido pero temporal).
      emoji: "💾"
    - termino: Salida (output)
      definicion: |-
        Cómo el computador te muestra el resultado de lo que procesó. Si la máquina te está mostrando algo (visible, audible, palpable), eso es salida. Piezas típicas: pantalla, altavoz, audífonos, impresora, vibrador.
      ejemplo: |-
        Cuando ves un meme en TikTok, la pantalla muestra los gráficos (salida visual) y el altavoz reproduce el sonido (salida auditiva).
      emoji: "⬇️"

  quiz:
    titulo: "¿Conoces las 4 funciones de un computador?"
    instrucciones: "5 preguntas para verificar que sabes identificar entrada, proceso, almacenamiento y salida."
    preguntas:
      - enunciado: "Tocas la pantalla del celular para abrir TikTok. ¿Qué función es?"
        opciones:
          - "Salida, porque la pantalla muestra el resultado."
          - "Proceso, porque el celular está pensando."
          - "Almacenamiento, porque guarda tu toque."
          - "Entrada, porque tú le estás dando información al celular."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Cuando tú le DAS algo al celular (tocar, escribir, hablar), eso es entrada. La pantalla táctil es entrada cuando tocas y salida cuando muestra.
        feedback_incorrecto: |-
          Es entrada. La pantalla táctil cumple las 2 funciones: entrada (cuando tocas) y salida (cuando muestra). En este caso tú estás tocando.
      - enunciado: "TikTok busca un video que coincida con lo que escribiste. ¿Qué función es?"
        opciones:
          - "Proceso, porque la CPU está buscando y comparando."
          - "Entrada, porque hay un teclado."
          - "Salida, porque va a mostrar el video."
          - "Almacenamiento, porque guarda lo que buscaste."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. Buscar, comparar, calcular: todo eso es proceso. La pieza que lo hace es la CPU, el cerebro del celular.
        feedback_incorrecto: |-
          Es proceso. Cuando el celular está pensando, buscando o comparando, eso lo hace la CPU. Esa es la función 'proceso'.
      - enunciado: "Apagas el celular y al prenderlo de nuevo, ¿qué se mantiene y qué se pierde?"
        opciones:
          - "Todo se pierde, hay que volver a configurar."
          - "Lo que estaba en RAM se pierde; lo del disco duro queda."
          - "Todo queda, el celular nunca olvida."
          - "Depende del color del celular."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. RAM es memoria temporal (se borra al apagar). Disco duro es memoria permanente (queda). Las 2 son almacenamiento pero hacen cosas distintas.
        feedback_incorrecto: |-
          RAM se borra al apagar (temporal). Disco duro queda (permanente). Por eso tus fotos no se borran pero la app que tenías abierta sí se cierra.
      - enunciado: "Cuál de estas piezas es de SALIDA (output)?"
        opciones:
          - "Teclado"
          - "Micrófono"
          - "Altavoz"
          - "Cámara"
        respuesta_index: 2
        feedback_correcto: |-
          Bien. El altavoz es salida porque el computador te muestra algo (un sonido). Teclado, micrófono y cámara son entrada.
        feedback_incorrecto: |-
          El altavoz es salida (el computador te da algo). Teclado, micrófono y cámara son entrada (tú le das algo al computador).
      - enunciado: "Tu celular, una caja registradora y un cajero electrónico tienen en común que..."
        opciones:
          - "Tienen las mismas 4 funciones básicas (entrada, proceso, almacenamiento, salida)."
          - "Son todos del mismo color."
          - "Funcionan solo cuando hay internet."
          - "Solo sirven para una cosa."
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Cualquier máquina inteligente sigue el mismo patrón: entrada, proceso, almacenamiento, salida. Si lo entiendes, entiendes cualquier máquina nueva.
        feedback_incorrecto: |-
          Todas siguen las mismas 4 funciones. Por eso si entiendes este modelo, entiendes celulares, cajeros, registradoras y cualquier máquina nueva que aparezca.

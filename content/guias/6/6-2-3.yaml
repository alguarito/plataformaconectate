clave: "2-3"
grado: 6
periodo: 2
sesion: 3
completo: true

titulo: "El gabinete por dentro --- conocer las piezas como las conoce el relojero"
titulo_portada: |-
  El gabinete
  por dentro ---
  conocer las
  piezas como
  el relojero

producto_final: |-
  Un \textbf{plano del interior del gabinete del computador} dibujado en una hoja completa del cuaderno. El plano incluye \textbf{6 piezas ubicadas correctamente} (tarjeta madre, CPU con disipador, RAM, disco duro, fuente de poder, tarjeta gráfica), cada una con \textbf{una etiqueta} y \textbf{una frase de qué hace}. Más \textbf{una tabla comparativa} de CPU vs RAM vs disco duro: en qué se parecen, en qué se diferencian, cuál es ``cerebro'', cuál es ``memoria corta'' y cuál es ``memoria larga''.

apertura:
  saber_ancestral: |-
    \textbf{Cuando el relojero levantaba la tapa del reloj, mostraba un universo pequeño.} En la calle 14 de Cartago, don Lucho tenía un cristal de aumento (\emph{lupa}) y una pinza diminuta. Cuando llegaba un cliente con un reloj atrasado, abría la tapa frente a él, mostraba los engranajes y \textbf{explicaba cada pieza con paciencia}: \emph{``Mire, este es el balancín, hace el tic-tac. Esta rueda grande mueve las manecillas. Este resortico guarda la cuerda. Este eje es el corazón del mecanismo, sin él nada se mueve.''}. La gente miraba hipnotizada. Esa pequeña clase del relojero \textbf{convertía un misterio en algo familiar}. Cuando lo entendían, ya no le tenían miedo al reloj. Hoy abrimos juntos el gabinete del computador. Lo que parece complicado se va a sentir cercano cuando sepas el nombre de cada pieza y para qué sirve.

  saber_contemporaneo: |-
    El \textbf{gabinete} (o \emph{torre}, o \emph{case}) es la caja del computador. En los portátiles está \emph{adentro} (no se ve), pero en los de escritorio se puede abrir para ver las piezas. Dentro hay \textbf{6 piezas principales} que toda guía técnica menciona: (1) \textbf{Tarjeta madre} (motherboard) --- la placa grande donde van las demás. (2) \textbf{CPU} (procesador) --- el cerebro. (3) \textbf{RAM} (memoria) --- la mesa de trabajo. (4) \textbf{Disco duro} (HDD o SSD) --- el archivo. (5) \textbf{Tarjeta gráfica} (GPU) --- para los juegos y videos. (6) \textbf{Fuente de poder} --- alimenta de electricidad a todo. \textbf{Reconocerlas y saber dónde van te abre la puerta} a entender cuando hablen de \emph{``actualizar la RAM''} o \emph{``cambiar el disco''}. Es vocabulario que vas a usar el resto de tu vida.

  pregunta_puente: |-
    Cuando una persona dice \emph{``mi computador está lento, le voy a meter más RAM''}, ¿\textbf{sabes qué quiere decir} esa frase? ¿Qué es la RAM y por qué meter más ayuda?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} las 6 piezas internas del computador; (2) sabrás \textbf{explicar} qué hace cada una en lenguaje natural; (3) podrás \textbf{distinguir} CPU, RAM y disco duro con sus diferencias clave; (4) habrás \textbf{creado} un plano del interior del gabinete bien etiquetado.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas 6 piezas con sus nombres, aprendes qué hace cada una, distingues CPU/RAM/disco, y dibujas el plano del gabinete.
  a_escuta: |-
    Empezamos jugando a adivinar nombres con 6 imágenes mentales.
  a_sistematizacion: |-
    Después del juego, conoces cada pieza con su función y un dato fácil de recordar.
  a_praxis: |-
    Con las 6 piezas claras, dibujas el plano del gabinete y haces la tabla comparativa.
  a_producto: |-
    El producto es el plano firmado + la tabla CPU vs RAM vs disco.
  a_evaluacion: |-
    Antes de salir, verificas que tu plano tiene las 6 piezas y que la tabla aclara cuál es cerebro, memoria corta y memoria larga.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué conocer las piezas te da poder.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 6 imágenes mentales} (10 min · individual). En el cuaderno, escribe la \textbf{lista de 6 piezas} que se mencionaron en la introducción: tarjeta madre, CPU, RAM, disco duro, tarjeta gráfica, fuente de poder. Al lado de cada una, \textbf{en una sola línea}, escribe \emph{qué crees que hace} con tus palabras --- sin haber leído nada todavía. Es tu intuición. \textbf{Tip:} si no tienes idea, escribe lo que \emph{te suena} por el nombre. Después comparas con lo que vas a aprender. No se vale ver la siguiente actividad.

  checks:
  - Escribí las 6 piezas en orden.
  - Al lado de cada una, escribí mi intuición de qué hace.
  - No miré la siguiente actividad ni internet.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mis 6 intuiciones». \textbf{Formato:} lista numerada del 1 al 6. \textbf{Extensión:} 6 líneas. \textbf{Sabes que terminaste cuando} tienes las 6 piezas con tu propia intuición al lado.

sistematizacion:
  intro: |-
    Ahora compara tus 6 intuiciones con la realidad. Vas a ver que algunas las acertaste (los nombres dicen mucho) y otras te sorprenden. Lo importante es \textbf{quedarte con el dato fácil de recordar de cada pieza}.

  pilares:
  - |-
    \textbf{Pieza 1 --- Tarjeta madre (motherboard).} Es la \textbf{placa grande verde} (a veces negra) donde se conectan TODAS las demás piezas. Sin tarjeta madre no hay computador, porque es como la \emph{calle principal del barrio} que conecta todas las casas. \emph{Dato fácil:} se llama ``madre'' porque sostiene y conecta a todas las otras piezas, como una madre con sus hijos. \textbf{Pieza 2 --- CPU (procesador).} Es el \textbf{cerebro} del computador. Un chip cuadrado pequeño (3-5 cm), pegado a la tarjeta madre. Lleva un \emph{disipador} (un ventilador encima) porque trabaja tanto que se calienta. \emph{Dato fácil:} CPU = ``Central Processing Unit'' = ``el que piensa''.
  - |-
    \textbf{Pieza 3 --- RAM (memoria de trabajo).} Son \textbf{tarjetas alargadas y delgadas}, como reglitas paradas, conectadas a la tarjeta madre. \emph{Sirven como la mesa de trabajo}: la CPU pone ahí lo que está usando AHORA. Más RAM = más mesa = más cosas puedes hacer al mismo tiempo. \emph{Dato fácil:} se borra al apagar el computador. \textbf{Pieza 4 --- Disco duro (HDD o SSD).} Es donde se \textbf{guardan tus archivos para siempre}. HDD = \emph{disco mecánico} (lento, barato, suena cuando gira). SSD = \emph{disco de estado sólido} (rápido, caro, silencioso). \emph{Dato fácil:} aunque apagues el equipo, los archivos quedan acá.
  - |-
    \textbf{Pieza 5 --- Tarjeta gráfica (GPU).} Es \textbf{otra placa con su propio chip}, especializada en gráficos y videos. Los juegos pesados (Roblox, Minecraft, Fortnite) la necesitan. En computadores básicos no hay una separada; está incluida dentro de la CPU. \emph{Dato fácil:} GPU = ``Graphics Processing Unit'' = ``cerebro para los gráficos''. \textbf{Pieza 6 --- Fuente de poder (PSU).} Es la \textbf{caja metálica grande con cables saliendo}, generalmente en una esquina del gabinete. \emph{Convierte la electricidad de la pared (110V) en electricidad para las piezas}. \emph{Dato fácil:} si la fuente falla, NADA enciende. Es como el corazón que bombea sangre.
  - |-
    \textbf{Comparación rápida CPU vs RAM vs Disco duro.} (1) \textbf{CPU} es \emph{cerebro}: piensa, calcula, decide. (2) \textbf{RAM} es \emph{mesa de trabajo}: guarda lo de AHORA, se borra al apagar. (3) \textbf{Disco duro} es \emph{archivo del cuaderno}: guarda los archivos para siempre, no se borra. \textbf{Analogía completa:} estudiar es como usar el computador. Tu \emph{cerebro} (CPU) piensa. Pones los apuntes que necesitas en tu \emph{mesa} (RAM). Tus \emph{cuadernos archivados} en el cajón (disco duro). Cuando terminas el día, recoges la mesa (la RAM se borra) pero los cuadernos quedan (el disco duro guarda).

  anatomia:
    titulo: Las 6 piezas del gabinete + 3 piezas estrella
    body: |-
      \textbf{1. Tarjeta madre} --- la calle principal que conecta todo. \\[1mm]
      \textbf{2. CPU} --- el cerebro. \\[1mm]
      \textbf{3. RAM} --- la mesa de trabajo (memoria corta). \\[1mm]
      \textbf{4. Disco duro} --- el archivo (memoria larga). \\[1mm]
      \textbf{5. Tarjeta gráfica} --- cerebro de los juegos. \\[1mm]
      \textbf{6. Fuente de poder} --- el corazón eléctrico. \\[1mm]
      \textbf{Las 3 estrella:} CPU (cerebro), RAM (mesa), disco (archivo).

  errores_comunes: |-
    \textbf{Confusiones que se repiten cuando ves piezas por primera vez.} (1) \emph{``RAM y disco duro son lo mismo''} --- Falso. RAM se borra al apagar; disco duro queda. (2) \emph{``Más RAM hace el computador más rápido en todo''} --- Falso. Más RAM ayuda a tener \emph{muchas cosas abiertas a la vez}; para velocidad pura, importa más la CPU. (3) \emph{``Si cambio el disco, pierdo mis archivos''} --- Cierto, los archivos están en el disco. Por eso siempre hay que hacer \emph{copia de seguridad} antes de cambiarlo. (4) \emph{``Los portátiles no tienen estas piezas''} --- Falso. Las tienen todas, solo que más pequeñas y dentro de la carcasa.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Las 6 piezas con su dato fácil». \textbf{Formato:} tabla de 6 filas, 3 columnas. Columna 1: nombre de la pieza. Columna 2: qué hace (1 frase). Columna 3: dato fácil para recordar. \textbf{Extensión:} 6 filas. \textbf{Sabes que terminaste cuando} podrías recitar de memoria las 6 piezas y sus datos fáciles.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu plano del gabinete + tabla comparativa} (30 min · individual). Vas a hacer 2 cosas en una hoja completa del cuaderno. \textbf{Arriba (3/4 de la hoja):} el plano del interior del gabinete con las 6 piezas dibujadas y etiquetadas. \textbf{Abajo (1/4 de la hoja):} la tabla comparativa de CPU vs RAM vs disco duro.

  pilares:
  - |-
    \textbf{Paso 1 --- Título y marco.} En la parte superior escribe: \textbf{``Plano del gabinete''} y debajo: \emph{``[Tu nombre], grado 6[tu letra], año 2026''}. Subraya el título. Dibuja un \textbf{rectángulo grande vertical} que ocupe los 3/4 superiores de la hoja --- ese es el gabinete visto desde un lado abierto.
  - |-
    \textbf{Paso 2 --- Ubica la tarjeta madre.} En el centro del rectángulo dibuja una \textbf{placa rectangular grande} (de color verde si tienes lápices de color, si no, solo el contorno). Etiqueta: \emph{``1. Tarjeta madre''}. Esta es la base sobre la que van las demás.
  - |-
    \textbf{Paso 3 --- CPU + disipador.} Encima de la tarjeta madre dibuja un \textbf{cuadrado pequeño con un cuadrado más grande encima} (el cuadrado de encima es el disipador con su ventilador). Etiqueta: \emph{``2. CPU --- cerebro''}. La CPU está casi en el centro de la tarjeta madre.
  - |-
    \textbf{Paso 4 --- RAM.} A la derecha de la CPU dibuja \textbf{2 reglitas paradas} (2 ó 4 módulos de RAM). Etiqueta: \emph{``3. RAM --- mesa de trabajo''}. La RAM siempre va a un lado de la CPU, conectadas por ranuras de la tarjeta madre.
  - |-
    \textbf{Paso 5 --- Disco duro, tarjeta gráfica y fuente.} Abajo a la izquierda del gabinete dibuja un \textbf{cubo} (el disco duro): \emph{``4. Disco duro --- archivo''}. En la parte inferior, una placa horizontal: \emph{``5. Tarjeta gráfica''}. En la esquina inferior derecha del rectángulo, un \textbf{rectángulo con cables saliendo}: \emph{``6. Fuente de poder''}.
  - |-
    \textbf{Paso 6 --- Tabla comparativa CPU vs RAM vs disco duro.} Debajo del plano (en el 1/4 inferior de la hoja) dibuja una tabla de \textbf{3 columnas} y \textbf{4 filas}. Columnas: CPU / RAM / Disco duro. Filas: \emph{(a) ¿Qué hace?}, \emph{(b) ¿Memoria corta o larga?}, \emph{(c) ¿Se borra al apagar?}, \emph{(d) ¿Cómo lo recuerdo?}. Llena la tabla con tus palabras. Firma el plano en la esquina inferior derecha con nombre y fecha.

  checklist:
    titulo: Antes de mostrar tu plano
    items: |-
      \checkbox El plano ocupa los 3/4 superiores de la hoja. \\[1mm]
      \checkbox Están las 6 piezas dibujadas y etiquetadas. \\[1mm]
      \checkbox La tarjeta madre está en el centro y las demás encima o conectadas. \\[1mm]
      \checkbox La tabla comparativa tiene 3 columnas y 4 filas. \\[1mm]
      \checkbox La tabla deja claro cuál es cerebro, cuál memoria corta y cuál memoria larga. \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Arriba:} título + nombre. \textit{Centro (rectángulo grande):} tarjeta madre + CPU con disipador + RAM + disco + tarjeta gráfica + fuente, las 6 etiquetadas. \textit{Abajo:} tabla CPU/RAM/disco con 4 filas (qué hace, memoria, ¿se borra al apagar?, cómo recordarlo). \textit{Esquina:} firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi plano del gabinete». \textbf{Formato:} plano dibujado + tabla comparativa. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} podrías mostrarle el plano a un primo y él entendería las 6 piezas y cuál es cerebro, cuál mesa y cuál archivo.

  producto_titulo: Plano del gabinete con 6 piezas + tabla CPU vs RAM vs disco · firmado
  criterios:
  - El plano contiene las 6 piezas dibujadas con etiqueta.
  - La tarjeta madre está como base y las demás conectadas a ella.
  - Cada pieza tiene una frase breve de qué hace.
  - La tabla comparativa distingue claramente cerebro, memoria corta y memoria larga.
  - Está firmado con nombre y fecha.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del conocimiento popular)"
    cita: |-
      ``Conocer el nombre de algo es el primer paso para perderle el miedo.''
    aplicacion: |-
      Antes de hoy, el interior del computador era un misterio. \textbf{Ahora ya conoces el nombre de las 6 piezas más importantes}. Eso no es teoría: es poder. La próxima vez que un técnico te diga \emph{``el problema es la fuente de poder''}, ya no te suena chino: sabes qué es y por qué importa. \textbf{Los nombres son llaves}: cada nombre que aprendes te abre una puerta.
    pregunta_espejo: |-
      ¿De cuántas cosas dependo todos los días sin saber su nombre? ¿Cuál sería la próxima que querría aprender a nombrar?

  estoico:
    autor: "Epicteto"
    cita: |-
      ``Lo que se entiende, se domina. Lo que no se entiende, te domina a ti.''
    aplicacion: |-
      Cuando no entiendes cómo funciona algo, ese algo te genera ansiedad: \emph{``¿y si se daña?''}, \emph{``¿qué hago si no funciona?''}. Cuando lo entiendes, te calmas. \textbf{No es magia: es comprensión}. Saber qué hace cada pieza del gabinete te quita esa ansiedad. Si algo falla, ahora tienes vocabulario para preguntar y mapa para buscar.
    pregunta_espejo: |-
      ¿Qué cosas me asustan solo porque no las entiendo? ¿Cuál vale la pena empezar a entender hoy?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del conocimiento técnico)"
    cita: |-
      ``Saber el nombre de las cosas técnicas es la primera forma de ciudadanía en una sociedad de máquinas.''
    aplicacion: |-
      Vivimos rodeados de máquinas. Pero \textbf{la mayoría de las personas no sabe cómo funcionan por dentro}. Eso las hace dependientes: dependen del técnico, del youtuber, del vendedor que les dice qué comprar. Cuando tú aprendes los nombres y las funciones, dejas de depender. Eres un \emph{ciudadano técnicamente alfabetizado}: una de las personas que entienden el mundo donde viven.
    pregunta_espejo: |-
      ¿Quiero ser dependiente de los expertos para todo, o quiero entender lo suficiente para decidir por mí?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, si entras a la sala de sistemas, observa los gabinetes desde afuera: \textbf{¿qué cables ves?} ¿Cuáles van a la fuente de poder? ¿Cuáles van al monitor (eso es salida)? La próxima clase trabajamos los \textbf{periféricos}: las piezas que están \emph{afuera} del gabinete --- teclado, ratón, pantalla, cámara, impresora. Hoy viste lo interno; la próxima ves lo externo.

web:
  conceptos_clave:
    - termino: Gabinete (torre o case)
      definicion: |-
        La caja del computador donde van todas las piezas internas. En portátiles está oculto dentro de la carcasa; en computadores de escritorio se puede abrir para ver las piezas adentro.
      ejemplo: |-
        Si miras un computador de la sala de sistemas, el gabinete es la caja vertical o horizontal donde se conectan el monitor, el teclado y el ratón. Adentro están las 6 piezas.
      emoji: "📦"
    - termino: Tarjeta madre (motherboard)
      definicion: |-
        La placa grande (verde o negra) sobre la que se conectan todas las demás piezas. Es como la calle principal que conecta todas las casas del barrio. Sin tarjeta madre, no hay computador.
      ejemplo: |-
        Si abres el gabinete y miras la placa más grande llena de chips, cables y ranuras, esa es la tarjeta madre. Sobre ella van CPU, RAM, disco y todo lo demás.
      emoji: "🔌"
    - termino: CPU (procesador)
      definicion: |-
        El cerebro del computador. Un chip cuadrado pequeño con un ventilador encima (disipador). Hace los cálculos, toma decisiones y procesa información. Marca el ritmo del equipo.
      ejemplo: |-
        Marcas famosas de CPU: Intel Core i5, AMD Ryzen 5. El número indica generación o potencia. Más alto en general significa más rápido para hacer trabajos pesados.
      emoji: "🧠"
    - termino: RAM (memoria de trabajo)
      definicion: |-
        Reglitas paradas conectadas a la tarjeta madre. La CPU las usa como mesa de trabajo: pone ahí lo que está usando ahora. Si apagas el computador, la RAM se borra. Más RAM = más cosas abiertas a la vez.
      ejemplo: |-
        Un computador con 4 GB de RAM aguanta navegador + Word + música. Con 16 GB aguanta todo lo anterior + un juego pesado + 20 pestañas abiertas sin lentitud.
      emoji: "📚"
    - termino: Disco duro (HDD o SSD)
      definicion: |-
        Donde se guardan los archivos, fotos, videos y programas. Aunque apagues el equipo, queda. HDD es mecánico (más lento, más barato). SSD es de estado sólido (más rápido, más caro, silencioso).
      ejemplo: |-
        Un SSD de 256 GB hace que el computador prenda en 10 segundos. Un HDD del mismo tamaño puede tardar 60 segundos. La diferencia se siente todos los días.
      emoji: "💾"

  quiz:
    titulo: "¿Conoces las piezas del gabinete?"
    instrucciones: "5 preguntas para verificar que sabes nombrar las piezas del computador y qué hace cada una."
    preguntas:
      - enunciado: "¿Cuál pieza es el 'cerebro' del computador?"
        opciones:
          - "La tarjeta madre."
          - "La RAM."
          - "La CPU."
          - "El disco duro."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. La CPU es el cerebro: hace los cálculos y toma decisiones. La tarjeta madre conecta todo, pero no piensa por sí sola.
        feedback_incorrecto: |-
          La CPU (procesador) es el cerebro. La tarjeta madre solo conecta. La RAM es mesa de trabajo y el disco es archivo.
      - enunciado: "Apagas el computador. ¿Qué pasa con la información que estaba en la RAM?"
        opciones:
          - "Queda guardada para siempre."
          - "Se mueve sola al disco duro."
          - "Solo se borra si el computador está sin batería."
          - "Se borra. La RAM es memoria temporal."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. La RAM es memoria temporal: solo guarda lo que se usa AHORA. Al apagar se borra. Para guardar permanente, está el disco duro.
        feedback_incorrecto: |-
          La RAM se borra al apagar. Es memoria corta. Lo que quieres guardar para siempre tiene que estar en el disco duro.
      - enunciado: "Una persona dice 'mi computador está lento, le voy a meter más RAM'. ¿Qué le va a pasar al equipo?"
        opciones:
          - "Va a poder tener más programas abiertos al tiempo sin pegarse."
          - "Va a ser mejor para guardar archivos."
          - "Va a procesar los videos más rápido en YouTube."
          - "Va a tener más espacio para fotos."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Más RAM = más mesa de trabajo = más programas abiertos a la vez sin lentitud. Para guardar archivos sirve más disco; para procesar más rápido, mejor CPU.
        feedback_incorrecto: |-
          Más RAM permite tener más cosas abiertas al tiempo sin que se pegue. Para guardar archivos sirve disco; para velocidad pura, CPU.
      - enunciado: "¿Cuál de estas piezas, si falla, hace que NADA encienda?"
        opciones:
          - "La RAM."
          - "La fuente de poder."
          - "El disco duro."
          - "La tarjeta gráfica."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La fuente de poder alimenta a todas las piezas. Si falla, no hay electricidad para ninguna y el computador no enciende.
        feedback_incorrecto: |-
          La fuente de poder es la que alimenta de electricidad a todo. Si falla, nada enciende. Las otras piezas dañadas dejan encender pero con problemas.
      - enunciado: "¿Cuál es la analogía correcta para CPU, RAM y disco duro?"
        opciones:
          - "CPU = mesa, RAM = cerebro, disco = archivo."
          - "CPU = archivo, RAM = mesa, disco = cerebro."
          - "CPU = cerebro, RAM = mesa de trabajo, disco = archivo."
          - "CPU = cable, RAM = cerebro, disco = mesa."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. CPU es cerebro (piensa), RAM es mesa de trabajo (memoria corta), disco duro es archivo (memoria larga). Esa analogía te sirve toda la vida.
        feedback_incorrecto: |-
          CPU = cerebro (piensa), RAM = mesa de trabajo (corto plazo), disco = archivo (largo plazo). Si las confundes, vuelve a la tabla del cuaderno.

clave: "2-4"
grado: 6
periodo: 2
sesion: 4
completo: true

titulo: "Periféricos --- las manos, los ojos y la voz del computador"
titulo_portada: |-
  Periféricos ---
  las manos,
  los ojos y
  la voz del
  computador

producto_final: |-
  Una \textbf{tabla maestra de 12 periféricos} en una hoja del cuaderno, con 4 columnas: \emph{nombre}, \emph{tipo} (entrada / salida / mixto), \emph{cómo se conecta} (USB, cable, Bluetooth, inalámbrico), \emph{1 ejemplo de uso real}. Más \textbf{un diagrama lateral} donde dibujas un computador en el centro y \textbf{6 periféricos conectados a él con flechas} (3 de entrada apuntando al computador, 3 de salida apuntando hacia afuera). Firma de cierre: \emph{``Conozco las manos, los ojos y la voz de mi computador.''}.

apertura:
  saber_ancestral: |-
    \textbf{En el taller de don Lucho el relojero de Cartago, cada herramienta tenía su lugar y su uso.} Si entrabas a su vitrina de la calle 14, veías colgadas en orden las herramientas de su \textbf{oficio}: la \textbf{lupa} para ver lo pequeño, las \textbf{pinzas largas} para agarrar tornillos diminutos, los \textbf{destornilladores en miniatura} para abrir tapas, el \textbf{martillito de bronce} para ajustar suavemente, el \textbf{paño de gamuza} para limpiar sin rayar, el \textbf{aceite especial} para lubricar engranajes. \textbf{Cada herramienta servía para una cosa específica y don Lucho sabía cuándo sacar cuál}. La lupa no servía para apretar tornillos, ni el martillo para mirar dentro. Una persona inexperta usaba la herramienta equivocada y dañaba el reloj. \textbf{El relojero sabio sabía cuál herramienta usar cuándo}. Hoy el computador es la máquina: las herramientas que la rodean se llaman \textbf{periféricos}. Cada una tiene una función específica, y conocerlas te hace usuario sabio.

  saber_contemporaneo: |-
    Un \textbf{periférico} es cualquier pieza que se conecta \emph{por fuera} del computador. Vienen en 3 grandes tipos. \textbf{Entrada}: por donde tú le das información al computador (teclado, ratón, micrófono, cámara, escáner, joystick, lápiz óptico). \textbf{Salida}: por donde el computador te muestra resultados (pantalla, impresora, altavoz, audífonos, proyector, vibrador). \textbf{Mixtos (entrada Y salida a la vez)}: la pantalla táctil, los audífonos con micrófono, el USB, el módem, el monitor táctil. Hay también una clasificación por cómo se \textbf{conectan}: con cable (USB, HDMI, jack 3.5mm) o sin cable (Bluetooth, wifi, infrarrojo). Reconocer todo esto te permite \textbf{escoger el periférico correcto para lo que necesites} y resolver problemas básicos sin depender de un técnico.

  pregunta_puente: |-
    Cuando ves a alguien jugar Roblox en computador, usa al menos \textbf{4 periféricos al mismo tiempo}. ¿Sabrías nombrarlos? Pista: 2 son de entrada y 2 de salida.

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} 12 periféricos comunes; (2) sabrás \textbf{analizar} si cada uno es entrada, salida o mixto; (3) podrás \textbf{distinguir} las formas de conexión (USB, HDMI, jack, Bluetooth); (4) habrás \textbf{creado} tu tabla maestra de periféricos + diagrama.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: reconoces 12 periféricos, los clasificas en entrada/salida/mixtos, ves cómo se conectan, y armas tu tabla maestra.
  a_escuta: |-
    Empezamos identificando 12 periféricos en una lista mezclada.
  a_sistematizacion: |-
    Después de la lista, aprendes la regla simple para clasificarlos.
  a_praxis: |-
    Con la regla clara, construyes tu tabla maestra + diagrama con flechas.
  a_producto: |-
    El producto es la tabla maestra firmada + el diagrama con 6 periféricos conectados.
  a_evaluacion: |-
    Antes de salir, verificas que cada periférico tenga sus 4 datos completos en la tabla.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué conocer las herramientas te hace mejor usuario.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Reconoce los 12 periféricos} (12 min · individual). En el cuaderno, escribe esta lista numerada del 1 al 12: \emph{(1) teclado, (2) monitor, (3) ratón (mouse), (4) impresora, (5) cámara web, (6) audífonos con micrófono, (7) altavoz, (8) micrófono solo, (9) joystick de juegos, (10) pantalla táctil, (11) escáner, (12) memoria USB}. Al lado de cada uno, en una sola línea, \textbf{escribe para qué crees que sirve} con tus palabras. Si alguno no lo conoces, escribe lo que te suena por el nombre. Es tu intuición; no se vale ver la siguiente actividad.

  checks:
  - Copié los 12 periféricos en mi cuaderno numerados.
  - Al lado de cada uno, escribí para qué sirve con mis palabras.
  - No miré la siguiente actividad ni busqué en internet.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Los 12 periféricos y mi intuición». \textbf{Formato:} lista numerada del 1 al 12. \textbf{Extensión:} 12 líneas. \textbf{Sabes que terminaste cuando} cada uno de los 12 periféricos tiene tu propia descripción al lado.

sistematizacion:
  intro: |-
    Lo que acabaste de hacer ya es la base. Ahora vas a aprender \textbf{la regla simple} para clasificar cualquier periférico --- no solo los 12 de la lista, sino \emph{cualquiera que veas en el futuro}.

  pilares:
  - |-
    \textbf{Regla de oro --- 1 pregunta para clasificar.} Ante cualquier periférico, pregúntate: \emph{``¿Yo le doy algo al computador, o el computador me da algo a mí?''}. Si TÚ le das (tocas, escribes, hablas, mueves), es \textbf{entrada}. Si el computador te da (te muestra, te suena, te imprime, te vibra), es \textbf{salida}. Si pasan las 2 cosas en la misma pieza, es \textbf{mixto}.
  - |-
    \textbf{Los 6 periféricos de entrada típicos.} (1) \textbf{Teclado}: escribes letras y números. (2) \textbf{Ratón (mouse)}: mueves el cursor y haces clic. (3) \textbf{Micrófono}: hablas, el computador captura el sonido. (4) \textbf{Cámara web}: el computador captura imagen tuya. (5) \textbf{Escáner}: pone documentos en papel dentro del computador como imagen. (6) \textbf{Joystick}: en juegos, controla el personaje. \emph{Cómo se conectan:} casi todos por USB, algunos por Bluetooth (sin cable).
  - |-
    \textbf{Los 6 periféricos de salida típicos.} (1) \textbf{Monitor (pantalla)}: muestra todo lo que ves. (2) \textbf{Impresora}: pone lo digital en papel. (3) \textbf{Altavoz}: produce sonido al exterior. (4) \textbf{Audífonos}: igual que altavoz pero solo para ti. (5) \textbf{Proyector}: monitor gigante para muchas personas. (6) \textbf{Vibrador del celular}: te avisa con vibración. \emph{Cómo se conectan:} monitor por HDMI, audífonos por jack 3.5mm o Bluetooth, impresora por USB o wifi.
  - |-
    \textbf{Los periféricos mixtos (entrada Y salida).} (1) \textbf{Pantalla táctil}: muestra (salida) y recibe tu toque (entrada). (2) \textbf{Audífonos con micrófono}: escuchas (salida) y hablas (entrada). (3) \textbf{Memoria USB}: lees archivos del computador (salida) y le pasas archivos (entrada). (4) \textbf{Módem o router wifi}: recibe internet (entrada) y manda a tus equipos (salida). \emph{Pista para reconocer mixtos:} si la pieza hace 2 cosas al mismo tiempo, probablemente es mixto.

  anatomia:
    titulo: La regla del 1 con 3 tipos
    body: |-
      \textbf{Regla:} ¿yo le doy o el computador me da? \\[1mm]
      \textbf{Entrada:} teclado, ratón, micrófono, cámara, escáner, joystick. \\[1mm]
      \textbf{Salida:} monitor, impresora, altavoz, audífonos, proyector, vibrador. \\[1mm]
      \textbf{Mixto:} pantalla táctil, audífonos con micrófono, USB, módem.

  errores_comunes: |-
    \textbf{Confusiones que se repiten cuando clasificas periféricos.} (1) \emph{``Los audífonos son siempre salida''} --- Falso. Los normales son salida, pero los \emph{audífonos con micrófono} (los que usas para juegos o llamadas) son mixtos. (2) \emph{``Una pantalla normal es entrada''} --- Falso. Una pantalla \emph{normal} es solo salida. Solo si es \emph{táctil} se vuelve mixta. (3) \emph{``La USB es periférico de almacenamiento''} --- Cierto pero incompleto. También es periférico mixto porque entra Y sale información. (4) \emph{``Sin cable significa que no es periférico''} --- Falso. Un periférico Bluetooth o wifi sigue siendo periférico, solo cambia la forma de conectarse.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Clasifico los 12 periféricos». \textbf{Formato:} ahora regresa a tu lista de la Actividad 1 y al lado de cada periférico, agrega \textbf{la etiqueta} ENTRADA, SALIDA o MIXTO. Si la intuición que escribiste antes coincide con la clasificación, ponte una palomita. Si no coincide, no la borres; déjala. \textbf{Extensión:} las mismas 12 líneas, ahora con la etiqueta. \textbf{Sabes que terminaste cuando} todos tienen su etiqueta.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu tabla maestra + diagrama} (28 min · individual). Vas a hacer 2 cosas en una hoja completa del cuaderno. \textbf{Arriba (la mitad de la hoja):} la tabla maestra de los 12 periféricos. \textbf{Abajo (la otra mitad):} el diagrama con un computador en el centro y 6 periféricos conectados con flechas.

  pilares:
  - |-
    \textbf{Paso 1 --- Tabla maestra (mitad superior).} Dibuja una tabla de \textbf{12 filas y 4 columnas}. Encabezados: \emph{Nombre}, \emph{Tipo} (entrada / salida / mixto), \emph{Cómo se conecta} (USB, HDMI, jack, Bluetooth, wifi), \emph{Ejemplo de uso real}. Llena las 12 filas con los periféricos de la Actividad 1. En la columna ``ejemplo'', pon una situación tuya: \emph{``Lo uso para...''}, no copies del libro.
  - |-
    \textbf{Paso 2 --- Diagrama del computador con periféricos (mitad inferior).} Dibuja en el centro de la mitad inferior un \textbf{rectángulo grande} y adentro escribe \textbf{``COMPUTADOR''}. Ese es el centro de tu diagrama.
  - |-
    \textbf{Paso 3 --- Periféricos de entrada (3 a la izquierda).} A la izquierda del rectángulo dibuja 3 íconos pequeños y etiquétalos: \textbf{teclado}, \textbf{ratón}, \textbf{micrófono}. Desde cada uno traza una \textbf{flecha apuntando hacia el rectángulo} (porque la información va DEL periférico AL computador).
  - |-
    \textbf{Paso 4 --- Periféricos de salida (3 a la derecha).} A la derecha del rectángulo dibuja otros 3 íconos: \textbf{monitor}, \textbf{altavoz}, \textbf{impresora}. Desde el rectángulo traza \textbf{flechas saliendo hacia ellos} (porque la información va DEL computador AL periférico).
  - |-
    \textbf{Paso 5 --- Etiqueta arriba y abajo.} Sobre los 3 de la izquierda escribe \textbf{``ENTRADA''} (con flecha hacia el centro). Sobre los 3 de la derecha escribe \textbf{``SALIDA''} (con flecha hacia afuera). Esto deja claro de un vistazo qué dirección lleva cada periférico.
  - |-
    \textbf{Paso 6 --- Firma de cierre.} En la esquina inferior derecha escribe la frase: \emph{``Conozco las manos, los ojos y la voz de mi computador.''} y firma con nombre completo y fecha. Lista la página para guardarla.

  checklist:
    titulo: Antes de mostrar tu hoja
    items: |-
      \checkbox La tabla maestra tiene 12 filas y 4 columnas. \\[1mm]
      \checkbox Cada periférico tiene su tipo, conexión y ejemplo de uso. \\[1mm]
      \checkbox El diagrama tiene un computador en el centro. \\[1mm]
      \checkbox Hay 3 periféricos de entrada a la izquierda con flechas hacia el centro. \\[1mm]
      \checkbox Hay 3 periféricos de salida a la derecha con flechas hacia afuera. \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Mitad superior:} tabla 12 × 4 (nombre, tipo, conexión, ejemplo). \textbf{Mitad inferior:} rectángulo central con ``COMPUTADOR''. Izquierda: 3 periféricos de entrada con flechas hacia el rectángulo, etiqueta ENTRADA arriba. Derecha: 3 periféricos de salida con flechas saliendo, etiqueta SALIDA arriba.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi tabla maestra de periféricos + diagrama». \textbf{Formato:} tabla 12 × 4 arriba + diagrama con flechas abajo. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} podrías mostrarle la hoja a un primo y él entendería en 3 minutos qué es entrada, salida y mixto.

  producto_titulo: Tabla maestra de 12 periféricos + diagrama con 6 flechas · firmado
  criterios:
  - La tabla cubre los 12 periféricos con sus 4 datos.
  - La columna 'tipo' tiene clasificación correcta (entrada/salida/mixto).
  - El diagrama tiene 3 periféricos de entrada con flechas hacia el computador.
  - El diagrama tiene 3 periféricos de salida con flechas hacia afuera.
  - Está firmado y fechado.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del saber práctico)"
    cita: |-
      ``Conocer las herramientas a la mano es conocer cómo vivimos.''
    aplicacion: |-
      Cada periférico es una \textbf{decisión cultural}: alguien decidió que el teclado tuviera esas teclas, que el ratón fuera ese tamaño, que la pantalla mostrara colores. \textbf{Conocer los periféricos es entender el mundo que nosotros construimos}. No son neutros: son fruto de decisiones humanas, y por eso pueden cambiar (mira los celulares actuales --- ya casi no se usan teclas físicas).
    pregunta_espejo: |-
      ¿Cuál es el periférico que uso más cada día? ¿Lo escogí yo o me lo asignaron?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Cuidar la herramienta es prolongar su utilidad y la nuestra.''
    aplicacion: |-
      Los periféricos son \textbf{los que más se dañan} en un computador: el teclado por golpes, el ratón por suciedad, la impresora por mal uso, los audífonos por estirones. Si los \textbf{cuidas} (limpieza, posición, no halarlos por el cable), te duran años. Si los maltratas, los gastas en meses. \emph{Cuidar las herramientas es respetar el trabajo que harán contigo}.
    pregunta_espejo: |-
      ¿Trato mis periféricos como herramientas valiosas o como cosas desechables que pronto reemplazaré?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del entorno digital)"
    cita: |-
      ``El cuerpo de cada usuario se extiende a través de sus periféricos.''
    aplicacion: |-
      Cuando usas el teclado, tus dedos se \textbf{extienden} hacia los caracteres en la pantalla. Cuando usas un micrófono, tu voz se \textbf{extiende} al lugar al que llamas. Cuando usas Skype con cámara, tu \emph{presencia} se extiende hasta otra ciudad. Los periféricos \textbf{prolongan tu cuerpo}. Por eso, en cierto sentido, son parte de ti cuando los usas. Cuidarlos es cuidarte.
    pregunta_espejo: |-
      ¿De qué manera mis periféricos me hacen \emph{más yo}, y de qué manera me alejan de mí mismo?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, observa cuántos periféricos usas cada día y por qué tipo de conexión. ¿Tu teclado es USB o Bluetooth? ¿Tu impresora va por wifi o cable? La próxima clase aprendes la \textbf{diferencia entre hardware y software}: el cuerpo y las instrucciones del computador. Hoy ya conoces el cuerpo (gabinete + periféricos); falta entender las instrucciones que lo mueven.

web:
  conceptos_clave:
    - termino: Periférico
      definicion: |-
        Cualquier pieza que se conecta por fuera del computador (a diferencia de las internas como CPU o RAM). Hay 3 tipos: entrada, salida y mixto. Conocerlos te permite escoger el adecuado y resolver problemas básicos.
      ejemplo: |-
        Teclado, ratón, monitor, impresora, parlantes, audífonos, cámara web. Todo lo que ves conectado a la torre por cable o bluetooth es periférico.
      emoji: "🔌"
    - termino: Periférico de entrada
      definicion: |-
        Pieza por donde TÚ le das información al computador. La regla rápida: si tú estás dándole algo a la máquina (tocas, escribes, hablas, mueves), eso es entrada.
      ejemplo: |-
        Teclado (escribes), ratón (mueves), micrófono (hablas), cámara (te capta), escáner (escaneas documento), joystick (juegas).
      emoji: "⬆️"
    - termino: Periférico de salida
      definicion: |-
        Pieza por donde el computador te muestra información a ti. La regla rápida: si la máquina te está mostrando algo (visible, audible, palpable), eso es salida.
      ejemplo: |-
        Monitor (ves), impresora (imprime), altavoz (oyes), audífonos (escuchas), proyector (muestra al grupo), vibrador del celular (te avisa).
      emoji: "⬇️"
    - termino: Periférico mixto
      definicion: |-
        Pieza que cumple las 2 funciones a la vez: entrada Y salida. La pista: si una sola pieza hace 2 cosas (te muestra Y recibe de ti), es mixto.
      ejemplo: |-
        Pantalla táctil (muestra + recibe tu toque), audífonos con micrófono (oyes + hablas), memoria USB (lees archivos + le pasas archivos), módem (recibe internet + manda a equipos).
      emoji: "↕️"
    - termino: Conexión de periférico
      definicion: |-
        Cómo se conecta el periférico al computador. Las más comunes: USB (universal, casi todo), HDMI (para monitor y proyector), jack 3.5mm (audífonos y micrófonos), Bluetooth (sin cable), wifi (impresoras y altavoces nuevos).
      ejemplo: |-
        Tu teclado probablemente es USB, tu monitor HDMI, tus audífonos jack 3.5mm. Una impresora nueva puede ir por wifi sin cable.
      emoji: "🔗"

  quiz:
    titulo: "¿Sabes clasificar periféricos?"
    instrucciones: "5 preguntas para verificar que dominas entrada, salida y mixtos."
    preguntas:
      - enunciado: "¿Cuál de estos es periférico de ENTRADA?"
        opciones:
          - "Monitor"
          - "Impresora"
          - "Micrófono"
          - "Altavoz"
        respuesta_index: 2
        feedback_correcto: |-
          Sí. El micrófono es entrada: tú le hablas al computador. Monitor, impresora y altavoz son salida (el computador te muestra algo).
        feedback_incorrecto: |-
          El micrófono es entrada (tú le hablas). Monitor, impresora y altavoz son salida (te muestran algo).
      - enunciado: "Una pantalla TÁCTIL (como la del celular) es periférico de..."
        opciones:
          - "Solo entrada."
          - "Solo salida."
          - "Mixto: entrada Y salida al tiempo."
          - "Almacenamiento."
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. La pantalla táctil te muestra (salida) y recibe tu toque (entrada). Es mixto. Una pantalla NO táctil es solo salida.
        feedback_incorrecto: |-
          Es mixto. Te muestra (salida) y recibe tu toque (entrada). Si la pantalla no es táctil, sería solo salida.
      - enunciado: "Quieres conectar un monitor nuevo a tu computador. ¿Qué cable necesitas?"
        opciones:
          - "USB."
          - "Jack 3.5mm."
          - "HDMI."
          - "Bluetooth."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. HDMI es el cable estándar para monitor o proyector. Lleva imagen + sonido en un solo cable. USB es para teclado/ratón.
        feedback_incorrecto: |-
          El monitor usa HDMI (lleva imagen + sonido). USB es para teclado y ratón. El jack es para audio. Bluetooth no es cable.
      - enunciado: "Unos audífonos con micrófono incorporado (los gamer) son periférico de..."
        opciones:
          - "Solo entrada (porque tienen micrófono)."
          - "Solo salida (porque oyes)."
          - "Mixto: salida (sonido) + entrada (voz)."
          - "Almacenamiento (porque guardan canciones)."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Los audífonos gamer son mixtos: oyes el juego (salida) y hablas con tu equipo (entrada). Audífonos sin micrófono son solo salida.
        feedback_incorrecto: |-
          Audífonos con micrófono son mixtos: salida (escuchar) + entrada (hablar). Si no tienen micrófono, son solo salida.
      - enunciado: "Estás jugando Roblox en computador. Nombra los 4 periféricos principales que estás usando."
        opciones:
          - "Solo el ratón."
          - "Teclado y ratón (entrada) + monitor y altavoz (salida)."
          - "Solo el monitor."
          - "Impresora y cámara web."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Cuando juegas Roblox usas teclado y ratón para controlar (entrada), y ves el juego en monitor + lo oyes en altavoces (salida).
        feedback_incorrecto: |-
          Al jugar Roblox usas 4 periféricos: teclado + ratón (entrada para controlar) y monitor + altavoz (salida para ver y oír).

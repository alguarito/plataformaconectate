clave: "2-5"
grado: 6
periodo: 2
sesion: 5
completo: true

titulo: "Hardware vs software --- el cuerpo y las instrucciones"
titulo_portada: |-
  Hardware vs
  software ---
  el cuerpo
  y las
  instrucciones

producto_final: |-
  Un \textbf{mapa de ``Mi computador''} dividido en dos mitades (hardware a la izquierda, software a la derecha), donde clasificas \textbf{15 elementos} reales que existen en tu equipo (o que has visto). Más \textbf{una analogía dibujada}: la \emph{costurera del barrio} con su tela (hardware) y su patrón de papel (software). Más \textbf{una frase comparativa propia} de 1-2 líneas que diga \emph{qué hace cada parte} con tus palabras.

apertura:
  saber_ancestral: |-
    \textbf{Doña Carmen, la costurera del barrio, no podía coser solo con tela.} En cualquier cuadra de Cartago, antes de las máquinas industriales, había una costurera que hacía vestidos y uniformes del colegio. Doña Carmen tenía \textbf{2 cosas} en su taller: por un lado, la \textbf{tela}, los \textbf{hilos}, la \textbf{máquina de coser Singer}, las \textbf{tijeras grandes} --- todo lo que se podía \emph{tocar}. Por otro lado, el \textbf{patrón de papel} (un plano del vestido recortado en papel beige) que indicaba cuánto cortar, dónde unir, cómo hacer la manga. \textbf{Sin tela no había vestido. Pero sin patrón tampoco}. La tela era el \emph{cuerpo}, el patrón eran las \emph{instrucciones}. Doña Carmen sabía que sin uno o sin otro, no podía coser nada. Hoy en el computador pasa exactamente lo mismo: hay \textbf{hardware} (la parte que se toca) y \textbf{software} (las instrucciones que le dicen al hardware qué hacer). Sin uno o sin otro, el computador no sirve. Conocer ese par es entender por qué el computador funciona.

  saber_contemporaneo: |-
    \textbf{Hardware} viene del inglés y significa \emph{``mercancía dura, cosa material''}. En español técnico, es \textbf{todo lo que se puede tocar} en el computador: el gabinete, la pantalla, el teclado, el cable, los chips por dentro. Si lo puedes golpear, derribar o llevar en la mano, es hardware. \textbf{Software} significa \emph{``cosa blanda, mercancía liviana''}. Son \textbf{las instrucciones que viven dentro del hardware}: el sistema operativo (Windows, Linux, Android), los programas (Word, Chrome, Roblox), las apps del celular, los archivos. \textbf{No se pueden tocar} con la mano, pero existen --- están guardados en memoria. \emph{Hardware sin software es una máquina muerta} (un teclado sin sistema operativo no escribe nada). \emph{Software sin hardware no se puede usar} (Windows sin computador no es nada). Necesitan estar juntos como la tela y el patrón.

  pregunta_puente: |-
    Tu celular se cae y la pantalla se raja. ¿Esa pantalla es \textbf{hardware o software}? Después de cambiarla en un técnico, ¿pierdes tus fotos? ¿Por qué sí o no?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} hardware y software con la regla del toque; (2) sabrás \textbf{explicar} 3 diferencias claves; (3) habrás \textbf{aplicado} la clasificación a 15 elementos reales; (4) podrás \textbf{evaluar} qué pasa si falla el hardware o si falla el software.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: clasificas 15 cosas en hardware o software, aprendes las 3 diferencias clave, dibujas el mapa con la analogía de la costurera, y firmas tu trabajo.
  a_escuta: |-
    Empezamos con un juego rápido: te leo 15 cosas y tú las clasificas.
  a_sistematizacion: |-
    Después del juego, ves las 3 diferencias que SIEMPRE separan hardware de software.
  a_praxis: |-
    Con las 3 diferencias en mente, dibujas tu mapa de ``Mi computador'' y la costurera de doña Carmen.
  a_producto: |-
    El producto es ese mapa firmado con 15 elementos clasificados + analogía + frase comparativa.
  a_evaluacion: |-
    Antes de salir, mira tu mapa: ¿podrías tachar todos los del hardware y ver qué queda en software? ¿Te queda algo del lado equivocado?
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué la unión entre cuerpo e instrucción es lo que da vida a la tecnología.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Clasifica 15 cosas} (12 min · individual). En el cuaderno, dibuja 2 columnas: encabezado izquierda \textbf{HARDWARE} (lo que se toca), encabezado derecha \textbf{SOFTWARE} (las instrucciones). Después clasifica estos \textbf{15 elementos}: \emph{(1) teclado, (2) Windows 11, (3) Roblox, (4) tarjeta madre, (5) la app de WhatsApp, (6) el monitor, (7) Microsoft Word, (8) el ratón inalámbrico, (9) tu foto de perfil de TikTok, (10) la fuente de poder, (11) Chrome (el navegador), (12) la cámara web, (13) el sistema operativo Android del celular, (14) los audífonos, (15) tu archivo de tarea en Word}. Usa la regla simple: \emph{si lo puedes tocar con la mano, es hardware; si no, es software}.

  checks:
  - Dibujé las 2 columnas en el cuaderno.
  - Clasifiqué los 15 elementos en una de las 2 columnas.
  - Apliqué la regla del toque (si lo puedo tocar, hardware; si no, software).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 15 elementos clasificados». \textbf{Formato:} tabla de 2 columnas. \textbf{Extensión:} 15 elementos distribuidos. \textbf{Sabes que terminaste cuando} cada elemento tiene su columna y puedes justificar con la regla del toque.

sistematizacion:
  intro: |-
    La regla del toque es la primera ayuda. Ahora vas a aprender \textbf{3 diferencias clave} que siempre separan hardware de software. Si dominas las 3, sabrás clasificar cualquier cosa que aparezca en el futuro.

  pilares:
  - |-
    \textbf{Diferencia 1 --- ¿Lo puedo tocar?} El hardware se toca; el software no. \emph{Hardware:} teclado, monitor, gabinete, cable, chip. \emph{Software:} Windows, una app, un archivo. Esta es la prueba más rápida. \textbf{Diferencia 2 --- ¿Dónde está físicamente?} El hardware está \emph{afuera o adentro} del gabinete, pero ocupa espacio físico. El software vive \emph{dentro del hardware} (guardado en disco duro o RAM). Si lo metes en una caja para mudarte, son piezas de hardware. Si lo mandas por internet, son archivos de software.
  - |-
    \textbf{Diferencia 3 --- ¿Cómo se ``daña'' y se ``repara''?} El hardware se daña \emph{físicamente} (se cae, se moja, se quema). Se repara cambiando la pieza dañada (\emph{``cambio el ratón''}). El software se daña con \emph{errores, virus, archivos corruptos}. Se repara con \emph{actualización, reinstalación o borrar}. \textbf{Si tu computador no enciende y huele a quemado, es hardware. Si todo enciende pero ningún programa abre, es software}.
  - |-
    \textbf{Aplicación a tu pregunta-puente.} Cuando la pantalla del celular se raja, eso es \textbf{hardware} (físico). Cuando la cambias en el técnico, tus fotos siguen ahí porque están en el \textbf{disco duro} (también hardware, pero distinto al de la pantalla) y los archivos son \textbf{software}. Por eso \emph{cambiar la pantalla no borra tus fotos}: el hardware roto fue la pantalla, no el disco; y el software (tus fotos) vive aparte.
  - |-
    \textbf{Las 3 categorías de software más comunes.} (1) \textbf{Sistema operativo (SO)}: el ``gerente'' que coordina todo --- Windows, Linux, Android, iOS. Sin él el computador no funciona. (2) \textbf{Programas o apps}: hacen una tarea específica --- Word (escribir), Chrome (navegar), TikTok (video), Roblox (juego). (3) \textbf{Archivos}: lo que tú creas o descargas --- una foto, un video, un documento. \emph{Los 3 son software}, pero hacen cosas distintas.

  anatomia:
    titulo: Las 3 diferencias hardware vs software
    body: |-
      \textbf{1.} ¿Lo puedo tocar? Hardware sí, software no. \\[1mm]
      \textbf{2.} ¿Dónde está? Hardware ocupa espacio físico; software vive dentro del hardware. \\[1mm]
      \textbf{3.} ¿Cómo se daña/repara? Hardware se cae, se moja, se quema (se cambia la pieza). Software se corrompe (se actualiza, reinstala o borra).

  errores_comunes: |-
    \textbf{Errores frecuentes al clasificar.} (1) \emph{``Una foto es hardware porque la veo''} --- Falso. Lo que ves es la pantalla (hardware); la foto en sí es un archivo digital (software). (2) \emph{``El cable es software porque transporta datos''} --- Falso. El cable es hardware (lo tocas). Los datos que viajan por él son software. (3) \emph{``El disco duro es software porque guarda software''} --- Falso. El disco duro es la pieza física (hardware); lo que guarda son archivos (software). (4) \emph{``Una contraseña es hardware porque la uso para abrir el celular''} --- Falso. Una contraseña es software (información, no objeto).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Las 3 diferencias hardware vs software». \textbf{Formato:} 3 párrafos numerados. Cada uno: nombre de la diferencia + ejemplo tuyo (de los 15 clasificados). \textbf{Extensión:} 3 párrafos cortos de 2-3 líneas. \textbf{Sabes que terminaste cuando} podrías clasificar 5 cosas nuevas que te pregunten sin dudar.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Mapa de ``Mi computador'' + la costurera} (28 min · individual). En una hoja completa del cuaderno vas a hacer 2 cosas. \textbf{Arriba (2/3 de la hoja):} mapa de \emph{Mi computador} con los 15 elementos clasificados en hardware y software. \textbf{Abajo (1/3 de la hoja):} dibujo de la \emph{costurera de doña Carmen} con su tela (hardware) y su patrón (software), más tu frase comparativa.

  pilares:
  - |-
    \textbf{Paso 1 --- Título y división.} Arriba escribe el título: \textbf{``Mi computador --- hardware y software''} y debajo: \emph{``[Tu nombre], grado 6[tu letra], año 2026''}. Subraya el título. \textbf{Divide los 2/3 superiores de la hoja en 2 mitades verticales} con una línea: izquierda HARDWARE, derecha SOFTWARE.
  - |-
    \textbf{Paso 2 --- Llena las 2 columnas.} En la mitad izquierda (HARDWARE) escribe en lista los elementos del hardware de la Actividad 1, dibujando un ícono pequeño al lado de cada uno (un teclado para ``teclado'', un cuadrado para ``monitor'', etc.). En la mitad derecha (SOFTWARE), haz lo mismo con los del software --- aquí los íconos pueden ser logos simples (la W de Word, el círculo verde de WhatsApp, una hoja para los archivos).
  - |-
    \textbf{Paso 3 --- La costurera.} En el tercio inferior dibuja a \textbf{doña Carmen sentada en su máquina de coser}. A su izquierda dibuja un \textbf{rollo de tela} con la etiqueta: \emph{``Tela = HARDWARE (lo que se toca)''}. A su derecha dibuja un \textbf{patrón de papel} con la etiqueta: \emph{``Patrón = SOFTWARE (las instrucciones)''}. No tiene que estar perfecto, solo que se vea la idea.
  - |-
    \textbf{Paso 4 --- Tu frase comparativa.} Debajo de doña Carmen, escribe una frase tuya de 1-2 líneas que compare hardware y software con tus palabras. Ejemplo: \emph{``El hardware es el cuerpo del computador, el software es su voz: sin uno o sin otro, no me puede contar nada.''}. No copies; invéntala.
  - |-
    \textbf{Paso 5 --- Conexiones cruzadas.} Mira tu mapa de arriba. Traza 3 flechas pequeñas que conecten un elemento del hardware con un elemento del software que lo use. Por ejemplo: flecha del \emph{teclado} al \emph{Word} (porque escribes con teclado en Word). Flecha del \emph{ratón} al \emph{Chrome}. Flecha de los \emph{audífonos} a un \emph{archivo de música}. Esto muestra que hardware y software \emph{trabajan juntos}.
  - |-
    \textbf{Paso 6 --- Firma.} Al final, en la esquina inferior derecha, firma con nombre completo y fecha. Subraya tu frase comparativa para que se vea claramente.

  checklist:
    titulo: Antes de mostrar tu mapa
    items: |-
      \checkbox La hoja está dividida en 2 mitades verticales (hardware / software). \\[1mm]
      \checkbox Los 15 elementos están en la columna correcta con su ícono. \\[1mm]
      \checkbox Está dibujada doña Carmen con su tela y patrón etiquetados. \\[1mm]
      \checkbox Mi frase comparativa está debajo y subrayada. \\[1mm]
      \checkbox Hay 3 flechas que conectan hardware con software. \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Tercio superior + medio:} título y 2 columnas (HARDWARE / SOFTWARE), 15 elementos con íconos. \textit{Tercio inferior:} doña Carmen con tela (hardware) y patrón (software), frase comparativa subrayada. \textit{Flechas cruzadas:} 3 conexiones entre hardware y software. \textit{Esquina:} firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Hardware y software con doña Carmen». \textbf{Formato:} hoja entera con mapa de 2 columnas + dibujo + frase + firma. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} podrías mostrar la hoja a un amigo y él entendería la diferencia entre hardware y software con solo mirar la analogía de doña Carmen.

  producto_titulo: Mapa hardware/software con 15 elementos + analogía costurera · firmado
  criterios:
  - El mapa cubre los 2/3 superiores con 2 columnas claras.
  - Los 15 elementos están clasificados correctamente.
  - Cada elemento tiene un ícono pequeño que lo represente.
  - Está la costurera con tela y patrón etiquetados.
  - La frase comparativa propia está visible y firmada.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del trabajo material e inmaterial)"
    cita: |-
      ``El cuerpo y la palabra son inseparables. Un trabajo sin las dos manos no se completa.''
    aplicacion: |-
      Doña Carmen no podía coser solo con tela. El relojero no podía arreglar solo con martillo. Tu computador no puede funcionar solo con hardware. \textbf{Hardware y software son las 2 manos del trabajo digital}: una sostiene, la otra dirige. La gente que entiende esta unión deja de pensar que la tecnología es magia y empieza a verla como \emph{trabajo de personas con dos manos}.
    pregunta_espejo: |-
      ¿Cuál de mis 2 manos (la del hardware o la del software) tengo más entrenada hoy?

  estoico:
    autor: "Marco Aurelio (emperador que reflexionó sobre lo material e inmaterial)"
    cita: |-
      ``Cuida el cuerpo. Cuida la palabra. Lo que está adentro y lo que está afuera son uno.''
    aplicacion: |-
      Si maltratas tu hardware (golpes, suciedad, mojadura), el software no puede correr bien aunque sea el mejor del mundo. Si descuidas el software (no actualizas, te llenas de virus, instalas cualquier cosa), el hardware no rinde aunque sea el más caro. \textbf{El cuidado del computador es cuidar ambos a la vez}, como un solo gesto.
    pregunta_espejo: |-
      ¿Cuido mi computador como un todo (hardware + software) o cuido solo lo que se ve?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la ontología digital)"
    cita: |-
      ``La distinción entre lo físico y lo digital es práctica, no esencial: ambos son reales.''
    aplicacion: |-
      Mucha gente cree que \emph{``lo digital no es real porque no se toca''}. Falso. \textbf{Una foto digital es tan real como una foto en papel}; un programa es tan real como una herramienta. Solo que existen de otra manera. Aprender a distinguir hardware y software es aprender que \emph{lo real toma muchas formas} y que todas merecen el mismo cuidado.
    pregunta_espejo: |-
      ¿Le doy el mismo valor a mis archivos digitales que a mis cosas físicas?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, cuando alguien hable de un problema con su computador, escucha bien: ¿están describiendo un problema de \emph{hardware} (algo roto físicamente) o de \emph{software} (algo que no abre, no actualiza, da error)? Identifícalo mentalmente. La próxima clase nos metemos al \textbf{sistema operativo}, el software más importante del computador, el \emph{gerente} que coordina todo. Vas a entender qué hace Windows o Android cuando los usas.

web:
  conceptos_clave:
    - termino: Hardware
      definicion: |-
        Todo lo que se puede tocar en el computador. Las piezas físicas: gabinete, pantalla, teclado, ratón, cables, chips internos. Si lo puedes golpear, derribar o llevar en la mano, es hardware.
      ejemplo: |-
        El monitor, el teclado, los audífonos, la tarjeta madre, el disco duro: todos son hardware. También el ratón inalámbrico (aunque no tenga cable, lo tocas).
      emoji: "💻"
    - termino: Software
      definicion: |-
        Las instrucciones y archivos que viven dentro del hardware. No se pueden tocar pero existen guardados en memoria. Sistema operativo, programas, apps, archivos: todo eso es software.
      ejemplo: |-
        Windows 11, Microsoft Word, Chrome, la app de WhatsApp, tu foto de cumpleaños, un video que descargaste: todos son software.
      emoji: "📦"
    - termino: Sistema operativo
      definicion: |-
        El software más importante del computador. Es el "gerente" que coordina todo lo demás: programas, archivos, periféricos. Sin él, el hardware no funciona como computador.
      ejemplo: |-
        Computadores: Windows, macOS, Linux, ChromeOS. Celulares: Android, iOS. Cada uno es un sistema operativo distinto pero todos hacen lo mismo: coordinar todo.
      emoji: "🎛️"
    - termino: Programa o app
      definicion: |-
        Un software que hace una tarea específica. Word es para escribir, Chrome para navegar, Roblox para jugar, WhatsApp para chatear. Cada uno hace algo concreto, distinto del sistema operativo.
      ejemplo: |-
        En tu celular tienes muchas apps abiertas a la vez (WhatsApp, Instagram, TikTok). Cada una es un programa distinto que el sistema operativo Android está coordinando.
      emoji: "📲"
    - termino: Archivo
      definicion: |-
        El software más pequeño: una unidad de información que tú creas o descargas. Una foto, un video, un documento Word, una canción MP3, un PDF: todos son archivos. Se guardan en el disco duro.
      ejemplo: |-
        Tu archivo "tarea-mate.docx" es un archivo de software. Vive en tu disco duro (hardware). Si cambias el disco, perderías el archivo a menos que tengas copia.
      emoji: "📄"

  quiz:
    titulo: "¿Distingues hardware de software?"
    instrucciones: "5 preguntas para verificar la clasificación de hardware y software con sus reglas."
    preguntas:
      - enunciado: "Tu primo dice 'me regalaron Windows nuevo'. ¿Qué le regalaron, hardware o software?"
        opciones:
          - "Hardware, porque Windows es un programa físico."
          - "Software, porque Windows es un sistema operativo (instrucciones)."
          - "Las 2 cosas al tiempo."
          - "Ninguna, Windows no es ni una cosa ni otra."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Windows es un sistema operativo: software. Tu primo recibió una licencia o una instalación, no una caja con piezas físicas.
        feedback_incorrecto: |-
          Windows es software (sistema operativo). No se toca, son instrucciones que coordinan el computador. El hardware sería un PC nuevo.
      - enunciado: "Tu hermano te dice 'la pantalla del celular se rajó'. ¿Qué se dañó, hardware o software?"
        opciones:
          - "Hardware: la pantalla es física, se tocó (cuando se cayó)."
          - "Software: las imágenes que mostraba la pantalla."
          - "Ninguno, las pantallas rajadas no son tecnología."
          - "Las 2 cosas al tiempo."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. La pantalla es hardware (se toca, se daña físicamente). Cambiarla no afecta las fotos porque las fotos son software guardado en el disco duro.
        feedback_incorrecto: |-
          La pantalla es hardware: se daña físicamente. Las fotos no se pierden porque son software guardado en otra pieza (el disco).
      - enunciado: "Tu tía borra una foto de su celular por accidente. ¿Qué perdió, hardware o software?"
        opciones:
          - "Hardware: la foto era una pieza física."
          - "Software: la foto era un archivo (información)."
          - "Las 2 cosas, porque la foto y la pantalla son lo mismo."
          - "No perdió nada, la foto sigue ahí pero invisible."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Las fotos son archivos (software). Tu tía borró información del disco duro. El hardware (el celular) sigue intacto.
        feedback_incorrecto: |-
          Las fotos son software (archivos). Tu tía borró información del disco duro. El hardware (celular y pantalla) está bien.
      - enunciado: "Tu computador tarda mucho en abrir programas. Tu papá compra una memoria USB nueva. ¿Le ayudó o no?"
        opciones:
          - "Sí, porque la memoria USB hace que los programas vayan más rápido."
          - "No tiene sentido: el problema es de hardware interno (RAM o disco), no se arregla con un periférico externo."
          - "Sí, porque la memoria USB es software."
          - "No, porque el problema es de software."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La memoria USB es hardware externo para llevar archivos. Para que el equipo abra rápido, hace falta más RAM o cambiar el disco a SSD.
        feedback_incorrecto: |-
          La memoria USB es para llevar archivos, no para acelerar el computador. La velocidad la dan RAM y disco duro (hardware interno) y un buen mantenimiento.
      - enunciado: "Tu computador no enciende. Huele a quemado por dentro. ¿Es problema de hardware o software?"
        opciones:
          - "Software, hay que reinstalar Windows."
          - "Hardware, una pieza se quemó (probablemente la fuente de poder)."
          - "Software, hay que borrar virus."
          - "No es problema, así huelen normalmente."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Si huele a quemado, una pieza física falló. Lo más probable es la fuente de poder (alimenta a todo). Hay que llevarlo al técnico.
        feedback_incorrecto: |-
          Olor a quemado = problema de hardware (físico). Lo más probable es la fuente de poder. Software no se quema. Lleva el equipo a técnico.

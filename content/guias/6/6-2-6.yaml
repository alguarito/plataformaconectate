grado: 6
periodo: 2
sesion: 6
completo: true

titulo: "El sistema operativo --- el gerente que coordina toda la máquina"
titulo_portada: |-
  El sistema
  operativo ---
  el gerente
  que coordina
  todo

producto_final: |-
  Un \textbf{tour anotado del sistema operativo} en una hoja del cuaderno con: \textbf{(a) dibujo de un escritorio típico de Windows} con 5 elementos clave etiquetados (escritorio, ventana abierta, barra de tareas, menú inicio, papelera), \textbf{(b) tabla de 5 funciones del SO} (coordinar hardware, gestionar archivos, ejecutar programas, manejar usuarios, controlar memoria), y \textbf{(c) tu opinión escrita} de cuál es el SO que más usas y por qué (Windows / Linux / Android / iOS / ChromeOS).

apertura:
  saber_ancestral: |-
    \textbf{En el taller grande de don Aurelio había varios aprendices, y todos sabían a quién obedecer.} En el centro de Cartago, en los años 60, hubo un taller de relojes donde trabajaban 4 aprendices al tiempo: uno limpiaba piezas, otro lijaba ejes, otro ensamblaba mecanismos, otro probaba el tic-tac final. \textbf{El que coordinaba todo era don Aurelio}, el maestro. Don Aurelio no hacía el trabajo manual; él \emph{decidía quién hacía qué, en qué momento, con qué herramienta}. Si llegaba un reloj urgente, asignaba a 2 aprendices a la vez. Si una pieza llegaba tarde, redistribuía las tareas. \textbf{Sin don Aurelio, los 4 aprendices se chocaban: dos limpiaban la misma pieza, otro buscaba la herramienta que su compañero tenía, nadie terminaba}. Con don Aurelio coordinando, el taller producía 10 relojes al día. Hoy ese coordinador en el computador se llama \textbf{sistema operativo}. Sin él, el hardware no se entiende con los programas, los archivos no se encuentran, los periféricos no obedecen. Es el gerente invisible que hace que todo funcione.

  saber_contemporaneo: |-
    El \textbf{sistema operativo (SO)} es el software más importante del computador. Es el \emph{primer programa} que se instala (después no se puede usar el equipo sin él) y el \emph{primero que enciende} cuando prendes el computador. Su trabajo es \textbf{coordinar todo lo demás}: hace que el teclado entienda con Word, que Chrome guarde tus descargas en la carpeta correcta, que Roblox use la memoria RAM sin pelearse con WhatsApp. Hay varios SO en el mundo. En computadores: \textbf{Windows} (el más común, de Microsoft), \textbf{macOS} (de Apple), \textbf{Linux} (gratuito, abierto), \textbf{ChromeOS} (de Google). En celulares: \textbf{Android} (Google), \textbf{iOS} (Apple). Aunque parecen distintos, \textbf{todos hacen lo mismo}: coordinan hardware, programas, archivos y usuarios. Aprender qué hace un SO te quita el miedo a probar uno nuevo --- son variantes del mismo gerente.

  pregunta_puente: |-
    Cuando prendes un computador, antes de que aparezca el escritorio, ves una pantalla que dice \emph{``Iniciando Windows''} (o ``Cargando macOS'', o el logo del fabricante). \textbf{¿Qué está haciendo el computador en esos segundos}? ¿Por qué no enciende y muestra todo de una vez?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} 5 elementos típicos de un sistema operativo de escritorio; (2) sabrás \textbf{explicar} las 5 funciones que hace un SO; (3) podrás \textbf{distinguir} entre los principales SO del mercado (Windows, Linux, Android, iOS, ChromeOS); (4) habrás \textbf{aplicado} todo en un tour anotado de Windows con tu opinión personal.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: reconoces los 5 elementos del escritorio, aprendes las 5 funciones del SO, recorres un computador real (o lo dibujas), y firmas tu trabajo con opinión.
  a_escuta: |-
    Empezamos identificando 5 elementos del escritorio de Windows que ya has visto antes.
  a_sistematizacion: |-
    Después del reconocimiento, aprendes qué hace el SO (las 5 funciones del gerente).
  a_praxis: |-
    Con todo claro, haces el tour anotado y das tu opinión sobre el SO que usas.
  a_producto: |-
    El producto es el dibujo del escritorio + tabla + opinión, firmado.
  a_evaluacion: |-
    Antes de salir, miras tu hoja: ¿podría un primo entender qué es un SO solo leyéndola?
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué saber quién coordina la máquina te hace usuario libre.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Reconoce 5 elementos del escritorio} (10 min · individual). Imagina que prendes un computador con Windows y aparece la pantalla principal. En el cuaderno, escribe el \textbf{nombre de 5 cosas} que aparecen ahí y describe cada una en 1 línea con tus palabras. Pista: hay 1 zona grande de fondo (\emph{el escritorio}), una barra abajo (\emph{barra de tareas}), un botón a la izquierda abajo (\emph{menú inicio}), un ícono de papelera, e \emph{íconos de programas o archivos}. Si no sabes el nombre técnico, describe lo que ves. Esta actividad recoge tu conocimiento previo --- no se vale ver la siguiente.

  checks:
  - Imaginé un escritorio de Windows.
  - Listé 5 elementos diferentes con descripción propia.
  - No miré la siguiente actividad ni busqué imágenes.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 5 elementos del escritorio». \textbf{Formato:} lista numerada del 1 al 5. \textbf{Extensión:} 5 líneas. \textbf{Sabes que terminaste cuando} tienes 5 cosas diferentes nombradas y descritas con tus palabras.

sistematizacion:
  intro: |-
    Lo que acabaste de listar son \textbf{los 5 elementos principales} del escritorio de un sistema operativo. Casi todos los SO de escritorio (Windows, macOS, Linux) tienen los mismos 5 elementos --- cambia el estilo, no la idea. Ahora vas a ponerles nombre técnico y entender qué hace cada uno.

  pilares:
  - |-
    \textbf{Elemento 1 --- El escritorio (\emph{desktop}).} Es el \textbf{fondo grande} que ves al encender. Como una mesa de trabajo: ahí puedes poner íconos de acceso rápido a los programas o archivos que usas a menudo. \emph{Función:} darte un lugar central donde dejar lo que necesitas a la mano. \textbf{Elemento 2 --- La barra de tareas (\emph{taskbar}).} La \textbf{tira horizontal abajo} (en Mac está arriba). Muestra las apps que tienes abiertas en este momento y te deja saltar entre ellas. \emph{Función:} ser el ``índice'' de los programas vivos. \textbf{Elemento 3 --- El menú inicio (\emph{start menu}).} El \textbf{botón Windows abajo-izquierda}. Te muestra todas las apps instaladas, el botón de apagar, búsqueda. \emph{Función:} ser la \emph{puerta principal} para encontrar cualquier cosa en tu computador.
  - |-
    \textbf{Elemento 4 --- Las ventanas.} Cuando abres un programa, aparece en un \textbf{rectángulo con barra arriba} que puedes mover, redimensionar, minimizar (esconder), maximizar (pantalla completa) o cerrar (X roja). \emph{Función:} permitir tener varios programas a la vez sin que se mezclen. \textbf{Elemento 5 --- La papelera de reciclaje.} El \textbf{ícono de papelera} en el escritorio. Cuando borras un archivo, va ahí primero (no se borra para siempre). Si te arrepientes, lo recuperas. Si vacías la papelera, ahí sí se pierde. \emph{Función:} darte una segunda oportunidad ante errores de borrado.
  - |-
    \textbf{Las 5 funciones del sistema operativo (lo que hace el gerente).} (1) \textbf{Coordina el hardware}: hace que el teclado, ratón, monitor y altavoces hablen con los programas. (2) \textbf{Gestiona archivos}: organiza dónde se guardan tus documentos y los encuentra cuando los necesitas. (3) \textbf{Ejecuta programas}: arranca, mantiene y cierra Word, Chrome, Roblox. (4) \textbf{Maneja usuarios}: si en tu casa varios usan el mismo PC, el SO separa los archivos de cada uno por cuenta. (5) \textbf{Controla la memoria}: decide cuánta RAM le da a cada programa abierto (más a Chrome, menos a la calculadora, por ejemplo).
  - |-
    \textbf{Los 5 SO más importantes que vas a encontrar.} (1) \textbf{Windows} (Microsoft): el más común en colegios y casas, fácil de usar. (2) \textbf{macOS} (Apple): elegante, caro, viene en MacBook. (3) \textbf{Linux} (gratuito): muchas versiones, usado en programadores y servidores; \emph{Ubuntu} es la más amigable. (4) \textbf{Android} (Google): el SO de la mayoría de celulares en Colombia. (5) \textbf{iOS} (Apple): el SO del iPhone. \emph{Pista:} no hay un SO ``mejor''. Hay el que te enseñaron a usar y el que pruebas nuevo. Cambiar de SO es como cambiar de barrio: al principio te confundes, después te acomodas.

  anatomia:
    titulo: 5 elementos del escritorio + 5 funciones del SO
    body: |-
      \textbf{Los 5 elementos visuales:} \\[1mm]
      escritorio · barra de tareas · menú inicio · ventanas · papelera. \\[1mm]
      \textbf{Las 5 funciones invisibles:} \\[1mm]
      coordina hardware · gestiona archivos · ejecuta programas · maneja usuarios · controla memoria.

  errores_comunes: |-
    \textbf{Confusiones que se repiten sobre el SO.} (1) \emph{``Windows es lo mismo que Microsoft Word''} --- Falso. Windows es el sistema operativo (gerente); Word es un programa (un trabajador). (2) \emph{``Si no tengo Windows, no puedo usar Word''} --- Hoy es falso: Word tiene versiones para Windows, Mac, Android, iOS y web. (3) \emph{``El SO se descarga gratis''} --- Depende. Windows cuesta dinero (licencia); Linux es gratis; macOS solo viene con Mac. (4) \emph{``Cuando borro un archivo, se va para siempre''} --- Falso si tiene papelera de reciclaje. Se borra para siempre solo cuando vacías la papelera. (5) \emph{``El SO no se actualiza, está siempre igual''} --- Falso. Los SO se actualizan cada cierto tiempo (Windows Update, actualizaciones de Android) para arreglar errores y agregar mejoras.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Los 5 elementos y las 5 funciones del SO». \textbf{Formato:} 2 tablas pequeñas. Tabla A (5 filas): nombre del elemento + función. Tabla B (5 filas): nombre de la función del SO + ejemplo concreto. \textbf{Extensión:} 10 filas en total. \textbf{Sabes que terminaste cuando} podrías explicar a un primo qué pasa en su computador cuando lo enciende.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tour anotado del SO + opinión personal} (30 min · individual o en parejas). Vas a hacer 3 cosas en una hoja completa del cuaderno: \textbf{(a)} dibujo del escritorio de Windows con los 5 elementos etiquetados; \textbf{(b)} tabla de 5 funciones del SO con ejemplos tuyos; \textbf{(c)} opinión escrita sobre el SO que más usas tú.

  pilares:
  - |-
    \textbf{Paso 1 --- Dibuja el escritorio (mitad superior).} Pon la hoja vertical. En la mitad superior dibuja un \textbf{rectángulo grande} (que ocupa casi toda la mitad) representando la pantalla del computador. Adentro dibuja: un \emph{fondo} con algún detalle (un sol, una montaña, un patrón --- como un wallpaper), \emph{3 íconos} de programas en el escritorio (Word, Chrome, una carpeta), \emph{una barra horizontal abajo} (barra de tareas) con 4 íconos más, \emph{un botón Windows} a la izquierda abajo, y un \emph{ícono de papelera} arriba a la derecha.
  - |-
    \textbf{Paso 2 --- Etiquetas con flechas.} Desde fuera del rectángulo, traza \textbf{5 flechas} apuntando a los 5 elementos del escritorio. Al final de cada flecha escribe el nombre técnico: \emph{``1. Escritorio (desktop)''}, \emph{``2. Íconos''}, \emph{``3. Barra de tareas''}, \emph{``4. Menú inicio (Windows)''}, \emph{``5. Papelera''}. Si quieres agregar una ventana abierta de un programa, también está bien (sería el elemento extra).
  - |-
    \textbf{Paso 3 --- Tabla de las 5 funciones (mitad inferior izquierda).} En la mitad inferior izquierda dibuja una tabla de \textbf{5 filas y 2 columnas}. Columna 1: nombre de la función. Columna 2: ejemplo concreto tuyo. Por ejemplo: \emph{``Coordina hardware --- Cuando muevo el ratón, el cursor se mueve en la pantalla.''}, \emph{``Gestiona archivos --- Cuando guardo el Word, va a la carpeta Documentos.''}, etc. Llena las 5 filas.
  - |-
    \textbf{Paso 4 --- Opinión personal (mitad inferior derecha).} En la mitad inferior derecha escribe un \textbf{párrafo de 5-6 líneas} respondiendo: \emph{``¿Cuál SO uso más yo? (Windows / Android / iOS / Linux / otro). ¿Qué me gusta? ¿Qué me cuesta? ¿He probado otro? Si pudiera probar uno nuevo, ¿cuál sería y por qué?''}. Sé honesto. Esta opinión es tuya, no hay respuesta correcta.
  - |-
    \textbf{Paso 5 --- Tour real (si tienes computador disponible).} Si en clase tienes acceso a un computador, abre Windows y verifica que sí están los 5 elementos donde dibujaste. Mueve una ventana, abrir y cerrar el menú inicio, abrir la papelera. Esto te confirma lo aprendido. Si no tienes computador hoy, hazlo en casa esta semana.
  - |-
    \textbf{Paso 6 --- Firma y cierre.} En la esquina inferior derecha firma con nombre completo y fecha. Escribe debajo: \emph{``Ahora sé qué hace el gerente invisible de mi computador.''}. Subraya esa frase.

  checklist:
    titulo: Antes de mostrar tu trabajo
    items: |-
      \checkbox La mitad superior tiene el dibujo del escritorio con sus 5 elementos etiquetados. \\[1mm]
      \checkbox La tabla de 5 funciones tiene un ejemplo concreto por cada una. \\[1mm]
      \checkbox La opinión personal tiene 5-6 líneas y responde las 4 preguntas. \\[1mm]
      \checkbox Está firmado con nombre y fecha. \\[1mm]
      \checkbox La frase de cierre está subrayada. \\[1mm]
      \checkbox Si tuve computador, verifiqué en vivo los 5 elementos.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Mitad superior:} dibujo del escritorio + 5 etiquetas con flechas. \textit{Mitad inferior izquierda:} tabla 5 × 2 (función + ejemplo). \textit{Mitad inferior derecha:} párrafo de opinión personal (5-6 líneas). \textit{Esquina inferior:} firma + frase subrayada.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Tour del sistema operativo». \textbf{Formato:} dibujo del escritorio + tabla de funciones + párrafo de opinión + firma. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} podrías mostrar la hoja a un familiar y él entendería qué hace el sistema operativo en el computador.

  producto_titulo: Tour anotado del SO con 5 elementos + 5 funciones + opinión personal · firmado
  criterios:
  - El dibujo del escritorio tiene los 5 elementos etiquetados con flechas.
  - La tabla de 5 funciones tiene ejemplos tuyos.
  - La opinión personal responde las 4 preguntas con honestidad.
  - El tour está firmado con nombre y fecha.
  - La frase de cierre está visible.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del trabajo y la coordinación)"
    cita: |-
      ``Cuando entiendes quién coordina, entiendes quién manda. Cuando entiendes quién manda, decides si lo aceptas.''
    aplicacion: |-
      El sistema operativo \emph{decide} cómo se ve tu pantalla, qué apps puedes usar, cómo se organizan los archivos. Cuando lo entiendes, te das cuenta de que \textbf{Windows no es la única forma}: hay Linux (gratis, abierto, donde tú decides), hay otros mundos. Conocer al gerente te permite preguntar: \emph{``¿qué gerente quiero que coordine mi máquina?''}. Esa pregunta es ejercicio de libertad.
    pregunta_espejo: |-
      ¿Uso el SO que me asignaron porque me lo asignaron, o ya he probado otro para decidir cuál prefiero?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Lo invisible es lo más importante. Lo que no se ve sostiene lo que se ve.''
    aplicacion: |-
      El sistema operativo es \textbf{invisible la mayor parte del tiempo}. No le ponemos atención porque funciona en silencio. Solo lo notamos cuando falla. \emph{Esto es como la salud, el aire, la familia que está atrás}: tan importantes que no se ven hasta que faltan. Aprender a notar lo invisible te entrena en gratitud y atención. El SO te lo enseña en pequeño.
    pregunta_espejo: |-
      ¿A qué cosas invisibles de mi vida les he dejado de poner atención porque ``siempre funcionan''?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la infraestructura digital)"
    cita: |-
      ``Los sistemas operativos no son neutros: cada uno propone un modo de habitar el mundo digital.''
    aplicacion: |-
      Cuando usas Windows, vives en un mundo que Microsoft ha diseñado: ese fondo, esa barra, esa lógica de archivos. Cuando usas Android, vives en otro mundo (de Google). Cuando usas iOS, en otro (de Apple). \textbf{Cada SO trae una filosofía}: cómo organizar las cosas, qué te ofrece de regalo y qué te cobra. Aprender a leer esas filosofías te hace ciudadano digital con criterio.
    pregunta_espejo: |-
      ¿Qué filosofía me está \emph{enseñando} el SO que más uso, sin que yo lo note?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, cuando uses tu computador (o el celular), observa: ¿qué está haciendo el SO en cada momento? ¿Cuándo notas su trabajo? La próxima clase aprenderás a \textbf{organizar archivos y carpetas}: el lado del SO que más vas a usar. Si dominas eso, dejarás de perder tus tareas en el desorden y serás más rápido en cualquier computador.

web:
  conceptos_clave:
    - termino: Sistema operativo (SO)
      definicion: |-
        El software más importante del computador. Es el "gerente" que coordina todo: hardware, programas, archivos, usuarios. Sin él, el computador no funciona como tal.
      ejemplo: |-
        Windows, macOS, Linux, ChromeOS son SO de computador. Android y iOS son SO de celular. Todos coordinan lo demás aunque luzcan distintos.
      emoji: "🎛️"
    - termino: Escritorio (desktop)
      definicion: |-
        El fondo grande que ves al encender el computador. Funciona como mesa de trabajo: ahí puedes poner íconos de acceso rápido a los programas y archivos que usas a menudo.
      ejemplo: |-
        Cuando enciendes Windows aparece una imagen de fondo (sol, montaña, etc.) y unos íconos arriba. Eso es el escritorio.
      emoji: "🖥️"
    - termino: Barra de tareas
      definicion: |-
        La tira horizontal (normalmente abajo) que muestra los programas que tienes abiertos en ese momento. Te permite saltar entre ellos con un clic.
      ejemplo: |-
        Si tienes Chrome y Word abiertos al tiempo, ves dos íconos en la barra de tareas. Al hacer clic en uno cambias de programa al instante.
      emoji: "📊"
    - termino: Menú inicio
      definicion: |-
        El botón Windows (abajo-izquierda) que abre una ventana con todas las apps instaladas, búsqueda y opción de apagar. Es la puerta principal del computador.
      ejemplo: |-
        Si quieres abrir un programa que no está en el escritorio, vas al menú inicio, lo buscas y haces clic. Más rápido si lo escribes y aparece sugerido.
      emoji: "🪟"
    - termino: Papelera de reciclaje
      definicion: |-
        El ícono de papelera donde van los archivos que borras. No se eliminan para siempre hasta que vacías la papelera. Es una segunda oportunidad ante errores.
      ejemplo: |-
        Borras por error tu tarea. Vas a la papelera, la encuentras, haces clic derecho y eliges "Restaurar". Vuelve a su lugar original.
      emoji: "🗑️"

  quiz:
    titulo: "¿Conoces el sistema operativo?"
    instrucciones: "5 preguntas para verificar que entiendes el gerente del computador y sus elementos."
    preguntas:
      - enunciado: "¿Cuál es la diferencia entre Windows y Microsoft Word?"
        opciones:
          - "Son lo mismo, solo cambia el nombre."
          - "Windows es el sistema operativo (gerente); Word es un programa (uno de los trabajadores)."
          - "Word es más importante que Windows."
          - "Ninguno es software."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Windows coordina todo el computador (es el gerente). Word es un programa específico para escribir (uno de los muchos trabajadores que Windows coordina).
        feedback_incorrecto: |-
          Windows es el sistema operativo (coordina todo el computador). Word es un programa que corre dentro de Windows. SO es más amplio que cualquier programa individual.
      - enunciado: "Borras tu archivo de tarea por error. ¿Se perdió para siempre?"
        opciones:
          - "Sí, los archivos borrados nunca vuelven."
          - "No, primero va a la papelera de reciclaje. Si no la vaciaste, puedes recuperarlo."
          - "Solo si reinicias el computador."
          - "Solo si el archivo era pequeño."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. La papelera de reciclaje es tu segunda oportunidad: el archivo está ahí hasta que vacíes la papelera o pasen muchos días.
        feedback_incorrecto: |-
          Va primero a la papelera. Si no la has vaciado, abrís la papelera, clic derecho en el archivo, "Restaurar" y vuelve a su lugar.
      - enunciado: "Tu mamá compra un computador Mac y tú estás acostumbrado a Windows. ¿Qué pasa?"
        opciones:
          - "No vas a poder usarlo, los Mac son totalmente distintos."
          - "Al principio te confundes, pero los conceptos son los mismos (escritorio, ventanas, archivos)."
          - "Tienes que aprender a programar para usarlo."
          - "El Mac no tiene escritorio."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Mac es un SO distinto (macOS) pero los conceptos son los mismos: escritorio, ventanas, archivos, papelera. Cambia el estilo, no la idea.
        feedback_incorrecto: |-
          Todos los SO de escritorio tienen los mismos conceptos. Cambia el estilo (Mac arriba, Windows abajo), no la idea. En 1 semana te acostumbras.
      - enunciado: "¿Cuál de estos NO es un sistema operativo?"
        opciones:
          - "Android."
          - "Windows."
          - "Microsoft Word."
          - "Linux."
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Microsoft Word es un programa para escribir. Android, Windows y Linux son sistemas operativos (coordinan todo el equipo).
        feedback_incorrecto: |-
          Microsoft Word no es SO; es un programa. SO: Android, Windows, Linux, macOS, iOS, ChromeOS. Word corre dentro de un SO.
      - enunciado: "Encender el computador tarda varios segundos antes de mostrar el escritorio. ¿Qué hace el computador en ese tiempo?"
        opciones:
          - "Está descansando."
          - "El SO está cargándose: prepara el hardware, los archivos, los programas, el escritorio. Eso toma tiempo."
          - "Espera órdenes del usuario."
          - "Verifica que tienes wifi."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. En esos segundos el SO carga drivers de hardware, prepara la memoria, organiza archivos y arma el escritorio. No es lento; está trabajando.
        feedback_incorrecto: |-
          El SO se está cargando: prepara hardware, archivos, programas y el escritorio. Por eso tarda unos segundos al encender. Es trabajo invisible pero necesario.

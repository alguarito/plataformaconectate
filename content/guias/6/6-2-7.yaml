clave: "2-7"
grado: 6
periodo: 2
sesion: 7
completo: true

titulo: "Archivos y carpetas --- ordenar mi biblioteca digital"
titulo_portada: |-
  Archivos y
  carpetas ---
  ordenar
  mi biblioteca
  digital

producto_final: |-
  Una \textbf{estructura personal de carpetas} dibujada en árbol (jerarquía) en una hoja del cuaderno, con \textbf{mínimo 4 niveles de profundidad}, \textbf{15 carpetas} bien nombradas y \textbf{10 archivos reales} (con su extensión) ubicados en la carpeta correcta. Más \textbf{una tabla de las 10 extensiones más comunes} (.docx, .jpg, .pdf, .mp4, .mp3, etc.) con qué significan. Firma: \emph{``Mis archivos están ordenados como en una biblioteca, no como en un caos.''}.

apertura:
  saber_ancestral: |-
    \textbf{Doña Elena trabajó 30 años como archivera del juzgado de Cartago.} En esa oficina llegaban cada día 50 expedientes, cartas, peticiones, sentencias. Si se mezclaban, una persona podía pasar meses sin que le respondieran un trámite. Doña Elena tenía un sistema: \textbf{archivadores de madera con etiquetas}, dentro de cada archivador \textbf{cajones} por tipo de caso, dentro de cada cajón \textbf{carpetas} por mes, dentro de cada carpeta \textbf{hojas numeradas} en orden cronológico. Si llegaba un abogado preguntando por \emph{``el expediente Martínez del 15 de marzo de 1995''}, doña Elena lo encontraba en menos de 2 minutos. \textbf{Su saber no era memoria, era organización}: cada cosa en su lugar, cada lugar con su nombre. Los abuelos en las casas hacían algo parecido con cajas de zapatos llenas de fotos: una por familia, una por viaje, una por niño. Hoy ese mismo sistema vive en tu computador: se llama \textbf{estructura de carpetas y archivos}. Aprenderlo te ahorra años de búsqueda perdida.

  saber_contemporaneo: |-
    Un \textbf{archivo} es una unidad de información digital: un documento de Word, una foto, una canción, un video, un PDF. Cada archivo tiene un \textbf{nombre} (la parte que tú escribes) y una \textbf{extensión} (las 3-4 letras después del punto). La extensión le dice al computador qué tipo de archivo es: \texttt{.docx} = Word, \texttt{.jpg} = foto, \texttt{.mp4} = video, \texttt{.pdf} = documento de lectura. Una \textbf{carpeta} es una caja virtual que guarda archivos (y también puede guardar otras carpetas adentro). Las carpetas se organizan en \emph{jerarquía}: como un árbol con tronco y ramas. Aprender a organizar bien es uno de los \textbf{4 hábitos más útiles} que adquieres en 6° grado: te ahorra tiempo, te quita estrés y te hace ver profesional cuando entregas trabajos.

  pregunta_puente: |-
    Tu tía te pide que le envíes \emph{``la foto de tu cumpleaños del año pasado''}. Si abres tu galería del celular y encuentras \textbf{4.000 fotos sin organizar}, ¿cuánto tardarías en encontrarla? ¿Y si las tuvieras en una carpeta llamada \emph{``2025-mi-cumpleaños''}?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} archivos por su extensión; (2) sabrás \textbf{explicar} la jerarquía de carpetas (árbol); (3) podrás \textbf{aplicar} 5 reglas de nombrado a tus carpetas; (4) habrás \textbf{creado} una estructura personal de organización con archivos ubicados.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas 10 archivos con sus extensiones, aprendes a armar carpetas en árbol, escribes las 5 reglas de nombrado, y dibujas tu árbol personal.
  a_escuta: |-
    Empezamos viendo 10 nombres de archivos para descifrar qué son por su extensión.
  a_sistematizacion: |-
    Después del juego, aprendes la estructura de árbol y las 5 reglas para nombrar bien.
  a_praxis: |-
    Con todo claro, diseñas tu árbol personal de carpetas con archivos reales.
  a_producto: |-
    El producto es ese árbol firmado + tabla de extensiones.
  a_evaluacion: |-
    Antes de salir, verificas que tu árbol tiene 4 niveles y que cada archivo está en la carpeta correcta.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué ordenar es un acto que te cuida en el futuro.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- ¿Qué archivo es?} (10 min · individual). En el cuaderno, lee estos 10 nombres de archivos y \textbf{adivina qué tipo de archivo es} y \textbf{para qué sirve}. La \emph{extensión} (las 3-4 letras después del punto) es la pista. \texttt{(1) tarea-historia.docx} · \texttt{(2) foto-perfil.jpg} · \texttt{(3) cancion-favorita.mp3} · \texttt{(4) video-cumpleaños.mp4} · \texttt{(5) presentacion-clase.pptx} · \texttt{(6) factura-internet.pdf} · \texttt{(7) hoja-calculo.xlsx} · \texttt{(8) carpeta-fotos.zip} · \texttt{(9) instalador-juego.exe} · \texttt{(10) notas.txt}. Si no conoces alguna extensión, intenta deducir por el contexto del nombre.

  checks:
  - Copié los 10 nombres con extensión.
  - Al lado de cada uno, escribí qué tipo es (Word, foto, audio, video, etc.).
  - Apliqué intuición; no busqué en internet.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 10 archivos por su extensión». \textbf{Formato:} lista numerada del 1 al 10 con archivo + tipo. \textbf{Extensión:} 10 líneas. \textbf{Sabes que terminaste cuando} tienes los 10 archivos clasificados por tu cuenta.

sistematizacion:
  intro: |-
    Lo que adivinaste son las \textbf{10 extensiones más comunes} que vas a ver en tu vida digital. Ahora vas a aprender qué significa cada una, cómo armar una estructura de carpetas, y las 5 reglas para nombrarlas bien.

  pilares:
  - |-
    \textbf{Las 10 extensiones más comunes.} \texttt{.docx} = documento de Word. \texttt{.pdf} = documento para leer (Adobe Reader). \texttt{.txt} = texto plano sin formato. \texttt{.jpg} y \texttt{.png} = fotos e imágenes (jpg ocupa menos, png tiene mejor calidad). \texttt{.gif} = imagen animada. \texttt{.mp3} = audio (canciones). \texttt{.mp4} y \texttt{.avi} = video. \texttt{.zip} y \texttt{.rar} = archivo comprimido (varias cosas en una caja). \texttt{.xlsx} = hoja de cálculo (Excel). \texttt{.pptx} = presentación (PowerPoint). \texttt{.exe} = programa que se instala (¡cuidado, solo de fuentes confiables!).
  - |-
    \textbf{La estructura de carpetas en árbol.} Imagina un árbol invertido. \textbf{La raíz} es la carpeta más alta: tu \emph{Documentos} o tu \emph{Mi PC}. De ahí salen \textbf{ramas} (subcarpetas) por temas: \emph{Colegio}, \emph{Familia}, \emph{Juegos}, \emph{Fotos}. Dentro de cada rama hay otras ramas más pequeñas: dentro de \emph{Colegio} podría haber \emph{Tecnología}, \emph{Matemáticas}, \emph{Sociales}. Y dentro de \emph{Tecnología} podría haber \emph{Periodo-1}, \emph{Periodo-2}. \textbf{La profundidad ideal} para 6° grado es de \emph{3 a 5 niveles}: ni muy plano (todo en una carpeta) ni muy profundo (te pierdes haciendo clic).
  - |-
    \textbf{Las 5 reglas de nombrado para no enredarte.} (1) \textbf{Usa palabras claras}: \emph{``tarea-historia''} es mejor que \emph{``hjfdksjf''}. (2) \textbf{Sin espacios, usa guion o guion bajo}: \emph{``mi-cumpleaños''} es mejor que \emph{``mi cumpleaños''} (algunos programas se enredan con espacios). (3) \textbf{Sin acentos ni ñ en el nombre}: aunque hoy funcionan, en algunos sistemas se rompen. \emph{``cumpleanos''} es más seguro que \emph{``cumpleaños''}. (4) \textbf{Pon fecha cuando aplique}: \emph{``2025-cumple''} es mejor que \emph{``cumple''} (después tendrás varios cumples). (5) \textbf{Nombra para tu yo de un año después}: pregúntate \emph{``¿yo el año entrante sabré qué hay en esta carpeta solo leyendo el nombre?''}. Si la respuesta es no, mejora el nombre.
  - |-
    \textbf{Errores frecuentes al organizar.} (1) \emph{``Guardo todo en el Escritorio''} --- termina como tu cuarto desordenado, no encuentras nada. (2) \emph{``Pongo nombres como tarea1, tarea2, tarea3''} --- después no sabes cuál era cuál. (3) \emph{``Borro la papelera cada día''} --- si te equivocas, no recuperas. (4) \emph{``Pongo todo en una sola carpeta''} --- pierdes 15 minutos para encontrar algo. (5) \emph{``No hago copia de seguridad''} --- el día que falle el disco, perdiste todo el año. Hacer copia en USB o en Drive cada semana te salva.

  anatomia:
    titulo: Las 5 reglas + las 10 extensiones
    body: |-
      \textbf{5 reglas de nombrado:} \\[1mm]
      \textbf{1.} Palabras claras (no códigos raros). \\[1mm]
      \textbf{2.} Sin espacios (usa guion). \\[1mm]
      \textbf{3.} Sin acentos ni ñ. \\[1mm]
      \textbf{4.} Pon fecha si aplica. \\[1mm]
      \textbf{5.} Piensa en tu yo de un año después. \\[1mm]
      \textbf{10 extensiones:} \\[1mm]
      .docx · .pdf · .txt · .jpg/.png · .mp3 · .mp4 · .zip · .xlsx · .pptx · .exe

  errores_comunes: |-
    \textbf{Mitos sobre archivos y carpetas que escucharás.} (1) \emph{``Si guardo todo en el escritorio, es más rápido''} --- Falso. Se vuelve un caos en 3 meses. (2) \emph{``El .exe siempre es seguro''} --- Falso. Los .exe pueden ser virus. Solo instala los de fuentes oficiales. (3) \emph{``Comprimir un archivo (.zip) lo daña''} --- Falso. Lo hace más pequeño sin perder información. (4) \emph{``Si borro algo del computador, también se borra del Drive''} --- Depende. Si está sincronizado, sí. Si solo es copia, no. Verifica antes. (5) \emph{``Los nombres largos son siempre malos''} --- Falso. Mejor un nombre largo claro que uno corto incomprensible.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Reglas de nombrado: bueno vs malo». \textbf{Formato:} 2 bloques. Bloque A: lista de las 5 reglas con un ejemplo bueno y uno malo. Bloque B: tabla de 10 filas con \emph{extensión + qué es + ejemplo de archivo}. \textbf{Veredicto (3 líneas):} mira el nombre que le pusiste a tu última tarea descargada (\emph{``Documento sin título (3).docx''}, \emph{``IMG\_28394.jpg''} o lo que sea). ¿Aprueba o reprueba según las 5 reglas? Justifica qué regla incumple y propón el nombre correcto. \textbf{Extensión:} 5 líneas + tabla + veredicto. \textbf{Sabes que terminaste cuando} puedes juzgar si un nombre de archivo está bien hecho sin pensar.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu árbol personal de carpetas} (28 min · individual). En una hoja completa del cuaderno vas a dibujar \textbf{tu estructura de carpetas} (en forma de árbol) con mínimo 4 niveles, 15 carpetas y 10 archivos reales tuyos. Esto será tu mapa para organizar tu computador o el celular.

  pilares:
  - |-
    \textbf{Paso 1 --- La raíz.} En la parte superior de la hoja escribe el título: \textbf{``Mi árbol de carpetas''} y debajo: \emph{``[Tu nombre], año 2026''}. En el centro arriba, dibuja un \textbf{ícono de carpeta grande} y escribe debajo: \texttt{Mis-documentos}. Esa es la raíz.
  - |-
    \textbf{Paso 2 --- Nivel 2: las 4 áreas principales.} Desde la raíz, traza \textbf{4 líneas hacia abajo} que terminen en 4 carpetas más pequeñas: \texttt{Colegio}, \texttt{Familia}, \texttt{Personal}, \texttt{Descargas}. Estas son las 4 áreas grandes de tu vida digital. Si tienes otras (por ejemplo, \emph{Música} o \emph{Juegos}), agrégalas.
  - |-
    \textbf{Paso 3 --- Nivel 3: subcarpetas dentro de cada área.} De \texttt{Colegio} traza líneas a: \texttt{Tecnologia}, \texttt{Matematicas}, \texttt{Sociales}. De \texttt{Familia} traza líneas a: \texttt{Fotos}, \texttt{Videos}. De \texttt{Personal} traza líneas a: \texttt{Cuaderno-digital}, \texttt{Apuntes}. De \texttt{Descargas} traza líneas a: \texttt{Pendientes-revisar}, \texttt{Archivados}.
  - |-
    \textbf{Paso 4 --- Nivel 4: subcarpetas más específicas.} De \texttt{Tecnologia} (Colegio) traza a: \texttt{Periodo-1}, \texttt{Periodo-2}, \texttt{Periodo-3}. De \texttt{Fotos} (Familia) traza a: \texttt{2024}, \texttt{2025}, \texttt{2026}. De \texttt{Pendientes-revisar} (Descargas) traza a: \texttt{Esta-semana}. Aquí ya tienes \textbf{4 niveles de profundidad}.
  - |-
    \textbf{Paso 5 --- Coloca 10 archivos reales.} En las hojas más profundas (los extremos del árbol) coloca \textbf{10 archivos} reales tuyos con su extensión, en la carpeta donde deberían vivir. Ejemplos: \texttt{tarea-historia-medios.docx} en \texttt{Tecnologia/Periodo-2}; \texttt{cumple-2025.jpg} en \texttt{Fotos/2025}; \texttt{cancion-favorita.mp3} en \texttt{Personal/Apuntes} (o donde quieras). \textbf{La idea es que cada archivo esté donde tú lo buscarías}.
  - |-
    \textbf{Paso 6 --- Firma y promesa.} En la esquina inferior derecha firma con nombre completo y fecha. Escribe la frase de cierre: \textbf{``Mis archivos están ordenados como en una biblioteca, no como en un caos.''}. Subráyala. Esta hoja la guardas como mapa: cuando crees una carpeta nueva, primero verificas dónde encaja en este árbol.

  checklist:
    titulo: Antes de mostrar tu árbol
    items: |-
      \checkbox La raíz (Mis-documentos) está arriba con su ícono. \\[1mm]
      \checkbox Hay 4 áreas en el nivel 2 (Colegio, Familia, Personal, Descargas o similares). \\[1mm]
      \checkbox Cada área tiene subcarpetas en nivel 3. \\[1mm]
      \checkbox Hay al menos 4 niveles de profundidad. \\[1mm]
      \checkbox Hay 10 archivos reales tuyos colocados en su carpeta correcta. \\[1mm]
      \checkbox Está firmado y la frase de cierre está subrayada.

  plantilla_guion: |-
    \textbf{Estructura del árbol.} \textit{Nivel 1 (raíz):} Mis-documentos. \textit{Nivel 2:} Colegio, Familia, Personal, Descargas. \textit{Nivel 3:} Tecnologia, Matematicas, Fotos, Videos, etc. \textit{Nivel 4:} Periodo-1, 2024, etc. \textit{Hojas:} archivos con extensión. \textit{Esquina:} firma + frase subrayada.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi árbol personal de carpetas». \textbf{Formato:} árbol jerárquico con 4 niveles, 15 carpetas, 10 archivos reales. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} cualquier archivo nuevo que crees el próximo mes \emph{sabrá dónde vivir} sin que tengas que pensarlo.

  producto_titulo: Árbol personal de carpetas (4 niveles, 15 carpetas, 10 archivos) · firmado
  criterios:
  - El árbol tiene una sola raíz en el nivel superior.
  - Hay 4 áreas en el nivel 2.
  - Hay subcarpetas en nivel 3 y 4.
  - 10 archivos están ubicados en la carpeta correcta con su extensión.
  - Está firmado y la frase de cierre está visible.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del cuidado del propio trabajo)"
    cita: |-
      ``El orden no es una virtud burguesa: es un acto de cuidado hacia el propio trabajo.''
    aplicacion: |-
      Algunas personas creen que \emph{``ser ordenado es cosa de obsesivos''}. Es al revés: ser ordenado es \textbf{respetar tu propio trabajo}. Cuando ordenas tus archivos, le estás diciendo a tu yo de mañana: \emph{``el trabajo que hago hoy importa, lo cuido para que mañana lo encuentre''}. Doña Elena, la archivera, no era obsesiva: era profesional. Tú con tus archivos haces lo mismo.
    pregunta_espejo: |-
      ¿Cuido mi trabajo digital como cuido las cosas que valoro físicamente?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Cada cosa en su lugar; cada lugar con su propósito. Eso da paz al espíritu.''
    aplicacion: |-
      Cuando todo está en su lugar, \textbf{no tienes que pensar dónde está}. Te concentras en hacer las cosas, no en buscarlas. \emph{El orden ahorra energía mental}. Cuando todo está revuelto, gastas atención en buscar; cuando todo está organizado, gastas atención en crear. La diferencia, sumada a lo largo del año, son días enteros de tu vida.
    pregunta_espejo: |-
      ¿Cuánto tiempo gasto buscando archivos perdidos cada semana? ¿Qué haría con ese tiempo si lo ahorrara?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la información)"
    cita: |-
      ``Quien organiza la información, gobierna su vida. Quien no, vive a merced del caos digital.''
    aplicacion: |-
      Hoy producimos más información que nunca: \emph{fotos, videos, documentos, audios, descargas}. \textbf{Quien sabe organizarla está en ventaja sobre quien no}: encuentra rápido, comparte cuando le piden, no pierde lo importante. Aprender a organizar archivos no es lujo, es habilidad de supervivencia digital. Tu árbol de hoy es el primer paso para ser de los que organizan.
    pregunta_espejo: |-
      ¿Estoy gobernando mi información o me está gobernando ella a mí (en forma de caos)?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, en el computador o celular, crea 3 carpetas siguiendo las 5 reglas de nombrado. Sube 5 archivos a las carpetas correctas. La próxima clase aprendes \textbf{mantenimiento del computador}: cómo cuidar el equipo para que dure años, no meses. Hoy organizaste lo de adentro; la próxima ves cómo cuidar el equipo por dentro y por fuera.

web:
  conceptos_clave:
    - termino: Archivo
      definicion: |-
        Unidad de información digital. Un documento de Word, una foto, una canción, un video, un PDF. Cada archivo tiene un nombre y una extensión (las letras después del punto).
      ejemplo: |-
        "tarea-historia.docx" es un archivo. "docx" es la extensión que dice al computador que es un documento de Word.
      emoji: "📄"
    - termino: Carpeta
      definicion: |-
        Una "caja virtual" que guarda archivos y otras carpetas adentro. Sirve para organizar la información por tema o categoría. Las carpetas se organizan en árbol jerárquico.
      ejemplo: |-
        Carpeta "Colegio" tiene adentro "Tecnologia", "Matematicas" y "Sociales". Cada una tiene sus propios archivos.
      emoji: "📁"
    - termino: Extensión
      definicion: |-
        Las 3-4 letras después del punto en el nombre del archivo. Le dice al computador qué tipo de archivo es y con qué programa debe abrirlo.
      ejemplo: |-
        ".docx" = Word, ".jpg" = foto, ".mp4" = video, ".pdf" = lectura, ".zip" = comprimido. Si cambias la extensión sin saber, dañas el archivo.
      emoji: "🏷️"
    - termino: Jerarquía de carpetas (árbol)
      definicion: |-
        La forma en que se organizan las carpetas: una raíz general en lo alto, ramas (subcarpetas) por tema, hojas (más subcarpetas o archivos) en los extremos. Se llama árbol porque parece uno invertido.
      ejemplo: |-
        Mis-documentos → Colegio → Tecnologia → Periodo-2 → tarea-historia.docx. Eso son 4 niveles de profundidad.
      emoji: "🌳"
    - termino: Reglas de nombrado
      definicion: |-
        Las 5 reglas para nombrar archivos y carpetas: palabras claras, sin espacios (usa guion), sin acentos ni ñ, con fecha si aplica, pensando en tu yo del próximo año.
      ejemplo: |-
        Bien: "2026-tarea-historia.docx". Mal: "tarea final del año hjfdks.docx". El primero dice exactamente qué es y cuándo.
      emoji: "✍️"

  quiz:
    titulo: "¿Sabes organizar tus archivos?"
    instrucciones: "5 preguntas para verificar que dominas archivos, carpetas y extensiones."
    preguntas:
      - enunciado: "Te llega un archivo llamado 'instalador-juego.exe'. ¿Qué deberías hacer?"
        opciones:
          - "Abrirlo de una porque dice 'juego'."
          - "Borrarlo de una, todos los .exe son virus."
          - "Verificar que viene de una fuente oficial confiable. Los .exe pueden ser virus."
          - "Renombrarlo a .docx para que sea seguro."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Los .exe instalan programas, así que pueden ser virus. Solo abre los que vengan de páginas oficiales del fabricante.
        feedback_incorrecto: |-
          Los .exe pueden ser virus. Solo abre los de fuentes oficiales (página del fabricante). Nunca de correos extraños o links sospechosos.
      - enunciado: "¿Cuál es el mejor nombre para una carpeta?"
        opciones:
          - "x1"
          - "2025-mi-cumple"
          - "Mi cumpleaños del año pasado"
          - "kjfhjksdf"
        respuesta_index: 1
        feedback_correcto: |-
          Bien. "2025-mi-cumple" cumple las 5 reglas: claro, sin espacios, sin acentos, con fecha, y tu yo del futuro lo entiende.
        feedback_incorrecto: |-
          "2025-mi-cumple" es el mejor: claro, sin espacios, con fecha. "x1" no dice nada; "kjfhjksdf" tampoco; con espacios algunos programas se enredan.
      - enunciado: "Borraste un archivo importante. ¿Qué haces?"
        opciones:
          - "Abro la papelera de reciclaje, busco el archivo, clic derecho, 'Restaurar'."
          - "Lloro, ya no se recupera."
          - "Reinicio el computador y vuelve."
          - "Cambio la extensión del archivo."
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. La papelera es tu segunda oportunidad. Mientras no la hayas vaciado, el archivo sigue ahí y se recupera con 'Restaurar'.
        feedback_incorrecto: |-
          Va a la papelera de reciclaje. Si no la has vaciado, el archivo está ahí. Clic derecho + 'Restaurar' lo devuelve a su lugar.
      - enunciado: "Quieres comprimir 20 fotos del cumpleaños en una sola caja para enviarla por correo. ¿Qué extensión usas?"
        opciones:
          - ".jpg"
          - ".docx"
          - ".mp4"
          - ".zip"
        respuesta_index: 3
        feedback_correcto: |-
          Sí. El .zip comprime varias cosas en una sola caja. Es más fácil enviar 1 archivo .zip que 20 .jpg sueltas.
        feedback_incorrecto: |-
          El .zip junta y comprime varios archivos en uno solo. Ideal para enviar muchas cosas en un solo correo o mensaje.
      - enunciado: "Tu árbol de carpetas tiene 3 niveles. ¿Está bien organizado?"
        opciones:
          - "Depende. La profundidad ideal es 3-5 niveles. Muy poco = todo amontonado; muy mucho = te pierdes."
          - "Sí, 3 niveles es mucho."
          - "Solo 1 nivel es mejor."
          - "Mínimo 10 niveles, sino no sirve."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. La profundidad ideal es 3-5 niveles. Muy plano (1-2) amontona todo. Muy profundo (6+) te enredas al buscar. 3-5 es lo óptimo.
        feedback_incorrecto: |-
          Lo ideal es 3-5 niveles. Plano amontona todo en una sola carpeta. Muy profundo te hace dar muchos clics para encontrar algo. Equilibrio.

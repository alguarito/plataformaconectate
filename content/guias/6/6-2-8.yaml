clave: "2-8"
grado: 6
periodo: 2
sesion: 8
completo: true

titulo: "Mantenimiento básico --- cuidar el computador como cuida el relojero"
titulo_portada: |-
  Mantenimiento
  básico ---
  cuidar el
  equipo como
  el relojero

producto_final: |-
  Un \textbf{plan personal de mantenimiento} en una hoja del cuaderno con: \textbf{(a) tabla de 10 acciones de mantenimiento} clasificadas en \emph{físicas} (limpieza, ubicación, cables) y \emph{digitales} (actualizar, antivirus, papelera, copia de seguridad), \textbf{(b) calendario} con frecuencia recomendada (\emph{diaria, semanal, mensual, semestral}), y \textbf{(c) 3 acciones ejecutadas hoy en clase} con su evidencia en el cuaderno (qué hiciste, antes/después).

apertura:
  saber_ancestral: |-
    \textbf{Don Lucho el relojero limpiaba cada engranaje con paciencia y aceite especial.} Si entrabas a su vitrina de la calle 14 en Cartago, no veías solo herramientas: veías \textbf{frascos pequeños de aceite}, \textbf{paños de gamuza}, un \textbf{cepillito suave de pelo de camello} para limpiar piezas diminutas. Cuando una persona le traía un reloj que se atrasaba, lo primero que hacía don Lucho \textbf{no era cambiar pieza}: era \textbf{limpiarlo}. La mayoría de las veces, el reloj se atrasaba por polvo o aceite seco en los engranajes. \emph{``Mantenimiento, mijo, eso es lo que falta. Un reloj limpio dura toda la vida.''}, decía. Las personas que confiaban en don Lucho conservaban sus relojes 30, 40 años. Los que se los compraban a vendedores de la calle y nunca los limpiaban los gastaban en 2 años. \textbf{La diferencia no era la calidad del reloj; era el cuidado}. Los computadores funcionan igual. Un equipo \emph{mantenido} dura el doble que uno \emph{usado y nada más}.

  saber_contemporaneo: |-
    \textbf{Mantenimiento} es el conjunto de acciones que haces para que tu computador (o celular) dure más tiempo, funcione más rápido, y se enferme menos. Hay 2 tipos. \textbf{Mantenimiento físico}: cuidar el hardware (limpieza, ubicación, manejo de cables, ventilación). \textbf{Mantenimiento digital}: cuidar el software (actualizaciones, antivirus, vaciar papelera, hacer copias de seguridad). Las dos son igual de importantes: si solo cuidas lo físico, tus archivos se corrompen; si solo cuidas lo digital, el hardware se ensucia y se calienta. \textbf{Lo bueno es que no toma mucho tiempo}: con 30 minutos al mes y 5 minutos al día, mantienes tu equipo en buen estado. Quien aprende esto en 6° grado se ahorra problemas serios en los próximos 10 años.

  pregunta_puente: |-
    Tu computador del año pasado funcionaba rápido y ahora se demora una eternidad en abrir. \textbf{¿Por qué pasa eso}? ¿Se dañó el equipo o hay algo que dejaste de hacer?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} 10 acciones de mantenimiento; (2) sabrás \textbf{aplicar} la frecuencia adecuada a cada una (diaria, semanal, mensual, semestral); (3) habrás \textbf{ejecutado} 3 acciones en clase; (4) podrás \textbf{evaluar} si un computador está bien mantenido o no.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: clasificas 15 acciones, aprendes el calendario, ejecutas 3 acciones en clase, y armas tu plan personal.
  a_escuta: |-
    Empezamos clasificando 15 acciones en físicas y digitales.
  a_sistematizacion: |-
    Después aprendes las 10 acciones esenciales con su frecuencia.
  a_praxis: |-
    Con el calendario claro, haces 3 acciones reales en clase y armas tu plan personal.
  a_producto: |-
    El producto es ese plan firmado + las 3 acciones ejecutadas con evidencia.
  a_evaluacion: |-
    Antes de salir, verificas que tu plan tenga las 10 acciones con su frecuencia.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué el mantenimiento es un acto de respeto al futuro.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Clasifica 15 acciones} (10 min · individual). En el cuaderno dibuja 2 columnas: \textbf{FÍSICAS} y \textbf{DIGITALES}. Después clasifica estas 15 acciones de mantenimiento en alguna de las 2: \emph{(1) limpiar la pantalla con paño suave; (2) actualizar Windows; (3) vaciar la papelera de reciclaje; (4) sacar el polvo del teclado con aire comprimido; (5) instalar un antivirus; (6) desconectar el cable de poder antes de mover el equipo; (7) hacer copia de seguridad en USB o Drive; (8) limpiar las pelusas del mouse; (9) cerrar programas que no usas; (10) ubicar el computador lejos del sol directo; (11) borrar archivos temporales; (12) ordenar los cables con velcro o canaleta; (13) escanear el disco con antivirus; (14) abrir el gabinete cada año para soplar polvo; (15) hacer mantenimiento del sistema (limpiador de Windows)}. Aplica la regla: \emph{si se hace con las manos (físico) o con clics (digital)}.

  checks:
  - Dibujé las 2 columnas en el cuaderno.
  - Clasifiqué las 15 acciones en una columna cada una.
  - Usé la regla del cuerpo (físico) vs los clics (digital).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 15 acciones de mantenimiento». \textbf{Formato:} tabla de 2 columnas. \textbf{Extensión:} 15 acciones distribuidas. \textbf{Sabes que terminaste cuando} cada acción tiene su columna y la puedes explicar.

sistematizacion:
  intro: |-
    Ya las clasificaste. Ahora aprende las \textbf{10 acciones esenciales} (5 físicas + 5 digitales) con la \textbf{frecuencia} con que se hacen. Hacer cada cosa en su momento te ahorra problemas grandes.

  pilares:
  - |-
    \textbf{Las 5 acciones físicas esenciales.} (1) \textbf{Limpieza de pantalla y teclado --- semanal.} Paño de microfibra húmedo (no mojado), nunca limpiavidrios directo. Para el teclado, aire comprimido o soplar fuerte. (2) \textbf{Ubicación correcta --- siempre.} Lejos del sol directo (calienta), lejos del agua (corto circuito), en superficie firme (no la cama, ahoga ventiladores), con espacio atrás (15 cm) para que ventile. (3) \textbf{Manejo de cables --- mensual.} Que no estén enredados ni en el piso a que los pateen. Usar velcro o canaleta. Desconectar antes de mover. (4) \textbf{Apagar correctamente --- diario.} Nunca apagar con el botón de fuerza: usar el menú \emph{Apagar}. Si no, el SO no cierra bien y se corrompen archivos. (5) \textbf{Limpieza interna del gabinete --- semestral.} Cada 6 meses, con un técnico o un adulto, soplar el polvo de los ventiladores. El polvo acumulado calienta y daña.
  - |-
    \textbf{Las 5 acciones digitales esenciales.} (1) \textbf{Actualizar el SO y los programas --- mensual.} Windows Update, App Store, Play Store. Las actualizaciones arreglan errores y cierran agujeros de seguridad. (2) \textbf{Tener antivirus activo --- siempre.} Windows tiene \emph{Defender} integrado y es bueno. Escanear el disco completo \emph{una vez al mes}. (3) \textbf{Vaciar papelera de reciclaje --- semanal.} Verifica que no hay nada importante y haz clic derecho \emph{``Vaciar papelera''}. Libera espacio en el disco. (4) \textbf{Limpiar archivos temporales --- mensual.} Windows acumula \emph{cachés} de programas que ya no usas. Hay herramientas (\emph{Liberador de espacio}, \emph{Storage Sense}) que limpian. (5) \textbf{Copia de seguridad (\emph{backup}) --- semanal.} Copia tus archivos importantes (tareas, fotos, videos) en una memoria USB o en la nube (OneDrive, Google Drive). \textbf{Esta es la más importante}. El día que falle el disco, te salvará.
  - |-
    \textbf{Calendario rápido del mantenimiento.} \textbf{Diario:} apagar correctamente, cerrar programas que no uses. \textbf{Semanal:} limpiar pantalla y teclado, vaciar papelera, hacer copia de seguridad. \textbf{Mensual:} actualizar SO y programas, escanear con antivirus, limpiar archivos temporales, revisar cables. \textbf{Semestral:} limpieza interna del gabinete (con adulto o técnico), revisión general del equipo, ordenar archivos.
  - |-
    \textbf{4 errores de mantenimiento que matan computadores.} (1) \emph{Tener el portátil en la cama o cojín} --- ahoga la ventilación; el equipo se calienta y se daña en 1 año. (2) \emph{Comer encima del teclado} --- migas + bebida = teclas pegadas + corto. (3) \emph{No hacer copia de seguridad} --- un disco que falla = año escolar perdido si no hubo copia. (4) \emph{Instalar programas de páginas raras} --- llenan el equipo de virus que lo dejan lento o lo dañan. Reglas opuestas: superficie firme, comer aparte, copiar todo lo importante, solo páginas oficiales.

  anatomia:
    titulo: 10 acciones esenciales + calendario
    body: |-
      \textbf{Físicas (5):} pantalla/teclado · ubicación · cables · apagar bien · soplar gabinete. \\[1mm]
      \textbf{Digitales (5):} actualizar · antivirus · papelera · temporales · copia de seguridad. \\[1mm]
      \textbf{Calendario:} diario, semanal, mensual, semestral.

  errores_comunes: |-
    \textbf{Mitos sobre mantenimiento que escucharás.} (1) \emph{``Si el equipo va bien, no hay que hacer nada''} --- Falso. El mantenimiento previene, no espera daños. (2) \emph{``El antivirus consume RAM, mejor no lo usar''} --- Falso. Sin antivirus en 1 mes te entran 20 virus. (3) \emph{``Apagar y prender mil veces lo daña''} --- Cierto solo si apagas por fuerza. Apagar correctamente desde el menú es lo normal. (4) \emph{``Si tengo papelera grande, voy a perder archivos''} --- Falso. La papelera retiene hasta que la vacías. (5) \emph{``El backup es para empresas''} --- Falso. El backup es la diferencia entre perder tu año o no.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Las 10 acciones con su calendario». \textbf{Formato:} tabla de 10 filas, 3 columnas. Columna 1: acción. Columna 2: ¿física o digital? Columna 3: ¿con qué frecuencia? (diaria/semanal/mensual/semestral). \textbf{Extensión:} 10 filas. \textbf{Sabes que terminaste cuando} podrías decirle a tu mamá qué hacer este sábado en su computador.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Plan personal + 3 acciones ejecutadas} (30 min · individual o parejas). Vas a hacer 2 cosas. Primero, escribir tu \textbf{plan personal de mantenimiento} en el cuaderno. Después, \textbf{ejecutar 3 acciones reales} hoy en clase (si tienes computador disponible) o anotarlas para hacer en casa (si no).

  pilares:
  - |-
    \textbf{Paso 1 --- Título y encabezado.} En la parte superior de la hoja escribe: \textbf{``Mi plan de mantenimiento''} y debajo: \emph{``[Tu nombre], año 2026''}. Subraya el título.
  - |-
    \textbf{Paso 2 --- Tabla de las 10 acciones (mitad superior).} Reproduce la tabla de la Actividad 2 pero con \emph{detalle propio}: en una nueva columna añade \emph{``cuándo la voy a hacer yo''} (por ejemplo: \emph{``los sábados en la mañana''}, \emph{``el primer domingo de cada mes''}). Esto convierte el conocimiento en compromiso real con tiempos asignados.
  - |-
    \textbf{Paso 3 --- Las 3 acciones de hoy (mitad inferior izquierda).} Escoge 3 acciones que vas a \emph{ejecutar hoy} (si tienes computador en clase o si no, las anotas para ejecutar en casa esta semana). Recomendadas: \emph{(a) Vaciar papelera de reciclaje, (b) Actualizar 1 programa, (c) Hacer 1 copia de seguridad pequeña (5-10 archivos al Drive o USB)}.
  - |-
    \textbf{Paso 4 --- Ejecuta las 3 acciones (si hay computador).} Para cada una: \emph{abre el programa o configuración}, \emph{realiza la acción}, \emph{escribe en el cuaderno qué hiciste y qué cambió}. Por ejemplo: \emph{``(a) Vacié papelera: tenía 25 archivos. Liberé 80 MB. La papelera ahora está vacía.''}.
  - |-
    \textbf{Paso 5 --- Evidencia (mitad inferior derecha).} En la mitad inferior derecha haz una tabla de \emph{3 filas y 3 columnas}: \emph{Acción}, \emph{Antes}, \emph{Después}. Llena las 3 con lo que ejecutaste (o lo que te propones ejecutar en casa). Si no tuviste equipo, escribe lo que vas a hacer en detalle.
  - |-
    \textbf{Paso 6 --- Firma y promesa.} En la esquina inferior derecha firma con nombre y fecha. Debajo, escribe la frase: \textbf{``Cuido mi computador como don Lucho cuidaba sus relojes.''}. Subráyala. La hoja la guardas como tu plan permanente.

  checklist:
    titulo: Antes de mostrar tu plan
    items: |-
      \checkbox La tabla de 10 acciones tiene la frecuencia y mi compromiso de cuándo. \\[1mm]
      \checkbox Escogí 3 acciones para ejecutar hoy o esta semana. \\[1mm]
      \checkbox La tabla de evidencia (acción/antes/después) tiene 3 filas. \\[1mm]
      \checkbox La frase de cierre está subrayada. \\[1mm]
      \checkbox Está firmado con nombre y fecha. \\[1mm]
      \checkbox Si tuve computador, ejecuté al menos una acción de verdad.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Arriba:} título + nombre. \textit{Mitad superior:} tabla 10 × 4 (acción, físico/digital, frecuencia, cuándo lo haré). \textit{Mitad inferior izquierda:} las 3 acciones de hoy listadas. \textit{Mitad inferior derecha:} tabla evidencia 3 × 3 (acción, antes, después). \textit{Esquina:} firma + frase subrayada.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi plan de mantenimiento + 3 acciones». \textbf{Formato:} plan completo en una hoja con 3 secciones (calendario, acciones, evidencia). \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} si alguien te pregunta \emph{``¿cuándo le toca limpieza al equipo?''}, lo ves rápido en tu hoja.

  producto_titulo: Plan personal de mantenimiento + 3 acciones ejecutadas · firmado
  criterios:
  - El plan tiene las 10 acciones con frecuencia y compromiso de cuándo.
  - Están las 3 acciones del día listadas.
  - La tabla de evidencia tiene antes/después por cada acción.
  - El plan está firmado y fechado.
  - La frase de cierre está subrayada.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del cuidado de los bienes comunes)"
    cita: |-
      ``Cuidar lo que tienes es resistirte a la lógica del desecho.''
    aplicacion: |-
      Hay una idea moderna que dice: \emph{``si se daña, lo cambio''}. Pero los computadores son caros y los recursos del planeta son finitos. \textbf{Cuidar el equipo es una resistencia consciente}: respetas el trabajo de quien lo fabricó, el dinero de tus papás que lo compraron, y el planeta que dio los materiales. \emph{Don Lucho mantenía cada reloj durante décadas}. Ese saber es de profundo respeto al trabajo y a la tierra.
    pregunta_espejo: |-
      ¿Trato mis cosas como bienes que duran o como objetos desechables?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``El que cuida lo pequeño cada día, evita lo grande mañana.''
    aplicacion: |-
      \textbf{30 minutos al mes de mantenimiento te ahorran 3 días enteros de problemas} al año. Pero pocos lo hacen porque parece \emph{``aburrido''}. El sabio sabe que la disciplina pequeña genera resultados grandes. Limpiar el teclado el sábado en la mañana mientras escuchas música no es perder el tiempo: es invertirlo en tu yo del futuro.
    pregunta_espejo: |-
      ¿Qué pequeña acción de mantenimiento estoy postergando que después se convertirá en un problema grande?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la sostenibilidad digital)"
    cita: |-
      ``El equipo bien cuidado consume menos energía, dura más, y deja menos huella en el planeta.''
    aplicacion: |-
      Un computador que vive 8 años es \textbf{el doble de sostenible} que uno que vive 4. Cuidar tu equipo no es solo ahorrar dinero: es \emph{respetar la huella ecológica de la tecnología}. Cada equipo nuevo gasta agua, energía y minerales. Si mantienes el tuyo, evitas esa producción extra. \emph{Mantenimiento es ambientalismo en pequeño}.
    pregunta_espejo: |-
      ¿Cómo se vería el mundo si todos cuidáramos nuestros equipos al doble del tiempo?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, ejecuta al menos 2 acciones de mantenimiento en tu equipo (o el de tu casa). Anota en el cuaderno qué hiciste y qué cambió. La próxima clase aprenderemos sobre \textbf{postura, ergonomía y vida útil}: cómo cuidarte TÚ mientras usas el computador, no solo cuidar al equipo. Si cuidas las 2 cosas, la relación con la tecnología es larga y sana.

web:
  conceptos_clave:
    - termino: Mantenimiento físico
      definicion: |-
        El cuidado del hardware del computador: limpieza de pantalla y teclado, ventilación, ubicación, manejo de cables, apagado correcto. Se hace con las manos y herramientas físicas.
      ejemplo: |-
        Limpiar la pantalla con paño microfibra cada semana, soplar el polvo del teclado, mantener el equipo lejos del sol directo. Eso es mantenimiento físico.
      emoji: "🧹"
    - termino: Mantenimiento digital
      definicion: |-
        El cuidado del software: actualizar el sistema operativo y programas, mantener antivirus activo, vaciar papelera, limpiar archivos temporales, hacer copias de seguridad. Se hace con clics en el computador.
      ejemplo: |-
        Actualizar Windows cada mes, hacer copia de tus fotos al OneDrive cada semana, vaciar papelera. Eso es mantenimiento digital.
      emoji: "🔧"
    - termino: Copia de seguridad (backup)
      definicion: |-
        Una segunda versión de tus archivos importantes guardada en otro lugar (memoria USB, disco externo, nube). Si el disco principal falla, los archivos siguen vivos en la copia. Es la acción más importante de mantenimiento digital.
      ejemplo: |-
        Cada domingo copias tus tareas y fotos del mes a una memoria USB o las subes a Google Drive. El día que el disco se dañe, no pierdes nada.
      emoji: "💾"
    - termino: Actualización (update)
      definicion: |-
        Una versión nueva del sistema operativo o de un programa que corrige errores, cierra agujeros de seguridad y añade mejoras. Las actualizaciones son gratis y se hacen mensualmente.
      ejemplo: |-
        Windows Update en computador, App Store en celular, Play Store en Android. Cuando aparece "actualizar disponible", lo aceptas: estás cerrando vulnerabilidades.
      emoji: "🔄"
    - termino: Antivirus
      definicion: |-
        Programa que vigila tu computador para detectar y eliminar virus y software malicioso. Windows tiene Defender integrado que es bueno. Importante: escanear el disco completo al menos una vez al mes.
      ejemplo: |-
        Si te llega un archivo extraño por correo, el antivirus lo escanea antes de abrirlo. Si está infectado, lo bloquea o lo elimina sin que tú tengas que hacer nada.
      emoji: "🛡️"

  quiz:
    titulo: "¿Sabes mantener tu computador?"
    instrucciones: "5 preguntas para verificar que dominas las acciones esenciales y su frecuencia."
    preguntas:
      - enunciado: "¿Cuál es la acción de mantenimiento MÁS importante?"
        opciones:
          - "Limpiar la pantalla cada día."
          - "Hacer copia de seguridad de tus archivos importantes."
          - "Cambiar el wallpaper cada semana."
          - "Apagar el computador cada hora."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La copia de seguridad es la más importante. Si el disco falla y no hiciste backup, perdiste todo el año escolar.
        feedback_incorrecto: |-
          La copia de seguridad (backup) es la más crítica. El disco se puede dañar cualquier día; si tienes copia, no pierdes nada.
      - enunciado: "Apagar el computador presionando el botón de fuerza, ¿qué pasa?"
        opciones:
          - "Es lo mismo que apagar normalmente."
          - "Es mejor, ahorra electricidad."
          - "El SO no cierra bien y se pueden corromper archivos. Solo hacerlo en emergencia."
          - "El equipo se reinicia automáticamente."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Apagar por fuerza interrumpe al SO. Si lo haces seguido, los archivos se corrompen. Apagar desde el menú es la regla.
        feedback_incorrecto: |-
          Apagar por fuerza solo en emergencia. El SO no termina de guardar y los archivos se corrompen. Apagar normal es desde el menú.
      - enunciado: "Tu computador se calienta mucho cuando lo usas en la cama. ¿Por qué?"
        opciones:
          - "Es normal, todos los computadores calientan."
          - "La cama ahoga la ventilación. Hay que ponerlo en superficie firme con espacio para que ventile."
          - "Le falta antivirus."
          - "Está dañado, hay que cambiarlo."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La cama o el cojín tapan las salidas de aire de la ventilación. El equipo se calienta y se daña. Mesa firme + 15 cm atrás.
        feedback_incorrecto: |-
          La cama ahoga la ventilación. El portátil se calienta y se daña con el tiempo. Siempre en mesa firme con espacio detrás para ventilar.
      - enunciado: "Cuándo debes hacer copia de seguridad de tus archivos?"
        opciones:
          - "Cuando se dañe el disco."
          - "Cada semana, antes de que algo malo pase."
          - "Una vez al año, suficiente."
          - "Nunca, mis archivos no son importantes."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Cada semana. Si esperas a que falle el disco, ya es tarde. La copia es prevención, no rescate.
        feedback_incorrecto: |-
          Cada semana. Si esperas a que algo se dañe, ya perdiste todo. Backup semanal te salva del 100% de los disgustos.
      - enunciado: "Tu mamá dice 'el antivirus consume RAM, mejor lo desinstalo'. ¿Qué le respondes?"
        opciones:
          - "Tiene razón, sin antivirus va más rápido."
          - "Sin antivirus en 1 mes te entran 20 virus. Mejor mantenerlo y limpiarlo en cambio."
          - "Da lo mismo, los virus ya no existen."
          - "Mejor instalo 3 antivirus, así protege más."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Sin antivirus es mucho peor. Y solo se usa UNO; varios chocan. Windows Defender es bueno y ya viene incluido.
        feedback_incorrecto: |-
          Sin antivirus el equipo se llena de virus rápido. Solo un antivirus a la vez (Windows Defender viene incluido y es bueno).

clave: "2-9"
grado: 6
periodo: 2
sesion: 9
completo: true

titulo: "Postura y vida útil --- cuidarte tú mientras usas la máquina"
titulo_portada: |-
  Postura
  y vida útil ---
  cuidarte tú
  mientras
  usas el equipo

producto_final: |-
  Una \textbf{auditoría de tu propio puesto de trabajo} en el cuaderno: \textbf{(a) dibujo de cómo TE SIENTAS HOY} cuando usas el computador (sé honesto), con anotaciones de qué está bien y qué está mal; \textbf{(b) dibujo de la postura ideal} con etiquetas de los 8 puntos clave (espalda, hombros, codos, muñecas, mirada, distancia, iluminación, pies); \textbf{(c) lista de 5 ajustes concretos} que vas a hacer en tu puesto esta semana. Más \textbf{una promesa firmada} de aplicar la regla \emph{``20-20-20''} todos los días.

apertura:
  saber_ancestral: |-
    \textbf{Don Lucho el relojero llegó a los 75 años con vista clara y manos firmes.} ¿Cómo? No fue suerte. Don Lucho \textbf{cuidaba su cuerpo} como cuidaba los relojes. En su vitrina de la calle 14 de Cartago, tenía \textbf{una silla de espaldar alto} (no banco), una \textbf{lámpara de buena luz} encima del mesón, y cada 30 minutos se paraba a \textbf{caminar 2 cuadras} y mirar a lo lejos. Decía: \emph{``Si la vista trabaja todo el día en lo cercano, después no ve a su nieto del otro lado de la plaza.''}. Sus aprendices, en cambio, trabajaban encorvados sobre los relojes 8 horas seguidas, mal sentados, mala luz. Algunos terminaron con problemas de espalda, otros con vista cansada. \textbf{La diferencia entre dominar el oficio toda la vida o gastarse joven está en cómo cuidas tu cuerpo}. Hoy con los computadores pasa lo mismo. Tú tienes 12 años: puedes terminar a los 30 con espalda buena o con espalda dañada, dependiendo de cómo te sientes hoy frente a la pantalla.

  saber_contemporaneo: |-
    La \textbf{ergonomía} es la ciencia de adaptar la herramienta al cuerpo, no el cuerpo a la herramienta. Cuando usas un computador mal posicionado durante años, el cuerpo se \textbf{daña} en formas que en tu edad no se notan: dolor de cuello, espalda baja, muñecas, ojos cansados, dolor de cabeza por luz mala. \textbf{El daño no llega de un día, llega por sumar horas mal sentadas durante meses y años}. Lo bueno: con 5 reglas simples y la regla \emph{``20-20-20''} (cada 20 minutos miras 20 segundos a 20 pies de distancia), evitas el 80\% del daño. Esta clase es de las más importantes del periodo porque \textbf{las máquinas se reemplazan; tu cuerpo no}.

  pregunta_puente: |-
    Si tú a los 35 años tienes la espalda dañada y no puedes trabajar 8 horas, ¿\textbf{de quién es la culpa}? ¿Del computador, del trabajo, o de tu yo de 12 años que se sentaba mal y nadie le enseñó otra cosa?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} 8 errores comunes de postura; (2) sabrás \textbf{explicar} las 5 reglas de ergonomía; (3) podrás \textbf{aplicar} la regla 20-20-20; (4) habrás \textbf{evaluado} tu propio puesto y propuesto 5 ajustes concretos.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas errores típicos, aprendes las 5 reglas, evaluás tu puesto con honestidad, y firmas la promesa de cambio.
  a_escuta: |-
    Empezamos analizando 8 errores típicos de postura que tal vez tú cometes.
  a_sistematizacion: |-
    Después aprendes las 5 reglas de ergonomía + la regla 20-20-20.
  a_praxis: |-
    Con las reglas claras, evalúas tu propio puesto y propones ajustes.
  a_producto: |-
    El producto es la auditoría con dibujo + lista de ajustes + promesa firmada.
  a_evaluacion: |-
    Antes de salir, miras tus 5 ajustes: ¿son concretos y medibles?
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué cuidar tu cuerpo hoy es regalarle décadas de trabajo a tu yo futuro.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 8 errores típicos de postura} (10 min · individual). Lee los 8 errores y \textbf{en el cuaderno marca cuáles cometes TÚ regularmente}. Sé honesto, esto es para mejorar. \textbf{Error 1:} encorvar la espalda hacia adelante para acercarte a la pantalla. \textbf{Error 2:} cuello inclinado hacia abajo viendo el celular muchas horas. \textbf{Error 3:} usar el portátil en la cama o sobre las piernas. \textbf{Error 4:} muñecas dobladas hacia arriba o hacia abajo al teclear. \textbf{Error 5:} pantalla muy cerca (a menos de 50 cm). \textbf{Error 6:} luz muy fuerte detrás de la pantalla (reflejo en los ojos). \textbf{Error 7:} sin descansos: 2 horas seguidas sin pararse. \textbf{Error 8:} pies colgando (silla muy alta) o sentado en banco sin espaldar. \emph{Cuenta cuántos cometes}.

  checks:
  - Leí los 8 errores con calma.
  - Marqué con honestidad los que cometo yo.
  - Conté cuántos errores cometo en total.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mis errores de postura». \textbf{Formato:} lista numerada del 1 al 8 con marca SÍ/NO al lado. Al final, escribe el conteo: \emph{``Cometo X errores''}. \textbf{Extensión:} 8 líneas + total. \textbf{Sabes que terminaste cuando} eres honesto contigo mismo en el conteo.

sistematizacion:
  intro: |-
    Si cometes \textbf{0-2 errores}, vas muy bien. Si cometes \textbf{3-5}, hay que mejorar. Si cometes \textbf{6-8}, tu cuerpo te va a pasar factura más rápido de lo que crees. Ahora aprendes las \textbf{5 reglas de ergonomía} + la regla \emph{20-20-20} para corregir lo que descubriste.

  pilares:
  - |-
    \textbf{Regla 1 --- Espalda recta, hombros relajados.} Apoya la espalda en el respaldo de la silla. Hombros caídos (no encogidos hacia las orejas). Si tu silla no tiene respaldo, considera cambiarla --- es la pieza más importante. \textbf{Regla 2 --- Pantalla a la altura de los ojos.} La parte superior de la pantalla debe quedar al mismo nivel que tus ojos cuando miras de frente. Si miras hacia abajo, te dañas el cuello. Si miras hacia arriba, también. Apoya el portátil sobre libros si está muy bajo.
  - |-
    \textbf{Regla 3 --- Distancia de 50-70 cm a la pantalla.} Aproximadamente un brazo extendido. Más cerca cansas la vista. Más lejos forzas la lectura. \textbf{Regla 4 --- Codos a 90 grados, muñecas rectas.} El antebrazo paralelo al suelo. Las muñecas \emph{nunca} dobladas (ni hacia arriba ni hacia abajo). Si está doblada, ajusta la altura de la silla o pon un cojín. Doblar muñecas durante años causa \emph{síndrome del túnel carpiano} (dolor crónico).
  - |-
    \textbf{Regla 5 --- Pies en el suelo.} Tus pies deben tocar el piso firmes. Si la silla está muy alta, usa un \emph{apoyo} (un libro grueso, una caja). Pies colgando = mala circulación = piernas pesadas. \textbf{La regla 20-20-20 (¡la más importante!):} cada \emph{20 minutos} de uso, mira durante \emph{20 segundos} a algo que esté a \emph{20 pies} (6 metros) de distancia. Por ejemplo: mira por la ventana al árbol del patio. Esto \textbf{descansa los músculos del ojo} que se fatigan enfocando lo cercano.
  - |-
    \textbf{Iluminación: la regla del dorso.} La luz NO debe estar detrás de la pantalla (te encandila). La luz NO debe estar detrás de ti (refleja en la pantalla). \textbf{La luz debe venir de un lado}, ojalá del techo o de una lámpara lateral. Una buena luz reduce la fatiga visual en un 50\%. \textbf{Descansos activos cada hora:} cada \emph{60 minutos}, párate, camina 2-3 minutos, estira la espalda y los brazos, toma agua. Esto resetea la postura y la circulación.

  anatomia:
    titulo: 5 reglas + regla 20-20-20
    body: |-
      \textbf{R1.} Espalda recta, hombros caídos. \\[1mm]
      \textbf{R2.} Pantalla a altura de ojos. \\[1mm]
      \textbf{R3.} Distancia 50-70 cm a pantalla. \\[1mm]
      \textbf{R4.} Codos 90° + muñecas rectas. \\[1mm]
      \textbf{R5.} Pies en el suelo. \\[1mm]
      \textbf{20-20-20:} cada 20 min, 20 segundos mirando a 20 pies (6 m).

  errores_comunes: |-
    \textbf{Mitos sobre postura que escucharás.} (1) \emph{``Soy joven, eso no me afecta''} --- Falso. El daño se acumula desde los 10 años. Lo que no se nota a los 12 te golpea a los 30. (2) \emph{``Si me siento bien, ya está bien''} --- Falso. El cuerpo se acostumbra a malas posturas y deja de avisar. Por eso hay que medirlo con las 5 reglas. (3) \emph{``El portátil sirve igual en cualquier parte''} --- Falso. El nombre lo dice (\emph{portátil}), pero usarlo siempre en la cama te daña la espalda en años. Para trabajo serio, mesa siempre. (4) \emph{``La regla 20-20-20 es exagerada''} --- Falso. Los oftalmólogos del mundo entero la recomiendan. Lo que parece exagerado hoy te salva la vista mañana.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Las 5 reglas + 20-20-20 con dibujo». \textbf{Formato:} 5 reglas numeradas, una por línea, con un dibujo pequeño al lado de cada una (la espalda con flecha, la pantalla con altura, los codos con ángulo, etc.). Al final, dibuja el reloj de la regla 20-20-20 con sus 3 números. \textbf{Extensión:} 5-6 líneas + dibujos. \textbf{Sabes que terminaste cuando} podrías recitar las 5 reglas y la 20-20-20 sin mirar.

praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Auditoría de mi puesto + plan de ajustes} (28 min · individual). Vas a hacer 4 cosas en una hoja del cuaderno: \textbf{(a)} dibujar cómo te sientas \emph{hoy} cuando usas el computador en casa (sé honesto); \textbf{(b)} dibujar la postura \emph{ideal} con las 5 reglas; \textbf{(c)} listar 5 ajustes concretos que vas a hacer esta semana; \textbf{(d)} firmar la promesa de aplicar la regla 20-20-20.

  pilares:
  - |-
    \textbf{Paso 1 --- Título y división.} En la parte superior escribe: \textbf{``Auditoría de mi puesto''} y debajo: \emph{``[Tu nombre], año 2026''}. Divide la hoja en \emph{2 mitades verticales}: izquierda y derecha.
  - |-
    \textbf{Paso 2 --- Mi postura actual (mitad izquierda).} Encabezado: \textbf{``Cómo me siento HOY''}. Debajo dibuja un \emph{monigote} (figura simple de palitos) frente a un computador, en la postura real que tú usas. Sé honesto: si tienes mala espalda, dibújala curva. Si no apoyas los pies, dibújalos colgando. Si tu pantalla está muy baja, dibújala abajo. Al lado del dibujo, en bullets, anota \textbf{qué tienes mal} (al menos 3 cosas).
  - |-
    \textbf{Paso 3 --- Postura ideal (mitad derecha).} Encabezado: \textbf{``Cómo debería sentarme''}. Dibuja otro monigote, esta vez con la postura ideal: espalda recta, pantalla al nivel de ojos, codos 90°, pies en el suelo. Etiqueta los \textbf{8 puntos clave} con números: \emph{(1) espalda, (2) hombros, (3) codos, (4) muñecas, (5) mirada, (6) distancia, (7) iluminación, (8) pies}.
  - |-
    \textbf{Paso 4 --- 5 ajustes concretos (debajo de los dibujos).} Lista numerada de 1 a 5. Cada ajuste debe ser \textbf{concreto y medible}, no \emph{``portarme mejor''}. Ejemplos: \emph{(1) Subir el portátil sobre 2 libros para que quede al nivel de mis ojos; (2) Poner una caja debajo de mis pies para que no cuelguen; (3) Mover la lámpara del lado izquierdo (no detrás de la pantalla); (4) Programar alarma en el celular cada 20 minutos para la regla 20-20-20; (5) Hacer pausa de 3 minutos cada hora para caminar y estirar.}.
  - |-
    \textbf{Paso 5 --- Promesa 20-20-20.} En la parte inferior central, en grande, escribe: \textbf{``Me comprometo a aplicar 20-20-20 todos los días de esta semana.''}. Subráyala. Al lado, dibuja un \emph{reloj} con los 3 números (20 min, 20 seg, 20 pies) para recordar la regla. Esta es la promesa principal.
  - |-
    \textbf{Paso 6 --- Firma y fecha.} En la esquina inferior derecha firma con nombre completo y fecha de hoy. Al firmar, te comprometes a aplicar los ajustes durante 1 semana mínimo. Al cabo de la semana, evalúas si te sientes mejor o no.

  checklist:
    titulo: Antes de cerrar tu auditoría
    items: |-
      \checkbox La mitad izquierda tiene mi postura actual con 3 problemas marcados. \\[1mm]
      \checkbox La mitad derecha tiene la postura ideal con los 8 puntos etiquetados. \\[1mm]
      \checkbox Lista 5 ajustes concretos y medibles. \\[1mm]
      \checkbox La promesa 20-20-20 está subrayada con el reloj dibujado. \\[1mm]
      \checkbox Está firmado y fechado. \\[1mm]
      \checkbox Voy a aplicar los ajustes durante 1 semana mínimo.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Arriba:} título + nombre. \textit{Mitad izquierda:} mi postura actual con 3 problemas. \textit{Mitad derecha:} postura ideal con 8 etiquetas. \textit{Abajo de los dibujos:} 5 ajustes numerados. \textit{Centro inferior:} promesa 20-20-20 subrayada con dibujo de reloj. \textit{Esquina:} firma + fecha.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} Título: «Actividad 3 --- Auditoría de mi puesto + 5 ajustes». \textbf{Formato:} 2 dibujos comparativos + lista de ajustes + promesa firmada. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} mirando la hoja sabes exactamente qué cambiar esta semana y cuándo.

  producto_titulo: Auditoría de puesto + 5 ajustes + promesa 20-20-20 · firmada
  criterios:
  - El dibujo de postura actual es honesto (no idealizado).
  - El dibujo de postura ideal tiene los 8 puntos etiquetados.
  - Los 5 ajustes son concretos y medibles.
  - La promesa 20-20-20 está subrayada.
  - Está firmado con nombre y fecha.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del cuidado del cuerpo trabajador)"
    cita: |-
      ``Cuidar el cuerpo no es egoísmo: es respetar al que viene después --- el yo de 40 años, los hijos, los compañeros.''
    aplicacion: |-
      Cuando cuidas tu postura hoy, no es \emph{``vanidad''}: es responsabilidad. Tu yo de 40 años va a poder cargar a tus hijos, jugar fútbol con ellos, trabajar 8 horas sin dolor. Tu yo de 60 va a tener vista para leer las cartas de tus nietos. \textbf{Todo eso depende de cómo te sientas frente al computador entre los 12 y los 20 años}. No es exagerar: es ciencia médica.
    pregunta_espejo: |-
      ¿Estoy cuidando hoy el cuerpo que mi yo de 40 años necesitará para vivir bien?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``El cuerpo es la única casa que tendrás durante toda tu vida. Cuídala como cuidarías una casa de piedra que no se puede reemplazar.''
    aplicacion: |-
      Marco Aurelio entendió algo: \textbf{tu cuerpo es la única cosa que no se cambia}. El computador lo cambias en 5 años, la silla en 10 años, la casa en 20. \emph{El cuerpo te dura desde el día que naces hasta el día que mueres}. Lo que le hagas, ahí queda. Por eso vale más cuidarlo que cuidar cualquier otra cosa.
    pregunta_espejo: |-
      ¿Si solo pudiera cuidar UNA cosa de mi vida con esmero, no debería ser mi cuerpo?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la salud en la era digital)"
    cita: |-
      ``En la era digital, la salud corporal se gana o se pierde frente a una pantalla. Por eso es política, no solo medicina.''
    aplicacion: |-
      Tu vida adulta va a tener \textbf{mucho computador y celular}. Trabajos, universidad, comunicación con amigos. Si aprendes ergonomía ahora, vas a estar saludable mientras todo eso pasa. Si no, vas a estar enfermo. \emph{El conocimiento de ergonomía es un derecho que pocos tienen}. Hoy lo tienes tú; pásalo a tu familia.
    pregunta_espejo: |-
      ¿Quién en mi familia podría beneficiarse hoy mismo de lo que acabo de aprender sobre postura?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana aplica los 5 ajustes que escribiste. Pon la alarma del 20-20-20. La próxima clase es la última sesión del periodo: \textbf{Mi computador ideal}. Vas a usar todo lo aprendido (hardware, software, mantenimiento, ergonomía) para diseñar el equipo que TÚ necesitarías comprar y justificar por qué.

web:
  conceptos_clave:
    - termino: Ergonomía
      definicion: |-
        Ciencia que estudia cómo adaptar la herramienta al cuerpo humano (no al revés). En el computador, son las reglas para que tu cuerpo no se dañe con horas frente a la pantalla.
      ejemplo: |-
        Una silla con respaldo a la altura correcta + pantalla al nivel de ojos + codos a 90° = ergonomía aplicada. Una silla incómoda + pantalla baja = anti-ergonomía.
      emoji: "🪑"
    - termino: Regla 20-20-20
      definicion: |-
        Cada 20 minutos de uso, mira durante 20 segundos algo que esté a 20 pies (6 metros) de distancia. Esto descansa los músculos del ojo que se fatigan enfocando lo cercano.
      ejemplo: |-
        Pones alarma cada 20 minutos. Suena, miras por la ventana al árbol del patio durante 20 segundos. Sigues. Tus ojos te lo agradecen a los 30 años.
      emoji: "👁️"
    - termino: Postura correcta
      definicion: |-
        Los 5 puntos clave para no dañarte: espalda recta apoyada en el respaldo, pantalla a la altura de los ojos, distancia 50-70 cm, codos a 90 grados con muñecas rectas, pies en el suelo.
      ejemplo: |-
        Si te miras al espejo y tu espalda está curva o tu cuello inclinado hacia abajo, hay problema. La postura ideal se mira derecha desde el lado.
      emoji: "🧍"
    - termino: Síndrome del túnel carpiano
      definicion: |-
        Dolor crónico en muñecas y dedos por tener las muñecas dobladas durante años al teclear. Es un problema serio que afecta a adultos que no cuidaron su postura desde jóvenes.
      ejemplo: |-
        Programadores y secretarias que tecleaban con muñecas dobladas 8 horas al día desarrollan dolor que requiere cirugía. Se previene con muñecas rectas desde joven.
      emoji: "💢"
    - termino: Iluminación adecuada
      definicion: |-
        La luz que llega a tu puesto de trabajo. Debe venir de un lado (no detrás de la pantalla ni detrás de ti). Una buena luz reduce la fatiga visual en un 50%.
      ejemplo: |-
        Lámpara de mesa al lado izquierdo si eres diestro (al derecho si eres zurdo). Que no haya bombillo brillante detrás de la pantalla ni reflejo en ella.
      emoji: "💡"

  quiz:
    titulo: "¿Cuidas tu cuerpo frente al computador?"
    instrucciones: "5 preguntas para verificar que aplicas las reglas de ergonomía y la regla 20-20-20."
    preguntas:
      - enunciado: "Llevas 25 minutos jugando Roblox en el celular. ¿Qué haces según la regla 20-20-20?"
        opciones:
          - "Hago una pausa de 20 segundos mirando algo a 6 metros de distancia (al árbol, a la calle)."
          - "Sigo jugando, son solo 25 minutos."
          - "Cierro el juego para siempre."
          - "Sigo pero pongo brillo más bajo."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Cada 20 minutos, miras 20 segundos a 20 pies de distancia. Descansa los músculos del ojo. No paras de jugar; solo haces pausa breve.
        feedback_incorrecto: |-
          La regla 20-20-20: cada 20 minutos, 20 segundos mirando algo lejano (6 metros). Pausa breve, no abandonar. Es prevención.
      - enunciado: "Te sientas en el computador a hacer tarea. ¿Cómo deberían quedar tus codos?"
        opciones:
          - "Doblados a más de 90 grados (cerca del cuerpo)."
          - "Estirados completamente."
          - "Hacia atrás."
          - "A 90 grados aproximadamente, con muñecas rectas."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. Codos a 90 grados + muñecas rectas. Si las muñecas se doblan, ajustas altura de silla o pones cojín. Eso previene túnel carpiano.
        feedback_incorrecto: |-
          Codos a 90 grados, muñecas rectas. Si están dobladas, ajusta silla. Doblar muñecas años causa dolor crónico en adultos.
      - enunciado: "Estás en la cama con el portátil sobre las piernas. ¿Es problema?"
        opciones:
          - "No, es cómodo."
          - "Sí: la cama ahoga la ventilación y la postura daña espalda y cuello."
          - "Solo si es de noche."
          - "Solo si la luz está apagada."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Cama + portátil = ventilación ahogada (el equipo se daña) + postura mala (tu espalda se daña). Para uso serio, siempre mesa.
        feedback_incorrecto: |-
          Sí es problema. La cama ahoga la ventilación del portátil (se calienta) y la postura es mala (cuello y espalda). Mesa siempre.
      - enunciado: "Tu silla es muy alta y tus pies cuelgan. ¿Qué haces?"
        opciones:
          - "Lo acepto, así es la silla."
          - "Me siento al borde de la silla."
          - "Pongo un libro grueso o una caja debajo para que mis pies se apoyen."
          - "Doblar las piernas hacia arriba."
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Pies colgando = mala circulación = piernas pesadas. Una caja o un libro grueso resuelve el problema rápido.
        feedback_incorrecto: |-
          Pies colgando es mala circulación. Pon un libro grueso o caja debajo para que se apoyen. Solución barata y efectiva.
      - enunciado: "Llevas 2 horas seguidas en el computador sin parar. ¿Qué deberías hacer?"
        opciones:
          - "Hacer pausa de 3-5 minutos para caminar, estirar y tomar agua. Después regreso."
          - "Seguir, falta poco para terminar."
          - "Comer chocolate para tener más energía."
          - "Bajar el brillo de la pantalla."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. Cada 60 minutos: pausa de 3-5 minutos. Caminar, estirar, agua. Resetea postura y circulación. Vuelves más enfocado.
        feedback_incorrecto: |-
          Cada hora, pausa de 3-5 min: caminar, estirar, agua. No es perder tiempo; es ganar concentración después. Tu cuerpo descansa.

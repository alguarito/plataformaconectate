clave: "3-1"
grado: 6
periodo: 3
sesion: 1
completo: true

titulo: "Apertura periodo 3 --- el oficio de escribir y buscar con criterio"
titulo_portada: |-
  Apertura
  periodo 3 ---
  escribir y
  buscar con
  criterio

producto_final: |-
  En el cuaderno: \textbf{(a) reflexión personal} sobre tu \emph{relación actual con la escritura digital} (¿usas Word? ¿Docs? ¿escribes en celular o computador? ¿cuánto te demoras escribiendo 1 página?); \textbf{(b) reflexión sobre tu uso de internet} (¿cuántas búsquedas en Google haces al día? ¿confías en lo que lees? ¿revisas fuentes?); \textbf{(c) las 5 preguntas-radar} del periodo 3; \textbf{(d) compromiso firmado} de practicar Word + investigar críticamente durante el periodo.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural de la vereda La Plata de Cartago enseñaba dos cosas: a escribir bien y a leer críticamente.} En su escuelita del campo, los niños aprendían a \textbf{ordenar las ideas en el cuaderno} antes de escribir (\emph{``primero pensar, después escribir''}, decía). Y aprendían a \textbf{verificar las noticias} que llegaban de fuera (\emph{``no todo lo que dice el periódico es verdad''}, repetía). Ese saber doble --- \emph{escribir bien y leer crítico} --- la convirtió en figura respetada de la vereda durante décadas. Sus exalumnos, ya adultos, sabían escribir cartas formales, redactar peticiones, y desconfiar de promesas falsas. \textbf{Hoy, 50 años después, ese mismo saber doble sigue siendo el más útil}, pero la herramienta cambió: ya no es solo cuaderno y periódico, ahora también es Word, Google Docs, Wikipedia, redes sociales. El periodo 3 te entrena en el mismo oficio de doña Mercedes, con las herramientas de tu tiempo.

  saber_contemporaneo: |-
    En el \textbf{Periodo 3 (Procesador de texto e Internet)} vas a recorrer 10 sesiones que cubren \textbf{dos grandes mitades}. \textbf{Primera mitad (S2 a S6) --- el oficio de escribir digital:} \emph{(S2) Word y Docs; (S3) Formato básico; (S4) Listas y numeración; (S5) Tablas e imágenes; (S6) Encabezado, pie y números}. \textbf{Segunda mitad (S7 a S9) --- el oficio de buscar críticamente:} \emph{(S7) ¿Qué es internet?; (S8) Buscar bien; (S9) Evaluar fuentes}. \textbf{Cierre integrador (S10):} \emph{Mi primer documento informativo} que reúne todo lo aprendido. El periodo 3 es \textbf{el más práctico del año}: cada sesión produce algo concreto en Word o algo concreto en cuaderno sobre internet. Al final del periodo serás capaz de escribir un documento profesional + investigar un tema con criterio. Esas son habilidades para toda la vida adulta: universidad, trabajo, ciudadanía.

  pregunta_puente: |-
    Si tu profe te pidiera entregar \emph{``un informe de 2 páginas sobre el río Cauca, formateado con tabla, imagen, fuentes citadas''}, ¿\textbf{sabrías hacerlo} con confianza? Si la respuesta es \emph{``no del todo''}, este periodo es para ti.

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} la ruta del periodo 3 (las 2 mitades); (2) sabrás \textbf{explicar} por qué escribir y buscar bien son habilidades adultas; (3) podrás \textbf{aplicar} 5 reglas de uso ético de internet; (4) habrás \textbf{creado} reflexión personal + 5 preguntas + compromiso.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: reflexionas sobre tu escritura y búsqueda actuales, conoces la ruta del P3, firmas el compromiso, y defines tus preguntas-radar.
  a_escuta: |-
    Empezamos con un diagnóstico honesto de cómo escribes y buscas hoy.
  a_sistematizacion: |-
    Después conoces la ruta del P3 (10 sesiones en 2 mitades) y las 5 reglas de uso ético.
  a_praxis: |-
    Con la ruta clara, escribes tu reflexión personal y firmas el compromiso.
  a_producto: |-
    El producto es la reflexión + 5 preguntas-radar + compromiso firmado.
  a_evaluacion: |-
    Antes de salir, verifica que tus 5 preguntas son sinceras (no copiadas).
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué saber escribir y buscar es ciudadanía moderna.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Diagnóstico honesto de tu escritura y búsqueda} (12 min · individual). En el cuaderno responde estas 10 preguntas con UNA frase corta cada una. Sé honesto, esto es para que tú mismo veas dónde estás. \textbf{Sobre escritura:} \emph{(1) ¿Cuándo escribiste por última vez algo más largo de 1 página? ¿En cuaderno o digital?} \emph{(2) ¿Has usado Word? ¿Cuántas veces aproximadamente?} \emph{(3) ¿Conoces Google Docs?} \emph{(4) ¿Cuánto te demoras escribiendo 1 página en computador?} \emph{(5) ¿Sabes lo que es ``alineación justificada''?}. \textbf{Sobre búsqueda:} \emph{(6) ¿Cuántas veces al día buscas algo en Google?} \emph{(7) ¿Lees solo el primer resultado o miras varios?} \emph{(8) ¿Has notado anuncios entre los resultados?} \emph{(9) ¿Confías en Wikipedia para tareas?} \emph{(10) ¿Has verificado alguna vez si una noticia que viste en internet es verdadera?}. Anota tus respuestas sin pena: esto es radar, no examen.

  checks:
  - Respondí las 10 preguntas con honestidad.
  - No copié ni le pregunté al compañero.
  - Me detuve en las preguntas que me dieron duda.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mi diagnóstico de escritura y búsqueda». \textbf{Formato:} 10 preguntas con respuesta corta. \textbf{Extensión:} 10 líneas. \textbf{Sabes que terminaste cuando} tus respuestas reflejan tu realidad actual, no una versión imaginada.

sistematizacion:
  intro: |-
    Tu diagnóstico te dice dónde estás hoy. Ahora conoce \textbf{la ruta del periodo 3} para saber a dónde llegas en 10 sesiones.

  pilares:
  - |-
    \textbf{La ruta del periodo 3 --- las 2 mitades.} \textbf{Primera mitad (S2 a S6) --- Procesador de texto:} \emph{S2: ¿Qué es un procesador de texto?} \emph{S3: Formato básico (negrita, alineación, color).} \emph{S4: Listas y numeración.} \emph{S5: Tablas e imágenes.} \emph{S6: Encabezado, pie y números.} Al terminar esta mitad sabes \emph{escribir un documento profesional con todos los elementos}. \textbf{Segunda mitad (S7 a S9) --- Internet:} \emph{S7: ¿Qué es internet? (cómo viajan los datos).} \emph{S8: Buscar bien (operadores de búsqueda).} \emph{S9: Evaluar fuentes (método CRAAP).} Al terminar esta mitad sabes \emph{buscar información y filtrarla con criterio}. \textbf{Cierre integrador (S10):} \emph{Mi primer documento informativo} que combina ambas mitades.
  - |-
    \textbf{Por qué este periodo es el más práctico.} En P1 viste \emph{conceptos} (identidad digital, netiqueta). En P2 viste \emph{estructura} (hardware, software). En P3 produces \textbf{productos concretos}: documentos, búsquedas, comparaciones de fuentes. \emph{Cada sesión termina con algo que puedes mostrar}. Las habilidades de P3 las vas a usar el resto del año en otras materias (tareas de Historia, informes de Ciencias, etc.) y toda tu vida adulta (universidad, trabajo). No es exagerado: \textbf{escribir bien + buscar bien son las 2 habilidades más rentables del siglo XXI}.
  - |-
    \textbf{Las 5 reglas de uso ético de internet (no negociables).} (1) \textbf{Cita siempre tus fuentes:} si tomas información de un sitio, dilo. \emph{Copiar sin citar = plagio = falta grave}. (2) \textbf{Verifica antes de creer:} mínimo 2 fuentes confiables que coincidan. (3) \textbf{No comparta lo que no verifica:} si lo dudas, no lo mandes a otros. (4) \textbf{Respeta los derechos de autor:} no usar imágenes con copyright sin permiso. Usa Pixabay, Unsplash. (5) \textbf{Usa internet para sumar, no para restar:} a tu aprendizaje, a otros, al mundo. Si lo que vas a hacer le quita a alguien (su tranquilidad, su reputación, su tiempo), repíensalo.
  - |-
    \textbf{4 herramientas del oficio en P3.} (1) \textbf{Procesador de texto} (Word o Docs): donde produces los documentos. (2) \textbf{Buscador} (Google, Bing): donde investigas. (3) \textbf{Cuaderno físico}: donde planificas antes de escribir digital (\emph{doña Mercedes decía: primero pensar, después escribir}). (4) \textbf{Fuentes confiables}: Wikipedia (punto de partida), sitios de gobierno (.gov.co), universidades (.edu), enciclopedias en línea. Aprenderás a distinguir todo esto en las 10 sesiones.

  anatomia:
    titulo: Ruta P3 + 5 reglas éticas
    body: |-
      \textbf{Ruta P3 (2 mitades):} \\[1mm]
      Mitad 1 (Word): S2 (procesador) → S3 (formato) → S4 (listas) → S5 (tablas/imágenes) → S6 (marco). \\[1mm]
      Mitad 2 (Internet): S7 (cómo funciona) → S8 (buscar bien) → S9 (evaluar fuentes). \\[1mm]
      Cierre: S10 (documento integrador). \\[1mm]
      \textbf{5 reglas éticas:} cita fuentes · verifica · no compartas sin verificar · respeta derechos · usa para sumar.

  errores_comunes: |-
    \textbf{Errores frecuentes al iniciar P3.} (1) \emph{``Yo ya sé Word, este periodo es repetir lo que sé''} --- Falso. Word tiene mucho más de lo que la mayoría usa. Las S2 a S6 te enseñan funciones profesionales. (2) \emph{``Buscar en Google es solo escribir y leer el primer resultado''} --- Falso. Hay técnicas (operadores, filtros, evaluación de fuentes) que multiplican tu eficiencia. (3) \emph{``Copiar de Wikipedia está mal''} --- Discutible. Wikipedia es buen punto de partida, lo malo es \emph{citar Wikipedia} en un trabajo formal. Citas la fuente original que Wikipedia referencia. (4) \emph{``Si está en internet, es cierto''} --- Falso, en 2026 más que nunca. Verificar es habilidad clave.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Ruta del P3 + me comprometo o no con cada regla ética». \textbf{Formato:} bloque A con la ruta del P3 (mitades). Bloque B con las 5 reglas éticas, y al lado de cada una decide \textbf{Sí me comprometo / No estoy seguro} con una razón corta (no palomita ciega: decisión razonada). \textbf{Veredicto (2 líneas):} ¿\emph{cuál} de las 5 reglas te parece la más difícil de cumplir y por qué? Tu honestidad importa más que tu palomita. \textbf{Extensión:} 15 líneas + veredicto. \textbf{Sabes que terminaste cuando} pudiste decir ``No estoy seguro'' en al menos una regla sin sentir vergüenza --- esa es la regla a trabajar este periodo.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Reflexión personal + 5 preguntas + compromiso} (25 min · individual). Vas a producir 3 cosas en el cuaderno: una reflexión sobre tu uso actual, 5 preguntas-radar para el periodo, y un compromiso firmado.

  pilares:
  - |-
    \textbf{Paso 1 --- Reflexión personal (mitad superior de la hoja).} Toma tu diagnóstico de Actividad 1 (las 10 preguntas) y \textbf{convierte las 10 respuestas en un párrafo reflexivo} de 5-6 líneas. Empieza con \emph{``Hoy en escritura digital yo...''} y termina con \emph{``Lo que quiero mejorar este periodo es...''}. No copies las respuestas: refléjalas. Esto te entrena en redactar tu propia voz.
  - |-
    \textbf{Paso 2 --- Las 5 preguntas-radar del periodo (centro de la hoja).} Subtítulo: \textbf{``Mis 5 preguntas-radar del P3''}. Lista numerada de 5 preguntas que esperas resolver durante el periodo. Sugerencias para inspirarte (no copies estas, inventa tuyas): \emph{``¿Cómo escribo un documento que se vea profesional?''}, \emph{``¿Cómo busco información sin caer en publicidad?''}, \emph{``¿Cómo sé si una página dice verdad?''}, \emph{``¿Cómo cito fuentes correctamente?''}, \emph{``¿Cuántas veces al día debería revisar las fuentes que leo?''}.
  - |-
    \textbf{Paso 3 --- Las 5 reglas éticas firmadas (mitad inferior).} Subtítulo: \textbf{``Mi compromiso ético del P3''}. Reproduce las 5 reglas (cita fuentes, verifica, no comparta sin verificar, respeta derechos, usa para sumar). Al lado de cada una, palomita ✓ si te comprometes. Si dudas con alguna, conversa con el profe antes de firmar.
  - |-
    \textbf{Paso 4 --- Compromiso del oficio.} Debajo de las reglas, escribe esta frase en grande: \textbf{``Me comprometo a escribir con mi voz, no con voz prestada. A buscar con criterio, no con prisa.''}. Subráyala. Estos son los 2 pilares éticos del periodo 3.
  - |-
    \textbf{Paso 5 --- Sesión 1 con encabezado fijo.} En el cuaderno principal escribe el encabezado de la sesión 1: \emph{``Guía: 6° · Periodo 3 · Guía 1 --- Apertura. Fecha: \_\_/\_\_/2026''}. Debajo, anota qué hiciste en las 3 actividades (diagnóstico, ruta y reglas, compromiso).
  - |-
    \textbf{Paso 6 --- Firma y cierre.} Al final, firma con tu nombre completo y fecha. La próxima clase es \emph{S2: ¿Qué es un procesador de texto?}. Trae el cuaderno, trae las 5 preguntas en la cabeza, y ven listo a empezar a escribir digital.

  checklist:
    titulo: Antes de cerrar la S1 del P3
    items: |-
      \checkbox La reflexión personal es un párrafo de 5-6 líneas escrito con mi voz. \\[1mm]
      \checkbox Tengo 5 preguntas-radar reales mías. \\[1mm]
      \checkbox Las 5 reglas éticas están firmadas. \\[1mm]
      \checkbox El compromiso del oficio está subrayado. \\[1mm]
      \checkbox La sesión 1 tiene encabezado y registro de las 3 actividades. \\[1mm]
      \checkbox Firmé con nombre completo y fecha.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Mitad superior:} reflexión personal (5-6 líneas). \textit{Centro:} 5 preguntas-radar. \textit{Mitad inferior:} 5 reglas éticas firmadas + compromiso del oficio subrayado. \textit{Cuaderno principal:} sesión 1 con encabezado fijo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi entrada al periodo 3». \textbf{Formato:} reflexión + 5 preguntas + reglas firmadas + sesión 1 con encabezado. \textbf{Extensión:} 1.5 hojas. \textbf{Sabes que terminaste cuando} tu cuaderno está listo para empezar la S2 con confianza.

  producto_titulo: Reflexión + 5 preguntas + compromiso ético del periodo 3 · firmado
  criterios:
  - La reflexión personal está escrita con voz propia (5-6 líneas).
  - Las 5 preguntas-radar son personales y específicas.
  - Las 5 reglas éticas tienen firma de compromiso.
  - El compromiso del oficio está subrayado y visible.
  - La sesión 1 tiene encabezado fijo y registro de actividades.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la voz propia)"
    cita: |-
      ``Escribir con tu voz es decir: existo, pienso, tengo algo que aportar. Eso es soberanía.''
    aplicacion: |-
      Mucha gente vive sin escribir nunca su propia voz: copia, repite, replica. \textbf{El que escribe con voz propia se vuelve sujeto, no objeto}. El que solo recibe información sin producir queda dependiente. \emph{Este periodo te entrena en producir, no solo consumir}. Es la diferencia entre ser leído y ser leyente. Doña Mercedes lo sabía: enseñar a escribir es enseñar a ser persona.
    pregunta_espejo: |-
      ¿Estoy produciendo voz propia o solo consumiendo voces ajenas?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Escribir es pensar despacio. Buscar es elegir despacio. Las dos disciplinas hacen al ciudadano libre.''
    aplicacion: |-
      \textbf{Escribir y buscar son disciplinas lentas} en un mundo rápido. La gente apurada \emph{escribe mal y busca peor}: improvisa, copia, se cree el primer resultado. La gente disciplinada \emph{escribe con cuidado y busca con criterio}: produce documentos profesionales y encuentra información buena. La diferencia se nota al cabo de los años: unos quedan dependientes, otros toman decisiones por sí mismos.
    pregunta_espejo: |-
      ¿Me estoy entrenando en escribir y buscar despacio, o sigo el ritmo apurado de los demás?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la era de la información)"
    cita: |-
      ``En el siglo XXI, no saber escribir bien y no saber buscar bien es como en el siglo XX no saber leer. Te excluye de decisiones importantes.''
    aplicacion: |-
      \textbf{Tu vida adulta dependerá de escribir y buscar bien}: para postular trabajos, hacer trabajos universitarios, defender derechos, votar con criterio, criar hijos en una era digital. \emph{Las habilidades del P3 son alfabetización del siglo XXI}. No es opcional. Tu yo de 25 años te lo agradecerá. Tu yo de 50 años no podría vivir sin esto.
    pregunta_espejo: |-
      ¿Estoy desarrollando las habilidades que mi yo de 25 años va a necesitar para una vida digna?

compromiso: |-
  \textbf{Para la próxima sesión.} Trae el cuaderno listo. La próxima clase es S2: \emph{¿Qué es un procesador de texto?}. Vas a crear tu primer documento digital de 3 párrafos sobre un tema que te guste. Recuerda lo que dijo doña Mercedes: \emph{``primero pensar, después escribir''}. Trae una idea de tema para empezar de una vez.

web:
  conceptos_clave:
    - termino: Procesador de texto
      definicion: |-
        Programa para escribir documentos digitales: Microsoft Word, Google Docs, LibreOffice Writer. La herramienta principal de la primera mitad del periodo 3.
      ejemplo: |-
        Para una tarea, abres Word, escribes 3 párrafos, aplicas formato (negrita, alineación), guardas con nombre claro en la carpeta correcta. Eso aprenderás en S2 a S6.
      emoji: "📝"
    - termino: Búsqueda crítica
      definicion: |-
        Habilidad de buscar información en internet usando operadores (comillas, site:, filetype:) y de evaluar las fuentes encontradas con criterio (método CRAAP). Habilidad clave del siglo XXI.
      ejemplo: |-
        En vez de buscar "Bolívar" suelto, buscas "Simón Bolívar" site:colombiaaprende.edu.co filetype:pdf. Encuentras justo lo que necesitas en segundos. Eso aprenderás en S7 a S9.
      emoji: "🔎"
    - termino: Voz propia
      definicion: |-
        Capacidad de escribir o expresar ideas con palabras y estructura inventadas por uno, no copiadas. Es lo opuesto a plagio. Se entrena con práctica deliberada de escritura.
      ejemplo: |-
        Doña Mercedes decía: "primero pensar, después escribir". Antes de copiar, piensa con tus palabras qué quieres decir. Eso te entrena en voz propia.
      emoji: "🗣️"
    - termino: 5 reglas éticas de internet
      definicion: |-
        Las normas mínimas de uso responsable de internet: citar fuentes, verificar antes de creer, no compartir sin verificar, respetar derechos de autor, usar para sumar (no para restar). Marco moral del periodo 3.
      ejemplo: |-
        Antes de usar una imagen de Google, verifica si es libre (Pixabay sí, página comercial probablemente no). Antes de compartir una noticia escandalosa, verifica en otra fuente. Eso es ética.
      emoji: "⚖️"
    - termino: Pregunta-radar del P3
      definicion: |-
        Pregunta personal sobre escritura digital o búsqueda crítica que el estudiante define al inicio del periodo. Las 10 sesiones la van respondiendo gradualmente.
      ejemplo: |-
        Tu pregunta-radar del P3 podría ser "¿cómo cito correctamente las fuentes que uso?" Las sesiones S5 (imágenes con pie) y S9 (CRAAP) la responderán.
      emoji: "🧭"

  quiz:
    titulo: "¿Llegaste bien al periodo 3?"
    instrucciones: "5 preguntas para verificar que conoces la ruta del P3 y firmaste el compromiso ético."
    preguntas:
      - enunciado: "¿Cuáles son las 2 grandes mitades del periodo 3?"
        opciones:
          - "Word + Excel."
          - "Procesador de texto (S2-S6) + Internet/búsqueda crítica (S7-S9), con cierre integrador en S10."
          - "Sólo internet."
          - "Sólo cuaderno."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Primera mitad: escribir digital (Word, formato, tablas). Segunda mitad: buscar críticamente (operadores, CRAAP). S10 cierra todo.
        feedback_incorrecto: |-
          2 mitades: procesador de texto (S2-S6) + búsqueda crítica (S7-S9). S10 cierra integrando. Ese es el plan del periodo.
      - enunciado: "Doña Mercedes la maestra rural decía '¿qué primero?'"
        opciones:
          - "Escribir muy rápido."
          - "Primero pensar, después escribir."
          - "Buscar en Wikipedia primero."
          - "Copiar de otro lado."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Primero pensar (ordenar ideas en cuaderno), después escribir (en digital). Esa secuencia te entrena en voz propia y evita el bloqueo del papel en blanco.
        feedback_incorrecto: |-
          "Primero pensar, después escribir". Doña Mercedes lo decía hace 50 años. Sigue siendo verdad: la escritura sin pensamiento es ruido.
      - enunciado: "Cuál es UNA de las 5 reglas éticas de internet del P3?"
        opciones:
          - "Compartir todo lo que veas."
          - "Citar siempre tus fuentes."
          - "Copiar sin permiso."
          - "Creerle al primer resultado."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Citar fuentes es regla 1. Otras: verifica, no comparta sin verificar, respeta derechos, usa para sumar. 5 reglas mínimas.
        feedback_incorrecto: |-
          Citar fuentes es regla 1 del P3. Las 5: cita · verifica · no comparta sin verificar · respeta derechos · usa para sumar. Son ética básica.
      - enunciado: "¿Por qué escribir bien y buscar bien son habilidades 'rentables' del siglo XXI?"
        opciones:
          - "Porque te pagan por hacerlo."
          - "Porque las vas a usar en universidad, trabajo, decisiones de vida adulta. Son alfabetización del siglo XXI."
          - "Porque las exigen los videojuegos."
          - "Porque son fáciles."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. En tu vida adulta dependerás de escribir y buscar bien: tareas universitarias, postular trabajos, defender derechos, criar hijos. Son alfabetización.
        feedback_incorrecto: |-
          Son alfabetización del siglo XXI. Quien las domina decide; quien no, depende. Tu vida adulta te las exigirá todos los días.
      - enunciado: "Tu pregunta-radar del periodo es '¿cómo cito fuentes correctamente?'. ¿Qué sesiones te ayudarán?"
        opciones:
          - "Ninguna."
          - "S5 (imágenes con pie), S9 (evaluar fuentes con CRAAP), y S10 (documento con fuentes citadas)."
          - "Solo S1 que es hoy."
          - "Solo una clase fuera del colegio."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. La pregunta sobre fuentes la responden varias sesiones: S5 enseña a poner pie de imágenes, S9 evalúa fuentes con CRAAP, S10 te hace citar en documento real.
        feedback_incorrecto: |-
          S5 (imágenes con pie) + S9 (CRAAP de fuentes) + S10 (documento con fuentes citadas). Varias sesiones convergen en responder esa pregunta.

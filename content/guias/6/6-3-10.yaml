clave: "3-10"
grado: 6
periodo: 3
sesion: 10
completo: true

titulo: "Mi primer documento informativo --- producto que reúne todo lo aprendido"
titulo_portada: |-
  Mi primer
  documento
  informativo ---
  todo lo
  aprendido

producto_final: |-
  Un \textbf{documento informativo de 2 páginas + portada} (3 páginas en total) sobre un tema de tu elección. \textbf{Debe contener:} portada con título grande + tu nombre + grado + fecha; encabezado + pie de página + numeración en las páginas de contenido; \textbf{4 párrafos} con formato (negrita, justificación, sangría); \textbf{1 lista} (con viñetas o numerada); \textbf{1 tabla} (3+ filas); \textbf{1 imagen} con pie y texto fluyendo; \textbf{3 fuentes citadas} al final, cada una con evaluación CRAAP rápida (notas 0-5). Más \textbf{en el cuaderno}: lista de los 10 elementos del documento marcados como \emph{aplicado/no aplicado} (autoevaluación con rúbrica).

apertura:
  saber_ancestral: |-
    \textbf{Cuando doña Mercedes la maestra rural de la vereda La Plata de Cartago veía a un alumno terminar el cuaderno del año, hacía un ritual.} El último día, los niños del campo presentaban su \textbf{``trabajo de cosecha''}: el mejor de todo lo aprendido en el año. \emph{``Hoy van a mostrarme TODO lo que aprendieron en una sola tarea''}, decía. Si habían visto escritura, debía estar la mejor escritura. Si habían visto dibujo, el mejor dibujo. Si habían visto matemáticas, el mejor cálculo. Era el día en que \textbf{cada estudiante demostraba que la suma de todo el año había crecido a algo nuevo}. Hoy es tu día de cosecha del periodo 3. Vas a hacer \textbf{un documento que reúna todo lo aprendido}: el procesador de texto, el formato, las listas, las tablas, las imágenes, los encabezados, la búsqueda con operadores, la evaluación de fuentes. No es decoración: es la prueba de que el oficio ya es tuyo. \emph{El relojero arma su primer reloj completo después de meses de aprender pieza por pieza}. Tú haces tu primer documento informativo.

  saber_contemporaneo: |-
    Un \textbf{documento informativo} es un texto que \emph{enseña algo verídico} a quien lo lee. No es opinión ni ensayo: es \emph{información organizada, con fuentes citadas, presentada con criterio}. Los documentos informativos son lo que entregas en tareas de colegio, en informes en la universidad, en reportes en el trabajo. \textbf{Lo que aprendiste en este periodo} se combina aquí en un solo entregable: \emph{Word/Docs} (S2), \emph{formato profesional} (S3), \emph{listas estructuradas} (S4), \emph{tablas e imágenes} (S5), \emph{encabezado y pie} (S6), \emph{conceptos sobre internet} (S7), \emph{búsqueda con operadores} (S8), \emph{evaluación de fuentes con CRAAP} (S9). Hoy haces tu primer documento que \textbf{aplica los 10 elementos juntos}. Te llevará 50 minutos, pero saldrás con un documento que muestra al profe \emph{y a ti mismo} que terminaste el periodo con oficio.

  pregunta_puente: |-
    Si tu profe te dijera \emph{``muéstrame en UN solo trabajo todo lo que aprendiste en el periodo 3''}, ¿\textbf{podrías hacerlo}? ¿Cuáles 10 elementos meterías en ese documento?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{integrar} los 10 elementos aprendidos en el periodo; (2) sabrás \textbf{aplicar} cada uno en un solo documento; (3) habrás \textbf{evaluado} tu propio trabajo con rúbrica; (4) podrás \textbf{citar} las 3 fuentes con evaluación CRAAP rápida.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: escoges tema, buscas y evalúas 3 fuentes con CRAAP, escribes el documento con los 10 elementos, y haces autoevaluación.
  a_escuta: |-
    Empezamos eligiendo un tema que de verdad te interese investigar.
  a_sistematizacion: |-
    Después aprendes la estructura del documento (portada + 2 páginas + fuentes).
  a_praxis: |-
    Con la estructura clara, escribes el documento aplicando los 10 elementos del periodo.
  a_producto: |-
    El producto es ese documento + autoevaluación con rúbrica + 3 fuentes citadas.
  a_evaluacion: |-
    Antes de salir, marca cuáles de los 10 elementos están y cuáles faltan.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué reunir el oficio en un solo trabajo es prueba de aprendizaje real.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Elige tu tema} (8 min · individual). En el cuaderno, responde estas 3 preguntas para definir el tema del documento. \emph{(1) ¿Qué tema me da curiosidad de investigar? (puede ser: el volcán Nevado del Ruiz, los ríos de Colombia, una persona admiro, mi mascota favorita, mi deporte, mi región, una receta tradicional de Cartago).} \emph{(2) ¿Por qué este tema? (en 1 línea).} \emph{(3) ¿Qué 4 puntos clave quiero contar sobre el tema? (lista de 4 ideas).}. Esto te da \textbf{el esqueleto} del documento antes de empezar a escribir.

  checks:
  - Respondí las 3 preguntas con honestidad.
  - Elegí un tema que me interese, no uno aburrido.
  - Tengo 4 puntos clave para desarrollar.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Tema y plan del documento». \textbf{Formato:} 3 respuestas + lista de 4 puntos. \textbf{Extensión:} 6-7 líneas. \textbf{Sabes que terminaste cuando} podrías empezar a escribir el documento sin volver a pensar el tema.

sistematizacion:
  intro: |-
    Ahora aprendes \textbf{la estructura} del documento y el \textbf{checklist} de los 10 elementos que debes incluir. Antes de escribir, conoce el mapa.

  pilares:
  - |-
    \textbf{La estructura del documento informativo.} \textbf{Página 1 (portada):} título grande centrado, tu nombre completo, grado, materia, fecha, sin encabezado/pie. \textbf{Página 2 (contenido 1):} encabezado arriba (tu nombre + grado + materia), título de sección, 2 párrafos del tema, 1 imagen con pie + texto fluyendo, pie de página + \#1. \textbf{Página 3 (contenido 2):} encabezado igual, 2 párrafos más, 1 lista (viñetas o numerada), 1 tabla, sección de \textbf{Fuentes citadas} al final con las 3 fuentes evaluadas, pie + \#2.
  - |-
    \textbf{Los 10 elementos que debe tener (la rúbrica).} \textbf{Procesador y archivo:} (1) Documento creado en Word/Docs guardado con nombre correcto. \textbf{Formato:} (2) Título en negrita, centrado, tamaño 18 azul; (3) Párrafos justificados con sangría primera línea; (4) Énfasis controlado (1 subrayado + 1 negrita por párrafo). \textbf{Estructura visual:} (5) 1 lista con mínimo 3 ítems formato gramatical paralelo; (6) 1 tabla con encabezado en negrita; (7) 1 imagen con pie en cursiva tamaño 10 y ajuste cuadrado. \textbf{Marco:} (8) Portada separada (1 página) + encabezado + pie + numeración en páginas 2 y 3. \textbf{Información y fuentes:} (9) Información del tema en 4 párrafos con datos verificables; (10) 3 fuentes citadas al final con evaluación CRAAP rápida (notas).
  - |-
    \textbf{Las 5 etapas del proceso (cómo se hace en 50 minutos).} \textbf{Etapa 1 (5 min):} Planificación --- definir tema, escribir 4 puntos clave en el cuaderno (lo hiciste en Actividad 1). \textbf{Etapa 2 (10 min):} Investigación --- buscar 3 fuentes con operadores (S8) y evaluarlas con CRAAP (S9). \textbf{Etapa 3 (20 min):} Escritura del primer borrador --- los 4 párrafos del contenido, sin formato todavía. \textbf{Etapa 4 (10 min):} Formato y elementos visuales --- portada, encabezado, pie, lista, tabla, imagen. \textbf{Etapa 5 (5 min):} Cierre --- sección de fuentes, autoevaluación con rúbrica.
  - |-
    \textbf{Pista profesional: revisar antes de entregar.} Cuando termines, no entregues de una. \textbf{Léelo completo de principio a fin}. Busca: errores ortográficos, oraciones que no se entienden, datos que no recuerdas si verificaste. Corrige lo que veas. \emph{Doña Mercedes decía: ``Trabajo entregado, trabajo bien revisado''}. Mejor 30 minutos extra de revisión que entregar un trabajo con errores que después dan pena.

  anatomia:
    titulo: 10 elementos + estructura
    body: |-
      \textbf{Estructura:} portada + 2 páginas contenido + sección fuentes. \\[1mm]
      \textbf{10 elementos:} archivo correcto · título formateado · párrafos formateados · énfasis controlado · lista · tabla · imagen · marco completo · información verificable · fuentes CRAAP.

  errores_comunes: |-
    \textbf{Errores frecuentes en el documento de cosecha.} (1) \emph{Olvidar la portada}: empezar directo con contenido. La portada da presencia profesional. (2) \emph{No citar fuentes}: el documento se siente \emph{``inventado''}. Mínimo 3 fuentes citadas. (3) \emph{Lista sin formato paralelo}: mezclar verbos y sustantivos. (4) \emph{Imagen sin pie}: el lector no sabe qué muestra. (5) \emph{Encabezado solo en página 1}: el encabezado debe aparecer en TODAS las páginas de contenido (2 y 3). (6) \emph{Tabla sin encabezado en negrita}: la fila de encabezado debe diferenciarse. (7) \emph{No autoevaluar}: entregar sin verificar los 10 elementos. La rúbrica te ayuda a entregar completo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Plan de mi documento». \textbf{Formato:} en 1 página dibuja un boceto de las 3 páginas del documento. Indica qué va en cada zona. Lista los 10 elementos al lado, dejando una casilla vacía al frente de cada uno (para marcar después). \textbf{Extensión:} 1 página completa. \textbf{Sabes que terminaste cuando} tu boceto puede guiarte sin tener que volver a esta guía.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu documento informativo de cosecha} (50 min · individual). Vas a producir el documento con los 10 elementos. Sigue las 5 etapas del proceso. Es el trabajo más completo del periodo --- y te queda como muestra de todo lo que ahora sabes hacer.

  pilares:
  - |-
    \textbf{Paso 1 --- Investiga (10 min).} Aplica S8 (búsquedas con operadores) y S9 (CRAAP) para encontrar 3 fuentes sobre tu tema. Anota los enlaces o nombres en el cuaderno. Para cada una, evalúa CRAAP rápido (notas de 0 a 5 en los 5 criterios). Quédate con las 2-3 que mejor califiquen.
  - |-
    \textbf{Paso 2 --- Crea el documento + portada (8 min).} Abre Word/Docs. \textbf{Portada (página 1):} título grande centrado tamaño 28 en negrita azul oscuro, tu nombre, grado, materia (Tecnología), fecha. Estética simple. \texttt{Ctrl+Enter} para saltar a página 2.
  - |-
    \textbf{Paso 3 --- Páginas 2 y 3: contenido (25 min).} En página 2: \textbf{encabezado} con tu nombre + grado + materia (tamaño 10, alineación derecha). \textbf{Título de sección}: nombre del tema en tamaño 16 negrita. Escribe 2 párrafos justificados con sangría. Inserta 1 \textbf{imagen} de fuente libre (Pixabay) con ajuste cuadrado + pie en cursiva tamaño 10. En página 3: continúa con 2 párrafos más, 1 \textbf{lista} (con viñetas o numerada), 1 \textbf{tabla} (mínimo 3 filas, encabezado en negrita). Aplica énfasis controlado.
  - |-
    \textbf{Paso 4 --- Pie de página + numeración (3 min).} En cualquiera de las páginas 2 o 3, inserta pie de página: \emph{``I.E. Sor María Juliana --- Cartago --- Mayo 2026''}. Inserta números de página en esquina inferior derecha. Configura para que la portada no se numere (la página 1 es la página de contenido, no la portada).
  - |-
    \textbf{Paso 5 --- Sección de fuentes citadas (4 min).} Al final de la página 3, escribe el subtítulo \textbf{``Fuentes citadas''}. Debajo, lista las 3 fuentes en formato simple: \emph{``Apellido, Nombre. Título del artículo. Nombre del sitio. Año. URL.''}. Si no tienes todos los datos, escribe los que sí tengas. Al lado de cada fuente, en cursiva, escribe la nota CRAAP (\emph{Total: 22/25}, por ejemplo).
  - |-
    \textbf{Paso 6 --- Autoevaluación + guardado (5 min).} En el cuaderno, marca con palomita ✓ los 10 elementos que SÍ aplicaste, y con X los que faltan. Cuenta tu nota: cada elemento aplicado vale 1 punto (sobre 10). Guarda el documento como \texttt{2026-cosecha-p3-mi-tema.docx} en \emph{Tecnologia/Periodo-3}. Firma en el cuaderno con la frase: \emph{``Terminé el periodo 3 con un documento que prueba todo lo que ahora sé hacer.''}.

  checklist:
    titulo: Antes de mostrar tu cosecha (los 10 elementos)
    items: |-
      \checkbox Documento creado y guardado con nombre correcto. \\[1mm]
      \checkbox Título formateado (negrita centrada azul tamaño 18). \\[1mm]
      \checkbox Párrafos justificados con sangría. \\[1mm]
      \checkbox Énfasis controlado (1-2 negritas/subrayados por párrafo). \\[1mm]
      \checkbox 1 lista con mínimo 3 ítems formato paralelo. \\[1mm]
      \checkbox 1 tabla con encabezado en negrita. \\[1mm]
      \checkbox 1 imagen con pie y ajuste cuadrado. \\[1mm]
      \checkbox Portada + encabezado + pie + numeración (páginas 2 y 3). \\[1mm]
      \checkbox Información verificable en 4 párrafos. \\[1mm]
      \checkbox 3 fuentes citadas con CRAAP al final.

  plantilla_guion: |-
    \textbf{Estructura del documento.} \textit{P1 (portada):} título 28pt + nombre + grado + fecha. \textit{P2:} encabezado + título sección + 2 párrafos + imagen con pie + pie+ \#1. \textit{P3:} encabezado + 2 párrafos + lista + tabla + fuentes CRAAP + pie + \#2. \textit{Cuaderno:} boceto + lista 10 elementos marcados.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi documento de cosecha del periodo 3». \textbf{Formato:} boceto de las 3 páginas + lista de 10 elementos con marca + nota final. \textbf{Extensión:} 1 página entera. \textbf{Sabes que terminaste cuando} marcaste los 10 elementos y tu nota de autoevaluación es 8/10 o más.

  producto_titulo: Documento informativo de 3 páginas con 10 elementos del periodo · cosecha
  criterios:
  - Los 10 elementos del checklist están aplicados (mínimo 8 de 10).
  - Tiene portada + 2 páginas de contenido + sección de fuentes.
  - El tema está investigado con 3 fuentes citadas y evaluadas CRAAP.
  - El formato es consistente y profesional.
  - El estudiante hace autoevaluación honesta en el cuaderno.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del aprendizaje integrado)"
    cita: |-
      ``Aprender en partes está bien. Pero solo al armar el rompecabezas completo sabes si de verdad aprendiste.''
    aplicacion: |-
      Durante este periodo viste 8 sesiones distintas: Word, formato, listas, tablas, imágenes, marco, internet, búsqueda, fuentes. Cada una sola parecía un pedazo aislado. \textbf{El documento de hoy es el rompecabezas armado}. Si puedes hacerlo completo con los 10 elementos, no es que \emph{``aprendiste''} cada parte: es que \emph{integraste el oficio}. Esa integración es la verdadera meta del aprendizaje.
    pregunta_espejo: |-
      ¿Cuántos elementos integré sin pensar y cuántos tuve que volver a revisar? Eso me dice qué tan asentado está el oficio.

  estoico:
    autor: "Marco Aurelio (emperador que valoraba el trabajo terminado)"
    cita: |-
      ``Lo terminado vale más que lo perfecto. Termina bien lo que empieces; perfecciona en el siguiente.''
    aplicacion: |-
      Tu documento de hoy no va a ser perfecto, y eso está bien. \textbf{Lo importante es que esté terminado con los 10 elementos integrados}. Después, mes a mes, irás perfeccionando: tu próximo documento será mejor que este, y el siguiente mejor que ese. Pero \emph{el primero terminado vale más que el imaginario perfecto que nunca empiezas}.
    pregunta_espejo: |-
      ¿Voy a entregar lo terminado, o me voy a quedar esperando perfeccionarlo sin entregar nada?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del documento como producto)"
    cita: |-
      ``El documento es la cosecha del pensamiento. Lo que no se documenta, no se conserva. Lo que no se conserva, se olvida.''
    aplicacion: |-
      Lo que aprendiste este periodo, \textbf{si no lo documentas en un trabajo concreto, se va a olvidar}. Por eso la cosecha del periodo no es \emph{``otra tarea''}: es la forma de \emph{conservar lo que ahora sabes}. Tu documento de cosecha, guardado en tu carpeta del periodo 3, será una prueba para tu yo de 30 años: \emph{``en 6° grado ya sabía hacer esto''}. Eso te da identidad como aprendiente.
    pregunta_espejo: |-
      ¿Estoy conservando lo que aprendo en documentos que puedo revisar, o lo dejo flotar en la memoria que se pierde?

compromiso: |-
  \textbf{Para la próxima sesión.} Guarda tu documento de cosecha en lugar seguro. La próxima sesión es la \textbf{Sesión 11 (cosecha formal del periodo)}: te autoevaluás con rúbrica visible, revisas el examen integrador del periodo 3, y te preparas para mirar atrás todo el año. Hoy mostraste que el oficio ya es tuyo. La próxima sesión consolidamos formalmente lo aprendido.

web:
  conceptos_clave:
    - termino: Documento informativo
      definicion: |-
        Texto que enseña información verídica sobre un tema, con fuentes citadas. No es opinión ni ensayo. Se usa para tareas escolares, informes universitarios y reportes profesionales.
      ejemplo: |-
        Un documento sobre "el volcán Nevado del Ruiz" que explica su historia, ubicación, erupciones, con datos sacados de 3 fuentes confiables citadas al final.
      emoji: "📃"
    - termino: Cosecha del periodo
      definicion: |-
        Trabajo final que reúne todo lo aprendido durante un periodo en un solo entregable. No es una tarea más: es la prueba de que el oficio integrado ya es tuyo.
      ejemplo: |-
        Tu documento de S10 P3 que aplica Word + formato + listas + tablas + imágenes + marco + búsqueda + fuentes en una sola pieza. Eso es cosecha.
      emoji: "🌾"
    - termino: Fuentes citadas
      definicion: |-
        Lista al final del documento que indica de dónde sacaste la información. Formato simple para 6° grado: Apellido, Nombre. Título del artículo. Sitio. Año. URL. Mínimo 3 fuentes.
      ejemplo: |-
        "Universidad Nacional. Estudio sobre el volcán Nevado del Ruiz. unal.edu.co. 2024. https://...". Eso es una cita básica de fuente.
      emoji: "📚"
    - termino: Rúbrica de autoevaluación
      definicion: |-
        Lista de elementos que un trabajo debe tener para considerarse completo. El estudiante mismo se evalúa marcando cuáles aplicó. Para 6° grado P3, son 10 elementos.
      ejemplo: |-
        Los 10 elementos: archivo correcto, título formateado, párrafos formateados, énfasis, lista, tabla, imagen, marco, información verificable, fuentes CRAAP. Marcas los que cumpliste.
      emoji: "📋"
    - termino: Integración de aprendizajes
      definicion: |-
        Capacidad de aplicar muchas habilidades aprendidas por separado en un solo trabajo. Es la diferencia entre 'saber por partes' y 'saber el oficio'.
      ejemplo: |-
        Aprender Word, formato, fuentes y otros por separado es paso 1. Hacer un documento que aplica los 10 elementos juntos sin pensar mucho es integración: oficio.
      emoji: "🧩"

  quiz:
    titulo: "¿Estás listo para entregar tu cosecha?"
    instrucciones: "5 preguntas para verificar que tu documento cumple los 10 elementos clave."
    preguntas:
      - enunciado: "Tu documento tiene contenido, pero no tiene portada. ¿Cumple los 10 elementos?"
        opciones:
          - "Sí, la portada es opcional."
          - "No, falta el elemento 8 (marco completo). La portada es parte del marco profesional."
          - "Sí, si el título es grande."
          - "No tiene importancia."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La portada separada es parte del marco profesional. Sin portada falta uno de los 10. Agrégala antes de entregar.
        feedback_incorrecto: |-
          La portada es elemento 8 del marco. Sin portada falta un elemento. Agrega 1 página al inicio con título grande, nombre, grado, fecha.
      - enunciado: "Citaste solo 1 fuente al final del documento. ¿Cumple?"
        opciones:
          - "Sí, 1 es suficiente."
          - "No, mínimo 3 fuentes con evaluación CRAAP."
          - "Solo si la fuente es muy buena."
          - "Sí, si la fuente es Wikipedia."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Mínimo 3 fuentes citadas para evitar depender de una sola perspectiva. Cada una con CRAAP rápido.
        feedback_incorrecto: |-
          Mínimo 3 fuentes citadas con CRAAP. Una sola fuente te hace depender de su perspectiva. Verificar en varias fuentes es buena práctica.
      - enunciado: "Tu lista de 3 ítems empieza así: 'Lavar las verduras, Cortar todo, La cocción final'. ¿Está bien?"
        opciones:
          - "Sí, perfecto."
          - "No, no tiene formato gramatical paralelo. Mejor: Lavar, Cortar, Cocer (todos en infinitivo)."
          - "Sí, los 3 son ítems válidos."
          - "Solo falta el cuarto."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Formato paralelo: todos los ítems con la misma estructura gramatical. Si arrancas con verbo en infinitivo, todos en infinitivo.
        feedback_incorrecto: |-
          Falla el formato paralelo. Si el primero es verbo (Lavar), todos verbo. La mezcla "Lavar las verduras / La cocción" se ve descuidada.
      - enunciado: "Tu tabla tiene 4 columnas pero la fila de encabezado NO está en negrita. ¿Está bien?"
        opciones:
          - "Sí, las tablas son flexibles."
          - "No, la fila de encabezado debe ir en negrita para diferenciarse."
          - "Sí, si tiene colores."
          - "Solo si la tabla es grande."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El encabezado en negrita es regla. Sin él, el lector no sabe qué es cada columna a primera vista.
        feedback_incorrecto: |-
          Encabezado en negrita siempre. Sin él, las columnas no se distinguen del contenido. Es como un libro sin títulos de capítulos.
      - enunciado: "Aplicaste 7 de los 10 elementos. ¿Está OK para entregar?"
        opciones:
          - "Sí, es suficiente."
          - "Mejor revisa los 3 que faltan y trata de aplicarlos. El objetivo es 8-10 de 10."
          - "Solo si los 3 que faltan son fáciles."
          - "10 son obligatorios siempre."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. 7/10 es regular. Tu objetivo es 8-10 para entrega. Revisa los 3 que faltan: probablemente son cosas rápidas que se completan en 10 minutos.
        feedback_incorrecto: |-
          La meta es 8-10 de 10. Los faltantes suelen tomar minutos extra. Antes de entregar, revisa qué te falta y complétalo.

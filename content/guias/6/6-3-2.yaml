clave: "3-2"
grado: 6
periodo: 3
sesion: 2
completo: true

titulo: "¿Qué es un procesador de texto? --- mi primera página escrita en digital"
titulo_portada: |-
  ¿Qué es un
  procesador de
  texto? ---
  mi primera
  página digital

producto_final: |-
  Un \textbf{documento digital titulado ``Mi primer texto digital''} con \textbf{3 párrafos} (introducción, desarrollo, cierre) sobre un tema personal que tú escojas (tu pueblo, tu materia favorita, tu mascota, lo que quieras). El documento se guarda en la carpeta correcta (siguiendo lo aprendido en G6·P2·S7), tiene nombre claro siguiendo las 5 reglas, y se imprime o se muestra en pantalla al profe. En el cuaderno: \textbf{captura impresa o boceto} del documento + \textbf{pasos que seguiste} numerados.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes era la maestra rural de la vereda La Plata, en Cartago, Valle del Cauca.} Hace 40 años, no había computadores. En su escuelita de una sola aula, doña Mercedes enseñaba a los niños del campo \textbf{a escribir}: tomar el lápiz, formar las letras, juntar las palabras, ordenar las ideas en párrafos. Para ella escribir era \emph{``ordenar el pensamiento para que otros lo entiendan''}. Repetía a sus alumnos: \emph{``Mijo, antes de escribir, pensar. Antes de juntar las palabras, ordenar las ideas. Una hoja escrita con cuidado vale más que cien escritas con prisa.''}. Esa misma sabiduría sigue viviendo, pero ahora la escritura no es solo en cuaderno: también es \textbf{digital}, en programas que se llaman \emph{procesadores de texto}. Aprender a usarlos no reemplaza el cuaderno (sigue siendo fundamental); \textbf{lo complementa}. Hoy doña Mercedes te enseña a escribir digital con el mismo cuidado con el que enseñaba a escribir en papel.

  saber_contemporaneo: |-
    Un \textbf{procesador de texto} es un programa para escribir documentos en el computador. Los más usados son \textbf{Microsoft Word} (parte de Office 365, con versión gratis estudiantil), \textbf{Google Docs} (gratis, en el navegador, guarda en Drive) y \textbf{LibreOffice Writer} (gratis, instalable). Los 3 hacen lo mismo: escribir, dar formato, guardar. La diferencia es \emph{dónde guardan} (Word en tu disco; Docs en la nube; LibreOffice en tu disco) y \emph{qué tan rico es el formato} (Word es el más completo). \textbf{Lo que no cambia}: la escritura sigue siendo \emph{pensar, ordenar, escribir, revisar}. Doña Mercedes te lo dijo. Hoy aprendes el procesador como herramienta nueva, pero el oficio sigue siendo el mismo.

  pregunta_puente: |-
    Si te pidieran escribir 3 párrafos sobre tu \emph{equipo de fútbol favorito} o sobre \emph{una tradición de tu familia}, ¿\textbf{lo escribirías en cuaderno o en computador}? ¿Hay diferencia entre los dos? ¿Cuál?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 3 procesadores de texto más comunes; (2) sabrás \textbf{aplicar} los 5 pasos para crear, escribir y guardar un documento; (3) podrás \textbf{distinguir} entre escribir en computador y en cuaderno (cuándo conviene cada uno); (4) habrás \textbf{creado} tu primer documento digital de 3 párrafos guardado correctamente.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: comparas los 3 procesadores, aprendes los 5 pasos para escribir y guardar, escoges tu tema, y creas tu documento real.
  a_escuta: |-
    Empezamos comparando Word, Google Docs y LibreOffice en 4 puntos.
  a_sistematizacion: |-
    Después aprendes los 5 pasos fundamentales: crear, escribir, guardar, nombrar, ubicar.
  a_praxis: |-
    Con los pasos claros, eliges tu tema y produces tu documento digital de 3 párrafos.
  a_producto: |-
    El producto es ese documento guardado + el resumen en cuaderno.
  a_evaluacion: |-
    Antes de salir, verificas que tu documento abre cuando lo das clic, que tiene 3 párrafos y que está en la carpeta correcta.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué escribir bien sigue siendo un acto de respeto al lector.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Comparar los 3 procesadores} (10 min · individual). En el cuaderno, dibuja una tabla de \textbf{3 columnas y 4 filas}. Columnas: \emph{Microsoft Word}, \emph{Google Docs}, \emph{LibreOffice Writer}. Filas: \emph{(a) ¿Es gratis o cuesta?}, \emph{(b) ¿Se usa con internet o sin internet?}, \emph{(c) ¿Dónde guarda los archivos?}, \emph{(d) ¿Qué pasa si lo abro en otro computador?}. Llena las 12 casillas con tu intuición. Si no sabes alguna, escribe \emph{``no sé''}. Después comparas con la sistematización.

  checks:
  - Dibujé la tabla 3x4 en el cuaderno.
  - Llené las 12 casillas con mi intuición.
  - No miré la siguiente actividad ni busqué en internet.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Comparando 3 procesadores». \textbf{Formato:} tabla 3 columnas × 4 filas. \textbf{Extensión:} 12 casillas llenas. \textbf{Sabes que terminaste cuando} tienes la tabla completa, aunque haya casillas con \emph{``no sé''}.

sistematizacion:
  intro: |-
    Ahora compara tu tabla con la realidad. Vas a descubrir que cada procesador tiene ventajas distintas, y eso te ayuda a decidir cuál usar según la situación.

  pilares:
  - |-
    \textbf{Microsoft Word.} \emph{Costo:} cuesta (parte de Office 365), pero los colegios tienen licencia gratis para estudiantes. \emph{Internet:} se usa SIN internet. \emph{Guardado:} en tu disco duro (o en OneDrive si lo conectas). \emph{Otros equipos:} si llevas tu archivo en USB y abres en otro Word, todo se ve igual. \emph{Cuándo conviene:} para trabajos formales, tareas serias del colegio, cuando necesitas formato sofisticado.
  - |-
    \textbf{Google Docs.} \emph{Costo:} gratis (solo necesitas cuenta de Google). \emph{Internet:} se usa CON internet (también funciona algo sin internet, pero limitado). \emph{Guardado:} en la nube (Google Drive); puedes verlo desde cualquier dispositivo con tu cuenta. \emph{Otros equipos:} entras a docs.google.com en cualquier computador, te abre tu archivo. \emph{Cuándo conviene:} para trabajos en grupo (varios escribiendo a la vez), para no perder archivos al cambiar de computador, para colegio.
  - |-
    \textbf{LibreOffice Writer.} \emph{Costo:} gratis (descarga la suite). \emph{Internet:} se usa SIN internet. \emph{Guardado:} en tu disco. \emph{Otros equipos:} si la persona también tiene LibreOffice, se ve igual. Si la abren en Word, casi siempre se ve bien pero puede haber detalles distintos. \emph{Cuándo conviene:} si no tienes Word y no quieres pagar; en computadores Linux; en casa donde nadie tiene Office.
  - |-
    \textbf{Los 5 pasos universales para crear y guardar un documento.} \textbf{(1) Crear:} abrir el programa (Word, Docs, etc.). \textbf{(2) Escribir:} el contenido en orden (título, párrafos). \textbf{(3) Guardar:} pulsar \texttt{Ctrl+G} (Guardar) o \texttt{Ctrl+S} en inglés (de \emph{Save}). \textbf{(4) Nombrar bien:} aplicar las 5 reglas que aprendiste en S7 (sin espacios, sin acentos, claro, con fecha si aplica). \textbf{(5) Ubicar en carpeta:} guardar en la carpeta correcta de tu árbol (no en el escritorio amontonado).

  anatomia:
    titulo: 3 procesadores + 5 pasos universales
    body: |-
      \textbf{Procesadores:} Word (cuesta, sin internet) · Docs (gratis, con internet, en nube) · LibreOffice (gratis, sin internet). \\[1mm]
      \textbf{5 pasos:} crear · escribir · guardar (Ctrl+G) · nombrar bien · ubicar en carpeta.

  errores_comunes: |-
    \textbf{Errores que se cometen al empezar con procesadores.} (1) \emph{``No guardé nada hasta el final''} --- y el computador se apaga: pierdes todo. La regla es guardar cada 5 minutos. (2) \emph{``Lo guardé en el escritorio''} --- y a la semana no lo encuentras. La regla es ubicarlo en la carpeta correcta. (3) \emph{``Le puse de nombre tarea1.docx''} --- y después tienes tarea2, tarea3, tarea4. La regla es nombre claro con fecha. (4) \emph{``Hice todo el formato en Word y lo abrí en Docs y se desconfiguró''} --- normal. Para evitar: termina en el procesador en el que vas a entregar. (5) \emph{``Cerré sin guardar y dije sí a no guardar''} --- recuperación es difícil. Lee siempre los avisos antes de cerrar.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Los 5 pasos para escribir digital». \textbf{Formato:} lista numerada del 1 al 5. Cada paso: nombre + cómo se hace + atajo de teclado si aplica. \textbf{Extensión:} 5 líneas. \textbf{Sabes que terminaste cuando} podrías hacerle un tutorial verbal a tu mamá de cómo guardar un documento.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tu primer documento digital de 3 párrafos} (30 min · individual). Vas a crear tu \textbf{primer documento digital}. Si tienes computador en clase, lo haces ahí. Si no, lo planificas en el cuaderno y lo creas en casa esta semana. Tema libre: pueblo, tradición familiar, mascota, equipo de fútbol, materia favorita, lo que tú quieras.

  pilares:
  - |-
    \textbf{Paso 1 --- Decide el tema y el procesador.} En el cuaderno escribe: \emph{``Tema: ...''} y \emph{``Procesador que voy a usar: Word / Docs / LibreOffice''}. Si en el colegio hay Word, úsalo. Si tienes cuenta Google, Docs también funciona.
  - |-
    \textbf{Paso 2 --- Planifica los 3 párrafos en el cuaderno PRIMERO.} \textbf{Doña Mercedes lo dice}: \emph{antes de escribir, pensar}. En 3 líneas anota la idea principal de cada párrafo. Ejemplo: \emph{``Párrafo 1 (introducción): voy a hablar de mi gato Murcio. Párrafo 2 (desarrollo): cuento sus 3 características raras y una anécdota. Párrafo 3 (cierre): qué he aprendido de él.''}.
  - |-
    \textbf{Paso 3 --- Crea el documento.} Abre el procesador. Aparece una página en blanco. Escribe el título arriba (centrado): \emph{``Mi primer texto digital --- [tu tema]''}. Salta 2 líneas (presiona Enter 2 veces).
  - |-
    \textbf{Paso 4 --- Escribe los 3 párrafos.} Cada párrafo debe tener entre 3 y 5 líneas. \textbf{No copies de internet}: doña Mercedes te diría que la voz que vale es la tuya, no la de un sitio web. Si necesitas datos, los pones después con tus palabras. Escribe sin parar mucho; después revisas.
  - |-
    \textbf{Paso 5 --- Guarda con criterio.} Pulsa \texttt{Ctrl+G} (Word) o \texttt{Ctrl+S}. Aparece un cuadro pidiendo nombre y carpeta. \textbf{Nombre:} aplica las 5 reglas (ejemplo: \emph{``2026-mi-primer-texto-gato.docx''}). \textbf{Carpeta:} la de tu árbol --- \texttt{Mis-documentos/Colegio/Tecnologia/Periodo-3} (si la tienes; si no, crea la carpeta aquí mismo).
  - |-
    \textbf{Paso 6 --- Verifica y registra.} Cierra el documento. Búscalo en su carpeta y vuelve a abrirlo: si abre y se ve bien, está OK. En el cuaderno escribe (con dibujo o lista): \emph{``(a) Tema escogido: ..., (b) Procesador usado: ..., (c) Ruta donde guardé: ..., (d) Tamaño del archivo: ...''}. Esto deja constancia en tu cuaderno físico de que cumpliste.

  checklist:
    titulo: Antes de mostrar el documento al profe
    items: |-
      \checkbox El tema lo escogí yo, no me lo impuso nadie. \\[1mm]
      \checkbox Planifiqué los 3 párrafos en el cuaderno antes de escribir en digital. \\[1mm]
      \checkbox El documento tiene título centrado arriba. \\[1mm]
      \checkbox Los 3 párrafos tienen entre 3 y 5 líneas cada uno. \\[1mm]
      \checkbox El documento está guardado con nombre que sigue las 5 reglas. \\[1mm]
      \checkbox Está en la carpeta correcta de mi árbol (no en el escritorio).

  plantilla_guion: |-
    \textbf{Plantilla del documento.} \textit{Arriba (centrado):} título de 1 línea. \textit{2 saltos.} \textit{Párrafo 1 (introducción):} 3-5 líneas, sobre qué vas a hablar. \textit{Párrafo 2 (desarrollo):} 3-5 líneas, lo principal del tema. \textit{Párrafo 3 (cierre):} 3-5 líneas, conclusión o aprendizaje. \textit{Guardado:} 2026-tema.docx en la carpeta de Tecnologia/Periodo-3.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi primer documento digital». \textbf{Formato:} planificación de los 3 párrafos (3 líneas) + registro de creación (tema, procesador, ruta, tamaño) + si es posible, una captura impresa pegada o boceto del documento. \textbf{Extensión:} 1 página del cuaderno. \textbf{Sabes que terminaste cuando} tu documento abre desde su carpeta y se ve como lo planeaste.

  producto_titulo: Mi primer documento digital de 3 párrafos · guardado correctamente
  criterios:
  - El tema lo escogió el estudiante.
  - Hay 3 párrafos con sentido (introducción, desarrollo, cierre).
  - El nombre del archivo sigue las 5 reglas (sin espacios, sin acentos, claro, fecha).
  - Está en la carpeta correcta del árbol de organización.
  - El estudiante puede mostrar el archivo abriéndolo en clase o en casa.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la palabra propia)"
    cita: |-
      ``Escribir con tu voz, no con voz prestada. Esa es la primera disciplina del que aprende.''
    aplicacion: |-
      Cuando empiezas a escribir digital, la tentación más grande es \textbf{copiar de internet}: hay millones de textos disponibles. Pero \emph{copiar no te enseña a escribir}. Doña Mercedes lo sabía: el alumno que copia se siente seguro hoy y queda sin voz mañana. El alumno que escribe lo suyo (aunque tenga errores) está construyendo su propia voz. La voz propia es lo único que de verdad importa al final.
    pregunta_espejo: |-
      ¿Estoy escribiendo con mi voz o con voces prestadas que aún no sé reconocer como mías?

  estoico:
    autor: "Marco Aurelio (emperador que escribía sus reflexiones diarias)"
    cita: |-
      ``Escribir es pensar despacio. Hablar es pensar rápido. Los dos son necesarios; el lento construye más.''
    aplicacion: |-
      Hablamos todo el día sin pensar mucho. \textbf{Escribir obliga a frenar}: a elegir palabra exacta, a ordenar la idea, a corregir. Por eso escribir te hace mejor pensador, aunque al principio sea difícil. \emph{Marco Aurelio escribió sus reflexiones más profundas en cartas y diarios}. Tú con un documento de 3 párrafos estás haciendo lo mismo: pensar despacio. Ese hábito te acompañará.
    pregunta_espejo: |-
      ¿Estoy aprovechando la escritura para pensar despacio, o solo escribo por obligación?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la escritura digital)"
    cita: |-
      ``El procesador de texto no cambia qué es escribir. Cambia el ritmo, la facilidad de revisar, la capacidad de compartir. Lo demás es lo mismo de siempre.''
    aplicacion: |-
      Algunas personas creen que \textbf{escribir digital es ``moderno'' y escribir en cuaderno es ``viejo''}. Falso. \emph{Son herramientas distintas para el mismo oficio}. El cuaderno es íntimo y lento. El procesador es público y rápido. Los dos sirven, dependiendo de qué quieres escribir. La maestra rural del campo y la programadora de Silicon Valley hacen lo mismo: escribir para ser entendidas.
    pregunta_espejo: |-
      ¿Qué cosas escribo mejor en cuaderno y qué cosas escribo mejor en digital?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, abre tu primer documento al menos 2 veces más para releerlo y mejorarlo. Cada vez que lo releas, vas a notar algo: una palabra mejor, un párrafo más claro, un error que corregir. La próxima clase aprendes \textbf{formato básico}: tipos de letra, tamaños, alineación, color. Vas a transformar tu documento de \emph{texto plano} a \emph{texto con presencia}. Hoy escribiste; la próxima vez presentas.

web:
  conceptos_clave:
    - termino: Procesador de texto
      definicion: |-
        Programa para escribir y dar formato a documentos digitales. Los más usados son Microsoft Word (de pago, en colegios suele ser gratis), Google Docs (gratis, en la nube) y LibreOffice Writer (gratis, instalable).
      ejemplo: |-
        Si tu profe te pide entregar una tarea escrita, abres Word o Docs, escribes los párrafos, le das formato y entregas. Eso es procesar texto.
      emoji: "📝"
    - termino: Microsoft Word
      definicion: |-
        El procesador de texto más usado en el mundo. Parte de Microsoft Office 365. Suele tener licencia gratis para estudiantes en colegios. Funciona sin internet y guarda en tu disco duro.
      ejemplo: |-
        En la sala de sistemas del colegio probablemente está instalado Word. Abres, escribes, guardas con Ctrl+G en tu carpeta de Documentos.
      emoji: "🔵"
    - termino: Google Docs
      definicion: |-
        Procesador de texto gratuito de Google. Funciona en el navegador con internet, y guarda en Google Drive (la nube). Permite escribir en grupo: varios pueden estar en el mismo documento al mismo tiempo.
      ejemplo: |-
        Para una tarea en grupo, abres Docs, compartes el link con 3 compañeros, todos escriben a la vez en sus casas. Ahorra mucho tiempo.
      emoji: "🟢"
    - termino: Ctrl+G (o Ctrl+S)
      definicion: |-
        El atajo de teclado para guardar el documento en español (Ctrl+G de Guardar) o en inglés (Ctrl+S de Save). Hay que guardar cada pocos minutos para no perder el trabajo si el computador se apaga.
      ejemplo: |-
        Estás escribiendo y de repente se va la luz. Si guardaste hace 5 minutos con Ctrl+G, pierdes solo lo de los últimos 5 minutos. Si no guardaste, pierdes todo.
      emoji: "💾"
    - termino: Nombre del archivo
      definicion: |-
        El nombre que le das al documento al guardarlo. Debe seguir las 5 reglas (sin espacios, sin acentos, claro, con fecha si aplica). Un buen nombre te ahorra horas de búsqueda en el futuro.
      ejemplo: |-
        Bien: "2026-tarea-historia-medios.docx". Mal: "tarea final hjfdks.docx". El primero dice exactamente qué es y cuándo lo hiciste.
      emoji: "🏷️"

  quiz:
    titulo: "¿Sabes usar un procesador de texto?"
    instrucciones: "5 preguntas para verificar que dominas crear, escribir y guardar tu primer documento."
    preguntas:
      - enunciado: "¿Cuál es la principal diferencia entre Word y Google Docs?"
        opciones:
          - "Word es más bonito que Docs."
          - "Word funciona sin internet y guarda en disco. Docs necesita internet y guarda en la nube."
          - "Docs es más complicado que Word."
          - "Son lo mismo, solo cambia el color."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Word: sin internet, guarda en tu disco. Docs: con internet, guarda en Drive. Cada uno conviene en situaciones distintas.
        feedback_incorrecto: |-
          Word: sin internet, guarda en disco. Docs: con internet, guarda en la nube. Por eso Docs te deja entrar desde cualquier computador con tu cuenta.
      - enunciado: "Estás escribiendo en Word y se va la luz. ¿Qué pasa con tu documento?"
        opciones:
          - "Se guarda solo, no se pierde nada."
          - "Pierdes lo que no habías guardado con Ctrl+G."
          - "Word lo manda automáticamente al correo."
          - "El documento se vuelve invisible."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Si no guardaste con Ctrl+G, pierdes el trabajo desde el último guardado. Por eso la regla: guardar cada 5 minutos.
        feedback_incorrecto: |-
          Pierdes el trabajo no guardado. Guardar cada 5 minutos con Ctrl+G es la regla. Word tiene auto-guardado pero no es 100% confiable.
      - enunciado: "Vas a hacer una tarea en grupo con 3 compañeros desde sus casas. ¿Cuál procesador conviene más?"
        opciones:
          - "Word, porque es el más completo."
          - "Google Docs, porque permite que varios escriban al mismo tiempo."
          - "LibreOffice, porque es gratis."
          - "Ningún procesador, mejor manuscrito."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Google Docs es perfecto para trabajos en grupo: todos en el mismo documento, ven en vivo lo que escriben los demás. Ahorra tiempo.
        feedback_incorrecto: |-
          Google Docs gana para trabajo en grupo: varios escriben a la vez, todos ven los cambios. Word colaborativo también existe (Office 365) pero menos común en colegio.
      - enunciado: "¿Cuál es el mejor nombre para tu documento de tarea de historia sobre la independencia?"
        opciones:
          - "tarea1.docx"
          - "Mi tarea de historia 2026.docx"
          - "2026-historia-independencia.docx"
          - "documento.docx"
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Sigue las 5 reglas: sin espacios (guion), sin acentos, claro, con fecha. Tu yo del próximo año encuentra el archivo solo leyendo el nombre.
        feedback_incorrecto: |-
          El bueno es "2026-historia-independencia.docx". Sin espacios, sin acentos, claro, con fecha. "tarea1" no dice nada; "Mi tarea" tiene espacios.
      - enunciado: "Doña Mercedes te diría que antes de escribir digital, hay que..."
        opciones:
          - "Encender el computador rápido."
          - "Pensar y ordenar las ideas en el cuaderno primero."
          - "Buscar en Google y copiar."
          - "Tomar fotos del tema."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Pensar primero, escribir después. Doña Mercedes lo decía hace 40 años; sigue siendo verdad. Lo digital sirve, pero el orden de las ideas viene antes.
        feedback_incorrecto: |-
          Primero piensas y ordenas en cuaderno. Después escribes en digital. El procesador no piensa por ti; eres tú quien organiza las ideas.

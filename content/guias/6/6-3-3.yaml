clave: "3-3"
grado: 6
periodo: 3
sesion: 3
completo: true

titulo: "Formato básico --- darle voz visual a lo que escribo"
titulo_portada: |-
  Formato
  básico ---
  darle
  voz visual
  a mi texto

producto_final: |-
  Tu documento de la S2 (los 3 párrafos) ahora con \textbf{formato profesional aplicado}: título en \emph{negrita centrada con tamaño 18}, párrafos en \emph{tamaño 12 justificados con sangría en primera línea}, \textbf{una palabra clave subrayada} en cada párrafo, \textbf{una idea importante en negrita} por párrafo, y \textbf{color sutil} en el título (azul oscuro). Más \textbf{una tabla en el cuaderno} con los 8 atajos de teclado que usaste, con dibujo de la combinación.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural de la vereda La Plata de Cartago decía: ``La letra entra con buena presentación.''} Cuando los niños campesinos le entregaban sus tareas, ella miraba 2 cosas: \textbf{el contenido} (¿qué dice?) y \textbf{la presentación} (¿se entiende a primera vista?). Una tarea con letra clara, márgenes respetados, títulos subrayados y palabras importantes resaltadas comunicaba al lector que el alumno se había tomado el trabajo en serio. Una tarea descuidada, sin importar qué tan inteligente fuera el contenido, daba pereza leer. \textbf{Doña Mercedes no era exigente por capricho}: enseñaba que \emph{la presentación es la primera forma de respeto al lector}. Hoy escribes en digital, pero \textbf{la regla sigue intacta}: dar formato no es decoración --- es respeto. Y los procesadores de texto te dan herramientas para hacerlo en segundos.

  saber_contemporaneo: |-
    El \textbf{formato} es la apariencia visual del texto: tipo de letra (\emph{fuente}), tamaño, color, alineación, énfasis. Cuando un documento está bien formateado, el lector \emph{ve la estructura antes de leer}: títulos arriba, lo importante resaltado, párrafos ordenados. \textbf{Los 5 elementos básicos de formato} son: \textbf{(1) Fuente}: tipo de letra (Arial, Calibri, Times New Roman). \textbf{(2) Tamaño}: 10-12 para texto normal, 14-18 para títulos. \textbf{(3) Estilo}: negrita (B), cursiva (I), subrayado (U). \textbf{(4) Alineación}: izquierda, centrada, derecha, justificada. \textbf{(5) Color}: el texto en negro siempre, los títulos pueden ir en azul oscuro o gris oscuro. Aprender estos 5 elementos te permite \textbf{transformar un texto plano en un documento profesional} en 2 minutos.

  pregunta_puente: |-
    Dos compañeros entregan una tarea con el mismo contenido. Uno la entrega \emph{con todo el texto en una sola masa, sin títulos, sin nada destacado}. El otro la entrega \emph{con título centrado en negrita, palabras importantes destacadas, párrafos separados}. ¿\textbf{Cuál crees que se va a leer primero}? ¿Por qué?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 5 elementos básicos de formato; (2) sabrás \textbf{aplicar} los 8 atajos de teclado más útiles; (3) podrás \textbf{evaluar} si un documento tiene buen formato o no; (4) habrás \textbf{aplicado} formato profesional a tu documento de la S2.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas los 5 elementos de formato, memorizas los 8 atajos clave, aplicas formato a tu documento de la S2, y armas tu tabla de atajos.
  a_escuta: |-
    Empezamos comparando 2 versiones del mismo texto: una sin formato y una con formato.
  a_sistematizacion: |-
    Después aprendes los 5 elementos + los 8 atajos de teclado más útiles.
  a_praxis: |-
    Con los atajos en mente, abres tu documento de la S2 y le das formato profesional.
  a_producto: |-
    El producto es ese documento formateado + la tabla de atajos en el cuaderno.
  a_evaluacion: |-
    Antes de salir, comparas tu documento antes y después: ¿se siente más profesional ahora?
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué dar formato es un acto de respeto al lector.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Comparar 2 versiones del mismo texto} (10 min · individual). Lee estos 2 textos. Tienen exactamente el mismo contenido, solo cambia el formato.\\[2mm] \textbf{VERSIÓN A (sin formato):} \emph{``Cartago es una ciudad del valle del cauca colombia esta en el norte del departamento se fundó en 1540 por jorge robledo es famosa por su cultura cafetera tiene un parque central llamado parque de bolívar la gente es amable y cálida vivir allí es agradable''}.\\[2mm] \textbf{VERSIÓN B (con formato):} título \emph{``Cartago, Valle''} grande y centrado; un párrafo con palabras clave en negrita (\emph{Cartago}, \emph{1540}, \emph{Jorge Robledo}), una palabra subrayada (\emph{cafetera}), todo el texto justificado con sangría. \textbf{En el cuaderno responde:} \emph{(a) ¿Cuál se entiende más rápido?} \emph{(b) ¿Cuál parece más profesional?} \emph{(c) ¿Cuál vas a leer primero si tienes prisa?}.

  checks:
  - Leí las 2 versiones con calma.
  - Respondí las 3 preguntas con honestidad.
  - Note la diferencia clara entre las dos.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Texto con y sin formato». \textbf{Formato:} 3 respuestas cortas a las 3 preguntas. \textbf{Extensión:} 3 líneas. \textbf{Sabes que terminaste cuando} entiendes intuitivamente por qué el formato importa.

sistematizacion:
  intro: |-
    Lo que viste es real: \textbf{el mismo contenido se siente totalmente distinto según el formato}. Ahora aprenderás los \textbf{5 elementos} para aplicar y los \textbf{8 atajos de teclado} que te harán rápido.

  pilares:
  - |-
    \textbf{Elemento 1 --- Fuente (tipo de letra).} La que viene por defecto en Word es \emph{Calibri}. Otras populares: \emph{Arial} (sencilla), \emph{Times New Roman} (clásica para informes), \emph{Verdana} (legible en pantalla). \textbf{Regla:} usa \emph{máximo 2 fuentes} en un documento --- una para títulos, otra para texto. Más de 2 = caos visual. \textbf{Elemento 2 --- Tamaño.} \emph{12 puntos} es el estándar para texto. \emph{10-11} para notas pequeñas. \emph{14-18} para títulos. \emph{20+} solo para portadas. \emph{Regla:} no cambies el tamaño dentro del mismo párrafo.
  - |-
    \textbf{Elemento 3 --- Estilo (negrita, cursiva, subrayado).} \textbf{Negrita (Ctrl+N o Ctrl+B)}: para \emph{ideas importantes}, no para párrafos enteros. \emph{Cursiva (Ctrl+K o Ctrl+I)}: para citas, palabras en otro idioma, títulos de libros. \emph{Subrayado (Ctrl+S o Ctrl+U)}: para palabras clave o términos técnicos. \textbf{Regla:} usa cada estilo en máximo \emph{2-3 palabras por párrafo}. Más, pierde el énfasis.
  - |-
    \textbf{Elemento 4 --- Alineación.} \emph{Izquierda (Ctrl+Q)}: la usual para texto, ideal para correos y cartas. \emph{Centrada (Ctrl+E)}: solo para títulos y citas destacadas. \emph{Derecha (Ctrl+D)}: para fechas y firmas. \emph{Justificada (Ctrl+J)}: el texto se estira para que llegue a los 2 márgenes, da aspecto profesional. \textbf{Regla:} usa \emph{justificada} para documentos formales, \emph{izquierda} para informales.
  - |-
    \textbf{Elemento 5 --- Color.} \emph{Negro}: SIEMPRE para el texto del cuerpo. Cambiar el color del texto cuerpo a otro color hace ver el documento infantil. \emph{Azul oscuro, gris oscuro, vino tinto:} aceptables solo para títulos. \textbf{Nunca:} amarillo, rosado fucsia, verde fluorescente en texto principal. \textbf{Los 8 atajos clave para memorizar:} (1) \texttt{Ctrl+N} = negrita; (2) \texttt{Ctrl+K} = cursiva; (3) \texttt{Ctrl+S} = subrayado; (4) \texttt{Ctrl+E} = centrar; (5) \texttt{Ctrl+J} = justificar; (6) \texttt{Ctrl+G} = guardar; (7) \texttt{Ctrl+Z} = deshacer; (8) \texttt{Ctrl+C / Ctrl+V} = copiar y pegar.

  anatomia:
    titulo: 5 elementos + 8 atajos
    body: |-
      \textbf{5 elementos:} fuente · tamaño · estilo · alineación · color. \\[1mm]
      \textbf{8 atajos:} \\[1mm]
      Ctrl+N (negrita) · Ctrl+K (cursiva) · Ctrl+S (subrayado) \\[1mm]
      Ctrl+E (centrar) · Ctrl+J (justificar) · Ctrl+G (guardar) \\[1mm]
      Ctrl+Z (deshacer) · Ctrl+C/V (copiar/pegar).

  errores_comunes: |-
    \textbf{Errores de formato que dejan mal un documento.} (1) \emph{Todo en mayúsculas}: parece que gritas y se lee peor. (2) \emph{Muchas fuentes mezcladas}: parece collage de niño. (3) \emph{Colores chillones}: rosado, amarillo fluorescente, verde fluorescente. (4) \emph{Negrita en todo el texto}: pierde el énfasis (si todo es importante, nada es importante). (5) \emph{Tamaños distintos entre párrafos}: parece error de copy-paste. (6) \emph{Cursivas para enfatizar lo importante}: la cursiva es para citas y palabras extranjeras, NO para énfasis fuerte (esa es la negrita).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 5 elementos + 8 atajos». \textbf{Formato:} 2 bloques. Bloque A: tabla de 5 filas con \emph{elemento + regla principal}. Bloque B: tabla de 8 filas con \emph{atajo + qué hace + dibujo de la combinación de teclas} (un cuadrito por tecla). \textbf{Extensión:} 5 + 8 filas. \textbf{Sabes que terminaste cuando} podrías formatear un texto sin necesidad de mirar la barra de menú.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Formatear tu documento de la S2} (28 min · individual). Vas a abrir el documento de \emph{Mi primer texto digital} que creaste en S2 y le aplicarás formato profesional usando los 8 atajos.

  pilares:
  - |-
    \textbf{Paso 1 --- Abre tu documento.} Ve a la carpeta donde lo guardaste y haz doble clic. Si no lo encuentras, créalo de nuevo siguiendo S2 con 3 párrafos sobre un tema tuyo.
  - |-
    \textbf{Paso 2 --- Formatea el título.} Selecciona el título (mantener clic izquierdo desde el inicio del título y arrastrar hasta el final). Aplica: \textbf{Ctrl+N (negrita)}, \textbf{Ctrl+E (centrar)}, cambia el \textbf{tamaño a 18} (en el cuadro de tamaño de la barra de arriba), y cambia el \textbf{color a azul oscuro} (en el menú de color de texto, escoge un azul que no sea fluorescente).
  - |-
    \textbf{Paso 3 --- Formatea los párrafos.} Selecciona los 3 párrafos completos. Aplica: \textbf{Ctrl+J (justificar)}, asegúrate de que estén en \textbf{tamaño 12}, fuente \emph{Calibri} o \emph{Arial}, color \emph{negro}.
  - |-
    \textbf{Paso 4 --- Resalta lo importante.} En cada uno de los 3 párrafos: identifica \textbf{1 palabra clave} y subráyala (selecciónala + Ctrl+S). Identifica \textbf{1 idea importante} (3-5 palabras) y ponla en negrita (selecciónala + Ctrl+N). En total tu documento tendrá 3 subrayados y 3 negritas. Ni más ni menos --- el énfasis se pierde si abusas.
  - |-
    \textbf{Paso 5 --- Sangría en primera línea.} En Word, para cada párrafo, presiona \texttt{Tab} al inicio del párrafo --- la primera línea queda con sangría (entra un poco hacia adentro). Esto se ve profesional. Lo haces para los 3 párrafos.
  - |-
    \textbf{Paso 6 --- Guarda y compara.} Pulsa \texttt{Ctrl+G}. El documento se actualiza. \textbf{Ahora compáralo con la versión que tenías en S2}. Mira la diferencia visual: la nueva versión se ve \emph{profesional}. En el cuaderno escribe: \emph{``Antes/Después: el cambio más notable es...''}.

  checklist:
    titulo: Antes de mostrar tu documento formateado
    items: |-
      \checkbox El título está en negrita, centrado, tamaño 18, color azul oscuro. \\[1mm]
      \checkbox Los 3 párrafos están justificados, tamaño 12, color negro. \\[1mm]
      \checkbox Hay 1 palabra subrayada en cada párrafo (3 en total). \\[1mm]
      \checkbox Hay 1 idea en negrita en cada párrafo (3 en total). \\[1mm]
      \checkbox La primera línea de cada párrafo tiene sangría. \\[1mm]
      \checkbox El documento está guardado con el mismo nombre.

  plantilla_guion: |-
    \textbf{Estructura del documento formateado.} \textit{Título:} negrita + centrado + tamaño 18 + azul oscuro. \textit{Cada párrafo:} justificado + tamaño 12 + negro + sangría primera línea. \textit{En cada párrafo:} 1 palabra subrayada + 1 idea en negrita. \textit{Atajos usados:} Ctrl+N, Ctrl+S, Ctrl+E, Ctrl+J, Ctrl+G.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi documento con formato profesional». \textbf{Formato:} captura impresa del documento formateado (si tienes acceso a impresora) o boceto en el cuaderno + tabla de los 8 atajos con dibujo de la combinación de teclas + reflexión de 2 líneas comparando antes/después. \textbf{Extensión:} 1 página entera del cuaderno. \textbf{Sabes que terminaste cuando} si miras tu documento de la S2 al lado del de hoy, sientes el salto de calidad.

  producto_titulo: Documento formateado profesionalmente + tabla de 8 atajos · firmado
  criterios:
  - El título tiene negrita, centrado, tamaño 18 y color azul oscuro.
  - Los párrafos están justificados con sangría en primera línea.
  - Hay énfasis controlado (1 subrayado + 1 negrita por párrafo).
  - El estudiante usó los atajos de teclado (no solo el menú de la barra).
  - La tabla de atajos está en el cuaderno con dibujo de la combinación.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del respeto al lector)"
    cita: |-
      ``El formato es el primer abrazo que le das a quien te va a leer. Una página bien presentada dice: te respeto.''
    aplicacion: |-
      Cuando dejas tu documento sin formato, le dices al lector: \emph{``arréglatelas para entenderme''}. Cuando lo formateás bien, le dices: \emph{``te facilito el camino''}. Doña Mercedes, en la escuela rural, exigía buena presentación porque sabía que \textbf{leer es esfuerzo}: si tú no ayudas con formato, el lector tiene que poner el doble. Por eso \textbf{el formato es ética}, no decoración.
    pregunta_espejo: |-
      Cuando entrego un documento, ¿le facilito el camino al lector o lo dejo solo?

  estoico:
    autor: "Marco Aurelio (emperador que escribía con orden y disciplina)"
    cita: |-
      ``Lo que está ordenado por fuera ayuda a la mente a ordenarse por dentro.''
    aplicacion: |-
      Cuando \textbf{formateas bien un documento}, no solo ayudas al lector: también te ayudas a ti. Tu cerebro \emph{ve} la estructura y \emph{piensa} más claro. Si revisas algo desordenado, tu mente se confunde; si revisas algo ordenado, encuentras errores y mejoras rápido. El formato es \emph{disciplina externa que produce claridad interna}.
    pregunta_espejo: |-
      ¿Cómo afecta a mi propio pensamiento el desorden visual de un documento?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del documento digital)"
    cita: |-
      ``Un documento digital bien formateado es un acto cívico: respeta el tiempo de quien lo leerá, sea uno o mil.''
    aplicacion: |-
      Lo que escribes en digital puede ser leído por \textbf{muchas personas}: tu profe, tus papás, tus compañeros, futuros colegas, lectores que no conoces. Si tu documento está bien formateado, \textbf{respetas el tiempo de cada uno de ellos}. Si no, los obligas a perder tiempo descifrando. \emph{Formatear bien es ciudadanía digital}: cuidar el tiempo común.
    pregunta_espejo: |-
      ¿Mis documentos respetan el tiempo de quien va a leerlos?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, formateás cualquier tarea que entregues en digital usando los 8 atajos. No es opcional: es tu nueva firma. La próxima clase aprendes \textbf{listas, viñetas y numeración} --- las herramientas para mostrar información estructurada. Vas a poder transformar un párrafo confuso en una lista limpia que se entiende en 5 segundos.

web:
  conceptos_clave:
    - termino: Formato
      definicion: |-
        La apariencia visual del texto en un documento: fuente, tamaño, color, estilo, alineación. Un buen formato hace que la estructura del documento se vea antes de leerlo. No es decoración: es respeto al lector.
      ejemplo: |-
        El mismo texto sobre Cartago en una sola masa sin formato vs. con título centrado en negrita y palabras importantes resaltadas. La segunda versión se lee 3 veces más rápido.
      emoji: "🎨"
    - termino: Negrita (Ctrl+N)
      definicion: |-
        Estilo que pone el texto más grueso. Se usa para destacar ideas importantes dentro de un párrafo. Atajo: Ctrl+N en español, Ctrl+B en inglés. Regla: máximo 2-3 palabras destacadas por párrafo.
      ejemplo: |-
        En "Cartago se fundó en 1540", podrías poner "1540" en negrita porque es el dato clave. Pero no pongas la frase entera en negrita: pierde el énfasis.
      emoji: "𝐁"
    - termino: Alineación justificada (Ctrl+J)
      definicion: |-
        Alineación donde el texto se estira para llegar a los dos márgenes (izquierdo y derecho). Da aspecto profesional, como en libros e informes. Atajo: Ctrl+J.
      ejemplo: |-
        Los libros impresos tienen texto justificado: las líneas terminan parejas a la derecha. En documentos informales se usa alineación izquierda; en formales, justificada.
      emoji: "📰"
    - termino: Atajos de teclado
      definicion: |-
        Combinaciones de teclas que ejecutan acciones rápidamente sin usar el ratón. Los 8 esenciales: Ctrl+N (negrita), Ctrl+K (cursiva), Ctrl+S (subrayado), Ctrl+E (centrar), Ctrl+J (justificar), Ctrl+G (guardar), Ctrl+Z (deshacer), Ctrl+C/V (copiar/pegar).
      ejemplo: |-
        Para hacer una palabra negrita: selecciónala con el ratón, presiona Ctrl+N. Toma 1 segundo. Con el ratón hasta el menú toma 5 segundos. Multiplica por miles de palabras al año.
      emoji: "⌨️"
    - termino: Sangría
      definicion: |-
        El espacio extra al inicio de la primera línea de un párrafo. Hace que los párrafos se vean separados visualmente sin necesidad de dejar línea en blanco. Se aplica con la tecla Tab al inicio del párrafo.
      ejemplo: |-
        Los libros y los periódicos usan sangría: el primer carácter de cada párrafo entra un poco hacia la derecha. Da aspecto profesional al texto.
      emoji: "↪️"

  quiz:
    titulo: "¿Sabes dar formato a un documento?"
    instrucciones: "5 preguntas para verificar que dominas los 5 elementos de formato y los 8 atajos."
    preguntas:
      - enunciado: "Quieres poner una palabra en negrita. ¿Qué atajo usas?"
        opciones:
          - "Ctrl+E"
          - "Ctrl+N"
          - "Ctrl+J"
          - "Ctrl+C"
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Ctrl+N = Negrita en español (B en inglés). Seleccionas la palabra y presionas el atajo. Toma 1 segundo. Tu próxima clase va más rápido.
        feedback_incorrecto: |-
          Ctrl+N = Negrita. Ctrl+E centra, Ctrl+J justifica, Ctrl+C copia. Memoriza los 8 atajos esenciales y serás 3 veces más rápido.
      - enunciado: "Tu documento tiene 5 fuentes distintas. ¿Está bien o mal?"
        opciones:
          - "Bien, así se ve creativo."
          - "Mal. Más de 2 fuentes en un documento se ve como collage. Usa máximo 2: una para títulos, una para texto."
          - "Da lo mismo, las fuentes no importan."
          - "Solo está mal si son colores."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Máximo 2 fuentes: una para títulos, otra para texto. Más fuentes = caos visual. Es como una persona vestida con 5 colores distintos.
        feedback_incorrecto: |-
          Máximo 2 fuentes por documento. Una para títulos, otra para texto. Más se ve recargado y caótico. Calibri o Arial son seguras.
      - enunciado: "¿Cuándo SÍ se debe poner texto en color azul (no negro)?"
        opciones:
          - "En todo el documento, se ve más bonito."
          - "Nunca, todo debe ser negro."
          - "Solo en títulos, y en azul OSCURO (no fluorescente)."
          - "Solo si el lector es daltónico."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Cuerpo del texto = NEGRO siempre. Títulos: pueden ser azul oscuro, gris oscuro o vino tinto. Nunca fluorescentes.
        feedback_incorrecto: |-
          Cuerpo del texto: NEGRO siempre. Títulos: pueden ir en azul oscuro o gris oscuro. Cambiar el color del cuerpo se ve infantil.
      - enunciado: "Tu profe te dice 'haz un documento profesional'. ¿Qué alineación usas?"
        opciones:
          - "Centrada (Ctrl+E) para todo."
          - "Justificada (Ctrl+J): el texto llega a ambos márgenes parejo."
          - "Derecha (Ctrl+D)."
          - "Sin alineación específica."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Justificada se usa en libros, informes, documentos formales. Centrada solo para títulos. Izquierda para informales.
        feedback_incorrecto: |-
          Para documentos profesionales: alineación justificada (Ctrl+J). Centrada solo para títulos y citas destacadas.
      - enunciado: "Quieres destacar 4 palabras importantes en un párrafo de 6 líneas. ¿Cuántas debería ir en negrita?"
        opciones:
          - "Las 4, son todas importantes."
          - "Máximo 2-3. Si todas están en negrita, pierde el énfasis."
          - "Ninguna, mejor todo en cursiva."
          - "El párrafo entero en negrita."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Si todo está en negrita, nada destaca. Escoge las 2-3 palabras más importantes. Las demás van en texto normal.
        feedback_incorrecto: |-
          Máximo 2-3 negritas por párrafo. Si destacas todo, no destaca nada. Es como gritar todo el tiempo: te dejan de oír.

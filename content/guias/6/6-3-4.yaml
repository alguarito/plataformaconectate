clave: "3-4"
grado: 6
periodo: 3
sesion: 4
completo: true

titulo: "Listas, viñetas y numeración --- ordenar la información para que se entienda"
titulo_portada: |-
  Listas y
  numeración ---
  ordenar
  la información
  con criterio

producto_final: |-
  Un \textbf{documento de Word} (o Docs) que muestra los \textbf{3 tipos de listas} (con viñetas, numeradas y multinivel jerárquica). El documento tiene: \textbf{(a) lista con viñetas} de tus 10 cosas favoritas, \textbf{(b) lista numerada} de los 8 pasos para hacer algo que sepas (preparar arepas, organizar el morral, etc.), y \textbf{(c) lista multinivel} de tus materias del colegio con sus 3 temas principales cada una. Más \textbf{en el cuaderno}: comparación de un párrafo confuso vs el mismo en lista limpia.

apertura:
  saber_ancestral: |-
    \textbf{Cuando doña Mercedes mandaba la lista de tareas del campo, no hablaba revuelto.} En la vereda La Plata de Cartago, los lunes la maestra rural ponía en el tablero la lista de la semana, una al lado de la otra, no en una sola masa. \emph{``Lunes: traer cartulina. Martes: estudiar tablas. Miércoles: prueba de lectura. Jueves: traer botella vacía para experimento. Viernes: limpieza del salón.''}. Cada cosa con su día, cada día con su tarea. \textbf{Si lo hubiera dicho todo seguido en un párrafo}, los niños se habrían confundido y olvidado la mitad. \emph{``Cuando son muchas cosas, en lista''}, decía doña Mercedes. La cocinera del barrio hacía igual con la lista del mercado. El campesino con la lista de semillas. \textbf{La lista no es decoración: es una herramienta de pensamiento ordenado}. Hoy aprendes a hacer listas en digital, con las mismas reglas que doña Mercedes usaba en su tablero.

  saber_contemporaneo: |-
    Una \textbf{lista} es un conjunto de cosas presentadas \emph{en líneas separadas, una debajo de otra}, en vez de en un párrafo seguido. Los procesadores de texto ofrecen \textbf{3 tipos}. \textbf{(1) Lista con viñetas (bullets):} cada ítem lleva un punto, círculo o cuadrado al frente. Sirve cuando \emph{no importa el orden}. \textbf{(2) Lista numerada:} cada ítem lleva un número (1, 2, 3...) o letra (a, b, c...). Sirve cuando \emph{el orden sí importa} (pasos, jerarquías). \textbf{(3) Lista multinivel (jerárquica):} listas dentro de listas, con sangría. Sirve cuando un ítem se divide en sub-ítems. Cada tipo tiene un \textbf{atajo} en Word: \texttt{Inicio} → \texttt{Viñetas} / \texttt{Numeración} / \texttt{Lista multinivel}. Conocer cuándo usar cada una te hace \textbf{2 veces más claro} en tus documentos.

  pregunta_puente: |-
    Si te dan a leer un examen con preguntas separadas por punto y línea aparte, vs un examen con todas las preguntas en una sola masa de texto, ¿\textbf{cuál te tomas el tiempo de hacer bien}? ¿Por qué?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 3 tipos de listas; (2) sabrás \textbf{explicar} cuándo usar cada una; (3) podrás \textbf{aplicar} listas en Word/Docs con su atajo; (4) habrás \textbf{creado} un documento con los 3 tipos demostrados.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: comparas un párrafo confuso con su lista, aprendes los 3 tipos con sus reglas de uso, escribes tus listas reales, y armas el documento.
  a_escuta: |-
    Empezamos con un párrafo confuso que vas a reescribir como lista.
  a_sistematizacion: |-
    Después aprendes los 3 tipos de listas y los 3 atajos clave.
  a_praxis: |-
    Con todo claro, abres el procesador y creas tu documento con los 3 tipos.
  a_producto: |-
    El producto es ese documento + la reescritura del párrafo en el cuaderno.
  a_evaluacion: |-
    Antes de salir, verificas que las 3 listas están bien aplicadas (no usaste numerada cuando era viñetas).
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué ordenar es respeto al lector y al pensamiento.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Reescribe un párrafo como lista} (12 min · individual). Lee este párrafo confuso: \emph{``Para preparar arepas necesitas masa de maíz, agua tibia, sal, queso si quieres rellenas, aceite para la sartén, una cuchara para mezclar, las manos limpias, una mesa o tabla para amasar, un sartén o budare, y una espátula para voltearlas. Primero mezclas la masa con agua y sal, después amasas hasta que quede uniforme, después haces bolitas, después las aplastas en forma redonda, después las pones en el sartén caliente y las dejas dorar por los dos lados.''}. \textbf{En el cuaderno:} reescribe ese párrafo en \textbf{2 listas separadas}: una de \emph{ingredientes y herramientas} (con viñetas) y otra de \emph{pasos} (numerada). Cuenta cuánto te tomó leer el párrafo y cuánto entender tu reescritura.

  checks:
  - Leí el párrafo entero y noté lo confuso que es.
  - Hice las 2 listas: ingredientes (viñetas) + pasos (numerada).
  - Comparé el tiempo de lectura entre los dos.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- De párrafo confuso a 2 listas limpias». \textbf{Formato:} 2 listas separadas con sus encabezados. \textbf{Extensión:} 2 listas (1 con 9 viñetas + 1 con 5 pasos numerados). \textbf{Sabes que terminaste cuando} tu reescritura se entiende en la mitad del tiempo que el párrafo original.

sistematizacion:
  intro: |-
    Lo que acabaste de hacer es la \textbf{magia de las listas}: tomas algo confuso y lo transformas en algo claro en segundos. Ahora vas a aprender cuándo usar cada uno de los 3 tipos.

  pilares:
  - |-
    \textbf{Tipo 1 --- Lista con viñetas (\emph{bullets}).} Cada ítem lleva un símbolo al inicio: punto, círculo, cuadrado, guion. \textbf{Cuándo usarla:} cuando \emph{el orden NO importa}. Ejemplos: una lista de cosas favoritas, una lista de ingredientes, una lista de características. \emph{En Word:} pestaña \texttt{Inicio} → ícono de \texttt{viñetas} (3 líneas con puntos). O atajo \texttt{Ctrl + Shift + L}. \textbf{Pista:} las viñetas se ven más informales que las numeradas.
  - |-
    \textbf{Tipo 2 --- Lista numerada.} Cada ítem lleva un número (1, 2, 3...) o letra (a, b, c...). \textbf{Cuándo usarla:} cuando \emph{el orden SÍ importa}. Ejemplos: pasos de una receta, una secuencia histórica, posiciones en un ranking, niveles de jerarquía. \emph{En Word:} pestaña \texttt{Inicio} → ícono de \texttt{numeración} (3 líneas con 1.2.3). \textbf{Pista:} si cambias el orden y se vuelve incorrecto, era numerada.
  - |-
    \textbf{Tipo 3 --- Lista multinivel (jerárquica).} Listas dentro de listas, con sangría. Ítems mayores en el nivel 1, sub-ítems en nivel 2, etc. \textbf{Cuándo usarla:} cuando un ítem se subdivide. Ejemplo: \emph{1. Materias del colegio --- 1.1. Tecnología --- 1.1.1. Hardware, 1.1.2. Software --- 1.2. Matemáticas --- 1.2.1. Geometría, etc.}. \emph{En Word:} ícono de \texttt{lista multinivel}. Después usas la tecla \texttt{Tab} para meter el ítem un nivel adentro, \texttt{Shift+Tab} para sacarlo.
  - |-
    \textbf{Las 4 reglas de oro de las listas.} (1) \textbf{Mínimo 3 ítems para hacer una lista.} Menos = un párrafo está bien. (2) \textbf{Todos los ítems en el mismo formato gramatical.} Si el primero empieza con verbo (\emph{``Buscar...''}), todos empiezan con verbo. (3) \textbf{Sin puntuación al final de cada ítem corto.} Solo si son frases completas. (4) \textbf{Una lista pura}: o todos con viñetas, o todos numerados, no mezcles dentro de la misma lista.

  anatomia:
    titulo: 3 tipos de listas + 4 reglas de oro
    body: |-
      \textbf{3 tipos:} \\[1mm]
      \textbf{1.} Viñetas (orden no importa). \\[1mm]
      \textbf{2.} Numerada (orden sí importa). \\[1mm]
      \textbf{3.} Multinivel (jerarquía con sub-ítems). \\[1mm]
      \textbf{4 reglas:} mínimo 3 ítems · formato gramatical igual · puntuación coherente · una lista pura.

  errores_comunes: |-
    \textbf{Errores frecuentes al hacer listas.} (1) \emph{Lista de 2 ítems}: no se justifica, mejor en párrafo. (2) \emph{Mezclar verbos e infinitivos}: \emph{``Buscar, comprar, lo encontré''} se ve descuidado. (3) \emph{Usar numeración para cosas sin orden}: si pongo \emph{``1. perro, 2. gato, 3. pájaro''} y se podrían intercambiar, debería ser con viñetas. (4) \emph{No usar sangría en multinivel}: pierde la jerarquía. (5) \emph{Listas dentro de párrafos con puntos}: \emph{``Las materias son: 1) mate, 2) historia, 3) inglés''}. Mejor partir el párrafo y hacer la lista separada.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Los 3 tipos de listas con ejemplo». \textbf{Formato:} 3 bloques. Cada bloque: nombre del tipo + cuándo se usa + ejemplo corto tuyo. \textbf{Extensión:} 3 bloques de 3 líneas. \textbf{Sabes que terminaste cuando} podrías decidir en 5 segundos cuál tipo usar para cualquier información que te den.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Documento con los 3 tipos de listas} (28 min · individual). Vas a abrir el procesador y crear un documento que demuestra \textbf{los 3 tipos de listas} con ejemplos reales tuyos. Esto va a quedar como tu \emph{plantilla de listas} para usar en el futuro.

  pilares:
  - |-
    \textbf{Paso 1 --- Documento nuevo.} Abre Word o Docs. Crea documento nuevo. Título: \textbf{``Mis listas --- 3 tipos demostrados''}. Formato: tamaño 18, centrado, negrita, color azul oscuro (aplica lo aprendido en S3).
  - |-
    \textbf{Paso 2 --- Lista con viñetas (10 cosas que te gustan).} Subtítulo: \textbf{``Mis 10 cosas favoritas''}. Tamaño 14, negrita. Debajo, en lista con viñetas, escribe \textbf{10 cosas que te gustan} (pueden ser comidas, lugares, actividades, materias, juegos). Aplica las 4 reglas de oro: mismo formato gramatical (todas sustantivos, por ejemplo). En Word, después de cada ítem presiona Enter y sigue.
  - |-
    \textbf{Paso 3 --- Lista numerada (8 pasos para hacer algo).} Subtítulo: \textbf{``Cómo hago [algo que sé hacer]''}. Tamaño 14, negrita. Debajo, lista numerada de 8 pasos para hacer algo que sepas: preparar arepas, organizar el morral, lavar tu ropa, jugar un juego, hacer un peinado, lo que quieras. \emph{Cada paso debe empezar con verbo en infinitivo}: \emph{``Lavar...''}, \emph{``Mezclar...''}, \emph{``Acomodar...''}.
  - |-
    \textbf{Paso 4 --- Lista multinivel (materias y temas).} Subtítulo: \textbf{``Mis materias y temas de este periodo''}. Tamaño 14, negrita. Debajo, lista multinivel: nivel 1 = nombre de cada materia (Tecnología, Matemáticas, Sociales, Lenguaje --- 4 materias). Nivel 2 = 3 temas principales que estás viendo en cada una. Para meter al nivel 2 presionas \texttt{Tab} al inicio del ítem. Para volver al nivel 1, presionas \texttt{Shift+Tab}.
  - |-
    \textbf{Paso 5 --- Revisa que cada lista esté correcta.} Para cada lista, pregúntate: \emph{``¿Es del tipo correcto? ¿Tiene mínimo 3 ítems? ¿Tienen formato gramatical igual? ¿Está bien la puntuación?''}. Si algo falla, corrige.
  - |-
    \textbf{Paso 6 --- Guarda y reflexiona.} Guarda como \texttt{2026-mis-3-listas.docx} en tu carpeta de \emph{Tecnologia/Periodo-3}. En el cuaderno escribe (boceto o captura): \emph{``Listas que hice: viñetas con [X cosas], numerada con [X pasos], multinivel con [X materias × X temas]. Total de ítems: ___. Tipo de lista que más me costó: ___.''}.

  checklist:
    titulo: Antes de mostrar tu documento
    items: |-
      \checkbox El documento tiene título formateado (negrita centrada azul oscuro). \\[1mm]
      \checkbox Hay 3 subtítulos (uno por lista) en tamaño 14. \\[1mm]
      \checkbox Lista con viñetas tiene exactamente 10 ítems. \\[1mm]
      \checkbox Lista numerada tiene 8 pasos, todos empezando con verbo. \\[1mm]
      \checkbox Lista multinivel tiene 4 materias × 3 temas (12 sub-ítems). \\[1mm]
      \checkbox Está guardado con nombre correcto en la carpeta de Tecnología.

  plantilla_guion: |-
    \textbf{Estructura del documento.} \textit{Título:} negrita + centrado + azul oscuro. \textit{Sección 1:} subtítulo + lista de viñetas con 10 cosas favoritas. \textit{Sección 2:} subtítulo + lista numerada con 8 pasos. \textit{Sección 3:} subtítulo + lista multinivel con 4 materias × 3 temas. \textit{Guardado:} 2026-mis-3-listas.docx.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mis 3 listas en digital». \textbf{Formato:} planificación de las 3 listas + boceto del documento + reflexión final. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} podrías mostrar tu documento al profe y él vería los 3 tipos de listas claros.

  producto_titulo: Documento con 3 tipos de listas demostradas (viñetas, numerada, multinivel)
  criterios:
  - Hay las 3 listas claramente diferenciadas con subtítulos.
  - La lista con viñetas tiene 10 ítems con formato gramatical igual.
  - La numerada tiene 8 pasos empezando con verbo.
  - La multinivel tiene jerarquía con sangría visible (4 materias × 3 temas).
  - Está guardado con nombre correcto en la carpeta del periodo.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del pensamiento ordenado)"
    cita: |-
      ``Quien sabe ordenar lo que tiene en la cabeza, lo sabe comunicar al mundo. Quien no, lo guarda solo para sí.''
    aplicacion: |-
      \textbf{Hacer una lista te obliga a ordenar mentalmente lo que sabes}. Antes de hacer la lista de \emph{``cómo hago arepas''}, tuviste que pensar: \emph{``¿cuáles son los pasos en realidad?''}. Esa reflexión te enseña algo de TI: cuánto sabes, qué te falta, qué orden tiene sentido. \emph{Hacer listas es pensar despacio}. Doña Mercedes lo sabía: enseñaba a hacer listas para enseñar a pensar.
    pregunta_espejo: |-
      ¿Cuál fue la lista que más me costó hacer? ¿Por qué creo que me costó?

  estoico:
    autor: "Marco Aurelio (emperador que ordenaba sus pensamientos diarios)"
    cita: |-
      ``Cuando algo te abruma, hazlo una lista. Lo que parece imposible junto, se vuelve posible en 5 pasos numerados.''
    aplicacion: |-
      Cuando tienes muchas tareas y te sientes abrumado, escribir una \textbf{lista numerada} de lo que tienes que hacer convierte el caos en un mapa. \emph{Lo abrumador deja de serlo cuando se ve por partes}. Esta habilidad la vas a necesitar toda la vida: en exámenes, trabajos, decisiones importantes. La lista no resuelve el problema, pero te quita el peso de tenerlo todo en la cabeza.
    pregunta_espejo: |-
      ¿Qué cosa que tengo pendiente sentiría más ligera si la convirtiera en lista?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la información)"
    cita: |-
      ``La lista es la primera tecnología cognitiva. Antes del libro, antes del computador, ya existía la lista.''
    aplicacion: |-
      \textbf{Las listas son tan antiguas que se encuentran tablillas de barro de hace 5000 años con listas} (de vacas, de granos, de impuestos). Los primeros documentos de la humanidad fueron listas. Hoy, en la era de internet, siguen siendo igual de poderosas. \emph{Las cosas que se mantienen 5000 años no se mantienen por accidente}: las listas funcionan porque son la forma más eficiente de organizar información.
    pregunta_espejo: |-
      ¿Estoy aprovechando una herramienta de 5000 años que sigue siendo la mejor disponible?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, en cualquier documento que escribas, busca si algo se entiende mejor como lista. Cuando lo veas, hazlo. La próxima clase aprendes a \textbf{insertar tablas e imágenes}: las herramientas para incorporar contenido visual y datos estructurados a tus documentos.

web:
  conceptos_clave:
    - termino: Lista con viñetas (bullets)
      definicion: |-
        Lista donde cada ítem lleva un símbolo al inicio (punto, círculo, guion). Se usa cuando el orden de los ítems no importa. Es la lista más usada en presentaciones, blogs y resúmenes.
      ejemplo: |-
        "Mis 5 frutas favoritas: • banano • mango • piña • lulo • maracuyá". El orden no importa: puedo cambiarlos y la información sigue siendo la misma.
      emoji: "•"
    - termino: Lista numerada
      definicion: |-
        Lista donde cada ítem lleva un número (1, 2, 3...) o letra (a, b, c...). Se usa cuando el orden de los ítems SÍ importa: pasos, secuencias, jerarquías, rankings.
      ejemplo: |-
        "Para abrir Word: 1. Encender el computador, 2. Esperar a que cargue, 3. Buscar Word en el menú inicio, 4. Hacer clic. Si cambias el orden, no funciona.
      emoji: "1️⃣"
    - termino: Lista multinivel (jerárquica)
      definicion: |-
        Lista que contiene listas dentro de listas, con sangría visible. Cada nivel más profundo se desplaza un poco a la derecha. Sirve para mostrar jerarquías o cuando un ítem se divide en sub-ítems.
      ejemplo: |-
        1. Tecnología • 1.1 Hardware • 1.2 Software (la sangría en 1.1 y 1.2 muestra que son sub-temas de Tecnología). Tab mete adentro, Shift+Tab saca afuera.
      emoji: "📑"
    - termino: Tab (tecla)
      definicion: |-
        La tecla con dos flechas opuestas, a la izquierda del teclado. En listas multinivel sirve para meter un ítem un nivel adentro (más sangría). Shift+Tab lo saca un nivel (menos sangría).
      ejemplo: |-
        Estás en "1. Tecnología", presionas Enter, escribes "Hardware". Presionas Tab y "Hardware" se vuelve "1.1 Hardware". Tab adentro, Shift+Tab afuera.
      emoji: "↹"
    - termino: Formato gramatical paralelo
      definicion: |-
        Regla de las listas: todos los ítems deben tener la misma estructura gramatical. Si el primero empieza con verbo, todos empiezan con verbo. Si son sustantivos, todos son sustantivos. Esto se ve profesional y se lee fluido.
      ejemplo: |-
        Bien: "Lavar, Cortar, Cocinar". Mal: "Lavar las verduras, Después se cortan, Cocción en sartén" (mezcla verbo en infinitivo + verbo pasivo + sustantivo).
      emoji: "📏"

  quiz:
    titulo: "¿Sabes hacer listas en digital?"
    instrucciones: "5 preguntas para verificar que dominas los 3 tipos de listas y sus reglas."
    preguntas:
      - enunciado: "Vas a escribir tus 5 películas favoritas. ¿Qué tipo de lista usas?"
        opciones:
          - "Numerada (1, 2, 3, 4, 5)."
          - "Con viñetas (•, •, •, •, •)."
          - "Multinivel."
          - "En párrafo seguido."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El orden de tus películas favoritas no importa, da igual cuál sea primera. Por eso, viñetas. Si fueran tus '5 mejores ordenadas', sería numerada.
        feedback_incorrecto: |-
          Para listas SIN orden: viñetas. Para listas CON orden: numerada. Tus películas favoritas no tienen orden importante, entonces viñetas.
      - enunciado: "Vas a escribir los 7 pasos para preparar arepas. ¿Qué tipo de lista?"
        opciones:
          - "Con viñetas, así parece más casual."
          - "Numerada, porque el orden de los pasos es crítico."
          - "Multinivel con 7 niveles."
          - "En un solo párrafo masivo."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Si cambias el orden de los pasos (mezclar antes que medir, por ejemplo), no funciona. Por eso numerada: el orden es información.
        feedback_incorrecto: |-
          Pasos = numerada. Si el orden importa para que algo funcione, es numerada. Viñetas perdería el orden y la receta se rompería.
      - enunciado: "Estás haciendo una lista de tus materias del colegio con sus temas. ¿Qué tipo?"
        opciones:
          - "Solo con viñetas."
          - "Solo numerada."
          - "Multinivel: materia (nivel 1) + tema dentro (nivel 2)."
          - "En tabla, no en lista."
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Materia es lo grande, los temas están adentro. Eso es jerarquía: lista multinivel. Tab para meter dentro, Shift+Tab para sacar.
        feedback_incorrecto: |-
          Cuando hay jerarquía (cosas dentro de cosas), usas multinivel. Tab mete adentro un ítem; Shift+Tab lo saca.
      - enunciado: "Hiciste una lista de 2 ítems. ¿Cuál es la regla?"
        opciones:
          - "Está bien, 2 ítems siempre son lista."
          - "Mejor en párrafo. Las listas se justifican desde 3 ítems."
          - "Solo 1 ítem es válido en listas."
          - "Hay que duplicar el ítem para tener 4."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Mínimo 3 ítems para que valga la pena la lista. Con 2 se ve forzado. En párrafo se ve natural: 'Las dos cosas que llevé fueron X y Y'.
        feedback_incorrecto: |-
          Mínimo 3 ítems para hacer una lista. Menos = mejor en párrafo. Una lista de 2 se ve forzada.
      - enunciado: "Tu lista es: 1. Lavar las verduras, 2. Cortar todo, 3. La cocción al final. ¿Qué falla?"
        opciones:
          - "Nada, está perfecta."
          - "Falla el formato gramatical paralelo. Mejor: 1. Lavar, 2. Cortar, 3. Cocer (todos en infinitivo)."
          - "Le faltan ítems."
          - "El orden está mal."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. La regla de paralelismo: si el primero empieza con verbo en infinitivo (Lavar), todos en infinitivo. Mezclar formas se ve descuidado.
        feedback_incorrecto: |-
          La regla del paralelismo: todos en el mismo formato gramatical. Si arrancas con infinitivo, todos en infinitivo. Sino, se ve desordenado.

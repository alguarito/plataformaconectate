clave: "3-5"
grado: 6
periodo: 3
sesion: 5
completo: true

titulo: "Tablas e imágenes --- mostrar datos y agregar voz visual"
titulo_portada: |-
  Tablas e
  imágenes ---
  mostrar datos
  y agregar
  voz visual

producto_final: |-
  Un \textbf{documento} con: \textbf{(a) una tabla} de 5 filas × 4 columnas que muestre datos reales (ejemplo: \emph{horario semanal del colegio} con materia, día, hora, salón); \textbf{(b) 2 imágenes} insertadas con \emph{ajuste de texto alrededor} (una a la izquierda, otra a la derecha), cada una con \emph{pie de imagen} debajo; \textbf{(c) 2 párrafos de texto} relacionados con las imágenes que fluyen alrededor de ellas. Más \textbf{en el cuaderno}: dibujo del documento + 5 reglas de uso de imágenes que aprendiste.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural de la vereda La Plata de Cartago usaba el tablero de varias maneras al tiempo.} A veces escribía texto. A veces hacía \textbf{cuadros} con líneas para comparar (\emph{``Las 4 estaciones: primavera, verano, otoño, invierno''} en una tabla con sus características). Y a veces pegaba \textbf{recortes de periódico o dibujos} con líneas que apuntaban a las palabras importantes. \emph{``Las palabras solas no siempre alcanzan''}, decía doña Mercedes. \emph{``A veces hay que mostrar la cosa, no solo nombrarla.''} Un dibujo de la araña en el cuaderno enseñaba más que 5 párrafos describiéndola. Una tabla comparando \emph{vacas vs caballos} se entendía en 30 segundos, mientras 2 párrafos comparándolos se demoraban 5 minutos. \textbf{Mezclar texto, tablas e imágenes era ya el saber de doña Mercedes hace 40 años.} Hoy los procesadores de texto te dan exactamente esas mismas herramientas en digital.

  saber_contemporaneo: |-
    Un documento profesional rara vez tiene \emph{solo texto}. Suele combinar \textbf{tres elementos:} \textbf{(1) texto en párrafos} para narrar, explicar, argumentar; \textbf{(2) tablas} para mostrar datos comparativos o relacionados; \textbf{(3) imágenes} para ilustrar, ejemplificar, hacer ameno. Insertar una tabla en Word es muy rápido: \texttt{Insertar} → \texttt{Tabla} → elegir filas y columnas. Insertar una imagen también: \texttt{Insertar} → \texttt{Imágenes} → escoger desde tu computador. Lo que diferencia a un usuario \emph{básico} de uno \emph{intermedio} es saber \textbf{ajustar} estos elementos: que la tabla se vea limpia, que la imagen tenga texto fluyendo a su lado en vez de bloquear todo. Hoy aprendes esas técnicas.

  pregunta_puente: |-
    Si tu profe te pide entregar un trabajo sobre \emph{``los 5 ríos más importantes de Colombia''}, ¿\textbf{cómo lo presentas mejor}? ¿En 2 párrafos de texto seguido, o en una tabla con columnas \emph{nombre · longitud · ubicación · datos curiosos}? ¿Por qué?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} cuándo usar tabla y cuándo imagen; (2) sabrás \textbf{aplicar} la inserción de ambos elementos en Word/Docs; (3) podrás \textbf{evaluar} las 5 reglas de uso de imágenes; (4) habrás \textbf{creado} un documento con tabla, imágenes y texto integrado.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: decides cuándo conviene tabla vs imagen, aprendes a insertar y ajustar ambos, aplicas el ajuste de texto alrededor, y armas tu documento mixto.
  a_escuta: |-
    Empezamos con 6 situaciones para decidir: ¿texto, tabla o imagen?
  a_sistematizacion: |-
    Después aprendes a insertar tablas y a manejar las imágenes con ajuste de texto.
  a_praxis: |-
    Con todo claro, creas tu documento con los 3 elementos integrados.
  a_producto: |-
    El producto es ese documento + las 5 reglas de imágenes en el cuaderno.
  a_evaluacion: |-
    Antes de salir, verificas que la tabla y las imágenes están bien insertadas con el texto fluyendo.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué mostrar es a veces más que decir.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 6 situaciones para clasificar} (10 min · individual). En el cuaderno, dibuja 3 columnas: \emph{TEXTO}, \emph{TABLA}, \emph{IMAGEN}. Lee estas 6 situaciones y clasifica cada una en la columna que mejor corresponde. \textbf{(1)} Explicar las 4 estaciones del año con sus características. \textbf{(2)} Mostrar paso a paso cómo armar un caballero de Lego. \textbf{(3)} Comparar 5 países por población, capital, idioma y moneda. \textbf{(4)} Contar la historia de tu fin de semana. \textbf{(5)} Mostrar cómo se ve por dentro un volcán. \textbf{(6)} Listar los presidentes de Colombia con año de mandato. \emph{Tip:} algunas podrían ir en 2 columnas; escoge la PRINCIPAL.

  checks:
  - Dibujé las 3 columnas en el cuaderno.
  - Clasifiqué las 6 situaciones, una por columna.
  - Pensé cuál es la herramienta principal para cada caso.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 6 situaciones: ¿texto, tabla o imagen?». \textbf{Formato:} tabla de 3 columnas con las 6 situaciones distribuidas. \textbf{Extensión:} 6 situaciones. \textbf{Sabes que terminaste cuando} puedes justificar cada decisión.

sistematizacion:
  intro: |-
    Ya intuiste cuándo conviene cada elemento. Ahora aprendes las \textbf{reglas técnicas} para insertarlos y ajustarlos bien.

  pilares:
  - |-
    \textbf{Cuándo usar TABLA.} Cuando tienes \emph{datos comparables} en categorías. Ejemplo clásico: \emph{lista de 5 ríos con 4 datos cada uno = 5 filas × 4 columnas}. \textbf{En Word:} \texttt{Insertar → Tabla → elegir tamaño}. Aparece la cuadrícula. Llenas las celdas. La fila de encabezado se pone en \textbf{negrita} y con \emph{fondo gris claro}. \textbf{Cuándo usar IMAGEN.} Cuando algo se ve mejor que se explica: un mapa, un esquema, una foto que ilustra, un diagrama. \textbf{En Word:} \texttt{Insertar → Imágenes → seleccionar archivo}. Por defecto la imagen llega \emph{enorme} y desplaza todo el texto.
  - |-
    \textbf{Ajuste de texto alrededor de la imagen.} El truco profesional: \textbf{haz que el texto fluya al lado de la imagen} en vez de empujarla. En Word: clic en la imagen → aparece el ícono \emph{Opciones de diseño} (una arquetilla) → escoge \texttt{Cuadrado} (texto rodea la imagen) o \texttt{Estrecho} (más pegado). Después arrastras la imagen donde la quieres. Tamaño ajustado: clic en imagen → arrastrar de las esquinas (no de los lados, deforma).
  - |-
    \textbf{Las 5 reglas de uso de imágenes.} (1) \textbf{Resolución suficiente:} no uses imágenes pequeñas que se ven borrosas al ampliar. (2) \textbf{Pie de imagen:} debajo de la imagen, escribe en \emph{tamaño 10, cursiva}, una línea que diga qué muestra (\emph{``Figura 1: mapa de Colombia''}). (3) \textbf{Derechos de autor:} no uses cualquier imagen de Google. Usa \emph{Unsplash}, \emph{Pixabay}, \emph{Pexels} (gratuitas y de uso libre). (4) \textbf{Tamaño moderado:} máximo 1/3 del ancho de la página, dejando espacio para texto al lado. (5) \textbf{Relevancia:} cada imagen debe \emph{aportar algo}; si es decoración pura, mejor no la pongas.
  - |-
    \textbf{Errores frecuentes que se evitan.} (1) \emph{Insertar imagen y dejarla bloqueando todo el ancho} cuando solo necesitabas 1/3 de espacio. (2) \emph{Tabla sin encabezado en negrita} --- los lectores no saben qué es cada columna. (3) \emph{Imagen sin pie} --- después no se sabe qué muestra. (4) \emph{Tabla con muchas celdas vacías} --- mejor usar otra cosa. (5) \emph{Imagen con marca de agua o copyright} --- se ve poco profesional y puede ser ilegal usarla.

  anatomia:
    titulo: Cuándo + cómo + 5 reglas
    body: |-
      \textbf{TABLA:} datos comparables. Insertar → Tabla → elegir filas y columnas. Encabezado en negrita. \\[1mm]
      \textbf{IMAGEN:} cuando se ve mejor que se explica. Insertar → Imágenes. Ajuste de texto: Cuadrado o Estrecho. \\[1mm]
      \textbf{5 reglas:} resolución · pie · derechos · tamaño moderado · relevancia.

  errores_comunes: |-
    \textbf{Mitos sobre tablas e imágenes.} (1) \emph{``Más imágenes = más profesional''} --- Falso. Las imágenes irrelevantes restan. (2) \emph{``Las imágenes de Google las puedo usar libres''} --- Falso. Muchas tienen copyright. Usa Pixabay, Pexels, Unsplash. (3) \emph{``Una tabla con 2 filas se justifica''} --- Falso. Mínimo 3 filas. Con 2 mejor 2 párrafos. (4) \emph{``El texto envuelve solo, no hay que configurarlo''} --- Falso. Por defecto la imagen empuja todo. Hay que cambiar el ajuste a \emph{Cuadrado}. (5) \emph{``Las imágenes grandes se ven mejor''} --- Falso. Las gigantes parecen amateur. 1/3 del ancho es elegante.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 5 reglas de imágenes + cómo se inserta tabla». \textbf{Formato:} bloque A con las 5 reglas numeradas (1 línea cada una); bloque B con el camino para insertar tabla (Insertar → Tabla → escoger) y para insertar imagen (Insertar → Imágenes). \textbf{Extensión:} 7-8 líneas. \textbf{Sabes que terminaste cuando} podrías hacer un tutorial al compañero de al lado.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Documento mixto con tabla + imágenes + texto} (32 min · individual). Vas a crear un documento que demuestra los 3 elementos integrados. \emph{Tema sugerido}: \emph{``Mi colegio''} o \emph{``Mi cuadra''}. Tú escoges.

  pilares:
  - |-
    \textbf{Paso 1 --- Documento nuevo + título.} Abre Word o Docs. Título centrado en negrita azul oscuro tamaño 18: \emph{``Mi colegio --- texto, tabla e imágenes''}.
  - |-
    \textbf{Paso 2 --- Inserta la tabla del horario.} Escribe un subtítulo: \textbf{``Mi horario semanal''}. Debajo, inserta una tabla de \textbf{5 filas × 4 columnas} (\texttt{Insertar → Tabla → 5 × 4}). Encabezado de columnas: \emph{Materia | Día | Hora | Salón}. Llena las 4 filas restantes con 4 materias reales tuyas y sus datos. Pon el encabezado en \textbf{negrita}.
  - |-
    \textbf{Paso 3 --- Inserta primera imagen + pie.} Salta una línea. Escribe un subtítulo: \textbf{``Vista del colegio''}. Inserta una imagen (\texttt{Insertar → Imágenes}). Si no tienes foto del colegio, busca en \emph{Pixabay} una imagen genérica de \emph{escuela} (gratis). Selecciónala. Clic en ella → \emph{Opciones de diseño} → \textbf{Cuadrado}. Arrastra la imagen al \emph{lado izquierdo} y ajusta tamaño a 1/3 del ancho. Debajo de la imagen, en cursiva tamaño 10: \emph{``Figura 1: el colegio desde el patio.''}.
  - |-
    \textbf{Paso 4 --- Escribe 2 párrafos junto a la primera imagen.} A la derecha de la imagen, escribe 2 párrafos cortos (3-4 líneas cada uno) sobre tu colegio: en qué barrio queda, cuántos estudiantes hay, qué te gusta. El texto debe \emph{fluir alrededor} de la imagen (eso se logra con el ajuste \emph{Cuadrado} que aplicaste).
  - |-
    \textbf{Paso 5 --- Inserta segunda imagen + pie + texto.} Salta una línea. Inserta otra imagen (puede ser de \emph{Pixabay}: un patio de escuela, una clase, lo que quieras). Ajuste \emph{Cuadrado}, esta vez \textbf{al lado derecho}. Pie de imagen en cursiva tamaño 10: \emph{``Figura 2: ...''}. Escribe 1 párrafo más a la izquierda relacionado con la imagen.
  - |-
    \textbf{Paso 6 --- Guarda y reflexiona.} Guarda como \texttt{2026-mi-colegio-mixto.docx} en \emph{Tecnologia/Periodo-3}. En el cuaderno escribe (boceto del documento): muestra dónde quedó la tabla, dónde la imagen izquierda con texto a la derecha, dónde la imagen derecha con texto a la izquierda. Lista las 5 reglas que usaste.

  checklist:
    titulo: Antes de mostrar tu documento mixto
    items: |-
      \checkbox Tiene título principal formateado. \\[1mm]
      \checkbox La tabla 5x4 está completa con encabezado en negrita. \\[1mm]
      \checkbox Hay 2 imágenes con ajuste cuadrado (texto fluye al lado). \\[1mm]
      \checkbox Cada imagen tiene pie en cursiva tamaño 10. \\[1mm]
      \checkbox Las imágenes son de fuente libre (Pixabay/Pexels/Unsplash). \\[1mm]
      \checkbox Está guardado con nombre correcto en la carpeta del periodo.

  plantilla_guion: |-
    \textbf{Estructura del documento.} \textit{Título centrado.} \textit{Subtítulo + tabla 5×4 del horario.} \textit{Imagen izquierda + pie + 2 párrafos a la derecha.} \textit{Imagen derecha + pie + 1 párrafo a la izquierda.} \textit{Guardado:} 2026-mi-colegio-mixto.docx.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi documento mixto: tabla + imágenes». \textbf{Formato:} boceto del layout + datos del horario + las 5 reglas de imágenes anotadas. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} el documento muestra integración real (no son elementos sueltos).

  producto_titulo: Documento mixto con tabla 5x4 + 2 imágenes con texto fluyendo
  criterios:
  - La tabla tiene 5 filas, 4 columnas y encabezado en negrita.
  - Hay 2 imágenes con ajuste cuadrado (texto alrededor).
  - Cada imagen tiene pie en cursiva tamaño 10.
  - Las imágenes son de fuente libre (no copyright).
  - El documento está guardado con nombre correcto.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del mostrar y del decir)"
    cita: |-
      ``Hay verdades que se dicen con palabras, otras se muestran con imágenes, otras se ordenan en filas. Saber cuándo usar cada una es saber comunicar.''
    aplicacion: |-
      Doña Mercedes sabía que enseñar a una niña qué es un río era distinto a enseñarle qué es una vaca: \emph{un río se muestra con mapa; una vaca con foto; los ríos del país en una tabla}. La sabiduría está en \textbf{saber qué herramienta para qué verdad}. Hoy con procesadores tienes todas a tu disposición. Saber cuándo usar tabla, cuándo imagen, cuándo solo texto, eso es \emph{maestría comunicativa}.
    pregunta_espejo: |-
      ¿Estoy usando la herramienta correcta para cada idea que quiero comunicar?

  estoico:
    autor: "Marco Aurelio (emperador que documentaba con orden)"
    cita: |-
      ``Una tabla bien hecha vale lo que dos páginas de palabras. Eso es economía de pensamiento.''
    aplicacion: |-
      Hay gente que escribe largo cuando podría escribir corto. \textbf{La tabla obliga a la economía:} cabeceras claras, datos justos, sin relleno. \emph{Pensar en tablas te entrena en pensar conciso.} En el futuro, cuando escribas informes, ensayos, reportes, esta habilidad te ahorra horas a ti y a quienes te leen.
    pregunta_espejo: |-
      ¿Qué cosa que escribí en párrafo se entendería mejor en tabla?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del documento digital)"
    cita: |-
      ``La imagen sin contexto es ruido. La tabla sin encabezado es caos. La integración es lo que hace al documento profesional.''
    aplicacion: |-
      Una imagen suelta sin pie de foto NO comunica: el lector se pregunta \emph{``¿qué es esto?''}. Una tabla sin encabezado tampoco: \emph{``¿qué significa esta columna?''}. \textbf{Lo profesional es integrar:} texto que conecta, tabla con cabeceras, imagen con pie. Cuando todo está integrado, el documento se lee como pieza única, no como collage.
    pregunta_espejo: |-
      Cuando reviso mis documentos, ¿está cada elemento integrado o son piezas sueltas?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, en cualquier trabajo digital, considera si una tabla o una imagen mejoraría la entrega. La próxima clase aprendes \textbf{encabezados, pies de página y numeración}: los toques finales que hacen un documento profesional --- como las solapas y la portada de un libro.

web:
  conceptos_clave:
    - termino: Tabla
      definicion: |-
        Estructura de filas y columnas para mostrar datos comparables. Se usa cuando tienes información categorizada (por ejemplo, 5 países con sus capitales y poblaciones). El encabezado de columnas va en negrita.
      ejemplo: |-
        Lista de ríos con columnas: nombre | longitud | departamento donde nace | desemboca. Se entiende en 30 segundos lo que en párrafo tomaría 5 minutos.
      emoji: "📊"
    - termino: Insertar imagen
      definicion: |-
        En Word/Docs: Insertar → Imágenes → escoger archivo del computador. La imagen llega grande por defecto y desplaza el texto. Hay que ajustar tamaño y configurar el ajuste de texto.
      ejemplo: |-
        Buscas una imagen libre en Pixabay, la descargas, en Word vas a Insertar → Imágenes → la seleccionas. Aparece en el documento, lista para ajustar.
      emoji: "🖼️"
    - termino: Ajuste de texto
      definicion: |-
        Configuración que define cómo el texto se relaciona con la imagen. Las opciones más útiles: 'Cuadrado' (texto rodea la imagen en rectángulo), 'Estrecho' (más pegado a la forma), 'En línea con el texto' (la imagen es como una letra grande).
      ejemplo: |-
        Por defecto la imagen llega 'En línea' y empuja todo. Cambiar a 'Cuadrado' permite que el texto fluya a la derecha o izquierda, como en revistas.
      emoji: "↔️"
    - termino: Pie de imagen
      definicion: |-
        Texto corto que va debajo de una imagen, en cursiva y tamaño pequeño (10 puntos). Indica qué muestra la imagen. Sin pie, el lector no sabe qué está viendo.
      ejemplo: |-
        "Figura 1: vista del parque Bolívar de Cartago, año 2024". Esa línea le dice al lector exactamente qué es la imagen, sin tener que adivinar.
      emoji: "🏷️"
    - termino: Imágenes de uso libre
      definicion: |-
        Fotografías que pueden usarse sin pagar y sin violar derechos de autor. Las fuentes más conocidas: Pixabay (pixabay.com), Pexels (pexels.com), Unsplash (unsplash.com). Las imágenes de Google muchas veces tienen copyright.
      ejemplo: |-
        Si necesitas una foto de una escuela para tu trabajo, vas a pixabay.com, escribes "escuela", descargas. Es legal usarla. Si la sacas de Google sin verificar, puede ser ilegal.
      emoji: "🆓"

  quiz:
    titulo: "¿Sabes integrar tabla, imagen y texto?"
    instrucciones: "5 preguntas para verificar que dominas la integración de elementos visuales en un documento."
    preguntas:
      - enunciado: "Vas a mostrar los 5 ríos más importantes de Colombia con su longitud, departamento de nacimiento y desembocadura. ¿Cómo lo presentas?"
        opciones:
          - "5 párrafos, uno por río."
          - "Una tabla de 5 filas × 4 columnas."
          - "5 imágenes pegadas."
          - "Solo un párrafo grande."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Datos comparables en categorías = tabla. 5 ríos × 4 columnas (nombre, longitud, nace, desemboca). Se lee en 30 segundos.
        feedback_incorrecto: |-
          Para datos comparables: tabla. Las 5 filas son los ríos, las 4 columnas los datos de cada uno. En párrafo se vuelve denso.
      - enunciado: "Insertas una imagen y queda gigante bloqueando todo el texto. ¿Qué cambias?"
        opciones:
          - "Borro la imagen, no se puede arreglar."
          - "Cambio el ajuste de texto a 'Cuadrado' y ajusto el tamaño con las esquinas."
          - "Le bajo el brillo a la pantalla."
          - "Pongo el texto en negrita."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Clic en la imagen → Opciones de diseño → Cuadrado. Después arrastras de las esquinas para reducir tamaño. El texto fluye al lado.
        feedback_incorrecto: |-
          El ajuste 'Cuadrado' hace que el texto fluya alrededor. Y arrastrar de las esquinas (no de los lados, que deforma) la hace más pequeña.
      - enunciado: "Necesitas una foto de árbol para tu documento. ¿De dónde la sacas?"
        opciones:
          - "De Google sin verificar."
          - "De Pixabay, Pexels o Unsplash (gratis y legal)."
          - "Robo una de Instagram."
          - "Hago un dibujo a mano."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Pixabay, Pexels y Unsplash ofrecen imágenes gratis y de uso libre. Google muchas veces tiene copyright. Usar lo de otros sin permiso puede ser ilegal.
        feedback_incorrecto: |-
          Para imágenes libres: pixabay.com, pexels.com, unsplash.com. Google no es libre por defecto; muchas imágenes tienen copyright.
      - enunciado: "Tu tabla tiene 4 columnas pero ninguna está en negrita. ¿Qué falta?"
        opciones:
          - "Nada, así está bien."
          - "Falta el encabezado en negrita para identificar qué es cada columna."
          - "Falta cambiar el color del fondo."
          - "Falta agregar más filas."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La primera fila debe ir en negrita: es el encabezado que dice qué dato muestra cada columna. Sin él, el lector no sabe qué es qué.
        feedback_incorrecto: |-
          La fila de encabezado va en negrita siempre. Identifica las columnas y se ve profesional. Sin encabezado en negrita, la tabla se ve incompleta.
      - enunciado: "Insertas una imagen y NO le pones pie de foto. ¿Está bien?"
        opciones:
          - "Sí, las imágenes hablan solas."
          - "No, el pie de foto en cursiva tamaño 10 le da contexto al lector."
          - "Solo necesita pie si es color."
          - "El pie es opcional para imágenes pequeñas."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. El pie indica qué muestra la imagen y le da contexto. Sin él, el lector se pregunta '¿qué es esto?'. Va en cursiva tamaño 10.
        feedback_incorrecto: |-
          Toda imagen profesional tiene pie: en cursiva tamaño 10, debajo. Ejemplo: 'Figura 1: vista del río Cauca'. Da contexto al lector.

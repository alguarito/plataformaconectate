clave: "3-6"
grado: 6
periodo: 3
sesion: 6
completo: true

titulo: "Encabezado, pie de página y números --- terminar el documento como un profesional"
titulo_portada: |-
  Encabezado y
  pie de página ---
  terminar el
  documento como
  un profesional

producto_final: |-
  Un \textbf{mini-informe de 2 páginas} sobre cualquier tema (puede ser tu colegio, tu barrio, una materia favorita), formateado con: \textbf{(a) encabezado} arriba (con tu nombre, grado y materia); \textbf{(b) pie de página} con la fecha y la frase \emph{``Plataforma Conéctate''}; \textbf{(c) número de página} en la esquina inferior derecha (1, 2); \textbf{(d) portada de 1 página adicional} con título grande, tu nombre, fecha, grado; (e) el cuerpo del informe en las 2 páginas siguientes. Más \textbf{en el cuaderno}: boceto del layout con los 4 elementos etiquetados.

apertura:
  saber_ancestral: |-
    \textbf{Cuando doña Mercedes hacía un cuaderno especial, le ponía marco al trabajo.} En la escuela rural de la vereda La Plata de Cartago, doña Mercedes la maestra exigía que los cuadernos del campo tuvieran \textbf{el nombre arriba} (\emph{``Cuaderno de Lengua, Pedro Martínez, grado 5°''}) y \textbf{la fecha abajo} (\emph{``Año 1985''}). En cada hoja, los niños debían escribir \textbf{su nombre arriba} (\emph{el encabezado}) y \textbf{el número de la hoja abajo} (\emph{el pie}). Eso no era manía: era \emph{darle marco al trabajo}. Si un cuaderno se caía o un niño olvidaba el suyo, todos podían identificarlo en segundos. Si una hoja se desprendía, se podía colocar de nuevo gracias al número. \textbf{Doña Mercedes enseñaba con eso un saber profundo: todo trabajo serio tiene marco}. Hoy en digital los procesadores te dan herramientas para hacer ese marco: encabezado, pie de página y números. Y se aplican a CUALQUIER documento de varias páginas que vayas a entregar en tu vida.

  saber_contemporaneo: |-
    Cuando un documento tiene \textbf{más de 1 página}, necesita \textbf{3 elementos de marco}. \textbf{(1) Encabezado} (\emph{header}): la franja arriba de cada página, donde van tu nombre, materia, fecha o título del documento. Se ve en TODAS las páginas. \textbf{(2) Pie de página} (\emph{footer}): la franja abajo de cada página, donde va información secundaria (fecha de impresión, nombre del colegio, frase de cierre). \textbf{(3) Número de página}: el contador que dice qué página estás viendo (1, 2, 3...). Se inserta en el encabezado o el pie. \textbf{Estos 3 elementos te ahorran problemas:} si entregas 5 hojas y se desordenan, el número resuelve. Si el profe pierde tu trabajo entre 30 entregas, el encabezado con tu nombre lo identifica. Es como ponerle marco a un cuadro: \emph{el contenido sigue siendo el cuadro, pero el marco le da presencia}.

  pregunta_puente: |-
    Tu profe acumula \textbf{30 trabajos impresos} en su mesa. Las hojas se mezclan en el escritorio. ¿\textbf{Cómo se asegura el profe} de identificar el tuyo? ¿Y si tu trabajo tenía 4 hojas y se desordenaron, cómo sabe qué hoja iba primero?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 3 elementos de marco (encabezado, pie, número); (2) sabrás \textbf{aplicar} los 3 en Word/Docs; (3) podrás \textbf{distinguir} entre portada y página de contenido; (4) habrás \textbf{creado} un mini-informe de 2 páginas con todos los elementos.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: descubres dónde están encabezado y pie en Word, aprendes a insertarlos, agregas números de página, y armas tu informe de 2 páginas.
  a_escuta: |-
    Empezamos con un documento bien formateado para identificar sus 3 elementos de marco.
  a_sistematizacion: |-
    Después aprendes los 3 caminos en Word para encabezado, pie y números.
  a_praxis: |-
    Con todo claro, creas tu mini-informe completo con portada y 2 páginas.
  a_producto: |-
    El producto es ese informe + el boceto en el cuaderno.
  a_evaluacion: |-
    Antes de salir, verificas que los 3 elementos aparecen en las páginas correctas.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué el marco habla antes que el contenido.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Encuentra los 3 elementos de marco} (10 min · individual). El profe te muestra un documento profesional (puede ser una hoja impresa, una circular del colegio o una imagen en pantalla). Tu tarea: en el cuaderno, dibuja una hoja A4 (rectángulo) y \textbf{marca con flechas} dónde aparecen estos 3 elementos: \emph{encabezado}, \emph{pie de página}, \emph{número de página}. Si encuentras los 3, ponte \texttt{¡EXCELENTE!} al lado. Si solo encuentras 2, escribe cuál falta. \emph{Si no tienes documento físico hoy}, dibuja basado en cómo crees que se ve un documento profesional.

  checks:
  - Dibujé una hoja A4 en el cuaderno.
  - Marqué con flechas los 3 elementos (encabezado, pie, número).
  - Identifiqué cuántos elementos vi en el documento del profe.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Los 3 elementos de marco». \textbf{Formato:} dibujo de hoja A4 con 3 flechas y nombres. \textbf{Extensión:} 1/3 de página. \textbf{Sabes que terminaste cuando} tienes los 3 elementos ubicados en tu dibujo con su nombre.

sistematizacion:
  intro: |-
    Ya viste dónde van. Ahora aprendes \textbf{cómo insertarlos} en Word y cuándo usar cada uno.

  pilares:
  - |-
    \textbf{Encabezado --- la franja de arriba.} En Word: \texttt{Insertar → Encabezado → escoge un estilo simple} (\emph{En blanco} es lo más limpio). Aparece un área en gris en la parte superior de la página: ahí escribes. \textbf{Qué poner:} tu nombre, grado, materia, título del trabajo. Ejemplo típico: \emph{``María Cárdenas · Grado 6B · Tecnología''}. \emph{Importante:} lo que escribes aparece en TODAS las páginas del documento. Por eso es genial: lo configuras una vez y se aplica a todo.
  - |-
    \textbf{Pie de página --- la franja de abajo.} En Word: \texttt{Insertar → Pie de página → En blanco}. Aparece un área en gris en la parte inferior. \textbf{Qué poner:} fecha de entrega, nombre del colegio, frase corta, número de página. Ejemplo: \emph{``I.E. Sor María Juliana · Cartago · Mayo 2026''}. Igual que el encabezado: aparece en todas las páginas.
  - |-
    \textbf{Número de página.} En Word: \texttt{Insertar → Número de página → escoge posición} (más común: \emph{Parte inferior, esquina derecha}). El número se inserta automáticamente y se actualiza solo cuando agregas o quitas páginas. \textbf{Pista profesional:} si el documento tiene portada, normalmente no se numera la portada. La página 1 es la primera página de contenido.
  - |-
    \textbf{Diferencia entre portada y página de contenido.} La \textbf{portada} es la primera página, con título grande, nombre, fecha, grado. NO lleva texto del informe. Las \textbf{páginas de contenido} son las que siguen. Estructura típica: \emph{página 1 (portada) + páginas 2 y 3 (contenido) + página 4 (cierre o referencias)}. En documentos cortos (1-2 páginas), no es obligatorio tener portada separada. En informes formales, sí.

  anatomia:
    titulo: 3 elementos de marco + portada
    body: |-
      \textbf{Encabezado:} arriba, en todas las páginas. Nombre + grado + materia. \\[1mm]
      \textbf{Pie de página:} abajo, en todas las páginas. Fecha + colegio + frase. \\[1mm]
      \textbf{Número de página:} esquina inferior derecha. Empieza en 1 (sin contar portada). \\[1mm]
      \textbf{Portada:} primera página separada, sin encabezado/pie de contenido.

  errores_comunes: |-
    \textbf{Errores frecuentes con encabezado y pie.} (1) \emph{Olvidar el nombre en el encabezado}: 30 trabajos en la mesa del profe = ninguno se sabe de quién es. (2) \emph{Numerar la portada como página 1}: técnicamente la portada es 0 o sin número. La página 1 es la primera de contenido. (3) \emph{Mismo texto en encabezado y pie}: redundante. Encabezado para identificación; pie para datos secundarios. (4) \emph{Encabezado en mayúsculas con tamaño grande}: queda gritando. Tamaño 10-11 en encabezado y pie es lo profesional. (5) \emph{Información distinta en encabezado de cada página}: tiene que ser lo mismo en todas (eso es lo que el encabezado hace bien).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Caminos para insertar encabezado, pie y números». \textbf{Formato:} 3 bloques con el camino en Word (Insertar → ... → ...) + qué poner en cada uno. \textbf{Extensión:} 3 bloques. \textbf{Sabes que terminaste cuando} podrías guiar a un compañero paso por paso a insertar los 3.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tu mini-informe de 2 páginas con marco completo} (32 min · individual). Vas a crear un mini-informe profesional sobre un tema libre. Estructura: \emph{Portada (1 página) + Contenido (2 páginas)}. Con encabezado, pie de página y números.

  pilares:
  - |-
    \textbf{Paso 1 --- Escoge tu tema.} En el cuaderno escribe el tema y 3 puntos clave que vas a desarrollar. Tema sugerido: \emph{``Mi materia favorita''}, \emph{``Una persona admiro''}, \emph{``Algo que me gustaría aprender''}, lo que tú quieras. 3 puntos clave que vas a desarrollar en el cuerpo.
  - |-
    \textbf{Paso 2 --- Portada (página 1).} Abre documento nuevo. En la primera página: título grande centrado tamaño 28 + tu nombre completo + grado + materia + fecha. Aplica formato bonito (negrita, color azul oscuro). La portada \emph{no lleva} encabezado, pie ni número de página. Al final de la portada, presiona \texttt{Ctrl + Enter} para saltar a una nueva página.
  - |-
    \textbf{Paso 3 --- Encabezado para páginas 2 y 3.} En la página 2 (donde está el cursor), ve a \texttt{Insertar → Encabezado → En blanco}. Escribe: \emph{``[Tu nombre completo] · Grado 6[letra] · Tecnología''}. Tamaño 10, color gris oscuro, alineación derecha. Sal del modo encabezado haciendo doble clic en el cuerpo.
  - |-
    \textbf{Paso 4 --- Pie de página + número.} Ve a \texttt{Insertar → Pie de página → En blanco}. Escribe a la izquierda: \emph{``I.E. Sor María Juliana --- Cartago --- Mayo 2026''}. Después ve a \texttt{Insertar → Número de página → Parte inferior, esquina derecha}. Aparece el número 1 en la página 2 y 2 en la página 3. Si la portada también recibió número, configura para que no se numere (es una opción avanzada; el profe te puede ayudar).
  - |-
    \textbf{Paso 5 --- Cuerpo del informe.} En la página 2 escribe un título arriba: \emph{``[Tema]''} (tamaño 14, negrita, azul). Debajo escribe 3-4 párrafos con tus 3 puntos clave. Aplica formato de S3 (justificado, sangría, negrita en lo importante). En la página 3 termina los párrafos (o agrega una mini-conclusión, una lista, o una imagen). Llena bien las 2 páginas con texto + 1 elemento visual (lista o imagen).
  - |-
    \textbf{Paso 6 --- Guarda + dibujo.} Guarda como \texttt{2026-mi-mini-informe.docx} en \emph{Tecnologia/Periodo-3}. En el cuaderno haz un dibujo de las 3 páginas del documento: \emph{página 1 (portada con título grande), página 2 (con encabezado arriba, contenido al medio, pie y \#1 abajo), página 3 (igual con \#2)}.

  checklist:
    titulo: Antes de mostrar tu mini-informe
    items: |-
      \checkbox La portada tiene título grande, nombre, grado, fecha. \\[1mm]
      \checkbox La portada NO tiene encabezado, pie ni número de página. \\[1mm]
      \checkbox Las páginas 2 y 3 tienen encabezado con mi nombre, grado y materia. \\[1mm]
      \checkbox Las páginas 2 y 3 tienen pie con datos institucionales. \\[1mm]
      \checkbox Las páginas 2 y 3 tienen número de página en esquina inferior derecha. \\[1mm]
      \checkbox El documento está guardado con nombre correcto.

  plantilla_guion: |-
    \textbf{Estructura del informe.} \textit{Página 1 (portada):} título grande + nombre + grado + fecha. \textit{Página 2:} encabezado (nombre·grado·materia) + título de sección + 2 párrafos + pie con datos colegio + número 1. \textit{Página 3:} encabezado igual + cierre del tema + pie + número 2. \textit{Guardado:} 2026-mi-mini-informe.docx.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi mini-informe de 2 páginas con marco completo». \textbf{Formato:} dibujo de las 3 páginas del documento etiquetando los 3 elementos en cada una. \textbf{Extensión:} 1 página del cuaderno. \textbf{Sabes que terminaste cuando} cada página del documento tiene los elementos correctos en el lugar correcto.

  producto_titulo: Mini-informe de 2 páginas + portada con marco profesional completo
  criterios:
  - La portada está separada y sin elementos de marco.
  - Las páginas 2 y 3 tienen encabezado con identificación.
  - Las páginas 2 y 3 tienen pie de página con datos institucionales.
  - Las páginas 2 y 3 tienen número de página.
  - El contenido del informe ocupa 2 páginas con texto formateado.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del marco y del contexto)"
    cita: |-
      ``Nada existe sin marco. Sin marco la pintura es un papel. Sin marco el documento es ruido. El marco da existencia.''
    aplicacion: |-
      Un documento sin marco \textbf{flota sin contexto}: ¿quién lo escribió?, ¿cuándo?, ¿de qué tema?, ¿para qué materia? El marco (encabezado + pie + número) responde esas preguntas \emph{de un vistazo}. Doña Mercedes lo entendía: el cuaderno con nombre, fecha y página era \textbf{un cuaderno con identidad}. Sin esos datos, era un papel cualquiera.
    pregunta_espejo: |-
      ¿Mis trabajos tienen marco o flotan sin contexto?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``La disciplina pequeña hace al trabajo grande visible. Quien marca cada hoja con su nombre se respeta y respeta a quien lo lee.''
    aplicacion: |-
      Poner encabezado y pie toma \textbf{30 segundos por documento}, pero comunica \emph{respeto} y \emph{profesionalismo}. Un profe que recibe 30 trabajos con marco trabaja mejor que uno que recibe 30 sin nombre. \emph{Tu pequeña disciplina les ahorra horas a los demás}. Eso es ética en pequeño.
    pregunta_espejo: |-
      Las pequeñas disciplinas (marco, formato, organización), ¿las cumplo o las dejo para otra vez?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del documento como objeto profesional)"
    cita: |-
      ``Un documento con marco es un objeto profesional. Un documento sin marco es un borrador. La diferencia es 30 segundos de configuración.''
    aplicacion: |-
      Hay una diferencia entre \emph{escribir} y \emph{producir un documento profesional}. \textbf{Lo primero es contenido}; \textbf{lo segundo es contenido + marco}. En tu vida adulta, lo que entregas en universidad, trabajo, proyectos, va a juzgarse por las dos cosas. \emph{Hoy aprendiste cómo invertir 30 segundos para subir el nivel}.
    pregunta_espejo: |-
      ¿Estoy entregando contenido o estoy entregando documentos profesionales?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, en cualquier documento de más de 1 página que entregues, agrega los 3 elementos de marco. La próxima clase salimos del procesador de texto e iniciamos la \textbf{segunda mitad del periodo}: \emph{Internet}. Vas a entender cómo funciona la red por dentro y cómo viajan los datos cuando navegas. Hoy cerraste el módulo de Word; la próxima abrimos el de Internet.

web:
  conceptos_clave:
    - termino: Encabezado (header)
      definicion: |-
        La franja superior que aparece en todas las páginas del documento. Allí va información de identificación: nombre, grado, materia, título del trabajo. Se configura una vez y se aplica a todas las páginas.
      ejemplo: |-
        "María Cárdenas · Grado 6B · Tecnología" arriba a la derecha de cada página. Si entregas 3 hojas y se mezclan con las de otros, el profe identifica las tuyas en segundos.
      emoji: "📋"
    - termino: Pie de página (footer)
      definicion: |-
        La franja inferior que aparece en todas las páginas. Sirve para información secundaria: fecha de impresión, nombre del colegio, frase de cierre, número de página. Complementa al encabezado.
      ejemplo: |-
        "I.E. Sor María Juliana · Cartago · Mayo 2026" abajo a la izquierda. Da contexto institucional al documento sin saturar el cuerpo.
      emoji: "📄"
    - termino: Número de página
      definicion: |-
        El contador automático que muestra qué número de página estás viendo (1, 2, 3...). Se inserta normalmente en el pie. Si agregas o quitas páginas, los números se actualizan solos.
      ejemplo: |-
        Si tu trabajo de 5 páginas se cae y se mezcla, el número en cada página te permite reorganizarlas en el orden correcto: 1, 2, 3, 4, 5.
      emoji: "🔢"
    - termino: Portada
      definicion: |-
        La primera página del documento, con el título grande, nombre del autor, fecha y grado. No tiene texto del informe, ni encabezado ni pie de las otras páginas. Es como la tapa de un libro.
      ejemplo: |-
        En tus trabajos de universidad, la portada lleva: título del trabajo, tu nombre, materia, profe, fecha. Sin contenido. La página 1 (con número) viene después.
      emoji: "📑"
    - termino: Salto de página (Ctrl+Enter)
      definicion: |-
        Comando para terminar la página actual y saltar a una nueva, aunque la anterior no esté llena. Útil para separar portada del contenido, o para que cada sección empiece en página nueva.
      ejemplo: |-
        Después de escribir la portada, presionas Ctrl+Enter. Aunque solo escribiste 5 líneas, el cursor salta a la página 2. La portada queda separada.
      emoji: "📃"

  quiz:
    titulo: "¿Sabes terminar un documento profesional?"
    instrucciones: "5 preguntas para verificar que dominas los elementos de marco y la portada."
    preguntas:
      - enunciado: "Tu trabajo tiene 4 páginas y todas se mezclaron en la mesa del profe. ¿Cómo identifica las tuyas?"
        opciones:
          - "Por el color del papel."
          - "Por el encabezado que tiene mi nombre y grado en cada página."
          - "Por la letra escrita a mano."
          - "Sin manera, las pierde."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El encabezado se repite en TODAS las páginas. Por eso si las hojas se mezclan, basta mirar arriba para identificar quién es el dueño.
        feedback_incorrecto: |-
          El encabezado se aplica a todas las páginas y lleva tu identificación. Sin él, las hojas mezcladas son un desastre.
      - enunciado: "¿Cuál es el camino en Word para insertar número de página?"
        opciones:
          - "Insertar → Número de página → escoger posición."
          - "Inicio → Numeración."
          - "Archivo → Guardar."
          - "Diseño → Color."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. Insertar → Número de página → escoge posición (lo más común: parte inferior, esquina derecha). Word inserta el contador automático.
        feedback_incorrecto: |-
          Insertar → Número de página → posición. Lo más común: parte inferior, esquina derecha. El número se inserta y se actualiza solo.
      - enunciado: "¿La portada debe llevar número de página?"
        opciones:
          - "Sí, siempre. Es la página 1."
          - "Sí, pero en romano (I)."
          - "Solo si el profe lo pide."
          - "No. La página 1 es la primera página de contenido, no la portada."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. La portada va sin número de página. La página 1 es la primera de contenido. Esto es regla universal de documentos profesionales.
        feedback_incorrecto: |-
          La portada NO se numera. La primera página de contenido es la página 1. Hay una opción en Word para "Diferente en primera página" que excluye la portada.
      - enunciado: "¿Qué deberías poner en el pie de página de tu trabajo escolar?"
        opciones:
          - "Tu contraseña."
          - "Una frase chistosa."
          - "Fecha de entrega + nombre del colegio + número de página."
          - "Solo el número de página, nada más."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Fecha + colegio + número de página. Información institucional secundaria. El encabezado lleva tu identificación; el pie complementa con contexto.
        feedback_incorrecto: |-
          Pie de página: fecha + colegio + número. Información que complementa al encabezado. Identificación arriba; contexto institucional abajo.
      - enunciado: "Acabas de escribir la portada en la página 1. ¿Cómo saltas a la página 2?"
        opciones:
          - "Presiono Enter muchas veces hasta llegar."
          - "Salgo de Word y vuelvo a entrar."
          - "Insertar → Tabla."
          - "Ctrl + Enter (salto de página)."
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Ctrl+Enter es el salto de página. La portada queda separada y el cursor llega a la página 2 lista para contenido. Profesional y rápido.
        feedback_incorrecto: |-
          Ctrl+Enter = salto de página. Termina la página actual y empieza una nueva. Mejor que dar Enter mil veces (eso se desordena al editar después).

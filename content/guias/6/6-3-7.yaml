clave: "3-7"
grado: 6
periodo: 3
sesion: 7
completo: true

titulo: "¿Qué es internet? --- cómo viajan los datos para llegar a tu pantalla"
titulo_portada: |-
  ¿Qué es
  internet? ---
  cómo viajan
  los datos
  a tu pantalla

producto_final: |-
  Un \textbf{diagrama del viaje de un paquete de datos} desde tu dedo cuando tocas un video de YouTube hasta el video aparece en tu pantalla. El diagrama incluye \textbf{6 estaciones} (tu dispositivo · módem/router de casa · proveedor de internet · cables submarinos · servidor de YouTube · regreso a tu pantalla), con flechas y tiempos aproximados. Más \textbf{en el cuaderno}: glosario de 6 términos clave (URL, IP, paquete, servidor, banda ancha, wifi) con definición tuya.

apertura:
  saber_ancestral: |-
    \textbf{Antes de internet, los mensajes viajaban por una red de personas y caballos.} El \textbf{pregonero} de Cartago llevaba un anuncio de cuadra en cuadra. Si la noticia tenía que llegar a Pereira, viajaba en \textbf{caballo} con un mensajero. Si tenía que llegar a Bogotá, viajaba en \textbf{tren}. Si llegaba a otro país, viajaba en \textbf{barco}. Cada mensajero conocía solo su tramo. \emph{Ningún mensajero hacía todo el viaje}: la información pasaba de uno a otro, como un balón. El cartero entregaba al jefe de correo, el jefe al maquinista, el maquinista al de la otra ciudad. \textbf{Esa idea --- la información que viaja en tramos, pasando de un sistema a otro --- es exactamente cómo funciona internet}. Solo que en vez de caballos hay cables; en vez de jinetes hay servidores; en vez de meses hay segundos. \textbf{Internet es el sistema de mensajeros más grande de la historia humana}, pero la idea es antigua: una red que conecta a personas que están lejos.

  saber_contemporaneo: |-
    \textbf{Internet} es una red mundial de computadoras conectadas entre sí. Cuando tú haces clic en un video de YouTube, NO le pides el video al video directamente. Le pides a tu \textbf{módem} (la cajita con luces en tu casa), el módem le pide al \textbf{proveedor} (Claro, Movistar, etc.), el proveedor le pide al \textbf{servidor de YouTube} (un computador grande en California o en otro país), y la respuesta hace el camino de vuelta. \textbf{La información viaja en pequeños trozos llamados ``paquetes''}, no de un solo bocado. Cada paquete tiene una \emph{dirección} (a quién va) y un \emph{remitente} (de dónde viene). Estas direcciones se llaman \textbf{IP} (Protocolo de Internet). Cada vez que abres una página, miles de paquetes viajan por cables submarinos, antenas, servidores. \textbf{Todo eso pasa en menos de 1 segundo}. Entender este viaje te quita el mito de que internet es \emph{``magia''}: es ingeniería bien hecha.

  pregunta_puente: |-
    Cuando le das \emph{play} a un video de YouTube, ¿\textbf{de dónde sale realmente el video}? ¿Está en tu celular? ¿Está en una nube en el cielo? ¿Dónde está físicamente?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} las 6 estaciones del viaje de un paquete; (2) sabrás \textbf{explicar} qué son los paquetes, las direcciones IP y los servidores; (3) podrás \textbf{distinguir} entre wifi y datos móviles; (4) habrás \textbf{creado} un diagrama del viaje completo.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: imaginas el viaje del paquete, aprendes las 6 estaciones, distingues conceptos clave (IP, paquete, servidor), y dibujas tu diagrama.
  a_escuta: |-
    Empezamos con una historia: el viaje de Mateo que envía un mensaje a su prima en España.
  a_sistematizacion: |-
    Después aprendes las 6 estaciones del viaje + los 6 términos técnicos.
  a_praxis: |-
    Con todo claro, dibujas tu diagrama del viaje de un paquete específico (un video o un chat).
  a_producto: |-
    El producto es ese diagrama firmado + el glosario en el cuaderno.
  a_evaluacion: |-
    Antes de salir, verificas que tu diagrama tiene 6 estaciones y que cada flecha tiene un tiempo aproximado.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué saber cómo funciona la red te hace ciudadano digital.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- La historia del mensaje de Mateo} (10 min · individual). Lee esta historia y \textbf{en el cuaderno dibuja las estaciones que reconozcas}. \emph{``Mateo está en Cartago. Le quiere mandar una foto a su prima Sofía que vive en Madrid, España. Mateo abre WhatsApp en su celular. Toma la foto. La envía. En menos de 5 segundos, la foto aparece en el celular de Sofía. Pero la foto NO viajó directo de Cartago a Madrid. La foto pasó por: el wifi de su casa, el módem, el proveedor de internet de Cartago, cables que conectan Colombia con Europa por debajo del mar, otro proveedor en España, finalmente el celular de Sofía. ¿Cuántas estaciones intervinieron?''}. Cuéntalas. Dibújalas como un mapa.

  checks:
  - Leí la historia con calma.
  - Conté las estaciones que mencionó.
  - Dibujé un mini mapa con las estaciones que recuerdo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- El viaje de la foto de Mateo». \textbf{Formato:} dibujo simple de mapa con flechas conectando estaciones. \textbf{Extensión:} medio cuaderno. \textbf{Sabes que terminaste cuando} tu dibujo cubre el viaje de Cartago a Madrid con al menos 5 estaciones intermedias.

sistematizacion:
  intro: |-
    Lo que dibujaste es básicamente correcto. Ahora aprende las \textbf{6 estaciones técnicas} con sus nombres reales y los términos que usan los ingenieros.

  pilares:
  - |-
    \textbf{Estación 1 --- Tu dispositivo (origen).} Tu celular, computador o tableta. Aquí nace el paquete: cuando tocas \emph{play}, tu dispositivo prepara una \textbf{solicitud} (\emph{request}) que dice: \emph{``quiero el video XYZ''}. La solicitud se divide en muchos \emph{paquetes} (pedacitos de información). \textbf{Estación 2 --- Módem o router de tu casa.} La cajita con luces. El módem recibe los paquetes de tu dispositivo (por wifi o cable) y los lanza hacia internet. Es como el \emph{cartero del barrio}: junta lo que sale de tu cuadra y lo manda al correo central.
  - |-
    \textbf{Estación 3 --- Proveedor de internet (ISP).} Claro, Movistar, ETB, etc. El proveedor recibe los paquetes del módem y los \textbf{enruta} hacia el destino correcto. Tiene grandes computadores (\emph{routers}) que deciden el mejor camino. Es como el \emph{centro de distribución de correo} de la ciudad. \textbf{Estación 4 --- Cables submarinos e infraestructura mundial.} Los paquetes viajan por \textbf{cables de fibra óptica} (algunos están en el fondo del mar) entre continentes. También por \emph{satélites} en ciertos casos. La velocidad: cerca de la velocidad de la luz. De Colombia a Europa, los paquetes tardan unos 100 milisegundos.
  - |-
    \textbf{Estación 5 --- Servidor de YouTube (destino).} \textbf{Un servidor es un computador grande} que guarda los videos y los entrega cuando alguien los pide. Los servidores de YouTube están en \emph{centros de datos} (\emph{data centers}) en California, Europa, Asia. Cada video tiene una \textbf{dirección IP} (un número que lo identifica único en internet, como una dirección postal). \textbf{Estación 6 --- El viaje de regreso.} El servidor manda los paquetes del video al revés: por los cables, por el proveedor de YouTube, por cables submarinos, por tu proveedor, por tu módem, hasta tu pantalla. Todo este viaje toma \textbf{menos de 1 segundo} para una página normal, 2-3 segundos para un video que empieza a cargar.
  - |-
    \textbf{Los 6 términos técnicos clave.} (1) \textbf{URL}: la dirección que escribes en el navegador (\emph{www.youtube.com}). (2) \textbf{IP}: el número único de un dispositivo o servidor (\emph{172.217.16.78}). (3) \textbf{Paquete}: pedacito de información que viaja. Un video se divide en miles. (4) \textbf{Servidor}: computador grande que guarda y entrega información. (5) \textbf{Banda ancha}: cuánta información puede pasar por la conexión a la vez (más banda = más rápido). (6) \textbf{Wifi vs datos móviles}: wifi es de tu router de casa; datos móviles son del proveedor por antenas celulares. Ambos conectan a internet, solo cambia el primer tramo.

  anatomia:
    titulo: 6 estaciones + 6 términos
    body: |-
      \textbf{Estaciones:} tu dispositivo · módem/router · proveedor · cables submarinos · servidor destino · regreso. \\[1mm]
      \textbf{Términos:} URL · IP · paquete · servidor · banda ancha · wifi vs datos.

  errores_comunes: |-
    \textbf{Mitos sobre internet que escucharás.} (1) \emph{``Los datos viajan por el aire''} --- Falso. Mayormente por cables (submarinos, terrestres). El aire (wifi/celular) es solo el último tramo. (2) \emph{``La nube está en el cielo''} --- Falso. La \emph{nube} son servidores en edificios físicos en distintos países. La palabra es metáfora. (3) \emph{``Cuanto más wifi, más internet''} --- Falso. Más wifi = más alcance dentro de tu casa, pero la velocidad la da el plan del proveedor. (4) \emph{``Internet es una sola cosa''} --- Falso. Es una red de redes (miles de proveedores y servidores conectados). De ahí su nombre: \emph{inter-net} (entre-red). (5) \emph{``Mi celular es el que guarda los videos de TikTok''} --- Falso. Los videos están en los servidores; tu celular solo descarga y reproduce.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Glosario de internet». \textbf{Formato:} lista de 6 términos con definición tuya en una línea. \textbf{Extensión:} 6 líneas. \textbf{Sabes que terminaste cuando} podrías explicarle a tu abuelo qué es una IP usando solo tus palabras.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Diagrama del viaje de un paquete} (28 min · individual). Vas a dibujar en una hoja del cuaderno el \textbf{viaje completo} de un paquete de datos desde que tocas \emph{play} en YouTube hasta que ves el video. 6 estaciones, flechas, tiempos.

  pilares:
  - |-
    \textbf{Paso 1 --- Título y orientación.} En la parte superior escribe: \textbf{``El viaje de un paquete de datos''} y debajo: \emph{``Desde mi celular hasta el servidor de YouTube --- ida y vuelta''}. Subraya el título. Pon la hoja en \emph{horizontal} (apaisada) porque vas a necesitar espacio para 6 estaciones.
  - |-
    \textbf{Paso 2 --- Las 6 estaciones (de izquierda a derecha).} Dibuja 6 cajitas o íconos en línea horizontal, separadas por flechas: \textbf{(1) Tu celular} (un cuadrito con ícono de móvil), \textbf{(2) Módem/router de casa} (una caja con antenas), \textbf{(3) Proveedor (Claro o Movistar)} (un edificio), \textbf{(4) Cables submarinos} (líneas onduladas que representan el océano), \textbf{(5) Servidor de YouTube} (un rectángulo grande con racks de computadores), \textbf{(6) Regreso} (puedes representarlo con una flecha curva grande que vuelve).
  - |-
    \textbf{Paso 3 --- Etiqueta cada estación.} Debajo de cada cajita, en tamaño pequeño, escribe: número (1, 2, 3...) + nombre + qué hace ahí en 1 línea. Ejemplo bajo la cajita 2: \emph{``Módem: junta los paquetes y los manda a internet''}.
  - |-
    \textbf{Paso 4 --- Tiempos aproximados.} En cada flecha entre estaciones, escribe el \textbf{tiempo aproximado} en milisegundos (ms). Datos reales aproximados: \emph{Celular → Módem: 1 ms · Módem → Proveedor: 10 ms · Proveedor → Cables submarinos: 30 ms · Cables → Servidor: 80 ms · Servidor procesa: 50 ms · Total ida: 170 ms · Total ida y vuelta: 340 ms}. (Total cerca de 1/3 de segundo).
  - |-
    \textbf{Paso 5 --- Acciones en cada estación.} Al lado de las cajitas, escribe en mini-flecha lo que pasa: \emph{``Aquí el paquete se divide''}, \emph{``Aquí se elige el camino más rápido''}, \emph{``Aquí está guardado el video''}. Esto convierte el diagrama de \emph{mapa} en \emph{historia}.
  - |-
    \textbf{Paso 6 --- Firma y reflexión.} En la esquina inferior derecha firma con nombre completo y fecha. Debajo, escribe una frase de cierre: \emph{``Ahora sé que cuando veo un video, no es magia: es ingeniería que pasa en menos de 1 segundo.''}. Subráyala.

  checklist:
    titulo: Antes de mostrar tu diagrama
    items: |-
      \checkbox El diagrama ocupa una hoja horizontal completa. \\[1mm]
      \checkbox Están las 6 estaciones dibujadas y etiquetadas. \\[1mm]
      \checkbox Hay flechas entre las 6 estaciones (ida y vuelta). \\[1mm]
      \checkbox Cada flecha tiene un tiempo aproximado en ms. \\[1mm]
      \checkbox Cada estación tiene una acción descrita en 1 línea. \\[1mm]
      \checkbox Está firmado con frase de cierre subrayada.

  plantilla_guion: |-
    \textbf{Estructura del diagrama.} \textit{Horizontal.} Estaciones 1 a 5 en línea. Flechas con ms. Etiquetas con número + nombre + acción. Estación 6 (regreso) como flecha curva. Firma y frase abajo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- El viaje de un paquete de datos». \textbf{Formato:} diagrama horizontal con 6 estaciones + flechas + tiempos. \textbf{Extensión:} 1 hoja completa horizontal. \textbf{Sabes que terminaste cuando} podrías mostrarle el diagrama a tu mamá y ella entendería cómo funciona internet en 2 minutos.

  producto_titulo: Diagrama del viaje de un paquete con 6 estaciones + tiempos · firmado
  criterios:
  - El diagrama tiene 6 estaciones identificables.
  - Las flechas muestran el orden del viaje (ida y vuelta).
  - Cada estación tiene número, nombre y acción.
  - Hay tiempos aproximados en milisegundos.
  - Está firmado con frase de cierre.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la transparencia tecnológica)"
    cita: |-
      ``La tecnología se vuelve servidumbre cuando no la entiendes. Se vuelve libertad cuando sabes cómo funciona.''
    aplicacion: |-
      Mucha gente usa internet sin saber qué pasa por dentro. Eso los hace \textbf{usuarios dependientes}: si algo falla, no saben qué reportar; si los engañan, no saben cómo. \emph{Cuando tú entiendes el viaje del paquete, dejas de ser usuario y pasas a ser ciudadano de la red}. La diferencia es enorme. Hoy diste un paso grande hacia esa ciudadanía.
    pregunta_espejo: |-
      ¿Quiero seguir siendo usuario dependiente o quiero ser ciudadano de la red?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Cada cosa cotidiana esconde un mundo si te detienes a preguntarla. Internet es un mundo entero detrás de un clic.''
    aplicacion: |-
      Hacer clic en \emph{play} es un gesto que toma 1 segundo. Pero \textbf{detrás de ese clic} hay cables submarinos, servidores en California, ingenieros que diseñaron los protocolos hace 50 años, electricidad que mueve los routers, infraestructura por todo el planeta. \emph{Detenerse a entenderlo es entrenar el asombro}. Cuando vuelves a usar internet con esa conciencia, todo cambia.
    pregunta_espejo: |-
      ¿Qué otras cosas cotidianas escondo mundos que no he querido conocer?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de internet)"
    cita: |-
      ``Internet no es una herramienta más. Es el sistema nervioso de la humanidad del siglo XXI. Aprender cómo funciona es aprender en qué planeta vives.''
    aplicacion: |-
      \textbf{La generación de tus papás vivió un mundo sin internet}. La tuya nació con él. Eso te da una ventaja: lo usas con naturalidad. Pero también un riesgo: \emph{lo das por sentado}. Entender cómo funciona te ayuda a no darlo por sentado: a notar cuando falla, a defender que sea libre y abierto, a usarlo con criterio. Internet es público, como el agua, como la energía. \emph{Entenderlo es responsabilidad ciudadana}.
    pregunta_espejo: |-
      ¿Estoy usando internet como un usuario de paso, o como un ciudadano que sabe lo que tiene entre manos?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, observa: cuando navegas, ¿cuánto se demora cada página en cargar? ¿Por qué algunas tardan más? La próxima clase aprendes a \textbf{buscar bien en internet}: operadores de búsqueda, filtros, técnicas para encontrar lo que necesitas en segundos, no en minutos.

web:
  conceptos_clave:
    - termino: Internet
      definicion: |-
        Red mundial de computadoras conectadas entre sí. No es una sola cosa: es millones de redes interconectadas (de ahí "inter-net"). Por esta red viajan datos en forma de paquetes pequeños.
      ejemplo: |-
        Cuando le das play a un video en YouTube, la información viaja por internet desde un servidor en California hasta tu celular en Cartago, pasando por cables submarinos. Todo en 1 segundo.
      emoji: "🌐"
    - termino: URL
      definicion: |-
        La dirección que escribes en el navegador para llegar a una página. Por ejemplo www.youtube.com es la URL de YouTube. URL viene de inglés: Uniform Resource Locator.
      ejemplo: |-
        Cuando quieres ver Wikipedia escribes "es.wikipedia.org" en el navegador. Esa es una URL. Es como la dirección postal de una página en internet.
      emoji: "🔗"
    - termino: IP (Internet Protocol)
      definicion: |-
        El número único que identifica un dispositivo o un servidor en internet. Como una dirección postal pero numérica. Ejemplo: 172.217.16.78 podría ser la IP de un servidor de Google.
      ejemplo: |-
        Tu celular tiene una IP mientras está conectado. Cada vez que te conectas al wifi de un lugar nuevo, recibes una IP nueva (asignada por el router).
      emoji: "📍"
    - termino: Paquete (de datos)
      definicion: |-
        Pedacito pequeño de información que viaja por internet. La información grande (un video, una foto) se divide en miles de paquetes que viajan por separado y se reensamblan en el destino.
      ejemplo: |-
        Cuando subes una foto a Instagram, no viaja toda junta. Se divide en cientos de paquetes que viajan por caminos distintos, llegan al servidor de Instagram y allá se rejuntan.
      emoji: "📦"
    - termino: Servidor
      definicion: |-
        Computador grande y especializado en guardar y entregar información a los usuarios. Los servidores de YouTube guardan los videos. Los servidores de Google guardan los resultados de búsqueda. Viven en edificios llamados centros de datos.
      ejemplo: |-
        Cuando ves un video de YouTube, ese video no está en tu celular: está en un servidor de Google en California. Tu celular solo lo descarga y reproduce mientras lo ves.
      emoji: "🖥️"

  quiz:
    titulo: "¿Sabes cómo funciona internet por dentro?"
    instrucciones: "5 preguntas para verificar que entiendes el viaje de los datos y los términos clave."
    preguntas:
      - enunciado: "Le das play a un video de YouTube. ¿Dónde está realmente ese video?"
        opciones:
          - "En tu celular, guardado para siempre."
          - "En un servidor de Google, posiblemente en California."
          - "En las nubes del cielo."
          - "En tu casa, en el módem."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Los videos viven en servidores físicos de Google (en centros de datos). Tu celular solo los descarga y reproduce. Por eso necesitas internet para verlos.
        feedback_incorrecto: |-
          Los videos viven en servidores físicos de Google. Tu celular los descarga en streaming. Por eso sin internet no puedes verlos.
      - enunciado: "¿Qué es un 'paquete' en internet?"
        opciones:
          - "Una caja con productos comprados."
          - "Pedacito de información que viaja entre dispositivos."
          - "Un programa que instalas."
          - "Un sobre de papel."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La info grande (videos, fotos) se divide en miles de paquetes que viajan por separado. En el destino se rejuntan. Es como un rompecabezas de información.
        feedback_incorrecto: |-
          Un paquete es un pedacito de información digital. La información grande se divide en miles de paquetes que viajan separados.
      - enunciado: "Tu prima en España te manda una foto por WhatsApp. ¿Por dónde viaja principalmente?"
        opciones:
          - "Por el aire directamente."
          - "Por cables (submarinos y terrestres) que conectan los continentes."
          - "Por aves entrenadas."
          - "Solo por wifi."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La mayoría de internet viaja por cables submarinos de fibra óptica. El wifi es solo el último tramo. Aves no, satélites algunos.
        feedback_incorrecto: |-
          Por cables submarinos de fibra óptica. Internet entre continentes va por cables en el fondo del mar. Wifi y celular son solo el último tramo a tu casa.
      - enunciado: "¿Qué es una dirección IP?"
        opciones:
          - "El nombre de un programa."
          - "Un número que identifica único a un dispositivo en internet."
          - "La velocidad del internet."
          - "El color del módem."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Una IP es como una dirección postal pero numérica. Cada dispositivo conectado tiene una. Por ejemplo, 172.217.16.78 puede ser la IP de un servidor de Google.
        feedback_incorrecto: |-
          IP = número único de identificación en internet. Cada celular, computador o servidor tiene una IP mientras está conectado. Es como una dirección postal.
      - enunciado: "Tu wifi de casa es lento. ¿De qué depende la velocidad real de internet?"
        opciones:
          - "Solo del wifi que tengas."
          - "Del plan de banda ancha que pagas al proveedor (Claro, Movistar, etc.)."
          - "Del color del router."
          - "De la cantidad de wifi vecinos."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La velocidad real depende del plan que pagas a tu proveedor (banda ancha). El wifi distribuye esa velocidad en tu casa. Más wifi sin más banda ancha no ayuda.
        feedback_incorrecto: |-
          La velocidad la da el plan de banda ancha que pagas. El wifi solo distribuye esa velocidad dentro de tu casa. Tener mejor wifi sin mejor plan no sirve.

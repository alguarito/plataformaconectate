clave: "3-8"
grado: 6
periodo: 3
sesion: 8
completo: true

titulo: "Buscar bien en internet --- encontrar lo que necesito en segundos"
titulo_portada: |-
  Buscar bien
  en internet ---
  encontrar lo
  que necesito
  en segundos

producto_final: |-
  Un \textbf{laboratorio de búsquedas} en el cuaderno con \textbf{10 búsquedas reales mejoradas}: para cada una anotas la \emph{búsqueda mala} (la primera que se te ocurre, típicamente vaga), \emph{los problemas} que tendría (resultados irrelevantes, demasiados, en otro idioma), \emph{la búsqueda mejorada} (con operadores), y \emph{cuántos resultados realmente útiles} salieron. Más \textbf{una tabla de 6 operadores de búsqueda} con ejemplo de uso.

apertura:
  saber_ancestral: |-
    \textbf{Antes de Google, cuando doña Mercedes la maestra rural necesitaba información del campo de Cartago, sabía a quién preguntar.} En la vereda La Plata, doña Mercedes no buscaba al azar. Si necesitaba saber sobre \emph{plagas del café}, iba donde \textbf{don Aurelio} que tenía 50 años trabajando en fincas. Si era sobre \emph{tejido del sombrero aguadeño}, iba donde \textbf{doña Carmen} la costurera. Si era sobre \emph{historia del barrio}, donde \textbf{don Lucho} el relojero que vivió ahí 60 años. \textbf{No preguntaba a cualquiera}: preguntaba a la persona correcta. Esa es la clave de buscar bien: \emph{saber a quién preguntar y cómo preguntar}. Hoy preguntamos a Google, Bing o DuckDuckGo, pero la lógica es la misma: \textbf{si preguntas mal, te dan mala respuesta; si preguntas con precisión, encuentras oro en segundos}. Internet tiene miles de millones de páginas. Solo unas pocas tienen lo que necesitas. Saber filtrar es el saber clave del siglo XXI.

  saber_contemporaneo: |-
    \textbf{Buscar bien en internet} es una habilidad que se aprende. La mayoría de las personas escribe \emph{``palabra suelta''} en Google y se conforma con los primeros resultados. Los que saben buscar usan \textbf{operadores}: símbolos y palabras que le dicen a Google qué excluir, qué incluir, qué tipo de archivo, qué sitio. Con \textbf{6 operadores básicos} puedes pasar de obtener \emph{millones de resultados confusos} a \emph{10 resultados precisos}. \textbf{Los 6 operadores universales:} \texttt{comillas} (para frase exacta), \texttt{site:} (para buscar en un sitio específico), \texttt{filetype:} (para tipo de archivo), \texttt{-palabra} (para excluir), \texttt{OR} (para alternativas), \texttt{rango..} (para fechas o números). Aprenderlos te hace \emph{10 veces más eficiente} en internet. Y los buscadores tienen \textbf{filtros visuales} (tiempo, idioma, tipo) que la mayoría ignora pero que ayudan muchísimo.

  pregunta_puente: |-
    Buscas en Google \emph{``perros''}. Sale Wikipedia, criaderos de perros, fotos de perros, historia de perros. Pero tú lo que quieres es \emph{``qué hacer si mi perro tiene fiebre''}. ¿\textbf{Cómo cambiarías la búsqueda} para encontrar exactamente eso?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 6 operadores de búsqueda más útiles; (2) sabrás \textbf{aplicar} cada uno en búsquedas reales; (3) podrás \textbf{evaluar} si una búsqueda está bien formulada; (4) habrás \textbf{mejorado} 10 búsquedas tuyas con criterio.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas el problema de buscar mal, aprendes los 6 operadores, mejoras 10 búsquedas tuyas, y registras todo en el cuaderno.
  a_escuta: |-
    Empezamos con 5 búsquedas malas para entender qué falla.
  a_sistematizacion: |-
    Después aprendes los 6 operadores universales con ejemplos.
  a_praxis: |-
    Con los operadores claros, mejoras 10 búsquedas tuyas (reales) y las pruebas.
  a_producto: |-
    El producto es la tabla de 10 búsquedas mejoradas + la tabla de 6 operadores.
  a_evaluacion: |-
    Antes de salir, comparas resultados: ¿cuánto cambió la calidad después de mejorar la búsqueda?
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué buscar bien es saber preguntar bien.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 5 búsquedas malas y por qué fallan} (12 min · individual). Lee estas 5 búsquedas y \textbf{escribe en el cuaderno qué problema tiene cada una}. \textbf{Búsqueda 1:} ``\texttt{tarea}''. \textbf{Búsqueda 2:} ``\texttt{Colombia}''. \textbf{Búsqueda 3:} ``\texttt{cómo hacer una tarea sobre Bolívar para 6\textsuperscript{o} grado en historia con bibliografía}''. \textbf{Búsqueda 4:} ``\texttt{volcán Galera}'' (con ``e'' en vez de ``a'' en Galeras). \textbf{Búsqueda 5:} ``\texttt{Mexico history}'' (en inglés). \emph{Tip:} las búsquedas pueden ser demasiado vagas, demasiado específicas, con errores ortográficos, en otro idioma, o muy ambiguas.

  checks:
  - Leí las 5 búsquedas con calma.
  - Identifiqué el problema de cada una.
  - Pensé qué tipo de error es (vaga, ambigua, error, idioma, larga).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 5 búsquedas malas». \textbf{Formato:} lista numerada de 5 búsquedas, cada una con un breve diagnóstico. \textbf{Extensión:} 5 líneas. \textbf{Sabes que terminaste cuando} puedes nombrar el tipo de error de cada una.

sistematizacion:
  intro: |-
    Ahora aprendes los \textbf{6 operadores de oro} que transforman búsquedas malas en búsquedas excelentes. Aprenderlos te toma 15 minutos; \textbf{te ahorra horas} el resto de tu vida.

  pilares:
  - |-
    \textbf{Operador 1 --- Comillas: para buscar frase exacta.} Si escribes \texttt{``volcán Galeras''} entre comillas, Google busca esas 2 palabras \emph{juntas y en ese orden}. Sin comillas, busca cualquier página que tenga las 2 palabras dispersas. \emph{Ejemplo:} buscar \texttt{``parque del bolívar Cartago''} te da el parque de Cartago. Buscar \emph{parque bolívar Cartago} sin comillas te da parques de varios países. \textbf{Operador 2 --- site: para buscar dentro de un sitio.} Si quieres resultados solo de Wikipedia, escribes \texttt{site:es.wikipedia.org volcán Galeras}. Si quieres solo del Ministerio de Educación, \texttt{site:mineducacion.gov.co cómo es el grado 6}. Te filtra por dominio.
  - |-
    \textbf{Operador 3 --- filetype: para tipo de archivo.} Si necesitas un PDF, escribes \texttt{filetype:pdf el código colombia infantil}. Te muestra solo PDFs. Útil para tareas que necesitan documentos formales. Otros: \texttt{filetype:doc}, \texttt{filetype:ppt}, \texttt{filetype:xls}. \textbf{Operador 4 --- guion (-) para excluir.} Si buscas \emph{``películas dragones''} pero NO quieres las de Disney, escribes \texttt{películas dragones -Disney}. El guion delante de una palabra la excluye. Útil cuando hay un tema que se mezcla con otro que no te interesa.
  - |-
    \textbf{Operador 5 --- OR para alternativas.} Si quieres páginas que mencionen Cartago O Pereira (cualquiera de las 2), escribes \texttt{cultura Cartago OR Pereira}. \emph{OR} en mayúsculas. Útil para comparar o cuando no sabes en cuál de varios lugares está el dato. \textbf{Operador 6 --- rango (..) para fechas o números.} Si buscas eventos entre 1950 y 1960, escribes \texttt{eventos Colombia 1950..1960}. Para precios de un producto entre 100 y 500 mil pesos: \texttt{computador \$100000..\$500000}. Los dos puntos (\texttt{..}) le dicen al buscador que busque un rango.
  - |-
    \textbf{Filtros visuales adicionales (los que la gente no usa pero ayudan mucho).} En Google, \emph{después} de buscar, aparecen pestañas: \textbf{Imágenes} (solo imágenes), \textbf{Noticias} (solo notas recientes), \textbf{Videos} (solo videos), \textbf{Mapas}, \textbf{Compras}. Y arriba, \textbf{Herramientas}: te deja filtrar por tiempo (\emph{última semana, último mes, este año}). Estos filtros, combinados con los 6 operadores, te dan superpoderes de búsqueda. \textbf{Pista:} para buscar texto reciente sobre un tema, usa siempre el filtro de tiempo. Los datos viejos pueden estar desactualizados.

  anatomia:
    titulo: 6 operadores + filtros
    body: |-
      \textbf{Op 1.} ``Frase exacta'' (entre comillas). \\[1mm]
      \textbf{Op 2.} site: (dentro de un sitio). \\[1mm]
      \textbf{Op 3.} filetype: (tipo de archivo). \\[1mm]
      \textbf{Op 4.} -palabra (excluir). \\[1mm]
      \textbf{Op 5.} OR (alternativas). \\[1mm]
      \textbf{Op 6.} año..año (rango). \\[1mm]
      \textbf{Filtros:} Imágenes · Videos · Noticias · Herramientas (tiempo).

  errores_comunes: |-
    \textbf{Errores frecuentes al buscar.} (1) \emph{Buscar 1 sola palabra}: \texttt{historia} te da millones de resultados confusos. Mejor 3-5 palabras concretas. (2) \emph{No revisar ortografía}: \texttt{volcán Galera} (con e) te da resultados extraños. (3) \emph{Quedarse en la primera página}: muchas veces el resultado bueno está en la 2da página. (4) \emph{No usar filtros}: Google ofrece Imágenes, Videos, Tiempo, etc., y mucha gente no los usa. (5) \emph{Confundir publicidad con resultados orgánicos}: los primeros suelen ser anuncios pagados (vienen marcados como \emph{``Anuncio''}). Pasa de largo a los reales.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Los 6 operadores con ejemplo». \textbf{Formato:} tabla de 6 filas, 3 columnas. Columnas: \emph{operador}, \emph{para qué}, \emph{ejemplo real}. \textbf{Extensión:} 6 filas. \textbf{Sabes que terminaste cuando} podrías ayudar a tu mamá a buscar algo en internet en 30 segundos.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Laboratorio de 10 búsquedas mejoradas} (28 min · individual). Vas a tomar \textbf{10 cosas reales} que tú podrías querer buscar en internet, y para cada una vas a anotar: la búsqueda mala (la primera que se te ocurre) y la búsqueda mejorada con operadores. Si tienes computador disponible, prueba ambas y compara cuántos resultados útiles salen.

  pilares:
  - |-
    \textbf{Paso 1 --- Encabezado y tabla.} En una hoja del cuaderno, título: \textbf{``Mi laboratorio de búsquedas''}. Dibuja una tabla de \textbf{10 filas y 4 columnas}. Encabezados: \emph{(a) Lo que quiero buscar} · \emph{(b) Búsqueda mala} · \emph{(c) Búsqueda mejorada (con operador)} · \emph{(d) ¿Funcionó mejor?}.
  - |-
    \textbf{Paso 2 --- Las 10 búsquedas.} Llena las 10 filas. Para inspiración: \emph{(1) Tarea de historia sobre Bolívar; (2) Cómo se prepara la mazamorra de Cartago; (3) Significado de la palabra ``efímero''; (4) Mejor canal de YouTube para aprender mate; (5) PDF del himno nacional con notas; (6) Foto del volcán Galeras de noche; (7) Documental de la Selección Colombia 1990 (no 2010 ni 2014); (8) Mapa de Cartago con calles; (9) Receta de arepas paisas (NO venezolanas); (10) Resultados de partido Colombia vs Argentina 1993}.
  - |-
    \textbf{Paso 3 --- Búsqueda mala (col b).} Escribe lo que escribirías si NO supieras de operadores. Ejemplo para (1): \emph{``Bolívar''} o \emph{``tarea Bolívar''}. Es vago: hay miles de Bolívar (la persona, ciudad, departamento, moneda, equipo de fútbol).
  - |-
    \textbf{Paso 4 --- Búsqueda mejorada (col c).} Aplica al menos UN operador en cada fila. Ejemplo para (1): \texttt{``Simón Bolívar'' biografía site:colombiaaprende.edu.co filetype:pdf}. Para (5): \texttt{``himno nacional Colombia'' notas musicales filetype:pdf}. Para (9): \texttt{arepas paisas -venezolanas receta}. Sé creativo: cada búsqueda usa un operador distinto.
  - |-
    \textbf{Paso 5 --- Prueba (si hay computador).} Si tienes acceso a un computador en clase, prueba las 10 búsquedas mejoradas en Google. En la columna (d) anota: \emph{``Sí, mejor''} o \emph{``No, igual''} o \emph{``Mejor en imágenes con el filtro Imágenes''}. Si no tienes computador hoy, las pruebas en casa esta semana.
  - |-
    \textbf{Paso 6 --- Reflexión final.} Debajo de la tabla, escribe en 3 líneas: \emph{``Aprendí que (a)..., (b)..., (c)...''}. Firma con nombre y fecha. La idea es interiorizar que \emph{buscar bien es habilidad}, no don.

  checklist:
    titulo: Antes de mostrar tu laboratorio
    items: |-
      \checkbox La tabla tiene 10 filas con sus 4 columnas. \\[1mm]
      \checkbox Cada fila usa al menos un operador en la búsqueda mejorada. \\[1mm]
      \checkbox Los 6 operadores aparecen al menos una vez en las 10 búsquedas. \\[1mm]
      \checkbox Si tuve computador, anoté si funcionó mejor (columna d). \\[1mm]
      \checkbox Hay reflexión final de 3 aprendizajes. \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura del laboratorio.} \textit{Tabla 10 × 4:} qué busco, búsqueda mala, búsqueda mejorada (con operador), resultado real. \textit{Debajo:} 3 aprendizajes en lista. \textit{Esquina:} firma y fecha.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi laboratorio de 10 búsquedas». \textbf{Formato:} tabla 10x4 + reflexión de 3 aprendizajes. \textbf{Extensión:} 1 página entera. \textbf{Sabes que terminaste cuando} comparando antes y después, ves la diferencia en calidad de búsqueda.

  producto_titulo: Laboratorio de 10 búsquedas mejoradas + 6 operadores aplicados
  criterios:
  - La tabla tiene 10 filas completas.
  - Cada búsqueda mejorada usa al menos un operador.
  - Los 6 operadores aparecen al menos 1 vez en el laboratorio.
  - Hay reflexión final con 3 aprendizajes.
  - Está firmado con nombre y fecha.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la pregunta crítica)"
    cita: |-
      ``Quien sabe preguntar, sabe encontrar. Quien no, depende de lo que le sirvan.''
    aplicacion: |-
      Doña Mercedes preguntaba a la persona correcta porque sabía que \textbf{una buena pregunta encuentra una buena respuesta}. Hoy es lo mismo: \emph{Google es el oráculo más grande del mundo, pero solo responde bien cuando preguntas bien}. Buscar mal te da basura aunque la información buena exista. Buscar bien te abre acceso a un universo. \emph{Saber buscar es saber pensar críticamente sobre la pregunta antes de la respuesta}.
    pregunta_espejo: |-
      ¿Estoy entrenado en preguntar bien o solo confío en que la primera respuesta sea la correcta?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Lo que cuesta 30 segundos pensar antes, ahorra 30 minutos buscar después.''
    aplicacion: |-
      Mucha gente \emph{pierde el tiempo} buscando en Google: navegando entre 50 resultados malos, leyendo páginas que no responden lo que necesitaban. \textbf{El truco no es velocidad: es pausa}. Pensar 30 segundos qué exactamente quieres y qué operador te puede ayudar. Esa pausa convierte 30 minutos de búsqueda en 30 segundos de hallazgo.
    pregunta_espejo: |-
      ¿Hago el ejercicio de pensar antes de buscar, o salto al teclado y espero suerte?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la información digital)"
    cita: |-
      ``En la era de internet, la habilidad escasa ya no es el acceso a la información, es saber filtrarla.''
    aplicacion: |-
      Tu abuela, para encontrar información sobre algo, tenía que ir a la \emph{biblioteca municipal} de Cartago, buscar el libro, leer. \emph{Acceso difícil, filtrado fácil} (solo había unos libros). Tú vives al revés: \textbf{acceso fácil, filtrado difícil} (hay miles de millones de páginas). \emph{Tu habilidad clave del siglo XXI es filtrar}. Aprender operadores es la primera dimensión de esa habilidad.
    pregunta_espejo: |-
      ¿Estoy desarrollando la habilidad de filtrar, o me ahogo en información sin criterio?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, cada vez que busques algo en Google, usa \emph{al menos un operador}. Tu cerebro lo va a interiorizar rápido. La próxima clase aprendes a \textbf{evaluar fuentes}: ¿cómo sabes si una página dice la verdad o miente? Es la otra cara de buscar bien: saber distinguir el oro del bronce. Hoy aprendiste a buscar; la próxima aprenderás a verificar.

web:
  conceptos_clave:
    - termino: Operador de búsqueda
      definicion: |-
        Símbolo o palabra que le dice al buscador algo específico sobre cómo buscar. Por ejemplo, comillas le dicen "busca frase exacta", el guion le dice "excluye esta palabra". Hay 6 operadores universales esenciales.
      ejemplo: |-
        Sin operador: "perros fiebre" te da resultados confusos. Con operador: "qué hacer si mi perro tiene fiebre" entre comillas te da páginas específicas.
      emoji: "🔍"
    - termino: Comillas (frase exacta)
      definicion: |-
        El operador más útil. Cuando pones una frase entre comillas, Google busca esas palabras EXACTAS y en ese orden. Sin comillas, busca cualquier página que mencione las palabras dispersas.
      ejemplo: |-
        "parque Bolívar Cartago" (con comillas) te da el parque específico. parque Bolívar Cartago (sin comillas) te da parques en varios países.
      emoji: "🔤"
    - termino: "site:"
      definicion: |-
        Operador que limita la búsqueda a un sitio web específico. Sirve para buscar dentro de Wikipedia, dentro de un sitio del gobierno, dentro del MinEducación, etc. Útil cuando quieres fuentes confiables.
      ejemplo: |-
        "site:es.wikipedia.org Bolívar" te da solo resultados de Wikipedia sobre Bolívar. Excluye todo lo demás. "site:gov.co" busca solo en sitios oficiales del gobierno colombiano.
      emoji: "🏠"
    - termino: "filetype:"
      definicion: |-
        Operador para buscar archivos de un tipo específico: PDF, Word, Excel, PowerPoint. Útil para tareas que necesitan documentos formales en lugar de páginas web.
      ejemplo: |-
        "himno nacional Colombia filetype:pdf" te da PDFs del himno con notas. "tabla periódica filetype:pdf" te da posters PDF imprimibles.
      emoji: "📄"
    - termino: Guion (-) para excluir
      definicion: |-
        El operador menos: pone guion delante de una palabra y la excluye de los resultados. Útil cuando una palabra ambigua mezcla 2 temas y solo te interesa uno.
      ejemplo: |-
        "arepas -venezolanas" te da arepas colombianas (paisas, costeñas) sin las venezolanas. "Bolívar -monumento" te da páginas sobre Bolívar pero no del monumento.
      emoji: "➖"

  quiz:
    titulo: "¿Sabes buscar bien en internet?"
    instrucciones: "5 preguntas para verificar que dominas los 6 operadores esenciales."
    preguntas:
      - enunciado: "Quieres encontrar la frase EXACTA 'parque del Bolívar Cartago'. ¿Cómo la buscas?"
        opciones:
          - "parque del Bolívar Cartago"
          - "'parque del Bolívar Cartago' (entre comillas)"
          - "parque Cartago Bolívar"
          - "Cartago parque"
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Las comillas le dicen a Google que busque las palabras EXACTAS en ese orden. Sin comillas, busca páginas con esas palabras sueltas.
        feedback_incorrecto: |-
          Las comillas son la magia. "parque del Bolívar Cartago" entre comillas busca exactamente esa frase. Sin comillas, resultados confusos.
      - enunciado: "Quieres buscar SOLO en Wikipedia sobre Colombia. ¿Cómo lo haces?"
        opciones:
          - "Wikipedia Colombia"
          - "site:es.wikipedia.org Colombia"
          - "Colombia Wikipedia.com"
          - "WIKIPEDIA Colombia"
        respuesta_index: 1
        feedback_correcto: |-
          Bien. site:es.wikipedia.org limita la búsqueda a ese dominio. Resultados solo de Wikipedia, excluye todo lo demás.
        feedback_incorrecto: |-
          site:es.wikipedia.org Colombia limita a Wikipedia. El operador "site:" + dominio te da resultados de ese sitio únicamente.
      - enunciado: "Necesitas un PDF del himno nacional. ¿Cómo buscas?"
        opciones:
          - "himno nacional"
          - "himno nacional Colombia filetype:pdf"
          - "imprime el himno"
          - "PDF de Colombia"
        respuesta_index: 1
        feedback_correcto: |-
          Sí. filetype:pdf le dice a Google que solo te muestre PDFs. Útil para tareas que necesitan documentos formales.
        feedback_incorrecto: |-
          filetype:pdf filtra solo archivos PDF. Útil para descargar documentos formales en lugar de páginas web.
      - enunciado: "Quieres recetas de arepas COLOMBIANAS pero te aparecen las VENEZOLANAS. ¿Cómo lo arreglas?"
        opciones:
          - "Buscar 'arepas' solo."
          - "Buscar 'arepas paisas' (con comillas) o 'arepas -venezolanas' (excluye)."
          - "Cambiar de buscador."
          - "Buscar en inglés."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El guion (-) excluye. "arepas -venezolanas" elimina los resultados venezolanos. O usar comillas con la palabra específica como "arepas paisas".
        feedback_incorrecto: |-
          Usa el guion para excluir: arepas -venezolanas. O sé específico con comillas: "arepas paisas". Los 2 trucos funcionan.
      - enunciado: "Buscas en Google y los primeros resultados son anuncios. ¿Qué haces?"
        opciones:
          - "Hago clic en el primero, debe ser el mejor."
          - "Bajo hasta los resultados orgánicos (los que no son anuncios). Los anuncios se marcan como 'Anuncio' o 'Patrocinado'."
          - "Reinicio el computador."
          - "Cambio a Bing."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Los primeros 2-4 resultados suelen ser anuncios (vienen marcados). Pasa de largo hasta los resultados orgánicos: esos son los más relevantes.
        feedback_incorrecto: |-
          Los primeros suelen ser anuncios pagados (marcados). Baja a los resultados orgánicos: los reales, los que Google encontró por relevancia, no por pago.

clave: "3-9"
grado: 6
periodo: 3
sesion: 9
completo: true

titulo: "Evaluar fuentes --- distinguir lo verdadero de lo inventado en internet"
titulo_portada: |-
  Evaluar
  fuentes ---
  distinguir
  lo verdadero
  de lo inventado

producto_final: |-
  Una \textbf{comparación de 3 fuentes} sobre un mismo tema (puede ser ``el volcán Nevado del Ruiz'', ``Simón Bolívar'', ``mi colegio''). Para cada fuente analizas con \textbf{los 5 criterios CRAAP}: \emph{Currency} (actualidad), \emph{Relevance} (relevancia), \emph{Authority} (autoridad), \emph{Accuracy} (exactitud), \emph{Purpose} (propósito). Por cada criterio das \emph{una nota de 0 a 5}. Al final declaras cuál fuente es la mejor y justificas con 3 razones. Más \textbf{en el cuaderno}: lista de 8 banderas rojas (warning signs) que indican que una fuente NO es confiable.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural de la vereda La Plata de Cartago decía: ``No todas las cartas dicen verdad.''} En los años 70, llegaban a la vereda \textbf{cartas con promesas extrañas}: \emph{``Pague 100 pesos y reciba 1.000''}, \emph{``Su familia ha ganado un terreno en La Guajira''}. Algunos campesinos, sin medios para verificar, caían en la trampa. Doña Mercedes les enseñaba \textbf{a desconfiar y verificar}: \emph{``¿Quién mandó la carta? ¿Tiene sello oficial? ¿Tiene nombre de remitente real? ¿Suena demasiado bueno para ser cierto? Si dudas, ve a la alcaldía y pregunta''}. Esa regla \emph{``verificar antes de creer''} salvó dinero y dignidad a muchas familias. Hoy en internet pasa lo mismo: \textbf{hay páginas que mienten, exageran, manipulan, o están vencidas}. Aprender a distinguir lo confiable de lo no confiable es la otra mitad de la alfabetización digital. Buscar bien (S8) te lleva a páginas. \textbf{Evaluar fuentes} te dice cuáles creer.

  saber_contemporaneo: |-
    \textbf{Evaluar una fuente} significa preguntarte si la página que estás leyendo dice información confiable. Los bibliotecarios universitarios crearon una herramienta llamada \textbf{CRAAP} (acrónimo en inglés) con \textbf{5 criterios}: \textbf{(1) Currency (Actualidad)}: ¿de cuándo es la información? Una página de 1995 sobre tecnología está vencida. \textbf{(2) Relevance (Relevancia)}: ¿es del nivel y tema que necesito? Una tesis universitaria no sirve para una tarea de 6° grado. \textbf{(3) Authority (Autoridad)}: ¿quién la escribió? ¿es experto en el tema? Un blog anónimo NO es lo mismo que el sitio del Ministerio. \textbf{(4) Accuracy (Exactitud)}: ¿tiene errores ortográficos, contradicciones, datos sin fuente? Cuanto más sólido, mejor. \textbf{(5) Purpose (Propósito)}: ¿por qué existe la página? ¿para informar, vender, convencer? Un sitio comercial puede sesgar la verdad. \textbf{Aplicar CRAAP toma 3 minutos por fuente}, y te ahorra horas de citar mentiras.

  pregunta_puente: |-
    Buscas \emph{``Simón Bolívar fechas''} en Google. Aparecen 3 resultados: \emph{(1) una página de Wikipedia con muchos detalles}, \emph{(2) un blog personal de un señor cualquiera con su opinión}, \emph{(3) un sitio del Ministerio de Educación de Colombia con cronología oficial}. ¿\textbf{En cuál confías más para tu tarea}? ¿Por qué? ¿La 1, la 2, la 3, o las 3?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 5 criterios CRAAP; (2) sabrás \textbf{aplicar} cada criterio a una fuente; (3) podrás \textbf{evaluar} 3 fuentes y elegir la mejor con justificación; (4) habrás \textbf{creado} una lista personal de 8 banderas rojas.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: aprendes los 5 criterios CRAAP, los aplicas a 3 fuentes sobre un tema, eliges la mejor con justificación, y armas tu lista de banderas rojas.
  a_escuta: |-
    Empezamos comparando 3 fuentes ficticias para reconocer la mejor.
  a_sistematizacion: |-
    Después aprendes los 5 criterios con preguntas concretas para aplicar.
  a_praxis: |-
    Con CRAAP claro, evalúas 3 fuentes reales sobre un tema que escojas.
  a_producto: |-
    El producto es la tabla de evaluación + lista de 8 banderas rojas + ganadora justificada.
  a_evaluacion: |-
    Antes de salir, verificas que cada fuente tiene los 5 criterios calificados de 0 a 5.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué dudar antes de creer es virtud, no debilidad.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 3 fuentes para escoger} (12 min · individual). Lee la descripción de estas 3 fuentes (ficticias pero típicas) sobre el tema \emph{``El volcán Nevado del Ruiz''}. \textbf{Fuente A:} Página de la \emph{Universidad Nacional de Colombia, departamento de Geología}, fecha 2024, con datos científicos y referencias a estudios. \textbf{Fuente B:} Blog personal de un señor llamado \emph{``Pedro74''}, año 2009, dice que el volcán \emph{``va a explotar pronto''} pero no cita estudios. Tiene errores ortográficos. \textbf{Fuente C:} Página de \emph{Wikipedia en español}, fecha 2023, con cronología completa, fuentes citadas al final, escrita por varios voluntarios. \textbf{En el cuaderno responde:} \emph{(1) ¿Cuál fuente usarías para tu tarea?} \emph{(2) ¿En qué orden las confías?} \emph{(3) ¿Por qué descartarías la B?}.

  checks:
  - Leí las 3 fuentes con calma.
  - Respondí las 3 preguntas con mi intuición.
  - Identifiqué cuál fuente es la menos confiable y por qué.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 3 fuentes sobre el Nevado del Ruiz». \textbf{Formato:} 3 respuestas cortas a las 3 preguntas. \textbf{Extensión:} 3 líneas. \textbf{Sabes que terminaste cuando} puedes explicar por qué confías más en una que en otra.

sistematizacion:
  intro: |-
    Tu intuición fue probablemente acertada. Ahora aprendes \textbf{el método CRAAP} para evaluar cualquier fuente en internet de manera sistemática.

  pilares:
  - |-
    \textbf{C --- Currency (Actualidad).} ¿De cuándo es la información? Para temas que cambian rápido (tecnología, salud, ciencia), \emph{menos de 3 años} es ideal. Para temas que no cambian mucho (historia, geografía básica), \emph{10 años está bien}. \textbf{Pregunta clave:} ¿está fechada? Si una página no tiene fecha, ya es una señal de duda. \textbf{R --- Relevance (Relevancia).} ¿La página responde a tu pregunta y a tu nivel? Una tesis universitaria sobre el volcán es \emph{válida pero compleja} para 6° grado. Una página infantil sobre el volcán es \emph{válida pero superficial}. La relevancia es nivelar.
  - |-
    \textbf{A --- Authority (Autoridad).} ¿Quién la escribió? ¿Tiene credibilidad en el tema? \emph{Mucho:} Universidades, museos, ministerios, periódicos serios, expertos con nombre y apellido. \emph{Poco:} Blogs personales anónimos, sitios sin información de quién los hace, redes sociales. \textbf{Pregunta clave:} ¿hay nombre y credenciales del autor? \textbf{A --- Accuracy (Exactitud).} ¿La información es verificable? ¿Hay fuentes citadas? ¿Otros sitios confiables dicen lo mismo? \emph{Sospechosa:} datos sin fuente, errores ortográficos, contradicciones, números muy redondos. \textbf{Pregunta clave:} ¿podría verificar al menos 1 dato en otro sitio?
  - |-
    \textbf{P --- Purpose (Propósito).} ¿Por qué existe la página? \emph{Sano:} para informar, para enseñar, para divulgar conocimiento. \emph{Sospechoso:} para vender, para asustar, para convencerte de algo, para hacerte hacer clic. Una página comercial puede mentir un poco para vender. Una página política puede sesgar para convencer. \textbf{Pregunta clave:} ¿quién gana algo si yo creo esto? Si la respuesta es \emph{``alguien gana dinero''} o \emph{``alguien gana votos''}, duda.
  - |-
    \textbf{Las 8 banderas rojas que indican que una fuente NO es confiable.} (1) \emph{Sin fecha visible}. (2) \emph{Sin autor o autor anónimo}. (3) \emph{Sin enlaces a fuentes o estudios}. (4) \emph{Errores ortográficos abundantes}. (5) \emph{Lenguaje exagerado:} \emph{``inmediato''}, \emph{``urgente''}, \emph{``increíble''}, \emph{``escándalo''}. (6) \emph{Imágenes sin pie ni atribución}. (7) \emph{Mucha publicidad o pop-ups}. (8) \emph{Pide pago o registro para leer información básica}. Si una página tiene 3+ banderas rojas, busca otra fuente.

  anatomia:
    titulo: CRAAP + 8 banderas rojas
    body: |-
      \textbf{C} - Currency: ¿fecha reciente? \\[1mm]
      \textbf{R} - Relevance: ¿nivel y tema apropiados? \\[1mm]
      \textbf{A} - Authority: ¿autor con credenciales? \\[1mm]
      \textbf{A} - Accuracy: ¿datos verificables? \\[1mm]
      \textbf{P} - Purpose: ¿para informar o para vender? \\[1mm]
      \textbf{8 banderas rojas:} sin fecha · sin autor · sin fuentes · errores · exageración · imágenes sin atribuir · mucha publicidad · pide pago.

  errores_comunes: |-
    \textbf{Errores frecuentes al evaluar fuentes.} (1) \emph{``El primer resultado de Google es el mejor''} --- Falso. Es solo el más popular. (2) \emph{``Wikipedia no se puede citar''} --- Discutible. Wikipedia es buen \emph{punto de partida}, no la fuente final. Cita la fuente original que Wikipedia menciona al final. (3) \emph{``Si una página es bonita, es confiable''} --- Falso. El diseño no garantiza la verdad. (4) \emph{``Si dice .gov o .edu, es 100\% confiable''} --- Probable pero no garantizado. Hasta los gobiernos cometen errores. (5) \emph{``Si está en inglés, es más serio''} --- Falso. Hay sitios en español muy confiables y sitios en inglés muy malos.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 5 criterios CRAAP + 8 banderas rojas». \textbf{Formato:} bloque A con los 5 criterios y su pregunta clave. Bloque B con la lista de 8 banderas rojas. \textbf{Extensión:} 5 + 8 líneas. \textbf{Sabes que terminaste cuando} podrías evaluar cualquier página en 3 minutos.

praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- 3 fuentes reales sobre un tema} (30 min · individual). Vas a tomar un tema y a buscar 3 fuentes sobre él (en clase si tienes computador, en casa si no). Después aplicas CRAAP a cada una y decides cuál es la mejor.

  pilares:
  - |-
    \textbf{Paso 1 --- Escoge el tema.} Algo que te interese investigar. Puede ser: \emph{el volcán Nevado del Ruiz}, \emph{Simón Bolívar}, \emph{cómo se hace una piñata}, \emph{el río Cauca}, \emph{tu colegio}, \emph{Cristiano Ronaldo}. Anota en el cuaderno: \emph{``Tema: ...''}.
  - |-
    \textbf{Paso 2 --- Busca 3 fuentes.} En Google (con los operadores de S8), busca tu tema. \textbf{Escoge 3 fuentes distintas:} ideal que sean tipos diferentes (una de Wikipedia, una de gobierno o universidad, una de blog o sitio comercial). Apunta el enlace o nombre. Si no tienes computador, usa las 3 fuentes ficticias del Actividad 1.
  - |-
    \textbf{Paso 3 --- Tabla de evaluación.} En el cuaderno, dibuja una tabla de \textbf{4 columnas y 7 filas}. Columnas: \emph{Criterio · Fuente A · Fuente B · Fuente C}. Filas: \emph{(1) Currency (0-5) · (2) Relevance · (3) Authority · (4) Accuracy · (5) Purpose · (6) TOTAL (suma) · (7) Banderas rojas que tiene}.
  - |-
    \textbf{Paso 4 --- Califica con CRAAP.} Para cada fuente, da \textbf{una nota de 0 a 5} en cada criterio. \emph{0 = falla total; 5 = excelente}. Suma los 5 criterios al final (total máximo 25). En la fila 7, anota qué banderas rojas detectaste (\emph{``sin fecha''}, \emph{``muchos anuncios''}, etc.).
  - |-
    \textbf{Paso 5 --- Identifica la ganadora.} La fuente con el total más alto es la \textbf{ganadora}. Pero también puedes elegir manualmente si una tuvo nota baja en \emph{Authority} (un blog cualquiera) aunque sumara bien en otros. Escribe debajo de la tabla: \emph{``Fuente ganadora: \_\_\_. Razones: (1)..., (2)..., (3)...''}.
  - |-
    \textbf{Paso 6 --- Lista personal de banderas rojas.} En la parte inferior, escribe \textbf{tu propia lista de 8 banderas rojas} (las que más te llamaron la atención). Pueden ser las que están en la guía o agregar otras tuyas. Firma con nombre y fecha. La lista te servirá para futuras búsquedas.

  checklist:
    titulo: Antes de mostrar tu evaluación
    items: |-
      \checkbox Anoté el tema y las 3 fuentes que evalué. \\[1mm]
      \checkbox La tabla tiene 4 columnas y 7 filas completas. \\[1mm]
      \checkbox Cada fuente tiene 5 notas (de 0 a 5) y su suma. \\[1mm]
      \checkbox Identifiqué banderas rojas en al menos 1 fuente. \\[1mm]
      \checkbox Declaré una fuente ganadora con 3 razones justificadas. \\[1mm]
      \checkbox Hice mi lista personal de 8 banderas rojas firmada.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Arriba:} tema + 3 fuentes nombradas. \textit{Tabla 4 × 7:} criterio + 3 fuentes evaluadas + total + banderas rojas. \textit{Debajo:} fuente ganadora + 3 razones. \textit{Final:} lista personal de 8 banderas rojas firmada.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} Título: «Actividad 3 --- Evaluación CRAAP de 3 fuentes». \textbf{Formato:} tabla 4x7 + fuente ganadora justificada + lista de 8 banderas rojas. \textbf{Extensión:} 1 página completa. \textbf{Sabes que terminaste cuando} podrías defender ante el profe por qué confías en una fuente y desconfías de otra.

  producto_titulo: Evaluación CRAAP de 3 fuentes + lista de 8 banderas rojas · firmada
  criterios:
  - Las 3 fuentes están identificadas con nombre y tipo.
  - La tabla CRAAP tiene los 5 criterios calificados de 0 a 5.
  - El TOTAL de cada fuente está calculado.
  - La fuente ganadora está justificada con 3 razones.
  - La lista de 8 banderas rojas es personal y firmada.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la crítica liberadora)"
    cita: |-
      ``Dudar antes de creer no es desconfianza enferma. Es respeto a la verdad.''
    aplicacion: |-
      Doña Mercedes enseñaba a los niños del campo a \textbf{dudar de las cartas extrañas} antes de creer. No era \emph{paranoia}: era \emph{cuidado}. Hoy en internet, \emph{quien no duda, miente sin saber}. Cita información falsa, repite mentiras, se convierte en cómplice de la desinformación. \emph{Dudar antes de creer es disciplina de ciudadano alfabetizado}. La pereza intelectual es el contrario.
    pregunta_espejo: |-
      ¿Estoy en la cómoda actitud de creer todo lo que leo, o tengo la disciplina de verificar antes?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Antes de afirmar, pregunta: ¿esto es cierto? Si no puedes responder, calla hasta saber.''
    aplicacion: |-
      \textbf{El estoico no repite lo que oyó sin verificar}. Si no sabe, calla; si verifica, afirma con seguridad. Aplicado a internet: \emph{no copio en mi tarea lo primero que veo}. Verifico al menos en 2 fuentes distintas. Si las 2 coinciden, la información es probable verdadera. Si una contradice a la otra, busco una tercera. Esa pequeña disciplina te ahorra entregar mentiras como tarea.
    pregunta_espejo: |-
      ¿Estoy entregando información que no he verificado, o me esfuerzo en confirmar antes de afirmar?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la desinformación)"
    cita: |-
      ``En la era de la información, el verdadero analfabetismo no es no saber leer. Es no saber distinguir lo verdadero de lo falso.''
    aplicacion: |-
      Tu abuela quizá no sabía usar Google, pero en su pueblo de Cartago sabía a quién creerle: a doña Mercedes, a don Lucho, no al pregonero exagerado. \emph{Sabía evaluar fuentes humanas}. Tú necesitas el mismo saber, pero en internet. \textbf{Ese saber es ya tan importante como saber leer}. Una sociedad sin evaluadores de fuentes está condenada a la mentira.
    pregunta_espejo: |-
      ¿Estoy formando criterio para evaluar fuentes o me estoy convirtiendo en repetidor pasivo de información?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, cada vez que veas una noticia o una afirmación sorprendente en internet, aplica CRAAP rápido (15 segundos en tu cabeza). Verás cuántas no pasan. La próxima sesión es la \textbf{cosecha del periodo (S10)}: vas a crear un \emph{documento informativo de 2 páginas} aplicando TODO lo aprendido: Word + listas + tabla + imágenes + encabezado/pie + búsqueda con operadores + evaluación de fuentes. Hoy aprendiste a verificar; la próxima clase produces algo con todo el oficio.

web:
  conceptos_clave:
    - termino: CRAAP
      definicion: |-
        Método de los bibliotecarios universitarios para evaluar la confiabilidad de una fuente en 5 criterios. Currency (actualidad), Relevance (relevancia), Authority (autoridad), Accuracy (exactitud), Purpose (propósito).
      ejemplo: |-
        Aplicas CRAAP a una página: ¿tiene fecha reciente? ¿es del nivel correcto? ¿quién la escribió? ¿tiene fuentes? ¿para qué existe? Si los 5 son positivos, es confiable.
      emoji: "✅"
    - termino: Currency (actualidad)
      definicion: |-
        Primer criterio de CRAAP: qué tan reciente es la información. Para temas que cambian rápido (tecnología, salud), menos de 3 años es ideal. Para temas que no cambian (historia básica), 10 años está bien.
      ejemplo: |-
        Una página de 1995 sobre celulares está vencida (los celulares de 2026 no existían). Pero una página de 1995 sobre la Independencia de Colombia sigue siendo válida.
      emoji: "📅"
    - termino: Authority (autoridad)
      definicion: |-
        Quién escribió la información y si tiene credibilidad en el tema. Universidades, museos, ministerios = mucha autoridad. Blogs personales anónimos = poca. La pregunta: ¿hay nombre y credenciales del autor?
      ejemplo: |-
        Un artículo del Ministerio de Educación sobre el currículo escolar = alta autoridad. Un blog de "Pedro74" sin información personal = baja.
      emoji: "🎓"
    - termino: Accuracy (exactitud)
      definicion: |-
        Si la información se puede verificar. Datos con fuente citada, sin errores ortográficos, sin contradicciones, confirmados por otros sitios confiables. La pregunta: ¿podría verificar al menos un dato en otro sitio?
      ejemplo: |-
        Wikipedia cita fuentes al final de cada artículo. Eso da exactidud. Un blog que dice "el volcán explotará pronto" sin fuente = baja exactitud.
      emoji: "🎯"
    - termino: Banderas rojas
      definicion: |-
        Señales que indican que una fuente probablemente NO es confiable. Las más comunes: sin fecha, sin autor, sin fuentes, errores ortográficos, lenguaje exagerado, mucha publicidad, pide pago.
      ejemplo: |-
        Una página que dice "ESCANDALO MUNDIAL!!!!" sin fecha ni autor, llena de pop-ups, con errores ortográficos = 4 banderas rojas. No la cites.
      emoji: "🚩"

  quiz:
    titulo: "¿Sabes evaluar fuentes en internet?"
    instrucciones: "5 preguntas para verificar que dominas CRAAP y las banderas rojas."
    preguntas:
      - enunciado: "Necesitas información sobre Simón Bolívar para una tarea. ¿Qué fuente es más confiable?"
        opciones:
          - "Un blog personal anónimo."
          - "La página del Ministerio de Educación o un libro de universidad."
          - "Un meme de Instagram."
          - "Un video aleatorio de TikTok."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Autoridad: gobierno o universidad tienen credibilidad académica. Blogs anónimos, memes y TikToks no son fuentes para tareas formales.
        feedback_incorrecto: |-
          Para tareas: Ministerio de Educación, universidades, museos. Blogs anónimos y redes sociales NO son fuentes académicas, aunque sean entretenidas.
      - enunciado: "Una página web NO tiene fecha visible. ¿Qué piensas?"
        opciones:
          - "Da igual, lo importante es el contenido."
          - "Es una bandera roja. Sin fecha no puedo saber si la información está actualizada."
          - "Es buena señal, eso significa que es eterna."
          - "Solo importa la fecha si es sobre tecnología."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Sin fecha = bandera roja. No sabes si es de 1995 o 2026. Para verificar la Currency de CRAAP, necesitas fecha visible.
        feedback_incorrecto: |-
          Sin fecha es bandera roja. No puedes evaluar Currency (actualidad). Las fuentes serias siempre fechan su contenido.
      - enunciado: "Lees una página que dice 'INCREÍBLE: ESCÁNDALO MUNDIAL!!!!' con muchos signos. ¿Qué señal es?"
        opciones:
          - "Es información seria por la urgencia."
          - "Bandera roja: lenguaje exagerado. Es estrategia para asustar, vender o ganar clics. Desconfía."
          - "Es buen periodismo."
          - "Solo es escándalo si tiene fotos."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El lenguaje exagerado (mayúsculas, signos, palabras emocionales) es señal de manipulación. Las fuentes serias usan tono neutral.
        feedback_incorrecto: |-
          Lenguaje exagerado = bandera roja. Las fuentes serias usan tono neutro. Cuando ves "INCREÍBLE!!!!", el propósito ya no es informar, es manipular.
      - enunciado: "Wikipedia, ¿es buena fuente para una tarea?"
        opciones:
          - "Sí, siempre."
          - "Sí como punto de partida; pero cita la fuente original que Wikipedia referencia al final."
          - "No, Wikipedia es mentira."
          - "Solo en inglés."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Wikipedia es buen mapa: encuentras el tema rápido y al final cita sus fuentes. Vas a esas fuentes originales y las citas en tu tarea. Wikipedia como punto de inicio, no como destino final.
        feedback_incorrecto: |-
          Wikipedia es buen punto de partida pero no fuente final. Al final del artículo hay referencias: ve a esas y úsalas como fuente. Wikipedia te orienta; las fuentes originales son las que citas.
      - enunciado: "Acabas de leer una afirmación impactante. ¿Qué deberías hacer antes de creerla?"
        opciones:
          - "Compartirla en redes sociales rapidísimo."
          - "Verificar en al menos otra fuente confiable. Si las 2 coinciden, probable verdadero. Si contradice, busca una 3a."
          - "Memorizar la información."
          - "Olvidarla."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La verificación cruzada es clave. Si 2 fuentes confiables coinciden, probable verdad. Si contradicen, busca una 3a o duda hasta verificar.
        feedback_incorrecto: |-
          Verificación cruzada: busca la misma info en otra fuente confiable. 2 que coinciden = probable verdad. Compartir sin verificar te hace cómplice de desinformación.

clave: "1-1"
grado: 7
periodo: 1
sesion: 1
completo: true

titulo: "Apertura periodo 1 --- vamos a hacer minga digital"
titulo_portada: |-
  Apertura
  periodo 1 ---
  la minga
  digital

producto_final: |-
  Tu \textbf{cuaderno inaugural de grado 7} listo para el periodo 1: portada con nombre + grado + año + materia; \textbf{índice del periodo 1} con las 10 sesiones del periodo; \textbf{compromiso firmado} con 5 acuerdos de trabajo colaborativo (responsabilidad, puntualidad, respeto, escucha, comunicación clara); \textbf{5 preguntas-radar} sobre trabajo colaborativo y la nube; y \textbf{una mini-investigación} en el cuaderno: \emph{``¿qué es una minga y por qué funcionaba en el campo?''} (puedes preguntar a tus papás o abuelos).

apertura:
  saber_ancestral: |-
    \textbf{Cuando un campesino del Valle del Cauca necesitaba cosechar 5 hectáreas de café, no lo hacía solo.} En las veredas alrededor de Cartago, antes de las máquinas grandes, existía \textbf{la minga} (o \emph{convite}, o \emph{mano de vuelta}, según la zona). El dueño del cafetal mandaba aviso a sus vecinos un sábado en la mañana. Llegaban \textbf{20 o 30 personas} con sus canastas. Cada uno se ubicaba en un surco. \textbf{Nadie estorbaba al otro.} Todos cosechaban al mismo tiempo, en partes distintas, pero trabajando \emph{en la misma obra}. Las mujeres preparaban almuerzo grande --- sancocho, arroz, plátano --- y al mediodía se sentaban todos juntos a comer. La minga terminaba en 1 día lo que una sola persona habría hecho en un mes. Y al siguiente sábado, los mismos vecinos iban a hacer minga en la finca del vecino que vino a la suya. \textbf{Esa idea --- muchos trabajando juntos en una sola obra, sin pelearse, organizados, con reciprocidad --- es exactamente lo que hoy llamamos ``trabajo colaborativo en la nube''}. Microsoft 365 y OneDrive son la minga digital. Lo nuevo es la herramienta; lo viejo es la sabiduría.

  saber_contemporaneo: |-
    Este periodo te enseña a \textbf{trabajar con otros en internet}, no por separado. Hasta ahora tus trabajos los hacías solo: abrías tu Word, escribías tu cosa, la entregabas. Pero \emph{en la universidad y en el trabajo se hace al revés}: equipos de personas trabajan al mismo tiempo en el mismo documento, sin chocar. Esto es posible gracias a la \textbf{nube} (\emph{cloud}) y a \textbf{Microsoft 365}: un paquete de aplicaciones (\emph{Word, Excel, PowerPoint, OneNote, Teams, Outlook, OneDrive}) que vive en internet y se comparte entre personas. \textbf{Tu colegio te da una cuenta institucional gratuita}: la usarás todo el año. Al final del periodo 1, sabrás compartir documentos, escribir en grupo, comentar el trabajo de otros, recuperar versiones anteriores, y entregar un mini-proyecto colaborativo con bitácora. Esas habilidades te las exigirán toda la vida.

  pregunta_puente: |-
    Si tu profe te pide hacer un trabajo de Sociales con 3 compañeros, y cada uno vive en una casa distinta, ¿\textbf{cómo lo harían}? ¿Cada uno hace su parte y se junta al final? ¿Hay una manera mejor donde los 4 trabajen al mismo tiempo sin verse?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 5 principios de la minga aplicados al trabajo digital; (2) sabrás \textbf{explicar} qué es Microsoft 365 y la nube; (3) podrás \textbf{aplicar} los 5 acuerdos del trabajo colaborativo; (4) habrás \textbf{creado} tu cuaderno inaugural firmado + investigación sobre la minga.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: descubres qué era la minga, conoces la ruta del periodo, firmas el compromiso colaborativo, y dejas el cuaderno listo.
  a_escuta: |-
    Empezamos imaginando una minga real con tus vecinos.
  a_sistematizacion: |-
    Después aprendes los 5 principios de la minga y los aplicamos al trabajo digital.
  a_praxis: |-
    Con los principios claros, organizas tu cuaderno y firmas el compromiso.
  a_producto: |-
    El producto es tu cuaderno inaugural + 5 preguntas + mini-investigación.
  a_evaluacion: |-
    Antes de salir, verifica que tu cuaderno tiene los 5 elementos completos.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué trabajar juntos es habilidad clave de la vida adulta.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Imagina la minga} (12 min · individual). Cierra los ojos y piensa en una minga real. \textbf{En el cuaderno responde:} \emph{(1) ¿Cuántas personas hay en la finca un día de minga?} \emph{(2) ¿Cómo se reparten el trabajo --- todos en lo mismo o cada uno en algo distinto?} \emph{(3) ¿Quién organiza?} \emph{(4) ¿Qué pasaría si 5 personas tratan de cosechar el mismo árbol al tiempo?} \emph{(5) ¿Cómo deciden cuándo descansar?} \emph{(6) ¿Qué pasa si alguien no llega o llega tarde?} \emph{(7) ¿Quién prepara el almuerzo?} \emph{(8) ¿Qué pasa al final del día?}. Respuesta con tu intuición. Si tienes abuelos o tíos que hayan vivido en el campo, te pueden contar más después. Esta intuición es la base del trabajo colaborativo digital de hoy.

  checks:
  - Cerré los ojos e imaginé la minga.
  - Respondí las 8 preguntas con mi intuición.
  - Pensé sin copiar al compañero.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Imagino la minga». \textbf{Formato:} 8 respuestas cortas. \textbf{Extensión:} 8 líneas. \textbf{Sabes que terminaste cuando} tus respuestas reflejan cómo funcionaría una minga real, no una versión imaginada.

sistematizacion:
  intro: |-
    De tus respuestas salen los \textbf{5 principios de la minga} que aplicamos al trabajo colaborativo digital. Estos principios son antiguos pero universales: funcionaban en 1920 en el café, funcionan en 2026 en Microsoft 365.

  pilares:
  - |-
    \textbf{Principio 1 --- División sin choque.} En la minga cada quien tomaba un surco distinto. Nadie cosechaba el mismo árbol que otro. \textbf{En coautoría digital es igual:} cada compañero escribe en su párrafo o sección, sin pisarse. Microsoft 365 te muestra dónde está escribiendo cada uno (su cursor aparece con su nombre). \textbf{Principio 2 --- Organización clara.} Alguien tenía que decir \emph{``ustedes 5 al surco de la izquierda, los otros 5 al de la derecha''}. Sin organización inicial, 30 personas se vuelven caos. \textbf{En digital:} antes de empezar a escribir en grupo, se acuerdan los roles (quién escribe qué, qué tiempos, qué entrega cada uno).
  - |-
    \textbf{Principio 3 --- Reciprocidad.} En la minga, el que recibía ayuda tenía que dar ayuda después. Nadie venía a una minga ajena sin pensar que después le tocaría devolver el favor. \textbf{En digital:} cuando 3 compañeros te ayudan a hacer tu trabajo, después tú vas y los ayudas en los suyos. No es competencia, es reciprocidad. \textbf{Principio 4 --- Comunicación constante.} Durante la minga la gente se hablaba: \emph{``Cuidado con esa rama''}, \emph{``Pase la canasta''}, \emph{``Vamos a almorzar''}. \textbf{En digital:} comentarios en el documento, mensajes en Teams, correos en Outlook. Si nadie comunica, el trabajo se rompe.
  - |-
    \textbf{Principio 5 --- Cierre y celebración.} La minga terminaba con almuerzo grande y conversación. Era importante: \emph{cerraba el día, agradecía el esfuerzo, sembraba el siguiente encuentro}. \textbf{En digital:} cuando un proyecto termina, hay que cerrarlo bien --- una bitácora, una entrega, un agradecimiento al equipo. Sin ese cierre, los proyectos se sienten incompletos. \textbf{Los 5 acuerdos del trabajo colaborativo (que firmarás).} (1) Responsabilidad: si me asignan algo, lo hago. (2) Puntualidad: si quedamos para una hora, llego. (3) Respeto: si discrepo, lo digo con cuidado. (4) Escucha: pongo atención a lo que dicen los demás. (5) Comunicación clara: digo lo que pienso sin esconderlo.
  - |-
    \textbf{La ruta del periodo 1 --- las 10 sesiones.} \emph{(S1) Hoy: Apertura --- la minga digital.} \emph{(S2) Microsoft 365 --- qué es la nube.} \emph{(S3) OneDrive --- mi nube personal.} \emph{(S4) Word, Excel y PowerPoint en línea.} \emph{(S5) Compartir y permisos.} \emph{(S6) Coautoría asincrónica.} \emph{(S7) Comentarios y sugerencias.} \emph{(S8) Versiones e historial.} \emph{(S9) Outlook y Teams.} \emph{(S10) Cosecha --- mi primer proyecto colaborativo}. Al final del periodo, tu equipo de 3 entrega un proyecto real hecho en la nube.

  anatomia:
    titulo: 5 principios de la minga + ruta P1
    body: |-
      \textbf{5 principios:} \\[1mm]
      \textbf{1.} División sin choque. \\[1mm]
      \textbf{2.} Organización clara. \\[1mm]
      \textbf{3.} Reciprocidad. \\[1mm]
      \textbf{4.} Comunicación constante. \\[1mm]
      \textbf{5.} Cierre y celebración. \\[1mm]
      \textbf{Ruta P1:} apertura → Microsoft 365 → OneDrive → Word/Excel/PPT → compartir → coautoría → comentarios → versiones → Outlook/Teams → cosecha.

  errores_comunes: |-
    \textbf{Errores frecuentes al iniciar el trabajo colaborativo.} (1) \emph{``Yo solo, mejor''} --- Falso. La universidad y el trabajo son colaborativos. Si no aprendes ahora, te cuesta después. (2) \emph{``Mejor que cada uno haga su parte y juntamos al final''} --- Es válido pero limitado: pierdes los beneficios de la coautoría. (3) \emph{``Los compañeros no responden, mejor lo hago todo yo''} --- Falso. Hablar con el grupo y reorganizar es la salida; trabajar de más por miedo a comunicar es el problema. (4) \emph{``En la nube se pierden los archivos''} --- Falso. Es al revés: la nube es la mejor protección contra perder. (5) \emph{``No necesito cuenta institucional, uso mi correo personal''} --- Falso. La cuenta institucional te da Office 365 gratis, espacio en OneDrive y respaldo. Aprovéchala.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 5 principios + ruta P1». \textbf{Formato:} bloque A con los 5 principios numerados y un ejemplo aplicado a digital de cada uno. Bloque B con la lista de 10 sesiones del periodo. \textbf{Extensión:} 15 líneas. \textbf{Sabes que terminaste cuando} podrías explicarle a tu mamá la idea de minga digital en 2 minutos.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Cuaderno inaugural + 5 preguntas-radar + investigación sobre la minga} (30 min · individual). Vas a dejar tu cuaderno listo para todo el periodo 1 y plantear las preguntas que esperas que se respondan.

  pilares:
  - |-
    \textbf{Paso 1 --- Portada del cuaderno de grado 7.} En la primera hoja escribe en grande: \textbf{``Cuaderno de Tecnología --- Grado 7''}. Nombre completo, grado y letra (7A, 7B, etc.), I.E. Sor María Juliana, año 2026. Decora a tu gusto pero que se lea claro desde 1 metro de distancia.
  - |-
    \textbf{Paso 2 --- Índice del periodo 1.} En la segunda hoja escribe el título: \textbf{``Índice --- Periodo 1: Trabajo colaborativo en la nube''}. Lista numerada de las 10 sesiones (S1 a S10) con sus títulos. Deja una columna a la derecha vacía para anotar la fecha cuando veas cada sesión.
  - |-
    \textbf{Paso 3 --- Compromiso del año (los 5 acuerdos).} En la tercera hoja escribe \textbf{``Mis 5 acuerdos del trabajo colaborativo''}. Reproduce los 5 acuerdos (responsabilidad, puntualidad, respeto, escucha, comunicación clara). Al lado de cada uno, palomita ✓ si te comprometes. Si dudas con alguno, conversa con el profe antes de firmar.
  - |-
    \textbf{Paso 4 --- Mis 5 preguntas-radar.} En la misma hoja, debajo de los acuerdos, escribe \textbf{``Mis 5 preguntas-radar del P1''} y una lista numerada de 5 preguntas tuyas. Sugerencias: \emph{``¿Cómo se comparte un archivo en OneDrive?''}, \emph{``¿Cómo evitamos que 3 personas borren lo que escribieron al tiempo?''}, \emph{``¿Qué hago si alguien del equipo no aporta?''}. Inventa tus propias 5.
  - |-
    \textbf{Paso 5 --- Mini-investigación sobre la minga.} En la cuarta hoja escribe \textbf{``Mini-investigación: ¿qué es una minga?''}. Esta tarea la haces parcial en clase y parcial en casa: pregunta a tus papás, abuelos, tíos o vecinos mayores si han visto una minga, en qué consistía, dónde, cuándo. Apunta sus respuestas con sus palabras. Si nadie te puede contar, busca en internet con criterio (aplica lo que aprendiste de buscar bien en G6·P3·S8). Mínimo \textbf{5 datos concretos}: lugar, fecha aproximada, tipo de trabajo, número de personas, comida.
  - |-
    \textbf{Paso 6 --- Sesión 1 y firma.} En el cuaderno principal escribe el encabezado de la sesión 1: \emph{``Guía: 7° · Periodo 1 · Guía 1 --- Apertura. Fecha: \_\_/\_\_/2026''}. Anota qué hiciste en las 3 actividades. Firma con nombre y fecha de hoy. La próxima clase entras al taller de la nube digital.

  checklist:
    titulo: Antes de cerrar la S1 del periodo 1 de grado 7
    items: |-
      \checkbox La portada tiene nombre, grado, año y materia legibles. \\[1mm]
      \checkbox El índice del periodo 1 está con 10 sesiones. \\[1mm]
      \checkbox Los 5 acuerdos colaborativos tienen firma. \\[1mm]
      \checkbox Tengo 5 preguntas-radar reales mías. \\[1mm]
      \checkbox La mini-investigación tiene mínimo 5 datos concretos. \\[1mm]
      \checkbox La sesión 1 tiene encabezado y registro de las 3 actividades.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Hoja 1:} portada. \textit{Hoja 2:} índice P1 (10 sesiones). \textit{Hoja 3:} 5 acuerdos colaborativos + 5 preguntas-radar. \textit{Hoja 4:} mini-investigación minga (5+ datos). \textit{Cuaderno principal:} sesión 1 con encabezado fijo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Cuaderno inaugural G7-P1». \textbf{Formato:} 4 hojas iniciales + sesión 1. \textbf{Extensión:} 4 hojas + registro de sesión. \textbf{Sabes que terminaste cuando} tu cuaderno está listo para empezar la S2 sin pérdida de tiempo.

  producto_titulo: Cuaderno inaugural G7·P1 + 5 acuerdos + 5 preguntas + investigación minga · firmado
  criterios:
  - Portada con datos legibles.
  - Índice del P1 con 10 sesiones.
  - 5 acuerdos firmados con palomita.
  - 5 preguntas-radar personales.
  - Mini-investigación con 5+ datos sobre la minga (de fuente humana o internet evaluada).

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del trabajo comunitario)"
    cita: |-
      ``Solo en comunidad somos plenamente humanos. El que cree que puede todo solo, todavía no ha entendido.''
    aplicacion: |-
      Hay una idea moderna de \textbf{individualismo} que dice: \emph{``si quieres algo, hazlo tú solo''}. Esa idea hace daño. Los grandes proyectos del mundo --- la independencia de Colombia, la construcción de Cartago, las cosechas del café, la pirámide de Egipto --- los hicieron \emph{equipos de personas}, no genios solitarios. Aprender a trabajar en equipo te quita la presión de \emph{``poder con todo''} y te abre el mundo de \emph{``poder con otros''}. La minga lo sabía. Microsoft 365 lo redescubrió. Tú aprendes esa sabiduría antigua con herramientas nuevas.
    pregunta_espejo: |-
      ¿Me he creído alguna vez la idea de que ``mejor solo''? ¿De dónde viene esa idea?

  estoico:
    autor: "Marco Aurelio (emperador que coordinaba imperios)"
    cita: |-
      ``El que sabe trabajar solo es bueno. El que sabe trabajar con otros es indispensable.''
    aplicacion: |-
      Marco Aurelio dirigía un imperio. \textbf{No podía hacer nada solo}: dependía de gobernadores, generales, escribanos, médicos, traductores. Aprendió a coordinar, a delegar, a comunicar. Esa habilidad lo hizo grande. Tu vida no será imperial, pero \emph{también vas a depender de equipos} --- en universidad, en trabajo, en tu propia familia. Aprender hoy a trabajar con otros es invertir en tu yo de 30 años.
    pregunta_espejo: |-
      ¿Estoy entrenándome para ser ``bueno solo'' o ``indispensable con otros''?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del trabajo digital)"
    cita: |-
      ``La nube no es magia: es la versión digital de algo que la humanidad ya hacía hace siglos --- compartir trabajo.''
    aplicacion: |-
      Cuando enciendes Microsoft 365 y entras a OneDrive, no estás haciendo algo radicalmente nuevo. Estás haciendo \textbf{una minga con tus compañeros de equipo}. La herramienta es nueva; la práctica es antigua. Reconocer esa continuidad te da \emph{paz}: no estás solo, ni eres la primera generación que enfrenta esto, ni la herramienta te define. Tú la usas para hacer lo que los humanos llevan haciendo siempre: trabajar juntos.
    pregunta_espejo: |-
      ¿Veo la nube como magia que me asusta, o como herramienta que sirve a una práctica antigua?

compromiso: |-
  \textbf{Para la próxima sesión.} Termina tu mini-investigación sobre la minga si te quedó pendiente (pregunta en casa). Trae tu cuaderno listo y la curiosidad encendida. La próxima clase es S2: \emph{Microsoft 365 --- qué es la nube}. Vas a conocer las 7-8 aplicaciones del paquete y a entender por qué se llama \emph{``la nube''}. Hoy te recibiste como aprendiz del oficio colaborativo; la próxima clase abrimos el taller digital.

web:
  conceptos_clave:
    - termino: Minga (o convite)
      definicion: |-
        Trabajo comunitario tradicional de las veredas del Valle del Cauca, el Pacífico y otras regiones de Colombia. Los vecinos se reunían a hacer una tarea grande en un día (cosechar café, levantar una casa, limpiar un camino). Reciprocidad: el que recibe ayuda devuelve después.
      ejemplo: |-
        Un cafetero del Valle hacía minga el sábado: 20 vecinos llegaban a cosechar su café en 1 día. Al sábado siguiente, esos 20 iban a hacer minga en la finca de otro vecino. Todos avanzaban.
      emoji: "🌾"
    - termino: Trabajo colaborativo
      definicion: |-
        Cuando varias personas trabajan al mismo tiempo en una misma obra, sin estorbarse, con roles definidos. Hoy se hace en la nube con herramientas como Microsoft 365. Es la versión digital de la minga.
      ejemplo: |-
        3 compañeros escriben al mismo tiempo en un documento Word en línea. Cada uno trabaja en una sección distinta. Ven los cursores de los demás. Avanzan 3 veces más rápido que solos.
      emoji: "👥"
    - termino: Nube (cloud)
      definicion: |-
        Espacio en internet donde se guardan archivos y se ejecutan programas. Los archivos no viven en tu computador: viven en servidores remotos (centros de datos). Tú accedes desde cualquier dispositivo con tu cuenta.
      ejemplo: |-
        Tu Word en línea no está en tu computador: está en los servidores de Microsoft. Si abres tu cuenta desde otro PC, tus archivos siguen ahí. Es como guardar tus cosas en una taquilla común.
      emoji: "☁️"
    - termino: Microsoft 365
      definicion: |-
        Paquete de aplicaciones de Microsoft en la nube. Incluye Word, Excel, PowerPoint, OneNote, Outlook, Teams, OneDrive y más. Tu colegio te da una cuenta institucional gratuita.
      ejemplo: |-
        Con tu cuenta institucional puedes abrir Word, Excel y PowerPoint en cualquier navegador, sin instalar nada. Todo se guarda en OneDrive automáticamente. Eso es Microsoft 365.
      emoji: "🔵"
    - termino: 5 acuerdos colaborativos
      definicion: |-
        Las 5 normas básicas para trabajar bien con otros: (1) responsabilidad, (2) puntualidad, (3) respeto, (4) escucha, (5) comunicación clara. Sin estos acuerdos, los equipos se rompen.
      ejemplo: |-
        Si quedaste de hacer la introducción del trabajo en grupo para el lunes, debes hacerla el lunes (responsabilidad y puntualidad). Si discrepas con un compañero, lo dices con respeto, no insultas.
      emoji: "🤝"

  quiz:
    titulo: "¿Llegaste bien al periodo 1 de grado 7?"
    instrucciones: "5 preguntas para verificar que entiendes la minga digital y los 5 acuerdos colaborativos."
    preguntas:
      - enunciado: "¿Por qué se compara Microsoft 365 con la minga tradicional?"
        opciones:
          - "Porque las dos son aburridas."
          - "Porque ambas permiten que muchas personas trabajen juntas en una misma obra sin estorbarse."
          - "Porque las dos usan internet."
          - "Porque las dos son colombianas."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La minga y Microsoft 365 comparten el principio: muchas personas trabajando en la misma obra al tiempo. Solo cambia la herramienta (canasta vs computador).
        feedback_incorrecto: |-
          Las dos permiten trabajo colectivo simultáneo en una misma obra. La minga era para café o construcción; Microsoft 365 es para documentos y proyectos.
      - enunciado: "Tu equipo de 3 va a escribir un trabajo en Word en línea. ¿Cómo se organizan según el principio 'división sin choque'?"
        opciones:
          - "Los 3 escriben en el mismo párrafo al tiempo, a ver qué sale."
          - "Cada uno toma una sección distinta del documento."
          - "Solo escribe uno; los otros 2 miran."
          - "Hacen 3 documentos separados y los pegan al final."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Cada uno en su sección, sin estorbarse. En la minga, cada quien tomaba un surco distinto del cafetal. En digital es igual.
        feedback_incorrecto: |-
          División sin choque: cada uno en su sección. Si todos en el mismo párrafo, se borran entre sí. Si uno solo, los demás aprenden de nada.
      - enunciado: "¿Cuál es el principio 'reciprocidad' aplicado al trabajo colaborativo digital?"
        opciones:
          - "Hacer todo solo para no deber favores."
          - "Si tus compañeros te ayudan en tu trabajo, después tú vas y los ayudas en los suyos."
          - "Pagar dinero por cada ayuda recibida."
          - "Solo recibir, no dar."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Reciprocidad: das y recibes con el tiempo. En la minga, lo que recibías el sábado lo devolvías el siguiente sábado. En digital también.
        feedback_incorrecto: |-
          Reciprocidad: el que recibe ayuda, devuelve ayuda. Sin reciprocidad, los equipos se rompen porque uno carga todo y los demás explotan.
      - enunciado: "Tu compañero no aporta al trabajo grupal. ¿Qué haces según los 5 acuerdos?"
        opciones:
          - "Hago yo todo, después le digo al profe que no aportó."
          - "Hablo con él con respeto, le digo qué necesito de su parte. Si no responde, hablo con el profe."
          - "Lo insulto en el chat del grupo."
          - "Ignoro la situación."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Comunicación clara con respeto. Primero le dices a él; si no responde, hablas con el profe. Hacer todo solo o callar son extremos malos.
        feedback_incorrecto: |-
          Comunicación clara con respeto. Hablar primero con el compañero, después con el profe si no funciona. Ni hacer todo solo ni callarse.
      - enunciado: "¿Cuántas sesiones tiene el periodo 1 de grado 7?"
        opciones:
          - "5 sesiones."
          - "10 sesiones (S1 a S10), siendo S10 la cosecha integradora."
          - "30 sesiones."
          - "Solo 1."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. 10 sesiones organizadas: apertura (S1), Microsoft 365 + OneDrive + apps (S2-S4), compartir + coautoría + comentarios + versiones (S5-S8), comunicación profesional (S9), y cosecha (S10).
        feedback_incorrecto: |-
          10 sesiones. Cada periodo tiene 10. La S1 es apertura, la S10 es cosecha integradora. Las del medio son contenido específico.

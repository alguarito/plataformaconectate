clave: "1-10"
grado: 7
periodo: 1
sesion: 10
completo: true

titulo: "Cosecha del periodo --- mi primer proyecto colaborativo"
titulo_portada: |-
  Cosecha
  del periodo ---
  mi primer
  proyecto
  colaborativo

producto_final: |-
  Un \textbf{mini-proyecto colaborativo en equipo de 3 estudiantes} integrando todo lo aprendido en P1. \textbf{Entregables:} \textbf{(a) Documento Word colaborativo} de 2 páginas con encabezado + 3 secciones (una por integrante) + fuentes citadas; \textbf{(b) hoja Excel} con un dato cuantitativo del tema (mínimo 5 filas con fórmula PROMEDIO o SUMA); \textbf{(c) Presentación PowerPoint de 5 diapositivas} que resume el proyecto; \textbf{(d) Bitácora colaborativa} (Word compartido) con 3 entradas (una por integrante) sobre el proceso del equipo; \textbf{(e) reunión Teams} programada para sustentación de 10 minutos al profe. Todo guardado en una carpeta compartida en OneDrive.

apertura:
  saber_ancestral: |-
    \textbf{El último día de la minga grande no se trabajaba: se celebraba.} En la finca cafetera del Valle del Cauca, cuando los 30 trabajadores terminaban de cosechar el último cafetal, el dueño no decía \emph{``ya, váyanse''}. Decía: \textbf{``vengan al patio, ya hay almuerzo''}. Las cocineras habían preparado durante el día un sancocho grande con gallina, arroz, plátano, yuca. Todos se sentaban juntos a la mesa larga. Mientras comían, conversaban: \emph{``vimos que don Pedro fue el más rápido''}, \emph{``este año la cosecha fue mejor que la del año pasado''}, \emph{``hay que invitar al primo Aurelio el próximo sábado''}. \textbf{Ese almuerzo no era solo comida: era el cierre formal de la minga}. Donde \emph{se reconocía el trabajo, se evaluaba lo aprendido, se preparaba la siguiente}. Sin ese cierre, la minga quedaba incompleta. Hoy tu equipo de 3 cierra el periodo con su propia \emph{``minga digital''}: un mini-proyecto que reúne todo lo aprendido en P1, presentado al profe, archivado en OneDrive.

  saber_contemporaneo: |-
    Esta es la \textbf{cosecha del periodo 1}. No es una sesión nueva de contenido: es la \emph{integración} de las 9 sesiones anteriores en un solo trabajo real. Tu equipo (los mismos 3 de S6, o uno nuevo si así lo deciden) produce un \textbf{mini-proyecto colaborativo} aplicando: \emph{(S2) Microsoft 365}, \emph{(S3) OneDrive con estructura de carpetas}, \emph{(S4) Word + Excel + PowerPoint}, \emph{(S5) compartir y permisos}, \emph{(S6) coautoría asincrónica}, \emph{(S7) comentarios y sugerencias}, \emph{(S8) versiones e historial}, \emph{(S9) Outlook y Teams}. El proyecto tiene tema libre pero debe ser \textbf{informativo} (no opinión): \emph{una región de Colombia, una tradición del Valle, una problemática social local, un avance científico, una figura admirable}. El criterio principal: que el equipo se haya organizado como minga --- con roles, tiempos, comunicación, reciprocidad. El profe evalúa tanto el producto final como el \emph{proceso}, leído en la bitácora colaborativa.

  pregunta_puente: |-
    Ahora que tu equipo va a hacer un proyecto colaborativo real (no de práctica), ¿\textbf{cómo se diferenciará} de los trabajos en grupo de años anteriores? ¿Qué hábitos nuevos van a usar?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{integrar} las 9 habilidades del periodo en un solo entregable; (2) sabrás \textbf{aplicar} el protocolo de equipo (roles + tiempos + comunicación); (3) podrás \textbf{evaluar} el proceso de tu equipo con bitácora; (4) habrás \textbf{entregado} el mini-proyecto al profe vía Outlook + reunión Teams.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: formas equipo y acuerdan tema, distribuyen roles, ejecutan los 5 entregables, sustentan al profe.
  a_escuta: |-
    Empezamos planificando: equipo + tema + acuerdos.
  a_sistematizacion: |-
    Después aprendes los 5 entregables y la rúbrica del proyecto.
  a_praxis: |-
    Con todo claro, ejecutan los 5 entregables en paralelo.
  a_producto: |-
    El producto es la carpeta compartida con los 5 entregables + reunión Teams al profe.
  a_evaluacion: |-
    Antes de sustentar, autoevalúan con la rúbrica de 10 criterios.
  a_triangulo: |-
    Cerramos con 3 voces sobre el oficio cumplido: la cosecha como rito.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Equipo + tema + acuerdos} (10 min · equipo). En el cuaderno, respondan EN EQUIPO: \emph{(1) ¿Quiénes son los 3 integrantes? (nombres + correo institucional)}. \emph{(2) ¿Cuál es el tema del proyecto? (escojan algo informativo: una región, una tradición, una problemática, una figura. Tema concreto y acotado.)}. \emph{(3) ¿Cuál es el subtema de cada integrante? (3 subtemas claros)}. \emph{(4) ¿Cuáles son las 3 fuentes principales que van a usar? (apliquen CRAAP de G6)}. \emph{(5) ¿Cuándo termina cada integrante su parte? (3 tiempos acordados).} \emph{(6) ¿Cómo se comunican durante el proyecto? (Teams, WhatsApp con cuidado, presencial?)}.

  checks:
  - El equipo de 3 está conformado.
  - El tema es informativo, no opinión, acotado.
  - Cada integrante tiene su subtema y tiempo acordados.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Acuerdo de proyecto P1». \textbf{Formato:} 6 respuestas en bloques. \textbf{Extensión:} 10-12 líneas. \textbf{Sabes que terminaste cuando} los 3 integrantes firman el acuerdo en sus respectivos cuadernos.

sistematizacion:
  intro: |-
    Ahora aprenden los \textbf{5 entregables} del proyecto y la rúbrica con la que el profe evaluará. Conocer la rúbrica desde el inicio te permite producir según los criterios.

  pilares:
  - |-
    \textbf{Entregable 1 --- Documento Word colaborativo (peso 30\%).} 2 páginas, 3 secciones (una por integrante), encabezado + pie + numeración, formato profesional, fuentes citadas al final. Aplica S3 (formato), S5 (tablas/imágenes), S6 (encabezados/pies) y S9 (evaluar fuentes) de G6 + S5 (compartir) y S6 (coautoría) de G7. \textbf{Entregable 2 --- Hoja Excel con dato cuantitativo (peso 15\%).} Mínimo 5 filas relacionadas con tu tema, encabezado en negrita, fórmula \texttt{=PROMEDIO()} o \texttt{=SUMA()} aplicada. Ejemplos según tema: cantidad de habitantes de 5 ciudades; cantidad de hectáreas cultivadas en 5 fincas; años de duración de 5 tradiciones; nacimientos por mes en una región.
  - |-
    \textbf{Entregable 3 --- PowerPoint de cierre (peso 15\%).} 5 diapositivas que resumen el proyecto. \emph{D1 portada}: título + 3 nombres + grado + fecha. \emph{D2 introducción}: tema + por qué importa. \emph{D3 desarrollo}: las 3 ideas principales. \emph{D4 datos}: el dato del Excel presentado visualmente (con gráfico si quieren). \emph{D5 cierre}: conclusión + agradecimientos. Diseño profesional con un tema aplicado. \textbf{Entregable 4 --- Bitácora colaborativa (peso 20\%).} Word compartido aparte. 3 entradas (una por integrante) con esta estructura cada una: \emph{(a) ¿Qué hice yo en el proyecto?}, \emph{(b) ¿Qué funcionó del equipo?}, \emph{(c) ¿Qué se complicó y cómo lo resolvimos?}, \emph{(d) ¿Qué haría diferente la próxima vez?}. La bitácora es lo que demuestra el proceso, no solo el producto.
  - |-
    \textbf{Entregable 5 --- Sustentación en Teams (peso 20\%).} Reunión programada con el profe de 10 minutos. Cada integrante habla 2-3 minutos sobre su sección. El profe puede hacer preguntas. Es ejercicio de hablar en público con apoyo de la PowerPoint. \emph{Atención}: TODOS los integrantes deben hablar; no se vale que uno solo presente.
  - |-
    \textbf{Rúbrica de 10 criterios del profe.} (1) Organización del equipo (roles claros desde el inicio). (2) Tema bien acotado y desarrollado. (3) Documento Word con formato profesional. (4) Excel con dato cuantitativo + fórmula aplicada. (5) PowerPoint con 5 diapositivas coherentes y diseño aplicado. (6) Fuentes citadas con criterio CRAAP. (7) Coautoría real (todos contribuyeron al Word). (8) Bitácora individual de cada integrante completa. (9) Sustentación con TODOS los integrantes hablando. (10) Carpeta OneDrive bien organizada con los 5 entregables. \emph{Total 100\%}. Cada criterio se evalúa de 1 a 5 (5 = excelente).

  anatomia:
    titulo: 5 entregables + rúbrica
    body: |-
      \textbf{5 entregables:} \\[1mm]
      \textbf{1.} Word colaborativo (30\%). \\[1mm]
      \textbf{2.} Excel con dato (15\%). \\[1mm]
      \textbf{3.} PowerPoint cierre (15\%). \\[1mm]
      \textbf{4.} Bitácora colaborativa (20\%). \\[1mm]
      \textbf{5.} Sustentación Teams (20\%). \\[1mm]
      \textbf{Total:} 100\% · evaluado en 10 criterios.

  errores_comunes: |-
    \textbf{Errores típicos en el proyecto integrador.} (1) \emph{No hacer acuerdo de roles claro al inicio} --- la minga se vuelve caos. (2) \emph{Un integrante hace todo y los otros 2 firman} --- 0 puntos para los que no aportaron, según rúbrica. (3) \emph{Olvidar la bitácora} --- es 20\% del peso, no es opcional. (4) \emph{Empezar PowerPoint antes que el Word} --- el Word es la base; PowerPoint resume el Word. (5) \emph{Buscar fuentes sin CRAAP} --- bajan los puntos del criterio 6. (6) \emph{Que un solo integrante sustente} --- baja el criterio 9. (7) \emph{No organizar la carpeta de OneDrive} --- baja el criterio 10. La organización cuenta.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 5 entregables + rúbrica de 10 criterios». \textbf{Formato:} bloque A con los 5 entregables (cada uno: descripción + peso). Bloque B con los 10 criterios. \textbf{Extensión:} 15 líneas. \textbf{Sabes que terminaste cuando} podrías evaluar el proyecto de otro equipo con la rúbrica solo mirando la hoja.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Ejecutar los 5 entregables} (1 sesión de 90 min + trabajo asíncrono durante la semana). Vas a ejecutar el mini-proyecto en equipo. Esta es la cosecha real. Pongan música, organícense, trabajen como minga digital.

  pilares:
  - |-
    \textbf{Paso 1 --- Carpeta compartida en OneDrive.} El integrante 1 (o quien se ofrezca) crea una carpeta en OneDrive: \texttt{2026-proyecto-P1-[tema]-equipo}. La comparte con los otros 2 integrantes y con el profe (con \emph{Puede editar} a integrantes y \emph{Puede ver} al profe inicialmente).
  - |-
    \textbf{Paso 2 --- Word colaborativo (40 min de trabajo distribuido).} Dentro de la carpeta, crear Word \texttt{2026-documento-principal}. \emph{Estructura:} encabezado en cada página + 3 secciones con sus 3 títulos. Cada integrante escribe SU sección. Aplican comentarios y sugerencias (S7) en las secciones de los compañeros (5 comentarios entre todos). Al final, revisión conjunta (S6: revisión conjunta) y aplicar cambios.
  - |-
    \textbf{Paso 3 --- Excel y PowerPoint (30 min).} Mientras trabajan en Word de manera asíncrona, uno o dos miembros pueden ir trabajando Excel y PowerPoint en paralelo. \emph{Excel:} \texttt{2026-datos-proyecto}. 5+ filas relacionadas con el tema. Encabezado en negrita. Fórmula PROMEDIO o SUMA en una celda. Si quieren, gráfico automático. \emph{PowerPoint:} \texttt{2026-presentacion}. 5 diapositivas con la estructura propuesta. Tema visual aplicado. Imagen de Pixabay.
  - |-
    \textbf{Paso 4 --- Bitácora colaborativa (15 min · individual).} Crear otro Word compartido: \texttt{2026-bitacora-equipo}. Cada integrante agrega SU entrada (no edita las de los otros). Cada entrada tiene los 4 puntos: \emph{qué hice}, \emph{qué funcionó}, \emph{qué se complicó}, \emph{qué haría diferente}. Sé honesto: la bitácora vale más por sinceridad que por edulcorar.
  - |-
    \textbf{Paso 5 --- Reunión Teams para sustentación (10 min · todo el equipo + profe).} Uno de los integrantes programa la reunión Teams. Invita a los otros 2 y al profe. Fecha y hora acordada. En la reunión: presenten la PowerPoint, cada uno hable 2-3 minutos sobre su sección. El profe puede hacer preguntas. \emph{Importante:} TODOS los integrantes participan activamente, no se vale que uno solo presente.
  - |-
    \textbf{Paso 6 --- Autoevaluación con rúbrica + entrega final.} Antes de la sustentación, el equipo abre la rúbrica de 10 criterios y se autoevalúa (1-5 en cada criterio). Si algún criterio quedó bajo, ajusten. Después de la sustentación, marquen el proyecto como entregado: envíen correo final desde Outlook al profe con: \emph{(a) link a la carpeta compartida}, \emph{(b) autoevaluación del equipo}, \emph{(c) agradecimientos breves}. Firma. Termina la cosecha.

  checklist:
    titulo: Antes de cerrar el periodo 1 de grado 7
    items: |-
      \checkbox Carpeta compartida en OneDrive con los 5 entregables. \\[1mm]
      \checkbox Word colaborativo con 3 secciones (una por integrante). \\[1mm]
      \checkbox Excel con 5+ filas + fórmula aplicada. \\[1mm]
      \checkbox PowerPoint de 5 diapositivas con tema visual. \\[1mm]
      \checkbox Bitácora colaborativa con 3 entradas individuales sinceras. \\[1mm]
      \checkbox Sustentación Teams realizada con todos los integrantes hablando. \\[1mm]
      \checkbox Correo final de entrega al profe con autoevaluación.

  plantilla_guion: |-
    \textbf{Estructura del proyecto.} \textit{Paso 1:} carpeta compartida. \textit{Paso 2:} Word colaborativo (3 secciones + comentarios + revisión). \textit{Paso 3:} Excel + PowerPoint en paralelo. \textit{Paso 4:} bitácora colaborativa con 3 entradas. \textit{Paso 5:} reunión Teams con profe. \textit{Paso 6:} autoevaluación + correo final.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi cosecha del periodo 1». \textbf{Formato:} datos del equipo + listado de los 5 entregables con su ubicación en OneDrive + autoevaluación con rúbrica + bitácora individual de 4 puntos. \textbf{Extensión:} 1-1.5 páginas. \textbf{Sabes que terminaste cuando} tu equipo entregó los 5 entregables Y sustentó ante el profe.

  producto_titulo: Proyecto colaborativo P1 · 5 entregables + sustentación · firmado y entregado al profe
  criterios:
  - Los 5 entregables están en la carpeta compartida de OneDrive.
  - El Word integra coautoría real (las 3 secciones se notan distintas pero coherentes).
  - El Excel tiene fórmula PROMEDIO o SUMA aplicada y propagada.
  - El PowerPoint tiene 5 diapositivas con tema visual y los 3 integrantes mencionados.
  - La bitácora colaborativa tiene 3 entradas con los 4 puntos cada una.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del cumplimiento colectivo)"
    cita: |-
      ``Lo que se completa con otros pesa más que lo que se completa solo. La obra colectiva nos hace más humanos.''
    aplicacion: |-
      Acabaste tu primer proyecto colaborativo digital. \textbf{No fue trivial}: requirió organización, comunicación, coautoría, reciprocidad. \emph{Esa es la misma forma en que se hacen los grandes proyectos del mundo}: Wikipedia, Linux, las series de Netflix, los reportajes de El Tiempo. Aprender a hacer un mini-proyecto colaborativo en 7° grado te conecta con esa tradición de obra colectiva. \emph{Te conviertes en aprendiz del oficio de hacer cosas juntos}. Esa habilidad será central toda tu vida adulta.
    pregunta_espejo: |-
      ¿Cómo me sentí trabajando con otros en esta minga digital? ¿Más sólido o más débil que trabajando solo?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Termina lo que empezaste. La obra cumplida da paz; la obra inconclusa pesa siempre.''
    aplicacion: |-
      Hoy cierras un periodo: \textbf{empezaste en S1 con la apertura, terminaste en S10 con la cosecha}. Las 9 sesiones intermedias fueron piezas; la cosecha integra. \emph{Cerrar bien lo que empezaste es disciplina del oficio adulto}. No es solo entregar el proyecto: es \emph{cerrarlo bien}, con bitácora, autoevaluación, sustentación. Ese ritual de cierre te entrena en cumplir hasta el final.
    pregunta_espejo: |-
      ¿Estoy cerrando los proyectos completos o los dejo a medias por costumbre?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del trabajo digital integrado)"
    cita: |-
      ``El primer proyecto colaborativo digital es un rito de paso. Después de él, ya no piensas igual la tecnología.''
    aplicacion: |-
      Antes de este proyecto, Microsoft 365 era un paquete de apps sueltas. \emph{Después de este proyecto}, lo ves como \textbf{una infraestructura integrada para producir trabajo en equipo}. Esa transformación de mirada es valiosa: \emph{ya no eres usuario aislado, eres miembro de un equipo digital}. Esa identidad te servirá en universidad, en trabajo, en proyectos sociales, durante décadas. Hoy fue tu rito de paso.
    pregunta_espejo: |-
      ¿Cómo cambió mi forma de ver Microsoft 365 después de hacer mi primer proyecto colaborativo?

compromiso: |-
  \textbf{Para la siguiente sesión.} La S11 cierra formalmente el periodo: autoevaluación con rúbrica visible, examen integrador, mirada al periodo 2. Hoy cerraste con tu equipo. La siguiente cierras formalmente como estudiante individual. Trae el cuaderno con la bitácora completa, las reflexiones del año hasta ahora, y la mirada lista hacia el P2 (Algoritmia y pensamiento computacional).

web:
  conceptos_clave:
    - termino: Proyecto colaborativo
      definicion: |-
        Trabajo de equipo que integra múltiples habilidades en un solo entregable. Se diferencia de tareas individuales porque requiere organización, distribución de roles, comunicación y reciprocidad. Es la forma adulta de producir en universidad y trabajo.
      ejemplo: |-
        Wikipedia es proyecto colaborativo mundial. Tu mini-proyecto P1 con 2 compañeros es la versión escolar: misma lógica de organización + roles + entrega final.
      emoji: "🚀"
    - termino: 5 entregables del proyecto
      definicion: |-
        Los 5 productos del mini-proyecto P1: (1) Word colaborativo, (2) Excel con dato, (3) PowerPoint resumen, (4) Bitácora colaborativa, (5) Sustentación Teams. Cada uno con peso específico en la rúbrica.
      ejemplo: |-
        Word: 30%. Excel: 15%. PowerPoint: 15%. Bitácora: 20%. Sustentación: 20%. Total: 100%. La bitácora pesa tanto como la sustentación: el proceso importa.
      emoji: "📦"
    - termino: Bitácora colaborativa
      definicion: |-
        Documento donde cada integrante registra su proceso individual en el proyecto: qué hizo, qué funcionó, qué se complicó, qué haría diferente. Es lo que demuestra el proceso (no solo el producto).
      ejemplo: |-
        Cada integrante escribe SU entrada en el mismo Word compartido. Las 3 entradas juntas forman la bitácora del equipo. El profe la lee para entender cómo trabajaron, no solo qué entregaron.
      emoji: "📓"
    - termino: Sustentación virtual
      definicion: |-
        Presentación oral del proyecto vía reunión Teams. El equipo presenta su trabajo al profe usando el PowerPoint. Cada integrante habla de su sección. El profe puede preguntar. Es ejercicio profesional clave.
      ejemplo: |-
        Reunión Teams 10 minutos: cada uno habla 2-3 min. Se comparte pantalla con el PowerPoint. El profe pregunta. Es como una mini-defensa de tesis para 7° grado.
      emoji: "🎤"
    - termino: Rúbrica de 10 criterios
      definicion: |-
        Los 10 criterios con los que el profe evalúa el proyecto, cada uno calificado de 1 a 5. Cubre organización, calidad de entregables individuales y trabajo en equipo. Conocerla desde el inicio permite producir según los criterios.
      ejemplo: |-
        Criterio 7: 'Coautoría real (todos contribuyeron al Word)' = 5 si los 3 escribieron secciones distintas; 1 si uno solo hizo todo. Conocerlo te incentiva a distribuir el trabajo.
      emoji: "📋"

  quiz:
    titulo: "¿Tu cosecha del periodo 1 quedó bien?"
    instrucciones: "5 preguntas para verificar que tu equipo entregó completo según la rúbrica."
    preguntas:
      - enunciado: "¿Cuáles son los 5 entregables del proyecto?"
        opciones:
          - "Solo el Word."
          - "Word + Excel + PowerPoint + Bitácora colaborativa + Sustentación Teams."
          - "Solo PowerPoint."
          - "Word + PDF."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Los 5 entregables son interdependientes: Word es la base, Excel da datos, PowerPoint resume, bitácora documenta proceso, sustentación demuestra al profe.
        feedback_incorrecto: |-
          5 entregables: Word, Excel, PowerPoint, Bitácora, Sustentación. Cada uno tiene peso. Faltar 1 baja drásticamente la nota del equipo.
      - enunciado: "Un integrante hizo todo y los otros 2 firman. ¿Qué nota saca el equipo según la rúbrica?"
        opciones:
          - "100% (entregaron a tiempo)."
          - "Mala: los criterios de organización, coautoría real y sustentación bajan mucho. Los que no aportaron sacan menos puntos."
          - "Es la misma para todos siempre."
          - "Depende del clima."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. La rúbrica evalúa coautoría real y participación individual. Si uno solo hizo todo, los criterios 1 (organización), 7 (coautoría) y 9 (todos sustenten) bajan.
        feedback_incorrecto: |-
          La rúbrica detecta cuando uno solo hizo todo. Criterios 1, 7 y 9 bajan. Los que no aportaron sacan menos en su nota individual. Por eso conviene distribuir bien.
      - enunciado: "¿Por qué importa la bitácora colaborativa (20% del peso)?"
        opciones:
          - "Es relleno."
          - "Demuestra el proceso del equipo: cómo se organizaron, qué se complicó, qué aprendieron. No solo el producto sino el cómo."
          - "Es opcional."
          - "Solo importa el producto final."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La bitácora cuenta el proceso. Un producto perfecto sin bitácora oculta cómo se hizo; una bitácora sincera muestra el aprendizaje real del equipo.
        feedback_incorrecto: |-
          Bitácora = proceso, no solo producto. Es 20% porque el profe quiere saber cómo trabajaron, no solo qué entregaron. El aprendizaje está en el proceso.
      - enunciado: "En la sustentación Teams, ¿quién debe hablar?"
        opciones:
          - "Solo el líder del equipo."
          - "Todos los integrantes, 2-3 minutos cada uno sobre su sección."
          - "El profe."
          - "Nadie, solo se muestra el PowerPoint."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Todos los integrantes hablan de su sección. El profe quiere ver que cada uno domina lo suyo. Si uno solo presenta, baja el criterio 9.
        feedback_incorrecto: |-
          Todos los integrantes deben hablar. Cada uno presenta su sección. Si uno solo presenta, los otros 2 no demostraron dominio y baja la nota colectiva.
      - enunciado: "Tu equipo terminó el proyecto. ¿Qué hacen ANTES de mandar el correo final al profe?"
        opciones:
          - "Nada, simplemente mandan."
          - "Autoevalúan con la rúbrica de 10 criterios y ajustan los puntos débiles si es posible."
          - "Borran la carpeta de OneDrive."
          - "Cambian todos los nombres de archivos."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Autoevaluación previa con rúbrica te da oportunidad de corregir antes de entregar. El profe valora que el equipo conozca sus puntos débiles y los haya intentado mejorar.
        feedback_incorrecto: |-
          Autoevaluación con rúbrica antes de entregar. Si un criterio quedó débil, ajustan si es posible. Entregar conociendo las debilidades es señal de madurez del equipo.

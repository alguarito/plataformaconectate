clave: "1-2"
grado: 7
periodo: 1
sesion: 2
completo: true

titulo: "Microsoft 365 --- conocer las herramientas del taller digital"
titulo_portada: |-
  Microsoft
  365 ---
  las herramientas
  del taller
  digital

producto_final: |-
  Un \textbf{mapa de las 8 aplicaciones principales de Microsoft 365} dibujado en una hoja del cuaderno, organizadas en \textbf{3 grupos}: \emph{(a) Documentos} (Word, Excel, PowerPoint, OneNote); \emph{(b) Comunicación} (Outlook, Teams); \emph{(c) Almacenamiento + más} (OneDrive, Forms). Cada app: \textbf{ícono dibujado, nombre, qué hace en 1 línea, ejemplo concreto de uso}. Más \textbf{una tabla comparativa} Microsoft 365 vs Google Workspace (Drive, Docs, Gmail, Meet) en 5 puntos.

apertura:
  saber_ancestral: |-
    \textbf{Cuando llegabas a una minga grande en el campo de Cartago, lo primero era reconocer las herramientas.} En la finca cafetera del Valle del Cauca, alguien organizaba las herramientas de la minga al inicio: \textbf{canastas} para recoger el café, \textbf{lonas} para tender el grano al sol, \textbf{calabozos} (machetes pequeños) para podar, \textbf{ollas grandes} para la comida, \textbf{cucharas de madera} para servir, \textbf{cántaros} para llevar agua. Cada herramienta tenía su uso: \emph{canasta no servía para podar, machete no servía para servir sopa}. Doña Mercedes la maestra rural enseñaba a los niños que iban por primera vez: \emph{``Mire bien cada herramienta. Sepa cuál es cuál. No agarre cualquiera. La minga funciona si cada quien sabe qué herramienta usar''}. Hoy en tu taller digital pasa lo mismo: Microsoft 365 te ofrece \textbf{8 herramientas principales}. Cada una tiene su uso. Conocerlas todas te hace eficiente; usar la equivocada te complica el trabajo.

  saber_contemporaneo: |-
    \textbf{Microsoft 365} (antes llamado \emph{Office 365}) es un \textbf{paquete de aplicaciones} que Microsoft ofrece en la nube. \textbf{Tu colegio tiene licencia institucional}: te da una cuenta gratis con \texttt{tunombre@sormariajuliana.edu.co} (o similar) que abre las 8 aplicaciones desde cualquier dispositivo con internet. Las \textbf{8 aplicaciones principales} se agrupan en 3 familias. \textbf{Familia 1 (Documentos):} \emph{Word} (escribir), \emph{Excel} (cálculos y tablas), \emph{PowerPoint} (presentaciones), \emph{OneNote} (cuaderno digital). \textbf{Familia 2 (Comunicación):} \emph{Outlook} (correo), \emph{Teams} (chat, llamada, videollamada, reuniones). \textbf{Familia 3 (Almacenamiento + más):} \emph{OneDrive} (la nube donde se guardan tus archivos), \emph{Forms} (para crear encuestas y quizzes). Conocer las 8 y \textbf{cuándo usar cada una} te ahorra horas de mes y te hace eficiente como pocos compañeros lo serán.

  pregunta_puente: |-
    Si tu profe te pide \emph{``hacer una encuesta a 30 compañeros sobre qué materia les gusta más, recoger las respuestas en una tabla con gráficos, y presentarla a la clase''}, ¿\textbf{qué aplicación usarías para cada paso}? ¿Sabrías escogerlas o usarías Word para todo?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} las 8 aplicaciones principales de Microsoft 365; (2) sabrás \textbf{explicar} qué hace cada una con 1 ejemplo concreto; (3) podrás \textbf{aplicar} la app correcta a 5 tareas reales; (4) habrás \textbf{comparado} Microsoft 365 con Google Workspace en 5 puntos.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas las 8 apps, las agrupas en 3 familias, comparas con Google Workspace, y armas tu mapa visual.
  a_escuta: |-
    Empezamos con un test: ¿qué app usarías para 6 tareas distintas?
  a_sistematizacion: |-
    Después aprendes el nombre y función de las 8 apps, agrupadas en 3 familias.
  a_praxis: |-
    Con todo claro, dibujas tu mapa de las 8 apps y la tabla comparativa.
  a_producto: |-
    El producto es ese mapa + tabla comparativa firmados.
  a_evaluacion: |-
    Antes de salir, verifica que cada app tiene su ícono, nombre, función y ejemplo.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué conocer las herramientas es la primera ventaja.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- ¿Qué app usarías?} (10 min · individual). En el cuaderno, lee estas 6 tareas y escribe qué aplicación usarías para cada una (puedes adivinar; no se vale ver la sistematización). \textbf{Tarea 1:} Escribir un ensayo de 3 páginas sobre la independencia. \textbf{Tarea 2:} Crear una hoja con calificaciones de 30 estudiantes y calcular el promedio. \textbf{Tarea 3:} Hacer 20 diapositivas para una presentación oral. \textbf{Tarea 4:} Mandar correo formal al coordinador. \textbf{Tarea 5:} Reunión virtual con 5 compañeros para hacer trabajo en grupo. \textbf{Tarea 6:} Encuesta a toda la clase sobre cuál es la materia favorita.

  checks:
  - Leí las 6 tareas con calma.
  - Escribí mi intuición de qué app usar en cada una.
  - No me ayudé del compañero ni vi la sistematización.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 6 tareas y su app». \textbf{Formato:} lista numerada del 1 al 6 con tarea + app intuida. \textbf{Extensión:} 6 líneas. \textbf{Sabes que terminaste cuando} tienes una propuesta para cada una de las 6 tareas.

sistematizacion:
  intro: |-
    Tu intuición te dio una idea. Ahora aprende las \textbf{8 aplicaciones principales} con sus familias, sus funciones y sus ejemplos exactos. Después podrás corregir tu primera Actividad si te equivocaste.

  pilares:
  - |-
    \textbf{Familia 1 --- Documentos (4 apps).} \textbf{Word}: escribir textos largos (ensayos, informes, cartas). Es el que ya conoces. \emph{Ícono: una W azul.} \textbf{Excel}: hacer cálculos y tablas con números. Ideal para presupuestos, calificaciones, listas con datos. \emph{Ícono: una X verde.} \textbf{PowerPoint}: hacer presentaciones con diapositivas. Útil para exponer un tema con apoyo visual. \emph{Ícono: una P naranja.} \textbf{OneNote}: cuaderno digital. Te permite tomar apuntes con texto, dibujos, imágenes, audios, todo en un solo lugar. \emph{Ícono: una N morada.}
  - |-
    \textbf{Familia 2 --- Comunicación (2 apps).} \textbf{Outlook}: correo electrónico institucional. Lo usas para enviar mensajes formales a profesores, coordinadores, padres. Tiene calendario integrado. \emph{Ícono: un sobre azul.} \textbf{Teams}: comunicación en tiempo real. Combina chat (como WhatsApp pero profesional), llamadas, videollamadas, reuniones de grupo, compartir pantalla. Si tu equipo va a hacer reunión virtual, usa Teams. \emph{Ícono: una T azul-morada.}
  - |-
    \textbf{Familia 3 --- Almacenamiento + más (2 apps).} \textbf{OneDrive}: la nube donde se guardan TODOS tus archivos. Cuando creas un Word o Excel en línea, va directo a OneDrive. Lo aprenderás en S3. \emph{Ícono: una nube azul.} \textbf{Forms}: para crear encuestas y quizzes. Recoge las respuestas automáticamente. Útil para investigaciones de aula. \emph{Ícono: un cuadro con líneas verdes/grises.}
  - |-
    \textbf{Comparación Microsoft 365 vs Google Workspace.} Google también tiene su paquete: \emph{Docs} (= Word), \emph{Sheets} (= Excel), \emph{Slides} (= PowerPoint), \emph{Gmail} (= Outlook), \emph{Meet} (= Teams), \emph{Drive} (= OneDrive), \emph{Forms} (igual). \textbf{Diferencias:} \emph{Microsoft 365} suele tener \emph{más funciones profesionales}; \emph{Google Workspace} es \emph{más simple e intuitivo}, ideal para empezar. Ambos funcionan en la nube y permiten coautoría. \textbf{Pista:} aprender uno te facilita el otro, los conceptos son los mismos.

  anatomia:
    titulo: 8 apps en 3 familias + atajos Google
    body: |-
      \textbf{Familia 1 (Documentos):} Word · Excel · PowerPoint · OneNote. \\[1mm]
      \textbf{Familia 2 (Comunicación):} Outlook · Teams. \\[1mm]
      \textbf{Familia 3 (Almacenamiento+):} OneDrive · Forms. \\[1mm]
      \textbf{Equivalentes Google:} Docs · Sheets · Slides · (Keep) · Gmail · Meet · Drive · Forms.

  errores_comunes: |-
    \textbf{Errores frecuentes al elegir app.} (1) \emph{Usar Word para todo} --- incluso para tablas con cálculos. Mal: usa Excel. (2) \emph{Hacer una presentación en Word con saltos de página} --- Mal: usa PowerPoint, está hecho para eso. (3) \emph{Mandar correo formal por WhatsApp} --- los correos profesionales van por Outlook, no por chat informal. (4) \emph{Hacer reunión virtual por WhatsApp con audio amateur} --- Teams o Google Meet hacen videollamada con compartir pantalla. (5) \emph{Hacer encuesta a mano y pasar resultados a Excel después} --- Forms recoge automáticamente, ahorrando horas.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 8 apps + 3 familias». \textbf{Formato:} tabla de 8 filas y 3 columnas. Columnas: \emph{App}, \emph{Familia}, \emph{Qué hace + ejemplo}. \textbf{Extensión:} 8 filas. \textbf{Sabes que terminaste cuando} podrías recomendarle la app correcta a un primo que te pregunte qué usar para una tarea.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Mapa de Microsoft 365 + comparación con Google} (28 min · individual). Vas a hacer en una hoja del cuaderno un \textbf{mapa visual} de las 8 apps en 3 familias, más una \textbf{tabla comparativa} de Microsoft 365 vs Google Workspace.

  pilares:
  - |-
    \textbf{Paso 1 --- Título y formato.} En la parte superior escribe: \textbf{``Mi mapa de Microsoft 365''}. Subraya. Pon la hoja en formato apaisado (horizontal) si puedes, para tener más espacio lateral.
  - |-
    \textbf{Paso 2 --- Las 3 familias dibujadas.} Divide la hoja en \textbf{3 columnas verticales}. Encabezados: \emph{(1) DOCUMENTOS}, \emph{(2) COMUNICACIÓN}, \emph{(3) ALMACENAMIENTO + MÁS}. En la columna 1 dibuja 4 íconos (Word, Excel, PowerPoint, OneNote) en columna; en la 2 dibuja 2 íconos (Outlook, Teams); en la 3 dibuja 2 íconos (OneDrive, Forms).
  - |-
    \textbf{Paso 3 --- Para cada app, 3 datos.} Debajo o al lado de cada ícono escribe: \emph{nombre} (Word, etc.), \emph{qué hace en 1 línea}, \emph{1 ejemplo de uso} (\emph{``Escribir tarea de historia''}, \emph{``Calificaciones de 30''}, etc.). Sé conciso: no narres, solo datos.
  - |-
    \textbf{Paso 4 --- Tabla comparativa Microsoft 365 vs Google Workspace.} En la parte inferior de la hoja (o en otra hoja si te queda poco espacio), dibuja una tabla de \textbf{5 filas y 3 columnas}. Columnas: \emph{Función}, \emph{Microsoft 365}, \emph{Google Workspace}. Filas: \emph{(1) Escribir documentos --- Word vs Docs}; \emph{(2) Cálculos en tabla --- Excel vs Sheets}; \emph{(3) Presentaciones --- PowerPoint vs Slides}; \emph{(4) Correo --- Outlook vs Gmail}; \emph{(5) Reuniones virtuales --- Teams vs Meet}.
  - |-
    \textbf{Paso 5 --- Correcciones a la Actividad 1.} Vuelve a tu lista de Actividad 1 (las 6 tareas). Ahora con la sistematización en mente, corrige las que hayas adivinado mal. \textbf{Respuestas correctas:} 1=Word, 2=Excel, 3=PowerPoint, 4=Outlook, 5=Teams, 6=Forms. Marca con palomita las que tenías bien y con corrección las que tenías mal. Aprender de los errores te entrena.
  - |-
    \textbf{Paso 6 --- Reflexión y firma.} En la parte inferior, escribe en 2 líneas: \emph{``La app que más voy a usar este año es \_\_\_ porque \_\_\_''}. Firma con nombre y fecha. La hoja del mapa la guardas pegada en el cuaderno o como anexo, te servirá toda la vida.

  checklist:
    titulo: Antes de mostrar tu mapa
    items: |-
      \checkbox El mapa tiene las 3 familias en columnas. \\[1mm]
      \checkbox Las 8 apps tienen ícono dibujado, nombre, función y ejemplo. \\[1mm]
      \checkbox La tabla comparativa Microsoft 365 vs Google tiene 5 filas. \\[1mm]
      \checkbox Las 6 tareas de la Actividad 1 están corregidas. \\[1mm]
      \checkbox La reflexión personal está en 2 líneas. \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Arriba:} título + nombre. \textit{Centro:} 3 columnas (familias) con 4+2+2 íconos. Cada ícono: nombre, función, ejemplo. \textit{Abajo:} tabla comparativa 5x3. \textit{Final:} corrección Actividad 1 + reflexión 2 líneas + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi mapa de Microsoft 365». \textbf{Formato:} mapa con 3 columnas + tabla comparativa + reflexión. \textbf{Extensión:} 1 hoja completa. \textbf{Sabes que terminaste cuando} podrías abrir la hoja en cualquier momento y reconocer qué hace cada app sin abrir el computador.

  producto_titulo: Mapa de Microsoft 365 con 3 familias + tabla vs Google · firmado
  criterios:
  - El mapa tiene las 8 apps en 3 familias correctamente agrupadas.
  - Cada app tiene ícono, nombre, función y ejemplo.
  - La tabla comparativa Microsoft 365 vs Google está completa.
  - Las correcciones de la Actividad 1 están hechas.
  - El mapa está firmado.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del oficio)"
    cita: |-
      ``Quien conoce las herramientas, manda; quien no las conoce, obedece a quien sí.''
    aplicacion: |-
      Hoy hay personas que viven en el siglo XXI \textbf{sin conocer las herramientas digitales básicas}. Hacen su trabajo a mano, mandan documentos en papel, hacen reuniones presenciales para todo. \emph{No están mal, pero pierden tiempo}. Aprender las 8 apps de Microsoft 365 (o sus equivalentes Google) te coloca en el grupo de los que \emph{eligen} sus herramientas, no de los que dependen de que alguien más decida. Es alfabetización del siglo XXI.
    pregunta_espejo: |-
      ¿Estoy aprendiendo las herramientas que me darán libertad en mi vida adulta?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Cada herramienta tiene su uso. Forzarla a otro le quita eficacia y dignidad. Conoce primero su naturaleza.''
    aplicacion: |-
      Usar Word para hacer una tabla con cálculos es como usar un martillo para apretar tornillos: funciona mal y daña la herramienta. Cada app de Microsoft 365 tiene un uso para el que está diseñada. \textbf{Aprender ese uso es respetar la herramienta}, y a la vez ahorrarse problemas. Es disciplina de profesional, no perfeccionismo.
    pregunta_espejo: |-
      ¿Estoy usando cada herramienta para lo que sirve, o forzando una a hacer trabajo de otra?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la era digital)"
    cita: |-
      ``El paquete de herramientas que dominas define qué decisiones puedes tomar. Más herramientas, más libertad.''
    aplicacion: |-
      Si solo conoces Word, vas a hacer todo en Word. Si conoces las 8 apps, \textbf{eliges la mejor para cada situación}. Esa elección te da \emph{ventaja sobre quien no las conoce}: más rápido, mejor resultado, menos esfuerzo. \emph{Más herramientas en tu caja = más libertad para escoger}. Por eso vale la pena la inversión inicial de aprender las 8.
    pregunta_espejo: |-
      ¿Qué app del paquete me da más curiosidad? ¿Por qué no me animo a explorarla?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, abre Microsoft 365 en tu cuenta institucional (\texttt{office.com}) y \emph{solo mira} las 8 aplicaciones disponibles. No tienes que crear nada todavía. Solo familiarizarse. La próxima clase activamos \textbf{OneDrive}, tu nube personal, y comenzamos a guardar archivos en ella.

web:
  conceptos_clave:
    - termino: Microsoft 365
      definicion: |-
        Paquete de aplicaciones en la nube de Microsoft. Incluye Word, Excel, PowerPoint, OneNote, Outlook, Teams, OneDrive y Forms. Los colegios tienen licencia gratis para estudiantes. Es la suite más usada en empresas y universidades.
      ejemplo: |-
        Tu cuenta institucional te da acceso gratis a todas estas apps en office.com. Inicias sesión con tu correo del colegio y tienes el paquete completo desde cualquier computador.
      emoji: "🔵"
    - termino: Familia Documentos
      definicion: |-
        Las 4 apps para crear y editar documentos: Word (textos), Excel (tablas y cálculos), PowerPoint (presentaciones), OneNote (cuaderno digital). Cada una tiene un propósito específico.
      ejemplo: |-
        Para una tarea de Sociales escrita usas Word. Para calcular el promedio de la clase usas Excel. Para presentar oralmente usas PowerPoint. Para tomar apuntes durante el año usas OneNote.
      emoji: "📄"
    - termino: Familia Comunicación
      definicion: |-
        Las 2 apps para comunicarse con otros: Outlook (correo formal con calendario) y Teams (chat profesional + videollamadas + reuniones). Reemplazan al WhatsApp en contextos académicos y de trabajo.
      ejemplo: |-
        Para escribir al coordinador del colegio usas Outlook. Para hacer reunión virtual con tu equipo de 4 compañeros usas Teams (con cámara, micrófono, pantalla compartida).
      emoji: "💬"
    - termino: OneDrive
      definicion: |-
        La nube personal de Microsoft. Es como un disco duro pero en internet: tus archivos viven ahí y los abres desde cualquier dispositivo con tu cuenta. La cuenta institucional te da espacio gratis (suele ser 1 TB).
      ejemplo: |-
        Cuando creas un Word en línea, automáticamente se guarda en tu OneDrive. Si abres office.com en otro PC y entras con tu cuenta, ese Word sigue ahí.
      emoji: "☁️"
    - termino: Google Workspace
      definicion: |-
        La alternativa de Google a Microsoft 365. Incluye Docs (= Word), Sheets (= Excel), Slides (= PowerPoint), Gmail (= Outlook), Meet (= Teams), Drive (= OneDrive). Similar funcionalidad, distinto proveedor.
      ejemplo: |-
        Algunos colegios usan Google Workspace en lugar de Microsoft. La lógica es la misma, los nombres cambian. Si conoces uno, aprendes el otro en 1 semana.
      emoji: "🟢"

  quiz:
    titulo: "¿Conoces las herramientas de Microsoft 365?"
    instrucciones: "5 preguntas para verificar que sabes cuándo usar cada app del paquete."
    preguntas:
      - enunciado: "Vas a hacer una presentación oral de 15 diapositivas para Sociales. ¿Qué app usas?"
        opciones:
          - "Word con saltos de página."
          - "PowerPoint."
          - "Excel con celdas grandes."
          - "Outlook."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. PowerPoint está diseñado para diapositivas con texto, imágenes, transiciones, notas del orador. Word podría servir pero no tiene las herramientas específicas.
        feedback_incorrecto: |-
          PowerPoint es la app de presentaciones. Word es para textos largos; Excel para cálculos; Outlook para correo. Cada herramienta para su uso.
      - enunciado: "Vas a calcular el promedio de calificaciones de 30 compañeros. ¿Qué app?"
        opciones:
          - "Word."
          - "OneNote."
          - "Teams."
          - "Excel."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. Excel tiene fórmulas (=PROMEDIO()) que hacen el cálculo automático. Word no tiene cálculos automáticos; OneNote tampoco.
        feedback_incorrecto: |-
          Excel: fórmulas + tablas + gráficos. =PROMEDIO(A1:A30) te da el promedio en 1 segundo. Word puede hacer tabla pero sin cálculos automáticos.
      - enunciado: "Tu equipo necesita reunión virtual con cámara y compartir pantalla. ¿Qué app?"
        opciones:
          - "WhatsApp."
          - "Outlook."
          - "Teams."
          - "Word."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Teams es la app de Microsoft para reuniones virtuales: video, audio, compartir pantalla, chat, grabación. Mucho mejor que WhatsApp para uso académico/profesional.
        feedback_incorrecto: |-
          Teams es la app de reuniones virtuales en Microsoft 365. Tiene video, audio, pantalla compartida, chat, grabación. WhatsApp es informal, no profesional.
      - enunciado: "Quieres hacer una encuesta a los 30 compañeros de la clase. ¿Qué app?"
        opciones:
          - "Forms."
          - "Word."
          - "Excel."
          - "PowerPoint."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. Forms hace encuestas en línea, recoge respuestas automáticamente, te las muestra en gráfico. En 30 minutos lo que en papel tomaría 2 horas.
        feedback_incorrecto: |-
          Forms: encuestas online + gráficos automáticos. Cada compañero responde por celular, las respuestas llegan a Forms y se grafican solas.
      - enunciado: "¿Cuál es el equivalente de OneDrive en Google Workspace?"
        opciones:
          - "Gmail."
          - "Meet."
          - "Drive."
          - "Docs."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Google Drive es el equivalente de OneDrive: ambos son nubes para guardar archivos. Los conceptos son los mismos, cambia solo el proveedor.
        feedback_incorrecto: |-
          Google Drive = OneDrive (ambos son nubes). Gmail = Outlook (correo), Meet = Teams (reuniones), Docs = Word (texto). Equivalentes funcionales.

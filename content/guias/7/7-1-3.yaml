    Hoy haces 4 cosas: comparas nube vs disco duro, activas OneDrive, creas la estructura, subes archivos.
  a_escuta: |-
    Empezamos con un caso real: ¿qué pasa si se daña tu computador?
  a_sistematizacion: |-

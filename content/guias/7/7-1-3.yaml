escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 4 casos de pérdida de archivos} (12 min · individual). Lee estos 4 casos reales (cosas que pasan todos los días) y en el cuaderno responde: \emph{¿qué habría salvado a esa persona?}. \textbf{Caso 1:} A Lucía se le rompió el disco duro del computador la noche antes de entregar su trabajo final. Lo había hecho solo en local, no tenía copia en otro lado. \textbf{Caso 2:} A Pedro le robaron el computador. Junto al equipo se fue todo el archivo de fotos familiares de los últimos 5 años. \textbf{Caso 3:} A María se le cayó café sobre el portátil. Funciona el computador pero el disco no abre. \textbf{Caso 4:} A David se le perdió la memoria USB con la tesis de grado. Era la única copia.

  checks:
  - Leí los 4 casos con calma.
  - Identifiqué qué habría salvado a cada persona.
  - Pensé en tu propio escenario: '¿qué haría yo si me pasara?'

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 4 casos de pérdida». \textbf{Formato:} 4 respuestas cortas. \textbf{Extensión:} 4 líneas. \textbf{Sabes que terminaste cuando} reconoces el patrón común: la nube habría salvado a los 4.

sistematizacion:
  intro: |-
    Los 4 casos comparten un mismo error: \textbf{no había copia en la nube}. Ahora aprendes qué es OneDrive y cómo te protege de esos escenarios.

  pilares:
  - |-
    \textbf{Qué es OneDrive técnicamente.} OneDrive es el \textbf{servicio de almacenamiento en la nube de Microsoft}. Cuando guardas un archivo en OneDrive, en realidad lo estás guardando en \textbf{servidores de Microsoft} (en centros de datos en Estados Unidos, Europa o Asia). Tu computador local mantiene solo una \emph{copia sincronizada}. Si pierdes el computador, los archivos siguen ahí. Si abres tu cuenta desde otro PC, ahí están. Es como tener un \textbf{cuarto de telas que existe simultáneamente en tu casa y en una bodega segura lejos}.
  - |-
    \textbf{Las 5 ventajas decisivas de OneDrive.} \textbf{(1) Acceso multidispositivo:} entras desde computador del colegio, computador de casa, celular, tableta. Mismos archivos siempre. \textbf{(2) Backup automático:} aunque borres tu disco duro, los archivos siguen vivos en la nube. \textbf{(3) Coautoría:} varias personas editan al mismo Word, Excel o PowerPoint a la vez (lo verás en S6). \textbf{(4) Historial de versiones:} OneDrive guarda automáticamente cada versión. Si dañas un documento, puedes restaurar la versión de ayer (lo verás en S8). \textbf{(5) Compartir fácil:} en lugar de mandar el archivo, mandas un enlace. El otro abre desde su computador sin descargar (lo verás en S5).
  - |-
    \textbf{Cómo activar OneDrive (paso a paso real).} \textbf{Opción A (en el navegador):} entra a \texttt{office.com}, inicia sesión con tu cuenta institucional (\texttt{tunombre@sormariajuliana.edu.co}). Aparece la página principal. Haz clic en el ícono de \emph{OneDrive} (nube azul). Ya estás dentro. \textbf{Opción B (instalando en el computador):} descarga \emph{OneDrive desktop} desde Microsoft. Te crea una carpeta especial en tu PC que se sincroniza automáticamente con la nube. Lo que pones en esa carpeta sube solo. \textbf{Recomendación inicial:} usa Opción A (navegador) este semestre. La B requiere más espacio en disco.
  - |-
    \textbf{La estructura de carpetas para grado 7.} Aplica el principio del árbol jerárquico de G6·P2·S7. Estructura recomendada en OneDrive: \textbf{Mis-documentos} (raíz) → \emph{Colegio} → \emph{Tecnologia}, \emph{Matematicas}, \emph{Sociales} (cada materia con sus periodos) → \emph{Periodo-1}, \emph{Periodo-2}, \emph{Periodo-3}. Y carpetas paralelas: \emph{Personal}, \emph{Imagenes}, \emph{Descargas}. \textbf{Aplica las 5 reglas de nombrado:} sin espacios (usa guion), sin acentos, claro, con fecha si aplica, pensando en tu yo del próximo año.

  anatomia:
    titulo: 5 ventajas + activación + estructura
    body: |-
      \textbf{5 ventajas:} acceso multidispositivo · backup auto · coautoría · historial · compartir fácil. \\[1mm]
      \textbf{Activación:} office.com → iniciar sesión institucional → ícono OneDrive. \\[1mm]
      \textbf{Estructura:} Mis-documentos → Colegio → Materias → Periodos.

  errores_comunes: |-
    \textbf{Errores frecuentes al iniciar con OneDrive.} (1) \emph{No activar la cuenta el primer día} --- te toca hacerlo en momento de presión después. Hazlo ya. (2) \emph{Crear todas las carpetas al ras (sin jerarquía)} --- en un mes vas a tener 30 carpetas planas, sin orden. Mejor árbol desde el inicio. (3) \emph{Usar acentos y espacios} --- las URLs de los archivos compartidos se enredan. Sin acentos, sin espacios. (4) \emph{Subir archivos pesados sin pensar} --- ten en cuenta el espacio (1 TB suena mucho pero se llena con videos). (5) \emph{Olvidar la contraseña institucional} --- escríbela en lugar seguro. Sin contraseña, no entras.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- OneDrive: las 5 ventajas». \textbf{Formato:} tabla de 5 filas, 2 columnas. Columna 1: nombre de la ventaja. Columna 2: ejemplo concreto de cómo te ayuda. \textbf{Extensión:} 5 filas. \textbf{Sabes que terminaste cuando} podrías convencer a tu mamá de empezar a usar OneDrive con 3 razones.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- OneDrive activo + 6 carpetas + 2 archivos} (30 min · individual). Vas a activar tu OneDrive (si no estaba) y crear la estructura de carpetas + subir 2 archivos. Si no tienes computador en clase, planificas en cuaderno y ejecutas en casa esta semana.

  pilares:
  - |-
    \textbf{Paso 1 --- Entra a OneDrive.} Abre el navegador (Chrome, Edge). Escribe \texttt{office.com} en la barra. Inicia sesión con tu cuenta institucional (correo \texttt{...@sormariajuliana.edu.co} + contraseña). Si te pide cambiar la contraseña, hazlo (mínimo 8 caracteres, mayúsculas, números, signo --- igual a G6·P1·S3). Haz clic en el ícono de OneDrive (nube azul).
  - |-
    \textbf{Paso 2 --- Crea la carpeta raíz \emph{Mis-documentos}.} Dentro de OneDrive, haz clic en \texttt{Nuevo → Carpeta}. Nómbrala \texttt{Mis-documentos} (sin acentos, sin espacios). Entra en ella.
  - |-
    \textbf{Paso 3 --- Crea las 4 subcarpetas (nivel 2).} Dentro de \texttt{Mis-documentos}, crea 4 carpetas: \texttt{Colegio}, \texttt{Personal}, \texttt{Imagenes}, \texttt{Descargas}. Estás en el nivel 2 del árbol.
  - |-
    \textbf{Paso 4 --- Subcarpetas de \emph{Colegio}.} Entra a \texttt{Colegio}. Crea: \texttt{Tecnologia} (sin acento, sin ñ). Entra. Adentro de \texttt{Tecnologia} crea: \texttt{Periodo-1}, \texttt{Periodo-2}, \texttt{Periodo-3}. Ya tienes el árbol completo de Tecnología. Puedes hacer lo mismo para otras materias si quieres (Matematicas, Sociales).
  - |-
    \textbf{Paso 5 --- Sube 2 archivos.} Vuelve a \texttt{Tecnologia/Periodo-1}. Haz clic en \texttt{Cargar → Archivos}. Selecciona 2 archivos cualquiera que tengas en tu computador (un Word, un PDF, una imagen, lo que sea). Espera a que terminen de subir (verás una barra de progreso). Ya están en la nube.
  - |-
    \textbf{Paso 6 --- Verifica + dibujo + reflexión.} Cierra el navegador. Abre el celular (o vuelve a abrir desde otro computador) en \texttt{office.com}, inicia sesión, abre OneDrive: deberías ver la misma estructura y los 2 archivos. Si lo ves, ¡felicitaciones, ya estás en la nube! En el cuaderno haz un dibujo de tu árbol de carpetas (similar al de G6·P2·S7) y escribe la reflexión: \emph{``Hoy mi OneDrive quedó organizado con [X carpetas] y [Y archivos]. La ventaja que más voy a aprovechar es \_\_\_''}.

  checklist:
    titulo: Antes de cerrar la S3
    items: |-
      \checkbox Activé mi OneDrive entrando a office.com. \\[1mm]
      \checkbox Creé la carpeta raíz Mis-documentos. \\[1mm]
      \checkbox Creé 4 subcarpetas de nivel 2 (Colegio, Personal, etc.). \\[1mm]
      \checkbox Dentro de Colegio creé Tecnologia con 3 periodos. \\[1mm]
      \checkbox Subí al menos 2 archivos a una carpeta correcta. \\[1mm]
      \checkbox Verifiqué desde otro dispositivo que se ven los archivos.

  plantilla_guion: |-
    \textbf{Estructura objetivo.} \textit{Raíz:} Mis-documentos. \textit{Nivel 2:} Colegio + Personal + Imagenes + Descargas. \textit{Nivel 3 (dentro de Colegio):} Tecnologia con Periodo-1, Periodo-2, Periodo-3. \textit{Archivos:} 2 subidos a Tecnologia/Periodo-1.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi OneDrive activo». \textbf{Formato:} dibujo del árbol + reflexión personal de 2 líneas + lista de archivos subidos. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} puedes abrir OneDrive desde cualquier dispositivo y ver tu estructura intacta.

  producto_titulo: OneDrive activado con estructura de 6 carpetas + 2 archivos · firmado
  criterios:
  - OneDrive está activo con cuenta institucional.
  - Existe la carpeta raíz Mis-documentos.
  - Hay al menos 4 subcarpetas de nivel 2.
  - Dentro de Colegio existe Tecnologia con sus 3 periodos.
  - Hay 2+ archivos subidos a la carpeta correcta.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del territorio propio)"
    cita: |-
      ``Tener tu propio espacio --- físico o digital --- es la primera forma de soberanía.''
    aplicacion: |-
      Hasta antes de OneDrive, tus archivos vivían \emph{en el computador del colegio} o \emph{en la USB que prestabas a un amigo} o \emph{en un Drive ajeno}. \textbf{No tenías un espacio propio}. Con OneDrive institucional, tienes tu \emph{cuarto de archivos digital}: 1 TB de espacio que es tuyo, organizado por ti, protegido por tu contraseña. Eso es soberanía digital --- el equivalente del cuarto propio que tenía doña Carmen en su casa.
    pregunta_espejo: |-
      ¿Estoy aprovechando mi espacio propio o sigo dejando mis archivos dispersos?

  estoico:
    autor: "Marco Aurelio (emperador que valoraba la disciplina del orden)"
    cita: |-
      ``Lo que está ordenado por fuera ahorra el desorden interior. El espacio organizado da paz a la mente.''
    aplicacion: |-
      Cuando entres a OneDrive y veas tu árbol de carpetas bien organizado, vas a sentir algo: \textbf{paz}. No tienes que pensar dónde guardar las cosas, dónde buscarlas, qué se perdió. \emph{El orden externo libera tu atención interna} para concentrarte en aprender. Es la diferencia entre estudiar en una mesa limpia y estudiar en una mesa con 50 cosas encima.
    pregunta_espejo: |-
      ¿Cuánta energía mental ahorraría si tuviera mi mundo digital ordenado?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la era de la nube)"
    cita: |-
      ``La nube no te da más espacio. Te da más libertad para llevar tu espacio a donde vayas.''
    aplicacion: |-
      Antes, para acceder a tus archivos tenías que llevarte el computador o la USB. \textbf{Ahora con OneDrive llevas todo en tu cuenta}: vas al colegio, ahí están; vas a casa de la abuela, ahí están; te conectas desde la biblioteca, ahí están. \emph{Tu identidad digital se separa del dispositivo}. Eres tu cuenta + tu nube, no tu computador particular. Eso te hace móvil de una manera que tu abuela ni imaginaba.
    pregunta_espejo: |-
      ¿Cómo cambiaría mi vida si llevara mi mundo digital conmigo a todas partes?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, abre OneDrive al menos 3 veces desde dispositivos distintos (en el cole, en casa, en celular). Sube 5 archivos más a las carpetas correctas. La próxima clase aprendes a usar \textbf{Word, Excel y PowerPoint en línea}, directamente desde el navegador, guardando todo en OneDrive automáticamente.

web:
  conceptos_clave:
    - termino: OneDrive
      definicion: |-
        Servicio de almacenamiento en la nube de Microsoft. Te da 1 TB de espacio para guardar archivos. Vienen incluidos con tu cuenta institucional. Tus archivos viven en servidores remotos, no en tu computador.
      ejemplo: |-
        Cuando guardas un Word en línea, va automáticamente a OneDrive. Lo puedes abrir desde cualquier computador iniciando sesión con tu cuenta institucional.
      emoji: "☁️"
    - termino: Nube vs disco local
      definicion: |-
        El disco duro guarda archivos en el computador físico. La nube los guarda en servidores remotos. Diferencia clave: si pierdes el computador, los archivos locales se pierden; los de la nube siguen vivos.
      ejemplo: |-
        Si guardas tu tarea solo en el disco y se daña el computador, pierdes la tarea. Si la guardaste en OneDrive, sigue ahí y la abres desde cualquier otro PC.
      emoji: "💾"
    - termino: Sincronización
      definicion: |-
        El proceso automático que mantiene los mismos archivos en varios dispositivos. Si editas un Word en el computador del cole, segundos después también está editado cuando lo abres en casa. La sincronización es invisible pero clave.
      ejemplo: |-
        Empiezas un trabajo en el computador del cole. Llegas a casa, abres OneDrive, el archivo está ahí actualizado. No tuviste que copiar nada manualmente: OneDrive sincroniza solo.
      emoji: "🔄"
    - termino: Backup (copia de seguridad) automático
      definicion: |-
        OneDrive guarda cada cambio en la nube automáticamente. Si tu disco duro falla, los archivos están vivos en la nube. Si borras algo por accidente, hay 30 días para recuperarlo de la papelera de OneDrive.
      ejemplo: |-
        Borras por error tu tarea de OneDrive. Vas a la 'Papelera' (en OneDrive), la encuentras, clic derecho 'Restaurar'. Vuelve a su carpeta. 30 días de oportunidad para recuperar.
      emoji: "🛡️"
    - termino: Cuenta institucional
      definicion: |-
        Cuenta de Microsoft 365 que el colegio te da. Termina en @[nombrecolegio].edu.co. Te da acceso gratis a OneDrive (1 TB), Word, Excel, PowerPoint, Outlook, Teams. Es seria, no es como un correo personal.
      ejemplo: |-
        Tu cuenta puede ser lcardenas@sormariajuliana.edu.co. Con ella entras a office.com, abres OneDrive, todas las apps gratis. Vence cuando te gradúas.
      emoji: "🎓"

  quiz:
    titulo: "¿Conoces OneDrive y la nube?"
    instrucciones: "5 preguntas para verificar que entiendes qué es la nube y cómo protege tus archivos."
    preguntas:
      - enunciado: "Tu computador se daña. Habías guardado todas tus tareas SOLO en el disco local. ¿Qué pasa?"
        opciones:
          - "Las tareas se mantienen, los discos siempre se recuperan."
          - "Pierdes todas las tareas si no tenías copia en la nube."
          - "Microsoft las recupera por arte de magia."
          - "Las tareas saltan a otro computador automáticamente."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Si no había copia en la nube (OneDrive) ni en USB ni en disco externo, las tareas se perdieron. Por eso OneDrive es tan importante: backup automático.
        feedback_incorrecto: |-
          Sin backup en la nube, las tareas se pierden. OneDrive es la solución: guarda automáticamente cada archivo. Empieza a usarlo desde hoy.
      - enunciado: "Estás en casa y necesitas la tarea que hiciste en el computador del colegio. ¿Cómo la abres?"
        opciones:
          - "Imposible, está en el cole."
          - "Voy a office.com, inicio sesión con mi cuenta institucional, abro OneDrive, ahí está la tarea."
          - "Llamo al colegio para que me la manden."
          - "Me toca rehacerla."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Esa es la magia de la nube: tus archivos viajan contigo (no físicamente; viven en la nube). Abres desde cualquier dispositivo con tu cuenta.
        feedback_incorrecto: |-
          office.com + cuenta institucional + OneDrive = tus archivos donde sea. La nube hace que tu mundo digital no dependa de un computador específico.
      - enunciado: "Borraste por accidente un archivo de OneDrive. ¿Está perdido?"
        opciones:
          - "Sí, totalmente perdido."
          - "Tienes 30 días para recuperarlo desde la Papelera de OneDrive."
          - "Microsoft te llama por teléfono."
          - "Hay que rehacerlo todo."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Papelera de OneDrive guarda lo borrado 30 días. Click derecho en el archivo → Restaurar. Recuperación rápida sin estrés.
        feedback_incorrecto: |-
          30 días en la Papelera de OneDrive para restaurar. Es como la papelera de Windows pero más generosa. Restaurar es 1 clic.
      - enunciado: "Tu cuenta institucional te da... (escoge lo más completo)"
        opciones:
          - "Solo correo."
          - "Word, Excel, PowerPoint, OneDrive (1 TB), Outlook, Teams, Forms gratis."
          - "Solo Word."
          - "Nada, hay que pagar."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Tu cuenta institucional te da Microsoft 365 completo: las 8 apps + 1 TB de OneDrive. Aprovéchala mientras estés en el colegio.
        feedback_incorrecto: |-
          Cuenta institucional = paquete completo de Microsoft 365 + 1 TB de OneDrive. Aprovéchalo, fuera del colegio cuesta mucho dinero.
      - enunciado: "Estás organizando carpetas en OneDrive. ¿Qué nombre es MEJOR?"
        opciones:
          - "Mis Documentos del Año Pasado"
          - "Mis-documentos"
          - "MIS DOCUMENTOS"
          - "xyz"
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Mis-documentos sigue las 5 reglas: sin espacios (usa guion), sin acentos, claro, profesional. Las otras opciones violan reglas.
        feedback_incorrecto: |-
          Mis-documentos: sin espacios (guion), sin acentos, claro. Las URLs no se rompen, los profesores entienden, tu yo de un año después lo encuentra.

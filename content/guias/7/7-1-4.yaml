clave: "1-4"
grado: 7
periodo: 1
sesion: 4
completo: true

titulo: "Word, Excel y PowerPoint en línea --- las 3 herramientas estrella"
titulo_portada: |-
  Word, Excel
  y PowerPoint
  en línea ---
  las 3 estrellas
  del paquete

producto_final: |-
  Tres archivos nuevos en tu OneDrive: \textbf{(a) Word en línea} con un texto de 1 página sobre la minga digital (continuación del tema de la S1); \textbf{(b) Excel en línea} con una tabla de 5 columnas y 10 filas de calificaciones inventadas + fórmula \texttt{=PROMEDIO()} aplicada; \textbf{(c) PowerPoint en línea} con 5 diapositivas presentando \emph{``Mis 3 apps favoritas de Microsoft 365''}. Cada archivo guardado en \texttt{Mis-documentos/Colegio/Tecnologia/Periodo-1}. Más \textbf{en el cuaderno}: tabla comparativa de las 3 apps (Word/Excel/PowerPoint) con 5 criterios.

apertura:
  saber_ancestral: |-
    \textbf{En el taller de don Lucho el relojero de Cartago había 3 herramientas estrella que él usaba el 80\% del tiempo.} A pesar de que tenía en su vitrina de la calle 14 \emph{decenas de herramientas} para reparar relojes, en la práctica cotidiana siempre echaba mano a 3: \textbf{la lupa de aumento} para ver lo pequeño, \textbf{las pinzas delicadas} para agarrar piezas diminutas, y \textbf{el destornillador miniatura} para abrir tapas. \emph{Las otras herramientas (martillo, aceite, pulidor) las usaba solo en casos especiales}. Cuando un aprendiz nuevo llegaba, don Lucho le decía: \emph{``Primero domine estas 3. Después se da cuenta de que con ellas hace el 80\% del oficio. Las otras se aprenden con el tiempo.''} \textbf{Hoy en tu taller digital pasa lo mismo}: aunque Microsoft 365 tenga 8 aplicaciones, en la práctica usas 3 el 80\% del tiempo: \emph{Word, Excel, PowerPoint}. Dominar bien esas 3 te hace eficiente. Después aprenderás las otras 5.

  saber_contemporaneo: |-
    \textbf{Word, Excel y PowerPoint son las 3 aplicaciones más usadas} del paquete Microsoft 365. Cada una tiene una versión \textbf{en línea} (\emph{Word Online}, \emph{Excel Online}, \emph{PowerPoint Online}) que funciona \textbf{dentro del navegador} (sin instalar nada en tu PC). \textbf{Las versiones en línea tienen 95\% de las funciones} que las versiones de escritorio. Para 7° grado, lo en línea sobra. \textbf{Ventaja clave de la versión en línea:} se guarda automáticamente en OneDrive \emph{cada pocos segundos}. Si se cae internet o se apaga el computador, no pierdes nada. Eso resuelve el problema de \emph{``olvidé guardar y se apagó''} que vivían tus papás. \textbf{Las 3 apps cubren 3 propósitos distintos:} Word para \emph{textos}, Excel para \emph{números}, PowerPoint para \emph{presentar}. Hoy creas uno de cada uno para tomarles confianza.

  pregunta_puente: |-
    Si te dieran a escoger \textbf{una sola app} de las 3 para aprender muy bien (a costa de no usar las otras 2), ¿\textbf{cuál escogerías} y por qué? ¿Word, Excel o PowerPoint? La respuesta dice mucho sobre el oficio que más te llama.

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} las diferencias clave entre Word, Excel y PowerPoint; (2) sabrás \textbf{aplicar} cada una a su tipo de tarea; (3) podrás \textbf{evaluar} cuál usar para una tarea nueva; (4) habrás \textbf{creado} 1 archivo de cada uno en tu OneDrive.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: distingues Word vs Excel vs PowerPoint, abres cada una en línea, creas un archivo en cada una, guardas todo en OneDrive.
  a_escuta: |-
    Empezamos con un test de 9 situaciones: ¿Word, Excel o PowerPoint?
  a_sistematizacion: |-
    Después aprendes qué hace cada app y dónde están sus funciones esenciales.
  a_praxis: |-
    Con todo claro, creas 1 Word + 1 Excel + 1 PowerPoint y los guardas correctamente.
  a_producto: |-
    El producto son los 3 archivos en OneDrive + tabla comparativa en cuaderno.
  a_evaluacion: |-
    Antes de salir, verifica que los 3 archivos abren desde otro dispositivo (sincronización OK).
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué dominar pocas herramientas a fondo vale más que muchas a medias.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 9 situaciones, 3 apps} (10 min · individual). En el cuaderno, escribe esta lista del 1 al 9. Para cada situación, escribe \textbf{W (Word)}, \textbf{E (Excel)} o \textbf{P (PowerPoint)} según cuál usarías. \emph{(1) Escribir un cuento de 2 páginas. (2) Llevar las notas de los 30 compañeros de la clase con promedios. (3) Hacer una presentación oral con 12 diapositivas sobre los animales del Valle. (4) Redactar una carta formal al rector. (5) Hacer un cuadro de gastos del mes. (6) Crear una invitación a un cumpleaños con diseño bonito. (7) Escribir un poema sobre Cartago. (8) Llevar un control de las horas que estudias cada día. (9) Mostrar a tu clase los resultados de una encuesta con gráficos.}

  checks:
  - Listé las 9 situaciones numeradas.
  - Marqué W, E o P al lado de cada una.
  - Pensé qué hace especial a cada app antes de decidir.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 9 situaciones, 3 apps». \textbf{Formato:} lista numerada del 1 al 9 con su letra (W/E/P). \textbf{Extensión:} 9 líneas. \textbf{Sabes que terminaste cuando} cada situación tiene una sola letra asignada.

sistematizacion:
  intro: |-
    Tu intuición se afila ahora con la sistematización. Aprende qué hace cada app y dónde están sus 5 funciones esenciales. Las respuestas correctas de la Actividad 1: \emph{1=W, 2=E, 3=P, 4=W, 5=E, 6=P (puede ser W con diseño), 7=W, 8=E, 9=P (con datos de Excel)}.

  pilares:
  - |-
    \textbf{Word Online --- el lápiz digital.} \textbf{Para qué sirve:} escribir textos. Ensayos, cartas, cuentos, informes, poemas, cualquier cosa con palabras. \textbf{5 funciones esenciales (ya las conoces de G6·P3):} (1) Formato de texto (negrita, alineación, color). (2) Listas con viñetas y numeradas. (3) Tablas. (4) Insertar imagen. (5) Encabezado y pie de página. \textbf{Cómo abrir:} \texttt{office.com} → ícono Word (W azul). Crea documento en blanco. \textbf{Guardado:} automático en OneDrive cada pocos segundos.
  - |-
    \textbf{Excel Online --- la calculadora maestra.} \textbf{Para qué sirve:} todo lo que tiene \emph{números organizados en tabla} (calificaciones, presupuestos, listas con conteos, estadísticas). \textbf{5 funciones esenciales:} (1) Celdas (cada cuadrito es una celda; se identifican A1, B2, C3...). (2) Fórmulas: empiezan con \texttt{=}, ejemplo \texttt{=A1+B1} suma. (3) Función \texttt{=PROMEDIO(rango)} calcula promedio. (4) Gráficos automáticos: seleccionas datos → Insertar → Gráfico. (5) Formato condicional: las celdas se pintan de color según el valor. \textbf{Cómo abrir:} \texttt{office.com} → Excel (X verde).
  - |-
    \textbf{PowerPoint Online --- el mostrador de ideas.} \textbf{Para qué sirve:} hacer presentaciones con diapositivas que se proyectan. Cada diapositiva es como una página visual: con título, texto corto, imágenes. \textbf{5 funciones esenciales:} (1) Nueva diapositiva (insertar más): se hace con un clic. (2) Plantillas (\emph{Diseño → Temas}): cambian colores y fuentes en bloque. (3) Insertar imagen, video, ícono. (4) Transiciones entre diapositivas (animaciones). (5) Modo presentador (F5): ves notas del orador mientras la audiencia ve solo las diapositivas. \textbf{Cómo abrir:} \texttt{office.com} → PowerPoint (P naranja).
  - |-
    \textbf{Regla maestra para escoger app.} Hazte 3 preguntas. \textbf{(1) ¿La información son palabras corridas?} → Word. \textbf{(2) ¿La información son números o datos en tabla?} → Excel. \textbf{(3) ¿La información se va a presentar a otros visualmente?} → PowerPoint. Si la respuesta es \emph{``más de una''}, escoge la principal. Ejemplo: \emph{``encuesta con gráficos a presentar''} → datos en Excel, gráficos en PowerPoint, ambos colaborando.

  anatomia:
    titulo: 3 apps + reglas de elección
    body: |-
      \textbf{Word:} para palabras (textos largos). \\[1mm]
      \textbf{Excel:} para números (tablas y cálculos). \\[1mm]
      \textbf{PowerPoint:} para presentar (diapositivas). \\[1mm]
      \textbf{Regla maestra:} pregunta principal → ¿palabras, números o mostrar? → escoge la app.

  errores_comunes: |-
    \textbf{Confusiones frecuentes al elegir.} (1) \emph{Hacer un horario en Word con tabla} --- válido pero limitado: Excel hace tabla con cálculos automáticos. (2) \emph{Hacer presentación en Word con saltos de página} --- pierde transiciones, animaciones, modo presentador. (3) \emph{Calcular promedio en Word a mano} --- Excel lo hace con \texttt{=PROMEDIO()}. (4) \emph{Escribir un cuento en PowerPoint} --- pierde el flujo narrativo del texto corrido. (5) \emph{Usar Excel para hacer una carta formal} --- las celdas distorsionan el formato de carta. Cada app para su uso.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Tabla comparativa Word/Excel/PowerPoint». \textbf{Formato:} tabla de 5 filas, 3 columnas (Word, Excel, PowerPoint). Filas: \emph{(1) ¿Para qué sirve?}, \emph{(2) Información típica}, \emph{(3) Función especial 1}, \emph{(4) Función especial 2}, \emph{(5) Ejemplo escolar}. \textbf{Extensión:} 5 filas. \textbf{Sabes que terminaste cuando} podrías recomendarle a un primo la app correcta para 5 tareas distintas.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- 1 Word + 1 Excel + 1 PowerPoint reales} (32 min · individual). Vas a crear los 3 archivos en línea y dejarlos guardados en tu OneDrive en la carpeta correcta. Si no tienes computador en clase, planificas el contenido en el cuaderno y los creas en casa.

  pilares:
  - |-
    \textbf{Paso 1 --- Abre office.com.} En el navegador, inicia sesión con tu cuenta institucional. Verás la página principal de Microsoft 365 con todas las apps. Ahora vas a crear 3 archivos seguidos en esta sesión.
  - |-
    \textbf{Paso 2 --- Word en línea (10 min).} Haz clic en el ícono Word (W azul). Crea \emph{Documento en blanco}. En la parte superior izquierda, donde dice \emph{``Documento1''}, haz clic y renómbralo: \texttt{2026-mi-vision-de-la-minga-digital}. Escribe \textbf{1 página} sobre cómo entiendes el trabajo colaborativo en la nube después de las primeras 3 sesiones. 4 párrafos cortos: \emph{(1) ¿qué es la minga?}, \emph{(2) ¿cómo se parece a Microsoft 365?}, \emph{(3) ¿qué he activado y aprendido?}, \emph{(4) ¿qué espero del periodo?}. Aplica formato (justificado, negrita en ideas importantes, sangría). Cuando termines, ve a la pestaña \emph{Mover a} y mueve el archivo a tu carpeta \texttt{Mis-documentos/Colegio/Tecnologia/Periodo-1}.
  - |-
    \textbf{Paso 3 --- Excel en línea (10 min).} Vuelve a office.com, ahora Excel (X verde). Crea \emph{Libro en blanco}. Renombra: \texttt{2026-calificaciones-prueba}. Crea una tabla con \textbf{5 columnas} (encabezados: Nombre, Sociales, Mate, Tecnología, Promedio) y \textbf{10 filas} de estudiantes inventados con notas inventadas (1-5). En la columna \emph{Promedio}, en la celda E2, escribe \texttt{=PROMEDIO(B2:D2)} y presiona Enter. Aparece el promedio de la primera fila. \emph{Truco mágico:} agarra el cuadrito de la esquina inferior derecha de E2 y arrástralo hacia abajo hasta E11: la fórmula se copia y calcula los promedios de todos. Muévelo a la misma carpeta.
  - |-
    \textbf{Paso 4 --- PowerPoint en línea (12 min).} office.com → PowerPoint (P naranja) → \emph{Presentación en blanco}. Renombra: \texttt{2026-mis-3-apps-favoritas}. Crea \textbf{5 diapositivas}: \emph{(D1) Portada}: título + tu nombre + grado. \emph{(D2) Word}: dile a la audiencia por qué te gusta Word. \emph{(D3) Excel}: lo mismo con Excel. \emph{(D4) PowerPoint}: lo mismo con PowerPoint. \emph{(D5) Cierre}: \emph{``¿Y tú cuál usarás más?''}. Aplica un tema bonito en \emph{Diseño}. Inserta al menos 1 imagen libre de Pixabay. Muévelo a la misma carpeta.
  - |-
    \textbf{Paso 5 --- Verifica los 3 archivos.} Vuelve a OneDrive (clic en el ícono nube azul desde office.com). Entra a \texttt{Mis-documentos/Colegio/Tecnologia/Periodo-1}. Deberías ver los 3 archivos ahí. Si los ves, ¡lograste el oficio del día!
  - |-
    \textbf{Paso 6 --- Registro en el cuaderno + firma.} En el cuaderno (sesión 4) escribe (boceto): \emph{``Mis 3 archivos en OneDrive: (1) Word: \_\_\_, (2) Excel: \_\_\_, (3) PowerPoint: \_\_\_''}. Anota lo que más te sorprendió de cada app. Firma con nombre y fecha. Esta sesión te entrenó en las 3 herramientas estrella.

  checklist:
    titulo: Antes de cerrar la S4
    items: |-
      \checkbox Tengo 1 archivo Word en línea con texto de 1 página formateado. \\[1mm]
      \checkbox Tengo 1 archivo Excel con tabla 5x10 + fórmula =PROMEDIO() aplicada. \\[1mm]
      \checkbox Tengo 1 archivo PowerPoint con 5 diapositivas y diseño temático. \\[1mm]
      \checkbox Los 3 archivos están en Mis-documentos/Colegio/Tecnologia/Periodo-1. \\[1mm]
      \checkbox Cada archivo tiene nombre que sigue las 5 reglas. \\[1mm]
      \checkbox Verifiqué en el cuaderno los 3 archivos creados.

  plantilla_guion: |-
    \textbf{Plan de la S4.} \textit{Paso 1:} office.com. \textit{Paso 2:} Word 1 página sobre minga digital. \textit{Paso 3:} Excel calificaciones con PROMEDIO. \textit{Paso 4:} PowerPoint 5 diapositivas sobre 3 apps. \textit{Paso 5:} todos en Tecnologia/Periodo-1. \textit{Paso 6:} registro y firma en cuaderno.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mis 3 archivos estrella». \textbf{Formato:} registro de los 3 archivos + reflexión sobre cuál te gustó más. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} tus 3 archivos están vivos en OneDrive y puedes mostrarlos al profe.

  producto_titulo: 3 archivos creados (Word + Excel + PowerPoint) en OneDrive · organizados
  criterios:
  - El Word tiene 1 página con 4 párrafos sobre la minga digital, formateado.
  - El Excel tiene tabla 5x10 con fórmula PROMEDIO aplicada y propagada.
  - El PowerPoint tiene 5 diapositivas con diseño temático + 1 imagen libre.
  - Los 3 archivos están en la carpeta correcta del OneDrive.
  - Los nombres siguen las 5 reglas (sin espacios, sin acentos, con fecha).

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del dominio del oficio)"
    cita: |-
      ``Dominar 3 herramientas a fondo te hace artesano. Saber 10 a medias te hace turista.''
    aplicacion: |-
      Hay personas que se jactan de \emph{``conocer todo Microsoft 365''} pero en realidad no dominan ninguna app a fondo. Don Lucho prefería que sus aprendices \textbf{dominaran 3 herramientas estrella} antes de querer aprender 10. Esa disciplina antigua aplica a Microsoft 365: \emph{Word, Excel, PowerPoint} bien aprendidos te dan más poder real que las 8 a medias.
    pregunta_espejo: |-
      ¿Quiero ser turista del software o artesano que domina lo esencial?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Pocas armas bien usadas ganan más batallas que muchas mal manejadas.''
    aplicacion: |-
      Marco Aurelio dirigía un ejército. Sabía que \textbf{soldados bien entrenados en pocas armas son más letales que mediocres con muchas}. Tu vida adulta es batalla constante (en sentido amplio): tareas, trabajos, decisiones. \emph{Dominar Word, Excel y PowerPoint a fondo te da ventaja sobre el 80\% de tus pares que las usan a medias}. Vale la pena la inversión inicial.
    pregunta_espejo: |-
      ¿Estoy aprendiendo lo esencial a fondo, o coleccionando conocimientos superficiales?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del software como oficio)"
    cita: |-
      ``El que aprende Word, Excel y PowerPoint en serio se ahorra años de improvisación profesional.''
    aplicacion: |-
      En el trabajo y la universidad, \textbf{las 3 apps se exigen sin enseñar}: se asume que las sabes. Los que las aprendieron en colegio (como tú) avanzan sin pena. Los que llegan sin saberlas pasan meses sufriendo. \emph{Hoy aprendiste lo que el 60\% de adultos colombianos no sabe}. Eso es ventaja real. Aprovéchala.
    pregunta_espejo: |-
      ¿Veo este aprendizaje como un favor que me hace mi yo de 25 años?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, vuelve a abrir tus 3 archivos al menos 1 vez para revisarlos y mejorarlos. Familiarízate con la sensación de \emph{guardado automático} (no necesitas Ctrl+G). La próxima clase aprendes a \textbf{compartir tus archivos} con compañeros: el primer paso de la minga digital real.

web:
  conceptos_clave:
    - termino: Word Online
      definicion: |-
        La versión de Word que funciona dentro del navegador, sin instalar nada. Tiene 95% de las funciones de Word de escritorio. Se guarda automáticamente en OneDrive cada pocos segundos. Acceso desde cualquier computador con tu cuenta.
      ejemplo: |-
        Para una tarea de Sociales abres office.com → Word → Documento en blanco. Escribes, formateas, se guarda solo. Mañana abres desde otro PC y sigue ahí.
      emoji: "📝"
    - termino: Excel Online
      definicion: |-
        La versión de Excel en el navegador. Tiene celdas, fórmulas, gráficos automáticos. Para 7° grado tiene de sobra. Las celdas se identifican A1, B2, C3 (columna + fila). Fórmulas empiezan con = (igual).
      ejemplo: |-
        En la celda E2 escribes =PROMEDIO(B2:D2) y aparece el promedio automático. Arrastras el cuadrito de la esquina hacia abajo y la fórmula se propaga a otras filas.
      emoji: "📊"
    - termino: PowerPoint Online
      definicion: |-
        La versión web de PowerPoint para crear presentaciones con diapositivas. Cada diapositiva es una página visual con título + contenido. Tienen plantillas (Diseño → Temas), transiciones, modo presentador.
      ejemplo: |-
        Para presentación oral de Sociales: 5-10 diapositivas con 1 idea por slide. Aplicas un tema, insertas imágenes, presentas con F5 (modo presentador). Profesional.
      emoji: "📽️"
    - termino: Fórmula de Excel (=PROMEDIO)
      definicion: |-
        Instrucción que le dice a Excel que calcule algo automáticamente. Las fórmulas siempre empiezan con = (igual). =PROMEDIO(B2:D2) calcula el promedio de las celdas de B2 a D2. Hay miles de fórmulas en Excel.
      ejemplo: |-
        Tienes notas en B2 (4.0), C2 (3.5), D2 (4.5). En E2 escribes =PROMEDIO(B2:D2) y aparece 4.0 (que es el promedio de las 3). Se actualiza solo si cambias alguna nota.
      emoji: "🔢"
    - termino: Guardado automático
      definicion: |-
        Característica de las apps en línea de Microsoft 365: guardan los cambios en OneDrive cada pocos segundos sin que tengas que presionar Ctrl+G. Te protegen de perder trabajo cuando se va la luz o se cierra el navegador.
      ejemplo: |-
        Estás escribiendo en Word Online y se va la luz. Cuando vuelves al computador, abres el archivo y tienes todo hasta el último segundo. Sin guardado automático, perdías el trabajo.
      emoji: "💾"

  quiz:
    titulo: "¿Sabes usar las 3 apps estrella?"
    instrucciones: "5 preguntas para verificar que distingues Word, Excel y PowerPoint."
    preguntas:
      - enunciado: "Quieres llevar el control de tus gastos semanales (qué compraste, cuánto, total). ¿Qué app?"
        opciones:
          - "Word."
          - "Excel: porque tienes columnas, números y vas a sumar."
          - "PowerPoint."
          - "OneNote."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Control de gastos = números en tabla + suma automática. Excel es perfecto: columnas de fecha, descripción, monto, total con =SUMA().
        feedback_incorrecto: |-
          Excel para todo lo que tiene números en tabla con cálculos. Word es para texto; PowerPoint para presentar. Para sumar gastos, Excel.
      - enunciado: "Tu tarea de Sociales es escribir un ensayo de 3 páginas. ¿Qué app?"
        opciones:
          - "Excel."
          - "PowerPoint."
          - "Word."
          - "Forms."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Ensayo = texto corrido en párrafos. Word está diseñado para textos largos: justificado, sangría, formato de párrafos, encabezado/pie.
        feedback_incorrecto: |-
          Word para ensayos. Excel deforma el texto corrido; PowerPoint pierde el flujo narrativo. Para textos largos: Word.
      - enunciado: "En Excel, ¿qué pasa si en la celda E2 escribes =PROMEDIO(B2:D2)?"
        opciones:
          - "Aparece la palabra PROMEDIO literalmente."
          - "Excel calcula el promedio de las celdas B2, C2 y D2 y muestra el resultado."
          - "Se daña el archivo."
          - "No pasa nada."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. = le dice a Excel 'calcula esto'. PROMEDIO es la función. (B2:D2) es el rango. Excel hace la operación y muestra el resultado.
        feedback_incorrecto: |-
          Excel calcula: = empieza fórmula, PROMEDIO calcula promedio, (B2:D2) es el rango. Aparece el resultado, no la fórmula escrita.
      - enunciado: "Vas a presentar oralmente 'Los animales del Valle' a tu clase. ¿Qué app?"
        opciones:
          - "Excel con muchas filas."
          - "PowerPoint con diapositivas visuales."
          - "Word con saltos de página."
          - "Forms."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Presentación oral = PowerPoint. Cada diapositiva con 1 idea, imágenes, transiciones. F5 modo presentador. Profesional desde día 1.
        feedback_incorrecto: |-
          PowerPoint para presentar oralmente. Word puede pero pierde transiciones. Excel deforma. PowerPoint está hecho para esto.
      - enunciado: "¿En qué se diferencia la versión 'en línea' de las apps respecto a la versión de escritorio?"
        opciones:
          - "La en línea es peor y tiene menos funciones."
          - "La en línea funciona en el navegador sin instalar nada y guarda automáticamente en OneDrive."
          - "La en línea es más cara."
          - "Son exactamente iguales."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. En línea = navegador + guardado automático en OneDrive. Tiene 95% de funciones de la de escritorio. Para 7° grado sobra. Y se puede usar en cualquier PC con tu cuenta.
        feedback_incorrecto: |-
          Versión en línea: en el navegador, sin instalar, guarda automático en OneDrive, accesible desde cualquier PC. Tiene casi todo lo de la de escritorio.

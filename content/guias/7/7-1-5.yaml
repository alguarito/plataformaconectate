clave: "1-5"
grado: 7
periodo: 1
sesion: 5
completo: true

titulo: "Compartir y permisos --- abrir mi taller a invitados con criterio"
titulo_portada: |-
  Compartir y
  permisos ---
  abrir mi
  taller a
  invitados

producto_final: |-
  Uno de tus archivos de la S4 (Word, Excel o PowerPoint) \textbf{compartido con 2 compañeros} de la clase, con permisos \textbf{distintos a cada uno}: uno \emph{solo puede ver}, el otro \emph{puede editar}. Más \textbf{en el cuaderno}: tabla de los 3 niveles de permisos (puede ver, comentar, editar) con ejemplos de cuándo usar cada uno + las 5 reglas del compartir responsable + captura impresa o boceto de la pantalla \emph{``Compartir''}.

apertura:
  saber_ancestral: |-
    \textbf{Cuando un maestro artesano de Cartago abría su taller a un aprendiz, decidía exactamente qué podía hacer y qué no.} En el taller de don Lucho el relojero, no todos los aprendices podían tocar las mismas cosas. \textbf{Al recién llegado}, don Lucho le decía: \emph{``Mire, no toque''}. Era nivel \textbf{lector}. \textbf{Al aprendiz de 6 meses}, le decía: \emph{``Mire, dígame si ve algo raro, pero todavía no arregle''}. Era nivel \textbf{comentarista}. \textbf{Al aprendiz de 2 años}, ya: \emph{``Tome este reloj y repárelo, después le reviso''}. Era nivel \textbf{editor}. \textbf{¿Por qué tantos niveles?} Porque \emph{abrir el taller no es regalar el taller}. Cada nivel de acceso protegía el oficio --- un aprendiz inexperto podía dañar un reloj caro tocando lo equivocado. Hoy en Microsoft 365 pasa exactamente igual: cuando compartes un archivo, escoges \textbf{el nivel de permisos}. Saber escogerlo es la diferencia entre colaborar bien y armar un desorden.

  saber_contemporaneo: |-
    \textbf{Compartir} un archivo en OneDrive significa darle acceso a otra persona desde su cuenta. NO se copia el archivo: el archivo queda donde está, pero ahora otra persona también lo puede abrir. \textbf{Hay 3 niveles de permisos:} \textbf{(1) Puede ver} (\emph{lector}): solo lee el archivo, no puede cambiar nada. Ideal para entregar trabajos terminados al profe. \textbf{(2) Puede comentar} (\emph{comentarista}): puede leer y agregar comentarios al margen, pero no cambia el texto. Ideal para revisión. \textbf{(3) Puede editar} (\emph{editor}): puede leer, comentar y cambiar el archivo libremente. Ideal para coautoría real. \textbf{Cómo se comparte:} botón \emph{``Compartir''} (esquina superior derecha) → escribir correo del invitado + elegir nivel → \emph{``Enviar''}. El otro recibe un correo con el enlace y abre el archivo. \emph{Tú decides qué puede hacer él}.

  pregunta_puente: |-
    Si compartes tu archivo de Word con tu mejor amigo dándole \emph{``puede editar''} y él, sin querer, borra una página, ¿\textbf{se pierde para siempre} la información? ¿Cómo deberías haber compartido en lugar de eso?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 3 niveles de permisos; (2) sabrás \textbf{aplicar} el nivel correcto a 5 situaciones; (3) podrás \textbf{evaluar} las 5 reglas del compartir responsable; (4) habrás \textbf{compartido} 1 archivo con 2 compañeros con permisos distintos.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: aprendes los 3 niveles de permisos, los aplicas a 5 situaciones, conoces las 5 reglas del compartir, compartes un archivo real.
  a_escuta: |-
    Empezamos con 5 situaciones para escoger el nivel correcto.
  a_sistematizacion: |-
    Después aprendes los 3 niveles + 5 reglas del compartir responsable.
  a_praxis: |-
    Con todo claro, abres OneDrive y compartes uno de tus archivos con 2 compañeros.
  a_producto: |-
    El producto es ese archivo compartido + tabla de permisos en cuaderno.
  a_evaluacion: |-
    Antes de salir, verifica con los compañeros que ellos pueden abrir el archivo con el permiso correcto.
  a_triangulo: |-
    Cerramos con 3 voces que te ayudan a entender por qué dar acceso con criterio es respeto al trabajo.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 5 situaciones, 3 niveles} (10 min · individual). Lee estas 5 situaciones y escribe en el cuaderno \textbf{qué nivel de permiso (V/C/E)} darías. \emph{V = Puede ver. C = Puede comentar. E = Puede editar}. \textbf{(1) Le mandas al profe la tarea final terminada para que la califique.} \textbf{(2) Le pides a un compañero que revise tu ensayo y te diga si hay errores antes de entregar.} \textbf{(3) Vas a hacer un trabajo en grupo con 3 compañeros y todos van a escribir partes distintas.} \textbf{(4) Le mandas a tu mamá la presentación para que la vea antes de la exposición.} \textbf{(5) Le compartes con un amigo cercano tu archivo Word para que lo termine en tu lugar mientras tú estudias mate.}

  checks:
  - Leí las 5 situaciones con calma.
  - Asigné V, C o E a cada una.
  - La situación 5 me hizo pensar (¿es buena idea?).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 5 situaciones, 3 niveles». \textbf{Formato:} lista numerada del 1 al 5 con V/C/E. \textbf{Extensión:} 5 líneas. \textbf{Sabes que terminaste cuando} tienes una decisión por cada situación y podrías justificarla.

sistematizacion:
  intro: |-
    Tu intuición se afila ahora. Aprende los \textbf{3 niveles exactos} con ejemplos profesionales y las 5 reglas para no hacer mal uso del compartir.

  pilares:
  - |-
    \textbf{Nivel 1 --- Puede ver (\emph{Read-only}).} El invitado abre el archivo pero \textbf{no puede modificar nada}. Si intenta escribir, sale un mensaje \emph{``solo lectura''}. \textbf{Cuándo usarlo:} entregar trabajos terminados al profe, mostrar archivos a familiares, compartir documentación oficial. \textbf{Pista profesional:} es el nivel más seguro. Si dudas, empieza por aquí. Si después necesitan más permisos, lo cambias.
  - |-
    \textbf{Nivel 2 --- Puede comentar.} El invitado puede leer y agregar \textbf{comentarios al margen} (como pegatinas amarillas digitales), pero \textbf{NO puede cambiar el texto}. Sus comentarios aparecen en el lateral del documento; tú decides si los aceptas o no. \textbf{Cuándo usarlo:} \emph{revisión de trabajos por compañeros o profe}, \emph{retroalimentación antes de entregar}, \emph{discusión sobre un texto sin que se cambie}. Lo verás más a fondo en la S7.
  - |-
    \textbf{Nivel 3 --- Puede editar.} El invitado puede \textbf{cambiar el documento libremente}: escribir, borrar, mover, agregar imágenes. Es el nivel de la \emph{coautoría real}. \textbf{Cuándo usarlo:} trabajos en grupo donde varios escriben, proyectos colaborativos, bitácoras compartidas. \textbf{Cuidado importante:} con editor, el otro puede dañar tu trabajo (sin querer o queriendo). Por eso da editor solo a personas que conozcas bien y solo cuando realmente sea necesario.
  - |-
    \textbf{Las 5 reglas del compartir responsable.} (1) \textbf{El menor permiso necesario:} si solo necesitas que vean, no des editor. Es como prestar el carro: das las llaves solo si es necesario. (2) \textbf{Verifica el correo antes de enviar:} un punto de más y el archivo va a un desconocido. (3) \textbf{Pon plazo de expiración cuando sea posible:} \emph{``acceso solo hasta el viernes''}. (4) \textbf{Quita acceso cuando ya no se necesite:} en el panel de Compartir puedes ver quién tiene acceso y revocarlo. (5) \textbf{No compartas archivos con datos personales sensibles:} contraseñas, números de cédula, fotos íntimas. Esos no van a compartirse.

  anatomia:
    titulo: 3 niveles + 5 reglas
    body: |-
      \textbf{3 niveles:} \\[1mm]
      \textbf{1.} Puede VER --- solo lectura. \\[1mm]
      \textbf{2.} Puede COMENTAR --- lectura + notas al margen. \\[1mm]
      \textbf{3.} Puede EDITAR --- cambio libre. \\[1mm]
      \textbf{5 reglas:} menor permiso · verifica correo · pon expiración · quita acceso · no datos sensibles.

  errores_comunes: |-
    \textbf{Errores frecuentes al compartir.} (1) \emph{Dar editor a todo el mundo por comodidad} --- alguien va a dañar el archivo. (2) \emph{Mandar el enlace por WhatsApp sin verificar el destinatario} --- llega a alguien equivocado. (3) \emph{Olvidar revocar acceso cuando un compañero ya no es del equipo} --- sigue viendo cosas privadas. (4) \emph{Compartir trabajos terminados como editor en lugar de viewer} --- el profe puede modificar tu tarea por error. (5) \emph{No verificar que el compañero RECIBIÓ y ABRIÓ el archivo} --- te enteras del problema cuando ya pasó el plazo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 3 niveles + 5 reglas». \textbf{Formato:} bloque A con tabla de 3 filas, 2 columnas (nivel + cuándo usarlo + ejemplo). Bloque B con lista de 5 reglas. \textbf{Extensión:} 8 líneas. \textbf{Sabes que terminaste cuando} podrías recomendar el nivel correcto a un compañero que dude.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Compartir un archivo real con 2 compañeros} (28 min · individual + interacción con compañeros). Vas a tomar uno de tus archivos de la S4 (Word, Excel o PowerPoint --- el que más te gustó) y compartirlo con 2 compañeros de la clase con permisos distintos.

  pilares:
  - |-
    \textbf{Paso 1 --- Escoge el archivo y los 2 compañeros.} En el cuaderno escribe: \emph{``Archivo que voy a compartir: \_\_\_''}. \emph{``Compañero 1 (va a ser viewer): \_\_\_''}. \emph{``Compañero 2 (va a ser editor): \_\_\_''}. Acuerda con ellos qué hacer (que abran el archivo y verifiquen sus permisos).
  - |-
    \textbf{Paso 2 --- Abre el archivo y haz clic en Compartir.} Entra a OneDrive, abre tu archivo. En la esquina superior derecha hay un botón \textbf{``Compartir''} (con un ícono de personas). Haz clic.
  - |-
    \textbf{Paso 3 --- Configura el primer compartir (viewer).} Aparece una ventana. En el campo de \emph{``Para''} escribe el correo institucional de tu Compañero 1 (algo como \texttt{nombre1@sormariajuliana.edu.co}). Donde dice \emph{``Cualquier persona con el vínculo puede editar''} (o similar), haz clic y cambia a \textbf{``Puede ver''}. Escribe un mensaje corto: \emph{``Hola [nombre], te comparto este archivo para que lo veas. No tienes que editar nada, solo verlo.''}. Pulsa \emph{Enviar}.
  - |-
    \textbf{Paso 4 --- Configura el segundo compartir (editor).} Vuelve a Compartir. Escribe correo de Compañero 2. Cambia el nivel a \textbf{``Puede editar''}. Mensaje: \emph{``Hola [nombre], te comparto este para que agregues 1 línea al final. Es práctica de coautoría.''}. Enviar.
  - |-
    \textbf{Paso 5 --- Verifica con tus compañeros.} Habla con ellos. Pregunta a Compañero 1: \emph{``¿puedes ver el archivo? Intenta escribir algo''}. Debería responder \emph{``puedo verlo pero no me deja escribir''} (porque es viewer, no editor). Pregunta a Compañero 2: \emph{``¿puedes ver y escribir?''}. Debería responder \emph{``sí, escribí una línea al final''}. Vuelve a tu archivo y verifica: deberías ver la línea que Compañero 2 agregó.
  - |-
    \textbf{Paso 6 --- Registro + boceto + reflexión.} En el cuaderno haz un \textbf{boceto de la pantalla ``Compartir''} de OneDrive (puedes dibujarla simplemente: una ventana con 2 campos --- destinatario y permiso --- y un botón Enviar). Etiqueta cada parte. Debajo del boceto, escribe la reflexión: \emph{``Compartir es regalar acceso, no regalar el archivo. Los 3 niveles me sirven para...''}. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S5
    items: |-
      \checkbox Compartí 1 archivo con 2 compañeros. \\[1mm]
      \checkbox El Compañero 1 tiene 'Puede ver' (no edita). \\[1mm]
      \checkbox El Compañero 2 tiene 'Puede editar' (sí cambia el archivo). \\[1mm]
      \checkbox Verifiqué con los compañeros que los permisos funcionan. \\[1mm]
      \checkbox Boceto de la pantalla Compartir está en el cuaderno. \\[1mm]
      \checkbox La reflexión personal está firmada.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} elegir archivo + 2 compañeros. \textit{Paso 2:} botón Compartir (esquina superior derecha). \textit{Pasos 3 y 4:} compartir con 2 niveles distintos. \textit{Paso 5:} verificar con los compañeros que funcionan. \textit{Paso 6:} boceto + reflexión + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi primer compartir real». \textbf{Formato:} datos del compartir + boceto de pantalla + reflexión. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} tus 2 compañeros tienen acceso al archivo con sus permisos respectivos.

  producto_titulo: Archivo compartido con 2 compañeros · 2 niveles distintos · verificado
  criterios:
  - Hay 1 archivo compartido con 2 compañeros.
  - Los 2 compañeros tienen niveles DISTINTOS (uno viewer, uno editor).
  - Los compañeros confirmaron que pueden abrir con su nivel correcto.
  - Boceto de la pantalla Compartir está en el cuaderno.
  - La reflexión personal está firmada.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del trato responsable)"
    cita: |-
      ``Compartir bien es escoger con criterio a quién das qué. No es dar todo a todos: eso no es generosidad, es descuido.''
    aplicacion: |-
      Hay quien cree que \emph{``ser generoso''} es dar a todos el máximo acceso. Falso. \textbf{Generosidad sin criterio es descuido}: das editor a alguien que no necesita editor, y termina dañándose el trabajo. \emph{El verdadero compartir generoso es escoger el nivel correcto para cada persona}: el viewer a quien debe ver, el editor a quien debe escribir. Don Lucho lo entendía con sus aprendices. Tú lo entiendes hoy con tus archivos.
    pregunta_espejo: |-
      ¿Comparto con criterio o por comodidad?

  estoico:
    autor: "Marco Aurelio (emperador que decidía con cuidado)"
    cita: |-
      ``Antes de dar, pregunta: ¿qué necesita esta persona específicamente? No lo que tú te imaginas; lo que ella requiere para hacer su parte.''
    aplicacion: |-
      Compartir bien empieza por una pregunta: \textbf{¿qué necesita exactamente la otra persona?}. Si solo necesita ver tu trabajo, dale viewer. Si necesita agregar comentarios, comentarista. Si va a trabajar contigo en serio, editor. \emph{Cada nivel para cada necesidad}. Es como pedir herramientas en un taller: el aprendiz no se lleva el martillo si solo necesita la lupa.
    pregunta_espejo: |-
      ¿Pienso en lo que la otra persona necesita o en lo que es más rápido para mí?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del trabajo digital colaborativo)"
    cita: |-
      ``La diferencia entre un equipo digital que funciona y uno que no es la calidad de los permisos. Acceso fino = equipo eficaz.''
    aplicacion: |-
      Los equipos digitales que \emph{funcionan bien} tienen un patrón: \textbf{cada persona tiene exactamente el acceso que necesita} (ni más, ni menos). Los que \emph{funcionan mal} suelen tener todos editores en todo, o todos viewers en todo. \emph{Trabajar bien empieza por configurar bien los permisos al inicio del proyecto}. Hoy aprendiste ese hábito. Te servirá toda la vida adulta.
    pregunta_espejo: |-
      Si formara un equipo de trabajo, ¿sabría asignar permisos finos a cada integrante?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, intenta compartir 1 archivo más con un familiar (papá, mamá, abuelos) usando \emph{``Puede ver''}: enséñales tu trabajo escolar. Pasa de \emph{``mostrar pantalla''} a \emph{``compartir vínculo''} --- es paso pequeño pero importante. La próxima clase aprendes \textbf{coautoría asincrónica}: cómo 3 personas escriben al mismo tiempo en el mismo documento sin chocar.

web:
  conceptos_clave:
    - termino: Compartir archivo en OneDrive
      definicion: |-
        Dar acceso a otra persona a tu archivo desde su cuenta. NO se copia el archivo: queda donde está, pero otros pueden abrirlo. Tú decides qué pueden hacer con él (3 niveles).
      ejemplo: |-
        Compartes tu Word con tu profe dándole 'Puede ver'. Él lo abre desde su cuenta. No le mandas el archivo por correo: es el mismo archivo, en la nube, compartido.
      emoji: "🔗"
    - termino: Puede ver (viewer)
      definicion: |-
        Primer nivel de permiso. El invitado abre el archivo pero NO puede modificar nada. Si intenta escribir, aparece mensaje 'solo lectura'. Es el nivel más seguro.
      ejemplo: |-
        Le compartes al profe tu trabajo terminado dándole 'Puede ver'. Él lo califica sin riesgo de cambiar nada por error. Después le pasas a 'Puede comentar' si quieres retroalimentación escrita.
      emoji: "👁️"
    - termino: Puede comentar (commenter)
      definicion: |-
        Segundo nivel. El invitado puede leer Y agregar comentarios al margen, pero NO cambia el texto. Los comentarios son como notas adhesivas digitales que solo tú decides si aceptas.
      ejemplo: |-
        Antes de entregar tu ensayo, lo compartes con un compañero dándole 'Puede comentar'. Él lee y agrega 5 sugerencias al margen. Tú decides cuáles aplicar.
      emoji: "💬"
    - termino: Puede editar (editor)
      definicion: |-
        Tercer y máximo nivel. El invitado puede leer, comentar y cambiar el archivo libremente. Es para coautoría real (varios escribiendo a la vez). Cuidado: el editor puede dañar tu trabajo sin querer.
      ejemplo: |-
        Tu equipo de 3 va a hacer trabajo grupal. Compartes el Word con los 2 compañeros dándole 'Puede editar'. Cada uno escribe su sección. Se ve quién escribió cada parte.
      emoji: "✏️"
    - termino: 5 reglas del compartir
      definicion: |-
        Las 5 normas para compartir bien: (1) menor permiso necesario, (2) verifica el correo, (3) pon plazo de expiración, (4) revoca acceso cuando termine, (5) no compartas datos sensibles.
      ejemplo: |-
        Compartes con un profe dándole 'Puede ver' (no editor), verificas que el correo es correcto, pones expiración 30 días, después del semestre revocas acceso. Eso es compartir profesional.
      emoji: "📋"

  quiz:
    titulo: "¿Sabes compartir con criterio?"
    instrucciones: "5 preguntas para verificar que dominas los 3 niveles de permisos."
    preguntas:
      - enunciado: "Le entregas la tarea final al profe. ¿Qué nivel de permiso le das?"
        opciones:
          - "Puede editar (por si quiere mejorarla)."
          - "Puede ver (solo lectura)."
          - "Puede comentar."
          - "Lo bloqueo para que no la abra."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Tarea terminada = puede ver. El profe la lee y califica. No queremos que la modifique por error.
        feedback_incorrecto: |-
          Para entregar trabajos terminados: 'Puede ver'. Si le das editor, el profe puede cambiar tu tarea por accidente. La regla del menor permiso necesario.
      - enunciado: "Tu equipo de 3 va a escribir un trabajo grupal en un Word compartido. ¿Qué nivel?"
        opciones:
          - "Puede ver (todos pueden mirarlo)."
          - "Puede editar (todos pueden escribir)."
          - "Puede comentar."
          - "Solo 1 puede editar, los otros 2 solo ven."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Coautoría real = todos editores. Eso permite que los 3 escriban al mismo tiempo en sus secciones. Lo verás en S6 a fondo.
        feedback_incorrecto: |-
          Trabajo en grupo = puede editar para todos. Solo así pueden escribir en paralelo. Lo verás a fondo en S6 (coautoría asincrónica).
      - enunciado: "Antes de entregar, quieres que un compañero revise tu ensayo y te diga errores. ¿Qué nivel?"
        opciones:
          - "Puede editar (que corrija él directamente)."
          - "Puede comentar (revisa y agrega sugerencias sin cambiar)."
          - "Puede ver (solo mira)."
          - "Lo dejas sin compartir."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 'Puede comentar' es ideal para revisión: el otro lee, sugiere al margen, pero TÚ decides cambios. Sin riesgo de que él modifique sin permiso.
        feedback_incorrecto: |-
          'Puede comentar' para revisión: él agrega notas al margen, tú decides aceptarlas. Si le das editor, podría cambiar cosas sin que tú lo apruebes.
      - enunciado: "Compartiste un archivo con un compañero hace un mes. Ya no es de tu equipo. ¿Qué haces?"
        opciones:
          - "Nada, da igual."
          - "Voy a Compartir → veo quién tiene acceso → revoco el acceso del compañero que ya no es del equipo."
          - "Borro el archivo completo."
          - "Cambio mi contraseña."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Regla 4 del compartir: revoca acceso cuando ya no se necesite. En Compartir puedes ver y revocar accesos. Higiene digital básica.
        feedback_incorrecto: |-
          Revoca acceso cuando ya no se necesite. Higiene digital: no dejas la puerta abierta cuando los invitados ya se fueron. Va al panel de Compartir.
      - enunciado: "Tu mejor amigo te dice: 'Compárteme tu cuenta de OneDrive con todos los archivos'. ¿Qué haces?"
        opciones:
          - "Le doy mi contraseña."
          - "No. La cuenta es solo mía. Si quiere ver algún archivo específico, lo comparto con ese archivo a su correo."
          - "Le mando capturas de pantalla."
          - "Le creo otra cuenta a mi nombre."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La cuenta NO se comparte. Si necesita ver algo, le compartes el archivo específico. Compartir cuenta = perdida de control total.
        feedback_incorrecto: |-
          La cuenta es tuya, no se comparte. Si necesita acceder a algo, compartes ese archivo específico. Compartir contraseña = perder control de TODO.

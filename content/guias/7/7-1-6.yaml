clave: "1-6"
grado: 7
periodo: 1
sesion: 6
completo: true

titulo: "Coautoría asincrónica --- 3 personas escribiendo al mismo tiempo"
titulo_portada: |-
  Coautoría
  asincrónica ---
  3 personas
  al mismo
  tiempo

producto_final: |-
  Un \textbf{documento Word colaborativo} entre 3 estudiantes (tú + 2 compañeros). El documento tiene: \textbf{(a) acuerdo de roles} arriba (quién escribe qué sección); \textbf{(b) 3 secciones distintas} con encabezados claros (una por estudiante); \textbf{(c) tu sección personal} con 1 párrafo de 4-5 líneas sobre un subtema del tema acordado. Más \textbf{en el cuaderno}: bitácora de lo que pasó (qué funcionó, qué se complicó, cómo lo resolvieron).

apertura:
  saber_ancestral: |-
    \textbf{En una minga grande del Valle del Cauca, los 30 trabajadores no estaban todos haciendo lo mismo.} En la finca cafetera de Cartago, cuando llegaba la minga, había \textbf{división espontánea de tareas}: \emph{10 personas en los cafetales recogiendo}, \emph{5 en los patios extendiendo el grano al sol}, \emph{3 en las cocinas preparando almuerzo}, \emph{2 cargando agua del nacedero}, \emph{1 cuidando que los niños no se metieran al cafetal}. Aunque eran 30 trabajando \textbf{al mismo tiempo}, cada quien sabía \emph{exactamente qué hacer y dónde}. \textbf{No había choques}. Esa organización no salía del aire: el dueño de la finca y los líderes de la minga la habían \emph{acordado al inicio del día}, mientras tomaban el café del desayuno. \textbf{Sin ese acuerdo inicial, los 30 se hubieran tropezado entre sí}. Hoy en Microsoft 365, la coautoría real --- 3 o más personas escribiendo en el mismo Word al tiempo --- funciona igual: \emph{primero acuerdo de roles, después trabajo paralelo, sin choques}.

  saber_contemporaneo: |-
    \textbf{Coautoría} es cuando varias personas escriben en el mismo archivo \textbf{a la vez}, viendo los cambios de los otros en tiempo real. Microsoft 365 (Word, Excel, PowerPoint en línea) permite hasta \textbf{cientos de coautores simultáneos}. Cuando varios escriben al mismo tiempo, ves los \emph{cursores de los demás} en colores distintos, con sus nombres flotando. \textbf{Asincrónica} significa que NO requiere que todos estén conectados al mismo tiempo: cada uno entra cuando puede, escribe su parte, sale; el documento se actualiza en la nube. \textbf{Sincrónica} es cuando todos están conectados a la vez (más rápido, pero más caótico si no hay coordinación). Para 7° grado lo ideal es \textbf{asincrónica con acuerdo previo}: definen secciones, cada uno trabaja en la suya, y se reúnen al final para revisar.

  pregunta_puente: |-
    Si tú y 2 compañeros tuvieran que escribir un trabajo de Sociales de 6 párrafos en 1 hora trabajando \textbf{cada uno desde su casa}, ¿\textbf{cómo se organizarían}? ¿Cómo evitan escribir cada uno la misma cosa o, peor, borrarse entre sí?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} las diferencias entre coautoría sincrónica y asincrónica; (2) sabrás \textbf{aplicar} los 4 pasos del acuerdo de roles; (3) podrás \textbf{evaluar} si una coautoría está bien organizada; (4) habrás \textbf{creado} un documento colaborativo con 2 compañeros.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: descubres los 4 pasos del acuerdo, formas equipo de 3, escriben el documento, registran la experiencia.
  a_escuta: |-
    Empezamos comparando coautoría buena vs coautoría caótica.
  a_sistematizacion: |-
    Después aprendes los 4 pasos del acuerdo de roles y las 5 técnicas para no chocar.
  a_praxis: |-
    Con todo claro, formas equipo, acuerdan roles, escriben en paralelo.
  a_producto: |-
    El producto es el documento colaborativo + bitácora.
  a_evaluacion: |-
    Antes de salir, miran el documento juntos: ¿se ve como uno solo o como 3 pegados?
  a_triangulo: |-
    Cerramos con 3 voces sobre el oficio de trabajar juntos sin chocar.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 2 historias de coautoría} (10 min · individual). Lee estas 2 historias y en el cuaderno responde: \emph{¿qué hizo distinta a la historia B de la A?}. \textbf{Historia A (caos):} \emph{``María, Pedro y Lucía tienen que entregar un Word de 6 párrafos sobre los ríos de Colombia. Se conectan al documento al mismo tiempo, sin haber acordado nada. Los 3 empiezan a escribir desde la primera línea. Se borran entre sí. María se enoja porque Pedro borró lo que ella había escrito. Lucía siente que está sobrando. A la hora se rinden y deciden cada uno hacer su versión por separado. Pierden 2 horas.''}. \textbf{Historia B (éxito):} \emph{``María, Pedro y Lucía abren WhatsApp. María propone: yo hago río Magdalena, Pedro río Cauca, Lucía río Atrato. Se acuerdan los 6 párrafos: 2 por río. Cada uno entra al Word, busca su sección y escribe sin pisarse. En 45 minutos terminan. Se reúnen 10 minutos a revisar y entregar.''}. \textbf{Responde:} ¿qué hizo posible la historia B?

  checks:
  - Leí las 2 historias con calma.
  - Identifiqué la diferencia clave.
  - Pensé en mi propia experiencia con trabajos en grupo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 2 historias de coautoría». \textbf{Formato:} respuesta corta (3-4 líneas) sobre qué hizo distinta la B. \textbf{Extensión:} 4 líneas. \textbf{Sabes que terminaste cuando} mencionas el acuerdo previo como clave.

sistematizacion:
  intro: |-
    La diferencia entre la historia A (caos) y la historia B (éxito) es solo \textbf{1 cosa}: \emph{acuerdo de roles antes de empezar}. Ahora aprendes los 4 pasos exactos del acuerdo y las 5 técnicas para no chocar.

  pilares:
  - |-
    \textbf{Los 4 pasos del acuerdo de roles (5 minutos al inicio).} \textbf{(1) Lectura común del tema:} todos los 3 leen el enunciado del trabajo. \emph{``Hacer 6 párrafos sobre los ríos de Colombia''}. Sin lectura común, cada uno entiende algo distinto. \textbf{(2) Lluvia de subtemas:} entre los 3 listan 3-5 subtemas posibles. \emph{``Río Magdalena, río Cauca, río Atrato, río Orinoco''}. \textbf{(3) Asignación de roles:} cada uno toma un subtema. \emph{``Yo Magdalena, tú Cauca, ella Atrato''}. Si alguien quiere un tema específico, hablan y deciden. \textbf{(4) Tiempos y entregas:} acuerdan cuándo termina cada uno. \emph{``Yo termino mi parte el miércoles 6pm, tú jueves 8pm, ella viernes 10am. Revisamos juntos viernes 11am''}.
  - |-
    \textbf{Las 5 técnicas para no chocar durante la coautoría.} (1) \textbf{Secciones bien separadas:} usar encabezados grandes con el nombre del autor (\emph{``Río Magdalena --- María''}). (2) \textbf{Mirar antes de escribir:} cuando entres al documento, fíjate si hay otro cursor en tu zona. Si lo hay, espera un poco o escríbele un comentario. (3) \textbf{No tocar las secciones de los demás}: aunque veas un error o se te ocurra algo mejor. Esa sección es de ellos. (4) \textbf{Comunicarse en paralelo:} mantener un chat de WhatsApp o Teams abierto para coordinar dudas en tiempo real. (5) \textbf{Guardado de seguridad:} cuando termines tu parte, copia tu sección en un archivo aparte en tu propio OneDrive. Así, si algo se daña en el compartido, tu trabajo está respaldado.
  - |-
    \textbf{Las 3 herramientas visuales de Word para coautoría.} \textbf{(a) Cursores con nombres:} cuando otros escriben, ves dónde están con su cursor de color y su nombre flotando. Útil para saber quién está activo y dónde. \textbf{(b) Comentarios al margen:} si quieres sugerir algo en la sección de otro sin escribir directamente, agregas un comentario (clic derecho → Nuevo comentario). El otro lo ve y decide. \textbf{(c) Pestaña ``Personas'':} arriba a la derecha del documento, muestra quiénes están conectados al mismo tiempo (sus íconos). Útil para saber con quién estás coautorando ahora.
  - |-
    \textbf{Errores típicos de equipos novatos en coautoría.} (1) \emph{Empezar sin acuerdo} --- la historia A. (2) \emph{Un solo encargado que hace todo y los demás miran} --- pierde el punto de la coautoría. (3) \emph{Todos escriben en el primer párrafo} --- se borran entre sí. (4) \emph{Nadie revisa al final} --- el documento queda con estilos distintos, fuentes diferentes, contradicciones. (5) \emph{Los 3 son responsables pero al final 1 hace el trabajo de los 2 que no aportaron} --- comunicación clara desde el inicio + responsabilidad lo evita.

  anatomia:
    titulo: 4 pasos + 5 técnicas + 3 herramientas
    body: |-
      \textbf{4 pasos del acuerdo:} lectura común · lluvia de subtemas · asignación · tiempos. \\[1mm]
      \textbf{5 técnicas para no chocar:} secciones separadas · mirar antes · respetar sección ajena · chat paralelo · backup propio. \\[1mm]
      \textbf{3 herramientas Word:} cursores con nombres · comentarios al margen · pestaña Personas.

  errores_comunes: |-
    \textbf{Mitos sobre la coautoría que te encontrarás.} (1) \emph{``Coautoría es muy difícil, mejor cada uno hace su parte aparte''} --- Falso. Con acuerdo claro es más rápido. (2) \emph{``Si soy el mejor, hago todo y firmamos los 3''} --- Mala idea: tus compañeros no aprenden y tú haces trabajo extra. (3) \emph{``En coautoría los cambios se pierden si todos escriben a la vez''} --- Falso. Word maneja muy bien los cambios simultáneos siempre que estén en secciones distintas. (4) \emph{``Coautoría requiere que todos estén conectados al mismo tiempo''} --- Falso. La asincrónica permite que cada uno trabaje cuando pueda.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 4 pasos + 5 técnicas». \textbf{Formato:} 2 bloques. Bloque A: los 4 pasos numerados con 1 línea cada uno. Bloque B: las 5 técnicas numeradas con 1 línea cada una. \textbf{Extensión:} 9 líneas. \textbf{Sabes que terminaste cuando} podrías guiar a 2 compañeros nuevos en coautoría.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Documento colaborativo con 2 compañeros} (35 min · equipo de 3). Esta actividad es \textbf{en equipo}: tú + 2 compañeros van a producir un Word colaborativo en tiempo real (en clase si tienen computadores; o asincrónico durante la semana si no). Tema sugerido: \emph{``3 ríos importantes de Colombia''} o \emph{``3 platos tradicionales del Valle del Cauca''} o lo que acuerden.

  pilares:
  - |-
    \textbf{Paso 1 --- Formen equipo y abran chat (3 min).} Únanse con 2 compañeros. Abran un chat en WhatsApp o Teams. Definan nombre del equipo. Saluden y propongan tema (de los sugeridos o uno propio).
  - |-
    \textbf{Paso 2 --- Acuerdo de roles (5 min).} Sigan los 4 pasos: \emph{(a) lectura común del enunciado}, \emph{(b) lluvia de subtemas} (escriban 3 subtemas en el chat), \emph{(c) asignación} (cada uno toma uno), \emph{(d) tiempos} (acuerden cuándo termina cada uno). Anótenlo en el chat para que nadie olvide.
  - |-
    \textbf{Paso 3 --- Uno de los 3 crea el documento y comparte como editor (3 min).} El que tenga más signal/wifi rápido abre Word Online, crea \emph{Documento en blanco}, lo nombra \texttt{2026-trabajo-colaborativo-[tema]}. En la parte superior escribe el \textbf{acuerdo de roles} (los 3 subtemas + los 3 autores + los 3 tiempos acordados). Después comparte con los otros 2 con permiso \textbf{Puede editar}.
  - |-
    \textbf{Paso 4 --- Escriben cada uno su sección (15-20 min).} Cada uno entra al documento desde su computador (o celular si toca). Busca su sección por su encabezado. \textbf{Importante:} crea primero \textbf{los 3 encabezados grandes} (uno por subtema con nombre del autor). Cada uno escribe \textbf{1 párrafo de 4-5 líneas} sobre su subtema. Aplica formato (negrita en ideas clave, justificado). \emph{Si entras al documento y ves que tu compañero ya está en otra sección, tranquilo: tienen secciones distintas, no se chocan}.
  - |-
    \textbf{Paso 5 --- Revisión conjunta (5 min).} Cuando los 3 terminen, abren juntos el documento. Lo leen completo. ¿Se ve uniforme? ¿Las 3 secciones tienen el mismo formato? ¿Las 3 párrafos están bien escritos? Hacen ajustes finales si necesario.
  - |-
    \textbf{Paso 6 --- Bitácora individual en el cuaderno.} Cada uno (en su propio cuaderno) escribe la \textbf{bitácora}: \emph{(a) Qué subtema me tocó. (b) ¿Cuánto demoré? (c) ¿Qué funcionó del acuerdo de roles? (d) ¿Qué se complicó? (e) ¿Cómo lo resolvimos? (f) ¿Qué haría diferente la próxima vez?}. Firma con nombre y fecha. La bitácora es tan importante como el documento mismo.

  checklist:
    titulo: Antes de cerrar la sesión 6
    items: |-
      \checkbox Formé equipo con 2 compañeros y acordamos roles. \\[1mm]
      \checkbox El documento tiene 3 secciones con encabezados claros. \\[1mm]
      \checkbox Cada estudiante escribió SU sección sin tocar las otras. \\[1mm]
      \checkbox El documento se ve uniforme (mismo formato general). \\[1mm]
      \checkbox Mi bitácora individual tiene las 6 preguntas respondidas. \\[1mm]
      \checkbox La bitácora está firmada con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura del trabajo de equipo.} \textit{Paso 1:} formar equipo + chat + tema. \textit{Paso 2:} acuerdo de 4 pasos. \textit{Paso 3:} crear y compartir documento. \textit{Paso 4:} escribir cada uno su sección. \textit{Paso 5:} revisión conjunta. \textit{Paso 6:} bitácora individual.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi primer documento colaborativo». \textbf{Formato:} datos del equipo + acuerdo de roles + bitácora individual de 6 puntos. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} el documento colaborativo está completo Y tu bitácora está firmada.

  producto_titulo: Documento Word colaborativo de 3 secciones + bitácora individual · firmada
  criterios:
  - El documento tiene acuerdo de roles visible arriba.
  - Hay 3 secciones distintas con encabezados claros.
  - Cada autor escribió un párrafo de 4-5 líneas en su sección.
  - El documento mantiene formato uniforme (no es 'collage' de estilos distintos).
  - La bitácora individual tiene 6 puntos respondidos con honestidad.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del trabajo coordinado)"
    cita: |-
      ``No hay obra grande sin reparto previo. Quien no acuerda al inicio, choca al final.''
    aplicacion: |-
      La diferencia entre la historia A (caos) y la historia B (éxito) no estuvo en el talento de los compañeros, ni en la herramienta, ni en la suerte. Estuvo en \textbf{5 minutos de acuerdo al inicio}. La minga lo sabía hace 100 años. Dussel lo dice en filosofía. Tu equipo lo vive en práctica. \emph{Acordar al inicio ahorra horas al final}. Es una habilidad que vale toda la vida.
    pregunta_espejo: |-
      ¿Cuántos trabajos de grupo se me han complicado por falta de acuerdo inicial?

  estoico:
    autor: "Marco Aurelio (emperador que sabía delegar)"
    cita: |-
      ``Confía en tu equipo lo suficiente para no querer hacer su parte. Esa confianza es la base del trabajo colectivo.''
    aplicacion: |-
      Hay una tentación grande en coautoría: \emph{``yo lo hago todo porque sé que sale mejor''}. Mala idea. Cuando le quitas la parte al compañero, le quitas también el aprendizaje. Y te cargas tú con trabajo de 3. \textbf{Confiar en el equipo es soltar el control sin abandonar la responsabilidad}. Esa habilidad es de adulto. Empezar a desarrollarla en 7° grado es ventaja real.
    pregunta_espejo: |-
      ¿Confío en mi equipo o termino haciendo todo yo por desconfianza?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del trabajo digital)"
    cita: |-
      ``La coautoría digital es la primera escuela de ciudadanía colectiva. Ahí aprendes a hacer cosas grandes con otros.''
    aplicacion: |-
      Los grandes proyectos del mundo --- Wikipedia, GitHub, las series de Netflix, los reportajes de El Tiempo --- los hacen \textbf{equipos de cientos de personas coautorando}. Aprender a coautorar bien en 7° grado te conecta con esa forma de producir. \emph{Es la habilidad central de la economía del conocimiento del siglo XXI}. No es tema escolar: es preparación profesional.
    pregunta_espejo: |-
      ¿Estoy desarrollando habilidad para hacer cosas grandes con otros, o me quedo en el modo individual?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, revisa el documento colaborativo con tus 2 compañeros y haz ajustes finales si se necesitan. La próxima clase aprendes a \textbf{comentar y sugerir} sin escribir directamente --- el oficio de revisar el trabajo ajeno con respeto. Es lo que falta para que tu equipo se vuelva profesional.

web:
  conceptos_clave:
    - termino: Coautoría
      definicion: |-
        Varias personas escribiendo en el mismo archivo a la vez, viendo los cambios de los demás en tiempo real. Microsoft 365 permite hasta cientos de coautores simultáneos en Word, Excel o PowerPoint en línea.
      ejemplo: |-
        Tú y 2 compañeros abren el mismo Word en línea. Cada uno ve los cursores de los otros 2 con sus nombres flotando. Escriben en secciones distintas al mismo tiempo.
      emoji: "🤝"
    - termino: Coautoría sincrónica
      definicion: |-
        Todos los coautores están conectados al mismo tiempo. Útil para sesiones de trabajo intensivas. Requiere coordinación constante (chat paralelo). Es más rápida pero más caótica si no hay acuerdo previo.
      ejemplo: |-
        Los 3 del equipo se citan a las 5pm un viernes para escribir el trabajo juntos en Teams + Word compartido. Una hora intensa pero terminan en una sentada.
      emoji: "⚡"
    - termino: Coautoría asincrónica
      definicion: |-
        Cada coautor entra al documento cuando puede, escribe su parte, sale. Los demás verán los cambios cuando entren después. Ideal para 7° grado: cada estudiante en sus horarios disponibles.
      ejemplo: |-
        María escribe su sección el lunes a las 8pm. Pedro la suya el martes a las 6am. Lucía la suya el miércoles a las 4pm. El documento crece sin que coincidan en tiempo.
      emoji: "⏰"
    - termino: Acuerdo de roles
      definicion: |-
        Los 4 pasos al inicio del trabajo: (1) lectura común del enunciado, (2) lluvia de subtemas, (3) asignación de roles, (4) tiempos de entrega. Sin acuerdo previo, la coautoría se vuelve caos.
      ejemplo: |-
        En 5 minutos: leemos el enunciado, listamos 3 subtemas, cada uno toma uno, acordamos cuándo terminamos. Ese acuerdo ahorra horas después.
      emoji: "📋"
    - termino: Cursores con nombres
      definicion: |-
        Herramienta visual de Word/Excel/PowerPoint en línea: cuando varios coautores están escribiendo, ves cada cursor en un color distinto con el nombre del autor flotando. Te permite saber dónde está cada quien.
      ejemplo: |-
        Mientras escribes tu sección, ves un cursor azul con el nombre 'Pedro' en otra parte del documento. Sabes que él está activo en su sección, no chocan.
      emoji: "🖱️"

  quiz:
    titulo: "¿Sabes hacer coautoría sin chocar?"
    instrucciones: "5 preguntas para verificar que dominas la coautoría con tus 2 compañeros."
    preguntas:
      - enunciado: "Tu equipo va a coautorar un trabajo. ¿Cuál es el PRIMER paso?"
        opciones:
          - "Cada uno empieza a escribir donde quiera."
          - "Acordar roles: leer enunciado juntos, listar subtemas, asignar uno a cada uno, acordar tiempos."
          - "Pelearse por quién hace más."
          - "Un solo encargado hace todo."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Los 4 pasos del acuerdo de roles. Sin acuerdo previo, la coautoría se vuelve caos. 5 minutos de acuerdo ahorran horas de pelea.
        feedback_incorrecto: |-
          Acuerdo de roles primero: leer enunciado, listar subtemas, asignar, acordar tiempos. 5 minutos al inicio ahorran horas al final.
      - enunciado: "Estás coautorando y ves un cursor azul con el nombre de tu compañero en TU sección. ¿Qué haces?"
        opciones:
          - "Lo borro inmediatamente."
          - "Le escribo un comentario al margen preguntándole por qué está ahí."
          - "Lloro."
          - "Cierro el documento y lo culpo después."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Comunicación clara: comentario al margen o mensaje por chat preguntando. No asumes mala intención; preguntas y resuelves.
        feedback_incorrecto: |-
          Comentario al margen o mensaje por chat. Pregunta antes de borrar o reaccionar mal. La coautoría es comunicación constante.
      - enunciado: "Tu compañero terminó su sección pero crees que está mal redactada. ¿Qué haces?"
        opciones:
          - "La reescribo yo sin avisarle."
          - "Le agrego comentarios al margen con sugerencias respetuosas. Él decide si aplica los cambios."
          - "Le digo al profe que está mal."
          - "Borro su sección completa."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Respetas su sección, agregas comentarios constructivos al margen, él decide. Eso es coautoría profesional. Reescribir sin permiso destruye el equipo.
        feedback_incorrecto: |-
          Comentarios al margen con respeto. Tu compañero decide si los aplica. Reescribir su parte sin permiso = romper el equipo.
      - enunciado: "Estás trabajando con 2 compañeros desde casa. ¿Es coautoría sincrónica o asincrónica?"
        opciones:
          - "Sincrónica siempre."
          - "Asincrónica: cada uno escribe cuando puede; no requieren estar conectados al mismo tiempo."
          - "Ninguna, hay que ir al colegio."
          - "Solo si están en la misma casa."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Asincrónica permite que cada uno entre cuando puede. Microsoft 365 actualiza el documento en la nube. Ideal para equipos con horarios distintos.
        feedback_incorrecto: |-
          Asincrónica: cada uno cuando puede, sin coincidir en tiempo. La nube actualiza. Es lo que más se usa en equipos profesionales.
      - enunciado: "Terminan el trabajo colaborativo. ¿Qué hace falta para cerrarlo bien?"
        opciones:
          - "Cada uno se va sin más."
          - "Revisión conjunta del documento completo (que se vea uniforme) + bitácora individual en cuaderno."
          - "Borrar el documento."
          - "Pelear por quién hizo más."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Revisión conjunta cierra el trabajo (formato uniforme, sin contradicciones). Bitácora individual ayuda a aprender qué funcionó y qué no.
        feedback_incorrecto: |-
          Revisión conjunta + bitácora. Sin cierre formal, los proyectos quedan a medias. La bitácora te enseña qué mejorar para la próxima.

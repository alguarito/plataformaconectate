clave: "1-7"
grado: 7
periodo: 1
sesion: 7
completo: true

titulo: "Comentarios y sugerencias --- revisar el trabajo ajeno con respeto"
titulo_portada: |-
  Comentarios
  y sugerencias ---
  revisar el
  trabajo ajeno
  con respeto

producto_final: |-
  \textbf{(a) Una revisión real} del documento de un compañero: abres su archivo (que él te compartió con \emph{``Puede comentar''}) y agregas \textbf{5 comentarios constructivos} usando la fórmula \emph{``observación + razón + propuesta''}; \textbf{(b) tu propio archivo} revisado por un compañero con sus 5 comentarios; \textbf{(c) en el cuaderno}: análisis de \emph{cuáles comentarios aceptaste y por qué}. Más \textbf{manual del revisor responsable} con 5 reglas firmadas.

apertura:
  saber_ancestral: |-
    \textbf{En la minga del Valle del Cauca, había una persona especial: el ``mirador''.} Mientras los 30 trabajadores cosechaban el café en sus surcos, alguien con más experiencia caminaba por todos los surcos \textbf{revisando el trabajo}. No cosechaba: \emph{revisaba}. Veía si los granos verdes se estaban escogiendo bien, si las canastas se llenaban en el orden correcto, si alguien estaba dejando café maduro caer al suelo. \emph{No criticaba a gritos}: se acercaba al trabajador, le decía suavemente: \emph{``Mire, don Pedro, este surco que dejó atrás todavía tiene granos rojos''}. Pedro miraba, asentía, volvía a pasar por ese surco. \textbf{El mirador no estaba para humillar, estaba para mejorar el trabajo del equipo}. Esa figura --- el revisor que ayuda sin herir --- es exactamente lo que necesitas ser cuando comentas el trabajo de un compañero en un documento. Hoy aprendes a comentar bien.

  saber_contemporaneo: |-
    \textbf{Comentar} en Microsoft Word/Excel/PowerPoint es agregar \textbf{notas al margen} del documento que no cambian el texto, solo lo señalan. Otra persona puede leer la nota y decidir si aplica la sugerencia. \textbf{La diferencia con editar:} editar cambia el documento directamente; comentar deja una nota que el dueño puede aceptar o rechazar. \textbf{Cómo se hace en Word:} selecciona el texto sobre el que quieres comentar → clic derecho → \emph{Nuevo comentario}. Aparece un cuadrito amarillo al lado. Ahí escribes tu observación. El dueño verá tu nombre y la nota. Puede responder al comentario (\emph{``gracias, lo cambio''}, \emph{``prefiero dejarlo como está''}) o marcarlo como \emph{resuelto}. \textbf{Los comentarios son la forma profesional de retroalimentar}: en universidades, en trabajos, en libros antes de imprimir. Aprenderlos ahora te diferencia.

  pregunta_puente: |-
    Si un compañero te entrega su ensayo para que se lo revises y tú le dices: \emph{``está mal''}, ¿\textbf{qué aprende} él de tu revisión? Si en cambio le dices: \emph{``este párrafo es confuso porque mezclas 2 ideas. Te sugiero separarlo en 2 párrafos''}, ¿qué cambia?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} la diferencia entre comentarios destructivos y constructivos; (2) sabrás \textbf{aplicar} la fórmula ``observación + razón + propuesta''; (3) podrás \textbf{evaluar} la calidad de un comentario; (4) habrás \textbf{revisado} un documento ajeno con 5 comentarios bien escritos.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: distingues comentarios constructivos vs destructivos, aprendes la fórmula, revisas un documento ajeno, recibes revisión del tuyo.
  a_escuta: |-
    Empezamos analizando 6 comentarios reales y diciendo cuáles son útiles.
  a_sistematizacion: |-
    Después aprendes la fórmula y las 5 reglas del revisor responsable.
  a_praxis: |-
    Con todo claro, intercambias documentos con un compañero y se hacen revisión mutua.
  a_producto: |-
    El producto son los 5 comentarios en el documento ajeno + tu propio archivo revisado + manual del revisor.
  a_evaluacion: |-
    Antes de salir, revisa que tus 5 comentarios cumplen la fórmula y las 5 reglas.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué revisar con respeto es la mejor forma de ayudar.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 6 comentarios, ¿útil o destructivo?} (10 min · individual). Lee estos 6 comentarios que un revisor podría dejar en el trabajo de un compañero. Marca \textbf{ÚTIL (U) o DESTRUCTIVO (D)} en el cuaderno. \emph{(1) ``Está horrible''. (2) ``Este párrafo confunde porque mezclas 2 ideas. Sugiero separarlo''. (3) ``Lo escribiste mal y no se entiende nada''. (4) ``Buen punto en la introducción, agregaría 1 ejemplo concreto''. (5) ``No vale la pena que sigas escribiendo, mejor cambia de tema''. (6) ``El cierre se siente débil, ¿qué tal terminar con una pregunta abierta?''}.

  checks:
  - Leí los 6 comentarios.
  - Marqué U o D en cada uno.
  - Pensé qué hace diferente a un comentario útil de uno destructivo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 6 comentarios analizados». \textbf{Formato:} lista numerada con U/D + 1 razón corta por qué. \textbf{Extensión:} 6 líneas. \textbf{Sabes que terminaste cuando} reconoces que los útiles dan algo concreto (razón + propuesta).

sistematizacion:
  intro: |-
    Los comentarios útiles tienen \textbf{algo en común}: dan información concreta + razón + propuesta. Los destructivos solo emiten juicio sin ayudar. Ahora aprendes la fórmula exacta para escribir comentarios siempre útiles.

  pilares:
  - |-
    \textbf{La fórmula de 3 partes para todo comentario útil.} \textbf{(1) Observación específica:} \emph{qué viste exactamente}. No \emph{``está mal''} sino \emph{``este párrafo no se entiende''}. \textbf{(2) Razón:} \emph{por qué creíste eso}. No \emph{``no se entiende''} sino \emph{``porque mezclas 2 ideas en la misma oración''}. \textbf{(3) Propuesta concreta:} \emph{qué sugieres en cambio}. No \emph{``arréglalo''} sino \emph{``sugiero separarlo en 2 párrafos cortos''}. \textbf{Ejemplo completo:} \emph{``Este párrafo (observación) confunde porque mezclas 2 ideas (razón). Sugiero separarlo en 2 párrafos cortos (propuesta).''}. Los 3 elementos son necesarios. Faltando uno, el comentario se vuelve menos útil.
  - |-
    \textbf{Las 5 reglas del revisor responsable.} (1) \textbf{Comenta el trabajo, no a la persona.} \emph{``Este párrafo es confuso''} sí; \emph{``eres confuso''} NO. (2) \textbf{Empieza por algo positivo.} Antes de criticar, reconoce qué está bien (\emph{``buena introducción''}, \emph{``ejemplo claro''}). Eso te abre la puerta para la crítica. (3) \textbf{Sé específico, no general.} \emph{``Mejóralo''} NO sirve; \emph{``cambia el verbo de la línea 3''} SÍ. (4) \textbf{Sugiere, no impongas.} Usa \emph{``sugiero''}, \emph{``te propongo''}, no \emph{``tienes que''}. El dueño decide. (5) \textbf{Limita la cantidad.} Si dejas 30 comentarios, el dueño se siente atacado. \emph{Máximo 5-8 comentarios por sesión de revisión}. Prioriza los más importantes.
  - |-
    \textbf{Las 2 formas de comentar en Word.} \textbf{(1) Comentario simple:} clic derecho sobre el texto seleccionado → \emph{Nuevo comentario}. Aparece un cuadrito amarillo al lado con tu nombre y la nota. El dueño puede responder o marcar como resuelto. \textbf{(2) Modo Sugerencia (Tracked Changes):} en Word completo (escritorio), hay un modo donde tus cambios al texto aparecen como \emph{sugerencias} (con líneas tachadas o resaltado). El dueño revisa cada sugerencia y decide \emph{Aceptar} o \emph{Rechazar}. En Word Online de 7° grado, lo más usado es el comentario simple.
  - |-
    \textbf{Cómo recibir comentarios sin tomarlo a mal.} Cuando otro te revisa, tu reacción importa. \textbf{Reglas básicas:} (a) \emph{No respondas con rabia, aunque el comentario te duela}. (b) \emph{Lee TODOS los comentarios antes de responder}. (c) \emph{Pregunta si no entiendes} (\emph{``¿podrías explicarme qué quisiste decir?''}). (d) \emph{Decide cuáles aplicar:} no estás obligado a aplicar todos. Algunas sugerencias mejoran tu trabajo; otras son cuestión de estilo personal. (e) \emph{Agradece la revisión}, aunque haya dolido. La gente que te revisa con cuidado te está dando algo valioso.

  anatomia:
    titulo: Fórmula + 5 reglas + 2 formas
    body: |-
      \textbf{Fórmula:} Observación + Razón + Propuesta. \\[1mm]
      \textbf{5 reglas:} \\[1mm]
      \textbf{1.} Comenta trabajo, no persona. \\[1mm]
      \textbf{2.} Empieza por algo positivo. \\[1mm]
      \textbf{3.} Sé específico. \\[1mm]
      \textbf{4.} Sugiere, no impongas. \\[1mm]
      \textbf{5.} Máximo 5-8 comentarios. \\[1mm]
      \textbf{2 formas:} comentario simple (margen) · modo sugerencia (cambios trackeados).

  errores_comunes: |-
    \textbf{Errores frecuentes al comentar.} (1) \emph{Insultar a la persona} (\emph{``eres torpe''}) en lugar del trabajo. (2) \emph{Dejar comentarios vagos} (\emph{``está mal''}, \emph{``mejóralo''}) que no ayudan. (3) \emph{Comentar TODO} --- el dueño se abruma y desestima la crítica útil. (4) \emph{No firmar ni dar contexto} --- el dueño no sabe quién comentó. (5) \emph{Asumir mala intención} cuando el otro recibe tus comentarios mal: la mayoría reacciona inicialmente con dolor; dale tiempo. (6) \emph{Borrar tus comentarios cuando el dueño los acepta} --- mejor marcarlos como \emph{resueltos} (quedan visibles en historial).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Fórmula + 5 reglas del revisor». \textbf{Formato:} bloque A con la fórmula y un ejemplo bueno + un ejemplo malo. Bloque B con las 5 reglas. \textbf{Extensión:} 8 líneas. \textbf{Sabes que terminaste cuando} podrías corregir un comentario destructivo y convertirlo en útil.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Revisión mutua con un compañero} (30 min · pareja). Vas a intercambiar uno de tus archivos de Word con un compañero. Tú revisas el de él, él revisa el tuyo. Cada uno deja 5 comentarios usando la fórmula y las 5 reglas. Al final, miras qué comentarios aceptas o no.

  pilares:
  - |-
    \textbf{Paso 1 --- Forma pareja con un compañero.} Habla con uno (puede ser uno de los del equipo de la S6, o uno nuevo). Acuerden: \emph{``yo te comparto mi Word con permiso comentar, tú me compartes el tuyo igual''}. Cada uno escoge el archivo más sólido que tenga (el de la minga digital de S4, o el colaborativo de S6).
  - |-
    \textbf{Paso 2 --- Compártanse los archivos con permiso ``Puede comentar''.} En OneDrive, abre tu archivo → Compartir → escribe el correo del compañero → cambia el nivel a \textbf{``Puede comentar''} (no editar). Envía. Espera que él haga lo mismo contigo.
  - |-
    \textbf{Paso 3 --- Abre el archivo de tu compañero.} Te llega un correo con el enlace. Haz clic. Se abre el documento en modo lectura (puedes comentar pero no escribir).
  - |-
    \textbf{Paso 4 --- Haz 5 comentarios usando la fórmula.} Lee el documento completo primero. Identifica \textbf{los 5 puntos que más vale la pena comentar} (no escojas los 5 primeros; escoge los 5 más importantes). Para cada uno: selecciona el texto, clic derecho, \emph{Nuevo comentario}. Escribe siguiendo la fórmula: \emph{(observación) (razón) (propuesta)}. \emph{Empieza con un comentario positivo en el primer punto que comentes}. Aplica las 5 reglas en cada comentario.
  - |-
    \textbf{Paso 5 --- Recibe la revisión de tu compañero.} Cuando ambos terminen, abre tu propio archivo: deberías ver 5 comentarios amarillos de tu compañero al margen. \textbf{Léelos todos antes de reaccionar}. Pregunta si alguno no se entiende. Para cada uno: decide si lo \textbf{aceptas} (entonces aplica el cambio que sugiere y marca el comentario como resuelto) o lo \textbf{rechazas} (responde al comentario explicando por qué prefieres dejarlo así).
  - |-
    \textbf{Paso 6 --- Reflexión en cuaderno + manual del revisor responsable + firma.} En el cuaderno escribe: \emph{``Recibí 5 comentarios de [nombre]. Acepté \_\_\_ y rechacé \_\_\_. El que más me sirvió fue: ___. El que me costó aceptar fue: ___''}. Después escribe \textbf{tu manual personal del revisor responsable} con las 5 reglas que prometes seguir cuando revises otros. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S7
    items: |-
      \checkbox Intercambié archivos con un compañero con permiso 'Puede comentar'. \\[1mm]
      \checkbox Dejé 5 comentarios en el documento del compañero. \\[1mm]
      \checkbox Cada comentario sigue la fórmula (observación + razón + propuesta). \\[1mm]
      \checkbox Mi compañero dejó comentarios en mi archivo y los revisé. \\[1mm]
      \checkbox Decidí cuáles aceptar y cuáles rechazar. \\[1mm]
      \checkbox Mi manual del revisor responsable está firmado.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} formar pareja. \textit{Paso 2:} compartir con 'Puede comentar'. \textit{Paso 3:} abrir archivo ajeno. \textit{Paso 4:} 5 comentarios con fórmula. \textit{Paso 5:} recibir y decidir. \textit{Paso 6:} reflexión + manual + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi primera revisión mutua». \textbf{Formato:} datos de la pareja + análisis de comentarios recibidos + manual del revisor responsable. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} tu archivo tiene comentarios resueltos o respondidos.

  producto_titulo: Revisión mutua de documentos · 5 comentarios constructivos · manual del revisor firmado
  criterios:
  - Hay 5 comentarios en el documento del compañero siguiendo la fórmula.
  - El estudiante recibió 5 comentarios en su propio documento.
  - Los comentarios fueron procesados (aceptados o respondidos con criterio).
  - El análisis en cuaderno menciona cuáles aceptó y por qué.
  - El manual del revisor responsable tiene 5 reglas firmadas.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del cuidado por el otro)"
    cita: |-
      ``Criticar bien es un acto de amor. Criticar mal es un acto de violencia. La fórmula los separa.''
    aplicacion: |-
      El mirador de la minga \textbf{amaba el trabajo del equipo}: por eso se tomaba el trabajo de revisar. Si no le hubiera importado, habría dejado los errores pasar y el café perdido. Comentar el trabajo de un compañero con cuidado es \emph{cuidarlo}, no atacarlo. La fórmula (observación + razón + propuesta) es la diferencia entre ayudar y herir. Lo mismo aplica a tus amigos, a tu familia, a tu futuro equipo profesional.
    pregunta_espejo: |-
      ¿Cuando crítico a otros, mi tono comunica cuidado o violencia?

  estoico:
    autor: "Marco Aurelio (emperador que recibía consejos diariamente)"
    cita: |-
      ``Quien sabe recibir crítica es más libre que quien solo sabe darla. Las dos disciplinas son necesarias.''
    aplicacion: |-
      Marco Aurelio era el emperador romano. Tenía \emph{poder absoluto}, pero \textbf{pedía consejo todos los días} a sus asesores. ¿Por qué? Porque sabía que \emph{recibir crítica con humildad lo hacía mejor gobernante}. Tú no eres emperador (todavía), pero la misma virtud aplica: \emph{quien recibe revisión sin amargarse mejora; quien la rechaza se estanca}. Hoy entrenaste esa virtud doble: dar y recibir crítica con respeto.
    pregunta_espejo: |-
      ¿Cómo reacciono cuando me critican? ¿Con apertura o con defensa inmediata?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la cultura del feedback)"
    cita: |-
      ``Las culturas que dominan el comentario constructivo dominan la innovación. Las que no, se estancan.''
    aplicacion: |-
      Los equipos profesionales que producen \emph{cosas excelentes} tienen una cosa en común: \textbf{retroalimentan mucho y bien}. Los que producen mediocre suelen evitar la crítica (\emph{``no quiero que se enojen''}) o hacerlo mal (\emph{``está pésimo''}). \emph{La diferencia entre los dos resultados está en la calidad del comentario}. Aprender hoy a comentar bien te coloca en el primer grupo.
    pregunta_espejo: |-
      ¿En mis grupos suelo dar comentarios constructivos o me quedo callado/destructivo?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, si revisas el trabajo de un familiar (un hermano, un compañero), aplica la fórmula. Verás que la persona reacciona mejor. La próxima clase aprendes sobre \textbf{versiones e historial}: cómo OneDrive guarda automáticamente cada cambio para que NUNCA pierdas trabajo, incluso si lo dañas por error.

web:
  conceptos_clave:
    - termino: Comentario al margen
      definicion: |-
        Nota digital que se agrega al lado del texto, sin cambiar el contenido del documento. Aparece como un cuadrito amarillo con el nombre del autor del comentario. El dueño del documento puede responder, aceptar o marcar como resuelto.
      ejemplo: |-
        En Word seleccionas el texto que quieres comentar, clic derecho, 'Nuevo comentario'. Aparece tu nombre y el texto del comentario al lado. Es como una nota adhesiva digital.
      emoji: "💬"
    - termino: Fórmula del comentario útil
      definicion: |-
        Las 3 partes que todo buen comentario debe tener: (1) observación específica (qué viste), (2) razón (por qué creíste eso), (3) propuesta concreta (qué sugieres en cambio). Faltando alguna, el comentario pierde utilidad.
      ejemplo: |-
        'Este párrafo (observación) confunde porque mezclas 2 ideas (razón). Sugiero separarlo en 2 párrafos (propuesta).' Comentario útil completo.
      emoji: "✅"
    - termino: 5 reglas del revisor responsable
      definicion: |-
        Las 5 normas para comentar con respeto: (1) comenta trabajo, no persona, (2) empieza por algo positivo, (3) sé específico, (4) sugiere sin imponer, (5) máximo 5-8 comentarios por sesión.
      ejemplo: |-
        Antes de criticar, reconoces algo bueno. Hablas del trabajo ('este párrafo'), no de la persona ('tú eres'). Sugieres ('te propongo'), no impones ('tienes que').
      emoji: "📋"
    - termino: Modo Sugerencia (Tracked Changes)
      definicion: |-
        Modo de Word donde los cambios que haces al texto aparecen como sugerencias (con líneas tachadas o resaltado) en lugar de aplicarse directamente. El dueño del documento revisa cada sugerencia y decide aceptar o rechazar.
      ejemplo: |-
        En Word completo activas 'Control de cambios'. Tachas la palabra 'pequeño' y escribes 'chico'. El dueño ve los dos opciones y decide cuál prefiere con un clic.
      emoji: "✏️"
    - termino: Recibir crítica con apertura
      definicion: |-
        La disciplina de leer comentarios sin reaccionar con rabia, preguntar si no entiendes, decidir cuáles aplicar y cuáles no, y agradecer la revisión. Es habilidad de adulto que se entrena.
      ejemplo: |-
        Tu compañero te dejó 5 comentarios. Los lees todos. Algunos aceptas, otros respondes 'prefiero dejarlo así'. Le das las gracias por revisar. Esa es apertura sana.
      emoji: "🌱"

  quiz:
    titulo: "¿Sabes revisar el trabajo ajeno con respeto?"
    instrucciones: "5 preguntas para verificar que dominas la fórmula y las 5 reglas del revisor."
    preguntas:
      - enunciado: "Tu compañero escribió un párrafo confuso. ¿Cuál comentario es ÚTIL?"
        opciones:
          - "Está mal."
          - "Este párrafo confunde porque mezclas 2 ideas. Sugiero separarlo en 2 párrafos cortos."
          - "Reescribe todo."
          - "No entiendo nada."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Cumple la fórmula: observación (confunde) + razón (mezclas 2 ideas) + propuesta (separarlo). El comentario que aporta vale 10 veces más que los vagos.
        feedback_incorrecto: |-
          Fórmula del comentario útil: observación + razón + propuesta. 'Está mal' falla las 3 partes. El útil dice qué, por qué y qué hacer.
      - enunciado: "Tu compañero te dejó un comentario que no entiendes. ¿Qué haces?"
        opciones:
          - "Me enojo y respondo con otro insulto."
          - "Le pregunto: '¿podrías explicarme qué quisiste decir?'"
          - "Ignoro el comentario."
          - "Borro el documento."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Preguntar cuando no entiendes es señal de madurez. La conversación clara resuelve. Ignorar o reaccionar mal cierra puertas.
        feedback_incorrecto: |-
          Pregunta sin pena. Si no entiendes, mejor preguntar que asumir mala intención. La comunicación clara es la base de la crítica útil.
      - enunciado: "Vas a comentar el trabajo de un compañero. ¿Cuántos comentarios máximo dejas por sesión?"
        opciones:
          - "30 comentarios para cubrir todo."
          - "5-8 comentarios priorizando los más importantes."
          - "1 solo."
          - "Tantos como puedas, mientras más mejor."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. 5-8 comentarios por sesión. Más se vuelve abrumador y desestima la crítica útil. Menos puede faltar lo esencial. Es el punto medio.
        feedback_incorrecto: |-
          5-8 comentarios. Suficiente para los puntos clave, no tantos que abrumen. Si hay más que decir, hazlo en una segunda sesión de revisión.
      - enunciado: "Tu compañero te dejó 5 comentarios. Algunos te molestan. ¿Qué haces?"
        opciones:
          - "Borro los comentarios sin leer."
          - "Los leo todos, decido cuáles aceptar y cuáles responder con respeto. Agradezco la revisión."
          - "Le respondo con insulto."
          - "Cambio el archivo de carpeta."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Madurez: leer todos, decidir con criterio, responder con respeto, agradecer. Recibir crítica bien es disciplina de adulto. Reaccionar mal cierra el equipo.
        feedback_incorrecto: |-
          Madurez: leer, decidir, responder con respeto. La crítica del compañero (aunque duela) muchas veces te ayuda a mejorar. Agradecerla es señal de fuerza, no de debilidad.
      - enunciado: "¿Cuál de estos comentarios es más útil para un compañero?"
        opciones:
          - "Tu trabajo es horrible."
          - "Eres un mal escritor."
          - "Buena introducción. En el párrafo 3, la idea X queda perdida; te sugiero moverla al inicio del párrafo."
          - "No tienes futuro como escritor."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Cumple las 5 reglas: empieza por lo positivo (buena introducción), comenta el trabajo (no a la persona), es específico (párrafo 3), sugiere (no impone), y es 1 comentario claro.
        feedback_incorrecto: |-
          El útil empieza positivo, comenta el trabajo (no la persona), es específico y sugiere con respeto. Los otros son ataques personales que no ayudan a mejorar el trabajo.

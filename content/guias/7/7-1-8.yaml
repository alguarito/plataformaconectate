clave: "1-8"
grado: 7
periodo: 1
sesion: 8
completo: true

titulo: "Versiones e historial --- el sistema recuerda todo lo que escribiste"
titulo_portada: |-
  Versiones e
  historial ---
  el sistema
  recuerda todo
  lo que hice

producto_final: |-
  Una \textbf{auditoría del historial} de uno de tus archivos en OneDrive: \textbf{(a) abres el historial de versiones} de un documento; \textbf{(b) identificas} mínimo 3 versiones distintas con sus fechas; \textbf{(c) practicas restaurar} una versión anterior y volver a la actual; \textbf{(d) en el cuaderno}: dibujo de la pantalla \emph{Historial de versiones} con las versiones identificadas + las 4 reglas de uso responsable del historial.

apertura:
  saber_ancestral: |-
    \textbf{En el taller de doña Carmen la costurera del Valle del Cauca, había una costumbre estricta: nunca botar las piezas viejas.} Cuando un cliente le pedía un vestido a doña Carmen y después del primer corte cambiaba de idea (\emph{``mejor más largo''}, \emph{``mejor mangas cortas''}), \textbf{ella guardaba TODOS los pedazos cortados}. Si después al cliente se le ocurría \emph{``no, mejor sí lo quería corto''}, doña Carmen no tenía que empezar de cero: \emph{``Aquí está el pedazo, lo volvemos a meter''}. \textbf{Cada decisión tenía marcha atrás}. Esa virtud --- guardar lo que se ha hecho para poder regresar a versiones anteriores --- es exactamente lo que hace OneDrive con tus archivos. Cada vez que guardas un cambio, \textbf{no se borra el anterior}: queda \emph{una versión nueva}, y la anterior queda guardada por si te arrepientes. \emph{En el campo se llamaba ``no botar las piezas''. En digital se llama ``historial de versiones''.}

  saber_contemporaneo: |-
    El \textbf{historial de versiones} es una función automática de OneDrive (y de Google Drive, y de la mayoría de servicios en la nube). Cada vez que el archivo se modifica de manera significativa --- o cada cierto tiempo --- \textbf{el sistema guarda una versión completa} del archivo. Tú puedes ver el historial de versiones, leer cualquier versión anterior, e incluso \textbf{restaurar} una versión vieja como la actual. \textbf{¿Para qué sirve?} (1) Si cambias un archivo y te arrepientes, vuelves a la versión anterior. (2) Si un compañero (con permiso editor) daña algo, restauras tu versión. (3) Si quieres saber qué decía el documento ayer, lo abres en versión anterior sin cambiar el actual. (4) Si pierdes algo por error, no se pierde para siempre. \textbf{En Microsoft 365, OneDrive guarda hasta 25 versiones de cada archivo durante 30 días}. Algunas empresas configuran más.

  pregunta_puente: |-
    Estuviste 2 horas escribiendo un trabajo en línea. De repente borras por error un párrafo importante y guardas sin querer. ¿\textbf{Se perdió para siempre} o hay forma de recuperarlo sin haber hecho copia manual?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} qué es el historial de versiones y cómo se accede; (2) sabrás \textbf{aplicar} la restauración de una versión anterior; (3) podrás \textbf{evaluar} cuándo usar el historial vs hacer copia manual; (4) habrás \textbf{auditado} el historial de uno de tus archivos.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: imaginas el caso de pérdida, aprendes a abrir el historial, restauras una versión, auditas tu archivo.
  a_escuta: |-
    Empezamos con 4 casos comunes de pérdida y cómo se solucionan.
  a_sistematizacion: |-
    Después aprendes cómo abrir y leer el historial, y las 4 reglas de uso responsable.
  a_praxis: |-
    Con todo claro, abres uno de tus archivos y exploras su historial en OneDrive.
  a_producto: |-
    El producto es la auditoría + dibujo de la pantalla + 4 reglas firmadas.
  a_evaluacion: |-
    Antes de salir, verifica que puedes navegar entre versiones y restaurar una.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué guardar lo que se ha hecho es disciplina del trabajo serio.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 4 casos comunes de pérdida} (10 min · individual). Lee estos 4 casos. Para cada uno, escribe en el cuaderno \textbf{si el historial de versiones podría salvar a la persona y por qué}. \emph{(1) Lucía escribió 3 párrafos en su Word, decidió empezar de cero, los borró y guardó. Una hora después se arrepintió.} \emph{(2) Pedro compartió su archivo con un compañero como editor. El compañero, sin querer, borró toda la sección de Pedro. (3) María entregó su trabajo al profe. El profe lo modificó por error y le aceptó cambios. María quiere ver el documento como estaba antes de la modificación. (4) David trabajó en un Excel durante 1 hora. La sesión expira por inactividad y al volver ve cosas raras. Quiere saber qué cambió.}

  checks:
  - Leí los 4 casos con calma.
  - Decidí si el historial ayudaría en cada uno.
  - Pensé qué se haría sin historial.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 4 casos de pérdida». \textbf{Formato:} lista numerada con respuesta corta. \textbf{Extensión:} 4 líneas. \textbf{Sabes que terminaste cuando} reconoces que el historial salva en los 4 casos.

sistematizacion:
  intro: |-
    Los 4 casos se solucionan con \textbf{historial de versiones}. Ahora aprende cómo acceder a él y las 4 reglas para usarlo bien.

  pilares:
  - |-
    \textbf{Cómo abrir el historial de versiones en OneDrive (Word, Excel, PowerPoint).} \textbf{Método 1 desde el archivo abierto:} con el documento abierto, ve a la pestaña \emph{Archivo} (arriba a la izquierda) → \emph{Información} → \emph{Historial de versiones} (o \emph{Versiones anteriores}). Aparece un panel lateral con la lista de versiones (fecha y autor de cada cambio). \textbf{Método 2 desde OneDrive:} en OneDrive, encuentra el archivo, haz clic derecho → \emph{Historial de versiones}. Mismo panel. \textbf{Lo que ves:} lista de versiones, cada una con \emph{fecha y hora exactas} + \emph{nombre del autor que hizo el cambio}.
  - |-
    \textbf{Cómo navegar y restaurar versiones.} \textbf{(a) Ver una versión anterior:} haz clic en la fecha de la versión que te interesa. Se abre la versión en otra ventana o pestaña, solo lectura. La actual sigue intacta. \textbf{(b) Restaurar versión anterior:} si decides que esa versión es la que quieres mantener, hay un botón \emph{``Restaurar''}. Eso convierte esa versión vieja en la actual (la actual pasa a versión anterior). \textbf{(c) Copiar parte de versión anterior:} si solo quieres recuperar un párrafo específico, copia el texto de la versión anterior y pégalo en la actual.
  - |-
    \textbf{Las 4 reglas del uso responsable del historial.} (1) \textbf{Antes de restaurar, lee con calma.} A veces el problema no era la versión, sino tu memoria. Lee la versión vieja en otra pestaña antes de decidir restaurarla. (2) \textbf{Guarda nota de qué restauraste y por qué.} En el cuaderno o en un comentario del archivo. Si después aparece otro problema, sabes qué hiciste. (3) \textbf{No restaures versiones de hace mucho tiempo sin pensar.} Si el archivo lleva 1 mes evolucionando, restaurar la versión de hace 3 semanas pierde el trabajo de las últimas semanas. (4) \textbf{El historial no reemplaza el backup manual de cosas críticas.} Para trabajos importantes (proyecto final, tesis), también copia a USB o a otro lugar. Es como tener doble seguro.
  - |-
    \textbf{Diferencia entre historial vs papelera.} \textbf{Historial} = versiones de un archivo que aún existe (cambios dentro del archivo). \textbf{Papelera} = archivos completos que fueron borrados pero pueden recuperarse durante 30 días. Si borraste un archivo completo, usa la papelera. Si dañaste un archivo (pero existe), usa el historial. Las dos son herramientas distintas que se complementan.

  anatomia:
    titulo: Acceso + restauración + 4 reglas
    body: |-
      \textbf{Acceso:} Archivo → Información → Historial de versiones (o clic derecho desde OneDrive). \\[1mm]
      \textbf{Restauración:} clic en fecha → leer versión → botón Restaurar. \\[1mm]
      \textbf{4 reglas:} lee antes · guarda nota · no restaures muy atrás sin pensar · backup manual para lo crítico. \\[1mm]
      \textbf{Historial vs Papelera:} historial cambia dentro del archivo · papelera recupera archivos borrados.

  errores_comunes: |-
    \textbf{Mitos sobre el historial de versiones.} (1) \emph{``El historial guarda para siempre''} --- Falso. OneDrive guarda 25 versiones durante 30 días. Después se borran las viejas. (2) \emph{``Restaurar una versión borra el resto del historial''} --- Falso. La versión actual se vuelve una versión más; las viejas siguen. (3) \emph{``Solo el dueño ve el historial''} --- Falso. Cualquier persona con permiso editor puede verlo. (4) \emph{``El historial no funciona si trabajaste offline''} --- Cierto en parte: si trabajaste offline, los cambios se suben cuando vuelves a tener internet, pero las versiones se cuentan distinto.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Cómo usar el historial». \textbf{Formato:} bloque A con el camino paso a paso para abrir el historial. Bloque B con las 4 reglas. \textbf{Extensión:} 8 líneas. \textbf{Sabes que terminaste cuando} podrías guiar a un compañero a abrir el historial en su computador.

praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Auditoría del historial de uno de tus archivos} (28 min · individual). Vas a abrir uno de tus archivos en OneDrive y explorar su historial real. La idea es \emph{hacerte amigo} del historial antes de necesitarlo en una emergencia.

  pilares:
  - |-
    \textbf{Paso 1 --- Escoge el archivo.} Elige el archivo más activo que tengas: el de la S4 (mi-vision-minga-digital), el de la S5 (compartido), o el colaborativo de S6. Mientras más cambios haya tenido, más versiones tendrá su historial.
  - |-
    \textbf{Paso 2 --- Abre el archivo y entra al historial.} En OneDrive: clic derecho sobre el archivo → \emph{Historial de versiones}. O dentro del archivo abierto: \emph{Archivo → Información → Historial de versiones}. Aparece un panel lateral con la lista de versiones.
  - |-
    \textbf{Paso 3 --- Identifica 3 versiones.} En tu cuaderno escribe la lista de versiones que ves, con fecha exacta y autor: \emph{(1) Versión más reciente: [fecha] [tu nombre]. (2) Versión intermedia: [fecha] [autor]. (3) Versión más antigua que aparece: [fecha] [autor]}. Si hay menos de 3 versiones (el archivo es muy nuevo), edita el archivo, guarda, y vuelve al historial. Una vez tengas mínimo 3, sigue.
  - |-
    \textbf{Paso 4 --- Abre una versión anterior y compárala con la actual.} Haz clic en la fecha de la versión intermedia (no la más antigua, una del medio). Se abre en otra pestaña. Compara: ¿qué tenía esa versión que no tiene la actual? ¿Qué se agregó? ¿Qué se quitó? Anota 2-3 diferencias en el cuaderno.
  - |-
    \textbf{Paso 5 --- Practica restaurar (con cuidado).} Aquí lo importante: vas a restaurar la versión intermedia y después volver a la actual. \emph{(a)} En la versión intermedia abierta, busca el botón \textbf{``Restaurar''}. Haz clic. Acepta el mensaje. Ahora esa versión es la actual. \emph{(b) Inmediatamente} vuelve al historial: ahora la que era la actual antes está como una versión más arriba. \emph{(c) Haz clic en ella y restáurala}. Vuelves al estado original. Esto te entrena en que \textbf{restaurar no destruye, solo reordena}.
  - |-
    \textbf{Paso 6 --- Dibujo del historial + 4 reglas firmadas + reflexión.} En el cuaderno haz un \textbf{boceto del panel de historial} (un panel lateral con lista de fechas y autores). Etiqueta: \emph{``Aquí veo todas las versiones de mi archivo''}. Después escribe las 4 reglas del uso responsable y palomita ✓ las que te comprometes a cumplir. Reflexión: \emph{``Hoy descubrí que en OneDrive nada se pierde de verdad. La regla que más me servirá es...''}. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S8
    items: |-
      \checkbox Abrí el historial de versiones de un archivo real. \\[1mm]
      \checkbox Identifiqué mínimo 3 versiones con fecha y autor. \\[1mm]
      \checkbox Abrí una versión anterior y la comparé con la actual. \\[1mm]
      \checkbox Practiqué restaurar una versión y volver a la actual. \\[1mm]
      \checkbox Hice boceto del panel de historial en el cuaderno. \\[1mm]
      \checkbox Las 4 reglas del uso responsable están firmadas.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} escoger archivo. \textit{Paso 2:} abrir historial (clic derecho). \textit{Paso 3:} 3 versiones identificadas. \textit{Paso 4:} comparar versión anterior con actual. \textit{Paso 5:} restaurar y volver. \textit{Paso 6:} boceto + 4 reglas + reflexión + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} Título: «Actividad 3 --- Mi auditoría del historial». \textbf{Formato:} lista de versiones + diferencias detectadas + boceto + reglas firmadas. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} confías en que tu trabajo está seguro porque conoces cómo recuperar versiones anteriores.

  producto_titulo: Auditoría del historial · 3 versiones identificadas · restauración practicada · 4 reglas firmadas
  criterios:
  - Hay 3 versiones distintas identificadas con fecha y autor.
  - El estudiante comparó al menos 1 versión anterior con la actual.
  - El estudiante practicó restaurar una versión y volver a la original.
  - El boceto del panel de historial está en el cuaderno.
  - Las 4 reglas del uso responsable están firmadas.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la memoria y la justicia)"
    cita: |-
      ``Lo que se guarda se puede defender. Lo que se borra sin registro, no.''
    aplicacion: |-
      Hay culturas que guardan todo lo que escriben (\emph{archivos de tribunales, actas de juntas, cartas familiares}) y culturas que botan sin registro. \textbf{Las primeras pueden defenderse cuando alguien las acusa injustamente}: \emph{``aquí está el documento que prueba''}. Las segundas dependen de la memoria humana, que falla. OneDrive es un archivo automático que defiende tu trabajo: \emph{``aquí está la versión de hace 2 semanas, prueba que yo sí entregué a tiempo''}. Esa virtud (guardar para defender) es antigua y sigue siendo poderosa.
    pregunta_espejo: |-
      ¿Estoy aprovechando el archivo automático que OneDrive me da, o lo ignoro?

  estoico:
    autor: "Marco Aurelio (emperador que documentaba sus decisiones)"
    cita: |-
      ``Quien registra su trabajo no teme el olvido. Quien no registra, depende de la memoria, que es traidora.''
    aplicacion: |-
      Marco Aurelio escribía sus reflexiones diarias en un cuaderno (\emph{Meditaciones}). Por eso las conservamos 1800 años después. Si las hubiera dejado solo en su cabeza, se habrían perdido. \textbf{Tu trabajo en OneDrive es como esas Meditaciones}: queda registrado paso a paso. El historial de versiones es tu cuaderno automático. \emph{No depende de tu memoria. No depende de que recordaras guardar. Está ahí porque el sistema lo hizo por ti}. Esa seguridad permite hacer trabajo más arriesgado y creativo.
    pregunta_espejo: |-
      ¿Confío más en mi memoria que en mis archivos, sabiendo que la memoria falla?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la era del archivo digital)"
    cita: |-
      ``El historial automático es la promesa de la nube: que tu trabajo no depende de tu propia disciplina perfecta. La nube te perdona errores.''
    aplicacion: |-
      Antes, si se te olvidaba guardar con \texttt{Ctrl+G} en Word de escritorio, perdías horas. \textbf{La nube cambió eso: te perdona los olvidos}. Pero la condición es que \emph{conozcas el historial y sepas usarlo}. Quien no sabe, pierde igual que antes. Quien sabe, opera con seguridad. La diferencia entre los dos es 10 minutos de aprender una herramienta. \emph{Hoy fue ese día}.
    pregunta_espejo: |-
      ¿Voy a aprovechar el perdón automático de la nube, o seguir trabajando con miedo a perder?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, abre el historial de versiones de al menos 2 archivos distintos. Familiarízate. Verifica que entiendes cómo navegar entre versiones. La próxima clase aprendes \textbf{Outlook y Teams}: el correo institucional + las reuniones virtuales profesionales. El periodo entra en su recta final.

web:
  conceptos_clave:
    - termino: Historial de versiones
      definicion: |-
        Función automática de OneDrive (y otros servicios en la nube) que guarda copias del archivo cada vez que se modifica. Te permite ver versiones anteriores y restaurarlas si lo necesitas. OneDrive guarda hasta 25 versiones durante 30 días.
      ejemplo: |-
        Escribiste 3 párrafos, los borraste por error, guardaste sin querer. Abres el historial, ves la versión de hace 2 horas con los 3 párrafos. Restauras. Recuperaste todo.
      emoji: "🕰️"
    - termino: Restaurar versión
      definicion: |-
        Acción de tomar una versión anterior del archivo y hacerla la versión actual. NO destruye las otras versiones: la actual que reemplazas pasa a ser una versión más en el historial. Reversible.
      ejemplo: |-
        Restauras la versión del lunes (que tenía un párrafo importante). La versión del martes (donde lo habías borrado) ahora aparece como versión anterior. Puedes volver atrás si te arrepientes.
      emoji: "↩️"
    - termino: Historial vs Papelera
      definicion: |-
        Historial: cambios DENTRO de un archivo que aún existe. Te permite restaurar partes que cambiaron. Papelera: archivos COMPLETOS que fueron borrados. Te permite recuperar archivos enteros en 30 días.
      ejemplo: |-
        Borraste por error un párrafo de tu Word: usa el historial para recuperar el párrafo. Borraste el Word completo: usa la Papelera de OneDrive para restaurarlo.
      emoji: "🗑️"
    - termino: 4 reglas del historial responsable
      definicion: |-
        Las normas para usar el historial sin causar más problemas: (1) lee la versión antes de restaurar, (2) guarda nota de qué hiciste, (3) no restaures muy atrás sin pensar (pierdes trabajo posterior), (4) el historial no reemplaza el backup manual para cosas críticas.
      ejemplo: |-
        Antes de restaurar la versión de hace 2 semanas, lees: '¿realmente quiero perder el trabajo de las últimas semanas?' Si dudas, no restaures: copia las partes que necesitas y pégalas en la actual.
      emoji: "📋"
    - termino: Backup manual
      definicion: |-
        Copia adicional que tú haces aparte del sistema automático. Para trabajos críticos (tesis, proyectos finales): además del historial automático de OneDrive, también copias el archivo a una USB o a otro servicio en la nube (Google Drive, Dropbox).
      ejemplo: |-
        Para tu proyecto final de fin de año: el archivo vive en OneDrive (con historial) Y tienes copia en USB Y subiste copia a Google Drive. Doble o triple seguro para lo importante.
      emoji: "💾"

  quiz:
    titulo: "¿Sabes usar el historial de versiones?"
    instrucciones: "5 preguntas para verificar que dominas el historial y la restauración."
    preguntas:
      - enunciado: "Borraste por error un párrafo importante de tu Word y guardaste. ¿Está perdido?"
        opciones:
          - "Sí, sin esperanza."
          - "No. Abro el historial de versiones de OneDrive, busco una versión anterior, copio el párrafo o restauro la versión completa."
          - "Solo si pagué premium."
          - "Solo si era una USB."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El historial de versiones es tu salvavidas. OneDrive guarda 25 versiones durante 30 días. Restauras o copias lo que necesites.
        feedback_incorrecto: |-
          OneDrive guarda historial automático. Abres Archivo → Información → Historial. Encuentras versión con el párrafo, lo copias y lo pegas. O restauras toda la versión.
      - enunciado: "¿Cuánto tiempo guarda OneDrive las versiones anteriores?"
        opciones:
          - "1 año."
          - "Hasta 25 versiones durante 30 días aproximadamente."
          - "Para siempre."
          - "1 hora."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. 25 versiones × 30 días. Después se borran las viejas. Para trabajos críticos (tesis), además del historial conviene tener backup manual.
        feedback_incorrecto: |-
          25 versiones durante 30 días. Para lo crítico (proyecto final), backup manual adicional en USB o Google Drive. Doble seguro.
      - enunciado: "Restauras una versión de hace 2 semanas. ¿Qué pasa con el trabajo de las últimas 2 semanas?"
        opciones:
          - "Se pierde para siempre."
          - "La versión actual (de las últimas 2 semanas) pasa a ser una versión más en el historial. Puedes volver si te arrepientes."
          - "Se mezclan automáticamente."
          - "El archivo se borra."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Restaurar no destruye: solo reordena. La actual que reemplazas se convierte en versión anterior. Puedes ir y venir sin perder nada.
        feedback_incorrecto: |-
          Restaurar es reversible. La que era actual pasa a ser versión anterior. Tu trabajo de las 2 semanas sigue accesible en el historial. Es seguro experimentar.
      - enunciado: "¿Cuál es la diferencia entre HISTORIAL y PAPELERA en OneDrive?"
        opciones:
          - "Son lo mismo."
          - "Historial = versiones de un archivo que aún existe. Papelera = archivos completos borrados (recuperables 30 días)."
          - "Historial solo en Word; Papelera solo en Excel."
          - "Papelera se borra cada hora."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Historial = cambios DENTRO del archivo. Papelera = archivo COMPLETO borrado. Las dos son herramientas distintas que se complementan.
        feedback_incorrecto: |-
          Historial: cambios DENTRO de un archivo activo. Papelera: archivos completos borrados (30 días para restaurar). Las dos te protegen pero en distintos escenarios.
      - enunciado: "Tu compañero (con permiso editor) borró sin querer toda tu sección del trabajo grupal. ¿Qué haces?"
        opciones:
          - "Me enojo y le digo al profe."
          - "Abro el historial, encuentro la versión donde mi sección estaba, restauro o copio mi sección desde ahí."
          - "Reescribo todo desde cero."
          - "Borro el archivo."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. El historial salva trabajo perdido por errores ajenos. Restauras o copias la parte borrada. Después hablas con el compañero sobre los cuidados al editar.
        feedback_incorrecto: |-
          Historial al rescate. Restauras o copias tu sección desde una versión anterior. La coautoría se vuelve segura cuando sabes que nada se pierde permanentemente.

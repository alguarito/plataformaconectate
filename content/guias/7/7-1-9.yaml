clave: "1-9"
grado: 7
periodo: 1
sesion: 9
completo: true

titulo: "Outlook y Teams --- comunicarme con voz profesional"
titulo_portada: |-
  Outlook y
  Teams ---
  comunicarme
  con voz
  profesional

producto_final: |-
  \textbf{(a) 3 correos profesionales reales enviados desde Outlook} institucional (uno al profe, uno al coordinador, uno a un compañero); \textbf{(b) 1 reunión virtual programada} en Teams con tu equipo de la S6 (un equipo de 3); \textbf{(c) en el cuaderno}: tabla comparativa Outlook vs Teams vs WhatsApp con 5 criterios + bitácora de la reunión virtual.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural de Cartago tenía dos formas distintas de comunicar con la comunidad de la vereda La Plata.} Para asuntos \textbf{formales} (anuncios al rector, peticiones al alcalde, cartas de recomendación de sus alumnos), \emph{escribía una carta a mano} con letra clara, sobre, sello y firma. Tomaba 1 día en hacerla bien. Para asuntos \textbf{cotidianos} (avisar a una mamá que su hijo se enfermó, coordinar quién traía cuál material), iba a su casa o mandaba un \emph{recado verbal} con otro niño. \textbf{Eran 2 canales distintos para situaciones distintas}: la carta para lo serio que queda registrado; el recado para lo rápido que no necesita papel. \emph{Confundir los dos era ridículo}: nadie escribía una carta formal para decir \emph{``traiga lápiz mañana''}, ni mandaba recado verbal para una petición al alcalde. Hoy con tu cuenta institucional tienes los mismos 2 canales: \textbf{Outlook} (la carta digital) y \textbf{Teams} (el recado digital).

  saber_contemporaneo: |-
    \textbf{Outlook} es el cliente de correo electrónico institucional de Microsoft. Lo usas para \textbf{comunicación formal asincrónica}: la persona te responde cuando pueda, no de inmediato. Mensaje queda guardado, firmado, con tu nombre y rastro. Ideal para: \emph{mensajes a profesores y autoridades, solicitudes oficiales, peticiones a otros colegios o universidades, cualquier asunto serio que pueda necesitarse después como evidencia}. \textbf{Teams} es la app de comunicación profesional en tiempo real. Combina \emph{chat informal entre compañeros de equipo} (similar a WhatsApp pero institucional), \emph{llamadas y videollamadas}, \emph{reuniones programadas} con varios participantes, \emph{compartir pantalla} mientras hablas. Ideal para: \emph{coordinar trabajos en equipo, hacer reuniones virtuales, preguntar dudas rápidas, presentar avances al profe}. \textbf{Diferencia crucial:} \emph{Outlook = serio, formal, queda registrado}. \emph{Teams = ágil, conversacional, también queda pero menos formal}.

  pregunta_puente: |-
    Si tienes que \emph{pedirle al rector permiso para ir al baño durante un examen importante}, ¿\textbf{usas Outlook o Teams}? Y si tienes que \emph{preguntarle a tu compañero de equipo qué le pareció tu sección del trabajo grupal}, ¿usas Outlook o Teams?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} la diferencia entre Outlook y Teams; (2) sabrás \textbf{aplicar} las 5 partes de un correo formal (ya aprendidas en G6); (3) podrás \textbf{programar} una reunión virtual en Teams; (4) habrás \textbf{enviado} 3 correos profesionales reales + 1 reunión Teams.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: diferencias Outlook y Teams, envías 3 correos formales, programas una reunión Teams, evalúas comunicaciones reales.
  a_escuta: |-
    Empezamos con un test de 6 mensajes: ¿Outlook, Teams o WhatsApp?
  a_sistematizacion: |-
    Después aprendes las 3 herramientas con sus usos correctos.
  a_praxis: |-
    Con todo claro, envías los 3 correos y programas la reunión Teams.
  a_producto: |-
    El producto son los 3 correos enviados + reunión Teams + tabla comparativa.
  a_evaluacion: |-
    Antes de salir, verifica que los 3 correos cumplen las 5 partes y que la reunión está programada con invitaciones enviadas.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué usar el canal correcto es respetar al lector.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 6 mensajes, 3 canales} (10 min · individual). Lee estos 6 mensajes y escribe en el cuaderno qué canal usarías: \textbf{O (Outlook formal)}, \textbf{T (Teams)}, \textbf{W (WhatsApp personal)}. \emph{(1) Pedirle al rector que considere reabrir el cupo de un compañero. (2) Preguntarle a un amigo cercano si va a la fiesta del sábado. (3) Coordinar con tu equipo de 3 dónde se reúnen mañana para hacer el trabajo. (4) Solicitar a una universidad información sobre carreras. (5) Mandar un meme gracioso a tu mejor amiga. (6) Avisar a tu profe que vas a faltar mañana por cita médica.}

  checks:
  - Leí los 6 mensajes con calma.
  - Marqué O, T o W en cada uno.
  - Pensé en el nivel de formalidad de cada situación.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 6 mensajes, 3 canales». \textbf{Formato:} lista numerada con O/T/W. \textbf{Extensión:} 6 líneas. \textbf{Sabes que terminaste cuando} cada mensaje tiene su canal asignado con criterio.

sistematizacion:
  intro: |-
    Tu intuición se afila. Aprende los \textbf{usos correctos de cada canal} y por qué Outlook + Teams son superiores a WhatsApp para asuntos académicos y profesionales. \emph{Respuestas correctas:} 1=O, 2=W, 3=T, 4=O, 5=W, 6=O.

  pilares:
  - |-
    \textbf{Outlook --- el canal formal.} Lo usas para mensajes que \textbf{necesitan registro, autoridad y formalidad}. Tu cuenta institucional ya tiene Outlook activo en \texttt{outlook.office.com}. \textbf{Las 5 partes obligatorias del correo formal} (ya las viste en G6·P1·S3): \emph{(1) Destinatario}, \emph{(2) Asunto claro}, \emph{(3) Saludo formal}, \emph{(4) Cuerpo en 3 bloques}, \emph{(5) Despedida + firma con tu nombre + grado}. \textbf{Funciones útiles de Outlook:} \emph{calendario integrado} (programa reuniones desde el correo), \emph{firma automática} (al final de todos tus correos pones tu firma fija), \emph{categorías y reglas} (organiza correos por color). \textbf{Una excelente práctica:} crea una firma fija en Outlook con tu nombre + grado + colegio.
  - |-
    \textbf{Teams --- el canal ágil profesional.} Lo usas para \textbf{comunicación rápida entre miembros de un mismo equipo o curso}, sin la formalidad del correo. \textbf{3 componentes principales:} \emph{(a) Chat:} conversaciones por escrito (similar a WhatsApp pero institucional, queda guardado en la cuenta del colegio). \emph{(b) Llamadas y videollamadas:} 1 a 1 o en grupo, audio o video, con compartir pantalla. \emph{(c) Reuniones programadas:} eventos con hora, fecha, lista de invitados y enlace que todos abren al mismo tiempo. \textbf{Cómo programar reunión en Teams:} ícono \emph{Calendario} → \emph{Nueva reunión} → poner título, fecha, hora, agregar invitados → \emph{Enviar}. Los invitados reciben correo en Outlook con el enlace y se les agrega a su calendario automáticamente.
  - |-
    \textbf{WhatsApp vs Outlook vs Teams --- la tabla maestra.} \textbf{WhatsApp:} para amigos y familia. Personal. No queda en archivo institucional. NUNCA para asuntos académicos serios. \textbf{Outlook:} para asuntos formales. Asincrónico. Queda registrado. NO para coordinación rápida de equipos. \textbf{Teams:} para equipos profesionales. Sincrónico/asincrónico. Queda registrado en cuenta institucional. NO para asuntos personales con familia.
  - |-
    \textbf{Errores frecuentes al elegir canal.} (1) \emph{Mandar al profe un meme por WhatsApp en lugar de un correo formal por situación seria} --- mezclas niveles, generas confusión. (2) \emph{Hacer una solicitud al coordinador por chat de Teams en lugar de un correo Outlook} --- los chats se pierden rápido; el correo queda registrado. (3) \emph{Programar reunión Teams sin agenda} --- los participantes no saben qué se va a discutir; pierde tiempo. (4) \emph{No mirar el correo institucional regularmente} --- te pierdes anuncios importantes. Revisa mínimo 1 vez al día.

  anatomia:
    titulo: 3 canales con sus usos
    body: |-
      \textbf{Outlook:} formal, registrado. Correos a profes, autoridades, instituciones. \\[1mm]
      \textbf{Teams:} ágil profesional. Chats de equipo, reuniones, videollamadas. \\[1mm]
      \textbf{WhatsApp:} personal. Familia, amigos. Nunca para asuntos académicos serios.

  errores_comunes: |-
    \textbf{Mitos sobre Outlook y Teams.} (1) \emph{``Outlook es solo correo''} --- Falso. Trae calendario, contactos, tareas, reglas. (2) \emph{``Teams es lo mismo que WhatsApp''} --- Falso. Teams es institucional, queda en archivo del colegio, tiene reuniones programadas con calendario. (3) \emph{``Tengo que tener Outlook abierto siempre''} --- Falso. Lo abres 1-2 veces al día. Te llegan notificaciones cuando algo importante entra. (4) \emph{``Es mejor mandar todo por WhatsApp porque es más rápido''} --- Falso a largo plazo: los mensajes serios sin registro se pierden y no tienen peso.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Cuál canal corresponde a cuál situación». \textbf{Formato:} tabla de 5 filas, 3 columnas. Filas: \emph{(1) ¿Para qué?}, \emph{(2) Formalidad}, \emph{(3) Queda registrado}, \emph{(4) Ejemplo de uso}, \emph{(5) Cuándo NO usar}. \textbf{Veredicto (5 casos):} para estas 5 situaciones, decide qué canal corresponde y justifica con 1 razón: (1) pedir prórroga de un trabajo al profe; (2) coordinar quien lleva qué al asado del salón; (3) preguntar la temática del próximo parcial; (4) avisar que vas a llegar tarde a clase; (5) enviar tu hoja de vida para una práctica. \textbf{Extensión:} tabla + 5 veredictos. \textbf{Sabes que terminaste cuando} distingues canal formal (Outlook), canal de equipo (Teams) y canal informal (WhatsApp) sin dudar.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- 3 correos profesionales + 1 reunión Teams} (32 min · individual). Vas a enviar 3 correos reales por Outlook y programar 1 reunión de Teams con tu equipo de la S6. Si no tienes computador en clase, planeas todo en el cuaderno y ejecutas en casa esta semana.

  pilares:
  - |-
    \textbf{Paso 1 --- Abre Outlook.} Ve a \texttt{outlook.office.com}, inicia sesión con tu cuenta institucional. Verás la bandeja de entrada. Antes de empezar, ve a \emph{Configuración → Firma de correo electrónico} y crea tu firma fija: \emph{``Atentamente, [Tu nombre completo], Grado 7[letra], I.E. Sor María Juliana, año 2026.''}. Guarda. De ahora en adelante esa firma aparece automáticamente al final de cada correo que escribas.
  - |-
    \textbf{Paso 2 --- Correo 1: al profe.} \emph{Nuevo correo}. Destinatario: el correo institucional de tu profe de Tecnología. Asunto: \emph{``Solicitud de aclaración sobre la actividad de la próxima sesión''}. Cuerpo en 3 bloques: \emph{(1) qué quieres aclarar (1 frase)}, \emph{(2) por qué tienes esa duda (1 frase)}, \emph{(3) qué pides (que te confirme algo, te explique, etc., 1 frase)}. Máximo 5 líneas en total. Tu firma aparece sola al final. Envía.
  - |-
    \textbf{Paso 3 --- Correo 2: al coordinador.} Destinatario: correo del coordinador (pregunta al profe si no lo tienes). Asunto: \emph{``Sugerencia para la sala de Tecnología --- estudiante de grado 7''}. Cuerpo: una sugerencia constructiva (un ventilador, mejor luz, una pizarra adicional, lo que tú propongas). 3 bloques: idea, por qué la propones, qué necesita para implementarse. Envía.
  - |-
    \textbf{Paso 4 --- Correo 3: a un compañero.} Destinatario: correo institucional de un compañero. Asunto: \emph{``Coordinación trabajo grupal G7-P1''}. Cuerpo: propón día y hora para que se reúnan a revisar el trabajo de la S6, o pregúntale algo concreto sobre el trabajo. Envía. Después verifica con él que recibió el correo.
  - |-
    \textbf{Paso 5 --- Reunión Teams.} Ve al ícono de \emph{Teams} (calendario en la barra lateral). Clic en \emph{Nueva reunión}. Llena los datos: \emph{Título}: \emph{``Revisión trabajo grupal G7-P1''}. \emph{Fecha y hora}: alguna esta semana, 30 minutos. \emph{Agregar participantes}: los 2 compañeros de tu equipo de S6 (escribe sus correos). \emph{Agenda}: \emph{``(1) revisar trabajo colaborativo, (2) acordar cambios finales, (3) entregar al profe''}. Clic en \emph{Enviar}. Tus 2 compañeros recibirán invitación.
  - |-
    \textbf{Paso 6 --- Bitácora + reflexión + firma.} En el cuaderno: \emph{(a) Lista de los 3 correos enviados (destinatario + asunto). (b) Datos de la reunión Teams (fecha, hora, participantes, agenda). (c) Reflexión: ``Mi descubrimiento de hoy fue: \_\_\_\_''}. Firma con nombre y fecha. Esta sesión te entrenó en comunicación profesional digital.

  checklist:
    titulo: Antes de cerrar la S9
    items: |-
      \checkbox Mi firma fija está configurada en Outlook. \\[1mm]
      \checkbox Envié 3 correos profesionales (profe, coordinador, compañero). \\[1mm]
      \checkbox Cada correo tiene las 5 partes y máximo 5 líneas de cuerpo. \\[1mm]
      \checkbox Programé 1 reunión en Teams con mi equipo de 3. \\[1mm]
      \checkbox La reunión tiene agenda con 3 puntos claros. \\[1mm]
      \checkbox La bitácora está firmada con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} firma fija. \textit{Paso 2:} correo 1 al profe. \textit{Paso 3:} correo 2 al coordinador. \textit{Paso 4:} correo 3 al compañero. \textit{Paso 5:} reunión Teams. \textit{Paso 6:} bitácora + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mis primeros correos profesionales + reunión Teams». \textbf{Formato:} datos de los 3 correos + reunión Teams + reflexión. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} los 3 correos están enviados Y la reunión está programada con invitaciones recibidas por los compañeros.

  producto_titulo: 3 correos profesionales enviados + 1 reunión Teams programada · bitácora firmada
  criterios:
  - Los 3 correos siguen las 5 partes obligatorias.
  - Cada correo tiene cuerpo máximo de 5 líneas.
  - La firma fija aparece al final de cada correo.
  - La reunión Teams tiene título, fecha, hora, 2 invitados, agenda.
  - La bitácora está completa y firmada.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del lenguaje según contexto)"
    cita: |-
      ``Hablar igual con todos no es respeto: es desconocimiento. El respeto adapta el lenguaje al lector.''
    aplicacion: |-
      Hay gente que cree que \emph{``yo hablo igual con todo el mundo''} es virtud. No es: es \textbf{confusión de canales}. \emph{Hablarle al rector como le hablas a tu amigo es no entender que el rector ocupa un lugar distinto en la conversación}. Doña Mercedes mandaba carta formal al alcalde y recado verbal al vecino: \emph{2 canales, mismas reglas de respeto adaptadas al contexto}. Hoy en digital, Outlook es para uno; Teams para otro; WhatsApp para otro más. Saber elegir es respeto.
    pregunta_espejo: |-
      ¿Estoy hablando igual con todos sin distinguir contextos? ¿Eso me ayuda o me complica?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``La carta formal queda. El recado se va con el viento. Sabe usar las dos a su tiempo.''
    aplicacion: |-
      Marco Aurelio gobernaba el imperio con \textbf{dos canales}: \emph{decretos escritos} (que quedaban en archivo para siempre) y \emph{conversaciones verbales} (rápidas, ágiles, no registradas). Sabía cuándo usar cada uno. En el digital de hoy, esos dos canales son Outlook y Teams. Quien conoce ambos opera con \emph{precisión profesional}; quien solo conoce uno (o usa WhatsApp para todo) opera con menos finura.
    pregunta_espejo: |-
      ¿Estoy desarrollando precisión profesional en comunicación, o me quedo en informalidad permanente?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la comunicación digital institucional)"
    cita: |-
      ``Tener correo institucional y saber usarlo es el primer rito de paso a la vida adulta digital.''
    aplicacion: |-
      \textbf{Tu correo institucional} (\texttt{...@sormariajuliana.edu.co}) es \emph{tu primera identidad oficial digital}. Lo vas a reemplazar después por \emph{...@universidad.edu.co} y luego por \emph{...@empresa.com}. Pero el oficio es el mismo: \emph{escribir formal, claro, con firma, con asunto, con respeto}. Hoy entrenas ese oficio en la versión escolar. Mañana lo usarás en la versión universitaria. En 10 años en la profesional. Lo que aprendes hoy queda.
    pregunta_espejo: |-
      ¿Estoy aprovechando mi correo institucional como entrenamiento para mi yo de 25 años?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, revisa tu Outlook al menos cada 2 días. Responde lo que tengas pendiente. Asiste a la reunión Teams que programaste. La próxima sesión es \textbf{Sesión 10 --- la cosecha del periodo}: tu equipo de 3 entrega un mini-proyecto colaborativo que reúne TODO lo aprendido en P1. Va a ser el cierre del periodo.

web:
  conceptos_clave:
    - termino: Outlook
      definicion: |-
        Cliente de correo electrónico institucional de Microsoft. Lo usas para comunicación formal: cartas a profes, autoridades, instituciones. Trae también calendario, contactos, tareas. Tu cuenta institucional ya lo tiene activo.
      ejemplo: |-
        Vas a outlook.office.com, inicias sesión con tu cuenta institucional, escribes un correo al rector siguiendo las 5 partes (destinatario, asunto, saludo, cuerpo, firma). Queda registrado para siempre.
      emoji: "✉️"
    - termino: Teams
      definicion: |-
        App de comunicación profesional en tiempo real de Microsoft. Combina chat (como WhatsApp pero institucional), llamadas, videollamadas y reuniones programadas con calendario. Ideal para coordinar equipos académicos.
      ejemplo: |-
        Tu equipo de 3 abre Teams, crean un grupo, chatean para coordinar, hacen videollamada con pantalla compartida para presentar avances al profe. Todo queda en archivo institucional.
      emoji: "💼"
    - termino: Firma de correo
      definicion: |-
        Texto fijo que aparece automáticamente al final de cada correo que envías desde Outlook. Configurada una vez, se aplica a todos. Le da identidad profesional a tus correos sin que tengas que escribirla cada vez.
      ejemplo: |-
        Tu firma puede ser 'Atentamente, María Cárdenas, Grado 7B, I.E. Sor María Juliana, año 2026'. Aparece sola al final de cada correo. Profesional desde el inicio.
      emoji: "🖊️"
    - termino: Reunión programada en Teams
      definicion: |-
        Evento de videollamada con hora, fecha, lista de invitados y enlace que todos abren al mismo tiempo. Se programa desde el calendario de Teams. Los invitados reciben correo con el enlace y se les agrega al calendario.
      ejemplo: |-
        Programas reunión 'Trabajo grupal G7' miércoles 4 p. m., 30 min, con 2 compañeros. Ellos reciben invitación. A las 4 p. m. cada uno hace clic en el enlace, se conectan los 3.
      emoji: "📅"
    - termino: Diferencia entre Outlook, Teams y WhatsApp
      definicion: |-
        Outlook: formal, registrado, asincrónico. Teams: ágil profesional, registrado, sincrónico/asincrónico, equipo. WhatsApp: personal, no institucional, NO para asuntos académicos serios.
      ejemplo: |-
        Al rector: Outlook (formal). Al equipo de tu trabajo grupal: Teams (ágil). A tu amigo sobre la fiesta: WhatsApp (personal). Cada canal para su uso.
      emoji: "🔀"

  quiz:
    titulo: "¿Sabes usar Outlook y Teams?"
    instrucciones: "5 preguntas para verificar que dominas la comunicación profesional digital."
    preguntas:
      - enunciado: "Necesitas pedir al rector permiso para faltar una semana por viaje familiar. ¿Qué canal usas?"
        opciones:
          - "WhatsApp."
          - "Teams chat."
          - "Outlook (correo formal con las 5 partes)."
          - "Una nota en papel."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Solicitud formal a autoridad = Outlook. Queda registrado, formal, con tu firma. WhatsApp y Teams son menos formales; el papel se pierde.
        feedback_incorrecto: |-
          A autoridades: Outlook. Petición formal, registrada, con las 5 partes. Queda en archivo institucional. Es la práctica adulta correcta.
      - enunciado: "Tu equipo de 3 va a hacer videollamada para revisar el trabajo. ¿Qué canal?"
        opciones:
          - "Outlook."
          - "WhatsApp con audio amateur."
          - "FaceTime."
          - "Teams (Reunión programada con videollamada)."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. Teams es la app de reuniones virtuales institucionales: videollamada + pantalla compartida + agenda. Mucho más profesional que WhatsApp.
        feedback_incorrecto: |-
          Teams para reuniones virtuales académicas/profesionales. Video, pantalla compartida, agenda, calendario integrado. La opción profesional.
      - enunciado: "Tu correo institucional debería tener... (escoge lo más profesional)"
        opciones:
          - "Una firma fija con tu nombre, grado, colegio y año."
          - "Sin firma."
          - "Tu emoji favorito."
          - "Una imagen de tu mascota."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Firma fija profesional: nombre, grado, colegio, año. Aparece sola al final de cada correo. Identidad profesional consistente.
        feedback_incorrecto: |-
          Firma fija profesional. Configurada una vez en Outlook, aparece automáticamente. 'Atentamente, [Nombre], Grado 7[letra], I.E. Sor María Juliana, año 2026'.
      - enunciado: "Te llega un correo institucional importante. ¿Cuándo deberías revisarlo?"
        opciones:
          - "Cuando tenga tiempo, sin importar si tardo 2 semanas."
          - "Mínimo 1 vez al día. Idealmente cada 2 días para mensajes urgentes."
          - "Solo cuando me acuerde."
          - "Nunca, prefiero WhatsApp."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Mínimo 1 vez al día. Outlook es el canal formal: los mensajes importantes llegan ahí. Si no lo revisas, te pierdes oportunidades.
        feedback_incorrecto: |-
          1 vez al día mínimo. Outlook es el canal formal: anuncios del cole, mensajes de profes, oportunidades. Revisar regularmente es disciplina profesional.
      - enunciado: "Programas una reunión Teams con tu equipo. ¿Qué le falta para ser profesional?"
        opciones:
          - "Programar sin agenda."
          - "Agregar agenda con 3 puntos claros para que los participantes sepan qué se discutirá."
          - "No invitar a nadie."
          - "Hacerlo a las 3 a. m.."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Reunión sin agenda pierde tiempo. Con agenda clara, los participantes llegan preparados y la reunión es eficaz. Profesional.
        feedback_incorrecto: |-
          Agenda con 3 puntos. Reunión sin agenda = pérdida de tiempo. Con agenda los participantes llegan preparados y la reunión rinde el doble.

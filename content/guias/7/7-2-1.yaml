    El producto es el cuaderno P2 inaugural + mini-investigación + compromiso firmado.
  a_evaluacion: |-
    Antes de salir, verifica que tu cuaderno tiene los 5 elementos del periodo.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué pensar paso a paso es de las habilidades más poderosas que existen.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Imagina a doña Sofía tejiendo} (12 min · individual). Cierra los ojos e imagina la escena. Doña Sofía está sentada en una silla baja, con un canasto a medio tejer entre las manos. Ella sigue \textbf{el algoritmo del tejido}. En el cuaderno, responde con tu intuición: \emph{(1) ¿Cuántos pasos diferentes crees que tiene el algoritmo del tejido? (estima)}. \emph{(2) ¿Cuáles pasos crees que se REPITEN varias veces?}. \emph{(3) ¿Qué pasaría si doña Sofía olvida un paso?}. \emph{(4) ¿Cómo sabe doña Sofía cuándo terminar (cuándo el canasto está completo)?}. \emph{(5) ¿Doña Sofía aprendió este algoritmo en una clase, o de otra manera?}. Tus respuestas no son ``correctas'' o ``incorrectas''; son tu intuición inicial.

  checks:
  - Cerré los ojos e imaginé la escena.
  - Respondí las 5 preguntas con honestidad.
  - Pensé sin copiar al compañero.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Imagino a la tejedora». \textbf{Formato:} 5 respuestas cortas. \textbf{Extensión:} 5 líneas. \textbf{Sabes que terminaste cuando} reconoces que el tejido tiene estructura algorítmica.

sistematizacion:
  intro: |-
    Lo que descubriste imaginando a doña Sofía es \textbf{pensamiento computacional}. Ahora aprende la ruta del periodo + los 5 acuerdos para llegar bien.

  pilares:
  - |-
    \textbf{La ruta del P2 --- 10 sesiones organizadas en 3 bloques.} \textbf{Bloque 1 (S2-S4): Algoritmo y diagramas.} Qué es un algoritmo, las 4 técnicas del pensamiento computacional, cómo dibujar un algoritmo. \textbf{Bloque 2 (S5-S7): Componentes de programación.} Variables, condicionales, bucles --- los 3 ladrillos básicos de cualquier programa. \textbf{Bloque 3 (S8-S10): Scratch.} El lenguaje visual del MIT donde aplicas todo lo anterior con bloques. Al final, tu \emph{primer programa interactivo completo}.
  - |-
    \textbf{¿Qué es Scratch?} Lenguaje de programación visual creado en el MIT (Estados Unidos) para que niños y jóvenes aprendan a programar. \textbf{No requiere escribir código:} los \emph{bloques} de instrucciones se arrastran y se encajan como piezas de Lego. \textbf{Funciona en cualquier computador con navegador:} entras a \texttt{scratch.mit.edu}, creas tu cuenta gratis (o usas la cuenta institucional), y empiezas a programar. \textbf{Más de 100 millones de proyectos} subidos por chicos de todo el mundo. Algunos son juegos, otros cuentos, otros simuladores. Tú harás los tuyos al final del periodo.
  - |-
    \textbf{Los 5 acuerdos del pensamiento computacional.} (1) \textbf{Paciencia:} programar requiere pensar despacio. La primera vez tarda; con práctica se vuelve rápido. (2) \textbf{Paso a paso:} no querer hacer todo de una. Un paso, después otro, después otro. (3) \textbf{Revisar errores con calma:} cuando algo no funciona, eso no es fracaso --- es información. Te dice qué corregir. \emph{Los programadores experimentados pasan más tiempo revisando errores que escribiendo código nuevo}. (4) \textbf{Intentar de nuevo:} si la primera versión no funciona, modificas y vuelves a intentar. \emph{Ningún programa funciona perfecto en el primer intento}. (5) \textbf{Compartir aprendizajes:} cuando descubres algo, lo compartes con el equipo. Programar es deporte colectivo, no solitario.
  - |-
    \textbf{4 errores típicos al iniciar pensamiento computacional.} (1) \emph{``No soy bueno para esto''} antes de intentar --- nadie nace programador, todos aprenden. (2) \emph{Querer hacer un programa complicado el primer día} --- la S8 empieza con \emph{``el sprite que se mueve''}, no con un videojuego. (3) \emph{Saltarse pasos del razonamiento} --- en algoritmia, saltar 1 paso a veces invalida todo. (4) \emph{Frustrarse cuando aparece un error} --- los errores son tu maestro principal. Sin error, no aprendes a depurar.

  anatomia:
    titulo: Ruta P2 + 5 acuerdos
    body: |-
      \textbf{Ruta P2:} \\[1mm]
      Bloque 1 (S2-S4): algoritmo + 4 técnicas + diagramas. \\[1mm]
      Bloque 2 (S5-S7): variables + condicionales + bucles. \\[1mm]
      Bloque 3 (S8-S10): Scratch + narrativa + cosecha. \\[1mm]
      \textbf{5 acuerdos:} paciencia · paso a paso · revisar errores · intentar de nuevo · compartir.

  errores_comunes: |-
    \textbf{Mitos sobre la programación que vas a oír.} (1) \emph{``Solo los genios programan''} --- Falso. Programar es habilidad que se aprende, como leer. (2) \emph{``Hay que ser bueno en matemáticas para programar''} --- Falso. La mate ayuda pero no es requisito. La habilidad central es \emph{pensar paso a paso}, no resolver ecuaciones. (3) \emph{``Programar es solo para hombres''} --- Totalmente falso. Las primeras programadoras fueron mujeres (Ada Lovelace, las ``chicas del ENIAC''). (4) \emph{``Programar en Scratch no es programar de verdad''} --- Falso. Scratch usa los mismos conceptos (variables, condicionales, bucles, eventos) que cualquier lenguaje profesional.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Ruta P2 + 5 acuerdos». \textbf{Formato:} bloque A con los 3 bloques del periodo (lista). Bloque B con los 5 acuerdos firmados. \textbf{Extensión:} 12 líneas. \textbf{Sabes que terminaste cuando} podrías recitar los 5 acuerdos sin abrir el cuaderno.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Cuaderno P2 + 5 preguntas + investigación del tejido} (28 min · individual + tarea en casa). Vas a dejar el cuaderno listo + plantear las preguntas que llevas al periodo + investigar el tejido tradicional como tarea para casa.

  pilares:
  - |-
    \textbf{Paso 1 --- Índice del P2 + encabezado fijo.} En tu cuaderno de Tecnología (el mismo de P1), abre una página nueva. Escribe el título: \textbf{``Periodo 2 --- Algoritmia y pensamiento computacional''}. Debajo, índice con las 10 sesiones del P2 (mira la ruta de la sistematización).
  - |-
    \textbf{Paso 2 --- Los 5 acuerdos firmados.} Después del índice, lista numerada de los 5 acuerdos (paciencia, paso a paso, revisar errores, intentar de nuevo, compartir). Al lado de cada uno, palomita ✓ si te comprometes. Si dudas con alguno, conversa con el profe.
  - |-
    \textbf{Paso 3 --- 5 preguntas-radar.} Después de los acuerdos, lista numerada de 5 preguntas tuyas que esperas que el P2 responda. Sugerencias para inspirarte: \emph{``¿Por qué dicen que tejer es como programar?''}, \emph{``¿Es difícil programar en Scratch?''}, \emph{``¿Puedo hacer un videojuego al final del periodo?''}, \emph{``¿Cómo se llaman los errores en programación?''}.
  - |-
    \textbf{Paso 4 --- Mini-investigación del tejido.} En la siguiente hoja del cuaderno, abre el espacio: \textbf{``Mini-investigación: el tejido como algoritmo''}. Esta investigación la haces \emph{en casa} esta semana (no en clase). Tareas: \emph{(a) Encuentra a una persona mayor de tu familia o barrio que sepa tejer (puede ser canasto, manilla, suéter, mochila, sombrero). (b) Pregúntale: ¿cuántos pasos básicos tiene el tejido?, ¿qué pasos se repiten?, ¿cómo aprendió ella a tejer?, ¿qué hace si se equivoca?. (c) Anota mínimo 5 datos concretos en el cuaderno.}. Si no tienes a nadie en casa, busca en internet con criterio (aplicando CRAAP de G6).
  - |-
    \textbf{Paso 5 --- Sesión 1 con encabezado fijo.} En el cuaderno principal escribe el encabezado: \emph{``Guía: 7° · Periodo 2 · Guía 1 --- Apertura. Fecha: \_\_/\_\_/2026''}. Debajo, anota lo trabajado en las 3 actividades de hoy.
  - |-
    \textbf{Paso 6 --- Firma y cierre.} Al final firma con nombre completo y fecha. La próxima clase entras al primer concepto técnico del periodo: \emph{¿qué es un algoritmo?}.

  checklist:
    titulo: Antes de cerrar la S1 del P2
    items: |-
      \checkbox El índice del P2 está con 10 sesiones. \\[1mm]
      \checkbox Los 5 acuerdos están firmados con palomita. \\[1mm]
      \checkbox Tengo 5 preguntas-radar reales. \\[1mm]
      \checkbox Tengo plan para la mini-investigación del tejido. \\[1mm]
      \checkbox La sesión 1 tiene encabezado fijo y registro. \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Hoja 1:} título P2 + índice de 10 sesiones. \textit{Hoja 2:} 5 acuerdos firmados + 5 preguntas-radar. \textit{Hoja 3:} mini-investigación (a completar en casa). \textit{Cuaderno principal:} S1 con encabezado fijo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Cuaderno inaugural G7-P2». \textbf{Formato:} 3 hojas iniciales + S1 registrada. \textbf{Extensión:} 3 hojas + sesión. \textbf{Sabes que terminaste cuando} tu cuaderno está listo para empezar la S2 sin reorganizar nada.

  producto_titulo: Cuaderno P2 inaugural + investigación del tejido + 5 acuerdos firmados
  criterios:
  - Índice del P2 con 10 sesiones.
  - 5 acuerdos firmados con palomita.
  - 5 preguntas-radar personales y específicas.
  - Plan claro de mini-investigación del tejido (con persona o fuente identificada).
  - S1 con encabezado fijo y registro de actividades.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del saber popular)"
    cita: |-
      ``Las abuelas tejedoras eran programadoras antes de que se inventara el computador. El saber popular precede a la academia.''
    aplicacion: |-
      La academia muchas veces presenta el pensamiento computacional como algo \emph{moderno e importado}. Pero \textbf{las abuelas tejedoras Wayuu, las cesteras del Cauca, las artesanas del Pacífico} lo dominan desde hace siglos. Cuando tejen un patrón complejo, están ejecutando un algoritmo mental: \emph{secuencia, repetición, condicional, variable}. Reconocer eso le devuelve dignidad al saber popular y te recuerda que \emph{no estás aprendiendo algo ajeno; estás aprendiendo en lenguaje computacional algo que tu cultura ya conoce}.
    pregunta_espejo: |-
      ¿En mi familia hay alguien que ``programa'' sin saberlo (cocina con receta exacta, teje, hace algo paso a paso)? ¿Qué les podría enseñar el pensamiento computacional explícito?

  estoico:
    autor: "Marco Aurelio (emperador del pensamiento paso a paso)"
    cita: |-
      ``Quien aprende a pensar paso a paso domina cualquier oficio. La paciencia con el orden es el secreto del trabajo bien hecho.''
    aplicacion: |-
      \textbf{La habilidad central del pensamiento computacional es la paciencia paso a paso}. Ni los más rápidos pueden programar sin desglosar el problema en pasos. Quien se apresura, fracasa. Quien va paso a paso, llega. \emph{Esa disciplina --- la paciencia ordenada --- es útil mucho más allá de la programación}: para resolver problemas de matemáticas, organizar viajes, planear estudios, criar hijos. Aprender pensamiento computacional es aprender una forma adulta de pensar.
    pregunta_espejo: |-
      ¿Tiendo a apurarme cuando un problema es difícil, o sé descomponer paso a paso?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la educación digital)"
    cita: |-
      ``Programar es la nueva alfabetización. No es para todos hacer carrera de programador, pero todos deben entender cómo se programa el mundo en que viven.''
    aplicacion: |-
      Vivimos en un mundo \textbf{programado}: TikTok te recomienda videos por algoritmo, el banco aprueba créditos por algoritmo, los semáforos cambian por algoritmo. \emph{Si no entiendes nada de cómo funcionan los algoritmos, te conviertes en sujeto pasivo del mundo digital}. Entenderlos --- aunque no programes profesionalmente --- te hace ciudadano alfabetizado del siglo XXI. Este periodo es ese entrenamiento mínimo.
    pregunta_espejo: |-
      ¿Quiero ser sujeto pasivo de los algoritmos que me rodean, o ciudadano que los entiende y decide con criterio?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, completa la mini-investigación del tejido: habla con una persona mayor, anota 5 datos. La próxima clase es S2: \emph{¿Qué es un algoritmo?}. Vas a aprender la definición técnica + las 5 características de un buen algoritmo. Trae tu investigación: la usaremos.

web:
  conceptos_clave:
    - termino: Algoritmia
      definicion: |-
        Rama de la informática que estudia los algoritmos: secuencias de pasos para resolver problemas. Es la base de toda programación. Una abuela tejedora practica algoritmia sin saberlo.
      ejemplo: |-
        Una receta de cocina es un algoritmo. Un patrón de tejido es un algoritmo. Las instrucciones para armar un mueble son un algoritmo. La diferencia con la programación es que el algoritmo lo ejecuta un computador.
      emoji: "🧮"
    - termino: Pensamiento computacional
      definicion: |-
        Habilidad de descomponer un problema complejo en pasos manejables que un computador (o cualquier persona) puede ejecutar. Tiene 4 técnicas: descomposición, patrones, abstracción y algoritmo. Lo aprenderás en S3.
      ejemplo: |-
        Para preparar arepas: descomposición (4 pasos), patrones (mezclar es como amasar), abstracción (decir 'amasar' sin describir cada movimiento), algoritmo (orden exacto: mezclar → amasar → bolitas → asar).
      emoji: "🧩"
    - termino: Scratch
      definicion: |-
        Lenguaje de programación visual del MIT (Massachusetts Institute of Technology). Gratuito, en el navegador (scratch.mit.edu). Usa bloques que se encajan como Lego. Diseñado para que niños y jóvenes aprendan a programar.
      ejemplo: |-
        En Scratch arrastras bloques: 'mover 10 pasos' + 'esperar 1 segundo' + 'decir hola por 2 segundos'. Sin escribir código, el sprite (personaje) ejecuta tus instrucciones.
      emoji: "🐱"
    - termino: 5 acuerdos del pensamiento computacional
      definicion: |-
        Las 5 normas para llegar bien al periodo: (1) paciencia, (2) paso a paso, (3) revisar errores con calma, (4) intentar de nuevo, (5) compartir aprendizajes. Sin estos acuerdos, programar se vuelve frustrante.
      ejemplo: |-
        Tu primer programa no funciona. Acuerdo 3: revisar errores con calma. Acuerdo 4: intentar de nuevo modificando algo. Acuerdo 5: si encontraste la solución, compártela con el equipo.
      emoji: "🤝"
    - termino: Tejido como algoritmo
      definicion: |-
        El tejido tradicional (canastos, mochilas, sombreros) tiene estructura algorítmica: secuencia (pasos en orden), repetición (patrones que se repiten), condicionales (cuándo cambiar de hebra), variables (contar puntos). Es algoritmia cultural transmitida durante siglos.
      ejemplo: |-
        Una mochila Wayuu sigue un algoritmo: empezar centro, repetir patrón N veces, cambiar color cuando llega al borde, terminar con cierre. Las abuelas Wayuu son programadoras culturales sin saberlo.
      emoji: "🧶"

  quiz:
    titulo: "¿Llegaste bien al periodo 2 de grado 7?"
    instrucciones: "5 preguntas para verificar que entiendes el espíritu del pensamiento computacional."
    preguntas:
      - enunciado: "¿Cuál es la relación entre tejer un canasto y programar un computador?"
        opciones:
          - "Ninguna, son cosas totalmente distintas."
          - "Ambos siguen un algoritmo: secuencia, repetición, condicionales, contadores."
          - "Tejer es más difícil."
          - "Programar es solo para genios; tejer es para abuelas."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Tejer es algoritmia cultural. Las abuelas hacen mentalmente lo que un programa hace en código: secuencia, repetición, condicionales, contadores. Mismo pensamiento, distinto medio.
        feedback_incorrecto: |-
          Tejer y programar comparten estructura algorítmica. Las abuelas son programadoras culturales: secuencia, repetición, condicional, variable. Mismo pensamiento.
      - enunciado: "¿Es necesario ser muy bueno en matemáticas para programar?"
        opciones:
          - "Sí, sin matemáticas no se puede."
          - "La mate ayuda pero no es requisito. La habilidad central es pensar paso a paso."
          - "Solo álgebra es necesaria."
          - "La programación es lo mismo que matemáticas."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Pensar paso a paso es la habilidad central. La mate ayuda pero no decide. Hay programadores excelentes que no son fuertes en mate.
        feedback_incorrecto: |-
          Pensar paso a paso es la habilidad central. Mate ayuda pero no es requisito. Las abuelas tejedoras programan algoritmos sin saber álgebra avanzada.
      - enunciado: "Tu primer programa en Scratch no funciona. ¿Qué haces?"
        opciones:
          - "Me rindo, no soy bueno para esto."
          - "Lo reviso con calma (acuerdo 3) e intento de nuevo modificando algo (acuerdo 4)."
          - "Borro Scratch."
          - "Le pago a alguien para que lo arregle."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Acuerdos 3 y 4: revisar errores con calma + intentar de nuevo. Los errores son información, no fracaso. Programadores expertos pasan más tiempo depurando que escribiendo.
        feedback_incorrecto: |-
          Acuerdos 3 y 4: revisar con calma, intentar de nuevo. Los errores son tu maestro. Sin error no aprendes a depurar (encontrar y corregir).
      - enunciado: "¿Qué es Scratch?"
        opciones:
          - "Un juego."
          - "Lenguaje de programación visual gratuito del MIT, con bloques que se encajan."
          - "Un dispositivo físico."
          - "Una marca de zapatos."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Scratch: lenguaje visual del MIT, gratis, en scratch.mit.edu. Bloques se arrastran y encajan. Más de 100 millones de proyectos en el mundo.
        feedback_incorrecto: |-
          Scratch = lenguaje de programación visual del MIT. Gratis. En el navegador. Bloques que se encajan como Lego. Lo usarás en S8, S9, S10.
      - enunciado: "¿Cuántas sesiones tiene el periodo 2?"
        opciones:
          - "5 sesiones."
          - "10 sesiones organizadas en 3 bloques (algoritmo y diagramas + componentes + Scratch)."
          - "30 sesiones."
          - "Solo 2 sesiones."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. 10 sesiones en 3 bloques: (1) algoritmo + diagramas, (2) variables + condicionales + bucles, (3) Scratch. Cada bloque te prepara para el siguiente.
        feedback_incorrecto: |-
          10 sesiones, 3 bloques: algoritmos y diagramas (S2-S4), componentes de programación (S5-S7), Scratch (S8-S10). Cada uno te prepara para el siguiente.

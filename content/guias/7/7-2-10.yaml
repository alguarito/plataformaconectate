clave: "2-10"
grado: 7
periodo: 2
sesion: 10
completo: true

titulo: "Cosecha del periodo 2 --- mi primer programa Scratch completo"
titulo_portada: |-
  Cosecha del
  periodo 2 ---
  mi primer
  programa
  completo

producto_final: |-
  Un \textbf{programa completo en Scratch} que integra TODO lo aprendido en P2. \textbf{Entregables:} \textbf{(a) programa funcional} con: variables (mínimo 2), condicionales (mínimo 2), bucle (mínimo 1), interactividad (preguntar al usuario), múltiples escenas o sprites; \textbf{(b) diagrama de flujo} del programa en el cuaderno; \textbf{(c) documentación} en el cuaderno: descripción del programa, lista de variables, capturas de cada escena, las 4 técnicas del pensamiento computacional aplicadas (S3); \textbf{(d) sustentación} oral de 5 minutos: tu equipo (o tú solo) muestra el programa y explica decisiones de diseño.

apertura:
  saber_ancestral: |-
    \textbf{En el Valle del Cauca, cuando una tejedora terminaba una mochila wayuu o un canasto, no se quedaba con él para ella sola.} Doña Sofía y otras tejedoras de la vereda La Plata de Cartago \textbf{mostraban su obra}: \emph{la llevaban a la plaza del pueblo, la enseñaban a los vecinos, contaban qué patrón usaron, cuánto tiempo les tomó, qué cambiarían para la próxima}. La obra terminada se \textbf{sustentaba} ante la comunidad. \emph{Eso no era vanidad}: era validación cultural, era transmisión de saberes, era oportunidad de mejorar. Si alguien notaba un error, lo decía con respeto. Si alguien alababa una innovación, otros aprendían. \textbf{La cosecha no se quedaba en privado}. Hoy tú cierras el periodo 2 igual: \emph{programaste varios miniproyectos en Scratch durante 9 sesiones; hoy presentas tu obra completa, la sustentás, y la dejas como muestra de lo que ahora sabes hacer}.

  saber_contemporaneo: |-
    Esta es la \textbf{cosecha del periodo 2}. No es contenido nuevo: es \emph{integración} de todo lo aprendido. Tu programa debe combinar: \textbf{algoritmo} (S2 estructura clara con entrada-proceso-salida); \textbf{pensamiento computacional} (S3 las 4 técnicas aplicadas); \textbf{diagrama de flujo} (S4 representación visual); \textbf{variables} (S5 mínimo 2); \textbf{condicionales} (S6 mínimo 2); \textbf{bucles} (S7 mínimo 1); \textbf{Scratch} (S8 conocer la interfaz y bloques); \textbf{narrativa interactiva} (S9 si quieres, preguntar al usuario). \textbf{Tema libre} pero debe ser concreto y demostrable. Sugerencias: \emph{(1) Juego sencillo} (atrapar manzanas, perseguir un sprite, adivinar números); \emph{(2) Historia interactiva extendida} (continuación de la S9 con más decisiones); \emph{(3) Simulador} (el clima del día, el horario semanal); \emph{(4) Animación contadora} (cuenta regresiva con eventos). \textbf{La meta:} demostrar que pasaste de no saber programar a tener un programa funcional propio.

  pregunta_puente: |-
    Hace 10 sesiones \emph{no sabías qué era un algoritmo}. Hoy programas en Scratch un programa con variables, condicionales y bucles. \textbf{¿Cómo te sientes con ese crecimiento}?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{integrar} todos los componentes aprendidos en un solo programa; (2) sabrás \textbf{aplicar} las 4 técnicas del pensamiento computacional en tu diseño; (3) podrás \textbf{evaluar} tu programa con rúbrica; (4) habrás \textbf{creado} y sustentado tu primer programa Scratch completo.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: planeas el programa con las 4 técnicas, lo programas en Scratch, documentas, sustentas.
  a_escuta: |-
    Empezamos definiendo el tema y aplicando las 4 técnicas.
  a_sistematizacion: |-
    Después conoces la rúbrica de 10 criterios + estructura del entregable.
  a_praxis: |-
    Con todo claro, ejecutas: programar + documentar + sustentar.
  a_producto: |-
    El producto es programa + diagrama + documentación + sustentación.
  a_evaluacion: |-
    Antes de sustentar, autoevalúa con la rúbrica de 10 criterios.
  a_triangulo: |-
    Cerramos con 3 voces sobre el oficio cumplido y el camino hacia P3.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Define tu programa con las 4 técnicas} (12 min · individual). En el cuaderno responde, aplicando las 4 técnicas del pensamiento computacional (S3): \emph{(1) ¿Cuál es tu programa? (1 frase corta).} \emph{(2) DESCOMPOSICIÓN: ¿En qué 4-5 partes se divide? (lista).} \emph{(3) PATRONES: ¿Qué partes son similares entre sí? (que puedan reusar la misma estructura).} \emph{(4) ABSTRACCIÓN: ¿Qué detalles dejas afuera por ahora?}. \emph{(5) ALGORITMO: ¿Cuál es el orden general (entrada-proceso-salida)?}.

  checks:
  - Definí el tema concreto de mi programa.
  - Descompuse en 4-5 partes.
  - Identifiqué patrones, abstracciones, orden.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Plan del programa con 4 técnicas». \textbf{Formato:} 5 respuestas estructuradas. \textbf{Extensión:} 1/2 página. \textbf{Sabes que terminaste cuando} tu plan está claro antes de tocar Scratch.

sistematizacion:
  intro: |-
    Conoces la rúbrica con la que el profe evaluará tu programa. \textbf{Conocerla antes te permite producir según los criterios}.

  pilares:
  - |-
    \textbf{Los 10 criterios de la rúbrica (cada uno 1-5 puntos, total 50).} \textbf{(1) Plan inicial} con las 4 técnicas aplicadas (S3). \textbf{(2) Variables} mínimo 2, bien nombradas según las 5 reglas (S5). \textbf{(3) Condicionales} mínimo 2, con estructura si-entonces-si no (S6). \textbf{(4) Bucle} mínimo 1, no infinito (S7). \textbf{(5) Interactividad} (preguntar al usuario y usar la respuesta). \textbf{(6) Diagrama de flujo} del programa con símbolos correctos (S4). \textbf{(7) Documentación} en cuaderno (descripción + lista de variables + capturas). \textbf{(8) Funcionamiento real} (el programa se ejecuta sin errores). \textbf{(9) Sustentación oral} clara de 5 minutos. \textbf{(10) Personalización} (tema propio, no copia, sprite y fondos personalizados).
  - |-
    \textbf{Estructura de tu entregable.} (a) \textbf{Programa en Scratch} guardado en \texttt{scratch.mit.edu} con nombre \texttt{2026-cosecha-p2-[tu-nombre]}. (b) \textbf{Diagrama de flujo} dibujado en el cuaderno aplicando S4 (óvalos, rectángulos, rombos, paralelogramos, flechas). (c) \textbf{Documentación} con: descripción de 1 párrafo, lista de variables con tipo, capturas de 3 momentos del programa, descripción de cómo aplicaste las 4 técnicas. (d) \textbf{Sustentación oral}: 5 minutos donde muestras el programa funcionando, explicas tus decisiones de diseño, comentas qué te costó más.
  - |-
    \textbf{3 cosas que diferencian un programa básico de uno bueno.} (1) \emph{Personalización}: tu programa no se parece al de tu compañero. Tienes sprites, fondos, narrativa propios. (2) \emph{Coherencia}: las variables, condicionales y bucles tienen lógica clara, no están puestos al azar para cumplir requisitos. (3) \emph{Funcionamiento real}: el programa se ejecuta sin errores. Si los hay, los detectas en pruebas previas y los corriges.
  - |-
    \textbf{Errores típicos en la cosecha.} (1) \emph{Querer ser muy ambicioso} y no terminar a tiempo. Mejor un programa simple bien terminado que uno complejo a medias. (2) \emph{Empezar a programar sin plan} --- te pierdes en 30 minutos. Sigue tu plan de la Actividad 1. (3) \emph{Olvidar la documentación} --- es 10\% de la rúbrica. (4) \emph{No probar el programa al final} --- llegas a la sustentación con errores. Prueba mínimo 5 veces. (5) \emph{Sustentar lectura, no demostración} --- en la sustentación, muestra el programa funcionando, no leas texto.

  anatomia:
    titulo: 10 criterios + estructura del entregable
    body: |-
      \textbf{10 criterios:} plan · variables · condicionales · bucles · interactividad · diagrama · documentación · funciona · sustentación · personalización. \\[1mm]
      \textbf{Entregable:} programa Scratch + diagrama cuaderno + documentación + sustentación 5 min.

  errores_comunes: |-
    \textbf{Mitos sobre la cosecha del P2.} (1) \emph{``Mientras más complicado, mejor''} --- Falso. Mejor simple bien terminado que complejo incompleto. (2) \emph{``Si copio de un proyecto de Scratch que vi online, está bien''} --- Falso. Tu programa debe ser tuyo. Inspirarse sí; copiar no. (3) \emph{``La sustentación es solo presentación, no cuenta tanto''} --- Falso. Es 10\% directo; las preguntas del profe pesan. (4) \emph{``El diagrama de flujo es opcional''} --- No. Es 10\% de la rúbrica. (5) \emph{``Si funciona, la documentación es secundaria''} --- Falso. La documentación es donde demuestras qué entiendes, no solo qué hiciste.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Rúbrica + estructura del entregable». \textbf{Formato:} lista de los 10 criterios numerados + estructura del entregable. \textbf{Extensión:} 15 líneas. \textbf{Sabes que terminaste cuando} puedes autoevaluar cualquier programa Scratch con la rúbrica.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Programa completo + diagrama + documentación + sustentación} (1.5 sesiones de 90 min + trabajo asíncrono durante la semana). Vas a ejecutar la cosecha completa. Es la prueba real del periodo.

  pilares:
  - |-
    \textbf{Paso 1 --- Programa el proyecto en Scratch (40-50 min).} Con tu plan de la Actividad 1 a la vista, abre Scratch (\texttt{scratch.mit.edu}) y construye el programa. Aplica los 5 elementos: 2 variables, 2 condicionales, 1 bucle, interactividad (preguntar), múltiples escenas/sprites. Personaliza con sprites y fondos propios. Prueba el programa al menos 3 veces durante la construcción para detectar errores temprano. Guarda con nombre \texttt{2026-cosecha-p2-[tu-nombre]}.
  - |-
    \textbf{Paso 2 --- Dibuja el diagrama de flujo (15 min).} En una hoja del cuaderno, dibuja el diagrama de flujo aplicando S4: óvalo INICIO, rectángulos para procesos, rombos para condicionales (con SÍ/NO), paralelogramos para entradas/salidas, flechas direccionales, óvalo FIN. Si tu programa tiene bucles, dibújalos con la estructura de S7 (rombo con condición + flecha que regresa al rombo).
  - |-
    \textbf{Paso 3 --- Documentación en el cuaderno (15 min).} Subtítulo: \textbf{``Documentación de mi programa''}. Incluye: \emph{(a) Descripción de 1 párrafo}: ¿qué hace tu programa, para qué sirve, quién es el usuario?. \emph{(b) Lista de variables}: nombre + tipo + para qué sirve. \emph{(c) Capturas o bocetos de 3 momentos clave del programa} (escena inicial, una decisión importante, escena final). \emph{(d) Las 4 técnicas aplicadas}: 1 línea sobre cómo usaste descomposición, patrones, abstracción y algoritmo.
  - |-
    \textbf{Paso 4 --- Autoevaluación con la rúbrica (5 min).} Antes de la sustentación, abre la rúbrica de 10 criterios. Marca cada uno con tu nota (1-5). Suma. Si algún criterio quedó bajo, ajusta si tienes tiempo. La autoevaluación honesta es parte del oficio adulto.
  - |-
    \textbf{Paso 5 --- Sustentación de 5 minutos (en clase ante profe y grupo).} Estructura sugerida: \emph{(a) 30 segundos: presentar el tema del programa}. \emph{(b) 2 minutos: mostrar el programa funcionando (compartir pantalla en Teams o presencial)}. \emph{(c) 1 minuto: explicar las decisiones de diseño (por qué esa variable, ese condicional, ese bucle)}. \emph{(d) 30 segundos: contar qué te costó más y qué aprendiste}. \emph{(e) 1 minuto: preguntas del profe o compañeros}.
  - |-
    \textbf{Paso 6 --- Cierre del periodo + firma final.} Después de la sustentación, escribe en el cuaderno tu reflexión de cierre del periodo: \emph{``En el periodo 2 aprendí: \_\_\_. Lo que más me sorprendió de la programación fue: \_\_\_. Si pudiera programar cualquier cosa, haría: \_\_\_''}. Firma con nombre y fecha. Cierra formalmente el periodo 2.

  checklist:
    titulo: Antes de sustentar
    items: |-
      \checkbox Mi programa Scratch funciona sin errores. \\[1mm]
      \checkbox Tiene mínimo 2 variables, 2 condicionales, 1 bucle, interactividad. \\[1mm]
      \checkbox El diagrama de flujo está dibujado en el cuaderno. \\[1mm]
      \checkbox La documentación tiene descripción, variables, 3 capturas, 4 técnicas. \\[1mm]
      \checkbox Hice autoevaluación con los 10 criterios de la rúbrica. \\[1mm]
      \checkbox Estoy listo para sustentar 5 minutos con seguridad.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} programa en Scratch (variables + condicionales + bucle + interactividad). \textit{Paso 2:} diagrama de flujo en cuaderno. \textit{Paso 3:} documentación. \textit{Paso 4:} autoevaluación con rúbrica. \textit{Paso 5:} sustentación 5 min. \textit{Paso 6:} reflexión de cierre.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Cosecha del P2: programa completo». \textbf{Formato:} diagrama + documentación + autoevaluación + reflexión. \textbf{Extensión:} 2 páginas. \textbf{Sabes que terminaste cuando} sustentaste el programa al profe y al grupo.

  producto_titulo: Programa Scratch completo + diagrama + documentación + sustentación 5 min
  criterios:
  - El programa Scratch integra variables, condicionales, bucles, interactividad.
  - El diagrama de flujo está completo y correcto.
  - La documentación incluye descripción, variables, capturas y 4 técnicas.
  - Se hizo autoevaluación honesta con la rúbrica de 10 criterios.
  - La sustentación oral de 5 minutos fue clara y demostrativa.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la cosecha colectiva)"
    cita: |-
      ``El que termina su obra y la muestra a la comunidad cierra el ciclo. El que la oculta, la deja incompleta.''
    aplicacion: |-
      Doña Sofía la tejedora del Valle no se quedaba con la mochila terminada en su casa: la \textbf{llevaba a la plaza}, la mostraba, recibía retroalimentación, transmitía el saber. \emph{Esa misma virtud aplica a tu cosecha hoy}. Tu programa de Scratch no es solo tu producto privado: es \emph{tu obra que muestras al grupo}. La sustentación cierra el ciclo del aprendizaje. \emph{Sin sustentar, el aprendizaje queda a medias}.
    pregunta_espejo: |-
      ¿Estoy mostrando mis obras (académicas y personales) o las guardo solo para mí?

  estoico:
    autor: "Marco Aurelio (emperador del trabajo cumplido)"
    cita: |-
      ``Termina lo que empezaste con la misma atención con que empezaste. La obra cumplida da paz; la inconclusa pesa siempre.''
    aplicacion: |-
      Hace 10 sesiones empezaste el periodo \emph{sin saber programar}. Hoy entregas un programa con variables, condicionales, bucles, interactividad y sustentación. \textbf{Ese arco de 10 sesiones es ejemplo de oficio cumplido}. Marco Aurelio aplaudiría: \emph{empezar bien + sostener disciplina + cerrar bien}. La cosecha es la última disciplina, la que faltaba.
    pregunta_espejo: |-
      ¿Cuántas cosas empecé este año y dejé incompletas? ¿Qué pasaría si las terminara una a una?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del oficio digital)"
    cita: |-
      ``Programar tu primer programa completo es rito de paso. Cambias de quien aprieta botones a quien crea con código. No hay vuelta atrás.''
    aplicacion: |-
      \textbf{Hoy cambias de identidad}: antes eras \emph{usuario de programas}, ahora eres \emph{creador de programas}. La diferencia es enorme. \emph{Los usuarios consumen lo que otros producen; los creadores deciden qué se produce}. Tú hiciste un programa, no muy complejo, pero tuyo y completo. \emph{Esa transformación no se olvida}: tu yo de 25 años va a recordar que en grado 7 ya creabas con código. Esa identidad te acompañará a la universidad y al trabajo.
    pregunta_espejo: |-
      Hoy soy creador digital. ¿En qué otras áreas de mi vida soy creador y no solo consumidor?

compromiso: |-
  \textbf{Para la siguiente sesión.} Guarda tu programa en Scratch. La siguiente sesión es la \textbf{S11} (cosecha formal del periodo): autoevaluación con rúbrica visible, examen integrador del P2, y mirada al P3 que se viene: \emph{Inteligencia Artificial}. Hoy cerraste la programación básica; en P3 abres la puerta a la IA que ya está cambiando el mundo.

web:
  conceptos_clave:
    - termino: Cosecha del periodo (P2)
      definicion: |-
        Trabajo final que integra todo lo aprendido durante el periodo en un solo programa Scratch. Combina algoritmos, pensamiento computacional, diagramas, variables, condicionales, bucles y narrativa interactiva. Es el rito de paso del periodo.
      ejemplo: |-
        Tu programa de cosecha podría ser un juego sencillo (atrapar manzanas), una historia interactiva (continuación de la S9), un simulador (clima del día) o una animación con eventos.
      emoji: "🌾"
    - termino: 10 criterios de la rúbrica
      definicion: |-
        Las 10 dimensiones con las que el profe evalúa la cosecha: plan inicial, variables, condicionales, bucles, interactividad, diagrama, documentación, funcionamiento, sustentación, personalización. Cada uno vale 1-5 puntos.
      ejemplo: |-
        Conocer la rúbrica te permite producir según los criterios. Si sabes que personalización es 10%, harás sprites únicos. Si sabes que documentación es 10%, harás el cuaderno completo.
      emoji: "📊"
    - termino: Documentación del programa
      definicion: |-
        Conjunto de información que explica qué hace el programa, cómo está estructurado y cómo se usa. Para 7° grado: descripción + lista de variables + capturas + 4 técnicas aplicadas. Es 10% de la rúbrica.
      ejemplo: |-
        Una página del cuaderno con: 'Mi programa es un juego donde el sprite atrapa manzanas. Variables: puntaje, vidasRestantes. Capturas: inicio, juego, fin. Descomposición: 4 partes.'
      emoji: "📋"
    - termino: Sustentación oral
      definicion: |-
        Presentación de 5 minutos donde explicas tu programa al profe y al grupo. Mostrarse funcionando, explicar decisiones de diseño, comentar qué te costó y aprendiste. Termina con preguntas del profe.
      ejemplo: |-
        '30s: tema. 2 min: programa funcionando. 1 min: decisiones de diseño. 30s: qué aprendí. 1 min: preguntas.' Estructura clara, demostración real.
      emoji: "🎤"
    - termino: Autoevaluación con rúbrica
      definicion: |-
        Práctica de evaluar tu propio trabajo antes de la evaluación del profe usando los criterios oficiales. Permite identificar puntos débiles y ajustar antes de entregar. Disciplina adulta clave.
      ejemplo: |-
        Antes de sustentar: ¿mi programa funciona? (criterio 8). ¿Tiene 2 variables? (criterio 2). ¿La sustentación está lista? (criterio 9). Marcas 1-5 en cada uno y ajustas.
      emoji: "🪞"

  quiz:
    titulo: "¿Estás listo para entregar tu cosecha?"
    instrucciones: "5 preguntas para verificar que tu programa cumple los 10 criterios."
    preguntas:
      - enunciado: "¿Cuáles son los componentes mínimos del programa de cosecha?"
        opciones:
          - "Solo un sprite que se mueve."
          - "2 variables + 2 condicionales + 1 bucle + interactividad + múltiples escenas/sprites."
          - "Solo bucles."
          - "Solo un cuento sin programación."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La cosecha integra 4 conceptos clave del periodo: variables (S5), condicionales (S6), bucles (S7) e interactividad (S9). Si te falta alguno, la cosecha está incompleta.
        feedback_incorrecto: |-
          2 variables + 2 condicionales + 1 bucle + interactividad. Esos son los mínimos que demuestran que aprendiste todo el periodo. Falta alguno = cosecha incompleta.
      - enunciado: "¿Qué pesa MÁS, según la rúbrica de 10 criterios?"
        opciones:
          - "Solo el programa."
          - "Funcionamiento real Y sustentación oral Y documentación: cada uno tiene su peso."
          - "Solo la sustentación."
          - "Solo el diagrama."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La rúbrica evalúa 10 criterios distintos, cada uno con su peso. Funcionamiento, sustentación y documentación son todos importantes. No se trata solo del programa.
        feedback_incorrecto: |-
          10 criterios = 10 dimensiones evaluadas. Programa funcionando, sustentación oral, documentación, diagrama, todo cuenta. Cada uno aporta a la nota final.
      - enunciado: "Tu programa funciona pero no documentaste nada en el cuaderno. ¿Está completo?"
        opciones:
          - "Sí, lo importante es que funcione."
          - "No. La documentación es 10% de la rúbrica. Sin ella, pierdes esos puntos."
          - "Sí, solo necesita estar guardado."
          - "Sí, la documentación es opcional."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La documentación NO es opcional. Es donde demuestras qué entiendes, no solo qué hiciste. Programa funciona + documentación = cosecha completa.
        feedback_incorrecto: |-
          Documentación obligatoria. Descripción + variables + capturas + 4 técnicas. Sin ella, pierdes puntos por no demostrar comprensión, solo ejecución.
      - enunciado: "Antes de la sustentación, ¿qué deberías hacer?"
        opciones:
          - "Nada, llegar directo."
          - "Autoevaluación con los 10 criterios + probar el programa 5 veces + ensayar la presentación."
          - "Dormir mucho."
          - "Borrar el cuaderno."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Autoevaluación + pruebas + ensayo. Llegar a sustentar sin preparación es desperdiciar el trabajo de 10 sesiones. Prepararse es respeto al esfuerzo.
        feedback_incorrecto: |-
          Autoevaluación con rúbrica + probar programa 5 veces + ensayar presentación. La preparación cierra el ciclo del oficio. Improvisar al final daña todo lo anterior.
      - enunciado: "Durante 10 sesiones aprendiste a programar. ¿Cómo te sentís ahora?"
        opciones:
          - "Como cuando empezaste."
          - "Diferente: ahora soy creador digital, no solo usuario. Esa transformación es real y permanente."
          - "Exactamente igual."
          - "Sin cambio."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Programar tu primer programa completo es rito de paso. Tu identidad digital cambió: ya no solo consumes apps; ahora puedes crear con código. No hay vuelta atrás.
        feedback_incorrecto: |-
          Eres creador digital ahora. Antes consumías apps; ahora puedes crearlas. Esa transformación de identidad te acompaña al resto de tu vida. Es lo más valioso del periodo.

clave: "2-2"
grado: 7
periodo: 2
sesion: 2
completo: true

titulo: "¿Qué es un algoritmo? --- la receta paso a paso"
titulo_portada: |-
  ¿Qué es un
  algoritmo? ---
  la receta
  paso a paso

producto_final: |-
  Un \textbf{algoritmo escrito en el cuaderno} de algo cotidiano que tú sepas hacer (preparar arepas, organizar el morral, lavarte los dientes, hacer una llamada, jugar un juego, etc.). El algoritmo tiene: \textbf{(a) nombre claro}; \textbf{(b) entrada} (qué necesitas para empezar); \textbf{(c) pasos numerados} (mínimo 6); \textbf{(d) salida} (qué resultado se obtiene); \textbf{(e) 5 características} verificadas (claro, finito, determinista, eficaz, ordenado). Más \textbf{una autoevaluación} de cuál característica te costó más cumplir.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural de Cartago siempre decía: ``El que se sabe la receta exacta, hornea pan. El que la sabe a medias, hornea decepción.''} En la vereda La Plata, las recetas de panadería se transmitían \emph{exactas, paso a paso, sin saltarse nada}. Si una abuela enseñaba a su nieta a hacer pan de yuca, la receta era: \emph{``1 libra de yuca rallada. 1 huevo. 200 gramos de queso. 1 cucharadita de sal. (1) Pelar y rallar la yuca. (2) Mezclar la yuca con el huevo. (3) Agregar el queso rallado. (4) Amasar con las manos hasta que quede uniforme. (5) Formar bolitas del tamaño de un huevo. (6) Hornear a 180° por 20 minutos. (7) Sacar y dejar enfriar.''}. La nieta podía hornear el mismo pan que su abuela porque la receta era \textbf{exacta, completa y ordenada}. Si alguien decía \emph{``hornee como Dios le ayude''}, la nieta dañaba el pan. \textbf{Una receta clara es un algoritmo.} Hoy en programación llamamos \emph{algoritmo} exactamente a eso: una receta paso a paso para resolver un problema, lo suficientemente clara para que cualquiera (o un computador) pueda ejecutarla.

  saber_contemporaneo: |-
    Un \textbf{algoritmo} es una \emph{secuencia ordenada de pasos para resolver un problema o realizar una tarea}. La palabra viene del matemático persa \textbf{Al-Juarismi} (siglo IX), que enseñó a Europa los procedimientos matemáticos sistemáticos. Hoy los algoritmos están \textbf{en todas partes}: Google los usa para buscar; TikTok los usa para recomendarte videos; el cajero del banco los usa para entregar dinero; el GPS los usa para encontrar rutas. \textbf{Un buen algoritmo tiene 5 características} (las aprenderás hoy). Si falta una, el algoritmo no funciona bien. \textbf{La habilidad de escribir buenos algoritmos} es el corazón del pensamiento computacional. No requiere computador: puedes escribir un algoritmo en cuaderno, ejecutarlo tú mismo, verificarlo. Hoy haces eso: tu primer algoritmo en lenguaje natural.

  pregunta_puente: |-
    Si tu mejor amigo nunca ha hecho una arepa, ¿\textbf{qué tan detallada} debería ser tu receta para que él la haga bien? ¿Cuántos pasos crees que necesita?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} qué es un algoritmo y dónde se usa; (2) sabrás \textbf{explicar} las 5 características de un buen algoritmo; (3) podrás \textbf{aplicar} la estructura entrada-proceso-salida; (4) habrás \textbf{creado} tu primer algoritmo en lenguaje natural.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: descubres qué es un algoritmo, aprendes las 5 características, escribes tu primer algoritmo, lo verificas.
  a_escuta: |-
    Empezamos analizando una receta mala y una buena.
  a_sistematizacion: |-
    Después aprendes las 5 características + la estructura entrada-proceso-salida.
  a_praxis: |-
    Con todo claro, escribes tu propio algoritmo paso a paso.
  a_producto: |-
    El producto es ese algoritmo + autoevaluación.
  a_evaluacion: |-
    Antes de salir, verifica con un compañero que él podría ejecutar tu algoritmo solo leyéndolo.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué la claridad en los pasos es virtud práctica.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 2 recetas: ¿cuál sí funciona?} (10 min · individual). Lee estas 2 versiones de \emph{cómo lavar las manos}. En el cuaderno responde: \emph{¿cuál sirve como algoritmo y cuál no?, ¿por qué?}. \textbf{Versión A:} \emph{``Lavarse las manos: agua y jabón. Mojarlas, jabonarlas, frotar, secar.''}. \textbf{Versión B:} \emph{``Lavarse las manos: (1) Abrir el grifo del lavamanos. (2) Mojarse las manos con agua. (3) Poner jabón en la palma de una mano (medio tapón). (4) Frotar las dos manos durante 20 segundos cubriendo dedos, palmas y dorso. (5) Enjuagar con agua hasta que no quede jabón. (6) Cerrar el grifo. (7) Secarse con una toalla limpia.''}. \emph{Ambas describen la misma tarea, pero una sirve como algoritmo y otra no.}

  checks:
  - Leí las 2 versiones con calma.
  - Identifiqué cuál sí sirve como algoritmo.
  - Pensé qué hace diferente a la versión B.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 2 recetas comparadas». \textbf{Formato:} respuesta corta de 3-4 líneas. \textbf{Extensión:} 4 líneas. \textbf{Sabes que terminaste cuando} identificas que la versión B es algoritmo porque es ordenada, exacta y completa.

sistematizacion:
  intro: |-
    La diferencia entre la Versión A y la Versión B es que B cumple las \textbf{5 características de un buen algoritmo}. Ahora las aprendes con detalle.

  pilares:
  - |-
    \textbf{Característica 1 --- CLARO.} Cada paso se entiende sin ambigüedad. \emph{``Mojarlas''} no es claro (¿en qué agua? ¿cuánto?). \emph{``Mojarse las manos con agua del grifo durante 3 segundos''} sí es claro. \textbf{Característica 2 --- FINITO.} El algoritmo tiene un fin. No corre eternamente. Termina en algún paso. \emph{``Lavar manos''} termina al secar. \textbf{Característica 3 --- DETERMINISTA.} Si lo ejecutas con la misma entrada, da el mismo resultado siempre. \emph{Lavar manos con agua y jabón siempre da manos limpias, no a veces sí y a veces no}.
  - |-
    \textbf{Característica 4 --- EFICAZ.} Logra el objetivo. No es algoritmo si los pasos no llevan a la meta. \emph{``Bailar mientras mojas las manos''} podría ser claro y finito, pero no eficaz para limpiarlas. \textbf{Característica 5 --- ORDENADO.} Los pasos están en secuencia exacta. \emph{No se puede secar antes de enjuagar; no se puede jabonar antes de mojar}. El orden importa. Si cambias el orden, el algoritmo falla o se vuelve absurdo.
  - |-
    \textbf{La estructura entrada-proceso-salida.} Todo algoritmo tiene 3 partes: \textbf{(1) Entrada (input):} lo que necesitas para empezar. En la receta de pan: \emph{yuca, huevo, queso, sal}. \textbf{(2) Proceso:} los pasos ordenados que transforman la entrada. \emph{Mezclar, amasar, formar, hornear}. \textbf{(3) Salida (output):} el resultado final. \emph{Pan de yuca terminado}. Esa estructura aplica a cualquier algoritmo: receta, programa, manual de armado.
  - |-
    \textbf{4 ejemplos de algoritmos cotidianos.} (1) \emph{Cepillarse los dientes}: entrada = cepillo + crema + agua; proceso = mojar cepillo, poner crema, cepillar 2 min, enjuagar; salida = boca limpia. (2) \emph{Hacer una llamada}: entrada = celular + número; proceso = desbloquear, ir a Teléfono, marcar número, pulsar verde, hablar, colgar; salida = conversación realizada. (3) \emph{Llegar al colegio}: entrada = uniforme + morral + transporte; proceso = vestirse, desayunar, salir, tomar bus, bajar en la parada, caminar, entrar; salida = llegada a tiempo. (4) \emph{Resolver una ecuación}: entrada = ecuación; proceso = pasar términos, simplificar, despejar; salida = valor de x.

  anatomia:
    titulo: 5 características + entrada-proceso-salida
    body: |-
      \textbf{5 características:} \\[1mm]
      \textbf{1.} CLARO --- cada paso se entiende. \\[1mm]
      \textbf{2.} FINITO --- termina en algún momento. \\[1mm]
      \textbf{3.} DETERMINISTA --- mismo input, mismo output. \\[1mm]
      \textbf{4.} EFICAZ --- logra el objetivo. \\[1mm]
      \textbf{5.} ORDENADO --- pasos en secuencia exacta. \\[1mm]
      \textbf{Estructura:} ENTRADA → PROCESO → SALIDA.

  errores_comunes: |-
    \textbf{Errores al escribir tu primer algoritmo.} (1) \emph{Pasos vagos:} \emph{``cocinar bien''} no es claro. Usa verbos exactos. (2) \emph{Saltar pasos obvios:} para ti es obvio que primero hay que abrir el grifo, pero para un robot no. Escribe TODO. (3) \emph{Orden incorrecto:} secar antes de enjuagar = manos con jabón. El orden importa. (4) \emph{Sin definir la entrada:} si no dices qué se necesita, quien ejecuta no sabe por dónde empezar. (5) \emph{Sin definir la salida:} si no dices qué resultado esperar, no se sabe si funcionó.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Diagnóstico de un algoritmo defectuoso». \textbf{Formato:} tabla de 5 filas, 2 columnas. Columna 1: característica. Columna 2: ejemplo bueno + ejemplo malo. \textbf{Veredicto:} mira este algoritmo de \emph{``preparar un sandwich''} → ``1. tomar pan 2. tomar jamón 3. ya está''. ¿\textbf{Cuáles de las 5 características le faltan} y cuál es la más grave? Reescríbelo aplicando solo la característica más crítica. \textbf{Extensión:} 5 filas + veredicto. \textbf{Sabes que terminaste cuando} puedes señalar con precisión qué falla y por qué falla en cualquier algoritmo defectuoso.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu primer algoritmo escrito} (28 min · individual). Vas a escribir un algoritmo de algo que tú sepas hacer y que sea cotidiano (no académico). Después lo verificas con un compañero.

  pilares:
  - |-
    \textbf{Paso 1 --- Escoge un tema cotidiano.} En el cuaderno escribe el tema. Sugerencias: \emph{``Cómo preparar arepas''}, \emph{``Cómo organizar mi morral''}, \emph{``Cómo enviar un mensaje de WhatsApp''}, \emph{``Cómo jugar [tu juego favorito]''}, \emph{``Cómo hacer una llamada''}, \emph{``Cómo armar un rompecabezas''}. Escoge algo que TÚ sepas hacer bien.
  - |-
    \textbf{Paso 2 --- Define entrada y salida.} Arriba del algoritmo escribe: \emph{``Algoritmo: [tu tema]''}. Debajo: \emph{``Entrada (lo que necesito): \_\_\_\_\_''} (lista de ingredientes/herramientas/datos). Después: \emph{``Salida (resultado esperado): \_\_\_\_\_''} (qué se obtiene al final).
  - |-
    \textbf{Paso 3 --- Lista numerada de pasos.} Escribe mínimo \textbf{6 pasos} numerados (1, 2, 3, ...). Cada paso debe ser \emph{una acción concreta} con \emph{verbo en infinitivo}: \emph{``Abrir el grifo''}, \emph{``Mezclar los ingredientes''}, \emph{``Esperar 5 minutos''}. No vagos como \emph{``preparar todo''}. Si te toma 10 pasos, mejor.
  - |-
    \textbf{Paso 4 --- Verifica las 5 características.} Lee tu algoritmo y marca con palomita ✓ cada una. \emph{¿Es CLARO?} (cada paso se entiende sin ambigüedad). \emph{¿Es FINITO?} (termina, no corre eternamente). \emph{¿Es DETERMINISTA?} (mismo input, mismo output). \emph{¿Es EFICAZ?} (logra el objetivo). \emph{¿Es ORDENADO?} (los pasos están en secuencia correcta). Si alguna falla, corrige antes de seguir.
  - |-
    \textbf{Paso 5 --- Verifica con un compañero.} Intercambia tu cuaderno con un compañero. Cada uno lee el algoritmo del otro y trata de ejecutarlo mentalmente (si fuera un robot, ¿podría hacerlo?). Anota \emph{dudas o ambigüedades} que encontraste en el algoritmo del compañero. Devuélvanse los cuadernos y corrijan según las dudas señaladas.
  - |-
    \textbf{Paso 6 --- Autoevaluación.} Al final escribe: \emph{``La característica que más me costó cumplir fue: \_\_\_\_\_ porque \_\_\_\_\_''}. Firma con nombre y fecha. Tu primer algoritmo está listo.

  checklist:
    titulo: Antes de cerrar la S2
    items: |-
      \checkbox Mi algoritmo tiene nombre claro arriba. \\[1mm]
      \checkbox Entrada y salida están definidas. \\[1mm]
      \checkbox Hay mínimo 6 pasos numerados con verbos concretos. \\[1mm]
      \checkbox Verifiqué las 5 características y todas se cumplen. \\[1mm]
      \checkbox Un compañero lo verificó y corregí lo que él señaló. \\[1mm]
      \checkbox Hice autoevaluación firmada.

  plantilla_guion: |-
    \textbf{Estructura del algoritmo.} \textit{Título:} Algoritmo + tema. \textit{Entrada:} lista de necesidades. \textit{Salida:} resultado esperado. \textit{Pasos:} lista numerada (mínimo 6), cada uno con verbo concreto. \textit{Verificación:} 5 características con palomita. \textit{Autoevaluación:} cuál característica costó más + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi primer algoritmo». \textbf{Formato:} título + entrada + 6+ pasos + salida + 5 características verificadas + autoevaluación. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} otro compañero puede ejecutar tu algoritmo solo leyéndolo (sin que tú expliques).

  producto_titulo: Mi primer algoritmo en lenguaje natural · verificado y firmado
  criterios:
  - El algoritmo tiene nombre claro y estructura entrada-proceso-salida.
  - Hay mínimo 6 pasos numerados con verbos concretos.
  - Las 5 características están verificadas con palomita.
  - Un compañero verificó el algoritmo y se hicieron correcciones.
  - Hay autoevaluación honesta con firma.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la transmisión del saber)"
    cita: |-
      ``El saber que se transmite paso a paso es saber que sobrevive generaciones. El que se transmite con vaguedad muere con quien lo tuvo.''
    aplicacion: |-
      Doña Mercedes y las abuelas tejedoras del Valle del Cauca \textbf{enseñaban en pasos exactos} porque sabían que solo así el saber sobrevivía. La receta de pan de yuca llegó a tu generación porque cada abuela la escribía clara. La receta del tejido Wayuu llegó a 2026 porque cada generación la transmite con precisión. \emph{Escribir buenos algoritmos es continuar esa tradición}: dejar el saber listo para que otros lo ejecuten, incluso si tú ya no estás ahí para explicar.
    pregunta_espejo: |-
      Si yo enseñara algo que sé hacer a un primo más pequeño, ¿lo enseñaría con la claridad de doña Mercedes, o con vaguedad?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Pasos en orden, palabras exactas, fin claro. Esa es la trinidad del trabajo bien hecho.''
    aplicacion: |-
      \textbf{Las 5 características de un buen algoritmo son disciplina trasladada al pensamiento}: \emph{claro (palabras exactas), finito (con fin claro), ordenado (en secuencia), eficaz (logra meta), determinista (mismo input mismo output)}. Esa disciplina es valiosa en programación pero también en \emph{escribir un ensayo, planear un viaje, resolver una pelea}. La capacidad de descomponer en pasos claros es signo de mente entrenada.
    pregunta_espejo: |-
      ¿Qué problema actual de mi vida podría resolver mejor si lo pensara como algoritmo?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la algorítmica)"
    cita: |-
      ``Vivimos rodeados de algoritmos invisibles. El que aprende a escribir uno empieza a entender el mundo digital en que vive.''
    aplicacion: |-
      Los algoritmos que recomiendan tus videos de TikTok, los que clasifican tus correos como spam, los que ordenan los resultados de Google: \textbf{los escribieron seres humanos como tú}. Eran pensamientos paso a paso que alguien tradujo a lenguaje de programación. \emph{Aprender a escribir algoritmos en lenguaje natural es el primer paso} para entender (y eventualmente criticar) los algoritmos invisibles que rigen tu mundo digital.
    pregunta_espejo: |-
      Si los algoritmos los escriben personas, ¿quién decide qué algoritmo me recomienda mis videos? ¿Y por qué me debería importar?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, escribe en tu cuaderno un \emph{segundo} algoritmo de otra tarea cotidiana. Practica las 5 características. La próxima clase aprendes las \textbf{4 técnicas del pensamiento computacional}: cómo abordar problemas grandes descomponiéndolos.

web:
  conceptos_clave:
    - termino: Algoritmo
      definicion: |-
        Secuencia ordenada de pasos para resolver un problema o realizar una tarea. La palabra viene del matemático persa Al-Juarismi (siglo IX). Hoy los algoritmos están en computadores, recetas, manuales, tejidos: en todas partes.
      ejemplo: |-
        Una receta de pan: ingredientes (entrada) + pasos (proceso) + pan terminado (salida). Un programa de Roblox: comandos del jugador (entrada) + reglas del juego (proceso) + acciones del personaje (salida).
      emoji: "📜"
    - termino: 5 características de un buen algoritmo
      definicion: |-
        Las 5 reglas que todo buen algoritmo cumple: (1) CLARO (sin ambigüedad), (2) FINITO (termina), (3) DETERMINISTA (mismo input mismo output), (4) EFICAZ (logra la meta), (5) ORDENADO (pasos en secuencia correcta). Faltando una, el algoritmo falla.
      ejemplo: |-
        Receta 'cocinar bien' no es CLARA. Receta sin fin no es FINITA. Receta que a veces sirve y a veces no es no DETERMINISTA. Bailar mientras lavas no es EFICAZ. Secar antes de enjuagar no es ORDENADO.
      emoji: "✅"
    - termino: Estructura entrada-proceso-salida
      definicion: |-
        Todo algoritmo tiene 3 partes: (1) ENTRADA (lo que necesitas para empezar), (2) PROCESO (los pasos), (3) SALIDA (el resultado). Identificar las 3 partes claramente te ayuda a escribir mejores algoritmos.
      ejemplo: |-
        Algoritmo cepillarse: ENTRADA cepillo+crema+agua; PROCESO mojar cepillo, poner crema, cepillar 2 min, enjuagar; SALIDA boca limpia. Las 3 partes claras.
      emoji: "🔄"
    - termino: Al-Juarismi
      definicion: |-
        Matemático persa del siglo IX. Su nombre dio origen a la palabra 'algoritmo'. Enseñó a Europa los procedimientos matemáticos sistemáticos (sumas, restas, multiplicaciones paso a paso). Sus libros se tradujeron al latín y formaron base de la matemática europea moderna.
      ejemplo: |-
        Cuando hoy decimos 'algoritmo' estamos honrando a Al-Juarismi (Muhammad ibn Musa al-Khwarizmi). Su trabajo del siglo IX sigue vivo en cada programa de computador.
      emoji: "🕌"
    - termino: Determinista
      definicion: |-
        Característica de un algoritmo: si lo ejecutas con la misma entrada, siempre da el mismo resultado. Lo opuesto sería 'aleatorio' o 'imprevisible'. Los algoritmos buenos son deterministas (siempre dan el mismo output con el mismo input).
      ejemplo: |-
        Algoritmo determinista: 'sumar 5 + 3' siempre da 8. Algoritmo NO determinista: 'lanzar moneda' da cara o sello al azar. Las recetas y programas son deterministas.
      emoji: "🎯"

  quiz:
    titulo: "¿Sabes qué es un algoritmo?"
    instrucciones: "5 preguntas para verificar que dominas la definición y las 5 características."
    preguntas:
      - enunciado: "¿Cuál de estas frases es algoritmo?"
        opciones:
          - "'Lavarse las manos: agua y jabón. Hacerlo bien.'"
          - "'Lavarse las manos: (1) abrir grifo (2) mojar (3) jabonar (4) frotar 20s (5) enjuagar (6) cerrar grifo (7) secar.'"
          - "'Tener las manos limpias.'"
          - "'Higiene importante.'"
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La opción correcta cumple las 5 características: pasos claros, ordenados, finitos, deterministas, eficaces. Las otras son demasiado vagas para ser algoritmos.
        feedback_incorrecto: |-
          Un algoritmo es secuencia ordenada de pasos claros. La opción correcta tiene 7 pasos numerados con verbos concretos. Las otras son vagas.
      - enunciado: "Una receta dice 'cocinar a fuego medio'. ¿Qué característica falla?"
        opciones:
          - "No es finita."
          - "No es clara (¿qué es 'medio'? ¿qué fuego? ¿cuánto tiempo?)."
          - "No tiene orden."
          - "No tiene entrada."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. 'Fuego medio' es ambiguo. Para un algoritmo claro: 'fuego a temperatura 5/10 durante 15 minutos'. Lo claro elimina ambigüedad.
        feedback_incorrecto: |-
          Falla la claridad. 'Fuego medio' es ambiguo. Lo claro especificaría temperatura exacta y tiempo exacto. Sin claridad, el algoritmo se ejecuta distinto cada vez.
      - enunciado: "¿De dónde viene la palabra 'algoritmo'?"
        opciones:
          - "Del inglés 'algorithm'."
          - "Del matemático persa Al-Juarismi del siglo IX."
          - "Es palabra moderna inventada con la computación."
          - "Del griego antiguo."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Al-Juarismi (Muhammad ibn Musa al-Khwarizmi) fue matemático persa del siglo IX. Su nombre latinizado dio 'algoritmo'. Su trabajo del 800 d.C. sigue vivo hoy.
        feedback_incorrecto: |-
          De Al-Juarismi (siglo IX). Su trabajo en matemática sistemática llegó a Europa, su nombre se latinizó 'algoritmus' y de ahí 'algoritmo'. 1200 años de historia.
      - enunciado: "Tu algoritmo tiene 6 pasos pero el orden está mal (paso 5 va antes que paso 3 lógicamente). ¿Qué característica falla?"
        opciones:
          - "No es finito."
          - "No es ordenado."
          - "No tiene entrada."
          - "Es demasiado largo."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Orden incorrecto = falla la característica 'ordenado'. Los pasos correctos en mal orden no resuelven el problema. Reorganiza.
        feedback_incorrecto: |-
          Característica ORDENADO. Los pasos correctos en mal orden no producen el resultado. Secar antes de enjuagar deja manos con jabón. Orden importa.
      - enunciado: "Un algoritmo 'tirar moneda y decidir' siempre da resultado distinto. ¿Es determinista?"
        opciones:
          - "Sí, porque tiene pasos."
          - "No, porque no produce el mismo resultado con la misma entrada (tirar moneda)."
          - "Sí, porque siempre lanzas moneda."
          - "Depende de la moneda."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Determinista = mismo input → mismo output siempre. Tirar moneda da cara o sello al azar, así que NO es determinista. Los algoritmos buenos sí lo son.
        feedback_incorrecto: |-
          NO determinista. Determinista = predecible (mismo input → mismo output). Tirar moneda es aleatorio. Los algoritmos de programación son deterministas (no usan azar).

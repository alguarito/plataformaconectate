grado: 7
periodo: 2
sesion: 3
completo: true

titulo: "Pensamiento computacional --- las 4 técnicas del oficio"
titulo_portada: |-
  Pensamiento
  computacional ---
  las 4 técnicas
  del oficio

producto_final: |-
  Una \textbf{aplicación de las 4 técnicas} a un problema real escogido por ti (organizar una fiesta de cumpleaños, planear un viaje al pueblo, hacer un trabajo de Sociales, etc.). En el cuaderno: \textbf{(a) descomposición} del problema en sub-problemas (mínimo 4); \textbf{(b) patrones} identificados; \textbf{(c) abstracción} aplicada (qué dejas afuera porque no es esencial); \textbf{(d) algoritmo final} en pasos numerados. Más \textbf{una reflexión} sobre cuál técnica te costó más.

apertura:
  saber_ancestral: |-
    \textbf{Cuando una abuela campesina del Valle del Cauca preparaba el sancocho para 30 personas, no se ponía a llorar ante la inmensidad de la tarea: la dividía en partes.} \emph{``Una persona pela papas''}, decía. \emph{``Otra pela yuca''}. \emph{``Otra lava el plátano''}. \emph{``Otra prende el fogón''}. \emph{``Otra trae el agua del nacedero''}. En 1 hora, el sancocho está listo. \textbf{Esa habilidad --- dividir un problema grande en sub-problemas manejables --- es la primera técnica del pensamiento computacional}. Se llama \textbf{descomposición}. Pero la abuela también notaba algo más: que \emph{pelar papa y pelar yuca son tareas parecidas} (las dos requieren cuchillo, paciencia, retirar la cáscara). Eso es \textbf{patrones}. Y notaba que \emph{no importaba si la papa tenía manchas o no: la cocinaba igual} --- dejaba afuera los detalles irrelevantes. Eso es \textbf{abstracción}. Y al final, tenía \emph{el orden exacto de pasos} para que todo saliera al mismo tiempo. Eso es \textbf{algoritmo}. \emph{Las 4 técnicas del pensamiento computacional las usaban las abuelas para hacer sancocho, mucho antes de que existieran los computadores}.

  saber_contemporaneo: |-
    El \textbf{pensamiento computacional} no es exclusivo de la programación: es una \emph{forma de abordar problemas} que se aplica en cualquier campo. Su definición moderna viene de \textbf{Jeannette Wing} (científica computacional de Carnegie Mellon, 2006). Tiene \textbf{4 técnicas}: \textbf{(1) Descomposición}: dividir un problema grande en sub-problemas pequeños. \textbf{(2) Reconocimiento de patrones}: identificar similitudes entre sub-problemas y reusar soluciones. \textbf{(3) Abstracción}: dejar afuera los detalles que no son esenciales para enfocarse en lo importante. \textbf{(4) Diseño de algoritmos}: armar la secuencia de pasos que resuelve el problema. \textbf{Las 4 funcionan juntas:} descompones para entender, reconoces patrones para no repetir trabajo, abstraes para simplificar, diseñas el algoritmo final. \emph{Aplicar las 4 técnicas a un problema cualquiera te entrena en una forma de pensar que vale para programar, estudiar, trabajar, vivir}.

  pregunta_puente: |-
    Si te pidieran organizar la \emph{fiesta de cumpleaños número 15} de tu prima (50 personas, presupuesto limitado, 3 días para organizarla), ¿\textbf{por dónde empezarías}? ¿Te paralizarías o sabrías descomponer el problema?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} las 4 técnicas del pensamiento computacional; (2) sabrás \textbf{aplicar} cada una a un problema real; (3) podrás \textbf{evaluar} qué técnica necesita un problema en cada momento; (4) habrás \textbf{creado} una aplicación completa de las 4 técnicas a un problema escogido por ti.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: aprendes las 4 técnicas con ejemplos, escoges un problema real, aplicas las 4 técnicas, evalúas el proceso.
  a_escuta: |-
    Empezamos con un problema grande para ver por qué da pavor sin descomponer.
  a_sistematizacion: |-
    Después aprendes las 4 técnicas con sus ejemplos.
  a_praxis: |-
    Con todo claro, aplicas las 4 técnicas a un problema tuyo.
  a_producto: |-
    El producto es esa aplicación + reflexión final.
  a_evaluacion: |-
    Antes de salir, verifica que aplicaste las 4 técnicas, no solo 1 o 2.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué pensar en 4 técnicas te hace más capaz frente a problemas grandes.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Un problema grande para pensar} (10 min · individual). Lee este caso y en el cuaderno responde solo \textbf{cómo te sentirías} si te lo asignaran. \textbf{El caso:} \emph{``Eres responsable de organizar la celebración de los 50 años de tu colegio. Tienes 60 días, 800 estudiantes, presupuesto limitado, debes coordinar con padres, profesores, exalumnos, prensa local, alcaldía. Hay que hacer: ceremonia, decoración, sonido, comida, invitados, prensa, recordatorios, fotos.''}. \emph{En el cuaderno responde:} \emph{(1) ¿Cómo te sientes ante este problema? (abrumado, motivado, paralizado, etc.)}. \emph{(2) ¿Por dónde empezarías? (cuenta cómo)}. \emph{(3) ¿Crees que se puede hacer solo, o necesitas equipo?}. \emph{(4) ¿Cuánto tiempo crees que tarda planearlo bien?}.

  checks:
  - Leí el caso completo.
  - Reconocí mis emociones honestas ante un problema grande.
  - Respondí las 4 preguntas con sinceridad.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Reacción ante problema grande». \textbf{Formato:} 4 respuestas. \textbf{Extensión:} 5-6 líneas. \textbf{Sabes que terminaste cuando} reconoces que sin método, el problema da pavor.

sistematizacion:
  intro: |-
    Tu reacción honesta es válida: \textbf{los problemas grandes paralizan} si no se sabe descomponerlos. El pensamiento computacional te da el método. Aprende las 4 técnicas con ejemplos del caso del colegio.

  pilares:
  - |-
    \textbf{Técnica 1 --- DESCOMPOSICIÓN.} Dividir el problema grande en sub-problemas. \emph{``Celebrar los 50 años''} se divide en: \emph{(a) Ceremonia formal}, \emph{(b) Decoración del colegio}, \emph{(c) Sonido y tarima}, \emph{(d) Comida y bebida}, \emph{(e) Invitar a exalumnos y prensa}, \emph{(f) Souvenirs y recordatorios}, \emph{(g) Plan B en caso de lluvia}. \textbf{Cada sub-problema es manejable; el problema grande no lo era}. Esta es la técnica que más alivia la sensación de abrumamiento.
  - |-
    \textbf{Técnica 2 --- PATRONES.} Identificar similitudes entre sub-problemas para no inventar de cero cada vez. \emph{``Decoración del colegio''} y \emph{``Decoración de las aulas''} son problemas parecidos: se puede usar el mismo equipo, las mismas reglas. \emph{``Invitar a exalumnos''} y \emph{``Invitar a prensa''} son parecidos: ambos requieren lista, correos, confirmaciones. \textbf{Reconocer patrones te ahorra tiempo}: si resolviste uno, resuelves el otro. Las abuelas que pelaban papa y yuca al tiempo aplicaban patrones.
  - |-
    \textbf{Técnica 3 --- ABSTRACCIÓN.} Dejar afuera los detalles que no son esenciales en este momento. Cuando planeas la ceremonia, no te importa todavía el menú exacto del almuerzo. Cuando armas la lista de invitados, no te importa todavía el color de los manteles. \textbf{Abstraer significa enfocarse en lo importante de cada sub-problema, sin perderse en detalles que vendrán después}. Sin abstracción te abrumas; con ella, avanzas.
  - |-
    \textbf{Técnica 4 --- ALGORITMO.} Después de descomponer, encontrar patrones y abstraer, armas la \emph{secuencia exacta de pasos} para resolver. \emph{``Día 1-15: planeación general. Día 16-30: invitaciones y confirmaciones. Día 31-45: producción de decoración y comida. Día 46-55: ensayo y prueba. Día 56-60: ejecución''}. Cada sub-problema tiene su mini-algoritmo dentro del algoritmo grande. Esta es la culminación: el método operativo que se puede ejecutar.

  anatomia:
    titulo: 4 técnicas + cómo funcionan juntas
    body: |-
      \textbf{1.} DESCOMPOSICIÓN --- dividir en sub-problemas. \\[1mm]
      \textbf{2.} PATRONES --- reconocer similitudes. \\[1mm]
      \textbf{3.} ABSTRACCIÓN --- dejar lo no esencial afuera. \\[1mm]
      \textbf{4.} ALGORITMO --- secuencia de pasos final. \\[1mm]
      \textbf{Funcionan juntas:} descompones, encuentras patrones, abstraes, armas algoritmo.

  errores_comunes: |-
    \textbf{Errores frecuentes al aplicar las 4 técnicas.} (1) \emph{Saltarse la descomposición} --- intentar resolver el problema completo. Se vuelve abrumador. (2) \emph{No buscar patrones} --- inventar cada sub-problema desde cero, perdiendo tiempo. (3) \emph{No abstraer} --- preocuparse por detalles irrelevantes al inicio. La ceremonia primero, los manteles después. (4) \emph{Hacer algoritmo sin descomponer} --- el algoritmo queda inmanejable. (5) \emph{Creer que las técnicas son lineales} --- en realidad se aplican en ciclos. Descompones, ves patrones, abstraes, y a veces vuelves a descomponer más fino.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 4 técnicas + ejemplo». \textbf{Formato:} bloque A con las 4 técnicas definidas + 1 ejemplo cada una. Bloque B con un ejemplo del caso del cumpleaños 15 aplicando las 4. \textbf{Extensión:} 10 líneas. \textbf{Sabes que terminaste cuando} podrías explicarle las 4 técnicas a un compañero usando un ejemplo cotidiano.

praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA --- Aplica las 4 técnicas a un problema tuyo} (32 min · individual). Vas a tomar un problema real que tengas (no académico, no inventado) y aplicar las 4 técnicas paso a paso.

  pilares:
  - |-
    \textbf{Paso 1 --- Escoge tu problema.} En el cuaderno escribe: \emph{``Mi problema: \_\_\_\_\_''}. Tiene que ser \emph{real} (no inventado), \emph{relativamente grande} (que se sienta abrumador), y \emph{que esté en tu radar} (algo que ya quieres hacer o que tienes pendiente). Sugerencias: \emph{organizar tu cuarto antes de que llegue la abuela}, \emph{planear una salida con amigos al parque}, \emph{preparar para un examen de varias materias}, \emph{ayudar a tu mamá con la mudanza}, \emph{lanzar un mini-emprendimiento de venta de algo en el colegio}.
  - |-
    \textbf{Paso 2 --- Descomposición.} Subtítulo: \textbf{``Mi descomposición''}. Lista numerada de \textbf{mínimo 4 sub-problemas} en que se divide tu problema grande. Cada sub-problema debe ser manejable, no abrumador. Ejemplo: si el problema es \emph{``organizar mi cuarto antes de que llegue la abuela''}, los sub-problemas podrían ser: \emph{(1) Recoger ropa sucia y limpia; (2) Ordenar la biblioteca; (3) Barrer y trapear; (4) Limpiar el escritorio; (5) Cambiar las sábanas; (6) Sacar la basura}.
  - |-
    \textbf{Paso 3 --- Patrones.} Subtítulo: \textbf{``Patrones que encuentro''}. Identifica \textbf{2-3 similitudes} entre tus sub-problemas. Ejemplo: \emph{Recoger ropa, ordenar biblioteca y limpiar escritorio son ``ordenar superficies''. Barrer y trapear son ``limpieza del piso''. Cambiar sábanas y sacar basura son ``actividades de cierre''}. Identificar patrones agrupa tareas que se pueden hacer con la misma estrategia.
  - |-
    \textbf{Paso 4 --- Abstracción.} Subtítulo: \textbf{``Lo que dejo afuera por ahora''}. Lista 3-4 detalles que NO son esenciales en este momento y que decides dejar para después o ignorar. Ejemplo: \emph{``No me preocupo por la decoración perfecta; no me importa qué libro vaya antes de cuál; no necesito hacer limpieza profunda --- es solo organizar''}. La abstracción te enfoca.
  - |-
    \textbf{Paso 5 --- Algoritmo final.} Subtítulo: \textbf{``Mi algoritmo''}. Lista numerada de \textbf{8-12 pasos concretos} para ejecutar el plan. Aplica orden lógico (en el ejemplo: \emph{primero recoger ropa, después ordenar biblioteca, luego escritorio, después cambiar sábanas, finalmente barrer y trapear y sacar basura --- en ese orden para no tener que limpiar dos veces}).
  - |-
    \textbf{Paso 6 --- Reflexión final.} Debajo del algoritmo, escribe: \emph{``La técnica que más me costó aplicar fue: \_\_\_\_\_ porque \_\_\_\_\_''}. \emph{``Si no hubiera aplicado el pensamiento computacional, habría hecho: \_\_\_\_\_''}. Firma con nombre y fecha. La reflexión es lo que te muestra cuánto creciste hoy.

  checklist:
    titulo: Antes de cerrar la S3
    items: |-
      \checkbox Tengo problema real escogido (no inventado). \\[1mm]
      \checkbox Descomposición con mínimo 4 sub-problemas. \\[1mm]
      \checkbox Identifiqué 2-3 patrones entre sub-problemas. \\[1mm]
      \checkbox Hice abstracción (3-4 detalles dejados afuera). \\[1mm]
      \checkbox Algoritmo final con 8-12 pasos numerados. \\[1mm]
      \checkbox Reflexión final firmada.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} mi problema. \textit{Paso 2:} descomposición (4+ sub-problemas). \textit{Paso 3:} patrones (2-3 similitudes). \textit{Paso 4:} abstracción (3-4 detalles dejados afuera). \textit{Paso 5:} algoritmo (8-12 pasos). \textit{Paso 6:} reflexión + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA).} Título: «Actividad 3 --- 4 técnicas aplicadas a [mi problema]». \textbf{Formato:} 5 secciones (problema + descomposición + patrones + abstracción + algoritmo) + reflexión. \textbf{Extensión:} 1 página completa. \textbf{Sabes que terminaste cuando} sientes que el problema dejó de abrumarte porque tienes método.

  producto_titulo: 4 técnicas aplicadas a problema real · descomposición + patrones + abstracción + algoritmo · firmado
  criterios:
  - El problema escogido es real (no inventado).
  - Descomposición tiene mínimo 4 sub-problemas manejables.
  - Hay 2-3 patrones identificados.
  - Hay 3-4 detalles abstraídos (dejados afuera).
  - El algoritmo final tiene 8-12 pasos numerados.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del trabajo colectivo)"
    cita: |-
      ``Lo que parece imposible solo, se vuelve posible cuando lo divides en partes. Ese saber salva vidas.''
    aplicacion: |-
      Las personas que enfrentan tragedias --- una mudanza forzada, la pérdida de un trabajo, una enfermedad de un familiar --- a veces \textbf{se paralizan} ante la inmensidad. La técnica de \emph{descomposición} es lo que las salva: dividir el problema en pasos manejables convierte la parálisis en acción. Esa habilidad no es solo para programadores; \emph{es para vivir bien}. Aprenderla en 7° es regalo para tu yo adulto que enfrentará crisis.
    pregunta_espejo: |-
      ¿Qué problema actual mío se ha vuelto abrumador porque no lo he descompuesto?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``El imperio se gobierna provincia por provincia. La vida se vive día por día. Los problemas se resuelven sub-problema por sub-problema.''
    aplicacion: |-
      Marco Aurelio gobernaba el imperio romano (millones de personas, miles de problemas simultáneos). Su técnica era \textbf{dividir}: cada problema en sub-problemas, cada sub-problema en tareas, cada tarea en un día. \emph{Quien quiere resolver todo a la vez, no resuelve nada. Quien divide, avanza}. Esa disciplina romana sobrevive en lo que hoy llamas pensamiento computacional.
    pregunta_espejo: |-
      ¿Estoy intentando resolver problemas grandes de un solo golpe? ¿Cómo cambiaría si los dividiera?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del pensamiento computacional como alfabetización)"
    cita: |-
      ``Quien aprende a pensar computacionalmente entiende el mundo. Quien no, sobrevive en el mundo de los demás.''
    aplicacion: |-
      Las 4 técnicas son herramientas \textbf{para entender cualquier problema complejo}, no solo para programar. \emph{Los líderes que respetas} (médicos, ingenieros, profesores, emprendedores) aplican estas 4 técnicas a sus retos diarios, aunque no las llamen así. Aprenderlas explícitamente te coloca al lado de ellos en términos de cómo procesas el mundo.
    pregunta_espejo: |-
      ¿Estoy desarrollando una forma adulta de pensar problemas, o me quedo en reacciones emocionales?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, aplica las 4 técnicas a un problema más (puede ser un trabajo de otra materia o algo de tu vida). La próxima clase aprendes a \textbf{dibujar algoritmos}: los diagramas de flujo con símbolos estándar.

web:
  conceptos_clave:
    - termino: Pensamiento computacional
      definicion: |-
        Forma de abordar problemas complejos descomponiéndolos en pasos manejables que un computador (o cualquier persona) puede ejecutar. Su definición moderna viene de Jeannette Wing (2006). Tiene 4 técnicas: descomposición, patrones, abstracción, algoritmo.
      ejemplo: |-
        Aplicar las 4 técnicas a 'organizar fiesta de 50 personas': descompones (ceremonia, comida, invitados); reconoces patrones (lista invitados igual a lista prensa); abstraes (no decides menú aún); diseñas algoritmo (orden temporal).
      emoji: "🧠"
    - termino: Descomposición
      definicion: |-
        Primera técnica del pensamiento computacional. Dividir un problema grande en sub-problemas más pequeños y manejables. La sensación de 'no sé por dónde empezar' desaparece cuando descomponees.
      ejemplo: |-
        Problema grande: 'celebrar 50 años del cole'. Descomposición: ceremonia + decoración + sonido + comida + invitados + souvenirs + plan B. Cada uno se aborda aparte.
      emoji: "🔨"
    - termino: Reconocimiento de patrones
      definicion: |-
        Segunda técnica. Identificar similitudes entre sub-problemas para no inventar soluciones desde cero. Si dos sub-problemas son parecidos, usas la misma estrategia para ambos.
      ejemplo: |-
        En el caso del colegio: 'invitar exalumnos' e 'invitar prensa' son patrones similares (lista + correos + confirmaciones). Usas la misma estrategia para los dos.
      emoji: "🎨"
    - termino: Abstracción
      definicion: |-
        Tercera técnica. Dejar afuera los detalles que no son esenciales para enfocarse en lo importante. No es ignorar para siempre; es enfocar en el momento correcto. Lo importante primero, los detalles después.
      ejemplo: |-
        Planeando la ceremonia, abstraes el menú exacto (vendrá después). Planeando invitaciones, abstraes el color de manteles. Enfoque en lo esencial.
      emoji: "👁️"
    - termino: Diseño de algoritmo
      definicion: |-
        Cuarta técnica. Después de descomponer, reconocer patrones y abstraer, armar la secuencia exacta de pasos para resolver el problema. Es la culminación: el plan operativo que se puede ejecutar.
      ejemplo: |-
        Plan operativo para los 50 años: Día 1-15 planeación, Día 16-30 invitaciones, Día 31-45 producción, Día 46-55 ensayo, Día 56-60 ejecución. Algoritmo temporal claro.
      emoji: "📋"

  quiz:
    titulo: "¿Sabes aplicar las 4 técnicas?"
    instrucciones: "5 preguntas para verificar que dominas el pensamiento computacional."
    preguntas:
      - enunciado: "Te dan un problema grande y abrumador. ¿Cuál es la PRIMERA técnica que aplicas?"
        opciones:
          - "Pensar todo de una."
          - "Rendirse."
          - "Buscar en internet la solución completa."
          - "Descomposición: dividir el problema en sub-problemas manejables."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Descomposición es la primera técnica. Sin dividir, el problema sigue grande. Con división, cada parte se vuelve manejable. La parálisis se rompe así.
        feedback_incorrecto: |-
          Descomposición primero. Sin dividir, el problema te paraliza. Dividir en sub-problemas hace que cada parte sea manejable. Después vienen las otras 3 técnicas.
      - enunciado: "Estás organizando una fiesta y notas que 'invitar amigos' e 'invitar familia' son parecidos. ¿Qué técnica aplicaste?"
        opciones:
          - "Descomposición."
          - "Abstracción."
          - "Patrones (reconociste similitudes para usar la misma estrategia)."
          - "Algoritmo."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Patrones = reconocer similitudes. Si dos sub-problemas son parecidos, usas la misma estrategia. Ahorras tiempo y mantienes coherencia.
        feedback_incorrecto: |-
          Patrones. Reconocer que dos sub-problemas son parecidos te permite reusar la solución. Es la 2da técnica del pensamiento computacional.
      - enunciado: "Planeando la fiesta, te dices 'el color de los manteles lo decido después'. ¿Qué técnica?"
        opciones:
          - "Descomposición."
          - "Abstracción (dejar detalles no esenciales fuera del momento actual)."
          - "Patrones."
          - "Algoritmo."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Abstracción: dejar afuera lo no esencial para enfocarse en lo importante. No es ignorar para siempre; es enfocar correctamente.
        feedback_incorrecto: |-
          Abstracción. Dejas afuera detalles que vendrán después (color de manteles) para enfocarte en lo importante ahora (lista de invitados, presupuesto).
      - enunciado: "Quién definió el pensamiento computacional moderno?"
        opciones:
          - "Jeannette Wing (Carnegie Mellon, 2006)."
          - "Steve Jobs."
          - "Bill Gates."
          - "Marco Aurelio."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Jeannette Wing (científica computacional) lo definió formalmente en 2006. Sus 4 técnicas son hoy estándar mundial en educación computacional.
        feedback_incorrecto: |-
          Jeannette Wing, científica de Carnegie Mellon, 2006. Sus 4 técnicas (descomposición, patrones, abstracción, algoritmo) son hoy estándar en educación computacional mundial.
      - enunciado: "¿Las 4 técnicas se aplican solo en programación?"
        opciones:
          - "Sí, solo sirven para programar."
          - "Solo en matemáticas."
          - "Solo en juegos."
          - "No. Se aplican en cualquier problema complejo: organizar eventos, estudiar, planear viajes, vivir."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. Las 4 técnicas son universales. Sirven para programar, sí, pero también para organizar tu vida adulta. Es alfabetización del pensamiento, no solo del software.
        feedback_incorrecto: |-
          Universales. Sirven para cualquier problema complejo: programar, organizar eventos, estudiar, criar hijos, dirigir empresas. Por eso vale la pena dominarlas.

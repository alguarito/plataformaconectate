clave: "2-4"
grado: 7
periodo: 2
sesion: 4
completo: true

titulo: "Diagramas de flujo --- dibujar el algoritmo"
titulo_portada: |-
  Diagramas
  de flujo ---
  dibujar
  el algoritmo

producto_final: |-
  Un \textbf{diagrama de flujo dibujado en el cuaderno} de un algoritmo de tu vida (puede ser el de la S2 o uno nuevo). El diagrama incluye: \textbf{(a) 5 símbolos estándar bien dibujados} (óvalo de inicio/fin, rectángulo de proceso, rombo de decisión, paralelogramo de entrada/salida, flechas direccionales); \textbf{(b) mínimo 1 decisión (rombo con SÍ/NO)}; \textbf{(c) tabla de los 5 símbolos} con su significado al lado del diagrama; \textbf{(d) firma}.

apertura:
  saber_ancestral: |-
    \textbf{Los albañiles de Cartago, antes de levantar una pared, hacían un dibujo a mano en una hoja: el plano.} El plano no era la pared, era \emph{una representación visual} de cómo se levantaría: el ancho, la altura, dónde van las ventanas, dónde la puerta. \textbf{Sin plano, los albañiles no sabían por dónde empezar; con plano, todos sabían qué seguía}. El plano \emph{traducía la idea} (que estaba en la cabeza del arquitecto) \emph{en algo que cualquier albañil podía ejecutar}. En la cocina pasaba parecido: cuando una abuela tenía una receta complicada (como un pastel de cumpleaños), \textbf{hacía un esquema en papel} antes de empezar: \emph{``primero esto, después esto, si el horno está caliente entonces esto otro, si no, esperar 10 minutos''}. Ese esquema con flechas era un \textbf{diagrama de flujo} avant la lettre. Hoy aprendes los símbolos estándar para hacer diagramas de flujo de tus algoritmos.

  saber_contemporaneo: |-
    Un \textbf{diagrama de flujo} (en inglés \emph{flowchart}) es la representación visual de un algoritmo. Usa \textbf{símbolos geométricos estándar} (cada forma significa algo específico) y \textbf{flechas direccionales} para mostrar el orden y la dirección del proceso. Es como el plano del albañil pero para algoritmos. \textbf{Cinco símbolos básicos cubren el 90~\% de los diagramas:} \emph{óvalo} (inicio/fin), \emph{rectángulo} (acción o proceso), \emph{rombo} (decisión, con 2 caminos SÍ/NO), \emph{paralelogramo} (entrada o salida de datos), \emph{flecha} (dirección del flujo). \textbf{Por qué se usan:} (a) \emph{visualizar} es más rápido que leer pasos; (b) \emph{detectar errores} se hace más fácil viendo el dibujo; (c) \emph{comunicar} a otra persona el algoritmo sin necesidad de explicarlo de palabra. Los diagramas de flujo se usan en programación, ingeniería, medicina, gestión de negocios y muchas otras profesiones.

  pregunta_puente: |-
    Si tuvieras que explicar a tu mamá \emph{cómo decidir qué ponerse de ropa cada mañana} (con todas sus decisiones: ¿llueve o no? ¿hace frío o calor? ¿es para colegio o paseo?), ¿\textbf{te saldría mejor en lista de pasos o en dibujo con flechas}?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 5 símbolos estándar de un diagrama de flujo; (2) sabrás \textbf{aplicar} cada símbolo a su función; (3) podrás \textbf{evaluar} si un diagrama está bien dibujado; (4) habrás \textbf{creado} tu primer diagrama de flujo de un algoritmo real.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas los 5 símbolos, los aplicas a un mini-ejemplo, dibujas tu propio diagrama, lo verificas.
  a_escuta: |-
    Empezamos viendo un diagrama de flujo real para reconocer sus partes.
  a_sistematizacion: |-
    Después aprendes los 5 símbolos estándar + las 4 reglas para dibujar bien.
  a_praxis: |-
    Con todo claro, dibujas tu diagrama de flujo de un algoritmo de tu vida.
  a_producto: |-
    El producto es ese diagrama + tabla de símbolos.
  a_evaluacion: |-
    Antes de salir, intercambia el diagrama con un compañero: ¿él entiende sin que tú expliques?
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué un dibujo claro vale más que mil palabras.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Lee un diagrama de flujo} (10 min · individual). Imagina o el profe te muestra el siguiente diagrama de flujo simple del algoritmo \emph{``¿voy al colegio?''}: \emph{(óvalo) INICIO → (rombo) ¿Es día de semana? SÍ → (rombo) ¿Es hora de salir? SÍ → (rectángulo) Vestirme con uniforme → (rectángulo) Desayunar → (rectángulo) Tomar el bus → (óvalo) FIN. Si ¿Es día de semana? = NO → (rectángulo) Dormir más → (óvalo) FIN. Si ¿Es hora de salir? = NO → (rectángulo) Esperar → vuelve al rombo}. \textbf{En el cuaderno responde:} \emph{(1) ¿Qué representan los óvalos?}. \emph{(2) ¿Qué representan los rombos?}. \emph{(3) ¿Qué representan los rectángulos?}. \emph{(4) ¿Cuántos caminos finales posibles hay en este diagrama?}. \emph{(5) ¿Las flechas tienen una sola dirección o varias?}.

  checks:
  - Imaginé o leí el diagrama de flujo.
  - Respondí las 5 preguntas con mi intuición.
  - Pensé en los significados de cada símbolo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Lectura de un diagrama». \textbf{Formato:} 5 respuestas cortas. \textbf{Extensión:} 5 líneas. \textbf{Sabes que terminaste cuando} reconoces que cada forma tiene un significado específico.

sistematizacion:
  intro: |-
    Tu intuición acertó: cada símbolo significa algo. Ahora aprendes los 5 símbolos estándar + las 4 reglas para dibujar diagramas claros.

  pilares:
  - |-
    \textbf{Los 5 símbolos estándar.} \textbf{(1) Óvalo (o pastilla)}: \emph{Inicio} y \emph{Fin} del algoritmo. Va al comienzo y al final. \textbf{(2) Rectángulo}: \emph{Proceso} o \emph{acción}. Una instrucción que se ejecuta. Adentro va un verbo (\emph{``Mojar manos''}, \emph{``Multiplicar por 2''}). \textbf{(3) Rombo}: \emph{Decisión} (\emph{``¿es par?''}, \emph{``¿está lloviendo?''}). De un rombo salen 2 caminos: uno por SÍ y otro por NO. \textbf{(4) Paralelogramo}: \emph{Entrada} (datos que recibe el algoritmo) o \emph{Salida} (resultado que muestra). En lenguaje natural: \emph{``Ingresar nombre''}, \emph{``Mostrar resultado''}. \textbf{(5) Flecha}: dirección del flujo. Conecta los símbolos en el orden de ejecución.
  - |-
    \textbf{Las 4 reglas para dibujar bien.} (1) \textbf{Un solo INICIO y un solo FIN.} El algoritmo arranca en un lugar y termina en un lugar. Si tiene varios fines, cada uno se simboliza pero la lógica debe ser clara. (2) \textbf{Flechas en una sola dirección.} Las flechas van de un símbolo a otro siguiendo la lógica. NO se dibujan flechas que vayan hacia atrás sin razón. (3) \textbf{Cada rombo tiene exactamente 2 salidas: SÍ y NO}. Etiqueta cada flecha que sale del rombo. (4) \textbf{Símbolos del mismo tamaño aproximado.} Para que se vea profesional. Si haces algunos gigantes y otros chiquitos, se ve desorganizado.
  - |-
    \textbf{Cómo se lee un diagrama (paso a paso).} Empiezas en el óvalo INICIO. Sigues la flecha al siguiente símbolo. Si es rectángulo, ejecutas la acción mentalmente. Si es paralelogramo, ingresas/obtienes el dato. Si es rombo, evalúas la pregunta: si la respuesta es SÍ, vas por la flecha del SÍ; si es NO, por la del NO. Continúas hasta llegar al óvalo FIN. \textbf{Importante:} en un diagrama bien hecho, NO te puedes perder. Siempre hay un solo camino que seguir desde cada símbolo.
  - |-
    \textbf{Software opcional para hacer diagramas digitales.} Para 7° grado, dibujar a mano en el cuaderno es suficiente. Pero si quieres en digital: \emph{draw.io} (\texttt{app.diagrams.net}, gratis, en navegador), \emph{Lucidchart} (versión gratis básica), \emph{Microsoft Visio} (parte de Office 365). Lo importante es saber los símbolos; las herramientas varían.

  anatomia:
    titulo: 5 símbolos + 4 reglas
    body: |-
      \textbf{5 símbolos:} \\[1mm]
      \textbf{1.} Óvalo --- Inicio / Fin. \\[1mm]
      \textbf{2.} Rectángulo --- Proceso. \\[1mm]
      \textbf{3.} Rombo --- Decisión (SÍ/NO). \\[1mm]
      \textbf{4.} Paralelogramo --- Entrada / Salida. \\[1mm]
      \textbf{5.} Flecha --- Dirección. \\[1mm]
      \textbf{4 reglas:} 1 inicio y 1 fin · flechas con dirección · rombo con 2 salidas etiquetadas · símbolos del mismo tamaño.

  errores_comunes: |-
    \textbf{Errores frecuentes al dibujar diagramas.} (1) \emph{Olvidar el óvalo de INICIO o FIN} --- el diagrama queda incompleto. (2) \emph{Rombo sin etiquetar SÍ/NO} --- no se sabe por dónde va cada flecha. (3) \emph{Flechas que se cruzan sin razón} --- queda enredado, difícil de leer. Trata de dibujar de arriba a abajo o de izquierda a derecha. (4) \emph{Confundir símbolos} --- proceso en rombo, decisión en rectángulo. Cada forma tiene su uso. (5) \emph{Diagrama enorme con 30 símbolos} --- si tu algoritmo es complejo, mejor dividirlo en sub-diagramas más simples (técnica de descomposición de la S3).

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 5 símbolos + 4 reglas». \textbf{Formato:} bloque A con tabla de 5 filas, 2 columnas (símbolo dibujado + significado). Bloque B con las 4 reglas. \textbf{Extensión:} 5 filas + 4 reglas. \textbf{Sabes que terminaste cuando} puedes dibujar los 5 símbolos de memoria con su significado.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu diagrama de flujo} (28 min · individual). Vas a dibujar un diagrama de flujo de un algoritmo. Puede ser el de la S2 (tu primer algoritmo) o uno nuevo más interesante. Sugerencia: hazlo de algo con \emph{al menos 1 decisión} (por ejemplo \emph{``decidir qué hacer si llueve o no llueve''} cuando vas al colegio).

  pilares:
  - |-
    \textbf{Paso 1 --- Escoge el algoritmo a diagramar.} Si quieres, toma el de la S2. Si no, escoge uno nuevo con \emph{al menos una decisión}. Sugerencias: \emph{``Decidir qué ropa ponerme hoy''}, \emph{``Resolver una pelea con un hermano''}, \emph{``Encontrar mi celular cuando se pierde''}, \emph{``Decidir si veo TikTok o estudio''}. Si tiene 2 decisiones, mejor.
  - |-
    \textbf{Paso 2 --- Lista de pasos en lenguaje natural.} Antes de dibujar, escribe los pasos del algoritmo en una lista numerada. Identifica cuáles son acciones (rectángulo), cuáles son decisiones (rombo), cuáles son entradas o salidas (paralelogramo). \emph{Esta lista es tu borrador previo}: te ayuda a no perderte al dibujar.
  - |-
    \textbf{Paso 3 --- Dibuja el diagrama.} En una página del cuaderno (idealmente apaisada para tener más espacio), empieza con el \textbf{óvalo INICIO} en la parte superior. Después dibuja cada símbolo correspondiente, en orden, conectado con flechas. Para los rombos, etiqueta cada flecha de salida con \emph{SÍ} o \emph{NO}. Termina con el \textbf{óvalo FIN}. Usa regla si quieres para que las líneas queden derechas.
  - |-
    \textbf{Paso 4 --- Tabla de símbolos al lado.} En un costado de la hoja, dibuja una mini-tabla con los 5 símbolos que usaste y al lado su significado: \emph{``Óvalo = inicio o fin''}, \emph{``Rectángulo = proceso''}, etc. Esto entrena a quien lo lea y a ti mismo a no olvidarlos.
  - |-
    \textbf{Paso 5 --- Verifica con un compañero.} Intercambia tu cuaderno con un compañero. Él lee tu diagrama \emph{sin que tú expliques}. Si entiende qué hace tu algoritmo, está bien. Si se pierde, te pide aclaración y tú corriges. La prueba real de un buen diagrama es que se entiende sin habla.
  - |-
    \textbf{Paso 6 --- Reflexión y firma.} Abajo del diagrama, escribe: \emph{``El símbolo que más me costó dibujar fue \_\_\_. El compañero entendió mi diagrama sin que yo explicara: SÍ / NO. Lo que descubrí hoy: \_\_\_''}. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S4
    items: |-
      \checkbox Tengo lista de pasos antes de dibujar (borrador). \\[1mm]
      \checkbox El diagrama tiene óvalo INICIO y óvalo FIN. \\[1mm]
      \checkbox Hay al menos 1 rombo de decisión con SÍ/NO etiquetados. \\[1mm]
      \checkbox Las flechas tienen una dirección clara. \\[1mm]
      \checkbox La tabla de los 5 símbolos está al lado del diagrama. \\[1mm]
      \checkbox Un compañero verificó que entiende sin explicación.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Borrador previo:} lista de pasos numerada con tipo de símbolo. \textit{Diagrama:} óvalo INICIO → símbolos conectados con flechas → al menos 1 rombo SÍ/NO → óvalo FIN. \textit{Tabla lateral:} 5 símbolos con significado. \textit{Verificación:} compañero entiende. \textit{Final:} reflexión + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi primer diagrama de flujo». \textbf{Formato:} borrador + diagrama dibujado + tabla de símbolos + reflexión. \textbf{Extensión:} 1 hoja entera. \textbf{Sabes que terminaste cuando} otro estudiante puede leer tu diagrama y entender el algoritmo sin que tú expliques.

  producto_titulo: Diagrama de flujo · 5 símbolos · 1+ decisión · verificado · firmado
  criterios:
  - El diagrama tiene óvalo INICIO y FIN.
  - Hay al menos 1 rombo de decisión con SÍ/NO etiquetados.
  - Las flechas siguen una dirección lógica.
  - La tabla de símbolos está al lado.
  - El diagrama es entendible sin explicación verbal.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del lenguaje compartido)"
    cita: |-
      ``Los símbolos compartidos son lenguaje universal. El que los conoce habla con cualquier persona del mundo, en cualquier época.''
    aplicacion: |-
      \textbf{Los símbolos del diagrama de flujo (óvalo, rectángulo, rombo) son universales}. Un ingeniero en Tokio, una médica en Cartago y un programador en Berlín los entienden igual. Cuando aprendes estos símbolos, te conviertes en miembro de una \emph{comunidad global de pensadores estructurados}. La abuela albañil que dibujaba el plano de la pared participaba de esa misma tradición: \emph{trazar lo abstracto en formas concretas que cualquiera entiende}.
    pregunta_espejo: |-
      ¿Qué otros lenguajes simbólicos universales conozco (matemáticas, música, señales de tráfico)? ¿Qué tienen en común?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Un dibujo claro vale más que mil palabras vagas. Quien dibuja antes de hablar, ahorra confusiones.''
    aplicacion: |-
      Marco Aurelio planeaba campañas militares con \textbf{mapas y esquemas}, no solo con explicaciones verbales. Sabía que un dibujo \emph{transmite información compleja en segundos} mientras que una explicación verbal tarda minutos y abre lugar a malentendidos. \emph{Cuando explicas tu plan a otros, primero dibuja, después habla}. Tu equipo te lo agradece.
    pregunta_espejo: |-
      ¿Cuántas veces he intentado explicar algo complicado solo con palabras cuando un dibujo lo haría rápido?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del pensamiento visual)"
    cita: |-
      ``El siglo XXI privilegia el pensamiento visual. Quien sabe diagramar, comunica más rápido que quien solo sabe redactar.''
    aplicacion: |-
      Las redes profesionales modernas (LinkedIn, presentaciones, propuestas de negocio) valoran cada vez más \textbf{el pensamiento visual}. \emph{Diagramas, infografías, mapas mentales, gráficos}: el que sabe representarlos comunica más eficazmente. Aprender diagramas de flujo en 7° grado es entrenamiento para esa habilidad adulta. No es solo para programadores: es para cualquier profesional moderno.
    pregunta_espejo: |-
      ¿En qué situaciones de mi vida un diagrama claro me ahorraría malentendidos?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, dibuja al menos 1 diagrama de flujo más (puede ser de algo de otra materia o de tu rutina diaria). La próxima clase aprendes \textbf{variables}: las cajitas con etiqueta que guardan información en los algoritmos. Es el primer componente fundamental de toda programación.

web:
  conceptos_clave:
    - termino: Diagrama de flujo
      definicion: |-
        Representación visual de un algoritmo usando símbolos geométricos estándar conectados con flechas. Es el plano del albañil pero para algoritmos. Universal: se usa en programación, ingeniería, medicina, negocios.
      ejemplo: |-
        El algoritmo de cepillarse los dientes se puede dibujar: óvalo INICIO → rectángulo (mojar cepillo) → rectángulo (poner crema) → rectángulo (cepillar 2 min) → óvalo FIN.
      emoji: "📊"
    - termino: Óvalo (Inicio / Fin)
      definicion: |-
        Símbolo de comienzo y final del algoritmo. Todo diagrama empieza con un óvalo INICIO y termina con un óvalo FIN. Es como las marcas de salida y meta en una carrera.
      ejemplo: |-
        Al inicio del diagrama dibujas un óvalo y escribes 'INICIO'. Al final dibujas otro óvalo con 'FIN'. Sin ellos, el diagrama está incompleto.
      emoji: "⬭"
    - termino: Rombo (Decisión)
      definicion: |-
        Símbolo de decisión con 2 caminos posibles. Adentro va una pregunta (¿es par?, ¿está lloviendo?). De él salen 2 flechas: una etiquetada SÍ y otra NO. Cada flecha lleva a una rama distinta del algoritmo.
      ejemplo: |-
        '¿Está lloviendo?' → SÍ: dirige a 'Tomar paraguas'. NO: dirige a 'Salir normal'. Las dos flechas eventualmente convergen al siguiente paso común.
      emoji: "◇"
    - termino: Rectángulo (Proceso)
      definicion: |-
        Símbolo de acción o instrucción. Adentro va un verbo en infinitivo que describe qué hacer. Es el símbolo más común; la mayoría del diagrama suele ser rectángulos conectados con flechas.
      ejemplo: |-
        'Mezclar ingredientes', 'Multiplicar por 2', 'Imprimir el resultado': todas son acciones, así que van en rectángulos.
      emoji: "▭"
    - termino: 4 reglas para dibujar
      definicion: |-
        Las 4 normas: (1) un solo INICIO y un solo FIN, (2) flechas con dirección única, (3) cada rombo con 2 salidas etiquetadas (SÍ/NO), (4) símbolos del mismo tamaño. Sin estas reglas, el diagrama se vuelve confuso.
      ejemplo: |-
        Si no etiquetas las flechas del rombo con SÍ/NO, quien lea no sabe cuál camino seguir cuando la respuesta es SÍ. Las 4 reglas evitan confusiones así.
      emoji: "📐"

  quiz:
    titulo: "¿Sabes hacer diagramas de flujo?"
    instrucciones: "5 preguntas para verificar que dominas los 5 símbolos y las 4 reglas."
    preguntas:
      - enunciado: "¿Qué símbolo se usa para representar el INICIO o FIN de un algoritmo?"
        opciones:
          - "Óvalo (o pastilla)."
          - "Rombo."
          - "Rectángulo."
          - "Triángulo."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Óvalo para INICIO y FIN. El óvalo abre y cierra el diagrama. Todo algoritmo debe tener exactamente un óvalo de inicio y al menos uno de fin.
        feedback_incorrecto: |-
          Óvalo para INICIO/FIN. Estándar universal. Rombo es decisión; rectángulo es proceso. Cada forma tiene su uso.
      - enunciado: "Tu algoritmo tiene una decisión: '¿está lloviendo?'. ¿Qué símbolo usas?"
        opciones:
          - "Rectángulo."
          - "Rombo (con 2 salidas etiquetadas SÍ/NO)."
          - "Óvalo."
          - "Paralelogramo."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Rombo para decisiones. Adentro va la pregunta. Salen 2 flechas: SÍ y NO, hacia ramas distintas del algoritmo.
        feedback_incorrecto: |-
          Rombo para decisiones. Adentro la pregunta. 2 flechas saliendo etiquetadas SÍ y NO. Es el símbolo más útil para algoritmos con alternativas.
      - enunciado: "¿Cuántas flechas salen de un rombo en un diagrama bien hecho?"
        opciones:
          - "Solo 1."
          - "3 o más."
          - "Exactamente 2: una para SÍ y una para NO."
          - "Ninguna."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Exactamente 2 flechas saliendo de un rombo, una SÍ y una NO. Si tu decisión tiene más opciones, mejor dividirla en varios rombos.
        feedback_incorrecto: |-
          2 flechas: SÍ y NO. El rombo binariza decisiones. Para 3+ opciones, varios rombos en secuencia (rombo > anidado).
      - enunciado: "Tu algoritmo recibe el nombre del usuario y al final imprime un saludo. ¿Qué símbolo usas para 'recibir nombre' y 'imprimir saludo'?"
        opciones:
          - "Rectángulo."
          - "Óvalo."
          - "Rombo."
          - "Paralelogramo (símbolo de entrada/salida de datos)."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Paralelogramo para entrada/salida. 'Recibir nombre' = entrada; 'Imprimir saludo' = salida. Ambos van en paralelogramos.
        feedback_incorrecto: |-
          Paralelogramo para datos que entran o salen del algoritmo. 'Leer entrada' o 'Mostrar resultado' van en paralelogramos, no en rectángulos.
      - enunciado: "Tu diagrama tiene flechas en muchas direcciones y se ve enredado. ¿Qué haces?"
        opciones:
          - "Lo redibujo aplicando la regla: flechas en dirección única (arriba-abajo o izquierda-derecha)."
          - "Lo dejo así."
          - "Borro las flechas."
          - "Agrego más símbolos."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. Las flechas deben seguir una dirección clara (típicamente de arriba abajo, o de izquierda a derecha). Si están enredadas, redibuja organizando.
        feedback_incorrecto: |-
          Las flechas en una dirección lógica (arriba-abajo o izq-der). Si están enredadas, el diagrama se vuelve ilegible. Mejor redibujar limpio.

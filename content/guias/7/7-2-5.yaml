clave: "2-5"
grado: 7
periodo: 2
sesion: 5
completo: true

titulo: "Variables --- cajas con etiqueta que guardan información"
titulo_portada: |-
  Variables ---
  cajas con
  etiqueta
  que guardan
  información

producto_final: |-
  En el cuaderno: \textbf{(a) tabla de 10 variables} con \emph{nombre, tipo (número/texto/booleano), valor inicial} y \emph{ejemplo de uso}; \textbf{(b) un mini-algoritmo escrito} que use al menos 3 variables (ejemplo: \emph{``algoritmo del cumpleaños''} que use variables \texttt{edad}, \texttt{nombre}, \texttt{esCumpleHoy}); \textbf{(c) 5 reglas para nombrar variables} aplicadas. Firma.

apertura:
  saber_ancestral: |-
    \textbf{Doña Sofía, la tendera del barrio de Cartago, tenía un sistema de cajitas en su tienda.} Cada cajita tenía una \textbf{etiqueta escrita a mano} con el nombre del producto: \emph{``arroz''}, \emph{``frijol''}, \emph{``café''}, \emph{``azúcar''}, \emph{``sal''}, \emph{``maíz molido''}. Adentro de cada cajita iba \emph{el producto correspondiente}. Cuando un cliente pedía \emph{``250 gramos de café''}, doña Sofía iba a la cajita \texttt{café}, sacaba 250 gramos, y entregaba. Si la cajita estaba vacía, doña Sofía la rellenaba. Si quería cambiar de un café por otro, vaciaba la cajita y ponía el nuevo. \textbf{Lo importante: la cajita era un lugar; lo que iba adentro podía cambiar}. Esa idea --- \emph{``un nombre fijo, un contenido variable''} --- es exactamente lo que en programación llamamos \textbf{variable}. Doña Sofía sabía gestionar variables sin haberlo estudiado. Hoy aprendes el concepto explícito.

  saber_contemporaneo: |-
    Una \textbf{variable} en programación es \emph{un nombre simbólico que guarda un valor que puede cambiar}. Imagínala como una \textbf{caja con etiqueta}: la etiqueta es el nombre (fijo), el contenido es el valor (variable). Cuando un algoritmo o programa necesita recordar un dato (la edad de alguien, el puntaje del juego, si la puerta está abierta), \textbf{crea una variable} y le pone un valor. Después puede \emph{leer} el valor (saber qué hay adentro), \emph{cambiar} el valor (vaciar y rellenar), o \emph{usar} el valor en operaciones. \textbf{Las variables son uno de los 3 componentes fundamentales} de cualquier programa (los otros 2 son: condicionales y bucles, que ves en las próximas 2 sesiones). \textbf{Hay 3 tipos básicos:} (1) \emph{número} (entero o decimal): \texttt{edad = 13}, \texttt{precio = 5.50}; (2) \emph{texto} (entre comillas): \texttt{nombre = ``María''}; (3) \emph{booleano} (solo dos valores: verdadero o falso): \texttt{tieneMascota = verdadero}.

  pregunta_puente: |-
    En tu vida diaria, ¿\textbf{qué información necesitas ``recordar''} cuando haces algo? Cuando juegas, hay un \emph{puntaje} (cambia). Cuando cocinas, hay un \emph{número de personas} (cambia). Cuando estudias, hay \emph{horas restantes} (cambia). Todas son variables.

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} qué es una variable y los 3 tipos básicos; (2) sabrás \textbf{aplicar} las 5 reglas para nombrar variables; (3) podrás \textbf{evaluar} si un algoritmo necesita variables o no; (4) habrás \textbf{creado} un mini-algoritmo que usa 3 variables.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: aprendes qué es una variable, conoces los 3 tipos, aplicas las 5 reglas de nombrado, escribes un mini-algoritmo con variables.
  a_escuta: |-
    Empezamos con un juego: ¿qué información cambia en estas 6 situaciones?
  a_sistematizacion: |-
    Después aprendes los 3 tipos + las 5 reglas para nombrar bien.
  a_praxis: |-
    Con todo claro, escribes tu tabla de 10 variables + mini-algoritmo.
  a_producto: |-
    El producto es la tabla + algoritmo + 5 reglas firmadas.
  a_evaluacion: |-
    Antes de salir, intercambia con un compañero: ¿tus nombres de variable son claros?
  a_triangulo: |-
    Cerramos con 3 voces sobre el poder de nombrar las cosas.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- ¿Qué información cambia?} (10 min · individual). Lee estas 6 situaciones y en el cuaderno \textbf{lista qué información cambia en cada una}. Cada información que cambie es una posible variable. \emph{(1) Estás jugando Roblox y miras el contador de monedas que aumenta.} \emph{(2) Tu mamá cocina una sopa para distinto número de personas cada vez.} \emph{(3) Estás haciendo una tarea y miras cuántas preguntas faltan.} \emph{(4) Es viernes y miras cuántos días faltan para tu cumpleaños.} \emph{(5) Llueve y revisas la temperatura cada hora.} \emph{(6) En clase llaman lista y se cuenta cuántos asistieron.}

  checks:
  - Leí las 6 situaciones.
  - Identifiqué qué información cambia en cada una.
  - Reconocí que esa información cambiante son variables.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Información que cambia». \textbf{Formato:} lista numerada del 1 al 6 con la variable identificada. \textbf{Extensión:} 6 líneas. \textbf{Sabes que terminaste cuando} reconoces que tu vida está llena de variables sin saberlo.

sistematizacion:
  intro: |-
    Lo que identificaste son \textbf{variables del mundo real}. En programación las nombramos explícitamente. Ahora aprendes los 3 tipos básicos + las 5 reglas para ponerles buen nombre.

  pilares:
  - |-
    \textbf{Tipo 1 --- Número.} Guarda un valor numérico. Puede ser \emph{entero} (sin decimales): \texttt{edad = 13}, \texttt{puntaje = 250}, \texttt{cantidadHermanos = 2}. O \emph{decimal} (con decimales): \texttt{altura = 1.65}, \texttt{precio = 5.50}, \texttt{notaPromedio = 4.2}. \textbf{Operaciones típicas:} sumar, restar, multiplicar, dividir, comparar (mayor/menor). \textbf{Tipo 2 --- Texto (string).} Guarda una cadena de caracteres. Va entre comillas: \texttt{nombre = ``María''}, \texttt{ciudad = ``Cartago''}, \texttt{materia = ``Tecnología''}. \textbf{Operaciones típicas:} unir, comparar, buscar dentro.
  - |-
    \textbf{Tipo 3 --- Booleano.} Guarda solo \textbf{dos valores}: \emph{verdadero} (true) o \emph{falso} (false). Sin matices. Ejemplo: \texttt{tieneMascota = verdadero}, \texttt{esCumpleHoy = falso}, \texttt{puertaAbierta = verdadero}. \textbf{Uso típico:} en condicionales (lo verás en S6). El nombre suele empezar con verbo \emph{es...}, \emph{tiene...}, \emph{está...} para que se entienda que es booleano. \textbf{Pista:} los booleanos son fundamentales en programación porque permiten tomar decisiones.
  - |-
    \textbf{Las 5 reglas para nombrar variables (universales en programación).} (1) \textbf{Empezar con minúscula:} \texttt{edad} sí, \texttt{Edad} mejor para clases (concepto avanzado). (2) \textbf{Camel case si son varias palabras:} \texttt{notaPromedio} (primera minúscula, siguientes con mayúscula). (3) \textbf{Nombre descriptivo, no críptico:} \texttt{x} no dice nada; \texttt{cantidadHermanos} sí dice. (4) \textbf{Sin espacios ni acentos:} \texttt{notaPromedio} sí; \texttt{nota promedio} no; \texttt{notaPromédio} mejor evítarlo. (5) \textbf{No empezar con número:} \texttt{2edad} no es válido; \texttt{edad2} sí.
  - |-
    \textbf{Operaciones básicas con variables (en lenguaje natural).} \textbf{Asignar valor:} \texttt{edad = 13} (le pones 13 en la caja \texttt{edad}). \textbf{Leer valor:} cuando dices \texttt{edad}, te referís al 13 que está adentro. \textbf{Cambiar valor:} \texttt{edad = 14} (vacías la caja y le metes 14). \textbf{Usar en cálculo:} \texttt{edadProximaAno = edad + 1} (creas una nueva variable con el valor de \texttt{edad} más 1, o sea 14). En Scratch (S8) lo verás visualmente con bloques.

  anatomia:
    titulo: 3 tipos + 5 reglas + operaciones básicas
    body: |-
      \textbf{3 tipos básicos:} \\[1mm]
      \textbf{1.} NÚMERO (entero o decimal) --- 13, 1.65, 250. \\[1mm]
      \textbf{2.} TEXTO (string) --- ``María'', ``Cartago''. \\[1mm]
      \textbf{3.} BOOLEANO --- verdadero o falso solamente. \\[1mm]
      \textbf{5 reglas:} minúscula inicial · camelCase · descriptivo · sin espacios/acentos · no empezar con número. \\[1mm]
      \textbf{Operaciones:} asignar (=) · leer · cambiar · usar en cálculo.

  errores_comunes: |-
    \textbf{Errores frecuentes al usar variables.} (1) \emph{Nombres incomprensibles:} \texttt{x}, \texttt{var1}, \texttt{tmp}. Cuando vuelvas en 2 días, no sabes qué significan. (2) \emph{Mezclar tipos:} sumar un texto con un número da error. \emph{``13''} (texto) más \texttt{2} (número) NO da 15 necesariamente. (3) \emph{Usar antes de asignar:} si pides leer \texttt{edad} sin haberle puesto valor, da error. (4) \emph{Olvidar las comillas en texto:} \texttt{nombre = María} sin comillas confunde al programa. (5) \emph{Crear demasiadas variables:} 50 variables se vuelven inmanejables. Una buena regla: solo crear variables que vas a usar al menos 2 veces.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 3 tipos + 5 reglas + operaciones». \textbf{Formato:} bloque A con tabla de los 3 tipos (tipo, ejemplo, operaciones típicas). Bloque B con las 5 reglas + 1 ejemplo malo y 1 bueno por regla. Bloque C con 4 operaciones básicas. \textbf{Extensión:} 12 líneas. \textbf{Sabes que terminaste cuando} podrías nombrar bien variables para cualquier algoritmo.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tabla de 10 variables + mini-algoritmo con 3 variables} (28 min · individual). Vas a hacer 2 cosas. Primero, una tabla de 10 variables imaginadas. Segundo, escribir un mini-algoritmo que use 3 de ellas.

  pilares:
  - |-
    \textbf{Paso 1 --- Tabla de 10 variables.} En una hoja del cuaderno, encabezado: \textbf{``Mis 10 variables''}. Tabla de 10 filas, 4 columnas: \emph{(1) Nombre de variable}, \emph{(2) Tipo (número/texto/booleano)}, \emph{(3) Valor inicial}, \emph{(4) Ejemplo de uso}. Llena las 10 filas con variables que podrías usar en programas reales. Sugerencias: \texttt{edadUsuario}, \texttt{nombreJugador}, \texttt{puntaje}, \texttt{vidasRestantes}, \texttt{tieneMascota}, \texttt{ciudadNatal}, \texttt{notaMatematicas}, \texttt{esFinDeSemana}, \texttt{horaActual}, \texttt{materiaPreferida}. Aplica las 5 reglas en cada nombre.
  - |-
    \textbf{Paso 2 --- Escoge 3 variables para tu mini-algoritmo.} De las 10 que listaste, escoge 3 que se puedan combinar en un mini-algoritmo. Sugerencia útil: \texttt{nombre}, \texttt{edad}, \texttt{esCumpleHoy}.
  - |-
    \textbf{Paso 3 --- Escribe el algoritmo del cumpleaños.} Mini-algoritmo en lenguaje natural usando esas 3 variables: \emph{``ENTRADA: nombre (texto), edad (número), esCumpleHoy (booleano).''} \emph{``PASOS: 1. Mostrar saludo: 'Hola [nombre]'. 2. Mostrar: 'Tienes [edad] años'. 3. Si esCumpleHoy = verdadero, mostrar: 'Feliz cumpleaños, [nombre]! Ahora tienes [edad + 1] años'. Si esCumpleHoy = falso, mostrar: 'No es tu cumpleaños hoy'. 4. FIN.''}. Adáptalo a tu manera.
  - |-
    \textbf{Paso 4 --- Probar mentalmente el algoritmo.} Imagina que las variables tienen estos valores: \texttt{nombre = ``Lara''}, \texttt{edad = 12}, \texttt{esCumpleHoy = verdadero}. \emph{Ejecuta} el algoritmo paso a paso en tu cabeza y escribe qué se mostraría. Deberías obtener: \emph{``Hola Lara. Tienes 12 años. Feliz cumpleaños, Lara! Ahora tienes 13 años.''}. Si tu salida es distinta, revisa el algoritmo.
  - |-
    \textbf{Paso 5 --- Verifica las 5 reglas de nombrado.} Revisa los nombres de tus 10 variables. Marca con palomita ✓ las que cumplen las 5 reglas (minúscula inicial, camelCase, descriptivo, sin espacios/acentos, no empezar con número). Si alguna falla, corrige.
  - |-
    \textbf{Paso 6 --- Reflexión y firma.} Debajo escribe: \emph{``La regla que más me costó aplicar al nombrar variables fue \_\_\_. El tipo de variable que más usaré es \_\_\_ porque \_\_\_''}. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S5
    items: |-
      \checkbox Tabla de 10 variables con 4 columnas. \\[1mm]
      \checkbox Cada nombre sigue las 5 reglas (minúscula, camelCase, etc.). \\[1mm]
      \checkbox Cada variable tiene tipo correctamente identificado. \\[1mm]
      \checkbox Mini-algoritmo usa 3 variables. \\[1mm]
      \checkbox Probé mentalmente el algoritmo con valores concretos. \\[1mm]
      \checkbox Reflexión y firma están al final.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} tabla 10 × 4 (nombre, tipo, valor inicial, ejemplo). \textit{Paso 2:} escoger 3 variables. \textit{Paso 3:} algoritmo en lenguaje natural usando las 3. \textit{Paso 4:} ejecución mental con valores concretos. \textit{Paso 5:} verificar 5 reglas. \textit{Paso 6:} reflexión + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- 10 variables + mini-algoritmo». \textbf{Formato:} tabla 10x4 + algoritmo + prueba mental + reflexión. \textbf{Extensión:} 1 página completa. \textbf{Sabes que terminaste cuando} podrías mostrar al profe tus variables y él entendería para qué sirven solo leyendo los nombres.

  producto_titulo: 10 variables nombradas + mini-algoritmo con 3 variables · 5 reglas aplicadas
  criterios:
  - Tabla con 10 variables (nombre, tipo, valor inicial, ejemplo).
  - Las 5 reglas de nombrado están aplicadas correctamente.
  - El mini-algoritmo usa al menos 3 variables.
  - Se probó mentalmente el algoritmo con valores concretos.
  - Hay reflexión final firmada.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del nombrar las cosas)"
    cita: |-
      ``Nombrar las cosas correctamente es el primer acto de pensamiento claro.''
    aplicacion: |-
      Las variables se llaman \emph{``variables''} porque varían (cambian). Pero su \textbf{nombre es fijo}: \emph{ese nombre es el primer acto de pensamiento}. Si nombras una variable \texttt{x}, no piensas claro. Si la nombras \texttt{cantidadMonedasGanadas}, piensas claro. \emph{La calidad del nombre refleja la calidad del pensamiento}. Doña Sofía con sus cajitas etiquetadas \emph{café}, \emph{arroz}, \emph{azúcar} también lo entendía. Las cajas sin etiqueta no sirven; los nombres dan función.
    pregunta_espejo: |-
      ¿Cuántas cosas en mi vida tengo sin nombrar bien y que por eso me confunden?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``La palabra exacta resuelve confusiones que las explicaciones largas no logran.''
    aplicacion: |-
      En programación, \textbf{el nombre de una variable es comunicación con tu yo del futuro}. Vuelves a leer tu código en 6 meses, no recuerdas detalles, pero leyendo \texttt{cantidadMonedasGanadas} entiendes inmediatamente qué guarda. Si lo hubieras llamado \texttt{x}, tendrías que rastrear el código para entender. \emph{Las 5 reglas de nombrado son disciplina lingüística antigua trasladada a programación}.
    pregunta_espejo: |-
      ¿Cuando escribo (texto, código, listas), mi yo del futuro lee con claridad o tiene que adivinar?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del oficio de programar)"
    cita: |-
      ``El 50\% del oficio de programar es nombrar bien. El otro 50\% es lógica. Los buenos programadores invierten en ambos.''
    aplicacion: |-
      Hay un dicho en programación: \emph{``solo hay dos cosas difíciles: nombrar bien y manejar la caché''}. Es bromas, pero verdadero. \textbf{Aprender hoy a nombrar variables con criterio te coloca en el camino correcto del oficio}. Quien nombra mal escribe código que nadie (ni el mismo autor) entiende. Quien nombra bien produce código que dura años legible.
    pregunta_espejo: |-
      ¿Voy a ser un programador (o pensador) que nombra bien, o uno que mete \texttt{x} en todas partes?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, identifica variables en al menos 3 situaciones de tu vida real (un juego, una receta, una rutina). Anota nombres siguiendo las 5 reglas. La próxima clase aprendes \textbf{condicionales (si... entonces)}: las decisiones que usan los algoritmos para escoger caminos según las variables.

web:
  conceptos_clave:
    - termino: Variable
      definicion: |-
        Nombre simbólico que guarda un valor que puede cambiar. Como una caja con etiqueta: la etiqueta (nombre) es fija, lo que está adentro (valor) puede variar. Un componente fundamental de toda programación.
      ejemplo: |-
        edad = 13 (la variable 'edad' guarda el número 13). Después puedes hacer edad = 14 y la variable ahora guarda 14. El nombre 'edad' no cambia.
      emoji: "📦"
    - termino: Tipos de variables
      definicion: |-
        Hay 3 tipos básicos: (1) NÚMERO (entero o decimal: 13, 1.65), (2) TEXTO o string (entre comillas: 'María'), (3) BOOLEANO (solo verdadero o falso: tieneMascota = verdadero).
      ejemplo: |-
        edad = 13 → número. nombre = 'María' → texto. esCumpleHoy = verdadero → booleano. Cada tipo tiene operaciones distintas.
      emoji: "🏷️"
    - termino: 5 reglas para nombrar variables
      definicion: |-
        Las normas universales: (1) empezar con minúscula, (2) usar camelCase si son varias palabras, (3) nombre descriptivo (no críptico), (4) sin espacios ni acentos, (5) no empezar con número.
      ejemplo: |-
        Bien: cantidadMonedasGanadas. Mal: x, 1edad, Cantidad Monedas, cantmonedas. Las 5 reglas hacen tu código entendible.
      emoji: "📝"
    - termino: Booleano
      definicion: |-
        Tipo de variable que solo guarda 2 valores: verdadero (true) o falso (false). Sin matices. Su nombre suele empezar con verbo es-, tiene-, está-. Fundamental para condicionales (S6).
      ejemplo: |-
        tieneMascota = verdadero. esCumpleHoy = falso. puertaAbierta = verdadero. El booleano permite decisiones binarias en programación.
      emoji: "🔘"
    - termino: Asignación (=)
      definicion: |-
        Operación que pone un valor adentro de una variable. Se escribe con el signo igual. NO es el igual matemático: en programación, el = es 'asigna esto a esta variable'.
      ejemplo: |-
        edad = 13 → asigna el valor 13 a la variable edad. nombre = 'María' → asigna María a la variable nombre. tieneMascota = verdadero → asigna verdadero.
      emoji: "✏️"

  quiz:
    titulo: "¿Conoces las variables?"
    instrucciones: "5 preguntas para verificar que dominas las variables y los 3 tipos."
    preguntas:
      - enunciado: "¿Cuál de estos nombres de variable SIGUE las 5 reglas?"
        opciones:
          - "x"
          - "cantidadMonedasGanadas"
          - "Cantidad Monedas"
          - "1edad"
        respuesta_index: 1
        feedback_correcto: |-
          Sí. cantidadMonedasGanadas: minúscula inicial, camelCase, descriptivo, sin espacios, no empieza con número. Cumple las 5 reglas.
        feedback_incorrecto: |-
          cantidadMonedasGanadas cumple las 5 reglas. 'x' no es descriptivo; 'Cantidad Monedas' tiene espacio; '1edad' empieza con número.
      - enunciado: "¿Qué tipo de variable es 'tieneMascota = verdadero'?"
        opciones:
          - "Número."
          - "Booleano (solo verdadero o falso)."
          - "Texto."
          - "Lista."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Booleano: solo 2 valores posibles (verdadero o falso). Su nombre empieza con 'tiene-' lo cual sugiere booleano. Útil para condicionales.
        feedback_incorrecto: |-
          Booleano. Solo verdadero o falso. Los nombres con 'tiene-', 'es-', 'está-' suelen ser booleanos. Útiles para tomar decisiones.
      - enunciado: "Tu algoritmo cuenta cuántas veces se repite algo. ¿Qué variable creas?"
        opciones:
          - "Un texto."
          - "Una variable numérica (entera) que empieza en 0 y se suma 1 cada vez."
          - "Un booleano."
          - "Ninguna."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Variable numérica entera como contador. Empieza en 0 y se incrementa (suma 1) cada repetición. Es patrón clásico de programación.
        feedback_incorrecto: |-
          Variable numérica entera (contador). Empieza en 0. Se suma 1 cada repetición. Es patrón fundamental. Lo verás en bucles (S7).
      - enunciado: "Escribes 'edad = 13'. Después escribes 'edad = edad + 1'. ¿Qué pasa?"
        opciones:
          - "Da error."
          - "La variable edad ahora vale 14 (cambió de 13 a 14)."
          - "Crea una nueva variable."
          - "Borra la variable."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. = es asignación. 'edad + 1' calcula 14 (porque edad valía 13), y ese 14 se asigna a la variable edad. Ahora edad vale 14.
        feedback_incorrecto: |-
          Edad ahora vale 14. La operación 'edad + 1' lee el valor actual (13) y calcula 14. Después el = asigna 14 a la variable edad.
      - enunciado: "Necesitas guardar el nombre de un usuario en una variable. ¿Cómo lo escribes?"
        opciones:
          - "nombre = María (sin comillas)."
          - "nombre = 'María' (con comillas porque es texto)."
          - "nombre = 13."
          - "Maria nombre."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Texto entre comillas. nombre = 'María'. Sin comillas, el programa cree que María es otra variable. Las comillas le dicen 'esto es texto literal'.
        feedback_incorrecto: |-
          Texto entre comillas: nombre = 'María'. Sin comillas, programa cree que María es otra variable. Comillas distinguen texto de nombres.

clave: "2-6"
grado: 7
periodo: 2
sesion: 6
completo: true

titulo: "Condicionales --- el si... entonces de los algoritmos"
titulo_portada: |-
  Condicionales ---
  el si...
  entonces
  de los
  algoritmos

producto_final: |-
  Un \textbf{algoritmo en lenguaje natural} que usa al menos \textbf{3 condicionales} (estructura si-entonces-si no). Tema escogido por ti: \emph{``algoritmo del paraguas''}, \emph{``algoritmo de la calificación''}, \emph{``algoritmo del semáforo''}, etc. Más \textbf{su diagrama de flujo} (aplicando S4: rombos con SÍ/NO etiquetados). Más \textbf{tabla de los 6 operadores de comparación} en el cuaderno.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes, la abuela cocinera de Cartago, decidía el almuerzo de cada día con un algoritmo de cabeza.} Cuando llegaba al mercado del barrio, hacía decisiones rápidas: \emph{``¿Hay tomate fresco? Si sí, hago sancocho. Si no, hago arroz con lentejas''}. Después: \emph{``¿Es viernes? Si sí, pescado. Si no, lo que se decidió antes''}. Después: \emph{``¿Tengo presupuesto extra? Si sí, agrego carne. Si no, vegetariano hoy''}. \textbf{Cada decisión seguía una estructura simple:} \emph{``SI tal cosa, ENTONCES tal acción; SI NO, otra acción''}. Así doña Mercedes resolvía cada día el menú \textbf{en 2 minutos en el mercado}, sin paralizarse. Esa estructura --- \emph{si... entonces... si no} --- es exactamente el \textbf{condicional} en programación. Las abuelas cocineras, los albañiles que decidían si un mes era invierno o no, los pescadores que escogían si salir al río o no según el clima: todos usaban condicionales sin saberlo.

  saber_contemporaneo: |-
    Un \textbf{condicional} (o \emph{estructura selectiva}) es un componente fundamental de la programación que permite \textbf{ejecutar una acción solo SI se cumple cierta condición}. La estructura básica es: \emph{SI [condición] ENTONCES [acción 1] SI NO [acción 2]}. En inglés: \emph{IF [condition] THEN [action 1] ELSE [action 2]}. La \emph{condición} es una pregunta que tiene respuesta verdadero o falso (booleano). Si es verdadera, se ejecuta la acción 1; si es falsa, la acción 2. \textbf{Operadores de comparación} (las preguntas básicas que se hacen en los condicionales): \emph{= (igual a)}, \emph{≠ (distinto a)}, \emph{> (mayor que)}, \emph{< (menor que)}, \emph{≥ (mayor o igual)}, \emph{≤ (menor o igual)}. Combinados con variables (las cajas con etiqueta de la S5), los condicionales permiten que un algoritmo \emph{tome decisiones según los valores}. Esto es lo que hace que los programas se sientan \emph{inteligentes}: no siguen siempre el mismo camino, escogen según los datos.

  pregunta_puente: |-
    Cada mañana tu mamá te dice: \emph{``si llueve, llevas paraguas. Si no, no.''} ¿\textbf{Cuántas decisiones de este tipo} tomas tú al día sin darte cuenta? ¿5? ¿20? ¿100?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} la estructura si-entonces-si no; (2) sabrás \textbf{aplicar} los 6 operadores de comparación; (3) podrás \textbf{evaluar} si un condicional está bien escrito; (4) habrás \textbf{creado} un algoritmo con 3 condicionales + diagrama.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas decisiones en situaciones reales, aprendes la estructura + operadores, escribes algoritmo con 3 condicionales, dibujas el diagrama.
  a_escuta: |-
    Empezamos identificando decisiones que ya tomas hoy.
  a_sistematizacion: |-
    Después aprendes la estructura formal + los 6 operadores.
  a_praxis: |-
    Con todo claro, escribes algoritmo + diagrama de flujo.
  a_producto: |-
    El producto es algoritmo + diagrama + tabla de operadores.
  a_evaluacion: |-
    Antes de salir, verifica que cada condicional tiene su SI NO.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué tomar decisiones con criterio es virtud universal.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Decisiones de tu día} (10 min · individual). En el cuaderno, anota \textbf{6 decisiones} que tomas en un día normal (desde que te despiertas hasta que duermes). Para cada una, escríbela en formato condicional: \emph{``SI [condición], ENTONCES [acción 1]; SI NO, [acción 2]''}. Ejemplos: \emph{``SI llueve, ENTONCES llevo paraguas; SI NO, no lo llevo''}. \emph{``SI hay desayuno en la mesa, ENTONCES desayuno; SI NO, voy directo al colegio''}. \emph{``SI termino la tarea, ENTONCES puedo jugar; SI NO, sigo trabajando''}. Lista 6 reales tuyas.

  checks:
  - Pensé en mi día normal.
  - Anoté 6 decisiones reales.
  - Las formulé en estructura SI-ENTONCES-SI NO.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 6 decisiones de mi día». \textbf{Formato:} lista numerada del 1 al 6 con estructura SI-ENTONCES-SI NO. \textbf{Extensión:} 6 líneas. \textbf{Sabes que terminaste cuando} reconoces que tu día está lleno de condicionales.

sistematizacion:
  intro: |-
    Lo que hiciste son \textbf{condicionales de la vida real}. Tomas más de 100 decisiones así al día sin darte cuenta. Ahora aprende la estructura formal + los 6 operadores que se usan para comparar.

  pilares:
  - |-
    \textbf{La estructura del condicional simple.} En lenguaje natural: \emph{SI [condición] ENTONCES [acción]}. Si la condición no se cumple, simplemente no se ejecuta la acción. Ejemplo: \emph{``SI llueve, ENTONCES llevo paraguas''}. \textbf{Estructura del condicional doble (si-no):} \emph{SI [condición] ENTONCES [acción 1] SI NO [acción 2]}. Aquí siempre se ejecuta alguna de las 2 acciones, según la condición. Ejemplo: \emph{``SI llueve, ENTONCES llevo paraguas; SI NO, no lo llevo''}.
  - |-
    \textbf{Los 6 operadores de comparación.} Para escribir condiciones, usamos estos símbolos: \textbf{(1) = igual a:} \texttt{edad = 13} ¿es la edad exactamente 13? \textbf{(2) $\neq$ distinto a:} \texttt{nombre $\neq$ ``Pedro''} ¿el nombre no es Pedro? \textbf{(3) > mayor que:} \texttt{precio > 100} ¿el precio es mayor que 100? \textbf{(4) < menor que:} \texttt{altura < 1.50} ¿la altura es menor que 1.50? \textbf{(5) $\geq$ mayor o igual:} \texttt{nota $\geq$ 3.5} ¿la nota es mayor o igual a 3.5 (es decir, aprueba)? \textbf{(6) $\leq$ menor o igual:} \texttt{edad $\leq$ 12} ¿la edad es menor o igual a 12 (es decir, niño)?.
  - |-
    \textbf{Condicionales anidados (uno dentro de otro).} Cuando una decisión depende de la anterior, se anidan. Ejemplo del semáforo: \emph{SI luz = ``verde'' ENTONCES seguir. SI NO SI luz = ``amarillo'' ENTONCES disminuir velocidad. SI NO ENTONCES detenerse}. Esto se escribe escalonado para mayor claridad. \textbf{Pista:} no anides más de 3 condicionales seguidos --- se vuelve enredado. Si necesitas más, probablemente es mejor descomponer en sub-algoritmos.
  - |-
    \textbf{Conexión con diagramas de flujo (S4).} Cada condicional en el algoritmo se representa con un \textbf{rombo de decisión}: adentro va la condición (pregunta), dos flechas salen con SÍ y NO. \textbf{Cómo dibujarlo:} (a) rombo con la pregunta dentro; (b) flecha SÍ que lleva al rectángulo de la acción 1; (c) flecha NO que lleva al rectángulo de la acción 2; (d) ambas flechas convergen al siguiente paso común. Si tienes 3 condicionales en tu algoritmo, tu diagrama tendrá 3 rombos.

  anatomia:
    titulo: Condicionales + 6 operadores
    body: |-
      \textbf{Estructura simple:} SI [condición] ENTONCES [acción]. \\[1mm]
      \textbf{Estructura doble:} SI [condición] ENTONCES [acción 1] SI NO [acción 2]. \\[1mm]
      \textbf{6 operadores:} \\[1mm]
      = igual · $\neq$ distinto · > mayor · < menor · $\geq$ mayor o igual · $\leq$ menor o igual. \\[1mm]
      \textbf{En diagrama:} cada condicional es un rombo con SÍ/NO.

  errores_comunes: |-
    \textbf{Errores frecuentes con condicionales.} (1) \emph{Olvidar el SI NO:} solo escribir \emph{``SI llueve, llevo paraguas''} y no decir qué hacer si no llueve. A veces está bien (no se ejecuta nada), pero a veces dejas un hueco. (2) \emph{Confundir = con ==:} en algunos lenguajes el = es asignación y == es comparación. En lenguaje natural y Scratch, = sirve para los 2. (3) \emph{Condicionales sin sentido lógico:} \emph{``SI 5 > 10''} es siempre falso. Asegúrate de que la condición pueda ser verdadera o falsa según la situación. (4) \emph{Anidar demasiado:} 5 condicionales seguidos se vuelven ilegibles. Mejor descomponer. (5) \emph{Olvidar que las cadenas de texto necesitan comillas en las comparaciones:} \texttt{nombre = ``María''}, no \texttt{nombre = María}.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Estructura + 6 operadores». \textbf{Formato:} bloque A con las 2 estructuras (simple y doble) con 1 ejemplo cada una. Bloque B con tabla de 6 filas: operador + significado + ejemplo. \textbf{Extensión:} 10 líneas. \textbf{Sabes que terminaste cuando} puedes leer un condicional en código y traducirlo a lenguaje natural.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Algoritmo con 3 condicionales + diagrama} (30 min · individual). Vas a escribir un algoritmo de tu vida que use al menos 3 condicionales, y dibujarlo en diagrama de flujo.

  pilares:
  - |-
    \textbf{Paso 1 --- Escoge el tema del algoritmo.} En el cuaderno escribe: \emph{``Mi algoritmo: \_\_\_\_\_''}. Tiene que ser algo que requiera al menos 3 decisiones. Sugerencias: \emph{``Algoritmo del paraguas''} (¿llueve? ¿hace frío? ¿voy a salir mucho?), \emph{``Algoritmo de la calificación''} (¿saca más de 4.5? excelente; ¿más de 3.5? aprueba; ¿menos? falla), \emph{``Algoritmo del fin de semana''} (¿es viernes? ¿es sábado? ¿hay tareas pendientes?), \emph{``Algoritmo de qué ropa ponerme''} (¿es para colegio? ¿hace frío? ¿llueve?).
  - |-
    \textbf{Paso 2 --- Lista las variables que necesitas.} Si tu algoritmo usa información que cambia, son variables (S5). Ejemplo del paraguas: \texttt{estaLloviendo} (booleano), \texttt{vaASalir} (booleano), \texttt{horasFuera} (número). Lista las variables al inicio del algoritmo.
  - |-
    \textbf{Paso 3 --- Escribe el algoritmo en lenguaje natural.} Estructura: \emph{INICIO. (entrada de variables). PASO 1 con un condicional. PASO 2 con condicional. PASO 3 con condicional. SALIDA. FIN}. Ejemplo del paraguas: \emph{``INICIO. Variables: estaLloviendo, vaASalir, horasFuera. PASO 1: SI estaLloviendo = verdadero ENTONCES llevarParaguas = verdadero. SI NO, llevarParaguas = falso. PASO 2: SI vaASalir = falso ENTONCES llevarParaguas = falso (no necesito si no salgo). PASO 3: SI horasFuera > 5 ENTONCES llevarParaguasGrande = verdadero. SI NO, llevarParaguasGrande = falso. SALIDA: Decisión final. FIN.''}.
  - |-
    \textbf{Paso 4 --- Dibuja el diagrama de flujo.} Aplica lo aprendido en S4: óvalo INICIO → procesos → rombos para cada condicional → óvalo FIN. Tu diagrama tendrá \textbf{3 rombos} (uno por condicional). Cada rombo con sus 2 flechas etiquetadas SÍ/NO.
  - |-
    \textbf{Paso 5 --- Tabla de operadores.} En una esquina del cuaderno, dibuja una tabla con los 6 operadores: =, ≠, >, <, ≥, ≤. Al lado de cada uno, el significado en español. Marca cuáles usaste en tu algoritmo.
  - |-
    \textbf{Paso 6 --- Prueba mental + reflexión.} Imagina 2 valores distintos para tus variables (\emph{caso 1: lloviendo y voy a salir; caso 2: soleado y no salgo}). Ejecuta el algoritmo mentalmente para los 2 casos y verifica que da resultados correctos. Al final escribe: \emph{``El condicional que más me costó escribir fue \_\_\_. El operador que más usé fue \_\_\_''}. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S6
    items: |-
      \checkbox Mi algoritmo tiene tema claro y útil. \\[1mm]
      \checkbox Listé las variables al inicio. \\[1mm]
      \checkbox Hay mínimo 3 condicionales con estructura SI-ENTONCES-SI NO. \\[1mm]
      \checkbox El diagrama tiene 3 rombos con SÍ/NO etiquetados. \\[1mm]
      \checkbox La tabla de los 6 operadores está al lado. \\[1mm]
      \checkbox Probé el algoritmo mentalmente con valores distintos.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} tema del algoritmo. \textit{Paso 2:} variables. \textit{Paso 3:} algoritmo con 3 condicionales (SI-ENTONCES-SI NO). \textit{Paso 4:} diagrama de flujo. \textit{Paso 5:} tabla de 6 operadores. \textit{Paso 6:} prueba mental + reflexión.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Algoritmo con 3 condicionales». \textbf{Formato:} variables + algoritmo + diagrama + tabla de operadores + prueba mental. \textbf{Extensión:} 1 página y media. \textbf{Sabes que terminaste cuando} tu algoritmo da resultados correctos para distintos valores de entrada.

  producto_titulo: Algoritmo con 3 condicionales + diagrama de flujo · 6 operadores aplicados
  criterios:
  - El algoritmo tiene mínimo 3 condicionales con estructura completa.
  - Las variables están listadas al inicio.
  - El diagrama de flujo tiene 3 rombos con SÍ/NO etiquetados.
  - La tabla de operadores está completa.
  - Se hizo prueba mental con valores distintos.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la decisión ética)"
    cita: |-
      ``Toda decisión es un condicional. SI quiero ser justo, ENTONCES debo escuchar. La vida ética es algoritmo aplicado.''
    aplicacion: |-
      Las decisiones éticas también son condicionales: \emph{``SI mi amigo necesita ayuda, ENTONCES la ofrezco''}, \emph{``SI veo una injusticia, ENTONCES no callo''}. Aprender a pensar en condicionales no es solo programación: \textbf{es aprender a estructurar tu vida moral}. Las abuelas cocineras tomaban decisiones técnicas (ingredientes) y éticas (¿alcanza para los vecinos?) con la misma estructura mental. \emph{El condicional es la forma básica del pensamiento responsable}.
    pregunta_espejo: |-
      ¿Cuáles son las condicionales éticas que rigen mis decisiones diarias? ¿Las he hecho explícitas?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``El sabio no decide por impulso. Pregunta: SI hago esto, ¿qué pasa? SI no, ¿qué pasa? Y elige con criterio.''
    aplicacion: |-
      Marco Aurelio gobernaba un imperio. \textbf{Cada decisión la pensaba como condicional}: \emph{``SI envío estas tropas a Galia, ENTONCES protejo el norte pero debilito el sur. SI NO, conservo el balance''}. La habilidad de \emph{pensar en condicionales} antes de actuar es lo que separa al estoico del impulsivo. Tú con tus algoritmos entrenas esa virtud antigua en lenguaje moderno.
    pregunta_espejo: |-
      Antes de tomar decisiones importantes, ¿hago el ejercicio mental del condicional (SI esto, entonces tal; SI no, tal otro)?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del algoritmo decisor)"
    cita: |-
      ``Los algoritmos modernos toman decisiones por nosotros: qué video ver, qué amigo recomendar. Entender los condicionales es entender cómo deciden esos algoritmos.''
    aplicacion: |-
      Cuando TikTok te recomienda un video, está ejecutando algoritmos con \textbf{millones de condicionales} (SI le gustaron videos similares, ENTONCES recomendar este). Cuando un banco aprueba un crédito, también: condicionales sobre tu historial. \emph{Entender qué son los condicionales te abre la caja negra de los algoritmos que rigen tu vida}. No para programar a Big Tech, sino para no ser sujeto pasivo.
    pregunta_espejo: |-
      ¿Qué algoritmos invisibles me afectan cada día? ¿Sé al menos que existen?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, anota 3 condicionales reales de tu vida (decisiones que tomaste con la estructura SI-ENTONCES). La próxima clase aprendes \textbf{bucles}: la otra herramienta fundamental de programación, que permite repetir acciones inteligentemente.

web:
  conceptos_clave:
    - termino: Condicional
      definicion: |-
        Estructura que ejecuta una acción SI se cumple una condición. La estructura básica es 'SI [condición] ENTONCES [acción 1] SI NO [acción 2]'. Componente fundamental de toda programación.
      ejemplo: |-
        SI hace frío ENTONCES uso chaqueta. SI NO, uso solo camiseta. La condición es 'hace frío'; la acción 1 es 'usar chaqueta'; la acción 2 es 'usar solo camiseta'.
      emoji: "🔀"
    - termino: Operadores de comparación
      definicion: |-
        Los 6 símbolos básicos para escribir condiciones: = (igual a), ≠ (distinto), > (mayor), < (menor), ≥ (mayor o igual), ≤ (menor o igual). Comparan dos valores y dan resultado verdadero o falso.
      ejemplo: |-
        edad ≥ 18 → ¿la edad es mayor o igual a 18? Si edad = 13, la respuesta es falso. Si edad = 25, la respuesta es verdadero. Ese resultado decide el camino del condicional.
      emoji: "⚖️"
    - termino: Estructura SI-ENTONCES-SI NO
      definicion: |-
        Forma completa del condicional. Si la condición es verdadera, se ejecuta acción 1. Si es falsa, se ejecuta acción 2. Siempre se ejecuta alguna (no se quedan 'casos sueltos').
      ejemplo: |-
        SI hay sol ENTONCES uso gafas. SI NO, no las uso. Si está soleado, gafas. Si está nublado, sin gafas. El algoritmo siempre decide algo.
      emoji: "🔂"
    - termino: Condicional anidado
      definicion: |-
        Un condicional dentro de otro. Útil cuando una decisión depende de la anterior. Ejemplo: SI luz=verde, seguir. SI NO, SI luz=amarillo, disminuir. SI NO, detenerse. Útil para más de 2 caminos.
      ejemplo: |-
        Semáforo: 3 estados. SI verde → seguir. SI NO (no es verde) → SI amarillo → disminuir. SI NO (no es amarillo, así que es rojo) → detenerse. Anidación clásica.
      emoji: "🌲"
    - termino: Rombo del diagrama de flujo
      definicion: |-
        En el diagrama de flujo, cada condicional se representa con un rombo. Adentro va la condición (pregunta). De él salen 2 flechas etiquetadas SÍ y NO, cada una hacia una acción distinta.
      ejemplo: |-
        Rombo con '¿llueve?' adentro. Flecha SÍ va a rectángulo 'llevar paraguas'. Flecha NO va a rectángulo 'no llevarlo'. Ambas siguen al siguiente paso del algoritmo.
      emoji: "◇"

  quiz:
    titulo: "¿Sabes usar condicionales?"
    instrucciones: "5 preguntas para verificar que dominas la estructura y los operadores."
    preguntas:
      - enunciado: "¿Cuál es la estructura básica de un condicional?"
        opciones:
          - "REPITE [acción] HASTA [condición]."
          - "SI [condición] ENTONCES [acción 1] SI NO [acción 2]."
          - "GUARDA [valor] EN [variable]."
          - "MUESTRA [resultado]."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. SI-ENTONCES-SI NO. La condición es verdadera o falsa. Verdadera → acción 1. Falsa → acción 2. Estructura universal en programación.
        feedback_incorrecto: |-
          SI [condición] ENTONCES [acción 1] SI NO [acción 2]. La condición decide cuál acción se ejecuta. Componente fundamental de toda programación.
      - enunciado: "Tu algoritmo dice 'SI edad ≥ 13 ENTONCES mostrar bienvenida'. ¿Qué operador es '≥'?"
        opciones:
          - "Igual a."
          - "Mayor o igual a."
          - "Distinto a."
          - "Menor que."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. ≥ es 'mayor o igual a'. Si edad es 13, 14, 15, ... la condición es verdadera. Si edad es 12 o menos, falsa. Útil para 'desde tal edad'.
        feedback_incorrecto: |-
          ≥ = 'mayor o igual a'. Incluye el valor exacto. Si edad ≥ 13, edades válidas: 13, 14, 15... Si fuera > 13 (sin igual), solo desde 14.
      - enunciado: "Tu condicional dice 'SI nombre = María'. ¿Qué falla?"
        opciones:
          - "Nada."
          - "Falta poner María entre comillas: 'SI nombre = ''María''' (texto va entre comillas)."
          - "Hay que escribir el nombre en mayúsculas."
          - "El nombre debería ser número."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Texto entre comillas. Sin comillas, programa cree que 'María' es otra variable. Con comillas, sabe que es texto literal a comparar.
        feedback_incorrecto: |-
          Texto entre comillas: nombre = 'María'. Sin comillas, programa busca una variable llamada María, no compara con el texto María.
      - enunciado: "Tu algoritmo necesita decidir entre 3 opciones según el semáforo. ¿Cómo lo escribes?"
        opciones:
          - "Un solo condicional simple."
          - "Condicionales anidados: SI verde ENTONCES seguir. SI NO, SI amarillo ENTONCES disminuir. SI NO ENTONCES detenerse."
          - "10 condicionales separados."
          - "Sin condicionales."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Para 3 opciones: anidación. SI verde → SI NO SI amarillo → SI NO (rojo). Estructura escalonada. Clásico ejemplo del semáforo.
        feedback_incorrecto: |-
          Anidación: SI verde ENTONCES seguir. SI NO (no es verde), SI amarillo ENTONCES disminuir. SI NO (no es ni verde ni amarillo, es rojo) ENTONCES detenerse.
      - enunciado: "En un diagrama de flujo, ¿qué símbolo representa un condicional?"
        opciones:
          - "Rectángulo."
          - "Rombo (con 2 flechas SÍ/NO saliendo)."
          - "Óvalo."
          - "Paralelogramo."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Rombo para condicionales. Adentro la pregunta, 2 flechas saliendo etiquetadas SÍ y NO. Cada flecha lleva a una acción distinta.
        feedback_incorrecto: |-
          Rombo. La pregunta adentro, 2 flechas saliendo: SÍ y NO. Cada flecha a una acción distinta. Es lo aprendido en S4.

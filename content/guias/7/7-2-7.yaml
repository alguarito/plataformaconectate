clave: "2-7"
grado: 7
periodo: 2
sesion: 7
completo: true

titulo: "Bucles --- repeticiones inteligentes en los algoritmos"
titulo_portada: |-
  Bucles ---
  repeticiones
  inteligentes
  en los
  algoritmos

producto_final: |-
  Un \textbf{algoritmo que use al menos 2 bucles} (uno de tipo \emph{repetir N veces}, otro de tipo \emph{repetir hasta que}). Tema sugerido: \emph{``Tejer una pulsera de 30 vueltas''}, \emph{``Saludar a los 20 invitados a una fiesta''}, \emph{``Lavarse los dientes (cepillar arriba, abajo, izquierda, derecha)''}. Más \textbf{su diagrama de flujo} (con el bucle dibujado correctamente). Más \textbf{tabla comparativa} de los 2 tipos de bucles en el cuaderno.

apertura:
  saber_ancestral: |-
    \textbf{Doña Sofía la tejedora del Valle del Cauca repetía el mismo patrón 200 veces para tejer una mochila.} En la vereda La Plata, las tejedoras de canastos del Cauca, las hamaqueras del Pacífico, las costureras de Buga tenían un saber compartido: \emph{el patrón se repite}. Cuando doña Sofía empezaba una mochila, sabía que tenía que ejecutar la secuencia \emph{``levantar hebra, pasarla sobre 2, pasarla por debajo de 1''} \textbf{exactamente 200 veces}. \emph{¿Contaba mentalmente?} Sí. \emph{¿Se aburría?} No --- la repetición rítmica era \emph{meditativa}. \emph{¿Se equivocaba?} A veces, y entonces destejía hasta el último punto correcto y volvía a empezar. Esa estructura --- \emph{``repetir N veces''} o \emph{``repetir hasta lograr X''} --- es exactamente lo que en programación llamamos \textbf{bucle} o \textbf{ciclo}. Sin bucles, una mochila Wayuu tomaría escribir 200 instrucciones separadas. \textbf{Con bucles, una instrucción se ejecuta automáticamente N veces}. Es la elegancia algorítmica que las tejedoras ya conocían.

  saber_contemporaneo: |-
    Un \textbf{bucle} (o \emph{ciclo}, o \emph{loop} en inglés) es una estructura que \textbf{repite una o varias acciones hasta que se cumple una condición}. Es el tercer componente fundamental de la programación (después de variables y condicionales). \textbf{Hay 2 tipos básicos.} \textbf{(1) Bucle ``repetir N veces''} (\emph{for}): se repite un número fijo de veces. Ejemplo: \emph{REPETIR 10 VECES: dar pasos}. Útil cuando sabes exactamente cuántas repeticiones quieres. \textbf{(2) Bucle ``repetir hasta que''} (\emph{while}): se repite mientras una condición es verdadera. Ejemplo: \emph{REPETIR HASTA QUE peso = 100kg: comer}. Útil cuando no sabes cuántas repeticiones, pero sabes cuándo parar. \textbf{Los bucles son lo que hace que un programa pueda procesar muchos datos sin escribir mil veces lo mismo}: leer todos los correos, mover todos los archivos, sumar todas las notas. Sin bucles, los programas serían imposibles de escribir.

  pregunta_puente: |-
    Si tuvieras que escribir un programa para \emph{``saludar a los 30 estudiantes de la clase, uno por uno, llamándolos por su nombre''}, ¿\textbf{escribirías 30 instrucciones separadas} o usarías un bucle?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 2 tipos de bucles; (2) sabrás \textbf{aplicar} cada tipo a su situación; (3) podrás \textbf{evaluar} si un algoritmo necesita bucle o no; (4) habrás \textbf{creado} un algoritmo con 2 bucles + diagrama.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas repeticiones en situaciones reales, aprendes los 2 tipos de bucles, escribes algoritmo con 2 bucles, dibujas el diagrama.
  a_escuta: |-
    Empezamos viendo qué pasaría sin bucles (caos).
  a_sistematizacion: |-
    Después aprendes los 2 tipos + el contador como variable amiga.
  a_praxis: |-
    Con todo claro, escribes tu algoritmo con bucles + diagrama.
  a_producto: |-
    El producto es algoritmo + diagrama + tabla comparativa.
  a_evaluacion: |-
    Antes de salir, verifica que tu algoritmo NO entre en bucle infinito (que sí termine).
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué saber repetir bien es virtud antigua.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- ¿Cuántas instrucciones sin bucle?} (10 min · individual). Imagina este problema: \emph{tienes que dar la bienvenida a los 30 estudiantes nuevos de 7°. A cada uno: ``Hola, bienvenido a la clase''.} \textbf{En el cuaderno responde:} \emph{(1) Sin usar bucles, ¿cuántas instrucciones escribirías?}. \emph{(2) ¿Cuánto te tomaría escribirlas?}. \emph{(3) ¿Qué pasa si en lugar de 30 son 300 estudiantes?}. \emph{(4) ¿Crees que hay una manera más inteligente?}.

  checks:
  - Pensé en el problema sin bucle.
  - Calculé cuántas instrucciones serían.
  - Reconocí que escalar es problema sin bucles.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 30 saludos sin bucle». \textbf{Formato:} 4 respuestas cortas. \textbf{Extensión:} 5-6 líneas. \textbf{Sabes que terminaste cuando} ves que sin bucles los programas serían inmanejables.

sistematizacion:
  intro: |-
    La intuición es correcta: \textbf{sin bucles, los programas se vuelven imposibles}. Ahora aprende los 2 tipos de bucles y cómo se escriben.

  pilares:
  - |-
    \textbf{Bucle tipo 1 --- ``Repetir N veces'' (for).} Cuando \emph{sabes exactamente cuántas veces} quieres repetir. Estructura: \emph{REPETIR [N] VECES: [acción]}. Ejemplo del saludo: \emph{REPETIR 30 VECES: decir ``Hola, bienvenido''}. Eso es 1 instrucción que ejecuta 30 veces. En programación a veces se usa una \textbf{variable contador} que va de 1 a N: \emph{PARA cada estudiante DESDE 1 HASTA 30: decir ``Hola estudiante [contador]''}. La variable contador toma valores 1, 2, 3, ..., 30 sucesivamente.
  - |-
    \textbf{Bucle tipo 2 --- ``Repetir hasta que'' (while).} Cuando \emph{no sabes cuántas veces} pero sabes la condición de parada. Estructura: \emph{REPETIR HASTA QUE [condición]: [acción]}. Ejemplo: \emph{REPETIR HASTA QUE puntaje $\geq$ 100: jugar un nivel}. Se repite mientras puntaje sea menor que 100. Cuando puntaje llega a 100 (o más), el bucle termina. Otra variante: \emph{MIENTRAS [condición es verdadera]: [acción]} --- igual de común, lógica equivalente.
  - |-
    \textbf{El contador como variable amiga del bucle.} Casi todo bucle usa una \textbf{variable contador}: número que se incrementa cada vuelta del bucle. Ejemplo de tejido: \texttt{vueltaActual = 0}; \emph{REPETIR HASTA QUE vueltaActual = 200: tejer una vuelta; vueltaActual = vueltaActual + 1}. Cada iteración: teje 1 vuelta y suma 1 al contador. Cuando llega a 200, termina. El contador es lo que conecta variables (S5) con bucles (S7).
  - |-
    \textbf{El bucle infinito (cuidado).} Un bucle que NUNCA termina porque la condición nunca se vuelve falsa. Ejemplo MAL: \emph{REPETIR HASTA QUE 5 > 10: jugar} --- esto es siempre falso, el bucle no para nunca, el programa se congela. \textbf{Cómo evitarlo:} (a) verificar que la condición se pueda volver verdadera en algún momento; (b) verificar que algo cambia adentro del bucle (incrementar contador, modificar variable). En Scratch y otros lenguajes, los bucles infinitos hacen que el programa se trabe.

  anatomia:
    titulo: 2 tipos de bucles + contador + cuidado infinito
    body: |-
      \textbf{Tipo 1 (for):} REPETIR [N] VECES: [acción]. \\[1mm]
      \textbf{Tipo 2 (while):} REPETIR HASTA QUE [condición]: [acción]. \\[1mm]
      \textbf{Contador:} variable que cuenta las iteraciones (vueltaActual = 0; vueltaActual = vueltaActual + 1). \\[1mm]
      \textbf{Cuidado bucle infinito:} verificar que la condición se pueda cumplir.

  errores_comunes: |-
    \textbf{Errores frecuentes con bucles.} (1) \emph{Olvidar incrementar el contador} --- bucle infinito porque nunca cambia la condición. (2) \emph{Condición que nunca se vuelve verdadera} --- bucle infinito. \emph{``REPETIR HASTA QUE 0 = 1''} no termina nunca. (3) \emph{Usar bucle cuando no se necesita} --- si solo es 1 vez, no necesitas bucle. (4) \emph{Usar tipo for cuando debería ser while} (o viceversa) --- depende de si conoces el número exacto o solo la condición. (5) \emph{Anidar bucles sin necesidad} --- 5 bucles dentro de bucles se vuelven inentendibles. Mejor descomponer.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 2 tipos de bucles». \textbf{Formato:} tabla comparativa de 4 filas, 3 columnas (criterio, FOR, WHILE). Filas: \emph{cuándo se usa}, \emph{ejemplo de la vida real}, \emph{estructura escrita}, \emph{cómo se ve en diagrama}. \textbf{Extensión:} 4 filas. \textbf{Sabes que terminaste cuando} podrías escoger el tipo correcto de bucle para cualquier situación.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Algoritmo con 2 bucles + diagrama} (30 min · individual). Vas a escribir un algoritmo que use \textbf{2 bucles distintos} (uno de cada tipo) y dibujarlo en diagrama de flujo.

  pilares:
  - |-
    \textbf{Paso 1 --- Escoge el tema del algoritmo.} Tiene que ser algo que requiera \emph{2 tipos de repetición}: una \emph{N veces} (sabes cuántas) y una \emph{hasta que} (no sabes cuántas, sabes cuándo parar). Sugerencias: \emph{``Tejer una pulsera de 30 vueltas pero hasta que se acabe el hilo''} (for por las 30 vueltas, while por el hilo). \emph{``Saludar a los 20 invitados de una fiesta y hasta que se acaben los bocaditos''} (for por los 20, while por los bocaditos). \emph{``Estudiar 5 ejercicios pero hasta que entienda el tema''}.
  - |-
    \textbf{Paso 2 --- Identifica las variables y el contador.} Lista las variables: \texttt{cantidadVueltas} (número), \texttt{hiloRestante} (número), \texttt{contadorVueltas} (número, empieza en 0). Identifica cuál es el contador para cada bucle.
  - |-
    \textbf{Paso 3 --- Escribe el algoritmo.} Estructura sugerida: \emph{INICIO. Variables: cantidadVueltas = 30, hiloRestante = 100, contadorVueltas = 0. BUCLE 1 (for): PARA contadorVueltas DESDE 1 HASTA 30: tejer 1 vuelta; hiloRestante = hiloRestante - 1. BUCLE 2 (while): MIENTRAS hiloRestante > 0: tejer 1 vuelta más; hiloRestante = hiloRestante - 1. FIN.}. Adapta a tu tema.
  - |-
    \textbf{Paso 4 --- Dibuja el diagrama de flujo.} Los bucles se representan así en diagrama: \textbf{(a)} óvalo INICIO. \textbf{(b)} Para el bucle ``repetir N veces'': rombo \emph{``¿contador < N?''}, flecha SÍ va al rectángulo de la acción + incremento del contador, flecha NO va al siguiente paso. La acción y el incremento vuelven al rombo (creando el ciclo visual). \textbf{(c)} Para el bucle ``repetir hasta que'': rombo \emph{``¿condición?''}, flecha SÍ va al rectángulo de la acción y vuelve al rombo, flecha NO sale del bucle. \textbf{(d)} óvalo FIN.
  - |-
    \textbf{Paso 5 --- Tabla comparativa de los 2 bucles.} En una esquina del cuaderno, dibuja la tabla de la S2 (Actividad 2) con los 2 tipos. Marca cuál usaste en cada bucle de tu algoritmo. Esto consolida el conocimiento.
  - |-
    \textbf{Paso 6 --- Verificación de bucle no infinito + reflexión + firma.} Revisa tu algoritmo: \emph{¿el bucle for tiene condición que se cumple eventualmente?} (sí, porque el contador llega a 30). \emph{¿el bucle while tiene condición que se vuelve falsa eventualmente?} (sí, porque hiloRestante disminuye). Si los 2 cumplen, tu algoritmo termina. Escribe la reflexión: \emph{``El tipo de bucle que más me costó entender fue \_\_\_. Si no hubiera bucles en programación, escribir un algoritmo de 100 pasos sería \_\_\_''}. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S7
    items: |-
      \checkbox Mi algoritmo tiene 2 bucles, uno de cada tipo. \\[1mm]
      \checkbox El contador del bucle for está identificado. \\[1mm]
      \checkbox El bucle while tiene condición que se vuelve falsa eventualmente. \\[1mm]
      \checkbox El diagrama de flujo muestra los 2 bucles visualmente. \\[1mm]
      \checkbox La tabla comparativa for vs while está completa. \\[1mm]
      \checkbox Verifiqué que NO hay bucle infinito en mi algoritmo.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} tema del algoritmo (que requiera 2 tipos de repetición). \textit{Paso 2:} variables + contador. \textit{Paso 3:} algoritmo con bucle for + bucle while. \textit{Paso 4:} diagrama de flujo. \textit{Paso 5:} tabla comparativa. \textit{Paso 6:} verificación + reflexión + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Algoritmo con 2 bucles». \textbf{Formato:} variables + algoritmo + diagrama + tabla + verificación. \textbf{Extensión:} 1 página y media. \textbf{Sabes que terminaste cuando} podrías ejecutar mentalmente tu algoritmo y verificar que termina (no es infinito).

  producto_titulo: Algoritmo con 2 bucles + diagrama · for y while aplicados · sin bucle infinito
  criterios:
  - El algoritmo tiene 1 bucle for (repetir N veces) bien aplicado.
  - El algoritmo tiene 1 bucle while (repetir hasta que) bien aplicado.
  - El diagrama de flujo muestra los 2 bucles visualmente.
  - El contador del bucle for está identificado.
  - Se verificó que ningún bucle es infinito.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del oficio repetitivo)"
    cita: |-
      ``La repetición no es aburrida cuando entiendes su sentido. La tejedora tejió 200 vueltas porque cada vuelta importaba.''
    aplicacion: |-
      Hay una idea moderna de que la \emph{repetición es aburrida} y debe automatizarse. Es cierto a medias: \textbf{lo que el computador puede repetir automáticamente, no debes repetirlo a mano}. Pero \emph{algunas repeticiones son meditativas y formativas}: doña Sofía tejiendo, el atleta practicando, el músico ensayando. \emph{Los bucles automatizan las repeticiones mecánicas para que tú te concentres en las repeticiones formativas}.
    pregunta_espejo: |-
      ¿Qué repeticiones de mi vida son mecánicas (deberían automatizarse) y cuáles son formativas (vale la pena repetir conscientemente)?

  estoico:
    autor: "Marco Aurelio (emperador de la disciplina diaria)"
    cita: |-
      ``Lo que se repite con criterio, perfecciona. Lo que se repite por inercia, embrutece. La diferencia está en la atención.''
    aplicacion: |-
      \textbf{Los bucles bien diseñados son como la disciplina diaria}: hacen lo mismo cada vez, pero con propósito claro y condición de parada. Sin propósito (bucle infinito), repetir embrutece. Con propósito (condición clara), repetir perfecciona. Marco Aurelio escribía sus reflexiones cada noche --- bucle con propósito, no inercia.
    pregunta_espejo: |-
      Las repeticiones de mi vida diaria, ¿tienen propósito claro o las hago por inercia?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la automatización)"
    cita: |-
      ``Los bucles son lo que hizo posible la computación masiva. Sin bucles, no habría Google ni Wikipedia.''
    aplicacion: |-
      Google indexa millones de páginas \textbf{usando bucles}: \emph{REPETIR por cada página: leer, analizar, indexar, pasar a la siguiente}. Wikipedia tiene millones de artículos. Spotify procesa millones de canciones. \emph{Los bucles son lo que escaló la informática desde calculadoras simples hasta la infraestructura del mundo digital}. Entenderlos en 7° es entender una pieza fundamental del mundo moderno.
    pregunta_espejo: |-
      ¿Qué cosas del mundo digital que uso a diario serían imposibles sin bucles?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, identifica 3 situaciones reales donde te tocaría usar bucles si fueras a automatizarlas. La próxima clase entramos a \textbf{Scratch}: abres tu primer programa con bloques. Vas a programar de verdad.

web:
  conceptos_clave:
    - termino: Bucle (loop, ciclo)
      definicion: |-
        Estructura de programación que repite una o varias acciones hasta que se cumple una condición. Es uno de los 3 componentes fundamentales (junto con variables y condicionales). Sin bucles, los programas serían imposibles.
      ejemplo: |-
        REPETIR 10 VECES: dar paso. En lugar de escribir 'dar paso' 10 veces, escribes el bucle una sola vez. Más limpio y más fácil de cambiar (si quieres 20 veces, cambias el 10 por 20).
      emoji: "🔄"
    - termino: Bucle FOR (repetir N veces)
      definicion: |-
        Bucle que se repite un número fijo y conocido de veces. Estructura: REPETIR [N] VECES: [acción]. Útil cuando sabes exactamente cuántas iteraciones quieres.
      ejemplo: |-
        PARA contador DESDE 1 HASTA 30: decir 'Hola estudiante [contador]'. La variable contador toma valores 1, 2, ..., 30. Saluda a 30 estudiantes con 1 instrucción de bucle.
      emoji: "🔁"
    - termino: Bucle WHILE (repetir hasta que)
      definicion: |-
        Bucle que se repite mientras una condición es verdadera. Estructura: MIENTRAS [condición]: [acción]. Útil cuando no sabes cuántas iteraciones, pero sabes cuándo parar.
      ejemplo: |-
        MIENTRAS hiloRestante > 0: tejer 1 vuelta; hiloRestante = hiloRestante - 1. Se repite hasta que el hilo se acabe. No se sabe cuántas vueltas; sí se sabe cuándo parar.
      emoji: "♾️"
    - termino: Contador
      definicion: |-
        Variable numérica que cuenta las iteraciones de un bucle. Suele empezar en 0 (o 1) y se incrementa (suma 1) cada vez que el bucle se ejecuta. Permite saber cuántas veces ha corrido el bucle.
      ejemplo: |-
        vueltaActual = 0; MIENTRAS vueltaActual < 200: tejer; vueltaActual = vueltaActual + 1. El contador va 0, 1, 2, ..., 199. Cuando llega a 200, el bucle termina.
      emoji: "🧮"
    - termino: Bucle infinito (error a evitar)
      definicion: |-
        Bucle que nunca termina porque la condición nunca se vuelve falsa. Hace que el programa se trabe. Se evita verificando que algo cambie adentro del bucle (incrementar contador, modificar variable).
      ejemplo: |-
        REPETIR HASTA QUE 5 > 10: jugar. La condición '5 > 10' es siempre falsa, así que el bucle nunca termina. Error de diseño. Verifica que la condición pueda cumplirse algún día.
      emoji: "⚠️"

  quiz:
    titulo: "¿Sabes usar bucles?"
    instrucciones: "5 preguntas para verificar que dominas los 2 tipos y el contador."
    preguntas:
      - enunciado: "Necesitas saludar a 30 estudiantes. ¿Qué tipo de bucle usas?"
        opciones:
          - "WHILE (porque no sabes cuándo termina)."
          - "FOR (repetir 30 veces, sabes el número exacto)."
          - "Ninguno, escribes 30 instrucciones separadas."
          - "Bucle infinito."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Número exacto = bucle FOR. PARA contador DESDE 1 HASTA 30: saludar. Una instrucción de bucle, 30 saludos ejecutados.
        feedback_incorrecto: |-
          FOR para número exacto conocido (30 estudiantes). WHILE para 'no sé cuántas pero sé cuándo parar'. Aquí sabes que son 30, entonces FOR.
      - enunciado: "Tu juego dice 'repetir hasta que el jugador gane 100 puntos'. ¿Qué tipo de bucle es?"
        opciones:
          - "FOR (porque hay número 100)."
          - "WHILE (porque no sabes cuántas iteraciones, solo cuándo parar)."
          - "Ninguno."
          - "Bucle infinito."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. No sabes cuántas iteraciones (podrían ser 5 o 50). Sabes la condición de parada (100 puntos). Eso es WHILE.
        feedback_incorrecto: |-
          WHILE porque no conoces el número exacto, solo cuándo parar. El jugador puede ganar en 5 turnos o 50; el bucle termina cuando llegue a 100.
      - enunciado: "¿Qué hace una variable contador en un bucle?"
        opciones:
          - "Nada útil."
          - "Cuenta las iteraciones, se incrementa (suma 1) cada vez que el bucle se ejecuta."
          - "Borra el bucle."
          - "Hace el bucle más lento."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Contador = variable que cuenta. Empieza en 0 (o 1), se suma 1 cada iteración. Permite saber cuántas veces ha corrido el bucle.
        feedback_incorrecto: |-
          Contador = variable que cuenta iteraciones. Esencial para bucles FOR y útil en WHILE. Empieza en 0, se incrementa cada vez.
      - enunciado: "¿Qué es un bucle infinito y cómo evitarlo?"
        opciones:
          - "Es bueno, queremos que el programa corra siempre."
          - "Es un bucle que nunca termina (la condición nunca se vuelve falsa). Se evita verificando que algo cambie adentro."
          - "Es un bucle invisible."
          - "Es un bucle que termina rápido."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Bucle infinito = nunca termina. Programa se traba. Se evita verificando que el contador se incremente o la condición pueda volverse falsa.
        feedback_incorrecto: |-
          Bucle infinito traba el programa. Evítalo verificando que algo cambie en cada iteración (incrementar contador, modificar variable que está en la condición).
      - enunciado: "Si NO existieran los bucles, ¿qué pasaría con la programación?"
        opciones:
          - "Sería igual, no afecta."
          - "Sería imposible procesar muchos datos: tendrías que escribir miles de instrucciones repetidas."
          - "Los programas serían más rápidos."
          - "Sería más fácil."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Sin bucles, indexar Google sería escribir millones de instrucciones. Wikipedia, Spotify, TikTok: imposibles. Los bucles escalaron la programación.
        feedback_incorrecto: |-
          Sin bucles no habría Google, Wikipedia, ni redes sociales. Procesar muchos datos requiere bucles. Son fundamentales para programación moderna.

grado: 7
periodo: 2
sesion: 8
completo: true

titulo: "Scratch --- mi primer programa con bloques"
titulo_portada: |-
  Scratch ---
  mi primer
  programa
  con bloques

producto_final: |-
  Tu \textbf{primer programa en Scratch}: un \emph{sprite} (personaje) que: \textbf{(a) se mueve 100 pasos cuando se hace clic en bandera verde}, \textbf{(b) dice ``Hola'' por 2 segundos}, \textbf{(c) cambia de color y baila (repetir gira derecha-izquierda 10 veces)}. El programa guardado en tu cuenta de Scratch (\emph{scratch.mit.edu}) con tu cuenta o como invitado. Más \textbf{en el cuaderno}: captura impresa o boceto del proyecto + lista de los \textbf{6 bloques principales} que usaste con su categoría.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural de Cartago decía: ``Lo nuevo se aprende mejor jugando que estudiando.''} En la vereda La Plata, cuando enseñaba sumas a los niños del campo, no empezaba con ejercicios secos: \textbf{usaba piedrecitas, granos de maíz, tarjetas hechas a mano}. Los niños jugaban a sumar, restar, agrupar. \emph{Sin darse cuenta, estaban entendiendo matemáticas profundas}. La pedagogía del juego no era casualidad: doña Mercedes había observado que \emph{el cerebro aprende cuando se divierte}. Lo serio, presentado como serio, se aprende a medias; lo serio, presentado como juego, se aprende a fondo. \textbf{Esa intuición pedagógica es exactamente lo que motivó la creación de Scratch en el MIT}. Mitchel Resnick (su creador) sabía que enseñar programación a niños y jóvenes con código de texto sería frustrante. \emph{Diseñó Scratch para que sea juego primero, programación después}. Hoy abres ese taller-juego.

  saber_contemporaneo: |-
    \textbf{Scratch} es un lenguaje de programación visual desarrollado en el \emph{MIT Media Lab} (Massachusetts Institute of Technology) en 2007. Es \textbf{gratuito}, funciona en cualquier navegador (\texttt{scratch.mit.edu}), sin instalación. Más de \textbf{100 millones de proyectos} compartidos en su comunidad. Se basa en \textbf{bloques que se encajan como piezas de Lego}: cada bloque es una instrucción, los encajas en orden, formas un programa. \textbf{Conceptos visuales clave:} \emph{(1) Escenario (Stage)}: el fondo donde pasan las cosas. \emph{(2) Sprite}: un personaje u objeto (gato, perro, pelota). \emph{(3) Bloques}: instrucciones de colores. \emph{(4) Programa}: secuencia de bloques. \textbf{Categorías de bloques (9 colores):} Movimiento (azul), Apariencia (morado), Sonido (rosa), Eventos (amarillo), Control (naranja), Sensores (turquesa), Operadores (verde), Variables (rojo oscuro), Mis Bloques (rosa fuerte). Hoy usas bloques de las primeras 5 categorías.

  pregunta_puente: |-
    Cuando empieces a jugar con Scratch, ¿\textbf{cómo crees que se siente programar} con bloques en lugar de escribir código? ¿Más fácil? ¿Más difícil? ¿Más divertido?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} la interfaz de Scratch (escenario, sprite, bloques); (2) sabrás \textbf{aplicar} los bloques de las 5 primeras categorías; (3) podrás \textbf{evaluar} si tu programa funciona correctamente; (4) habrás \textbf{creado} tu primer programa Scratch.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: conoces la interfaz, exploras los bloques, creas tu primer programa, lo pruebas.
  a_escuta: |-
    Empezamos identificando partes de la interfaz de Scratch.
  a_sistematizacion: |-
    Después aprendes las 5 categorías clave de bloques + cómo se encajan.
  a_praxis: |-
    Con todo claro, abres Scratch y haces tu primer programa.
  a_producto: |-
    El producto es el programa guardado + captura + lista de bloques en cuaderno.
  a_evaluacion: |-
    Antes de salir, ejecuta el programa al menos 3 veces para verificar que funciona.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué programar es una de las habilidades clave del siglo XXI.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Interfaz de Scratch} (10 min · individual). Imagina (o el profe muestra) la pantalla de Scratch. En el cuaderno, dibuja un \textbf{rectángulo grande} representando la pantalla del computador. Adentro, marca con flechas y nombres las \textbf{4 zonas principales} de Scratch: \emph{(1) Escenario (Stage)}: el rectángulo grande arriba a la derecha, donde pasa la animación. \emph{(2) Sprites}: el panel debajo del escenario, donde se ven los personajes. \emph{(3) Categorías de bloques}: la columna de la izquierda con colores (azul, morado, rosa, etc.). \emph{(4) Área de programación}: el espacio central donde se arrastran los bloques para formar el programa.

  checks:
  - Dibujé un rectángulo representando la pantalla.
  - Marqué las 4 zonas principales con flechas.
  - Identifiqué para qué sirve cada zona.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Interfaz de Scratch». \textbf{Formato:} dibujo de la pantalla con 4 zonas marcadas. \textbf{Extensión:} 1/3 de página. \textbf{Sabes que terminaste cuando} sabes dónde está cada zona y qué hace.

sistematizacion:
  intro: |-
    Ahora aprende los \textbf{bloques de las 5 categorías} que vas a usar hoy + cómo se encajan.

  pilares:
  - |-
    \textbf{Categoría 1 --- Eventos (amarillo).} \textbf{El programa empieza con un evento.} Bloque clave: \emph{``Al hacer clic en la bandera verde''} (la bandera arriba a la izquierda del escenario). Cuando el usuario hace clic en esa bandera, los bloques que están debajo se ejecutan. Otros eventos: \emph{``Al presionar tecla [letra]''}, \emph{``Al hacer clic en este sprite''}. Los eventos son como el botón START de un juego.
  - |-
    \textbf{Categoría 2 --- Movimiento (azul).} \textbf{Mueven al sprite por el escenario.} Bloques clave: \emph{``Mover 10 pasos''} (avanza), \emph{``Girar 15 grados a la derecha''} (rota), \emph{``Ir a X, Y''} (teletransporta a una coordenada). El escenario es un plano cartesiano: el centro es (0,0), derecha es X positivo, arriba es Y positivo. \textbf{Categoría 3 --- Apariencia (morado).} \textbf{Cambian cómo se ve el sprite.} Bloques clave: \emph{``Decir 'Hola' por 2 segundos''} (globo de texto), \emph{``Cambiar disfraz''} (cambiar imagen), \emph{``Cambiar tamaño''} (más grande o pequeño), \emph{``Cambiar color''}.
  - |-
    \textbf{Categoría 4 --- Sonido (rosa).} \textbf{Reproducen sonidos.} Bloques clave: \emph{``Tocar sonido [nombre]''}, \emph{``Reproducir sonido hasta acabar''}, \emph{``Detener sonido''}. Scratch incluye una biblioteca de sonidos prefabricados; también puedes grabar tus propios sonidos con el micrófono. \textbf{Categoría 5 --- Control (naranja).} \textbf{Estructuras de control: condicionales, bucles, esperas.} Bloques clave: \emph{``Esperar 1 segundo''} (pausa), \emph{``Repetir 10 veces''} (bucle FOR de la S7), \emph{``Repetir hasta que [condición]''} (bucle WHILE de la S7), \emph{``Si [condición] entonces [acción] si no [acción]''} (condicional de la S6). \textbf{Las 5 categorías más usadas para tu primer programa son estas.}
  - |-
    \textbf{Cómo se encajan los bloques.} Los bloques tienen formas que indican cómo se conectan: \textbf{(1) Sombreros (eventos):} forma redondeada arriba, recta abajo. Solo van al principio del programa. \textbf{(2) Bloques sándwich (acciones):} con muescas arriba y abajo, se encajan en cualquier punto del medio. \textbf{(3) Bloques con espacio interno (bucles, condicionales):} tienen un hueco grande adentro donde se meten otros bloques. \emph{Arrastras un bloque y lo encajas con un sonido de clic}. Si dos bloques no encajan visualmente, no se conectan.

  anatomia:
    titulo: 5 categorías + encajes
    body: |-
      \textbf{Eventos (amarillo):} Al hacer clic en bandera verde, al presionar tecla. \\[1mm]
      \textbf{Movimiento (azul):} mover, girar, ir a X-Y. \\[1mm]
      \textbf{Apariencia (morado):} decir, cambiar disfraz, color, tamaño. \\[1mm]
      \textbf{Sonido (rosa):} tocar sonido. \\[1mm]
      \textbf{Control (naranja):} esperar, repetir, si...entonces. \\[1mm]
      \textbf{Encajes:} sombreros (arriba) · sándwich (medio) · con hueco interno (control).

  errores_comunes: |-
    \textbf{Errores frecuentes al empezar con Scratch.} (1) \emph{Olvidar el bloque de evento (bandera verde)} --- el programa no arranca. Siempre empieza con un bloque amarillo. (2) \emph{Encajar bloques sin que hagan clic} --- los bloques no se conectaron, el segundo no se ejecutará. (3) \emph{Querer hacer un videojuego en la primera sesión} --- empieza con un sprite que se mueve y dice algo. La complejidad viene en S9 y S10. (4) \emph{No probar el programa} --- haces clic en la bandera verde para ver qué pasa. Si no se ejecuta como esperabas, revisas y corriges. (5) \emph{Olvidar guardar} --- en Scratch en línea se guarda automático con cuenta. Sin cuenta, no se guarda al cerrar.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 5 categorías de Scratch». \textbf{Formato:} tabla de 5 filas, 3 columnas (categoría, color, 2-3 bloques principales). \textbf{Extensión:} 5 filas. \textbf{Sabes que terminaste cuando} reconoces cualquier bloque y sabes a qué categoría pertenece por su color.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu primer programa Scratch} (35 min · individual). Vas a abrir Scratch y crear tu primer programa real. Es \textbf{el momento esperado del periodo}: vas a programar de verdad.

  pilares:
  - |-
    \textbf{Paso 1 --- Abre Scratch.} En el navegador escribe \texttt{scratch.mit.edu}. Haz clic en \emph{``Crear''} (esquina superior). Aparece la interfaz: escenario arriba a la derecha con el gato amarillo, panel de bloques a la izquierda, área de programación en el centro. Si tienes cuenta, inicia sesión (para que se guarde automáticamente). Si no, sigue como invitado.
  - |-
    \textbf{Paso 2 --- Familiarízate (2-3 min).} Arrastra cualquier bloque del panel de la izquierda al área de programación central. Haz clic en él (se ejecuta una vez). Trata de encajar otro bloque debajo. Cuando dos bloques se encajan correctamente, se ve un clic visual. Esto te entrena en la mecánica básica.
  - |-
    \textbf{Paso 3 --- Programa 1: el sprite se mueve y saluda.} En el área de programación arma este programa de \textbf{4 bloques}: \emph{(a) ``Al hacer clic en bandera verde'' [Eventos, amarillo].} \emph{(b) ``Decir 'Hola' por 2 segundos'' [Apariencia, morado].} \emph{(c) ``Mover 100 pasos'' [Movimiento, azul].} \emph{(d) ``Decir 'Listo!' por 2 segundos'' [Apariencia, morado].}. Encájalos uno debajo del otro. \textbf{Prueba:} haz clic en la bandera verde (arriba del escenario, ícono de bandera). El gato dirá Hola, se moverá 100 pasos a la derecha, dirá Listo.
  - |-
    \textbf{Paso 4 --- Programa 2: agregar el baile.} Debajo del bloque \emph{``Mover 100 pasos''}, agrega: \emph{(e) ``Cambiar efecto color por 25'' [Apariencia, morado].} \emph{(f) ``Repetir 10 veces'' [Control, naranja]}. Dentro del bloque de repetir, mete: \emph{(g) ``Girar 15 grados a la derecha'' [Movimiento, azul].} \emph{(h) ``Esperar 0.1 segundos'' [Control, naranja].} \emph{(i) ``Girar 15 grados a la izquierda'' [Movimiento, azul].} Cuando los pongas dentro del bucle ``Repetir 10 veces'', el bucle los abrazará. Prueba de nuevo: el sprite ahora hace el baile completo.
  - |-
    \textbf{Paso 5 --- Personaliza.} Cambia el sprite (botón \emph{``Elegir un sprite''} abajo a la derecha). Escoge un animal o personaje que te guste. Cambia el fondo del escenario también (botón \emph{``Elegir un fondo''}). Tu programa ahora se ve único.
  - |-
    \textbf{Paso 6 --- Captura, registra en cuaderno + reflexión + firma.} En el cuaderno, dibuja (o imprime si puedes) una captura del programa. Lista los \textbf{6 bloques principales} que usaste con su categoría y color. Reflexión: \emph{``Mi primer programa hizo: \_\_\_. El bloque que más me costó entender fue \_\_\_. Si pudiera agregar algo más, sería \_\_\_''}. Firma con nombre y fecha. \emph{Felicidades: acabaste de programar por primera vez}.

  checklist:
    titulo: Antes de cerrar la S8
    items: |-
      \checkbox Abrí Scratch en scratch.mit.edu. \\[1mm]
      \checkbox Mi programa tiene bloque de evento (bandera verde). \\[1mm]
      \checkbox El sprite se mueve, dice Hola y baila. \\[1mm]
      \checkbox El bucle de repetir 10 veces abraza los bloques de giro. \\[1mm]
      \checkbox Personalicé el sprite y/o el fondo. \\[1mm]
      \checkbox Captura o boceto del programa en el cuaderno.

  plantilla_guion: |-
    \textbf{Estructura del programa.} \textit{Bloque 1 (Eventos):} Al hacer clic en bandera verde. \textit{Bloque 2 (Apariencia):} Decir Hola 2 seg. \textit{Bloque 3 (Movimiento):} Mover 100 pasos. \textit{Bloque 4 (Apariencia):} Decir Listo 2 seg. \textit{Bloque 5 (Apariencia):} Cambiar color +25. \textit{Bloque 6 (Control - bucle):} Repetir 10 veces [Girar 15° derecha, Esperar 0.1s, Girar 15° izquierda].

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi primer programa Scratch». \textbf{Formato:} captura + lista de 6 bloques con categoría/color + reflexión. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} tu programa se ejecuta correctamente al hacer clic en bandera verde.

  producto_titulo: Mi primer programa Scratch · sprite que se mueve, saluda y baila
  criterios:
  - El programa tiene bloque de evento (bandera verde).
  - El sprite ejecuta las 3 acciones (moverse, saludar, bailar).
  - El bucle de repetir 10 veces abraza correctamente los bloques de giro.
  - Se personalizó el sprite y/o fondo.
  - En el cuaderno hay captura + lista de 6 bloques + reflexión firmada.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del acceso al conocimiento)"
    cita: |-
      ``Scratch democratiza la programación: lo que era para ingenieros con doctorado ahora es para niños del barrio. Eso es justicia educativa.''
    aplicacion: |-
      Antes de Scratch, \textbf{programar requería años de estudio formal}: aprender sintaxis compleja, depurar errores de texto, leer documentación en inglés. \emph{Eso excluía a niños, a estudiantes de barrios populares, a personas sin acceso a universidades caras}. Scratch puso la programación al alcance de \textbf{cualquier niño con computador y conexión}. La abuela del Cauca podía aprender; tú lo haces hoy. \emph{El MIT, una de las universidades más exclusivas del mundo, creó Scratch como acto de justicia educativa}.
    pregunta_espejo: |-
      ¿Estoy aprovechando este acceso al saber que generaciones anteriores no tuvieron?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``El que practica una habilidad 30 minutos al día durante 1 año, llega lejos. Scratch te da las herramientas para esa práctica.''
    aplicacion: |-
      \textbf{Scratch es la herramienta. La práctica es tuya}. Marco Aurelio escribía 30 minutos al día durante décadas. Tú puedes practicar Scratch 20-30 minutos al día. En 1 año, programas con fluidez. En 3 años, eres capaz de hacer cosas que adultos no saben hacer. \emph{La disciplina pequeña diaria construye habilidades enormes a largo plazo}.
    pregunta_espejo: |-
      ¿Qué pasaría si practicara Scratch 20 minutos cada día en lugar de solo en clase?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del programar como alfabetización)"
    cita: |-
      ``En 2030, no saber programar mínimamente será como en 1990 no saber leer. Scratch es el lápiz para esa nueva alfabetización.''
    aplicacion: |-
      Las generaciones de tus abuelos aprendieron a leer; las de tus papás aprendieron a usar computadoras; \textbf{tu generación aprende a programar}. No para ser programador profesional, sino para \emph{entender el mundo que te rodea}. Scratch es el primer paso. En grados 8°-11° vas a aprender más lenguajes. En la universidad, código real. \emph{Pero el oficio fundamental --- pensar en bloques de instrucciones --- lo aprendes hoy}.
    pregunta_espejo: |-
      ¿Estoy reconociendo lo importante que es esta alfabetización para mi vida adulta?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, abre Scratch otras 2 veces. Modifica tu programa: cambia los números, agrega más bloques, prueba qué pasa. La curiosidad es tu motor. La próxima clase aprendes a hacer una \textbf{historia interactiva}: cuento donde el usuario escoge qué pasa.

web:
  conceptos_clave:
    - termino: Scratch
      definicion: |-
        Lenguaje de programación visual creado en el MIT Media Lab (Massachusetts Institute of Technology) en 2007. Gratuito, en scratch.mit.edu. Más de 100 millones de proyectos compartidos. Diseñado para enseñar programación a niños y jóvenes con bloques en lugar de código de texto.
      ejemplo: |-
        Entras a scratch.mit.edu, haces clic en 'Crear', arrastras bloques del panel izquierdo al área central, los encajas como Lego. Tu programa se ejecuta visualmente en el escenario.
      emoji: "🐱"
    - termino: Sprite
      definicion: |-
        Un personaje u objeto en Scratch. Por defecto es el gato amarillo. Se puede cambiar por cualquier personaje de la biblioteca o subir uno propio. Cada sprite tiene sus propios bloques de código.
      ejemplo: |-
        El gato amarillo es el sprite por defecto. Puedes cambiarlo por un perro, un balón, un personaje custom. Cada sprite responde a sus propios bloques.
      emoji: "🦁"
    - termino: Escenario (Stage)
      definicion: |-
        El rectángulo arriba a la derecha de Scratch donde se ejecuta el programa. Tiene coordenadas X (horizontal, -240 a 240) e Y (vertical, -180 a 180), con el centro en (0,0). Es un plano cartesiano.
      ejemplo: |-
        Si haces 'Ir a X=100, Y=50', el sprite se teletransporta a esa coordenada del escenario. (0,0) es el centro. (240, 180) es la esquina superior derecha.
      emoji: "🎬"
    - termino: Bandera verde
      definicion: |-
        El ícono de bandera verde encima del escenario. Al hacer clic en ella, se ejecutan todos los bloques que tienen el bloque de evento 'Al hacer clic en bandera verde'. Es el botón START del programa.
      ejemplo: |-
        Tu programa empieza con un bloque amarillo 'Al hacer clic en bandera verde'. El usuario hace clic en la bandera, y todos los bloques debajo se ejecutan secuencialmente.
      emoji: "🚩"
    - termino: 5 categorías de bloques principales
      definicion: |-
        Las primeras 5 que usarás: Eventos (amarillo - empieza el programa), Movimiento (azul - mueve sprite), Apariencia (morado - cambia visual), Sonido (rosa - reproduce audio), Control (naranja - bucles y condicionales). Hay más pero estas 5 te alcanzan para programas básicos.
      ejemplo: |-
        Tu primer programa usa amarillo (evento bandera), azul (mover), morado (decir), naranja (repetir). 4 colores, 6 bloques, 1 programa funcional.
      emoji: "🎨"

  quiz:
    titulo: "¿Sabes usar Scratch?"
    instrucciones: "5 preguntas para verificar que dominas la interfaz y los bloques básicos."
    preguntas:
      - enunciado: "¿Dónde se descarga Scratch?"
        opciones:
          - "Hay que comprarlo."
          - "Funciona gratis en el navegador en scratch.mit.edu, sin instalación."
          - "Solo en celulares."
          - "No existe, es inventado."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Scratch es gratuito y vive en scratch.mit.edu. Funciona en cualquier computador con navegador. Sin instalar nada. Puedes crear cuenta para guardar tus proyectos.
        feedback_incorrecto: |-
          Scratch en scratch.mit.edu. Gratuito. Navegador, sin instalación. Crear cuenta opcional pero recomendado para guardar tus proyectos.
      - enunciado: "Tu programa NO arranca al hacer clic en bandera verde. ¿Qué falta?"
        opciones:
          - "Nada falta, debe arrancar solo."
          - "Probablemente falta el bloque amarillo 'Al hacer clic en bandera verde' al inicio."
          - "Hay que reiniciar el computador."
          - "Scratch está dañado."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Sin bloque de evento (sombrero amarillo) al inicio, los bloques no se ejecutan cuando haces clic en la bandera. Siempre arranca con un evento.
        feedback_incorrecto: |-
          Falta el bloque amarillo 'Al hacer clic en bandera verde'. Sin él, los bloques no se conectan al botón START (la bandera). Es como olvidar el botón POWER.
      - enunciado: "Quieres que tu sprite repita una acción 10 veces. ¿Qué bloque usas?"
        opciones:
          - "Un bloque de movimiento."
          - "Un bloque naranja 'Repetir 10 veces' (Control)."
          - "10 bloques iguales en fila."
          - "Un bloque de sonido."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Bucle FOR de la S7, ahora en Scratch. Bloque naranja 'Repetir 10 veces'. Adentro pones los bloques que se repetirán. Mucho mejor que 10 bloques iguales.
        feedback_incorrecto: |-
          'Repetir 10 veces' (Control naranja). El bloque abraza otros bloques que se repiten N veces. Es el bucle FOR de la S7 aplicado en Scratch.
      - enunciado: "El sprite por defecto en Scratch es..."
        opciones:
          - "Un dragón."
          - "El gato amarillo."
          - "Un robot."
          - "Mickey Mouse."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El gato amarillo (llamado Scratch Cat) es el sprite por defecto. Puedes cambiarlo por otro de la biblioteca o subir el tuyo propio.
        feedback_incorrecto: |-
          El gato amarillo (Scratch Cat) es el sprite por defecto. Puedes cambiarlo con el botón 'Elegir un sprite' abajo a la derecha. Hay biblioteca grande.
      - enunciado: "¿De qué color es la categoría 'Movimiento' en Scratch?"
        opciones:
          - "Rosa."
          - "Azul."
          - "Verde."
          - "Negro."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Movimiento = azul. Apariencia = morado. Sonido = rosa. Eventos = amarillo. Control = naranja. Cada categoría con su color distintivo.
        feedback_incorrecto: |-
          Movimiento es AZUL. Apariencia morado, Sonido rosa, Eventos amarillo, Control naranja. Los colores ayudan a identificar la categoría sin leer.

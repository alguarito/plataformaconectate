clave: "2-9"
grado: 7
periodo: 2
sesion: 9
completo: true

titulo: "Scratch · narrativa interactiva --- el cuento que el lector escoge"
titulo_portada: |-
  Scratch ·
  narrativa
  interactiva ---
  el cuento
  que escoge
  el lector

producto_final: |-
  Una \textbf{narrativa interactiva en Scratch} de mínimo \textbf{3 escenas}. La historia: \textbf{(a) inicia con un sprite que cuenta el inicio}; \textbf{(b) presenta al lector 2 opciones (preguntar con bloque de Sensores)}; \textbf{(c) según la opción, va a una escena u otra} (usando condicional ``si...entonces''); \textbf{(d) cada escena tiene fondo distinto, sprite cambia disfraz, sonidos opcionales}. Más \textbf{el guion previo escrito en cuaderno} (esquema de la historia + 2 caminos) + \textbf{captura del proyecto guardado}.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural de Cartago narraba cuentos donde los niños decidían.} En la escuelita de la vereda La Plata, los miércoles eran días de \textbf{cuento abierto}. Doña Mercedes empezaba: \emph{``Iba un pescador caminando por el río Cauca cuando vio dos caminos''}. Luego preguntaba: \emph{``¿Va por la izquierda o por la derecha?''}. Los niños gritaban \emph{``¡Izquierda!''}. Doña Mercedes seguía: \emph{``Por la izquierda encontró un pájaro herido. ¿Lo ayuda o sigue?''}. Los niños decidían otra vez. \textbf{Cada cuento era distinto porque el grupo decidía qué pasaba}. Doña Mercedes no improvisaba sin orden: \emph{tenía un mapa mental con 4 o 5 caminos posibles, cada uno con su propio final}. Los niños se sentían \emph{coautores} del cuento. Esa pedagogía interactiva existía antes de los videojuegos y antes de Scratch. \textbf{Hoy haces lo mismo: programas un cuento donde el lector decide los caminos}.

  saber_contemporaneo: |-
    Una \textbf{narrativa interactiva} (o \emph{historia ramificada}) es un cuento donde el lector toma decisiones que cambian el rumbo. En lugar de un único final, hay varios. En lugar de leer pasivo, el lector \textbf{participa}. Esta forma narrativa existe en libros (\emph{``Escoge tu propia aventura''} de los años 80), en videojuegos (Detroit Become Human, Life is Strange), en películas (Black Mirror Bandersnatch). \textbf{En Scratch puedes hacer la tuya} usando: \emph{(a) bloque Sensores ``preguntar [pregunta] y esperar''} (recibe respuesta del lector); \emph{(b) bloque Sensores ``respuesta''} (guarda lo que el lector escribió); \emph{(c) bloque Control ``si... entonces... si no''} (decide rumbo según respuesta); \emph{(d) bloques Apariencia ``cambiar fondo'' y ``cambiar disfraz''} (cambian escena). Hoy combinas variables (S5), condicionales (S6) y Scratch (S8) en una narrativa que tu equipo va a vivir.

  pregunta_puente: |-
    Si pudieras programar una historia donde el lector escoge qué hace el protagonista, ¿\textbf{qué tema escogerías}? ¿Un héroe wayuu? ¿Una niña perdida en el campo? ¿Un astronauta? ¿Un cuento de tu vida?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} la estructura de una narrativa ramificada; (2) sabrás \textbf{aplicar} los bloques Sensores y Apariencia de Scratch; (3) podrás \textbf{evaluar} la coherencia de una historia interactiva; (4) habrás \textbf{creado} tu primera narrativa interactiva.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: planeas tu historia con caminos, aprendes los bloques nuevos, la programas en Scratch, la pruebas con un compañero.
  a_escuta: |-
    Empezamos diseñando el árbol de tu historia en papel.
  a_sistematizacion: |-
    Después aprendes los bloques nuevos: preguntar, respuesta, cambiar fondo.
  a_praxis: |-
    Con todo claro, programas la historia en Scratch.
  a_producto: |-
    El producto es la historia jugable + guion en cuaderno.
  a_evaluacion: |-
    Antes de salir, un compañero juega tu historia y verifica que los 2 caminos funcionan.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué dar al lector el poder de decidir es acto creativo.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Diseña el árbol de tu historia} (12 min · individual). Antes de tocar Scratch, planea la historia en el cuaderno. En una hoja en blanco, dibuja el \textbf{árbol de tu historia} con esta estructura: \emph{(a) Escena inicial:} situación + protagonista. \emph{(b) Pregunta al lector con 2 opciones.} \emph{(c) Escena A si elige opción 1.} \emph{(d) Escena B si elige opción 2.} Cada rama termina con su propio final. Sugerencias de temas: \emph{``Una niña en el campo encuentra dos caminos''}; \emph{``Un astronauta llega a un planeta nuevo''}; \emph{``Un detective tiene 2 pistas para escoger''}; \emph{``Un héroe wayuu enfrenta una decisión''}. Hazlo simple: 3 escenas, 2 caminos, 2 finales.

  checks:
  - Dibujé el árbol de la historia.
  - Tiene escena inicial + pregunta + 2 ramas + 2 finales.
  - Cada rama tiene su propio fondo y acción.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Árbol de mi historia interactiva». \textbf{Formato:} dibujo del árbol con 3+ escenas y 2 caminos. \textbf{Extensión:} 1/2 página. \textbf{Sabes que terminaste cuando} tu árbol es claro y podrías programarlo sin reinventarlo.

sistematizacion:
  intro: |-
    Tu árbol es el guion. Ahora aprendes los \textbf{bloques nuevos de Scratch} que necesitas para implementarlo.

  pilares:
  - |-
    \textbf{Bloque Sensores --- ``Preguntar y esperar''.} Color turquesa. Estructura: \emph{``Preguntar [tu pregunta] y esperar''}. Cuando se ejecuta este bloque, aparece una caja de texto en la parte inferior del escenario donde el lector escribe su respuesta. El programa se pausa hasta que el lector escriba y pulse Enter. Es como una conversación con el usuario.
  - |-
    \textbf{Bloque Sensores --- ``Respuesta''.} También turquesa. Es una variable especial que guarda lo último que el lector escribió en una pregunta. Si preguntaste \emph{``¿Vas a la izquierda o derecha?''} y el lector escribió \emph{``izquierda''}, entonces \texttt{respuesta = izquierda}. \textbf{Cómo se usa en condicional:} \emph{Si respuesta = ``izquierda'' entonces ir a escena A; si no, ir a escena B}.
  - |-
    \textbf{Bloques Apariencia --- ``Cambiar fondo'' y ``Cambiar disfraz''.} Color morado. Para que tu historia tenga diferentes escenas, necesitas cambiar el \textbf{fondo} del escenario (\emph{bosque, ciudad, espacio}). El bloque \emph{``Cambiar fondo a [nombre]''} lo hace. También para que el sprite cambie de aspecto: \emph{``Cambiar disfraz a [nombre]''} (el sprite puede tener varios disfraces: \emph{feliz, triste, asustado}).
  - |-
    \textbf{Estructura típica de una escena.} Cada escena en tu programa sigue este patrón: \emph{(1) Cambiar fondo}, \emph{(2) Cambiar disfraz del sprite}, \emph{(3) Decir texto narrativo}, \emph{(4) Preguntar (si aplica)}, \emph{(5) Decisión con condicional (si aplica)}. Cuando ya conoces este patrón, armar cada escena es \emph{repetir la estructura} con datos distintos. Eso es \emph{patrones} de la S3 aplicados a Scratch.

  anatomia:
    titulo: Bloques nuevos + estructura de escena
    body: |-
      \textbf{Sensores (turquesa):} preguntar y esperar · respuesta. \\[1mm]
      \textbf{Apariencia (morado):} cambiar fondo · cambiar disfraz. \\[1mm]
      \textbf{Estructura de escena:} cambiar fondo · cambiar disfraz · decir narrativa · preguntar · condicional.

  errores_comunes: |-
    \textbf{Errores frecuentes en narrativas interactivas.} (1) \emph{Olvidar el bloque ``preguntar y esperar''} antes de leer la respuesta --- el programa no espera al lector. (2) \emph{Condicional con respuesta exacta} (\emph{``si respuesta = Izquierda''}) pero el lector escribió \emph{``izquierda''} con minúscula --- no coincide. Solución: usar \emph{``mayúscula a minúscula''} o aceptar variaciones. (3) \emph{Olvidar cambiar fondo entre escenas} --- todas las escenas se ven igual. (4) \emph{Solo 1 final feliz} --- las narrativas interactivas son ricas cuando cada decisión tiene consecuencia real. (5) \emph{Demasiado texto para leer} --- los lectores se aburren; mejor narrativa con elecciones rápidas que con monólogos largos.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Bloques nuevos para narrativa». \textbf{Formato:} lista de bloques nuevos con su función + estructura de escena en plantilla. \textbf{Extensión:} 10 líneas. \textbf{Sabes que terminaste cuando} podrías diseñar cualquier escena de Scratch siguiendo el patrón.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu narrativa interactiva en Scratch} (35 min · individual). Aplica tu árbol de la Actividad 1 a Scratch. Es un trabajo más ambicioso que el de la S8 pero usando los mismos componentes + los nuevos bloques de hoy.

  pilares:
  - |-
    \textbf{Paso 1 --- Abre Scratch y guarda con buen nombre.} En \texttt{scratch.mit.edu} crea proyecto nuevo. Si tienes cuenta, renómbralo: \texttt{2026-mi-historia-interactiva-[tu-nombre]}. Guarda. \textbf{Antes de programar, ten tu árbol del cuaderno a la vista}: es tu guion.
  - |-
    \textbf{Paso 2 --- Selecciona o sube fondos para las 3 escenas.} Botón \emph{``Elegir un fondo''} (abajo a la derecha). Escoge 3 fondos distintos (\emph{bosque, río, ciudad}) o sube los tuyos. Los fondos representan las 3 escenas de tu historia. Verifica que aparecen los 3 en la lista de fondos.
  - |-
    \textbf{Paso 3 --- Programa la Escena 1 (inicial).} En el sprite (gato u otro), arma: \emph{(a) Al hacer clic en bandera verde [Eventos].} \emph{(b) Cambiar fondo a [fondo 1] [Apariencia].} \emph{(c) Decir [primer texto narrativo] por 3 segundos [Apariencia].} \emph{(d) Decir [segundo texto narrativo] por 3 segundos.} \emph{(e) Preguntar [pregunta con 2 opciones] y esperar [Sensores]}. Por ejemplo: \emph{``¿Vas a la IZQUIERDA o a la DERECHA? Escribe izquierda o derecha''}.
  - |-
    \textbf{Paso 4 --- Programa el condicional con la respuesta.} Justo después del bloque ``preguntar y esperar'', agrega: \emph{Si [respuesta = ``izquierda''] entonces [llamar a Escena A] si no [llamar a Escena B]}. Aquí ``llamar a Escena A'' significa: cambiar fondo a [fondo 2], cambiar disfraz, decir narrativa de la escena A.
  - |-
    \textbf{Paso 5 --- Programa Escena A y Escena B.} Cada una tiene su propio conjunto de bloques: cambiar fondo → cambiar disfraz → decir texto narrativo → decir final. Si quieres, agrega un sonido al final con bloque ``Tocar sonido''. Cada escena debe terminar la historia (no dejar el lector a medias).
  - |-
    \textbf{Paso 6 --- Prueba con compañero + captura + reflexión.} Pídele a un compañero que juegue tu historia (haga clic en bandera verde, escriba sus respuestas). Verifica que los 2 caminos funcionan. Si algo falla, ajusta. En el cuaderno: captura del proyecto + \emph{``El camino que más me gustó fue \_\_\_. La parte que más me costó programar fue \_\_\_''}. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S9
    items: |-
      \checkbox Tengo el árbol de la historia dibujado en el cuaderno. \\[1mm]
      \checkbox Mi proyecto Scratch tiene 3 fondos distintos. \\[1mm]
      \checkbox La Escena 1 tiene narrativa + pregunta al lector. \\[1mm]
      \checkbox El condicional dirige a Escena A o Escena B según la respuesta. \\[1mm]
      \checkbox Cada escena tiene su propio fondo, narrativa y final. \\[1mm]
      \checkbox Un compañero jugó la historia y los 2 caminos funcionan.

  plantilla_guion: |-
    \textbf{Estructura del programa.} \textit{Escena 1:} cambiar fondo + decir + preguntar. \textit{Condicional:} si respuesta = opción 1 → Escena A; si no → Escena B. \textit{Escena A:} cambiar fondo + cambiar disfraz + decir + final. \textit{Escena B:} igual estructura. \textit{Cuaderno:} árbol + captura + reflexión + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi narrativa interactiva». \textbf{Formato:} árbol de historia + captura del proyecto + reflexión. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} tu historia se puede jugar de inicio a fin por los 2 caminos.

  producto_titulo: Narrativa interactiva en Scratch · 3 escenas · 2 caminos · jugada por compañero
  criterios:
  - Hay 3 escenas con fondos distintos.
  - La escena inicial tiene pregunta al lector.
  - El condicional dirige correctamente según la respuesta.
  - Cada camino llega a un final propio.
  - Un compañero jugó la historia exitosamente por los 2 caminos.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la voz del otro)"
    cita: |-
      ``Dar al otro el poder de decidir es el acto más generoso. Tu historia interactiva hace eso con cada lector.''
    aplicacion: |-
      Cuando \textbf{programas una narrativa donde el lector escoge}, no estás \emph{controlando} la experiencia: \emph{la entregas}. Cada lector vivirá la historia que sus elecciones construyen. Algunos llegarán al final feliz, otros al triste. \emph{Esa generosidad creativa --- soltar el control para que otros participen --- es virtud profunda}. Doña Mercedes la sabía con sus cuentos en la vereda. Tú la practicas en Scratch.
    pregunta_espejo: |-
      Cuando creo algo, ¿lo hago para controlar la experiencia del otro o para invitarlo a participar?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Cada camino de tu historia debe ser coherente con su propia lógica. No abandones al lector a mitad de un rumbo.''
    aplicacion: |-
      Una narrativa interactiva mal hecha \textbf{abandona al lector}: una rama termina abruptamente, otra contradice la anterior, una decisión no tiene consecuencia. \emph{El estoico construye coherencia en cada rama}: si el lector eligió ir a la izquierda, ahí pasa algo real y la rama tiene su propio final completo. \emph{Esa disciplina narrativa es respeto al lector que confió en tu historia}.
    pregunta_espejo: |-
      Mi historia, ¿trata con respeto las decisiones del lector o lo abandona en alguna rama?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la narrativa digital)"
    cita: |-
      ``Las narrativas interactivas son el futuro del cuento. El lector ya no consume: co-crea. Esa es revolución cultural en marcha.''
    aplicacion: |-
      Hace 30 años, los cuentos solo se leían \emph{lineal}: empezabas, leías, terminabas. Hoy las narrativas digitales permiten al lector \textbf{co-crear} la experiencia. \emph{Tú estás del lado correcto de esta revolución}: en grado 7 ya programas narrativas interactivas. En 30 años más, escribir sin interactividad será como hoy escribir a máquina de escribir. \emph{Aprendiste la habilidad temprano}.
    pregunta_espejo: |-
      ¿Estoy aprendiendo las formas narrativas del futuro o me quedo en las del pasado?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, mejora tu narrativa: agrega una tercera opción, un sonido, otra escena. Comparte el enlace con familiares para que la jueguen. La próxima clase es \textbf{la cosecha del periodo}: programa completo en Scratch que integra TODO lo aprendido en P2.

web:
  conceptos_clave:
    - termino: Narrativa interactiva
      definicion: |-
        Historia donde el lector toma decisiones que cambian el rumbo. En lugar de un único final, hay varios. El lector co-crea la experiencia. Existe en libros (Escoge tu propia aventura), videojuegos y películas (Black Mirror Bandersnatch).
      ejemplo: |-
        Tu historia: 'Una niña en el río Cauca encuentra 2 caminos. ¿Va izquierda o derecha?'. Cada elección lleva a una escena distinta con su final propio. El mismo programa, distintas experiencias.
      emoji: "📖"
    - termino: Preguntar y esperar (Scratch)
      definicion: |-
        Bloque turquesa de Sensores. Hace aparecer una caja de texto en el escenario donde el lector escribe respuesta. El programa se pausa hasta que el lector pulse Enter. Es como una conversación interactiva.
      ejemplo: |-
        '¿Vas a la izquierda o derecha? Escribe izquierda o derecha'. El lector escribe, pulsa Enter, el programa continúa con la respuesta.
      emoji: "❓"
    - termino: Variable respuesta
      definicion: |-
        Variable especial de Scratch (bloque turquesa de Sensores) que guarda lo último que el lector escribió. Se usa en condicionales para decidir el rumbo según la entrada del usuario.
      ejemplo: |-
        Si respuesta = 'izquierda' entonces ir a Escena A, si no, ir a Escena B. Cada respuesta del lector dirige el camino del programa.
      emoji: "💬"
    - termino: Cambiar fondo
      definicion: |-
        Bloque morado de Apariencia. Cambia el fondo del escenario a otro fondo previamente cargado. Permite tener distintas escenas en la misma historia.
      ejemplo: |-
        En tu narrativa: Escena 1 fondo 'río Cauca'; Escena A fondo 'bosque'; Escena B fondo 'cueva'. Cada cambio crea sensación de viajar entre lugares.
      emoji: "🌅"
    - termino: Cambiar disfraz
      definicion: |-
        Bloque morado de Apariencia. Cambia la imagen del sprite a otro disfraz previamente cargado. Permite que el sprite cambie de expresión, ropa o aspecto.
      ejemplo: |-
        Un sprite puede tener disfraces: 'feliz', 'triste', 'asustado'. Según el rumbo de la historia, cambia el disfraz para reflejar la emoción del personaje.
      emoji: "🎭"

  quiz:
    titulo: "¿Sabes hacer narrativa interactiva en Scratch?"
    instrucciones: "5 preguntas para verificar que dominas los bloques nuevos y la estructura."
    preguntas:
      - enunciado: "¿Qué bloque usas para preguntar algo al lector y esperar su respuesta?"
        opciones:
          - "Decir [texto] por 2 segundos."
          - "Preguntar [texto] y esperar (turquesa, Sensores)."
          - "Mover 10 pasos."
          - "Cambiar fondo."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. 'Preguntar y esperar' es bloque turquesa de Sensores. Aparece caja de texto en el escenario. El programa se pausa hasta que el lector escriba y presione Enter.
        feedback_incorrecto: |-
          'Preguntar y esperar' (Sensores, turquesa). Único bloque que invita al lector a escribir. 'Decir' solo muestra texto sin esperar respuesta.
      - enunciado: "El lector escribió 'izquierda'. ¿Cómo se llama la variable donde Scratch guarda esa palabra?"
        opciones:
          - "miVariable."
          - "respuesta (variable especial de Sensores)."
          - "entrada."
          - "Lo borra."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La variable 'respuesta' (turquesa, Sensores) guarda automáticamente lo último que el lector escribió en preguntar. La usas en condicionales.
        feedback_incorrecto: |-
          La variable se llama 'respuesta'. Scratch la guarda automáticamente después de 'preguntar y esperar'. La usas en condicionales: Si respuesta = ...
      - enunciado: "Tu historia tiene 3 escenas con fondos distintos. ¿Qué bloque cambias entre escenas?"
        opciones:
          - "Mover 10 pasos."
          - "Cambiar fondo (morado, Apariencia)."
          - "Esperar 1 segundo."
          - "Tocar sonido."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. 'Cambiar fondo a [nombre]' (Apariencia, morado). Cambia el fondo del escenario y crea sensación de cambio de escena.
        feedback_incorrecto: |-
          'Cambiar fondo' (Apariencia morado). Cargas varios fondos en el escenario y cambias entre ellos según la escena de la historia.
      - enunciado: "La condición 'Si respuesta = izquierda' no se cumple cuando el lector escribió 'Izquierda' con mayúscula. ¿Por qué?"
        opciones:
          - "Scratch está dañado."
          - "Las comparaciones son sensibles a mayúsculas. 'izquierda' (todo minúscula) es distinto a 'Izquierda' (con I mayúscula)."
          - "Es magia."
          - "El programa hizo trampa."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Comparaciones case-sensitive: 'izquierda' ≠ 'Izquierda'. Para evitar problemas, indica al lector cómo escribir o convierte todo a minúsculas con un operador.
        feedback_incorrecto: |-
          Sensibilidad a mayúsculas: 'izquierda' (minúscula) NO es igual a 'Izquierda' (con mayúscula). Indica el formato esperado o convierte la respuesta a minúsculas.
      - enunciado: "Para que tu narrativa interactiva sea profesional, ¿qué debe pasar después de cada decisión?"
        opciones:
          - "Que el lector llegue al mismo final."
          - "Que cada rama tenga su propia escena y final coherente. La decisión debe tener consecuencia real."
          - "Nada, todo igual."
          - "Que termine con bandera verde."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Cada decisión = consecuencia real. Cada rama con su propio final. Eso respeta al lector y hace la narrativa interesante. Si todas las ramas llevan al mismo final, no es interactiva.
        feedback_incorrecto: |-
          Cada rama con su propia escena y final coherente. Si todas terminan igual, la decisión no importa. Lo interactivo es que cada elección tenga consecuencia real.

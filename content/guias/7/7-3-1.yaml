clave: "3-1"
grado: 7
periodo: 3
sesion: 1
completo: true

titulo: "Apertura periodo 3 --- la IA como el nuevo consejero del barrio"
titulo_portada: |-
  Apertura
  periodo 3 ---
  la IA
  como nuevo
  consejero

producto_final: |-
  Tu \textbf{cuaderno listo para el periodo 3 de grado 7}: \textbf{índice del P3} con las 10 sesiones + \textbf{5 acuerdos del uso responsable de IA} firmados (verificar, no compartir datos personales, citar la fuente, pensar antes de copiar, mantener tu voz propia) + \textbf{5 preguntas-radar} sobre IA + \textbf{mini-investigación}: \emph{``¿Quién era el consejero del barrio en la generación de mis abuelos? ¿Qué hacía? ¿Qué consejos daba?''} (pregunta a familiares mayores).

apertura:
  saber_ancestral: |-
    \textbf{En el barrio de Cartago, cada cuadra tenía su consejero.} No era un cargo formal --- era \emph{la persona mayor a quien todos acudían cuando había una decisión difícil}. Doña Mercedes era consejera para temas de niños y educación. Don Lucho el relojero era consejero para temas técnicos. Doña Esperanza la partera era consejera para temas de salud familiar. \textbf{¿Por qué la gente confiaba en ellos?} Porque tenían \emph{experiencia} (habían visto muchas vidas), \emph{paciencia} (escuchaban antes de aconsejar), \emph{honestidad} (no fingían saber lo que no sabían), \emph{discreción} (lo que se les contaba no se difundía). La gente preguntaba; el consejero respondía; la gente \textbf{verificaba con su propio criterio} y decidía. \emph{El consejero no decidía por ti; te ayudaba a decidir mejor}. Hoy hay un nuevo tipo de consejero al que millones de personas acuden cada día: la \textbf{Inteligencia Artificial} (ChatGPT, Claude, Gemini). Te puede aconsejar sobre cualquier tema en segundos. Pero con la IA pasa lo mismo que con doña Mercedes: \emph{si preguntas bien, verificas con criterio y mantienes tu voz, te sirve. Si copias sin pensar, te perjudica}.

  saber_contemporaneo: |-
    Este periodo se llama \textbf{Inteligencia Artificial}. \emph{Estás aprendiendo IA en el momento histórico} en que esta tecnología está cambiando el mundo. Tu generación es la primera que crece con IA conversacional accesible (ChatGPT salió a fines de 2022). En 10 sesiones vas a recorrer: \textbf{(S1) Hoy: Apertura --- la IA como consejero.} \textbf{(S2) ¿Qué es la IA?} \textbf{(S3) Tipos de IA.} \textbf{(S4) Cómo aprende una IA (datos y sesgo).} \textbf{(S5) Modelos de lenguaje (ChatGPT, Claude, Gemini).} \textbf{(S6) Prompting básico.} \textbf{(S7) Prompting avanzado.} \textbf{(S8) Ética de la IA.} \textbf{(S9) IA y mis tareas.} \textbf{(S10) Cosecha: proyecto con IA responsable.} \textbf{Aprenderás a usar IA con criterio:} preguntar bien, verificar respuestas, citar cuando uses ideas, mantener tu voz propia. \emph{No es tema de futuro: es tema de hoy. Las decisiones que tomes con IA en grado 7 forman el hábito que llevarás al resto de tu vida}.

  pregunta_puente: |-
    Si tu mamá te pregunta \emph{``¿qué es ChatGPT?''}, ¿\textbf{podrías explicárselo} con tus palabras? ¿Y si te preguntara si es buena idea que ella lo use para escribir un correo profesional?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} la ruta del periodo 3; (2) sabrás \textbf{explicar} por qué la IA es como un consejero moderno; (3) podrás \textbf{aplicar} los 5 acuerdos del uso responsable; (4) habrás \textbf{creado} tu cuaderno P3 + investigación sobre consejeros tradicionales.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: descubres la analogía consejero/IA, conoces la ruta del periodo, firmas los acuerdos, planeas investigación.
  a_escuta: |-
    Empezamos imaginando la conversación entre tu abuela y un consejero del barrio.
  a_sistematizacion: |-
    Después aprendes la ruta del periodo + 5 acuerdos del uso responsable de IA.
  a_praxis: |-
    Con todo claro, dejas el cuaderno listo + 5 preguntas + investigación planificada.
  a_producto: |-
    El producto es el cuaderno P3 + 5 acuerdos firmados + investigación.
  a_evaluacion: |-
    Antes de salir, verifica que tu cuaderno tiene los 5 elementos del periodo.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué pensar bien sobre la IA hoy decide quién serás en 10 años.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- La conversación de tu abuela} (12 min · individual). Cierra los ojos e imagina esta escena: \emph{tu abuela, hace 30 años, tiene una decisión difícil --- ¿vende la finca o no la vende? Va donde el consejero del barrio (don Lucho, doña Mercedes, alguien parecido). Le cuenta el dilema. El consejero escucha, hace preguntas, le da una opinión, le advierte qué cosas considerar}. \textbf{En el cuaderno responde:} \emph{(1) ¿Qué cualidades tenía el consejero que hacía que la abuela confiara en él?} \emph{(2) ¿La abuela seguía exactamente el consejo o lo combinaba con su propio criterio?} \emph{(3) ¿Qué pasaba si el consejero se equivocaba? (¿lo culpaba la abuela?)}. \emph{(4) ¿Por qué la abuela buscaba consejo en lugar de decidir sola?}.

  checks:
  - Imaginé la escena con calma.
  - Respondí las 4 preguntas con honestidad.
  - Pensé en las cualidades del consejero antiguo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- El consejero del barrio». \textbf{Formato:} 4 respuestas cortas. \textbf{Extensión:} 5-6 líneas. \textbf{Sabes que terminaste cuando} reconoces que el consejero es modelo + tú decides.

sistematizacion:
  intro: |-
    Las cualidades del consejero (experiencia, paciencia, honestidad, discreción) son \textbf{exactamente las que esperarías de una IA ideal}. Veamos en qué cumple y en qué no. Después aprendes la ruta + 5 acuerdos.

  pilares:
  - |-
    \textbf{¿Cómo se parece la IA al consejero del barrio?} \textbf{(a) Experiencia:} la IA aprendió de millones de textos (libros, artículos, foros). En cierto sentido, \emph{ha visto muchas vidas} (las que están en sus datos). \textbf{(b) Paciencia:} no se cansa de responder. Le preguntas 100 veces lo mismo y responde 100 veces. \textbf{(c) Discreción:} \emph{depende mucho del servicio}. Algunos guardan tus conversaciones; otros no. La discreción de la IA NO es como la de un humano: hay servidores de por medio.
  - |-
    \textbf{¿En qué NO se parece al consejero del barrio?} \textbf{(a) Honestidad:} la IA \emph{a veces inventa cosas con seguridad} (se llama \emph{``alucinación''}). Don Lucho diría \emph{``no sé''}; la IA puede inventar una respuesta plausible que es falsa. \textbf{(b) Conocimiento de contexto:} el consejero conocía a tu familia, tu barrio, tu historia. La IA no conoce nada de eso. Le falta el contexto humano. \textbf{(c) Responsabilidad:} si el consejero del barrio te aconseja mal, la comunidad lo nota y su reputación cae. \emph{La IA no tiene reputación social que perder}. Te aconseja mal y no le pasa nada.
  - |-
    \textbf{La ruta del P3 --- 10 sesiones.} \emph{S1: Hoy: Apertura.} \emph{S2: ¿Qué es la IA?} \emph{S3: Tipos de IA.} \emph{S4: Cómo aprende una IA (datos y sesgo).} \emph{S5: Modelos de lenguaje.} \emph{S6: Prompting básico.} \emph{S7: Prompting avanzado.} \emph{S8: Ética.} \emph{S9: IA en mis tareas.} \emph{S10: Cosecha.} El periodo se organiza en 3 bloques: \emph{conocer la IA (S2-S5), usarla bien (S6-S7), usarla con ética (S8-S10)}.
  - |-
    \textbf{Los 5 acuerdos del uso responsable de IA.} (1) \textbf{Verifica siempre.} La IA puede equivocarse o inventar. Lo que te diga, lo verificas en al menos 1 fuente humana o de criterio. (2) \textbf{No compartas datos personales sensibles.} Tu dirección, tu cédula, tu contraseña, info íntima. Una vez que escribes algo en el chat, no sabes dónde queda. (3) \textbf{Cita la fuente cuando uses ideas.} Si la IA te ayudó a desarrollar una idea, dilo en tu trabajo (\emph{``con apoyo de Claude AI''}). Es honestidad académica. (4) \textbf{Piensa antes de copiar.} La IA es asistente, no reemplazo. Si copias sin entender, te dañas tú: no aprendes, no creces, te haces dependiente. (5) \textbf{Mantén tu voz propia.} El estilo, la perspectiva, las decisiones siguen siendo tuyas. La IA puede ayudar pero la voz final es tuya.

  anatomia:
    titulo: Ruta P3 + 5 acuerdos
    body: |-
      \textbf{Ruta P3:} \\[1mm]
      Bloque 1 (S2-S5): conocer la IA. \\[1mm]
      Bloque 2 (S6-S7): usarla bien con prompting. \\[1mm]
      Bloque 3 (S8-S10): usarla con ética + cosecha. \\[1mm]
      \textbf{5 acuerdos:} verificar · no datos personales · citar · pensar antes de copiar · voz propia.

  errores_comunes: |-
    \textbf{Mitos sobre la IA que escucharás.} (1) \emph{``La IA siempre dice la verdad''} --- Falso. Puede inventar con seguridad (alucinación). Verifica. (2) \emph{``Usar IA es hacer trampa''} --- Depende. Usarla como asistente con atribución no es trampa; copiar sin entender sí. (3) \emph{``La IA va a reemplazar a los humanos''} --- Falso en muchos sentidos. Algunas tareas sí; otras no. La IA aumenta humanos, no los reemplaza completos. (4) \emph{``La IA solo es para programadores''} --- Falso. Hoy cualquier persona la usa: escritores, profesores, médicos, estudiantes. (5) \emph{``Lo que escriba a la IA queda solo conmigo''} --- Falso. Tus conversaciones quedan en servidores. No compartas info sensible.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- IA como consejero + ruta P3 + 5 acuerdos». \textbf{Formato:} bloque A con tabla comparativa de \emph{consejero del barrio} vs \emph{IA} (3 similitudes + 3 diferencias). Bloque B con ruta del P3 (10 sesiones en 3 bloques). Bloque C con 5 acuerdos firmados. \textbf{Extensión:} 15 líneas. \textbf{Sabes que terminaste cuando} podrías explicarle a tu mamá qué es la IA usando la analogía del consejero.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Cuaderno P3 + 5 preguntas + investigación del consejero} (28 min · individual + tarea en casa). Vas a dejar el cuaderno listo + plantear preguntas + investigar.

  pilares:
  - |-
    \textbf{Paso 1 --- Índice del P3 + encabezado fijo.} En tu cuaderno de Tecnología, abre una nueva página. Título: \textbf{``Periodo 3 --- Inteligencia Artificial''}. Debajo, índice de 10 sesiones del P3 (de la ruta de la sistematización).
  - |-
    \textbf{Paso 2 --- 5 acuerdos firmados.} En la siguiente hoja, reproduce los 5 acuerdos del uso responsable de IA. Al lado de cada uno, palomita ✓ si te comprometes. Si dudas con alguno, conversa con el profe.
  - |-
    \textbf{Paso 3 --- 5 preguntas-radar.} Lista numerada de 5 preguntas tuyas sobre IA. Sugerencias para inspirarte: \emph{``¿Cómo funciona realmente ChatGPT por dentro?''}, \emph{``¿Es seguro usar IA para tareas del colegio?''}, \emph{``¿La IA va a quitarme el trabajo cuando sea adulto?''}, \emph{``¿Cómo se cuáles son las mejores IAs?''}, \emph{``¿Qué es prompting?''}.
  - |-
    \textbf{Paso 4 --- Mini-investigación del consejero.} En la siguiente hoja, subtítulo: \textbf{``Mini-investigación: el consejero del barrio''}. Esta tarea la haces en casa: pregunta a una persona mayor de tu familia (mamá, papá, abuelos, tíos): \emph{``¿Quién era el consejero del barrio en su tiempo? ¿Qué tipo de consejos daba?''}. Apunta mínimo \textbf{5 datos concretos}: nombre del consejero, barrio o vereda, tipo de consejos, qué cualidades tenía, una historia concreta.
  - |-
    \textbf{Paso 5 --- Sesión 1 con encabezado fijo.} En el cuaderno principal escribe el encabezado de la sesión 1: \emph{``Guía: 7° · Periodo 3 · Guía 1 --- Apertura. Fecha: \_\_/\_\_/2026''}. Anota qué hiciste en las 3 actividades.
  - |-
    \textbf{Paso 6 --- Firma y cierre.} Al final firma con nombre completo y fecha. La próxima clase entras al primer concepto técnico: \emph{¿qué es la IA?}.

  checklist:
    titulo: Antes de cerrar la S1 del P3
    items: |-
      \checkbox El índice del P3 está con 10 sesiones. \\[1mm]
      \checkbox Los 5 acuerdos están firmados. \\[1mm]
      \checkbox Tengo 5 preguntas-radar reales. \\[1mm]
      \checkbox Tengo plan para investigar al consejero tradicional. \\[1mm]
      \checkbox La sesión 1 tiene encabezado y registro. \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Hoja 1:} título P3 + índice de 10 sesiones. \textit{Hoja 2:} 5 acuerdos firmados + 5 preguntas. \textit{Hoja 3:} mini-investigación del consejero (5+ datos). \textit{Cuaderno principal:} S1 con encabezado fijo.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Cuaderno inaugural G7-P3». \textbf{Formato:} 3 hojas iniciales + S1 registrada. \textbf{Extensión:} 3 hojas + sesión. \textbf{Sabes que terminaste cuando} tu cuaderno está listo para empezar la S2.

  producto_titulo: Cuaderno P3 inaugural + 5 acuerdos + 5 preguntas + investigación del consejero
  criterios:
  - Índice del P3 con 10 sesiones.
  - 5 acuerdos firmados con palomita.
  - 5 preguntas-radar personales sobre IA.
  - Plan claro de mini-investigación.
  - S1 con encabezado fijo y registro.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de los nuevos saberes en la comunidad)"
    cita: |-
      ``El consejero del barrio sigue siendo necesario, aunque cambie de forma. Hoy es humano + IA juntos.''
    aplicacion: |-
      \textbf{El consejero del barrio no desaparece: cambia de forma}. Tu generación va a usar IA como herramienta de consejo, sí, pero \emph{el consejero humano sigue valiendo}: el profe, el papá, la abuela. \emph{La IA no reemplaza la sabiduría humana --- la complementa}. Doña Mercedes seguiría siendo útil aunque existiera ChatGPT. \emph{Lo importante es no perder el consejero humano por usar el digital}.
    pregunta_espejo: |-
      ¿A quién considero mi ``consejero del barrio'' moderno? ¿Cómo combino consejo humano + IA con criterio?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``El que pide consejo no es débil; el que confía sin verificar sí lo es. La IA es consejo nuevo: trátalo con la sabiduría antigua.''
    aplicacion: |-
      Marco Aurelio \emph{pedía consejo todos los días} a su Senado, a sus asesores, a sus generales. \textbf{Pero después él decidía}. No delegaba la decisión final. La IA es un consejero nuevo en tu lista. Trátalo con la misma sabiduría: \emph{escucha + verifica + decide tú}. Esa disciplina antigua es lo que distingue a quien usa IA con criterio de quien se convierte en su esclavo.
    pregunta_espejo: |-
      Cuando uso IA, ¿estoy decidiendo yo después de escuchar, o estoy delegando mi decisión a ella?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la era de la IA)"
    cita: |-
      ``La generación que aprende IA en colegio decide cómo será la humanidad en 30 años. No es exageración: es realidad.''
    aplicacion: |-
      \textbf{Tu generación es la primera que crece con IA conversacional accesible}. ChatGPT salió a fines de 2022. Tú entras a grado 7 en 2026 con la IA ya como parte del paisaje. \emph{Las decisiones que tomas hoy sobre cómo usar IA forman los hábitos que cargarás 50 años}. Por eso este periodo importa más que cualquier otro: \emph{no es solo ``aprender a usar la app''; es decidir qué tipo de adulto digital vas a ser}.
    pregunta_espejo: |-
      Si mi yo de 30 años pudiera verme hoy usando IA, ¿estaría orgulloso de los hábitos que estoy formando?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, termina la mini-investigación del consejero (pregunta en casa). La próxima clase es S2: \emph{¿Qué es la IA?}. Vas a aprender la definición técnica, la breve historia y 10 casos cotidianos donde ya está cambiando tu vida sin que lo notes.

web:
  conceptos_clave:
    - termino: Inteligencia Artificial (IA)
      definicion: |-
        Tecnología que simula procesos mentales humanos (aprender, razonar, decidir) usando computadores. No es 'inteligencia' como la nuestra; es procesamiento de datos a gran escala. Está en buscadores, recomendaciones, traducciones, asistentes virtuales.
      ejemplo: |-
        Cuando Google completa tu búsqueda al escribir, cuando TikTok te recomienda un video, cuando ChatGPT te responde una pregunta: todos son ejemplos de IA en acción cotidiana.
      emoji: "🤖"
    - termino: Consejero del barrio (analogía)
      definicion: |-
        Persona mayor de la comunidad a quien se acudía para pedir consejo en decisiones difíciles. Tenía experiencia, paciencia, honestidad, discreción. Hoy la IA cumple algunos de esos roles, aunque con limitaciones distintas.
      ejemplo: |-
        Doña Mercedes era consejera para educación, don Lucho para temas técnicos, doña Esperanza para salud. Hoy ChatGPT, Claude o un médico humano cumplen roles parecidos pero distintos.
      emoji: "👵"
    - termino: 5 acuerdos del uso responsable
      definicion: |-
        Las 5 normas básicas para usar IA con criterio: (1) verificar siempre, (2) no compartir datos personales, (3) citar la fuente, (4) pensar antes de copiar, (5) mantener voz propia. Sin estos acuerdos, la IA puede perjudicar más que ayudar.
      ejemplo: |-
        Si ChatGPT te ayuda con una tarea, lo citas en tu trabajo ('con apoyo de ChatGPT, verificado en Wikipedia'). Eso es responsable. Copiar sin entender ni citar es lo contrario.
      emoji: "🤝"
    - termino: Alucinación de la IA
      definicion: |-
        Cuando la IA inventa información con seguridad pero falsa. Por ejemplo, da una fecha incorrecta, cita un libro que no existe, atribuye una idea a una persona equivocada. Por eso el acuerdo 1 (verificar) es fundamental.
      ejemplo: |-
        Le preguntas a ChatGPT '¿qué año nació Bolívar?'. Te responde '1783' (correcto). Pero a veces inventa fechas o eventos. Siempre verifica en otra fuente confiable antes de usar la información.
      emoji: "💭"
    - termino: ChatGPT, Claude, Gemini
      definicion: |-
        Los 3 modelos de lenguaje más conocidos en 2026. ChatGPT (OpenAI), Claude (Anthropic), Gemini (Google). Funcionan parecido: les escribes una pregunta, te dan una respuesta en lenguaje natural. Tienen versiones gratuitas accesibles.
      ejemplo: |-
        Para resumir un texto largo, puedes usar cualquiera de los 3. Sus respuestas son similares pero con sutilezas distintas. La elección depende de gustos personales y casos de uso.
      emoji: "💻"

  quiz:
    titulo: "¿Llegaste bien al periodo 3 de grado 7?"
    instrucciones: "5 preguntas para verificar que entiendes la analogía + los 5 acuerdos."
    preguntas:
      - enunciado: "¿En qué se parece la IA al consejero del barrio?"
        opciones:
          - "En nada, son totalmente distintos."
          - "En que ambos pueden dar opiniones útiles si sabes preguntar bien."
          - "En que la IA conoce a tu familia."
          - "En que el consejero usa internet."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Ambos pueden aconsejar bien si sabes preguntar. La diferencia: el consejero te conoce, la IA no. Por eso verificas siempre.
        feedback_incorrecto: |-
          Ambos aconsejan si preguntas bien. La diferencia clave: el consejero te conoce y tiene reputación; la IA no. Verifica siempre.
      - enunciado: "Le preguntas a ChatGPT algo y te da una respuesta con mucha seguridad. ¿Es 100% confiable?"
        opciones:
          - "Sí, si suena seguro es verdadero."
          - "Sí, ChatGPT es perfecto."
          - "Solo si paga premium."
          - "No. La IA puede 'alucinar' (inventar info con seguridad). Verifica en otra fuente confiable."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Las IAs pueden inventar con seguridad (alucinación). Por eso el acuerdo 1 es VERIFICAR siempre en otra fuente confiable.
        feedback_incorrecto: |-
          La IA puede 'alucinar' (inventar con seguridad). Verifica siempre. Acuerdo 1 del uso responsable: verificar antes de creer.
      - enunciado: "¿Cuál de estos NO es un acuerdo del uso responsable de IA?"
        opciones:
          - "Verificar siempre."
          - "No compartir datos personales."
          - "Compartir todo lo que ChatGPT diga en tus redes sociales."
          - "Mantener tu voz propia."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Compartir todo sin criterio NO es responsable. Los acuerdos son: verificar, no compartir datos personales, citar, pensar antes de copiar, voz propia.
        feedback_incorrecto: |-
          Compartir sin criterio no es responsable. Los 5 acuerdos: verificar, no datos personales, citar, pensar antes de copiar, voz propia.
      - enunciado: "¿Cuándo salió ChatGPT por primera vez al público?"
        opciones:
          - "A fines de 2022 (hace pocos años)."
          - "Hace 50 años."
          - "Hace 20 años."
          - "El año pasado no existía."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. ChatGPT salió a fines de 2022. Tu generación es la primera que crece con IA conversacional masiva. Eso te coloca en momento histórico clave.
        feedback_incorrecto: |-
          A fines de 2022. Tu generación es la primera que crece con IA conversacional masiva. Los hábitos que formes hoy te acompañan décadas.
      - enunciado: "Tu mamá usa IA para escribir un correo profesional. ¿Está bien?"
        opciones:
          - "Está mal, es trampa."
          - "Solo si paga premium."
          - "Está bien si verifica el resultado, mantiene su voz y no comparte datos personales."
          - "Solo si es para una empresa grande."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Usar IA como asistente está bien si se aplican los acuerdos: verificar, mantener voz propia, no datos sensibles. No es trampa; es asistente moderno.
        feedback_incorrecto: |-
          Está bien con criterio: verificar resultado, mantener voz propia, no datos sensibles. La IA como asistente es legítima cuando se usa con responsabilidad.

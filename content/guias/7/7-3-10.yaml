clave: "3-10"
grado: 7
periodo: 3
sesion: 10
completo: true

titulo: "Cosecha del periodo 3 --- mi proyecto con IA responsable"
titulo_portada: |-
  Cosecha
  del periodo 3 ---
  mi proyecto
  con IA
  responsable

producto_final: |-
  Un \textbf{proyecto completo} que use IA con criterio: \textbf{(a) tema escogido} (informativo, no opinión); \textbf{(b) documento final} (Word o presentación) con tu voz dominante, IA como asistente declarado; \textbf{(c) anexo de transparencia}: 3-5 prompts CTRF/avanzados usados + capturas de las respuestas + reflexión sobre cómo verificaste/adaptaste; \textbf{(d) sustentación oral} de 5 minutos al profe; \textbf{(e) autoevaluación} con rúbrica de 10 criterios y \textbf{cierre del año}: ¿qué tipo de estudiante de IA soy ahora vs hace 10 sesiones?.

apertura:
  saber_ancestral: |-
    \textbf{En la vereda La Plata de Cartago, cuando un aprendiz del taller de don Lucho terminaba su primer reloj reparado, lo presentaba a la comunidad.} No era trámite: era \emph{rito de paso}. El aprendiz mostraba el reloj funcionando, explicaba qué había encontrado averiado, qué herramientas usó, qué aprendió. Los vecinos hacían preguntas: \emph{``¿Por qué cambiaste esta pieza y no aquella? ¿Qué pasaría si fallara otra vez?''}. El aprendiz respondía. Si lo hacía bien, \textbf{la comunidad lo reconocía como artesano formado}. Esa transición pública era importante: \emph{no basta saber hacer; hay que mostrar el oficio}. Hoy es tu cosecha del periodo 3 y de todo el año de Tecnología. Hace 30 sesiones no sabías programar en Scratch, no entendías la nube, no sabías qué era un algoritmo, no habías hablado con una IA. \emph{Hoy entregas un proyecto que demuestra todo}. La comunidad académica (tu profe, tus compañeros) será testigo del oficio que ahora tienes.

  saber_contemporaneo: |-
    Esta es la \textbf{cosecha del periodo 3 y del año académico de grado 7°}. No es contenido nuevo: es \emph{integración}. Tu proyecto debe demostrar que sabes usar IA con criterio aplicando todo lo aprendido. \textbf{Las 5 dimensiones que debe tener:} \textbf{(1) Tema sólido:} algo informativo (no opinión personal), que TÚ escojas. Ejemplos: \emph{``Los volcanes del Eje Cafetero''}, \emph{``Historia del fútbol colombiano''}, \emph{``La cocina tradicional del Valle''}, \emph{``El cambio climático en Colombia''}. \textbf{(2) Voz tuya dominante:} no es que la IA escriba todo; tu voz, tus selecciones, tu organización dominan. \textbf{(3) IA como asistente declarado:} usaste IA y lo dices abiertamente, con plantilla de atribución. \textbf{(4) Anexo de transparencia:} muestras los prompts que usaste, las respuestas que recibiste, cómo verificaste, cómo adaptaste. \textbf{(5) Reflexión ética}: cómo cumpliste tus 5 acuerdos del uso responsable. \textbf{Es el proyecto más ambicioso del año --- y el más formativo}.

  pregunta_puente: |-
    Hace 30 sesiones (al iniciar grado 7°) \emph{no sabías nada de IA}. Hoy entregas un proyecto donde usas IA con criterio ético. \textbf{¿Cómo te sientes con ese crecimiento}?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{integrar} todas las habilidades del periodo 3 en un proyecto; (2) sabrás \textbf{aplicar} prompting + ética + atribución en un trabajo real; (3) podrás \textbf{evaluar} tu propio uso de IA con rúbrica; (4) habrás \textbf{creado} tu proyecto + sustentado al profe.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: defines el tema, produces el proyecto con IA responsable, autoevalúas con rúbrica, sustentas.
  a_escuta: |-
    Empezamos definiendo el tema con las 4 técnicas del pensamiento computacional (de P2).
  a_sistematizacion: |-
    Después aprendes la rúbrica de 10 criterios + estructura del proyecto.
  a_praxis: |-
    Con todo claro, produces el proyecto + anexo de transparencia + sustentación.
  a_producto: |-
    El producto es proyecto + anexo + reflexión + sustentación al profe.
  a_evaluacion: |-
    Antes de sustentar, autoevalúa con la rúbrica de 10 criterios.
  a_triangulo: |-
    Cerramos con 3 voces sobre el cierre del año y el camino hacia 8° grado.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Define el tema con las 4 técnicas} (12 min · individual). Aplica las 4 técnicas del pensamiento computacional (P2·S3) a definir tu proyecto. En el cuaderno responde: \emph{(1) Mi tema escogido (1 frase clara, informativo)}. \emph{(2) DESCOMPOSICIÓN: ¿en qué 4-5 sub-temas se divide?}. \emph{(3) PATRONES: ¿qué sub-temas son similares?}. \emph{(4) ABSTRACCIÓN: ¿qué detalles dejo afuera por ahora?}. \emph{(5) ALGORITMO: orden general (entrada-proceso-salida)?}.

  checks:
  - Definí tema concreto e informativo.
  - Apliqué las 4 técnicas del pensamiento computacional.
  - Tengo plan claro antes de empezar a producir.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Plan de mi proyecto P3». \textbf{Formato:} 5 respuestas estructuradas. \textbf{Extensión:} 1/2 página. \textbf{Sabes que terminaste cuando} tu plan está claro antes de tocar la IA.

sistematizacion:
  intro: |-
    Ahora conoce la rúbrica con la que se evaluará tu proyecto + estructura concreta del entregable.

  pilares:
  - |-
    \textbf{Los 10 criterios de la rúbrica (cada uno 1-5 puntos, total 50).} \textbf{(1) Plan inicial} con las 4 técnicas aplicadas. \textbf{(2) Tema sólido} (informativo, acotado). \textbf{(3) Voz propia dominante} (tu organización, tus selecciones, tu cierre). \textbf{(4) IA usada con criterio} (asistente, no reemplazo). \textbf{(5) Atribución correcta} (plantilla aplicada). \textbf{(6) Anexo de transparencia} (prompts + respuestas + verificación). \textbf{(7) 3+ fuentes citadas} (no solo IA; también web/libros). \textbf{(8) Cumplimiento de los 5 acuerdos} (verificar, no datos personales, citar, pensar, voz propia). \textbf{(9) Sustentación clara} de 5 minutos. \textbf{(10) Reflexión final} sobre crecimiento del año.
  - |-
    \textbf{Estructura del entregable.} (a) \textbf{Documento principal} en Word (o presentación en PowerPoint): 2-3 páginas, formato profesional. (b) \textbf{Anexo de transparencia}: hoja aparte con 3-5 prompts CTRF/avanzados usados + capturas de respuestas + 1 línea de cómo verificaste o adaptaste cada uno. (c) \textbf{Reflexión final}: 1 párrafo sobre tu crecimiento. (d) \textbf{Sustentación oral}: 5 minutos donde muestras el proyecto, explicas decisiones, atribución, ética. El profe puede preguntar.
  - |-
    \textbf{3 cosas que diferencian un proyecto básico de uno excelente.} (1) \emph{Originalidad:} tema único + voz propia + selección personal del ángulo. (2) \emph{Coherencia ética:} no solo se usaron las herramientas, se aplicó la ética con criterio. (3) \emph{Honestidad transparente:} el anexo muestra abiertamente cómo se usó la IA. Un profesor experimentado lo notará y lo valorará.
  - |-
    \textbf{4 errores típicos en la cosecha P3.} (1) \emph{Querer hacer el proyecto sin IA para evitar el debate ético} --- pero la S10 te pide usarla con criterio. (2) \emph{Pegar la respuesta de ChatGPT sin verificar} --- las alucinaciones se cuelan. (3) \emph{Olvidar la atribución} --- viola el acuerdo 3. (4) \emph{No reflejar tu voz} --- todo suena a IA, sin tu personalidad. La cosecha exige tu voz dominante.

  anatomia:
    titulo: 10 criterios + estructura del entregable
    body: |-
      \textbf{10 criterios:} plan · tema sólido · voz propia · IA con criterio · atribución · anexo transparencia · fuentes · 5 acuerdos · sustentación · reflexión. \\[1mm]
      \textbf{Entregable:} documento principal + anexo transparencia + reflexión + sustentación.

  errores_comunes: |-
    \textbf{Mitos sobre la cosecha P3.} (1) \emph{``Si no uso IA, evito problemas''} --- Falso. La cosecha pide usarla con criterio, no evadirla. (2) \emph{``Si la voz de la IA es buena, da igual cuál es la mía''} --- Falso. El profe quiere tu voz, no la de ChatGPT. (3) \emph{``El anexo es opcional''} --- No. Es 10\% de la rúbrica. (4) \emph{``La sustentación es lo de menos''} --- Falso. Es 10\% directo. (5) \emph{``Si entrego ya, no necesito reflexión''} --- Falso. La reflexión cierra el año académico.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Rúbrica + estructura del entregable». \textbf{Formato:} lista de 10 criterios + esquema de estructura del entregable. \textbf{Extensión:} 15 líneas. \textbf{Sabes que terminaste cuando} puedes autoevaluar cualquier proyecto con la rúbrica.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Proyecto completo con IA responsable} (1.5 sesiones de 90 min + trabajo asíncrono durante la semana). Vas a producir el proyecto cosecha. Es la culminación del año académico de grado 7°.

  pilares:
  - |-
    \textbf{Paso 1 --- Documento principal (40-50 min).} En Word (o Docs) crea un documento con tu tema. Estructura: \emph{introducción (1 párrafo), desarrollo (4-5 párrafos con tus subtemas), conclusión (1 párrafo)}. Total 2-3 páginas con formato profesional (negrita en ideas clave, sangría, fuentes citadas al pie). \textbf{Importante: tu voz domina.} Si usas IA para ayudar, adáptala a tu manera de escribir, tus ejemplos, tu perspectiva colombiana. Guarda como \texttt{2026-cosecha-p3-[tu-tema]-[tu-nombre]}.
  - |-
    \textbf{Paso 2 --- Anexo de transparencia (15-20 min).} Crea un documento aparte (puede ser Word, puede ser parte del mismo): \textbf{``Anexo --- Cómo usé IA''}. Para cada uso de IA en el proyecto, escribe: \emph{(a) Prompt usado completo (CTRF + técnicas avanzadas)}, \emph{(b) Resumen de la respuesta recibida (3-4 líneas)}, \emph{(c) Cómo verifiqué o adapté esa respuesta para incluirla en mi proyecto}. Mínimo 3 ejemplos. Esto demuestra al profe que usaste IA con criterio, no la copiaste.
  - |-
    \textbf{Paso 3 --- Atribución dentro del documento.} En la última página del documento principal, sección \textbf{``Fuentes y asistencia''}: lista las fuentes humanas (web, libros, entrevistas) Y la asistencia de IA con la plantilla: \emph{``En este proyecto usé [LLM] para [propósito específico]. Las ideas, organización, voz y conclusiones son mías.''}.
  - |-
    \textbf{Paso 4 --- Reflexión final.} Sección aparte (puede ser en el cuaderno): \textbf{``Mi crecimiento del año''}. Escribe en 5-7 líneas: \emph{(a) ¿Qué sabía al inicio del año en grado 7°?}, \emph{(b) ¿Qué sé al final del año?}, \emph{(c) ¿Cuál fue el aprendizaje que más me sorprendió?}, \emph{(d) ¿Cómo me sentí al usar IA por primera vez con criterio ético?}, \emph{(e) ¿Qué le recomendaría a mi yo de hace 30 sesiones?}.
  - |-
    \textbf{Paso 5 --- Autoevaluación con rúbrica.} Antes de sustentar, abre la rúbrica de 10 criterios. Marca cada uno con tu nota (1-5). Suma. Si algún criterio quedó bajo, ajusta si tienes tiempo. \textbf{Honesta autoevaluación es señal de madurez adulta}.
  - |-
    \textbf{Paso 6 --- Sustentación de 5 minutos al profe (en clase).} Estructura sugerida: \emph{(a) 30s: presento el tema, por qué lo elegí}. \emph{(b) 2 min: muestro el documento principal, explico organización}. \emph{(c) 1 min: muestro anexo de transparencia, explico cómo usé IA con criterio}. \emph{(d) 30s: leo mi reflexión final del año}. \emph{(e) 1 min: preguntas del profe}. La sustentación cierra el oficio.

  checklist:
    titulo: Antes de sustentar
    items: |-
      \checkbox Documento principal con tema sólido y voz propia dominante. \\[1mm]
      \checkbox Anexo de transparencia con 3+ prompts y verificaciones. \\[1mm]
      \checkbox Atribución de IA correctamente aplicada. \\[1mm]
      \checkbox 3+ fuentes humanas citadas además de IA. \\[1mm]
      \checkbox Reflexión final del año del crecimiento personal. \\[1mm]
      \checkbox Autoevaluación honesta con rúbrica de 10 criterios.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} documento principal 2-3 páginas con voz propia. \textit{Paso 2:} anexo de transparencia con 3+ prompts. \textit{Paso 3:} atribución de IA. \textit{Paso 4:} reflexión final del año. \textit{Paso 5:} autoevaluación con rúbrica. \textit{Paso 6:} sustentación oral 5 min.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Cosecha P3 + cierre del año». \textbf{Formato:} bocetos + anexo de transparencia + reflexión final firmada. \textbf{Extensión:} 1.5 a 2 páginas. \textbf{Sabes que terminaste cuando} sustentaste el proyecto al profe.

  producto_titulo: Proyecto con IA responsable + anexo de transparencia + sustentación · cierre del año académico
  criterios:
  - El documento principal tiene tema sólido, voz propia y formato profesional.
  - El anexo de transparencia documenta 3+ usos de IA con verificaciones.
  - La atribución de IA está aplicada correctamente.
  - La reflexión final del año académico es honesta y profunda.
  - La sustentación oral fue clara y demostrativa.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del paso hacia adulto digital)"
    cita: |-
      ``Aprender a usar IA con criterio ético en grado 7° es entrar a la adultez digital antes de tiempo. Es ventaja real, no solo académica.''
    aplicacion: |-
      \textbf{La mayoría de adultos hoy NO saben usar IA con criterio ético}. Tu generación entra al mundo digital con esa habilidad como base. \emph{Eso te coloca en lugar privilegiado para la vida adulta}: en universidad, en trabajo, en proyectos sociales. No es exageración: \emph{conocer y dominar las herramientas que tu generación va a usar profesionalmente es invertir en tu yo de 25 años}.
    pregunta_espejo: |-
      ¿Reconozco el valor de haber aprendido esto en momento clave?

  estoico:
    autor: "Marco Aurelio (emperador del año cumplido)"
    cita: |-
      ``Cerrar un año con oficio cumplido es base para el siguiente. Cierra bien grado 7°; abrirás bien grado 8°.''
    aplicacion: |-
      \textbf{Hoy cierras grado 7° en Tecnología}. Si lo cierras bien --- proyecto entregado con criterio, sustentación clara, reflexión honesta --- \emph{abres grado 8° con base sólida}. Si lo cierras a medias o sin oficio, en 8° empiezas desde atrás. \emph{El estoico sabe que cada cierre prepara el siguiente comienzo}. Tu cosecha hoy es promesa de un buen 8° grado en 2027.
    pregunta_espejo: |-
      ¿Estoy cerrando este año con el oficio que quiero llevar a 8°?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la ciudadanía digital)"
    cita: |-
      ``El primer proyecto con IA responsable es entrada formal a la ciudadanía digital adulta. No hay vuelta atrás: ya eres ciudadano.''
    aplicacion: |-
      \textbf{Hoy cambias de identidad}: antes eras \emph{usuario novato de tecnología}; ahora eres \emph{ciudadano digital con criterio ético}. Ese cambio se queda. \emph{En 30 años más vas a recordar} este año de grado 7° como el momento donde aprendiste a usar IA con criterio. Tu yo adulto te va a agradecer haber prestado atención. Sigue la línea: cada año en colegio, secundaria, universidad, trabajo, vas a profundizar lo que empezaste aquí.
    pregunta_espejo: |-
      ¿Reconozco que hoy soy un ciudadano digital con criterio, no un usuario pasivo más?

compromiso: |-
  \textbf{Para la siguiente sesión.} Guarda tu proyecto en lugar seguro. La S11 es el \textbf{cierre formal de grado 7°}: autoevaluación con rúbrica visible del año, examen integrador, mirada a grado 8° que se viene en 2027 (Excel, lógica de control, multimedia). Hoy cerraste el año académico con tu cosecha. La próxima clase consolidas formalmente todo lo que aprendiste.

web:
  conceptos_clave:
    - termino: Cosecha del periodo P3
      definicion: |-
        Proyecto final que integra todo lo aprendido en el periodo: tema sólido + voz propia + IA con criterio + atribución + anexo transparencia + sustentación. Es el rito de paso al fin del año académico de 7°.
      ejemplo: |-
        Tu cosecha puede ser un proyecto informativo (volcanes, fútbol, cocina, cambio climático) donde usaste IA como asistente, atribuiste su ayuda y mantuviste tu voz dominante. 2-3 páginas + anexo.
      emoji: "🌾"
    - termino: Anexo de transparencia
      definicion: |-
        Documento aparte (o sección dentro del proyecto) donde muestras cómo usaste IA: prompts utilizados, respuestas recibidas, cómo verificaste o adaptaste. Es honestidad académica radical aplicada a la era de IA.
      ejemplo: |-
        'Prompt 1: Soy estudiante de 7°, dame 5 datos sobre el Nevado del Ruiz. Respuesta: [resumen]. Verificación: contrasté con sitios oficiales del SGC. Adapté: agregué fechas exactas.' Eso es transparencia.
      emoji: "📋"
    - termino: Voz propia dominante
      definicion: |-
        Criterio de calidad del proyecto: tu organización, tus selecciones, tu perspectiva colombiana, tus ejemplos personales son lo que predomina. La IA puede haber asistido, pero la pieza se siente tuya.
      ejemplo: |-
        Si tu proyecto sobre volcanes tiene ejemplos del Eje Cafetero, perspectiva colombiana, frases de tu manera de hablar, es tu voz. Si suena a artículo genérico de Wikipedia, no es tu voz.
      emoji: "✒️"
    - termino: 10 criterios de la rúbrica P3
      definicion: |-
        Los 10 criterios con los que el profe evalúa: plan + tema + voz propia + IA con criterio + atribución + anexo transparencia + 3+ fuentes + 5 acuerdos + sustentación + reflexión. Cada uno 1-5 puntos. Total 50.
      ejemplo: |-
        Conocer la rúbrica antes te permite producir según ella. Si sabes que anexo de transparencia es 10%, lo harás bien. Si sabes que voz propia es 10%, te aseguras de que predomine.
      emoji: "📊"
    - termino: Cierre del año académico
      definicion: |-
        Momento donde reflexionas sobre tu crecimiento durante grado 7°: qué sabías al inicio, qué sabes al final, qué aprendiste, qué te sorprendió. No es trámite: es disciplina de cierre que prepara el siguiente comienzo.
      ejemplo: |-
        'Al inicio del año no sabía que existía la IA conversacional masiva. Hoy uso ChatGPT con CTRF y atribución. Mi voz se siente más segura. Lo que más me sorprendió fue darme cuenta de mi propia capacidad de aprender.' Reflexión honesta.
      emoji: "🌅"

  quiz:
    titulo: "¿Estás listo para entregar tu cosecha P3?"
    instrucciones: "5 preguntas para verificar que tu proyecto integra todo lo aprendido."
    preguntas:
      - enunciado: "¿Cuáles son los componentes mínimos de la cosecha P3?"
        opciones:
          - "Solo el documento principal."
          - "Documento principal + anexo de transparencia + atribución + reflexión final + sustentación."
          - "Solo el quiz."
          - "Solo lo que la IA escribió."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Los 5 componentes integran todo P3: proyecto + anexo (cómo usé IA) + atribución + reflexión + sustentación. Falta alguno = entrega incompleta.
        feedback_incorrecto: |-
          Los 5: documento principal + anexo transparencia + atribución + reflexión + sustentación. Cada uno tiene su peso. Falta alguno = cosecha incompleta.
      - enunciado: "Tu proyecto está escrito 100% por ChatGPT y lo entregas. ¿Cumple la rúbrica?"
        opciones:
          - "Sí, está bien escrito."
          - "NO. Falla criterio 3 (voz propia dominante) y criterio 8 (acuerdos). Es trampa, no cosecha."
          - "Sí si lo pagas."
          - "Depende del profe."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La cosecha pide TU voz dominante, no la de ChatGPT. Si todo es IA sin tu voz, viola los 5 acuerdos del uso responsable. Es trampa.
        feedback_incorrecto: |-
          Es trampa. La cosecha pide voz propia dominante + uso ético de IA. Si todo es IA, falla criterios 3, 4, 5 y 8. Tu voz tiene que estar.
      - enunciado: "Tu anexo de transparencia tiene solo 1 prompt. ¿Es suficiente?"
        opciones:
          - "Sí, alcanza."
          - "No. La rúbrica pide mínimo 3 prompts con sus verificaciones y adaptaciones."
          - "Sí si paga premium."
          - "Da igual."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Mínimo 3 prompts en el anexo. Demuestra que usaste IA en varios momentos del proyecto, no solo 1 vez. Cada uno con verificación.
        feedback_incorrecto: |-
          Mínimo 3 prompts en el anexo. Cada uno con verificación y adaptación. Muestra al profe que usaste IA reflexivamente, no solo de pasada.
      - enunciado: "¿Por qué tienes que reflexionar al final del año académico?"
        opciones:
          - "Por trámite."
          - "Para reconocer tu crecimiento: qué sabías al inicio, qué sabes al final. Eso prepara mejor el siguiente año."
          - "Para llenar páginas."
          - "Solo si lo pide el profe."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Reflexión = reconocer crecimiento. Hace 30 sesiones no sabías esto; hoy sí. Reconocerlo te empodera y prepara el siguiente año.
        feedback_incorrecto: |-
          Reflexión = reconocer crecimiento. Comparar el yo de hace 30 sesiones con el de hoy. Esa autoconciencia es disciplina adulta y prepara el siguiente nivel.
      - enunciado: "Hace 30 sesiones no sabías nada de IA. Hoy entregas un proyecto con IA responsable. ¿Cómo te sientes?"
        opciones:
          - "Igual que al inicio."
          - "Distinto: ahora soy ciudadano digital con criterio ético, no usuario pasivo. Esa identidad permanece."
          - "Sin cambio."
          - "Aburrido."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Ese cambio de identidad es valioso. Antes eras usuario novato; ahora eres ciudadano digital con criterio. Esa transformación no se olvida.
        feedback_incorrecto: |-
          Eres ciudadano digital con criterio ético ahora. Antes usuario pasivo; ahora consciente. Ese cambio se acumula con los años. Tu yo de 25 te lo agradecerá.

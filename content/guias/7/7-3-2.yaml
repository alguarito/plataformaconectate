clave: "3-2"
grado: 7
periodo: 3
sesion: 2
completo: true

titulo: "¿Qué es la IA? --- definición, historia y casos cotidianos"
titulo_portada: |-
  ¿Qué es
  la IA? ---
  definición,
  historia y
  casos diarios

producto_final: |-
  En el cuaderno: \textbf{(a) definición de IA con tus palabras}; \textbf{(b) mini-línea de tiempo} con 5 hitos históricos (1950 Turing, 1956 conferencia Dartmouth, 1997 Deep Blue vence a Kasparov, 2012 deep learning revolución, 2022 ChatGPT); \textbf{(c) mapa de la IA en mi día}: lista de 10 momentos donde uso IA sin darme cuenta (TikTok, Google, traductor, etc.); \textbf{(d) reflexión} sobre cómo se siente saber que ya convives con IA hace años.

apertura:
  saber_ancestral: |-
    \textbf{Mientras tus abuelos vivían los oficios de Cartago (relojero, costurera, tejedora), en 1950 un matemático inglés llamado Alan Turing escribió un artículo titulado ``¿Pueden las máquinas pensar?''.} Turing era ya famoso por haber roto el código nazi durante la Segunda Guerra Mundial, salvando miles de vidas. Cuando se sentó a escribir aquel artículo, no había computadores como los de hoy: existían máquinas enormes que llenaban un cuarto y hacían cálculos lentos. Pero Turing imaginaba el futuro. Propuso una pregunta filosófica: \emph{``si una máquina puede mantener una conversación con un humano sin que el humano se dé cuenta de que es máquina, ¿no es eso pensar?''}. Esa pregunta abrió un campo: \textbf{la Inteligencia Artificial}. Han pasado 76 años. Y lo que Turing imaginó como teoría --- una máquina que conversa como humano --- \textbf{hoy es ChatGPT}. La IA es más vieja de lo que crees. Tú llegas a un campo con 76 años de historia, no a una moda de ayer.

  saber_contemporaneo: |-
    \textbf{Definición simple de IA:} \emph{tecnología que permite a las máquinas hacer tareas que requieren ``inteligencia'' --- aprender, razonar, decidir, comunicarse}. \emph{``Inteligencia''} entre comillas porque \textbf{la IA no piensa como nosotros}: procesa datos a gran escala, encuentra patrones, predice. Pero no tiene conciencia, no tiene emociones reales, no entiende como un humano entiende. \textbf{Hitos clave de la historia de la IA:} \emph{1950}: Turing propone el ``Test de Turing''. \emph{1956}: conferencia de Dartmouth, nace el término \emph{``Artificial Intelligence''}. \emph{1997}: el programa Deep Blue de IBM vence al campeón mundial de ajedrez Garry Kasparov. \emph{2012}: la revolución del \emph{deep learning} (redes neuronales profundas). \emph{2022}: ChatGPT sale al público y la IA conversacional se vuelve masiva. \textbf{La IA está en muchos lugares de tu vida diaria}: cuando Google sugiere búsquedas, cuando TikTok te recomienda videos, cuando el traductor convierte español a inglés, cuando la cámara del celular reconoce rostros. \textbf{Llevas años conviviendo con IA sin saberlo}. Este periodo te abre los ojos.

  pregunta_puente: |-
    Si hoy te quitaran TODA la IA de tu día (Google sin sugerencias, TikTok sin recomendaciones, traductor sin existir, Maps sin rutas optimizadas), ¿\textbf{cuánto cambiaría tu vida}?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} qué es la IA con tus palabras; (2) sabrás \textbf{explicar} 5 hitos históricos clave; (3) podrás \textbf{aplicar} la idea de IA a 10 momentos cotidianos; (4) habrás \textbf{creado} tu mapa personal de IA en el día.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: defines IA con tus palabras, conoces 5 hitos históricos, mapeas IA en tu día, reflexionas.
  a_escuta: |-
    Empezamos imaginando un día completamente sin IA.
  a_sistematizacion: |-
    Después aprendes la definición + breve historia + 10 ejemplos.
  a_praxis: |-
    Con todo claro, mapeas 10 momentos de IA en tu día.
  a_producto: |-
    El producto es el mapa + definición + línea de tiempo + reflexión.
  a_evaluacion: |-
    Antes de salir, cuenta cuántos momentos de IA detectaste (suelen ser más de 10).
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué entender la IA es entender el mundo de hoy.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Un día sin IA} (10 min · individual). En el cuaderno, imagina este escenario: \emph{``Hoy te despiertas y descubres que toda la IA del mundo desapareció. Las máquinas siguen funcionando pero sin el componente de IA. ¿Qué cambia?''}. Responde estas \textbf{5 preguntas}: \emph{(1) ¿Funciona tu celular?}. \emph{(2) ¿Funciona Google igual?}. \emph{(3) ¿Cómo cambia TikTok sin recomendaciones?}. \emph{(4) ¿El traductor funciona?}. \emph{(5) ¿El GPS te lleva al colegio?}. Imagina con detalle. Las respuestas te van a mostrar cuánta IA hay en tu día sin que lo notes.

  checks:
  - Imaginé el escenario sin IA.
  - Respondí las 5 preguntas con calma.
  - Reconocí cuánto depende mi día de la IA.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Un día sin IA». \textbf{Formato:} 5 respuestas cortas. \textbf{Extensión:} 5-6 líneas. \textbf{Sabes que terminaste cuando} reconoces que la IA está más presente de lo que creías.

sistematizacion:
  intro: |-
    Ya viste cuánto depende tu día de la IA. Ahora aprende la \textbf{definición precisa} y los \textbf{hitos históricos} clave.

  pilares:
  - |-
    \textbf{Definición técnica de IA.} \emph{Conjunto de técnicas informáticas que permiten a las máquinas realizar tareas que tradicionalmente requerían inteligencia humana}: aprender de ejemplos, reconocer patrones, tomar decisiones, comunicarse en lenguaje natural, ver y entender imágenes, jugar a niveles expertos. \textbf{La IA no es ``magia'' ni ``robots conscientes''}: es matemática + estadística + computación + grandes cantidades de datos. \textbf{Es una herramienta poderosa, pero herramienta al fin}.
  - |-
    \textbf{Los 5 hitos históricos clave.} \textbf{(1) 1950 --- Alan Turing.} Publica \emph{``Computing Machinery and Intelligence''} y propone el famoso \emph{Test de Turing}: una máquina es ``inteligente'' si puede engañar a un humano haciéndole creer que también es humano. \textbf{(2) 1956 --- Dartmouth Conference.} John McCarthy y otros se reúnen y acuñan el término \emph{``Artificial Intelligence''}. Nace el campo formal. \textbf{(3) 1997 --- Deep Blue vs Kasparov.} El programa de IBM vence al campeón mundial de ajedrez Garry Kasparov. Primera vez que una máquina derrota al humano más experto en su juego.
  - |-
    \textbf{Los hitos 4 y 5.} \textbf{(4) 2012 --- Revolución del deep learning.} Un equipo de la Universidad de Toronto (Geoff Hinton, Ilya Sutskever, Alex Krizhevsky) gana una competencia de visión por computador usando \emph{redes neuronales profundas}. Cambia el campo para siempre: a partir de ahí, las grandes empresas invierten millones. \textbf{(5) 2022 --- ChatGPT al público.} OpenAI lanza ChatGPT, accesible a cualquier persona con internet. En 2 meses tiene 100 millones de usuarios. La IA conversacional se vuelve masiva. \emph{Tú llegas a la historia justo después de este hito}: a los 12-13 años ya estás aprendiendo lo que apenas se inventó hace 4 años.
  - |-
    \textbf{10 momentos de IA en tu día (lista de muestra).} (1) Cuando Google completa tu búsqueda al escribir. (2) Cuando TikTok elige el siguiente video. (3) Cuando WhatsApp sugiere palabras al escribir. (4) Cuando el banco aprueba un retiro al instante. (5) Cuando Maps recalcula la ruta por tráfico. (6) Cuando Spotify recomienda canciones nuevas. (7) Cuando el traductor convierte idiomas. (8) Cuando Instagram filtra fotos con efectos. (9) Cuando el corrector ortográfico subraya palabras. (10) Cuando Siri o Google Assistant responden a tu voz. \textbf{¿Cuántos de estos usas al día?}.

  anatomia:
    titulo: Definición + 5 hitos + 10 ejemplos cotidianos
    body: |-
      \textbf{Definición:} máquinas que hacen tareas inteligentes (aprender, razonar, decidir, comunicarse). \\[1mm]
      \textbf{5 hitos:} 1950 Turing · 1956 Dartmouth · 1997 Deep Blue · 2012 deep learning · 2022 ChatGPT. \\[1mm]
      \textbf{10 ejemplos cotidianos:} Google · TikTok · WhatsApp · banco · Maps · Spotify · traductor · Instagram · corrector · Siri/Assistant.

  errores_comunes: |-
    \textbf{Mitos sobre la IA que escucharás.} (1) \emph{``La IA es nueva, salió con ChatGPT''} --- Falso. Tiene 76 años de historia. (2) \emph{``La IA piensa como nosotros''} --- Falso. Procesa datos, no piensa con conciencia. (3) \emph{``La IA solo está en computadores grandes''} --- Falso. Está en tu celular, en tu nevera moderna, en las luces inteligentes. (4) \emph{``La IA es perfecta y nunca falla''} --- Falso. Comete errores, sesgo, alucinaciones. (5) \emph{``Solo los programadores usan IA''} --- Falso. La usan profesores, médicos, escritores, artistas, estudiantes. Todos los días.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Definición + 5 hitos». \textbf{Formato:} bloque A con definición de IA en MIS palabras (3 líneas). Bloque B con mini-línea de tiempo: 5 fechas con su evento clave. \textbf{Extensión:} 10 líneas. \textbf{Sabes que terminaste cuando} podrías explicarle a un primo qué es IA y por qué importa.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Mapa de IA en mi día} (28 min · individual). Vas a mapear 10+ momentos donde tú interactúas con IA sin darte cuenta. Es ejercicio de \emph{abrir los ojos} a un mundo que ya está rodeándote.

  pilares:
  - |-
    \textbf{Paso 1 --- Encabezado y plantilla.} En una hoja del cuaderno, título: \textbf{``Mapa de IA en mi día''}. Debajo, tabla de \textbf{12 filas y 3 columnas}. Encabezados: \emph{(1) Momento del día (hora aproximada)}, \emph{(2) Acción que hago}, \emph{(3) Cómo entra la IA en ese momento}.
  - |-
    \textbf{Paso 2 --- Recorre tu día de ayer mentalmente.} Empieza por la mañana. Mira las 24 horas. Para cada momento que uses dispositivo digital, anota: hora aproximada + acción + cómo entra IA. \emph{Ejemplo 1: 6 a. m., abro WhatsApp para ver mensajes, el corrector ortográfico (IA) corrige mientras escribo respuestas. Ejemplo 2: 7 a. m., Maps me sugiere ruta al cole, la IA calcula tráfico en tiempo real}.
  - |-
    \textbf{Paso 3 --- Llena las 12 filas.} Apunta al menos 12 momentos. Si pasas más tiempo en el celular, encontrarás 20-30 momentos sin esfuerzo. \emph{Pista}: TikTok solo te da 5 momentos de IA (cada video que aparece es una decisión de la IA).
  - |-
    \textbf{Paso 4 --- Cuenta los momentos por categoría.} Debajo de la tabla, agrupa los momentos por categoría: \emph{redes sociales}, \emph{buscar información}, \emph{comunicación}, \emph{navegación}, \emph{entretenimiento}. ¿Cuántos por categoría? ¿Dónde más IA hay en tu día?
  - |-
    \textbf{Paso 5 --- Reflexión personal.} Debajo del conteo, escribe en 4-5 líneas: \emph{``Lo que más me sorprendió de mi mapa de IA fue \_\_\_. Antes no me daba cuenta de \_\_\_. A partir de hoy, voy a notar la IA cuando \_\_\_''}.
  - |-
    \textbf{Paso 6 --- Mini-línea de tiempo + firma.} Al final de la hoja, dibuja una línea de tiempo horizontal con los 5 hitos (1950, 1956, 1997, 2012, 2022). Pon una flecha al final hacia 2026 y escribe: \emph{``yo aquí''}. Firma con nombre y fecha. Esa hoja queda como mapa permanente.

  checklist:
    titulo: Antes de cerrar la S2
    items: |-
      \checkbox La definición de IA está escrita con MIS palabras. \\[1mm]
      \checkbox La mini-línea de tiempo tiene los 5 hitos clave. \\[1mm]
      \checkbox El mapa tiene 12+ momentos de IA en mi día. \\[1mm]
      \checkbox Conté los momentos por categoría. \\[1mm]
      \checkbox Hay reflexión personal de 4-5 líneas. \\[1mm]
      \checkbox La línea de tiempo termina en 2026 con 'yo aquí'.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Arriba:} título + nombre. \textit{Mitad superior:} mini-línea de tiempo con 5 hitos. \textit{Centro:} tabla 12x3 con momentos de IA. \textit{Debajo:} conteo por categorías. \textit{Final:} reflexión personal + firma + 'yo aquí 2026'.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi mapa de IA en el día». \textbf{Formato:} línea de tiempo + tabla 12x3 + conteo + reflexión. \textbf{Extensión:} 1 página completa. \textbf{Sabes que terminaste cuando} ves la cantidad real de IA que ya está en tu día.

  producto_titulo: Mapa de IA en mi día · 12 momentos · 5 hitos históricos · reflexión personal · firmado
  criterios:
  - Tiene definición de IA en palabras propias del estudiante.
  - Línea de tiempo con los 5 hitos correctamente fechados.
  - Mínimo 12 momentos de IA cotidiana identificados.
  - Conteo por categorías está hecho.
  - Reflexión personal firmada.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del saber popular)"
    cita: |-
      ``Conocer el nombre de lo que te rodea es el primer paso para dejar de ser usado por ello. Aprender qué es la IA es ya un acto de soberanía.''
    aplicacion: |-
      \textbf{Hasta ayer, la IA era cosa invisible en tu vida}. Estaba ahí, decidiendo qué TikTok te recomendaba, qué Google te sugería, qué traducción aparecía --- pero \emph{no la veías}. Hoy la nombras. \emph{Nombrar lo que te rodea es el primer paso para no ser controlado por ello}. Mucha gente vive sin saber que existe IA en su día; tú ya no. Esa toma de conciencia es soberanía digital.
    pregunta_espejo: |-
      ¿Cuántas otras cosas en mi vida cotidiana funcionan sin que sepa su nombre o cómo operan?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Antes de juzgar si algo es bueno o malo, conoce su naturaleza. La IA no es magia ni monstruo: es matemática a gran escala.''
    aplicacion: |-
      Hay gente que \textbf{teme a la IA} (la pinta como monstruo que viene a destruirnos) y gente que la \textbf{idolatra} (la trata como dios infalible). Las dos posturas son perezosas: \emph{no se han tomado el tiempo de entender la naturaleza de la IA}. Lo sabio es: ni miedo, ni adoración. \emph{Conocer su naturaleza --- matemática + datos + algoritmos + electricidad --- te permite usarla con criterio}, ni rendido a sus pies ni huyendo de ella.
    pregunta_espejo: |-
      ¿Estoy en el grupo del miedo, en el de la adoración, o en el del conocimiento sereno?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la IA)"
    cita: |-
      ``Vivir con IA sin entenderla es como vivir con electricidad sin saber qué es: sirve, pero te electrocutas a veces. Entenderla te protege.''
    aplicacion: |-
      Tus abuelos vivieron la electrificación rural. Al principio, la electricidad parecía mágica. Después aprendieron: hay cables vivos, hay cortos circuitos, hay que tener cuidado. \textbf{Hoy estás en la fase ``mágica''} de la IA. La próxima fase es la \emph{alfabetización}: entender qué es, cuándo conviene, cuándo desconfiar, cómo cuidarse. Aprenderla en grado 7 te ahorra años de tropiezos en tu vida adulta.
    pregunta_espejo: |-
      ¿Estoy en la fase mágica con la IA o ya empiezo a alfabetizarme?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, cuando uses cualquier app, observa si hay IA detrás (recomendaciones, sugerencias, autocompletados). Anota mentalmente cuántas veces. La próxima clase aprendes los \textbf{tipos de IA}: estrecha vs general, modelos de lenguaje vs visión vs predicción. Vas a poder clasificar cada IA que veas.

web:
  conceptos_clave:
    - termino: Inteligencia Artificial (IA)
      definicion: |-
        Tecnología que permite a las máquinas realizar tareas que requerían inteligencia humana: aprender, razonar, decidir, comunicarse. Es matemática + estadística + computación + datos masivos. No es conciencia ni magia.
      ejemplo: |-
        Cuando Google sugiere búsqueda mientras escribes, cuando TikTok te recomienda video, cuando ChatGPT te responde: todos son ejemplos cotidianos de IA en acción.
      emoji: "🧠"
    - termino: Test de Turing
      definicion: |-
        Prueba propuesta por Alan Turing en 1950: una máquina es 'inteligente' si puede mantener conversación con un humano sin que el humano detecte que es máquina. Pregunta filosófica fundadora de la IA.
      ejemplo: |-
        Si chateas con ChatGPT y no sabes si es humano o máquina, ChatGPT pasó tu test de Turing personal. En la práctica, los humanos suelen detectar matices que las IAs aún no replican perfectamente.
      emoji: "🧪"
    - termino: 5 hitos históricos
      definicion: |-
        Los 5 momentos clave: 1950 (Turing publica el Test), 1956 (conferencia de Dartmouth acuña el término AI), 1997 (Deep Blue vence a Kasparov), 2012 (deep learning revolución), 2022 (ChatGPT al público masivo).
      ejemplo: |-
        Estás aprendiendo IA en 2026, 4 años después del hito ChatGPT. La IA tiene 76 años de historia, no es moda pasajera de ayer. Tu generación entra al campo en momento clave.
      emoji: "📅"
    - termino: IA en la vida cotidiana
      definicion: |-
        Los momentos donde IA actúa sin que lo notes: recomendaciones de TikTok, sugerencias de Google, autocompletado de WhatsApp, rutas de Maps, traductor, reconocimiento facial del celular. Decenas de veces al día.
      ejemplo: |-
        En 1 día de uso normal de celular probablemente interactúas con IA 50-100 veces. Cada video de TikTok es una decisión de IA. Cada sugerencia de búsqueda lo es.
      emoji: "📱"
    - termino: Alan Turing
      definicion: |-
        Matemático inglés (1912-1954) considerado padre de la informática moderna y la IA. Rompió el código nazi Enigma en la Segunda Guerra Mundial. En 1950 publicó el artículo fundador sobre IA con el famoso Test de Turing.
      ejemplo: |-
        Su trabajo en Bletchley Park durante la guerra ayudó a acortar la Segunda Guerra Mundial 2-4 años. Después del trabajo militar, su artículo sobre IA abrió el campo. Murió joven (41 años).
      emoji: "🎓"

  quiz:
    titulo: "¿Sabes qué es la IA?"
    instrucciones: "5 preguntas para verificar que entiendes la definición y los hitos."
    preguntas:
      - enunciado: "¿Quién propuso el Test de Turing en 1950?"
        opciones:
          - "Steve Jobs."
          - "Bill Gates."
          - "Alan Turing, matemático inglés."
          - "Mark Zuckerberg."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Alan Turing, en 1950. Su artículo 'Computing Machinery and Intelligence' propuso el famoso Test de Turing y abrió el campo de la IA. 76 años de historia.
        feedback_incorrecto: |-
          Alan Turing en 1950. Matemático inglés que también rompió el código nazi en la Segunda Guerra Mundial. Padre de la informática y la IA.
      - enunciado: "¿Cuándo salió ChatGPT al público?"
        opciones:
          - "Hace 50 años."
          - "A fines de 2022."
          - "Apenas el año pasado."
          - "Aún no ha salido."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. ChatGPT salió a fines de 2022. En 2 meses tuvo 100 millones de usuarios. La IA conversacional se volvió masiva. Eres parte de la primera generación que crece con ella.
        feedback_incorrecto: |-
          A fines de 2022. ChatGPT marcó el hito de la IA conversacional accesible al público masivo. Tu generación es la primera que crece con esto.
      - enunciado: "¿Es 'inteligente' la IA como nosotros?"
        opciones:
          - "Sí, piensa exactamente como nosotros."
          - "Sí, y tiene emociones."
          - "Solo si es premium."
          - "No. Procesa datos a gran escala, pero no tiene conciencia ni emociones reales."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. La IA procesa datos, no piensa con conciencia. Es muy poderosa para muchas tareas, pero no es 'inteligencia' al modo humano. Diferencia clave.
        feedback_incorrecto: |-
          No es 'inteligente' como nosotros. Procesa datos masivos y encuentra patrones. Útil pero distinto. Tener clara esa diferencia te ahorra confusiones.
      - enunciado: "¿Cuántos momentos al día interactúas con IA aproximadamente?"
        opciones:
          - "Decenas, probablemente más de 50 si usas celular regularmente."
          - "0 (no la uso)."
          - "1 sola vez al día."
          - "Solo si uso ChatGPT."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Cada video de TikTok = 1 decisión de IA. Cada sugerencia de Google = otra. Cada autocompletado = otra. En un día normal, 50-100 fácilmente.
        feedback_incorrecto: |-
          Decenas o cientos. TikTok, Google, WhatsApp, Maps, traductor, Spotify: todos usan IA constantemente. Ya conviven contigo desde hace años.
      - enunciado: "Tu hermano dice 'la IA es totalmente nueva, salió este año'. ¿Cómo lo corriges?"
        opciones:
          - "Tiene razón, es nueva."
          - "Solo lleva 2 años."
          - "La IA conversacional masiva sí es de 2022, pero el campo de la IA tiene 76 años (desde 1950)."
          - "Mejor no opinar."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Hay matiz importante: la IA conversacional masiva (ChatGPT) es de 2022, pero el CAMPO de la IA arrancó en 1950 con Turing. 76 años, no 4.
        feedback_incorrecto: |-
          El campo tiene 76 años (1950 Turing). La conversacional masiva es de 2022. Saber la diferencia te coloca en lugar de criterio en debates sobre IA.

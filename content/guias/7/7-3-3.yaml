escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- ¿Qué tipo de IA usa esta app?} (10 min · individual). En el cuaderno responde para cada una de estas 8 apps: \emph{¿qué hace su IA principalmente?}. \emph{(1) TikTok}. \emph{(2) Google Translate}. \emph{(3) ChatGPT}. \emph{(4) Cámara del celular (modo retrato que difumina el fondo)}. \emph{(5) Spotify}. \emph{(6) Banco (cuando rechaza una transacción extraña)}. \emph{(7) Maps (cuando recalcula ruta)}. \emph{(8) Cualquier juego con NPC (personajes no jugables que parecen ``inteligentes'')}. Responde con tu intuición.

  checks:
  - Leí las 8 apps con calma.
  - Pensé qué hace la IA en cada una.
  - Anoté mi intuición sin buscar.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 8 apps y su IA». \textbf{Formato:} lista numerada 1-8 con descripción corta. \textbf{Extensión:} 8 líneas. \textbf{Sabes que terminaste cuando} reconoces patrones (varias apps hacen recomendar, varias generan texto, varias procesan imágenes).

sistematizacion:
  intro: |-
    Las 8 apps caen en \textbf{5 tipos principales de IA estrecha}. Aprende cada uno con sus apps típicas. Y entiende por qué ninguno es \emph{general} (AGI) todavía.

  pilares:
  - |-
    \textbf{Tipo 1 --- Modelos de lenguaje (LLMs).} Generan texto a partir de texto. Conversaciones, resúmenes, traducciones, código. \emph{Apps:} ChatGPT, Claude, Gemini, Copilot. \textbf{Limitación clave:} no \emph{entienden} como humanos --- predicen la palabra más probable basándose en patrones aprendidos de miles de millones de textos. Pueden alucinar (inventar). \textbf{Tipo 2 --- Visión por computador.} Procesa imágenes y videos. Reconoce caras, clasifica objetos, genera imágenes nuevas. \emph{Apps:} desbloqueo facial del celular, modo retrato de cámaras, Google Lens, DALL-E (genera imágenes). \textbf{Limitación clave:} puede confundirse con imágenes adversarias (pequeños cambios invisibles a humanos pueden engañar a la IA).
  - |-
    \textbf{Tipo 3 --- Sistemas de recomendación.} Predicen qué te gustaría según tu historial y el de gente similar. \emph{Apps:} TikTok, YouTube, Spotify, Netflix, Amazon. \textbf{Limitación clave:} crean \emph{cámaras de eco} (te muestran solo lo que ya te gusta, no te exponen a cosas nuevas). \textbf{Tipo 4 --- Predicción y clasificación.} Predicen valores numéricos o asignan categorías. \emph{Apps:} Maps (predice tráfico), bancos (predicen fraude), seguros (predicen riesgo de accidente), pronóstico del clima. \textbf{Limitación clave:} solo predicen lo que han visto antes; algo verdaderamente nuevo las confunde.
  - |-
    \textbf{Tipo 5 --- Sistemas expertos (Game AI, asistentes específicos).} Tienen reglas y conocimiento específico de un dominio. \emph{Apps:} NPCs de videojuegos (el dragón sabe atacar), asistentes médicos que diagnostican según síntomas, ajedrez profesional, Go (AlphaGo). \textbf{Limitación clave:} fuera del dominio para el que fueron diseñados, no sirven. AlphaGo no puede recomendarte canciones.
  - |-
    \textbf{¿Por qué la AGI aún no existe?} La AGI (Artificial General Intelligence) sería una IA que iguale a un humano en CUALQUIER tarea intelectual. \textbf{No existe} en 2026 porque los modelos actuales: (a) Son especialistas en un dominio (ChatGPT en texto, DALL-E en imágenes). (b) No tienen \emph{sentido común} verdadero (cometen errores que un niño no cometería). (c) No tienen \emph{conciencia} ni \emph{intenciones} (procesan, no quieren). (d) No \emph{aprenden} de una sola experiencia como humanos (necesitan miles de ejemplos). \textbf{¿Cuándo llegará AGI? Los expertos están divididos.} Algunos dicen 5-10 años; otros, 50; otros, nunca. \emph{Vivimos en el momento de gran apuesta tecnológica, pero nadie sabe la respuesta segura}.

  anatomia:
    titulo: 5 tipos + IA estrecha vs general
    body: |-
      \textbf{5 tipos de IA estrecha:} \\[1mm]
      \textbf{1.} Modelos de lenguaje (LLMs) --- ChatGPT, Claude. \\[1mm]
      \textbf{2.} Visión por computador --- desbloqueo facial, DALL-E. \\[1mm]
      \textbf{3.} Recomendadores --- TikTok, YouTube, Spotify. \\[1mm]
      \textbf{4.} Predicción/clasificación --- Maps tráfico, bancos antifraude. \\[1mm]
      \textbf{5.} Sistemas expertos --- NPCs juegos, asistentes médicos. \\[1mm]
      \textbf{IA general (AGI):} aún NO existe.

  errores_comunes: |-
    \textbf{Mitos sobre los tipos de IA.} (1) \emph{``ChatGPT es AGI''} --- Falso. Es especialista en generar texto plausible. (2) \emph{``Las IAs se aburren''} --- Falso. No tienen estados emocionales. (3) \emph{``Si una IA es buena en algo, será buena en todo''} --- Falso. Las IAs estrechas son inútiles fuera de su dominio. (4) \emph{``Los robots de las películas ya existen''} --- Falso. Los robots actuales son muy limitados; los de Hollywood son ciencia ficción. (5) \emph{``La AGI llegará el próximo año seguro''} --- Falso. Nadie sabe cuándo (o si) llegará.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 5 tipos de IA estrecha + AGI». \textbf{Formato:} bloque A con tabla de 5 filas (tipo + ejemplo de app + limitación clave). Bloque B con 3 líneas sobre qué es AGI y por qué aún no existe. \textbf{Extensión:} 10 líneas. \textbf{Sabes que terminaste cuando} podrías clasificar cualquier IA que veas en una de las 5 categorías.

praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA --- Tabla comparativa + análisis personal} (28 min · individual). Vas a armar una tabla completa de los 5 tipos + reflexionar sobre cuáles usas más.

  pilares:
  - |-
    \textbf{Paso 1 --- Tabla comparativa de 5 tipos.} En una hoja del cuaderno, tabla de \textbf{5 filas y 5 columnas}. Columnas: \emph{(1) Nombre del tipo}, \emph{(2) Qué hace}, \emph{(3) Ejemplo de app real}, \emph{(4) ¿Estrecha o general?}, \emph{(5) Algo que NO puede hacer}. Llena las 5 filas con los 5 tipos de la sistematización.
  - |-
    \textbf{Paso 2 --- Análisis: ¿qué tipos uso más?} Debajo de la tabla, subtítulo: \textbf{``Los 3 tipos de IA que más uso''}. Lista numerada de 3 tipos en orden de frecuencia, con justificación corta: \emph{``Uso más [tipo] porque [actividad cotidiana]''}. Ejemplo: \emph{``1. Recomendadores, porque uso TikTok 3 horas al día. 2. Visión por computador, porque desbloqueo el celular 50 veces al día con cara. 3. LLMs, porque uso ChatGPT 5 veces a la semana.''}.
  - |-
    \textbf{Paso 3 --- Reflexión sobre AGI.} Subtítulo: \textbf{``Por qué la AGI todavía no existe''}. Escribe en 4-5 líneas tu propia explicación: por qué ChatGPT no es AGI, qué le falta a las IAs actuales para ser \emph{generales}, y si crees que llegará la AGI en tu vida (sí, no, no sé).
  - |-
    \textbf{Paso 4 --- Mapa visual.} En un costado, dibuja un \textbf{círculo grande} con la palabra \emph{IA}. Adentro divide en 5 sectores etiquetados con los 5 tipos (como pastel). Marca con sombreado cuáles usas TÚ regularmente. Esto te da imagen visual de tu uso.
  - |-
    \textbf{Paso 5 --- Tu predicción.} Subtítulo: \textbf{``Mi predicción para 2030''}. Escribe en 3-4 líneas qué creés que va a pasar con la IA en 4 años: ¿más AGI? ¿más recomendadores? ¿más asistentes? Sé honesto: no copies de internet.
  - |-
    \textbf{Paso 6 --- Firma y cierre.} Al final firma con nombre y fecha. Tu predicción te servirá: en 4 años revisarás esta hoja y verás si tu intuición fue cierta.

  checklist:
    titulo: Antes de cerrar la S3
    items: |-
      \checkbox La tabla tiene 5 tipos con sus 5 columnas. \\[1mm]
      \checkbox Identifiqué los 3 tipos que más uso. \\[1mm]
      \checkbox Hay reflexión sobre por qué AGI no existe. \\[1mm]
      \checkbox Dibujé el mapa visual circular con 5 sectores. \\[1mm]
      \checkbox Hice predicción para 2030 con mi voz. \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} tabla 5x5 (tipo, qué hace, ejemplo, estrecha/general, limitación). \textit{Paso 2:} análisis de los 3 tipos que más uso. \textit{Paso 3:} reflexión sobre AGI. \textit{Paso 4:} mapa visual circular. \textit{Paso 5:} predicción para 2030. \textit{Paso 6:} firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA).} Título: «Actividad 3 --- 5 tipos de IA + análisis personal». \textbf{Formato:} tabla + análisis + reflexión + mapa + predicción. \textbf{Extensión:} 1 página completa. \textbf{Sabes que terminaste cuando} podrías clasificar cualquier IA nueva que aparezca en uno de los 5 tipos.

  producto_titulo: Tabla de 5 tipos de IA + análisis personal + predicción 2030 · firmado
  criterios:
  - La tabla tiene los 5 tipos con las 5 columnas completas.
  - Hay análisis personal de los 3 tipos más usados.
  - Hay reflexión sobre por qué AGI todavía no existe.
  - El mapa visual circular distingue los 5 tipos.
  - Hay predicción personal para 2030.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del análisis crítico)"
    cita: |-
      ``Clasificar lo que te rodea no es burocracia académica: es soberanía intelectual. El que distingue tipos, no se deja engañar.''
    aplicacion: |-
      \textbf{Cuando solo conoces ``la IA'' como categoría única}, todas te parecen iguales. Cuando distingues 5 tipos, ves matices: \emph{TikTok hace recomendaciones, no genera texto; ChatGPT genera texto, no genera imágenes}. Esa distinción es \emph{poder mental}: te coloca en posición de analizar críticamente, no de admirar o temer pasivamente. Don Lucho el relojero distinguía las herramientas de su taller; tú distingues los tipos de IA del mundo digital.
    pregunta_espejo: |-
      ¿Antes de hoy, qué tan ``mezcladas'' tenía las IAs en mi cabeza?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Lo que la IA no puede hacer hoy, importa tanto como lo que sí puede. Conocer ambos límites es sabiduría.''
    aplicacion: |-
      Hay gente que solo habla de \textbf{lo que la IA puede hacer} (impresionante, ¿no?). Otra gente solo habla de \textbf{lo que aún no puede} (limitada, ¿no?). El sabio conoce \emph{ambos}: lo que puede y lo que no. Eso le permite usarla con criterio --- aprovechar fortalezas, no esperar lo imposible. \emph{Tu tabla con la columna ``limitación clave'' entrena esa sabiduría serena}.
    pregunta_espejo: |-
      ¿Tiendo a sobreestimar la IA (esperar que pueda todo) o a subestimarla (no aprovechar lo que puede)?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la era de la IA)"
    cita: |-
      ``Cuando llegue la AGI cambiará el mundo. Pero hoy no existe. Vivir como si ya existiera o como si nunca llegara son dos errores opuestos.''
    aplicacion: |-
      \textbf{Algunos viven como si la AGI ya existiera}: le piden a ChatGPT que decida por ellos. Otros viven como si nunca pudiera existir: rechazan toda IA por miedo. \emph{Los dos son errores opuestos}. \textbf{La actitud sabia: usar las IAs estrechas actuales con criterio, sin esperar magia, y estar atento a cómo evolucionan}. Quizás llegue AGI en 10 años; quizás nunca. Vive con la IA que ES, no con la que imaginas.
    pregunta_espejo: |-
      ¿Estoy tratando a ChatGPT como AGI (esperando que sepa todo) o como herramienta estrecha (con criterio sobre lo que sí sabe)?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, cada vez que uses una app con IA, clasifícala mentalmente en uno de los 5 tipos. Te entrenas la mente en distinguir. La próxima clase aprendes \textbf{cómo aprende una IA}: datos, entrenamiento, y el problema clave del \emph{sesgo}.

web:
  conceptos_clave:
    - termino: IA estrecha (narrow AI)
      definicion: |-
        IA especializada en una sola tarea. Es muy buena en su dominio, pero inútil fuera de él. La mayoría de IAs que usas hoy son estrechas: ChatGPT, TikTok, Maps, traductor.
      ejemplo: |-
        ChatGPT es excelente generando texto pero no puede generar imágenes (necesitas DALL-E para eso). DALL-E genera imágenes pero no conversa. Cada uno especialista.
      emoji: "🎯"
    - termino: IA general (AGI)
      definicion: |-
        Inteligencia Artificial General: una IA hipotética que pueda hacer cualquier tarea intelectual humana al mismo nivel que nosotros. AÚN NO EXISTE en 2026. Los expertos están divididos sobre cuándo llegará.
      ejemplo: |-
        Una IA que pueda aprender un idioma, escribir un libro, hacer ingeniería, debatir política y criar un hijo, todo al nivel humano. Eso sería AGI. Hoy ninguna IA llega a eso.
      emoji: "🌐"
    - termino: Modelos de lenguaje (LLM)
      definicion: |-
        IAs especializadas en generar y procesar texto. Aprenden patrones de miles de millones de palabras y predicen la siguiente palabra. ChatGPT, Claude, Gemini son LLMs.
      ejemplo: |-
        Le escribes 'Cuéntame sobre Bolívar' y el LLM predice palabra por palabra una respuesta coherente. No 'sabe' sobre Bolívar; predice qué texto sería plausible escribir.
      emoji: "💬"
    - termino: Sistemas de recomendación
      definicion: |-
        IAs que predicen qué te gustaría según tu historial y el de gente similar. TikTok, YouTube, Spotify, Netflix, Amazon. Muy efectivos para atraparte en la app.
      ejemplo: |-
        TikTok analiza qué videos viste completos, qué saltaste, qué comentaste. Predice qué te gustaría siguiente. Puedes pasar horas sin notarlo: ese es su diseño.
      emoji: "👍"
    - termino: Visión por computador
      definicion: |-
        IAs que procesan imágenes y videos. Reconocen caras (desbloqueo facial), clasifican objetos (Google Lens), generan imágenes nuevas (DALL-E, Midjourney). Otro dominio especialista.
      ejemplo: |-
        Cuando el celular se desbloquea viendo tu cara, una IA de visión por computador procesa la imagen y verifica que eres tú. Mismo principio: reconocer patrones visuales.
      emoji: "👁️"

  quiz:
    titulo: "¿Conoces los tipos de IA?"
    instrucciones: "5 preguntas para verificar que distingues IA estrecha, AGI y los 5 tipos."
    preguntas:
      - enunciado: "¿Existe AGI (Artificial General Intelligence) en 2026?"
        opciones:
          - "Sí, ChatGPT es AGI."
          - "Sí, salió el año pasado."
          - "No. Las IAs actuales son estrechas (especialistas en una tarea). La AGI aún no existe."
          - "Sí, solo en China."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. La AGI aún no existe en 2026. Las IAs actuales son estrechas: cada una experta en su dominio. ChatGPT es excelente en texto pero limitado fuera.
        feedback_incorrecto: |-
          AGI aún NO existe. ChatGPT y otras son IAs estrechas: especialistas en su tarea. Confundir IA estrecha con AGI lleva a esperar lo imposible.
      - enunciado: "TikTok te recomienda videos. ¿Qué tipo de IA usa?"
        opciones:
          - "Modelo de lenguaje (LLM)."
          - "Sistema de recomendación."
          - "Visión por computador."
          - "AGI."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Sistema de recomendación: predice qué te gustaría según tu historial. Por eso TikTok se siente tan adictivo: la IA optimiza para que sigas viendo.
        feedback_incorrecto: |-
          Sistema de recomendación. Predice qué video verías a continuación según historial y patrones. Tipo 3 de los 5. TikTok, YouTube, Spotify son ejemplos.
      - enunciado: "ChatGPT puede conversar de muchos temas. ¿Es AGI por eso?"
        opciones:
          - "No. Es excelente generando texto plausible, pero técnicamente es IA estrecha (especialista en lenguaje)."
          - "Sí, claramente."
          - "Solo si pago premium."
          - "Sí desde 2024."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. ChatGPT es IA estrecha (LLM). Excelente en texto plausible, pero no es AGI: no tiene sentido común profundo ni intenciones, ni puede aprender de 1 sola experiencia.
        feedback_incorrecto: |-
          ChatGPT es LLM (IA estrecha). Genera texto plausible pero no tiene sentido común profundo. Confundirlo con AGI es error común. Es asistente impresionante, no inteligencia general.
      - enunciado: "El desbloqueo facial del celular es..."
        opciones:
          - "AGI."
          - "Sistema de recomendación."
          - "Modelo de lenguaje."
          - "Visión por computador (procesa imágenes)."
        respuesta_index: 3
        feedback_correcto: |-
          Bien. Visión por computador. La IA procesa la imagen de tu cara y la compara con la registrada. Reconoce patrones visuales. Tipo 2 de los 5.
        feedback_incorrecto: |-
          Visión por computador. Procesa imágenes y reconoce patrones (tu cara vs la registrada). Tipo 2 de los 5. Otros ejemplos: Google Lens, DALL-E.
      - enunciado: "Tu hermano dice 'mi computador tiene IA'. ¿Qué le preguntas para entender mejor?"
        opciones:
          - "¿De qué tipo? ¿LLM, visión, recomendador, predicción, sistema experto?"
          - "Nada, da igual."
          - "¿Cuánto te costó?"
          - "¿Es de China?"
        respuesta_index: 0
        feedback_correcto: |-
          Bien. Saber distinguir tipos es la diferencia entre conversación adulta sobre IA y comentarios vagos. Ahora puedes preguntar y entender.
        feedback_incorrecto: |-
          Pregunta el tipo. Te coloca en lugar de criterio: ya no piensas en 'IA' como cosa genérica, sino en tipo específico con sus capacidades y limitaciones.

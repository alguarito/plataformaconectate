clave: "3-4"
grado: 7
periodo: 3
sesion: 4
completo: true

titulo: "Cómo aprende una IA --- datos, entrenamiento y el problema del sesgo"
titulo_portada: |-
  Cómo aprende
  una IA ---
  datos,
  entrenamiento
  y sesgo

producto_final: |-
  En el cuaderno: \textbf{(a) diagrama del aprendizaje de una IA} con 4 partes (datos → algoritmo → modelo → predicción); \textbf{(b) 3 ejemplos reales de sesgo en IA} con análisis (qué pasó, por qué, consecuencias); \textbf{(c) tu propio mini-ejemplo} de cómo un sesgo en datos puede causar problema (puedes inventar un caso simple); \textbf{(d) 5 reglas para detectar sesgo en una IA que uses}. Firma.

apertura:
  saber_ancestral: |-
    \textbf{Cuando doña Mercedes, maestra rural del Valle del Cauca, enseñaba a leer a un niño nuevo, no le mostraba 1 sola palabra: le mostraba cientos.} Le mostraba \emph{``casa''} y la repetía. Le mostraba \emph{``mamá''}, \emph{``perro''}, \emph{``árbol''}. Cada palabra varias veces. Con el tiempo, el niño \textbf{empezaba a reconocer patrones}: \emph{las letras juntas forman palabras, las palabras tienen sonidos, los sonidos forman frases}. \emph{Doña Mercedes no le ``programaba'' las reglas}: el niño las extraía de los ejemplos. \textbf{Esa es exactamente la forma en que aprende una IA moderna}: le muestras miles de ejemplos, ella encuentra patrones, y después puede generalizar. \emph{Si los ejemplos son buenos y variados, aprende bien. Si los ejemplos son malos o sesgados, aprende mal}. Como doña Mercedes: si solo le hubiera mostrado al niño palabras de un grupo (solo objetos urbanos, sin animales del campo), el niño habría aprendido un mundo parcial. Las IAs igual.

  saber_contemporaneo: |-
    Una IA \emph{aprende} no porque le programen reglas, sino porque \textbf{le muestran muchos ejemplos}. Este proceso se llama \textbf{entrenamiento} y tiene 4 partes: \textbf{(1) Datos de entrenamiento:} miles o millones de ejemplos. Para ChatGPT, son libros, artículos, sitios web, foros. Para visión por computador, son fotos etiquetadas. Para reconocimiento facial, son rostros. \textbf{(2) Algoritmo de aprendizaje:} la fórmula matemática que ajusta el modelo según los datos. El más popular: \emph{redes neuronales profundas} (deep learning). \textbf{(3) Modelo entrenado:} el resultado del entrenamiento. \emph{Una IA en sí misma}: un conjunto de números que codifican lo aprendido. \textbf{(4) Predicción/generación:} cuando le das algo nuevo, el modelo lo procesa y genera respuesta. \textbf{El problema del sesgo (bias)}: si los datos de entrenamiento están \emph{sesgados} (incompletos, parciales, con prejuicios), la IA aprende esos sesgos y los reproduce. Por ejemplo, si una IA de RH solo vio currículos de hombres, va a discriminar mujeres. Esto es real y ha pasado en empresas grandes.

  pregunta_puente: |-
    Si una IA tiene que aprender a reconocer ``buenas notas'', pero la entrenan SOLO con notas de niños de colegios privados de Bogotá, ¿\textbf{qué pasa cuando le muestran una nota} de un niño del campo del Pacífico que escribe con caligrafía distinta?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} las 4 partes del aprendizaje de una IA; (2) sabrás \textbf{explicar} qué es el sesgo y por qué ocurre; (3) podrás \textbf{analizar} 3 ejemplos reales de sesgo; (4) habrás \textbf{creado} tu diagrama del aprendizaje + 5 reglas para detectar sesgo.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: descubres cómo aprende una IA, analizas 3 casos de sesgo, dibujas el diagrama, formulas las 5 reglas.
  a_escuta: |-
    Empezamos con un experimento mental: enseñar a una IA a reconocer una palabra.
  a_sistematizacion: |-
    Después aprendes las 4 partes del proceso + 3 casos reales de sesgo.
  a_praxis: |-
    Con todo claro, armas tu diagrama + 3 casos + 5 reglas + mini-ejemplo propio.
  a_producto: |-
    El producto es ese diagrama + análisis + 5 reglas firmadas.
  a_evaluacion: |-
    Antes de salir, verifica que tu mini-ejemplo muestra cómo el sesgo entra por los datos.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué entender el sesgo es entender a la IA por dentro.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Enseñar a una IA a reconocer ``gato''} (10 min · individual). Imagina este experimento: \emph{quieres entrenar una IA para que reconozca fotos de gatos. Le muestras 1000 fotos de gatos para que aprenda}. En el cuaderno responde: \emph{(1) ¿Bastan 1000 fotos? ¿O necesitas más?} \emph{(2) ¿Qué tipo de fotos deberías incluir? (todas iguales o variadas)}. \emph{(3) ¿Qué pasa si todas las fotos son de gatos negros? ¿La IA reconocerá gatos blancos?}. \emph{(4) ¿Qué pasa si solo le muestras fotos de gato y NO de otras cosas? ¿La IA podrá distinguir gato de perro?}. \emph{(5) ¿Quién decide qué fotos usar para entrenar?}.

  checks:
  - Imaginé el experimento de entrenar la IA.
  - Respondí las 5 preguntas con calma.
  - Identifiqué que los datos importan, no solo cantidad.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Entrenar una IA: la importancia de los datos». \textbf{Formato:} 5 respuestas cortas. \textbf{Extensión:} 5-6 líneas. \textbf{Sabes que terminaste cuando} entiendes que los datos buenos son tan importantes como el algoritmo.

sistematizacion:
  intro: |-
    Tu intuición es correcta: \textbf{los datos son lo más importante en el aprendizaje de una IA}. Ahora aprende las 4 partes del proceso + 3 casos reales de sesgo.

  pilares:
  - |-
    \textbf{Las 4 partes del aprendizaje de una IA.} \textbf{(1) Datos de entrenamiento.} Miles o millones de ejemplos. Para ChatGPT: textos de libros, Wikipedia, foros, sitios web. Para una IA médica: historiales clínicos. Para reconocimiento facial: fotos de personas con sus nombres. \textbf{Calidad de los datos = calidad de la IA}. Datos sesgados → IA sesgada. \textbf{(2) Algoritmo de aprendizaje.} La fórmula matemática que ajusta el modelo. La más usada hoy: \emph{redes neuronales profundas} (deep learning), inspiradas en cómo funcionan las neuronas del cerebro humano. Otras: árboles de decisión, regresión, máquinas de soporte vectorial.
  - |-
    \textbf{Las 4 partes (continuación).} \textbf{(3) Modelo entrenado.} El resultado del proceso: un conjunto de \emph{parámetros} (números) que el algoritmo ajustó. \emph{La IA misma}. GPT-4 tiene aproximadamente 1.7 trillones de parámetros. Cada uno es un número ajustado durante el entrenamiento. \textbf{(4) Predicción/generación.} Cuando le das una entrada nueva, el modelo la procesa y produce una salida. \emph{El uso real}. Para ChatGPT: tú escribes pregunta, modelo genera respuesta. Para reconocedor facial: tú muestras foto, modelo dice quién es.
  - |-
    \textbf{Qué es el sesgo (bias) y por qué ocurre.} El \textbf{sesgo} en IA es cuando la IA discrimina o falla sistemáticamente con cierto grupo. \emph{No es un bug accidental: es consecuencia de los datos}. Si entrenaste la IA con datos parciales, la IA aprenderá esa parcialidad. Es como un niño criado solo en la ciudad: si lo llevas al campo, no sabe nombrar animales. \textbf{3 ejemplos reales de sesgo:} (a) \textbf{Amazon (2018):} desarrolló IA para filtrar CV y la entrenó con CVs de 10 años anteriores (mayoritariamente hombres). La IA descartaba CVs de mujeres automáticamente. Amazon la canceló. (b) \textbf{Google Photos (2015):} clasificó fotos de personas afrodescendientes como \emph{``gorillas''}. Los datos no incluían suficiente diversidad. Google se disculpó públicamente. (c) \textbf{COMPAS (sistema de justicia EEUU):} IA usada para evaluar riesgo de reincidencia mostró sesgo contra personas afroamericanas. Influyó en condenas reales. Sigue siendo controversial.
  - |-
    \textbf{Las 5 reglas para detectar sesgo en una IA.} (1) \textbf{Pregunta de qué datos aprendió.} Si no te lo dicen, sospecha. (2) \textbf{Verifica resultados en distintos grupos.} ¿La IA funciona igual de bien con hombres y mujeres? ¿Con personas de distinta edad/origen? Si trata distinto a grupos similares, hay sesgo. (3) \textbf{Busca tu propio ejemplo de prueba.} Si vives en zona rural, prueba la IA con ejemplos rurales y ve cómo responde. (4) \textbf{Lee la documentación.} Las IAs profesionales explican (o deberían explicar) sus limitaciones y sesgos conocidos. (5) \textbf{No asumas que la IA es ``neutral''.} \emph{Toda IA refleja los valores y limitaciones de sus creadores y datos}. La neutralidad pura no existe.

  anatomia:
    titulo: 4 partes del aprendizaje + sesgo
    body: |-
      \textbf{4 partes:} \\[1mm]
      \textbf{1.} DATOS (miles de ejemplos). \\[1mm]
      \textbf{2.} ALGORITMO (fórmula que ajusta). \\[1mm]
      \textbf{3.} MODELO (resultado entrenado). \\[1mm]
      \textbf{4.} PREDICCIÓN/GENERACIÓN (uso real). \\[1mm]
      \textbf{Sesgo:} cuando datos parciales generan IA discriminatoria. Real, no teórico.

  errores_comunes: |-
    \textbf{Mitos sobre cómo aprende la IA.} (1) \emph{``La IA es objetiva y no tiene prejuicios''} --- Falso. La IA refleja prejuicios de sus datos. (2) \emph{``Si la IA es nueva, no tiene sesgo''} --- Falso. Las más nuevas también tienen sesgo, solo que distinto. (3) \emph{``Más datos = sin sesgo''} --- Falso. Si los datos son sesgados, más datos también pueden estar sesgados. (4) \emph{``Solo los datos viejos están sesgados''} --- Falso. Datos nuevos también pueden tener sesgos contemporáneos. (5) \emph{``El sesgo es problema técnico que se arregla solo''} --- Falso. Es problema técnico Y social que requiere atención humana constante.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 4 partes + sesgo». \textbf{Formato:} bloque A con diagrama de las 4 partes (flechas: datos → algoritmo → modelo → predicción). Bloque B con tabla de 3 casos de sesgo (Amazon, Google Photos, COMPAS). \textbf{Extensión:} 12 líneas. \textbf{Sabes que terminaste cuando} podrías explicarle a tu hermano qué es sesgo en IA con un ejemplo real.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Diagrama + análisis + mini-ejemplo + 5 reglas} (32 min · individual). Vas a sintetizar todo lo aprendido en un solo trabajo.

  pilares:
  - |-
    \textbf{Paso 1 --- Dibuja el diagrama del aprendizaje.} En una hoja del cuaderno, dibuja un diagrama horizontal con \textbf{4 cajas conectadas por flechas}: \emph{Datos → Algoritmo → Modelo → Predicción}. Adentro de cada caja, una descripción breve (1-2 líneas) de qué pasa ahí.
  - |-
    \textbf{Paso 2 --- Análisis de los 3 casos reales.} Debajo del diagrama, tabla de \textbf{3 filas y 4 columnas}. Columnas: \emph{(1) Caso}, \emph{(2) ¿Qué pasó?}, \emph{(3) ¿Por qué? (sesgo en datos)}, \emph{(4) ¿Cuál fue la consecuencia?}. Filas: Amazon CV, Google Photos, COMPAS.
  - |-
    \textbf{Paso 3 --- Tu mini-ejemplo de sesgo.} Inventa un caso simple. Ejemplo: \emph{``Una IA para clasificar canciones colombianas se entrena solo con vallenato. Después se le muestra una salsa choke. ¿Qué pasa? La IA dice 'no es música colombiana' porque no aprendió otros géneros''}. Describe tu caso en 3-4 líneas: \emph{(a) qué se quiere lograr}, \emph{(b) qué datos usaron}, \emph{(c) cómo se manifiesta el sesgo}, \emph{(d) qué solución propondrías}.
  - |-
    \textbf{Paso 4 --- Las 5 reglas para detectar sesgo.} Lista numerada del 1 al 5. Reproduce las 5 reglas que aprendiste, con tus palabras. Subráyalas: serán tu kit mental para evaluar cualquier IA que uses.
  - |-
    \textbf{Paso 5 --- Aplicación: prueba una IA que uses regularmente.} Escoge una IA (TikTok, Google Translate, ChatGPT). Aplica las 5 reglas mentalmente. Identifica al menos 1 posible sesgo. Anota: \emph{``IA evaluada: \_\_\_. Posible sesgo detectado: \_\_\_. Cómo lo verificaría: \_\_\_''}.
  - |-
    \textbf{Paso 6 --- Reflexión personal + firma.} Al final escribe en 3-4 líneas: \emph{``Lo que más me sorprendió de este tema fue \_\_\_. Antes pensaba que la IA era neutral, ahora sé que \_\_\_. La regla más útil para mí es \_\_\_''}. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S4
    items: |-
      \checkbox Tengo diagrama de las 4 partes del aprendizaje. \\[1mm]
      \checkbox La tabla de 3 casos reales está completa. \\[1mm]
      \checkbox Tengo mi mini-ejemplo de sesgo inventado. \\[1mm]
      \checkbox Las 5 reglas para detectar sesgo están subrayadas. \\[1mm]
      \checkbox Apliqué las reglas a 1 IA real y detecté 1 posible sesgo. \\[1mm]
      \checkbox Hay reflexión personal firmada.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} diagrama 4 cajas (datos → algoritmo → modelo → predicción). \textit{Paso 2:} tabla 3 casos reales (Amazon, Google Photos, COMPAS). \textit{Paso 3:} mini-ejemplo propio inventado. \textit{Paso 4:} 5 reglas para detectar sesgo. \textit{Paso 5:} aplicar reglas a 1 IA real. \textit{Paso 6:} reflexión + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Cómo aprende una IA + sesgo». \textbf{Formato:} diagrama + 3 casos + mini-ejemplo + 5 reglas + aplicación + reflexión. \textbf{Extensión:} 1 página y media. \textbf{Sabes que terminaste cuando} podrías ser ``crítico de IA'' al revisar cualquier app.

  producto_titulo: Diagrama del aprendizaje + 3 casos de sesgo + mini-ejemplo + 5 reglas · firmado
  criterios:
  - El diagrama tiene las 4 partes correctamente conectadas.
  - La tabla de 3 casos reales está completa (qué pasó, por qué, consecuencia).
  - Hay mini-ejemplo de sesgo inventado por el estudiante.
  - Las 5 reglas para detectar sesgo están aplicadas a 1 IA real.
  - Hay reflexión personal sobre el descubrimiento del sesgo.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del análisis crítico)"
    cita: |-
      ``La IA refleja a quien la creó. Si los datos vinieron de unos pocos, la IA reproducirá los valores de unos pocos. La diversidad de datos es justicia.''
    aplicacion: |-
      \textbf{La mayoría de IAs del mundo se entrenan con datos en inglés, de Estados Unidos y Europa}. Cuando esas IAs llegan a Colombia, traen consigo \emph{las miradas culturales de sus creadores}. Pueden tener sesgos contra acentos latinos, contra apellidos hispanos, contra realidades de barrios populares. \emph{Eso no es accidente; es consecuencia de qué datos usaron y quién los recolectó}. La justicia algorítmica empieza por diversificar quién crea las IAs y con qué datos.
    pregunta_espejo: |-
      ¿Las IAs que uso fueron creadas pensando en mí, mi familia, mi región?

  estoico:
    autor: "Marco Aurelio (emperador del análisis sereno)"
    cita: |-
      ``Saber cómo aprende la IA te quita el asombro mágico. Lo mágico cede paso a lo analítico, y eso es ganancia.''
    aplicacion: |-
      \textbf{Antes de hoy, las respuestas de ChatGPT te parecían casi mágicas}: \emph{¿cómo puede saber tanto?}. Hoy entiendes: \emph{aprendió de miles de millones de textos durante meses de entrenamiento, ajustando trillones de parámetros}. \emph{Es resultado de procesamiento matemático masivo, no magia}. Esa comprensión te coloca en posición de analizar, no de venerar.
    pregunta_espejo: |-
      ¿Antes veía la IA como magia? ¿Cómo cambia mi relación al saber cómo aprende?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del sesgo algorítmico)"
    cita: |-
      ``El sesgo no es defecto técnico que arreglar después: es valor político que debe debatirse antes. La IA refleja decisiones humanas.''
    aplicacion: |-
      \textbf{El sesgo en IA no es problema solo técnico}: es problema \emph{político}. Detrás de cada decisión sobre qué datos usar, qué algoritmo escoger, qué medir como ``buen resultado'' \emph{hay personas que decidieron}. La IA refleja esas decisiones. Por eso debatir IA es debatir poder: \emph{quién la hace, para quién, con qué datos, para qué fines}. Esa conversación apenas empieza en el mundo. Tu generación va a ser parte de ella.
    pregunta_espejo: |-
      ¿Qué decisiones políticas estoy aceptando sin verlas cada vez que uso una IA?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, cuando uses una IA, pregúntate: \emph{``¿de qué datos aprendió esto? ¿hay grupos a los que no representa?''}. La próxima clase aprendes a fondo los \textbf{Modelos de Lenguaje (LLMs)}: ChatGPT, Claude, Gemini. Vas a abrir uno y conversar por primera vez.

web:
  conceptos_clave:
    - termino: Entrenamiento (training)
      definicion: |-
        Proceso por el cual una IA aprende: se le muestran miles o millones de ejemplos y un algoritmo ajusta el modelo para reconocer patrones. Toma semanas o meses con computadores poderosos. Sin entrenamiento, no hay IA útil.
      ejemplo: |-
        Entrenar GPT-4 tomó meses, usó miles de procesadores especializados y costó alrededor de 100 millones de dólares. El resultado: un modelo con 1.7 trillones de parámetros.
      emoji: "🏋️"
    - termino: Datos de entrenamiento
      definicion: |-
        Los ejemplos con los que se entrena una IA. Para ChatGPT: libros, Wikipedia, foros, sitios web. Para reconocimiento facial: fotos etiquetadas. La calidad y diversidad de los datos determinan la calidad de la IA.
      ejemplo: |-
        Si entrenas IA con CVs de hombres, la IA va a 'preferir' candidatos hombres. Si entrenas IA de canciones solo con vallenato, va a 'rechazar' otros géneros como 'no música'.
      emoji: "📚"
    - termino: Sesgo (bias)
      definicion: |-
        Cuando una IA discrimina o falla sistemáticamente con cierto grupo. No es bug accidental: es consecuencia de datos parciales o decisiones humanas en el diseño. Real y documentado en Amazon, Google, sistemas de justicia.
      ejemplo: |-
        Google Photos en 2015 clasificó fotos de personas afrodescendientes como 'gorillas' porque los datos no incluyeron suficiente diversidad. Google se disculpó. Caso paradigmático de sesgo.
      emoji: "⚖️"
    - termino: Redes neuronales profundas (deep learning)
      definicion: |-
        El algoritmo más usado en IA moderna. Inspirado en cómo funcionan las neuronas del cerebro humano. 'Profundas' porque tienen muchas capas (decenas o cientos). La revolución de 2012 popularizó esta técnica.
      ejemplo: |-
        ChatGPT, DALL-E, Google Translate, reconocimiento facial: todos usan redes neuronales profundas. Es la tecnología clave detrás de la mayoría de IAs avanzadas que conoces.
      emoji: "🧠"
    - termino: 5 reglas para detectar sesgo
      definicion: |-
        Las 5 normas para evaluar críticamente una IA: (1) preguntar de qué datos aprendió, (2) probar con distintos grupos, (3) buscar tu propio caso de prueba, (4) leer documentación, (5) no asumir neutralidad.
      ejemplo: |-
        Antes de confiar en una IA que califica trabajos escolares, pregunta: ¿con qué trabajos se entrenó? ¿de qué colegios? ¿de qué países? Si solo se entrenó con trabajos de colegios élite, va a sesgar.
      emoji: "🔍"

  quiz:
    titulo: "¿Sabes cómo aprende una IA?"
    instrucciones: "5 preguntas para verificar que entiendes el aprendizaje y el sesgo."
    preguntas:
      - enunciado: "¿Cómo aprende una IA moderna?"
        opciones:
          - "Le programan reglas una por una."
          - "Le muestran miles o millones de ejemplos y ajusta automáticamente su modelo."
          - "Lee libros como un humano."
          - "Le rezan."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Aprende de ejemplos masivos (entrenamiento). Un algoritmo ajusta el modelo. No le programan reglas explícitas; extrae patrones de los datos.
        feedback_incorrecto: |-
          De ejemplos masivos. Le muestran miles de ejemplos, el algoritmo ajusta el modelo. Es como enseñar a un niño con muchas palabras, no con reglas gramaticales.
      - enunciado: "Una IA de RH descarta CVs de mujeres. ¿Por qué pasa?"
        opciones:
          - "La IA es machista por naturaleza."
          - "Probablemente se entrenó con datos sesgados (más CVs de hombres en el histórico) y reprodujo ese sesgo."
          - "Es magia."
          - "Solo pasa en China."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Caso real: Amazon 2018. La IA se entrenó con CVs de 10 años (mayoría hombres) y aprendió a 'preferir' ese patrón. Discriminó mujeres automáticamente.
        feedback_incorrecto: |-
          Caso real Amazon 2018. Datos sesgados (CVs mayormente de hombres) → IA reprodujo el sesgo. No es intencional, pero sí real. Amazon la canceló.
      - enunciado: "¿Es la IA 'neutral' por naturaleza?"
        opciones:
          - "Sí, no tiene prejuicios."
          - "No. Refleja decisiones humanas sobre qué datos usar y cómo entrenar."
          - "Sí, los matemáticos las hacen objetivas."
          - "Solo si es premium."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. La IA NO es neutral. Refleja los datos con que la entrenaron + las decisiones de sus diseñadores. Toda IA tiene sesgos potenciales.
        feedback_incorrecto: |-
          NO es neutral. Toda IA refleja decisiones humanas: qué datos, qué algoritmo, qué métricas. La neutralidad pura no existe. Reconocerlo es paso clave.
      - enunciado: "Quieres detectar si una IA tiene sesgo. ¿Qué haces?"
        opciones:
          - "Confiar ciegamente."
          - "Aplicar las 5 reglas: preguntar datos, probar con distintos grupos, buscar caso propio, leer documentación, no asumir neutralidad."
          - "No usar IA."
          - "Solo usar IA china."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Las 5 reglas. Aplicarlas te entrena como crítico de IA, no consumidor pasivo. Es habilidad clave del ciudadano digital.
        feedback_incorrecto: |-
          5 reglas: datos, grupos, caso propio, documentación, no asumir. Aplícalas a cualquier IA que uses regularmente. Te coloca en lugar de criterio.
      - enunciado: "Una IA aprende de qué tipos de datos NO le mostraste. ¿Es responsable?"
        opciones:
          - "Sí, la IA debió saber sola."
          - "No. La IA solo sabe lo que le mostraron. Si faltaron datos, faltó la perspectiva en sus diseñadores. La responsabilidad es humana."
          - "Solo si paga premium."
          - "Depende del año."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La IA no inventa; reproduce. Si los datos faltaron, faltó la perspectiva de quien los recolectó. La responsabilidad es de los humanos que diseñaron y entrenaron.
        feedback_incorrecto: |-
          La responsabilidad es humana. La IA reproduce datos. Si faltan grupos, faltó visión en los diseñadores. Por eso diversificar quien crea IAs es justicia.

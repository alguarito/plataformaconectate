clave: "3-5"
grado: 7
periodo: 3
sesion: 5
completo: true

titulo: "Modelos de lenguaje (LLMs) --- ChatGPT, Claude, Gemini"
titulo_portada: |-
  Modelos de
  lenguaje
  (LLMs) ---
  ChatGPT,
  Claude, Gemini

producto_final: |-
  \textbf{3 conversaciones reales con un LLM} gratuito (puedes usar ChatGPT, Claude, Gemini o Copilot), guardadas en capturas o transcritas en el cuaderno. \textbf{Tema sugerido para las 3:} \emph{(1) ``Explícame algo que me cueste entender de matemáticas''}, \emph{(2) ``Recomiéndame 3 libros de un género que me guste''}, \emph{(3) ``Ayúdame a redactar un correo formal al profe''}. Más \textbf{tabla comparativa} (en cuaderno) de 3 LLMs principales (ChatGPT vs Claude vs Gemini) + \textbf{análisis} de las 5 cosas que SÍ pueden y las 5 que NO pueden hacer.

apertura:
  saber_ancestral: |-
    \textbf{Cuando doña Mercedes la maestra rural de Cartago tenía que explicarle un tema difícil a un niño del campo, no le daba la respuesta de una vez.} \emph{Le hacía preguntas, le mostraba ejemplos, lo guiaba paso a paso}. Si el niño no entendía con la primera explicación, doña Mercedes lo intentaba de otra manera: con un dibujo, con una comparación con la vida del campo, con un cuento. \textbf{Era paciente y se adaptaba al estudiante}. Los LLMs (Large Language Models) intentan hacer algo parecido: \emph{conversan contigo, se adaptan a tus preguntas, te explican de varias formas}. Pero hay diferencias claves: \emph{doña Mercedes te conocía, sabía qué te interesaba, recordaba tu progreso. Los LLMs no te conocen}: cada conversación arranca de cero. Esa diferencia es lo que hace que la IA sea \emph{asistente} pero no \emph{maestra} en sentido completo.

  saber_contemporaneo: |-
    Los \textbf{LLMs} (Large Language Models, \emph{Modelos de Lenguaje Grandes}) son IAs entrenadas con \textbf{miles de millones de palabras} de libros, sitios web, foros, artículos. Aprenden a \emph{predecir la siguiente palabra} con tanta sofisticación que pueden mantener conversaciones, responder preguntas, escribir textos, traducir, resumir. \textbf{Los 3 LLMs más conocidos en 2026:} \textbf{(1) ChatGPT} (de OpenAI): el primero masivo (nov 2022). Versión gratuita: GPT-4o-mini. Pago: GPT-4o, o3. \textbf{(2) Claude} (de Anthropic): conocido por respuestas cuidadosas y análisis profundo. Versión gratuita disponible. \textbf{(3) Gemini} (de Google): integrado con servicios de Google. Versión gratuita en \texttt{gemini.google.com}. \textbf{Cosas que pueden hacer (las 5 más útiles para estudiantes):} explicar conceptos, ayudar a estructurar texto, traducir, resumir, generar ideas. \textbf{Cosas que NO pueden (5 limitaciones clave):} (1) no tienen \emph{información actualizada} más allá de su fecha de entrenamiento; (2) \emph{alucinan} (inventan); (3) no acceden a internet en tiempo real (excepto algunas versiones); (4) no tienen \emph{memoria} entre conversaciones; (5) no tienen \emph{contexto personal} sobre ti.

  pregunta_puente: |-
    Si le preguntas a ChatGPT \emph{``¿quién ganó las elecciones de mi colegio el año pasado?''}, ¿\textbf{podrá responder}? ¿Por qué sí o por qué no?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 3 LLMs principales y sus diferencias; (2) sabrás \textbf{aplicar} cada uno a tareas reales; (3) podrás \textbf{evaluar} qué pueden y qué NO pueden hacer; (4) habrás \textbf{conversado} con un LLM real al menos 3 veces.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: distingues los 3 LLMs principales, abres uno y conversas 3 veces, evalúas sus respuestas, analizas qué pueden y qué no.
  a_escuta: |-
    Empezamos planeando las 3 conversaciones.
  a_sistematizacion: |-
    Después aprendes los 3 LLMs principales + sus 5 capacidades y 5 limitaciones.
  a_praxis: |-
    Con todo claro, abres un LLM gratuito y haces las 3 conversaciones reales.
  a_producto: |-
    El producto es la tabla comparativa + 3 conversaciones capturadas + análisis.
  a_evaluacion: |-
    Antes de salir, verifica que TÚ aplicaste los 5 acuerdos de la S1 (verificar, no datos personales, etc.).
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué dialogar con IA exige nuevas habilidades.

escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Planea tus 3 conversaciones} (10 min · individual). En el cuaderno, planea las 3 preguntas que vas a hacerle al LLM. \textbf{Conversación 1: Aprender algo difícil.} Escoge un concepto de matemáticas o ciencias que te cueste. Anota: \emph{``Voy a pedirle que me explique [concepto] de manera fácil''}. \textbf{Conversación 2: Recomendaciones.} Anota un género de libros que te guste (aventura, ciencia ficción, romance) y pide 3 títulos. \textbf{Conversación 3: Redactar algo.} Piensa en un correo formal que tengas que escribir (al profe, al coordinador). Anota qué quieres pedir y a quién.

  checks:
  - Pensé en un concepto que me cueste para Conv. 1.
  - Identifiqué mi género favorito para Conv. 2.
  - Definí qué correo formal necesito para Conv. 3.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Plan de mis 3 conversaciones». \textbf{Formato:} 3 bloques con la pregunta planeada para cada conversación. \textbf{Extensión:} 6-9 líneas. \textbf{Sabes que terminaste cuando} tienes claro qué le vas a preguntar al LLM antes de abrirlo.

sistematizacion:
  intro: |-
    Antes de abrir el LLM, conoce los 3 principales + sus 5 capacidades + sus 5 limitaciones. Eso te coloca en posición de evaluar las respuestas, no solo aceptarlas.

  pilares:
  - |-
    \textbf{Los 3 LLMs principales en 2026.} \textbf{(1) ChatGPT (OpenAI).} El primer LLM masivo (nov 2022). Versión gratuita: GPT-4o-mini en \texttt{chat.openai.com}. Conocido por ser muy versátil. Tiene memoria entre conversaciones en cuenta paga. \textbf{(2) Claude (Anthropic).} Conocido por respuestas cuidadosas, largas y bien estructuradas. Versión gratuita en \texttt{claude.ai}. Bueno para análisis profundo, ensayos, código. Anthropic se enfoca en \emph{seguridad} de IA. \textbf{(3) Gemini (Google).} Integrado con servicios Google. Acceso en \texttt{gemini.google.com}. Bueno para tareas que se conectan con Gmail, Drive, Maps. Versión gratuita incluida.
  - |-
    \textbf{Las 5 cosas que SÍ pueden hacer los LLMs.} (1) \textbf{Explicar conceptos.} Pídele que te explique \emph{``derivadas''}, \emph{``fotosíntesis''}, \emph{``constitución colombiana''}: te dará explicación clara. (2) \textbf{Ayudar a estructurar texto.} Si tienes un ensayo en borrador, te puede sugerir estructura mejor. (3) \textbf{Traducir.} Inglés-español, español-francés, cualquier par. Mejor que Google Translate para frases complejas. (4) \textbf{Resumir.} Le pegas un texto largo y te lo resume en 5 puntos. (5) \textbf{Generar ideas.} Lluvia de ideas: nombres para un proyecto, temas para investigar, formas de empezar un texto.
  - |-
    \textbf{Las 5 cosas que NO pueden hacer.} (1) \textbf{No tienen información en tiempo real.} Si preguntas \emph{``¿qué pasó hoy en las noticias?''}, te dirá ``no tengo acceso a noticias en tiempo real''. Excepción: versiones con búsqueda web. (2) \textbf{Alucinan.} Inventan datos con seguridad. Si pides \emph{``cita una obra de Borges que hable de Cartago''}, puede inventar una cita falsa. (3) \textbf{No recuerdan entre conversaciones} (en versión gratuita). Cada conversación nueva arranca de cero. (4) \textbf{No tienen contexto personal.} No saben tu nombre, tu colegio, tus calificaciones. Cada vez que abres conversación, eres anónimo. (5) \textbf{No pueden hacer cálculos exactos largos sin error.} Si pides \emph{``cuánto es 6738 × 9281''}, puede dar respuesta incorrecta. Para mate exacta, usa calculadora.
  - |-
    \textbf{Cómo conversar bien con un LLM (preparación para S6).} \emph{(a) Saluda y da contexto:} \emph{``Soy estudiante de 7° grado en Colombia''}. Eso ayuda al LLM a adaptar tono. \emph{(b) Sé específico en lo que pides:} \emph{``Explícame el teorema de Pitágoras con un ejemplo del fútbol''} es mejor que \emph{``explícame Pitágoras''}. \emph{(c) Si no entiendes la respuesta, pide más:} \emph{``No entendí, ¿lo puedes explicar más simple?''}. La IA puede iterar. \emph{(d) Verifica lo que dice} (acuerdo 1 de la S1). Si te da un dato importante, verifica en otra fuente. \emph{(e) Aplica criterio} (acuerdo 4): si la respuesta no convence, pídele que la justifique o cámbiale el enfoque.

  anatomia:
    titulo: 3 LLMs + 5 SÍ pueden + 5 NO pueden
    body: |-
      \textbf{3 LLMs principales:} \\[1mm]
      \textbf{1.} ChatGPT (OpenAI, chat.openai.com). \\[1mm]
      \textbf{2.} Claude (Anthropic, claude.ai). \\[1mm]
      \textbf{3.} Gemini (Google, gemini.google.com). \\[1mm]
      \textbf{Las 5 que SÍ pueden:} explicar · estructurar · traducir · resumir · generar ideas. \\[1mm]
      \textbf{Las 5 que NO pueden:} info tiempo real · alucinan · sin memoria · sin contexto personal · cálculos exactos largos.

  errores_comunes: |-
    \textbf{Errores frecuentes al usar LLMs por primera vez.} (1) \emph{Pedirle solo ``hola''} y esperar conversación profunda --- empieza con tarea concreta. (2) \emph{Aceptar la primera respuesta sin verificar} --- los LLMs alucinan a veces, sobre todo en datos específicos. (3) \emph{Darle datos personales sensibles} (cédula, dirección) --- recordatorio del acuerdo 2 de la S1. (4) \emph{Usarlo para hacer la tarea en lugar de aprender} --- te quita el aprendizaje, eso es responsabilidad ética (lo verás en S8 y S9). (5) \emph{Creer que lo que sabe ChatGPT es ``la verdad''} --- es ``la mejor predicción según sus datos'', no la verdad absoluta.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 3 LLMs + 5 sí pueden + 5 no pueden». \textbf{Formato:} bloque A con tabla 3x3 (LLM + URL + característica clave). Bloque B con lista de 5 capacidades. Bloque C con lista de 5 limitaciones. \textbf{Extensión:} 13 líneas. \textbf{Sabes que terminaste cuando} podrías recomendar qué LLM usar para qué tarea.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- 3 conversaciones reales con un LLM} (35 min · individual). Vas a abrir un LLM gratuito y conversar 3 veces con él. Sé honesto sobre tus dudas y aprende a evaluar las respuestas.

  pilares:
  - |-
    \textbf{Paso 1 --- Abre un LLM gratuito.} Decide cuál usar. Recomendaciones para 7° grado: \emph{Claude} (en \texttt{claude.ai}, no requiere cuenta para 5 mensajes), \emph{ChatGPT} (en \texttt{chat.openai.com}, requiere cuenta gratis), \emph{Gemini} (en \texttt{gemini.google.com}, con cuenta Google). Inicia con el que tengas más fácil acceso.
  - |-
    \textbf{Paso 2 --- Conversación 1: Aprender algo difícil.} Toma el concepto que planeaste en Actividad 1. Escribe en el LLM: \emph{``Soy estudiante de 7° grado en Colombia. Necesito que me expliques [concepto] de manera sencilla, con un ejemplo concreto que pueda entender. Si después no entiendo, te pido que lo expliques distinto''}. Lee la respuesta. Si no entiendes, pide otra explicación. Conversa hasta que entiendas. \textbf{Anota en el cuaderno:} la pregunta inicial + 2-3 líneas de la respuesta clave + ¿entendiste mejor? ¿qué te ayudó?
  - |-
    \textbf{Paso 3 --- Conversación 2: Pedir recomendaciones.} Escribe: \emph{``Soy estudiante de 7° grado. Me gusta [género]. Recomiéndame 3 libros que me podrían gustar, con 1 línea de descripción cada uno''}. Recibe la respuesta. \textbf{Importante:} verifica al menos 1 de los libros recomendados. Búscalo en Google o en biblioteca. ¿Existe? Esto te entrena en \emph{verificación} (acuerdo 1).
  - |-
    \textbf{Paso 4 --- Conversación 3: Redactar un correo formal.} Escribe: \emph{``Necesito redactar un correo formal al profe de Tecnología pidiéndole [tu pregunta]. ¿Me puedes ayudar con el borrador? Quiero que tenga las 5 partes formales''}. Recibe el borrador. \textbf{Importante:} no lo copies tal cual. Léelo. Adáptalo a tu voz. Cambia cosas que no suenan a ti. Esto practica el acuerdo 5 (voz propia).
  - |-
    \textbf{Paso 5 --- Tabla comparativa + análisis.} Si tu colegio te lo permite, repite las 3 conversaciones con OTRO LLM distinto (Claude vs ChatGPT, por ejemplo). Compara las respuestas: ¿cuál fue más clara? ¿más profunda? ¿más útil? Anota en el cuaderno una tabla 3x2 (LLM x conversación) con tu evaluación. Si no puedes probar 2, evalúa solo el primero.
  - |-
    \textbf{Paso 6 --- Reflexión personal + firma.} Al final escribe: \emph{``Mi primera vez con un LLM fue \_\_\_. Lo que más me sorprendió fue \_\_\_. Lo que verifiqué y resultó cierto: \_\_\_. Lo que NO me convenció: \_\_\_. Aplicaría las 5 acuerdos de la S1 así: \_\_\_''}. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S5
    items: |-
      \checkbox Tuve 3 conversaciones con un LLM gratuito. \\[1mm]
      \checkbox Anoté las 3 conversaciones (preguntas + extractos de respuestas). \\[1mm]
      \checkbox Verifiqué al menos 1 dato de las respuestas. \\[1mm]
      \checkbox Apliqué los 5 acuerdos del uso responsable. \\[1mm]
      \checkbox Hay reflexión personal de mi primera experiencia con LLM. \\[1mm]
      \checkbox Está firmado con nombre y fecha.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} abrir LLM. \textit{Paso 2:} conversación 1 (aprender concepto). \textit{Paso 3:} conversación 2 (recomendaciones + verificar). \textit{Paso 4:} conversación 3 (redactar + adaptar a voz propia). \textit{Paso 5:} tabla comparativa (opcional). \textit{Paso 6:} reflexión + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mis 3 primeras conversaciones con un LLM». \textbf{Formato:} 3 bloques de conversación + tabla comparativa (opcional) + reflexión. \textbf{Extensión:} 1 página y media. \textbf{Sabes que terminaste cuando} tienes experiencia real con un LLM y opinión propia sobre su utilidad.

  producto_titulo: 3 conversaciones reales con un LLM + verificación + reflexión · firmado
  criterios:
  - Tuve 3 conversaciones reales con un LLM gratuito.
  - Verifiqué al menos 1 dato de las respuestas.
  - Apliqué los 5 acuerdos del uso responsable.
  - El correo redactado fue adaptado a mi voz, no copiado directo.
  - Hay reflexión personal sobre mi primera experiencia.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del diálogo crítico)"
    cita: |-
      ``Dialogar con la IA no es someterse a ella. Es ejercer pensamiento crítico mientras conversas: preguntar, verificar, decidir tú.''
    aplicacion: |-
      Hay gente que abre ChatGPT y \textbf{copia la primera respuesta} sin pensar. Eso no es dialogar; es someterse. \emph{Dialogar críticamente} es: \textbf{leer con cuidado, hacer preguntas de seguimiento, verificar, contrastar con tu criterio, decidir si la respuesta es buena o no}. Las personas que dominan ese diálogo se vuelven más sabias. Las que copian sin pensar se vuelven dependientes. \emph{Hoy diste el primer paso en esa habilidad de toda la vida}.
    pregunta_espejo: |-
      ¿Voy a entrenar mi pensamiento crítico al usar IA, o a dejar que la IA piense por mí?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Cuando recibas una respuesta, antes de aceptarla, pregúntate: ¿es verdadera? ¿es útil para mí en mi situación? El sabio juzga antes de seguir.''
    aplicacion: |-
      Los LLMs dan respuestas con \emph{seguridad}: suenan correctas aunque a veces no lo sean. El estoico sabe que \textbf{seguridad no es verdad}. Antes de actuar según una respuesta, pasa por 2 filtros: \emph{(1) ¿es verdadera? (verifica con otra fuente)}, \emph{(2) ¿es útil para mí? (mi contexto puede ser distinto)}. Esos 2 filtros mentales en segundos te ahorran horas de errores.
    pregunta_espejo: |-
      ¿Estoy aplicando estos 2 filtros (verdad + utilidad propia) o acepto respuestas sin pasar por ellos?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la conversación con IA)"
    cita: |-
      ``La calidad de tu conversación con la IA refleja la calidad de tu pensamiento. Quien sabe preguntar, obtiene respuestas valiosas. Quien no, obtiene basura.''
    aplicacion: |-
      \textbf{Los LLMs son espejo de tu pensamiento}. Si haces preguntas vagas, recibes respuestas vagas. Si haces preguntas profundas y específicas, recibes respuestas profundas y específicas. \emph{Las próximas sesiones (S6 y S7) te enseñarán a hacer preguntas mejor (prompting)}. Pero la habilidad de fondo es \emph{tu capacidad de formular bien la pregunta}, que viene de pensar bien sobre lo que necesitas.
    pregunta_espejo: |-
      ¿Mis preguntas son vagas o específicas? ¿Cómo mejora la respuesta cuando la pregunta es mejor?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, haz 2 conversaciones más con el LLM que más te gustó. Practica los acuerdos. La próxima clase aprendes \textbf{prompting básico}: cómo formular preguntas para obtener mejores respuestas. Es la habilidad que diferencia a quien usa IA con criterio de quien recibe basura.

web:
  conceptos_clave:
    - termino: LLM (Large Language Model)
      definicion: |-
        IA especializada en generar y procesar texto. Entrenada con miles de millones de palabras de libros, web, foros. Predice palabra por palabra basándose en patrones aprendidos. ChatGPT, Claude, Gemini son LLMs.
      ejemplo: |-
        Le escribes 'Explícame derivadas como si fuera para un niño de 12'. El LLM predice una explicación coherente palabra por palabra. No 'sabe' matemáticas; reproduce patrones de cómo se explican matemáticas en sus datos.
      emoji: "💬"
    - termino: ChatGPT (OpenAI)
      definicion: |-
        El primer LLM masivo (noviembre 2022). De la empresa OpenAI. Versión gratuita actual: GPT-4o-mini en chat.openai.com. Conocido por su versatilidad. Tiene memoria entre conversaciones en cuenta paga.
      ejemplo: |-
        Para empezar: ve a chat.openai.com, crea cuenta gratis, escribe tu pregunta. Te responde en segundos. Tiene 100+ millones de usuarios activos en el mundo.
      emoji: "🟢"
    - termino: Claude (Anthropic)
      definicion: |-
        LLM de la empresa Anthropic, fundada por ex-empleados de OpenAI. Conocido por respuestas cuidadosas, largas y bien estructuradas. Versión gratuita en claude.ai. Énfasis en seguridad de IA.
      ejemplo: |-
        Para empezar: claude.ai (no requiere cuenta para primeros 5 mensajes). Útil para análisis profundo de textos, ensayos, código complejo. Estilo de respuesta más reflexivo.
      emoji: "🔵"
    - termino: Alucinación de LLM
      definicion: |-
        Cuando el LLM inventa información con seguridad. Por ejemplo, te da una cita falsa, atribuye un libro a un autor equivocado, da una fecha incorrecta. Riesgo real al usar LLMs. Solución: verificar siempre.
      ejemplo: |-
        Le pides 'cita una obra de Borges sobre Cartago'. Te da un título plausible pero inexistente. Por eso el acuerdo 1: verificar siempre antes de citar como verdad.
      emoji: "💭"
    - termino: Las 5 cosas que SÍ pueden los LLMs
      definicion: |-
        Capacidades clave: (1) explicar conceptos, (2) ayudar a estructurar texto, (3) traducir, (4) resumir textos largos, (5) generar ideas (lluvia de ideas). Útiles para estudios cuando se usan con criterio.
      ejemplo: |-
        Tienes ensayo en borrador desordenado. Le pides al LLM 'sugiéreme una estructura mejor para este ensayo'. Te da plan. Tú decides si lo aplicas o no. Es asistente, no reemplazo.
      emoji: "✅"

  quiz:
    titulo: "¿Sabes usar un LLM?"
    instrucciones: "5 preguntas para verificar que dominas la primera experiencia con LLMs."
    preguntas:
      - enunciado: "¿Cuáles son los 3 LLMs más conocidos en 2026?"
        opciones:
          - "WhatsApp, Instagram, TikTok."
          - "ChatGPT (OpenAI), Claude (Anthropic), Gemini (Google)."
          - "Google, Bing, Yahoo."
          - "Word, Excel, PowerPoint."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. ChatGPT, Claude y Gemini son los 3 LLMs principales. Cada uno con su URL y estilo. WhatsApp/TikTok son apps, no LLMs.
        feedback_incorrecto: |-
          ChatGPT, Claude, Gemini son los 3 LLMs. Apps como WhatsApp/TikTok usan IA pero no son LLMs. Word/Excel son procesadores, no IA conversacional.
      - enunciado: "Le pides a un LLM 'cita una obra de Borges sobre Cartago' y te da un título. ¿Confías?"
        opciones:
          - "Sí, suena seguro."
          - "Solo si paga premium."
          - "No. Verifico en Google o biblioteca. Los LLMs alucinan títulos falsos a veces."
          - "Sí, es Borges."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Verificas siempre. Los LLMs alucinan: inventan datos con seguridad. Acuerdo 1 del uso responsable. Para citas y datos importantes, verifica en otra fuente.
        feedback_incorrecto: |-
          Verifica. Los LLMs alucinan en datos específicos: nombres, fechas, citas. Buscar en otra fuente toma 30 segundos y te ahorra citar mentiras.
      - enunciado: "Le preguntas a ChatGPT '¿quién ganó las elecciones presidenciales del año pasado?'. ¿Puede responder?"
        opciones:
          - "Depende. En versión sin acceso a internet, su conocimiento se detiene en la fecha de entrenamiento (cutoff). Versiones con búsqueda web sí pueden."
          - "Sí, sabe todo lo que pasa en el mundo."
          - "Sí, siempre."
          - "No, las IAs no saben de política."
        respuesta_index: 0
        feedback_correcto: |-
          Bien. Los LLMs gratuitos tienen 'cutoff' (fecha límite de su conocimiento). No tienen información en tiempo real salvo versiones con búsqueda web (premium o específicas).
        feedback_incorrecto: |-
          Tienen 'cutoff' (fecha límite). Versión gratuita típicamente no tiene info reciente. Las versiones con búsqueda web (algunas, premium) sí. Pregunta siempre la fecha de cutoff.
      - enunciado: "Le pides al LLM redactar un correo formal y te lo da. ¿Lo copias y envías?"
        opciones:
          - "Sí, está perfecto."
          - "Sí, ahorra tiempo."
          - "Lo envío tal cual al rector."
          - "No. Lo leo, lo adapto a mi voz, cambio detalles que no son míos. Acuerdo 5 (voz propia)."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Acuerdo 5: voz propia. El LLM da borrador; tú adaptas. Si copias tal cual, pierdes el aprendizaje y a veces se nota que no es tu voz.
        feedback_incorrecto: |-
          Adapta a tu voz. El borrador del LLM es punto de partida, no producto final. Adaptarlo te entrena en escribir bien. Copiar tal cual te quita el aprendizaje.
      - enunciado: "¿Para qué tarea SÍ es útil un LLM como ChatGPT?"
        opciones:
          - "Para calcular '6738 × 9281' con precisión exacta."
          - "Para saber qué pasa en las noticias de hoy."
          - "Para explicar conceptos difíciles, estructurar texto, traducir, resumir."
          - "Para hacer la tarea sin pensar."
        respuesta_index: 2
        feedback_correcto: |-

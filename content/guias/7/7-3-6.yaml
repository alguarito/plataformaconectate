clave: "3-6"
grado: 7
periodo: 3
sesion: 6
completo: true

titulo: "Prompting básico --- cómo hablarle a la IA para que te responda bien"
titulo_portada: |-
  Prompting
  básico ---
  cómo hablarle
  a la IA
  para que
  responda bien

producto_final: |-
  En el cuaderno: \textbf{(a) tabla de 10 prompts} (5 columnas: \emph{prompt malo} / \emph{problemas que tiene} / \emph{prompt mejorado con fórmula CTRF} / \emph{respuesta obtenida del LLM} / \emph{¿qué mejoró?}); \textbf{(b) tu fórmula CTRF anotada} (Contexto + Tarea + Restricciones + Formato) con ejemplo personal; \textbf{(c) un prompt complejo} para una tarea real que tengas que hacer esta semana. Firma + reflexión.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural del Valle del Cauca enseñaba a los niños a preguntarle bien al consejero del barrio.} \emph{``No vayan donde don Lucho con un `dígame algo' al aire''}, les decía. \emph{``Vayan con la pregunta concreta: `Don Lucho, mi papá quiere vender la finca, ¿qué debería considerar antes de decidir?' Así él les responde algo útil''}. Doña Mercedes sabía que \textbf{la calidad de la respuesta depende de la calidad de la pregunta}. Si llegabas vago, recibías consejo vago. Si llegabas específico, recibías consejo específico. Aprender a \emph{formular bien una pregunta} era habilidad que se enseñaba desde niño: \emph{``contextualicen su situación, sean claros, díganle qué necesitan exactamente''}. \textbf{Hoy con la IA pasa lo mismo}. Un \emph{prompt} (pregunta a la IA) bien formulado te da respuesta valiosa. Un prompt vago te da basura. \emph{Aprender a preguntar bien es 50\% del oficio de usar IA con criterio}.

  saber_contemporaneo: |-
    Un \textbf{prompt} es la instrucción o pregunta que le das a una IA. La habilidad de formular buenos prompts se llama \textbf{prompting} y es la habilidad más rentable del momento (incluso hay personas que trabajan como \emph{prompt engineers}, ganando muy bien). \textbf{La fórmula básica CTRF tiene 4 partes:} \textbf{(1) Contexto:} quién eres y por qué preguntas. \emph{``Soy estudiante de 7° grado en Colombia''}. \textbf{(2) Tarea:} qué quieres que haga la IA. \emph{``Explícame el teorema de Pitágoras''}. \textbf{(3) Restricciones:} cómo debe ser la respuesta. \emph{``Usa lenguaje sencillo, con un ejemplo del fútbol''}. \textbf{(4) Formato:} en qué forma. \emph{``Hazlo en 3 párrafos cortos''}. Cuando aplicas las 4 partes, transformas un prompt vago como \emph{``explícame Pitágoras''} en uno que da respuesta personalizada y útil. \textbf{Esa diferencia es la diferencia entre IA útil y IA basura}.

  pregunta_puente: |-
    Si tu profe te dice \emph{``dime algo''} sin contexto ni especifico, ¿\textbf{qué le respondes}? ¿Y si te dice \emph{``cuéntame 3 cosas que aprendiste hoy en clase de mate''}? La diferencia es prompting --- así pasa también con la IA.

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} prompts buenos vs malos; (2) sabrás \textbf{aplicar} la fórmula CTRF (Contexto + Tarea + Restricciones + Formato); (3) podrás \textbf{evaluar} la mejora entre un prompt antes y uno después; (4) habrás \textbf{creado} 10 prompts mejorados probados con un LLM real.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: distingues prompts buenos vs malos, aprendes la fórmula CTRF, mejoras 10 prompts, los pruebas con LLM.
  a_escuta: |-
    Empezamos analizando 6 prompts (3 buenos, 3 malos) para reconocer la diferencia.
  a_sistematizacion: |-
    Después aprendes la fórmula CTRF en detalle.
  a_praxis: |-
    Con todo claro, mejoras 10 prompts tuyos y los pruebas con un LLM.
  a_producto: |-
    El producto es la tabla de 10 prompts + fórmula CTRF + reflexión.
  a_evaluacion: |-
    Antes de salir, verifica que tus prompts mejorados contienen las 4 partes.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué la calidad de la pregunta determina la calidad de la respuesta.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 6 prompts: ¿bueno o malo?} (10 min · individual). Lee estos 6 prompts y marca en el cuaderno BUENO (B) o MALO (M), con 1 línea explicando por qué. \emph{(1) ``Dime algo''}. \emph{(2) ``Soy estudiante de 7° grado. Necesito que me expliques el ciclo del agua para una tarea de Ciencias. Quiero la explicación en lenguaje sencillo, con un ejemplo del río Cauca, en 3 párrafos''}. \emph{(3) ``Bolívar''}. \emph{(4) ``Soy estudiante en Colombia. Hazme un resumen de los 5 logros más importantes de Simón Bolívar para América Latina, en máximo 200 palabras''}. \emph{(5) ``Ayúdame''}. \emph{(6) ``Soy estudiante de 7° grado. Quiero un correo formal al rector pidiéndole permiso para ir al baño durante un examen. 4 líneas máximo, con saludo y despedida formal''}.

  checks:
  - Leí los 6 prompts.
  - Marqué B o M en cada uno.
  - Identifiqué por qué los malos son malos.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 6 prompts: bueno o malo». \textbf{Formato:} lista numerada con B/M + 1 línea de explicación. \textbf{Extensión:} 6 líneas. \textbf{Sabes que terminaste cuando} reconoces que los buenos tienen contexto + tarea + restricciones + formato.

sistematizacion:
  intro: |-
    Los 6 prompts se distinguen por una cosa: los buenos tienen \textbf{la fórmula CTRF aplicada}. Ahora aprende la fórmula en detalle + cómo aplicarla.

  pilares:
  - |-
    \textbf{Parte 1 de CTRF --- CONTEXTO.} Dile a la IA quién eres y por qué preguntas. \emph{Ejemplos buenos:} \emph{``Soy estudiante de 7° grado en Colombia''}; \emph{``Soy profesora de matemáticas en secundaria''}; \emph{``Tengo 12 años y vivo en Cartago, Valle del Cauca''}. \textbf{¿Por qué importa?} La IA adapta el tono y la profundidad según tu contexto. Sin contexto, te responde como si fueras adulto experto (puede ser muy técnico). \textbf{Parte 2 --- TAREA.} Qué quieres que haga, con verbo claro al inicio. \emph{Ejemplos:} \emph{``Explícame...''}, \emph{``Resúmeme...''}, \emph{``Tradúceme...''}, \emph{``Compárame...''}, \emph{``Lista 5 ideas para...''}. \textbf{Sin tarea, la IA no sabe qué quieres}.
  - |-
    \textbf{Parte 3 --- RESTRICCIONES.} Cómo debe ser la respuesta. \emph{Restricciones comunes:} \emph{lenguaje sencillo / nivel para 7° grado / con un ejemplo del Valle del Cauca / sin jerga técnica / contextualizado a Colombia / con palabras simples}. \textbf{Sin restricciones, la respuesta puede ser muy genérica o demasiado avanzada}. \textbf{Parte 4 --- FORMATO.} En qué forma quieres la respuesta. \emph{Formatos comunes:} \emph{en 3 párrafos / en lista numerada / en tabla / en máximo 200 palabras / como un correo formal con saludo y despedida / como un resumen con bullets}. \textbf{El formato hace la respuesta usable directamente}.
  - |-
    \textbf{Aplicación de CTRF: un prompt completo.} \emph{Prompt malo:} \emph{``Pitágoras''}. \emph{Prompt CTRF aplicado:} \emph{``[CONTEXTO] Soy estudiante de 7° grado en Cartago, Valle del Cauca. [TAREA] Explícame el teorema de Pitágoras. [RESTRICCIONES] Usa lenguaje sencillo, con un ejemplo del fútbol o de algo cotidiano. [FORMATO] En 3 párrafos cortos, máximo 150 palabras''}. Compara las 2 versiones: el segundo le dice al LLM EXACTAMENTE qué hacer.
  - |-
    \textbf{La técnica de iteración.} A veces el primer prompt no da respuesta perfecta. La técnica adulta: \textbf{itera}. \emph{Si la respuesta es muy larga:} \emph{``Resúmela en 3 líneas''}. \emph{Si es muy técnica:} \emph{``Explícame eso como si fuera para un niño de 10''}. \emph{Si falta ejemplo:} \emph{``Dame un ejemplo concreto del Valle del Cauca''}. La conversación con LLM es ida y vuelta, no monólogo. Quien itera obtiene respuestas mejores que quien acepta la primera.

  anatomia:
    titulo: Fórmula CTRF + iteración
    body: |-
      \textbf{CTRF:} \\[1mm]
      \textbf{C} - CONTEXTO: quién eres, por qué preguntas. \\[1mm]
      \textbf{T} - TAREA: qué quieres que haga (verbo claro). \\[1mm]
      \textbf{R} - RESTRICCIONES: cómo debe ser la respuesta. \\[1mm]
      \textbf{F} - FORMATO: en qué forma. \\[1mm]
      \textbf{Iteración:} si no es perfecta, pide ajustes (más corto, más simple, con ejemplo).

  errores_comunes: |-
    \textbf{Errores frecuentes al hacer prompts.} (1) \emph{Prompt de 1-2 palabras:} \emph{``Bolívar''}. La IA no sabe qué quieres. (2) \emph{Sin contexto:} la IA asume que eres experto y te responde técnico. (3) \emph{Sin restricciones:} respuesta genérica. (4) \emph{Sin formato:} respuesta en bloque difícil de usar. (5) \emph{Aceptar primera respuesta sin iterar:} pierdes la oportunidad de afinar. (6) \emph{Querer respuesta perfecta de primer intento:} usualmente toma 2-3 iteraciones.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Fórmula CTRF». \textbf{Formato:} 4 bloques (C, T, R, F) con 1 ejemplo de cada uno + ejemplo de prompt completo CTRF aplicado. \textbf{Extensión:} 10 líneas. \textbf{Sabes que terminaste cuando} podrías escribir un prompt CTRF en 30 segundos para cualquier necesidad.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- 10 prompts mejorados probados con LLM} (32 min · individual). Vas a tomar 10 prompts vagos y mejorarlos con CTRF. Después pruebas al menos 5 en un LLM real y comparas resultados.

  pilares:
  - |-
    \textbf{Paso 1 --- Tabla de 10 prompts.} En una hoja del cuaderno, dibuja tabla de \textbf{10 filas y 5 columnas}. Columnas: \emph{(1) Prompt original (malo)}, \emph{(2) Problemas que tiene}, \emph{(3) Prompt mejorado con CTRF}, \emph{(4) Respuesta del LLM (resumen)}, \emph{(5) ¿Qué mejoró?}.
  - |-
    \textbf{Paso 2 --- Llena columna 1 con 10 prompts originales (malos).} Inventa o copia de tu cabeza. Sugerencias: \emph{(1) ``Bolívar''}, \emph{(2) ``Pitágoras''}, \emph{(3) ``Cuéntame de Cartago''}, \emph{(4) ``Recomiéndame libros''}, \emph{(5) ``Corrígeme este texto''}, \emph{(6) ``Hazme una tarea''}, \emph{(7) ``Tradúcelo''}, \emph{(8) ``Explícame internet''}, \emph{(9) ``Hazme un poema''}, \emph{(10) ``Tabla periódica''}.
  - |-
    \textbf{Paso 3 --- Columna 2: problemas.} Para cada prompt malo, anota en 1 línea qué falta: \emph{``Falta contexto y tarea específica''}, \emph{``No dice formato ni nivel''}, etc. Esto te entrena la mente en detectar los huecos.
  - |-
    \textbf{Paso 4 --- Columna 3: prompts mejorados con CTRF.} Reescribe cada uno aplicando la fórmula. Ejemplo para el (1): \emph{``Soy estudiante de 7° grado en Colombia (C). Resúmeme los 3 logros principales de Simón Bolívar (T). Usa lenguaje sencillo, contextualizado a un colombiano (R). Hazlo en máximo 100 palabras (F)''}.
  - |-
    \textbf{Paso 5 --- Pruebalos con un LLM (mínimo 5 de los 10).} Abre el LLM que usaste en S5. Para cada uno de los 5 prompts mejorados que escojas, copia el prompt completo y envíalo. Anota en columna 4 el resumen de la respuesta (3-4 líneas). En columna 5 anota: \emph{¿qué mejoró comparado con el prompt malo?}. Verás la diferencia clara.
  - |-
    \textbf{Paso 6 --- Reflexión + 1 prompt complejo + firma.} Al final escribe: \emph{``La regla CTRF que más me costó aplicar fue \_\_\_. Mi prompt mejorado favorito es \_\_\_ porque \_\_\_''}. Después escribe 1 prompt CTRF complejo para una tarea real que tengas que hacer esta semana. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S6
    items: |-
      \checkbox La tabla tiene 10 prompts con sus 5 columnas. \\[1mm]
      \checkbox Cada prompt mejorado tiene las 4 partes de CTRF. \\[1mm]
      \checkbox Probé mínimo 5 prompts con un LLM real. \\[1mm]
      \checkbox Comparé respuesta antes/después en columna 5. \\[1mm]
      \checkbox Tengo 1 prompt complejo para una tarea real. \\[1mm]
      \checkbox La reflexión está firmada.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} tabla 10 × 5. \textit{Paso 2:} 10 prompts originales. \textit{Paso 3:} problemas. \textit{Paso 4:} CTRF aplicado. \textit{Paso 5:} pruebas con LLM. \textit{Paso 6:} reflexión + prompt para tarea real + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- 10 prompts mejorados con CTRF». \textbf{Formato:} tabla 10x5 + reflexión + prompt para tarea real. \textbf{Extensión:} 1 página y media. \textbf{Sabes que terminaste cuando} puedes escribir cualquier prompt en formato CTRF.

  producto_titulo: 10 prompts mejorados con CTRF · probados con LLM · firmado
  criterios:
  - La tabla tiene 10 prompts con sus 5 columnas completas.
  - Cada prompt mejorado tiene las 4 partes de CTRF identificables.
  - Probé mínimo 5 con un LLM real.
  - Hay análisis comparativo de antes/después.
  - Hay 1 prompt para tarea real esta semana.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la palabra precisa)"
    cita: |-
      ``Quien sabe formular bien una pregunta, tiene la mitad de la respuesta. La palabra precisa es semilla de pensamiento claro.''
    aplicacion: |-
      \textbf{La habilidad de preguntar bien no es nueva}: doña Mercedes la enseñaba en la vereda La Plata. Los abogados la aprenden en su carrera. Los médicos en sus consultas. Los periodistas en sus entrevistas. \emph{Tú la aprendes con la IA, pero te servirá para toda la vida con humanos también}. Quien aprende prompting profundamente aprende también \emph{a pensar con precisión}, lo cual es virtud universal.
    pregunta_espejo: |-
      ¿Estoy aprendiendo solo a hablar con IA, o también a pensar con más precisión en todas mis conversaciones?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Pregunta lo que necesitas saber, no lo que crees que debes preguntar. La diferencia es respeto por tu propio tiempo y el del que responde.''
    aplicacion: |-
      \textbf{Mucha gente pregunta lo que ``debería preguntar''} (para parecer culta, para no ofender) en lugar de \emph{lo que realmente necesita saber}. Los LLMs no juzgan: pregunta lo específico. Si necesitas saber qué hacer con tu mamá que se enojó, pregúntalo. Si necesitas ayuda con álgebra de 7°, pídelo en ese nivel. \emph{La autenticidad en el prompt da autenticidad en la respuesta}.
    pregunta_espejo: |-
      ¿Pregunto lo que realmente necesito o lo que creo que ``está bien preguntar''?

  floridi:
    autor: "Luciano Floridi (filósofo italiano del prompting como nueva habilidad)"
    cita: |-
      ``El prompting es la habilidad alfabetizada del siglo XXI. Quien sabe pedir bien, obtiene mucho. Quien no, queda con respuestas pobres.''
    aplicacion: |-
      \textbf{En 2030, saber prompting bien será como hoy saber buscar en Google}: habilidad básica del ciudadano digital. Tu generación llega en momento clave: las apps con IA conversacional se vuelven ubicuas. \emph{Aprender prompting con criterio en grado 7 te coloca en ventaja sobre adultos que recién están empezando}. No es exagerar: tus padres probablemente todavía no dominan esto. Tú sí lo harás.
    pregunta_espejo: |-
      ¿Estoy entrenando una habilidad que en 5 años me dará ventaja real, o me limito a usar IA como entretenimiento?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, antes de cualquier prompt, piensa CTRF mentalmente. Verás que tus respuestas mejoran de inmediato. La próxima clase aprendes \textbf{prompting avanzado}: técnicas como roles, few-shot, chain-of-thought. Vas a llevar tu prompting al nivel siguiente.

web:
  conceptos_clave:
    - termino: Prompt
      definicion: |-
        Instrucción o pregunta que le das a una IA. La calidad del prompt determina la calidad de la respuesta. Aprender a hacer buenos prompts se llama 'prompting'.
      ejemplo: |-
        Prompt malo: 'Bolívar'. Prompt bueno: 'Soy estudiante de 7° grado. Resúmeme los 3 logros principales de Bolívar en máximo 100 palabras con lenguaje sencillo.'
      emoji: "❓"
    - termino: CTRF (fórmula del prompt)
      definicion: |-
        Las 4 partes de un buen prompt: Contexto (quién eres), Tarea (qué quieres), Restricciones (cómo debe ser), Formato (en qué forma). Aplicar CTRF transforma prompts vagos en prompts útiles.
      ejemplo: |-
        Prompt CTRF: 'Soy estudiante de 7° (C). Explícame Pitágoras (T). Con lenguaje sencillo y ejemplo de fútbol (R). En 3 párrafos cortos (F).' Las 4 partes claras.
      emoji: "📋"
    - termino: Iteración del prompt
      definicion: |-
        Técnica de afinar la respuesta del LLM pidiendo ajustes. Si es muy larga: 'resúmela'. Si es técnica: 'explícame más simple'. Si falta ejemplo: 'dame un ejemplo del Valle'. La conversación es ida y vuelta.
      ejemplo: |-
        Primer prompt: te da respuesta genérica. Iteración: 'Hazlo más corto y con ejemplo del fútbol'. El LLM ajusta. 2-3 iteraciones suelen dar respuesta excelente.
      emoji: "🔄"
    - termino: Prompt engineer
      definicion: |-
        Profesional que diseña y refina prompts para obtener mejores resultados de las IAs. Es una de las profesiones más nuevas. Gana muy bien por la escasez de personas que dominan la habilidad.
      ejemplo: |-
        Empresas pagan $100K+ al año por prompt engineers que les ayudan a usar IA para análisis, marketing, código. Tu generación puede prepararse para esta carrera desde 7° grado.
      emoji: "🛠️"
    - termino: Calidad de la pregunta
      definicion: |-
        Principio universal: la calidad de la respuesta depende de la calidad de la pregunta. Aplica a IA, a humanos, a investigación. Por eso aprender prompting entrena pensamiento crítico general.
      ejemplo: |-
        Le preguntas vago al médico: 'me siento mal'. Te da consejo genérico. Le preguntas específico: 'tengo dolor de cabeza por 3 días con luz brillante'. Te da diagnóstico mejor. Mismo principio.
      emoji: "💎"

  quiz:
    titulo: "¿Sabes hacer buenos prompts?"
    instrucciones: "5 preguntas para verificar que dominas CTRF y la iteración."
    preguntas:
      - enunciado: "¿Cuál es la fórmula CTRF para un buen prompt?"
        opciones:
          - "Calma, Tiempo, Riesgo, Final."
          - "Contexto + Tarea + Restricciones + Formato."
          - "Compras, Tarjeta, Recibo, Factura."
          - "Carros, Tiempo, Rifa, Familia."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. CTRF: Contexto (quién eres) + Tarea (qué quieres) + Restricciones (cómo debe ser) + Formato (en qué forma). Aplica los 4 y tus prompts dan respuestas útiles.
        feedback_incorrecto: |-
          CTRF = Contexto + Tarea + Restricciones + Formato. Los 4 elementos transforman prompts vagos en prompts útiles. Memoriza la sigla.
      - enunciado: "Tu prompt es 'Bolívar'. ¿Qué le falta según CTRF?"
        opciones:
          - "Nada, está bien."
          - "Solo el formato."
          - "Todo: contexto, tarea específica, restricciones, formato."
          - "Solo el contexto."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. 'Bolívar' es prompt de 1 palabra. Falta TODO: no dice quién eres, qué quieres saber, cómo debe responder, en qué formato. Es prompt basura.
        feedback_incorrecto: |-
          Le faltan las 4 partes de CTRF. 'Bolívar' es palabra sola sin contexto, tarea, restricciones ni formato. Necesita los 4 para ser útil.
      - enunciado: "Recibes una respuesta del LLM muy larga. ¿Qué haces?"
        opciones:
          - "Itero: pido 'resúmela en 3 puntos' o 'hazla más corta'."
          - "La acepto tal cual."
          - "Cierro el chat."
          - "Le pago más al LLM."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Iteración: pides ajustes. La conversación es ida y vuelta. 2-3 iteraciones suelen dar respuesta excelente. Aceptar la primera sin pensar es perderse el oficio del prompting.
        feedback_incorrecto: |-
          Iteras. Pides ajustes: 'más corta', 'con ejemplo', 'más simple'. La conversación es ida y vuelta. Quien itera obtiene respuestas mejores que quien acepta la primera.
      - enunciado: "Eres estudiante de 7°. ¿Qué prompt funciona mejor?"
        opciones:
          - "'Hazme la tarea de ciencias'."
          - "'Tarea de ciencias por favor'."
          - "'Ciencia'."
          - "'Soy estudiante de 7° en Colombia. Explícame el ciclo del agua con ejemplo del río Cauca, en 3 párrafos sencillos. No me hagas la tarea, ayúdame a entender'."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. CTRF aplicado completo + acuerdo ético (no me hagas la tarea, ayúdame a entender). Es prompt de profesional. Las respuestas que da son útiles y respetan tu aprendizaje.
        feedback_incorrecto: |-
          CTRF completo + ética. Contexto (estudiante 7°), Tarea (explicar ciclo del agua), Restricciones (ejemplo Cauca, sencillo), Formato (3 párrafos). + acuerdo ético de no hacer la tarea por ti.
      - enunciado: "Sin aprender prompting, ¿cómo será tu uso de IA en 5 años?"
        opciones:
          - "Igual que con prompting."
          - "Mejor sin prompting."
          - "Limitado: recibirás respuestas pobres porque no sabrás formularlas bien. Como buscar en Google sin saber qué palabras usar."
          - "No habrá IA en 5 años."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Sin prompting, respuestas pobres. Como usar Google sin saber qué buscar. Aprender prompting en 7° te da años de ventaja sobre adultos que apenas empiezan.
        feedback_incorrecto: |-
          Sin prompting recibes basura. Quien sabe formular preguntas, obtiene oro. Quien no, recibe respuestas pobres y genéricas. Es habilidad clave del siglo XXI.

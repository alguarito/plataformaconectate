clave: "3-7"
grado: 7
periodo: 3
sesion: 7
completo: true

titulo: "Prompting avanzado --- técnicas que diferencian al usuario experto"
titulo_portada: |-
  Prompting
  avanzado ---
  técnicas que
  diferencian
  al experto

producto_final: |-
  En el cuaderno: \textbf{(a) tabla de las 4 técnicas avanzadas} con definición, cuándo usarla, ejemplo; \textbf{(b) 5 prompts complejos} aplicando técnicas combinadas (mínimo 2 técnicas por prompt); \textbf{(c) prueba real} de los 5 prompts en un LLM con la respuesta obtenida; \textbf{(d) tu evaluación} de cuál técnica fue más útil. Firma + reflexión personal.

apertura:
  saber_ancestral: |-
    \textbf{Don Lucho el relojero del Valle del Cauca tenía un truco para enseñar a sus aprendices a reparar relojes.} Cuando uno de ellos --- digamos un muchacho de 14 años de la vereda --- llegaba con un reloj averiado, don Lucho NO le decía: \emph{``arréglalo''}. Le decía: \emph{``imagínate que tú eres yo. ¿Qué harías primero? ¿Por qué? Explícame paso a paso''}. El aprendiz pensaba en voz alta y don Lucho lo corregía suavemente. \textbf{Después de 2 años, el aprendiz hacía esa misma reflexión solo}: se hablaba a sí mismo como si fuera don Lucho. Esa técnica antigua --- \emph{adoptar el rol de un experto, pensar en voz alta, mostrar tus pasos} --- es exactamente lo que en prompting moderno se llama \textbf{chain-of-thought} y \textbf{role prompting}. Las técnicas avanzadas no son inventos de Silicon Valley: son sabidurías pedagógicas antiguas \emph{trasladadas a conversaciones con IA}.

  saber_contemporaneo: |-
    \textbf{El prompting avanzado} usa técnicas que afinan las respuestas del LLM mucho más allá de la fórmula CTRF básica. Las \textbf{4 técnicas más útiles para 7° grado:} \textbf{(1) Role Prompting} (asignar un rol): \emph{``Actúa como un profesor de matemáticas paciente que enseña a niños de 12 años''}. \textbf{(2) Few-shot} (dar ejemplos): \emph{``Te muestro 2 ejemplos de cómo quiero que respondas, después tú haces el 3°''}. \textbf{(3) Chain-of-Thought} (pensar en voz alta): \emph{``Resuelve este problema mostrando todos los pasos de tu razonamiento, no solo la respuesta final''}. \textbf{(4) Iteración explícita} (pedir mejoras): \emph{``Primero hazlo así. Después dime cómo mejorarlo. Después implementa la mejora''}. \textbf{Estas técnicas se pueden combinar}: \emph{Role + Chain-of-Thought = pídele que actúe como experto Y muestre su razonamiento}. La combinación es donde está la verdadera magia del prompting avanzado.

  pregunta_puente: |-
    Si le pides a ChatGPT \emph{``actúa como un profesor estricto de matemáticas y resuelve este problema mostrando todos los pasos''}, ¿\textbf{cómo crees que cambia} la respuesta vs simplemente preguntar el problema?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} las 4 técnicas avanzadas; (2) sabrás \textbf{aplicar} cada una a una situación; (3) podrás \textbf{combinar} 2 o más técnicas en un mismo prompt; (4) habrás \textbf{creado} 5 prompts complejos y probados con LLM.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: descubres 4 técnicas avanzadas, las aplicas a ejemplos, las combinas, las pruebas.
  a_escuta: |-
    Empezamos viendo cómo cambia la respuesta del LLM con técnica vs sin técnica.
  a_sistematizacion: |-
    Después aprendes las 4 técnicas con ejemplos detallados.
  a_praxis: |-
    Con todo claro, creas 5 prompts complejos y los pruebas.
  a_producto: |-
    El producto son los 5 prompts probados + tabla + evaluación.
  a_evaluacion: |-
    Antes de salir, evalúa cuál técnica funcionó mejor para qué tipo de tarea.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué el prompting es habilidad nueva clave.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Compara 2 versiones de un prompt} (10 min · individual). Lee estos 2 prompts y en el cuaderno responde \emph{¿cuál crees que dará mejor respuesta? ¿Por qué?}. \textbf{Versión A (CTRF básico):} \emph{``Soy estudiante de 7°. Resuelve este problema: si Pedro tiene 24 manzanas y reparte la cuarta parte a 4 amigos, ¿cuántas le quedan? Hazlo paso a paso''}. \textbf{Versión B (con técnicas avanzadas):} \emph{``Actúa como un profesor paciente de matemáticas de secundaria (role). Resuelve este problema mostrando TODOS los pasos de tu razonamiento, como si lo estuvieras enseñando a un niño que no entiende muy bien (chain-of-thought): si Pedro tiene 24 manzanas y reparte la cuarta parte a 4 amigos, ¿cuántas le quedan? Después de resolverlo, explícame también qué propiedad matemática usé y dame un ejercicio parecido para practicar (iteración explícita)''}.

  checks:
  - Leí las 2 versiones con calma.
  - Identifiqué cuál tiene técnicas avanzadas.
  - Predigo que B dará mejor respuesta porque es más completa.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- A vs B: con y sin técnicas». \textbf{Formato:} respuesta corta sobre cuál mejor y por qué. \textbf{Extensión:} 4 líneas. \textbf{Sabes que terminaste cuando} reconoces que B tiene rol + chain-of-thought + iteración explícita.

sistematizacion:
  intro: |-
    La versión B sería mejor porque combina 3 técnicas. Ahora aprende las \textbf{4 técnicas avanzadas} a fondo y cuándo usar cada una.

  pilares:
  - |-
    \textbf{Técnica 1 --- Role Prompting (asignar un rol).} Le dices a la IA que actúe como X experto. \emph{Ejemplos:} \emph{``Actúa como un médico explicando a un paciente''}, \emph{``Actúa como un poeta del siglo XIX''}, \emph{``Actúa como un programador de Python''}. \textbf{¿Por qué funciona?} El LLM ajusta tono, vocabulario y profundidad según el rol. \emph{Útil para}: explicaciones técnicas, escritura creativa, simulaciones. \emph{Cuidado}: no le pidas que actúe como persona real (puede inventar datos atribuidos a esa persona).
  - |-
    \textbf{Técnica 2 --- Few-shot (dar ejemplos).} Le muestras 1-3 ejemplos de cómo quieres que responda, después le pides que haga uno nuevo siguiendo el patrón. \emph{Ejemplo}: \emph{``Te muestro 2 ejemplos de cómo quiero que clasifiques canciones. Ejemplo 1: 'La gota fría' = vallenato. Ejemplo 2: 'Despacito' = reggaetón. Ahora clasifica: 'La vida es un carnaval'''}. \textbf{¿Por qué funciona?} El LLM aprende el patrón de los ejemplos y lo aplica. \emph{Útil para}: tareas con formato específico, clasificaciones, traducciones especiales.
  - |-
    \textbf{Técnica 3 --- Chain-of-Thought (pensar en voz alta).} Le pides que muestre el razonamiento paso a paso, no solo la respuesta final. \emph{Ejemplo}: \emph{``Resuelve este problema mostrando TODOS los pasos de tu razonamiento, como si me estuvieras enseñando''}. \textbf{¿Por qué funciona?} El LLM se ``obliga'' a pensar antes de responder. Las respuestas son más precisas (especialmente en matemáticas, lógica, análisis). \emph{Útil para}: problemas de matemáticas, ejercicios de lógica, análisis complejos.
  - |-
    \textbf{Técnica 4 --- Iteración explícita (pedir mejoras).} En lugar de aceptar la primera respuesta, le pides al LLM que se autocritique y mejore. \emph{Ejemplo}: \emph{``Primero respóndeme. Después dime cuáles son los 3 puntos débiles de tu respuesta. Después dame una versión mejorada que aborde esos puntos''}. \textbf{¿Por qué funciona?} El LLM hace ``autoevaluación'' y produce versión más sólida. Genera respuestas que normalmente requerirían 3-4 mensajes en 1 solo. \emph{Útil para}: ensayos, decisiones importantes, planes complejos. \textbf{Combinaciones poderosas:} \emph{Role + Chain-of-Thought}: experto pensando en voz alta. \emph{Few-shot + Iteración}: ejemplos + autocrítica. \emph{Role + Few-shot}: experto siguiendo formato específico.

  anatomia:
    titulo: 4 técnicas avanzadas + combinaciones
    body: |-
      \textbf{4 técnicas:} \\[1mm]
      \textbf{1.} ROLE: actúa como [experto]. \\[1mm]
      \textbf{2.} FEW-SHOT: te doy ejemplos, sigue el patrón. \\[1mm]
      \textbf{3.} CHAIN-OF-THOUGHT: muestra todos los pasos. \\[1mm]
      \textbf{4.} ITERACIÓN EXPLÍCITA: dame respuesta, critícala, mejórala. \\[1mm]
      \textbf{Combinaciones poderosas:} Role + CoT · Few-shot + Iteración · Role + Few-shot.

  errores_comunes: |-
    \textbf{Errores frecuentes al usar técnicas avanzadas.} (1) \emph{Usar demasiadas técnicas a la vez:} prompt de 500 palabras es contraproducente. Combina 2-3 máximo. (2) \emph{Role inadecuado:} pedir que actúe como una persona real, como un dios, como algo imposible. La IA puede inventar. (3) \emph{Few-shot con malos ejemplos:} si los ejemplos son malos, el resultado también. (4) \emph{Chain-of-Thought esperando que la IA tenga razón siempre:} muestra pasos, pero verifica las matemáticas. (5) \emph{Iteración sin paciencia:} si pides ``mejóralo'' 10 veces seguidas, las mejoras se vuelven cosméticas.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Qué técnica de prompting es la mejor para cada tarea». \textbf{Formato:} tabla de 4 filas, 3 columnas (técnica, cuándo usarla, ejemplo). + 3 combinaciones poderosas. \textbf{Veredicto (3 tareas):} para estas 3 tareas decide qué técnica (o combinación) usarías y justifica con 1 razón: (1) resolver un problema de física paso a paso; (2) imitar el estilo de redacción de tu profe favorito; (3) generar 5 variantes de un correo sin sonar a IA. \textbf{Extensión:} 7 líneas + veredicto. \textbf{Sabes que terminaste cuando} puedes recomendar la técnica correcta para cualquier tarea sin titubear.

praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- 5 prompts complejos con técnicas combinadas} (32 min · individual). Vas a crear 5 prompts complejos aplicando 2+ técnicas y probarlos con un LLM real.

  pilares:
  - |-
    \textbf{Paso 1 --- Plan de los 5 prompts.} En el cuaderno escribe 5 temas (cosas reales que quieras consultar). Sugerencias: \emph{(1) Resolver un problema de mate con explicación}; \emph{(2) Pedir consejo sobre cómo estudiar para examen}; \emph{(3) Recibir crítica constructiva sobre algo que escribiste}; \emph{(4) Aprender un concepto científico desde 2 ángulos}; \emph{(5) Planear una sorpresa para alguien}.
  - |-
    \textbf{Paso 2 --- Diseña los 5 prompts combinando técnicas.} Para cada uno, escribe el prompt completo con CTRF + 2 técnicas avanzadas. \emph{Ejemplo para Prompt 1}: \emph{``Soy estudiante de 7° en Colombia (C). Actúa como un profesor paciente de matemáticas (Role) y resuelve este problema mostrando TODOS los pasos del razonamiento (Chain-of-Thought): [problema]. Después del razonamiento, dame 2 errores típicos que los estudiantes cometen al resolver problemas así (R + F)''}. Aplica creatividad.
  - |-
    \textbf{Paso 3 --- Tabla en el cuaderno.} Tabla de \textbf{5 filas y 4 columnas}: \emph{(1) Tema del prompt}, \emph{(2) Prompt completo}, \emph{(3) Técnicas usadas}, \emph{(4) Resultado obtenido (resumen)}. Llena las columnas 1, 2 y 3.
  - |-
    \textbf{Paso 4 --- Prueba los 5 prompts en un LLM.} Abre el LLM (Claude, ChatGPT, Gemini). Copia cada prompt completo. Lee la respuesta. Anota en columna 4 un resumen de lo que el LLM produjo.
  - |-
    \textbf{Paso 5 --- Evalúa cuál técnica fue más útil.} Debajo de la tabla, escribe: \emph{``La técnica que más me sirvió fue \_\_\_ porque \_\_\_. La que menos me convenció fue \_\_\_ porque \_\_\_. La combinación que más me gustó fue \_\_\_''}. Sé honesto, no copies.
  - |-
    \textbf{Paso 6 --- Reflexión final + firma.} Escribe: \emph{``Lo que diferencia mis prompts de antes (S6) y los de hoy es \_\_\_. Si tuviera que enseñarle prompting a un amigo, le diría que empiece por \_\_\_''}. Firma con nombre y fecha.

  checklist:
    titulo: Antes de cerrar la S7
    items: |-
      \checkbox La tabla tiene 5 prompts complejos completos. \\[1mm]
      \checkbox Cada prompt aplica mínimo 2 técnicas avanzadas. \\[1mm]
      \checkbox Probé los 5 prompts en un LLM real. \\[1mm]
      \checkbox Anoté resumen de las 5 respuestas. \\[1mm]
      \checkbox Hay evaluación de cuál técnica fue más útil. \\[1mm]
      \checkbox La reflexión final está firmada.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} 5 temas. \textit{Paso 2:} diseñar 5 prompts con técnicas combinadas. \textit{Paso 3:} tabla 5x4. \textit{Paso 4:} probar en LLM. \textit{Paso 5:} evaluar técnicas. \textit{Paso 6:} reflexión + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- 5 prompts complejos con técnicas combinadas». \textbf{Formato:} tabla 5x4 + evaluación + reflexión. \textbf{Extensión:} 1 página y media. \textbf{Sabes que terminaste cuando} eres usuario avanzado de prompting.

  producto_titulo: 5 prompts complejos con técnicas combinadas · probados con LLM · evaluados · firmado
  criterios:
  - Hay 5 prompts complejos completos.
  - Cada prompt aplica mínimo 2 técnicas avanzadas.
  - Los 5 fueron probados con un LLM real.
  - Hay evaluación de cuál técnica fue más útil.
  - Hay reflexión final personal firmada.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del oficio refinado)"
    cita: |-
      ``El que pasa de aficionado a artesano lo hace combinando técnicas. La calidad nace de la combinación, no de la adición.''
    aplicacion: |-
      Don Lucho el relojero no era bueno solo por usar herramientas: era bueno por \textbf{combinarlas con criterio}. Lupa + paciencia + delicadeza + experiencia. \emph{Lo mismo con prompting: las técnicas individuales son herramientas; la combinación con criterio es oficio}. Hoy diste el paso de aficionado (CTRF básico) a aprendiz de artesano (combinación de técnicas). El oficio sigue por años más, pero ya entraste al taller.
    pregunta_espejo: |-
      ¿Estoy combinando las herramientas con criterio, o usándolas una por una sin pensar?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``El sabio no se conforma con saber lo básico. Profundiza hasta dominar las sutilezas. Ahí está la diferencia con los demás.''
    aplicacion: |-
      Mucha gente aprende solo CTRF básico (la S6) y se conforma. \textbf{Tú aprendes técnicas avanzadas (S7)}: te coloca en grupo más pequeño de personas que dominan prompting. \emph{Esa profundización en lo que aprendes es disciplina antigua}: \emph{no satisfacerse con lo básico cuando hay más por aprender}. La sutileza es donde está la maestría.
    pregunta_espejo: |-
      ¿En qué áreas de mi vida me conformo con lo básico cuando podría profundizar?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de las habilidades emergentes)"
    cita: |-
      ``Las habilidades que valen oro en 2030 son las que pocos dominan en 2026. El prompting avanzado es una de ellas.''
    aplicacion: |-
      \textbf{En 2030, las personas que dominen prompting avanzado tendrán ventaja en universidad y trabajo}. Hoy son pocos los que saben combinar Role + Chain-of-Thought con criterio. Tú lo aprendiste en grado 7. \emph{Esa diferencia se acumula con los años}. Mientras tus pares descubren CTRF básico a los 20, tú ya estarás en niveles más avanzados.
    pregunta_espejo: |-
      ¿Estoy aprovechando este momento clave para construir habilidades que pocos tendrán?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, usa al menos 1 técnica avanzada en cada conversación con LLM. La próxima clase aprendes \textbf{ética de la IA}: sesgo, privacidad, derechos de autor, deepfakes. Es la otra cara fundamental del uso responsable.

web:
  conceptos_clave:
    - termino: Prompting avanzado
      definicion: |-
        Conjunto de técnicas para afinar respuestas de LLMs más allá del CTRF básico. Las 4 principales: role prompting, few-shot, chain-of-thought, iteración explícita. Su combinación produce respuestas mucho mejores.
      ejemplo: |-
        Prompt básico: 'Resuelve este problema'. Prompt avanzado: 'Actúa como profesor paciente (role) y muestra todos los pasos (chain-of-thought) de cómo resolver: [problema]. Después dame 2 errores típicos (iteración)'.
      emoji: "🎯"
    - termino: Role Prompting
      definicion: |-
        Técnica de asignar un rol a la IA: 'Actúa como [experto]'. El LLM ajusta tono, vocabulario y profundidad según el rol. Útil para explicaciones técnicas, escritura creativa, simulaciones.
      ejemplo: |-
        'Actúa como un profesor paciente que enseña a niños de 12 años'. La IA usa lenguaje sencillo. 'Actúa como un poeta del siglo XIX'. La IA escribe con estilo más antiguo.
      emoji: "🎭"
    - termino: Few-shot
      definicion: |-
        Técnica de dar ejemplos al LLM para que aprenda el patrón. Le muestras 1-3 ejemplos y pides que aplique el patrón a un caso nuevo. Útil para tareas con formato específico o clasificaciones.
      ejemplo: |-
        'Te doy ejemplos: Ejemplo 1: 'La gota fría' = vallenato. Ejemplo 2: 'Despacito' = reggaetón. Ahora clasifica: 'La vida es un carnaval''. El LLM sigue el patrón aprendido.
      emoji: "📚"
    - termino: Chain-of-Thought
      definicion: |-
        Técnica de pedir al LLM que muestre el razonamiento paso a paso, no solo la respuesta final. Las respuestas son más precisas en matemáticas, lógica y análisis. Aprovecha la 'capacidad de pensar en voz alta' del LLM.
      ejemplo: |-
        En lugar de '¿Cuánto es 35% de 240?' (solo respuesta), 'Resuelve mostrando TODOS los pasos: ¿cuánto es 35% de 240?'. El LLM razona y comete menos errores.
      emoji: "🧠"
    - termino: Iteración explícita
      definicion: |-
        Técnica de pedir al LLM que se autocritique y mejore. 'Dame respuesta, luego critícala, luego dame versión mejorada'. Útil para ensayos, decisiones importantes, planes complejos. Genera versiones más sólidas.
      ejemplo: |-
        'Hazme un plan de estudios para 1 semana. Después dime 3 puntos débiles del plan. Después dame una versión mejorada que aborde esos puntos'. En 1 prompt obtienes lo que normalmente toma 3 conversaciones.
      emoji: "🔁"

  quiz:
    titulo: "¿Dominas el prompting avanzado?"
    instrucciones: "5 preguntas para verificar las 4 técnicas y sus combinaciones."
    preguntas:
      - enunciado: "¿Cuáles son las 4 técnicas avanzadas de prompting?"
        opciones:
          - "CTRF, copy, paste, paste."
          - "Role + Few-shot + Chain-of-Thought + Iteración explícita."
          - "Pregunta, respuesta, escucha, decide."
          - "Solo CTRF basta."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Role + Few-shot + Chain-of-Thought + Iteración explícita. Cada una se puede combinar con otra para resultados aún mejores.
        feedback_incorrecto: |-
          Role + Few-shot + CoT + Iteración explícita. CTRF es la base; estas 4 son las técnicas avanzadas. La combinación con criterio es donde está la maestría.
      - enunciado: "Le pides al LLM 'actúa como un profesor paciente que enseña a niños de 12 años'. ¿Qué técnica usaste?"
        opciones:
          - "Few-shot."
          - "Role Prompting."
          - "Chain-of-Thought."
          - "CTRF."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Role Prompting: asignas a la IA un rol específico. El LLM ajusta tono, vocabulario y profundidad. Útil para explicaciones, escritura creativa.
        feedback_incorrecto: |-
          Role Prompting. 'Actúa como X' es la fórmula básica. El LLM adapta su respuesta al rol. Para enseñar a niños sale más simple; para expertos sale más técnico.
      - enunciado: "Quieres que el LLM resuelva un problema de mate mostrando TODOS los pasos. ¿Qué técnica?"
        opciones:
          - "Role."
          - "Chain-of-Thought."
          - "Few-shot."
          - "Iteración."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Chain-of-Thought: pedir al LLM mostrar pasos del razonamiento. En matemáticas, lógica y análisis, las respuestas son más precisas porque el LLM 'piensa en voz alta'.
        feedback_incorrecto: |-
          Chain-of-Thought. Le pides mostrar pasos del razonamiento. Especialmente útil en matemáticas donde mostrar pasos mejora precisión y entendimiento.
      - enunciado: "Para clasificar canciones por género, le das al LLM 2 ejemplos resueltos y pides que clasifique uno nuevo. ¿Qué técnica?"
        opciones:
          - "Few-shot."
          - "Chain-of-Thought."
          - "Iteración."
          - "Sin técnica."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Few-shot: dar ejemplos para que el LLM aprenda el patrón. Útil para clasificaciones, traducciones especiales, formatos específicos.
        feedback_incorrecto: |-
          Few-shot. Le muestras 1-3 ejemplos, el LLM aprende el patrón y lo aplica al caso nuevo. Mucho más preciso que solo explicar el patrón con palabras.
      - enunciado: "¿Cuál es el peligro de usar demasiadas técnicas en un solo prompt?"
        opciones:
          - "Ningún peligro, mientras más mejor."
          - "Prompts muy largos (500+ palabras) confunden al LLM. Mejor combinar 2-3 técnicas máximo."
          - "El LLM se enoja."
          - "La pantalla se traba."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Prompts muy largos confunden al LLM. La combinación inteligente de 2-3 técnicas es óptima. Más técnicas no siempre = mejor respuesta.
        feedback_incorrecto: |-
          Combinar 2-3 técnicas es óptimo. Más allá, el LLM se confunde. La calidad viene de combinar con criterio, no de acumular técnicas sin sentido.

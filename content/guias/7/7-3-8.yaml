titulo: "Ética de la IA --- sesgo, privacidad, derechos y deepfakes"
titulo_portada: |-
  Ética de
  la IA ---
  sesgo,
  privacidad,
  derechos y
  deepfakes

producto_final: |-
  En el cuaderno: \textbf{(a) 5 dilemas éticos analizados} (uno por cada tema: sesgo, privacidad, derechos de autor, deepfakes, autenticidad académica), con tu posición personal sobre cada uno y justificación; \textbf{(b) tu ``código personal de ética con IA''} con mínimo 5 reglas que prometes cumplir, firmado como compromiso; \textbf{(c) reflexión}: ``¿Qué tipo de ciudadano digital quiero ser cuando sea adulto?''.

apertura:
  saber_ancestral: |-
    \textbf{En el barrio de Cartago, la comunidad tenía reglas no escritas para usar herramientas poderosas.} Cuando alguien tenía un machete (herramienta para cortar caña, abrir camino, defenderse), \emph{no lo usaba para cualquier cosa}: lo respetaba. Si veías a un niño jugando con machete, le decías: \emph{``Eso no se juega; le puedes hacer daño a alguien''}. Si alguien usaba el machete para amenazar, la comunidad lo censuraba. \textbf{El machete no era malo en sí mismo}: lo malo era usarlo sin ética. \emph{Doña Mercedes, doña Esperanza la partera, los consejeros del barrio enseñaban estas reglas no escritas a los niños desde temprano}. La IA es la herramienta poderosa de tu generación. Como el machete, no es buena ni mala en sí misma: \textbf{depende de cómo la uses}. Hoy aprendes 5 dilemas éticos que ya están aquí, no en el futuro lejano. Y construyes tu propio código personal de ética con IA.

  saber_contemporaneo: |-
    La \textbf{ética de la IA} estudia los problemas morales que aparecen al usar IA. Hay \textbf{5 grandes temas} que afectan tu vida diaria. \textbf{(1) Sesgo (ya viste en S4):} la IA puede discriminar grupos por datos parciales. \textbf{(2) Privacidad:} cuando le das información a una IA, ¿dónde queda? ¿quién la lee? ¿la usan para entrenarse? \textbf{(3) Derechos de autor:} ChatGPT escribió un cuento. ¿De quién es? ¿Del usuario? ¿De OpenAI? ¿De los autores cuyos textos se usaron para entrenar la IA? \textbf{(4) Deepfakes:} videos o audios falsos generados por IA donde una persona dice o hace algo que NUNCA hizo. Pueden ser usados para acosar, estafar, manipular elecciones. \textbf{(5) Autenticidad académica:} usar IA para hacer tareas. ¿Es trampa? ¿Es asistencia legítima? Depende. \textbf{No hay respuestas fáciles}: estos son debates abiertos en el mundo. Tu generación va a decidir cómo se resuelven en los próximos 20 años. Hoy empiezas a tener opinión propia.

  pregunta_puente: |-
    Si tu amigo te muestra un \emph{deepfake} (video falso) de un político del barrio diciendo algo que nunca dijo, y te dice \emph{``mira lo que dijo''}, ¿\textbf{qué haces}? ¿Lo crees? ¿Lo compartes? ¿Cómo te das cuenta de que es falso?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 5 temas éticos clave; (2) sabrás \textbf{analizar} dilemas éticos reales; (3) podrás \textbf{evaluar} situaciones con criterio propio; (4) habrás \textbf{creado} tu código personal de ética con IA.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: identificas los 5 temas, analizas 5 dilemas reales, formulas tu posición, escribes tu código personal.
  a_escuta: |-
    Empezamos con 5 dilemas que ya existen, no son ciencia ficción.
  a_sistematizacion: |-
    Después aprendes los 5 temas a fondo con casos reales.
  a_praxis: |-
    Con todo claro, escribes tu código personal de ética + análisis de dilemas.
  a_producto: |-
    El producto es ese código firmado + 5 dilemas analizados.
  a_evaluacion: |-
    Antes de salir, comparte tu código con un compañero --- ¿se parecen o son distintos?
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué la ética con IA es responsabilidad de tu generación.

escuta:
  escena: |-
    \textbf{Actividad 1 · EVALÚA --- 5 dilemas éticos reales} (12 min · individual). Lee estos 5 dilemas y en el cuaderno escribe tu posición + justificación (3-4 líneas por cada uno). \emph{Dilema 1 (sesgo):} \emph{una IA aprueba créditos bancarios y rechaza más a personas de barrios populares de Cartago. ¿Es justo? ¿Qué debería pasar?}. \emph{Dilema 2 (privacidad):} \emph{le cuentas a ChatGPT que tienes una pelea con tu papá y le pides consejo. ¿Está bien? ¿Quién más podría ver esa conversación?}. \emph{Dilema 3 (derechos de autor):} \emph{usas DALL-E para generar una imagen y la imprimes para venderla. ¿Es tuya la imagen? ¿De quién? ¿Es ético venderla?}. \emph{Dilema 4 (deepfake):} \emph{ves un video viral del presidente diciendo algo escandaloso. Resulta ser deepfake. ¿Qué consecuencias tiene esto para la democracia? ¿Cómo me protejo?}. \emph{Dilema 5 (autenticidad académica):} \emph{tu compañero usa ChatGPT para escribir su ensayo completo y lo entrega como suyo. ¿Es trampa? ¿O es como usar Wikipedia?}.

  checks:
  - Leí los 5 dilemas con calma.
  - Pensé en mi posición personal.
  - Escribí 3-4 líneas por cada uno con justificación.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · EVALÚA).} Título: «Actividad 1 --- 5 dilemas éticos». \textbf{Formato:} 5 bloques (uno por dilema), cada uno con mi posición + justificación. \textbf{Extensión:} 15-20 líneas. \textbf{Sabes que terminaste cuando} tienes opinión propia en cada uno, no copiada.

sistematizacion:
  intro: |-
    Tu posición personal es válida. Ahora profundiza en cada uno de los 5 temas con casos reales documentados.

  pilares:
  - |-
    \textbf{Tema 1 --- SESGO ALGORÍTMICO.} Ya lo viste en S4. Resumen: las IAs reproducen los sesgos de sus datos. Casos reales: Amazon descartando CVs de mujeres, Google clasificando personas afro como animales, COMPAS sesgada en el sistema de justicia EEUU. \textbf{Tu responsabilidad ética como usuario:} (a) saber que existe; (b) verificar; (c) no aceptar pasivamente decisiones que parecen injustas; (d) exigir que los servicios que usas sean transparentes.
  - |-
    \textbf{Tema 2 --- PRIVACIDAD.} Cuando le escribes algo a ChatGPT, esa conversación \emph{queda guardada} en servidores de OpenAI. Algunas empresas (no todas) usan tus conversaciones para entrenar futuras versiones. Otras venden datos a terceros. \emph{No compartas info sensible:} cédula, contraseñas, dirección exacta, info médica, asuntos íntimos. \textbf{Una vez escrito, no sabes dónde queda}. Caso real: empleados de Samsung pegaron código secreto en ChatGPT (2023), el código quedó en los servidores de OpenAI. Samsung prohibió ChatGPT a sus empleados.
  - |-
    \textbf{Tema 3 --- DERECHOS DE AUTOR.} La IA aprendió de millones de textos e imágenes (muchas con derechos de autor). Cuando ChatGPT escribe un cuento, ¿es plagio? ¿Es creación nueva? \emph{Los tribunales del mundo están debatiendo esto}. \textbf{Tu posición práctica:} (a) atribuye cuando uses ideas de IA en tus trabajos; (b) no vendas creaciones de IA como tuyas sin atribución; (c) reconoce que la cosa creativa ``híbrida'' (parcialmente tuya, parcialmente IA) es categoría nueva.
  - |-
    \textbf{Tema 4 --- DEEPFAKES.} Videos, imágenes y audios falsos generados por IA. Tan convincentes que pueden engañar al ojo humano. \emph{Usos malos:} pornografía no consentida, suplantación de identidad, fraude, manipulación política. \emph{Usos legítimos:} efectos en cine, doblaje multilingüe, accesibilidad. \textbf{Cómo protegerse:} verificar fuente, buscar artefactos en bordes/manos, contrastar con fuentes confiables, NO compartir sin verificar. \textbf{Tema 5 --- AUTENTICIDAD ACADÉMICA.} ¿Es trampa usar IA en tareas? \emph{Depende del uso:} (a) usar IA para entender = LEGÍTIMO; (b) usar IA para estructurar = LEGÍTIMO con atribución; (c) usar IA para escribir el ensayo completo y entregarlo como tuyo = TRAMPA. La diferencia es \emph{si tú aprendiste o solo entregaste un producto}. Los colegios están definiendo políticas; los profesores también. \emph{La regla universal: si no aprendiste, es trampa}.

  anatomia:
    titulo: 5 temas éticos clave
    body: |-
      \textbf{1.} SESGO: discriminación por datos parciales. \\[1mm]
      \textbf{2.} PRIVACIDAD: tus datos quedan en servidores. \\[1mm]
      \textbf{3.} DERECHOS DE AUTOR: la creación con IA es categoría nueva. \\[1mm]
      \textbf{4.} DEEPFAKES: videos/audios falsos convincentes. \\[1mm]
      \textbf{5.} AUTENTICIDAD ACADÉMICA: usar IA en tareas; depende del uso.

  errores_comunes: |-
    \textbf{Errores éticos frecuentes con IA.} (1) \emph{Aceptar respuestas de IA sin verificar.} Los sesgos pasan a tu pensamiento sin que lo notes. (2) \emph{Compartir datos sensibles con IA.} Una vez escritos, no sabes dónde quedan. (3) \emph{Copiar de IA sin atribución.} Es la nueva forma de plagio. (4) \emph{Compartir deepfakes sin verificar.} Te haces cómplice de desinformación. (5) \emph{Usar IA para hacer la tarea sin aprender.} Te haces dependiente y pierdes el oficio.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 5 temas éticos + casos reales». \textbf{Formato:} tabla de 5 filas y 3 columnas (tema, caso real, mi responsabilidad). \textbf{Extensión:} 5 filas. \textbf{Sabes que terminaste cuando} puedes hablar de cada tema con criterio, no con opinión vacía.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Mi código personal de ética con IA} (28 min · individual). Vas a construir tu propio código de ética: 5+ reglas que prometes cumplir. Es ejercicio adulto de definir cómo vas a usar IA durante tu vida.

  pilares:
  - |-
    \textbf{Paso 1 --- Título y dedicatoria.} En el cuaderno escribe: \textbf{``Mi código personal de ética con IA''}. Debajo, en una línea: \emph{``Comprometido con mi yo de 25 años, [tu nombre], grado 7°, año 2026''}. Este código no es ``para entregar al profe''; es para ti.
  - |-
    \textbf{Paso 2 --- Mis 5 reglas (mínimo).} Lista numerada del 1 al 5+. Sugerencias para inspirarte (no copies; adáptalas a tu voz): \emph{(1) Siempre verifico lo que la IA me dice antes de usarlo. (2) No comparto datos personales sensibles con ningún chatbot. (3) Atribuyo cuando uso IA como asistente en tareas: la cito como fuente. (4) Solo creo contenido con IA si lo identifico como tal (no lo paso como creación 100~\% propia). (5) No comparto deepfakes ni contenidos falsos sin verificar primero. (6) Uso la IA para aprender, no para evitar aprender. (7) Reviso una vez al mes mis hábitos con IA: ¿estoy siendo coherente con mi código?}.
  - |-
    \textbf{Paso 3 --- Justificación de cada regla.} Debajo de cada una, escribe 1 línea explicando \emph{por qué la elegiste}. Esto te ayuda a memorizarla y le da sentido. Ejemplo: \emph{``Regla 1 elegida porque sé que las IAs alucinan y no quiero citar mentiras como verdades''}.
  - |-
    \textbf{Paso 4 --- Análisis profundo de los 5 dilemas de la Actividad 1.} Vuelve a tus 5 respuestas de la Actividad 1. Con lo aprendido en la sistematización, \emph{¿cambiarías alguna respuesta?}. Anota: \emph{``Después de aprender la sistematización, mi posición sobre el dilema [N] cambió porque \_\_\_''}. Si no cambia, está bien; lo importante es revisar con criterio.
  - |-
    \textbf{Paso 5 --- Reflexión: ¿qué tipo de ciudadano digital quiero ser?} En 4-5 líneas, escribe tu propia respuesta. Sugerencias para inspirarte (no copies): \emph{``Quiero ser un ciudadano digital que usa IA con criterio, no como esclavo de las apps''}. \emph{``Quiero saber distinguir verdad de mentira en internet''}. \emph{``Quiero proteger mi privacidad y la de los demás''}. \emph{``Quiero aportar a una sociedad digital con criterio ético''}. Adapta a tu voz.
  - |-
    \textbf{Paso 6 --- Firma de cierre.} Al final escribe: \emph{``Me comprometo a cumplir este código durante mi vida adulta digital. Lo revisaré una vez al año para actualizarlo según mi crecimiento.''}. Firma con nombre completo y fecha. Este documento te acompaña.

  checklist:
    titulo: Antes de cerrar la S8
    items: |-
      \checkbox Mi código personal tiene mínimo 5 reglas. \\[1mm]
      \checkbox Cada regla tiene 1 línea de justificación. \\[1mm]
      \checkbox Revisé mis 5 dilemas de la Actividad 1 con la sistematización. \\[1mm]
      \checkbox Hay reflexión de qué tipo de ciudadano digital quiero ser. \\[1mm]
      \checkbox El código tiene firma de cierre comprometida. \\[1mm]
      \checkbox Lo guardo como documento personal para revisar anualmente.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} título + dedicatoria a mi yo de 25. \textit{Paso 2:} mínimo 5 reglas. \textit{Paso 3:} justificación de cada una. \textit{Paso 4:} revisión de dilemas con sistematización. \textit{Paso 5:} reflexión ciudadano digital. \textit{Paso 6:} firma comprometida.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi código personal de ética con IA». \textbf{Formato:} 5+ reglas + justificación + revisión + reflexión + firma. \textbf{Extensión:} 1 página completa. \textbf{Sabes que terminaste cuando} sientes que el código refleja tu yo verdadero y lo cumplirás.

  producto_titulo: Mi código personal de ética con IA · 5+ reglas + reflexión · firmado
  criterios:
  - El código tiene mínimo 5 reglas personales (no copiadas).
  - Cada regla tiene justificación de por qué la elegiste.
  - Revisaste los 5 dilemas de la Actividad 1 con criterio nuevo.
  - Hay reflexión sobre qué tipo de ciudadano digital quieres ser.
  - El código está firmado como compromiso real.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo de la ética colectiva)"
    cita: |-
      ``La ética no es lujo de unos pocos: es responsabilidad de todos. Cuando usas IA, tus decisiones pequeñas suman a un mundo más justo o menos.''
    aplicacion: |-
      \textbf{Cada vez que decides usar IA con criterio} --- verificar, no compartir datos, atribuir, no propagar deepfakes --- estás aportando a un mundo digital más justo. \emph{Cada vez que decides usarla sin ética}, estás aportando a uno menos justo. No es exageración: las decisiones individuales se suman. \emph{Tu código personal hoy es voto por la sociedad digital que quieres habitar en 20 años}.
    pregunta_espejo: |-
      ¿Mi código refleja la sociedad digital en la que quiero vivir cuando sea adulto?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``Sé el mismo cuando nadie te ve que cuando todos te miran. La integridad no se ajusta a la audiencia.''
    aplicacion: |-
      \textbf{La integridad con IA es lo mismo}. Cuando le pides al LLM ayudar con tu tarea, \emph{nadie te observa}: solo tú y el chat. \emph{La decisión de usarlo con ética o sin ética la tomas tú solo}. El estoico hace lo correcto sin importar quién mira. Tu código personal te entrena en esa integridad antigua, aplicada al mundo digital.
    pregunta_espejo: |-
      Cuando uso IA solo, ¿soy el mismo que cuando alguien me observa?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la ética digital)"
    cita: |-
      ``En 2030 habrá millones de personas usando IA sin ética alguna. Los pocos que la usen con ética serán los líderes de la próxima década.''
    aplicacion: |-
      \textbf{La mayoría de adultos hoy usa IA sin pensar en ética}: copia, plagia, propaga deepfakes, no verifica. Eso \emph{abre espacio para que los que sí piensan en ética destaquen}. \emph{En universidad, en trabajo, en proyectos sociales}: los que usan IA con criterio ético van a ser reconocidos. Tu código personal hoy es preparación para ese liderazgo futuro.
    pregunta_espejo: |-
      ¿Estoy entrenando una ética con IA que en 5 años pocos tendrán?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, aplica al menos 2 reglas de tu código personal en situaciones reales. Anota qué pasó. La próxima clase aplicamos todo a tu vida académica: \textbf{IA y mis tareas}. Vas a definir reglas concretas para usar IA en estudios.

web:
  conceptos_clave:
    - termino: Ética de la IA
      definicion: |-
        Conjunto de problemas morales y reglas de uso responsable que aparecen al desarrollar y usar IA. Cubre temas: sesgo, privacidad, derechos de autor, deepfakes, autenticidad académica. Está en debate mundial.
      ejemplo: |-
        ¿Es ético que una IA bancaria rechace créditos a personas de barrios populares? ¿Es ético compartir un deepfake aunque sea chistoso? ¿Es ético usar ChatGPT para hacer la tarea? Cada uno es problema ético real.
      emoji: "⚖️"
    - termino: Deepfake
      definicion: |-
        Video, imagen o audio falso generado por IA donde una persona dice o hace algo que NUNCA hizo. Convincentes al ojo humano. Usados para acoso, suplantación, fraude, manipulación política. Riesgo serio para la verdad pública.
      ejemplo: |-
        Caso 2023: deepfake de Zelensky pidiendo a soldados rendirse circuló en redes. Era falso. Casos en Colombia: deepfakes de políticos diciendo cosas que no dijeron. La protección: verificar fuente, contrastar con fuentes confiables.
      emoji: "🎭"
    - termino: Privacidad con IA
      definicion: |-
        Cuando le das información a una IA, esa info queda en servidores del proveedor. Algunas la usan para entrenar nuevas versiones. Por eso: no compartas datos sensibles (cédula, contraseña, dirección exacta, info médica).
      ejemplo: |-
        Caso Samsung 2023: empleados pegaron código secreto en ChatGPT. El código quedó en servidores OpenAI. Samsung prohibió ChatGPT internamente. Lección: nunca compartas info sensible con IA.
      emoji: "🔒"
    - termino: Derechos de autor con IA
      definicion: |-
        Cuando una IA genera contenido (texto, imagen, música), ¿de quién es ese contenido? ¿Del usuario que hizo el prompt? ¿De la empresa de IA? ¿De los autores cuyos datos se usaron para entrenar? Debate legal abierto en el mundo.
      ejemplo: |-
        En 2024 hubo demandas de NYT contra OpenAI por usar artículos del periódico para entrenar ChatGPT sin permiso. Aún sin resolución definitiva. Mientras tanto: atribuir IA cuando se use; no vender creaciones de IA como 100% tuyas.
      emoji: "©️"
    - termino: Código personal de ética
      definicion: |-
        Conjunto de reglas que TÚ defines para usar IA con criterio. Mínimo 5 reglas firmadas como compromiso. Es ejercicio adulto: en lugar de seguir reglas externas, te das las tuyas y las cumples.
      ejemplo: |-
        Mi código: (1) Verifico antes de citar. (2) No comparto datos personales. (3) Atribuyo en mis trabajos. (4) Identifico contenido de IA cuando lo uso. (5) No propago deepfakes. Firmado con compromiso real.
      emoji: "📜"

  quiz:
    titulo: "¿Conoces la ética de la IA?"
    instrucciones: "5 preguntas para verificar que dominas los 5 temas éticos clave."
    preguntas:
      - enunciado: "Un amigo te muestra un deepfake del presidente. ¿Qué haces?"
        opciones:
          - "Lo creo de inmediato y comparto."
          - "Verifico la fuente, contrasto con noticias confiables. NO lo comparto sin verificar."
          - "Lo borro y olvido."
          - "Le pago a la IA."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Verificar antes de compartir. Los deepfakes son riesgo real para la verdad pública. Tu papel: no propagar desinformación.
        feedback_incorrecto: |-
          Verifica + no compartas sin verificar. Los deepfakes son riesgo serio. Compartir sin verificar te hace cómplice de la desinformación.
      - enunciado: "Le cuentas a ChatGPT tu contraseña del banco para pedirle consejo. ¿Está bien?"
        opciones:
          - "NO. NUNCA compartas datos sensibles (contraseñas, cédula, info íntima) con IA. Quedan en servidores."
          - "Sí, ChatGPT es seguro."
          - "Solo si es premium."
          - "Da igual."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. NUNCA datos sensibles. Una vez escrito, no sabes dónde queda. Samsung prohibió ChatGPT a empleados por código sensible filtrado. Lección clara.
        feedback_incorrecto: |-
          NUNCA. Datos sensibles (contraseñas, cédula, info íntima) NO se comparten con IA. Quedan en servidores. Riesgo real. Regla 2 del uso responsable.
      - enunciado: "Tu compañero copia un ensayo entero de ChatGPT y lo entrega como suyo. ¿Es trampa?"
        opciones:
          - "No, es como usar Wikipedia."
          - "Solo si copia mal."
          - "Da igual."
          - "Sí. Si no aprendió, no es su trabajo. Usar IA como asistente con atribución sí está bien."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. La regla: si no aprendiste, es trampa. Usar IA para entender + atribuir = ético. Copiar entero sin entender ni atribuir = trampa.
        feedback_incorrecto: |-
          Sí es trampa. La regla universal: si no aprendiste, es trampa. IA como asistente con atribución es ético. Como reemplazo sin aprender es plagio nuevo.
      - enunciado: "Usas DALL-E para hacer una imagen y la vendes como creación tuya. ¿Está bien?"
        opciones:
          - "Sí, total."
          - "Solo si es gratis."
          - "No del todo. Debes identificar que es creación con IA, no presentarla como 100% tuya."
          - "Depende del país."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Atribuir el uso de IA. La creación con IA es categoría nueva: ni 100% tuya ni 100% de la IA. Honestidad pide atribución.
        feedback_incorrecto: |-
          Identifica el uso de IA. La creación es híbrida (parcialmente tuya, parcialmente IA). Venderla como 100% tuya es deshonesto. Atribuye y aclara.
      - enunciado: "¿Cuál es la ventaja de tener tu PROPIO código de ética con IA?"
        opciones:
          - "Ninguna, mejor seguir reglas de otros."
          - "Te entrena en pensar ética adulta: tú te das las reglas y las cumples por convicción, no por miedo."
          - "Suena culto."
          - "Es ejercicio académico sin valor."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Ética adulta: tú defines, tú cumples. No por miedo a castigo, sino por convicción propia. Esa madurez ética te diferencia.
        feedback_incorrecto: |-
          Ética adulta interiorizada. Tú defines tus reglas, tú las cumples por convicción. No por miedo a castigos externos. Eso es madurez moral.

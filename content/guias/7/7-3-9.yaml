clave: "3-9"
grado: 7
periodo: 3
sesion: 9
completo: true

titulo: "IA y mis tareas --- política personal de uso responsable en estudios"
titulo_portada: |-
  IA y
  mis tareas ---
  política
  personal
  responsable

producto_final: |-
  Tu \textbf{política personal de uso de IA en estudios} (1 hoja del cuaderno): \textbf{(a) los 4 usos LEGÍTIMOS de IA en tareas} con ejemplos concretos; \textbf{(b) los 4 usos NO LEGÍTIMOS (trampa)} con ejemplos; \textbf{(c) cómo atribuir IA correctamente} en un trabajo; \textbf{(d) 5 reglas personales} para tu uso de IA durante el año académico; \textbf{(e) ejemplo aplicado}: un caso real donde usaste IA en tarea (cómo lo manejaste). Firma.

apertura:
  saber_ancestral: |-
    \textbf{Doña Mercedes la maestra rural de Cartago decía: ``El que aprende con esfuerzo se gradúa; el que copia, se gradúa también, pero sin oficio.''} En la escuelita de la vereda La Plata había dos niños: \emph{Pedro y Lucía}. Pedro hacía los ejercicios solo, se equivocaba, los corregía, aprendía. Lucía copiaba la tarea de Pedro y la entregaba como propia. \textbf{Las dos pasaron de grado}: las notas no detectaban la diferencia. Pero al año siguiente, cuando llegaron nuevos contenidos que se construían sobre lo anterior, \emph{Pedro entendía; Lucía no}. \emph{Lucía había aprobado, pero no había aprendido}. Tres años después, en un examen de ingreso al colegio de Buga, Pedro pasó; Lucía no. \textbf{La diferencia no estaba en la inteligencia: estaba en haber aprendido el oficio en su momento}. Con IA pasa exactamente lo mismo. \emph{El que la usa para hacer trampa pasa de grado pero no aprende. El que la usa con criterio, asistente real, aprende Y avanza}. Hoy defines tu política personal para no ser Lucía.

  saber_contemporaneo: |-
    \textbf{Usar IA en tareas escolares es ambiguo}: a veces es legítimo, a veces es trampa. La regla universal: \emph{si TÚ aprendiste, es legítimo; si solo entregaste un producto sin entender, es trampa}. \textbf{Los 4 usos LEGÍTIMOS de IA en tareas:} \textbf{(1) Como tutor:} \emph{``explícame este concepto''}, después tú lo escribes con tus palabras. \textbf{(2) Como corrector:} \emph{``revisa esta carta y dime qué mejorar''}, después tú aplicas los cambios con tu criterio. \textbf{(3) Como organizador:} \emph{``ayúdame a estructurar las ideas para un ensayo sobre X''}, después tú escribes el ensayo. \textbf{(4) Como generador de ideas:} \emph{``dame 5 ángulos posibles para investigar X''}, después tú escoges 1 y profundizas. \textbf{Los 4 usos NO LEGÍTIMOS (trampa):} \textbf{(5) Escribir el ensayo completo} y entregarlo como tuyo. \textbf{(6) Resolver el problema y copiar la respuesta} sin entenderla. \textbf{(7) Hacer toda la investigación} y solo entregar lo que la IA dice, sin verificar ni añadir tu voz. \textbf{(8) Pasar por tu autoría algo que es 100\% generado por IA}. \textbf{La diferencia siempre: ¿aprendí? ¿agregué mi voz?}.

  pregunta_puente: |-
    Si tu profe te pide un ensayo de 2 páginas sobre la independencia de Colombia, y tú le pides a ChatGPT que lo escriba completo y se lo entregas tal cual, ¿\textbf{en qué te perjudica}? ¿La nota cambia? ¿Algo más cambia?

  saber_hacer: |-
    Al terminar la clase: (1) podrás \textbf{identificar} los 4 usos legítimos vs los 4 no legítimos; (2) sabrás \textbf{aplicar} la regla universal (¿aprendí?); (3) podrás \textbf{atribuir} IA correctamente en un trabajo; (4) habrás \textbf{creado} tu política personal de uso de IA en estudios.

puentes:
  a_ruta: |-
    Hoy haces 4 cosas: distingues uso legítimo de trampa, aprendes a atribuir, defines tu política personal, aplicas a un caso real.
  a_escuta: |-
    Empezamos con 8 escenarios para clasificar.
  a_sistematizacion: |-
    Después aprendes los 4 usos legítimos + los 4 no legítimos + cómo atribuir.
  a_praxis: |-
    Con todo claro, escribes tu política personal de IA en estudios.
  a_producto: |-
    El producto es esa política firmada + ejemplo aplicado.
  a_evaluacion: |-
    Antes de salir, intercambia tu política con un compañero --- ¿se parecen?.
  a_triangulo: |-
    Cerramos con 3 voces sobre por qué el aprendizaje real no se reemplaza con IA.

escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- 8 escenarios: ¿legítimo o trampa?} (12 min · individual). Lee estos 8 escenarios y marca en el cuaderno LEG (legítimo) o T (trampa), con 1 línea de justificación. \emph{(1) Le pido a ChatGPT que me explique fotosíntesis, después escribo el resumen con mis palabras.} \emph{(2) Le pido a ChatGPT que escriba un ensayo de 2 páginas sobre Bolívar y lo entrego sin cambios.} \emph{(3) Le pido a ChatGPT que me sugiera 5 ángulos para investigar sobre el cambio climático, escojo 1 y desarrollo solo.} \emph{(4) Le pido a ChatGPT que resuelva un problema de matemáticas y copio la respuesta sin entender los pasos.} \emph{(5) Uso ChatGPT para corregir ortografía y gramática de un texto que YO escribí.} \emph{(6) Le pido a ChatGPT que me dé 10 hechos sobre Newton y los pego sin verificar.} \emph{(7) Le pido a ChatGPT que estructure las ideas de mi ensayo, escribo el ensayo aplicando esa estructura.} \emph{(8) Uso ChatGPT para traducir mi tarea de español al inglés, sin saber inglés, y la entrego como prueba de mi nivel de inglés.}

  checks:
  - Leí los 8 escenarios con calma.
  - Marqué LEG o T en cada uno.
  - Identifiqué la regla común: ¿el estudiante aprendió o no?

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- 8 escenarios de IA en tareas». \textbf{Formato:} lista numerada con LEG/T + 1 línea de justificación. \textbf{Extensión:} 8 líneas. \textbf{Sabes que terminaste cuando} aplicas la regla universal: ¿aprendí o solo entregué?.

sistematizacion:
  intro: |-
    Tu intuición se afina ahora. Respuestas correctas: \emph{1, 3, 5, 7 = LEGÍTIMOS. 2, 4, 6, 8 = TRAMPA}. Ahora aprende a fondo los 4 usos legítimos + los 4 no + cómo atribuir.

  pilares:
  - |-
    \textbf{Los 4 usos LEGÍTIMOS de IA en tareas.} \textbf{(1) Como tutor (explicar):} \emph{``Explícame X''}, después escribo el resumen con mis palabras. La IA ayuda a ENTENDER, no a entregar. \textbf{(2) Como corrector:} \emph{``Revisa este texto que YO escribí y dime qué mejorar''}. La IA detecta errores; tú decides cuáles arreglar. \textbf{(3) Como organizador:} \emph{``Ayúdame a estructurar ideas para un ensayo sobre X''}, después YO escribo el ensayo. La IA ayuda con el ARMAZÓN; el contenido es mío. \textbf{(4) Como generador de ideas (brainstorming):} \emph{``Dame 5 ángulos para investigar X''}, escojo 1 y profundizo solo. La IA abre OPCIONES; yo escojo y desarrollo.
  - |-
    \textbf{Los 4 usos NO LEGÍTIMOS (trampa).} \textbf{(5) Escribir el ensayo completo} y entregarlo como tuyo. Quitas el aprendizaje, faltas a la honestidad académica. \textbf{(6) Resolver el problema} y copiar respuesta sin entender pasos. No aprendes la metodología. \textbf{(7) Hacer toda la investigación} y solo entregar lo que la IA dice sin verificar ni añadir tu voz. Te haces dependiente. \textbf{(8) Pasar por tu autoría algo 100\% generado por IA.} Es plagio nuevo.
  - |-
    \textbf{Cómo atribuir IA correctamente en un trabajo.} La práctica profesional emergente es \textbf{citar la IA como herramienta usada}, no como autor. Ejemplos: \emph{(a) En la introducción del trabajo:} \emph{``En la preparación de este ensayo usé Claude AI para estructurar mis ideas iniciales. Las ideas y el desarrollo son míos''}. \emph{(b) Al final del trabajo (sección Fuentes):} \emph{``Asistencia de IA: ChatGPT (versión gratuita), consultado el [fecha] para [propósito]''}. \emph{(c) En tareas escolares específicas:} \emph{``Nota al profe: usé ChatGPT para revisar mi ortografía. El contenido es propio''}. \textbf{La atribución NO es signo de debilidad: es signo de honestidad académica}. Los profesores valoran que digas la verdad.
  - |-
    \textbf{Las 5 preguntas para autoevaluar antes de entregar.} Antes de entregar un trabajo donde usaste IA: \textbf{(1) ¿Aprendí algo de este proceso?} Si no, hay problema. \textbf{(2) ¿Puedo explicar este trabajo si el profe me pregunta verbalmente?} Si no, hay problema. \textbf{(3) ¿Mi voz aparece en el trabajo?} Si solo es voz de IA, hay problema. \textbf{(4) ¿Atribuyé el uso de IA?} Si no, hay problema. \textbf{(5) ¿Mi yo de adulto se sentiría orgulloso de cómo lo hice?} Si no, hay problema. \emph{Si las 5 respuestas son SÍ, el uso fue legítimo}.

  anatomia:
    titulo: 4 legítimos + 4 trampa + atribución + 5 preguntas
    body: |-
      \textbf{4 LEGÍTIMOS:} tutor · corrector · organizador · generador de ideas. \\[1mm]
      \textbf{4 TRAMPA:} escribir entero · copiar respuesta sin entender · investigar sin verificar/voz · pasar como tuyo lo que es 100\% IA. \\[1mm]
      \textbf{Atribuir:} ``En este trabajo usé [IA] para [propósito específico]''. \\[1mm]
      \textbf{5 preguntas autoevaluación:} ¿aprendí? ¿puedo explicar? ¿mi voz está? ¿atribuí? ¿yo adulto orgulloso?

  errores_comunes: |-
    \textbf{Errores frecuentes al usar IA en tareas.} (1) \emph{No saber distinguir uso legítimo de trampa}: caes en trampa sin saber. (2) \emph{No atribuir cuando usaste IA}: parece deshonesto aunque el uso haya sido legítimo. (3) \emph{Esperar a estar en problemas para definir tu política}: la política se define en frío, antes. (4) \emph{Asumir que el profe sabe distinguir IA de tu escritura}: cada vez más detectan; mejor ser honesto. (5) \emph{Justificar trampa como ``todos lo hacen''}: que otros la hagan no la hace legítima.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Diagnóstico de mis usos pasados de IA». \textbf{Formato:} bloque A con 4 legítimos (cada uno: descripción + ejemplo). Bloque B con 4 no legítimos. Bloque C con plantilla de atribución. Bloque D con las 5 preguntas de autoevaluación. \textbf{Veredicto honesto (3 líneas):} piensa en las últimas 3 veces que usaste IA para una tarea escolar. Pasa cada uso por las 5 preguntas. ¿Cuántas fueron \emph{legítimas} y cuántas cruzaron la línea? Reconoce sin justificar. \textbf{Extensión:} 18 líneas + veredicto honesto. \textbf{Sabes que terminaste cuando} pudiste decir ``en una de esas crucé la línea'' sin justificar --- ese reconocimiento es el inicio del oficio honesto.

praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Mi política personal de uso de IA en estudios} (28 min · individual). Vas a escribir el documento que regirá tu uso de IA en estudios durante el año académico.

  pilares:
  - |-
    \textbf{Paso 1 --- Título y dedicatoria.} En el cuaderno escribe: \textbf{``Mi política personal de uso de IA en estudios''}. Debajo: \emph{``[Tu nombre], grado 7°, año académico 2026''}.
  - |-
    \textbf{Paso 2 --- Los 4 usos LEGÍTIMOS con MI ejemplo concreto.} Lista numerada con: nombre del uso + ejemplo específico de cómo lo aplicaré. Ejemplo: \emph{``1. Como tutor: si no entiendo derivadas, le pido a ChatGPT que me las explique con un ejemplo del fútbol. Después escribo el resumen con mis palabras en el cuaderno. La IA ayuda a entender, no a entregar''}. Adapta los 4 a tu vida.
  - |-
    \textbf{Paso 3 --- Los 4 usos NO LEGÍTIMOS que me COMPROMETO a NO hacer.} Lista numerada con: nombre + por qué no lo haré. Ejemplo: \emph{``1. NO escribiré ensayos completos con IA y los pasaré como míos, porque eso me quita el oficio de aprender a escribir y faltaría a la honestidad académica''}. Adapta los 4 a tu vida.
  - |-
    \textbf{Paso 4 --- Plantilla de atribución que voy a usar.} Escribe en el cuaderno la plantilla concreta que vas a usar cuando uses IA en un trabajo. Ejemplo: \emph{``Asistencia de IA: en este trabajo usé [nombre del LLM] para [propósito específico]. Las ideas y el desarrollo son míos.''}. Guarda esa plantilla; la copiarás en futuros trabajos.
  - |-
    \textbf{Paso 5 --- Las 5 preguntas de autoevaluación.} Reproduce las 5 preguntas con tus palabras: \emph{(1) ¿Aprendí algo?}, \emph{(2) ¿Puedo explicar verbalmente?}, \emph{(3) ¿Mi voz está?}, \emph{(4) ¿Atribuí?}, \emph{(5) ¿Mi yo adulto orgulloso?}. Subráyalas: te las harás antes de cada entrega.
  - |-
    \textbf{Paso 6 --- Ejemplo aplicado + firma comprometida.} Recuerda 1 vez en que usaste IA en tarea (o imagina). Aplícale tu política: \emph{¿fue legítimo? ¿qué hubiera hecho distinto?}. Escribe en 4-5 líneas. Después firma con: \emph{``Me comprometo a seguir esta política durante mi vida académica. Firmado, [nombre], [fecha]''}. Esta firma vale más que cualquier promesa: te compromete contigo mismo.

  checklist:
    titulo: Antes de cerrar la S9
    items: |-
      \checkbox Mi política tiene los 4 usos legítimos con ejemplos concretos míos. \\[1mm]
      \checkbox Tengo los 4 usos no legítimos con compromiso de no hacerlos. \\[1mm]
      \checkbox La plantilla de atribución está lista para copiar y pegar. \\[1mm]
      \checkbox Las 5 preguntas de autoevaluación están subrayadas. \\[1mm]
      \checkbox Hay ejemplo aplicado a un caso real o imaginado. \\[1mm]
      \checkbox La firma comprometida está al final.

  plantilla_guion: |-
    \textbf{Estructura.} \textit{Paso 1:} título + dedicatoria. \textit{Paso 2:} 4 legítimos con mi ejemplo. \textit{Paso 3:} 4 no legítimos con compromiso. \textit{Paso 4:} plantilla de atribución. \textit{Paso 5:} 5 preguntas subrayadas. \textit{Paso 6:} ejemplo aplicado + firma.

  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi política personal de IA en estudios». \textbf{Formato:} política completa de 6 secciones. \textbf{Extensión:} 1 página entera. \textbf{Sabes que terminaste cuando} sabes exactamente qué hacer y qué no hacer con IA en cada situación académica.

  producto_titulo: Política personal de uso de IA en estudios · 6 secciones · firmada comprometida
  criterios:
  - Los 4 usos legítimos tienen ejemplos concretos del estudiante.
  - Los 4 usos no legítimos tienen compromiso explícito.
  - La plantilla de atribución está lista para usar.
  - Las 5 preguntas de autoevaluación están subrayadas.
  - Hay ejemplo aplicado a un caso real o imaginado.

triangulo:
  dussel:
    autor: "Enrique Dussel (filósofo del esfuerzo formativo)"
    cita: |-
      ``Lo que aprendes con esfuerzo te pertenece. Lo que obtienes con atajos, no es tuyo. El esfuerzo es lo que convierte el conocimiento en sabiduría propia.''
    aplicacion: |-
      Pedro y Lucía de la historia de doña Mercedes pasaron de grado igual. Pero \emph{el conocimiento que Pedro tenía era suyo}; el de Lucía no. \textbf{Cuando usas IA para evitar esfuerzo, te haces Lucía}. Cuando la usas como asistente legítimo (tutor, corrector, organizador, generador de ideas), \emph{te haces Pedro con asistente}. La diferencia se acumula año tras año. \emph{Cada decisión sobre IA en tareas es voto por tu yo de 20 años: ¿quiero saber o quiero solo haber pasado de grado?}.
    pregunta_espejo: |-
      Cuando uso IA en tareas, ¿estoy votando por convertirme en Pedro con asistente o en Lucía con atajos?

  estoico:
    autor: "Marco Aurelio"
    cita: |-
      ``La integridad es la única posesión que no te pueden quitar. Pero tú mismo puedes regalarla con tus decisiones diarias.''
    aplicacion: |-
      Cada vez que decides usar IA con criterio o sin él, \textbf{estás formando o desformando tu integridad personal}. Los profes no siempre detectan trampas; los compañeros pueden no saber. Pero \emph{tú sí sabes}. Esa conciencia interior es lo que el estoico cultiva. \emph{Tu política personal es promesa contigo mismo, no con el profe}. Cumplirla te hace persona íntegra; romperla te degrada.
    pregunta_espejo: |-
      ¿Estoy cultivando mi integridad o regalándola con decisiones pequeñas?

  floridi:
    autor: "Luciano Floridi (filósofo italiano de la ética en estudios con IA)"
    cita: |-
      ``Los estudiantes que aprendan a usar IA con criterio en grado 7 serán los profesionales del futuro. Los que solo copien, serán reemplazados por IAs mejores.''
    aplicacion: |-
      \textbf{El mercado laboral del futuro no premia a quien copia de IA}: premia a quien usa IA como asistente y agrega valor humano genuino. Si solo entregas lo que la IA dice, \emph{cualquier persona con acceso a IA puede hacer lo mismo}. Tu valor profesional viene de \emph{tu criterio, tu voz, tu capacidad de evaluar y mejorar lo que la IA produce}. Aprender eso en 7° grado es invertir años de carrera profesional.
    pregunta_espejo: |-
      ¿Estoy formando habilidades que la IA no puede reemplazar, o me estoy haciendo reemplazable?

compromiso: |-
  \textbf{Para la próxima sesión.} Esta semana, en cada tarea donde uses IA, aplica tu política. La próxima clase es \textbf{la cosecha del periodo}: un proyecto completo con IA responsable. Vas a aplicar todo lo aprendido en P3 a un trabajo real con atribución, reflexión ética y sustentación.

web:
  conceptos_clave:
    - termino: 4 usos legítimos de IA en tareas
      definicion: |-
        Las 4 formas éticas de usar IA en estudios: (1) tutor (explicar conceptos), (2) corrector (revisar texto propio), (3) organizador (estructurar ideas), (4) generador de ideas (lluvia de opciones). Regla: la IA ayuda; tú aprendes y produces.
      ejemplo: |-
        Le pides a ChatGPT que te explique derivadas con un ejemplo del fútbol. Después escribes el resumen con tus palabras en el cuaderno. La IA ayudó a entender; tú produjiste con tu voz.
      emoji: "✅"
    - termino: 4 usos NO legítimos (trampa)
      definicion: |-
        Las 4 formas de hacer trampa con IA: (1) escribir el trabajo completo, (2) copiar respuesta sin entender, (3) investigar sin verificar ni añadir voz propia, (4) pasar como autoría tuya algo 100% generado. Regla violada: no aprendiste.
      ejemplo: |-
        Le pides a ChatGPT que escriba ensayo de 2 páginas sobre Bolívar y lo entregas sin cambios. No aprendiste, no añadiste voz, lo pasas como tuyo. Es la nueva forma de plagio.
      emoji: "❌"
    - termino: Atribución de IA
      definicion: |-
        Práctica académica de citar el uso de IA en un trabajo. No es signo de debilidad: es honestidad. Plantilla: 'En este trabajo usé [LLM] para [propósito]. Las ideas y desarrollo son míos.' Los profesores valoran la verdad.
      ejemplo: |-
        Al final de un ensayo: 'Asistencia de IA: ChatGPT (versión gratuita), consultado el 19 de mayo de 2026 para estructurar ideas iniciales. El contenido y desarrollo son propios.' Atribución profesional.
      emoji: "©️"
    - termino: 5 preguntas de autoevaluación
      definicion: |-
        Antes de entregar trabajo con IA, hazte 5 preguntas: (1) ¿aprendí?, (2) ¿puedo explicar verbalmente?, (3) ¿mi voz está?, (4) ¿atribuí?, (5) ¿mi yo adulto orgulloso?. Si las 5 son SÍ, fue uso legítimo.
      ejemplo: |-
        Antes de entregar el ensayo: '¿Puedo explicar verbalmente al profe lo que escribí?' Si la respuesta es NO, no entiendo y solo entregué. Ahí hay problema. Vuelve a estudiar.
      emoji: "🪞"
    - termino: Honestidad académica
      definicion: |-
        Compromiso de no engañar en tareas y exámenes. Incluye: no plagio, no trampa, citar fuentes, reconocer asistencia (incluida IA). Es valor universal en universidades del mundo. Se forma en colegio.
      ejemplo: |-
        Usar ChatGPT para entender un tema y después escribir con tu voz = honesto. Pasarlo como tuyo sin atribución = deshonesto. La diferencia se acumula: en universidad pueden expulsarte por la segunda.
      emoji: "🤝"

  quiz:
    titulo: "¿Conoces los usos legítimos vs trampa con IA?"
    instrucciones: "5 preguntas para verificar que dominas la política personal de IA en estudios."
    preguntas:
      - enunciado: "Le pides a ChatGPT que te explique fotosíntesis. Después escribes el resumen con TUS palabras. ¿Es legítimo o trampa?"
        opciones:
          - "Trampa."
          - "Depende del país."
          - "Legítimo (uso como tutor)."
          - "Solo si pagas premium."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Uso como TUTOR: la IA ayudó a entender. Tú escribiste con tu voz. Aprendiste. Es uso legítimo número 1.
        feedback_incorrecto: |-
          Legítimo. Uso como tutor. La IA explica, tú entiendes y escribes con tu voz. Aprendiste. Es uso 1 de los 4 legítimos.
      - enunciado: "Le pides a ChatGPT que escriba un ensayo de 3 páginas y lo entregas TAL CUAL como tuyo. ¿Es?"
        opciones:
          - "TRAMPA: no aprendiste, no añadiste voz, pasaste como tuyo lo que no era."
          - "Legítimo si está bien escrito."
          - "Legítimo si es premium."
          - "Trampa solo si el profe se da cuenta."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. TRAMPA. Es el uso no legítimo #5: escribir entero y entregar como tuyo. La regla universal: si no aprendiste, es trampa. Aunque nadie te vea.
        feedback_incorrecto: |-
          Trampa. No aprendiste, no añadiste voz, pasaste como autor. La regla universal se rompe. El que aprende es Pedro; el que copia, Lucía.
      - enunciado: "Tu profe te pide trabajar con IA. ¿Necesitas atribuir?"
        opciones:
          - "No, si el profe lo permite."
          - "Sí. Atribución profesional: 'usé [LLM] para [propósito]. Contenido propio.' Siempre."
          - "Solo si el LLM lo exige."
          - "Solo si quieres."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Siempre atribuye. Es honestidad académica universal. Los profes valoran la verdad sobre los métodos. No atribuir parece deshonesto aunque el uso haya sido legítimo.
        feedback_incorrecto: |-
          Siempre atribuir. Es práctica adulta. 'Usé [IA] para [propósito]. Contenido propio.' Honesto y profesional. No atribuir es jugar con el límite de la honestidad.
      - enunciado: "Antes de entregar, te preguntas '¿puedo explicar verbalmente este trabajo si el profe me pregunta?'. La respuesta es NO. ¿Qué haces?"
        opciones:
          - "Lo entrego igual."
          - "Le pido al profe que no pregunte."
          - "Cambio el profe."
          - "Vuelvo a estudiar el tema hasta que pueda explicarlo. Si solo entregué sin entender, no es legítimo."
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Pregunta 2 de la autoevaluación: si no puedo explicar verbalmente, no entiendo. Si no entiendo, no aprendí. Vuelvo al tema. Estándar adulto: honestidad con uno mismo.
        feedback_incorrecto: |-
          Vuelves a estudiar. Si no puedes explicar verbalmente, no entendiste. Solo entregaste un producto sin aprender. La pregunta 2 de la autoevaluación lo detecta.
      - enunciado: "Tu compañero dice 'todos usan IA para hacer las tareas, no es trampa'. ¿Cómo lo corriges?"
        opciones:
          - "Tiene razón, lo seguiré."

clave: 1-1
grado: 8
periodo: 1
sesion: 1
completo: true
titulo: Phronesis con datos --- preguntar antes de calcular
titulo_portada: |-
  Phronesis con datos ---
  preguntar antes
  de calcular
producto_final: |-
  Lista de 5 preguntas prudentes a un conjunto de datos del entorno escolar (notas de un grupo, tiempo de pantalla del aula, gastos semanales) + decisión razonada de qué calcular y qué dejar fuera + 1 párrafo de cierre que reconozca con honestidad las limitaciones del conjunto de datos elegido
apertura:
  saber_ancestral: |-
    En las cocinas del Valle del Cauca había un gesto silencioso que cualquier abuela hacía antes de poner la olla al fogón: \textbf{pesar el grano y mirarlo}. La abuela tomaba un puñado de frijol, lo extendía sobre un mantel viejo, y separaba en tres montones: \textbf{el bueno} (grano entero, sin manchas, sano), \textbf{el malo} (grano partido, picado por gorgojo, viejo) y \textbf{el dudoso} (grano que no se sabía bien si servía o no). Solo el bueno iba al fogón. El malo iba al patio para las gallinas. El dudoso esperaba un día más para volver a mirarse con la luz de la mañana siguiente. Ese gesto duraba 5 minutos pero ahorraba una olla entera de comida desperdiciada: si la abuela hubiera cocinado sin pesar, sin separar, sin preguntarse \emph{``¿este grano sirve?''}, la sopa habría salido con piedras, con cáscaras, con sabor a bicho. La \textbf{phronesis} (palabra griega que significa \emph{sabiduría práctica}) vivía en ese gesto de la abuela: \textbf{preguntar antes de actuar, mirar antes de cocinar, separar antes de combinar}. Esa misma phronesis es la que pide hoy el análisis de datos digital.
  saber_contemporaneo: |-
    Cuando abres una hoja de Excel con 200 filas de datos, la tentación moderna es la misma que la abuela rechazaba: cocinar sin pesar. Calcular promedios sin saber qué hay en cada fila, sumar sin distinguir qué es número y qué es texto, sacar conclusiones sin haber mirado el origen del dato. Eso se llama \textbf{calcular sin phronesis}, y produce resultados peligrosos: gráficos engañosos, decisiones equivocadas, informes que no se sostienen. La regla profesional del análisis de datos moderno es exactamente la regla de la abuela: \textbf{preguntar antes de calcular}. Antes de aplicar fórmulas, antes de hacer gráficos, antes de sacar conclusiones, el analista profesional se hace 5 preguntas básicas: (1) \emph{¿de dónde vienen estos datos?}, (2) \emph{¿quién los recolectó y cuándo?}, (3) \emph{¿qué tipo de dato hay en cada columna?}, (4) \emph{¿hay errores visibles, vacíos, duplicados?}, (5) \emph{¿qué pregunta concreta voy a responder?}. Esas 5 preguntas son la pesa digital que la phronesis ancestral pide al oficio moderno.
  pregunta_puente: |-
    ¿Qué sabía la abuela al separar el frijol antes de cocinar, que el estudiante novato olvida cuando salta a calcular promedios sin haber mirado los datos? ¿Y por qué un analista profesional dedica más tiempo a \emph{preguntar} a sus datos que a \emph{calcular} con ellos?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 5 preguntas prudentes que se deben hacer a cualquier conjunto de datos antes de calcular; (2) \textbf{analizar} un conjunto de datos del entorno escolar aplicando las 5 preguntas; (3) \textbf{evaluar} qué se puede calcular con honestidad y qué se debe dejar fuera por falta de calidad o claridad; (4) \textbf{explicar} con tus propias palabras por qué \emph{preguntar antes de calcular} es virtud profesional, no pérdida de tiempo.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Este es el primer periodo del grado 8 y vas a aprender a trabajar con datos en Excel. Hoy abrimos con lo más importante y lo más subestimado: \textbf{la disciplina de preguntar antes de calcular}. Las 9 sesiones que siguen (tipos de datos, tablas, funciones, gráficos, mini-estudio) se sostienen sobre la phronesis que aprendes hoy.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{mirada honesta} a un conjunto de datos reales (las notas del último parcial del grupo, el tiempo de pantalla del aula, los gastos en la tienda escolar). Vas a anotar qué te llama la atención sin todavía calcular nada: la primera observación es solo eso, observación.
  a_sistematizacion: |-
    Ya miraste los datos. Ahora vas a entender la \textbf{anatomía de las 5 preguntas prudentes}: qué pregunta cada una, por qué importa, qué pasa si la saltas. Las 5 preguntas funcionan como las 3 pilas de la abuela: separan lo bueno, lo malo y lo dudoso del conjunto de datos.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: hacer las 5 preguntas al conjunto elegido, escribir las respuestas, declarar con honestidad qué se puede calcular y qué se debe dejar fuera.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 5 preguntas con respuesta + decisión razonada + párrafo de cierre que reconozca limitaciones. El criterio principal: que un compañero leyendo tu hoja pueda decidir si confía o no en lo que vas a calcular después.
  a_evaluacion: |-
    Antes de cerrar, mira la phronesis desde las cinco dimensiones humanas. Preguntar antes de calcular es respeto por la verdad de los datos; saltar al cálculo sin preguntar es la manera más rápida de engañarse a uno mismo.
  a_triangulo: |-
    Y para terminar, tres voces sobre la mirada honesta. Dussel sobre los datos que invisibilizan a las personas, Marco Aurelio sobre ver las cosas como son, Floridi sobre la responsabilidad de tratar los datos como información, no como ruido.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Primera mirada a un conjunto real} (15 min · individual). Tu docente te entrega (o proyecta) un conjunto de datos del entorno escolar: pueden ser las notas del último parcial, el tiempo de pantalla del aula, los gastos en la tienda, el clima de la semana, las inasistencias del grupo. Sin calcular nada todavía, mira el conjunto durante 5 minutos y anota: (a) ¿qué columnas tiene?, (b) ¿qué filas?, (c) ¿hay algo que te llame la atención (vacíos, errores, datos raros)?, (d) ¿qué te gustaría saber a partir de estos datos?. La regla: \textbf{primero observa, después pregunta}. Sin todavía sacar cuentas.
  checks:
  - Miré el conjunto durante 5 minutos sin calcular nada.
  - Anoté qué columnas y qué filas tiene.
  - Detecté al menos 1 dato raro o vacío.
  - Tengo 1 pregunta que me gustaría responder con los datos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Primera mirada». \textbf{Formato:} ficha con 4 campos (columnas, filas, datos raros, pregunta de interés). \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} sabes qué hay en el conjunto antes de saber qué vas a calcular.
sistematizacion:
  intro: |-
    Una mirada general es buen comienzo, pero no basta. Para que tu trabajo sea profesional necesitas las \textbf{5 preguntas prudentes} que todo analista de datos se hace antes de calcular. Estas 5 preguntas son la pesa de la abuela aplicada a Excel.
  pilares:
  - |-
    Las 5 preguntas se descomponen así: (1) \textbf{Origen}: \emph{¿de dónde vienen estos datos?} (¿los recolectó alguien?, ¿es una encuesta, una observación, un registro?). (2) \textbf{Autor y tiempo}: \emph{¿quién los recolectó y cuándo?} (datos de hace 5 años pueden no servir para decisiones de hoy). (3) \textbf{Tipo de dato}: \emph{¿qué hay en cada columna?} (¿números, texto, fechas?, ¿están bien escritos?). (4) \textbf{Errores y vacíos}: \emph{¿hay datos repetidos, vacíos, claramente equivocados?} (un peso de \emph{``cinco mil''} escrito como texto cuando debería ser número). (5) \textbf{Pregunta}: \emph{¿qué pregunta concreta voy a responder con estos datos?} (sin pregunta clara, los cálculos no significan nada).
  - |-
    Existe un patrón profesional llamado \textbf{``observación antes de cálculo''}: los analistas dedican 60\% del tiempo a entender los datos y 40\% a calcular sobre ellos. Los novatos hacen lo opuesto: 10\% mirar y 90\% calcular. Por eso los novatos producen análisis equivocados con apariencia de exactitud. La phronesis del oficio digital consiste en \textbf{aceptar que la mirada lenta es la inversión más productiva del análisis}.
  - |-
    Lo esencial cabe en una frase: \emph{los datos no hablan solos; los datos contestan preguntas}. Si tú no tienes una pregunta clara antes de empezar, los datos te van a llevar por donde menos te conviene: sacarás promedios que no significan nada, harás gráficos bonitos pero sin propósito, llegarás a conclusiones que no responden lo que importa. La phronesis pregunta primero, calcula después.
  - |-
    Algoritmo: (1) toma el conjunto de datos; (2) aplica las 5 preguntas en orden; (3) responde cada una en 1-2 líneas; (4) detecta qué datos son \emph{de confianza} (origen claro, tipo correcto, sin errores graves), cuáles son \emph{dudosos} (algo no cuadra) y cuáles son \emph{de descarte} (mejor no usarlos); (5) elige la pregunta más interesante de la lista; (6) declara qué vas a calcular y qué no, explicando por qué.
  anatomia:
    titulo: Anatomía de la phronesis con datos
    body: |-
      \textbf{Origen:} ¿de dónde vienen? \\[1mm] \textbf{Autor y tiempo:} ¿quién y cuándo? \\[1mm] \textbf{Tipo de dato:} ¿qué hay en cada columna? \\[1mm] \textbf{Errores y vacíos:} ¿qué falla? \\[1mm] \textbf{Pregunta:} ¿qué voy a responder?
  errores_comunes: |-
    (1) \textbf{Saltar al cálculo}: abrir Excel y empezar a sacar promedios sin haber mirado el conjunto. (2) \textbf{Confiar ciegamente en los datos}: asumir que están bien porque se ven ordenados. (3) \textbf{Calcular sin pregunta}: hacer 10 fórmulas sin saber qué se intenta responder. (4) \textbf{Ignorar los vacíos}: tratar las celdas vacías como si fueran ceros, alterando los promedios. (5) \textbf{No declarar limitaciones}: presentar conclusiones sin reconocer que la muestra es pequeña o que algunos datos eran dudosos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Las 5 preguntas». \textbf{Formato:} lista de las 5 preguntas con su respuesta para tu conjunto elegido. \textbf{Sabes que terminaste cuando} podrías explicarle a un compañero qué tan confiables son los datos antes de calcular nada.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + EXPLICA --- Decisión razonada y cierre honesto} (20 min · individual). Hora de aplicar. Eliges la pregunta más interesante de tu lista, declaras qué vas a calcular para responderla, y cierras con un párrafo honesto que reconozca las limitaciones del conjunto.
  pilares:
  - |-
    Tu entrega se construye en 4 piezas: (1) \textbf{Lista de las 5 preguntas} respondidas. (2) \textbf{Pregunta elegida} (la más interesante de las 5 que se pueden responder). (3) \textbf{Decisión} de qué se va a calcular (promedios, sumas, conteos, mínimos, máximos) y qué se va a dejar fuera por falta de calidad. (4) \textbf{Párrafo de cierre} de 5-7 líneas que reconozca con honestidad: \emph{``Estos datos tienen X limitaciones; mis conclusiones aplican a Y; no aplican a Z''}.
  - |-
    Sigue el patrón \textbf{``honestidad sobre apariencia''}: la entrega que reconoce limitaciones es más profesional que la que finge certezas. Los datos siempre tienen huecos; el oficio consiste en mostrar los huecos, no en taparlos. Quien tapa los huecos engaña a sus lectores; quien los muestra construye confianza.
  - |-
    Las decisiones posibles sobre qué calcular tienen criterios claros: (a) \textbf{Calcular} cuando los datos tienen origen claro, tipo correcto y muestra suficiente. (b) \textbf{Calcular con advertencia} cuando los datos son útiles pero limitados (muestra pequeña, periodo corto). (c) \textbf{No calcular} cuando los datos tienen errores estructurales (vacíos masivos, tipo equivocado, origen desconocido).
  - |-
    Algoritmo: (1) revisa las respuestas a las 5 preguntas; (2) elige la pregunta más interesante que se pueda responder con confianza; (3) declara qué cálculos harías en una sesión siguiente; (4) escribe el párrafo de cierre con las limitaciones; (5) léelo en voz alta y verifica si suena honesto, no defensivo.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 5 preguntas respondidas con 1-2 líneas cada una. \\[1mm] \checkbox 1 pregunta elegida como la más interesante. \\[1mm] \checkbox Decisión sobre qué se va a calcular y qué no. \\[1mm] \checkbox Párrafo de cierre con limitaciones reconocidas. \\[1mm] \checkbox Lectura en voz alta de la entrega completa. \\[1mm] \checkbox La entrega cabría en 1 página.
  plantilla_guion: |-
    \textbf{5 preguntas.} \textit{Origen + autor/tiempo + tipo + errores + pregunta.} \\[1mm] \textbf{Pregunta elegida.} \textit{La que voy a responder.} \\[1mm] \textbf{Voy a calcular.} \textit{Lista corta de cálculos justificados.} \\[1mm] \textbf{No voy a calcular.} \textit{Lista de lo que dejo fuera y por qué.} \\[1mm] \textbf{Limitaciones.} \textit{Muestra, periodo, sesgos posibles.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + EXPLICA).} Título: «Actividad 3 --- Decisión razonada». \textbf{Formato:} ficha con las 4 piezas (5 preguntas, pregunta elegida, decisión, párrafo de cierre). \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} podrías leer en voz alta tu decisión y sentir que es honesta.
  producto_titulo: 5 preguntas + decisión razonada + cierre honesto con limitaciones
  criterios:
  - 5 preguntas prudentes respondidas
  - Pregunta elegida con justificación
  - Decisión sobre qué calcular y qué no
  - Párrafo de cierre con limitaciones reconocidas
  - Lectura en voz alta hecha
  - Entrega en máximo 1 página
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Los datos que invisibilizan a personas reales producen análisis que repiten la exclusión.
    aplicacion: |-
      Cuando miras un conjunto de datos del colegio, recuerda que detrás de cada fila hay una persona real: un estudiante, un docente, una familia. La filosofía de la liberación pide no olvidar esa humanidad. Si los datos están mal recolectados, si excluyen a algunos, si simplifican personas en números, tus cálculos repetirán esa exclusión. La phronesis del dato consiste en \textbf{ver a la persona detrás de la fila}, no solo el número.
    pregunta_espejo: |-
      ¿Quién o quiénes están detrás de los datos que estoy analizando? ¿Mi análisis los respeta o los reduce?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Mira las cosas como son, no como te gustaría que fueran.
    aplicacion: |-
      Es tentador hacer que los datos digan lo que tú esperas. La disciplina estoica recomienda lo contrario: \emph{ver los datos como son}. Si la muestra es pequeña, dilo. Si los datos son dudosos, reconócelo. Si tu pregunta no se puede responder con lo que tienes, declara que necesitas más datos. Esa honestidad de mirada es la virtud técnica más valiosa del análisis de datos.
    pregunta_espejo: |-
      ¿Estoy mirando los datos como son, o como me gustaría que fueran para confirmar lo que ya creía?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Tratar los datos como información cuidada es ya un acto ético en la era digital.
    aplicacion: |-
      En la era de la información hay datos en exceso pero pocas miradas cuidadosas. La ética digital contemporánea pide tratar los datos no como ruido a procesar sino como información que merece respeto: verificar origen, declarar limitaciones, no calcular más allá de lo que los datos soportan. Cuando aplicas las 5 preguntas prudentes, estás practicando esa ética del oficio digital.
    pregunta_espejo: |-
      ¿Estoy tratando estos datos con el cuidado que merecen, o los proceso como si fueran ruido?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu conjunto de datos identificado y las 5 preguntas respondidas. En la sesión 2 vas a aprender a \textbf{clasificar los datos por tipo} en Excel (número, texto, fecha, moneda, porcentaje), lo que te permite trabajar con ellos sin errores. La phronesis de hoy es la base; la técnica de mañana se monta sobre esa base.

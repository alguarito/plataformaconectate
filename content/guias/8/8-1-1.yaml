# Contrato v3.1 (piloto 2026-09): duración declarada, fuente APA del saber
# ancestral, un verbo por actividad, bloque web explícito.
duracion_min: 90
titulo: Preguntar antes de calcular --- phronesis con datos
titulo_portada: |-
  Preguntar antes
  de calcular ---
  phronesis con datos
producto_final: |-
  Una ficha con las cinco preguntas respondidas para una hoja de datos real del colegio, la decisión de qué vas a calcular y qué dejas fuera, y un párrafo de cierre que diga cuántas filas hay, de qué periodo son y a quién no describen.
apertura:
  origen: Cuaderno del fiado · tiendas de barrio
  fuente: |-
    Martínez Benavides, A. (2021). Circuitos crediticios: fiado y trabajo relacional en un pequeño negocio en Cali, Colombia. \emph{Estudios Sociológicos de El Colegio de México, 39}(116), 467--494.
  saber_ancestral: |-
    En muchas tiendas de barrio de Cartago todavía existe el \textbf{cuaderno del fiado}. Cada renglón guarda cuatro datos: quién llevó, qué día, qué llevó y cuánto vale. Cuando la familia viene a pagar, la tendera no suma de una. Primero \textbf{le pregunta al cuaderno}: ¿esta letra es mía o de mi hijo?, ¿este cinco es un cinco o un tres?, ¿falta el sábado?, ¿estoy cobrando la quincena o el mes? Solo después saca la cuenta. Una socióloga que estudió el fiado en un pequeño negocio de Cali encontró que fiar es un pacto de confianza entre vecinos, sostenido por un cuaderno que se revisa y se tacha (Martínez Benavides, 2021). «Miremos el cuaderno» resuelve la discusión que la memoria sola no resuelve. Ahí está lo importante: \textbf{el registro vale porque cualquiera puede ponerlo a prueba}. Pero el cuaderno tiene una \textbf{cara de exclusión}: a quien la tendera no conoce, no le fía. Solo cuenta a los que ya estaban adentro. Preguntar antes de sumar y saber quién falta en la lista: eso es lo que hoy vas a hacer con una hoja de datos.
  saber_contemporaneo: |-
    Abres la hoja de notas de 8-A en Excel: 30 filas, 6 columnas. La tentación es sacar el promedio de una. Pero tres celdas dicen «ausente», una nota está escrita con letras y nadie sabe de qué parcial es la hoja. Si calculas sin mirar, el promedio sale, se ve exacto y está mal. Un analista hace \textbf{cinco preguntas antes de la primera fórmula}: (1) \emph{¿de dónde viene la hoja?}; (2) \emph{¿quién la recogió y cuándo?}; (3) \emph{¿qué hay en cada columna: número, texto o fecha?}; (4) \emph{¿qué falta, qué se repite, qué es imposible?}; (5) \emph{¿qué quiero responder exactamente?}. A esa costumbre de preguntar antes de actuar los griegos la llamaron \textbf{phronesis}: sabiduría práctica. La tendera la tiene con su cuaderno. Hoy la practicas tú con una hoja de datos.
  pregunta_puente: |-
    La tendera le pregunta al cuaderno antes de sumar. Cuando abras una hoja con 200 filas, ¿qué le vas a preguntar antes del primer promedio? ¿Y quién no aparece en esas filas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué columnas, filas y datos raros tiene una hoja antes de calcular; (2) \textbf{analizar} una hoja real del colegio con las cinco preguntas; (3) \textbf{evaluar} qué se puede calcular con confianza y qué se deja fuera; (4) \textbf{explicar} con tus palabras por qué preguntar antes de calcular no es perder tiempo.
puentes:
  a_ruta: |-
    Este es el primer periodo de 8.º y vas a aprender a trabajar con datos en Excel. Hoy no hay fórmulas: hay una costumbre. Las nueve sesiones que siguen (tipos de datos, tablas, funciones, gráficos, mini estudio) se apoyan en lo que aprendes hoy: \textbf{mirar y preguntar antes de calcular}.
  a_escuta: |-
    Antes de la teoría, vas a mirar una hoja de datos real durante cinco minutos sin calcular nada. Solo mirar y anotar. La primera observación es eso: observación.
  a_sistematizacion: |-
    Ya miraste la hoja. Ahora vas a entender las \textbf{cinco preguntas} que la tendera le hace a su cuaderno antes de sumar, y a hacérselas tú a tus datos con tu pareja.
  a_praxis: |-
    Ya sabes qué tan confiable es tu hoja. Toca decidir: qué vas a calcular, qué dejas fuera y por qué. Lo escribes tú, con honestidad.
  a_producto: |-
    Lo que entregas hoy: la ficha de las cinco preguntas, la decisión de qué calcular y qué no, y un párrafo de cierre con los límites de tu hoja. La prueba de calidad: un compañero lee tu ficha y sabe si confiar o no en tu cálculo.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Preguntar antes de calcular es respetar los datos y a las personas que hay detrás; saltar al cálculo es la forma más rápida de engañarse.
  a_triangulo: |-
    Para terminar, tres voces sobre mirar bien. Dussel, en \emph{Filosofía de la liberación}, sobre quién queda fuera del sistema; Marco Aurelio, en las \emph{Meditaciones}, sobre cambiar de opinión cuando te muestran el error; Floridi, en su texto sobre big data, sobre cuándo un patrón pequeño significa algo.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Mira la hoja antes de tocarla} (15 min · individual). (1) Recibe la hoja de datos que te entrega o proyecta tu docente: notas del último parcial, tiempo de pantalla del salón o gastos de la tienda escolar. (2) Mírala 5 minutos sin calcular nada: ni promedios, ni sumas. (3) Anota qué columnas tiene y cuántas filas hay. (4) Marca al menos un dato raro: una celda vacía, un texto donde va un número, un valor imposible. (5) Escribe una pregunta que te gustaría responder con esos datos. La regla de hoy: \textbf{primero observa, después pregunta, y solo al final calcula}.
  checks:
  - Anoté qué columnas tiene la hoja y cuántas filas hay.
  - Marqué al menos un dato raro y puedo decir por qué es raro.
  - Escribí una pregunta que se puede responder con esas columnas.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Primera mirada». \textbf{Formato:} ficha de 4 casillas: columnas, filas, datos raros, mi pregunta. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cuatro casillas están llenas, puedes señalar con el dedo un dato raro y decir por qué lo es, y tu pregunta se responde con esas columnas y no con otras.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · ANALIZA --- Hazle las cinco preguntas a tu hoja} (25 min · parejas). Una hoja de datos no habla sola: contesta preguntas. Estas cinco se hacen en orden, antes de la primera fórmula. (1) Con tu pareja, toma la hoja que miraste en la Actividad 1. (2) Respondan en una línea de dónde viene y quién la recogió; si no saben, escriban «no se sabe»: también es una respuesta. (3) Recorran columna por columna y anoten el tipo de dato (número, texto, fecha) y cuántas celdas vacías o raras hay. (4) Escriban la pregunta concreta que quieren responder. (5) Marquen cada columna con C (de confianza), D (dudosa) o X (de descarte) y digan por qué en cinco palabras.
  pilares:
  - |-
    \textbf{Origen y autor.} Pregunta 1: \emph{¿de dónde viene la hoja?} (una encuesta, un registro del docente, una copia de otra hoja). Pregunta 2: \emph{¿quién la recogió y cuándo?} Una hoja de hace tres años responde preguntas de hace tres años. Si no sabes el origen, escríbelo: «origen desconocido» ya es un dato sobre la hoja.
  - |-
    \textbf{Tipo de dato.} Pregunta 3: \emph{¿qué hay en cada columna?} Números, texto o fechas. Excel suma números, no palabras: «dos mil» escrito con letras no entra en la suma y nadie te avisa. Una fecha escrita como texto tampoco se ordena. Mira columna por columna, no la hoja entera.
  - |-
    \textbf{Errores y vacíos.} Pregunta 4: \emph{¿qué falta, qué se repite, qué es imposible?} Una celda vacía no es un cero: si la tratas como cero, el promedio baja. Una nota de 7 en una escala de 1 a 5 es imposible. Un estudiante repetido cuenta dos veces. Anota cuántas celdas raras hay en cada columna.
  - |-
    \textbf{Pregunta y decisión.} Pregunta 5: \emph{¿qué quiero responder exactamente?} «¿Cómo le fue al grupo?» es vaga; «¿cuántos estudiantes sacaron menos de 3,0 en el parcial de marzo?» se puede responder. Con la pregunta clara, marca cada columna: \textbf{C} de confianza (origen claro, tipo correcto, pocos vacíos), \textbf{D} dudosa (algo no cuadra) o \textbf{X} de descarte (mejor no usarla).
  anatomia:
    titulo: Las cinco preguntas, en una mirada
    body: |-
      \textbf{1 Origen:} ¿de dónde viene? \\[1mm] \textbf{2 Autor y fecha:} ¿quién y cuándo? \\[1mm] \textbf{3 Tipo de dato:} ¿número, texto o fecha? \\[1mm] \textbf{4 Errores y vacíos:} ¿qué falta o es imposible? \\[1mm] \textbf{5 Pregunta:} ¿qué quiero responder?
  errores_comunes: |-
    (1) \textbf{Saltar al cálculo}: abrir Excel y sacar promedios sin haber mirado la hoja. (2) \textbf{Creer que una celda vacía es un cero}: baja el promedio en silencio. (3) \textbf{Sumar texto disfrazado de número}: «dos mil», «3,5 aprox.», «N/A». (4) \textbf{Pensar que más filas es más confiable}: 200 filas del mismo salón siguen hablando solo de ese salón. (5) \textbf{No decir qué dejaste fuera}: presentar el resultado como si la hoja fuera perfecta.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} \textbf{Título:} «Actividad 2 --- Las cinco preguntas». \textbf{Formato:} tabla de 5 filas (una por pregunta) y 2 columnas (pregunta / respuesta), más la lista de columnas con su letra C, D o X. \textbf{Extensión:} media página; cada respuesta de 1 a 2 renglones. \textbf{Sabes que terminaste cuando} las cinco preguntas tienen respuesta (aunque alguna sea «no se sabe»), cada columna tiene su letra con una razón, y tu pareja puede decir, sin preguntarte nada, si confiaría en un promedio de esa hoja.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Decide qué calcular y qué dejar fuera} (25 min · individual). Ya sabes qué tan confiable es tu hoja. Ahora decides, y lo escribes tú. (1) Relee las respuestas de las cinco preguntas; tu pareja puede opinar, pero escribes tú. (2) Elige la pregunta que sí se puede responder con confianza y subráyala. (3) Escribe qué vas a calcular (promedio, suma, conteo, mínimo, máximo) y por qué sirve para tu pregunta. (4) Escribe qué dejas fuera y por qué: una columna dudosa, celdas vacías, un dato que no entiendes. (5) Cierra con un párrafo de 4 renglones: cuántas filas hay, de qué periodo son y a quién sí y a quién no describen.
  pilares:
  - |-
    \textbf{Tu ficha tiene 4 piezas.} (1) La pregunta elegida, subrayada. (2) «Voy a calcular»: uno o dos cálculos, cada uno con su razón. (3) «Dejo fuera»: al menos una cosa, con su razón. (4) Un párrafo de cierre que diga cuántas filas hay, de qué periodo son y a quién no describen.
  - |-
    \textbf{Calcular, calcular con aviso o no calcular.} Calcula cuando la columna es C: origen claro, tipo correcto, pocos vacíos. Calcula con aviso cuando es D: sirve, pero escribes el límite al lado («solo 12 estudiantes», «solo la semana pasada»). No calcules cuando es X: muchos vacíos, tipo equivocado, origen desconocido.
  - |-
    \textbf{Honestidad antes que apariencia.} Una ficha que dice «esta hoja tiene 30 filas de un solo salón y no describe al colegio» es mejor trabajo que una que finge certeza. Los datos siempre tienen huecos; el oficio consiste en mostrarlos, no en taparlos. Quien tapa los huecos engaña; quien los muestra construye confianza.
  - |-
    \textbf{Antes de entregar, léelo en voz alta.} Si suena defensivo («los datos estaban mal, no es culpa mía»), reescribe: describe la hoja, no te disculpes. Si suena seguro de más («esto prueba que…»), agrega el límite. El tono correcto es el de la tendera: «miremos el cuaderno».
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Las cinco preguntas tienen respuesta de 1 a 2 renglones. \\[1mm] \checkbox La pregunta elegida está subrayada y tiene una razón. \\[1mm] \checkbox Cada cálculo tiene su razón escrita al lado. \\[1mm] \checkbox Hay al menos una cosa que dejo fuera, con su razón. \\[1mm] \checkbox El párrafo de cierre dice cuántas filas hay y de qué periodo son. \\[1mm] \checkbox Lo leí en voz alta y suena honesto, no defensivo.
  plantilla_guion: |-
    \textbf{Pregunta elegida.} \textit{La que sí se puede responder.} \\[1mm] \textbf{Voy a calcular.} \textit{Uno o dos cálculos, cada uno con su razón.} \\[1mm] \textbf{Dejo fuera.} \textit{Qué no uso y por qué.} \\[1mm] \textbf{Cierre.} \textit{Cuántas filas, de qué periodo, a quién no describen.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Decido qué calcular». \textbf{Formato:} ficha de 4 piezas: pregunta elegida, calculo, dejo fuera, párrafo de cierre. \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} cada cálculo tiene una razón al lado, hay al menos una cosa que dejas fuera con su porqué, el párrafo dice cuántas filas hay y de qué periodo son, y lo leíste en voz alta sin sonar defensivo.
  producto_titulo: Ficha de las cinco preguntas + decisión de qué calcular + cierre honesto
  criterios:
  - Las cinco preguntas tienen respuesta de 1 a 2 renglones cada una
  - La pregunta elegida está subrayada y tiene una razón escrita
  - Cada cálculo propuesto tiene su razón al lado
  - Hay al menos una cosa que se deja fuera, con su porqué
  - El párrafo de cierre dice cuántas filas hay y de qué periodo son
  - La ficha cabe en una página y se leyó en voz alta
triangulo:
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977)
    cita: |-
      El otro se revela realmente como otro\ldots como el pobre, el oprimido; el que, a la vera del camino, fuera del sistema, muestra su rostro sufriente y sin embargo desafiante.
    aplicacion: |-
      La hoja solo cuenta a quien alguien anotó. El que no vino el día de la encuesta, el que no tiene celular para reportar su tiempo de pantalla, el que la tendera no conoce: ninguno está en las filas. Antes de calcular, pregunta quién quedó \textbf{a la vera del camino}. Un promedio que no sabe a quién dejó fuera repite la exclusión sin darse cuenta.
    pregunta_espejo: |-
      ¿Quién no aparece en mi hoja? ¿Qué cambiaría en mi cálculo si estuviera?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 21 (c. 175 d.C.)
    cita: |-
      Si alguien puede refutarme y probar de modo concluyente que pienso o actúo incorrectamente, de buen grado cambiaré de proceder. Pues persigo la verdad, que no dañó nunca a nadie; en cambio, sí se daña el que persiste en su propio engaño e ignorancia.
    aplicacion: |-
      Si tu pareja te muestra que una columna está mal, cambias la decisión y ya: no es una derrota, es lo que hace el que persigue la verdad. Persistir en un promedio que sabes flojo, porque ya lo escribiste o porque te da la razón, es el engaño del que habla el emperador. \textbf{Ver los datos como son} vale más que tener la razón.
    pregunta_espejo: |-
      ¿Estoy leyendo los datos como son, o como me gustaría que fueran para darme la razón?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    cita: |-
      Los pequeños patrones solo pueden ser significativos si se agregan correctamente, se comparan y se procesan a tiempo.
    aplicacion: |-
      Un promedio es un patrón pequeño. Solo vale si sumaste bien (sin textos disfrazados de números ni vacíos contados como ceros), si lo comparaste con algo (otro salón, otro mes) y si los datos no están vencidos. Las cinco preguntas son la forma de \textbf{agregar correctamente} antes de creerle a un número.
    pregunta_espejo: |-
      ¿Mi cálculo agrega bien, compara con algo y llega a tiempo? ¿O es un número solo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu hoja elegida y las cinco preguntas respondidas. En la sesión 2 vas a clasificar esos datos por tipo en Excel: número, texto, fecha, moneda. Lo de hoy es la base; lo de la próxima semana se monta encima.
recursos:
  diagramas:
    - archivo: mirar-preguntar-decidir.tex
      alt: |-
        Tres cajas en fila unidas por flechas: mirar, preguntar y decidir. Al final, una cuarta caja punteada dice «calcular, solo ahora». Debajo, la tira de las cinco preguntas: origen, autor y fecha, tipo de dato, errores y vacíos, pregunta.
      caption: |-
        El orden importa: mirar, preguntar y decidir van antes de cualquier fórmula. La tendera hace lo mismo con su cuaderno antes de sumar.
      donde: sistematizacion
web:
  resumen: Antes de sacar el primer promedio, hazle preguntas a la hoja. Hoy aprendes las cinco preguntas que un analista hace antes de calcular, con el cuaderno del fiado como maestro.
  subtema: Análisis de datos con phronesis
  pre_lectura:
    por_que_importa: Saber leer una hoja de datos te va a servir toda la vida, desde decidir qué red social te conviene hasta votar con criterio. Pero leer datos sin preguntar es peligroso. Te lleva a conclusiones rápidas que la realidad no sostiene.
    pregunta_detonante: La tendera le pregunta al cuaderno antes de sumar. Cuando abras una hoja con 200 filas, ¿qué le vas a preguntar antes del primer promedio?
    activacion:
      titulo: El dato del bolsillo
      descripcion: En 3 minutos, saca tu celular y mira tu tiempo de pantalla de ayer. ¿Qué pregunta se te ocurre con ese dato? ¿Qué te falta saber para decidir algo sobre tu uso del celular?
      duracion_min: 5
    conexion:
      anterior: En 7.º trabajaste con tablas básicas y comparaste datos de palabras, no de números.
      siguiente: En la sesión 2 vas a ingresar datos en Excel con su tipo correcto, número, texto, fecha, moneda.

clave: 1-10
grado: 8
periodo: 1
sesion: 10
completo: true
duracion_min: 90
titulo: Sustentar el mini estudio --- cuatro minutos y las preguntas de los demás
titulo_portada: |-
  Sustentar en
  cuatro minutos
producto_final: |-
  Una sustentación oral de cuatro minutos de tu mini estudio, con cinco diapositivas (pregunta, método, hallazgo, gráfico, decisión y limitaciones). Tres a cinco preguntas del grupo respondidas con honestidad. Y una autoevaluación con una fortaleza y una mejora concreta para la próxima vez.
apertura:
  origen: Pueblo misak · el nak chak, donde el asunto se lleva al fogón
  fuente: |-
    Montano Morales, J. (2025). Comer y vivir bien en el mundo indígena misak: «sentipensar el cuidado de la vida». \emph{Revista de Estudios Sociales}, (91), 163--174.
  saber_ancestral: |-
    Entre los misak, en el resguardo de Guambía (Silvia, Cauca), la escuela no empieza en un salón: empieza en la cocina. Llaman \textbf{nak chak} a la cocina y \textbf{nak kuk} al fogón. Los mayores dicen que ahí «se dinamiza la educación propia» (Montano Morales, 2025). Alrededor del fuego se cocina, se come, se cuentan las cosas del día y se resuelven los desacuerdos. Un asunto no se resuelve donde ocurre: se lleva al fogón, se cuenta, y los demás preguntan. Quien cuenta no expone; se somete a las preguntas. Eso es sustentar. La \textbf{cara de exclusión}: cocinar entre los misak se concentra en el mundo femenino, y el fogón fue espacio de palabra y también de reparto desigual del trabajo. Y una advertencia: el nak chak es de un pueblo que defiende su territorio; lo que hacemos hoy es mucho más pequeño y aprende de eso, no lo imita. Hoy vas a llevar tu mini estudio al fogón del salón: cuatro minutos para contarlo y el tiempo que haga falta para las preguntas.
  saber_contemporaneo: |-
    Una \textbf{sustentación} es contar en público un trabajo propio con tres condiciones. Tiempo limitado: aquí, cuatro minutos. Un apoyo visual que ayuda sin reemplazar tu voz: cinco diapositivas. Y preguntas del público, respondidas con honestidad. El tiempo corto no es castigo: te obliga a decidir qué es esencial. Para un estudio de ocho etapas son unos treinta segundos por etapa. Lo que no cabe, o no era esencial, o todavía no lo entiendes del todo. Las preguntas tampoco son ataque: son la parte donde se ve si el estudio se sostiene. «No lo resolví, porque mi muestra fue pequeña» es una respuesta mejor que una explicación inventada.
  pregunta_puente: |-
    En el nak chak, quien cuenta el asunto no se defiende: escucha las preguntas. Cuando un compañero te pregunte «¿y a quién no encuestaste?», ¿vas a responder o a defenderte? ¿Qué diferencia hay?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} tu informe para reducirlo a cinco ideas que quepan en cuatro minutos; (2) \textbf{crear} cinco diapositivas que ayuden sin reemplazar tu voz; (3) \textbf{evaluar} tu sustentación y la de otros con criterios claros; (4) \textbf{explicar} con honestidad lo que tu estudio no pudo saber.
puentes:
  a_ruta: |-
    En la sesión 9 hiciste el mini estudio. Hoy lo cuentas en cuatro minutos y respondes preguntas. Con esto cierra el periodo; el siguiente arranca con lógica y micro:bit.
  a_escuta: |-
    Antes de armar diapositivas, vas a contar tu estudio en voz alta con cronómetro, sin leer. Ahí descubres qué sobra y qué falta.
  a_sistematizacion: |-
    Ya sabes cuánto cabe en cuatro minutos. Ahora armas las cinco diapositivas con tu pareja, ensayas y os corregís.
  a_praxis: |-
    Ya ensayaste. Toca sustentar frente al grupo, responder preguntas y evaluar con criterios lo que hiciste y lo que hicieron los demás.
  a_producto: |-
    Lo que entregas hoy: las cinco diapositivas, la sustentación hecha, las preguntas respondidas y tu autoevaluación. La prueba de calidad: quien te escuchó puede decir en una frase qué hiciste y qué encontraste.
  a_evaluacion: |-
    Antes de cerrar, mira el periodo entero desde cinco lados. Diez sesiones, un estudio propio y cuatro minutos para contarlo.
  a_triangulo: |-
    Para terminar el periodo, tres ideas sobre escuchar y contar, con palabras de esta guía: Dussel sobre el respeto como silencio del que escucha, Marco Aurelio sobre atender a lo que dice el otro, Floridi sobre la atención como un bien escaso.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Cuatro minutos sin leer} (15 min · individual). (1) Toma tu informe y ponlo boca abajo. (2) Pon el cronómetro en cuatro minutos y cuenta tu estudio en voz alta, como a un amigo: pregunta, hipótesis, método, hallazgo, decisión. (3) Al terminar, anota qué dejaste fuera por falta de tiempo. (4) Anota qué dijiste de más. (5) Anota qué parte sonó más floja y por qué.
  checks:
  - Conté el estudio completo en voz alta, sin leer, con cronómetro.
  - Anoté qué dejé fuera y qué dije de más.
  - Sé cuál parte sonó más floja.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} \textbf{Título:} «Actividad 1 --- Cuatro minutos sin leer». \textbf{Formato:} tres líneas (qué dejé fuera / qué dije de más / qué sonó flojo) y el tiempo que tardé. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las tres líneas están llenas y sabes qué vas a recortar antes de armar las diapositivas.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · CREA --- Cinco diapositivas y un ensayo} (30 min · parejas). (1) Reduce tu informe a cinco ideas, una por diapositiva: la pregunta y por qué importa; el método; el hallazgo con sus cifras; el gráfico honesto; la decisión y las limitaciones. (2) Arma las cinco en PowerPoint, Canva o Slides, con máximo veinticinco palabras cada una. (3) Escribe el guion hablado: unas seiscientas palabras son cuatro minutos. (4) Ensaya frente a tu pareja con cronómetro. (5) Tu pareja te dice una cosa que no entendió y una que sobró; cambien de rol.
  pilares:
  - |-
    \textbf{Las cinco diapositivas y su tiempo.} Pregunta y por qué importa: 45 segundos. Método: 45. Hallazgo con cifras: 60. Gráfico: 45. Decisión y limitaciones: 45. Cada diapositiva se lee en cinco segundos; tu voz dice el resto.
  - |-
    \textbf{Menos de veinticinco palabras.} Si la diapositiva tiene más, la gente la lee y deja de escucharte. Una cifra grande, un título claro, un gráfico. Lo demás lo cuentas tú.
  - |-
    \textbf{El guion no se lee: se recuerda.} Escríbelo para ordenarte, ensáyalo dos veces y guárdalo. Si lees, no estás sustentando. Si te pierdes, mira la diapositiva: para eso está.
  - |-
    \textbf{Las cifras con su contexto.} «El promedio es 3» no dice nada. «El promedio es 3 horas al día de pantalla, y el máximo fue 8» sí. Cada cifra con su unidad y con qué se compara.
  anatomia:
    titulo: La sustentación, en una mirada
    body: |-
      \textbf{1. Pregunta:} y por qué importa. \\[1mm] \textbf{2. Método:} a quién, cuántos, cómo. \\[1mm] \textbf{3. Hallazgo:} una frase con cifras. \\[1mm] \textbf{4. Gráfico:} honesto. \\[1mm] \textbf{5. Decisión:} y lo que no pude saber.
  errores_comunes: |-
    (1) \textbf{Leer las diapositivas}: si lees, no sustentas. (2) \textbf{Diapositiva llena}: más de veinticinco palabras y nadie escucha. (3) \textbf{Cifra sin contexto}: «el promedio es 3,5» de qué. (4) \textbf{Inflar el hallazgo}: concluir más de lo que veinte datos aguantan. (5) \textbf{Evadir la pregunta difícil}: peor que decir «no lo resolví». (6) \textbf{Pasarse del tiempo}: es falta de ensayo, no exceso de contenido.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · CREA).} \textbf{Título:} «Actividad 2 --- Cinco diapositivas y un ensayo». \textbf{Formato:} las cinco ideas, una línea cada una, con su tiempo; y las dos observaciones de tu pareja. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cinco diapositivas tienen menos de veinticinco palabras, ensayaste con cronómetro y aplicaste al menos una observación de tu pareja.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Sustentar, responder y evaluar} (35 min · individual). (1) Sustenta frente al grupo, o en rondas de cinco, con cronómetro visible: cuatro minutos. (2) Responde de tres a cinco preguntas; si no sabes, di «no lo resolví» y por qué. (3) Mientras escuchas a otros, evalúa con los cinco criterios de la tabla y escribe una pregunta para cada uno. (4) Al final, escribe tu autoevaluación: una fortaleza concreta y una mejora concreta. (5) Entrega las diapositivas, el guion y la autoevaluación.
  pilares:
  - |-
    \textbf{Tu entrega tiene cuatro piezas.} (1) Las cinco diapositivas. (2) La sustentación hecha en cuatro minutos. (3) Las preguntas respondidas con honestidad. (4) La autoevaluación con una fortaleza y una mejora.
  - |-
    \textbf{Cómo se responde una pregunta difícil.} Primero repítela con tus palabras, para asegurarte de que la entendiste. Después responde con lo que sabes. Si no lo sabes, dilo: «no lo resolví porque encuesté solo a mi salón; con más tiempo encuestaría a los tres octavos».
  - |-
    \textbf{Cómo se evalúa a un compañero.} Con los cinco criterios, no con el gusto: ¿cumplió el tiempo?, ¿se entendió qué hizo?, ¿las cifras tenían contexto?, ¿el gráfico era honesto?, ¿dijo qué no pudo saber? Y una pregunta que le ayude, no que lo hunda.
  - |-
    \textbf{La autoevaluación es concreta.} «Controlé el tiempo» es una fortaleza. «Estuvo bien» no. «La próxima vez ensayo tres veces» es una mejora. «Mejorar» no.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Cinco diapositivas con menos de veinticinco palabras cada una. \\[1mm] \checkbox Guion de unas seiscientas palabras, ensayado dos veces. \\[1mm] \checkbox Sustentación dentro de los cuatro minutos. \\[1mm] \checkbox Tres a cinco preguntas respondidas; «no lo resolví» cuando aplique. \\[1mm] \checkbox Evaluación de al menos tres compañeros con los cinco criterios. \\[1mm] \checkbox Autoevaluación con una fortaleza y una mejora concretas.
  plantilla_guion: |-
    \textbf{Diapositiva 1.} \textit{Pregunta y por qué importa, 45 s.} \\[1mm] \textbf{Diapositiva 2.} \textit{Método, 45 s.} \\[1mm] \textbf{Diapositiva 3.} \textit{Hallazgo con cifras, 60 s.} \\[1mm] \textbf{Diapositiva 4.} \textit{Gráfico, 45 s.} \\[1mm] \textbf{Diapositiva 5.} \textit{Decisión y limitaciones, 45 s.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Sustentar, responder y evaluar». \textbf{Formato:} tabla de evaluación de tres compañeros con los cinco criterios y una pregunta para cada uno; y tu autoevaluación en dos líneas. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} sustentaste dentro del tiempo, respondiste al menos tres preguntas, evaluaste a tres compañeros con criterios y tu mejora dice qué vas a hacer distinto.
  producto_titulo: Sustentación de cuatro minutos + cinco diapositivas + preguntas respondidas + autoevaluación
  criterios:
  - Sustentaste dentro de los cuatro minutos, sin leer las diapositivas
  - Las cinco diapositivas tienen menos de veinticinco palabras y siguen el orden de las cinco ideas
  - Las cifras del hallazgo llevan unidad y comparación
  - Respondiste de tres a cinco preguntas, con «no lo resolví» cuando aplicaba
  - Evaluaste a tres compañeros con los cinco criterios y una pregunta útil
  - Tu autoevaluación tiene una fortaleza y una mejora concretas
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.3
    idea: |-
      El respeto es silencio; no el del que nada tiene que decir, sino el del que tiene todo que escuchar.
    aplicacion: |-
      En el nak chak, quien cuenta calla mientras los demás preguntan. Cuando un compañero sustenta, tu silencio atento es lo que hace posible que su estudio se sostenga o se corrija. Y cuando te preguntan a ti, escuchar la pregunta completa antes de responder es respeto.
    pregunta_espejo: |-
      ¿Escuché la pregunta entera, o empecé a responder antes de que terminara?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 53 (c. 175 d.C.)
    idea: |-
      Acostúmbrate a atender a lo que dice el otro, y a meterte, hasta donde puedas, en lo que piensa.
    aplicacion: |-
      Una pregunta difícil no es un ataque: es alguien que pensó en tu estudio. Repetirla con tus palabras antes de responder es meterte en lo que piensa. De ahí salen las mejores respuestas, y las mejores mejoras.
    pregunta_espejo: |-
      ¿Qué pregunta de hoy me mostró algo de mi estudio que yo no había visto?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6
    idea: |-
      La atención de las personas es un bien finito, precioso y escaso.
    aplicacion: |-
      Cuatro minutos son cuatro minutos de la atención de treinta personas. Una diapositiva llena la gasta; una cifra con contexto la aprovecha. Sustentar bien es cuidar la atención de los demás, no llenarla.
    pregunta_espejo: |-
      ¿Qué de mi sustentación gastó la atención del grupo sin devolverle nada?
compromiso: |-
  \textbf{Cierre del periodo.} Guarda tu mini estudio, las diapositivas y la autoevaluación: son tu evidencia del periodo 1, «Datos con phronesis». El periodo 2 arranca con lógica y micro:bit: condiciones, AND, OR y NOT. La mejora que escribiste hoy es lo primero que vas a probar en la próxima sustentación.
web:
  resumen: |-
    Cuatro minutos, cinco diapositivas y las preguntas de los demás. Hoy llevas tu mini estudio al fogón del salón, como el nak chak misak donde el asunto se cuenta y se somete a las preguntas.
  subtema: Análisis de datos con phronesis
  pre_lectura:
    por_que_importa: |-
      Lo que no puedes contar en cuatro minutos todavía no lo entiendes del todo. Y responder «no lo resolví» con honestidad es una habilidad que vas a usar toda la vida.
    pregunta_detonante: |-
      Cuando te pregunten «¿y a quién no encuestaste?», ¿vas a responder o a defenderte?
    activacion:
      titulo: Un minuto sin leer
      descripcion: |-
        En 3 minutos, cuéntale a tu pareja tu mini estudio en un minuto, sin mirar el informe. ¿Qué fue lo primero que dijiste? ¿Era lo más importante?
      duracion_min: 5
    conexion:
      anterior: En la sesión 9 hiciste el mini estudio de ocho etapas.
      siguiente: El periodo 2 arranca con lógica avanzada y micro:bit.
  mapa_ruta:
    - numero: 1
      iconos: ["🌱"]
      titulo: El nak chak, donde se lleva el asunto
      duracion_min: 10
    - numero: 2
      iconos: ["✏️"]
      titulo: Actividad 1 · Cuatro minutos sin leer
      duracion_min: 15
    - numero: 3
      iconos: ["🔎", "✏️"]
      titulo: Actividad 2 · Cinco diapositivas y un ensayo
      duracion_min: 30
    - numero: 4
      iconos: ["✏️", "✅"]
      titulo: Actividad 3 · Sustentar, responder y evaluar
      duracion_min: 35
  actividades:
    - numero: 1
      verbo: ANALIZA
      titulo: Cuatro minutos sin leer
      tiempo_min: 15
      modalidad: individual
      pasos:
        - Toma tu informe y ponlo boca abajo.
        - Pon el cronómetro en cuatro minutos y cuenta tu estudio en voz alta, como a un amigo.
        - Al terminar, anota qué dejaste fuera por falta de tiempo.
        - Anota qué dijiste de más y qué parte sonó más floja.
      cuaderno:
        titulo: Cuatro minutos sin leer
        formato: tres líneas (qué dejé fuera / qué dije de más / qué sonó flojo) y el tiempo que tardé
        extension: un tercio de página
      criterios:
        - Las tres líneas están llenas.
        - Sabes qué vas a recortar antes de armar las diapositivas.
    - numero: 2
      verbo: CREA
      titulo: Cinco diapositivas y un ensayo
      tiempo_min: 30
      modalidad: parejas
      pasos:
        - Reduce tu informe a cinco ideas, una por diapositiva, pregunta, método, hallazgo, gráfico, decisión y limitaciones.
        - Arma las cinco con máximo veinticinco palabras cada una.
        - Escribe el guion hablado, unas seiscientas palabras son cuatro minutos.
        - Ensaya frente a tu pareja con cronómetro. Tu pareja te dice una cosa que no entendió y una que sobró. Cambien de rol.
      cuaderno:
        titulo: Cinco diapositivas y un ensayo
        formato: las cinco ideas, una línea cada una, con su tiempo, y las dos observaciones de tu pareja
        extension: media página
      criterios:
        - Las cinco diapositivas tienen menos de veinticinco palabras.
        - Ensayaste con cronómetro y aplicaste al menos una observación de tu pareja.
    - numero: 3
      verbo: EVALÚA
      titulo: Sustentar, responder y evaluar
      tiempo_min: 35
      modalidad: individual
      pasos:
        - Sustenta frente al grupo, o en rondas de cinco, con cronómetro visible. Cuatro minutos.
        - Responde de tres a cinco preguntas. Si no sabes, di «no lo resolví» y por qué.
        - Mientras escuchas a otros, evalúa con los cinco criterios y escribe una pregunta para cada uno.
        - Escribe tu autoevaluación, una fortaleza concreta y una mejora concreta.
        - Entrega las diapositivas, el guion y la autoevaluación.
      cuaderno:
        titulo: Sustentar, responder y evaluar
        formato: tabla de evaluación de tres compañeros con los cinco criterios y una pregunta para cada uno, y tu autoevaluación en dos líneas
        extension: una página
      criterios:
        - Sustentaste dentro del tiempo y respondiste al menos tres preguntas.
        - Evaluaste a tres compañeros con criterios y tu mejora dice qué vas a hacer distinto.
  conceptos_clave:
    - categoria: La sustentación
      termino: Sustentación
      definicion: Contar en público un trabajo propio con tiempo limitado, apoyo visual y preguntas del público.
      ejemplo: Cuatro minutos, cinco diapositivas y tres preguntas del salón.
    - categoria: La sustentación
      termino: Las cinco diapositivas
      definicion: Pregunta, método, hallazgo, gráfico, decisión y limitaciones. Una idea por diapositiva y menos de veinticinco palabras.
      ejemplo: La diapositiva 3 dice solo «3 horas al día en promedio; máximo 8», con letra grande.
    - categoria: La sustentación
      termino: Guion hablado
      definicion: Lo que vas a decir, escrito para ordenarte y ensayarlo. No se lee en público.
      ejemplo: Unas seiscientas palabras son cuatro minutos hablando con calma.
    - categoria: Las preguntas
      termino: Responder con honestidad
      definicion: Decir lo que sabes y reconocer lo que no resolviste, con la razón.
      ejemplo: «No lo resolví, porque solo encuesté a mi salón. Con más tiempo encuestaría a los tres octavos».
    - categoria: Las preguntas
      termino: Los cinco criterios
      definicion: Tiempo cumplido, se entendió qué hizo, cifras con contexto, gráfico honesto, dijo qué no pudo saber.
      ejemplo: Evaluar a un compañero es marcar los cinco y hacerle una pregunta que le sirva.
    - categoria: Las preguntas
      termino: Autoevaluación concreta
      definicion: Una fortaleza y una mejora que se puedan comprobar la próxima vez.
      ejemplo: «Controlé el tiempo» y «la próxima vez ensayo tres veces».
  cinco_dimensiones:
    personal: Contaste un trabajo tuyo en cuatro minutos y respondiste preguntas. Ya sabes qué es esencial en lo que hiciste.
    emocional: Decir «no lo resolví» delante del grupo cuesta. Hacerlo con la razón al lado es lo que te hace confiable.
    ciudadana: Quien sustenta en público y responde preguntas está haciendo lo que se le pide a cualquier autoridad con cifras. Aprender a exigirlo empieza por practicarlo.
    local: En el nak chak misak el asunto se cuenta al fogón y los demás preguntan. Tu salón fue hoy ese fogón, a otra escala.
    intergeneracional: Tu mejora concreta es lo primero que vas a probar en la próxima sustentación. Así avanza un oficio, una sustentación a la vez.
  post_lectura:
    reflexion: ¿Qué pregunta te hicieron hoy que tu estudio no podía responder, y qué harías distinto para responderla?
    transferencia: |-
      La próxima vez que expongas en cualquier materia, ensaya con cronómetro y prepara la respuesta a la pregunta que más temes.
    cierre: Cuatro minutos para contar, y todo el tiempo del mundo para escuchar. Así cierra el periodo.
  quiz:
    titulo: ¿Sabes sustentar en cuatro minutos?
    instrucciones: Cinco preguntas para verificar que sabes reducir, contar y responder. No va al cuaderno.
    preguntas:
      - enunciado: Tu diapositiva del hallazgo tiene cuatro párrafos. ¿Qué pasa cuando la proyectas?
        opciones:
          - El grupo la lee y deja de escucharte mientras habla.
          - El grupo entiende mejor, porque tiene más información.
          - El cronómetro se detiene mientras la leen en silencio.
          - Nada, porque las diapositivas no importan en la nota.
        respuesta_index: 0
        feedback_correcto: Sí. Una diapositiva llena compite con tu voz. Menos de veinticinco palabras y tú cuentas el resto.
        feedback_incorrecto: Más texto no es más claridad. La gente lee en vez de escuchar. La diapositiva se lee en cinco segundos.
      - enunciado: Un compañero te pregunta algo que tu estudio no responde. ¿Cuál es la mejor respuesta?
        opciones:
          - Inventar una explicación razonable para no quedar mal delante del grupo.
          - Decir que la pregunta no tiene que ver con el tema del estudio.
          - Decir «no lo resolví» y explicar por qué, con la limitación.
          - Pedirle que lo busque él mismo después de la clase.
        respuesta_index: 2
        feedback_correcto: Exacto. Reconocer lo que no resolviste, con la razón, es la respuesta más profesional que hay.
        feedback_incorrecto: Inventar o evadir hunde la sustentación. «No lo resolví porque…» la sostiene.
      - enunciado: ¿Cuánto tiempo le toca, más o menos, a cada una de las cinco diapositivas en cuatro minutos?
        opciones:
          - Unos dos minutos a la primera y el resto se reparte como salga.
          - Entre 45 y 60 segundos cada una, con el hallazgo un poco más largo.
          - Diez segundos cada una y el resto para preguntas.
          - Depende de cuánto texto tenga cada diapositiva.
        respuesta_index: 1
        feedback_correcto: Correcto. Unos 45 segundos por diapositiva y 60 para el hallazgo suman los cuatro minutos.
        feedback_incorrecto: Cuatro minutos entre cinco ideas son unos 45 segundos cada una. El hallazgo puede llevarse un poco más.
      - enunciado: ¿Cuál de estas es una autoevaluación concreta?
        opciones:
          - Estuvo bien, aunque podría mejorar en varias cosas la próxima vez.
          - Me sentí nervioso pero lo hice lo mejor que pude en ese momento.
          - Creo que en general fue una buena sustentación para el grupo.
          - Controlé el tiempo; la próxima vez ensayo tres veces para no leer.
        respuesta_index: 3
        feedback_correcto: Sí. Una fortaleza que se puede comprobar y una mejora que dice qué vas a hacer.
        feedback_incorrecto: «Bien», «lo mejor que pude» y «en general» no se pueden comprobar. Una autoevaluación concreta nombra algo que hiciste y algo que harás.
      - enunciado: Evalúas a un compañero. ¿Cuál de estas observaciones sigue los cinco criterios?
        opciones:
          - Me gustó mucho, hablas muy bien y se te entiende todo lo que dices.
          - Dijo el promedio sin unidad ni comparación; el gráfico sí empezaba en cero.
          - Debería haber usado más colores y más imágenes en las diapositivas.
          - Estuvo un poco largo para mi gusto, pero muy interesante.
        respuesta_index: 1
        feedback_correcto: Eso es. Nombra criterios, cifras con contexto y gráfico honesto, y dice qué cumplió y qué no.
        feedback_incorrecto: «Me gustó», «más colores» e «interesante» son gustos. La evaluación con criterios dice qué cumplió y qué faltó.

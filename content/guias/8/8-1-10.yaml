clave: 1-10
grado: 8
periodo: 1
sesion: 10
completo: true
titulo: Sustentación del mini-estudio --- 4 minutos de phronesis comunicativa
titulo_portada: |-
  Sustentación
  del mini-estudio ---
  4 minutos
producto_final: |-
  Sustentación oral de 4 minutos del mini-estudio del periodo + presentación con máximo 5 slides (pregunta, método, hallazgo, gráfico, decisión) + sesión de 3-5 preguntas de la audiencia respondidas con honestidad + autoevaluación final con 1 fortaleza identificada y 1 mejora concreta para la próxima sustentación
apertura:
  saber_ancestral: |-
    En los pueblos del Valle del Cauca había un ritual antiguo que cualquier aprendiz de oficio debía pasar antes de ser reconocido como oficial: \textbf{contar a los mayores lo que aprendió}. El aprendiz de carpintero, después de un año en el taller, se sentaba frente al maestro y a 2-3 oficiales viejos, y debía explicar con sus propias palabras: cómo elegir la madera, cómo afilar la herramienta, cómo ensamblar sin clavos. No bastaba con haber trabajado bien: \textbf{había que poder contarlo}. Los mayores hacían preguntas duras: \emph{``¿qué haces si la madera se raja al lijarla?''}, \emph{``¿cómo decides la pendiente del techo?''}. El aprendiz que respondía con honestidad (incluso reconociendo lo que no sabía) era reconocido como oficial. El que inventaba respuestas para impresionar era devuelto al taller por otro año. La sabiduría era inquebrantable: \textbf{el oficio se demuestra hablando, no solo haciendo}. Esa práctica antigua del \emph{cuentista del fogón aplicada al oficio} es la forma ancestral de la sustentación oral profesional moderna.
  saber_contemporaneo: |-
    Una \textbf{sustentación oral} en el ámbito académico y profesional es la presentación pública de un trabajo propio, con tres propiedades irrenunciables: (1) \textbf{Tiempo limitado}: 3-5 minutos en sustentación corta, 10-15 en académica, 20-30 en defensa de tesis. La disciplina del tiempo obliga a destilar lo esencial. (2) \textbf{Presentación de apoyo visual}: 3-7 slides claras que ayuden al oyente sin reemplazar la voz. (3) \textbf{Preguntas y respuestas}: la audiencia interroga, el sustentante responde con honestidad. La regla profesional famosa: \textbf{lo que no puedes contar en 4 minutos, todavía no lo entiendes del todo}. La sustentación es filtro: te obliga a saber qué es esencial y qué es accesorio, qué puedes defender y qué necesitas declarar como limitación. Para un mini-estudio de 8 etapas, la sustentación de 4 minutos significa unos 30 segundos por etapa: tiempo justo para lo importante, tiempo insuficiente para relleno.
  pregunta_puente: |-
    ¿Qué sabía el aprendiz de oficio al sentarse frente a los mayores para defender lo aprendido, que el estudiante novato olvida cuando confunde sustentar con leer las slides? ¿Y por qué un sustentante que reconoce limitaciones con elegancia es más respetado que uno que las esconde?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} qué es lo esencial de tu mini-estudio que cabe en 4 minutos y qué se debe dejar fuera; (2) \textbf{explicar} con tus palabras (no leyendo de las slides) la pregunta, el método, el hallazgo y la decisión; (3) \textbf{evaluar} con honestidad las 3-5 preguntas que la audiencia haga, sin inventar respuestas; (4) \textbf{crear} la presentación de 5 slides + el guion hablado + la autoevaluación final.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las 9 sesiones anteriores aprendiste a analizar datos con phronesis. Hoy es el día de la \textbf{graduación del aprendiz}: defender públicamente el mini-estudio del periodo. La sesión 10 cierra el periodo 1; el periodo 2 (lógica y micro:bit) empieza la próxima semana.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ensayo cronometrado} solo: cuéntate a ti mismo (en voz alta) el mini-estudio en 4 minutos exactos. Si te sobra tiempo, agregaste relleno. Si te falta, dejaste algo esencial fuera.
  a_sistematizacion: |-
    Ya hiciste el ensayo. Ahora vas a entender la \textbf{anatomía de la sustentación de 4 minutos}: las 5 slides, los tiempos por slide, los 6 errores típicos del sustentante novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: armar las 5 slides, escribir el guion hablado, ensayar 2 veces cronometrado, sustentar en público, responder preguntas, hacer autoevaluación.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: sustentación ejecutada + 5 slides + guion + autoevaluación. El criterio principal: que un compañero que no haya leído tu informe entienda en 4 minutos qué hiciste y por qué.
  a_evaluacion: |-
    Antes de cerrar, mira la sustentación desde las cinco dimensiones humanas. Defender el trabajo con honestidad es respeto por la audiencia; leer las slides es desperdiciar la oportunidad.
  a_triangulo: |-
    Y para terminar, tres voces sobre la palabra y la honestidad. Dussel sobre la voz del aprendiz que devuelve a la comunidad lo aprendido, Marco Aurelio sobre decir las cosas como son, Floridi sobre la comunicación responsable.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Ensayo cronometrado solo} (10 min · individual). Toma tu informe del mini-estudio. Sin slides todavía, sin notas, en voz alta cronométrate: cuenta el mini-estudio completo (pregunta → hipótesis → método → hallazgo → decisión) en 4 minutos exactos. Reglas: (1) hablar como si le contaras a un amigo, no a un profesor. (2) no leer del informe: \emph{recordar}. (3) cronómetro visible. Al terminar, anota: ¿qué dejaste fuera por falta de tiempo?, ¿qué dijiste de más que era relleno?, ¿qué parte sonó más floja?
  checks:
  - Hice el ensayo cronometrado en voz alta.
  - Me mantuve cerca de 4 minutos.
  - Identifiqué qué dejé fuera y qué sobró.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Ensayo cronometrado». \textbf{Formato:} ficha con 3 líneas (lo que dejé fuera, lo que sobró, parte más floja). \textbf{Sabes que terminaste cuando} sabes qué corregir antes de hacer las slides.
sistematizacion:
  intro: |-
    Hiciste el ensayo. Ahora necesitas la \textbf{anatomía profesional} de la sustentación de 4 minutos: 5 slides con tiempo asignado, errores típicos del novato, criterios de la audiencia.
  pilares:
  - |-
    Las 5 slides estándar para sustentación corta se descomponen así (con tiempo asignado): (1) \textbf{Pregunta + por qué importa} (45 seg). (2) \textbf{Método: cómo recolecté los datos} (45 seg). (3) \textbf{Hallazgo principal en 1 frase + cifras clave} (60 seg). (4) \textbf{Gráfico honesto del hallazgo} (45 seg). (5) \textbf{Decisión + limitaciones declaradas} (45 seg). Total: 4 minutos. Cada slide debe poder leerse en 5 segundos y tu voz dice el resto.
  - |-
    Los 6 errores típicos del sustentante novato: (a) \textbf{Leer las slides}: si lees, no estás sustentando. (b) \textbf{Slide saturada}: más de 30 palabras por slide cansa al oyente. (c) \textbf{Cifras sin contexto}: \emph{``el promedio es 3{,}5''} sin decir respecto a qué. (d) \textbf{Inflar el hallazgo}: concluir más de lo que los datos soportan. (e) \textbf{Evadir preguntas duras}: peor que decir \emph{``no lo resolví''}. (f) \textbf{Cierre débil}: terminar con \emph{``muchas gracias''} en lugar de cerrar con la decisión o la limitación.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿el oyente se va sabiendo qué hice y por qué importa?}. Si la respuesta es sí, la sustentación funcionó. Si el oyente se va con \emph{``hizo muchos cálculos pero no sé para qué''}, la sustentación falló. La phronesis del sustentante consiste en \textbf{servir al oyente, no impresionarlo}.
  - |-
    Algoritmo: (1) reduce el informe a 5 ideas centrales. (2) arma 5 slides simples con máximo 25 palabras cada una. (3) escribe guion hablado de 600-700 palabras (= 4 min). (4) ensaya 2 veces cronometrado sin público. (5) sustenta. (6) responde con honestidad. (7) autoevalúa: 1 fortaleza + 1 mejora.
  anatomia:
    titulo: Anatomía de la sustentación 4 min
    body: |-
      \textbf{Slide 1 (45s):} Pregunta + por qué importa. \\[1mm] \textbf{Slide 2 (45s):} Método de recolección. \\[1mm] \textbf{Slide 3 (60s):} Hallazgo principal + cifras. \\[1mm] \textbf{Slide 4 (45s):} Gráfico honesto. \\[1mm] \textbf{Slide 5 (45s):} Decisión + limitaciones.
  errores_comunes: |-
    (1) Leer las slides en voz alta. (2) Slides saturadas de texto. (3) Cifras sin contexto. (4) Inflar el hallazgo más allá de los datos. (5) Evadir preguntas duras. (6) Cierre débil sin decisión clara. (7) Pasarse del tiempo asignado (señal de falta de preparación).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía de la sustentación». \textbf{Formato:} (a) plantilla de las 5 slides con tiempo; (b) los 7 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías delegar el diseño de las slides a un compañero solo con la plantilla.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- Sustentación ejecutada + autoevaluación} (45 min en sesión, incluye 4 min de sustentación pública · individual). Hora de ejecutar. Armas las 5 slides, ensayas, sustentas en público de tu grupo, respondes preguntas, autoevalúas.
  pilares:
  - |-
    Tu trabajo se construye en 6 pasos: (1) armar las 5 slides en Google Slides, Canva o PowerPoint. (2) escribir guion hablado de 600-700 palabras. (3) ensayar 2 veces cronometrado. (4) sustentar en público (la clase entera, o grupos de 5-6 con rotación). (5) responder 3-5 preguntas con honestidad. (6) autoevaluar al final con 1 fortaleza + 1 mejora.
  - |-
    Sigue el patrón \textbf{``hablar con la audiencia, no contra ella''}: mira a los ojos, modula la voz, evita postura defensiva. Las preguntas no son ataque: son oportunidad de mostrar honestidad. Una respuesta de \emph{``buena pregunta, no resolví ese aspecto porque mi muestra fue pequeña; si tuviera más tiempo, lo haría''} es más profesional que inventar una explicación.
  - |-
    La autoevaluación final tiene 2 partes: (a) \textbf{Fortaleza}: lo que hiciste mejor que el ensayo (controlaste el tiempo, hablaste con claridad, respondiste una pregunta dura). (b) \textbf{Mejora}: 1 cosa concreta que harás distinto la próxima vez (más ensayo, menos texto en slides, mirar más a la audiencia). Específico, no genérico.
  - |-
    Algoritmo: (1) armar slides. (2) escribir guion. (3) ensayar. (4) sustentar. (5) responder preguntas. (6) autoevaluar. (7) entregar al docente: archivo de slides + guion + autoevaluación.
  checklist:
    titulo: Checklist antes de sustentar
    items: |-
      \checkbox 5 slides armadas con máximo 25 palabras cada una. \\[1mm] \checkbox Guion hablado de 600-700 palabras. \\[1mm] \checkbox 2 ensayos cronometrados hechos. \\[1mm] \checkbox Slides con título descriptivo y gráfico claro. \\[1mm] \checkbox Sustentación dentro de 4 minutos. \\[1mm] \checkbox Respuestas con honestidad (\emph{``no lo resolví''} cuando aplique). \\[1mm] \checkbox Autoevaluación con 1 fortaleza + 1 mejora específica.
  plantilla_guion: |-
    \textbf{Slide 1.} \textit{Pregunta + por qué.} \\[1mm] \textbf{Slide 2.} \textit{Método + muestra.} \\[1mm] \textbf{Slide 3.} \textit{Hallazgo + cifras.} \\[1mm] \textbf{Slide 4.} \textit{Gráfico honesto.} \\[1mm] \textbf{Slide 5.} \textit{Decisión + limitaciones.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Mi sustentación». \textbf{Formato:} (a) referencia al archivo de slides; (b) guion escrito; (c) lista de preguntas que recibí + respuestas; (d) autoevaluación final con fortaleza + mejora. \textbf{Sabes que terminaste cuando} tienes claro qué harás distinto en tu próxima sustentación.
  producto_titulo: Sustentación 4 min + 5 slides + guion + autoevaluación
  criterios:
  - 5 slides claras (máx. 25 palabras por slide)
  - Sustentación dentro de 4 minutos cronometrados
  - Guion hablado escrito
  - 3-5 preguntas respondidas con honestidad
  - Autoevaluación con fortaleza + mejora específica
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La voz del aprendiz que devuelve a la comunidad lo aprendido cierra el ciclo de la pedagogía liberadora.
    aplicacion: |-
      Tu sustentación cierra el ciclo del periodo: lo que aprendiste vuelve a la comunidad (tu grupo) hecho voz propia. La filosofía de la liberación pide ese cierre: el saber no se guarda; se devuelve. Cuando hablas con honestidad, sin inventar, sin esconder limitaciones, estás haciendo phronesis comunicativa. La phronesis del oficio consiste en \textbf{decir lo que sé con la voz propia, no con la voz del libro}.
    pregunta_espejo: |-
      ¿Mi sustentación devolvió algo útil al grupo, o solo cumplí con un requisito?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Decir las cosas como son ante la audiencia es valor; inflar el hallazgo para impresionar es debilidad.
    aplicacion: |-
      Es tentador hacer parecer el mini-estudio más impresionante de lo que es. La disciplina estoica recomienda lo opuesto: \emph{di las cifras como son, declara las limitaciones, reconoce lo que no resolviste}. Esa honestidad ante público gana respeto profesional; la inflación lo pierde.
    pregunta_espejo: |-
      ¿Inflé mi hallazgo para sonar más impresionante, o lo presenté con honestidad de muestra y método?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La comunicación responsable es la nueva ética del oficio en la era de la información veloz.
    aplicacion: |-
      En la era de la información, los hallazgos circulan rápido. La ética digital pide que comuniques con responsabilidad: que tu sustentación de 4 minutos no se preste a ser malinterpretada si alguien la cita después. Esa precisión es virtud profesional que se entrena hoy con un mini-estudio escolar y se aplicará a las decisiones laborales del futuro.
    pregunta_espejo: |-
      ¿Mi sustentación podría ser citada con honestidad, o alguien la usaría para conclusiones que mi estudio no soporta?
compromiso: |-
  \textbf{Para la próxima sesión.} Cierras el periodo 1 (Datos con phronesis) y arranca el periodo 2 (Lógica y micro:bit). La sesión 1 del periodo 2 trabajará la \textbf{lógica avanzada con if-else y AND/OR/NOT}, base del pensamiento computacional. Lleva tu mini-estudio guardado: te servirá como referencia de oficio cuando trabajes con sensores y algoritmos.
web:
  conceptos_clave:
    - termino: Sustentación oral
      definicion: |-
        Acto público donde el estudiante presenta y defiende su mini-estudio ante la audiencia. No es lectura: es comunicación con voz propia.
      ejemplo: |-
        4 minutos contando pregunta, método, hallazgo y decisión, mirando al público, sin leer las slides.
      emoji: "🎤"
    - termino: 5 slides estándar
      definicion: |-
        Estructura mínima para sustentación corta: pregunta, método/datos, hallazgo, gráfico, decisión. Cada slide con tiempo asignado.
      ejemplo: |-
        Slide 1 (45 seg) pregunta + por qué importa. Slide 2 (45 seg) cómo recolecté datos. Slide 3 (60 seg) hallazgo principal con cifra. Slide 4 (45 seg) gráfico. Slide 5 (45 seg) decisión.
      emoji: "🎬"
    - termino: Phronesis comunicativa
      definicion: |-
        Disciplina de decir lo justo: ni inflar lo logrado ni minimizarlo. Lo que se cuenta debe sostenerse con honestidad ante preguntas.
      ejemplo: |-
        "Mi muestra fue 12 personas, no puedo generalizar al colegio" es phronesis. "Encuesté a toda la institución" sin haberlo hecho es engaño.
      emoji: "🧭"
    - termino: Autoevaluación profesional
      definicion: |-
        Reconocimiento honesto de 1-2 fortalezas y 1-2 mejoras después de sustentar. No autoflagelación ni autoelogio: balance real.
      ejemplo: |-
        "Manejé bien el tiempo (fortaleza). Hablé muy rápido al principio por nervio (mejora). Para próxima sustentación ensayaré con cronómetro."
      emoji: "🪞"
    - termino: Cronometrar el ensayo
      definicion: |-
        Práctica profesional: ensayar 2 veces con reloj antes de la sustentación real. Permite ajustar tiempos por slide y detectar excesos.
      ejemplo: |-
        Si en el ensayo te toma 5,5 minutos lo planeado para 4, sabes que debes acortar o priorizar. Eso ahorra fracaso público.
      emoji: "⏱"
  quiz:
    titulo: ¿Sabes sustentar con phronesis comunicativa?
    instrucciones: 5 preguntas para verificar que reconoces qué hace profesional una sustentación oral del mini-estudio.
    preguntas:
      - enunciado: '¿Cuál es el primer error del sustentante novato?'
        opciones:
          - Hablar muy bajo
          - Leer las slides en voz alta
          - Tener slides simples
          - Mirar al público
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Leer las slides mata la sustentación. Si lees, el público lee solo y tu voz sobra. Mejor contar con apoyo visual mínimo.
        feedback_incorrecto: |-
          Leer las slides es el primer error. Mejor hablar con apoyo visual mínimo y mirar al público.
      - enunciado: '¿Cuántas slides son ideales para sustentación de 4 minutos?'
        opciones:
          - "20"
          - "15"
          - Solo 1
          - 4-5
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. 4-5 slides, una por bloque (pregunta, método, hallazgo, gráfico, decisión). Menos no alcanza; más no se puede explicar en 4 min.
        feedback_incorrecto: |-
          4-5 slides es el estándar para sustentación corta. Más slides obligan a acelerar y leer; menos no muestra el camino.
      - enunciado: 'Te preguntan: "¿la encuesta fue representativa del colegio?". La muestra fue 15. ¿Qué respondes con phronesis comunicativa?'
        opciones:
          - No, fue de 15 personas, así que aplica solo al grupo encuestado. Una muestra mayor permitiría generalizar.
          - Sí, totalmente
          - Buena pregunta... siguiente pregunta
          - Depende
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Honestidad técnica con explicación. La phronesis comunicativa declara límites en lugar de evadir.
        feedback_incorrecto: |-
          La respuesta honesta declara el tamaño de la muestra y reconoce los límites. Evadir o inflar erosiona credibilidad.
      - enunciado: 'En la autoevaluación final, ¿qué es señal de profesionalismo?'
        opciones:
          - Decir que todo salió perfecto
          - Decir que todo salió mal
          - Reconocer 1-2 fortalezas y 1-2 mejoras concretas
          - No autoevaluarse
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Balance real entre lo logrado y lo mejorable es profesional. Autoelogio y autocrítica extremos son señal de poco oficio.
        feedback_incorrecto: |-
          Reconocer fortalezas y mejoras con honestidad balanceada es señal profesional. Extremos delatan inseguridad o vanidad.
      - enunciado: '¿Para qué sirve cronometrar el ensayo antes de sustentar?'
        opciones:
          - Para impresionar al profe
          - Es trámite sin utilidad
          - Para perder tiempo
          - Para detectar si tu tiempo se ajusta a lo asignado y ajustar antes
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Si en el ensayo te pasas o no llegas, ajustas. Mejor descubrir el problema en privado que en público.
        feedback_incorrecto: |-
          Cronometrar el ensayo te permite ajustar tiempos antes del fracaso público. Es disciplina profesional, no trámite.

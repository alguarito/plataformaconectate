clave: 1-2
grado: 8
periodo: 1
sesion: 2
completo: true
titulo: Tipos de datos y formato de celdas en Excel
titulo_portada: |-
  Tipos de datos y
  formato de celdas
  en Excel
producto_final: |-
  Hoja Excel con al menos 5 columnas de tipos distintos (número, texto, fecha, moneda, porcentaje) formateadas correctamente con la herramienta \emph{``Formato de celdas''} + captura de pantalla del antes y del después + tabla en el cuaderno explicando qué cambió y por qué cada tipo se eligió para cada columna
apertura:
  saber_ancestral: |-
    En los talleres de carpintería del centro de Cartago y en los aserríos del Pacífico, ningún maestro toma madera del montón al azar antes de cortar. Tiene un gesto previo que parece pérdida de tiempo a quien no sabe del oficio: \textbf{clasifica la madera por tipo}. El cedro va a un lado: liviano, blando, fácil de tallar; sirve para puertas y cofres. El \textbf{guayacán} va al otro: pesado, durísimo, casi imposible de cortar a mano; sirve para vigas y postes que aguantan lluvia y peso. El \textbf{balso} en una tercera pila: liviano como espuma, perfecto para juguetes y maquetas. Si el maestro confunde los tipos, el desastre es seguro: una puerta de guayacán pesa demasiado y rompe los goznes; una viga de balso se quiebra al primer aguacero; un juguete de cedro se astilla en las manos del niño. La sabiduría es ancestral y simple: \textbf{cada material tiene un uso, y cada uso exige el material correcto}. Quien no clasifica antes de cortar pierde la pieza y a veces la confianza del cliente.
  saber_contemporaneo: |-
    En Excel ocurre exactamente lo mismo. Si en una celda donde debería haber un número escribes \emph{``cinco mil''} (palabra), Excel no podrá sumarla con las demás: la trata como texto, no como número. Si en una celda donde debería ir una fecha escribes \emph{``15 de marzo''} sin formato, Excel no sabrá ordenar por mes ni calcular cuántos días pasaron. Si en una columna de dinero pones \emph{``50000''} sin signo de peso, los gráficos no van a entender que es moneda. \textbf{Cada celda en Excel tiene un tipo}, y elegir el tipo correcto es la primera tarea profesional. Los 5 tipos básicos son: (1) \textbf{Número}: para cantidades calculables (edades, conteos, mediciones). (2) \textbf{Texto}: para nombres, descripciones, códigos que no se calculan. (3) \textbf{Fecha}: para fechas, ordenables y calculables (cuántos días entre dos). (4) \textbf{Moneda}: para dinero, con símbolo y decimales correctos. (5) \textbf{Porcentaje}: para tasas, con el cálculo automático del símbolo \%.
  pregunta_puente: |-
    ¿Qué sabía el carpintero al clasificar la madera por tipo antes de cortar, que el novato olvida cuando llena celdas de Excel sin pensar en el tipo de dato? ¿Y qué pasa con un promedio de notas si una celda dice \emph{``cuatro punto cinco''} en lugar de \emph{4{,}5}?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 5 tipos básicos de datos que maneja Excel y cuándo usar cada uno; (2) \textbf{aplicar} el formato correcto a una hoja con 5 columnas distintas usando la herramienta \emph{``Formato de celdas''}; (3) \textbf{analizar} qué errores aparecen cuando el tipo de dato es incorrecto (sumas que no funcionan, fechas que no se ordenan, dinero sin símbolo); (4) \textbf{evaluar} una hoja ajena detectando 3 columnas con tipo incorrecto y corrigiéndolas.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 aprendiste a \emph{preguntar antes de calcular}. Hoy aprendes a \emph{clasificar antes de calcular}: cada columna tiene un tipo, y elegirlo bien evita errores que después arrastran a fórmulas, gráficos y conclusiones. Las próximas sesiones (tablas, funciones, fórmulas) asumen que tus tipos están bien definidos.
  a_escuta: |-
    Antes de teorizar, vas a abrir Excel y mirar 5 celdas con datos distintos: una con un nombre, una con un número, una con una fecha, una con dinero, una con un porcentaje. Vas a anotar qué tipo crees que tiene cada una y si Excel la está tratando como tú esperas.
  a_sistematizacion: |-
    Ya viste las 5 celdas. Ahora vas a entender la \textbf{anatomía de los 5 tipos básicos}: qué hace cada uno, cómo se aplica el formato, qué errores aparecen cuando se equivoca el tipo. Es la pesa del carpintero aplicada a Excel.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: crear una hoja con 5 columnas, una por cada tipo, llenar 5-10 filas con datos reales, formatear correctamente con \emph{``Formato de celdas''}, capturar antes y después, y explicar en el cuaderno qué cambió.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: hoja Excel con 5 columnas tipadas + capturas antes/después + tabla explicativa. El criterio principal: que tu hoja pueda recibir fórmulas en la siguiente sesión sin errores de tipo.
  a_evaluacion: |-
    Antes de cerrar, mira la clasificación desde las cinco dimensiones humanas. Tipar bien los datos es respeto por el oficio entero; tipar mal es preparar la caída de todas las fórmulas que vendrán.
  a_triangulo: |-
    Y para terminar, tres voces sobre el orden del oficio. Dussel sobre los datos que dignifican o reducen a las personas, Epicteto sobre la disciplina de lo pequeño, Floridi sobre la información correctamente clasificada como ética del oficio digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 5 celdas y sus tipos} (15 min · individual). Abre Excel y escribe en 5 celdas distintas: (a) tu nombre completo, (b) tu edad en años, (c) tu fecha de nacimiento, (d) cuánto cuesta una empanada hoy en la tienda escolar, (e) qué porcentaje de tus compañeros usa lentes (aproximado). Después mira cómo Excel está tratando cada celda: ¿la edad se alinea a la derecha (número) o a la izquierda (texto)?, ¿la fecha se ordena cronológicamente o como texto?, ¿el dinero muestra signo de peso?, ¿el porcentaje muestra el símbolo \%?. Anota cuáles 5 tipos crees que Excel les asignó por defecto.
  checks:
  - Escribí 5 celdas con tipos distintos.
  - Observé cómo Excel las trata por defecto (alineación, formato).
  - Anoté cuál tipo creo que Excel les asignó.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 5 celdas y sus tipos». \textbf{Formato:} tabla 5 filas × 3 columnas (Celda~|~Lo que escribí~|~Tipo que creo que Excel le dio). \textbf{Sabes que terminaste cuando} sospechas que al menos 1 celda quedó con tipo equivocado.
sistematizacion:
  intro: |-
    Una hoja con tipos mal aplicados es una bomba de errores: las sumas dan mal, los gráficos confunden, las decisiones se basan en cálculos rotos. Para evitarlo necesitas la \textbf{anatomía de los 5 tipos básicos} y la herramienta de Excel que los aplica correctamente.
  pilares:
  - |-
    Los 5 tipos básicos de Excel se descomponen así: (1) \textbf{Número}: valores que se calculan (15, 3,14, 200). Alineado a la derecha por defecto. (2) \textbf{Texto}: cadenas que no se calculan (nombres, descripciones, códigos). Alineado a la izquierda. (3) \textbf{Fecha}: días ordenables (15/03/2026). Se pueden sumar y restar para calcular diferencias. (4) \textbf{Moneda}: números con símbolo de moneda y decimales (\$ 5.000). Permite sumar montos. (5) \textbf{Porcentaje}: tasas que muestran el símbolo \% y se calculan como decimales internamente (50\% = 0{,}5 en cálculo).
  - |-
    La herramienta clave es \textbf{Formato de celdas}: clic derecho sobre la celda (o rango de celdas) → \emph{Formato de celdas} → pestaña \emph{Número} → eliges la categoría. Esta herramienta cambia cómo Excel \emph{muestra} y cómo \emph{calcula} el dato. Si una celda tiene texto pero le aplicas formato de número, Excel sigue tratándola como texto: el formato no convierte tipos automáticamente; solo cambia la presentación si el tipo era compatible.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué quiero hacer con esta columna?}. Si voy a sumar, debe ser número o moneda. Si voy a ordenar cronológicamente, debe ser fecha. Si voy a calcular tasas, debe ser porcentaje. Si solo voy a leer, puede ser texto. La phronesis consiste en \textbf{decidir el tipo por el uso}, no por la apariencia.
  - |-
    Algoritmo: (1) revisa cada columna de tu hoja; (2) pregunta \emph{¿qué voy a hacer con ella?}; (3) elige el tipo correcto según el uso; (4) selecciona la columna completa; (5) clic derecho → Formato de celdas → categoría; (6) verifica que los datos se vean bien después; (7) si algún dato aparece como \texttt{\#\#\#\#} es que la columna es muy angosta: amplíala.
  anatomia:
    titulo: Anatomía de los 5 tipos
    body: |-
      \textbf{Número:} para calcular (sumar, promediar). \\[1mm] \textbf{Texto:} para identificar (no se calcula). \\[1mm] \textbf{Fecha:} para ordenar y restar días. \\[1mm] \textbf{Moneda:} para dinero con símbolo. \\[1mm] \textbf{Porcentaje:} para tasas con símbolo \%.
  errores_comunes: |-
    (1) \textbf{Números escritos como texto}: \emph{``cinco mil''} en lugar de \emph{5000} no se puede sumar. (2) \textbf{Fechas como texto}: \emph{``15 de marzo''} no se ordena cronológicamente. (3) \textbf{Moneda sin formato}: \emph{50000} sin signo no se reconoce como dinero al hacer gráficos. (4) \textbf{Porcentaje multiplicado por 100}: poner \emph{50\%} a una celda que ya tiene \emph{50} convierte a \emph{5000\%} (error muy común). (5) \textbf{Mezclar tipos en una misma columna}: algunas filas con números y otras con texto produce sumas incorrectas.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía de los 5 tipos». \textbf{Formato:} (a) los 5 tipos con su uso típico; (b) los 5 errores comunes con marca del que más temes cometer. \textbf{Sabes que terminaste cuando} podrías corregir una hoja ajena con tipos equivocados.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- Hoja completa con 5 columnas tipadas} (30 min · individual). Hora de aplicar. Creas una hoja con 5 columnas, una por cada tipo, llenas 5-10 filas con datos reales del entorno escolar, aplicas formato correcto, capturas pantalla del antes y del después, y explicas en el cuaderno qué cambió.
  pilares:
  - |-
    Tu hoja se construye en 5 pasos: (1) crear las 5 columnas con encabezado (Nombre, Edad, Fecha de cumpleaños, Precio de empanada hoy, \% asistencia semana). (2) llenar 5-10 filas con datos reales o realistas. (3) seleccionar cada columna y aplicar Formato de celdas con la categoría correcta. (4) capturar pantalla del antes (datos sin formato) y del después (formateados). (5) anotar en el cuaderno qué cambió visualmente en cada columna.
  - |-
    Sigue el patrón \textbf{``tipo antes que estilo''}: primero te aseguras de que el tipo es correcto (sirve para calcular), después te ocupas de cómo se ve (decimales, colores, bordes). El estilo sin tipo correcto es maquillaje sobre un error estructural.
  - |-
    La verificación final tiene 4 criterios: (a) las columnas de número están alineadas a la derecha; (b) la columna de texto a la izquierda; (c) la fecha aparece con día/mes/año o formato claro; (d) el dinero muestra signo de peso y separación de miles; (e) el porcentaje muestra el símbolo \%. Si los 5 criterios se cumplen, la hoja está lista para recibir fórmulas en la siguiente sesión.
  - |-
    Algoritmo: (1) crea las columnas; (2) llena los datos; (3) selecciona cada columna; (4) Formato de celdas; (5) verifica los 4 criterios visuales; (6) captura antes y después; (7) explica el cambio en el cuaderno.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 5 columnas creadas con encabezado claro. \\[1mm] \checkbox 5-10 filas llenas con datos reales del entorno escolar. \\[1mm] \checkbox Formato de celdas aplicado a cada columna. \\[1mm] \checkbox Captura del antes (sin formato) hecha. \\[1mm] \checkbox Captura del después (formateado) hecha. \\[1mm] \checkbox Tabla en el cuaderno explicando qué cambió por columna. \\[1mm] \checkbox Hoja guardada con nombre claro (G8-P1-S2-tipos.xlsx).
  plantilla_guion: |-
    \textbf{Columna 1 (Texto).} \textit{Nombre completo de compañeros.} \\[1mm] \textbf{Columna 2 (Número).} \textit{Edad en años.} \\[1mm] \textbf{Columna 3 (Fecha).} \textit{Fecha de cumpleaños.} \\[1mm] \textbf{Columna 4 (Moneda).} \textit{Precio de empanada hoy.} \\[1mm] \textbf{Columna 5 (Porcentaje).} \textit{\% de asistencia esta semana.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- Mi hoja con 5 tipos». \textbf{Formato:} (a) capturas antes/después pegadas o dibujadas; (b) tabla 5 filas × 2 columnas (Columna~|~Qué cambió). \textbf{Sabes que terminaste cuando} la hoja podría recibir fórmulas sin errores de tipo en la siguiente sesión.
  producto_titulo: Hoja Excel con 5 columnas tipadas + capturas antes/después + tabla explicativa
  criterios:
  - 5 columnas con tipos distintos (texto, número, fecha, moneda, porcentaje)
  - Formato de celdas aplicado correctamente
  - Captura del antes y del después
  - Tabla explicativa en el cuaderno
  - Verificación visual de alineación y símbolos
  - Hoja guardada con nombre claro
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Los datos correctamente clasificados respetan a quien los produjo; los mal clasificados los reducen a ruido.
    aplicacion: |-
      Cada dato en tu hoja viene de una persona real (un compañero con nombre, una empanada que costó un peso real, una fecha de cumpleaños de alguien). Clasificar bien los tipos es una manera de respetar esa procedencia: el nombre como texto (es identidad, no número), el cumpleaños como fecha (ubicable en el tiempo), el precio como moneda (no abstracto). La phronesis del dato consiste en \textbf{honrar lo que el dato representa, no solo lo que el dato es}.
    pregunta_espejo: |-
      ¿Mi clasificación de tipos respeta lo que cada columna representa, o trato todo como números abstractos?
  estoico:
    autor: Epicteto
    cita: |-
      Lo pequeño bien hecho prepara lo grande; lo pequeño descuidado lo arruina.
    aplicacion: |-
      Es tentador saltarse el formato de celdas y \emph{``ya después arreglar''}. La disciplina estoica recomienda lo opuesto: \emph{lo pequeño bien hecho prepara lo grande}. Si los tipos están bien hoy, las fórmulas funcionarán mañana, los gráficos serán claros pasado, las conclusiones serán sólidas en el mini-estudio. Si los tipos están mal hoy, todo lo que viene heredará ese error.
    pregunta_espejo: |-
      ¿Estoy dedicando suficiente cuidado a esta tarea pequeña, sabiendo que las siguientes sesiones se montan sobre ella?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La información bien estructurada es la nueva ética de la era digital.
    aplicacion: |-
      En la era de la información, los datos mal estructurados son ruido que confunde decisiones; los datos bien estructurados son información que las orienta. La diferencia profesional entre uno y otro está en gestos pequeños como aplicar formato de celdas. Cuando clasificas bien los tipos, estás practicando la ética del oficio digital contemporáneo: \textbf{cuidar la información para que sea útil a otros}.
    pregunta_espejo: |-
      ¿Mi hoja está estructurada para que otra persona la entienda y la use sin pedirme aclaraciones, o solo yo la entiendo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu hoja de los 5 tipos guardada y las capturas listas. En la sesión 3 vas a aprender a \textbf{convertir esa hoja en una tabla de Excel} con campos, registros y limpieza con bitácora. Los tipos correctos de hoy son la base para que la tabla de la próxima sesión funcione sin errores.
web:
  conceptos_clave:
    - termino: Tipo número
      definicion: |-
        Celda que contiene cantidades calculables. Excel la alinea a la derecha por defecto y permite operaciones aritméticas (SUMA, PROMEDIO).
      ejemplo: |-
        "15", "3,14", "200" son números. Si escribes "quince" en una celda, Excel lo trata como texto y no podrá sumarlo con otros números.
      emoji: "🔢"
    - termino: Tipo texto
      definicion: |-
        Celda con cadenas de caracteres no calculables. Excel la alinea a la izquierda por defecto. Sirve para nombres, descripciones, códigos.
      ejemplo: |-
        "María Pérez", "Producto A123", "Código X-45" son texto. Aunque parezcan números (un código), si tienen letras o se usan como identificador, deben ir como texto.
      emoji: "🔤"
    - termino: Tipo fecha
      definicion: |-
        Celda con día/mes/año ordenable cronológicamente. Permite restar fechas para calcular cuántos días pasaron entre dos eventos.
      ejemplo: |-
        "15/03/2026" formateado como fecha permite ordenar de antiguo a reciente, calcular edad, contar días entre dos.
      emoji: "📅"
    - termino: Tipo moneda
      definicion: |-
        Variante del tipo número con símbolo de moneda y separación de miles automática. Útil para precios, gastos, salarios.
      ejemplo: |-
        "$ 5.000" con formato moneda permite que Excel reconozca el contexto financiero y muestre miles separados correctamente.
      emoji: "💰"
    - termino: Tipo porcentaje
      definicion: |-
        Celda que muestra el símbolo \% y se calcula internamente como decimal. 50\% es 0,5 en operaciones internas.
      ejemplo: |-
        Si tienes 0,15 en una celda y aplicas formato porcentaje, Excel muestra "15\%". Multiplicar por una celda monetaria te da el descuento.
      emoji: "📊"
  quiz:
    titulo: ¿Sabes elegir el tipo de dato correcto?
    instrucciones: 5 preguntas para verificar que distingues los 5 tipos básicos de Excel y cuándo usar cada uno.
    preguntas:
      - enunciado: "Escribes '15-marzo' en una celda y quieres ordenar las filas cronológicamente. ¿Qué tipo debe tener esa celda?"
        opciones:
          - Texto
          - Número
          - Fecha
          - Moneda
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Solo el tipo Fecha permite ordenar cronológicamente. Si la celda es texto, el orden sería alfabético y "15-marzo" iría junto a "15-enero" en lugar de su lugar real.
        feedback_incorrecto: |-
          El tipo correcto es Fecha. Solo así Excel reconoce el orden cronológico real, no alfabético.
      - enunciado: 'Tu columna precio tiene celdas con 5000, 7.500, "cinco mil". ¿Qué problema vas a tener al sumar?'
        opciones:
          - Ninguno, Excel suma todo automáticamente
          - La celda con cinco mil será ignorada porque Excel la trata como texto
          - Excel convertirá cinco mil a 5000 automáticamente
          - La suma incluirá las 3 celdas como números
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Excel ignora silenciosamente las celdas con texto cuando sumas. El total queda menor de lo esperado sin aviso.
        feedback_incorrecto: |-
          Excel no convierte texto a número automáticamente. La celda con 'cinco mil' queda fuera de la suma y el total resultante engaña.
      - enunciado: "¿Cuál es la herramienta de Excel que cambia el tipo de una celda?"
        opciones:
          - Insertar → Tabla
          - Datos → Validación
          - Formato → Formato de celdas → Número
          - Inicio → Borrar formato
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Formato de celdas → Número permite elegir Número, Texto, Fecha, Moneda, Porcentaje y otros.
        feedback_incorrecto: |-
          La ruta correcta es Formato → Formato de celdas → pestaña Número. Las otras opciones hacen cosas distintas.
      - enunciado: "Pones 50 en una celda y aplicas formato Porcentaje. ¿Qué muestra Excel?"
        opciones:
          - "50%"
          - "5000%"
          - "0,5%"
          - "0,005%"
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Aplicar porcentaje a una celda con valor 50 lo interpreta como 50 (no 0,5) y lo muestra como 5000\%. Para tener 50\% debes escribir 0,5 antes.
        feedback_incorrecto: |-
          Excel muestra 5000\% porque interpreta el 50 como número entero y lo multiplica por 100. Para tener 50\% debes escribir 0,5 con el formato porcentaje aplicado.
      - enunciado: "¿Cuál es la regla profesional para elegir el tipo de una columna?"
        opciones:
          - Elegir el tipo que se vea más bonito
          - Decidir según lo que voy a hacer con la columna después
          - Usar siempre Texto por seguridad
          - Dejar el tipo por defecto que ponga Excel
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La phronesis consiste en decidir el tipo por el uso futuro: si voy a sumar, número; si voy a ordenar cronológicamente, fecha; si solo voy a leer, texto.
        feedback_incorrecto: |-
          La regla profesional es decidir el tipo según el uso: ¿voy a calcular?, ¿ordenar?, ¿solo leer? El uso determina el tipo correcto.

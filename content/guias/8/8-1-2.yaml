clave: 1-2
grado: 8
periodo: 1
sesion: 2
completo: true
duracion_min: 90
titulo: Cada celda tiene un tipo --- número, texto, fecha, moneda, porcentaje
titulo_portada: |-
  Cada celda
  tiene un tipo
producto_final: |-
  Una hoja de Excel con cinco columnas de tipos distintos, cada una con el formato correcto. Una captura de antes y otra de después. Y una tabla en el cuaderno que diga qué cambió en cada columna y por qué elegiste ese tipo.
apertura:
  origen: Bordadoras de Cartago · nombrar las puntadas
  fuente: |-
    Chica García, A. (2019, 17 de agosto). \emph{Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas}. Radio Nacional de Colombia.
  saber_ancestral: |-
    En Cartago, el bordado a mano es economía y es lenguaje. Más de 1.500 bordadoras trabajan en el municipio y cerca de cien negocios venden lo que hacen (Chica García, 2019). Una sola prenda pasa por las manos de unas ocho artesanas. Y cada gesto de la aguja tiene nombre propio: cadeneta, pasado, rococó, paté cabra, randas caladas (Universidad Autónoma de Occidente, 2021). Ese nombre no es adorno. Cuando la maestra dice «aquí va pasado, no cadeneta», la aprendiz sabe qué hacer y qué corregir. Sin el nombre solo habría «una puntada», y nadie podría pedir, corregir ni enseñar. Ahí está también la \textbf{cara de exclusión} del oficio: la mayoría de quienes bordan son mujeres cabeza de familia con ingreso precario, y saber nombrar no les da todavía un salario digno. Hoy vas a hacer con Excel lo que la bordadora hace con la aguja: ponerle nombre al tipo de cada celda, para que se pueda calcular, corregir y enseñar.
  saber_contemporaneo: |-
    Abres una hoja de Excel y escribes «cinco mil» en una celda. Excel la lee como palabras, no como cantidad: no la puede sumar. Escribes «15 de marzo» sin formato y Excel no sabe ordenarla por mes. Escribes 50000 sin signo de peso y el gráfico no entiende que es dinero. \textbf{Cada celda tiene un tipo}, y elegirlo es la primera tarea antes de calcular. Los cinco tipos básicos son: (1) \textbf{Número}, para cantidades que se calculan; (2) \textbf{Texto}, para nombres y códigos que solo se leen; (3) \textbf{Fecha}, para días que se ordenan y se restan; (4) \textbf{Moneda}, para dinero con símbolo y decimales; (5) \textbf{Porcentaje}, para tasas con el símbolo \%. La herramienta que los aplica se llama \textbf{Formato de celdas}. Nombrar el tipo es lo que permite pedir, corregir y enseñar. Igual que la puntada.
  pregunta_puente: |-
    La bordadora sabe si una puntada es cadeneta o pasado antes de corregirla. Cuando abras una hoja con veinte columnas, ¿sabrás decir de qué tipo es cada una? ¿Y qué le pasa a un promedio si una celda dice «cuatro coma cinco» con letras?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué tipo le dio Excel a cada celda que escribiste; (2) \textbf{aplicar} el formato correcto a cinco columnas con Formato de celdas; (3) \textbf{evaluar} una hoja ajena y encontrar tres columnas con tipo equivocado; (4) \textbf{explicar} con tus palabras por qué un número escrito con letras no se suma.
puentes:
  a_ruta: |-
    En la sesión 1 aprendiste a preguntarle a la hoja antes de calcular. Hoy le pones nombre al tipo de cada columna. Las sesiones que vienen (tablas, funciones, fórmulas) solo funcionan si ese tipo está bien puesto.
  a_escuta: |-
    Antes de la teoría, vas a escribir cinco celdas en Excel y a mirar cómo las trata. Solo mirar: dónde alinea el dato, qué símbolo le pone, si la reconoce o no.
  a_sistematizacion: |-
    Ya viste que Excel decide un tipo por su cuenta. Ahora vas a entender los cinco tipos, a saber cuál conviene para cada columna y a aplicarlo con la herramienta Formato de celdas, en pareja.
  a_praxis: |-
    Ya sabes formatear. Toca revisar: le entregas tu hoja a tu pareja, ella te entrega la suya, y cada uno busca tres columnas mal tipadas en la del otro. Después arreglas la tuya.
  a_producto: |-
    Lo que entregas hoy: la hoja de cinco columnas con su formato, las capturas de antes y de después, y la tabla del cuaderno. La prueba de calidad: en la sesión 3 esa hoja tiene que recibir una fórmula sin dar error.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Ponerle tipo a una celda parece pequeño, pero es lo que decide si un promedio sale bien o sale mal en silencio.
  a_triangulo: |-
    Para terminar, tres ideas sobre nombrar bien, contadas con palabras de esta guía: Dussel sobre lo que queda fuera cuando reducimos a una persona a un número, Marco Aurelio sobre hacer bien lo pequeño, Floridi sobre saber cuál mitad de los datos es basura.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Cinco celdas, cinco tipos} (15 min · individual). (1) Abre Excel y escribe cinco celdas: tu nombre completo, tu edad, tu fecha de nacimiento, el precio de una empanada hoy y el porcentaje del salón que usa gafas. (2) Mira cómo trata Excel cada celda: ¿la alinea a la derecha o a la izquierda? ¿Le pone símbolo? (3) Escribe al lado de cada celda el tipo que crees que Excel le dio. (4) Marca con una estrella la celda que Excel trató distinto de lo que esperabas.
  checks:
  - Escribí las cinco celdas y anoté el tipo que Excel le dio a cada una.
  - Marqué con una estrella la celda que Excel trató distinto de lo que esperaba.
  - Puedo decir por qué esa celda quedó con otro tipo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Cinco celdas, cinco tipos». \textbf{Formato:} tabla de 5 filas y 3 columnas (celda / lo que escribí / tipo que Excel le dio). \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cinco filas están llenas, una celda tiene estrella y puedes explicar por qué Excel la trató distinto.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- Ponle el tipo correcto a cada columna} (25 min · parejas). Excel adivina el tipo, y a veces adivina mal. Tú lo decides. (1) Con tu pareja, creen una hoja con cinco columnas: Nombre, Edad, Fecha de cumpleaños, Precio de la empanada, Porcentaje de asistencia. (2) Llenen cinco filas con datos reales del salón. (3) Antes de tocar nada, tomen una captura de pantalla: es el «antes». (4) Seleccionen cada columna, clic derecho, Formato de celdas, y elijan la categoría que corresponde. (5) Tomen la captura del «después» y comparen las dos.
  pilares:
  - |-
    \textbf{Los cinco tipos.} \textbf{Número} para lo que se calcula (15; 3,14; 200): Excel lo alinea a la derecha. \textbf{Texto} para lo que solo se lee (nombres, códigos): lo alinea a la izquierda. \textbf{Fecha} para días que se ordenan y se restan (15/03/2026). \textbf{Moneda} para dinero con símbolo y decimales (\$ 5.000). \textbf{Porcentaje} para tasas: muestra 50~\% pero calcula con 0,5.
  - |-
    \textbf{La herramienta.} Clic derecho sobre la columna, \emph{Formato de celdas}, pestaña \emph{Número}, y eliges la categoría. Ojo: el formato cambia cómo se \emph{muestra} el dato. Si la celda tiene letras, ponerle formato de número no la convierte en número. Hay que corregir el dato, no solo el formato.
  - |-
    \textbf{La pregunta que decide el tipo.} ¿Qué voy a hacer con esta columna? Si la voy a sumar, es número o moneda. Si la voy a ordenar por fecha, es fecha. Si voy a calcular una tasa, es porcentaje. Si solo la voy a leer, es texto. El tipo se elige por el uso, no por cómo se ve.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Revisa cada columna. (2) Pregúntate qué vas a hacer con ella. (3) Elige el tipo. (4) Selecciona la columna completa. (5) Clic derecho, Formato de celdas, categoría. (6) Mira que los datos se vean bien. (7) Si aparece \texttt{\#\#\#\#}, la columna es angosta: amplíala.
  anatomia:
    titulo: Los cinco tipos, en una mirada
    body: |-
      \textbf{Número:} para calcular. \\[1mm] \textbf{Texto:} para leer, no se calcula. \\[1mm] \textbf{Fecha:} para ordenar y restar días. \\[1mm] \textbf{Moneda:} dinero con símbolo. \\[1mm] \textbf{Porcentaje:} tasa con símbolo \%.
  errores_comunes: |-
    (1) \textbf{Número escrito con letras}: «cinco mil» no se suma. (2) \textbf{Fecha como texto}: «15 de marzo» no se ordena por mes. (3) \textbf{Dinero sin formato}: 50000 sin signo no se reconoce como moneda en el gráfico. (4) \textbf{Porcentaje multiplicado por cien}: si la celda ya tiene 50 y le pones formato de porcentaje, Excel muestra 5000~\%. (5) \textbf{Tipos mezclados en una columna}: unas filas con número y otras con texto dan sumas incompletas sin avisar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- El tipo de cada columna». \textbf{Formato:} tabla de 5 filas y 3 columnas (columna / tipo elegido / qué voy a hacer con ella). \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cinco columnas tienen tipo y razón, y las dos capturas están guardadas con nombre.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Revisa la hoja de tu pareja y arregla la tuya} (30 min · individual). Ahora cambias de silla. (1) Abre la hoja de tu pareja, sin que te explique nada. (2) Busca tres columnas con tipo equivocado o dudoso. Pista: alineación rara, dinero sin símbolo, fecha que no se ordena. (3) Anota cada hallazgo con la razón en una línea. (4) Devuélvele la hoja y recibe los hallazgos de la tuya. (5) Corrige tu hoja, toma la captura final y llena la tabla del cuaderno.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) La hoja corregida con cinco columnas bien tipadas. (2) Las capturas de antes y de después. (3) La tabla del cuaderno: qué cambió en cada columna y por qué elegiste ese tipo.
  - |-
    \textbf{Cómo revisar una hoja ajena.} Mira una columna a la vez. Pregunta qué se va a hacer con ella. Mira cómo la alinea Excel. Prueba una suma rápida abajo: si da menos de lo esperado, hay texto disfrazado de número.
  - |-
    \textbf{Tipo antes que estilo.} Primero aseguras que el tipo sirve para calcular. Después te ocupas de los decimales, los colores y los bordes. El estilo sobre un tipo equivocado es maquillaje sobre un error.
  - |-
    \textbf{Antes de entregar, prueba la hoja.} Escribe debajo de la columna de edades \texttt{=SUMA(} y selecciona la columna. Si el resultado es el que esperas, la hoja está lista para la sesión 3. Si no, hay una celda que Excel no lee como número.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Cinco columnas con encabezado claro y cinco filas con datos reales. \\[1mm] \checkbox Formato de celdas aplicado a cada columna. \\[1mm] \checkbox Captura del antes y captura del después. \\[1mm] \checkbox Tres hallazgos en la hoja de mi pareja, con razón. \\[1mm] \checkbox Tabla del cuaderno completa. \\[1mm] \checkbox Hoja guardada como G8-P1-S2-tipos.xlsx.
  plantilla_guion: |-
    \textbf{Columna 1 (Texto).} \textit{Nombre completo.} \\[1mm] \textbf{Columna 2 (Número).} \textit{Edad en años.} \\[1mm] \textbf{Columna 3 (Fecha).} \textit{Fecha de cumpleaños.} \\[1mm] \textbf{Columna 4 (Moneda).} \textit{Precio de la empanada hoy.} \\[1mm] \textbf{Columna 5 (Porcentaje).} \textit{Asistencia de esta semana.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Qué cambió y por qué». \textbf{Formato:} tabla de 5 filas y 2 columnas (columna / qué cambió y por qué), más los tres hallazgos de la hoja ajena. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} tu pareja encontró tus errores, los corregiste, y una suma de prueba da el resultado esperado.
  producto_titulo: Hoja con cinco columnas tipadas + capturas de antes y después + tabla de cambios
  criterios:
  - Las cinco columnas tienen tipos distintos y el formato correcto
  - Hay captura de antes y captura de después
  - La tabla del cuaderno dice qué cambió en cada columna y por qué
  - Encontraste tres columnas mal tipadas en la hoja de tu pareja, con razón
  - Una suma de prueba sobre la columna de edades da el resultado esperado
  - La hoja está guardada con nombre claro
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.2.2
    idea: |-
      Una persona no es una cosa más entre las cosas de un sistema. Cuando la reducimos a un número, algo de ella queda por fuera.
    aplicacion: |-
      Cada dato de tu hoja viene de alguien real: un compañero con nombre, un cumpleaños, un precio que alguien pagó. Poner el nombre como texto y no como número no es un detalle técnico: es reconocer que ese dato es una identidad, no una cantidad.
    pregunta_espejo: |-
      ¿Qué de las personas de mi hoja se pierde cuando solo miro los números?
  estoico:
    autor: Marco Aurelio · Meditaciones X, 16 (c. 175 d.C.)
    idea: |-
      Deja de discutir cómo debería ser una persona que hace bien las cosas, y hazlas bien.
    aplicacion: |-
      Es tentador saltarse el formato y «ya después arreglar». Pero las fórmulas de la sesión 3 se montan sobre lo que hagas hoy. Hacer bien lo pequeño no es perfeccionismo: es lo que evita el error grande de mañana.
    pregunta_espejo: |-
      ¿Le puse a esta tarea pequeña el cuidado que va a necesitar la grande?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      La mitad de los datos que guardamos es basura, y el problema es que no sabemos cuál mitad.
    aplicacion: |-
      Una celda con «cinco mil» escrito con letras es basura disfrazada de dato: parece un número y no lo es. Ponerle tipo a cada columna es la primera forma de saber cuál mitad de tu hoja sirve.
    pregunta_espejo: |-
      ¿Cuántas celdas de mi hoja parecen datos y no lo son?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu hoja de cinco tipos guardada y las dos capturas. En la sesión 3 la vas a convertir en una tabla de Excel con campos y registros, y vas a limpiarla con una bitácora. Si los tipos están bien hoy, la tabla no dará errores mañana.

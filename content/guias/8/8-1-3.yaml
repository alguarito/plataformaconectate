clave: 1-3
grado: 8
periodo: 1
sesion: 3
completo: true
titulo: Tablas de datos --- campos, registros y limpieza con bitácora
titulo_portada: |-
  Tablas de datos ---
  campos, registros
  y limpieza con bitácora
producto_final: |-
  Tabla en Excel con al menos 20 registros y 5 campos (columnas) sobre un tema escolar real, formato de tabla aplicado (Insertar → Tabla) + bitácora de limpieza que documente al menos 5 errores corregidos (espacios extra, mayúsculas inconsistentes, fechas mal formateadas, duplicados, celdas vacías) con captura del antes y del después de cada corrección
apertura:
  saber_ancestral: |-
    En las cocinas tradicionales del Valle del Cauca, ningún plato bueno empezaba con el grano sucio. Las cocineras y las abuelas tenían un gesto previo que duraba a veces media hora y que muchos nietos consideraban innecesario: \textbf{lavar y seleccionar el grano antes de cocinarlo}. El \textbf{frijol} se extendía sobre una mesa, se buscaba la piedrita oculta, el grano picado, el palito que se coló en la cosecha. El \textbf{café} se escogía grano por grano: el verde fuera, el negro fuera, el grano perfecto al canasto que iría al tostador. El \textbf{arroz} se lavaba 3 veces para sacarle el almidón viejo. Si la cocinera saltaba el lavado, el plato salía con piedra entre los dientes, con sabor a moho, con grano duro. Los comensales no sabían qué había pasado, pero ya no volvían. La sabiduría de las cocinas era inquebrantable: \textbf{lo que se cocina sucio sale sucio, por más fuego que se le ponga}. Esa disciplina del lavado es exactamente la disciplina que el oficio digital pide cuando trabajamos con tablas de datos.
  saber_contemporaneo: |-
    Una \textbf{tabla de datos} en Excel es un conjunto organizado de información donde cada columna es un \textbf{campo} (una característica que se mide: nombre, edad, fecha, nota, precio) y cada fila es un \textbf{registro} (un individuo o evento concreto: el estudiante Juan con edad 13 nacido el 15 de marzo). Para que esa tabla sirva, los datos deben estar limpios: sin espacios extra, sin mayúsculas inconsistentes (\emph{``María''} y \emph{``MARIA''} como si fueran personas distintas), sin fechas mal escritas, sin duplicados, sin celdas vacías que confundan los cálculos. La regla profesional, conocida desde los años 80 cuando se inventó la base de datos relacional, es famosa: \textbf{garbage in, garbage out} (basura entra, basura sale). Si los datos están sucios, ningún cálculo posterior tendrá sentido. La \textbf{limpieza con bitácora} es el oficio profesional: cada corrección se documenta (qué error había, qué se hizo, cuándo se hizo) para que el proceso sea reproducible y honesto.
  pregunta_puente: |-
    ¿Qué sabía la cocinera al lavar el grano antes de cocinarlo, que el estudiante novato olvida cuando hace promedios sobre una tabla sucia? ¿Y por qué un analista profesional dedica más tiempo a \emph{limpiar} la tabla que a calcular con ella?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 5 tipos de error más comunes en tablas de datos (espacios extra, mayúsculas inconsistentes, fechas mal formateadas, duplicados, vacíos); (2) \textbf{aplicar} las funciones básicas de limpieza en Excel (Buscar y reemplazar, ESPACIOS, MAYUSC/MINUSC/NOMPROPIO, Quitar duplicados, Filtros); (3) \textbf{analizar} la tabla resultante para verificar que está lista para cálculos; (4) \textbf{explicar} en una bitácora de limpieza qué se corrigió, cómo y por qué.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 aprendiste a preguntar antes de calcular; en la sesión 2 a clasificar por tipo. Hoy aprendes a \emph{limpiar} la tabla antes de calcular. Las próximas sesiones (funciones, gráficos, mini-estudio) asumen tablas limpias. Sin limpieza hoy, los promedios y gráficos de las sesiones siguientes serán falsos.
  a_escuta: |-
    Antes de teorizar, vas a abrir una tabla con suciedad real (la entrega tu docente o la creas tú con errores intencionales) y vas a anotar todo lo sospechoso que veas: nombres con mayúsculas distintas, espacios al inicio o al final, fechas raras, filas que parecen iguales pero no idénticas, celdas vacías. Esa primera mirada es el inventario de la limpieza.
  a_sistematizacion: |-
    Ya tienes el inventario. Ahora vas a entender la \textbf{anatomía de la limpieza profesional}: los 5 errores más comunes, las 5 herramientas que los resuelven, y por qué la \textbf{bitácora} es lo que separa al limpiador amateur del profesional.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: limpiar la tabla aplicando las 5 herramientas, documentar cada corrección en la bitácora con captura del antes y del después, y verificar que la tabla resultante esté lista para cálculos.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: tabla de 20+ registros limpia + bitácora de 5+ correcciones documentadas. El criterio principal: que otra persona pueda mirar tu bitácora y reproducir las mismas correcciones sin pedir ayuda.
  a_evaluacion: |-
    Antes de cerrar, mira la limpieza desde las cinco dimensiones humanas. Limpiar con bitácora es respeto por quien usará la tabla después; limpiar sin documentar es trabajo invisible que nadie podrá verificar.
  a_triangulo: |-
    Y para terminar, tres voces sobre el oficio de limpiar. Dussel sobre los datos sucios que invisibilizan personas, Séneca sobre la disciplina de la paciencia, Floridi sobre la limpieza como ética del oficio digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario de la suciedad} (15 min · individual). Tu docente proyecta o entrega una tabla con errores intencionales (puede ser una lista de compañeros del grado con datos mal capturados: nombres con espacios extra, mayúsculas inconsistentes, fechas mal escritas, una fila duplicada, alguna celda vacía). Sin corregir nada todavía, anota en una lista todos los problemas que detectes. Reglas: (1) mira columna por columna; (2) marca con asterisco los errores que afectan cálculos posteriores; (3) cuenta cuántos registros tiene la tabla y cuántos parecen sospechosos.
  checks:
  - Miré la tabla columna por columna sin corregir nada.
  - Anoté al menos 5 problemas detectados.
  - Marqué cuáles afectan cálculos posteriores.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Inventario de suciedad». \textbf{Formato:} lista numerada con cada problema detectado + columna donde aparece + marca de impacto (alto/medio/bajo). \textbf{Sabes que terminaste cuando} sabrías por dónde empezar a limpiar.
sistematizacion:
  intro: |-
    Un inventario sin método de limpieza es lista de quejas. Para que tu limpieza sea profesional necesitas la \textbf{anatomía de los 5 errores comunes} y sus respectivas herramientas de Excel.
  pilares:
  - |-
    Los 5 errores más comunes en tablas se descomponen así: (1) \textbf{Espacios extra}: caracteres invisibles al inicio o final de las celdas (\emph{``\_\_María\_''} con espacios) que rompen búsquedas y filtros. Se corrige con la función \texttt{=ESPACIOS(celda)} o Buscar y reemplazar. (2) \textbf{Mayúsculas inconsistentes}: \emph{``maría''}, \emph{``MARÍA''}, \emph{``María''} aparecen como personas distintas. Se corrige con \texttt{=NOMPROPIO()}, \texttt{=MAYUSC()}, \texttt{=MINUSC()}. (3) \textbf{Fechas mal formateadas}: \emph{``15-marzo''} o \emph{``15/3''} sin año no se ordenan ni calculan. Se corrige aplicando formato de celda Fecha (sesión 2). (4) \textbf{Duplicados}: dos filas idénticas inflan los conteos. Se quitan con Datos → Quitar duplicados. (5) \textbf{Celdas vacías}: rompen promedios (Excel las ignora) o suman como cero (cuando se rellenan mal). Se identifican filtrando por vacío y se deciden caso por caso: rellenar, dejar vacío o eliminar la fila completa.
  - |-
    La \textbf{bitácora de limpieza} es lo que separa al amateur del profesional. Tiene 4 columnas: (a) \textbf{Error encontrado}: descripción breve del problema (ej. \emph{``María aparece 3 veces escrita distinto''}). (b) \textbf{Herramienta aplicada}: qué se hizo (ej. \emph{``NOMPROPIO para unificar capitalización''}). (c) \textbf{Cuándo}: fecha y hora de la corrección. (d) \textbf{Justificación}: por qué se eligió esa corrección (ej. \emph{``unifiqué a NOMPROPIO porque la mayoría ya estaba así''}). Sin bitácora, las decisiones quedan invisibles y nadie puede verificar el trabajo.
  - |-
    Lo esencial cabe en una frase: \emph{una tabla limpia no es la que se ve bonita, es la que sirve}. Servir significa que las fórmulas funcionarán, que los gráficos no engañarán, que los filtros encontrarán todo lo que deben encontrar. La phronesis del oficio consiste en \textbf{medir la limpieza por su utilidad futura, no por su apariencia presente}.
  - |-
    Algoritmo: (1) inventario de problemas (Actividad 1); (2) elegir herramienta para cada problema; (3) aplicar en orden de impacto (los que afectan cálculos primero); (4) capturar pantalla del antes y del después de cada corrección; (5) documentar en bitácora con las 4 columnas; (6) verificar que las fórmulas básicas (suma, promedio) funcionan en la tabla limpia.
  anatomia:
    titulo: Anatomía de la tabla limpia
    body: |-
      \textbf{Sin espacios extra:} celdas sin caracteres invisibles. \\[1mm] \textbf{Mayúsculas consistentes:} criterio único por columna. \\[1mm] \textbf{Fechas formateadas:} ordenables y calculables. \\[1mm] \textbf{Sin duplicados:} cada registro único. \\[1mm] \textbf{Vacíos decididos:} cada celda vacía justificada o rellenada. \\[1mm] \textbf{Bitácora completa:} 4 columnas por cada corrección.
  errores_comunes: |-
    (1) \textbf{Limpiar sin documentar}: nadie puede verificar qué se hizo. (2) \textbf{Quitar duplicados sin revisar primero}: a veces dos filas parecen iguales pero tienen una diferencia importante. (3) \textbf{Rellenar vacíos con ceros automáticamente}: distorsiona promedios. (4) \textbf{Limpiar columna por columna sin orden}: el orden importa porque algunas correcciones generan otras. (5) \textbf{No capturar antes/después}: pierdes la evidencia del cambio.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía de la limpieza». \textbf{Formato:} (a) los 5 errores con su herramienta correspondiente; (b) plantilla de bitácora con las 4 columnas lista para usar. \textbf{Sabes que terminaste cuando} tienes claro qué herramienta usar para cada error.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EXPLICA --- Tabla limpia con bitácora} (35 min · individual). Hora de aplicar. Limpias tu tabla aplicando las 5 herramientas según el inventario, capturas antes y después de cada corrección, documentas todo en la bitácora.
  pilares:
  - |-
    Tu trabajo se construye en 6 pasos: (1) tomar la tabla original con suciedad (al menos 20 registros y 5 campos). (2) aplicar Buscar y reemplazar para espacios extra y mayúsculas. (3) usar Datos → Quitar duplicados (revisando primero). (4) aplicar formato de celdas a las fechas. (5) decidir caso por caso qué hacer con los vacíos. (6) llenar la bitácora con captura antes/después de cada corrección.
  - |-
    Sigue el patrón \textbf{``documentar lo que se hace''}: cada acción de limpieza queda registrada con su justificación. Esa disciplina parece lenta pero es la única que permite (a) que otra persona reproduzca tu trabajo, (b) que tú mismo recuerdes qué decidiste si vuelves a la tabla en una semana, (c) que el docente pueda evaluar tu criterio, no solo tu resultado.
  - |-
    El orden de las correcciones importa: (a) primero espacios extra (porque afectan a todo lo demás). (b) después mayúsculas (porque sin uniformar, los duplicados no se detectan bien). (c) después duplicados (porque antes había falsos positivos). (d) después fechas (formato). (e) finalmente vacíos (decididos uno a uno). Si lo haces en otro orden, harás trabajo doble.
  - |-
    Algoritmo de verificación final: (a) selecciona toda la tabla; (b) usa Datos → Filtro y mira cada columna con el filtro abierto: si una columna debería ser limpia y aparece con valores raros, no quedó limpia. (c) prueba una fórmula básica como \texttt{=PROMEDIO()} sobre una columna numérica: si da error, hay algún número que quedó como texto. (d) cuenta los registros finales y compara con los iniciales para saber cuántos quitaste.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Tabla original guardada como referencia. \\[1mm] \checkbox Espacios extra corregidos. \\[1mm] \checkbox Mayúsculas unificadas según criterio. \\[1mm] \checkbox Duplicados revisados y quitados. \\[1mm] \checkbox Fechas formateadas correctamente. \\[1mm] \checkbox Vacíos decididos caso por caso. \\[1mm] \checkbox Bitácora con al menos 5 correcciones documentadas. \\[1mm] \checkbox Captura antes/después por cada corrección. \\[1mm] \checkbox Fórmulas básicas funcionan en la tabla limpia.
  plantilla_guion: |-
    \textbf{Error.} \textit{Descripción breve.} \\[1mm] \textbf{Herramienta.} \textit{Qué se usó (función, menú, atajo).} \\[1mm] \textbf{Cuándo.} \textit{Fecha y hora de corrección.} \\[1mm] \textbf{Justificación.} \textit{Por qué esta corrección y no otra.} \\[1mm] \textbf{Resultado.} \textit{Captura del después.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EXPLICA).} Título: «Actividad 3 --- Tabla limpia + bitácora». \textbf{Formato:} (a) tabla limpia (referencia al archivo Excel); (b) bitácora de 5+ filas con las 5 columnas; (c) verificación final con prueba de fórmula básica. \textbf{Sabes que terminaste cuando} otro estudiante podría reproducir tu limpieza siguiendo solo la bitácora.
  producto_titulo: Tabla limpia de 20+ registros + bitácora de 5+ correcciones documentadas
  criterios:
  - Tabla con al menos 20 registros y 5 campos
  - Formato de tabla aplicado (Insertar → Tabla)
  - Espacios extra corregidos
  - Mayúsculas unificadas
  - Fechas formateadas
  - Duplicados quitados con revisión previa
  - Vacíos decididos caso por caso
  - Bitácora con 5+ correcciones documentadas
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Los datos sucios invisibilizan personas; los datos limpios las hacen contables, en el doble sentido: cuentan y se les puede contar.
    aplicacion: |-
      Detrás de cada registro de tu tabla hay personas reales. Si dejas \emph{``maría''} y \emph{``MARÍA''} como dos personas distintas, estás duplicando a María: cuentas dos veces lo que es una. Si dejas espacios extra, María no aparece en los filtros que la buscan, y queda invisible. La filosofía de la liberación pide cuidado por estas pequeñas operaciones que afectan a personas concretas. La phronesis del dato consiste en \textbf{no dejar a nadie escondido por descuido técnico}.
    pregunta_espejo: |-
      ¿Mi limpieza cuida que ninguna persona quede invisible o duplicada por error?
  estoico:
    autor: Séneca
    cita: |-
      La paciencia del oficio no es lentitud: es respeto por lo que se hace.
    aplicacion: |-
      Limpiar 20 registros con bitácora completa toma 30 minutos. Es tentador acelerar saltando el paso de documentar. La sabiduría estoica recomienda lo opuesto: \emph{lo bien hecho exige paciencia}. Esa paciencia no es pérdida de tiempo: es la única forma de hacer trabajo que se sostenga bajo verificación. El analista que limpia rápido y mal pasa toda la vida arreglando los errores que dejó.
    pregunta_espejo: |-
      ¿Estoy limpiando con la paciencia que el oficio merece, o estoy corriendo para terminar?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La calidad de la información es la ética del autor en la era digital.
    aplicacion: |-
      En la era de la información, no basta tener datos: hay que tenerlos limpios y documentados. Quien comparte datos sucios contribuye al ruido informacional; quien comparte datos limpios con bitácora contribuye a la calidad colectiva. Tu hoja de hoy puede parecer pequeña, pero te entrena en una práctica que rige toda profesión técnica del siglo XXI: \textbf{cuidar la información como acto ético}.
    pregunta_espejo: |-
      ¿Mi tabla limpia contribuye a la calidad informacional, o es solo trabajo escolar sin proyección profesional?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu tabla limpia y la bitácora completa. En la sesión 4 vas a aprender las 4 \textbf{funciones estadísticas básicas} (SUMA, PROMEDIO, MAX, MIN) y a usarlas para tomar decisiones. Sin tabla limpia hoy, esas funciones de mañana darán resultados engañosos.
web:
  conceptos_clave:
    - termino: Campo y registro
      definicion: |-
        En una tabla, el campo es la columna (una característica medida) y el registro es la fila (un individuo o evento concreto).
      ejemplo: |-
        En una tabla de estudiantes: las columnas Nombre, Edad, Grado son campos; cada fila con datos de un estudiante específico es un registro.
      emoji: "🗂"
    - termino: Espacio extra invisible
      definicion: |-
        Caracteres en blanco al inicio o final de una celda que el ojo no nota pero rompen búsquedas, filtros y comparaciones.
      ejemplo: |-
        "María" y "María " (con espacio al final) son consideradas distintas por Excel. La función ESPACIOS los elimina automáticamente.
      emoji: "👻"
    - termino: Mayúsculas inconsistentes
      definicion: |-
        Mismo dato escrito con capitalización distinta en celdas distintas. Excel los trata como entradas diferentes.
      ejemplo: |-
        "maría", "MARÍA", "María" se cuentan como 3 personas distintas en un filtro o conteo. NOMPROPIO unifica al estándar.
      emoji: "🅰️"
    - termino: Duplicados
      definicion: |-
        Filas idénticas o casi idénticas que inflan los conteos. Datos → Quitar duplicados los detecta y elimina con confirmación.
      ejemplo: |-
        Si registras 2 veces al mismo estudiante por error, los totales y promedios saldrán distorsionados. Eliminar duplicados los corrige.
      emoji: "👯"
    - termino: Bitácora de limpieza
      definicion: |-
        Documento donde se anota cada corrección hecha a la tabla con descripción, herramienta usada y razón. Permite reproducir el proceso.
      ejemplo: |-
        Fila: "Espacios extra en columna Nombre" \rightarrow "Aplicada función ESPACIOS" \rightarrow "Para que el filtro funcione bien".
      emoji: "📓"
  quiz:
    titulo: ¿Sabes limpiar una tabla con disciplina?
    instrucciones: 5 preguntas para verificar que reconoces errores comunes en tablas y sabes corregirlos con bitácora.
    preguntas:
      - enunciado: "En una tabla, la fila con todos los datos de un estudiante (nombre, edad, grado) se llama..."
        opciones:
          - Campo
          - Cabecera
          - Registro
          - Celda
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Registro = fila con un caso/evento completo. Campo = columna con una característica.
        feedback_incorrecto: |-
          La fila completa con los datos se llama registro. El campo es la columna (Nombre, Edad, Grado).
      - enunciado: "Buscas 'María' en la columna Nombre y solo aparece 1 vez, pero deberían ser 5 marías. ¿Qué problema probable hay?"
        opciones:
          - Mayúsculas inconsistentes y espacios extra
          - Excel no funciona bien
          - Las filas están duplicadas
          - El tipo de dato es incorrecto
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Si las otras marías están como "MARIA", "maría", "María " (con espacio), no aparecen en la búsqueda exacta.
        feedback_incorrecto: |-
          La causa más común es inconsistencia en mayúsculas y espacios. NOMPROPIO y ESPACIOS las unifican.
      - enunciado: "¿Para qué sirve la bitácora de limpieza?"
        opciones:
          - Para hacer la tabla más bonita
          - Para guardar las celdas borradas
          - Solo es trámite escolar
          - Para registrar paso a paso lo que se corrigió y por qué
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Sin bitácora, las decisiones de limpieza quedan invisibles y nadie puede reproducir tu trabajo.
        feedback_incorrecto: |-
          La bitácora documenta qué corregiste y por qué. Permite que otra persona reproduzca el proceso y verifique el criterio.
      - enunciado: "¿Cuál es el orden recomendado para limpiar?"
        opciones:
          - Quitar duplicados → arreglar fechas → corregir mayúsculas → eliminar espacios
          - Eliminar espacios → unificar mayúsculas → quitar duplicados → arreglar fechas
          - Cualquier orden funciona igual
          - Arreglar fechas → quitar duplicados → corregir mayúsculas → eliminar espacios
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Espacios primero (afectan todo lo demás), después mayúsculas (sin uniformar no se detectan duplicados), después duplicados y finalmente fechas.
        feedback_incorrecto: |-
          El orden importa: espacios → mayúsculas → duplicados → fechas. Si lo haces al revés, harás trabajo doble.
      - enunciado: "La regla profesional dice que una tabla limpia es..."
        opciones:
          - La que se ve más bonita
          - La que sirve para que las fórmulas y filtros funcionen sin engañar
          - La que tiene menos filas
          - La que ocupa menos espacio en disco
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Una tabla limpia es la que sirve para análisis posterior. La apariencia es secundaria.
        feedback_incorrecto: |-
          La tabla limpia se mide por utilidad futura: que las fórmulas, filtros y gráficos funcionen sin distorsiones.

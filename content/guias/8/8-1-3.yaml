clave: 1-3
grado: 8
periodo: 1
sesion: 3
completo: true
duracion_min: 90
titulo: Tablas limpias --- campos, registros y una bitácora de lo que corregiste
titulo_portada: |-
  Tablas limpias
  y su bitácora
producto_final: |-
  Una tabla de Excel con al menos 20 registros y 5 campos sobre un tema real del colegio, con formato de tabla aplicado. Y una bitácora que documente al menos cinco errores corregidos, con captura de antes y de después de cada uno.
apertura:
  origen: Congresos del CRIC · mandatos y rendición de cumplimiento
  fuente: |-
    Consejo Regional Indígena del Cauca. (2017). \emph{Avanza el XV congreso regional del CRIC en el resguardo de Rioblanco Sotará del pueblo indígena yanacona}.
  saber_ancestral: |-
    En los pueblos indígenas del Cauca, las normas que rigen a todos se llaman \textbf{mandatos}. No las escribe una autoridad sola. Salen de un congreso al que llega la gente de los resguardos a discutir durante días. El XV Congreso del Consejo Regional Indígena del Cauca se reunió en Río Blanco, Sotará, del 25 al 30 de junio de 2017 (CRIC, 2017). De allí salieron mandatos concretos, numerados y escritos. Y lo más importante viene después: en el siguiente congreso, la organización rinde cuentas en público de cuáles se cumplieron y cuáles no. El registro se revisa, se corrige y se vuelve a mirar. Un mandato no vale por estar escrito; vale porque quienes lo hicieron vuelven a mirarlo. La \textbf{cara de exclusión}: un mandato es un acto de gobierno de un pueblo que se disputa con el Estado y con actores armados. El propio CRIC reporta que muchos quedan sin cumplir. Nosotros hacemos hoy algo mucho más pequeño que aprende de eso: una tabla con sus registros y una bitácora de lo que corregimos, para que cualquiera pueda volver a mirarla.
  saber_contemporaneo: |-
    Una \textbf{tabla de datos} en Excel tiene dos partes. Cada columna es un \textbf{campo}: una característica que se mide, como nombre, edad, fecha o nota. Cada fila es un \textbf{registro}: una persona o un evento concreto, con todos sus campos. Para que la tabla sirva, tiene que estar limpia: sin espacios extra, sin «María» y «MARIA» como si fueran dos personas, sin fechas mal escritas, sin filas repetidas y sin celdas vacías. Hay una regla vieja en el oficio de los datos: \emph{basura entra, basura sale}. Si la tabla está sucia, ningún cálculo posterior sirve. Y hay una costumbre que separa al aficionado del profesional: la \textbf{bitácora de limpieza}. Cada corrección se anota: qué error había, qué hiciste, cuándo y por qué. Sin bitácora, nadie puede volver a mirar tu trabajo. Ni tú.
  pregunta_puente: |-
    El CRIC no solo escribe los mandatos: en el siguiente congreso rinde cuentas de cuáles cumplió. Cuando limpies una tabla, ¿vas a poder decir qué corregiste, cuándo y por qué? ¿O solo vas a tener una tabla que «se ve bien»?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los cinco errores más comunes de una tabla; (2) \textbf{aplicar} las herramientas de limpieza de Excel en el orden correcto; (3) \textbf{analizar} si la tabla limpia ya sirve para calcular; (4) \textbf{explicar} en una bitácora qué corregiste, cómo y por qué.
puentes:
  a_ruta: |-
    En la sesión 2 le pusiste tipo a cada columna. Hoy conviertes esas columnas en una tabla con campos y registros, y la limpias con bitácora. En la sesión 4 vas a calcular sobre ella, y solo sirve si hoy quedó limpia.
  a_escuta: |-
    Antes de limpiar, vas a mirar una tabla sucia que te entrega tu docente y a hacer el inventario de sus problemas. Todavía no corriges nada. Solo miras y anotas.
  a_sistematizacion: |-
    Ya tienes el inventario. Ahora vas a entender los cinco errores comunes, la herramienta de Excel que arregla cada uno y el orden en que se aplican. Y vas a limpiar en pareja.
  a_praxis: |-
    Ya limpiaste con tu pareja. Ahora escribes tú la bitácora de tu tabla y compruebas, con una fórmula de prueba, que la tabla ya sirve.
  a_producto: |-
    Lo que entregas hoy: la tabla limpia con formato de tabla y la bitácora con cinco correcciones documentadas. La prueba de calidad: otra persona puede leer tu bitácora y repetir tu limpieza sin preguntarte nada.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Limpiar sin anotar es esconder el trabajo; anotar lo que corregiste es dejar que otros vuelvan a mirarlo.
  a_triangulo: |-
    Para terminar, tres ideas sobre volver a mirar, contadas con palabras de esta guía: Dussel sobre creer que la información se entiende sola, Marco Aurelio sobre aceptar la corrección, Floridi sobre saber qué datos guardar y cuáles no.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario de la suciedad} (15 min · individual). (1) Recibe la tabla con errores que te entrega o proyecta tu docente: una lista del grado con nombres, edades y fechas mal capturados. (2) Mira una columna a la vez. (3) Anota cada problema que veas: espacios de más, mayúsculas distintas, fechas raras, filas repetidas, celdas vacías. (4) Marca con una estrella los problemas que dañarían un cálculo. (5) Cuenta cuántos registros tiene la tabla y cuántos parecen sospechosos.
  checks:
  - Tengo una lista numerada de problemas, con la columna donde aparece cada uno.
  - Marqué con estrella los que dañarían una suma o un promedio.
  - Conté cuántos registros hay y cuántos son sospechosos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Inventario de la suciedad». \textbf{Formato:} lista numerada con problema, columna y marca de impacto (alto, medio, bajo). \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tienes al menos cinco problemas anotados y sabes por cuál empezarías.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- Limpia la tabla en el orden correcto} (30 min · parejas). Un inventario sin herramientas es una lista de quejas. (1) Con tu pareja, abran la tabla sucia y guárdenla con otro nombre: la original no se toca. (2) Quiten los espacios de más con la función \texttt{=ESPACIOS()} o con Buscar y reemplazar. (3) Unifiquen las mayúsculas con \texttt{=NOMPROPIO()}. (4) Revisen las filas repetidas antes de quitarlas con Datos, Quitar duplicados. (5) Apliquen formato de fecha a la columna de fechas. (6) Decidan qué hacer con cada celda vacía, una por una. (7) Tomen captura antes y después de cada paso.
  pilares:
  - |-
    \textbf{Los cinco errores y su herramienta.} Espacios de más: \texttt{=ESPACIOS(celda)} o Buscar y reemplazar. Mayúsculas distintas: \texttt{=NOMPROPIO()}, \texttt{=MAYUSC()} o \texttt{=MINUSC()}. Fechas mal escritas: formato de celda Fecha, como en la sesión 2. Filas repetidas: Datos, Quitar duplicados. Celdas vacías: se filtran y se decide caso por caso.
  - |-
    \textbf{El orden importa.} Primero los espacios, porque afectan a todo lo demás. Después las mayúsculas, porque sin unificarlas los duplicados no se detectan bien. Después los duplicados. Después las fechas. Al final las celdas vacías, una por una. En otro orden haces el trabajo dos veces.
  - |-
    \textbf{Una celda vacía no es un cero.} Si la llenas con cero, el promedio baja. Si la dejas vacía, Excel la ignora al promediar. Cada vacío se decide: rellenar con el dato real si lo sabes, dejar vacío si no, o quitar la fila si no sirve. Y se anota la decisión.
  - |-
    \textbf{Una tabla limpia no es la que se ve bonita: es la que sirve.} Sirve cuando las fórmulas funcionan, los filtros encuentran todo y los gráficos no engañan. Mide la limpieza por lo que vas a hacer después, no por cómo se ve ahora.
  anatomia:
    titulo: La tabla limpia, en una mirada
    body: |-
      \textbf{Sin espacios de más:} ningún carácter invisible. \\[1mm] \textbf{Mayúsculas iguales:} un criterio por columna. \\[1mm] \textbf{Fechas con formato:} se ordenan y se restan. \\[1mm] \textbf{Sin duplicados:} cada registro una sola vez. \\[1mm] \textbf{Vacíos decididos:} cada uno con su razón. \\[1mm] \textbf{Bitácora completa:} cuatro columnas por corrección.
  errores_comunes: |-
    (1) \textbf{Limpiar sin anotar}: nadie puede verificar qué hiciste. (2) \textbf{Quitar duplicados sin revisar}: dos filas que parecen iguales pueden tener una diferencia importante. (3) \textbf{Llenar los vacíos con ceros}: baja los promedios. (4) \textbf{Limpiar en cualquier orden}: unas correcciones dependen de otras. (5) \textbf{No tomar la captura del antes}: pierdes la prueba del cambio.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- La limpieza en orden». \textbf{Formato:} lista de los cinco pasos en el orden que los hicieron, con la herramienta usada al lado. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} los cinco pasos están en orden, cada uno con su herramienta, y tienen una captura de antes y de después por paso.
praxis:
  intro: |-
    \textbf{Actividad 3 · EXPLICA --- Escribe la bitácora y prueba la tabla} (25 min · individual). Ahora cuentas lo que hiciste, para que otro pueda repetirlo. (1) Abre tu tabla limpia y selecciónala completa. (2) Aplica Insertar, Tabla, para que Excel la reconozca como tabla. (3) Escribe la bitácora: por cada corrección, qué error había, qué herramienta usaste, cuándo y por qué. (4) Prueba la tabla con \texttt{=PROMEDIO()} sobre una columna numérica: si da error, quedó un número como texto. (5) Cuenta los registros finales y compáralos con los iniciales.
  pilares:
  - |-
    \textbf{La bitácora tiene cuatro columnas.} Error encontrado: «María aparece tres veces escrita distinto». Herramienta: «NOMPROPIO para unificar». Cuándo: fecha y hora. Justificación: «la mayoría ya estaba así». Sin la cuarta columna, nadie sabe por qué decidiste eso.
  - |-
    \textbf{Escribir para alguien que no estuvo.} Tu bitácora la va a leer alguien que no vio tu pantalla. Cada línea debe bastar para repetir el paso. Prueba: dásela a tu pareja y pídele que repita una corrección solo leyendo.
  - |-
    \textbf{La prueba de la fórmula.} Una tabla limpia acepta \texttt{=PROMEDIO()} sin error y devuelve un valor razonable. Si el promedio sale más bajo de lo esperado, hay ceros donde debía haber vacíos. Si sale error, hay texto donde debía haber número.
  - |-
    \textbf{Cuenta lo que quitaste.} Registros iniciales menos registros finales es lo que eliminaste. Ese número va en la bitácora: si quitaste cinco filas y no sabes por qué, la tabla no está limpia; está recortada.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tabla original guardada aparte, sin tocar. \\[1mm] \checkbox Espacios, mayúsculas, duplicados, fechas y vacíos corregidos en ese orden. \\[1mm] \checkbox Formato de tabla aplicado (Insertar, Tabla). \\[1mm] \checkbox Bitácora con al menos cinco correcciones y sus cuatro columnas. \\[1mm] \checkbox Captura de antes y de después por cada corrección. \\[1mm] \checkbox \texttt{=PROMEDIO()} funciona sobre una columna numérica. \\[1mm] \checkbox Registros iniciales y finales anotados.
  plantilla_guion: |-
    \textbf{Error.} \textit{Qué había mal, en una línea.} \\[1mm] \textbf{Herramienta.} \textit{Función, menú o atajo que usaste.} \\[1mm] \textbf{Cuándo.} \textit{Fecha y hora.} \\[1mm] \textbf{Justificación.} \textit{Por qué esa corrección y no otra.} \\[1mm] \textbf{Resultado.} \textit{Captura del después.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EXPLICA).} \textbf{Título:} «Actividad 3 --- Mi bitácora de limpieza». \textbf{Formato:} tabla de 4 columnas (error / herramienta / cuándo / justificación) con al menos 5 filas, más la línea «registros iniciales y finales». \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} tu pareja repite una corrección leyendo solo tu bitácora, y \texttt{=PROMEDIO()} devuelve un valor sin error.
  producto_titulo: Tabla limpia con formato de tabla + bitácora de cinco correcciones + capturas
  criterios:
  - La tabla tiene al menos 20 registros y 5 campos, con formato de tabla
  - Los cinco tipos de error se corrigieron en el orden indicado
  - La bitácora tiene al menos cinco correcciones con sus cuatro columnas
  - Hay captura de antes y de después por cada corrección
  - Una fórmula de promedio funciona sobre la tabla sin error
  - La bitácora dice cuántos registros había y cuántos quedaron
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.2.5.4
    idea: |-
      Es ingenuo creer que la información se entiende sola, como si no hubiera conflictos detrás de cada dato.
    aplicacion: |-
      Una tabla «limpia» esconde decisiones: qué fila quitaste, qué vacío llenaste, a quién dejaste fuera. La bitácora es la forma de no esconderlas. Sin ella, tu tabla parece neutral y no lo es.
    pregunta_espejo: |-
      ¿Qué decisión de mi limpieza cambiaría el resultado si otra persona la hubiera tomado distinto?
  estoico:
    autor: Marco Aurelio · Meditaciones VIII, 16 (c. 175 d.C.)
    idea: |-
      Cambiar de parecer y seguir el aviso de quien te corrige es tan libre como mantenerte en lo tuyo.
    aplicacion: |-
      Cuando tu pareja lee tu bitácora y dice «este paso no se entiende», tienes dos opciones: defenderte o corregir. La segunda es la que hace mejor la tabla. Y la bitácora existe precisamente para que alguien pueda corregirte.
    pregunta_espejo: |-
      ¿Escribí la bitácora para que me corrijan, o para que parezca que no me equivoqué?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      La mitad de los datos que guardamos es basura; el problema es que no sabemos cuál mitad.
    aplicacion: |-
      Limpiar una tabla es decidir cuál mitad sirve. Cada fila repetida, cada vacío, cada «MARIA» con mayúsculas es una decisión sobre qué cuenta y qué no. Por eso se anota.
    pregunta_espejo: |-
      De todo lo que quité o cambié, ¿qué parte podría haber sido un dato real que perdí?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu tabla limpia y la bitácora completa. En la sesión 4 vas a calcular SUMA, PROMEDIO, MAX y MIN sobre esa tabla y a tomar una decisión con cada cifra. Si hoy quedó sucia, mañana esas cifras engañan.
web:
  resumen: |-
    Una tabla sirve cuando está limpia y cuando alguien puede volver a mirar lo que corregiste. Hoy aprendes los cinco errores comunes, los arreglas en orden y escribes una bitácora, como los congresos indígenas del Cauca rinden cuentas de sus mandatos.
  subtema: Análisis de datos con phronesis
  pre_lectura:
    por_que_importa: |-
      Casi todos los cálculos que salen mal empiezan en una tabla sucia. Y casi nadie puede decir después qué corrigió. La bitácora es lo que convierte tu limpieza en un trabajo que otros pueden revisar.
    pregunta_detonante: |-
      Cuando limpies una tabla, ¿vas a poder decir qué corregiste, cuándo y por qué?
    activacion:
      titulo: Las tres Marías
      descripcion: |-
        En 3 minutos, escribe en tres celdas «María», «MARIA» y « María » con un espacio adelante. Cuenta cuántas veces aparece «María» con un filtro. ¿Qué pasó?
      duracion_min: 5
    conexion:
      anterior: En la sesión 2 le pusiste tipo a cada columna con Formato de celdas.
      siguiente: En la sesión 4 calculas SUMA, PROMEDIO, MAX y MIN sobre esta tabla limpia.

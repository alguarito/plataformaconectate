clave: 1-4
grado: 8
periodo: 1
sesion: 4
completo: true
duracion_min: 90
titulo: SUMA, PROMEDIO, MAX y MIN --- cuatro cifras para decidir, nunca una sola
titulo_portada: |-
  Cuatro cifras
  para decidir
producto_final: |-
  Una hoja de Excel con las cuatro funciones (SUMA, PROMEDIO, MAX, MIN) aplicadas a una columna real de tu tabla limpia. Al lado de cada cifra, una decisión escrita en dos líneas. Y un párrafo de cinco líneas sobre cuál cifra sirvió más para decidir.
apertura:
  origen: Barrios ribereños de Cartago · el nivel del río en Puerto Alejandría
  fuente: |-
    CiudadRegión. (2022, 7 de marzo). \emph{Alarma por alto nivel del río La Vieja a su paso por Cartago}. CiudadRegión Noticias.
  saber_ancestral: |-
    El río La Vieja bordea a Cartago y le pone frontera con Risaralda. Cuando crece, no se lleva la ciudad entera. Se lleva siempre los mismos barrios: Brisas del Río, La Platanera, La Arenera, La Playa, Tierra del Olvido. En marzo de 2022 quedaron bajo el agua cuando el río llegó a 12,3 metros (CiudadRegión, 2022). La gente de la orilla no adivina la creciente: la mira. Puerto Alejandría es el punto al que se va a ver el nivel. Allí se compara cómo está el río hoy contra cómo estaba ayer, y contra la marca de la última vez que se salió. Esa marca es un \textbf{máximo}: el nivel más alto que se recuerda. Y hay también un \textbf{mínimo}: el nivel de verano, cuando se ve la arena. Ninguno de los dos se decide con el promedio. La \textbf{cara de exclusión} es dura: la creciente golpea por clase y por ubicación, no por azar, y quien vive lejos del río no ve la marca. Hoy vas a calcular cuatro cifras sobre tu tabla. Y vas a aprender que el promedio, solo, engaña como engañaría mirar el río «en promedio» cuando ya está a 12 metros.
  saber_contemporaneo: |-
    Excel tiene cuatro funciones que resumen una columna entera en una sola cifra. \texttt{=SUMA(rango)} responde «¿cuánto en total?». \texttt{=PROMEDIO(rango)} responde «¿cuánto es lo típico?». \texttt{=MAX(rango)} responde «¿cuál fue el caso más alto?». \texttt{=MIN(rango)} responde «¿cuál fue el más bajo?». Se llaman \textbf{medidas resumen}: en vez de mirar 200 filas, miras una cifra que las representa. El error más común es mirar solo el promedio. Un promedio de notas de 3,5 puede venir de un grupo parejo o de un grupo donde alguien sacó 5,0 y alguien sacó 1,0. La cifra es la misma; la situación es distinta. Por eso el oficio pide \textbf{las cuatro juntas}: cada una responde una pregunta que las otras tres no responden.
  pregunta_puente: |-
    En Puerto Alejandría nadie mira el nivel promedio del río: mira el máximo de la última creciente y el nivel de hoy. Cuando calcules el promedio de las notas del salón, ¿qué te va a esconder ese número? ¿Y qué te dirían el máximo y el mínimo que el promedio no dice?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué pregunta responde cada una de las cuatro funciones; (2) \textbf{aplicar} las cuatro en Excel con la sintaxis correcta sobre tu tabla limpia; (3) \textbf{analizar} qué dice cada cifra y qué esconde; (4) \textbf{evaluar} cuál de las cuatro sirvió más para tomar una decisión concreta.
puentes:
  a_ruta: |-
    En la sesión 3 dejaste una tabla limpia con bitácora. Hoy la haces hablar con cuatro cifras. En la sesión 5 vas a copiar fórmulas sin romperlas, y para eso necesitas haber escrito hoy tus primeras funciones.
  a_escuta: |-
    Antes de que Excel calcule por ti, vas a calcular tú, a mano, con diez valores reales. Así sabes qué hace cada función antes de que la máquina lo haga en un segundo.
  a_sistematizacion: |-
    Ya sentiste las cuatro cuentas en la calculadora. Ahora las escribes en Excel sobre tu tabla limpia, con tu pareja, y aprendes la trampa del promedio solo.
  a_praxis: |-
    Ya tienes las cuatro cifras. Toca decidir: al lado de cada una escribes qué dice, qué sugiere y qué harías tú. Lo escribes tú, con tus datos.
  a_producto: |-
    Lo que entregas hoy: las cuatro funciones sobre una columna real, cuatro decisiones escritas y un párrafo sobre cuál cifra sirvió más. La prueba de calidad: ninguna cifra queda sola, sin decisión al lado.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Una cifra sin decisión es un número huérfano. Una decisión sin cifra es una corazonada.
  a_triangulo: |-
    Para terminar, tres ideas sobre mirar el conjunto, contadas con palabras de esta guía: Dussel sobre el que queda fuera del promedio, Marco Aurelio sobre mirar el conjunto y no solo un punto, Floridi sobre los patrones pequeños que solo valen si se comparan.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Las cuatro cuentas a mano} (15 min · individual). (1) Toma diez valores reales de tu tabla limpia: diez notas, diez gastos, diez temperaturas o los minutos que dormiste en diez días. (2) Con calculadora, sin Excel, calcula la suma de los diez. (3) Divide esa suma entre diez: ese es el promedio. (4) Busca el valor más alto y el más bajo: son el máximo y el mínimo. (5) Escribe una línea: ¿cuál de las cuatro cifras te dice más sobre tu situación?
  checks:
  - Tengo los diez valores y las cuatro cifras calculadas a mano.
  - La suma es mayor que el máximo y el promedio está entre el mínimo y el máximo.
  - Escribí cuál de las cuatro cifras me dice más y por qué.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Las cuatro cuentas a mano». \textbf{Formato:} ficha con los diez valores, las cuatro cifras y una línea sobre cuál dice más. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cuatro cifras están, la suma es mayor que el máximo, y puedes decir qué hace cada función sin mirar la guía.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- Las cuatro funciones en Excel} (25 min · parejas). Ya sabes qué hacen. Ahora que las haga Excel. (1) Con tu pareja, abran la tabla limpia de la sesión 3. (2) Elijan una columna numérica: notas, gastos, ventas, temperaturas. (3) En cuatro celdas debajo de la columna escriban \texttt{=SUMA(}, \texttt{=PROMEDIO(}, \texttt{=MAX(} y \texttt{=MIN(}, seleccionen el rango y cierren el paréntesis. (4) En la celda de la izquierda de cada una escriban qué es: «Total», «Promedio», «Máximo», «Mínimo». (5) Comprueben que la suma es mayor que el máximo y que el promedio está entre el mínimo y el máximo.
  pilares:
  - |-
    \textbf{Las cuatro funciones.} \texttt{=SUMA(B2:B21)} suma los números del rango: ¿cuánto en total? \texttt{=PROMEDIO(B2:B21)} suma y divide entre la cantidad de valores: ¿cuánto es lo típico? \texttt{=MAX(B2:B21)} devuelve el más alto: ¿cuál fue el mejor caso? \texttt{=MIN(B2:B21)} devuelve el más bajo: ¿cuál fue el peor?
  - |-
    \textbf{La trampa del promedio solo.} Dos salones con promedio 3,5. En uno todos sacaron entre 3,0 y 4,0. En el otro hay un 5,0 y un 1,0. El promedio no distingue. El máximo y el mínimo sí. Por eso nunca se mira una cifra sola.
  - |-
    \textbf{Lo que el rango esconde.} Si el rango incluye el encabezado, la función lo ignora, pero si incluye una celda con texto, también la ignora sin avisar. Y el promedio no cuenta las celdas vacías, pero sí cuenta los ceros. Lo que limpiaste en la sesión 3 decide lo que sale hoy.
  - |-
    \textbf{La pregunta decide la función.} «¿Cuánto recaudó la tienda esta semana?» es SUMA. «¿Qué tan típica fue la semana?» es PROMEDIO. «¿Cuál fue el día más fuerte?» es MAX. «¿Cuál fue el más flojo?» es MIN. Primero la pregunta; después la función.
  anatomia:
    titulo: Las cuatro funciones, en una mirada
    body: |-
      \textbf{SUMA:} cuánto en total. \\[1mm] \textbf{PROMEDIO:} cuánto es lo típico. \\[1mm] \textbf{MAX:} el caso más alto. \\[1mm] \textbf{MIN:} el caso más bajo. \\[1mm] \textbf{Regla:} las cuatro juntas, nunca una sola.
  errores_comunes: |-
    (1) \textbf{Mirar solo el promedio}: esconde los extremos. (2) \textbf{Rango mal seleccionado}: dejar fuera la última fila o meter una celda de otra columna. (3) \textbf{Texto dentro del rango}: la función lo salta sin avisar y la suma sale menor. (4) \textbf{Confundir promedio con lo que le pasa a la mayoría}: un solo valor extremo mueve el promedio. (5) \textbf{Cifra sin etiqueta}: un 35,5 suelto en una celda no significa nada.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- Las cuatro funciones en Excel». \textbf{Formato:} tabla de 4 filas y 3 columnas (función / fórmula escrita / resultado). \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cuatro fórmulas están escritas con su rango, cada resultado tiene etiqueta en Excel, y la comprobación de coherencia da bien.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Una decisión por cada cifra} (30 min · individual). Cuatro números no son una decisión. (1) Vuelve a tu hoja y mira las cuatro cifras. (2) Al lado de cada una escribe dos líneas: qué dice el dato y qué harías tú con eso. (3) Compara el máximo y el mínimo con el promedio: ¿el grupo es parejo o disparejo? Escríbelo. (4) Cierra con un párrafo de cinco líneas: cuál de las cuatro cifras sirvió más para decidir, y por qué. (5) Guarda la hoja como G8-P1-S4-funciones.xlsx.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) Las cuatro funciones con etiqueta en la hoja. (2) Cuatro decisiones de dos líneas, una por cifra. (3) El párrafo de cinco líneas sobre cuál cifra sirvió más.
  - |-
    \textbf{Del dato a la acción.} «La SUMA de gastos fue 50.000 pesos esta semana. Eso dice que gasté más de lo que tenía. Yo cambiaría dos días de tienda por almuerzo de casa.» Tres frases: dato, lectura, acción. Sin la tercera, el número queda huérfano.
  - |-
    \textbf{Parejo o disparejo.} Si el máximo y el mínimo están cerca del promedio, el grupo es parejo y el promedio lo representa bien. Si están lejos, el promedio esconde a alguien. Y ese alguien es quien más necesita que lo miren.
  - |-
    \textbf{Antes de entregar, léelo en voz alta.} Si una decisión suena a «hay que mejorar», no es una decisión: es un deseo. Una decisión dice quién hace qué, cuándo. Reescríbela hasta que diga eso.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Las cuatro funciones escritas con el rango correcto. \\[1mm] \checkbox Cada resultado con etiqueta a la izquierda. \\[1mm] \checkbox La suma es mayor que el máximo; el promedio está entre el mínimo y el máximo. \\[1mm] \checkbox Cuatro decisiones de dos líneas, con dato, lectura y acción. \\[1mm] \checkbox Párrafo de cinco líneas sobre la cifra que sirvió más. \\[1mm] \checkbox Hoja guardada como G8-P1-S4-funciones.xlsx.
  plantilla_guion: |-
    \textbf{SUMA.} \textit{Resultado, qué dice, qué haría.} \\[1mm] \textbf{PROMEDIO.} \textit{Resultado, qué dice, qué haría.} \\[1mm] \textbf{MAX.} \textit{Resultado, qué dice, qué haría.} \\[1mm] \textbf{MIN.} \textit{Resultado, qué dice, qué haría.} \\[1mm] \textbf{Cierre.} \textit{La cifra que sirvió más fue… porque…}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Una decisión por cada cifra». \textbf{Formato:} tabla de 4 filas y 3 columnas (cifra / qué dice / qué haría), más el párrafo de cierre. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} cada cifra tiene su acción, dijiste si el grupo es parejo o disparejo, y el párrafo nombra la cifra que sirvió más.
  producto_titulo: Cuatro funciones con etiqueta + cuatro decisiones + párrafo sobre la cifra que sirvió más
  criterios:
  - Las cuatro funciones están escritas con el rango correcto y con etiqueta
  - La suma es mayor que el máximo y el promedio está entre el mínimo y el máximo
  - Cada cifra tiene una decisión de dos líneas con dato, lectura y acción
  - Dijiste si el grupo es parejo o disparejo comparando máximo, mínimo y promedio
  - El párrafo de cierre nombra la cifra que sirvió más y por qué
  - La hoja está guardada con nombre claro
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.4.2
    idea: |-
      El que queda fuera del sistema tiene un rostro que reclama. Mirarlo es el comienzo de cualquier justicia.
    aplicacion: |-
      El promedio del salón no tiene rostro. El mínimo sí: es alguien concreto que sacó la nota más baja. Un análisis que solo mira el promedio deja a esa persona fuera del sistema, aunque esté en la tabla.
    pregunta_espejo: |-
      ¿Quién es el mínimo de mi tabla, y qué decisión lo tiene en cuenta?
  estoico:
    autor: Marco Aurelio · Meditaciones VII, 47 (c. 175 d.C.)
    idea: |-
      Mira el curso completo de las cosas, como quien gira con los astros, y no te quedes en un solo punto.
    aplicacion: |-
      Una cifra sola es un punto. Las cuatro juntas son el curso completo: cuánto hay, cuánto es lo típico, hasta dónde sube y hasta dónde baja. Decidir con una sola es decidir a ciegas.
    pregunta_espejo: |-
      ¿Estoy mirando las cuatro cifras, o me quedé con la que me convenía?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      Un patrón pequeño solo significa algo si se agregó bien, se comparó con otro y llegó a tiempo.
    aplicacion: |-
      Tu promedio es un patrón pequeño. Solo vale si el rango estaba limpio (agregado bien), si lo comparaste con el máximo y el mínimo, y si decides con él esta semana y no dentro de un año.
    pregunta_espejo: |-
      ¿Con qué comparé mi cifra antes de decidir?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu hoja de las cuatro funciones y las cuatro decisiones. En la sesión 5 vas a copiar fórmulas a muchas celdas sin que se rompan, con referencias relativas y absolutas. Las funciones de hoy son las que vas a copiar.
web:

    Cuatro funciones de Excel resumen una columna en cuatro cifras, y el promedio solo engaña. Hoy las calculas a mano, las escribes en Excel y tomas una decisión con cada una, como quien mira el nivel del río en Puerto Alejandría.
  subtema: Análisis de datos con phronesis
  pre_lectura:

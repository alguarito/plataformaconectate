clave: 1-4
grado: 8
periodo: 1
sesion: 4
completo: true
titulo: SUMA, PROMEDIO, MAX, MIN --- 4 funciones que dirigen decisiones
titulo_portada: |-
  SUMA, PROMEDIO, MAX, MIN ---
  4 funciones que
  dirigen decisiones
producto_final: |-
  Hoja Excel con un conjunto real (notas del grupo, gastos semanales, ventas de la tienda escolar, temperaturas de la semana) que aplique las 4 funciones (SUMA, PROMEDIO, MAX, MIN) sobre la tabla limpia de la sesión 3 + 1 decisión razonada por cada función con justificación de 1-2 líneas (qué dice el dato y qué acción concreta sugiere) + reflexión final de 5 líneas sobre cuál función fue la más útil para tomar decisiones reales
apertura:
  saber_ancestral: |-
    En las tiendas de barrio del centro de Cartago había un ritual silencioso antes de cerrar la persiana: \textbf{la cuenta de la caja}. El tendero, con bata azul y cuaderno cuadriculado, hacía 4 operaciones en orden fijo: (1) \textbf{sumaba} todo lo vendido en el día (la SUMA del oficio). (2) \textbf{Promediaba} las ventas de la semana (la PROMEDIO) para saber si el día fue mejor, igual o peor que lo normal. (3) Miraba cuál fue el día con \textbf{más venta} (la MAX): \emph{``el viernes vendí mucho café porque hubo partido''}. (4) Miraba el día con \textbf{menos venta} (la MIN): \emph{``el lunes nadie vino, llovió toda la tarde''}. Esas 4 cuentas no eran adorno: \textbf{dirigían las decisiones del lunes siguiente}. Si la suma era buena, pedía más mercancía. Si el promedio bajaba, recortaba pedido. Si el MAX se repetía los viernes, traía más café los viernes. Si el MIN coincidía con lluvia, dejaba el lunes lluvioso con poco pedido. \textbf{Las 4 funciones de Excel no son invento moderno: son ese cuaderno del tendero formalizado en celdas}.
  saber_contemporaneo: |-
    Las \textbf{funciones estadísticas básicas} en Excel son 4 fórmulas que resumen un conjunto de datos en una sola cifra cada una: (1) \texttt{=SUMA(rango)}: suma todos los números de un rango (ej. \texttt{=SUMA(B2:B11)} suma todas las ventas). (2) \texttt{=PROMEDIO(rango)}: calcula la media aritmética (suma dividida por número de valores). (3) \texttt{=MAX(rango)}: devuelve el valor más alto. (4) \texttt{=MIN(rango)}: devuelve el valor más bajo. Estas 4 funciones son las herramientas más usadas del análisis de datos cotidiano y se llaman \textbf{medidas resumen}: en lugar de mirar 200 filas, se mira 1 número que las representa. La regla profesional es famosa: \textbf{ninguna decisión basada en datos se toma sin al menos esas 4 medidas}. El novato calcula promedios y nada más; el profesional siempre mira los 4 al mismo tiempo, porque cada uno responde una pregunta distinta: SUMA responde \emph{``¿cuánto en total?''}, PROMEDIO responde \emph{``¿cuánto típico?''}, MAX responde \emph{``¿cuánto en el mejor caso?''}, MIN responde \emph{``¿cuánto en el peor caso?''}. Mirar solo uno produce decisiones ciegas a las otras 3 preguntas.
  pregunta_puente: |-
    ¿Qué sabía el tendero al hacer las 4 cuentas en orden cada noche, que el novato olvida cuando solo mira el promedio? ¿Y por qué un solo número (el promedio, por ejemplo) puede engañar si no se acompaña de SUMA, MAX y MIN?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuál de las 4 funciones responde mejor a una pregunta concreta sobre tus datos; (2) \textbf{aplicar} las 4 funciones en Excel con la sintaxis correcta sobre la tabla limpia de la sesión 3; (3) \textbf{analizar} qué dice cada función sobre el conjunto, sin confundir las preguntas que responde; (4) \textbf{evaluar} cuál de las 4 fue la más útil para tomar una decisión concreta y justificar tu elección.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 1-3 aprendiste a preguntar, clasificar y limpiar. Hoy le pones \textbf{la primera capa de cálculo} a tu tabla: 4 funciones que resumen el conjunto en cifras útiles. Las próximas sesiones (referencias, fórmulas, gráficos) construyen sobre estas 4 medidas básicas.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{cuenta a mano} de un conjunto pequeño (10 notas, 10 gastos, 10 temperaturas) usando solo lápiz y calculadora. Vas a sentir en el cuerpo lo que las 4 funciones automatizan: sumar uno por uno, dividir por la cantidad, buscar el mayor, buscar el menor.
  a_sistematizacion: |-
    Ya hiciste la cuenta a mano. Ahora vas a entender la \textbf{anatomía de las 4 funciones} en Excel: sintaxis exacta, cuándo usar cada una, los 5 errores más comunes (rango mal seleccionado, mezclar texto y número, confundir promedio con mediana, ignorar vacíos, no etiquetar los resultados).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: en tu tabla limpia de la sesión 3, agregas las 4 funciones, las etiquetas claramente, y al lado de cada una escribes una decisión razonada de 1-2 líneas. Cierras con una reflexión sobre cuál fue la más útil.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: hoja Excel con 4 funciones aplicadas + 4 decisiones razonadas + reflexión final. El criterio principal: que las 4 cifras te digan algo concreto que harías el lunes próximo (como hacía el tendero).
  a_evaluacion: |-
    Antes de cerrar, mira las 4 funciones desde las cinco dimensiones humanas. Usar las 4 con criterio es respeto por la complejidad del dato; quedarse solo en el promedio es atajo que produce decisiones ciegas.
  a_triangulo: |-
    Y para terminar, tres voces sobre las medidas y las decisiones. Dussel sobre los promedios que ocultan a los extremos, Marco Aurelio sobre ver las cosas como son, Floridi sobre la responsabilidad de elegir bien la medida.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Cuenta a mano antes de Excel} (15 min · individual). Toma una lista pequeña de 10 valores reales: pueden ser las notas del último parcial de 10 compañeros, los gastos de 10 días en la tienda escolar, las temperaturas de 10 días seguidos, los minutos que dormiste cada día de la última semana. Con calculadora (no Excel todavía) calcula: (a) \textbf{SUMA}: el total. (b) \textbf{PROMEDIO}: el total dividido entre 10. (c) \textbf{MAX}: el valor más alto. (d) \textbf{MIN}: el valor más bajo. Anota los 4 resultados. Después responde una pregunta: \emph{¿cuál de los 4 te dice más sobre la situación?}.
  checks:
  - Calculé las 4 cifras a mano con calculadora.
  - Anoté los 4 resultados claramente.
  - Identifiqué cuál de los 4 me dice más sobre la situación.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Las 4 cuentas a mano». \textbf{Formato:} ficha con los 10 valores + los 4 resultados (SUMA, PROMEDIO, MAX, MIN) + 1 línea sobre cuál es más útil. \textbf{Sabes que terminaste cuando} sientes en el cuerpo qué hacen las 4 funciones que Excel automatizará.
sistematizacion:
  intro: |-
    Calcular a mano te enseñó qué hacen las 4 funciones. Ahora necesitas la \textbf{anatomía profesional} en Excel: sintaxis exacta, cuándo usar cada una, errores comunes que delatan al novato.
  pilares:
  - |-
    Las 4 funciones se descomponen así: (1) \texttt{=SUMA(B2:B11)}: suma los valores numéricos del rango B2 a B11. Responde \emph{``¿cuánto en total?''}. Útil para gastos, ventas, totales acumulados. (2) \texttt{=PROMEDIO(B2:B11)}: suma el rango y divide entre la cantidad de valores. Responde \emph{``¿cuánto típico?''}. Cuidado: ignora celdas vacías; cuenta los ceros como ceros. (3) \texttt{=MAX(B2:B11)}: devuelve el valor más alto del rango. Responde \emph{``¿cuánto en el mejor caso?''}. Útil para detectar récords, picos, eventos extraordinarios. (4) \texttt{=MIN(B2:B11)}: devuelve el valor más bajo. Responde \emph{``¿cuánto en el peor caso?''}. Útil para detectar mínimos, problemas, oportunidades de mejora.
  - |-
    El patrón profesional se llama \textbf{``las 4 medidas juntas''}: nunca se mira una sola. El promedio sin SUMA no dice si es mucho o poco en total; el promedio sin MAX y MIN no dice si los datos están concentrados o dispersos. Si el promedio de las notas es 3{,}5 pero el MAX es 5{,}0 y el MIN es 1{,}0, la situación es muy distinta a si el MAX es 4{,}0 y el MIN es 3{,}0 con el mismo promedio. \textbf{Mirar el promedio solo es decisión ciega; mirar las 4 es decisión informada}.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué pregunta quiero responder?}. Cada función responde una distinta. Si la pregunta es \emph{``¿cuánto recaudó la tienda esta semana?''}, la respuesta es SUMA. Si es \emph{``¿qué tan típica fue la semana?''}, PROMEDIO. Si es \emph{``¿cuál fue el día más fuerte?''}, MAX. Si es \emph{``¿cuál fue el día más flojo?''}, MIN. Elegir la función correcta empieza por tener clara la pregunta.
  - |-
    Algoritmo: (1) abre tu tabla limpia de la sesión 3. (2) selecciona una celda vacía debajo de cada columna numérica. (3) escribe la función con sintaxis exacta (\texttt{=SUMA(rango)}, etc.). (4) etiqueta el resultado claramente en la celda de la izquierda (\emph{``Total ventas''}, \emph{``Promedio semana''}). (5) verifica que el resultado tiene sentido (si la suma da menor que el MAX, hay error). (6) repite con las 4 funciones.
  anatomia:
    titulo: Anatomía de las 4 funciones
    body: |-
      \textbf{SUMA:} total acumulado. \\[1mm] \textbf{PROMEDIO:} valor típico. \\[1mm] \textbf{MAX:} mejor caso. \\[1mm] \textbf{MIN:} peor caso. \\[1mm] \textbf{Regla de oro:} las 4 juntas, nunca una sola.
  errores_comunes: |-
    (1) \textbf{Mirar solo el promedio}: oculta los extremos y produce decisiones ciegas. (2) \textbf{Rango mal seleccionado}: incluir el encabezado en \texttt{=SUMA()} o dejar fuera la última fila. (3) \textbf{Mezclar texto y número en el rango}: la función ignora silenciosamente las celdas con texto, dando resultados engañosos. (4) \textbf{Confundir PROMEDIO con MEDIANA}: el promedio se distorsiona con un valor extremo (1 estudiante con nota de 0{,}5 baja todo el promedio del curso). (5) \textbf{No etiquetar el resultado}: \emph{``35{,}5''} en una celda suelta no significa nada; debe decir \emph{``Promedio nota grupo: 35,5''}.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía de las 4 funciones». \textbf{Formato:} (a) las 4 funciones con su sintaxis y la pregunta que responde cada una; (b) los 5 errores comunes con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías explicarle a un compañero por qué mirar solo el promedio es decisión ciega.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- 4 funciones + 4 decisiones razonadas} (30 min · individual). Hora de aplicar. Sobre tu tabla limpia de la sesión 3, agregas las 4 funciones a una columna numérica, escribes al lado de cada una una decisión concreta basada en el dato, y cierras con una reflexión sobre cuál fue la más útil.
  pilares:
  - |-
    Tu entrega se construye en 5 pasos: (1) abrir la tabla limpia. (2) elegir una columna numérica para analizar (notas, ventas, gastos, temperaturas). (3) aplicar las 4 funciones en celdas debajo de la columna con etiqueta clara. (4) al lado de cada función, escribir una decisión razonada de 1-2 líneas: \emph{``El total es X, lo que me dice Y, entonces yo haría Z''}. (5) cerrar con una reflexión de 5 líneas: \emph{``De las 4 funciones, la más útil para esta situación fue X porque...''}.
  - |-
    Sigue el patrón \textbf{``dato → decisión''}: cada cifra debe conectarse con una acción concreta. Si tu SUMA dice \emph{``\$50.000 gastados en empanadas esta semana''}, la decisión podría ser \emph{``reduzco a \$30.000 la próxima cambiando 2 días por almuerzo de casa''}. La phronesis del oficio consiste en \textbf{no dejar números huérfanos}: cada uno con su decisión asociada.
  - |-
    Las 4 decisiones tienen estructura simple: (a) \textbf{Lo que dice el dato} en 1 línea. (b) \textbf{Lo que sugiere} en 1 línea. (c) \textbf{La acción concreta} que yo tomaría. Por ejemplo: \emph{``MAX = 5{,}0: hubo al menos 1 estudiante que dominó el tema. Sugiere que es posible obtener nota alta. Acción: pedir al estudiante con MAX que comparta su método de estudio en la próxima clase''}.
  - |-
    Algoritmo: (1) aplicar las 4 funciones con sintaxis correcta; (2) verificar coherencia (SUMA ≥ MAX, PROMEDIO entre MIN y MAX); (3) escribir las 4 decisiones; (4) reflexionar sobre cuál fue más útil; (5) guardar con nombre claro (G8-P1-S4-funciones.xlsx).
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 4 funciones aplicadas con sintaxis correcta. \\[1mm] \checkbox Cada función etiquetada claramente (no solo el número). \\[1mm] \checkbox Verificación de coherencia (SUMA ≥ MAX, PROMEDIO entre MIN y MAX). \\[1mm] \checkbox 4 decisiones razonadas (1-2 líneas cada una). \\[1mm] \checkbox Reflexión final de 5 líneas sobre la más útil. \\[1mm] \checkbox Hoja guardada con nombre claro.
  plantilla_guion: |-
    \textbf{SUMA.} \textit{Resultado + qué dice + acción.} \\[1mm] \textbf{PROMEDIO.} \textit{Resultado + qué dice + acción.} \\[1mm] \textbf{MAX.} \textit{Resultado + qué dice + acción.} \\[1mm] \textbf{MIN.} \textit{Resultado + qué dice + acción.} \\[1mm] \textbf{Reflexión.} \textit{De las 4, la más útil fue X porque...}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- 4 funciones + 4 decisiones». \textbf{Formato:} (a) referencia al archivo Excel; (b) tabla 4 filas × 4 columnas (Función~|~Resultado~|~Qué dice~|~Acción); (c) reflexión final de 5 líneas. \textbf{Sabes que terminaste cuando} cada función está conectada con una decisión concreta.
  producto_titulo: Hoja con 4 funciones + 4 decisiones razonadas + reflexión final
  criterios:
  - 4 funciones aplicadas con sintaxis correcta
  - Etiquetado claro de cada resultado
  - 4 decisiones razonadas (dato → acción)
  - Reflexión final sobre la más útil
  - Coherencia verificada entre las 4 cifras
  - Hoja guardada con nombre claro
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El promedio que oculta a los extremos repite la lógica que invisibiliza a quien queda fuera.
    aplicacion: |-
      Cuando solo miras el promedio, los extremos desaparecen. Si el promedio de notas de tu grupo es 3{,}5, no ves al estudiante que sacó 1{,}0 ni al que sacó 5{,}0: ambos quedan ocultos en la cifra media. La filosofía de la liberación pide mirar también a los extremos. El MIN del grupo es probablemente alguien que necesita acompañamiento; el MAX es probablemente alguien que podría enseñar a otros. La phronesis del dato consiste en \textbf{no permitir que el promedio borre a las personas que están en los extremos}.
    pregunta_espejo: |-
      ¿Mi análisis solo mira el promedio, o también ve a quien está en el extremo MIN o MAX?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Ver las 4 cifras juntas es ver lo que es; mirar solo una es elegir la ilusión cómoda.
    aplicacion: |-
      Es tentador quedarse en el promedio: es la cifra más fácil de comunicar y la más cómoda de aceptar. La disciplina estoica recomienda lo opuesto: \emph{mira las 4 juntas, aunque la combinación incomode}. Si el promedio es bueno pero el MIN es alarmante, el dato te exige actuar sobre el MIN. Si el promedio es regular pero el MAX muestra que sí es posible mejor, el dato te exige aprender del MAX. La sabiduría consiste en aceptar las 4 cifras como un solo retrato.
    pregunta_espejo: |-
      ¿Estoy mirando las 4 cifras juntas con honestidad, o me quedo en el promedio porque me incomoda lo que dicen MIN y MAX?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Elegir bien la medida es responsabilidad ética del oficio digital.
    aplicacion: |-
      En la era de la información, las medidas que elegimos determinan las decisiones que tomamos. Quien elige solo el promedio toma decisiones ciegas; quien elige las 4 toma decisiones informadas. La diferencia profesional está en esa elección. Tu hoja de hoy te entrena en una práctica que rige toda profesión que trabaje con datos: \textbf{elegir las medidas correctas para la pregunta correcta}.
    pregunta_espejo: |-
      ¿Estoy eligiendo las medidas porque responden a la pregunta correcta, o porque son las más fáciles de calcular?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu hoja de las 4 funciones y las 4 decisiones razonadas. En la sesión 5 vas a aprender \textbf{referencias relativas y absolutas}, que permiten copiar fórmulas sin romperlas. Es la base para hacer tablas grandes sin escribir 100 fórmulas a mano.
web:
  conceptos_clave:
    - termino: Función SUMA
      definicion: |-
        Devuelve la suma total de un rango de celdas numéricas. Responde "¿cuánto en total?".
      ejemplo: |-
        =SUMA(B2:B11) suma las ventas de los 10 días registrados en B2 a B11. Útil para totales de caja, gastos del mes.
      emoji: "➕"
    - termino: Función PROMEDIO
      definicion: |-
        Devuelve la media aritmética: la suma dividida por la cantidad de valores. Responde "¿cuánto típico?".
      ejemplo: |-
        =PROMEDIO(B2:B11) da el valor típico de ventas diarias. Ojo: ignora celdas vacías pero cuenta los ceros.
      emoji: "⚖️"
    - termino: Función MAX
      definicion: |-
        Devuelve el valor más alto del rango. Responde "¿cuánto en el mejor caso?".
      ejemplo: |-
        =MAX(B2:B11) muestra el día con más ventas. Útil para detectar récords y eventos extraordinarios.
      emoji: "⬆️"
    - termino: Función MIN
      definicion: |-
        Devuelve el valor más bajo del rango. Responde "¿cuánto en el peor caso?".
      ejemplo: |-
        =MIN(B2:B11) muestra el día más flojo. Útil para detectar problemas y oportunidades de mejora.
      emoji: "⬇️"
    - termino: Las 4 medidas juntas
      definicion: |-
        Regla profesional: nunca mirar solo el promedio. Mirar SUMA, PROMEDIO, MAX, MIN al mismo tiempo da retrato completo.
      ejemplo: |-
        Promedio 3,5 con MAX 5,0 y MIN 1,0 es muy distinto que promedio 3,5 con MAX 4,0 y MIN 3,0. El primero tiene casos extremos; el segundo está concentrado.
      emoji: "🎯"
  quiz:
    titulo: ¿Sabes leer las 4 funciones juntas?
    instrucciones: 5 preguntas para verificar que distingues qué pregunta responde cada función y por qué hay que mirarlas todas.
    preguntas:
      - enunciado: "Tu profe pregunta: ¿cuánto recaudó la tienda escolar esta semana? ¿Qué función usas?"
        opciones:
          - PROMEDIO
          - SUMA
          - MAX
          - MIN
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. SUMA responde "¿cuánto en total?". El total recaudado de la semana es la suma de los 7 días.
        feedback_incorrecto: |-
          La pregunta sobre total recaudado se responde con SUMA. PROMEDIO daría el típico, MAX el día más fuerte, MIN el más flojo.
      - enunciado: "Promedio del grupo: 3,5. ¿Qué información NO te dice este número solo?"
        opciones:
          - Si hubo casos extremos (1,0 o 5,0)
          - Si la mayoría está cerca del 3,5 o disperso
          - Las dos anteriores
          - Ninguna, el promedio basta
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. El promedio solo oculta los extremos y la dispersión. Por eso hay que mirar MAX, MIN y la SUMA junto al promedio.
        feedback_incorrecto: |-
          El promedio solo oculta tanto los extremos (MAX, MIN) como la dispersión. Por eso se miran las 4 funciones juntas, no solo una.
      - enunciado: "¿Cuál es la diferencia entre PROMEDIO ignorar celdas vacías y contarlas como cero?"
        opciones:
          - Ignorar vacías sube el promedio, contarlas como cero lo baja
          - No hay diferencia, dan el mismo resultado
          - Ignorar vacías baja el promedio
          - Solo afecta cuando hay muchos datos
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Si una celda vacía se cuenta como cero, agrega un cero al promedio (lo baja). Si se ignora, no afecta el promedio.
        feedback_incorrecto: |-
          Ignorar vacías deja el promedio igual; contarlas como cero lo baja porque agrega un cero al cálculo.
      - enunciado: "MAX de las notas es 5,0 y MIN es 1,0. ¿Qué acción profesional sugiere esta información?"
        opciones:
          - Reportar solo el promedio para no preocupar
          - Ignorar los extremos y enfocarse en el medio
          - Premiar al MAX y castigar al MIN
          - Identificar quién sacó MAX para que comparta método, y quién sacó MIN para acompañarlo
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. La phronesis del dato consiste en no dejar a las personas extremas invisibles. Aprender del MAX, acompañar al MIN.
        feedback_incorrecto: |-
          Los extremos no se ignoran ni se usan para premiar/castigar: el MAX enseña qué es posible, el MIN señala dónde acompañar.
      - enunciado: "¿Cuál de estas frases describe el patrón profesional 'las 4 medidas juntas'?"
        opciones:
          - Mirar SUMA, PROMEDIO, MAX y MIN al mismo tiempo para decisión informada
          - Calcular las 4 pero reportar solo la mejor
          - Usar siempre solo SUMA porque es la más simple
          - Calcular cada una en hoja distinta
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Las 4 al mismo tiempo dan retrato completo. Solo una produce decisiones ciegas.
        feedback_incorrecto: |-
          La regla profesional es mirar las 4 al mismo tiempo. Cada una responde una pregunta distinta y necesaria.

clave: 1-5
grado: 8
periodo: 1
sesion: 5
completo: true
titulo: Referencias relativas y absolutas en Excel
titulo_portada: |-
  Referencias
  relativas y absolutas
  en Excel
producto_final: |-
  Hoja Excel con dos ejercicios resueltos (a) cálculo de IVA (19~\%) y descuento (10~\%) sobre 10 productos usando referencias absolutas para los porcentajes y referencias relativas para los precios, (b) tabla de multiplicar (de 1 a 10 por 1 a 10) construida con UNA sola fórmula que se arrastre desde la celda B2 hasta la K11 usando referencias absolutas y relativas mezcladas + capturas que demuestren que las fórmulas funcionan al arrastrar
apertura:
  saber_ancestral: |-
    En los talleres alfareros de Pijao y Filandia (Quindío), donde la cerámica es oficio de pueblo desde los abuelos, el maestro alfarero usa un gesto que parece de magia para quien no lo conoce: \textbf{fija el patrón antes de copiar}. Cuando va a producir 50 platos iguales para una boda o una venta, no hace cada plato desde cero. Hace UNO primero, el \textbf{patrón}: la forma exacta, el grosor justo, los bordes precisos. Ese patrón lo deja firme sobre la mesa, sin moverlo, casi sagrado. Después, los aprendices se van turnando para copiar el patrón: cada uno toma arcilla nueva, mira el patrón, y reproduce las medidas. \textbf{El patrón no se mueve} (es la \emph{referencia absoluta} del oficio); \textbf{las copias se ajustan al patrón} (son las \emph{referencias relativas}). Si el patrón se moviera con cada copia, las 50 piezas saldrían cada una distinta, y la venta se perdería. Si las copias no se ajustaran al patrón, también: no habría reproducción posible. La sabiduría del alfarero se traduce a Excel sin perder ni un gramo: \textbf{lo que debe quedarse fijo se fija; lo que debe moverse se mueve}.
  origen: Recetas y fórmulas heredadas de oficios colombianos (cocina, herrería, sastrería)
  saber_contemporaneo: |-
    En Excel, las \textbf{referencias} son las direcciones de las celdas que aparecen en una fórmula. Hay dos tipos: (1) \textbf{Referencia relativa}: \texttt{B2}. Cuando arrastras la fórmula a otra celda, la referencia se mueve. Si la fórmula \texttt{=B2*2} la copias una fila abajo, se convierte en \texttt{=B3*2}. (2) \textbf{Referencia absoluta}: \texttt{\$B\$2}. Cuando arrastras la fórmula, la referencia queda fija: \texttt{=\$B\$2*2} sigue siendo \texttt{=\$B\$2*2} en cualquier celda donde la copies. El símbolo \$ es el \textbf{ancla} que fija. Hay también \textbf{referencias mixtas}: \texttt{\$B2} fija la columna pero deja la fila libre; \texttt{B\$2} fija la fila pero deja la columna libre. La regla profesional: \textbf{fija lo que no debe cambiar al copiar, deja libre lo que sí debe cambiar}. Esta distinción es la diferencia entre escribir 100 fórmulas a mano (lento, propenso a errores) y escribir 1 sola fórmula que se arrastra correctamente a 100 celdas (rápido, sin errores).
  pregunta_puente: |-
    ¿Qué sabía el alfarero del Quindío al fijar el patrón antes de copiar, que el estudiante novato olvida cuando arrastra una fórmula y se le rompe a la mitad? ¿Y por qué un \$ en la dirección de la celda cambia todo el comportamiento al arrastrar?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuándo usar referencia relativa, absoluta o mixta según el caso de la fórmula; (2) \textbf{explicar} con tus palabras qué hace el símbolo \$ en una referencia y por qué Excel lo necesita; (3) \textbf{aplicar} las 3 tipos de referencias en dos ejercicios reales (IVA/descuento, tabla de multiplicar); (4) \textbf{evaluar} una fórmula ajena detectando si sus referencias están bien fijadas o si se romperán al arrastrarse.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 4 aprendiste las 4 funciones básicas (SUMA, PROMEDIO, MAX, MIN). Hoy aprendes a hacer fórmulas más complejas que se \emph{arrastran} sin romperse. Las próximas sesiones (fórmulas con PEMDAS, gráficos, mini-estudio) construyen sobre esta habilidad: sin entender absolutas y relativas, las fórmulas grandes son trabajo manual interminable.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{experimento} en Excel: escribes una fórmula simple en la celda B2, la copias a B3 y B4, y observas qué pasa. Después escribes la misma fórmula con \$ y la copias también. La diferencia visual te enseña antes que la teoría.
  a_sistematizacion: |-
    Ya hiciste el experimento. Ahora vas a entender la \textbf{anatomía de las 3 referencias}: relativa, absoluta, mixta. Cuándo usar cada una, los 4 errores típicos (olvidar \$, fijar lo que no debía, no fijar lo que debía, mezclar mal en referencia mixta), y el atajo F4 que ahorra tiempo.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: 2 ejercicios reales. El primero, cálculo de IVA y descuento sobre 10 productos: el \% va fijo (absoluta), los precios cambian (relativa). El segundo, tabla de multiplicar: UNA sola fórmula que se arrastra a las 100 celdas con referencias mixtas.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 2 hojas resueltas + captura del antes/después de arrastrar + explicación de qué referencia usaste y por qué. El criterio principal: que las fórmulas funcionen al arrastrarse sin que tengas que escribir más de 1 fórmula por columna.
  a_evaluacion: |-
    Antes de cerrar, mira las referencias desde las cinco dimensiones humanas. Fijar bien lo que no se mueve es respeto por el oficio del alfarero; no fijar es repetir 100 veces lo que se podía hacer 1 vez.
  a_triangulo: |-
    Y para terminar, tres voces sobre el patrón y la copia. Dussel sobre los modelos que reproducen el oficio sin perder la dignidad de la copia, Epicteto sobre la disciplina del detalle (un \$ cambia todo), Floridi sobre la información replicable como ética del oficio digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El experimento del \$ (15 min · individual)}. Abre Excel y haz este experimento simple en 4 pasos: (1) escribe \texttt{10} en la celda B2 y \texttt{20} en la celda C2. (2) en la celda D2 escribe \texttt{=B2*C2} (debería mostrar 200). (3) escribe \texttt{30} en B3 y \texttt{40} en C3. Arrastra la fórmula de D2 a D3 (debería mostrar 1200 = 30*40). (4) ahora en E2 escribe \texttt{=B2*\$C\$2} (200). Arrastra a E3 (debería mostrar 600 = 30*20, porque C2 quedó fija). Anota la diferencia entre lo que pasa en D y en E.
  checks:
  - Hice el experimento de los 4 pasos en Excel.
  - Anoté la diferencia entre la fórmula con \$ y sin \$.
  - Entendí qué hace el \$ al arrastrar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- El experimento del \$». \textbf{Formato:} ficha con los 4 pasos del experimento + diferencia observada entre D (referencia relativa) y E (referencia absoluta en C\$2\$). \textbf{Sabes que terminaste cuando} podrías explicarle el \$ a un compañero con el ejemplo.
sistematizacion:
  intro: |-
    Hiciste el experimento. Ahora necesitas la \textbf{anatomía profesional} de las 3 referencias: relativa, absoluta, mixta. Cada una tiene su uso, y elegir bien evita errores que romperán todas las fórmulas posteriores.
  pilares:
  - |-
    Las 3 referencias se descomponen así: (1) \textbf{Relativa} \texttt{B2}: la dirección se ajusta al arrastrar. Si copias \texttt{=B2*2} una fila abajo, queda \texttt{=B3*2}. Útil cuando cada fila tiene su propio dato. (2) \textbf{Absoluta} \texttt{\$B\$2}: la dirección queda fija al arrastrar. \texttt{=\$B\$2*2} sigue siendo \texttt{=\$B\$2*2} en cualquier celda. Útil para constantes (porcentaje de IVA, factor de conversión, valor base). (3) \textbf{Mixta}: fija solo fila o solo columna. \texttt{\$B2} fija columna B, fila libre (al arrastrar verticalmente, fila cambia; al arrastrar horizontalmente, columna se queda en B). \texttt{B\$2} fija fila 2, columna libre.
  - |-
    El atajo profesional para alternar entre los 4 tipos (\texttt{B2}, \texttt{\$B\$2}, \texttt{B\$2}, \texttt{\$B2}) es la tecla \textbf{F4}: pones el cursor sobre la referencia en la barra de fórmulas y presionas F4 una, dos o tres veces hasta que aparezca el tipo que necesitas. Aprender F4 ahorra muchísimo tiempo: en lugar de escribir los \$ manualmente, alternas con un toque.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué debe quedarse fijo y qué debe moverse cuando arrastre esta fórmula?}. Si arrastro la fórmula a otras filas, ¿la dirección debe seguir apuntando a la misma fila o adaptarse? Si arrastro a otras columnas, ¿debe seguir apuntando a la misma columna o adaptarse? Esas dos preguntas determinan dónde poner el \$.
  - |-
    Algoritmo: (1) escribe la fórmula en una celda. (2) antes de arrastrar, pregúntate qué debe quedarse fijo. (3) pon \$ delante de la columna y/o fila que debe quedarse fija. (4) arrastra la fórmula. (5) verifica que las primeras y últimas celdas tienen referencias correctas (haz clic en una celda al final del rango para confirmar que la fórmula apunta a donde debe). (6) si está mal, vuelve a editar la fórmula original con F4 hasta corregir.
  anatomia:
    titulo: Anatomía de las 3 referencias
    body: |-
      \textbf{Relativa} \texttt{B2}: se ajusta al arrastrar. \\[1mm] \textbf{Absoluta} \texttt{\$B\$2}: queda fija al arrastrar. \\[1mm] \textbf{Mixta columna fija} \texttt{\$B2}: columna fija, fila libre. \\[1mm] \textbf{Mixta fila fija} \texttt{B\$2}: fila fija, columna libre. \\[1mm] \textbf{Atajo F4:} alterna entre los 4 tipos.
  errores_comunes: |-
    (1) \textbf{Olvidar el \$ en una constante}: el IVA queda como referencia relativa y al arrastrar apunta a celdas vacías. (2) \textbf{Fijar lo que debía moverse}: poner \$ a la columna de precios hace que todas las filas calculen el mismo producto. (3) \textbf{No fijar lo que debía}: la constante se pierde al arrastrar. (4) \textbf{Mezclar mal en referencia mixta}: confundir cuál coordenada se fija (fila o columna). (5) \textbf{No verificar al final del rango}: la fórmula puede verse bien en la primera celda pero estar rota en la última.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía de las 3 referencias». \textbf{Formato:} (a) las 3 referencias con su sintaxis y caso de uso; (b) los 5 errores comunes con marca del que más temes cometer; (c) referencia al atajo F4. \textbf{Sabes que terminaste cuando} podrías predecir el comportamiento de cualquier referencia al arrastrarla.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- Dos ejercicios reales} (35 min · individual). Hora de aplicar. Haces dos hojas: una con cálculo de IVA y descuento sobre 10 productos, otra con tabla de multiplicar generada por UNA sola fórmula que se arrastra a 100 celdas.
  pilares:
  - |-
    El ejercicio 1 (IVA y descuento) se construye así: (1) columna A: nombres de 10 productos. (2) columna B: precios base. (3) celda E1: \texttt{19~\%} (IVA). (4) celda E2: \texttt{10~\%} (descuento). (5) columna C (IVA calculado): \texttt{=B2*\$E\$1} arrastrado a 10 filas. (6) columna D (precio con descuento): \texttt{=B2*(1-\$E\$2)} arrastrado a 10 filas. La constante de IVA y descuento queda fija con \$; los precios se mueven al arrastrar.
  - |-
    El ejercicio 2 (tabla de multiplicar) se construye con UNA sola fórmula que combina referencias mixtas. (1) en B1:K1 escribe los números 1 al 10 (factores de columna). (2) en A2:A11 escribe los números 1 al 10 (factores de fila). (3) en B2 escribe \texttt{=\$A2*B\$1}. Importante: \$A fija columna A, fila libre. B\$1 fija fila 1, columna libre. (4) arrastra B2 hacia la derecha hasta K2 (la fila 1 queda fija como factor de columna). (5) selecciona el rango B2:K2 y arrastra hacia abajo hasta K11 (la columna A queda fija como factor de fila). Resultado: tabla de multiplicar completa con 1 sola fórmula.
  - |-
    Sigue el patrón \textbf{``fórmula única, arrastre múltiple''}: el oficio profesional no escribe 100 fórmulas; escribe 1 fórmula con referencias bien pensadas y la arrastra. Esa disciplina ahorra tiempo y, sobre todo, evita errores: si necesitas cambiar el cálculo, cambias 1 fórmula en lugar de 100.
  - |-
    Algoritmo: (1) escribe la fórmula con cuidado. (2) presiona F4 para alternar referencias hasta tener las correctas. (3) arrastra. (4) haz clic en una celda al final del rango para verificar que apunta a donde debe. (5) prueba cambiando una constante: si el IVA pasa de 19~\% a 21~\%, todas las celdas deberían actualizarse al instante.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Ejercicio 1 (IVA/descuento) construido con 10 productos. \\[1mm] \checkbox Constantes \% fijadas con \$ absoluto. \\[1mm] \checkbox Precios con referencia relativa. \\[1mm] \checkbox Ejercicio 2 (tabla multiplicar) hecho con 1 sola fórmula. \\[1mm] \checkbox Referencias mixtas correctamente aplicadas (\$A2 y B\$1). \\[1mm] \checkbox Captura del antes y del después de arrastrar. \\[1mm] \checkbox Verificación cambiando una constante (el IVA o un factor) y observando que todo se actualiza.
  plantilla_guion: |-
    \textbf{Ejercicio 1.} \textit{IVA fijado \$, precios relativos.} \\[1mm] \textbf{Fórmula IVA.} \textit{=B2*\$E\$1 arrastrada 10 filas.} \\[1mm] \textbf{Fórmula descuento.} \textit{=B2*(1-\$E\$2) arrastrada 10 filas.} \\[1mm] \textbf{Ejercicio 2.} \textit{Tabla multiplicar con 1 fórmula.} \\[1mm] \textbf{Fórmula única.} \textit{=\$A2*B\$1 arrastrada a las 100 celdas.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- IVA y tabla multiplicar». \textbf{Formato:} (a) referencia al archivo Excel; (b) explicación de qué referencia usaste en cada fórmula y por qué; (c) prueba del cambio de constante (si cambio el IVA, ¿qué pasa?). \textbf{Sabes que terminaste cuando} podrías cambiar una constante y ver toda la tabla actualizarse.
  producto_titulo: Hoja con IVA/descuento + tabla multiplicar + verificación al arrastrar
  criterios:
  - IVA y descuento aplicados a 10 productos con referencias absolutas para %
  - Precios con referencia relativa
  - Tabla de multiplicar construida con 1 sola fórmula
  - Referencias mixtas correctamente aplicadas
  - Capturas del antes y después de arrastrar
  - Verificación cambiando una constante
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Reproducir sin perder dignidad es lo opuesto a copiar como esclavo; las referencias bien usadas honran el patrón sin convertir al copista en máquina.
    aplicacion: |-
      Cuando arrastras una fórmula correctamente, no estás haciendo trabajo mecánico: estás aplicando una idea bien pensada a muchos casos. Esa es la diferencia entre el aprendiz que copia 100 veces sin entender y el alfarero que entiende el patrón y lo reproduce con criterio. La filosofía de la liberación pide ese tipo de reproducción consciente, no la copia ciega. La phronesis del oficio digital consiste en \textbf{pensar la fórmula 1 vez bien y reproducirla con honestidad}.
    pregunta_espejo: |-
      ¿Mi fórmula refleja una idea bien pensada que se reproduce con criterio, o es solo copia mecánica?
  estoico:
    autor: Epicteto
    cita: |-
      Lo pequeño cambia el resultado: un signo de dólar bien puesto separa el oficio del desastre.
    aplicacion: |-
      Es tentador subestimar el \$: parece detalle ortográfico, no técnico. La disciplina estoica recomienda lo opuesto: \emph{lo pequeño es crucial}. Un \$ que falta convierte tu fórmula en error; un \$ que sobra la fija donde debía moverse. El oficio del análisis con Excel se sostiene en estos detalles invisibles. La sabiduría consiste en \textbf{respetar lo pequeño porque sostiene lo grande}.
    pregunta_espejo: |-
      ¿Estoy poniendo cuidado a cada \$ de mi fórmula, o asumo que se entiende?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La información replicable con honestidad es la nueva ética del oficio digital.
    aplicacion: |-
      Una fórmula con referencias bien pensadas permite que cualquiera reproduzca tu cálculo sin tu intervención. Esa replicabilidad es la base de la transparencia digital contemporánea: tu trabajo no depende de ti, depende de la lógica que dejaste explícita en la hoja. Quien escribe fórmulas opacas o las arrastra a la suerte impide esa replicabilidad. Tu hoja de hoy te entrena en una práctica ética del oficio digital.
    pregunta_espejo: |-
      ¿Mi hoja es replicable por otra persona, o solo yo entiendo cómo está armada?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus 2 hojas (IVA/descuento y tabla de multiplicar) terminadas. En la sesión 6 vas a aprender \textbf{fórmulas compuestas con jerarquía PEMDAS}, que combinan varios operadores en una sola fórmula sin ambigüedad. Las referencias de hoy son la base; los operadores de mañana se montan sobre ellas.
web:
  conceptos_clave:
    - termino: Referencia relativa
      definicion: |-
        Dirección de celda sin signos de dólar (B2). Al arrastrar la fórmula, la referencia se ajusta automáticamente a cada nueva posición.
      ejemplo: |-
        Si en C2 escribes =B2*2 y arrastras a C3, queda =B3*2. La referencia se mueve con la fórmula.
      emoji: "↔️"
      categoria: Cómo se ancla
    - termino: Referencia absoluta
      definicion: |-
        Dirección con dos signos de dólar ($B$2). Al arrastrar, queda fija sin importar dónde se copie la fórmula.
      ejemplo: |-
        Si pones =$B$2*2 en C2 y arrastras a C10, las 9 celdas siguen apuntando a B2. Útil para constantes como IVA o tasas.
      emoji: "📌"
      categoria: Cómo se ancla
    - termino: Referencia mixta
      definicion: |-
        Fija solo fila o solo columna. $B2 fija la columna B (fila libre); B$2 fija la fila 2 (columna libre).
      ejemplo: |-
        En tabla de multiplicar, =$A2*B$1 permite que la columna A se quede fija al arrastrar derecha, y la fila 1 al arrastrar abajo.
      emoji: "🔀"
    - termino: Tecla F4
      definicion: |-
        Atajo profesional que alterna entre los 4 tipos de referencia (B2 → $B$2 → B$2 → $B2 → B2) en el cursor de la barra de fórmulas.
      ejemplo: |-
        Pones el cursor sobre B2 en la barra de fórmulas, presionas F4 una vez: se convierte en $B$2. Otra vez: B$2. Otra: $B2.
      emoji: "⌨️"
      categoria: Cómo se construye fórmula compleja
    - termino: Patrón patrón-copia
      definicion: |-
        Sabiduría del alfarero aplicada a Excel: lo que debe quedarse fijo se fija con \$; lo que debe moverse se deja libre. La constante es el patrón, los datos son las copias.
      ejemplo: |-
        El alfarero fija el molde y ajusta cada pieza. En Excel fijas el IVA como constante (\$) y arrastras los precios (relativos) para calcular impuesto uno por uno.
      emoji: "🏺"
  quiz:
    titulo: ¿Dominas el dólar de las referencias?
    instrucciones: 5 preguntas para verificar que sabes cuándo usar referencia relativa, absoluta o mixta.
    preguntas:
      - enunciado: 'Escribes =B2*\$E\$1 en C2 y la arrastras hacia abajo. ¿Qué cambia y qué no?'
        opciones:
          - Ambas cambian (B2 y E1)
          - Ninguna cambia
          - B2 queda fija; E1 cambia
          - B2 cambia (B3, B4...); E1 queda fija
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. B2 es relativa, se mueve al arrastrar (B3, B4...). $E$1 es absoluta, queda fija siempre.
        feedback_incorrecto: |-
          B2 (relativa) cambia con el arrastre. $E$1 (absoluta) queda fija. Esa es la regla del signo de dólar.
      - enunciado: 'Tienes IVA del 19% en celda E1. Quieres calcular IVA para 50 productos en columna C. ¿Qué fórmula escribes en C2 para arrastrarla?'
        opciones:
          - =B2*\$E\$1
          - =B2*E1
          - =B$2*E1
          - =\$B\$2*E1
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. El precio (B2) debe moverse al arrastrar; el IVA (E1) debe quedarse fijo. Por eso =B2*\$E\$1.
        feedback_incorrecto: |-
          El precio (B2) debe ser relativo para que cambie con cada fila; el IVA (E1) debe ser absoluto ($E$1) para que no se mueva.
      - enunciado: "¿Para qué sirve la tecla F4 mientras editas una fórmula?"
        opciones:
          - Para guardar la fórmula
          - Para alternar entre los 4 tipos de referencia
          - Para borrar la celda
          - Para ejecutar la fórmula
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. F4 alterna B2 → $B$2 → B$2 → $B2 → B2. Mucho más rápido que escribir los signos a mano.
        feedback_incorrecto: |-
          F4 alterna los 4 tipos de referencia en el cursor. Es atajo profesional indispensable.
      - enunciado: 'Para tabla de multiplicar (filas 1-10 por columnas 1-10), ¿qué fórmula UNICA escribes en B2 para arrastrar a todas las 100 celdas?'
        opciones:
          - =A2*B1
          - =\$A\$2*\$B\$1
          - =\$A2*B\$1
          - =A\$2*\$B1
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. =\$A2*B\$1 fija columna A (factor de fila) y fija fila 1 (factor de columna). Permite arrastrar a las 100 celdas.
        feedback_incorrecto: |-
          La fórmula correcta es =\$A2*B\$1. Fija solo la columna A y solo la fila 1, dejando libres las direcciones que sí deben moverse.
      - enunciado: "Sabiduría del alfarero del Quindío aplicada a Excel: ¿qué se fija con dólar?"
        opciones:
          - Las copias (datos que cambian)
          - El patrón (lo que no debe cambiar al copiar)
          - Todas las celdas siempre
          - Las celdas vacías
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El patrón se fija (\$); las copias se mueven (sin \$). Igual que el alfarero deja el molde fijo y ajusta cada pieza nueva.
        feedback_incorrecto: |-
          Se fija con dólar lo que no debe cambiar al copiar: el patrón. Las copias (filas que se calculan) se dejan libres para que se ajusten.
  resumen: |-
    Como la fórmula heredada del abuelo: lo que no se negocia se ancla, lo que cambia con el día se deja libre. Aprendes a escribir UNA fórmula que se copia a 100 celdas y calcula bien cada caso.
  subtema: Excel · Referencias relativas y absolutas
  pre_lectura:
    por_que_importa: |-
      Saber anclar una celda con $ es la diferencia entre escribir UNA fórmula reutilizable y escribir 100 fórmulas a mano. Esta habilidad ahorra horas y reduce errores en cualquier hoja: notas, presupuestos, inventarios, nómina.
    pregunta_detonante: |-
      ¿Qué de la fórmula del abuelo — el ancla heredada que no se negocia — podemos llevar a las referencias absolutas de Excel?
    activacion:
      titulo: La receta multiplicada
      descripcion: |-
        En 5 minutos: piensa en una receta de tu casa (sancocho, arepa, jugo) que se multiplique según porciones. ¿Qué cantidades son FIJAS por porción y cuáles VARÍAN con el número de porciones? Eso es relativo vs absoluto antes de Excel.
      duracion_min: 5
    conexion:
      anterior: En la sesión 4 aplicaste 4 funciones estadísticas a datos reales.
      siguiente: En la sesión 6 aprenderás fórmulas compuestas con operadores y orden de cálculo.
  post_lectura:
    reflexion: |-
      "Lo que no se negocia se ancla". Más allá de Excel, ¿qué constantes éticas o personales anclas tú con $ en tu vida — lo que no copias de otros, lo que no varía con la presión social?
    transferencia: |-
      Esta semana arma una hoja con UNA fórmula reusable: cálculo de descuento, IVA, promedio ponderado. Que UNA sola línea calcule 20 casos. Documenta qué anclaste y por qué.
    cierre: |-
      La fórmula del abuelo — el ancla heredada — sigue viva en cada $ que escribes. Es disciplina técnica y, también, soberanía cultural.
  cinco_dimensiones:
    personal: |-
      Aprendiste a anclar lo no negociable y dejar libre lo contextual — habilidad cognitiva que aplica a Excel y a la vida.
    emocional: |-
      Resististe la tentación de copiar fórmulas sin pensar — entendiste que el criterio precede a la técnica.
    ciudadana: |-
      Las fórmulas reusables son cooperación silenciosa: el que las escribe bien le facilita la vida al que las hereda.
    local: |-
      Heredaste el oficio de la receta colombiana: ancla lo esencial, varía lo contextual, transmite la lógica.
    intergeneracional: |-
      La receta del sancocho de tu abuela y la fórmula $A$1 de Excel comparten lógica. Hoy heredas en formato digital lo que el oficio enseñó por siglos.

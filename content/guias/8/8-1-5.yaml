clave: 1-5
grado: 8
periodo: 1
sesion: 5
completo: true
duracion_min: 90
titulo: Referencias relativas y absolutas --- fija la rejilla, repite la puntada
titulo_portada: |-
  Fija la rejilla,
  repite la puntada
producto_final: |-
  Dos hojas de Excel. En la primera, el IVA y un descuento calculados sobre diez productos con una sola fórmula que se arrastra. En la segunda, la tabla de multiplicar del 1 al 10 construida con una única fórmula copiada a cien celdas. Y capturas que muestren que las fórmulas siguen bien al final del rango.
apertura:
  origen: Caladoras de Ansermanuevo y Cartago · la rejilla fija y la puntada que se repite
  fuente: |-
    Cuéllar Barona, M., Sánchez-Aldana, E. y Pérez-Bustos, T. (Eds.). (2019). \emph{Papel de Colgadura}, 18. Universidad Icesi.
  saber_ancestral: |-
    En Ansermanuevo y Cartago hay un oficio que trabaja quitando en vez de poniendo: el \textbf{calado}. La caladora tensa la tela y retira hilos de la trama y de la urdimbre, de uno en uno. «Si tratas de deshilar dos hilos a la vez, ellos no te dejan, se pegan entre sí», cuenta Olivia, caladora de 65 años (Pérez-Bustos, 2019). Lo que queda no es un hueco: es una \textbf{rejilla regular}. Esa rejilla se fija primero y no se toca más. Solo entonces empieza la puntada, que se repite celda por celda, siempre igual, hasta llenar el diseño. Dos cosas, entonces: una que queda fija para toda la pieza, la rejilla, y otra que se copia y se mueve, la puntada. Si cambias el orden, la tela se arruina. La \textbf{cara de exclusión} del oficio: es un saber que se transmite en casa y sin título, y la caladora experta no aparece en ningún registro oficial. En Excel vas a hacer hoy lo mismo: fijar lo que no cambia con el signo \$, y dejar libre lo que sí se mueve al copiar.
  saber_contemporaneo: |-
    Una \textbf{referencia} es la dirección de una celda dentro de una fórmula, como B2. Hay dos formas de escribirla. \textbf{Relativa}, B2: cuando copias la fórmula una fila abajo, se convierte en B3; la dirección se mueve con la copia. \textbf{Absoluta}, \$B\$2: cuando copias la fórmula, sigue apuntando a B2; el signo \$ la deja fija. Hay una tercera, la \textbf{mixta}: \$B2 fija la columna y deja libre la fila; B\$2 fija la fila y deja libre la columna. La regla del oficio es una sola: fija lo que no debe cambiar al copiar y deja libre lo que sí. Con eso, una fórmula bien escrita se copia a cien celdas sin error. Sin eso, escribes cien fórmulas a mano, y alguna sale mal.
  pregunta_puente: |-
    La caladora fija la rejilla una vez y después repite la misma puntada en cada celda. Cuando copies una fórmula a diez filas, ¿qué parte de ella es la rejilla, la que no debe moverse? ¿Y qué parte es la puntada, la que debe cambiar en cada fila?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué cambia y qué no cuando copias una fórmula con y sin \$; (2) \textbf{explicar} con tus palabras para qué sirve el signo \$; (3) \textbf{aplicar} referencias relativas, absolutas y mixtas en dos ejercicios reales; (4) \textbf{evaluar} una fórmula ajena y decir si se va a romper al copiarla.
puentes:
  a_ruta: |-
    En la sesión 4 escribiste tus primeras funciones. Hoy aprendes a copiarlas a muchas celdas sin que se rompan. En la sesión 6 vas a combinar operadores en una sola fórmula, y todo se apoya en las referencias de hoy.
  a_escuta: |-
    Antes de la teoría, vas a hacer un experimento de cuatro pasos en Excel y a ver con tus ojos qué le pasa a una fórmula cuando la arrastras, con \$ y sin \$.
  a_sistematizacion: |-
    Ya viste el efecto del \$. Ahora entiendes las tres referencias, aprendes el atajo F4 y construyes con tu pareja la hoja del IVA y el descuento.
  a_praxis: |-
    Ya sabes fijar una constante. Ahora el reto grande: una tabla de multiplicar de cien celdas con una sola fórmula, y la revisión de la fórmula de tu pareja.
  a_producto: |-
    Lo que entregas hoy: la hoja del IVA y el descuento, la tabla de multiplicar con una única fórmula, y las capturas del final del rango. La prueba de calidad: cambias el IVA en una celda y las diez filas se actualizan solas.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Escribir una fórmula que se copia bien es pensar antes de copiar, como la caladora piensa la rejilla antes de la primera puntada.
  a_triangulo: |-
    Para terminar, tres ideas sobre lo que se fija y lo que se mueve, contadas con palabras de esta guía: Dussel sobre la tecnología que tiene rostro humano, Epicteto sobre lo que depende de uno, Floridi sobre saber qué preguntarle a los datos.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El experimento de fijar una celda} (15 min · individual). (1) En Excel escribe 10 en B2 y 20 en C2. En D2 escribe \texttt{=B2*C2}: debe dar 200. (2) Escribe 30 en B3 y 40 en C3. Arrastra la fórmula de D2 hasta D3: debe dar 1200. (3) En E2 escribe \texttt{=B2*\$C\$2}: da 200. Arrastra hasta E3: da 600, porque C2 quedó fija. (4) Haz clic en D3 y en E3 y mira la fórmula en la barra: ¿qué cambió en cada una? (5) Escribe en una línea la diferencia entre la columna D y la columna E.
  checks:
  - Hice los cuatro pasos y obtuve 200, 1200, 200 y 600.
  - Miré las fórmulas de D3 y E3 en la barra y anoté qué cambió.
  - Escribí en una línea qué hace el signo \$.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- El experimento de fijar una celda». \textbf{Formato:} ficha con los cuatro pasos, los cuatro resultados y una línea sobre la diferencia entre D y E. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} los cuatro resultados coinciden con los de la guía y puedes explicarle a un compañero qué hace el \$ con este ejemplo.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- IVA y descuento con una fórmula que se copia} (30 min · parejas). (1) Con tu pareja, escriban en la columna A diez productos de la tienda escolar y en la B sus precios. (2) En E1 escriban 19~\% y en E2 escriban 10~\%: son el IVA y el descuento. (3) En C2 escriban \texttt{=B2*\$E\$1} y arrastren hasta C11: es el IVA de cada producto. (4) En D2 escriban \texttt{=B2*(1-\$E\$2)} y arrastren hasta D11: es el precio con descuento. (5) Cambien el IVA de E1 a 21~\% y miren la columna C: si las diez filas cambiaron solas, la referencia quedó bien fijada.
  pilares:
  - |-
    \textbf{Las tres referencias.} Relativa, B2: se mueve al copiar; sirve cuando cada fila tiene su propio dato, como el precio. Absoluta, \$B\$2: queda fija al copiar; sirve para constantes, como el IVA. Mixta, \$B2 o B\$2: fija solo la columna o solo la fila; sirve cuando copias en las dos direcciones.
  - |-
    \textbf{El atajo F4.} Pon el cursor sobre la referencia en la barra de fórmulas y presiona F4. Cada toque cambia entre B2, \$B\$2, B\$2 y \$B2. Es más rápido que escribir los signos a mano y evita olvidar uno.
  - |-
    \textbf{Dos preguntas antes de copiar.} Si arrastro hacia abajo, ¿esta dirección debe seguir en la misma fila o bajar con la copia? Si arrastro hacia la derecha, ¿debe seguir en la misma columna o moverse? Las respuestas dicen dónde va el \$.
  - |-
    \textbf{Verifica al final del rango.} La fórmula puede verse bien en la primera celda y estar rota en la última. Haz clic en la última celda del rango y mira la barra: si apunta a donde debe, la copia quedó bien.
  anatomia:
    titulo: Las tres referencias, en una mirada
    body: |-
      \textbf{Relativa} \texttt{B2}: se mueve al copiar. \\[1mm] \textbf{Absoluta} \texttt{\$B\$2}: queda fija. \\[1mm] \textbf{Mixta} \texttt{\$B2}: columna fija, fila libre. \\[1mm] \textbf{Mixta} \texttt{B\$2}: fila fija, columna libre. \\[1mm] \textbf{F4:} alterna entre las cuatro.
  errores_comunes: |-
    (1) \textbf{Olvidar el \$ en la constante}: el IVA se mueve al copiar y apunta a celdas vacías. (2) \textbf{Fijar lo que debía moverse}: si fijas el precio, todas las filas calculan el mismo producto. (3) \textbf{Confundir la mixta}: fijar la fila cuando había que fijar la columna. (4) \textbf{No mirar la última celda}: el error se ve al final del rango, no al principio. (5) \textbf{Escribir cien fórmulas a mano}: alguna sale distinta y nadie la encuentra.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- IVA y descuento con una fórmula». \textbf{Formato:} las dos fórmulas escritas tal cual, y una tabla de 2 filas y 2 columnas (qué fijamos con \$ / qué dejamos libre). \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} al cambiar el IVA en E1 las diez filas de la columna C cambian solas, y la tabla dice qué se fijó y por qué.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Cien celdas con una sola fórmula, y la fórmula de tu pareja} (25 min · individual). (1) En una hoja nueva escribe del 1 al 10 en B1 hasta K1, y del 1 al 10 en A2 hasta A11. (2) En B2 escribe \texttt{=\$A2*B\$1}. (3) Arrastra B2 hacia la derecha hasta K2. Después selecciona B2:K2 y arrastra hacia abajo hasta la fila 11. (4) Haz clic en K11 y mira la barra: debe decir \texttt{=\$A11*K\$1} y mostrar 100. (5) Intercambia la hoja con tu pareja y revisa su fórmula de B2: ¿se rompería al copiarla? Escribe tu veredicto en una línea.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) La hoja del IVA y el descuento con las dos fórmulas copiadas. (2) La tabla de multiplicar con una única fórmula en cien celdas. (3) Las capturas de la última celda de cada rango y tu veredicto sobre la fórmula de tu pareja.
  - |-
    \textbf{Por qué \$A2*B\$1 funciona.} \$A2 fija la columna A: al arrastrar a la derecha sigue leyendo el factor de la fila. B\$1 fija la fila 1: al arrastrar hacia abajo sigue leyendo el factor de la columna. Cada celda multiplica su fila por su columna. Una fórmula, cien resultados.
  - |-
    \textbf{Cómo evaluar una fórmula ajena.} Pregunta qué se va a copiar y hacia dónde. Mira cada referencia: ¿debe moverse en esa dirección? Si una constante no tiene \$, se rompe. Si un dato de fila tiene \$ en la fila, se repite el mismo valor. Escribe el veredicto con la razón.
  - |-
    \textbf{Una fórmula, no cien.} Si el cálculo cambia, corriges una celda y vuelves a copiar. Con cien fórmulas escritas a mano, corriges cien y alguna se te escapa. Pensar la referencia antes de copiar es lo que ahorra el trabajo de después.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Hoja del IVA y el descuento con diez productos y las dos fórmulas copiadas. \\[1mm] \checkbox Al cambiar el IVA en E1, la columna C cambia sola. \\[1mm] \checkbox Tabla de multiplicar hecha con una única fórmula en B2. \\[1mm] \checkbox K11 muestra 100 y su fórmula dice \texttt{=\$A11*K\$1}. \\[1mm] \checkbox Captura de la última celda de cada rango. \\[1mm] \checkbox Veredicto sobre la fórmula de mi pareja, con razón.
  plantilla_guion: |-
    \textbf{IVA.} \textit{=B2*\$E\$1, copiada diez filas.} \\[1mm] \textbf{Descuento.} \textit{=B2*(1-\$E\$2), copiada diez filas.} \\[1mm] \textbf{Tabla de multiplicar.} \textit{=\$A2*B\$1, copiada a cien celdas.} \\[1mm] \textbf{Prueba.} \textit{Cambio el IVA y miro la columna C.} \\[1mm] \textbf{Veredicto.} \textit{La fórmula de mi pareja se rompe o no, porque…}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Cien celdas con una fórmula». \textbf{Formato:} la fórmula \texttt{=\$A2*B\$1} explicada en dos líneas (qué fija cada \$), más el veredicto sobre la fórmula de tu pareja con su razón. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} K11 muestra 100, puedes decir qué fija cada \$ de la fórmula, y tu veredicto sobre la fórmula ajena tiene razón escrita.
  producto_titulo: IVA y descuento con fórmula copiada + tabla de multiplicar con una única fórmula + veredicto
  criterios:
  - El IVA y el descuento se calculan para diez productos con referencias absolutas en las constantes
  - Al cambiar el IVA en una celda, las diez filas se actualizan solas
  - La tabla de multiplicar sale de una única fórmula copiada a cien celdas
  - K11 muestra 100 y su fórmula apunta a A11 y K1
  - Hay captura de la última celda de cada rango
  - El veredicto sobre la fórmula de tu pareja tiene razón escrita
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.7.1
    idea: |-
      No hay liberación sin una tecnología con rostro humano, diseñada desde la historia de la gente que la usa.
    aplicacion: |-
      Una fórmula que se copia bien ahorra horas a quien viene después: al compañero que hereda tu hoja, al tendero que actualiza sus precios. Pensar la referencia antes de copiar es diseñar para otros, no solo para que te dé el resultado.
    pregunta_espejo: |-
      ¿Quién va a usar mi hoja después de mí, y le dejé una fórmula que puede corregir?
  estoico:
    autor: Epicteto · Enquiridión, 1 (c. 125 d.C.)
    idea: |-
      Hay cosas que dependen de nosotros y cosas que no. Saber cuáles son cuáles es el primer trabajo.
    aplicacion: |-
      En una fórmula, el \$ es exactamente eso: decidir qué no va a cambiar aunque copies cien veces, y qué sí. La caladora lo sabe de la rejilla. Tú lo sabes de la constante del IVA.
    pregunta_espejo: |-
      En mi fórmula, ¿qué fijé porque no depende de la fila, y qué dejé libre porque sí?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      Ganan quienes saben preguntar y responder, y por eso saben qué datos buscar.
    aplicacion: |-
      Antes de copiar, la pregunta es una: ¿qué debe quedarse fijo y qué debe moverse? Quien se la hace escribe una fórmula. Quien no, escribe cien y no sabe cuál falló.
    pregunta_espejo: |-
      ¿Me hice la pregunta antes de arrastrar, o arrastré y después miré qué salió?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus dos hojas terminadas. En la sesión 6 vas a combinar varios operadores en una sola fórmula y a aprender en qué orden calcula Excel. Las referencias de hoy son la base; los operadores de mañana se montan sobre ellas.
web:
  resumen: |-
    Una fórmula bien escrita se copia a cien celdas sin romperse. Hoy aprendes qué fija el signo $ y qué deja libre, como la caladora que fija la rejilla y repite la puntada.
  subtema: Análisis de datos con phronesis
  pre_lectura:
    por_que_importa: |-
      La diferencia entre escribir cien fórmulas a mano y escribir una sola que se copia es la diferencia entre perder una tarde y ganarla. Y entre un error escondido y ninguno.
    pregunta_detonante: |-
      Cuando copies una fórmula a diez filas, ¿qué parte debe quedarse quieta y qué parte debe moverse?
    activacion:
      titulo: La fórmula que se rompió
      descripcion: |-
        En 3 minutos, escribe 19 % en E1 y un precio en B2. En C2 escribe =B2*E1 sin signos y arrástrala tres filas. ¿Qué salió en C3 y C4? ¿Por qué?
      duracion_min: 5
    conexion:
      anterior: En la sesión 4 escribiste SUMA, PROMEDIO, MAX y MIN sobre tu tabla limpia.
      siguiente: En la sesión 6 combinas operadores en una sola fórmula y aprendes el orden en que calcula Excel.

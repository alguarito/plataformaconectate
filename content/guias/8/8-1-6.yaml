clave: 1-6
grado: 8
periodo: 1
sesion: 6
completo: true
titulo: Fórmulas compuestas --- operadores, porcentajes y jerarquía PEMDAS
titulo_portada: |-
  Fórmulas compuestas ---
  operadores y
  jerarquía PEMDAS
producto_final: |-
  Hoja Excel con (a) 5 fórmulas compuestas que combinen al menos 2 operadores aplicando PEMDAS correctamente (ej. cálculo de nota final con ponderación, precio con IVA y descuento, promedio ponderado de evaluaciones) + (b) tabla de 3 fórmulas mal escritas a propósito por error de jerarquía, cada una corregida con paréntesis y explicada en 1 línea por qué fallaba + (c) prueba final con un cálculo del mundo real (gasto mensual, salario después de impuestos)
apertura:
  saber_ancestral: |-
    En las obras de construcción de Cartago, el maestro albañil tenía una regla inquebrantable que enseñaba a los aprendices el primer día: \textbf{la mezcla se hace en orden}. Primero la arena, en montón. Después el cemento, encima de la arena, en proporción exacta. Se revuelven en seco con la pala hasta uniformar el color. Recién entonces, en el centro del montón, se hace un hoyo y se vierte el agua poco a poco, integrando desde los bordes hacia el centro. Si un aprendiz cambiaba el orden \emph{``por ahorrar tiempo''} (mezclar arena y agua primero, después echar cemento), el resultado era catastrófico: la mezcla quedaba con grumos, no fraguaba bien, las paredes salían débiles y se caían al primer aguacero fuerte. El maestro no aceptaba argumentos: \textbf{el orden no es preferencia, es ley del oficio}. La sabiduría de la construcción se sostiene en órdenes silenciosos como ese; cada gremio tiene los suyos. En matemáticas, también: hay un orden estricto en que las operaciones deben hacerse, y se llama \textbf{PEMDAS}.
  origen: Receta tradicional de la chicha de maíz en el Valle del Cauca
  saber_contemporaneo: |-
    La \textbf{jerarquía PEMDAS} es la regla universal que dicta el orden en que se ejecutan las operaciones matemáticas dentro de una fórmula. Su nombre viene del acrónimo en inglés: \textbf{P}arentheses (paréntesis), \textbf{E}xponents (exponentes), \textbf{M}ultiplication y \textbf{D}ivision (multiplicación y división, de izquierda a derecha), \textbf{A}ddition y \textbf{S}ubtraction (suma y resta, de izquierda a derecha). Esta jerarquía es universal: la aplican calculadoras, hojas de cálculo, lenguajes de programación, y la matemática misma. Por ejemplo, la fórmula \texttt{=2+3*4} no es 20 (no es (2+3)*4); es 14 (es 2+(3*4)), porque la multiplicación tiene prioridad sobre la suma. La regla profesional es famosa y a veces dolorosa: \textbf{cuando dudes del orden, usa paréntesis}. Los paréntesis siempre van primero, así que escribir \texttt{=(2+3)*4} hace lo que esperas (20), sin depender de que recuerdes la jerarquía. Los paréntesis explícitos son la disciplina del oficio digital cuando hay riesgo de ambigüedad.
  pregunta_puente: |-
    ¿Qué sabía el albañil al respetar el orden de la mezcla, que el novato olvida cuando escribe \texttt{=2+3*4} esperando 20? ¿Y por qué los paréntesis explícitos son señal de profesionalismo, no de inseguridad?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} el orden de PEMDAS en cualquier fórmula con varios operadores; (2) \textbf{explicar} con tus palabras por qué la multiplicación va antes que la suma y por qué los paréntesis cambian el orden; (3) \textbf{aplicar} la jerarquía a fórmulas compuestas reales (cálculo de nota final, precio con IVA y descuento, promedio ponderado); (4) \textbf{evaluar} fórmulas mal escritas detectando el error de jerarquía y corrigiéndolo con paréntesis.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 5 aprendiste a fijar referencias para que las fórmulas se arrastren. Hoy aprendes a hacer fórmulas más complejas con varios operadores que respeten el orden correcto. Las próximas sesiones (gráficos, formato condicional, mini-estudio) construyen sobre la habilidad de escribir fórmulas precisas y no ambiguas.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{prueba a mano} de 3 expresiones matemáticas y luego compararlas con lo que da Excel. La diferencia (si la hay) revelará dónde estás aplicando mal la jerarquía.
  a_sistematizacion: |-
    Ya tienes la intuición. Ahora vas a entender la \textbf{anatomía de PEMDAS}: las 4 letras del orden, las reglas de izquierda a derecha cuando hay empate, los 5 errores típicos (asumir que suma va antes que multiplicación, olvidar el paréntesis en una resta dividida, no agrupar el numerador, mezclar mal con porcentajes, ambigüedad de signos negativos).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: construyes 5 fórmulas compuestas reales que combinan operadores con PEMDAS, corriges 3 fórmulas mal escritas con paréntesis, y haces una prueba final con cálculo del mundo real.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 5 fórmulas correctas + 3 fórmulas corregidas + cálculo del mundo real. El criterio principal: que cualquier compañero leyendo tu hoja pueda predecir el resultado de cada fórmula sin necesidad de calcularlo.
  a_evaluacion: |-
    Antes de cerrar, mira PEMDAS desde las cinco dimensiones humanas. Respetar el orden de operaciones es respeto por el oficio matemático entero; saltárselo produce resultados con apariencia de cálculo pero sin precisión real.
  a_triangulo: |-
    Y para terminar, tres voces sobre el orden y la claridad. Dussel sobre los cálculos que respetan a quien los lee, Marco Aurelio sobre la claridad como virtud, Floridi sobre la fórmula transparente como ética del oficio digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Prueba a mano vs Excel} (15 min · individual). Toma estas 3 expresiones y calcula a mano (con calculadora normal o cuaderno, sin Excel) el resultado de cada una: (a) \texttt{2+3*4} (b) \texttt{(2+3)*4} (c) \texttt{20-6/2}. Anota tus 3 respuestas. Después abre Excel y escribe las mismas expresiones como fórmulas (\texttt{=2+3*4}, \texttt{=(2+3)*4}, \texttt{=20-6/2}). Compara tus respuestas con las de Excel. Si alguna no coincide, anota cuál y reflexiona por qué se equivocó (¿la calculadora?, ¿tú?, ¿Excel?).
  checks:
  - Calculé las 3 expresiones a mano antes de Excel.
  - Comparé con los resultados de Excel.
  - Si hubo diferencia, identifiqué la causa.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Prueba a mano vs Excel». \textbf{Formato:} tabla 3 filas × 3 columnas (Expresión~|~Mi resultado~|~Excel) + 1 línea sobre si hubo diferencia y por qué. \textbf{Sabes que terminaste cuando} sospechas que el orden de operaciones cambia los resultados.
sistematizacion:
  intro: |-
    Hiciste la prueba. Ahora necesitas la \textbf{anatomía profesional de PEMDAS}: el orden completo, las reglas de empate, los errores típicos. Esta jerarquía es la receta del albañil aplicada a las fórmulas.
  pilares:
  - |-
    PEMDAS se descompone en 4 niveles de prioridad: (1) \textbf{P --- Paréntesis}: primero. Lo que está dentro se calcula antes que nada. Si hay paréntesis anidados, se resuelven de adentro hacia afuera. (2) \textbf{E --- Exponentes}: segundo. \texttt{2\textasciicircum 3} se calcula antes que multiplicaciones. (3) \textbf{MD --- Multiplicación y División}: tercero. Tienen el mismo nivel, se calculan de izquierda a derecha. \texttt{10/2*5} es 25 (no 1), porque se hace \texttt{10/2 = 5} primero, después \texttt{5*5 = 25}. (4) \textbf{AS --- Adición y Sustracción}: cuarto. También de izquierda a derecha. \texttt{10-3+2} es 9 (no 5).
  - |-
    La regla profesional del oficio: \textbf{cuando dudes, usa paréntesis}. Es más legible escribir \texttt{=(B2*0{,}3)+(C2*0{,}3)+(D2*0{,}4)} que \texttt{=B2*0{,}3+C2*0{,}3+D2*0{,}4}, aunque las dos den el mismo resultado. Los paréntesis hacen explícito el orden y evitan confusión: quien lee la fórmula entiende inmediatamente, sin tener que recordar PEMDAS. La phronesis del oficio digital consiste en \textbf{privilegiar la claridad sobre la elegancia}.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿esta fórmula es legible por otra persona o solo por mí?}. Si otra persona tendría que pensar PEMDAS para entender qué hace, falta paréntesis. Si la fórmula se lee como una receta clara (\emph{``calcula esto, después aquello, después suma todo''}), está bien escrita. Los paréntesis no son redundancia: son comunicación.
  - |-
    Algoritmo: (1) antes de escribir la fórmula, pregúntate qué orden de operaciones quieres. (2) si el orden coincide con PEMDAS por defecto, los paréntesis son opcionales pero ayudan a leer. (3) si el orden NO coincide con PEMDAS (quieres sumar antes de multiplicar, restar antes de dividir), los paréntesis son OBLIGATORIOS. (4) lee la fórmula en voz alta antes de presionar Enter. (5) verifica el resultado con un caso conocido.
  anatomia:
    titulo: Anatomía de PEMDAS
    body: |-
      \textbf{P}aréntesis primero. \\[1mm] \textbf{E}xponentes segundo. \\[1mm] \textbf{M}ultiplicación y \textbf{D}ivisión tercero (izq a der). \\[1mm] \textbf{A}dición y \textbf{S}ustracción cuarto (izq a der). \\[1mm] \textbf{Regla de oro:} cuando dudes, usa paréntesis.
  errores_comunes: |-
    (1) \textbf{Asumir que suma va antes que multiplicación}: \texttt{=2+3*4} no es 20, es 14. (2) \textbf{Olvidar paréntesis en numerador con resta}: \texttt{=A2-B2/C2} no resta primero; divide B2/C2 y después resta. Para forzar resta primero hay que escribir \texttt{=(A2-B2)/C2}. (3) \textbf{Promedio ponderado mal escrito}: \texttt{=A2*0{,}3+B2*0{,}3+C2*0{,}4} funciona por casualidad, pero es más legible con paréntesis. (4) \textbf{Porcentajes mal aplicados}: \texttt{=B2*1+19~\%} no aplica el 19~\% al precio; suma 19~\% al resultado. La forma correcta es \texttt{=B2*(1+19~\%)}. (5) \textbf{Signos negativos ambiguos}: \texttt{=-2\textasciicircum 2} en Excel es 4 (porque Excel aplica el negativo después del exponente), no -4 como en matemáticas pura. Hay que escribir \texttt{=-(2\textasciicircum 2)} para forzar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía de PEMDAS». \textbf{Formato:} (a) las 4 letras con su orden; (b) los 5 errores comunes con marca del que más temes cometer; (c) regla de oro escrita en grande. \textbf{Sabes que terminaste cuando} podrías predecir el resultado de cualquier fórmula compuesta sin calculadora.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- 5 fórmulas correctas + 3 corregidas + prueba real} (35 min · individual). Hora de aplicar. Construyes 5 fórmulas compuestas reales aplicando PEMDAS, corriges 3 fórmulas mal escritas con paréntesis, y haces 1 prueba final con un cálculo del mundo real.
  pilares:
  - |-
    Las 5 fórmulas compuestas reales son: (1) \textbf{Nota final ponderada}: \texttt{=(B2*0{,}3)+(C2*0{,}3)+(D2*0{,}4)} donde B,C,D son las 3 notas parciales y los porcentajes son los pesos. (2) \textbf{Precio con IVA y descuento}: \texttt{=B2*(1-D2)*(1+E2)} donde B2 es precio base, D2 descuento, E2 IVA. (3) \textbf{Promedio de 5 valores ignorando el menor}: \texttt{=(SUMA(B2:F2)-MIN(B2:F2))/4} (suma menos el mínimo, dividido entre los 4 restantes). (4) \textbf{Porcentaje de aprobación}: \texttt{=CONTAR.SI(G2:G31; \char34>=3\char34)/CONTAR(G2:G31)*100} (cuenta los aprobados, divide entre el total, multiplica por 100). (5) \textbf{Conversión de minutos a horas:fracciones}: \texttt{=B2/60+(B2 MOD 60)/100} (no perfectamente correcto pero útil como aproximación).
  - |-
    Las 3 fórmulas mal escritas a corregir son: (a) \texttt{=B2*0,5+C2*0,5} funciona por suerte, pero conviene escribir \texttt{=(B2*0,5)+(C2*0,5)} o mejor aún \texttt{=(B2+C2)/2}. (b) \texttt{=A2-B2/C2} cuando se quería \texttt{=(A2-B2)/C2}. (c) \texttt{=B2*1+19~\%} cuando se quería \texttt{=B2*(1+19~\%)}. Para cada una, escribe en 1 línea por qué fallaba.
  - |-
    Sigue el patrón \textbf{``paréntesis explícito sobre paréntesis implícito''}: aunque la fórmula funcionaría sin paréntesis por PEMDAS, agregar paréntesis hace la intención visible. La phronesis profesional consiste en \textbf{escribir fórmulas que otros entiendan sin tener que descifrar la jerarquía}.
  - |-
    Algoritmo: (1) define cuál es el cálculo que quieres hacer en palabras antes de escribir la fórmula. (2) escribe la fórmula con paréntesis explícitos. (3) verifica con un caso conocido (si calculas nota final con 3{,}0/3{,}0/3{,}0, debe dar 3{,}0). (4) lee la fórmula en voz alta para verificar legibilidad. (5) prueba con valores extremos (¿qué pasa si una nota es 0?, ¿si el precio es 0?).
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 5 fórmulas compuestas escritas con paréntesis explícitos donde aporten claridad. \\[1mm] \checkbox Cada fórmula verificada con un caso conocido. \\[1mm] \checkbox 3 fórmulas corregidas con paréntesis y explicación de 1 línea cada una. \\[1mm] \checkbox 1 prueba final con cálculo del mundo real. \\[1mm] \checkbox Hoja guardada con nombre claro (G8-P1-S6-pemdas.xlsx). \\[1mm] \checkbox Lectura en voz alta de cada fórmula para verificar claridad.
  plantilla_guion: |-
    \textbf{Fórmula 1.} \textit{Nota final ponderada.} \\[1mm] \textbf{Fórmula 2.} \textit{Precio con IVA y descuento.} \\[1mm] \textbf{Fórmula 3.} \textit{Promedio ignorando el mínimo.} \\[1mm] \textbf{Fórmula 4.} \textit{Porcentaje de aprobación.} \\[1mm] \textbf{Fórmula 5.} \textit{Conversión minutos a horas.} \\[1mm] \textbf{Corrección 1.} \textit{Antes / Después / Por qué fallaba.} \\[1mm] \textbf{Corrección 2.} \textit{Antes / Después / Por qué fallaba.} \\[1mm] \textbf{Corrección 3.} \textit{Antes / Después / Por qué fallaba.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- Fórmulas y PEMDAS». \textbf{Formato:} (a) referencia al archivo Excel con las 5 fórmulas; (b) tabla de las 3 correcciones con antes/después/explicación; (c) prueba final con cálculo real. \textbf{Sabes que terminaste cuando} otra persona podría leer cada fórmula y predecir el resultado.
  producto_titulo: 5 fórmulas correctas + 3 fórmulas corregidas + prueba con cálculo real
  criterios:
  - 5 fórmulas compuestas con paréntesis explícitos
  - Cada fórmula verificada con caso conocido
  - 3 fórmulas corregidas con explicación
  - Prueba final con cálculo del mundo real
  - Lectura en voz alta hecha
  - Hoja guardada con nombre claro
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Una fórmula que respeta al lector es ya un acto ético; una que esconde su lógica es una pequeña violencia técnica.
    aplicacion: |-
      Cuando agregas paréntesis explícitos a una fórmula, estás haciendo un favor a quien la lea después. Esa pequeña generosidad técnica es la phronesis del oficio: \emph{escribir para que otros entiendan, no para que crean que somos inteligentes}. La fórmula sin paréntesis innecesarios es elegante pero exigente; la fórmula con paréntesis explícitos es amable y clara. La filosofía de la liberación pide la segunda.
    pregunta_espejo: |-
      ¿Mis fórmulas están escritas para que otros las entiendan o para que admiren mi precisión técnica?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La claridad es virtud; lo oscuro disfrazado de elegante es vicio que se admira a sí mismo.
    aplicacion: |-
      Es tentador escribir fórmulas compactas sin paréntesis para parecer experto. La sabiduría estoica recomienda lo opuesto: \emph{prefiere la claridad sobre la elegancia}. Una fórmula clara con paréntesis demuestra más oficio que una compacta sin ellos. El experto verdadero no busca admiración: busca que su trabajo sea útil para otros. La phronesis del oficio honra la claridad por encima del adorno.
    pregunta_espejo: |-
      ¿Estoy escribiendo fórmulas claras o estoy mostrando que sé PEMDAS escribiendo fórmulas compactas?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La fórmula transparente es la nueva ética del oficio digital en la era de la información compartida.
    aplicacion: |-
      En la era de la información, las fórmulas suelen ser compartidas: una hoja Excel pasa por varias manos, una plantilla se reutiliza por años. Esa circulación exige fórmulas legibles. La ética digital contemporánea pide que las fórmulas sean claras no solo para el autor sino para quien las herede. Tu hoja de hoy te entrena en esa práctica que rige toda profesión que trabaje con cálculos compartidos.
    pregunta_espejo: |-
      ¿Mi hoja seguirá siendo legible si alguien la abre en 6 meses sin mi explicación, o solo se entiende conmigo presente?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con las 5 fórmulas, las 3 correcciones y la prueba final. En la sesión 7 vas a aprender a hacer \textbf{gráficos básicos} (barras, líneas, circulares) que comuniquen los datos con honestidad visual. Las fórmulas de hoy alimentan los gráficos de mañana.
web:
  conceptos_clave:
    - termino: PEMDAS
      definicion: |-
        Acrónimo del orden estándar en que se ejecutan operaciones: Paréntesis, Exponentes, Multiplicación y División (izq-der), Adición y Sustracción (izq-der).
      ejemplo: |-
        En =2+3*4, la multiplicación va primero (3*4=12), después la suma (2+12=14). Por eso el resultado es 14, no 20.
      emoji: "🔢"
    - termino: Multiplicación antes que suma
      definicion: |-
        Regla del orden PEMDAS más confundida. La multiplicación y división se hacen siempre antes que la suma y resta, salvo cuando hay paréntesis.
      ejemplo: |-
        =10+5*2 da 20 (porque 5*2=10, luego 10+10=20), no 30. Para forzar suma primero, hay que usar paréntesis: =(10+5)*2.
      emoji: "✖️"
    - termino: Paréntesis explícitos
      definicion: |-
        Práctica profesional de agregar paréntesis incluso cuando PEMDAS los hace innecesarios, para que la fórmula sea legible sin descifrar el orden.
      ejemplo: |-
        =(B2*0,3)+(C2*0,3)+(D2*0,4) es más legible que =B2*0,3+C2*0,3+D2*0,4 aunque den el mismo resultado.
      emoji: "( )"
    - termino: Operación de izquierda a derecha
      definicion: |-
        Cuando dos operaciones tienen el mismo nivel de PEMDAS (multiplicación y división, o suma y resta), se resuelven en el orden que aparecen leyendo izquierda a derecha.
      ejemplo: |-
        =10/2*5 es 25 (no 1). Primero 10/2=5, después 5*5=25. La división no tiene prioridad sobre multiplicación porque están al mismo nivel.
      emoji: "➡️"
    - termino: Fórmula compuesta
      definicion: |-
        Fórmula que combina al menos 2 operadores distintos (más, menos, por, dividir, exponente). El orden importa y PEMDAS la organiza.
      ejemplo: |-
        Nota final ponderada: =(B2*0,3)+(C2*0,3)+(D2*0,4) combina multiplicación y suma con porcentajes. PEMDAS asegura el orden correcto.
      emoji: "🧮"
  quiz:
    titulo: ¿Dominas PEMDAS en fórmulas?
    instrucciones: 5 preguntas para verificar que sabes el orden de operaciones y cuándo usar paréntesis explícitos.
    preguntas:
      - enunciado: '¿Cuánto da =2+3*4 en Excel?'
        opciones:
          - "20"
          - "10"
          - Error
          - "14"
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Por PEMDAS, primero 3*4=12, después 2+12=14. La multiplicación va antes que la suma.
        feedback_incorrecto: |-
          Por PEMDAS, primero se hace la multiplicación (3*4=12), después la suma (2+12=14). El resultado es 14.
      - enunciado: 'Quieres calcular nota final como 30% del parcial 1 (B2), 30% del parcial 2 (C2) y 40% del final (D2). ¿Cuál fórmula es más clara?'
        opciones:
          - =(B2*0,3)+(C2*0,3)+(D2*0,4)
          - =B2*0,3+C2*0,3+D2*0,4
          - =B2+C2+D2*0,4
          - =B2*0,3*C2*0,3*D2*0,4
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Aunque las dos primeras dan el mismo resultado por PEMDAS, la segunda con paréntesis es más legible y profesional.
        feedback_incorrecto: |-
          La segunda opción con paréntesis explícitos es la más legible. Las dos primeras dan el mismo resultado por PEMDAS, pero la profesional muestra la intención.
      - enunciado: '¿Cuánto da =10/2*5?'
        opciones:
          - "1"
          - "25"
          - "100"
          - "10"
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Multiplicación y división tienen el mismo nivel, se resuelven izquierda a derecha. Primero 10/2=5, después 5*5=25.
        feedback_incorrecto: |-
          La división no tiene prioridad sobre la multiplicación. Se resuelven en orden de izquierda a derecha: 10/2=5, luego 5*5=25.
      - enunciado: 'Tienes precio (B2) sin IVA y quieres calcular precio con IVA de 19%. ¿Cuál fórmula es CORRECTA?'
        opciones:
          - =B2*1+19%
          - =B2+19%
          - =B2*(1+19%)
          - =B2*119
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. =B2*(1+19%) primero calcula 1+0,19=1,19, después multiplica por B2. Aplica el IVA correctamente.
        feedback_incorrecto: |-
          La fórmula correcta es =B2*(1+19%). Los paréntesis aseguran que se sume 1 con el porcentaje antes de multiplicar por el precio.
      - enunciado: '¿Cuál es la regla profesional del PEMDAS cuando dudas del orden?'
        opciones:
          - Usar paréntesis explícitos siempre que ayude a la claridad
          - Memorizar todo el orden
          - Escribir varias fórmulas y elegir la que dé resultado esperado
          - Confiar en que Excel adivine
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Cuando dudes, paréntesis. La phronesis del oficio consiste en privilegiar la claridad sobre la elegancia compacta.
        feedback_incorrecto: |-
          La regla profesional es: cuando dudes, usa paréntesis. Mejor explícito y claro que compacto y ambiguo.
  resumen: |-
    Como el cálculo de la chicha del abuelo: 3 partes de maíz, 1 de panela, después se multiplica por porciones, después se suman especias. El ORDEN no es negociable. Aprendes jerarquía PEMDAS y cálculo de porcentajes correctamente.
  subtema: Excel · Fórmulas compuestas · Jerarquía PEMDAS
  pre_lectura:
    por_que_importa: |-
      Saber escribir fórmulas correctas te servirá para presupuestos, descuentos, IVA, intereses, promedios ponderados. Una fórmula mal hecha en una nómina o cuota escolar afecta a personas reales — cuidar el orden es ética del cálculo.
    pregunta_detonante: |-
      ¿Qué de la receta de la chicha del abuelo — el orden no negociable de pasos — podemos llevar a las fórmulas compuestas?
    activacion:
      titulo: Calcula sin fórmulas
      descripcion: |-
        En 3 minutos: en parejas calculen sin Excel un descuento del 15% sobre $500.000. Comparen las dos respuestas. Si difieren, ¿por qué? El orden importa antes de Excel.
      duracion_min: 5
    conexion:
      anterior: En la sesión 5 aprendiste a anclar referencias con $ para fórmulas reusables.
      siguiente: "En la sesión 7 representarás los datos con gráficos: barras, líneas, circulares."
  post_lectura:
    reflexion: |-
      Pensar el orden antes de calcular es disciplina ancestral. ¿En qué otras decisiones de tu vida el ORDEN cambia el resultado (no solo en fórmulas)?
    transferencia: |-
      Esta semana revisa una factura, un recibo o una cuenta de cafetería. ¿Los descuentos están bien calculados? ¿Hay algún error de orden? Aplica PEMDAS en la vida real.
    cierre: |-
      La receta de la chicha y la fórmula de Excel comparten algo: el orden no es negociable. Equivocarse cuesta dinero, tiempo o sabor.
  cinco_dimensiones:
    personal: |-
      Aprendiste que el orden importa tanto como las operaciones — habilidad cognitiva que aplica a Excel, a la vida, a la cocina.
    emocional: |-
      Resististe la tentación de sumar porcentajes (10% + 20% = 30%) porque entendiste que la matemática real es secuencial, no aditiva.
    ciudadana: |-
      Verificar el orden de cálculo en facturas y promociones es defensa del consumidor. Sabes leer lo que la promoción esconde.
    local: |-
      Heredaste el orden riguroso de la receta de la chicha — cocinar y calcular comparten la misma lógica algorítmica.
    intergeneracional: |-
      La abuela cocinera, el abuelo herrero y tu Excel comparten gramática del orden. Lo que cambia es el medio, no la ley.

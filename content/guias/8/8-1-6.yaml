grado: 8
periodo: 1
sesion: 6
completo: true
duracion_min: 90
titulo: Fórmulas compuestas --- el orden de las operaciones y los paréntesis que lo dicen
titulo_portada: |-
  El orden de
  las operaciones
producto_final: |-
  Una hoja de Excel con cinco fórmulas compuestas reales (nota final ponderada, precio con IVA y descuento, promedio sin el menor valor, entre otras), escritas con paréntesis que dejan claro el orden. Además, tres fórmulas mal escritas a propósito, corregidas y explicadas en una línea, y una prueba final con un cálculo de tu vida real.
apertura:
  origen: Tejedoras wounaan · el werregue, vuelta sobre vuelta
  fuente: |-
    Universidad del Rosario, Facultad de Creación. (2023). \emph{Saberes artesanales: taller de tejeduría en werregue}.
  saber_ancestral: |-
    En las selvas del Chocó, en el litoral del río San Juan, las mujeres wounaan tejen canastos con la fibra de la palma de werregue. La técnica es el \textbf{rollo en espiral}: se empieza por el centro y cada vuelta se cose sobre la anterior, hasta que el canasto cierra. Los diseños cuentan la vida cotidiana, la naturaleza y las creencias del pueblo (Universidad del Rosario, 2023). Fíjate en el orden. No se puede tejer la vuelta de afuera antes que la del centro. No se puede volver a la del medio cuando ya cerraste la de arriba. Cada vuelta depende de la anterior, y el diseño solo aparece si el orden se respeta. Eso es una fórmula compuesta: varias operaciones que solo dan el resultado correcto en un orden. La \textbf{cara de exclusión}: la técnica se enseña hoy en talleres universitarios de Bogotá. La página del taller nombra al pueblo y a la técnica, pero a ninguna tejedora. Hoy vas a escribir fórmulas donde el orden importa tanto como en el canasto, y vas a usar los paréntesis para dejarlo claro.
  saber_contemporaneo: |-
    Excel calcula en un orden fijo. Primero lo que está entre \textbf{paréntesis}. Después las \textbf{potencias}. Después \textbf{multiplicar y dividir}, de izquierda a derecha. Al final \textbf{sumar y restar}, también de izquierda a derecha. Por eso \texttt{=2+3*4} da 14 y no 20: Excel multiplica antes de sumar. Si querías sumar primero, lo escribes: \texttt{=(2+3)*4}. La regla del oficio es corta. Cuando dudes del orden, pon paréntesis. No sobran nunca: le dicen a Excel, y a quien lea tu fórmula, qué se calcula primero. Una fórmula que otra persona entiende sin adivinar el orden es una fórmula bien escrita.
  pregunta_puente: |-
    La tejedora wounaan no puede cerrar la vuelta de afuera antes que la del centro. Cuando escribas \texttt{=B2*1+19~\%} para el IVA, ¿qué vuelta cerró Excel primero? ¿Era la que tú querías?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} en qué orden calcula Excel una fórmula con varios operadores; (2) \textbf{aplicar} paréntesis para que el orden sea el que necesitas; (3) \textbf{analizar} por qué una fórmula da un resultado distinto del esperado; (4) \textbf{evaluar} si una fórmula ajena se entiende sin adivinar el orden.
puentes:
  a_ruta: |-
    En la sesión 5 aprendiste a copiar fórmulas sin romperlas. Hoy aprendes a escribirlas cuando tienen varias operaciones. En la sesión 7 vas a graficar lo que calcules, y un gráfico sobre una fórmula mal ordenada engaña sin que nadie lo note.
  a_escuta: |-
    Antes de la teoría, vas a calcular tres expresiones a mano y después en Excel. Si algún resultado no coincide, ahí está la lección del día.
  a_sistematizacion: |-
    Ya viste que el orden cambia el resultado. Ahora entiendes los cuatro niveles del orden, y con tu pareja escribes cinco fórmulas reales con paréntesis que lo dejen claro.
  a_praxis: |-
    Ya escribes fórmulas claras. Toca corregir las de otro: tres fórmulas mal escritas, una prueba con un cálculo de tu vida y la revisión de la fórmula de tu pareja.
  a_producto: |-
    Lo que entregas hoy: cinco fórmulas con paréntesis, tres corregidas con su explicación y una prueba real. La prueba de calidad: tu pareja lee cada fórmula y dice en voz alta qué se calcula primero, sin equivocarse.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un paréntesis es una forma de respeto: le ahorra a quien lee la fórmula tener que adivinar lo que pensaste.
  a_triangulo: |-
    Para terminar, tres ideas sobre hacer las cosas en orden, contadas con palabras de esta guía: Dussel sobre la tecnología como oficio que se piensa mientras se hace, Epicteto sobre decir solo lo necesario, Floridi sobre el orden por defecto que no siempre es el tuyo.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- A mano y en Excel} (15 min · individual). (1) Calcula a mano, con calculadora o en el cuaderno, estas tres expresiones: \texttt{2+3*4}, \texttt{(2+3)*4} y \texttt{20-6/2}. (2) Anota tus tres respuestas. (3) Abre Excel y escribe las tres como fórmulas, con el signo igual adelante. (4) Compara tus respuestas con las de Excel. (5) Si alguna no coincide, escribe cuál y qué crees que calculó Excel primero.
  checks:
  - Tengo las tres respuestas a mano y las tres de Excel.
  - Sé cuál no coincidió, si alguna, y por qué.
  - Puedo decir qué calcula Excel primero en 2+3*4.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- A mano y en Excel». \textbf{Formato:} tabla de 3 filas y 3 columnas (expresión / mi resultado / resultado de Excel). \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las tres filas están llenas y escribiste en una línea qué calcula Excel primero.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- Cinco fórmulas reales con paréntesis} (30 min · parejas). (1) Con tu pareja, abran una hoja nueva y escriban tres notas parciales en B2, C2 y D2. (2) Escriban la nota final ponderada: \texttt{=(B2*0,3)+(C2*0,3)+(D2*0,4)}. Prueben con 3,0 en las tres: debe dar 3,0. (3) Escriban un precio en B5, un descuento en D5 y el IVA en E5. Calculen el precio final: \texttt{=B5*(1-D5)*(1+E5)}. (4) Escriban cinco valores en B8:F8 y calculen el promedio sin el menor: \texttt{=(SUMA(B8:F8)-MIN(B8:F8))/4}. (5) Inventen dos fórmulas más de su vida real, con al menos dos operadores y paréntesis, y pruébenlas con un caso que ya sepan.
  pilares:
  - |-
    \textbf{Los cuatro niveles del orden.} Primero los paréntesis, de adentro hacia afuera. Segundo las potencias. Tercero multiplicar y dividir, de izquierda a derecha: \texttt{10/2*5} es 25, no 1. Cuarto sumar y restar, de izquierda a derecha.
  - |-
    \textbf{Los paréntesis dicen lo que pensaste.} \texttt{=B2*0,3+C2*0,3+D2*0,4} da bien por el orden de Excel. \texttt{=(B2*0,3)+(C2*0,3)+(D2*0,4)} da lo mismo y cualquiera lo lee. Cuando el orden que quieres no es el de Excel, los paréntesis son obligatorios. Cuando sí lo es, siguen ayudando a leer.
  - |-
    \textbf{Prueba con un caso que ya sabes.} Si la nota final con 3,0 en las tres notas no da 3,0, la fórmula está mal. Si el precio con 0~\% de descuento y 0~\% de IVA no da el precio base, la fórmula está mal. Un caso conocido delata el orden equivocado antes de que llegue a un gráfico.
  - |-
    \textbf{Léela en voz alta.} «Primero multiplico cada nota por su peso, después sumo las tres.» Si la frase sale limpia, la fórmula está bien ordenada. Si tienes que decir «bueno, en realidad Excel hace…», falta un paréntesis.
  anatomia:
    titulo: El orden de Excel, en una mirada
    body: |-
      \textbf{1. Paréntesis:} lo de adentro primero. \\[1mm] \textbf{2. Potencias.} \\[1mm] \textbf{3. Multiplicar y dividir:} de izquierda a derecha. \\[1mm] \textbf{4. Sumar y restar:} de izquierda a derecha. \\[1mm] \textbf{Duda:} pon paréntesis.
  errores_comunes: |-
    (1) \textbf{Creer que se suma antes de multiplicar}: \texttt{=2+3*4} es 14. (2) \textbf{Restar en el numerador sin paréntesis}: \texttt{=A2-B2/C2} divide primero; para restar primero es \texttt{=(A2-B2)/C2}. (3) \textbf{IVA mal aplicado}: \texttt{=B2*1+19~\%} suma 0,19 al final; lo correcto es \texttt{=B2*(1+19~\%)}. (4) \textbf{Dividir entre lo que no es}: \texttt{=SUMA(B2:F2)-MIN(B2:F2)/4} divide solo el mínimo. (5) \textbf{No probar con un caso conocido}: el error llega intacto al gráfico.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- Cinco fórmulas con paréntesis». \textbf{Formato:} tabla de 5 filas y 3 columnas (qué calcula / fórmula escrita / caso de prueba y resultado). \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cinco fórmulas tienen su caso de prueba y las cinco dieron lo esperado.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Tres fórmulas rotas y una prueba real} (25 min · individual). (1) Copia estas tres fórmulas mal escritas: \texttt{=A2-B2/C2} cuando se quería restar primero; \texttt{=B2*1+19~\%} para el IVA; \texttt{=SUMA(B2:F2)-MIN(B2:F2)/4} para el promedio sin el menor. (2) Escribe al lado de cada una qué calculó Excel primero y por qué salió mal. (3) Corrígelas con paréntesis. (4) Haz una prueba real: un cálculo de tu vida con al menos dos operadores. Por ejemplo, el gasto del mes en transporte y tienda, o lo que queda de la mesada. (5) Lee la fórmula de tu pareja y di en voz alta qué se calcula primero; anota si acertaste.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) Las cinco fórmulas de la Actividad 2 con su caso de prueba. (2) Las tres fórmulas corregidas, cada una con una línea que diga por qué fallaba. (3) La prueba real con su fórmula y su resultado.
  - |-
    \textbf{Cómo se explica una fórmula rota.} «Excel dividió B2 entre C2 antes de restar, porque dividir va antes que restar. Yo quería restar primero. Solución: paréntesis en la resta.» Tres frases: qué hizo Excel, qué quería yo, qué cambié.
  - |-
    \textbf{La prueba real vale más que el ejemplo.} Un cálculo de tu mesada, de tu transporte o de tu tiempo de pantalla te obliga a decidir el orden de verdad. Escribe primero la frase en palabras y después la fórmula.
  - |-
    \textbf{Evaluar la fórmula de tu pareja.} Léela sin que te la explique y di qué se calcula primero. Si tuviste que adivinar, le falta un paréntesis. Díselo con la razón, no con el adjetivo.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Cinco fórmulas con paréntesis y su caso de prueba. \\[1mm] \checkbox Tres fórmulas corregidas con una línea de explicación cada una. \\[1mm] \checkbox Una prueba real escrita primero en palabras y después en fórmula. \\[1mm] \checkbox Leí la fórmula de mi pareja y dije qué se calcula primero. \\[1mm] \checkbox Hoja guardada como G8-P1-S6-formulas.xlsx.
  plantilla_guion: |-
    \textbf{Nota final.} \textit{=(B2*0,3)+(C2*0,3)+(D2*0,4)} \\[1mm] \textbf{Precio final.} \textit{=B5*(1-D5)*(1+E5)} \\[1mm] \textbf{Promedio sin el menor.} \textit{=(SUMA(B8:F8)-MIN(B8:F8))/4} \\[1mm] \textbf{Fórmula rota.} \textit{Qué hizo Excel, qué quería yo, qué cambié.} \\[1mm] \textbf{Prueba real.} \textit{Primero la frase, después la fórmula.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Tres fórmulas rotas y una prueba real». \textbf{Formato:} tabla de 3 filas y 3 columnas (fórmula rota / qué calculó Excel primero / fórmula corregida), más la prueba real en palabras y en fórmula. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las tres corregidas dan el resultado esperado y tu pareja leyó tu prueba real sin adivinar el orden.
  producto_titulo: Cinco fórmulas con paréntesis + tres corregidas y explicadas + una prueba real
  criterios:
  - Las cinco fórmulas tienen paréntesis que dejan claro el orden y un caso de prueba que dio bien
  - Las tres fórmulas rotas están corregidas y cada una tiene una línea que dice por qué fallaba
  - La prueba real está escrita primero en palabras y después en fórmula
  - Tu pareja leyó una fórmula tuya y dijo qué se calcula primero sin adivinar
  - La hoja está guardada con nombre claro
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.3.2.4
    idea: |-
      La tecnología no es teoría aplicada: es un oficio que se piensa mientras se hace.
    aplicacion: |-
      Nadie aprende el orden de las operaciones de memoria y ya. Se aprende cuando una fórmula da 14 en vez de 20 y tienes que averiguar por qué. La tejedora tampoco aprende el rollo en un libro: lo aprende vuelta por vuelta.
    pregunta_espejo: |-
      ¿Qué entendí hoy porque una fórmula me salió mal, y no porque me lo dijeron?
  estoico:
    autor: Epicteto · Enquiridión, 33 (c. 125 d.C.)
    idea: |-
      Guarda silencio cuando puedas y di solo lo necesario, con pocas palabras.
    aplicacion: |-
      Un paréntesis es decir lo necesario: no adorna, aclara. Una fórmula con los paréntesis justos se lee de una vez. Una sin ellos obliga a adivinar. Una con paréntesis de más también cansa.
    pregunta_espejo: |-
      ¿Mis paréntesis dicen lo necesario, o puse de más porque no estaba seguro?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6
    idea: |-
      Las configuraciones por defecto de una tecnología deberían respetar a la persona que la usa.
    aplicacion: |-
      El orden por defecto de Excel es una configuración: multiplica antes de sumar aunque tú no lo hayas pedido. Conocerlo es lo que te permite decidir tú, con paréntesis, en vez de dejar que la máquina decida por ti.
    pregunta_espejo: |-
      ¿En qué otra herramienta acepto un «por defecto» que no elegí?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus cinco fórmulas, las tres corregidas y la prueba real. En la sesión 7 vas a hacer gráficos de barras, de líneas y circulares, y a aprender cuándo un gráfico engaña. Lo que calculaste hoy es lo que vas a graficar.
web:
  resumen: |-
    Excel calcula en un orden fijo y una fórmula con varias operaciones solo da bien si respetas ese orden o lo cambias con paréntesis. Hoy escribes fórmulas reales que cualquiera puede leer, como la tejedora wounaan que cierra el canasto vuelta por vuelta.
  subtema: Análisis de datos con phronesis
  pre_lectura:
    por_que_importa: |-
      Un IVA mal ordenado en una fórmula cobra de más o de menos y nadie lo nota hasta que alguien revisa la cuenta. Saber el orden de las operaciones te sirve en Excel, en la calculadora y en cualquier programa.
    pregunta_detonante: |-
      Cuando escribas =B2*1+19 % para el IVA, ¿qué calculó Excel primero? ¿Era lo que querías?
    activacion:
      titulo: Catorce o veinte
      descripcion: |-
        En 2 minutos, escribe en Excel =2+3*4 y al lado =(2+3)*4. ¿Por qué no dan lo mismo? Explícalo en una frase.
      duracion_min: 5
    conexion:
      anterior: En la sesión 5 copiaste fórmulas sin romperlas con referencias relativas y absolutas.
      siguiente: En la sesión 7 graficas lo que calculaste y aprendes cuándo un gráfico engaña.

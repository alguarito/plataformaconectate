clave: 1-7
grado: 8
periodo: 1
sesion: 7
completo: true
duracion_min: 90
titulo: Gráficos que no engañan --- barras, líneas y circular con el eje en cero
titulo_portada: |-
  Gráficos que
  no engañan
producto_final: |-
  Una hoja de Excel con tres gráficos del mismo conjunto de datos, de barras, de líneas y circular, cada uno con título, ejes con unidades y el eje vertical desde cero. Un párrafo por gráfico que diga qué pregunta responde mejor. Y la crítica de un gráfico engañoso real, de prensa o de redes, con la trampa identificada y la corrección propuesta.
apertura:
  origen: Riosucio (Caldas) · dos plazas y una cerca
  fuente: |-
    Ministerio de Cultura de Colombia. (2011). \emph{Plan Especial de Salvaguardia del Carnaval de Riosucio}, pp. 12--13, 20 y 41.
  saber_ancestral: |-
    Riosucio, en Caldas, nació de dos pueblos que no se querían. Quiebralomo, de mineros blancos, negros y mulatos, y La Montaña, de indígenas. Cada uno puso su plaza y su iglesia a una cuadra del otro. Entre las dos levantaron una cerca que los separó durante más de veinte años; los días de mercado se insultaban de lado a lado (Ministerio de Cultura, 2011). En 1846 un decreto los fusionó, y de aquellos insultos salió el verso burlón que hoy es el Carnaval. Fíjate en la cerca. La misma ciudad, vista desde una plaza, era un pueblo; vista desde la otra, era otro. Un gráfico hace lo mismo con los datos. Los mismos números, con el eje empezando en cero, cuentan una historia; con el eje empezando en 50, cuentan otra. La \textbf{cara de exclusión}: el relato oficial del Eje Cafetero se contó como el de colonos blancos y respetables. Ese relato dejó por fuera a los indígenas y a los negros que ya estaban ahí (Appelbaum, 2007). Hoy vas a hacer gráficos que no levanten cercas: que dejen ver los datos como son.
  saber_contemporaneo: |-
    Un gráfico es una forma de contar los datos con la vista. Las \textbf{barras} comparan valores entre categorías: ventas por día, notas por estudiante. Las \textbf{líneas} muestran cómo cambia algo en el tiempo: temperatura por día, ventas por mes. El \textbf{circular} muestra qué parte del total es cada cosa, y solo sirve con pocas categorías. Cada tipo responde una pregunta distinta. Pero incluso el tipo correcto puede engañar. Un eje vertical que empieza en 50 en vez de cero hace que una diferencia de dos puntos parezca enorme. Un efecto 3D cambia las proporciones. Un circular con diez tajadas no se lee. Un gráfico sin título ni unidades se interpreta como cada quien quiera. Un gráfico honesto tiene cinco cosas: el tipo según la pregunta, el eje desde cero, título que diga qué muestra, ejes con unidades y la fuente de los datos.
  pregunta_puente: |-
    Desde cada plaza, Riosucio parecía otro pueblo. Cuando hagas un gráfico de las notas del salón con el eje empezando en 3,0, ¿qué pueblo le estás mostrando a quien lo mira? ¿Y cómo se vería con el eje en cero?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué tipo de gráfico responde cada pregunta; (2) \textbf{crear} tres gráficos honestos en Excel sobre el mismo conjunto; (3) \textbf{analizar} cuál de los tres comunica mejor y por qué; (4) \textbf{evaluar} un gráfico real de prensa o de redes y decir qué trampa usa.
puentes:
  a_ruta: |-
    En la sesión 6 escribiste fórmulas que se leen sin adivinar el orden. Hoy conviertes cifras en gráficos que se leen sin engaño. En la sesión 8 vas a hacer que la hoja avise sola cuando un valor se sale de rango.
  a_escuta: |-
    Antes de hacer gráficos, vas a mirar tres que te entrega tu docente y a decir cuál entiendes, cuál exagera y cuál confunde. Solo mirar.
  a_sistematizacion: |-
    Ya viste que el mismo dato se puede mostrar de tres maneras. Ahora aprendes los tres tipos, las cinco reglas de un gráfico honesto, y con tu pareja construyes los tres sobre tu tabla.
  a_praxis: |-
    Ya sabes construir. Toca criticar: buscas un gráfico engañoso de verdad, nombras la trampa y propones cómo arreglarlo. Y revisas los gráficos de tu pareja con las cinco reglas.
  a_producto: |-
    Lo que entregas hoy: tres gráficos honestos con su párrafo, y la crítica de uno engañoso. La prueba de calidad: tu pareja lee cada gráfico sin que le expliques nada y dice qué muestra.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un gráfico con el eje en cero es una forma de respeto por quien lo mira: no le levanta una cerca entre lo que ve y lo que es.
  a_triangulo: |-
    Para terminar, tres ideas sobre mostrar sin engañar, contadas con palabras de esta guía: Dussel sobre la información que nunca es neutral, Epicteto sobre describir antes de juzgar, Floridi sobre dar sentido a lo que asusta.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tres gráficos, un solo dato} (15 min · individual). (1) Mira los tres gráficos que proyecta tu docente: son los mismos datos, dibujados de tres maneras. Uno de barras con el eje en cero, uno de barras con el eje empezando alto, y uno circular en 3D con ocho tajadas. (2) Escribe cuál entiendes mejor a primera vista. (3) Escribe cuál parece exagerar las diferencias y por qué. (4) Escribe cuál confunde más que aclara. (5) Anota una regla que sacarías de lo que viste.
  checks:
  - Escribí cuál gráfico entiendo mejor y por qué.
  - Encontré el que exagera y dije qué lo hace exagerar.
  - Saqué una regla propia de lo que vi.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Tres gráficos, un solo dato». \textbf{Formato:} tabla de 3 filas y 2 columnas (gráfico / qué me hace ver o creer), más una regla propia. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las tres filas están llenas y tu regla dice algo que un compañero podría aplicar.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · CREA --- Tres gráficos honestos sobre tu tabla} (30 min · parejas). (1) Con tu pareja, abran la tabla limpia de la sesión 3. Elijan una columna numérica con su categoría, por ejemplo ventas por día o notas por estudiante. (2) Seleccionen el rango, Insertar, Gráfico, y hagan uno de barras. (3) Con los mismos datos hagan uno de líneas y uno circular. (4) A cada uno pónganle título que diga qué muestra, ejes con unidades y eje vertical desde cero. (5) Escriban un párrafo por gráfico: qué pregunta responde mejor y por qué.
  pilares:
  - |-
    \textbf{Los tres tipos.} Barras para comparar categorías: ¿quién vendió más? Líneas para ver cambios en el tiempo: ¿cómo cambió de lunes a viernes? Circular para partes de un total: ¿qué parte de la plata se fue en tienda? Con más de seis tajadas, el circular no se lee.
  - |-
    \textbf{Las seis trampas.} Eje vertical que no empieza en cero. Escalas distintas en gráficos que se comparan. Efecto 3D que cambia las proporciones. Demasiadas categorías. Colores que sugieren un orden que no existe. Sin título, sin unidades o sin fuente.
  - |-
    \textbf{Las cinco reglas del gráfico honesto.} (1) Tipo según la pregunta. (2) Eje vertical desde cero en las barras. (3) Título que diga qué muestra. (4) Ejes con unidades. (5) Fuente de los datos. Si una falta, el gráfico deja de ser un dato y se vuelve una opinión.
  - |-
    \textbf{Cómo se hace en Excel.} Selecciona el rango con su encabezado. Insertar, Gráficos, y elige el tipo. Clic derecho en el eje vertical, Dar formato al eje, y pon el mínimo en cero. Doble clic en el título para escribirlo. Léelo en voz alta: si necesitas explicarlo, le falta algo.
  anatomia:
    titulo: El gráfico honesto, en una mirada
    body: |-
      \textbf{Tipo:} según la pregunta. \\[1mm] \textbf{Eje vertical:} desde cero. \\[1mm] \textbf{Título:} qué muestra. \\[1mm] \textbf{Ejes:} con unidades. \\[1mm] \textbf{Fuente:} de dónde salen los datos.
  errores_comunes: |-
    (1) \textbf{Eje que empieza alto}: una diferencia de dos puntos parece de veinte. (2) \textbf{3D}: las tajadas de adelante se ven más grandes de lo que son. (3) \textbf{Circular con muchas categorías}: nadie distingue las tajadas. (4) \textbf{Líneas para datos sin orden en el tiempo}: la línea sugiere una tendencia que no existe. (5) \textbf{Sin título ni unidades}: cada quien lee lo que quiere.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · CREA).} \textbf{Título:} «Actividad 2 --- Tres gráficos honestos». \textbf{Formato:} tres párrafos de tres líneas, uno por gráfico, con la pregunta que responde mejor; y una marca de cuál de los tres eligieron como el mejor para esos datos. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} los tres gráficos cumplen las cinco reglas y los tres párrafos nombran una pregunta distinta.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Un gráfico engañoso de verdad} (25 min · individual). (1) Busca un gráfico en un periódico, una revista, una publicidad o una red social. Si no hay conexión, tu docente trae varios. (2) Pásalo por las cinco reglas y marca cuáles cumple y cuáles no. (3) Nombra la trampa: cuál de las seis usa. (4) Escribe qué impresión falsa deja en quien lo mira. (5) Propón la corrección: qué cambio pequeño lo haría honesto. (6) Revisa los tres gráficos de tu pareja con las cinco reglas y anota lo que falte.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) Los tres gráficos con sus párrafos. (2) La crítica del gráfico engañoso: trampa, impresión falsa y corrección. (3) La revisión de los gráficos de tu pareja con las cinco reglas.
  - |-
    \textbf{Cómo se critica un gráfico.} Primero se describe: qué muestra, qué tipo es, dónde empieza el eje. Después se nombra la trampa. Al final se propone el cambio. Describir antes de juzgar evita acusar a un gráfico que solo estaba mal hecho.
  - |-
    \textbf{La corrección es pequeña.} Casi siempre basta con una cosa: el eje a cero, quitar el 3D, agrupar tajadas, poner el título. Si tu corrección exige rehacer todo, probablemente no encontraste la trampa principal.
  - |-
    \textbf{Revisar al otro con las reglas, no con el gusto.} «Me gusta más el azul» no es una revisión. «El eje empieza en 2,5 y hace ver la diferencia más grande de lo que es» sí lo es.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tres gráficos del mismo conjunto: barras, líneas y circular. \\[1mm] \checkbox Cada uno con título, unidades, fuente y eje vertical desde cero. \\[1mm] \checkbox Un párrafo por gráfico con la pregunta que responde mejor. \\[1mm] \checkbox Un gráfico engañoso real con trampa, impresión falsa y corrección. \\[1mm] \checkbox Revisión de los gráficos de mi pareja con las cinco reglas. \\[1mm] \checkbox Hoja guardada como G8-P1-S7-graficos.xlsx.
  plantilla_guion: |-
    \textbf{Barras.} \textit{Responde mejor: ¿quién tiene más?} \\[1mm] \textbf{Líneas.} \textit{Responde mejor: ¿cómo cambió en el tiempo?} \\[1mm] \textbf{Circular.} \textit{Responde mejor: ¿qué parte del total?} \\[1mm] \textbf{Gráfico engañoso.} \textit{Trampa, impresión falsa, corrección.} \\[1mm] \textbf{Revisión.} \textit{Regla que le falta al gráfico de mi pareja.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Un gráfico engañoso de verdad». \textbf{Formato:} el gráfico pegado o dibujado, más tres líneas (trampa / impresión falsa / corrección), más la lista de reglas que le faltan a los gráficos de tu pareja. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} nombraste la trampa con una de las seis, tu corrección cabe en una línea, y tu pareja recibió al menos una regla que le faltaba.
  producto_titulo: Tres gráficos honestos con su párrafo + crítica de un gráfico engañoso real
  criterios:
  - Los tres gráficos son del mismo conjunto y cumplen las cinco reglas
  - Cada párrafo nombra una pregunta distinta que ese tipo responde mejor
  - La crítica nombra una de las seis trampas y propone una corrección concreta
  - Revisaste los gráficos de tu pareja con las cinco reglas, no con el gusto
  - La hoja está guardada con nombre claro
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.2.5.4
    idea: |-
      Es ingenuo creer que la información se lee sola, como si no hubiera conflictos detrás de cada dato.
    aplicacion: |-
      Un gráfico con el eje en 50 no es un error inocente: alguien decidió dónde empezar. En Riosucio, la cerca también la puso alguien. Preguntar quién decidió el eje es leer el gráfico de verdad.
    pregunta_espejo: |-
      ¿Quién decidió dónde empieza el eje del gráfico que vi hoy, y qué ganaba con eso?
  estoico:
    autor: Epicteto · Enquiridión, 45 (c. 125 d.C.)
    idea: |-
      Cuando alguien se baña rápido, no digas que se baña mal: di que se baña rápido. Describe el hecho antes de juzgarlo.
    aplicacion: |-
      Antes de decir «este gráfico engaña», describe: qué tipo es, dónde empieza el eje, cuántas tajadas tiene. La descripción es la que te permite nombrar la trampa sin equivocarte.
    pregunta_espejo: |-
      ¿Describí el gráfico antes de juzgarlo, o juzgué primero y describí después?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), Prefacio
    idea: |-
      Tememos y rechazamos aquello a lo que no logramos darle sentido.
    aplicacion: |-
      Un buen gráfico le da sentido a doscientas filas en un vistazo. Uno malo asusta o confunde, y la gente reacciona al miedo, no al dato. Hacer gráficos honestos es ayudar a otros a entender antes de reaccionar.
    pregunta_espejo: |-
      ¿Mi gráfico le da sentido al dato, o solo lo hace ver grande?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus tres gráficos y la crítica del engañoso. En la sesión 8 vas a hacer que la hoja avise sola con colores cuando un valor se sale de rango. Y que rechace los datos que no deben entrar.
web:
  resumen: |-
    Los mismos datos cuentan historias distintas según cómo se dibujen. Hoy haces tres gráficos honestos y desmontas uno engañoso de verdad, con la cerca de Riosucio como advertencia.
  subtema: Análisis de datos con phronesis
  pre_lectura:
    por_que_importa: |-
      Casi todos los gráficos que ves en redes y en noticias tienen alguna decisión escondida. Saber dónde empieza el eje te protege de creer lo que alguien quiere que creas.
    pregunta_detonante: |-
      Cuando hagas un gráfico de las notas con el eje empezando en 3,0, ¿qué le estás mostrando a quien lo mira?
    activacion:
      titulo: El eje que empieza en 48
      descripcion: |-
        En 3 minutos, escribe dos valores en Excel, 50 y 52, haz un gráfico de barras y cambia el mínimo del eje a 48. ¿Qué tan grande parece ahora la diferencia? Vuelve a cero y compara.
      duracion_min: 5
    conexion:
      anterior: En la sesión 6 escribiste fórmulas compuestas con paréntesis claros.
      siguiente: En la sesión 8 la hoja avisa sola con formato condicional y validación de datos.

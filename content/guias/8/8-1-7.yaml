clave: 1-7
grado: 8
periodo: 1
sesion: 7
completo: true
titulo: Gráficos básicos --- barras, líneas y circulares con honestidad visual
titulo_portada: |-
  Gráficos básicos ---
  barras, líneas y circulares
  con honestidad visual
producto_final: |-
  Hoja Excel con (a) 3 gráficos distintos (barras, líneas, circular) hechos sobre el mismo conjunto de datos, (b) análisis escrito de cuál de los 3 comunica mejor según el propósito (comparar valores, mostrar tendencia en el tiempo, mostrar proporciones del total), (c) crítica de 1 gráfico engañoso real (sacado de prensa, redes sociales o publicidad) explicando cuál es el truco visual usado y cómo se debería corregir
apertura:
  saber_ancestral: |-
    En la galería del mercado del centro de Cartago había una imagen que cualquier comprador esperaba ver antes de cerrar una compra: \textbf{la pesa a la vista}. La balanza romana de hierro, vieja y rayada, se colocaba sobre el cajón en posición visible. El pregonero subía el racimo de plátanos al plato, movía el contrapeso, y dejaba que el cliente leyera la cifra antes de declarar el precio. \emph{``Cinco kilos justos, vea''}, decía señalando con el dedo. Esa pesa visible era \textbf{prueba de honestidad}: el cliente miraba con sus propios ojos. Pero también existía la otra pesa: la \textbf{pesa trucada}. Algunos vendedores la modificaban con un trapo bajo el plato, un imán en la base, un contrapeso desbalanceado. La pesa trucada se veía igual a la honesta. La denuncia popular era constante: \emph{``ese tendero tiene pesa con malicia''}, decían las abuelas. La sabiduría del mercado distinguía con precisión entre la pesa que muestra y la pesa que engaña. Esa misma distinción aplica a los gráficos: \textbf{hay gráficos honestos que muestran y gráficos engañosos que esconden}, y elegir entre los dos es decisión ética del oficio.
  origen: Pictografías y esquemas tradicionales del Valle, los Andes y el Pacífico colombiano
  saber_contemporaneo: |-
    Un \textbf{gráfico} en Excel es una representación visual de datos: barras para comparar valores, líneas para mostrar evolución en el tiempo, circulares (pastel) para mostrar proporciones del total. La regla profesional moderna es famosa: \textbf{cada tipo de gráfico responde una pregunta distinta}, y elegir mal el tipo distorsiona la comunicación. Pero más allá del tipo, hay \textbf{trampas visuales} que aparecen incluso con gráficos correctamente elegidos: ejes Y que no empiezan en cero (exageran diferencias pequeñas), escalas truncadas (esconden valores extremos), colores que sugieren orden donde no lo hay, gráficos circulares con más de 6 categorías (imposibles de leer), 3D que distorsiona proporciones. La \textbf{honestidad visual} es la disciplina del analista que muestra la pesa de Cartago: hacer gráficos que el lector pueda interpretar con sus propios ojos, sin trucos.
  pregunta_puente: |-
    ¿Qué sabía el comprador del mercado al exigir ver la pesa antes de pagar, que el lector moderno olvida cuando acepta un gráfico de prensa sin mirar el eje Y? ¿Y por qué el mismo conjunto de datos puede contar dos historias opuestas según el tipo de gráfico elegido?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuál de los 3 tipos de gráfico (barras, líneas, circular) responde mejor a una pregunta concreta; (2) \textbf{analizar} las trampas visuales más comunes (eje truncado, 3D engañoso, escala manipulada); (3) \textbf{crear} 3 gráficos honestos sobre un mismo conjunto en Excel, eligiendo el tipo según el propósito; (4) \textbf{evaluar} críticamente un gráfico engañoso del mundo real explicando el truco y cómo corregirlo.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 4-6 aprendiste a calcular con honestidad. Hoy aprendes a \emph{comunicar} esos cálculos con honestidad visual. Las sesiones 8 (formato condicional), 9 (mini-estudio) y 10 (sustentación) usarán esta habilidad de comunicar visualmente lo que dicen los datos.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{auditoría rápida} de gráficos: tu docente proyecta 3 gráficos distintos (uno honesto, uno con eje truncado, uno con 3D engañoso) y tú anotas qué te llama la atención de cada uno. Es ejercicio de mirada crítica antes de aprender a construir.
  a_sistematizacion: |-
    Ya viste los 3 ejemplos. Ahora vas a entender la \textbf{anatomía de los 3 tipos básicos}: cuándo usar cada uno, las 6 trampas visuales más comunes, los 5 principios de honestidad visual.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: construyes 3 gráficos distintos del mismo conjunto (notas, gastos, asistencia), analizas cuál comunica mejor según la pregunta, y al final criticas un gráfico engañoso real que encuentres en prensa o redes.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 3 gráficos honestos + análisis de cuál comunica mejor + crítica de 1 gráfico engañoso. El criterio principal: que tus gráficos sean tan honestos que el lector pueda leer la cifra sin tu explicación.
  a_evaluacion: |-
    Antes de cerrar, mira los gráficos desde las cinco dimensiones humanas. Mostrar la pesa es respeto por el lector; manipular la escala es engaño con apariencia técnica.
  a_triangulo: |-
    Y para terminar, tres voces sobre la honestidad visual. Dussel sobre los gráficos que engañan a quien menos puede verificarlos, Marco Aurelio sobre mostrar las cosas como son, Floridi sobre la ética de la información visualizada.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Auditoría de 3 gráficos} (15 min · individual). Tu docente proyecta o entrega 3 gráficos sobre los mismos datos: (a) un gráfico de barras con eje Y que empieza en cero (honesto), (b) un gráfico de barras con eje Y que empieza en un valor alto (parece exagerar diferencias), (c) un gráfico circular en 3D con 8 categorías (difícil de leer). Sin todavía calcular nada, anota: (1) ¿cuál entiendes mejor a primera vista?, (2) ¿alguno parece exagerar las diferencias?, (3) ¿alguno parece confundir más que aclarar?. La regla: \textbf{si un gráfico te confunde a primera vista, probablemente está manipulado}.
  checks:
  - Miré los 3 gráficos sin leer la explicación.
  - Identifiqué cuál es el más claro y cuál confunde.
  - Detecté al menos 1 trampa visual.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Auditoría de 3 gráficos». \textbf{Formato:} ficha con 3 líneas (gráfico A, B, C) y observaciones de claridad/engaño por cada uno. \textbf{Sabes que terminaste cuando} puedes nombrar qué hace bien y qué hace mal cada gráfico antes de la teoría.
sistematizacion:
  intro: |-
    Auditar gráficos sin teoría es intuición; auditar con teoría es oficio profesional. Para que tu mirada crítica tenga base necesitas la \textbf{anatomía de los 3 tipos básicos} y las trampas visuales más usadas.
  pilares:
  - |-
    Los 3 tipos básicos se descomponen así: (1) \textbf{Barras}: comparar valores entre categorías (ventas por día, notas por estudiante, gastos por mes). Las barras horizontales o verticales muestran cuál es más grande visualmente. (2) \textbf{Líneas}: mostrar evolución de un valor en el tiempo (temperatura por día, ventas por mes, tasa de aprobación por año). Las líneas conectan puntos en orden cronológico. (3) \textbf{Circular} (pastel): mostrar proporción del total (qué \% del presupuesto va a cada categoría). Solo funciona con pocas categorías (3-6) y cuando la suma tiene sentido conceptual.
  - |-
    Las 6 trampas visuales más comunes son: (a) \textbf{Eje Y truncado}: empezar el eje en un valor distinto de cero exagera diferencias pequeñas (2 barras que difieren en 2\% parecen diferir en 50\%). (b) \textbf{Escala manipulada}: usar escalas distintas en gráficos comparativos. (c) \textbf{3D engañoso}: el efecto 3D distorsiona las proporciones reales. (d) \textbf{Demasiadas categorías}: un gráfico circular con 10 categorías es ilegible. (e) \textbf{Colores manipulativos}: rojo para lo malo y verde para lo bueno cuando los datos son neutros. (f) \textbf{Sin título ni etiquetas}: el gráfico se interpreta a voluntad del lector.
  - |-
    Los 5 principios de honestidad visual: (1) \textbf{Eje Y desde cero} en gráficos de barras (salvo justificación explícita). (2) \textbf{Título descriptivo} que diga qué muestra el gráfico. (3) \textbf{Etiquetas de ejes claras} con unidades. (4) \textbf{Tipo correcto según el propósito} (no usar circular para comparar valores absolutos). (5) \textbf{Fuente declarada} de los datos. Estos 5 principios son la pesa de Cartago aplicada al gráfico digital.
  - |-
    Algoritmo: (1) define qué pregunta quieres responder con el gráfico (comparar, mostrar tendencia, mostrar proporción). (2) elige el tipo correcto. (3) inserta el gráfico en Excel (Insertar → Gráficos). (4) verifica eje Y desde cero. (5) agrega título descriptivo y etiquetas claras. (6) lee el gráfico en voz alta para verificar que se entiende sin tu explicación.
  anatomia:
    titulo: Anatomía de los 3 tipos
    body: |-
      \textbf{Barras:} comparar valores entre categorías. \\[1mm] \textbf{Líneas:} mostrar evolución en el tiempo. \\[1mm] \textbf{Circular:} mostrar proporciones (máx. 6 categorías). \\[1mm] \textbf{Honestidad:} eje Y desde cero, título claro, sin 3D engañoso.
  errores_comunes: |-
    (1) \textbf{Eje Y truncado}: la diferencia de 2\% parece 50\%. (2) \textbf{3D que distorsiona}: las proporciones cambian con el ángulo. (3) \textbf{Gráfico circular con muchas categorías}: ilegible con más de 6. (4) \textbf{Tipo equivocado}: usar circular para comparar valores absolutos en lugar de proporciones. (5) \textbf{Sin título}: el gráfico se interpreta libremente. (6) \textbf{Sin fuente}: imposible verificar los datos. (7) \textbf{Colores arbitrarios}: usar rojo y verde sin justificación cromática.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía de los 3 tipos». \textbf{Formato:} (a) tabla con 3 tipos y su uso; (b) las 6 trampas con marca de la que más temes; (c) los 5 principios escritos. \textbf{Sabes que terminaste cuando} podrías auditar cualquier gráfico de prensa con criterio profesional.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- 3 gráficos honestos + crítica de 1 engañoso} (35 min · individual). Hora de construir y criticar. Eliges un conjunto de datos (la tabla limpia de la sesión 3 sirve, o uno nuevo), construyes 3 gráficos distintos del mismo conjunto, analizas cuál comunica mejor para una pregunta, y cierras criticando 1 gráfico engañoso real.
  pilares:
  - |-
    Tu entrega se construye en 4 pasos: (1) elegir un conjunto de datos del entorno escolar (notas semanales, ventas de tienda, asistencia). (2) construir 3 gráficos: uno de barras, uno de líneas, uno circular. (3) escribir 1 párrafo por gráfico explicando qué pregunta responde mejor y por qué. (4) buscar 1 gráfico engañoso (prensa, redes, publicidad), pegarlo a tu informe, identificar el truco y proponer cómo corregirlo.
  - |-
    Sigue el patrón \textbf{``tipo según pregunta''}: si la pregunta es \emph{``¿quién vendió más?''} = barras. Si es \emph{``¿cómo cambió en el tiempo?''} = líneas. Si es \emph{``¿qué proporción del total?''} = circular. Forzar el tipo equivocado (usar líneas para datos sin orden temporal, circular para muchas categorías) produce comunicación opaca.
  - |-
    La crítica del gráfico engañoso se estructura en 3 piezas: (a) \textbf{Trampa identificada}: cuál de las 6 trampas usa. (b) \textbf{Por qué engaña}: qué impresión falsa genera al lector. (c) \textbf{Cómo corregirlo}: qué cambio simple lo haría honesto (eje desde cero, quitar 3D, agregar título, etc.).
  - |-
    Algoritmo: (1) preparar datos. (2) seleccionar el rango y Insertar → Gráfico. (3) elegir el tipo. (4) configurar eje Y desde cero. (5) agregar título descriptivo. (6) probar la lectura en voz alta. (7) repetir para los 3 tipos. (8) buscar gráfico engañoso en prensa. (9) analizar trampa. (10) escribir crítica.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 3 gráficos creados sobre el mismo conjunto. \\[1mm] \checkbox Cada gráfico con título descriptivo y ejes etiquetados. \\[1mm] \checkbox Eje Y desde cero en barras y líneas. \\[1mm] \checkbox Gráfico circular con máximo 6 categorías. \\[1mm] \checkbox Sin efecto 3D que distorsione. \\[1mm] \checkbox Párrafo por gráfico justificando el tipo. \\[1mm] \checkbox 1 gráfico engañoso analizado con trampa, impacto y corrección.
  plantilla_guion: |-
    \textbf{Gráfico 1 (barras).} \textit{Pregunta que responde + por qué barras.} \\[1mm] \textbf{Gráfico 2 (líneas).} \textit{Pregunta que responde + por qué líneas.} \\[1mm] \textbf{Gráfico 3 (circular).} \textit{Pregunta que responde + por qué circular.} \\[1mm] \textbf{Crítica del gráfico engañoso.} \textit{Trampa + impacto + corrección.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- 3 gráficos + crítica». \textbf{Formato:} (a) capturas de los 3 gráficos pegadas o dibujadas; (b) párrafo por cada uno; (c) crítica del engañoso con las 3 piezas. \textbf{Sabes que terminaste cuando} podrías mostrar tus gráficos a un familiar y entendería lo que dicen sin tu explicación.
  producto_titulo: 3 gráficos honestos + análisis + crítica de 1 engañoso
  criterios:
  - 3 gráficos del mismo conjunto (barras, líneas, circular)
  - Eje Y desde cero en barras y líneas
  - Títulos y etiquetas claras
  - Tipo correcto según la pregunta
  - Crítica de 1 gráfico engañoso con trampa identificada
  - Propuesta de corrección al gráfico engañoso
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El gráfico engañoso aprovecha a quien menos puede verificarlo; mostrar la pesa visible es ética con quien no tiene tiempo de calcular.
    aplicacion: |-
      Cuando un periódico publica un gráfico engañoso, las víctimas son los lectores que no tienen tiempo de revisar los ejes. La filosofía de la liberación pide ese tipo de cuidado: hacer gráficos que el lector más apurado pueda leer correctamente. La pesa visible del mercado de Cartago tenía esa función social: democratizar la verificación. Tu gráfico honesto también: hacer que cualquiera, sin entrenamiento, pueda leer la verdad de los datos.
    pregunta_espejo: |-
      ¿Mi gráfico está pensado para que cualquiera lo entienda, o solo lo entiende quien ya conoce los datos?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Muestra las cosas como son; el gráfico engañoso es vanidad disfrazada de comunicación.
    aplicacion: |-
      Es tentador hacer gráficos espectaculares que exageren las diferencias \emph{``para que se note el efecto''}. La disciplina estoica recomienda lo opuesto: \emph{muestra las cosas como son}. Si la diferencia es pequeña, el gráfico debe mostrarla pequeña. Si es grande, el gráfico la mostrará grande sin trampas. La virtud técnica está en la fidelidad, no en la dramatización.
    pregunta_espejo: |-
      ¿Mi gráfico muestra los datos como son, o estoy exagerando la diferencia para que se vea más impactante?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La visualización honesta de datos es la nueva ética del oficio digital en la era de la información veloz.
    aplicacion: |-
      En la era de la información, los gráficos circulan más rápido que los datos crudos. La gente comparte gráficos sin verificar los ejes. La ética digital contemporánea exige que quien produce gráficos respete esa velocidad de circulación: producir gráficos que sigan siendo honestos aunque se compartan sin contexto. Tu hoja de hoy te entrena en esa práctica.
    pregunta_espejo: |-
      Si mi gráfico se compartiera en redes sociales sin mi explicación, ¿seguiría siendo honesto?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus 3 gráficos hechos y la crítica del gráfico engañoso. En la sesión 8 vas a aprender \textbf{formato condicional} para que tu hoja Excel avise visualmente cuando hay valores fuera de rango (notas bajas, gastos altos, errores de tipo). Los gráficos de hoy son la pesa visible; el formato condicional de mañana es el semáforo del mercado.
web:
  conceptos_clave:
    - termino: Gráfico de barras
      definicion: |-
        Visualización que compara valores entre categorías. Cada barra representa una categoría y su altura el valor. Responde "¿quién es más?".
      ejemplo: |-
        Para comparar gastos por categoría (transporte, comida, ocio) en un mes, las barras muestran cuál fue mayor de un vistazo.
      emoji: "📊"
    - termino: Gráfico de líneas
      definicion: |-
        Visualización que muestra evolución de un valor en el tiempo. Los puntos conectados en orden cronológico revelan tendencia.
      ejemplo: |-
        Para ver cómo cambió la temperatura del aula a lo largo de la semana, las líneas conectan cada día y muestran si sube o baja.
      emoji: "📈"
    - termino: Gráfico circular
      definicion: |-
        Visualización que muestra proporción de cada parte respecto al total. Cada porción de pastel representa un porcentaje del 100%.
      ejemplo: |-
        Para ver qué porcentaje de tus egresos fue alimentación vs transporte vs otros, el circular lo muestra como porciones de un pastel.
      emoji: "🥧"
    - termino: Honestidad visual
      definicion: |-
        Conjunto de principios que aseguran que el gráfico comunica datos como son, no manipulados. Incluye eje Y desde cero, escala consistente, sin 3D engañoso.
      ejemplo: |-
        Un gráfico de barras con eje Y empezando en 0 muestra diferencias reales. Si empieza en 50, exagera diferencias pequeñas.
      emoji: "⚖️"
    - termino: Eje Y desde cero
      definicion: |-
        Principio profesional: en gráficos de barras, el eje vertical debe empezar en cero salvo justificación explícita. De lo contrario, exagera diferencias.
      ejemplo: |-
        Si comparas ventas de 100 y 110 con eje desde 95, la barra de 110 parece el doble de grande. Desde 0, se ve la diferencia real (10%).
      emoji: "0️⃣"
  quiz:
    titulo: ¿Sabes elegir y leer gráficos honestos?
    instrucciones: 5 preguntas para verificar que distingues los 3 tipos básicos y reconoces honestidad visual.
    preguntas:
      - enunciado: '¿Cuál gráfico usas para comparar la cantidad gastada en cada categoría (transporte, alimentación, ocio)?'
        opciones:
          - Líneas
          - Barras
          - Cualquiera funciona igual
          - Circular si quieres proporciones, barras si quieres comparar valores absolutos
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. Si comparas valores absolutos (¿cuál es mayor?), barras. Si comparas proporciones (¿qué % del total?), circular.
        feedback_incorrecto: |-
          Depende: para valores absolutos, barras. Para proporciones del total, circular. La elección importa.
      - enunciado: 'Una publicidad muestra que las tasas de interés bajaron de 19% a 18,5%. El gráfico hace parecer que bajaron a la mitad. ¿Qué truco usan?'
        opciones:
          - Tipo de gráfico equivocado
          - Demasiados colores
          - Eje Y truncado (no empieza en cero)
          - Sin título
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Si el eje Y empieza en 18, la barra de 18,5 parece el doble de pequeña que la de 19. Desde 0, la diferencia se ve como lo que es: pequeña.
        feedback_incorrecto: |-
          El truco más común es eje Y truncado. Cambiar el origen del eje exagera diferencias pequeñas.
      - enunciado: '¿Para qué tipo de pregunta es ideal el gráfico circular (pastel)?'
        opciones:
          - ¿Qué porcentaje del total representa cada categoría?
          - ¿Cómo cambió la cifra en el tiempo?
          - ¿Cuál es el valor exacto de cada categoría?
          - ¿Cuál es el mínimo y máximo?
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Circular responde "¿qué porción del total?". Para evolución temporal usa líneas; para valores exactos usa barras.
        feedback_incorrecto: |-
          El circular es para proporciones del total. Para evolución usa líneas; para comparar valores exactos, barras.
      - enunciado: '¿Cuántas categorías máximo conviene tener en un gráfico circular?'
        opciones:
          - 10-15
          - 3-6
          - Más de 20
          - No hay límite
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Con más de 6 categorías el circular se vuelve ilegible. Para muchas categorías, mejor barras horizontales.
        feedback_incorrecto: |-
          Máximo 3-6 categorías en circular. Más de eso, las porciones son demasiado pequeñas para leer bien.
      - enunciado: 'Aplicando la sabiduría del pregonero del mercado, ¿qué hace un gráfico honesto?'
        opciones:
          - Muestra los datos como son sin trucos
          - Exagera diferencias para llamar la atención
          - Usa 3D para verse moderno
          - Esconde valores incómodos
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. La pesa visible del pregonero es prueba pública de honestidad. El gráfico honesto hace lo mismo: muestra sin manipular.
        feedback_incorrecto: |-
          El gráfico honesto muestra los datos como son. Las otras opciones describen manipulaciones, no honestidad visual.
  resumen: |-
    Como el cuento gráfico del abuelo o las pictografías ancestrales: el dibujo cuenta lo que la cifra esconde. Aprendes a elegir el tipo de gráfico según la pregunta y a detectar gráficos engañosos.
  subtema: Excel · Gráficos · Comunicación visual honesta
  pre_lectura:
    por_que_importa: |-
      Vivimos rodeados de gráficos: en redes, noticias, redes sociales. Saber leerlos críticamente y producirlos honestamente te protege de manipulación y te permite comunicar la verdad con claridad.
    pregunta_detonante: |-
      ¿Qué del cuento gráfico del abuelo — la traducción de cifras a imagen viva — podemos llevar a un gráfico digital que cuente bien?
    activacion:
      titulo: El gráfico engañoso
      descripcion: |-
        En 5 minutos: busca en tu celular un gráfico de redes o noticias. Identifica si el eje empieza en 0, si tiene título claro, si los colores tienen sentido. ¿Comunica honesto o engaña?
      duracion_min: 5
    conexion:
      anterior: En la sesión 6 aprendiste fórmulas compuestas con jerarquía PEMDAS.
      siguiente: En la sesión 8 aplicarás formato condicional y validación a tus tablas.
  post_lectura:
    reflexion: |-
      Cada gráfico que produces es una decisión sobre cómo cuentas la verdad. ¿En qué situaciones la elección visual cambia la conclusión que el lector saca?
    transferencia: |-
      Esta semana: revisa 3 gráficos en redes o noticias. Identifica si el eje empieza en 0, si tiene fuente, si el tipo es apropiado. Comparte con un compañero los engaños que detectes.
    cierre: |-
      El cuento gráfico del abuelo y tu gráfico de Excel comparten propósito: hacer visible lo invisible. Cuidar el medio es cuidar la verdad.
  cinco_dimensiones:
    personal: |-
      Aprendiste a elegir el tipo de gráfico según la pregunta — habilidad de comunicador honesto, no decorador de datos.
    emocional: Reconociste la tentación del gráfico vistoso que oculta — y elegiste claridad sobre espectáculo.
    ciudadana: |-
      Tu ojo crítico ante gráficos de noticias y publicidad es defensa contra la desinformación visual cotidiana.
    local: |-
      Heredaste la lógica de la pictografía ancestral: hacer visible lo invisible con honestidad, no con efecto.
    intergeneracional: |-
      El dibujo en arena del pescador y tu gráfico de Excel comparten ética: el medio es responsable de la verdad que comunica.

clave: 1-8
grado: 8
periodo: 1
sesion: 8
completo: true
titulo: Formato condicional y validación de datos --- alertas visibles
titulo_portada: |-
  Formato condicional
  y validación ---
  alertas visibles
producto_final: |-
  Hoja Excel con (a) formato condicional aplicado a 3 columnas distintas (notas con escala de colores rojo-amarillo-verde, gastos resaltando los que superan un umbral, asistencia marcando los faltistas) + (b) validación de datos aplicada a 2 columnas (rango numérico permitido, lista desplegable) + (c) simulación de 5 intentos de ingresar datos incorrectos donde el sistema bloquea con mensaje claro
apertura:
  saber_ancestral: |-
    En la galería del centro de Cartago había una figura silenciosa que sostenía la paz del mercado: \textbf{el celador}. Pero la verdadera vigilancia no la hacía él solo: la hacían \textbf{las señales del color}. Las puertas de las galerías tenían un sistema antiguo de banderas y luces para avisar de cosas que estaban por pasar antes de que pasaran. \textbf{Bandera roja arriba}: cuidado, hay pelea o robo en una galería. \textbf{Bandera verde}: todo en calma, pueden seguir entrando compradores. \textbf{Bandera amarilla}: cuidado moderado, está lloviendo y los pisos están resbalosos. El sistema funcionaba sin gritos ni alarmas estridentes: \textbf{el color avisaba antes de que pasara el problema}, y los comerciantes y compradores podían ajustar su comportamiento. Si alguien intentaba entrar con un costal demasiado grande que iba a tumbar pilas, los celadores levantaban una mano antes de que el desastre ocurriera. \textbf{El semáforo del mercado avisaba con color antes del problema, no después}. Esa sabiduría preventiva es la phronesis del aviso a tiempo.
  origen: Salón comunal del barrio y códigos visuales comunitarios del Valle
  saber_contemporaneo: |-
    El \textbf{formato condicional} en Excel es exactamente ese semáforo aplicado a la hoja de cálculo: \textbf{le decimos a Excel qué color aplicar según el valor de la celda}, y Excel pinta automáticamente. Si una nota es menor a 3, fondo rojo. Si una nota es entre 3 y 4, fondo amarillo. Si es mayor a 4, fondo verde. La hoja se convierte en un tablero visual que comunica el estado sin que tengas que leer fila por fila. Acompaña al formato condicional la \textbf{validación de datos}: una herramienta que \textbf{impide} ingresar datos incorrectos. Si una columna debe contener notas entre 0 y 5, la validación rechaza valores fuera de ese rango con un mensaje al usuario. Si una columna debe ser una de 3 categorías (\emph{Aprobado, Reprobado, Pendiente}), la validación ofrece una lista desplegable. Las dos herramientas trabajan juntas: \textbf{validación previene errores; formato condicional resalta los que ya están}.
  pregunta_puente: |-
    ¿Qué sabía el celador del mercado al usar banderas de color para avisar antes del problema, que el novato olvida cuando solo revisa la hoja después de cometer el error? ¿Y por qué una hoja con formato condicional puede comunicar el estado del grupo sin que el docente lea fila por fila?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} en qué columnas de tu tabla tiene sentido aplicar formato condicional y por qué; (2) \textbf{aplicar} las 3 reglas más útiles de formato condicional (escalas de color, resaltar valores fuera de umbral, marcar duplicados); (3) \textbf{analizar} qué errores aparecen cuando el usuario ingresa datos sin validación; (4) \textbf{evaluar} el funcionamiento de la validación probando con 5 intentos de error bloqueados.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 7 aprendiste a comunicar visualmente con gráficos. Hoy aprendes a \emph{comunicar visualmente dentro de la propia tabla}: el formato condicional convierte la hoja en tablero, la validación impide errores. La sesión 9 (mini-estudio) y 10 (sustentación) usarán hojas que se autoexplican visualmente.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{experimento simple}: aplicas una regla básica de formato condicional a una columna de notas (notas menores a 3 en rojo) y observas el cambio visual. La diferencia entre la hoja gris y la hoja con semáforo te enseña antes que la teoría.
  a_sistematizacion: |-
    Ya viste el efecto. Ahora vas a entender la \textbf{anatomía del formato condicional y la validación}: las 3 reglas más útiles, la diferencia entre escala de colores y barras, las 4 reglas de validación (rango, lista, longitud, fórmula personalizada).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: en una hoja real (la de la sesión 3 o nueva) aplicas formato condicional a 3 columnas distintas, validación a 2, y simulas 5 intentos de error para verificar que el sistema bloquea correctamente.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: hoja con formato condicional en 3 columnas + validación en 2 + simulación de 5 errores bloqueados. El criterio principal: que un docente abriendo tu hoja pueda ver el estado del grupo de un vistazo, sin tener que leer celda por celda.
  a_evaluacion: |-
    Antes de cerrar, mira las alertas desde las cinco dimensiones humanas. Avisar a tiempo con color es respeto por el usuario; dejar que cometa errores sin avisar es negligencia técnica.
  a_triangulo: |-
    Y para terminar, tres voces sobre la prevención y el aviso. Dussel sobre las alertas que cuidan a quien va a equivocarse, Epicteto sobre la disciplina de prevenir antes que corregir, Floridi sobre los sistemas informacionales que asisten al usuario.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Experimento del semáforo} (15 min · individual). Abre la tabla de notas de tu grupo (o crea una con 10 notas inventadas, mezclando aprobadas y reprobadas). Selecciona la columna de notas. Ve a Inicio → Formato condicional → Reglas para resaltar celdas → Menor que → escribe \texttt{3} → elige Relleno rojo. Observa qué celdas se ponen rojas automáticamente. Después aplica otra regla: Mayor que 4 → Relleno verde. Observa el cambio. Antes había una columna gris; ahora tienes un semáforo visual. Anota qué información obtienes en 2 segundos viendo la hoja, que antes te tomaba 30 segundos leer fila por fila.
  checks:
  - Apliqué Formato condicional a una columna de notas.
  - Vi el cambio visual del antes y el después.
  - Identifiqué qué información se comunica más rápido con color.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Experimento del semáforo». \textbf{Formato:} ficha con (a) la regla aplicada (menor que 3 = rojo), (b) qué se ve antes y qué después, (c) 1 línea sobre cómo el color cambia la lectura. \textbf{Sabes que terminaste cuando} el color te dice algo antes de que leas el número.
sistematizacion:
  intro: |-
    El experimento te enseñó qué hace el formato condicional. Ahora necesitas la \textbf{anatomía profesional de las herramientas}: las 3 reglas más útiles de formato condicional, las 4 reglas de validación, y cómo se combinan para construir hojas que se cuidan solas.
  pilares:
  - |-
    Las 3 reglas más útiles de \textbf{formato condicional} se descomponen así: (1) \textbf{Resaltar valores que cumplen condición}: mayor que X, menor que X, entre X y Y, igual a X, texto que contiene X. Ej. notas menores a 3 en rojo. (2) \textbf{Escala de colores}: aplica gradiente automático según rango (verde para altos, amarillo para medios, rojo para bajos). Ideal para columnas de notas, temperaturas, porcentajes. (3) \textbf{Barras de datos}: dentro de cada celda aparece una barra proporcional al valor. Permite comparar visualmente sin gráfico aparte.
  - |-
    Las 4 reglas más útiles de \textbf{validación de datos} (Datos → Validación de datos): (a) \textbf{Número entero o decimal entre X y Y}: rechaza valores fuera del rango. Ej. notas entre 0 y 5. (b) \textbf{Lista desplegable}: muestra opciones predefinidas, impide otras. Ej. Aprobado/Reprobado/Pendiente. (c) \textbf{Longitud de texto}: limita caracteres. Ej. máximo 50 letras en el nombre. (d) \textbf{Fórmula personalizada}: condición compleja escrita como fórmula. Ej. \texttt{=Y(A2>=0;A2<=5)} para notas entre 0 y 5 con dos condiciones.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué problemas quiero prevenir y cuáles quiero resaltar?}. Los problemas que se pueden prevenir van a \textbf{Validación de datos} (no dejar que el usuario los cometa). Los problemas que ya están en los datos y conviene resaltar van a \textbf{Formato condicional} (mostrarlos visualmente para acción).
  - |-
    Algoritmo: (1) revisa tu tabla y lista qué columnas tienen reglas naturales (notas 0-5, edades positivas, fechas dentro de un periodo). (2) aplica Validación a esas columnas para prevenir errores. (3) lista qué columnas conviene resaltar visualmente (notas bajas, gastos altos, faltas excesivas). (4) aplica Formato condicional con la regla apropiada. (5) prueba el sistema intentando ingresar valores incorrectos.
  anatomia:
    titulo: Anatomía del formato condicional y la validación
    body: |-
      \textbf{Formato condicional:} resalta valores existentes. \\[1mm] \textbf{Validación:} previene valores incorrectos. \\[1mm] \textbf{3 reglas de formato:} resaltar / escala / barras. \\[1mm] \textbf{4 reglas de validación:} rango / lista / longitud / fórmula. \\[1mm] \textbf{Combinación:} validación previene + formato resalta.
  errores_comunes: |-
    (1) \textbf{Aplicar formato condicional a toda la hoja}: ralentiza Excel y pierde claridad. (2) \textbf{Validación sin mensaje}: el usuario rechaza el valor sin entender por qué; siempre poner mensaje de error explicativo. (3) \textbf{Colores arbitrarios}: usar rosado y morado cuando el rojo-amarillo-verde es el código universal. (4) \textbf{Reglas que se sobreescriben}: aplicar varias reglas a la misma columna sin verificar prioridades. (5) \textbf{Validación que no se aplica a celdas ya llenas}: la validación solo opera en celdas nuevas; los datos viejos quedan sin validar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía formato + validación». \textbf{Formato:} (a) las 3 reglas de formato condicional con su uso; (b) las 4 reglas de validación con ejemplo; (c) los 5 errores comunes con marca del que más temes. \textbf{Sabes que terminaste cuando} sabes cuál herramienta usar para cada situación.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- Hoja completa con alertas} (35 min · individual). Hora de aplicar. Construyes una hoja con 3 columnas con formato condicional, 2 con validación, y simulas 5 intentos de error para verificar que el sistema bloquea correctamente.
  pilares:
  - |-
    Tu hoja se construye en 4 pasos: (1) preparar la tabla con al menos 15 registros y 5 columnas (Nombre, Notas P1, Notas P2, Gastos semana, Asistencia). (2) aplicar formato condicional a 3 columnas (Notas P1 con escala roja-amarilla-verde, Gastos con resalte mayor a un umbral, Asistencia marcando faltistas). (3) aplicar validación a 2 columnas (notas entre 0 y 5, Asistencia con lista desplegable Asistió/Faltó/Justificado). (4) simular 5 intentos de error y documentar la respuesta del sistema (mensaje de validación, formato aplicado).
  - |-
    Sigue el patrón \textbf{``prevenir + resaltar''}: las dos herramientas no se sustituyen, se complementan. Validación impide errores nuevos; formato condicional resalta los que ya están y guía la atención del usuario. La phronesis del oficio digital consiste en \textbf{construir sistemas que cuiden al usuario sin ser hostiles}.
  - |-
    Los mensajes de validación siguen estructura mínima: (a) \textbf{Título}: nombre breve del problema (\emph{``Nota fuera de rango''}). (b) \textbf{Mensaje}: explicación clara (\emph{``La nota debe estar entre 0 y 5''}). (c) \textbf{Estilo}: detener (rechaza el valor), advertir (permite continuar con aviso), información (solo informa). Para datos críticos usar Detener; para reglas opcionales usar Advertir.
  - |-
    Algoritmo: (1) preparar tabla. (2) aplicar formato condicional a 3 columnas con reglas claras. (3) aplicar validación a 2 columnas con mensajes explicativos. (4) probar el sistema intentando ingresar 5 valores incorrectos. (5) documentar la respuesta del sistema (captura de mensaje, captura de formato). (6) ajustar reglas si alguna no funciona como esperabas.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Tabla con al menos 15 registros. \\[1mm] \checkbox Formato condicional en 3 columnas con reglas distintas. \\[1mm] \checkbox Validación en 2 columnas con mensaje explicativo. \\[1mm] \checkbox Simulación de 5 intentos de error documentada con captura. \\[1mm] \checkbox Mensajes de validación con título + mensaje + estilo. \\[1mm] \checkbox Colores siguen código universal (rojo-amarillo-verde).
  plantilla_guion: |-
    \textbf{Columna 1 (Notas P1).} \textit{Escala roja-amarilla-verde + validación 0-5.} \\[1mm] \textbf{Columna 2 (Notas P2).} \textit{Resalte menor a 3 en rojo.} \\[1mm] \textbf{Columna 3 (Gastos).} \textit{Resalte mayor a 20.000 en naranja.} \\[1mm] \textbf{Columna 4 (Asistencia).} \textit{Lista desplegable + formato condicional por valor.} \\[1mm] \textbf{Simulación.} \textit{5 intentos de error con captura de respuesta.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- Hoja con alertas». \textbf{Formato:} (a) referencia al archivo Excel; (b) tabla 3 filas con cada regla de formato aplicada; (c) tabla 2 filas con cada validación; (d) capturas de los 5 intentos de error bloqueados. \textbf{Sabes que terminaste cuando} la hoja se cuida sola contra errores comunes.
  producto_titulo: Hoja con formato condicional + validación + 5 errores bloqueados
  criterios:
  - Formato condicional en 3 columnas con reglas distintas
  - Validación en 2 columnas con mensaje explicativo
  - 5 intentos de error simulados y bloqueados
  - Colores siguen código universal
  - Documentación visual de las 5 simulaciones
  - Hoja guardada con nombre claro
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Avisar a tiempo es cuidado; dejar que el otro se equivoque y después corregir es desprecio disfrazado de neutralidad.
    aplicacion: |-
      Cuando aplicas validación a una columna, no estás siendo controlador: estás cuidando al usuario futuro de la hoja. La filosofía de la liberación pide ese cuidado preventivo: avisar antes del error, no después. La validación con mensaje claro respeta al usuario; la validación sin mensaje (que rechaza el valor sin explicar) es violencia técnica. La phronesis del sistema consiste en \textbf{prevenir con dignidad}.
    pregunta_espejo: |-
      ¿Mis mensajes de validación cuidan al usuario explicando, o lo bloquean sin razón clara?
  estoico:
    autor: Epicteto
    cita: |-
      Prevenir es disciplina; corregir es servidumbre del error.
    aplicacion: |-
      Es tentador no usar validación porque \emph{``ya después corrijo''}. La disciplina estoica recomienda lo opuesto: \emph{previene, no esperes a corregir}. Cada error que evitas con validación es una corrección manual que no harás después. La phronesis del oficio consiste en \textbf{invertir 5 minutos en validación para ahorrar horas de corrección manual}.
    pregunta_espejo: |-
      ¿Estoy previniendo errores con validación, o asumo que después los corregiré uno por uno?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los sistemas que asisten al usuario son la nueva ética del oficio digital.
    aplicacion: |-
      En la era de la información, las hojas Excel circulan: una hoja se comparte con compañeros, padres, docentes. Un sistema que asiste al usuario (con formato condicional que guía la lectura, validación que previene errores) es respeto por esa circulación. Tu hoja de hoy te entrena en una práctica que rige toda profesión que produzca herramientas digitales para otros.
    pregunta_espejo: |-
      ¿Mi hoja asiste al usuario o lo deja solo frente al error?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu hoja con formato condicional y validación funcionando. En la sesión 9 vas a aplicar todo lo aprendido (preguntas prudentes, tipos, limpieza, funciones, fórmulas, gráficos, alertas) en un \textbf{mini-estudio de datos del entorno escolar} en 8 etapas. Es la integración del periodo.
web:
  conceptos_clave:
    - termino: Formato condicional
      definicion: |-
        Función de Excel que aplica color a celdas automáticamente según el valor. Convierte la hoja en tablero visual sin necesidad de gráfico aparte.
      ejemplo: |-
        Notas menores a 3 en rojo, entre 3 y 4 en amarillo, mayores a 4 en verde. El docente ve el estado del grupo de un vistazo.
      emoji: "🚦"
      categoria: Cómo se resalta
    - termino: Escala de colores
      definicion: |-
        Variante de formato condicional que aplica gradiente automático (verde-amarillo-rojo) a un rango. Útil para visualizar magnitudes relativas.
      ejemplo: |-
        Aplicar escala de colores a temperaturas semanales muestra los días más calientes en rojo y los más fríos en azul automáticamente.
      emoji: "🌈"
    - termino: Validación de datos
      definicion: |-
        Función que impide ingresar valores incorrectos en una celda. Rechaza entrada y muestra mensaje al usuario antes del error.
      ejemplo: |-
        Una columna de notas configurada con validación 0-5 rechaza si alguien escribe 7 o -1, evitando errores estructurales.
      emoji: "🛡"
      categoria: Cómo se restringe
    - termino: Lista desplegable
      definicion: |-
        Tipo de validación que ofrece opciones predefinidas y solo acepta esas. Asegura consistencia en categorías.
      ejemplo: |-
        Columna Estado con lista desplegable [Aprobado, Reprobado, Pendiente] evita variantes como "aprobado", "APROBADO" o errores de tipeo.
      emoji: "📋"
      categoria: Cómo se restringe
    - termino: Prevenir vs resaltar
      definicion: |-
        Distinción profesional: validación previene errores futuros (al entrar el dato); formato condicional resalta los que ya existen (visualizar lo presente).
      ejemplo: |-
        Validación impide poner edad de 200 años; formato condicional resalta si alguna edad existente es mayor a 18 años para fines del filtro.
      emoji: "⚖️"
  quiz:
    titulo: ¿Sabes prevenir y resaltar errores con Excel?
    instrucciones: 5 preguntas para verificar que distingues formato condicional de validación de datos.
    preguntas:
      - enunciado: '¿Qué hace el formato condicional?'
        opciones:
          - Aplica color a celdas según su valor automáticamente
          - Impide ingresar valores incorrectos
          - Cambia el tipo de dato de la celda
          - Calcula promedios
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Formato condicional pinta automáticamente las celdas según reglas que tú defines. Es visualización sin gráfico aparte.
        feedback_incorrecto: |-
          Formato condicional aplica color a celdas según su valor. No impide ingresos (eso es validación). No cambia tipo. No calcula.
      - enunciado: '¿Qué hace la validación de datos?'
        opciones:
          - Pinta celdas con color
          - Impide ingresar valores fuera de un criterio definido
          - Calcula totales
          - Genera gráficos
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Validación previene errores rechazando entradas que no cumplen la regla (rango, lista, longitud, fórmula).
        feedback_incorrecto: |-
          Validación impide ingresar valores incorrectos antes de que ocurra el error. No pinta (eso es formato condicional).
      - enunciado: 'Quieres que la columna Estado solo acepte "Aprobado", "Reprobado" o "Pendiente". ¿Qué herramienta usas?'
        opciones:
          - Formato condicional
          - Función SUMA
          - Validación con lista desplegable
          - Tabla pivote
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Validación con lista desplegable ofrece esas 3 opciones y rechaza cualquier otra entrada.
        feedback_incorrecto: |-
          La solución es validación con lista desplegable. Garantiza que solo se ingresen las 3 opciones predefinidas.
      - enunciado: 'Sabiduría del semáforo del mercado: ¿qué hace el formato condicional con color verde-amarillo-rojo?'
        opciones:
          - Decora la hoja para que se vea bonita
          - Solo funciona en hojas grandes
          - Cambia el tipo de dato
          - Avisa visualmente del estado antes de que el lector lea cada número
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. El semáforo del mercado avisa con color antes del problema. El formato condicional hace lo mismo: comunica estado visualmente.
        feedback_incorrecto: |-
          El formato condicional avisa visualmente, igual que el semáforo del mercado. No es decoración: es comunicación rápida.
      - enunciado: '¿Cuál es la diferencia clave entre validación y formato condicional?'
        opciones:
          - Validación es para texto, formato para números
          - Validación previene errores futuros; formato resalta los presentes
          - Son lo mismo con nombre distinto
          - Validación es para gráficos
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Validación previene en la entrada; formato resalta lo que ya hay. Son complementarias, no equivalentes.
        feedback_incorrecto: |-
          Validación previene errores futuros al impedir entrada; formato condicional resalta los que ya existen. Trabajan juntas.
  resumen: |-
    Como el semáforo del salón comunal: tres colores, tres reglas, todos las entienden. Aprendes a aplicar formato condicional (color por valor) y validación de datos (qué se puede escribir).
  subtema: Excel · Formato condicional · Validación · Protección
  pre_lectura:
    por_que_importa: |-
      Las hojas profesionales tienen reglas que ayudan al usuario y previenen errores. Estas dos herramientas (formato condicional + validación) separan una plantilla amateur de una corporativa. Ahorran horas de corrección y mejoran la lectura.
    pregunta_detonante: |-
      ¿Qué del semáforo del salón comunal — disciplina visual heredada — podemos llevar a la hoja de Excel para que ayude a leer y a no equivocarse?
    activacion:
      titulo: El error que se podría evitar
      descripcion: |-
        En 5 minutos: piensa en una hoja de Excel que hayas visto donde alguien escribió mal y dañó los cálculos. ¿Qué validación habría evitado el error? Comparte con un compañero.
      duracion_min: 5
    conexion:
      anterior: En la sesión 7 elegiste el gráfico correcto según la pregunta.
      siguiente: En la sesión 9 aplicarás todo a un mini-estudio del entorno escolar.
  post_lectura:
    reflexion: |-
      El semáforo y la validación son ambos disciplinas comunitarias para prevenir errores. ¿En qué otros ámbitos de tu vida valdría la pena diseñar "validaciones" antes de los problemas?
    transferencia: |-
      Esta semana: en una hoja real (lista, presupuesto, registro), aplica al menos UNA validación de datos y UN formato condicional. Documenta qué error previniste.
    cierre: |-
      La hoja autovalidada es semáforo digital: cuida al usuario antes de que se equivoque. Es ética del diseño aplicada a la herramienta cotidiana.
  cinco_dimensiones:
    personal: |-
      Aprendiste a diseñar herramientas que cuidan al usuario — habilidad profesional rara, valiosa, transferible a cualquier sistema.
    emocional: |-
      Resististe la lógica del "ya está, que el usuario se cuide" y elegiste la disciplina del diseño preventivo.
    ciudadana: |-
      Diseñar con validación es respetar a quien recibe la herramienta. Esa ética escala: de Excel a sistemas públicos, a apps, a leyes.
    local: |-
      Heredaste la lógica del semáforo del salón comunal — tres reglas claras que cuidan a todos, no solo a los expertos.
    intergeneracional: |-
      Los códigos visuales comunitarios que la abuela entendía sin leer son los mismos que el formato condicional automatiza hoy.

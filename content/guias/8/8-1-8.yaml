clave: 1-8
grado: 8
periodo: 1
sesion: 8
completo: true
duracion_min: 90
titulo: Alertas visibles --- formato condicional y validación de datos
titulo_portada: |-
  Alertas
  visibles
producto_final: |-
  Una hoja de Excel con formato condicional en tres columnas (notas con escala de colores, gastos que pasan un límite, faltas marcadas) y validación de datos en dos columnas (rango permitido y lista desplegable). Además, cinco intentos de meter datos incorrectos, con la captura del mensaje que los rechaza.
apertura:
  origen: Pueblo nasa · el tul y sus plantas frías, calientes, dulces y bravas
  fuente: |-
    Prieto Novoa, F. N. y León-Sicard, T. E. (2024). Actores y redes en la configuración del agroecosistema Tul Nasa en los resguardos indígenas de Toribío, Tacueyó y San Francisco en el departamento del Cauca, Colombia. \emph{Luna Azul}, (59), 53--77.
  saber_ancestral: |-
    En los resguardos nasa de Toribío, Tacueyó y San Francisco, en el Cauca, la huerta de la casa se llama \textbf{tul}. No es un cultivo: es «la casa grande», donde conviven muchas especies bajo normas de equilibrio (Prieto Novoa y León-Sicard, 2024). Cada planta pertenece a una categoría: \textbf{fría, caliente, dulce o brava}. Y se siembra según esa categoría, para que unas no dañen a otras. Una planta no puede ser «más o menos caliente»: es de una categoría o de otra, y el tul funciona porque nadie mete una planta donde no va. Eso es una lista de valores válidos. En Excel se llama validación de datos, y el color que avisa cuando algo se sale de su sitio se llama formato condicional. La \textbf{cara de exclusión}: el estudio encontró que solo el 43~\% de las familias mantiene el tul. La escuela foránea, las tecnologías agrícolas modernas y los cultivos ilícitos lo van borrando. Hoy vas a construir una hoja que, como el tul, solo admite lo que pertenece y avisa cuando algo se sale.
  saber_contemporaneo: |-
    Excel tiene dos herramientas que cuidan tu tabla. La \textbf{validación de datos} impide que entre lo que no debe: si una columna es de notas, solo acepta valores entre 0 y 5; si es de asistencia, solo acepta lo que está en una lista, como Presente, Ausente o Excusa. Cuando alguien intenta otra cosa, la hoja muestra un mensaje y rechaza el dato. El \textbf{formato condicional} pinta las celdas según su valor: nota menor que 3 en rojo, entre 3 y 4 en amarillo, mayor que 4 en verde. La hoja se vuelve un tablero que avisa sin que leas fila por fila. Las dos trabajan juntas. La validación previene el error antes de que entre. El formato condicional resalta el que ya está.
  pregunta_puente: |-
    En el tul no se siembra una planta caliente donde va una fría, y nadie tiene que revisarlo después. Cuando alguien escriba «cinco punto cinco» en la columna de notas, ¿tu hoja lo deja pasar? ¿Y cómo te avisa de una nota de 1,0 en una lista de treinta?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué columnas de una tabla tienen reglas naturales, como notas de 0 a 5; (2) \textbf{aplicar} formato condicional y validación de datos con mensajes claros; (3) \textbf{analizar} qué problemas conviene prevenir y cuáles conviene resaltar; (4) \textbf{evaluar} si la hoja de tu pareja rechaza de verdad los datos incorrectos.
puentes:
  a_ruta: |-
    En la sesión 7 hiciste gráficos que no engañan. Hoy haces que la hoja misma avise cuando un dato se sale de rango y rechace los que no deben entrar. En la sesión 9 vas a usar todo lo del periodo en un mini estudio, y la hoja tiene que cuidarse sola.
  a_escuta: |-
    Antes de la teoría, vas a poner un semáforo sobre una columna de notas y a ver qué te dice la hoja en dos segundos que antes te tomaba un minuto.
  a_sistematizacion: |-
    Ya viste el semáforo. Ahora entiendes las reglas de formato condicional y las de validación, decides con tu pareja qué se previene y qué se resalta, y armas la hoja completa.
  a_praxis: |-
    Ya tienes la hoja con reglas. Toca ponerla a prueba: cinco intentos de meter datos que no deben entrar, en tu hoja y en la de tu pareja.
  a_producto: |-
    Lo que entregas hoy: la hoja con tres columnas pintadas y dos protegidas, y las cinco pruebas con su captura. La prueba de calidad: tu pareja intenta meter un dato incorrecto y la hoja lo rechaza con un mensaje que se entiende.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Una hoja que avisa cuida a quien la usa; una que rechaza sin explicar lo maltrata.
  a_triangulo: |-
    Para terminar, tres ideas sobre avisar y cuidar, contadas con palabras de esta guía: Dussel sobre la conciencia que escucha antes de juzgar, Séneca sobre las cosas que nos asustan más de lo que nos aprietan, Floridi sobre los valores por defecto que protegen a la gente.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El semáforo de las notas} (15 min · individual). (1) Abre una tabla con diez notas, reales o inventadas, mezclando aprobadas y reprobadas. (2) Selecciona la columna de notas. (3) Inicio, Formato condicional, Reglas para resaltar celdas, Menor que, escribe 3 y elige relleno rojo. (4) Añade otra regla: Mayor que 4, relleno verde. (5) Mira la columna y anota qué sabes ahora en dos segundos que antes tenías que buscar fila por fila.
  checks:
  - Las notas menores que 3 quedaron en rojo y las mayores que 4 en verde.
  - Anoté qué veo de un vistazo que antes tenía que buscar.
  - Sé qué regla escribiría para las notas entre 3 y 4.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- El semáforo de las notas». \textbf{Formato:} las dos reglas que aplicaste, escritas tal cual, y una línea sobre qué te muestra la columna de un vistazo. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las dos reglas están escritas y puedes decir cuántas notas quedaron en rojo sin volver a mirar.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- La hoja que se cuida sola} (30 min · parejas). (1) Con tu pareja, preparen una tabla con quince registros y cinco columnas: Nombre, Nota 1, Nota 2, Gastos de la semana, Asistencia. (2) Formato condicional en tres columnas: Nota 1 con escala de colores, Gastos resaltando los que pasen un límite que ustedes fijen, Asistencia marcando las faltas. (3) Validación en dos columnas: Nota 2 solo acepta decimales entre 0 y 5; Asistencia solo acepta la lista Presente, Ausente, Excusa. (4) A cada validación pónganle un mensaje de error con título y explicación. (5) Prueben una vez cada regla antes de seguir.
  pilares:
  - |-
    \textbf{Tres reglas de formato condicional.} Resaltar celdas que cumplen una condición: mayor que, menor que, entre, igual a. Escala de colores: verde para lo alto, amarillo para lo medio, rojo para lo bajo, automático según el rango. Barras de datos: una barra dentro de la celda, proporcional al valor.
  - |-
    \textbf{Tres reglas de validación.} Número entre dos valores: notas de 0 a 5. Lista desplegable: solo lo que está en la lista, como en el tul. Longitud de texto: un nombre no puede tener doscientas letras. Se aplican en Datos, Validación de datos.
  - |-
    \textbf{Prevenir o resaltar.} Lo que se puede impedir antes de que entre va a validación. Lo que ya está en los datos y hay que ver rápido va a formato condicional. Una nota de 7 se previene; una nota de 1,0 se resalta.
  - |-
    \textbf{El mensaje importa.} Una validación sin mensaje rechaza el dato y deja a la persona sin saber por qué. El mensaje tiene título, «Nota fuera de rango», y explicación, «La nota debe estar entre 0 y 5». Para datos que no pueden fallar, estilo Detener; para avisos, estilo Advertencia.
  anatomia:
    titulo: Las dos herramientas, en una mirada
    body: |-
      \textbf{Validación:} impide que entre lo que no debe. \\[1mm] \textbf{Formato condicional:} pinta lo que ya está. \\[1mm] \textbf{Lista desplegable:} solo lo que pertenece. \\[1mm] \textbf{Semáforo:} rojo, amarillo, verde. \\[1mm] \textbf{Mensaje:} título y explicación.
  errores_comunes: |-
    (1) \textbf{Pintar toda la hoja}: se vuelve lenta y ya nada resalta. (2) \textbf{Validación sin mensaje}: la persona no entiende por qué se rechazó su dato. (3) \textbf{Colores caprichosos}: rojo, amarillo y verde ya significan algo; morado no. (4) \textbf{Reglas que se pisan}: dos reglas sobre la misma columna sin saber cuál manda. (5) \textbf{Validar solo lo nuevo}: la validación no revisa lo que ya estaba escrito; eso se resalta.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- La hoja que se cuida sola». \textbf{Formato:} tabla de 5 filas y 3 columnas (columna / herramienta usada / regla escrita tal cual). \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cinco columnas tienen su regla, y probaste una vez cada una sin que fallara.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Cinco intentos de romper la hoja} (25 min · individual). (1) Intercambia la hoja con tu pareja. (2) Intenta meter cinco datos que no deben entrar: una nota de 7, una nota con letras, una asistencia fuera de la lista, un gasto negativo y un nombre larguísimo. (3) Toma la captura de cada mensaje que recibas. (4) Anota qué intento pasó sin que la hoja lo detuviera, si alguno. (5) Devuelve la hoja con tus hallazgos y corrige la tuya con los que recibas.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) La hoja con tres columnas pintadas y dos protegidas. (2) Las cinco pruebas con captura del mensaje. (3) La lista de lo que pasó sin ser detenido, y cómo lo corregiste.
  - |-
    \textbf{Cómo se prueba una hoja ajena.} No leas sus reglas: intenta romperla. Si un dato incorrecto entra, la regla falta o está mal escrita. Anótalo con el dato exacto que entró, para que tu pareja lo reproduzca.
  - |-
    \textbf{Un mensaje que se entiende.} Léelo como si no supieras nada de la hoja. ¿Sabes qué hiciste mal y qué tienes que escribir? Si no, el mensaje maltrata a quien lo lee. Reescríbelo.
  - |-
    \textbf{Prevenir no reemplaza resaltar.} Si la nota de 1,0 entró porque está en rango, la validación no la detiene: eso lo hace el color. Una hoja bien cuidada usa las dos.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tabla con quince registros y cinco columnas. \\[1mm] \checkbox Formato condicional en tres columnas con reglas distintas. \\[1mm] \checkbox Validación en dos columnas con mensaje de título y explicación. \\[1mm] \checkbox Cinco intentos de romper la hoja de mi pareja, con captura. \\[1mm] \checkbox Lo que entró sin ser detenido, corregido en mi hoja. \\[1mm] \checkbox Hoja guardada como G8-P1-S8-alertas.xlsx.
  plantilla_guion: |-
    \textbf{Nota 1.} \textit{Escala de colores rojo, amarillo, verde.} \\[1mm] \textbf{Gastos.} \textit{Resaltar mayor que el límite.} \\[1mm] \textbf{Asistencia.} \textit{Marcar faltas y lista desplegable.} \\[1mm] \textbf{Nota 2.} \textit{Decimal entre 0 y 5, con mensaje.} \\[1mm] \textbf{Pruebas.} \textit{Cinco intentos, cinco capturas.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Cinco intentos de romper la hoja». \textbf{Formato:} tabla de 5 filas y 3 columnas (dato que intenté / qué hizo la hoja / mensaje que recibí), más la lista de lo que corregí en la mía. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} los cinco intentos tienen su resultado anotado, y tu hoja rechaza los cinco después de corregirla.
  producto_titulo: Hoja con alertas y validación + cinco pruebas de romperla
  criterios:
  - Tres columnas con formato condicional y reglas distintas
  - Dos columnas con validación y mensaje de error con título y explicación
  - Cinco intentos de meter datos incorrectos en la hoja de tu pareja, con captura
  - Lo que entró sin ser detenido quedó corregido en tu hoja
  - La hoja está guardada con nombre claro
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.2
    idea: |-
      La conciencia ética es la capacidad de escuchar la voz del otro, incluso cuando cuestiona el sistema en que vivimos.
    aplicacion: |-
      Una regla de validación es un sistema: decide qué entra. Un mensaje de error que explica es escuchar a quien intentó entrar. Una hoja que rechaza sin decir por qué es un sistema que no escucha.
    pregunta_espejo: |-
      ¿Mi mensaje de error le habla a una persona o solo a un dato?
  estoico:
    autor: Séneca · Cartas a Lucilio, 13 (c. 64 d.C.)
    idea: |-
      Son muchas más las cosas que nos asustan que las que de verdad nos aprietan.
    aplicacion: |-
      Sin semáforo, una tabla de treinta notas asusta entera. Con semáforo, ves que solo tres están en rojo. El formato condicional separa lo que de verdad aprieta de lo que solo asusta.
    pregunta_espejo: |-
      ¿Qué de mi tabla me asustaba antes del semáforo y ya no?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6
    idea: |-
      Las configuraciones por defecto de una tecnología deberían respetar y proteger a la persona que la usa.
    aplicacion: |-
      Una validación bien hecha es un valor por defecto que protege: impide el error antes de que cueste. Diseñar la hoja para que cuide a quien la usa, y no para que lo castigue, es una decisión tuya.
    pregunta_espejo: |-
      ¿Mi hoja protege a quien la usa, o solo lo corrige después?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu hoja de alertas funcionando. En la sesión 9 vas a hacer un mini estudio de datos del colegio, con todo lo del periodo: preguntar, tipos, limpieza, funciones, fórmulas, gráficos y alertas. Elige desde ya un tema que te interese de verdad.
web:
  resumen: |-
    Una hoja bien hecha impide que entre lo que no debe y avisa con colores cuando algo se sale de rango. Hoy la construyes y la pones a prueba, como el tul nasa que solo admite cada planta en su categoría.
  subtema: Análisis de datos con phronesis
  pre_lectura:
    por_que_importa: |-
      La mayoría de los errores en una tabla entran por una celda que nadie protegió. Validar y resaltar es lo que convierte una hoja en una herramienta que cuida a quien la usa.
    pregunta_detonante: |-
      Cuando alguien escriba «cinco punto cinco» en la columna de notas, ¿tu hoja lo deja pasar?
    activacion:
      titulo: La nota de siete
      descripcion: |-
        En 3 minutos, escribe 7 en una columna de notas y mira que Excel no dice nada. ¿Qué tendría que pasar para que la hoja se diera cuenta?
      duracion_min: 5
    conexion:
      anterior: En la sesión 7 hiciste tres gráficos honestos y criticaste uno engañoso.
      siguiente: En la sesión 9 haces un mini estudio de datos con todo lo aprendido en el periodo.

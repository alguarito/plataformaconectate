clave: 1-9
grado: 8
periodo: 1
sesion: 9
completo: true
duracion_min: 90
titulo: Mini estudio de datos --- ocho etapas para responder una pregunta del colegio
titulo_portada: |-
  Mini estudio
  de datos
producto_final: |-
  Un mini estudio en ocho etapas sobre una pregunta real del colegio: pregunta, hipótesis, recolección, limpieza con bitácora, cálculo con las cuatro funciones, gráfico honesto, hallazgo en una frase y decisión. Un informe de dos páginas que documente las ocho etapas, con un párrafo final de limitaciones y de cómo mejorarías el estudio.
apertura:
  origen: Cabildos indígenas · el censo poblacional del resguardo
  fuente: |-
    Agencia Nacional de Tierras, Dirección de Asuntos Étnicos. (2023). \emph{Instructivo: levantamiento y diligenciamiento del formato de censo poblacional para comunidades indígenas} (ACCTI-I-021, versión 1).
  saber_ancestral: |-
    Cuando una comunidad indígena pide constituir o ampliar su resguardo, se levanta un \textbf{censo}. El instructivo oficial lo define como «una fotografía de la realidad de una comunidad en un tiempo y espacio específico» (Agencia Nacional de Tierras, 2023). No lo hace un funcionario solo. Se apoya en miembros del cabildo, maestros y líderes de la comunidad, que van casa por casa con un formato. Se pregunta a todas las personas: quiénes son, cuántos años tienen, qué hacen. Después alguien verifica lo escrito, lo sistematiza y lo cuenta. Y con esa lista se toma una decisión enorme: la tierra se distribuye «conforme al censo realizado». Mira las etapas: una pregunta, un método, una recolección persona por persona, una revisión, un cálculo, una decisión. Es un estudio completo. La \textbf{cara de exclusión} es literal: quien no queda en la lista el día del censo no existe para el reparto. Hoy vas a hacer un estudio mucho más pequeño, sobre tu colegio, con las mismas etapas y el mismo cuidado por quién queda fuera.
  saber_contemporaneo: |-
    Un \textbf{mini estudio de datos} usa todo lo que aprendiste en el periodo para responder una pregunta real. Tiene ocho etapas. (1) \textbf{Pregunta}: una sola, clara, que se pueda responder con datos. (2) \textbf{Hipótesis}: lo que crees que vas a encontrar, escrito antes de mirar. (3) \textbf{Recolección}: cómo consigues los datos, cuántos y cuándo. (4) \textbf{Limpieza} con bitácora, como en la sesión 3. (5) \textbf{Cálculo}: las cuatro funciones y una fórmula compuesta. (6) \textbf{Gráfico honesto}, como en la sesión 7. (7) \textbf{Hallazgo}: lo más importante, en una frase. (8) \textbf{Decisión}: qué se haría con eso. Saltar una etapa rompe el estudio. Y la última página siempre dice qué no pudiste saber.
  pregunta_puente: |-
    El censo del resguardo decide la tierra, y quien no está en la lista queda fuera. Cuando encuestes a veinte compañeros sobre su tiempo de pantalla, ¿quién no va a estar en tu lista? ¿Y qué le pasa a tu hallazgo por esa ausencia?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} preguntas del colegio que se puedan responder con datos en una semana; (2) \textbf{evaluar} cuál de ellas vale la pena con cuatro filtros; (3) \textbf{crear} un mini estudio completo de ocho etapas; (4) \textbf{explicar} sus limitaciones y cómo lo mejorarías.
puentes:
  a_ruta: |-
    En la sesión 8 tu hoja aprendió a cuidarse sola. Hoy juntas todo el periodo en un estudio propio. En la sesión 10 lo vas a sustentar en cuatro minutos frente al grupo.
  a_escuta: |-
    Antes de elegir, vas a escribir diez preguntas posibles sobre tu colegio. Diez, no una: la buena pregunta casi nunca es la primera.
  a_sistematizacion: |-
    Ya tienes diez preguntas. Ahora las pasas por cuatro filtros con tu pareja, eliges una, escribes la hipótesis antes de mirar nada y planeas la recolección.
  a_praxis: |-
    Ya tienes pregunta, hipótesis y plan. Toca ejecutar las ocho etapas durante la semana y armar el informe de dos páginas.
  a_producto: |-
    Lo que entregas: el informe de dos páginas con las ocho etapas y el párrafo de limitaciones. La prueba de calidad: tu docente lee la pregunta y el hallazgo, y el hallazgo responde exactamente esa pregunta.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un estudio honesto dice a quién no encuestó. Uno deshonesto lo esconde.
  a_triangulo: |-
    Para terminar, tres ideas sobre investigar de verdad, contadas con palabras de esta guía: Dussel sobre saber perder tiempo para elegir lo que importa, Marco Aurelio sobre cambiar de idea cuando te muestran el error, Floridi sobre saber qué preguntar antes de buscar datos.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Diez preguntas posibles} (15 min · individual). (1) Escribe diez preguntas sobre tu colegio que se puedan responder con datos. Por ejemplo: ¿cuántos minutos de pantalla al día tienen los de octavo? ¿Qué producto se vende más en la tienda cada día? ¿Cuántos vienen a pie, en bus o en bicicleta? (2) Cada pregunta debe tener algo que se cuente o se mida. (3) Tacha las que no podrías responder en una semana. (4) Marca con una estrella las tres que más te interesan de verdad.
  checks:
  - Tengo diez preguntas escritas y cada una tiene algo que se cuenta o se mide.
  - Taché las que no se pueden responder en una semana.
  - Marqué con estrella las tres que más me interesan.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Diez preguntas posibles». \textbf{Formato:} lista numerada de diez preguntas, con tachones y estrellas. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} quedan al menos cinco sin tachar y tres tienen estrella.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EVALÚA --- Elige la pregunta y escribe la hipótesis} (25 min · parejas). (1) Con tu pareja, pasen sus tres preguntas con estrella por cuatro filtros: ¿consigo los datos esta semana?, ¿voy a tener al menos quince datos?, ¿de verdad quiero saber la respuesta?, ¿el hallazgo serviría para algo? (2) Elijan cada uno la pregunta que pase los cuatro. (3) Escriban la hipótesis antes de recolectar nada: «creo que voy a encontrar X, porque Y». (4) Planeen la recolección: a quién, cuántos, cuándo y con qué, encuesta, conteo u observación. (5) Escriban quién va a quedar fuera de la muestra y por qué.
  pilares:
  - |-
    \textbf{Los cuatro filtros.} Datos accesibles esta semana. Muestra de al menos quince. Interés real. Algún uso para el hallazgo. La pregunta que pasa los cuatro es la tuya; si ninguna pasa, vuelve a la lista de diez.
  - |-
    \textbf{La hipótesis va antes.} Si la escribes después de mirar los datos, cualquier resultado parece esperado. Escribirla antes te permite equivocarte, y equivocarte con datos es aprender algo. Decir «mi hipótesis estaba mal» es una de las frases más honestas de un estudio.
  - |-
    \textbf{Quién queda fuera.} Si encuestas a tus amigos, tu muestra son tus amigos. Si solo observas los lunes, tu estudio es de lunes. Esa no es una falla: es una limitación, y se declara en la última página.
  - |-
    \textbf{Las ocho etapas, en orden.} Pregunta. Hipótesis. Recolección. Limpieza con bitácora. Cálculo con las cuatro funciones y una fórmula. Gráfico honesto. Hallazgo en una frase. Decisión. Ninguna se salta.
  anatomia:
    titulo: Las ocho etapas, en una mirada
    body: |-
      \textbf{1. Pregunta:} una sola, medible. \\[1mm] \textbf{2. Hipótesis:} antes de mirar. \\[1mm] \textbf{3. Recolección:} a quién, cuántos, cuándo. \\[1mm] \textbf{4. Limpieza:} con bitácora. \\[1mm] \textbf{5. Cálculo:} las cuatro funciones. \\[1mm] \textbf{6. Gráfico:} honesto. \\[1mm] \textbf{7. Hallazgo:} una frase. \\[1mm] \textbf{8. Decisión:} y limitaciones.
  errores_comunes: |-
    (1) \textbf{Pregunta vaga}: «¿cómo está el colegio?» no se responde con datos. (2) \textbf{Hipótesis después}: todo parece esperado. (3) \textbf{Muestra de cinco}: no alcanza para concluir nada. (4) \textbf{Cálculos de adorno}: fórmulas que no responden la pregunta. (5) \textbf{Hallazgo inflado}: concluir más de lo que veinte datos soportan. (6) \textbf{Sin limitaciones}: presentar el estudio como definitivo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} \textbf{Título:} «Actividad 2 --- Mi pregunta y mi hipótesis». \textbf{Formato:} la pregunta elegida, los cuatro filtros con su respuesta, la hipótesis con su porqué, el plan de recolección en cuatro líneas y una línea sobre quién queda fuera. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} la pregunta pasa los cuatro filtros, la hipótesis está escrita antes de recolectar y sabes a quién no vas a encuestar.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- El mini estudio completo} (30 min · individual). Hoy dejas listas las primeras etapas; el resto se hace durante la semana. (1) Recolecta los datos durante tres a cinco días, como planeaste. (2) Límpialos con bitácora, como en la sesión 3. (3) Calcula las cuatro funciones y una fórmula compuesta que responda tu pregunta. (4) Haz un gráfico honesto del tipo correcto. (5) Escribe el hallazgo en una frase y la decisión que tomarías. (6) Arma el informe de dos páginas con las ocho etapas y cierra con limitaciones y mejoras.
  pilares:
  - |-
    \textbf{El informe tiene ocho secciones.} Una por etapa, de uno a tres párrafos cada una. La pregunta y por qué importa. La hipótesis con su porqué. El método con cuántos datos, cómo y cuándo. La limpieza con el resumen de la bitácora. Las cifras clave. El gráfico con dos líneas de lectura. El hallazgo en una frase. La decisión.
  - |-
    \textbf{La última página dice lo que no sabes.} Tres a cinco limitaciones concretas: muestra pequeña, solo amigos, solo lunes, datos de memoria. Tres mejoras si lo hicieras de nuevo. Y qué seguirías investigando con más tiempo.
  - |-
    \textbf{El hallazgo cabe en una frase.} «Los de octavo pasan en promedio 3 horas al día en pantalla, y el máximo fue de 8.» Si necesitas un párrafo para decirlo, todavía no lo encontraste.
  - |-
    \textbf{Si la hipótesis falló, mejor.} Un estudio que confirma lo que ya creías enseña poco. Uno que te contradice te obliga a mirar de nuevo, y eso es lo que vas a sustentar en la sesión 10.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Pregunta clara y medible, una sola. \\[1mm] \checkbox Hipótesis escrita antes de recolectar. \\[1mm] \checkbox Al menos quince datos, con método explícito. \\[1mm] \checkbox Limpieza con bitácora. \\[1mm] \checkbox Cuatro funciones y una fórmula compuesta. \\[1mm] \checkbox Un gráfico honesto del tipo correcto. \\[1mm] \checkbox Hallazgo en una frase y decisión. \\[1mm] \checkbox Limitaciones y mejoras en la última página.
  plantilla_guion: |-
    \textbf{Pregunta.} \textit{Una sola, medible.} \\[1mm] \textbf{Hipótesis.} \textit{Creo que…, porque…} \\[1mm] \textbf{Método.} \textit{A quién, cuántos, cuándo, con qué.} \\[1mm] \textbf{Cifras y gráfico.} \textit{Las cuatro funciones, una fórmula, un gráfico.} \\[1mm] \textbf{Hallazgo y decisión.} \textit{Una frase y una acción.} \\[1mm] \textbf{Limitaciones.} \textit{Quién quedó fuera y cómo lo mejoraría.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Mi mini estudio». \textbf{Formato:} el esquema del informe con las ocho secciones tituladas y, debajo de cada una, qué vas a poner; el informe completo se entrega aparte. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} las etapas 1 a 3 están listas, las ocho secciones tienen título y sabes qué te falta recolectar esta semana.
  producto_titulo: Mini estudio de ocho etapas + informe de dos páginas con limitaciones
  criterios:
  - La pregunta es una sola, clara y medible, y pasa los cuatro filtros
  - La hipótesis está escrita antes de recolectar y dice por qué
  - Hay al menos quince datos, con método explícito y limpieza con bitácora
  - El cálculo usa las cuatro funciones y una fórmula compuesta que responden la pregunta
  - El gráfico es honesto y el hallazgo cabe en una frase
  - La última página declara limitaciones, mejoras y quién quedó fuera
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §5.9.4.1
    idea: |-
      Como los temas son infinitos y el tiempo corto, hay que saber perder tiempo para elegir los temas fundamentales.
    aplicacion: |-
      Escribir diez preguntas para quedarte con una parece perder tiempo. Es lo contrario: es el tiempo que te evita pasar una semana recolectando datos para una pregunta que no importaba.
    pregunta_espejo: |-
      ¿Elegí mi pregunta porque importa, o porque era la más fácil de responder?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 21 (c. 175 d.C.)
    idea: |-
      Si alguien te muestra que estás equivocado, cambia de camino con gusto. Lo que daña no es el error: es aferrarse a él.
    aplicacion: |-
      Tu hipótesis puede fallar. Los datos son «alguien» que te muestra el error. Cambiar de idea con datos no es perder: es exactamente para lo que hiciste el estudio.
    pregunta_espejo: |-
      Si mis datos contradicen mi hipótesis, ¿voy a decirlo en el informe?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      Ganan quienes saben preguntar y responder, y por eso saben qué datos buscar.
    aplicacion: |-
      Sin pregunta clara, recolectas de todo y no respondes nada. La pregunta decide qué datos, a quién, cuántos. Por eso la etapa uno se hace despacio y las otras siete salen de ella.
    pregunta_espejo: |-
      ¿Mi pregunta me dijo exactamente qué datos buscar, o busqué y después pregunté?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el mini estudio terminado y el informe de dos páginas. En la sesión 10 lo vas a sustentar en cuatro minutos frente al grupo, con cinco diapositivas, y vas a responder preguntas. Un estudio honesto se sustenta solo; uno inflado se cae en la primera pregunta.
web:
  resumen: |-
    Todo lo del periodo junto en un estudio propio de ocho etapas sobre una pregunta del colegio. Como el censo de un resguardo, se pregunta persona por persona, se verifica y se decide, sin olvidar a quién quedó fuera.
  subtema: Análisis de datos con phronesis
  pre_lectura:
    por_que_importa: |-
      Hacer un estudio pequeño y honesto es la habilidad que separa opinar de saber. La vas a usar en el colegio, en un trabajo y en cualquier discusión con cifras.
    pregunta_detonante: |-
      Cuando encuestes a veinte compañeros, ¿quién no va a estar en tu lista y qué le pasa a tu hallazgo por eso?
    activacion:
      titulo: Una pregunta que se pueda contar
      descripcion: |-
        En 3 minutos, escribe una pregunta sobre tu colegio que se responda contando algo, y otra que no se pueda responder con datos. ¿Cuál es la diferencia?
      duracion_min: 5
    conexion:
      anterior: En la sesión 8 tu hoja aprendió a validar y a avisar con colores.
      siguiente: En la sesión 10 sustentas el mini estudio en cuatro minutos frente al grupo.

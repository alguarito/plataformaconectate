clave: 1-9
grado: 8
periodo: 1
sesion: 9
completo: true
titulo: Mini-estudio de datos del entorno escolar
titulo_portada: |-
  Mini-estudio
  de datos
  del entorno escolar
producto_final: |-
  Mini-estudio completo en 8 etapas (pregunta de investigación, hipótesis, recolección, limpieza, cálculo con funciones, gráfico honesto, hallazgo principal, decisión razonada) sobre un tema real del colegio (tiempo de pantalla, consumo de tienda, gastos de transporte, asistencia, notas por área) + informe escrito de 2 páginas que documente las 8 etapas + 1 párrafo de cierre con limitaciones reconocidas y propuesta de mejora del estudio
apertura:
  saber_ancestral: |-
    En los barrios del centro de Cartago había una figura silenciosa que nadie llamaba investigador pero que producía conocimiento todos los días: \textbf{el observador del barrio}. El sereno, sentado en su silla nocturna, sabía cuántos extraños habían pasado en la semana, a qué hora se prendían las luces de cada casa, qué carros se detenían frente a la tienda. La abuela del balcón sabía cuántas empanadas se vendían en la cuadra, en qué momento del día se agotaban, qué barrio venía a comprar. El tendero contaba cuántos clientes nuevos entraron, qué productos preguntaron que no tenía, qué horas tuvo más movimiento. \textbf{Ninguno de ellos llamaba a su práctica investigación}, pero seguían un método claro: (1) observaban con disciplina, (2) anotaban en un cuaderno o memoria, (3) comparaban con días anteriores, (4) detectaban patrones, (5) tomaban decisiones (\emph{``mañana voy a hacer más empanadas''}, \emph{``no le presto al de la motocicleta blanca''}). Esa práctica del observador del barrio es la \textbf{forma ancestral del análisis de datos}: \textbf{observar con disciplina, comparar con criterio, decidir con honestidad}. La investigación moderna formaliza esos pasos pero no inventa nada nuevo.
  saber_contemporaneo: |-
    Un \textbf{mini-estudio de datos} es la aplicación de las 8 habilidades aprendidas en este periodo a una pregunta real del entorno escolar. Tiene 8 etapas obligatorias: (1) \textbf{Pregunta de investigación}: una sola pregunta clara, no ambigua, que se pueda responder con datos. (2) \textbf{Hipótesis}: lo que crees que vas a encontrar, antes de mirar los datos. (3) \textbf{Recolección}: cómo vas a obtener los datos (encuesta, observación, registro de la app, conteo manual). (4) \textbf{Limpieza}: aplicar las 5 herramientas de la sesión 3 con bitácora. (5) \textbf{Cálculo}: usar las 4 funciones básicas y las fórmulas compuestas para obtener cifras resumen. (6) \textbf{Gráfico honesto}: visualizar los hallazgos con la honestidad de la sesión 7. (7) \textbf{Hallazgo principal}: la conclusión más importante en 1 frase clara. (8) \textbf{Decisión razonada}: qué se haría a partir del hallazgo. La regla profesional: \textbf{las 8 etapas son obligatorias; saltar una rompe el rigor del estudio}.
  pregunta_puente: |-
    ¿Qué sabía el observador del barrio al seguir su método silencioso de las 5 prácticas, que el estudiante novato olvida cuando hace un \emph{``análisis''} sin pregunta clara, sin hipótesis previa y sin limitaciones declaradas? ¿Y por qué las 8 etapas del mini-estudio son la formalización moderna de la phronesis del observador?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} una pregunta de investigación clara sobre el entorno escolar que se pueda responder con datos; (2) \textbf{analizar} las 8 etapas del mini-estudio y planear cada una con tiempos realistas; (3) \textbf{evaluar} si tu pregunta tiene hipótesis previa, si tus datos son suficientes y si tus limitaciones están declaradas; (4) \textbf{crear} el mini-estudio completo con informe escrito de 2 páginas integrando todo el periodo.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 1-8 aprendiste las 8 habilidades por separado: preguntar, clasificar, limpiar, calcular con funciones, fórmulas, referencias, gráficos, alertas. Hoy las \emph{integras} en un mini-estudio coherente. La sesión 10 será sustentación pública del mini-estudio. Sin mini-estudio bien hecho hoy, la sustentación de mañana será defensa de algo flojo.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lluvia} de preguntas posibles: 10 preguntas sobre el entorno escolar que se podrían responder con datos. La regla: \textbf{preguntas reales, no temas abstractos}.
  a_sistematizacion: |-
    Ya tienes 10 candidatas. Ahora vas a entender la \textbf{anatomía de las 8 etapas}: qué hace cada una, qué errores típicos hay en cada paso, cómo se conectan entre sí. Vas a elegir 1 pregunta entre las 10 con criterio.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: ejecutas las 8 etapas sobre tu pregunta elegida, durante la semana recolectas datos, los limpias, calculas, graficas, sacas hallazgo y propones decisión.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas al final de la semana: mini-estudio completo en 8 etapas + informe de 2 páginas. El criterio principal: que un compañero leyendo tu informe entienda exactamente qué preguntaste, cómo lo respondiste y qué decidirías.
  a_evaluacion: |-
    Antes de cerrar, mira el mini-estudio desde las cinco dimensiones humanas. Hacer un estudio honesto sobre tu barrio o colegio es respeto por las personas reales detrás de los datos; hacer un estudio inflado es traición al oficio aprendido en 8 sesiones.
  a_triangulo: |-
    Y para terminar, tres voces sobre la observación con disciplina. Dussel sobre el conocimiento que devuelve poder a la comunidad observada, Marco Aurelio sobre la honestidad de declarar limitaciones, Floridi sobre la investigación como acto ético del oficio digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 10 preguntas de investigación posibles} (20 min · individual o parejas). Sin todavía comprometerte a una, anota 10 preguntas sobre el entorno escolar que se puedan responder con datos. Reglas: (1) preguntas \textbf{específicas y medibles}, no temas abstractos. (2) datos \textbf{accesibles} en máximo 1 semana de recolección. (3) preguntas que \textbf{te interesen personalmente}. Ejemplos válidos: \emph{``¿Cuántos minutos al día gastan en pantalla los compañeros del grado 8?''}, \emph{``¿Qué producto se vende más en la tienda escolar cada día de la semana?''}, \emph{``¿Cuántos estudiantes vienen en bus, a pie, en bicicleta o en moto?''}. Ejemplos inválidos: \emph{``¿Qué piensan los jóvenes hoy?''} (muy amplio), \emph{``¿Es buena la educación en Colombia?''} (no se responde con datos del colegio).
  checks:
  - Anoté 10 preguntas específicas y medibles.
  - Cada pregunta tiene datos accesibles en 1 semana.
  - Las preguntas me interesan personalmente.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 10 preguntas posibles». \textbf{Formato:} lista numerada con cada pregunta + 1 línea sobre cómo obtendrías los datos. \textbf{Sabes que terminaste cuando} todas son respondibles con datos en 1 semana.
sistematizacion:
  intro: |-
    Tener 10 preguntas es bueno; saber elegir 1 con criterio es oficio. Para que el mini-estudio sea profesional necesitas la \textbf{anatomía de las 8 etapas} y el criterio de elección entre las 10 candidatas.
  pilares:
  - |-
    Las 8 etapas se descomponen así: (1) \textbf{Pregunta}: una sola, clara, medible. (2) \textbf{Hipótesis}: tu apuesta sobre qué encontrarás (\emph{``creo que el promedio será X, porque...''}). (3) \textbf{Recolección}: método específico (encuesta de 20 personas, conteo durante 3 días, registro del cuaderno del docente). (4) \textbf{Limpieza}: aplicar las 5 herramientas de la sesión 3 con bitácora. (5) \textbf{Cálculo}: SUMA, PROMEDIO, MAX, MIN y al menos 1 fórmula compuesta. (6) \textbf{Gráfico}: 1 gráfico honesto del tipo correcto (sesión 7). (7) \textbf{Hallazgo}: la conclusión más importante en 1 frase. (8) \textbf{Decisión}: qué se haría con ese hallazgo.
  - |-
    El criterio de elección entre las 10 preguntas usa 4 filtros: (a) \textbf{Datos accesibles}: ¿puedo conseguir los datos esta semana? (b) \textbf{Muestra suficiente}: ¿voy a tener al menos 15-30 datos? (c) \textbf{Interés personal}: ¿realmente quiero saber la respuesta? (d) \textbf{Impacto local}: ¿el hallazgo serviría para algo? Las preguntas que pasen los 4 filtros son las finalistas. Entre los finalistas, elige la que más combine los 4.
  - |-
    Lo esencial cabe en una frase: \emph{el mini-estudio es la suma honesta de las 8 etapas, no la dramatización de un hallazgo prefabricado}. La phronesis del oficio consiste en \textbf{dejar que los datos hablen}, no en forzarlos a confirmar lo que ya querías concluir. Si tu hipótesis se equivoca, declarar el error es virtud, no fracaso.
  - |-
    Algoritmo: (1) elige la pregunta con los 4 filtros. (2) escribe la hipótesis antes de mirar datos. (3) recolecta. (4) limpia con bitácora. (5) calcula. (6) grafica. (7) identifica el hallazgo. (8) propone decisión. (9) declara las limitaciones del estudio. (10) integra todo en informe de 2 páginas.
  anatomia:
    titulo: Anatomía del mini-estudio
    body: |-
      \textbf{Pregunta:} clara, medible, una sola. \\[1mm] \textbf{Hipótesis:} apuesta previa. \\[1mm] \textbf{Recolección:} método concreto. \\[1mm] \textbf{Limpieza:} con bitácora. \\[1mm] \textbf{Cálculo:} 4 funciones + 1 fórmula. \\[1mm] \textbf{Gráfico:} honesto, tipo correcto. \\[1mm] \textbf{Hallazgo:} 1 frase. \\[1mm] \textbf{Decisión:} acción concreta.
  errores_comunes: |-
    (1) \textbf{Pregunta vaga}: \emph{``¿cómo está el colegio?''} no se responde con datos. (2) \textbf{Sin hipótesis previa}: hace que cualquier resultado parezca esperado. (3) \textbf{Muestra muy pequeña}: 5 datos no permiten conclusión. (4) \textbf{Cálculos sin sentido}: aplicar fórmulas sin que aporten al hallazgo. (5) \textbf{Gráfico decorativo}: gráfico que no responde a la pregunta. (6) \textbf{Hallazgo desproporcionado}: concluir más de lo que los datos soportan. (7) \textbf{Sin limitaciones declaradas}: presentar conclusiones como definitivas con muestra pequeña.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía y elección». \textbf{Formato:} (a) las 8 etapas con descripción breve; (b) los 4 filtros aplicados a las 10 preguntas; (c) la pregunta elegida con justificación de 2 líneas. \textbf{Sabes que terminaste cuando} la pregunta elegida pasa los 4 filtros y tienes plan claro de las 8 etapas.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- Mini-estudio completo} (30 min en sesión + 3-5 horas de trabajo en la semana · individual). Hora de ejecutar. Aplicas las 8 etapas a tu pregunta elegida durante la semana y produces el informe de 2 páginas.
  pilares:
  - |-
    El informe se estructura en 8 secciones, una por etapa, cada una con 1-3 párrafos: (1) Pregunta + por qué importa. (2) Hipótesis previa con justificación. (3) Método de recolección con detalles (cuántos datos, cómo, cuándo). (4) Limpieza con resumen de la bitácora. (5) Cifras clave (las 4 funciones aplicadas). (6) Gráfico con título e interpretación de 2 líneas. (7) Hallazgo principal en 1 frase + comparación con hipótesis. (8) Decisión razonada + propuesta de acción.
  - |-
    Sigue el patrón \textbf{``honestidad sobre dramatización''}: si tu hipótesis no se confirmó, declárelo. Si la muestra fue pequeña, declárela. Si hubo sesgos (solo encuestaste a tus amigos, solo observaste los lunes), declárelo. La sección final del informe debe contener un párrafo de \textbf{limitaciones reconocidas} y \textbf{propuesta de mejora del estudio} si se hiciera de nuevo.
  - |-
    El cierre del informe tiene estructura mínima: (a) Limitaciones identificadas (3-5 puntos concretos). (b) Cómo mejoraría el estudio (3 acciones). (c) Qué seguirá investigando si tuviera más tiempo. Esa honestidad final es la firma del aprendiz que sabe que no agotó el tema, pero aportó lo que pudo con rigor.
  - |-
    Algoritmo: (1) escribe la pregunta. (2) escribe la hipótesis ANTES de recolectar. (3) recolecta durante 3-5 días. (4) limpia con bitácora. (5) calcula. (6) grafica. (7) escribe hallazgo. (8) propone decisión. (9) declara limitaciones. (10) integra todo en 2 páginas. (11) léelo en voz alta para verificar coherencia.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Pregunta clara, medible, una sola. \\[1mm] \checkbox Hipótesis escrita antes de recolectar. \\[1mm] \checkbox Datos recolectados con método explícito. \\[1mm] \checkbox Limpieza con bitácora aplicada. \\[1mm] \checkbox 4 funciones + 1 fórmula compuesta usadas. \\[1mm] \checkbox 1 gráfico honesto del tipo correcto. \\[1mm] \checkbox Hallazgo en 1 frase. \\[1mm] \checkbox Decisión razonada. \\[1mm] \checkbox Limitaciones declaradas. \\[1mm] \checkbox Informe de 2 páginas con las 8 etapas.
  plantilla_guion: |-
    \textbf{1. Pregunta.} \textit{Texto claro.} \\[1mm] \textbf{2. Hipótesis.} \textit{Apuesta previa con justificación.} \\[1mm] \textbf{3. Recolección.} \textit{Método + N datos + cuándo.} \\[1mm] \textbf{4. Limpieza.} \textit{Resumen bitácora.} \\[1mm] \textbf{5. Cálculo.} \textit{4 funciones + 1 fórmula.} \\[1mm] \textbf{6. Gráfico.} \textit{Tipo + interpretación.} \\[1mm] \textbf{7. Hallazgo.} \textit{Una frase.} \\[1mm] \textbf{8. Decisión.} \textit{Acción concreta + limitaciones.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Mini-estudio». \textbf{Formato:} informe de 2 páginas con las 8 secciones + referencia al archivo Excel + capturas del gráfico principal. \textbf{Sabes que terminaste cuando} podrías sustentar el mini-estudio en 4 minutos sin abrir más material que el informe.
  producto_titulo: Mini-estudio completo en 8 etapas + informe de 2 páginas
  criterios:
  - Pregunta clara y medible
  - Hipótesis escrita antes de recolectar
  - Recolección con método explícito y N suficiente
  - Limpieza con bitácora aplicada
  - 4 funciones + 1 fórmula compuesta usadas
  - Gráfico honesto del tipo correcto
  - Hallazgo en 1 frase
  - Decisión razonada
  - Limitaciones declaradas
  - Informe integrado en 2 páginas
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El conocimiento que devuelve poder a la comunidad observada es liberador; el que la utiliza como objeto es extractivo.
    aplicacion: |-
      Tu mini-estudio observa a personas reales: compañeros, docentes, familias del barrio. La filosofía de la liberación pide que ese conocimiento devuelva algo: una propuesta de mejora para la cafetería, una alerta sobre tiempo de pantalla, una sugerencia al consejo estudiantil. Si tu mini-estudio se queda en cifras sin devolver nada, repite la lógica colonial de quien extrae datos del pueblo sin devolverlos. La phronesis del oficio consiste en \textbf{cerrar el estudio devolviendo algo útil a la comunidad observada}.
    pregunta_espejo: |-
      ¿Mi mini-estudio devuelve algo útil a las personas observadas, o las utiliza como objeto de mi tarea?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Declarar las limitaciones es virtud; inflar las conclusiones es debilidad disfrazada de seguridad.
    aplicacion: |-
      Es tentador presentar el mini-estudio como si fuera definitivo. La disciplina estoica recomienda lo opuesto: \emph{declara honestamente lo que tu estudio no puede concluir}. Una muestra de 20 no permite afirmar sobre 200; observación de 3 días no permite afirmar sobre el año entero. Esa honestidad de limitaciones es la diferencia entre el aprendiz profesional y el aficionado.
    pregunta_espejo: |-
      ¿Mis conclusiones están proporcionadas al tamaño de mi muestra, o estoy afirmando más de lo que mis datos permiten?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Investigar con rigor en la era de la información es responsabilidad ética del oficio.
    aplicacion: |-
      En la era de la información hay datos en exceso pero pocas investigaciones rigurosas. Tu mini-estudio te entrena en una práctica que rige toda profesión del siglo XXI: \textbf{producir conocimiento con método explícito, datos verificables y limitaciones declaradas}. Sin esa disciplina, los datos producen ruido; con ella, producen información útil para la comunidad.
    pregunta_espejo: |-
      ¿Mi mini-estudio cumple los estándares mínimos del rigor profesional, o es solo trabajo escolar improvisado?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el mini-estudio terminado y el informe de 2 páginas. En la sesión 10 vas a hacer la \textbf{sustentación pública} de 4 minutos del mini-estudio frente al grupo + responder preguntas + autoevaluación. Sin mini-estudio sólido hoy, la sustentación de mañana será improvisación.

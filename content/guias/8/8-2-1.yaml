clave: 2-1
grado: 8
periodo: 2
sesion: 1
completo: true
titulo: Lógica avanzada --- if-else con AND, OR y NOT
titulo_portada: |-
  Lógica avanzada ---
  if-else con
  AND, OR y NOT
producto_final: |-
  Tabla de decisión en pseudocódigo con al menos 4 reglas que combinen condiciones simples con AND, OR y NOT + 3 algoritmos de decisión cotidiana escritos como if-else anidados (semáforo del cruce escolar, riego automático del huerto, alarma escolar de evacuación) + bitácora corta de 5 líneas que explique cuándo elegiste AND, cuándo OR y cuándo NOT en cada algoritmo
apertura:
  saber_ancestral: |-
    En las fincas del Valle del Cauca, los campesinos toman decisiones todos los días que parecen sencillas pero esconden lógica compuesta del oficio. Cuando el campesino mira al cielo de madrugada y decide qué hacer con la cosecha, no aplica una sola regla: combina varias. La sabiduría rural ya operaba así mucho antes de que existieran computadores: \emph{``Si llueve \textbf{Y} la tierra está blanda, cosecho hoy''}. \emph{``Si \textbf{NO} llueve y el sol está fuerte, riego ahora''}. \emph{``Si llueve \textbf{O} hay viento fuerte, espero''}. Esas tres palabras (Y, O, NO) ordenan toda decisión compleja en la finca. El campesino que solo aplicaba una condición (\emph{``si llueve, cosecho''}, sin importar el estado de la tierra) perdía la cosecha. La phronesis del campo exige combinar condiciones: dos cosas a la vez (Y), una de varias (O), la ausencia de algo (NO). Esa lógica compuesta no es invento moderno: es saber ancestral que la matemática y la computación recogieron y formalizaron con los nombres griegos \textbf{AND}, \textbf{OR}, \textbf{NOT}.
  saber_contemporaneo: |-
    En programación y en pensamiento computacional, las decisiones complejas se escriben con \textbf{if-else} (si-sino) combinados con operadores lógicos \textbf{AND, OR, NOT}: (1) \texttt{si CONDICION entonces ACCION1 sino ACCION2}: la estructura base. (2) \textbf{AND} (Y): la combinación es verdadera solo si \textbf{ambas} condiciones son verdaderas. \texttt{si llueve AND tierra\_blanda entonces cosechar}. (3) \textbf{OR} (O): la combinación es verdadera si \textbf{al menos una} condición es verdadera. \texttt{si llueve OR viento\_fuerte entonces esperar}. (4) \textbf{NOT} (NO): invierte el valor de una condición. \texttt{si NOT llueve entonces regar}. La regla profesional moderna del oficio digital es famosa: \textbf{toda decisión real es compuesta}. Los algoritmos que solo manejan condiciones simples no resuelven problemas del mundo. Aprender a combinar AND, OR, NOT es entrar al lenguaje del pensamiento computacional adulto.
  pregunta_puente: |-
    ¿Qué sabía el campesino del Valle al combinar \emph{``si llueve Y la tierra está blanda''}, que el novato en programación olvida cuando escribe condiciones sueltas sin combinarlas? ¿Y por qué un buen if-else compuesto vale más que diez if-else sueltos?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} en una situación cotidiana qué condiciones se deben combinar y con qué operador (AND, OR, NOT); (2) \textbf{explicar} con tus palabras la diferencia entre AND y OR (cuántas condiciones deben cumplirse); (3) \textbf{aplicar} la lógica if-else con operadores compuestos para escribir 3 algoritmos de decisión cotidiana; (4) \textbf{evaluar} un algoritmo ajeno detectando si las condiciones están bien combinadas o si dejan casos sin cubrir.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. El periodo 2 trabaja \textbf{lógica, algoritmos y computación física con micro:bit}. Hoy abrimos con lo más importante: \textbf{cómo se decide en código}. Las próximas sesiones (tablas de verdad, pseudocódigo, sensores) construyen sobre esta base: sin if-else con AND/OR/NOT, no se puede programar nada que reaccione al mundo.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio del campesino}: piensa en una decisión real que tomas a diario (qué ponerte, qué comer, qué transporte usar) y nota cómo combinas 2-3 condiciones para decidir.
  a_sistematizacion: |-
    Ya tienes ejemplos del cuerpo. Ahora vas a entender la \textbf{anatomía de AND, OR y NOT}: cuándo usar cada uno, los 5 errores típicos (confundir AND con OR, olvidar el NOT, anidar mal los paréntesis, dejar casos sin cubrir, condiciones contradictorias).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: armas una tabla de decisión con 4 reglas combinadas, y escribes 3 algoritmos de decisión cotidiana en pseudocódigo (semáforo, riego, alarma).
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: tabla de decisión + 3 algoritmos en pseudocódigo + bitácora corta. El criterio principal: que un compañero pueda leer tus algoritmos y predecir qué acción se ejecutará en cada combinación de condiciones.
  a_evaluacion: |-
    Antes de cerrar, mira la lógica desde las cinco dimensiones humanas. Combinar condiciones con criterio es respeto por la complejidad del mundo; aplicar condiciones sueltas es simplificación que produce algoritmos que no funcionan.
  a_triangulo: |-
    Y para terminar, tres voces sobre el pensamiento que decide. Dussel sobre los algoritmos que dignifican o atropellan a las personas, Marco Aurelio sobre la claridad del pensamiento, Floridi sobre la lógica como ética del oficio digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Decisiones cotidianas con condiciones compuestas} (15 min · individual). Piensa en 5 decisiones reales que tomas en un día (qué ropa ponerte, qué desayuno escoger, qué ruta tomar al colegio, qué hacer si llueve, qué ver en TV). Para cada una, anota: (1) las 2-3 condiciones que combinas para decidir, (2) si se combinan con AND, OR o NOT (o varios juntos). Ejemplo: \emph{``Saco paraguas si: hay nubes oscuras AND no tengo capucha''} (combina AND y NOT). La regla: tus decisiones diarias YA usan lógica compuesta sin darte cuenta; solo falta nombrarla.
  checks:
  - Identifiqué 5 decisiones cotidianas.
  - Detecté las condiciones combinadas en cada una.
  - Reconocí el operador (AND, OR, NOT) en cada decisión.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Decisiones cotidianas». \textbf{Formato:} tabla 5 filas × 3 columnas (Decisión~|~Condiciones combinadas~|~Operador). \textbf{Sabes que terminaste cuando} ves que tu cerebro ya usa AND/OR/NOT a diario.
sistematizacion:
  intro: |-
    Tus decisiones cotidianas ya combinan lógica; lo que falta es \textbf{nombrar con precisión los operadores}. Para que tu pensamiento computacional sea profesional necesitas la anatomía de AND, OR y NOT, y los errores típicos.
  pilares:
  - |-
    Los 3 operadores se descomponen así: (1) \textbf{AND} (Y, ambas): la combinación se cumple cuando \emph{las dos} condiciones son verdaderas. \texttt{si A AND B entonces}: A debe ser verdadero Y B también. Si una falla, la combinación falla. (2) \textbf{OR} (O, al menos una): la combinación se cumple cuando \emph{al menos una} condición es verdadera. \texttt{si A OR B entonces}: basta con que A o B sea verdadera; las dos también vale. (3) \textbf{NOT} (NO, lo contrario): invierte el valor. \texttt{si NOT A entonces}: se cumple cuando A es falsa.
  - |-
    La estructura \textbf{if-else} (si-sino) se escribe en pseudocódigo así: \texttt{SI condicion ENTONCES} \emph{(acción si verdadero)} \texttt{SINO} \emph{(acción si falso)} \texttt{FIN SI}. Las condiciones pueden ser compuestas: \texttt{SI llueve AND viento\_fuerte ENTONCES quedarse\_en\_casa SINO salir FIN SI}. Cuando hay más de 2 caminos, se usan if-else anidados: \texttt{SI llueve ENTONCES SI viento\_fuerte ENTONCES quedarse SINO usar\_paraguas FIN SI SINO salir FIN SI}. La indentación es importante: visualiza la jerarquía.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿esta decisión cubre todos los casos posibles?}. Si dejas casos sin cubrir, el algoritmo falla cuando aparece la combinación olvidada. La phronesis del oficio computacional consiste en \textbf{pensar en las 4 combinaciones} de 2 condiciones: (V,V), (V,F), (F,V), (F,F), y asegurarte de que cada una tiene respuesta.
  - |-
    Algoritmo para escribir un if-else compuesto: (1) lista las condiciones simples del problema. (2) decide cuáles deben combinarse con AND (todas necesarias) y cuáles con OR (basta una). (3) usa NOT para las negaciones explícitas. (4) escribe el if-else principal. (5) anida más if-else si hay caminos múltiples. (6) verifica con casos extremos: ¿qué pasa si todas son verdaderas?, ¿si todas son falsas?
  anatomia:
    titulo: Anatomía de AND, OR, NOT
    body: |-
      \textbf{AND:} las dos condiciones verdaderas. \\[1mm] \textbf{OR:} al menos una verdadera. \\[1mm] \textbf{NOT:} invierte verdadero a falso. \\[1mm] \textbf{if-else:} si condición → acción 1 sino acción 2. \\[1mm] \textbf{Anidado:} if dentro de if para casos múltiples.
  errores_comunes: |-
    (1) \textbf{Confundir AND con OR}: \emph{``si llueve AND hay sol''} casi nunca pasa; probablemente quisiste OR. (2) \textbf{Olvidar el NOT}: \emph{``si no es lunes''} se escribe \texttt{si NOT lunes}. (3) \textbf{Casos sin cubrir}: el algoritmo no tiene rama para una combinación posible. (4) \textbf{Condiciones contradictorias}: \emph{``si edad>10 AND edad<5''} nunca se cumple. (5) \textbf{Anidación sin paréntesis claros}: \texttt{A AND B OR C} es ambigua; usa paréntesis: \texttt{(A AND B) OR C}.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía de AND, OR, NOT». \textbf{Formato:} (a) los 3 operadores con ejemplo de cada uno; (b) estructura if-else básica y anidada; (c) los 5 errores comunes con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías explicar la diferencia entre AND y OR con un ejemplo del Valle.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- Tabla + 3 algoritmos en pseudocódigo} (35 min · individual). Hora de aplicar. Armas una tabla de decisión con 4 reglas combinadas y escribes 3 algoritmos reales en pseudocódigo.
  pilares:
  - |-
    La tabla de decisión tiene estructura mínima: (a) columnas: las condiciones (\emph{``llueve''}, \emph{``hay viento''}, \emph{``es de noche''}). (b) filas: combinaciones posibles (V/F en cada condición). (c) última columna: la acción que corresponde. Para 2 condiciones binarias, hay 4 combinaciones. Para 3, hay 8. Tu tabla debe tener al menos 4 reglas (4 filas con su acción).
  - |-
    Los 3 algoritmos en pseudocódigo son: (1) \textbf{Semáforo del cruce escolar}: combina \emph{hora\_pico} con \emph{hay\_estudiantes\_cruzando} y \emph{vehículo\_emergencia}. (2) \textbf{Riego automático del huerto}: combina \emph{humedad\_baja}, \emph{NO\_está\_lloviendo}, \emph{es\_horario\_permitido}. (3) \textbf{Alarma escolar de evacuación}: combina \emph{detector\_humo}, \emph{detector\_temperatura\_alta} o \emph{botón\_pánico\_activado}. Cada algoritmo debe tener al menos 1 AND, 1 OR y 1 NOT.
  - |-
    Sigue el patrón \textbf{``cubrir todos los casos''}: para cada algoritmo, antes de cerrarlo, prueba mentalmente las combinaciones extremas. ¿Qué pasa si todas las condiciones son falsas?, ¿si todas son verdaderas?, ¿si solo una es verdadera? Si encuentras una combinación sin respuesta, agrega una rama al algoritmo.
  - |-
    Algoritmo: (1) define el problema en palabras. (2) lista condiciones simples. (3) construye tabla de decisión. (4) escribe pseudocódigo con if-else anidados. (5) verifica que cubre todos los casos. (6) escribe en la bitácora cuándo usaste AND, cuándo OR, cuándo NOT.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Tabla de decisión con al menos 4 reglas. \\[1mm] \checkbox Algoritmo del semáforo con AND, OR, NOT. \\[1mm] \checkbox Algoritmo del riego con AND, OR, NOT. \\[1mm] \checkbox Algoritmo de la alarma con AND, OR, NOT. \\[1mm] \checkbox Cada algoritmo cubre todos los casos posibles. \\[1mm] \checkbox Bitácora de 5 líneas explicando elecciones de operadores.
  plantilla_guion: |-
    \textbf{Algoritmo 1 (Semáforo).} \textit{Condiciones + if-else anidado.} \\[1mm] \textbf{Algoritmo 2 (Riego).} \textit{Condiciones + if-else anidado.} \\[1mm] \textbf{Algoritmo 3 (Alarma).} \textit{Condiciones + if-else anidado.} \\[1mm] \textbf{Bitácora.} \textit{Cuándo usé AND / OR / NOT y por qué.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- Tabla + 3 algoritmos». \textbf{Formato:} (a) tabla de decisión con sus 4 reglas; (b) los 3 algoritmos en pseudocódigo indentado; (c) bitácora corta. \textbf{Sabes que terminaste cuando} cualquier compañero podría leer tu pseudocódigo y predecir qué acción sale en cada combinación.
  producto_titulo: Tabla de decisión + 3 algoritmos en pseudocódigo + bitácora
  criterios:
  - Tabla de decisión con 4+ reglas
  - 3 algoritmos en pseudocódigo
  - Cada algoritmo usa AND, OR y NOT
  - Todos los casos cubiertos
  - Bitácora explicativa
  - Indentación correcta en pseudocódigo
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un algoritmo que olvida casos invisibiliza a quien queda fuera de sus condiciones.
    aplicacion: |-
      Cuando construyes un algoritmo y dejas un caso sin cubrir, alguien que viva ese caso queda sin respuesta del sistema. Si tu semáforo no contempla la combinación \emph{``estudiante cruzando AND vehículo emergencia''}, el sistema queda mudo justo en el caso más peligroso. La filosofía de la liberación pide ese cuidado: cubrir todos los casos, especialmente los que el sistema típico ignora. La phronesis del oficio consiste en \textbf{no dejar a nadie sin respuesta del algoritmo}.
    pregunta_espejo: |-
      ¿Mi algoritmo cubre todos los casos posibles, o deja afuera a quien viva el caso que olvidé?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Pensar con claridad es virtud; mezclar AND con OR es debilidad del pensamiento que produce errores predecibles.
    aplicacion: |-
      Es tentador escribir condiciones rápido sin verificar el operador. La disciplina estoica recomienda lo opuesto: \emph{pensa antes de escribir cada condición}. ¿Necesito que ambas se cumplan (AND) o que al menos una (OR)? Esa precisión de pensamiento es la base del oficio computacional. Quien escribe lógica sin claridad produce algoritmos que fallan en silencio.
    pregunta_espejo: |-
      ¿Estoy verificando que cada AND y cada OR son los correctos, o estoy escribiendo lógica al azar?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La lógica clara es la nueva ética del oficio digital en la era de los algoritmos que deciden por nosotros.
    aplicacion: |-
      En la era de la información, los algoritmos toman decisiones que afectan personas (préstamos, admisiones, recomendaciones). La ética digital exige que esos algoritmos tengan lógica clara y verificable. Tu ejercicio de hoy te entrena en una práctica que rige toda profesión técnica del siglo XXI: \textbf{escribir lógica que cualquiera pueda revisar y entender}.
    pregunta_espejo: |-
      ¿Mi algoritmo es verificable por otra persona, o solo yo entiendo por qué decidí cada condición?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu tabla de decisión y los 3 algoritmos en pseudocódigo. En la sesión 2 vas a aprender a \textbf{construir tablas de verdad} completas para AND, OR, NOT y a usarlas para verificar si tus algoritmos son consistentes. La lógica de hoy se formaliza en tablas mañana.

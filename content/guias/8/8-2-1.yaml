clave: 2-1
grado: 8
periodo: 2
sesion: 1
completo: true
duracion_min: 90
titulo: Decidir con varias condiciones --- si-sino con Y, O y NO
titulo_portada: |-
  Decidir con
  varias condiciones
producto_final: |-
  Una tabla de decisión con al menos cuatro reglas que combinen condiciones con Y, O y NO. Tres algoritmos cotidianos escritos como si-sino, uno de ellos anidado: el semáforo del cruce escolar, el riego del huerto y la alarma de evacuación. Y una bitácora de cinco líneas que diga cuándo elegiste cada operador.
apertura:
  origen: Pueblo misak · los «no» escritos y fechados
  fuente: |-
    Pueblo Misak. (2007, 12 de agosto). \emph{Misak Ley}. I Encuentro por la defensa de nuestro Derecho Mayor.
  saber_ancestral: |-
    En el resguardo de Guambía, en Silvia (Cauca), el pueblo misak escribió sus «no». En 2005, en Piendamó, el Mandato de Vida y Permanencia. En 2007, el 12 de agosto, la Misak Ley (Pueblo Misak, 2007). Son decisiones sobre lo que el pueblo acepta y lo que no en su territorio. No las tomó una persona: las tomaron las autoridades del Nu Nakchak, con los shures y las shuras, delante de todos, y las escribieron con fecha. Un «no» así no es una rabieta. Es una regla: dice bajo qué condiciones algo se acepta y bajo cuáles no, y se sostiene con años encima. Eso es lógica de decisión. Un programa hace lo mismo cuando escribe SI llueve Y NO hay capucha ENTONCES paraguas: fija condiciones y una respuesta. La \textbf{cara de exclusión}: ese «no» colectivo se sostiene frente a normas externas, a costa de conflicto con el Estado y con terratenientes; es una disputa territorial viva, no una figura de discurso. Hoy vas a escribir tus propias reglas con Y, O y NO, y a comprobar que cubren todos los casos.
  saber_contemporaneo: |-
    Casi ninguna decisión real depende de una sola condición. Por eso el pseudocódigo combina condiciones con tres operadores. \textbf{Y} (AND): se cumple solo si las dos condiciones son verdaderas. SI llueve Y hace frío ENTONCES abrigo. \textbf{O} (OR): se cumple si al menos una es verdadera. SI llueve O hay viento ENTONCES esperar. \textbf{NO} (NOT): le da la vuelta a una condición. SI NO llueve ENTONCES regar. La estructura base es \textbf{si-sino}: SI condición ENTONCES acción SINO otra acción. Cuando hay más de dos caminos, un si-sino va dentro de otro. Y hay una pregunta que separa una regla buena de una mala: ¿qué pasa en cada combinación posible? Con dos condiciones hay cuatro combinaciones; una regla que deja una sin respuesta falla justo cuando aparece.
  pregunta_puente: |-
    El pueblo misak escribió sus «no» con fecha y testigos, y los sostiene con años encima. Cuando escribas «SI llueve Y NO tengo capucha», ¿qué pasa si llueve y sí tienes capucha? ¿Tu regla lo dice, o lo dejaste sin respuesta?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las condiciones que combinas en decisiones de todos los días; (2) \textbf{aplicar} Y, O y NO en pseudocódigo con si-sino; (3) \textbf{analizar} si una regla cubre las cuatro combinaciones posibles; (4) \textbf{evaluar} la regla de tu pareja y encontrar el caso que dejó sin respuesta.
puentes:
  a_ruta: |-
    El periodo 1 terminó con tu mini estudio. Este arranca con lógica: hoy aprendes a escribir decisiones con varias condiciones. En la sesión 2 las vas a verificar con tablas de verdad, y en la 4 las vas a programar en un micro:bit.
  a_escuta: |-
    Antes de la teoría, vas a mirar cinco decisiones que tomas cada día y a descubrir que ya usas Y, O y NO sin nombrarlos.
  a_sistematizacion: |-
    Ya nombraste tus condiciones. Ahora aprendes los tres operadores, el si-sino, y con tu pareja escribes la tabla de decisión y el primer algoritmo.
  a_praxis: |-
    Ya tienes el método. Toca escribir los tres algoritmos, probarlos con las combinaciones extremas y buscarle el hueco a la regla de tu pareja.
  a_producto: |-
    Lo que entregas hoy: la tabla de decisión, los tres algoritmos y la bitácora de cinco líneas. La prueba de calidad: tu pareja no encuentra ninguna combinación de condiciones que tu regla deje sin respuesta.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Una regla escrita con todas sus condiciones es una decisión que otros pueden revisar. Una regla en la cabeza, no.
  a_triangulo: |-
    Para terminar, tres ideas sobre decidir con reglas, contadas con palabras de esta guía: Dussel sobre escuchar la voz que cuestiona el sistema, Epicteto sobre lo que depende de uno, Floridi sobre el tiempo, que es lo único que no se comparte.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Cinco decisiones de tu día} (15 min · individual). (1) Escribe cinco decisiones que tomas en un día normal: qué ropa ponerte, qué ruta tomar, si sacar paraguas, qué comer en el descanso, qué ver por la noche. (2) Para cada una, anota las dos o tres condiciones que miras antes de decidir. (3) Escribe cómo las combinas: ¿tienen que cumplirse todas (Y), basta una (O), o alguna es al revés (NO)? (4) Elige la decisión que más operadores use y escríbela como SI… ENTONCES… SINO….
  checks:
  - Tengo cinco decisiones con sus condiciones anotadas.
  - Marqué en cada una si combino con Y, con O o con NO.
  - Una decisión quedó escrita como SI… ENTONCES… SINO….
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Cinco decisiones de tu día». \textbf{Formato:} tabla de 5 filas y 3 columnas (decisión / condiciones / operador). \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cinco filas están llenas y una decisión está escrita como si-sino con al menos un operador.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- La tabla de decisión y el semáforo} (30 min · parejas). (1) Con tu pareja, tomen el semáforo del cruce escolar: sus condiciones son hora pico, hay estudiantes cruzando y viene un vehículo de emergencia. (2) Hagan la tabla de decisión: una columna por condición, una fila por combinación, y la acción al final. (3) Escriban el algoritmo en pseudocódigo con SI, ENTONCES, SINO y al menos un Y, un O y un NO. (4) Prueben las combinaciones extremas: ¿qué hace el semáforo si todo es verdadero? ¿Si todo es falso? (5) Si una combinación no tiene respuesta, agreguen la rama que falta.
  pilares:
  - |-
    \textbf{Los tres operadores.} Y: las dos condiciones verdaderas, si una falla, falla la regla. O: basta una verdadera; las dos también vale. NO: invierte la condición; SI NO es lunes se cumple todos los días menos el lunes.
  - |-
    \textbf{Cómo se escribe el si-sino.} SI condición ENTONCES acción SINO otra acción FIN SI. Cuando hay más de dos caminos, un si-sino va dentro de otro, con sangría: SI llueve ENTONCES SI hay viento ENTONCES quedarse SINO paraguas FIN SI SINO salir FIN SI. La sangría muestra qué está dentro de qué.
  - |-
    \textbf{Cubrir todos los casos.} Con dos condiciones hay cuatro combinaciones: verdadero-verdadero, verdadero-falso, falso-verdadero, falso-falso. Con tres, ocho. Una regla buena responde en cada una. Una regla con hueco falla el día que aparece la combinación olvidada.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Lista las condiciones simples. (2) Decide cuáles van con Y y cuáles con O. (3) Usa NO donde la condición sea al revés. (4) Escribe el si-sino. (5) Anida otro si hay más caminos. (6) Prueba con todo verdadero y con todo falso.
  anatomia:
    titulo: Los tres operadores, en una mirada
    body: |-
      \textbf{Y:} las dos verdaderas. \\[1mm] \textbf{O:} al menos una verdadera. \\[1mm] \textbf{NO:} la condición al revés. \\[1mm] \textbf{Si-sino:} un camino u otro. \\[1mm] \textbf{Regla:} responde en cada combinación.
  errores_comunes: |-
    (1) \textbf{Confundir Y con O}: «SI llueve Y hace sol» casi nunca pasa; querías O. (2) \textbf{Olvidar el NO}: «si no es lunes» se escribe SI NO lunes. (3) \textbf{Un caso sin rama}: la regla no dice qué hacer en una combinación. (4) \textbf{Condiciones que se contradicen}: edad mayor que 10 Y menor que 5 nunca se cumple. (5) \textbf{Y con O sin paréntesis}: A Y B O C es ambigua; escribe (A Y B) O C.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- La tabla y el semáforo». \textbf{Formato:} la tabla de decisión del semáforo (tres condiciones, ocho filas, columna de acción) y el algoritmo en pseudocódigo con sangría. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} las ocho filas tienen acción y el algoritmo usa al menos un Y, un O y un NO.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Dos algoritmos más y el hueco de tu pareja} (25 min · individual). (1) Escribe el algoritmo del riego del huerto: humedad baja, NO está lloviendo, es horario permitido. (2) Escribe el de la alarma de evacuación: detector de humo O temperatura alta O botón de pánico. (3) Prueba cada uno con todo verdadero, todo falso y una sola verdadera. (4) Intercambia con tu pareja y busca en sus algoritmos una combinación sin respuesta; anótala. (5) Escribe la bitácora de cinco líneas: cuándo elegiste Y, cuándo O, cuándo NO, y qué hueco te encontraron.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) La tabla de decisión del semáforo. (2) Los tres algoritmos en pseudocódigo: semáforo, riego y alarma. (3) La bitácora de cinco líneas con tus elecciones y el hueco que te encontraron.
  - |-
    \textbf{El riego y el NO.} El huerto se riega si la humedad es baja Y NO está lloviendo Y es horario permitido. Si quitas el NO, riegas bajo la lluvia. El NO es el operador que más se olvida y el que más agua desperdicia.
  - |-
    \textbf{La alarma y el O.} La alarma suena si hay humo O temperatura alta O alguien oprimió el botón. Basta una. Si la escribes con Y, la alarma espera a que pasen las tres cosas, y ya es tarde.
  - |-
    \textbf{Cómo se busca el hueco.} Toma la tabla de tu pareja, elige una fila y pregunta: ¿qué hace el algoritmo aquí? Si tienes que adivinar, es un hueco. Anota la fila exacta; no digas «está incompleto».
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tabla de decisión del semáforo con ocho filas y su acción. \\[1mm] \checkbox Algoritmo del semáforo con Y, O y NO. \\[1mm] \checkbox Algoritmo del riego con NO está lloviendo. \\[1mm] \checkbox Algoritmo de la alarma con O. \\[1mm] \checkbox Cada algoritmo probado con todo verdadero y todo falso. \\[1mm] \checkbox Bitácora de cinco líneas con el hueco que me encontraron.
  plantilla_guion: |-
    \textbf{Semáforo.} \textit{hora pico, estudiantes cruzando, emergencia.} \\[1mm] \textbf{Riego.} \textit{humedad baja Y NO llueve Y horario.} \\[1mm] \textbf{Alarma.} \textit{humo O temperatura O botón.} \\[1mm] \textbf{Prueba.} \textit{Todo verdadero, todo falso, una sola.} \\[1mm] \textbf{Bitácora.} \textit{Cuándo Y, cuándo O, cuándo NO, qué hueco.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Riego, alarma y el hueco». \textbf{Formato:} los dos algoritmos en pseudocódigo con sangría, la fila donde encontraste el hueco de tu pareja y la bitácora de cinco líneas. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} los dos algoritmos responden en todo verdadero y en todo falso, y anotaste un hueco ajeno con su fila exacta.
  producto_titulo: Tabla de decisión + tres algoritmos con Y, O y NO + bitácora de cinco líneas
  criterios:
  - La tabla del semáforo tiene ocho filas y todas tienen acción
  - Los tres algoritmos están en pseudocódigo con sangría y usan Y, O y NO
  - El riego lleva NO está lloviendo y la alarma lleva O
  - Cada algoritmo se probó con todo verdadero y con todo falso
  - Encontraste un hueco en un algoritmo ajeno y anotaste la fila exacta
  - La bitácora dice cuándo elegiste cada operador
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.2
    idea: |-
      La conciencia ética es la capacidad de escuchar la voz del otro, incluso cuando cuestiona el sistema en que vivimos.
    aplicacion: |-
      Los «no» misak son la voz de un pueblo que cuestiona reglas que le llegaron de afuera. Una regla escrita con todas sus condiciones se puede discutir; una regla que nadie escribió, no. Escribir la tuya es dejar que otros la revisen.
    pregunta_espejo: |-
      ¿Cuál de mis reglas de hoy dejaría revisar a alguien que no esté de acuerdo conmigo?
  estoico:
    autor: Epicteto · Enquiridión, 1 (c. 125 d.C.)
    idea: |-
      Hay cosas que dependen de nosotros y cosas que no. Saber cuáles son cuáles es el primer trabajo.
    aplicacion: |-
      En el riego, la lluvia no depende de ti; el horario y la decisión de regar sí. Escribir la condición «NO está lloviendo» es reconocer lo que no controlas y decidir sobre lo que sí.
    pregunta_espejo: |-
      En mis tres algoritmos, ¿cuáles condiciones no dependen de mí y cuáles sí?
  floridi:
    autor: Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 4.6
    idea: |-
      Lo único que de verdad es finito, precioso, no renovable y no compartible es el tiempo.
    aplicacion: |-
      Una regla con hueco falla a las tres de la mañana, cuando aparece la combinación que nadie pensó. Probar las combinaciones extremas hoy cuesta cinco minutos; arreglar la falla después cuesta el tiempo de otros.
    pregunta_espejo: |-
      ¿Qué combinación de mi regla no probé porque me pareció que nunca iba a pasar?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu tabla de decisión y los tres algoritmos. En la sesión 2 vas a construir tablas de verdad de Y, O y NO. Con ellas vas a comprobar si tus reglas tienen huecos. Lo que escribiste hoy es lo que vas a verificar.
web:
  resumen: |-
    Casi ninguna decisión depende de una sola condición. Hoy aprendes a escribirlas con Y, O y NO en pseudocódigo, y a comprobar que cubren todos los casos, como los «no» que el pueblo misak escribió con fecha y testigos.
  subtema: Lógica y micro:bit
  pre_lectura:
    por_que_importa: |-
      Toda app, todo semáforo y toda alarma funcionan con reglas de varias condiciones. Saber escribirlas sin huecos es el primer paso para programar algo que no falle cuando más se necesita.
    pregunta_detonante: |-
      Cuando escribas «SI llueve Y NO tengo capucha», ¿qué pasa si llueve y sí tienes capucha?
    activacion:
      titulo: El paraguas
      descripcion: |-
        En 3 minutos, escribe la regla completa de cuándo sacas paraguas, con todas sus condiciones. ¿Cuántas usaste? ¿Alguna es un NO?
      duracion_min: 5
    conexion:
      anterior: En el periodo 1 cerraste con la sustentación de tu mini estudio.
      siguiente: En la sesión 2 verificas tus reglas con tablas de verdad.

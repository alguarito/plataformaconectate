clave: 2-10
grado: 8
periodo: 2
sesion: 10
completo: true
duracion_min: 90
titulo: Sustentación del proyecto --- decir qué funciona y qué no
titulo_portada: |-
  Decir qué funciona
  y qué no
producto_final: |-
  Una sustentación de cinco minutos del proyecto de monitoreo de la sesión 9, con cinco láminas, el micro:bit funcionando en vivo, dos cosas que funcionaron y una que todavía falla con su explicación, y de tres a cinco preguntas del grupo respondidas. Y una autoevaluación escrita con una fortaleza y una mejora concretas.
apertura:
  origen: Pueblos del CRIC en el Cauca · los mandatos de los congresos y la rendición de su cumplimiento
  fuente: |-
    Consejo Regional Indígena del Cauca. (2017). \emph{Avanza el XV congreso regional del CRIC en el resguardo de Rioblanco Sotará del pueblo indígena yanacona}.
  saber_ancestral: |-
    En la sesión 3 del periodo 1 viste que los pueblos indígenas del Cauca no escriben sus normas desde una oficina. Salen de un congreso: la gente de los resguardos llega, discute durante días y de ahí nacen los \textbf{mandatos}. El XV Congreso del CRIC se reunió en Río Blanco, Sotará, del 25 al 30 de junio de 2017 (Consejo Regional Indígena del Cauca, 2017). Lo que importa hoy es lo que pasa después. La organización tiene que volver ante la misma gente y decir, en público, cuáles mandatos se cumplieron y cuáles no. Y la propia organización reporta que el cumplimiento es incompleto. No lo esconde: lo dice. Un mandato no vale por estar escrito; vale porque quienes lo hicieron vuelven a mirarlo. La \textbf{cara de exclusión}: un mandato es un acto de gobierno de un pueblo que se disputa con el Estado y con actores armados; no es una dinámica de convivencia escolar. Lo que tú haces hoy es mucho más pequeño y aprende de eso: presentar tu proyecto ante tu grupo y decir, con los datos en la mano, qué funcionó y qué todavía no.
  saber_contemporaneo: |-
    Una \textbf{sustentación técnica} es la presentación de un proyecto ante personas que pueden preguntar. En cinco minutos muestras el problema, la solución, los datos y la propuesta. Tiene tres condiciones. (1) \textbf{Demo en vivo}: el micro:bit funcionando frente al grupo, no una captura de pantalla. (2) \textbf{Limitaciones declaradas}: una cosa que aún falla, con su explicación técnica. (3) \textbf{Respuestas honestas}: si alguien encuentra un problema, se reconoce; si no sabes, dices «no lo resolví» y por qué. En ingeniería ningún sistema está libre de errores. La diferencia está entre quien los declara y quien los esconde. Un equipo que dice «el umbral de luz dispara falsas alarmas cuando pasa una nube» es más confiable que uno que dice «todo funciona». El guion de cinco minutos son unas 700 palabras. Se ensaya con cronómetro al menos dos veces.
  pregunta_puente: |-
    El CRIC vuelve ante su gente y dice cuáles mandatos no se cumplieron. Cuando muestres tu proyecto, ¿qué te cuesta más: enseñar lo que funciona o decir en voz alta lo que todavía falla?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} tu proyecto con honestidad y separar lo que funciona de lo que falla; (2) \textbf{crear} cinco láminas y un guion de cinco minutos con demo en vivo; (3) \textbf{evaluar} tu sustentación y la de otros con criterios observables; (4) \textbf{explicar} por qué declarar una limitación hace más confiable un proyecto.
puentes:
  a_ruta: |-
    En la sesión 9 dejaste el micro:bit midiendo tres jornadas y encontraste un patrón. Hoy lo presentas ante el grupo con el micro:bit en vivo y dices qué funciona y qué no. Con esto cierras el periodo 2; en el periodo 3 empieza el diseño de piezas multimedia.
  a_escuta: |-
    Antes de armar láminas, vas a hacer el inventario honesto de tu proyecto: tres cosas que funcionaron, dos que fallan. Es el reporte de cumplimiento, en pequeño.
  a_sistematizacion: |-
    Ya tienes el inventario. Ahora aprendes qué va en cada lámina, armas las cinco con tu pareja y ensayas con cronómetro.
  a_praxis: |-
    Ya ensayaste. Toca sustentar frente al grupo con el micro:bit funcionando, responder preguntas y escribir tu autoevaluación.
  a_producto: |-
    Lo que entregas hoy: las cinco láminas, el guion, la lista de lo que funciona y lo que falla, y la autoevaluación. La prueba de calidad: el micro:bit funcionó en vivo y dijiste una limitación sin que te la preguntaran.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Una sustentación que declara una falla enseña más que una que la esconde y la audiencia la descubre.
  a_triangulo: |-
    Para terminar, tres ideas sobre presentarse ante otros, contadas con palabras de esta guía: Dussel sobre el rostro que interpela, Marco Aurelio sobre ser bueno en vez de discutirlo, y Floridi sobre la mitad de los datos que no sirve.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- El inventario honesto} (15 min · individual). (1) Abre tu bitácora de treinta filas y tu programa de la sesión 9. (2) Escribe tres cosas que funcionaron: la lectura del sensor, la calibración, la alerta visible, la frecuencia cumplida, la bitácora completa. (3) Escribe dos cosas que fallan o son frágiles: el umbral que dispara falsas alarmas, las horas que no se cumplieron, las filas perdidas, la batería. (4) Para cada falla, escribe en una línea por qué crees que pasa. (5) Elige la falla que vas a declarar en la sustentación y escribe cómo la mejorarías.
  checks:
  - Tengo tres cosas que funcionaron, con evidencia en la bitácora.
  - Tengo dos fallas con su porqué en una línea.
  - Elegí la falla que voy a declarar y cómo la mejoraría.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} \textbf{Título:} «Actividad 1 --- El inventario honesto». \textbf{Formato:} dos columnas: «funciona» con tres filas y «falla» con dos, cada una con una línea de porqué; y la falla elegida con su mejora. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} cada cosa que funciona se puede señalar en la bitácora, y cada falla tiene una causa y no una excusa.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · CREA --- Cinco láminas y un ensayo} (30 min · parejas). (1) Reduce tu proyecto a cinco láminas de máximo veinticinco palabras cada una: problema y variable; sensor, umbrales y alerta; los datos y el patrón con su cifra; la propuesta de acción; lo que falla y cómo se mejoraría. (2) Escribe el guion hablado: unas 700 palabras son cinco minutos. (3) Prepara la demo: micro:bit con batería, código cargado, y una forma de producir la alerta en vivo, tapar el sensor o calentarlo con la mano. (4) Ensaya frente a tu pareja con cronómetro. (5) Tu pareja te hace dos preguntas difíciles y te dice qué no entendió; cambien de rol.
  pilares:
  - |-
    \textbf{Las cinco láminas y su tiempo.} Problema y variable, 45 segundos. Sensor, umbrales y alerta, con una foto del micro:bit instalado, 60 segundos. Datos y patrón, con un gráfico simple de las treinta filas, 75 segundos. Propuesta, 45 segundos. Lo que falla y cómo se mejora, 45 segundos. Quedan unos segundos para respirar.
  - |-
    \textbf{Las preguntas que van a llegar.} «¿Cómo elegiste los umbrales?»: con la bitácora de calibración. «¿Y si el sensor se daña?»: el sistema queda mudo, y lo dices. «¿Por qué solo treinta mediciones?»: defiendes la muestra o reconoces el límite. «¿Qué harías con otra semana?»: respondes con la mejora que ya escribiste.
  - |-
    \textbf{La demo en vivo.} La captura de pantalla no demuestra nada; el micro:bit mostrando la alerta cuando tapas el sensor sí. Si algo impide la demo, sin batería, sin computador, lo dices al empezar y muestras el video que grabaste como respaldo.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Cinco láminas cortas. (2) Guion de 700 palabras. (3) Demo preparada y probada. (4) Dos ensayos con cronómetro. (5) Preguntas de tu pareja. (6) Ajustar lo que no se entendió.
  anatomia:
    titulo: La sustentación, en una mirada
    body: |-
      \textbf{Problema:} qué mediste y por qué. \\[1mm] \textbf{Solución:} sensor, umbrales, alerta. \\[1mm] \textbf{Datos:} el patrón y su cifra. \\[1mm] \textbf{Propuesta:} qué se haría con el dato. \\[1mm] \textbf{Límite:} lo que falla y cómo se mejora.
  errores_comunes: |-
    (1) \textbf{Leer las láminas}: el grupo lee más rápido que tú. (2) \textbf{Esconder la falla}: alguien la encuentra en las preguntas y pierdes más. (3) \textbf{Inflar el patrón}: «siempre» donde los datos dicen «dos de tres días». (4) \textbf{Captura en vez de demo}: nadie vio el micro:bit funcionar. (5) \textbf{Evadir la pregunta dura}: responder otra cosa en vez de «no lo resolví».
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · CREA).} \textbf{Título:} «Actividad 2 --- Cinco láminas y un ensayo». \textbf{Formato:} el texto de las cinco láminas, el guion de 700 palabras, el tiempo de los dos ensayos y las dos preguntas de tu pareja con lo que no entendió. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} el ensayo cabe en cinco minutos y la lámina de lo que falla tiene una causa y una mejora.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Sustentar con el micro:bit en vivo} (35 min · individual). (1) Sustenta frente al grupo, o en rondas de cinco, con cronómetro visible: cinco minutos. (2) Haz la demo: produce la alerta en vivo tapando o calentando el sensor. (3) Declara la falla que elegiste antes de que te la pregunten. (4) Responde de tres a cinco preguntas; si no sabes, di «no lo resolví» y por qué. (5) Mientras escuchas a otros, evalúa con los seis criterios de la tabla y escribe una pregunta para cada uno. (6) Al final, escribe tu autoevaluación: una fortaleza y una mejora concretas.
  pilares:
  - |-
    \textbf{Tu entrega tiene cuatro piezas.} (1) Las cinco láminas. (2) El guion. (3) La lista de lo que funciona y lo que falla. (4) La autoevaluación con una fortaleza y una mejora. El programa y la bitácora ya los entregaste en la sesión 9.
  - |-
    \textbf{Declarar antes de que pregunten.} Si dices «el umbral de luz falla cuando pasa una nube» en la lámina cinco, el grupo lo recibe como honestidad. Si lo callas y alguien lo descubre en las preguntas, el grupo lo recibe como algo que escondiste.
  - |-
    \textbf{Responder con datos.} «¿Tu propuesta es factible?» se responde con la cifra: «subió de 24 a 28 los tres días, abrir ventanas a las 11:30 cuesta cero». Sin cifra, es una opinión contra otra.
  - |-
    \textbf{La autoevaluación concreta.} Fortaleza: «la demo salió a la primera porque la probé dos veces antes». Mejora: «me pasé 40 segundos en la lámina de datos; la próxima recorto el gráfico». No «hablar mejor» ni «prepararme más».
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Cinco láminas de máximo veinticinco palabras cada una. \\[1mm] \checkbox Guion de unas 700 palabras ensayado dos veces con cronómetro. \\[1mm] \checkbox Demo en vivo hecha, o el motivo dicho al empezar y el video de respaldo. \\[1mm] \checkbox La falla declarada antes de las preguntas, con causa y mejora. \\[1mm] \checkbox De tres a cinco preguntas respondidas, con «no lo resolví» cuando tocó. \\[1mm] \checkbox Sustentación dentro de los cinco minutos. \\[1mm] \checkbox Autoevaluación con una fortaleza y una mejora concretas.
  plantilla_guion: |-
    \textbf{Problema.} \textit{Medí … porque …} \\[1mm] \textbf{Solución.} \textit{Con el sensor de …, umbrales de … y …, y alerta …} \\[1mm] \textbf{Datos.} \textit{Los tres días, … entre … y …: de … a …} \\[1mm] \textbf{Propuesta.} \textit{Por eso propongo …} \\[1mm] \textbf{Límite.} \textit{Todavía falla … porque …; lo mejoraría con …}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Sustentar con el micro:bit en vivo». \textbf{Formato:} las preguntas que te hicieron con tu respuesta en una línea, tu evaluación de dos compañeros con los seis criterios, y tu autoevaluación. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} la fortaleza y la mejora son cosas que alguien más pudo ver en tu sustentación.
  producto_titulo: Sustentación de cinco minutos + cinco láminas + demo en vivo + falla declarada + preguntas respondidas + autoevaluación
  criterios:
  - Las cinco láminas tienen problema, solución, datos con cifra, propuesta y límite
  - El micro:bit funcionó en vivo, o se dijo el motivo al empezar y hubo video de respaldo
  - La falla se declaró antes de las preguntas, con causa y mejora
  - Las preguntas se respondieron con datos o con «no lo resolví» y su porqué
  - La sustentación cupo en cinco minutos
  - La autoevaluación tiene una fortaleza y una mejora que otros pudieron ver
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.4.2
    idea: |-
      El otro se muestra como otro cuando, desde fuera de mi sistema, me interpela con su rostro y su reclamo.
    aplicacion: |-
      Tu proyecto es tu sistema. Las preguntas del grupo vienen de fuera y te muestran lo que desde adentro no viste. Responder con honestidad es dejar que el otro te interpele, no defenderte.
    pregunta_espejo: |-
      ¿Qué pregunta de hoy me mostró algo de mi proyecto que yo no había visto?
  estoico:
    autor: Marco Aurelio · Meditaciones X, 16 (c. 175 d.C.)
    idea: |-
      Deja de discutir cómo debería ser una buena persona y procura serlo.
    aplicacion: |-
      Decir «mi sistema funciona» es discutir. Tapar el sensor y que salga la alerta frente al grupo es serlo. La demo en vivo vale más que cualquier lámina que lo afirme.
    pregunta_espejo: |-
      ¿Qué afirmé hoy con palabras que habría podido mostrar con el micro:bit?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      La mitad de nuestros datos no sirve; el problema es que no sabemos cuál mitad.
    aplicacion: |-
      De tus treinta filas, algunas tienen huecos, horas corridas o una nube que pasó. Declararlas es decir cuál mitad no sirve. Un proyecto que sabe cuáles datos son flojos es más confiable que uno que los presenta todos iguales.
    pregunta_espejo: |-
      ¿Cuáles de mis treinta filas no me atrevería a defender, y lo dije?
compromiso: |-
  \textbf{Para el periodo 3.} Con esta sustentación cierras «Lógica y micro:bit». Guarda el programa, la bitácora y las láminas: son tu evidencia del periodo. En la sesión 1 del periodo 3 vas a empezar con diseño visual y jerarquía de información en piezas multimedia. Las cinco láminas de hoy son tu primer borrador de eso.
web:
  resumen: |-
    Sustentar un proyecto técnico es mostrarlo funcionando, decir qué falla y responder con honestidad. Hoy presentas tu monitoreo en cinco minutos con el micro:bit en vivo, como el CRIC que vuelve ante su gente a decir cuáles mandatos se cumplieron y cuáles no.
  subtema: Lógica y micro:bit
  pre_lectura:
    por_que_importa: |-
      Todo proyecto termina frente a alguien que pregunta. Saber presentar lo que funciona y declarar lo que no es lo que hace confiable a quien lo construyó.
    pregunta_detonante: |-
      Cuando muestres tu proyecto, ¿qué te cuesta más, enseñar lo que funciona o decir en voz alta lo que todavía falla?
    activacion:
      titulo: La falla que dirías primero
      descripcion: |-
        En 3 minutos, piensa en algo que hiciste esta semana y no salió del todo bien. Escribe cómo lo contarías en una frase que empiece por «lo que todavía falla es…». ¿Cambia algo si lo dices tú antes de que lo noten?
      duracion_min: 5
    conexion:
      anterior: En la sesión 9 el micro:bit midió tres jornadas y encontraste un patrón con cifra.
      siguiente: En el periodo 3 empiezas con diseño visual y jerarquía de información.
  mapa_ruta:

clave: 2-10
grado: 8
periodo: 2
sesion: 10
completo: true
titulo: Sustentación del proyecto técnico --- honestidad del oficio
titulo_portada: |-
  Sustentación
  del proyecto técnico ---
  honestidad del oficio
producto_final: |-
  Sustentación oral de 5 minutos del proyecto de monitoreo de la sesión 9, con (a) presentación de 4-5 slides (problema + sensor + datos + propuesta), (b) demo en vivo del micro:bit funcionando, (c) declaración honesta de 2 cosas que funcionaron bien y 1 que aún falla con su explicación, (d) sesión de 3-5 preguntas de la audiencia respondidas con honestidad, (e) autoevaluación final de 1 fortaleza y 1 mejora para sustentaciones futuras
apertura:
  saber_ancestral: |-
    Cuando el relojero del centro de Cartago entregaba un reloj reparado al cliente, lo ponía sobre el mostrador con un gesto silencioso y siempre el mismo discurso: \emph{``Vea, ya marca bien, lo probé toda la noche''}, decía señalando el péndulo en movimiento estable. Pero el relojero \textbf{nunca prometía perfección absoluta}. Después de mostrar lo que funcionaba, siempre agregaba la \textbf{declaración honesta}: \emph{``El minutero a veces se atrasa un minuto cada semana; eso es de la cuerda vieja, pero no se puede arreglar sin cambiar pieza''}, o \emph{``si se cae al piso, la espiral va a romper''}, o \emph{``la campanada del difunto sigue sonando un poco apagada, eso es del badajo, hay que mandar a hacer otro''}. El cliente entonces sabía exactamente qué llevaba y qué cuidar. Esa honestidad no era debilidad: \textbf{era la firma del oficio profesional}. El relojero que prometía perfección absoluta perdía clientes en cuanto el reloj fallaba; el relojero honesto los conservaba durante décadas, porque el cliente sabía que podía confiar en su palabra. La sabiduría era simple: \textbf{declara lo que funciona, declara lo que aún no, promete mejorar lo que se puede mejorar}.
  saber_contemporaneo: |-
    La \textbf{sustentación técnica} de un proyecto computacional es la versión digital exacta de la entrega del relojero. Después de 9 sesiones de trabajo, el proyecto de monitoreo se presenta en público con \textbf{honestidad de oficio}: lo que funciona, lo que aún no, lo que se propondría mejorar. La regla profesional famosa en ingeniería: \textbf{``no hay sistema sin bugs; hay sistemas honestos sobre sus bugs y sistemas que los esconden''}. La sustentación de 5 minutos tiene 3 propiedades irrenunciables: (1) \textbf{Demo en vivo}: el micro:bit funcionando, no captura de pantalla. (2) \textbf{Declaración de limitaciones}: 1 cosa que aún falla con su explicación técnica. (3) \textbf{Respuestas con honestidad ante preguntas duras}: si la audiencia detecta un problema, reconocerlo es mejor que inventar excusas. La phronesis del oficio digital consiste en \textbf{honrar la honestidad del relojero en el contexto del software}.
  pregunta_puente: |-
    ¿Qué sabía el relojero al declarar lo que aún no funcionaba al entregar la pieza, que el sustentante novato olvida cuando esconde los bugs y promete perfección? ¿Y por qué la honestidad técnica gana respeto profesional que la inflación de logros nunca gana?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} cuáles son los aspectos sólidos de tu proyecto y cuáles aún tienen debilidades; (2) \textbf{explicar} con tus palabras el problema, la solución implementada, los hallazgos y la propuesta; (3) \textbf{evaluar} con honestidad las preguntas duras de la audiencia sin inventar respuestas; (4) \textbf{crear} la sustentación completa (slides + demo + autoevaluación).
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Has recorrido 9 sesiones del periodo 2 que culminaron en el proyecto de monitoreo. Hoy es el día de la \textbf{entrega pública} del oficio. La sesión 1 del periodo 3 abre el último periodo del año (multimedia y ciberética). La sustentación de hoy cierra el periodo 2.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{inventario honesto}: revisas tu proyecto y anotas con sinceridad las 3 cosas que mejor funcionaron y las 2 cosas que aún fallan o son frágiles. Es la base de la sustentación: lo que dirás con orgullo y lo que dirás con honestidad.
  a_sistematizacion: |-
    Ya tienes el inventario. Ahora vas a entender la \textbf{anatomía de la sustentación técnica}: las 4-5 slides estándar, el guion de 5 minutos, las preguntas técnicas duras más típicas, los 6 errores del sustentante novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: armas slides + guion + demo + autoevaluación. Sustentas en público. Respondes preguntas con honestidad. Autoevalúas.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: sustentación ejecutada + slides + autoevaluación. El criterio principal: que la audiencia se vaya sabiendo qué hace el proyecto, qué funciona, qué aún no, y qué tú harías distinto si tuvieras otra semana.
  a_evaluacion: |-
    Antes de cerrar, mira la sustentación desde las cinco dimensiones humanas. Declarar lo que falla es honor del oficio; esconderlo es traición a los 9 días de trabajo anterior.
  a_triangulo: |-
    Y para terminar, tres voces sobre la entrega honesta. Dussel sobre el sustentante que devuelve a la comunidad el oficio aprendido, Epicteto sobre la honestidad como disciplina del carácter, Floridi sobre la transparencia técnica como ética profesional.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Inventario honesto del proyecto} (10 min · individual). Revisa tu proyecto de monitoreo (sesión 9) y anota con sinceridad: (a) \textbf{Las 3 cosas que mejor funcionaron} (la lectura del sensor, la calibración, la alerta visible, la bitácora bien llenada). (b) \textbf{Las 2 cosas que aún fallan o son frágiles} (el umbral que dispara falsas alarmas a veces, la frecuencia que no se respetó por completo, la bitácora con algunas mediciones perdidas). Esa lista cruda es la materia prima honesta de la sustentación.
  checks:
  - Anoté 3 cosas que funcionaron bien.
  - Anoté 2 cosas que aún fallan o son frágiles.
  - Las anoté con sinceridad, sin inflar ni esconder.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Inventario honesto». \textbf{Formato:} 2 listas (lo que funcionó, lo que falla). \textbf{Sabes que terminaste cuando} sabes qué contarás con orgullo y qué con honestidad.
sistematizacion:
  intro: |-
    Tu inventario es la base. Ahora necesitas la \textbf{anatomía profesional} de la sustentación técnica de 5 minutos.
  pilares:
  - |-
    Las 4-5 slides estándar se descomponen así (con tiempo asignado): (1) \textbf{Problema y variable} (45 seg): qué se monitoreó y por qué. (2) \textbf{Solución técnica} (60 seg): qué sensor, qué umbrales, qué alertas. Mostrar foto del micro:bit instalado. (3) \textbf{Datos y hallazgo} (75 seg): gráfico simple de los 30+ datos + 1 patrón observado. (4) \textbf{Propuesta de acción} (45 seg): qué se haría con el hallazgo. (5) \textbf{Honestidad técnica} (45 seg): lo que aún falla + cómo se mejoraría. Total: 5 minutos.
  - |-
    Las \textbf{5 preguntas técnicas duras} más típicas que recibirás: (a) \emph{``¿cómo elegiste los umbrales?''} (respuesta: bitácora de calibración de S6). (b) \emph{``¿qué pasa si el sensor se rompe?''} (responder con honestidad: el sistema queda mudo). (c) \emph{``¿tu propuesta de acción es factible?''} (defender con datos). (d) \emph{``¿por qué solo 30 mediciones?''} (defender la muestra o reconocer su limitación). (e) \emph{``¿qué harías distinto si tuvieras otra semana?''} (responder con honestidad técnica). Anticipa estas preguntas con respuestas preparadas.
  - |-
    Los \textbf{6 errores del sustentante novato}: (1) Leer las slides. (2) Esconder lo que falla. (3) Inflar el hallazgo. (4) Demo con captura en lugar de en vivo. (5) Evadir preguntas duras. (6) Cierre débil sin propuesta clara.
  - |-
    Algoritmo: (1) revisar inventario honesto. (2) armar las 4-5 slides. (3) escribir guion de 600-700 palabras (=5 min). (4) ensayar cronometrado. (5) preparar demo en vivo (asegurarse de que el micro:bit funcionará). (6) sustentar. (7) responder con honestidad. (8) autoevaluar.
  anatomia:
    titulo: Anatomía de la sustentación técnica
    body: |-
      \textbf{Slide 1 (45s):} Problema + variable. \\[1mm] \textbf{Slide 2 (60s):} Solución técnica + foto. \\[1mm] \textbf{Slide 3 (75s):} Datos + hallazgo. \\[1mm] \textbf{Slide 4 (45s):} Propuesta de acción. \\[1mm] \textbf{Slide 5 (45s):} Honestidad técnica. \\[1mm] \textbf{Demo en vivo:} micro:bit funcionando.
  errores_comunes: |-
    (1) Leer las slides. (2) Esconder los bugs. (3) Inflar el hallazgo. (4) Demo solo con captura. (5) Evadir preguntas duras. (6) Cierre sin propuesta. (7) Pasarse del tiempo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía técnica de la sustentación». \textbf{Formato:} (a) plantilla de las 5 slides con tiempo; (b) las 5 preguntas duras con respuesta preparada; (c) los 7 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías sustentar mañana sin entrar en pánico.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- Sustentación ejecutada + autoevaluación} (45 min en sesión, incluye 5 min de sustentación pública · individual). Hora de ejecutar. Armas las 4-5 slides, ensayas, sustentas con demo en vivo del micro:bit, respondes preguntas con honestidad, autoevalúas.
  pilares:
  - |-
    Tu sustentación se construye en 6 pasos: (1) armar las 4-5 slides. (2) escribir guion de 600-700 palabras (=5 min). (3) preparar la demo en vivo: el micro:bit debe estar listo, con batería cargada, con el código grabado. (4) ensayar cronometrado al menos 2 veces. (5) sustentar en público con demo. (6) responder preguntas con honestidad técnica.
  - |-
    Sigue el patrón \textbf{``demo en vivo sobre captura''}: la demo en vivo demuestra que el sistema funciona; la captura no demuestra nada. Aunque la demo en vivo es más riesgosa (puede fallar el wifi, la batería, el código), es lo único que sustenta la afirmación \emph{``funciona''}. Si por algún motivo no puedes hacer demo en vivo, declara explícitamente por qué (\emph{``el laboratorio no tiene internet hoy''}) y muestra capturas adicionales.
  - |-
    La autoevaluación final tiene 2 partes: (a) \textbf{Fortaleza}: lo que hiciste mejor que la sustentación del periodo 1 (mejor manejo del tiempo, demo más limpia, respuestas más honestas). (b) \textbf{Mejora}: 1 cosa concreta que harás distinto en la próxima sustentación (más ensayo, mejor preparación de slides, más anticipación de preguntas). Específico, no genérico.
  - |-
    Algoritmo: (1) armar slides. (2) escribir guion. (3) preparar demo. (4) ensayar. (5) sustentar. (6) responder. (7) autoevaluar. (8) entregar al docente: slides + guion + autoevaluación.
  checklist:
    titulo: Checklist antes de sustentar
    items: |-
      \checkbox 4-5 slides armadas. \\[1mm] \checkbox Guion de 600-700 palabras escrito. \\[1mm] \checkbox Demo en vivo preparada (micro:bit listo). \\[1mm] \checkbox 2 ensayos cronometrados hechos. \\[1mm] \checkbox Sustentación dentro de 5 minutos. \\[1mm] \checkbox 2 cosas que funcionaron + 1 que falla declaradas. \\[1mm] \checkbox Respuestas con honestidad técnica preparadas. \\[1mm] \checkbox Autoevaluación final hecha.
  plantilla_guion: |-
    \textbf{Slide 1.} \textit{Problema + variable.} \\[1mm] \textbf{Slide 2.} \textit{Solución técnica.} \\[1mm] \textbf{Slide 3.} \textit{Datos + hallazgo.} \\[1mm] \textbf{Slide 4.} \textit{Propuesta de acción.} \\[1mm] \textbf{Slide 5.} \textit{Honestidad técnica.} \\[1mm] \textbf{Demo.} \textit{Micro:bit funcionando.} \\[1mm] \textbf{Autoevaluación.} \textit{Fortaleza + mejora.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Mi sustentación técnica». \textbf{Formato:} (a) referencia al archivo de slides; (b) guion escrito; (c) preguntas recibidas + respuestas; (d) autoevaluación. \textbf{Sabes que terminaste cuando} entregaste los materiales y reservaste tiempo para reflexionar.
  producto_titulo: Sustentación 5 min + 4-5 slides + demo en vivo + autoevaluación
  criterios:
  - 4-5 slides claras
  - Sustentación dentro de 5 minutos
  - Demo en vivo del micro:bit
  - 2 cosas que funcionaron + 1 que falla declaradas
  - Respuestas con honestidad técnica
  - Autoevaluación con fortaleza + mejora específica
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El sustentante que declara lo que aún no funciona devuelve oficio a la comunidad; el que lo esconde reproduce la lógica del fraude técnico.
    aplicacion: |-
      Tu sustentación cierra el periodo 2 y devuelve a la comunidad (el grupo) lo aprendido. La filosofía de la liberación pide que esa devolución sea honesta: no presentar el proyecto como perfecto cuando tiene grietas. Declarar \emph{``esto funciona, esto aún no, esto haría distinto''} es respeto por la audiencia y por el oficio.
    pregunta_espejo: |-
      ¿Mi sustentación devuelve oficio honesto, o presenta un proyecto inflado?
  estoico:
    autor: Epicteto
    cita: |-
      Declarar lo que no funciona es disciplina del carácter; esconderlo es debilidad disfrazada de competencia.
    aplicacion: |-
      Es tentador esconder los bugs para parecer más profesional. La disciplina estoica recomienda lo opuesto: \emph{declara con honestidad lo que aún no funciona}. Esa declaración no es debilidad: es lo que separa al profesional del aficionado. El relojero que ocultaba defectos perdía clientes en una semana; el que los declaraba los conservaba durante décadas.
    pregunta_espejo: |-
      ¿Estoy declarando lo que aún no funciona, o lo escondo esperando que nadie lo note?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La transparencia técnica es la nueva ética del oficio en la era de los sistemas complejos.
    aplicacion: |-
      En la era de la información, los sistemas son cada vez más complejos y la honestidad técnica es cada vez más necesaria. Quien declara las limitaciones de su sistema construye confianza; quien las esconde la erosiona. Tu sustentación de hoy te entrena en esa práctica que rige toda profesión técnica: \textbf{ser transparente sobre las limitaciones es virtud, no debilidad}.
    pregunta_espejo: |-
      ¿Mi sustentación contribuye a la cultura de la transparencia técnica, o la erosiona ocultando limitaciones?
compromiso: |-
  \textbf{Para la próxima sesión.} Cierras el periodo 2 (Lógica y micro:bit) y abre el periodo 3 (Multimedia y ciberética). La sesión 1 del periodo 3 trabajará el \textbf{diseño visual y la jerarquía de información} en piezas multimedia, base para todo lo que viene en el último tramo del año.

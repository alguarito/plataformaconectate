clave: 2-2
grado: 8
periodo: 2
sesion: 2
completo: true
duracion_min: 90
titulo: Tablas de verdad --- cuándo una regla vale de verdad
titulo_portada: |-
  Tablas
  de verdad
producto_final: |-
  Las tres tablas de verdad de Y, O y NO, completas. Tres situaciones reales del colegio modeladas con su propia tabla: aprobar una materia, salir temprano con permiso, recibir un descuento en la tienda escolar. Y el análisis escrito de una regla real con hueco, tomada de una publicidad, un juego o una norma.
apertura:
  origen: Cabildos nasa del norte del Cauca · la asamblea que juzga y la Sentencia T-523 de 1997
  fuente: |-
    Corte Constitucional de Colombia. (1997, 15 de octubre). \emph{Sentencia T-523 de 1997} (M. P. Carlos Gaviria Díaz).
  saber_ancestral: |-
    En el norte del Cauca, los cabildos nasa juzgan a sus comuneros en asamblea, delante de todos, para «devolver la armonía» a la comunidad. En 1997 un comunero de Jambaló, sancionado por la asamblea, acudió a la Corte Constitucional. La Corte dijo dos cosas a la vez (Corte Constitucional, 1997). Primera: los pueblos indígenas tienen derecho a juzgar según sus propias normas, como manda la Constitución. Segunda: ni siquiera un acuerdo de toda la comunidad puede saltarse el debido proceso; hay límites que no se negocian. Mira la forma de esa decisión. Una regla vale si la comunidad la acordó \textbf{y} si respetó el debido proceso. Las dos a la vez. Si falta una, la decisión no vale. Eso es una tabla de verdad: cuatro combinaciones y una sola donde la regla se cumple. La \textbf{cara de exclusión}: la sanción de aquel caso sigue en debate, y la Corte la admitió con límites; aquí no se toma como modelo sino como el punto exacto donde un acuerdo colectivo choca con los derechos de una persona. Hoy vas a construir tablas para saber cuándo una regla vale de verdad y cuándo tiene un hueco.
  saber_contemporaneo: |-
    Una \textbf{tabla de verdad} muestra el resultado de un operador en todas las combinaciones posibles. \textbf{Y}: verdadero solo cuando las dos son verdaderas; tres combinaciones falsas y una verdadera. \textbf{O}: falso solo cuando las dos son falsas; tres verdaderas y una falsa. \textbf{NO}: le da la vuelta: verdadero pasa a falso y falso a verdadero. Con dos condiciones la tabla tiene cuatro filas; con tres, ocho; con cuatro, dieciséis. Por eso los programadores parten las reglas grandes en pequeñas: una tabla de dieciséis filas no se revisa a ojo. La tabla sirve para tres cosas: encontrar combinaciones sin respuesta, encontrar reglas que nunca se cumplen y encontrar reglas que se cumplen siempre. Y sirve fuera de la programación: una promoción que dice «si compras esto y aquello y además…» esconde en su tabla lo poco probable que es ganar.
  pregunta_puente: |-
    La Corte dijo que una decisión vale si la comunidad la acordó y si respetó el debido proceso: las dos, no una. En la regla de tu colegio para aprobar una materia, ¿cuántas condiciones hay? ¿Y qué pasa en la combinación que la regla no menciona?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las condiciones de una regla real y contar sus combinaciones; (2) \textbf{aplicar} las tablas de Y, O y NO a tres situaciones del colegio; (3) \textbf{analizar} una regla real y encontrar la fila donde tiene hueco o contradicción; (4) \textbf{evaluar} una promoción o una regla de juego antes de creerle.
puentes:
  a_ruta: |-
    En la sesión 1 escribiste reglas con Y, O y NO. Hoy las verificas con tablas de verdad, fila por fila. En la sesión 3 vas a escribir algoritmos completos, y una tabla es lo que te dice si una decisión está bien pensada.
  a_escuta: |-
    Antes de la teoría, vas a tomar una regla real de tu colegio y a hacerle la tabla de cuatro filas. Casi siempre aparece una fila que la regla no aclara.
  a_sistematizacion: |-
    Ya viste la grieta de una regla real. Ahora aprendes las tres tablas universales, la cuenta de las filas, y con tu pareja modelas las tres situaciones del colegio.
  a_praxis: |-
    Ya sabes tabular. Toca usarlo contra una regla del mundo: una promoción, un juego o una norma. Y revisar las tablas de tu pareja fila por fila.
  a_producto: |-
    Lo que entregas hoy: las tres tablas universales, las tres situaciones del colegio y el análisis de una regla real. La prueba de calidad: cada fila de cada tabla tiene resultado, y ninguna dice «depende».
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Tabular una regla antes de aceptarla es una forma de no dejarse engañar, en la tienda y en la vida.
  a_triangulo: |-
    Para terminar, tres ideas sobre verificar antes de creer, contadas con palabras de esta guía: Dussel sobre las personas que no son cosas de un sistema, Séneca sobre no creer de inmediato lo que nos cuentan, Floridi sobre saber qué preguntar.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- La regla del colegio, fila por fila} (15 min · individual). (1) Toma una regla real de tu colegio con dos condiciones, por ejemplo: para reprobar el periodo hay que tener menos de 3 y haber faltado más de diez veces. (2) Dibuja una tabla de cuatro filas: verdadero-verdadero, verdadero-falso, falso-verdadero, falso-falso. (3) En cada fila escribe qué dice la regla: ¿reprobado o aprobado? (4) Marca la fila donde la regla no aclara qué pasa, si la hay. (5) Escribe en una línea qué le preguntarías a tu docente sobre esa fila.
  checks:
  - Tengo la regla escrita con sus dos condiciones y la tabla de cuatro filas.
  - Cada fila tiene un resultado o la marca de «no aclara».
  - Escribí la pregunta que le haría a mi docente sobre la fila dudosa.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- La regla del colegio, fila por fila». \textbf{Formato:} la regla, la tabla de 4 filas y 3 columnas (condición 1 / condición 2 / qué dice la regla) y la pregunta. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cuatro filas tienen resultado o marca, y tu pregunta nombra una fila concreta.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- Tres situaciones del colegio en tablas} (30 min · parejas). (1) Con tu pareja, escriban las tres tablas universales de Y, O y NO, completas. (2) Modelen la aprobación de una materia: nota mayor o igual a 3 Y asistencia mayor o igual al 80~\%. Cuatro filas. (3) Modelen el permiso de salida temprana: (autorización del acudiente O cita médica) Y firma de coordinación. Ocho filas. (4) Modelen el descuento de la tienda escolar con la regla que ustedes propongan, de tres condiciones. (5) En cada tabla, pongan nombre a las columnas: «nota», «asistencia», no «A» y «B».
  pilares:
  - |-
    \textbf{Las tres tablas universales.} Y: solo verdadero-verdadero da verdadero. O: solo falso-falso da falso. NO: verdadero pasa a falso y falso a verdadero. Son las mismas en cualquier lenguaje y en cualquier sistema.
  - |-
    \textbf{Cuántas filas.} Cada condición puede ser verdadera o falsa, así que las filas se duplican con cada condición nueva: dos condiciones, cuatro filas; tres, ocho; cuatro, dieciséis. Una tabla de dieciséis no se revisa a ojo: parte la regla en dos tablas pequeñas.
  - |-
    \textbf{Lo que la tabla revela.} Una fila sin respuesta es un hueco. Una regla que da falso en todas las filas es una contradicción: nunca se cumple. Una que da verdadero en todas es una tautología: no decide nada. Las tres se ven en la tabla y no se ven en el texto.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Identifica las condiciones simples. (2) Cuenta las filas. (3) Llena las combinaciones en orden, empezando por todo verdadero. (4) Aplica la regla fila por fila. (5) Busca huecos, contradicciones y tautologías. (6) Si hay, arregla la regla.
  anatomia:
    titulo: Las tres tablas, en una mirada
    body: |-
      \textbf{Y:} verdadero solo con las dos verdaderas. \\[1mm] \textbf{O:} falso solo con las dos falsas. \\[1mm] \textbf{NO:} lo contrario. \\[1mm] \textbf{Filas:} se duplican con cada condición. \\[1mm] \textbf{Hueco:} una fila sin respuesta.
  errores_comunes: |-
    (1) \textbf{Saltarse una fila}: con dos condiciones hay cuatro; con tres, ocho. (2) \textbf{Confundir Y con O}: la regla queda más estricta o más floja de lo que querías. (3) \textbf{Columnas sin nombre}: «A» y «B» no dicen nada; escribe «nota» y «asistencia». (4) \textbf{No ver la contradicción}: edad mayor que 10 Y menor que 5 da falso en todas las filas. (5) \textbf{Creer que la regla real está completa}: casi ninguna lo está; la tabla lo muestra.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- Tres situaciones en tablas». \textbf{Formato:} las tres tablas universales y las tres tablas del colegio, con columnas nombradas. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} las seis tablas tienen todas sus filas con resultado y ninguna columna se llama «A» o «B».
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Una regla del mundo, tabulada} (25 min · individual). (1) Elige una regla real con varias condiciones: una promoción («si compras dos y pagas en efectivo y es martes…»), la regla de un juego o una norma del colegio. (2) Escribe sus condiciones y hazle la tabla. (3) Busca la fila con hueco, la contradicción o la combinación que el anunciante esconde. (4) Escribe un párrafo de cinco líneas con lo que encontraste. (5) Revisa las tres tablas del colegio de tu pareja fila por fila y marca cualquier fila sin resultado.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) Las tres tablas universales. (2) Las tres tablas del colegio con columnas nombradas. (3) El análisis de una regla real: sus condiciones, su tabla y el párrafo con el hallazgo.
  - |-
    \textbf{Tabular antes de creer.} «Si compras dos productos Y pagas en efectivo Y es martes Y presentas el cupón, recibes el 10~\%». Cuatro condiciones, dieciséis filas, una sola gana. La tabla muestra lo que la publicidad esconde: casi nadie recibe el descuento.
  - |-
    \textbf{Cómo se escribe el hallazgo.} Primero la regla, tal como la dice el anuncio o la norma. Después la fila que importa: «cuando pagas con tarjeta, no hay respuesta» o «solo una fila de dieciséis da el descuento». Al final, qué le preguntarías a quien puso la regla.
  - |-
    \textbf{Cómo se revisa una tabla ajena.} Fila por fila, con el dedo. Si una fila dice «depende», es un hueco. Si dos filas iguales dan resultados distintos, hay un error. Anota la fila, no el adjetivo.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Las tres tablas universales de Y, O y NO, completas. \\[1mm] \checkbox Tabla de aprobación de materia, cuatro filas. \\[1mm] \checkbox Tabla de permiso de salida, ocho filas. \\[1mm] \checkbox Tabla del descuento, con la regla que propusimos. \\[1mm] \checkbox Todas las columnas con nombre. \\[1mm] \checkbox Una regla real tabulada, con párrafo de hallazgo. \\[1mm] \checkbox Tablas de mi pareja revisadas fila por fila.
  plantilla_guion: |-
    \textbf{Aprobar.} \textit{nota mayor o igual a 3 Y asistencia mayor o igual al 80~\%.} \\[1mm] \textbf{Salir temprano.} \textit{(acudiente O cita médica) Y firma.} \\[1mm] \textbf{Descuento.} \textit{Tres condiciones, ocho filas.} \\[1mm] \textbf{Regla del mundo.} \textit{Condiciones, tabla, la fila que importa.} \\[1mm] \textbf{Hallazgo.} \textit{Cinco líneas y una pregunta.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Una regla del mundo, tabulada». \textbf{Formato:} la regla, su tabla, el párrafo de cinco líneas y la lista de filas sin resultado que encontraste en las tablas de tu pareja. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} tu párrafo nombra una fila concreta de la tabla y revisaste las tres tablas ajenas con el dedo.
  producto_titulo: Tres tablas universales + tres situaciones del colegio + una regla real tabulada
  criterios:
  - Las tres tablas universales están completas y correctas
  - Las tres tablas del colegio tienen todas sus filas con resultado y las columnas con nombre
  - La tabla del permiso de salida tiene ocho filas
  - La regla real está tabulada y el párrafo nombra la fila con hueco, contradicción o trampa
  - Revisaste las tablas de tu pareja fila por fila y anotaste las filas sin resultado
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.2.2
    idea: |-
      Una persona no es una cosa más entre las cosas de un sistema. Cuando la reducimos a una fila, algo de ella queda por fuera.
    aplicacion: |-
      La Corte le puso límites al acuerdo de toda una comunidad porque del otro lado había una persona. Una tabla de verdad decide sobre casos; conviene recordar que en la fila «reprobado» hay alguien con nombre.
    pregunta_espejo: |-
      ¿Qué fila de mis tablas de hoy decide algo sobre una persona real?
  estoico:
    autor: Séneca · Sobre la ira, II, 29 (c. 45 d.C.)
    idea: |-
      No hay que apresurarse a creer lo que nos cuentan: muchos mienten para engañar y otros porque los engañaron.
    aplicacion: |-
      Una promoción es algo que te cuentan. Tabularla antes de creerla es la demora que Séneca recomienda: dieciséis filas después, sabes cuántas veces ganas de verdad.
    pregunta_espejo: |-
      ¿Qué regla creí esta semana sin hacerle la tabla?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      Ganan quienes saben preguntar y responder, y por eso saben qué datos buscar.
    aplicacion: |-
      La tabla de verdad es una forma de preguntar bien: ¿qué pasa en esta fila? Quien pregunta fila por fila encuentra el hueco antes de que el programa falle o antes de pagar en la tienda.
    pregunta_espejo: |-
      ¿Cuál fila de mi tabla no me atreví a preguntar porque parecía obvia?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus seis tablas y el análisis de la regla real. En la sesión 3 vas a escribir algoritmos completos en pseudocódigo y a dibujarlos en diagramas de flujo. Cada rombo del diagrama es una fila de tus tablas.
web:
  resumen: |-
    Una tabla de verdad muestra qué pasa en todas las combinaciones de una regla y descubre los huecos que el texto esconde. Hoy tabulas reglas del colegio y una promoción real, como la Corte que dijo que una decisión vale solo con acuerdo y con debido proceso a la vez.

grado: 8
periodo: 2
sesion: 2
completo: true
titulo: Tablas de verdad --- AND, OR, NOT como reglas universales
titulo_portada: |-
  Tablas de verdad ---
  AND, OR, NOT
  como reglas universales
producto_final: |-
  Tabla de verdad completa de los 3 operadores básicos (AND, OR, NOT) + 3 situaciones reales del colegio modeladas con tablas de verdad propias (sistema de aprobación de materia, permiso de salida temprana, descuento en tienda escolar) + análisis escrito de 1 error lógico común detectado en una situación real (publicidad engañosa, requisito ambiguo, regla de un juego)
apertura:
  saber_ancestral: |-
    En las comunidades indígenas del Pacífico colombiano, en los cabildos del Cauca y en las juntas de acción comunal de los barrios populares, había una figura que tomaba decisiones difíciles con una sabiduría que parecía simple pero era profunda: \textbf{el juez tradicional} o el \emph{mayor de la comunidad}. Cuando dos vecinos discutían sobre un lindero, cuando alguien era acusado de robo, cuando se decidía si un joven podía entrar al cabildo, el mayor aplicaba reglas claras que la comunidad entera conocía. Tres principios silenciosos guiaban su juicio: (1) \emph{Para condenar se necesitan \textbf{dos pruebas} (testigo Y evidencia material)}: la lógica del AND. Una sola no basta. (2) \emph{Para absolver \textbf{basta una duda razonable}}: la lógica del OR. Cualquier elemento que ponga la culpa en duda, libera. (3) \emph{Para mantener la justicia, \textbf{ninguna mentira} en el testimonio}: la lógica del NOT. La falsedad en una sola pieza derrumba todo el juicio. La sabiduría era inquebrantable: \textbf{la justicia tradicional ya operaba con tablas de verdad mucho antes de que la matemática las inventara con ese nombre}. Las tablas de verdad de la lógica formal solo formalizan reglas que las comunidades aplicaron durante siglos.
  saber_contemporaneo: |-
    Una \textbf{tabla de verdad} es un diagrama que muestra el resultado de un operador lógico para todas las combinaciones posibles de entrada. Para los 3 operadores básicos: (1) \textbf{AND} (Y): \texttt{V AND V = V}, \texttt{V AND F = F}, \texttt{F AND V = F}, \texttt{F AND F = F}. Solo es verdadero cuando ambas son verdaderas. (2) \textbf{OR} (O): \texttt{V OR V = V}, \texttt{V OR F = V}, \texttt{F OR V = V}, \texttt{F OR F = F}. Solo es falso cuando ambas son falsas. (3) \textbf{NOT} (NO): \texttt{NOT V = F}, \texttt{NOT F = V}. Invierte el valor. La regla profesional moderna: \textbf{ninguna lógica compleja se verifica sin tabla de verdad}. Las tablas de verdad permiten detectar contradicciones (combinaciones imposibles), tautologías (siempre verdaderas), errores lógicos comunes (publicidad engañosa, contratos con cláusulas que se anulan, requisitos imposibles de cumplir). Son herramienta del oficio del pensamiento computacional.
  pregunta_puente: |-
    ¿Qué sabía el mayor del cabildo al exigir dos pruebas para condenar pero solo una duda para absolver, que el novato olvida cuando construye reglas sin verificar todas las combinaciones? ¿Y por qué una tabla de verdad de 4 filas puede revelar una contradicción que el ojo no detecta?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 4 combinaciones posibles de 2 condiciones binarias (V/V, V/F, F/V, F/F) y completar la tabla de verdad de AND, OR y NOT; (2) \textbf{explicar} con tus palabras por qué AND es más restrictivo que OR y cuándo conviene cada uno; (3) \textbf{analizar} 3 situaciones reales del colegio armando su tabla de verdad propia; (4) \textbf{evaluar} un error lógico común (publicidad engañosa, requisito ambiguo) detectando la contradicción con tabla de verdad.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 aprendiste a usar AND, OR y NOT en algoritmos. Hoy aprendes a \emph{verificarlos formalmente} con tablas de verdad. Las próximas sesiones (pseudocódigo, micro:bit) usarán esta habilidad: cualquier programa con varias condiciones se verifica con tabla de verdad antes de ejecutarse.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{experimento del juez}: lees 3 reglas reales que existen en tu colegio (\emph{``para perder la materia hay que tener menos de 3 Y haber faltado más de 10 veces''}, etc.) y vas a verificar con tabla de verdad si la regla cubre todos los casos justamente.
  a_sistematizacion: |-
    Ya hiciste el experimento. Ahora vas a entender la \textbf{anatomía de las tablas de verdad}: las 4 filas obligatorias para 2 condiciones, las 8 filas para 3, los 5 errores típicos del análisis lógico (olvidar una fila, mezclar AND con OR, no nombrar las columnas, contradicciones, casos imposibles).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: armas las tablas de verdad de los 3 operadores básicos, modelas 3 situaciones del colegio con tablas propias, y analizas 1 error lógico común detectándolo con tabla de verdad.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 3 tablas de verdad básicas + 3 tablas de situaciones reales + análisis de 1 error lógico. El criterio principal: que cualquier compañero, viendo tus tablas, pueda confirmar o cuestionar cada combinación.
  a_evaluacion: |-
    Antes de cerrar, mira las tablas desde las cinco dimensiones humanas. Verificar todas las combinaciones es respeto por la justicia del juez del cabildo; saltarse algunas es repetir errores que la sabiduría comunitaria evitó durante siglos.
  a_triangulo: |-
    Y para terminar, tres voces sobre la verdad formal. Dussel sobre las reglas que excluyen sin tabla de verdad, Marco Aurelio sobre la claridad del pensamiento, Floridi sobre la lógica formal como ética del oficio digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El experimento del juez (15 min · individual)}. Toma 1 regla real de tu colegio (\emph{``para reprobar el periodo hay que tener menos de 3 Y haber faltado más de 10 veces''}, o cualquier otra con 2 condiciones combinadas). Construye una tabla con 4 filas: (V,V), (V,F), (F,V), (F,F). Para cada combinación, anota qué dice la regla (¿reprobado o aprobado?). ¿Hay alguna combinación que la regla no cubre claramente? Esa es la grieta lógica del enunciado real.
  checks:
  - Elegí una regla real del colegio.
  - Construí tabla de 4 filas con las combinaciones.
  - Detecté si la regla cubre o no todas las combinaciones.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Experimento del juez». \textbf{Formato:} ficha con la regla + tabla de 4 filas + observación final sobre si hay grietas lógicas. \textbf{Sabes que terminaste cuando} ves que las reglas reales muchas veces tienen grietas que se descubren con tabla de verdad.
sistematizacion:
  intro: |-
    Las tablas son herramienta de verificación. Ahora necesitas la \textbf{anatomía completa de los 3 operadores básicos} y la regla para construir tablas con más condiciones.
  pilares:
  - |-
    Las tablas de verdad de los 3 operadores básicos son fijas y universales: (1) \textbf{AND} (V solo si ambos V): \texttt{V,V→V}; \texttt{V,F→F}; \texttt{F,V→F}; \texttt{F,F→F}. Solo 1 caso verdadero. (2) \textbf{OR} (V si al menos uno V): \texttt{V,V→V}; \texttt{V,F→V}; \texttt{F,V→V}; \texttt{F,F→F}. Solo 1 caso falso. (3) \textbf{NOT} (invierte): \texttt{V→F}; \texttt{F→V}. Estas tablas son ley del pensamiento computacional: nunca cambian, sirven para cualquier lenguaje, cualquier sistema.
  - |-
    La regla del \textbf{número de combinaciones}: con n condiciones binarias hay $2^n$ combinaciones posibles. Con 2 condiciones: 4 filas. Con 3: 8 filas. Con 4: 16 filas. Cuanto más complejo el algoritmo, más filas. Por eso los programadores profesionales prefieren descomponer reglas grandes en pequeñas: una tabla de 16 filas es difícil de verificar a ojo; dos tablas de 4 conectadas son manejables.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿mi regla produce una respuesta clara para cada combinación posible?}. Si una combinación queda sin respuesta o con respuesta ambigua, la regla tiene una grieta. La phronesis del oficio computacional consiste en \textbf{cerrar todas las grietas con casos explícitos antes de ejecutar el algoritmo}.
  - |-
    Algoritmo para verificar una regla con tabla de verdad: (1) identifica las condiciones simples (variables booleanas). (2) cuenta cuántas filas necesita la tabla ($2^n$). (3) llena las combinaciones de entrada de manera ordenada (V,V; V,F; F,V; F,F para 2). (4) aplica la regla a cada combinación y anota el resultado. (5) busca filas con resultado ambiguo o contradictorio. (6) si hay grietas, ajusta la regla.
  anatomia:
    titulo: Anatomía de las tablas de verdad
    body: |-
      \textbf{AND:} solo V,V $\to$ V. \\[1mm] \textbf{OR:} solo F,F $\to$ F. \\[1mm] \textbf{NOT:} invierte. \\[1mm] \textbf{Filas:} $2^n$ con n condiciones. \\[1mm] \textbf{Grieta:} combinación sin respuesta clara.
  errores_comunes: |-
    (1) \textbf{Olvidar una fila}: con 2 condiciones hay 4 combinaciones; saltarse una deja casos sin verificar. (2) \textbf{Confundir AND con OR}: la regla queda más permisiva o más restrictiva de lo intencionado. (3) \textbf{Columnas sin nombre claro}: \emph{``A''} y \emph{``B''} es confuso; mejor \emph{``llueve''} y \emph{``hay viento''}. (4) \textbf{Casos imposibles no detectados}: \emph{edad>10 AND edad<5} nunca se cumple, pero si no se ve en tabla no se nota. (5) \textbf{Reglas reales con grietas}: una norma real puede tener combinaciones sin respuesta clara, y la tabla las revela.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía de tablas de verdad». \textbf{Formato:} (a) las 3 tablas universales (AND, OR, NOT); (b) la regla de $2^n$ filas; (c) los 5 errores típicos. \textbf{Sabes que terminaste cuando} podrías predecir el resultado de cualquier expresión con 2-3 operadores.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- 3 tablas reales + 1 error analizado} (35 min · individual). Hora de aplicar. Construyes tablas de verdad para 3 situaciones reales del colegio y analizas 1 error lógico común que encontrarás en publicidad, reglas o juegos.
  pilares:
  - |-
    Las 3 situaciones reales del colegio sugeridas: (1) \textbf{Aprobación de materia}: condiciones (nota>=3 AND asistencia>=80\%). Tabla de 4 filas. (2) \textbf{Permiso de salida temprana}: condiciones (autorización\_padre OR cita\_médica) AND firma\_coordinador. Tabla con 3 condiciones = 8 filas. (3) \textbf{Descuento en tienda escolar}: condiciones (es\_miércoles\_de\_la\_promo AND compra>=5000) OR (cliente\_frecuente AND NO\_es\_temporada\_alta). Tabla con 4 condiciones = 16 filas. Para cada una, identifica la combinación que produciría la decisión final.
  - |-
    El análisis del error lógico común tiene estructura simple: (a) elige una publicidad, un juego, una regla real que tenga combinación de condiciones. (b) construye su tabla de verdad. (c) busca: ¿hay alguna combinación contradictoria?, ¿alguna que la regla no aclara qué pasa?, ¿alguna que el anunciante esconde? Documenta el hallazgo en 1 párrafo.
  - |-
    Sigue el patrón \textbf{``verificar antes de creer''}: cuando alguien te presenta una regla con varias condiciones (\emph{``Si compras X y Y, recibes Z''}), construye su tabla de verdad antes de aceptarla. Muchas veces la regla esconde que la combinación favorable es muy poco probable. La phronesis del consumidor consiste en \textbf{tabular antes de confiar}.
  - |-
    Algoritmo: (1) para cada situación, identifica condiciones. (2) construye tabla con $2^n$ filas. (3) aplica la regla a cada fila. (4) detecta grietas o contradicciones. (5) elige 1 error lógico real para analizar. (6) escribe párrafo de hallazgo.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 3 tablas de verdad universales (AND, OR, NOT) completadas. \\[1mm] \checkbox Tabla de aprobación de materia armada. \\[1mm] \checkbox Tabla de permiso de salida temprana armada. \\[1mm] \checkbox Tabla de descuento en tienda armada. \\[1mm] \checkbox Cada tabla con columnas nombradas (no solo A, B). \\[1mm] \checkbox 1 error lógico real analizado en párrafo de hallazgo. \\[1mm] \checkbox Grietas o contradicciones detectadas declaradas.
  plantilla_guion: |-
    \textbf{Tabla 1 (AND, OR, NOT).} \textit{Las 3 tablas universales.} \\[1mm] \textbf{Tabla 2 (Aprobación).} \textit{nota AND asistencia.} \\[1mm] \textbf{Tabla 3 (Permiso).} \textit{(autorización OR cita) AND firma.} \\[1mm] \textbf{Tabla 4 (Descuento).} \textit{Combinación compleja con 4 condiciones.} \\[1mm] \textbf{Análisis de error.} \textit{Situación real + tabla + hallazgo.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- Tablas reales + error analizado». \textbf{Formato:} (a) las 3 tablas universales; (b) las 3 tablas de situaciones reales; (c) análisis del error lógico en 1 párrafo. \textbf{Sabes que terminaste cuando} podrías auditar una regla real con tabla de verdad.
  producto_titulo: 3 tablas universales + 3 tablas reales + análisis de error lógico
  criterios:
  - Tablas de verdad de AND, OR, NOT completas
  - 3 tablas de situaciones reales del colegio
  - Columnas con nombres descriptivos
  - 1 error lógico real analizado
  - Grietas o contradicciones declaradas
  - Tablas con número correcto de filas ($2^n$)
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Una regla que no cubre todos los casos repite la lógica del sistema que excluye a quien queda en la grieta.
    aplicacion: |-
      Cuando un sistema de aprobación, permiso o beneficio tiene grietas en su tabla de verdad, alguien quedará sin respuesta del sistema. Si la regla del descuento dice \emph{``cliente frecuente Y compra mayor a X''} y no aclara qué pasa cuando un cliente frecuente compra menos, hay grieta que excluye sin justificación. La filosofía de la liberación pide cerrar esas grietas: no dejar a nadie sin respuesta. La phronesis del oficio consiste en \textbf{tabular para que nadie quede afuera por descuido}.
    pregunta_espejo: |-
      ¿Mis reglas cubren todos los casos posibles, o dejo grietas que excluirían a alguien?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Verificar antes de aceptar es virtud; aceptar reglas sin tabular es debilidad disfrazada de confianza.
    aplicacion: |-
      Es tentador aceptar reglas presentadas con seguridad sin verificar. La disciplina estoica recomienda lo opuesto: \emph{tabula antes de aceptar}. Una regla publicitaria que parece favorable puede esconder, al tabular, que la combinación ganadora es casi imposible. Esa verificación lógica es virtud profesional del pensamiento computacional.
    pregunta_espejo: |-
      ¿Estoy verificando lógicamente las reglas que me presentan, o las acepto porque suenan bien?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La lógica formal explícita es la nueva ética del oficio en la era de los algoritmos invisibles.
    aplicacion: |-
      Los algoritmos toman decisiones invisibles sobre nuestras vidas: créditos, recomendaciones, accesos. La ética digital exige que esas decisiones sean revisables con lógica formal. Tu habilidad de tabla de verdad te entrena para auditar algoritmos del mundo real. Sin tabular, los algoritmos parecen mágicos; tabulando, se revelan como reglas que se pueden discutir.
    pregunta_espejo: |-
      ¿Podría auditar un algoritmo real (préstamo, admisión, recomendación) con las tablas de verdad que aprendí hoy?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus tablas y el análisis del error lógico. En la sesión 3 vas a aprender a escribir \textbf{algoritmos en pseudocódigo y diagramas de flujo}, que son las herramientas para comunicar la lógica antes de programarla. Las tablas de hoy son el control de calidad; los algoritmos de mañana son la implementación.
web:
  conceptos_clave:
    - termino: Tabla de verdad
      definicion: |-
        Diagrama que muestra el resultado de un operador lógico para todas las combinaciones posibles de entrada. Herramienta de verificación formal.
      ejemplo: |-
        Para AND con 2 entradas (V,V→V; V,F→F; F,V→F; F,F→F). Las 4 filas cubren todos los casos posibles.
      emoji: "📋"
    - termino: Combinaciones 2^n
      definicion: |-
        Fórmula que da el número de filas de una tabla de verdad. Con n condiciones binarias hay 2^n combinaciones distintas.
      ejemplo: |-
        2 condiciones = 4 filas. 3 = 8. 4 = 16. La tabla crece exponencialmente con cada condición añadida.
      emoji: "🧮"
    - termino: Tautología
      definicion: |-
        Expresión lógica que es verdadera en todos los casos. Tabla de verdad con la columna resultado siempre V.
      ejemplo: |-
        "Llueve O NO llueve" es tautología: siempre verdadera. No aporta información: siempre se cumple.
      emoji: "♾"
    - termino: Contradicción
      definicion: |-
        Expresión lógica que es falsa en todos los casos. Tabla de verdad con la columna resultado siempre F.
      ejemplo: |-
        "Llueve Y NO llueve" es contradicción: nunca se cumple. Imposible que ambas sean verdaderas simultáneamente.
      emoji: "⛔"
    - termino: Grieta lógica
      definicion: |-
        Combinación de entradas que la regla no contempla con claridad. Caso sin respuesta definida en el algoritmo.
      ejemplo: |-
        Regla "si nota≥3 y asistencia≥80% aprueba" no define qué pasa con nota 3 y asistencia 75%. Grieta a cerrar.
      emoji: "🕳"
  quiz:
    titulo: ¿Sabes construir tabla de verdad?
    instrucciones: 5 preguntas para verificar que dominas tablas de verdad de AND/OR/NOT y reconoces tautologías y contradicciones.
    preguntas:
      - enunciado: 'Para AND con 2 entradas, ¿cuántas combinaciones resultan en V (verdadero)?'
        opciones:
          - 1 de 4
          - 0 de 4
          - 2 de 4
          - 4 de 4
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Solo (V,V)→V. Las otras 3 combinaciones dan F. AND es muy restrictivo.
        feedback_incorrecto: |-
          AND solo da V cuando ambas entradas son V. Es 1 de 4 (solo V,V→V).
      - enunciado: 'Para OR con 2 entradas, ¿cuántas combinaciones resultan en F (falso)?'
        opciones:
          - 0 de 4
          - 1 de 4
          - 2 de 4
          - 4 de 4
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Solo (F,F)→F. Las otras 3 combinaciones dan V. OR es permisivo.
        feedback_incorrecto: |-
          OR solo da F cuando ambas entradas son F. Es 1 de 4 (solo F,F→F).
      - enunciado: 'Con 4 condiciones binarias en un algoritmo, ¿cuántas filas tendría la tabla de verdad?'
        opciones:
          - "4"
          - "8"
          - "16"
          - "32"
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. 2^4 = 16 combinaciones posibles. La tabla crece rápido con cada condición nueva.
        feedback_incorrecto: |-
          2^4 = 16. Con cada condición la tabla se duplica.
      - enunciado: '"Llueve O NO llueve" es una expresión que en todos los casos es V. ¿Cómo se llama?'
        opciones:
          - Contradicción
          - Grieta lógica
          - Ambigüedad
          - Tautología
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. Una tautología es expresión siempre verdadera. No aporta información porque se cumple en todos los casos.
        feedback_incorrecto: |-
          Es tautología: siempre verdadera. La contradicción es lo opuesto (siempre falsa).
      - enunciado: 'La regla del colegio dice "aprobado si nota≥3 Y asistencia≥80%". Con nota 3 y asistencia 75%, ¿qué pasa?'
        opciones:
          - Reprobado
          - Aprobado
          - Hay grieta lógica porque la regla no lo aclara
          - Se decide por otro criterio
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Como nota≥3 (V) Y asistencia≥80% (F), el AND da F. Reprobado por incumplir asistencia. La regla SÍ lo cubre.
        feedback_incorrecto: |-
          La regla cubre el caso: con AND, basta que una falle. Asistencia 75% es F en "≥80%". AND da F = Reprobado.

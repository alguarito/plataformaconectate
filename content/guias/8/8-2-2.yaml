      Las reglas que te aplican en el colegio, en un juego y en una promoción casi nunca están completas. Saber tabularlas te dice qué pasa en la fila que nadie aclaró, antes de que te toque a ti.
    pregunta_detonante: |-
      En la regla para aprobar una materia, ¿qué pasa en la combinación que la regla no menciona?
    activacion:
      titulo: La promoción de los martes
      descripcion: |-
        En 3 minutos, cuenta cuántas condiciones tiene esta promoción, «si compras dos, pagas en efectivo, es martes y traes el cupón, recibes el 10 %». ¿En cuántas combinaciones ganas?
      duracion_min: 5
    conexion:
      anterior: En la sesión 1 escribiste reglas con Y, O y NO en pseudocódigo.
      siguiente: En la sesión 3 escribes algoritmos completos y los dibujas en diagramas de flujo.

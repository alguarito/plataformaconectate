clave: 2-3
grado: 8
periodo: 2
sesion: 3
completo: true
titulo: Algoritmos --- del pseudocódigo al diagrama de flujo
titulo_portada: |-
  Algoritmos ---
  del pseudocódigo
  al diagrama de flujo
producto_final: |-
  1 algoritmo cotidiano (preparar arepa, llegar al colegio, decidir qué ropa usar, hacer cabello, lavar tenis) escrito en pseudocódigo claro de al menos 8 pasos con uso de variables y al menos 1 if-else + traducción del mismo algoritmo a diagrama de flujo usando los 4 símbolos correctos (óvalo inicio/fin, rectángulo proceso, rombo decisión, paralelogramo entrada/salida) + breve descripción de 5 líneas explicando cómo se conectan los dos formatos
apertura:
  saber_ancestral: |-
    En las cocinas del Valle del Cauca y en las casas de los abuelos del Pacífico, las recetas no se escribían: se transmitían. Pero cualquier abuela que enseñaba a hacer arepa o sancocho seguía un orden inquebrantable que cualquier nieto reconoce: \textbf{primero esto, después aquello, si pasa esto otra cosa}. \emph{``Primero pelas el plátano. Después lo cortas en rodajas. Si está verde, lo fríes. Si está maduro, lo asas. Si quedan pedazos, los muelo''}. La receta tiene 4 piezas silenciosas que cualquier algoritmo profesional reconocería: (1) \textbf{Secuencia}: el orden de los pasos importa (no se puede cortar antes de pelar). (2) \textbf{Decisión}: a veces hay dos caminos según una condición (verde → freír / maduro → asar). (3) \textbf{Repetición}: a veces hay que hacer lo mismo varias veces (\emph{``revuelve hasta que esté liso''}). (4) \textbf{Entrada y salida}: la materia prima entra (plátano), el plato sale (frito o asado). La sabiduría de la receta ancestral es la \textbf{forma natural del algoritmo}: la programación moderna no inventó esta estructura, solo le dio nombres formales.
  origen: Recetas tradicionales del campo colombiano (sancocho, ajiaco, mote, chicha)
  saber_contemporaneo: |-
    Un \textbf{algoritmo} es una secuencia ordenada de pasos finitos que resuelve un problema. Se puede expresar de varias formas: (1) \textbf{Pseudocódigo}: lenguaje cercano al humano pero estructurado, con instrucciones claras. Ejemplo: \texttt{LEER edad; SI edad >= 18 ENTONCES MOSTRAR ``mayor''; SINO MOSTRAR ``menor''}. (2) \textbf{Diagrama de flujo}: representación visual con cajas y flechas, usando 4 símbolos estándar: \textbf{óvalo} para inicio/fin, \textbf{rectángulo} para procesos, \textbf{rombo} para decisiones, \textbf{paralelogramo} para entrada/salida de datos. Las flechas indican el orden. La regla profesional del pensamiento computacional: \textbf{antes de programar, escribir el algoritmo en pseudocódigo o diagrama}. Saltarse esta etapa lleva a código desordenado y errores difíciles de depurar. Los dos formatos son complementarios: el pseudocódigo es preciso, el diagrama es visual; juntos comunican la lógica a personas técnicas y no técnicas.
  pregunta_puente: |-
    ¿Qué sabía la abuela al transmitir la receta del sancocho con orden estricto, que el programador novato olvida cuando salta a escribir código sin pensar el algoritmo? ¿Y por qué un diagrama de flujo bien hecho permite explicar un algoritmo a alguien que no programa?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 4 estructuras básicas de un algoritmo (secuencia, decisión, repetición, entrada/salida) en una receta o tarea cotidiana; (2) \textbf{explicar} la diferencia entre pseudocódigo y diagrama de flujo y cuándo conviene cada uno; (3) \textbf{crear} un algoritmo en pseudocódigo y traducirlo a diagrama de flujo con los 4 símbolos correctos; (4) \textbf{evaluar} un algoritmo ajeno detectando si los pasos están ordenados, si las decisiones cubren todos los casos y si los símbolos del diagrama son correctos.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 1-2 aprendiste a decidir con AND/OR/NOT y a verificar con tablas de verdad. Hoy aprendes a \emph{escribir y dibujar} la lógica completa en formato profesional. Las próximas sesiones (sensores, actuadores, micro:bit) tomarán tus pseudocódigos como punto de partida para programar.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio del abuelo}: piensa en algo que sepas hacer bien y enséñalo por escrito con orden de pasos (la receta de algo, la rutina de la mañana, cómo preparar el morral). Esa transmisión escrita ya es algoritmo en lenguaje natural.
  a_sistematizacion: |-
    Ya tienes el ejercicio. Ahora vas a entender la \textbf{anatomía formal}: las 4 estructuras básicas, el pseudocódigo con convenciones, los 4 símbolos del diagrama de flujo, los 5 errores típicos del aprendiz que delatan falta de pensamiento previo.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: eliges 1 tarea cotidiana, la escribes en pseudocódigo claro (8+ pasos, variables, 1+ if-else), la traduces a diagrama de flujo con los 4 símbolos, y escribes 5 líneas explicando cómo se conectan los dos formatos.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 1 algoritmo en pseudocódigo + 1 diagrama de flujo + descripción de conexión. El criterio principal: que un compañero pueda ejecutar mentalmente tu algoritmo y llegar al resultado correcto, mirando solo el diagrama.
  a_evaluacion: |-
    Antes de cerrar, mira el algoritmo desde las cinco dimensiones humanas. Escribir el pseudocódigo antes de programar es respeto por el oficio; saltar a programar es desperdicio que produce errores caros.
  a_triangulo: |-
    Y para terminar, tres voces sobre la planeación del oficio. Dussel sobre los algoritmos que liberan o atrapan a sus usuarios, Epicteto sobre la disciplina de planear antes de actuar, Floridi sobre el algoritmo claro como ética del oficio digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Ejercicio del abuelo} (15 min · individual). Escribe en una hoja, paso a paso, cómo se hace algo que dominas: preparar un sándwich, alistar el morral del día siguiente, hacer un nudo de corbata, lavar los tenis. Reglas: (1) numera los pasos en orden. (2) usa frases cortas y claras. (3) si en algún paso hay una decisión (\emph{``si está sucio entonces lavar; si no, guardar''}), marca esa rama. (4) no te saltes ningún paso por obvio. La regla: si un extraterrestre leyera tu lista, debería poder ejecutarla.
  checks:
  - Escribí los pasos en orden numerado.
  - Identifiqué al menos 1 punto de decisión.
  - Mi lista podría ser ejecutada por alguien sin contexto.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Receta del abuelo». \textbf{Formato:} pasos numerados (al menos 8) + decisión marcada. \textbf{Sabes que terminaste cuando} otro estudiante podría ejecutar tu lista paso a paso.
sistematizacion:
  intro: |-
    Tu lista del abuelo ya es algoritmo en lenguaje natural. Ahora necesitas la \textbf{anatomía formal} del oficio computacional: las 4 estructuras, las convenciones del pseudocódigo, los 4 símbolos del diagrama de flujo.
  pilares:
  - |-
    Las 4 estructuras básicas se descomponen así: (1) \textbf{Secuencia}: pasos en orden, uno tras otro (\texttt{PASO 1; PASO 2; PASO 3}). (2) \textbf{Decisión} (selección): \texttt{SI condición ENTONCES PASO\_A SINO PASO\_B} (sesión 1). (3) \textbf{Repetición} (iteración): \texttt{REPETIR n VECES} o \texttt{MIENTRAS condición} para hacer lo mismo varias veces. (4) \textbf{Entrada/Salida}: \texttt{LEER variable} para recibir datos del usuario, \texttt{MOSTRAR variable} para devolver resultados. Estas 4 estructuras combinadas pueden expresar cualquier algoritmo posible.
  - |-
    Las convenciones del \textbf{pseudocódigo} son simples: (a) palabras clave en MAYÚSCULA (SI, ENTONCES, SINO, MIENTRAS, REPETIR, LEER, MOSTRAR). (b) variables en minúscula descriptiva (edad, nombre, temperatura). (c) indentación para mostrar jerarquía (lo que está dentro de un SI va indentado). (d) un paso por línea. (e) usar punto y coma o cambio de línea para separar pasos. No hay sintaxis estricta: lo importante es que sea claro.
  - |-
    Los \textbf{4 símbolos} del diagrama de flujo son universales: (1) \textbf{Óvalo}: inicio y fin del algoritmo. Siempre 1 inicio y al menos 1 fin. (2) \textbf{Rectángulo}: proceso (cálculo, asignación, paso de acción). (3) \textbf{Rombo}: decisión. Tiene 1 entrada y 2 salidas (sí/no, verdadero/falso). (4) \textbf{Paralelogramo}: entrada o salida de datos. Las flechas conectan los símbolos en orden. Un diagrama bien hecho se lee de arriba abajo (o izquierda a derecha) y no tiene flechas cruzadas innecesariamente.
  - |-
    Algoritmo para escribir un algoritmo: (1) define la tarea en 1 frase. (2) identifica entrada (datos que necesitas) y salida (resultado esperado). (3) lista pasos en orden. (4) identifica decisiones (puntos donde el algoritmo elige camino). (5) escribe en pseudocódigo. (6) traduce a diagrama. (7) prueba mentalmente con un caso de entrada y verifica que llegas al resultado.
  anatomia:
    titulo: Anatomía del algoritmo
    body: |-
      \textbf{4 estructuras:} secuencia / decisión / repetición / E/S. \\[1mm] \textbf{Pseudocódigo:} palabras clave + indentación. \\[1mm] \textbf{4 símbolos:} óvalo / rectángulo / rombo / paralelogramo. \\[1mm] \textbf{Flujo:} arriba-abajo o izquierda-derecha. \\[1mm] \textbf{1 inicio, 1+ fin.}
  errores_comunes: |-
    (1) \textbf{Saltarse pasos obvios}: el algoritmo asume que el ejecutor sabe lo que no se dijo. (2) \textbf{Mezclar símbolos en diagrama}: usar rectángulo donde debe ir rombo, o viceversa. (3) \textbf{Diagrama sin inicio o sin fin}: confunde al lector. (4) \textbf{Decisiones sin todas las ramas}: rombo con solo una salida deja al algoritmo sin camino. (5) \textbf{Flechas cruzadas sin necesidad}: produce diagramas ilegibles; conviene reorganizar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía del algoritmo». \textbf{Formato:} (a) las 4 estructuras con ejemplo; (b) los 4 símbolos dibujados con su uso; (c) los 5 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías dibujar un diagrama desde cero sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Algoritmo en pseudocódigo + diagrama de flujo} (40 min · individual). Hora de crear. Eliges 1 tarea cotidiana, la escribes en pseudocódigo de 8+ pasos con variables y al menos 1 if-else, y la traduces a diagrama de flujo con los 4 símbolos correctos.
  pilares:
  - |-
    Tu algoritmo se construye en 5 pasos: (1) elegir tarea concreta (preparar arepa, decidir ropa según clima, hacer la maleta del fin de semana, planificar la ruta al colegio). (2) identificar entrada (qué necesitas saber) y salida (qué se entrega). (3) escribir pseudocódigo de 8+ pasos con uso de variables (clima, tiempo\_disponible, etc.) y al menos 1 if-else. (4) traducir a diagrama de flujo con los 4 símbolos. (5) escribir 5 líneas explicando cómo se conectan los dos formatos (qué se ve mejor en cada uno).
  - |-
    Sigue el patrón \textbf{``pseudocódigo primero, diagrama después''}: el pseudocódigo te obliga a pensar la lógica; el diagrama te obliga a verificar el flujo visual. Si haces el diagrama primero, las cajas tienden a ser vagas. Si haces el pseudocódigo primero, el diagrama queda preciso.
  - |-
    Las herramientas para hacer el diagrama: (a) papel y lápiz (lo más rápido para borrador). (b) \textbf{draw.io} (gratis, en línea, símbolos profesionales). (c) Google Slides o PowerPoint con formas básicas. (d) Lucidchart (gratis con cuenta). Para esta sesión es válido cualquiera; lo importante es que los símbolos sean los 4 estándar.
  - |-
    Algoritmo: (1) elegir tarea. (2) escribir pseudocódigo. (3) verificar con caso de entrada. (4) hacer borrador del diagrama. (5) digitalizar el diagrama (opcional pero recomendado). (6) escribir las 5 líneas de conexión. (7) revisar con un compañero (¿entiende el algoritmo solo viendo el diagrama?).
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Tarea elegida concreta y cotidiana. \\[1mm] \checkbox Pseudocódigo con 8+ pasos. \\[1mm] \checkbox Al menos 1 variable usada. \\[1mm] \checkbox Al menos 1 if-else. \\[1mm] \checkbox Diagrama de flujo con los 4 símbolos. \\[1mm] \checkbox 1 inicio (óvalo) y al menos 1 fin (óvalo). \\[1mm] \checkbox Sin flechas cruzadas innecesariamente. \\[1mm] \checkbox 5 líneas explicando la conexión entre formatos.
  plantilla_guion: |-
    \textbf{Tarea.} \textit{Una sola, concreta, cotidiana.} \\[1mm] \textbf{Entrada.} \textit{Datos que recibo.} \\[1mm] \textbf{Salida.} \textit{Resultado que produzco.} \\[1mm] \textbf{Pseudocódigo.} \textit{8+ pasos, variables, 1+ if-else.} \\[1mm] \textbf{Diagrama.} \textit{Con los 4 símbolos.} \\[1mm] \textbf{Conexión.} \textit{Cómo se complementan los formatos.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Algoritmo + diagrama». \textbf{Formato:} (a) pseudocódigo con sus 8+ pasos; (b) diagrama de flujo dibujado o pegado; (c) 5 líneas de conexión. \textbf{Sabes que terminaste cuando} podrías delegar la ejecución del algoritmo a alguien con solo tu diagrama.
  producto_titulo: Algoritmo en pseudocódigo + diagrama de flujo + descripción de conexión
  criterios:
  - Pseudocódigo con 8+ pasos claros
  - Uso de al menos 1 variable
  - Al menos 1 if-else
  - Diagrama de flujo con los 4 símbolos correctos
  - Flujo legible (arriba-abajo o izquierda-derecha)
  - Descripción de cómo se complementan los formatos
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un algoritmo claro libera al ejecutor; un algoritmo opaco lo somete a la voluntad oculta del programador.
    aplicacion: |-
      Cuando tu algoritmo está escrito con claridad (pseudocódigo legible + diagrama explícito), cualquiera puede revisarlo, ajustarlo, criticarlo. La filosofía de la liberación pide esa transparencia. Cuando el algoritmo es opaco, solo el programador lo entiende y el ejecutor depende de él. La phronesis del oficio consiste en \textbf{escribir algoritmos que liberen, no que aten}.
    pregunta_espejo: |-
      ¿Mi algoritmo es lo suficientemente claro para que otro lo modifique sin pedirme ayuda?
  estoico:
    autor: Epicteto
    cita: |-
      Planear antes de actuar es virtud del oficio; improvisar es debilidad disfrazada de espontaneidad.
    aplicacion: |-
      Es tentador saltar a programar sin escribir pseudocódigo. La disciplina estoica recomienda lo opuesto: \emph{planea antes de actuar}. Escribir el algoritmo en pseudocódigo y diagrama te ahorra horas de debug posterior. La phronesis del oficio honra al programador que dedica 15 minutos a planear antes de escribir 2 horas de código.
    pregunta_espejo: |-
      ¿Estoy planeando con pseudocódigo antes de actuar, o salto directo al código sin pensar?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El algoritmo claro y revisable es la nueva ética del oficio digital en la era automatizada.
    aplicacion: |-
      En la era de la automatización, los algoritmos deciden por nosotros (filtros de redes, recomendaciones, créditos). La ética digital exige que esos algoritmos sean revisables: cualquier persona técnica debe poder leer el pseudocódigo o ver el diagrama y entender cómo se decide. Tu hoja de hoy te entrena en esa práctica que rige toda profesión técnica del siglo XXI.
    pregunta_espejo: |-
      ¿Mi pseudocódigo permite revisar la lógica, o oculta la decisión bajo código complejo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu algoritmo (pseudocódigo + diagrama). En la sesión 4 vas a programar tu primer programa real en \textbf{MakeCode} para el micro:bit, usando sensores que perciben el mundo. Los algoritmos en papel de hoy son la base; el código que reacciona al entorno de mañana se monta sobre esa planeación.
web:
  conceptos_clave:
    - termino: Pseudocódigo
      definicion: |-
        Lenguaje cercano al humano pero estructurado: usa palabras clave (SI, ENTONCES, MIENTRAS) e indentación para mostrar la lógica del algoritmo sin sintaxis estricta.
      ejemplo: |-
        LEER edad. SI edad >= 18 ENTONCES MOSTRAR "mayor" SINO MOSTRAR "menor". Cualquier programador entiende qué hace.
      emoji: "📜"
      categoria: Cómo se describe
    - termino: Diagrama de flujo
      definicion: |-
        Representación visual del algoritmo con 4 símbolos: óvalo (inicio/fin), rectángulo (proceso), rombo (decisión), paralelogramo (entrada/salida).
      ejemplo: |-
        Para calcular IMC: inicio → leer peso/altura (paralelogramo) → calcular (rectángulo) → decisión (rombo) → mostrar resultado (paralelogramo) → fin.
      emoji: "📊"
      categoria: Cómo se diagrama
    - termino: Secuencia
      definicion: |-
        Estructura básica de algoritmo: pasos en orden, uno tras otro. Sin orden, las recetas y algoritmos no funcionan.
      ejemplo: |-
        Para sancocho: 1. Pelar plátano. 2. Cortar. 3. Cocer 30 min. El orden no se puede cambiar sin romper la receta.
      emoji: "📍"
    - termino: Decisión (selección)
      definicion: |-
        Estructura que permite elegir entre 2 o más caminos según una condición. SI-ENTONCES-SINO es su forma básica.
      ejemplo: |-
        SI el plátano está verde, freír. SINO, asar. La decisión cambia el camino del algoritmo.
      emoji: "🔀"
    - termino: Algoritmo en 4 estructuras
      definicion: |-
        Cualquier algoritmo se construye con 4 estructuras: secuencia, decisión, repetición (bucle) y entrada/salida. Combinadas resuelven problemas complejos.
      ejemplo: |-
        Algoritmo de mañana: leer alarma (E/S) + decidir levantarse (decisión) + secuencia de ducha + repetir hasta despertar (bucle).
      emoji: "🧩"
  quiz:
    titulo: ¿Sabes escribir algoritmos en pseudocódigo y diagrama?
    instrucciones: 5 preguntas para verificar las 4 estructuras y los 4 símbolos del diagrama de flujo.
    preguntas:
      - enunciado: '¿Cuál símbolo de diagrama de flujo representa una decisión?'
        opciones:
          - Rombo
          - Óvalo
          - Rectángulo
          - Paralelogramo
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. El rombo representa decisión (con 2 salidas típicas: sí/no). El óvalo es inicio/fin; rectángulo es proceso; paralelogramo es E/S.
        feedback_incorrecto: |-
          La decisión se representa con rombo. Tiene 2 salidas (sí/no). Los otros símbolos son: óvalo (inicio/fin), rectángulo (proceso), paralelogramo (E/S).
      - enunciado: '¿Cuál de estas NO es una de las 4 estructuras básicas de algoritmo?'
        opciones:
          - Secuencia
          - Decisión
          - Cifrado
          - Repetición
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Las 4 estructuras son secuencia, decisión, repetición y entrada/salida. Cifrado no es estructura algorítmica básica.
        feedback_incorrecto: |-
          Las 4 son: secuencia, decisión, repetición, entrada/salida. Cifrado es otra cosa (técnica de seguridad).
      - enunciado: '¿Qué hace la indentación en el pseudocódigo?'
        opciones:
          - Decoración
          - Mostrar visualmente qué está dentro de un SI o un MIENTRAS
          - Cambiar el orden de ejecución
          - No tiene función
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La indentación visualiza la jerarquía. Lo que está dentro de un SI va indentado para que se vea claro qué pertenece al bloque.
        feedback_incorrecto: |-
          La indentación muestra jerarquía. Lo que está dentro de un SI o un MIENTRAS va sangrado para distinguirlo visualmente.
      - enunciado: 'Receta de arepa: "pelar plátano, cortar, si está verde freír, si maduro asar". ¿Qué estructuras usa?'
        opciones:
          - Solo secuencia
          - Solo decisión
          - Repetición
          - Secuencia + decisión
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. Los primeros pasos son secuencia (pelar, cortar). Después hay decisión según el estado del plátano (verde→freír, maduro→asar).
        feedback_incorrecto: |-
          Usa secuencia (pelar, cortar) Y decisión (verde→freír, maduro→asar). Las dos estructuras combinadas.
      - enunciado: '¿Por qué se recomienda escribir pseudocódigo ANTES de programar el código real?'
        opciones:
          - Es trámite escolar
          - Para que tarde más el proyecto
          - Para que la lógica esté clara antes de luchar con la sintaxis
          - Para confundir al programador
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. La phronesis del oficio dice: planear antes de actuar. Pseudocódigo permite pensar la lógica sin distraerse con sintaxis.
        feedback_incorrecto: |-
          Se escribe pseudocódigo para clarificar la lógica antes de la sintaxis. Pensar primero, codificar después: ahorra horas de debug.
  resumen: |-
    Como la receta paso a paso de la abuela: cocina campesina como archivo de algoritmos heredados. Aprendes a escribir pseudocódigo claro y diagramas de flujo con símbolos ISO 5807.
  subtema: Algoritmos · Pseudocódigo · Diagramas de flujo
  pre_lectura:
    por_que_importa: |-
      Saber expresar algoritmos en pseudocódigo y diagramas te prepara para programar en CUALQUIER lenguaje. Es habilidad transferible: a Python, JavaScript, MakeCode o lo que venga después.
    pregunta_detonante: |-
      ¿Qué de la receta paso a paso de la abuela — su disciplina narrativa — podemos llevar al pseudocódigo y al diagrama de flujo?
    activacion:
      titulo: La receta como código
      descripcion: |-
        En 5 minutos: en parejas escojan una receta familiar simple (huevo perico, agua de panela, etc.) y escríbanla como pseudocódigo con palabras clave INICIO, LEER, SI, FIN.
      duracion_min: 5
    conexion:
      anterior: En la sesión 12 construiste tablas de verdad para verificar lógica.
      siguiente: En la sesión 14 trabajarás con sensores físicos en MakeCode.
  post_lectura:
    reflexion: |-
      El pseudocódigo democratiza el código: hace que personas sin formación técnica puedan opinar sobre algoritmos. ¿Qué proceso de tu colegio sería bueno escribir como pseudocódigo para que cualquiera lo pueda revisar?
    transferencia: |-
      Esta semana: elige UN proceso real (timbre, asistencia, calificaciones, cafetería) y escríbelo como pseudocódigo + diagrama de flujo. Compártelo con alguien y mejora donde haya confusión.
    cierre: |-
      La receta de la abuela y el diagrama ISO comparten algo: cuando se escribe bien, cualquiera puede seguirla. La claridad del orden es ética del trabajo compartido.
  cinco_dimensiones:
    personal: |-
      Aprendiste a escribir instrucciones que cualquiera puede seguir — habilidad fundamental para enseñar, dirigir, colaborar.
    emocional: |-
      Resististe la tentación de dar "instrucciones cortas" — entendiste que la claridad respeta al lector aunque al autor le tome más tiempo.
    ciudadana: |-
      Exigir versiones en pseudocódigo de algoritmos que toman decisiones públicas (becas, ingresos, créditos) es ciudadanía algorítmica.
    local: |-
      Heredaste el archivo de algoritmos de la cocina campesina colombiana — saberes que llevan siglos siendo ejecutados con éxito.
    intergeneracional: |-
      La receta de la abuela y el diagrama de flujo ISO comparten lógica. Lo que cambia es el medio, no la ética de la claridad.

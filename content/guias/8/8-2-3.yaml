clave: 2-3
grado: 8
periodo: 2
sesion: 3
completo: true
duracion_min: 90
titulo: Algoritmos --- del pseudocódigo al diagrama de flujo
titulo_portada: |-
  Del pseudocódigo
  al diagrama de flujo
producto_final: |-
  Un algoritmo de una tarea cotidiana escrito en pseudocódigo, con al menos ocho pasos, una variable y un si-sino. El mismo algoritmo dibujado como diagrama de flujo con los cuatro símbolos: óvalo, rectángulo, rombo y paralelogramo. Y cinco líneas que expliquen cómo se corresponden los dos formatos.
apertura:
  origen: Orfebres del Cauca medio · la cera perdida, seis pasos sin vuelta atrás
  fuente: |-
    Banco de la República. (s.\,f.). Quimbaya. \emph{Enciclopedia Banrepcultural}. · Uribe Villegas, M. A. (1992). La orfebrería Quimbaya tardía. \emph{Boletín Museo del Oro}, 31, 30--124.
  saber_ancestral: |-
    Hace más de mil años, en el Cauca medio (hoy Quindío, Risaralda y norte del Valle), unos orfebres fundían piezas huecas de oro. Su técnica exigía un orden exacto: la \textbf{cera perdida con núcleo}. Los coleccionistas les pusieron «quimbayas», un nombre que no era el suyo. El procedimiento tenía seis pasos (Banco de la República, s.\,f.). Modelar el núcleo con arcilla y carbón molido. Cubrirlo con una capa de cera y ponerle un embudo. Fijar soportes para que el núcleo no se mueva. Cubrir todo con un molde de arcilla. Calentar, sacar la cera y vaciar el metal. Romper el molde y sacar los soportes y el núcleo. No hay paso que se pueda adelantar ni vuelta atrás: si el molde se rompe antes de tiempo, la pieza se pierde. Es un algoritmo de orden absoluto, pensado completo antes de empezar. La \textbf{cara de exclusión}: el Tesoro Quimbaya se sacó de una tumba en Filandia en 1890, sin excavación científica, y los orfebres no dejaron nombre; los coleccionistas sí (Uribe Villegas, 1992). Hoy escribes un algoritmo de tu vida con ese cuidado: cada paso en su lugar.
  saber_contemporaneo: |-
    Un \textbf{algoritmo} es una secuencia ordenada de pasos que resuelve una tarea y termina. Se puede escribir de dos maneras que se complementan. El \textbf{pseudocódigo} es texto ordenado, casi como hablar, con palabras clave: LEER, MOSTRAR, SI, ENTONCES, SINO, REPETIR. El \textbf{diagrama de flujo} es el mismo algoritmo dibujado con cuatro símbolos. Óvalo para inicio y fin, rectángulo para cada acción, rombo para cada decisión, paralelogramo para entrada y salida. Las flechas marcan el orden. Un algoritmo usa tres estructuras de control: secuencia, decisión y repetición. Con esas tres se puede escribir cualquier algoritmo; la entrada y la salida de datos son lo que entra y lo que sale, no una estructura. Antes de programar se escribe el algoritmo en papel: quien se lo salta escribe código que nadie entiende, ni él mismo dos días después.
  pregunta_puente: |-
    El orfebre no podía vaciar el metal antes de sacar la cera, ni romper el molde antes de que el metal enfriara. Cuando escribas cómo se hace una arepa o cómo alistas el morral, ¿qué paso no se puede hacer antes que otro? ¿Y en qué paso hay una decisión?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los pasos, las decisiones y las variables de una tarea que dominas; (2) \textbf{crear} un algoritmo en pseudocódigo de al menos ocho pasos con un si-sino; (3) \textbf{aplicar} los cuatro símbolos para dibujarlo como diagrama de flujo; (4) \textbf{evaluar} el diagrama de tu pareja ejecutándolo sin que te lo explique.
puentes:
  a_ruta: |-
    En la sesión 2 verificaste reglas con tablas de verdad. Hoy las metes dentro de un algoritmo completo y lo dibujas. En la sesión 4 ese algoritmo se convierte en bloques de MakeCode para un micro:bit.
  a_escuta: |-
    Antes de la teoría, vas a escribir paso a paso algo que sabes hacer con los ojos cerrados. La prueba: que un extraterrestre pueda seguir tu lista.
  a_sistematizacion: |-
    Ya tienes la lista. Ahora aprendes las convenciones del pseudocódigo, las tres estructuras y los cuatro símbolos, y con tu pareja conviertes la lista en pseudocódigo con una decisión.
  a_praxis: |-
    Ya tienes el pseudocódigo. Toca dibujarlo con los cuatro símbolos y entregárselo a tu pareja para que lo ejecute sin explicaciones.
  a_producto: |-
    Lo que entregas hoy: el pseudocódigo, el diagrama y las cinco líneas de correspondencia. La prueba de calidad: tu pareja llega al final del diagrama siguiendo solo las flechas.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Escribir un algoritmo completo antes de hacer nada es el cuidado del orfebre: pensar la pieza entera antes de vaciar el metal.
  a_triangulo: |-
    Para terminar, tres ideas sobre hacer las cosas en orden, contadas con palabras de esta guía: Dussel sobre la tecnología como oficio que se piensa mientras se hace, Séneca sobre hacer más que decir, Floridi sobre las herramientas que primero ahorran tiempo.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- La lista del extraterrestre} (15 min · individual). (1) Elige algo que sabes hacer sin pensar: alistar el morral, hacer una arepa, lavar los tenis, un nudo de corbata. (2) Escribe los pasos numerados, en orden, con frases cortas. (3) Si en algún paso decides algo, márcalo con una D: «si está sucio, lavar; si no, guardar». (4) No te saltes ningún paso por obvio. (5) Léela como si fueras un extraterrestre que no sabe nada: ¿en qué paso se quedaría atascado?
  checks:
  - Tengo la lista numerada, con frases cortas y sin pasos saltados.
  - Marqué con D al menos una decisión.
  - Sé en qué paso se atascaría el extraterrestre.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- La lista del extraterrestre». \textbf{Formato:} lista numerada de al menos ocho pasos, con D en las decisiones y una línea sobre el paso donde se atasca. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} hay al menos ocho pasos, una D, y el paso atascado está corregido.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- De la lista al pseudocódigo} (30 min · parejas). (1) Con tu pareja, tomen la lista de uno de los dos. (2) Escriban qué entra y qué sale: LEER lo que necesitan saber, MOSTRAR lo que se entrega. (3) Reescriban los pasos con palabras clave en mayúscula, un paso por línea y sangría en lo que va dentro de un SI. (4) Metan al menos una variable, como tiempo disponible o clima, y un si-sino sobre ella. (5) Prueben el pseudocódigo con un caso concreto, siguiéndolo línea por línea hasta el final.
  pilares:
  - |-
    \textbf{Las tres estructuras.} Secuencia: un paso tras otro. Decisión: SI condición ENTONCES un camino SINO otro. Repetición: REPETIR mientras se cumpla algo. Con esas tres se escribe cualquier algoritmo. LEER y MOSTRAR son la entrada y la salida: lo que entra y lo que sale.
  - |-
    \textbf{Las convenciones del pseudocódigo.} Palabras clave en mayúscula: SI, ENTONCES, SINO, MIENTRAS, LEER, MOSTRAR. Variables en minúscula y con nombre claro: clima, tiempo. Un paso por línea. Sangría en lo que va dentro de un SI. No hay sintaxis estricta; hay claridad.
  - |-
    \textbf{Los cuatro símbolos.} Óvalo: inicio y fin, uno de cada. Rectángulo: una acción. Rombo: una decisión, con una entrada y dos salidas, sí y no. Paralelogramo: entrada o salida de datos. Las flechas dan el orden y no se cruzan si se puede evitar.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Di la tarea en una frase. (2) Escribe qué entra y qué sale. (3) Lista los pasos en orden. (4) Marca las decisiones. (5) Escribe el pseudocódigo. (6) Dibuja el diagrama. (7) Pruébalo con un caso hasta el final.
  anatomia:
    titulo: El algoritmo, en una mirada
    body: |-
      \textbf{Secuencia:} un paso tras otro. \\[1mm] \textbf{Decisión:} SI… ENTONCES… SINO. \\[1mm] \textbf{Repetición:} REPETIR mientras… \\[1mm] \textbf{Entrada y salida:} LEER y MOSTRAR. \\[1mm] \textbf{Símbolos:} óvalo, rectángulo, rombo, paralelogramo.
  errores_comunes: |-
    (1) \textbf{Saltarse el paso obvio}: el algoritmo supone que quien lo ejecuta ya sabe. (2) \textbf{Rombo con una sola salida}: una decisión sin camino para el no. (3) \textbf{Sin inicio o sin fin}: nadie sabe dónde empieza ni si terminó. (4) \textbf{Rectángulo donde va rombo}: una decisión dibujada como acción no decide nada. (5) \textbf{Flechas cruzadas}: el diagrama se lee mal; reorganiza.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- De la lista al pseudocódigo». \textbf{Formato:} el pseudocódigo completo con mayúsculas, sangría, una variable y un si-sino; y el caso de prueba con su resultado. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tiene al menos ocho pasos, una variable, un si-sino, y el caso de prueba llegó hasta MOSTRAR.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- El diagrama que otro ejecuta} (25 min · individual). (1) Dibuja tu pseudocódigo como diagrama de flujo con los cuatro símbolos, en papel o en draw.io. (2) Cuenta: un óvalo de inicio, al menos uno de fin, un rombo por cada SI. (3) Entrégaselo a tu pareja sin decirle nada y pídele que lo ejecute con un caso, siguiendo solo las flechas. (4) Anota dónde se atascó o qué símbolo le confundió. (5) Corrige y escribe cinco líneas sobre cómo se corresponden el pseudocódigo y el diagrama.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) El pseudocódigo de al menos ocho pasos con variable y si-sino. (2) El diagrama con los cuatro símbolos. (3) Las cinco líneas de correspondencia y el atasco que encontró tu pareja.
  - |-
    \textbf{Pseudocódigo primero, diagrama después.} El texto te obliga a pensar la lógica; el dibujo te obliga a ver el flujo. Si dibujas primero, las cajas salen vagas. Si escribes primero, el diagrama sale preciso.
  - |-
    \textbf{Cómo se corresponde.} Cada línea de acción es un rectángulo. Cada SI es un rombo con sus dos flechas. Cada LEER o MOSTRAR es un paralelogramo. El primer y el último paso son los óvalos. Si algo del pseudocódigo no tiene símbolo, falta en el diagrama.
  - |-
    \textbf{La prueba del que no sabe.} Tu pareja no conoce tu tarea. Si llega al fin siguiendo las flechas, el diagrama funciona. Si pregunta «¿y aquí qué hago?», ahí falta un paso o un camino del rombo. Anota el lugar exacto.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Pseudocódigo con al menos ocho pasos, una variable y un si-sino. \\[1mm] \checkbox Diagrama con óvalos de inicio y fin, rectángulos, rombos y paralelogramos. \\[1mm] \checkbox Cada rombo tiene dos salidas, sí y no. \\[1mm] \checkbox Sin flechas cruzadas que se puedan evitar. \\[1mm] \checkbox Mi pareja ejecutó el diagrama sin que se lo explicara. \\[1mm] \checkbox Cinco líneas sobre cómo se corresponden los dos formatos.
  plantilla_guion: |-
    \textbf{Tarea.} \textit{Una sola, concreta, cotidiana.} \\[1mm] \textbf{Entra y sale.} \textit{LEER… MOSTRAR…} \\[1mm] \textbf{Pseudocódigo.} \textit{Ocho pasos, una variable, un SI.} \\[1mm] \textbf{Diagrama.} \textit{Óvalo, rectángulo, rombo, paralelogramo.} \\[1mm] \textbf{Correspondencia.} \textit{Línea a símbolo, en cinco líneas.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- El diagrama que otro ejecuta». \textbf{Formato:} el diagrama dibujado, el lugar donde se atascó tu pareja y las cinco líneas de correspondencia. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} tu pareja llegó al fin del diagrama, el atasco quedó corregido, y las cinco líneas nombran cada símbolo.
  producto_titulo: Pseudocódigo de ocho pasos + diagrama de flujo con cuatro símbolos + correspondencia
  criterios:
  - El pseudocódigo tiene al menos ocho pasos, una variable y un si-sino, con mayúsculas y sangría
  - El diagrama usa los cuatro símbolos y cada rombo tiene dos salidas
  - Tu pareja ejecutó el diagrama hasta el fin siguiendo solo las flechas
  - El atasco que encontró quedó corregido
  - Las cinco líneas dicen qué símbolo corresponde a cada tipo de línea
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.3.2.4
    idea: |-
      La tecnología no es teoría aplicada: es un oficio que se piensa mientras se hace.
    aplicacion: |-
      El orfebre del Cauca medio no tenía un manual: tenía las manos y los seis pasos en la cabeza. Tu pseudocódigo es eso, pensamiento escrito para las manos. Y el diagrama es la forma de pasárselo a otras manos.
    pregunta_espejo: |-
      ¿Qué paso de mi algoritmo solo entendí cuando lo escribí, y no antes?
  estoico:
    autor: Séneca · Cartas a Lucilio, 20 (c. 64 d.C.)
    idea: |-
      La filosofía enseña a hacer, no a decir; lo que se dice y lo que se hace tienen que coincidir.
    aplicacion: |-
      Un algoritmo bonito en el papel que tu pareja no puede ejecutar es puro decir. La prueba del que no sabe es la que obliga a que lo escrito y lo hecho coincidan.
    pregunta_espejo: |-
      ¿Mi diagrama se puede hacer, o solo se puede leer?
  floridi:
    autor: Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 3.1
    idea: |-
      Las tecnologías se usan primero para ahorrar tiempo y después para matarlo.
    aplicacion: |-
      Escribir el algoritmo antes de programar parece perder tiempo. Es lo que lo ahorra: un rombo mal puesto en papel se corrige en un minuto; en código, en una tarde.
    pregunta_espejo: |-
      ¿Cuándo fue la última vez que empecé a hacer algo sin pensar el orden, y cuánto me costó?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu pseudocódigo y tu diagrama. En la sesión 4 vas a programar tu primer programa en MakeCode para el micro:bit, con sensores que perciben el mundo. Cada rombo de tu diagrama va a ser un bloque «si».
web:
  resumen: |-
    Un algoritmo se escribe primero en pseudocódigo y después se dibuja con cuatro símbolos. Hoy haces los dos con una tarea de tu vida, con el cuidado de los orfebres del Cauca medio que pensaban los seis pasos de la cera perdida antes de vaciar el metal.
  subtema: Lógica y micro:bit
  pre_lectura:
    por_que_importa: |-
      Todo programa empieza siendo un algoritmo en papel. Saber escribirlo y dibujarlo es lo que te deja programar sin perderte, y explicarle a otro lo que hiciste.
    pregunta_detonante: |-
      Cuando escribas cómo alistas el morral, ¿qué paso no se puede hacer antes que otro? ¿Y en cuál hay una decisión?
    activacion:
      titulo: El paso que te saltaste
      descripcion: |-
        En 3 minutos, escribe cómo se hace un sándwich en cinco pasos. Dáselo a tu pareja y pregúntale en qué paso se quedaría un extraterrestre.
      duracion_min: 5
    conexion:
      anterior: En la sesión 2 verificaste reglas con tablas de verdad.
      siguiente: En la sesión 4 programas el micro:bit en MakeCode con sensores.

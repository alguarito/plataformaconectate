clave: 2-4
grado: 8
periodo: 2
sesion: 4
completo: true
duracion_min: 90
titulo: Sensores en MakeCode --- el micro:bit que siente y avisa
titulo_portada: |-
  El micro:bit
  que siente y avisa
producto_final: |-
  Un programa en MakeCode que use al menos dos sensores del micro:bit (luz, temperatura, botones, agitar) para disparar una acción visible. Una bitácora de cinco pruebas con lo que diste, lo que esperabas y lo que pasó. Y un ajuste hecho al programa después de las pruebas.
apertura:
  origen: Pueblo nasa · la Guardia Indígena Kiwe Thegnas
  fuente: |-
    Consejo Regional Indígena del Cauca. (s.\,f.). \emph{Kiwe Thegna: Guardia Indígena}. Consultado el 4 de septiembre de 2026.
  saber_ancestral: |-
    En el Cauca, el pueblo nasa tiene una Guardia Indígena. Se llaman \textbf{kiwe thegnas}, «cuidadores del territorio», y nacieron como guardia en 2001, en el resguardo de Huellas, en Caloto (CRIC, s.\,f.). No llevan armas: llevan un bastón. Su trabajo es recorrer el territorio, mirar, dar la alerta y convocar a la asamblea. Lo que hace fuerte a un kiwe thegna no es la valentía de uno solo. Es que nunca actúa solo y nunca se calla lo que vio. Fíjate en la secuencia: percibir, avisar, y que decida la comunidad. Un sensor hace exactamente eso: lee algo del mundo, avisa, y el programa decide. La \textbf{cara de exclusión}: la Guardia existe porque el territorio está bajo amenaza armada permanente; no es una figura de folclor ni un cuerpo de vigilancia escolar, y aquí no se cuentan casos ni se buscan héroes. Hoy vas a programar un micro:bit que sienta dos cosas del mundo y avise, con la misma regla: percibir, avisar, y que decida la lógica que tú escribiste.
  saber_contemporaneo: |-
    El \textbf{micro:bit} es una tarjeta del tamaño de una tarjeta de crédito con sensores adentro. Dos botones, A y B. Un sensor de luz que devuelve un número de 0, oscuro, a 255, mucha luz. Un sensor de temperatura, en grados. Un acelerómetro que detecta si lo agitas o lo inclinas. Y una pantalla de 25 luces en cuadrícula de cinco por cinco. Se programa en \textbf{MakeCode}, en el navegador, con bloques que encajan, y tiene un simulador para probar sin la tarjeta. Un programa con sensores tiene dos partes. «Al iniciar» se ejecuta una vez al encender. «Para siempre» se repite sin parar: ahí lees los sensores, decides con un «si» y disparas la acción. Percibir, decidir, actuar. Sin el «para siempre», el micro:bit lee una vez y se queda quieto.
  pregunta_puente: |-
    El kiwe thegna recorre, ve y avisa; la decisión la toma la asamblea. Cuando tu micro:bit lea «poca luz», ¿qué va a avisar? ¿Y quién decide qué hacer con eso: el sensor o el «si» que tú escribiste?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los sensores del micro:bit y qué devuelve cada uno; (2) \textbf{crear} un programa en MakeCode que combine dos sensores con un «si» y dispare una acción visible; (3) \textbf{analizar} lo que pasa en cinco pruebas y anotarlo en una bitácora; (4) \textbf{evaluar} el programa de tu pareja probándolo con entradas que no esperaba.
puentes:
  a_ruta: |-
    En la sesión 3 dibujaste un algoritmo con rombos. Hoy cada rombo se vuelve un bloque «si» y el micro:bit lo ejecuta de verdad. En la sesión 5 vas a hacer que además se exprese con luces y sonido.
  a_escuta: |-
    Antes de programar, vas a explorar el simulador de MakeCode y a descubrir qué puede sentir el micro:bit y qué puede mostrar.
  a_sistematizacion: |-
    Ya conoces la tarjeta. Ahora aprendes los bloques de entrada y de salida, la estructura al iniciar y para siempre, y con tu pareja armas el primer programa con dos sensores.
  a_praxis: |-
    Ya tienes un programa que funciona. Toca ponerlo a prueba cinco veces, anotar lo que pasa, ajustarlo, y probar el de tu pareja con entradas que no esperaba.
  a_producto: |-
    Lo que entregas hoy: el programa con dos sensores, la bitácora de cinco pruebas y el ajuste. La prueba de calidad: tu pareja mueve el simulador y el micro:bit responde como dice tu pseudocódigo.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un sensor que avisa y una lógica que decide: así se cuida un territorio y así se programa una tarjeta.
  a_triangulo: |-
    Para terminar, tres ideas sobre percibir y avisar, contadas con palabras de esta guía: Dussel sobre la máquina que no puede volverse el rostro de las personas, Marco Aurelio sobre lo que es bueno para el enjambre, Floridi sobre los patrones pequeños que solo valen si se comparan.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Qué siente el micro:bit} (15 min · individual). (1) Abre makecode.microbit.org y crea un proyecto nuevo. (2) Mira el simulador a la izquierda: haz clic en los botones A y B. (3) Busca el control del sensor de luz, un sol pequeño, y muévelo. (4) Busca el control de agitar y prueba. (5) Anota en una lista qué sensores tiene el micro:bit, qué puede mostrar en la pantalla y una cosa que te haya sorprendido.
  checks:
  - Abrí MakeCode y probé los botones, la luz y el agitar en el simulador.
  - Tengo la lista de sensores y de lo que puede mostrar.
  - Anoté una cosa que me sorprendió.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Qué siente el micro:bit». \textbf{Formato:} dos listas (sensores / lo que puede mostrar) y una línea con la sorpresa. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} nombras al menos cuatro sensores y tres cosas que puede mostrar.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · CREA --- Dos sensores y una acción} (30 min · parejas). (1) Con tu pareja, elijan una idea: la vela digital, que se enciende con poca luz y se apaga al agitar; el termómetro, que muestra una cara según la temperatura y la cifra con el botón A; o la cara expresiva, feliz con A, triste con B, confundida al agitar. (2) Escriban el pseudocódigo con un «si» que combine los dos sensores. (3) En MakeCode, arrastren el bloque «para siempre» y adentro un «si» con la condición. (4) Pongan la acción: mostrar ícono, número o texto. (5) Prueben en el simulador moviendo cada sensor.
  pilares:
  - |-
    \textbf{Los sensores y sus bloques.} Botones: «al presionar el botón A», en Entrada. Luz: «nivel de luz», devuelve de 0 a 255. Temperatura: «temperatura (°C)». Movimiento: «al agitar» o «aceleración». Cada uno es un dato que el programa puede leer.
  - |-
    \textbf{Las salidas.} «Mostrar ícono» dibuja una figura en la pantalla. «Mostrar número» y «mostrar cadena» desplazan cifras o texto. «Encender LED» prende una sola luz. Están en Básico y en LED.
  - |-
    \textbf{Al iniciar y para siempre.} Lo que va en «al iniciar» pasa una vez al encender. Lo que va en «para siempre» se repite sin parar: ahí van la lectura del sensor, el «si» y la acción. Si pones el «si» fuera del «para siempre», el micro:bit decide una sola vez.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Di en una frase qué hace el programa. (2) Elige los dos sensores. (3) Elige la acción. (4) Escribe el «si» en pseudocódigo. (5) Ármalo en bloques. (6) Prueba en el simulador. (7) Si hay tarjeta, cárgalo.
  anatomia:
    titulo: El programa con sensores, en una mirada
    body: |-
      \textbf{Al iniciar:} una vez. \\[1mm] \textbf{Para siempre:} sin parar. \\[1mm] \textbf{Leer:} nivel de luz, temperatura, botón, agitar. \\[1mm] \textbf{Decidir:} un «si» con la condición. \\[1mm] \textbf{Actuar:} mostrar ícono, número o texto.
  errores_comunes: |-
    (1) \textbf{Sensor sin condición}: leer la luz y no compararla con nada. (2) \textbf{Acción suelta}: un «mostrar ícono» fuera de un evento o del «para siempre». (3) \textbf{Sin «para siempre»}: el programa decide una vez y no vuelve a mirar. (4) \textbf{Umbral imposible}: «si luz mayor que 300» nunca pasa, porque el máximo es 255. (5) \textbf{Bloques al azar}: arrastrar sin saber qué hace cada uno.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · CREA).} \textbf{Título:} «Actividad 2 --- Dos sensores y una acción». \textbf{Formato:} la frase de qué hace el programa, el pseudocódigo del «si» y un dibujo de los bloques principales. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} el simulador responde a los dos sensores como dice tu pseudocódigo.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Cinco pruebas y un ajuste} (25 min · individual). (1) Prueba tu programa en cinco escenarios distintos: poca luz con botón, mucha luz sin botón, agitar, y dos más que inventes. (2) Antes de cada prueba escribe qué esperas que pase; después, qué pasó. (3) Si algo no coincidió, anota por qué. (4) Haz un ajuste: cambia el umbral, la condición o el ícono, y vuelve a probar. (5) Prueba el programa de tu pareja con una entrada que no esperaba y anota qué hizo.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) El programa con dos sensores y una acción, compartido con enlace de MakeCode o archivo .hex. (2) La bitácora de cinco pruebas. (3) El ajuste hecho y por qué.
  - |-
    \textbf{La bitácora de pruebas.} Cuatro columnas: qué entrada di, qué esperaba, qué pasó, coincide o no. Escribir lo que esperas antes de probar es lo que convierte la prueba en prueba y no en sorpresa.
  - |-
    \textbf{El umbral se ajusta probando.} Si «luz menor que 50» nunca se cumple en el salón, no es que el programa esté mal: es que el salón es más claro. Mueve el umbral y anótalo. Los kiwe thegnas también aprenden por dónde mirar recorriendo.
  - |-
    \textbf{Probar el programa ajeno.} Dale al micro:bit de tu pareja una entrada que no estaba en su bitácora: mucha luz y botón a la vez, agitar sin luz. Si hace algo raro, anota exactamente qué entrada diste.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Programa con dos sensores y una acción visible, dentro de «para siempre». \\[1mm] \checkbox Probado en el simulador. \\[1mm] \checkbox Bitácora con cinco pruebas, cada una con lo esperado y lo que pasó. \\[1mm] \checkbox Un ajuste hecho después de las pruebas, con su razón. \\[1mm] \checkbox Programa ajeno probado con una entrada inesperada. \\[1mm] \checkbox Enlace de MakeCode o archivo .hex guardado.
  plantilla_guion: |-
    \textbf{Qué hace.} \textit{Una frase.} \\[1mm] \textbf{Sensores.} \textit{Dos, con su bloque.} \\[1mm] \textbf{El si.} \textit{Condición y acción.} \\[1mm] \textbf{Pruebas.} \textit{Entrada, esperado, pasó, coincide.} \\[1mm] \textbf{Ajuste.} \textit{Qué cambié y por qué.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Cinco pruebas y un ajuste». \textbf{Formato:} tabla de 5 filas y 4 columnas (entrada / esperado / pasó / coincide), el ajuste en dos líneas y la entrada inesperada que le diste a tu pareja. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} las cinco filas están llenas, el ajuste mejoró una de ellas y anotaste qué hizo el programa ajeno.
  producto_titulo: Programa con dos sensores + bitácora de cinco pruebas + un ajuste
  criterios:
  - El programa usa dos sensores en un «si» dentro de «para siempre» y dispara una acción visible
  - Funciona en el simulador o en la tarjeta
  - La bitácora tiene cinco pruebas con lo esperado escrito antes y lo que pasó después
  - Hiciste un ajuste después de las pruebas y dijiste por qué
  - Probaste el programa de tu pareja con una entrada inesperada y anotaste qué hizo
  - El programa está compartido con enlace o archivo .hex
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.5.6.3
    idea: |-
      La máquina se vuelve peligrosa cuando convierte el rostro de las personas en un instrumento más.
    aplicacion: |-
      Un sensor lee luz y temperatura, no personas. La Guardia Indígena avisa y la comunidad decide; el sensor avisa y tu «si» decide. Cuando programes algo que mire a la gente, recuerda quién debe decidir.
    pregunta_espejo: |-
      ¿Qué decisión de mi programa preferiría que la tomara una persona y no un «si»?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 54 (c. 175 d.C.)
    idea: |-
      Lo que no es bueno para el enjambre tampoco es bueno para la abeja.
    aplicacion: |-
      Un kiwe thegna nunca actúa solo: lo que ve lo lleva a la asamblea. Tu programa también avisa a alguien; pensar para quién es el aviso es pensar en el enjambre, no solo en la abeja.
    pregunta_espejo: |-
      ¿A quién le sirve el aviso de mi micro:bit, además de a mí?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      Un patrón pequeño solo significa algo si se agregó bien, se comparó con otro y llegó a tiempo.
    aplicacion: |-
      «Luz igual a 40» no significa nada solo. Comparado con el umbral, en el momento justo, significa «oscureció». Tu «si» es la comparación; el «para siempre» es el momento justo.
    pregunta_espejo: |-
      ¿Con qué comparé la lectura del sensor para que significara algo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu programa y la bitácora de cinco pruebas. En la sesión 5 el micro:bit va a expresarse: luces en secuencia y sonido sincronizado, con inicio y fin controlados por ti. Los sensores de hoy son lo que va a disparar esa coreografía.
web:
  resumen: |-
    El micro:bit tiene sensores que leen el mundo, y un «si» decide qué hacer con lo que leen. Hoy programas tu primer sensor en MakeCode y lo pruebas cinco veces, con la regla de la Guardia Indígena nasa, percibir, avisar y que decida la comunidad.
  subtema: Lógica y micro:bit
  pre_lectura:
    por_que_importa: |-
      Toda alarma, todo termostato y todo celular funcionan igual, un sensor lee, una regla decide, algo actúa. Hoy lo armas con tus manos y aprendes a probarlo antes de confiar.
    pregunta_detonante: |-
      Cuando tu micro:bit lea «poca luz», ¿qué va a avisar, y quién decide qué hacer con eso?
    activacion:
      titulo: Los sensores de tu celular
      descripcion: |-
        En 3 minutos, escribe tres cosas que tu celular siente sin que se lo pidas, la luz, el movimiento, la hora. ¿Qué decide con cada una?
      duracion_min: 5
    conexion:
      anterior: En la sesión 3 dibujaste un algoritmo con rombos de decisión.
      siguiente: En la sesión 5 el micro:bit se expresa con luces y sonido sincronizados.

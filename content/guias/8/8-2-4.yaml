clave: 2-4
grado: 8
periodo: 2
sesion: 4
completo: true
titulo: Sensores en MakeCode --- el micro:bit que siente
titulo_portada: |-
  Sensores en MakeCode ---
  el micro:bit
  que siente
producto_final: |-
  Programa en MakeCode que use al menos 2 sensores del micro:bit (luz, temperatura, botones A/B, acelerómetro o movimiento) para disparar 1 acción visible (mostrar ícono, número, sonido o mensaje) + bitácora de pruebas con al menos 5 escenarios distintos donde se documente qué entrada se dio, qué respuesta esperabas y qué respuesta dio el micro:bit + 1 ajuste hecho al programa después de las pruebas
apertura:
  saber_ancestral: |-
    En las fincas del Valle del Cauca, en las casas con patio del campo y en los corregimientos de la zona cafetera, había un compañero del oficio que dormía menos que el dueño: \textbf{el perro guardián}. El perro no tenía instrucciones escritas ni reloj, pero ejercía una función específica: \textbf{sentir lo que el dueño no siente}. Olía al extraño cuando todavía estaba a 100 metros del portal. Escuchaba el ruido del zorro antes de que llegara al gallinero. Sentía el motor de la motocicleta en el camino antes de que se viera la luz. Y cuando percibía algo, no actuaba solo: \textbf{avisaba} con su ladrido, su gemido o su carrera al patio principal. El dueño, al escuchar el aviso, decidía qué hacer (asomarse, buscar el machete, encender la luz). El perro no decidía; \textbf{percibía y avisaba}. Esa función ancestral del perro guardián tiene un nombre en computación física: \textbf{sensor}. Un sensor digital es exactamente eso: \textbf{algo que percibe el mundo y le avisa al programa para que decida qué hacer}.
  saber_contemporaneo: |-
    El \textbf{micro:bit} es una placa de computadora pequeña, del tamaño de una tarjeta de crédito, diseñada para enseñar programación con sensores físicos. Incluye varios \textbf{sensores integrados}: (1) \textbf{Botones A y B}: detectan pulsación humana. (2) \textbf{Sensor de luz}: detecta el nivel de luz ambiente (0 oscuro, 255 luz fuerte). (3) \textbf{Sensor de temperatura}: detecta la temperatura aproximada del chip (cerca de la ambiente). (4) \textbf{Acelerómetro}: detecta movimiento y orientación (agitar, inclinar, caída). (5) \textbf{Brújula}: detecta dirección magnética. \textbf{MakeCode} (\texttt{makecode.microbit.org}) es el editor visual donde se programa con bloques de colores y se puede simular el código antes de cargarlo al micro:bit físico. La regla profesional del oficio: \textbf{los sensores leen el mundo, el código decide la respuesta, los actuadores la ejecutan}. Hoy trabajas la primera parte: usar 2 sensores para que el micro:bit \emph{sienta} y dispare una acción visible.
  pregunta_puente: |-
    ¿Qué sabía el perro guardián de la finca al percibir antes y avisar al dueño, que el programador novato olvida cuando trata el sensor como si fuera un cálculo más? ¿Y por qué el micro:bit con 2 sensores combinados puede tomar decisiones más útiles que con uno solo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué sensor del micro:bit es apropiado para detectar una entrada concreta del mundo; (2) \textbf{aplicar} los bloques de MakeCode para leer al menos 2 sensores y disparar una acción condicional; (3) \textbf{crear} un programa funcional que combine 2 sensores con lógica clara; (4) \textbf{evaluar} el programa probándolo en 5 escenarios distintos y haciendo al menos 1 ajuste documentado.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 1-3 aprendiste a pensar lógica y a escribir algoritmos en papel. Hoy haces el salto al \textbf{código real} con sensores físicos. Las próximas sesiones (actuadores S5, umbrales S6, depuración S7) construyen sobre la habilidad de leer sensores que aprendes hoy.
  a_escuta: |-
    Antes de teorizar, vas a abrir MakeCode (\texttt{makecode.microbit.org}) y explorar el simulador: el micro:bit virtual que aparece en pantalla. Vas a tocar sus botones, agitarlo con el ratón, cambiar la luz, ver qué pasa. Es exploración antes de la programación.
  a_sistematizacion: |-
    Ya conoces el simulador. Ahora vas a entender la \textbf{anatomía de los sensores}: los 5 sensores principales del micro:bit, los bloques de MakeCode que los leen, los 5 errores típicos del primer programa con sensores.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: programa que use al menos 2 sensores (botón + luz, o acelerómetro + temperatura, o botones A y B combinados) y dispare 1 acción visible. Probar en 5 escenarios y ajustar.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: programa funcional + bitácora de 5 pruebas + 1 ajuste documentado. El criterio principal: que el programa responda como esperas en los 5 escenarios, o que la bitácora explique honestamente cuándo no lo hace.
  a_evaluacion: |-
    Antes de cerrar, mira el programa desde las cinco dimensiones humanas. Probar con varios escenarios antes de declarar funcional es respeto por el oficio; declarar funcional con una sola prueba es engaño con apariencia técnica.
  a_triangulo: |-
    Y para terminar, tres voces sobre los sistemas que perciben. Dussel sobre los sensores que cuidan o vigilan, Marco Aurelio sobre la prueba que verifica, Floridi sobre los sistemas que aumentan la inteligencia humana.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Exploración del simulador} (15 min · individual). Abre \texttt{makecode.microbit.org} y elige \emph{Nuevo proyecto}. Mira el simulador del micro:bit (a la izquierda) y la paleta de bloques (a la derecha). Sin programar todavía, explora: (1) los botones A y B en el simulador (¿se pueden hacer clic?). (2) el sensor de luz (busca el control con un sol pequeño). (3) el acelerómetro (busca el control con flecha). (4) la pantalla de LEDs 5×5. Anota: ¿qué sensores tiene el micro:bit?, ¿qué puede mostrar?, ¿qué te llama la atención?.
  checks:
  - Abrí MakeCode y vi el simulador.
  - Identifiqué los sensores disponibles.
  - Vi la pantalla de LEDs como salida principal.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Exploración micro:bit». \textbf{Formato:} dibujo o esquema del micro:bit con sus partes etiquetadas + lista de sensores y salidas. \textbf{Sabes que terminaste cuando} conoces qué puede percibir y qué puede mostrar el micro:bit.
sistematizacion:
  intro: |-
    El simulador te enseñó qué hay. Ahora necesitas la \textbf{anatomía de la programación con sensores}: cómo se leen, qué bloques se usan, cómo se combinan con lógica condicional.
  pilares:
  - |-
    Los \textbf{5 sensores principales} del micro:bit y sus bloques se descomponen así: (1) \textbf{Botones A/B}: bloque \emph{``cuando se presiona el botón A''} (categoría Entrada). Evento que dispara código. (2) \textbf{Sensor de luz}: \emph{``nivel de luz''} (categoría Entrada). Devuelve número 0-255. Útil para detectar oscuridad. (3) \textbf{Sensor de temperatura}: \emph{``temperatura (°C)''} (Entrada). Devuelve número aproximado. (4) \textbf{Acelerómetro}: bloque \emph{``cuando se agita''} (eventos) o \emph{``aceleración (g) X/Y/Z''} (valores continuos). (5) \textbf{Brújula}: \emph{``orientación de la brújula''} (Entrada).
  - |-
    Los \textbf{bloques de salida} (acciones visibles) son: (a) \emph{``mostrar ícono''}: muestra un dibujo predefinido en la pantalla LED. (b) \emph{``mostrar número''}: muestra cifras desplazándose. (c) \emph{``mostrar cadena''}: muestra texto. (d) \emph{``tocar nota''}: emite sonido (requiere altavoz). (e) \emph{``encender LED en X,Y''}: control individual de los 25 LEDs.
  - |-
    La \textbf{estructura básica} de un programa con sensores tiene 2 partes: (a) \textbf{al iniciar}: código que se ejecuta una sola vez al encender el micro:bit (configuraciones, mensaje de bienvenida). (b) \textbf{para siempre}: código que se repite continuamente (lectura de sensores, decisiones, acciones). Dentro del \emph{para siempre} se ubican los if-else que combinan sensores: \texttt{si nivel de luz $<$ 50 y se presiona botón A entonces mostrar ícono triste}.
  - |-
    Algoritmo de construcción: (1) define qué hace el programa en 1 frase. (2) identifica los 2 sensores que usarás. (3) define la acción de salida. (4) escribe el if-else en pseudocódigo. (5) traduce a bloques de MakeCode. (6) prueba en el simulador. (7) carga al micro:bit físico si está disponible. (8) prueba en al menos 5 escenarios.
  anatomia:
    titulo: Anatomía del programa con sensores
    body: |-
      \textbf{Al iniciar:} configuración inicial. \\[1mm] \textbf{Para siempre:} bucle principal. \\[1mm] \textbf{Sensores:} botones / luz / temperatura / acelerómetro / brújula. \\[1mm] \textbf{Salidas:} ícono / número / sonido / LED individual. \\[1mm] \textbf{Combinación:} 2 sensores + 1 acción con if-else.
  errores_comunes: |-
    (1) \textbf{Sensor sin condición}: leer \emph{``nivel de luz''} pero no comparar con un umbral. (2) \textbf{Acción sin disparador}: \emph{``mostrar ícono''} fuera de un evento o bucle. (3) \textbf{Olvidar el \emph{para siempre}}: el programa se ejecuta una sola vez y no responde a cambios. (4) \textbf{No probar en simulador antes de cargar}: pierdes tiempo si hay error. (5) \textbf{Mezclar bloques sin lógica}: arrastrar bloques al azar sin saber qué hace cada uno.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía del programa». \textbf{Formato:} (a) los 5 sensores con su bloque; (b) las salidas; (c) estructura básica (al iniciar + para siempre); (d) los 5 errores con marca. \textbf{Sabes que terminaste cuando} podrías escribir un programa simple sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Programa con 2 sensores + 5 pruebas} (40 min · individual o parejas). Hora de crear. Programa que use 2 sensores combinados con lógica y dispare 1 acción visible. Pruébalo en 5 escenarios y documenta lo que pasa en cada uno.
  pilares:
  - |-
    Ideas concretas para combinar 2 sensores: (1) \textbf{Termómetro inteligente}: si temperatura > 25 muestra ícono caliente, si < 18 muestra frío, intermedio muestra OK. Botón A muestra la cifra exacta. (2) \textbf{Vela digital}: detecta oscuridad con sensor de luz, muestra LEDs encendidos; al agitar (acelerómetro) los apaga \emph{``soplando''}. (3) \textbf{Cara expresiva}: botón A muestra cara feliz, botón B cara triste, agitar muestra cara confundida. (4) \textbf{Detector de movimiento}: si está oscuro Y se agita, suena alarma; si solo está oscuro, muestra punto; si solo se agita en luz, ignora.
  - |-
    Sigue el patrón \textbf{``percibir → decidir → actuar''}: el programa lee los sensores, combina con if-else (de la sesión 1), dispara la acción. Esa secuencia es la phronesis del oficio: nunca actuar sin percibir, nunca decidir sin condición clara.
  - |-
    La bitácora de 5 pruebas tiene estructura mínima: (a) \textbf{Escenario}: combinación de sensores (luz alta + botón A presionado). (b) \textbf{Respuesta esperada}: qué creías que iba a mostrar. (c) \textbf{Respuesta real}: qué mostró efectivamente. (d) \textbf{Coincide o no}. Después de los 5 escenarios, identifica 1 ajuste a hacer (cambiar el umbral, cambiar el ícono, agregar otra condición) e implementarlo.
  - |-
    Algoritmo: (1) elegir idea. (2) escribir pseudocódigo de la lógica. (3) construir en MakeCode con bloques. (4) probar en simulador. (5) hacer 5 pruebas variando entradas. (6) llenar bitácora. (7) identificar 1 ajuste. (8) aplicar el ajuste. (9) verificar mejora.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 2 sensores usados en el programa. \\[1mm] \checkbox 1 acción de salida visible. \\[1mm] \checkbox Lógica con if-else combinada. \\[1mm] \checkbox Probado en simulador. \\[1mm] \checkbox 5 escenarios documentados en bitácora. \\[1mm] \checkbox Al menos 1 ajuste hecho después de pruebas. \\[1mm] \checkbox Código compartido (link de MakeCode o archivo .hex).
  plantilla_guion: |-
    \textbf{Idea del programa.} \textit{Una frase clara.} \\[1mm] \textbf{Sensores usados.} \textit{Cuáles 2 y por qué.} \\[1mm] \textbf{Acción de salida.} \textit{Qué muestra/sonido emite.} \\[1mm] \textbf{Pseudocódigo.} \textit{La lógica antes de bloques.} \\[1mm] \textbf{Pruebas.} \textit{5 escenarios con esperado/real.} \\[1mm] \textbf{Ajuste.} \textit{1 cambio aplicado.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Mi primer programa con sensores». \textbf{Formato:} (a) idea + sensores + acción; (b) pseudocódigo; (c) tabla 5 filas de bitácora; (d) descripción del ajuste hecho. \textbf{Sabes que terminaste cuando} el programa responde como esperas en al menos 4 de los 5 escenarios.
  producto_titulo: Programa con 2 sensores + 5 pruebas documentadas + 1 ajuste
  criterios:
  - Programa funcional con 2 sensores
  - Lógica con if-else combinada
  - Probado en simulador
  - Bitácora de 5 escenarios
  - 1 ajuste documentado
  - Código compartible (link o archivo)
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un sensor que cuida es liberador; un sensor que vigila sin consentimiento es opresor.
    aplicacion: |-
      Los sensores pueden tener dos usos: cuidar (alertar cuando hay peligro, ayudar a quien lo necesita) o vigilar (controlar sin consentimiento, registrar sin avisar). La filosofía de la liberación pide elegir siempre el primero. Cuando programas un detector con micro:bit, piensa: \emph{¿este dispositivo cuida al usuario o lo vigila?}. Esa pregunta ética abre el oficio antes de la técnica.
    pregunta_espejo: |-
      Mi programa con sensores, ¿cuida o vigila? ¿El usuario sabría qué hace este micro:bit si lo encontrara funcionando?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Probar con varios escenarios es virtud; declarar funcional con una sola prueba es vanidad.
    aplicacion: |-
      Es tentador declarar el programa funcional después de la primera vez que el simulador hace lo esperado. La disciplina estoica recomienda lo opuesto: \emph{prueba con 5 escenarios distintos antes de confiar}. La bitácora de pruebas es la forma estoica de respetar la realidad del código: no asumir que funciona; verificar que funciona.
    pregunta_espejo: |-
      ¿Estoy probando con varios escenarios o me convencí con una sola prueba?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los sistemas que aumentan la inteligencia humana sin reemplazarla son la nueva ética del oficio digital.
    aplicacion: |-
      Un buen sensor con código no pretende sustituir al humano: lo asiste. El termómetro inteligente no decide por ti si abrigarte; te avisa el estado y tú decides. La ética digital contemporánea valora esa colaboración entre humano y máquina: \emph{el sistema percibe, el humano decide}. Tu programa de hoy te entrena en esa práctica.
    pregunta_espejo: |-
      ¿Mi programa asiste al usuario o intenta decidir por él?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu programa de 2 sensores y la bitácora de 5 pruebas. En la sesión 5 vas a aprender a usar \textbf{actuadores} (LEDs, sonido, coreografía) para que el micro:bit no solo perciba sino también se exprese con sofisticación. Los sensores de hoy son la entrada; los actuadores de mañana son la salida creativa.

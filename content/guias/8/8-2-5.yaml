clave: 2-5
grado: 8
periodo: 2
sesion: 5
completo: true
duracion_min: 90
titulo: Actuadores --- luces y sonido con compás
titulo_portada: |-
  Luces y sonido
  con compás
producto_final: |-
  Un programa en MakeCode con una animación de al menos ocho cuadros en la pantalla de 5×5, un tono de al menos cuatro notas sincronizado con los cuadros, y control con botones: A la inicia y B la detiene. Y una bitácora de tres versiones que diga qué cambiaste en cada una y por qué.
apertura:
  origen: Comunidades afro ribereñas del Pacífico sur · los cantos de boga
  fuente: |-
    Ministerio de Cultura. (2010). \emph{Plan Especial de Salvaguardia de las músicas de marimba y los cantos tradicionales del Pacífico sur de Colombia} (A. Vanín Romero, coord.), p.~15. · Lozano Mayo, L. A. y Palacios, L. E. (2013). Los bogas del Chocó. \emph{Bioetnia}, 10, 61--69.
  saber_ancestral: |-
    En los ríos del Pacífico sur, entre Buenaventura y Tumaco, la gente se ha movido durante siglos en canoa, remando. Y mientras rema, canta. Los \textbf{cantos de boga} son cantos de trabajo: se entonan al ritmo de los remos, en trayectos que pueden durar un día entero (Ministerio de Cultura, 2010). El canto no quita el esfuerzo. Le pone un \textbf{compás}: cada golpe de remo cae donde cae la voz, y el cuerpo aguanta más cuando el esfuerzo tiene ritmo. Una animación en el micro:bit funciona igual. Ocho cuadros sin pausa son un parpadeo que nadie ve; ocho cuadros con una nota entre cada uno son una secuencia que cuenta algo. La \textbf{cara de exclusión}: remar durante días es un trabajo extenuante y mal pagado; el canto lo aligera, no lo dignifica por sí solo (Lozano Mayo y Palacios, 2013). Y una precisión: los cantos de boga son de los ríos del Pacífico, no del río Cauca ni del norte del Valle. Hoy vas a darle compás a tus luces con pausas y notas, para que la secuencia cuente algo.
  saber_contemporaneo: |-
    Un \textbf{actuador} es lo que ejecuta la decisión del programa en el mundo: una luz, un sonido, un motor. El micro:bit trae dos. La \textbf{pantalla de 5×5}, 25 luces que se encienden una a una o en figuras; con el bloque «mostrar LEDs» pintas cada cuadro. Y el \textbf{altavoz}, en la versión 2, que toca notas con «tocar tono»: do, re, mi, con una duración. La animación es una secuencia de cuadros. Sin \textbf{pausa} entre ellos, cambian tan rápido que solo se ve el último. Con «pausa (ms)» entre cuadro y cuadro, se ve el movimiento. Y si la pausa dura lo mismo que la nota, la luz y el sonido van juntos: eso es sincronizar. Un programa de actuadores se construye por versiones. Primero los cuadros con pausa. Después las notas. Al final los botones que inician y detienen.
  pregunta_puente: |-
    El boga canta al ritmo del remo y por eso aguanta el trayecto. Cuando pongas ocho cuadros seguidos en el micro:bit sin pausa, ¿qué va a ver quien lo mire? ¿Y qué cambia si cada cuadro dura lo que dura una nota?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué actuadores tiene el micro:bit y qué bloque usa cada uno; (2) \textbf{crear} una animación de ocho cuadros con pausas y cuatro notas sincronizadas; (3) \textbf{aplicar} los botones A y B para iniciar y detener la secuencia; (4) \textbf{evaluar} cada versión y decir qué cambió y por qué.
puentes:
  a_ruta: |-
    En la sesión 4 el micro:bit sintió y avisó. Hoy se expresa: luces en secuencia, sonido con compás y botones que mandan. En la sesión 6 vas a unir las dos cosas con variables y umbrales.
  a_escuta: |-
    Antes de programar, vas a dibujar en papel cuatro cuadros de una animación. Es coreografía en cuadrícula, antes del código.
  a_sistematizacion: |-
    Ya tienes los cuadros en papel. Ahora aprendes los bloques de LEDs, de música y de pausa, y con tu pareja armas la versión 1 y la versión 2.
  a_praxis: |-
    Ya tienes luz y sonido juntos. Toca la versión 3, con botones que inician y detienen, y la bitácora de lo que cambió de una versión a otra.
  a_producto: |-
    Lo que entregas hoy: el programa con ocho cuadros, cuatro notas y control por botones, y la bitácora de tres versiones. La prueba de calidad: tu pareja mira la animación sin que le expliques nada y dice qué cuenta.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Tres versiones que funcionan valen más que una perfecta que nunca terminaste.
  a_triangulo: |-
    Para terminar, tres ideas sobre el ritmo y las versiones, contadas con palabras de esta guía: Dussel sobre la tecnología con rostro humano, Séneca sobre la vida que se nos va mientras la aplazamos, Floridi sobre la atención como bien escaso.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- La coreografía en papel} (15 min · individual). (1) Dibuja en el cuaderno cuatro cuadrículas de 5×5: son la pantalla del micro:bit. (2) Elige una animación simple: un corazón que late, una flecha que gira, una ola que sube, un cuadrado que crece. (3) Rellena con lápiz las luces encendidas de cada cuadro, en orden. (4) Numera los cuadros del 1 al 4. (5) Debajo de cada uno escribe una nota que le pondrías: grave, media o aguda.
  checks:
  - Tengo cuatro cuadrículas de 5×5 rellenas y numeradas.
  - La animación cuenta algo, late, gira, sube o crece.
  - Cada cuadro tiene una nota anotada.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- La coreografía en papel». \textbf{Formato:} cuatro cuadrículas de 5×5 numeradas, con las luces encendidas rellenas y una nota debajo de cada una. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} los cuatro cuadros están rellenos, se nota el movimiento al mirarlos en orden, y cada uno tiene su nota.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · CREA --- Versión 1 y versión 2: luces y luego sonido} (30 min · parejas). (1) Con tu pareja, en MakeCode, arrastren «al presionar el botón A» y adentro un bloque «mostrar LEDs» por cada cuadro de su papel; completen hasta ocho. (2) Entre cuadro y cuadro pongan «pausa (ms)» de 200. Prueben: esa es la versión 1. (3) Ajusten las pausas hasta que la animación se vea fluida y anoten el valor. (4) Después de cada cuadro, o cada dos, agreguen «tocar tono» con una nota y una duración igual a la pausa. Prueben: esa es la versión 2. (5) Anoten qué cambió de la versión 1 a la 2.
  pilares:
  - |-
    \textbf{Los bloques de luz.} «Mostrar LEDs» pinta un cuadro de 5×5 al hacer clic en las luces. «Mostrar ícono» trae figuras hechas. «Borrar pantalla» apaga todo. Una secuencia de «mostrar LEDs» con pausa entre cada uno es una animación.
  - |-
    \textbf{Los bloques de sonido.} «Tocar tono (nota) durante (tiempo)» toca una nota el tiempo que digas: do es 262, re 294, mi 330, fa 349, sol 392, la 440, si 494. Notas cortas hacen ritmo; largas se prolongan. Necesita el altavoz de la versión 2 del micro:bit o unos audífonos en los pines.
  - |-
    \textbf{La pausa es el compás.} Sin pausa, los cuadros cambian tan rápido que solo se ve el último. Con 200 milisegundos entre cuadros, se ve el movimiento. Si la nota dura lo mismo que la pausa, luz y sonido van juntos. Ese es el golpe del remo.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Abre el papel. (2) Un «mostrar LEDs» por cuadro. (3) Pausa entre cada uno. (4) Prueba. (5) Una nota por cuadro, con la misma duración. (6) Prueba. (7) Anota qué cambió.
  anatomia:
    titulo: Los actuadores, en una mirada
    body: |-
      \textbf{Mostrar LEDs:} un cuadro de 5×5. \\[1mm] \textbf{Pausa (ms):} el compás entre cuadros. \\[1mm] \textbf{Tocar tono:} una nota con duración. \\[1mm] \textbf{Sincronizar:} nota y pausa del mismo largo. \\[1mm] \textbf{Botones:} A inicia, B detiene.
  errores_comunes: |-
    (1) \textbf{Cuadros sin pausa}: solo se ve el último. (2) \textbf{Nota sin duración}: queda como pitido o suena eterna. (3) \textbf{Luces al azar}: ocho cuadros que no cuentan nada. (4) \textbf{Sin botón de parar}: la animación no se puede detener. (5) \textbf{Pantalla llena}: 25 luces encendidas a la vez borran la figura.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · CREA).} \textbf{Título:} «Actividad 2 --- Versión 1 y versión 2». \textbf{Formato:} la lista de los ocho cuadros con su pausa, la lista de las notas con su duración, y una línea sobre qué cambió de la versión 1 a la 2. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} la animación se ve fluida, al menos cuatro notas suenan con los cuadros, y anotaste el valor de pausa que funcionó.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Versión 3: los botones mandan} (25 min · individual). (1) Crea una variable «activa». En «al presionar el botón A» ponla en verdadero; en «al presionar el botón B», en falso. (2) Mueve la animación a «para siempre», dentro de un «si activa entonces». Prueba: A la inicia y B la detiene. (3) Escribe la bitácora de las tres versiones: qué tenía cada una, qué cambió y por qué. (4) Muéstrale la animación a tu pareja sin decir nada y pídele que diga qué cuenta. (5) Anota si acertó y, si no, qué cuadro cambiarías.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) El programa final con ocho cuadros, cuatro notas y control por botones, compartido con enlace o archivo .hex. (2) La bitácora de las tres versiones. (3) Lo que dijo tu pareja que contaba la animación.
  - |-
    \textbf{Por qué tres versiones.} La versión 1 ya funciona: son luces con pausa. La 2 le agrega sonido. La 3 le da control. Cada una es un producto, no un borrador. Trabajar así evita el programa gigante que nunca funciona.
  - |-
    \textbf{La variable que manda.} «Activa» es un interruptor: verdadero o falso. A lo enciende, B lo apaga, y el «si activa» dentro de «para siempre» decide si la animación corre. Sin ese «si», los botones no mandan nada.
  - |-
    \textbf{La prueba del que mira.} Tu animación cuenta algo solo si otro lo ve sin que se lo digas. Si tu pareja dice «un corazón que late», funciona. Si dice «unas luces», cambia el cuadro que confunde.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Ocho cuadros distintos con pausa entre ellos. \\[1mm] \checkbox Al menos cuatro notas con la misma duración que la pausa. \\[1mm] \checkbox Botón A inicia y botón B detiene, con la variable «activa». \\[1mm] \checkbox Bitácora de tres versiones con qué cambió y por qué. \\[1mm] \checkbox Mi pareja dijo qué cuenta la animación sin que se lo explicara. \\[1mm] \checkbox Programa compartido con enlace o archivo .hex.
  plantilla_guion: |-
    \textbf{Versión 1.} \textit{Ocho cuadros con pausa de … ms.} \\[1mm] \textbf{Versión 2.} \textit{Cuatro notas con la misma duración.} \\[1mm] \textbf{Versión 3.} \textit{Variable activa, A enciende, B apaga.} \\[1mm] \textbf{Prueba.} \textit{Lo que dijo mi pareja que cuenta.} \\[1mm] \textbf{Cambio.} \textit{El cuadro que ajusté y por qué.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Versión 3, los botones mandan». \textbf{Formato:} tabla de 3 filas y 3 columnas (versión / qué tenía / qué cambió y por qué), más lo que dijo tu pareja que contaba la animación. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} A inicia y B detiene, las tres filas están llenas y anotaste lo que vio tu pareja.
  producto_titulo: Animación de ocho cuadros + cuatro notas sincronizadas + control por botones + bitácora de tres versiones
  criterios:
  - La animación tiene ocho cuadros distintos con pausa y cuenta algo reconocible
  - Al menos cuatro notas suenan con los cuadros, con la misma duración que la pausa
  - El botón A inicia y el botón B detiene, con una variable
  - La bitácora dice qué tenía cada versión y qué cambió
  - Tu pareja dijo qué cuenta la animación sin que se lo explicaras
  - El programa está compartido con enlace o archivo .hex
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.7.1
    idea: |-
      No hay liberación sin una tecnología con rostro humano, diseñada desde la historia de la gente que la usa.
    aplicacion: |-
      Un canto de boga lo hicieron personas que remaban para vivir. Una animación que cuenta algo, un latido, una ola, es tecnología con rostro; ocho luces al azar, no. Lo que le da rostro es que alguien la entienda.
    pregunta_espejo: |-
      ¿Mi animación la entiende alguien que no soy yo?
  estoico:
    autor: Séneca · Cartas a Lucilio, 1 (c. 64 d.C.)
    idea: |-
      Mientras la aplazamos, la vida se va. Solo el tiempo es nuestro, y se escapa.
    aplicacion: |-
      La versión 1 funciona hoy. Esperar a tener la versión perfecta es aplazar. Tres versiones que corren valen más que una idea enorme que nunca se probó.
    pregunta_espejo: |-
      ¿Qué versión de algo mío nunca entregué por esperar a que fuera perfecta?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6
    idea: |-
      La atención de las personas es un bien finito, precioso y escaso.
    aplicacion: |-
      Ocho cuadros con compás cuidan la atención de quien mira; luces sin pausa la gastan. Diseñar una pantalla es decidir qué merece la atención de otro.
    pregunta_espejo: |-
      ¿Qué de mi animación pide atención sin devolver nada?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu coreografía y la bitácora de tres versiones. En la sesión 6 vas a usar variables y umbrales para que los sensores no solo disparen acciones, sino que respondan a niveles. La variable «activa» de hoy es la primera de muchas.
web:
  resumen: |-
    Un actuador ejecuta lo que el programa decide, luz o sonido. Hoy le das compás a una animación de ocho cuadros con notas y pausas, y la controlas con botones, como los bogas del Pacífico que reman al ritmo del canto.
  subtema: Lógica y micro:bit
  pre_lectura:
    por_que_importa: |-
      Todo lo que una máquina te muestra o te suena pasó por una secuencia con pausas. Saber armarla por versiones es la forma de terminar lo que empiezas.
    pregunta_detonante: |-
      Cuando pongas ocho cuadros seguidos sin pausa, ¿qué va a ver quien mire el micro:bit?
    activacion:
      titulo: Dos cuadros sin pausa
      descripcion: |-
        En 3 minutos, pon en MakeCode dos «mostrar LEDs» seguidos, un corazón grande y uno pequeño, sin pausa. ¿Qué ves en el simulador? Agrega una pausa de 300 y vuelve a mirar.
      duracion_min: 5
    conexion:
      anterior: En la sesión 4 el micro:bit sintió con dos sensores y avisó.
      siguiente: En la sesión 6 usas variables y umbrales para responder a niveles.

clave: 2-5
grado: 8
periodo: 2
sesion: 5
completo: true
titulo: Actuadores --- LEDs, sonido y coreografía
titulo_portada: |-
  Actuadores ---
  LEDs, sonido
  y coreografía
producto_final: |-
  Programa en MakeCode que combine (a) secuencia coreográfica de al menos 8 frames distintos en los LEDs 5×5 del micro:bit (animación que cuente algo: latido, ola, números, palabra que cambia), (b) tono musical sincronizado con al menos 4 notas distintas que acompañen la animación, (c) lazo de repetición controlado por uno de los botones (al presionar A inicia, al presionar B detiene) + bitácora de 3 versiones del programa documentando qué cambiaste y por qué
apertura:
  saber_ancestral: |-
    En los pueblos del Valle del Cauca y en los puertos del Pacífico, antes de los teléfonos y los altavoces, la comunicación a distancia se hacía con \textbf{dos instrumentos antiguos} que combinaban luz y sonido: \textbf{la campana del pueblo} y \textbf{el faro del puerto}. La campana sonaba con códigos que toda la comunidad conocía: un solo toque para el ángelus, dos toques rápidos para el incendio, un repique largo para el difunto, tres campanadas para la misa. El faro del puerto, en cambio, era luz: pulso largo, pulso corto, pulso largo, según un patrón conocido por todos los marineros. Cada faro tenía su \emph{firma} de luz para que el navegante supiera de qué puerto venía la señal. La sabiduría era doble: (1) \textbf{Comunicar sin estar presente}: la campana y el faro hablaban por sí solos a kilómetros. (2) \textbf{Hablar con patrones}, no con ruido aleatorio: cada secuencia tenía significado. La campana y el faro eran \textbf{actuadores ancestrales}: máquinas que, activadas por una decisión humana o automática, comunicaban a distancia con códigos de sonido y luz. El micro:bit hace lo mismo a escala de tu mano: LEDs y altavoz que dicen algo cuando se les programa con criterio.
  saber_contemporaneo: |-
    Los \textbf{actuadores} son los componentes que ejecutan acciones físicas a partir de las decisiones del programa: \textbf{producen efectos en el mundo}. El micro:bit tiene varios actuadores integrados: (1) \textbf{Pantalla de 5×5 LEDs}: 25 puntos de luz que se encienden individual o en patrones. Permite mostrar íconos, números, texto desplazándose, animaciones. (2) \textbf{Altavoz integrado} (en micro:bit v2): emite tonos musicales (\texttt{do, re, mi, fa, sol, la, si}) con duración variable. (3) \textbf{Pines de conexión}: permiten controlar LEDs externos, motores pequeños, servos. La regla profesional del oficio: \textbf{la animación bien sincronizada con sonido es 10 veces más comunicativa que LEDs o sonido por separado}. Los bloques de MakeCode para actuadores se encuentran en las categorías \emph{Básico} (LEDs) y \emph{Música} (tonos). Un buen programa con actuadores combina los dos en \textbf{coreografía}: secuencia ordenada de frames de LEDs con sonido sincronizado, con inicio y fin controlados por el usuario.
  pregunta_puente: |-
    ¿Qué sabía el pueblo al codificar la campana con toques distintos para anuncios diferentes, que el novato olvida cuando enciende todos los LEDs al azar sin patrón? ¿Y por qué una animación con 8 frames sincronizada con música es más comunicativa que 25 LEDs encendidos al mismo tiempo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué patrón de LEDs comunica mejor una idea (latido, ola, número, palabra animada); (2) \textbf{aplicar} los bloques de MakeCode para crear secuencias de frames en la pantalla 5×5; (3) \textbf{crear} una coreografía de 8+ frames sincronizada con tono musical de 4+ notas y controlada por botón; (4) \textbf{evaluar} tu programa en 3 versiones progresivas documentando qué cambiaste y por qué.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 4 aprendiste a leer sensores. Hoy aprendes a \emph{expresarte} con actuadores. Las sesiones 6-8 combinarán sensores y actuadores en sistemas que perciben y reaccionan. Sin dominar la salida (hoy), las próximas sesiones no podrán comunicar bien lo que perciben.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio del faro}: dibuja en tu cuaderno la pantalla de 5×5 LEDs y diseña 4 frames distintos a mano (cuadrados que llenes con lápiz) que cuenten una secuencia simple (ej. un cuadrado que se hace más grande, una flecha que rota, un corazón que late). Estás haciendo coreografía en papel antes de hacerla en código.
  a_sistematizacion: |-
    Ya tienes el boceto en papel. Ahora vas a entender la \textbf{anatomía de los actuadores}: los bloques de LEDs, los bloques de música, la sincronización con \emph{pausa}, los 5 errores típicos (frames sin pausa entre ellos, sonido sin duración, animación sin propósito narrativo, sin control de inicio/fin, demasiados LEDs encendidos a la vez).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: traducir el boceto a MakeCode con 8+ frames + 4 notas musicales sincronizadas + control por botón. Hacer 3 versiones del programa, cada una mejorando algo.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: programa funcional con coreografía + sonido + botón + bitácora de 3 versiones. El criterio principal: que la coreografía comunique algo claro (no luces al azar) y que el sonido refuerce la animación.
  a_evaluacion: |-
    Antes de cerrar, mira los actuadores desde las cinco dimensiones humanas. Comunicar con patrones es respeto por el código; encender LEDs sin secuencia es ruido visual sin oficio.
  a_triangulo: |-
    Y para terminar, tres voces sobre la expresión digital. Dussel sobre los sistemas que comunican o que solo decoran, Epicteto sobre la disciplina del patrón, Floridi sobre el sistema digital como instrumento de expresión humana.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Boceto del faro en papel} (15 min · individual). Dibuja en tu cuaderno una grilla de 5×5 cuadrados (representa la pantalla LED del micro:bit). Diseña en papel \textbf{4 frames distintos} de una animación simple: pueden ser un corazón que late (chico, mediano, grande, mediano), una flecha que rota (norte, este, sur, oeste), un cuadrado que crece desde el centro, o lo que se te ocurra. Llena con lápiz los LEDs que estarían encendidos en cada frame. Numera los frames 1, 2, 3, 4. Es coreografía en papel antes del código.
  checks:
  - Dibujé 4 frames distintos en la grilla 5x5.
  - Los frames cuentan una secuencia clara.
  - Numeré el orden de los frames.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Boceto del faro». \textbf{Formato:} 4 grillas 5x5 numeradas con LEDs marcados a lápiz + título breve de la animación. \textbf{Sabes que terminaste cuando} alguien podría adivinar qué cuenta tu animación.
sistematizacion:
  intro: |-
    Tu boceto en papel es la coreografía sin código. Para traducirla a MakeCode necesitas la \textbf{anatomía de los actuadores}: los bloques de LEDs, los bloques de música, la sincronización con pausa.
  pilares:
  - |-
    Los \textbf{bloques de LEDs} en MakeCode (categoría Básico) se descomponen así: (1) \textbf{mostrar LEDs}: matriz 5×5 que se puede pintar individualmente clicando los cuadros. Es el bloque para crear cada frame. (2) \textbf{mostrar ícono}: íconos predefinidos (corazón, sonrisa, flechas, etc.). (3) \textbf{mostrar número}: muestra cifras desplazándose. (4) \textbf{mostrar cadena}: texto desplazándose. (5) \textbf{limpiar pantalla}: apaga todos los LEDs. La secuencia de \emph{mostrar LEDs} en orden, separadas por \emph{pausa (ms)}, produce animación.
  - |-
    Los \textbf{bloques de música} (categoría Música) se descomponen así: (a) \textbf{tocar tono (frecuencia) por (tiempo)}: emite una nota durante el tiempo especificado. Frecuencias estándar: \texttt{do=262, re=294, mi=330, fa=349, sol=392, la=440, si=494}. (b) \textbf{tocar nota (nota seleccionable) por (tiempo)}: misma idea con selector visual. (c) \textbf{detener melodía}: silencia el sonido. La duración importa: notas cortas (1 negra = 500ms aprox.) producen ritmo; notas largas se prolongan.
  - |-
    La clave de la \textbf{sincronización} es el bloque \emph{pausa (ms)} (categoría Básico): introduce esperas entre frames y notas. Si pones \emph{mostrar LEDs} (frame 1) → \emph{pausa 200 ms} → \emph{mostrar LEDs} (frame 2), la animación se ve fluida. Sin pausa, los frames cambian tan rápido que solo se ve el último. La sincronización con música requiere ajustar las pausas para que coincidan con la duración de las notas.
  - |-
    Algoritmo: (1) abre tu boceto en papel. (2) en MakeCode, dentro del \emph{para siempre} o dentro de un bloque \emph{al presionar botón A}, pon \emph{mostrar LEDs} del frame 1, pausa, frame 2, pausa, etc. (3) agrega \emph{tocar tono} con duración apropiada entre los frames. (4) prueba en el simulador. (5) ajusta las pausas para que la animación se vea como quieres. (6) agrega control con botón A (inicia) y botón B (detiene).
  anatomia:
    titulo: Anatomía del programa con actuadores
    body: |-
      \textbf{Frame:} bloque \emph{mostrar LEDs} con grilla pintada. \\[1mm] \textbf{Pausa:} \emph{pausa (ms)} entre frames. \\[1mm] \textbf{Tono:} \emph{tocar tono (Hz) por (ms)}. \\[1mm] \textbf{Animación:} secuencia frame-pausa-frame-pausa... \\[1mm] \textbf{Control:} botón A inicia, botón B detiene.
  errores_comunes: |-
    (1) \textbf{Frames sin pausa}: cambian tan rápido que solo se ve el último. (2) \textbf{Sonido sin duración explícita}: queda como pitido o muy largo. (3) \textbf{Animación sin propósito narrativo}: LEDs al azar sin contar nada. (4) \textbf{Sin control de inicio/fin}: programa se ejecuta una vez y termina; el usuario no puede repetirlo. (5) \textbf{Pantalla saturada}: encender 25 LEDs al mismo tiempo borra el patrón.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía actuadores». \textbf{Formato:} (a) bloques de LEDs y música listados; (b) ejemplo de sincronización (frame → pausa → tono); (c) los 5 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías traducir tu boceto del faro a bloques sin ayuda.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Coreografía completa + 3 versiones} (40 min · individual o parejas). Hora de crear. Traducir el boceto a MakeCode con 8+ frames, 4+ notas, control por botón. Hacer 3 versiones iterativas, cada una mejorando algo.
  pilares:
  - |-
    Las 3 versiones progresivas son la práctica del oficio: (a) \textbf{Versión 1}: solo la animación de 8 frames con pausa, sin música. Probar y ajustar pausas. (b) \textbf{Versión 2}: agregar 4 notas musicales sincronizadas con los frames. Probar y ajustar duraciones. (c) \textbf{Versión 3}: agregar control con botones (A inicia, B detiene). Probar el ciclo completo. Documentar en la bitácora qué cambió de v1 a v2, y de v2 a v3.
  - |-
    Sigue el patrón \textbf{``iteración sobre perfección''}: cada versión es funcional aunque imperfecta. La versión 1 no es \emph{borrador}: es producto que funciona. La versión 2 le agrega algo. La versión 3 cierra. Esa disciplina iterativa es el oficio del programador profesional, no la búsqueda de la versión perfecta de un solo intento.
  - |-
    Ideas para la coreografía: (1) \textbf{Latido cardíaco}: corazón pequeño, mediano, grande, mediano, pequeño, pausa, repite. Sonido grave-agudo-grave. (2) \textbf{Ola del Pacífico}: línea inferior, sube una fila, sube otra, baja, baja, vuelve abajo. Sonido descendente. (3) \textbf{Cuenta regresiva}: 5, 4, 3, 2, 1, sonrisa. Tonos del agudo al grave. (4) \textbf{Bandera al viento}: patrón ondulante con 8 frames. (5) \textbf{Pixel art animado}: avatar pequeño que parpadea, mira a un lado, mira al otro.
  - |-
    Algoritmo: (1) elegir la coreografía. (2) traducir frames a bloques mostrar LEDs. (3) agregar pausa entre cada uno. (4) probar v1. (5) agregar tonos. (6) probar v2. (7) agregar control con botones. (8) probar v3. (9) bitácora de las 3 versiones.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 8+ frames distintos en la animación. \\[1mm] \checkbox 4+ notas musicales sincronizadas. \\[1mm] \checkbox Pausas ajustadas para fluidez. \\[1mm] \checkbox Botón A inicia, botón B detiene. \\[1mm] \checkbox 3 versiones documentadas en bitácora. \\[1mm] \checkbox Coreografía cuenta algo (no LEDs al azar). \\[1mm] \checkbox Código compartible (link o archivo .hex).
  plantilla_guion: |-
    \textbf{Idea.} \textit{Qué cuenta la coreografía.} \\[1mm] \textbf{V1.} \textit{8+ frames sin música.} \\[1mm] \textbf{V2.} \textit{V1 + 4 notas sincronizadas.} \\[1mm] \textbf{V3.} \textit{V2 + control con botones.} \\[1mm] \textbf{Bitácora.} \textit{Qué cambió en cada versión y por qué.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Mi coreografía digital». \textbf{Formato:} (a) idea + descripción narrativa; (b) bitácora de 3 versiones; (c) link al código MakeCode. \textbf{Sabes que terminaste cuando} tu coreografía hace que alguien que la vea pueda reconocer qué cuenta.
  producto_titulo: Coreografía con 8+ frames + 4+ notas + control + bitácora 3 versiones
  criterios:
  - Animación de 8+ frames distintos
  - Tono musical con 4+ notas sincronizadas
  - Control con botones A (inicia) y B (detiene)
  - 3 versiones documentadas
  - Coreografía con propósito narrativo
  - Código compartible
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un sistema que comunica con patrones honra al receptor; un sistema que solo decora desperdicia la voz que tiene.
    aplicacion: |-
      Tu coreografía puede tener dos destinos: comunicar algo (latido, advertencia, narrativa) o solo decorar (luces al azar). La filosofía de la liberación pide que tu código tenga propósito: que el usuario, viendo la animación, pueda reconocer qué cuenta. La phronesis del oficio digital consiste en \textbf{usar la pantalla como voz, no como adorno}.
    pregunta_espejo: |-
      Mi coreografía, ¿comunica algo claro al observador o solo enciende LEDs bonitos?
  estoico:
    autor: Epicteto
    cita: |-
      El patrón es disciplina del código; lo aleatorio es pereza disfrazada de creatividad.
    aplicacion: |-
      Es tentador llenar la pantalla con luces al azar y llamarlo \emph{``arte''}. La sabiduría estoica recomienda lo opuesto: \emph{escribe con patrón disciplinado}. La campana del pueblo no sonaba al azar: cada toque tenía significado. El faro del puerto no parpadeaba al azar: cada secuencia identificaba el lugar. Tu coreografía debe seguir la misma disciplina: \textbf{cada frame en su orden, cada nota en su tiempo}.
    pregunta_espejo: |-
      ¿Mis frames siguen un patrón disciplinado, o están en orden aleatorio?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El código que se expresa con sentido es la nueva ética del oficio creativo en la era digital.
    aplicacion: |-
      En la era de la información, el código no solo calcula: también expresa. Tu micro:bit con coreografía es un acto creativo digital. La ética del oficio pide que esa expresión sea consciente: que la animación, el sonido, la duración hayan sido decididos con criterio. Quien programa coreografías sin criterio produce ruido digital; quien las programa con criterio produce comunicación.
    pregunta_espejo: |-
      ¿Mi coreografía expresa algo decidido con criterio, o es ensayo aleatorio que probó cosas hasta que algo funcionó?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu coreografía y la bitácora de 3 versiones. En la sesión 6 vas a aprender a usar \textbf{variables y umbrales} para que los sensores no solo disparen acciones discretas sino que reaccionen a niveles continuos. La coreografía de hoy es la base; los umbrales calibrados de mañana se montan sobre ella.
web:
  conceptos_clave:
    - termino: Actuador
      definicion: |-
        Componente que ejecuta acción física a partir de la decisión del programa. Produce efectos en el mundo (luz, sonido, movimiento).
      ejemplo: |-
        Los 25 LEDs de la matriz 5x5 del micro:bit son actuadores: encienden o apagan según el programa.
      emoji: "💡"
    - termino: Matriz de LEDs 5x5
      definicion: |-
        25 luces pequeñas organizadas en 5 filas y 5 columnas en la cara del micro:bit. Cada una se puede encender independientemente.
      ejemplo: |-
        En MakeCode "mostrar LEDs" permite pintar la matriz como mosaico: cada cuadrito representa un LED encendido o apagado.
      emoji: "🟨"
    - termino: Pausa (ms)
      definicion: |-
        Bloque que detiene la ejecución por milisegundos. Crucial para animaciones: sin pausa, los frames se ven solo el último.
      ejemplo: |-
        Mostrar frame 1, pausa 200ms, mostrar frame 2, pausa 200ms... La pausa hace visible la animación.
      emoji: "⏸"
    - termino: Tocar tono (Hz, ms)
      definicion: |-
        Bloque de música que emite frecuencia por tiempo determinado. Frecuencias estándar: do=262, re=294, mi=330, fa=349, sol=392.
      ejemplo: |-
        tocar tono(262, 500) emite un do durante medio segundo. Encadenando notas se construyen melodías.
      emoji: "🎵"
    - termino: Coreografía
      definicion: |-
        Secuencia ordenada de frames de LEDs con sonido sincronizado. Comunica algo (latido, ola, palabra) y se controla con botones.
      ejemplo: |-
        Corazón pequeño → mediano → grande → mediano → pequeño con sonido grave-agudo-grave. Cuenta latido en 5 frames.
      emoji: "💃"
  quiz:
    titulo: ¿Sabes usar actuadores con criterio?
    instrucciones: 5 preguntas para verificar que dominas LEDs, sonido y sincronización en MakeCode.
    preguntas:
      - enunciado: 'Programaste 5 frames seguidos sin "pausa" entre ellos. ¿Qué pasa?'
        opciones:
          - Animación fluida
          - Error
          - Se ve todo en pantalla a la vez
          - Solo se ve el último frame porque cambian demasiado rápido
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Sin pausa los frames cambian a velocidad de microsegundos. Solo se percibe el último. La pausa hace visible la secuencia.
        feedback_incorrecto: |-
          Sin pausa solo se ve el último. Los frames cambian tan rápido que el ojo solo capta el final. Necesitas pausa entre ellos.
      - enunciado: '¿Cuál es la frecuencia estándar de la nota "do" (do central)?'
        opciones:
          - 262 Hz
          - 100 Hz
          - 440 Hz
          - 1000 Hz
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Do central = 262 Hz. Re=294, mi=330, fa=349, sol=392, la=440, si=494. Estándares musicales.
        feedback_incorrecto: |-
          Do central es 262 Hz. La 440 (que confunde) es la nota "la", referencia para afinación.
      - enunciado: '¿Cuántos LEDs tiene la matriz del micro:bit?'
        opciones:
          - "16"
          - "25"
          - "100"
          - "9"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 5x5 = 25 LEDs. Cada uno controlable independientemente con "mostrar LEDs" o "encender LED en X,Y".
        feedback_incorrecto: |-
          Son 25 LEDs (matriz 5x5). Cada uno se puede encender por separado.
      - enunciado: '¿Qué hace un actuador?'
        opciones:
          - Percibe el mundo
          - Calcula valores
          - Ejecuta acciones físicas a partir de decisiones del programa
          - Almacena datos
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Actuador ejecuta acciones (luz, sonido, movimiento). Sensor percibe; actuador actúa. Son complementarios.
        feedback_incorrecto: |-
          Actuador ejecuta acciones físicas. Lo que percibe es el sensor. Actuador y sensor son complementarios.
      - enunciado: 'Vas a programar el "latido" del corazón. ¿Qué patrón de frames usas?'
        opciones:
          - Un corazón fijo todo el tiempo
          - Corazón aleatorio
          - 25 LEDs aleatorios
          - Corazón pequeño → mediano → grande → mediano → pequeño, con pausas
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Latido = expansión y contracción rítmica. El patrón pequeño-mediano-grande-mediano-pequeño con pausas comunica latido.
        feedback_incorrecto: |-
          El latido se comunica con la secuencia pequeño-mediano-grande-mediano-pequeño y pausas entre cada frame.

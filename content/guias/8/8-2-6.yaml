clave: 2-6
grado: 8
periodo: 2
sesion: 6
completo: true
duracion_min: 90
titulo: Variables y umbrales --- calibrar antes de programar
titulo_portada: |-
  Umbrales
  que se calibran
producto_final: |-
  Un programa en MakeCode que lea el sensor de luz o el de temperatura, guarde la lectura en una variable con nombre y dispare tres alertas distintas según tres umbrales. Y una bitácora de calibración con al menos cinco mediciones reales, los tres umbrales decididos y una línea que justifique cada uno.
apertura:
  origen: Pueblo nasa de Toribío (Cauca) · las señales para predecir el tiempo
  fuente: |-
    Ramos García, C., Tenorio, A. D. y Muñoz Yule, F. (2011). Ciclos naturales, ciclos culturales: percepción y conocimientos tradicionales de los nasas frente al cambio climático en Toribío, Cauca, Colombia. En A. Ulloa (Ed.), \emph{Perspectivas culturales del clima} (pp. 247--274). Universidad Nacional de Colombia.
  saber_ancestral: |-
    En Toribío, en el norte del Cauca, los mayores nasa leen el tiempo en señales que pocos saben interpretar. Si las hormigas arrieras salen al aire libre a recoger comida, va a llover. Si el sapo croa, va a llover. Y la luna avisa con su color: \textbf{nus ate}, la luna de lluvia, se ve pálida y blanca; \textbf{sek ate}, la luna de sol, se ve amarillenta (Ramos García, Tenorio y Muñoz Yule, 2011). Cada señal es un sensor con un \textbf{umbral}: no basta con ver la luna, hay que saber a partir de qué tono anuncia agua. Y ese umbral se vuelve a ajustar. Don Luis Ardo Ascué lo cuenta así: antes, apenas el sapo croaba, caía un torrente; ahora solo cae una llovizna. La señal sigue ahí, pero ya no anuncia lo mismo. La \textbf{cara de exclusión}: los autores del capítulo advierten que no buscan probar si las señales aciertan, sino entender cómo ve el mundo un pueblo. Y Toribío lee esas señales en medio de un conflicto armado que las marca. Hoy vas a hacer lo mismo: medir varias veces antes de decidir el umbral, y volver a mirarlo cuando la realidad cambie.
  saber_contemporaneo: |-
    El sensor de luz del micro:bit entrega un número entre 0, oscuridad total, y 255, luz fuerte. El de temperatura entrega grados Celsius. La pregunta ya no es «¿hay luz?», sino «¿cuánta luz hay y desde qué valor disparo la alerta?». Ese valor es el \textbf{umbral}: la frontera entre una zona y otra. Los umbrales no son universales. Un aula con cortinas abiertas puede estar «oscura» en 100; la misma aula con cortinas cerradas, en 40. Por eso los umbrales se \textbf{calibran}: se toman varias lecturas en condiciones reales antes de decidir. Para comparar lecturas necesitas guardarlas. Eso hacen las \textbf{variables}: «establecer nivel\_luz a nivel de luz» guarda el número, y después «si nivel\_luz $<$ umbral\_oscuro» decide. Una variable con nombre claro, nivel\_luz y no x, se entiende un mes después. Sin variables no puedes comparar; sin calibración, comparas contra un número inventado.
  pregunta_puente: |-
    Don Luis notó que el sapo ya no anuncia el torrente de antes y ajustó lo que espera de esa señal. Si tu alarma de «falta luz» sonara a mediodía con el sol entrando, ¿qué habría fallado: el sensor o el umbral que tú pusiste?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} un umbral razonable a partir de una lista de lecturas; (2) \textbf{aplicar} una calibración de cinco mediciones reales con bitácora; (3) \textbf{evaluar} tres umbrales y programarlos con variables y tres alertas; (4) \textbf{explicar} por qué el mismo umbral no sirve en otro salón.
puentes:
  a_ruta: |-
    En la sesión 5 el micro:bit se expresó con luces y sonido. Hoy aprende a medir cuánto, no solo si, y a decidir con umbrales que tú calibraste. En la sesión 7 vas a buscar los errores cuando el programa no haga lo que esperas.
  a_escuta: |-
    Antes de tocar el micro:bit, vas a decidir un umbral con lápiz sobre cinco lecturas de un aula. Es la lectura de la luna, pero con números.
  a_sistematizacion: |-
    Ya decidiste un umbral en papel y viste qué pasaba si lo movías. Ahora aprendes las variables y, con tu pareja, haces cinco mediciones reales en el salón.
  a_praxis: |-
    Ya tienes la bitácora con cinco lecturas. Toca decidir tres umbrales, programarlos con variables y comprobar que las tres alertas suenan cuando deben.
  a_producto: |-
    Lo que entregas hoy: el programa con variable y tres alertas, y la bitácora de calibración con los umbrales justificados. La prueba de calidad: cubres el micro:bit con la mano y sale la alerta de oscuro; lo pones bajo la lámpara y sale la de brillante.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un umbral que salió de cinco lecturas vale más que uno que se te ocurrió.
  a_triangulo: |-
    Para terminar, tres ideas sobre medir antes de decidir, contadas con palabras de esta guía: Dussel sobre la información que nunca se lee sola, Epicteto sobre las cosas y las opiniones, y la Onlife Initiative sobre las alarmas que gastan la atención.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El umbral sobre cinco lecturas} (15 min · individual). (1) Copia en el cuaderno estas lecturas del sensor de luz de un aula: 7 a. m. = 120; 9:30 a. m. = 180; 12 m. = 210; 2 p. m. = 195; 5 p. m. = 65. (2) Quieres una alarma de «falta luz» que suene solo cuando el aula esté oscura de verdad. Escribe qué pasaría en cada uno de los cinco momentos si el umbral fuera 100. (3) Escribe qué pasaría si el umbral fuera 150. (4) Decide tu umbral y escribe en dos líneas por qué. (5) Anota qué lectura te haría dudar de tu umbral.
  checks:
  - Tengo las cinco lecturas copiadas con su hora.
  - Escribí qué pasa en los cinco momentos con umbral 100 y con umbral 150.
  - Decidí un umbral y lo justifiqué en dos líneas.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- El umbral sobre cinco lecturas». \textbf{Formato:} las cinco lecturas con su hora, dos filas de «qué pasa» (umbral 100 y umbral 150) y tu umbral con su justificación. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes decir en voz alta en cuáles de los cinco momentos sonaría tu alarma y por qué en esos.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- Cinco mediciones reales} (30 min · parejas). (1) Con tu pareja, en MakeCode, arrastren «para siempre» y adentro «mostrar número (nivel de luz)»; carguen al micro:bit o usen el simulador. (2) Dibujen en el cuaderno la bitácora de cuatro columnas: momento, lectura, condición real, observación. (3) Tomen cinco lecturas en condiciones distintas: micro:bit sobre la mesa, junto a la ventana, bajo la lámpara, tapado con la mano, dentro del bolso. (4) Anoten cada lectura en su fila con lo que observaron. (5) Ordenen las cinco lecturas de menor a mayor y marquen cuáles son «normales».
  pilares:
  - |-
    \textbf{La variable guarda la lectura.} En la categoría Variables, «establecer nivel\_luz a (nivel de luz)» guarda el número que dio el sensor en ese instante. «Cambiar nivel\_luz por 1» le suma uno. El nombre lo eliges tú: nivel\_luz, temperatura\_aula, umbral\_oscuro. Con x o y, en una semana no sabes qué guardaste.
  - |-
    \textbf{La bitácora de calibración.} Cuatro columnas: momento (hora o condición), lectura (el número exacto), condición real (¿estaba oscuro?, ¿había sol?) y observación (la cortina, la lámpara, la mano). Cinco mediciones en condiciones distintas son el mínimo para decidir un umbral.
  - |-
    \textbf{Cómo se decide un umbral.} Ordena las lecturas de menor a mayor. Mira dónde se juntan la mayoría: ese es el rango normal. El umbral inferior va por debajo de la menor lectura normal; el superior, por encima de la mayor. Con 65, 120, 180, 195 y 210, el rango normal es 120 a 210. Oscuro podría ser menos de 100 y brillante más de 220.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Mostrar la lectura en pantalla. (2) Dibujar la bitácora. (3) Medir cinco veces en condiciones distintas. (4) Anotar cada fila. (5) Ordenar y marcar el rango normal.
  anatomia:
    titulo: La calibración, en una mirada
    body: |-
      \textbf{Lectura:} el número que da el sensor. \\[1mm] \textbf{Variable:} donde se guarda la lectura, con nombre claro. \\[1mm] \textbf{Bitácora:} momento, lectura, condición, observación. \\[1mm] \textbf{Rango normal:} donde se juntan la mayoría de lecturas. \\[1mm] \textbf{Umbral:} la frontera, por fuera del rango normal.
  errores_comunes: |-
    (1) \textbf{Umbral inventado}: la alarma suena a mediodía o no suena de noche. (2) \textbf{Variables x, y, z}: nadie sabe qué guardan. (3) \textbf{Una o dos mediciones}: no alcanzan para ver el rango normal. (4) \textbf{Umbral pegado al rango normal}: alarma falsa cada rato. (5) \textbf{No volver a mirar}: el umbral falló en la prueba y quedó igual.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- Cinco mediciones reales». \textbf{Formato:} la bitácora de cuatro columnas con cinco filas llenas, y debajo las lecturas ordenadas con el rango normal marcado. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cinco filas tienen lectura y observación, y puedes señalar cuál es la lectura normal más baja y la más alta.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Tres umbrales, tres alertas} (25 min · individual). (1) Con tu bitácora, decide tres zonas: oscuro, normal y brillante, o frío, ambiente y caliente. Escribe los dos umbrales que las separan y una línea de justificación por cada uno. (2) En MakeCode, dentro de «para siempre», pon «establecer nivel\_luz a (nivel de luz)». (3) Agrega un «si… si no, si… si no» con tres ramas: nivel\_luz $<$ umbral\_oscuro, nivel\_luz $>$ umbral\_brillante y el resto. (4) Pon en cada rama un ícono distinto: luna, sol y una equis pequeña. (5) Prueba tapando el micro:bit y poniéndolo bajo la luz. Si una alerta sale en el momento equivocado, mueve el umbral y anota el cambio.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) El programa con la variable y las tres ramas, compartido con enlace o archivo .hex. (2) La bitácora con las cinco mediciones y los tres umbrales justificados. (3) La nota del ajuste, si tuviste que mover un umbral después de probar.
  - |-
    \textbf{Calibrar primero, programar después.} El programa se escribe en cinco minutos cuando los umbrales ya están decididos. Lo que toma tiempo es medir. Quien programa primero termina cambiando números al azar hasta que «funciona» una vez.
  - |-
    \textbf{Tres alertas que se distingan.} Luna para oscuro, sol para brillante, equis para normal. O tres notas: grave, media, aguda. Si dos alertas se parecen, quien mira el micro:bit no sabe qué pasa.
  - |-
    \textbf{La prueba y el ajuste.} Tapas el micro:bit: debe salir la luna. Lo pones bajo la lámpara: debe salir el sol. Si sale la equis en la oscuridad, tu umbral de oscuro quedó muy bajo. Súbelo y anota por qué. Ese ajuste es lo que hizo don Luis con el sapo.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Cinco mediciones reales en condiciones distintas. \\[1mm] \checkbox Bitácora con las cuatro columnas llenas. \\[1mm] \checkbox Dos umbrales decididos, con una línea de justificación cada uno. \\[1mm] \checkbox Variable con nombre claro, no x ni y. \\[1mm] \checkbox Tres ramas que muestran tres alertas distintas. \\[1mm] \checkbox Probado tapando y bajo la luz; ajuste anotado si hizo falta. \\[1mm] \checkbox Programa compartido con enlace o archivo .hex.
  plantilla_guion: |-
    \textbf{Sensor.} \textit{Luz o temperatura.} \\[1mm] \textbf{Lecturas.} \textit{Las cinco, de menor a mayor.} \\[1mm] \textbf{Rango normal.} \textit{De … a …} \\[1mm] \textbf{Umbrales.} \textit{Oscuro si menos de …, porque …; brillante si más de …, porque …} \\[1mm] \textbf{Ajuste.} \textit{Moví … porque en la prueba …}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Tres umbrales, tres alertas». \textbf{Formato:} los dos umbrales con su justificación de una línea, el dibujo de las tres ramas con su ícono, y la nota del ajuste si lo hubo. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} al tapar el micro:bit sale la luna, bajo la lámpara sale el sol, y cada umbral tiene su porqué escrito.
  producto_titulo: Programa con variable y tres alertas por umbral + bitácora de calibración con cinco mediciones y umbrales justificados
  criterios:
  - La bitácora tiene cinco mediciones reales en condiciones distintas, con las cuatro columnas
  - Los dos umbrales están por fuera del rango normal y cada uno tiene una justificación
  - El programa guarda la lectura en una variable con nombre claro
  - Las tres ramas muestran tres alertas distintas
  - Al tapar el micro:bit sale la alerta de oscuro y bajo la luz la de brillante
  - El programa está compartido con enlace o archivo .hex
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.2.5.4
    idea: |-
      Es ingenuo creer que la información se lee sola, sin conflictos ni contexto.
    aplicacion: |-
      El número 120 no dice «oscuro» por sí mismo. Lo dice el salón, la hora y la cortina. Un umbral es una decisión sobre el contexto, y por eso el de tu salón no sirve en otro.
    pregunta_espejo: |-
      ¿Qué número leí esta semana como si hablara solo, sin preguntar de dónde salió?
  estoico:
    autor: Epicteto · Enquiridión, 5 (c. 125 d.C.)
    idea: |-
      No nos inquietan las cosas, sino las opiniones que tenemos sobre ellas.
    aplicacion: |-
      La lectura del sensor es la cosa. El umbral que inventaste sin medir es una opinión. Cuando la alarma suena a mediodía, no falló el sensor: falló la opinión.
    pregunta_espejo: |-
      ¿Cuál de mis umbrales de hoy era una opinión antes de medir?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6
    idea: |-
      El diseño de nuestras tecnologías, empezando por sus valores por defecto, debería proteger la capacidad de atención de las personas.
    aplicacion: |-
      Una alarma que suena cuando no toca enseña a ignorarla. Calibrar el umbral es respetar la atención de quien va a oírla: suena poco y suena cuando importa.
    pregunta_espejo: |-
      ¿Qué alerta de mi celular suena tanto que ya no la miro?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu programa calibrado y la bitácora. En la sesión 7 vas a buscar el error cuando el programa no hace lo que esperas: una hipótesis, una prueba. Los umbrales que calibraste hoy son el primer lugar donde vas a mirar.
web:
  resumen: |-
    Un umbral es la frontera desde la que el programa actúa, y no se inventa: se calibra con mediciones reales. Hoy guardas lecturas en variables y disparas tres alertas, como los mayores nasa de Toribío que ajustan lo que esperan de una señal cuando el mundo cambia.
  subtema: Lógica y micro:bit
  pre_lectura:
    por_que_importa: |-
      Cada alarma, termostato y sensor que te rodea tiene un umbral que alguien decidió. Saber calibrarlo es saber por qué una alarma suena a tiempo y otra molesta.
    pregunta_detonante: |-
      Si tu alarma de «falta luz» sonara a mediodía con el sol entrando, ¿qué habría fallado, el sensor o el umbral que pusiste?
    activacion:
      titulo: Un número, tres salones
      descripcion: |-
        En 3 minutos, piensa en tres lugares del colegio: el patio, tu salón y el laboratorio con cortinas. Escribe para cada uno un número entre 0 y 255 que te parezca «normal» de luz. ¿Te sirve el mismo umbral de «oscuro» en los tres?
      duracion_min: 5
    conexion:
      anterior: En la sesión 5 el micro:bit se expresó con luces y sonido en versiones.
      siguiente: En la sesión 7 buscas el error cuando el programa no hace lo esperado.

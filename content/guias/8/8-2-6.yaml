clave: 2-6
grado: 8
periodo: 2
sesion: 6
completo: true
titulo: Sensores con variables, umbrales y calibración
titulo_portada: |-
  Sensores con variables,
  umbrales
  y calibración
producto_final: |-
  Programa en MakeCode que lea el sensor de luz (o temperatura) y dispare 3 alertas distintas según umbrales calibrados (oscuro, normal, brillante; o frío, ambiente, caliente) usando variables nombradas para guardar las lecturas + bitácora de calibración con al menos 5 mediciones de baseline en distintos momentos o lugares + ajuste de los umbrales después de la calibración con justificación escrita de 3 líneas por umbral
apertura:
  saber_ancestral: |-
    En las comunidades del Pacífico colombiano, las curanderas y parteras tenían un instrumento de diagnóstico que las antecede por siglos: \textbf{su propia mano} convertida en termómetro. La mano de una curandera experimentada distinguía con precisión 3 estados del cuerpo: \emph{normal} (frente tibia, no más caliente que la propia mano), \emph{fiebre leve} (frente claramente más caliente que la mano, pero la persona habla con claridad), \emph{fiebre fuerte} (frente como brasa, respiración acelerada, mirada perdida). Esa diferenciación no era arbitraria: era el resultado de \textbf{calibración constante}. La curandera había puesto su mano en cientos de frentes a lo largo de su vida: niños sanos, niños enfermos, mujeres en parto, ancianos. Esa colección de toques producía un \textbf{baseline personal}: \emph{``así se siente lo normal en mi mano''}. A partir de ese baseline, podía decir con certeza cuándo había cruzado el umbral hacia la alarma. Esa práctica es ancestral pero rigurosa: \textbf{el umbral es marca personal calibrada con la experiencia, no número arbitrario}. La medicina basada en evidencia formaliza después lo que la curandera practicó siempre.
  origen: Relojes de sol campesinos en haciendas y veredas del Valle del Cauca
  saber_contemporaneo: |-
    Los sensores del micro:bit (sesión 4) devuelven \textbf{valores continuos}: el sensor de luz va de 0 (oscuridad total) a 255 (luz fuerte); la temperatura es un número en grados Celsius. La pregunta no es solo \emph{``¿hay luz?''}, sino \emph{``¿cuánta luz hay y a partir de qué nivel disparo la alerta?''}. La respuesta a esa pregunta se llama \textbf{umbral}: el valor que separa una zona de acción de otra. Los umbrales no son universales: dependen del contexto. Un umbral de \emph{``oscuro''} en un aula iluminada puede ser 150; el mismo umbral en una sala con cortinas cerradas podría ser 50. La regla profesional del oficio: \textbf{los umbrales se calibran, no se inventan}. Calibrar significa tomar varias lecturas en condiciones reales antes de decidir el valor del umbral. Las \textbf{variables} en MakeCode (categoría Variables → \emph{establecer variable}) permiten guardar valores leídos para compararlos después: \texttt{establecer nivel\_luz = nivel de luz}; \texttt{si nivel\_luz $<$ umbral\_oscuro entonces mostrar ícono}. Sin variables y sin calibración, el programa toma decisiones con datos sin contexto.
  pregunta_puente: |-
    ¿Qué sabía la curandera al construir su termómetro personal con años de práctica, que el programador novato olvida cuando inventa un umbral con un número al azar (\emph{``si luz menor a 100, alarma''})? ¿Y por qué calibrar antes de decidir el umbral ahorra horas de programa que reacciona en momentos equivocados?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} la diferencia entre eventos discretos (botón presionado) y valores continuos (nivel de luz, temperatura), y por qué los continuos exigen umbrales; (2) \textbf{aplicar} variables en MakeCode para guardar lecturas y compararlas con umbrales calibrados; (3) \textbf{analizar} una bitácora de calibración para detectar el rango normal y proponer umbrales razonables; (4) \textbf{evaluar} el programa probándolo en al menos 3 condiciones distintas y ajustando los umbrales si fallan.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 4 leíste sensores; en la sesión 5 los conectaste con actuadores. Hoy aprendes a \emph{calibrar} los sensores para que reaccionen al \textbf{contexto real}, no a números arbitrarios. La sesión 7 (depuración) y la 8 (alertas con lógica compuesta) construyen sobre los umbrales calibrados de hoy.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio de calibración a mano}: tu docente proyecta una lista de 5 niveles de luz medidos en el aula a distintas horas del día (mañana, recreo, tarde, etc.) y tú estimas dónde pondrías el umbral de \emph{``oscuro''} para una alarma de bibliotecario que avise cuando faltan luces.
  a_sistematizacion: |-
    Ya hiciste el ejercicio. Ahora vas a entender la \textbf{anatomía de variables, umbrales y calibración}: cómo declarar una variable, cómo construir una bitácora de calibración, cómo decidir el umbral con criterio, los 5 errores típicos de programadores que inventan umbrales sin calibrar.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: programar la lectura del sensor con variables, calibrar con 5 mediciones reales, decidir los 3 umbrales (oscuro/normal/brillante o frío/ambiente/caliente), ajustar y verificar.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: programa con 3 umbrales calibrados + bitácora de 5 mediciones + justificación de los umbrales. El criterio principal: que el programa funcione bien en las condiciones reales del aula, no solo en el simulador.
  a_evaluacion: |-
    Antes de cerrar, mira la calibración desde las cinco dimensiones humanas. Calibrar con mediciones reales es respeto por el oficio; inventar umbrales sin medir es atajo que produce alarmas falsas o silenciosas.
  a_triangulo: |-
    Y para terminar, tres voces sobre el ajuste al contexto. Dussel sobre los sistemas que se ajustan al usuario o le imponen un estándar ajeno, Marco Aurelio sobre la disciplina de calibrar antes de decidir, Floridi sobre los sistemas contextuales como ética del oficio digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Ejercicio de calibración a mano} (15 min · individual). Tu docente proyecta o entrega esta lista de mediciones simuladas del sensor de luz en el aula a distintas horas: \emph{``7:00 = 120; 9:30 = 180; 12:00 = 210; 14:00 = 195; 17:00 = 65''}. Para una alarma de \emph{``faltan luces''} que se active solo cuando el aula está realmente oscura, decide: ¿qué valor pondrías como umbral?, ¿por qué?, ¿qué pasaría con cada uno de los 5 momentos del día si pones umbral 100?, ¿y si pones umbral 150? Anota tu decisión justificada.
  checks:
  - Analicé las 5 mediciones del aula.
  - Decidí un umbral con justificación.
  - Verifiqué cómo afectaría a cada momento del día.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Calibración a mano». \textbf{Formato:} tabla con las 5 mediciones + 2 umbrales probados (100 y 150) + decisión final con justificación de 2 líneas. \textbf{Sabes que terminaste cuando} ves que el umbral no es número al azar: es decisión con consecuencias.
sistematizacion:
  intro: |-
    El ejercicio te enseñó por qué el umbral importa. Ahora necesitas la \textbf{anatomía técnica}: cómo se programa con variables, cómo se construye una bitácora de calibración, cómo se decide el umbral.
  pilares:
  - |-
    Las \textbf{variables} en MakeCode (categoría Variables) tienen 2 bloques principales: (1) \texttt{establecer (nombre) a (valor)}: asigna un valor a una variable. Ej. \texttt{establecer nivel\_luz a nivel de luz}. (2) \texttt{cambiar (nombre) por (valor)}: incrementa o decrementa. Las variables deben tener \textbf{nombres descriptivos} (no \emph{x, y}, sino \emph{nivel\_luz, temperatura\_aula, umbral\_oscuro}). Eso hace el código legible.
  - |-
    Una \textbf{bitácora de calibración} tiene 4 columnas: (a) \textbf{Momento}: cuándo se hizo la medición (hora, condición del aula). (b) \textbf{Lectura}: valor exacto que dio el sensor. (c) \textbf{Condición real}: ¿el aula estaba oscura, iluminada, etc.? (d) \textbf{Observación}: notas (la cortina estaba abierta, había sol directo, etc.). 5 mediciones mínimo dan suficiente baseline para decidir umbrales.
  - |-
    El método para \textbf{decidir umbrales} con la bitácora: (a) ordena las lecturas de menor a mayor. (b) identifica el rango \emph{normal} (la zona donde se concentran la mayoría). (c) el umbral inferior va por debajo del menor valor normal; el superior por encima del mayor valor normal. Ej. si tus lecturas son 65, 120, 180, 195, 210, el rango normal es 120-210; los umbrales podrían ser \emph{oscuro: $<$100}, \emph{brillante: $>$220}, normal en medio.
  - |-
    Algoritmo: (1) leer sensor 5 veces en condiciones distintas. (2) llenar bitácora. (3) identificar rango normal. (4) decidir umbrales. (5) programar variables y comparaciones. (6) probar en condiciones reales. (7) si el programa reacciona en momentos equivocados, ajustar umbral. (8) documentar el ajuste.
  anatomia:
    titulo: Anatomía de variables y umbrales
    body: |-
      \textbf{Variable:} establecer (nombre) a (valor). \\[1mm] \textbf{Nombre:} descriptivo, no x/y. \\[1mm] \textbf{Bitácora:} momento + lectura + condición + observación. \\[1mm] \textbf{Umbral inferior:} por debajo del rango normal. \\[1mm] \textbf{Umbral superior:} por encima del rango normal.
  errores_comunes: |-
    (1) \textbf{Umbral inventado sin calibrar}: produce alarmas en momentos equivocados. (2) \textbf{Variables con nombres x, y, z}: hace el código ilegible. (3) \textbf{Bitácora con 1-2 mediciones}: insuficiente para decidir umbral. (4) \textbf{Umbrales muy cercanos al rango normal}: produce falsos positivos constantes. (5) \textbf{No ajustar después de pruebas}: cuando el umbral falla en la realidad, hay que cambiarlo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Variables y umbrales». \textbf{Formato:} (a) los 2 bloques de variables; (b) plantilla de bitácora de calibración; (c) los 5 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} sabes cómo declarar una variable y cómo decidir un umbral.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- Programa con 3 umbrales calibrados} (40 min · individual). Hora de aplicar. Calibras con 5 mediciones reales, defines 3 umbrales y programas el micro:bit para que reaccione con 3 alertas distintas según el nivel del sensor.
  pilares:
  - |-
    Tu trabajo se construye en 5 pasos: (1) elegir el sensor (luz o temperatura). (2) hacer 5 mediciones reales en condiciones distintas del aula (cortinas abiertas, recreo, mañana, tarde, cubriendo el micro:bit). (3) llenar la bitácora. (4) decidir los 3 umbrales (zona inferior, normal, superior). (5) programar con variables y 3 ramas de if-else.
  - |-
    Sigue el patrón \textbf{``calibrar primero, programar después''}: el programa final tarda 5 minutos en escribirse cuando los umbrales ya están decididos. Lo que toma tiempo es \textbf{la calibración}: las 5 mediciones reales en condiciones distintas. Esa inversión inicial evita debugging interminable después.
  - |-
    Las 3 alertas pueden ser visuales (íconos distintos: luna para oscuro, sol para brillante, equis para normal) o sonoras (notas graves/medias/agudas). La regla: las 3 deben ser distinguibles a primera vista o primer oído. Si las 3 alertas se parecen, el usuario no podrá interpretar qué pasa.
  - |-
    Algoritmo: (1) elegir sensor. (2) calibrar con 5 mediciones. (3) llenar bitácora. (4) decidir umbrales. (5) programar variables. (6) escribir if-else con 3 ramas. (7) asignar alerta distintiva a cada rama. (8) probar en condiciones reales. (9) ajustar si falla.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 5 mediciones reales hechas en condiciones distintas. \\[1mm] \checkbox Bitácora completa con las 4 columnas. \\[1mm] \checkbox 3 umbrales decididos con justificación. \\[1mm] \checkbox Variables con nombres descriptivos. \\[1mm] \checkbox Programa con 3 ramas if-else funcionales. \\[1mm] \checkbox 3 alertas distinguibles entre sí. \\[1mm] \checkbox Probado en al menos 3 condiciones reales. \\[1mm] \checkbox Ajuste documentado si fue necesario.
  plantilla_guion: |-
    \textbf{Sensor.} \textit{Luz o temperatura.} \\[1mm] \textbf{Bitácora.} \textit{5 mediciones + observaciones.} \\[1mm] \textbf{Umbrales.} \textit{Inferior, normal, superior con justificación.} \\[1mm] \textbf{Variables.} \textit{Nombres descriptivos.} \\[1mm] \textbf{Programa.} \textit{If-else con 3 ramas + 3 alertas.} \\[1mm] \textbf{Pruebas y ajustes.} \textit{Lo que funcionó y lo que se cambió.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- Programa calibrado». \textbf{Formato:} (a) bitácora completa; (b) umbrales decididos con justificación; (c) referencia al código MakeCode; (d) resultados de pruebas y ajustes. \textbf{Sabes que terminaste cuando} el programa responde correctamente en al menos 3 condiciones reales distintas.
  producto_titulo: Programa con 3 umbrales calibrados + bitácora + justificación
  criterios:
  - 5 mediciones reales en condiciones distintas
  - Variables con nombres descriptivos
  - 3 umbrales decididos con justificación
  - 3 alertas distinguibles
  - Probado en condiciones reales
  - Ajuste documentado si fue necesario
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un sistema que se ajusta al contexto del usuario es liberador; uno que impone su umbral universal es opresor.
    aplicacion: |-
      Un umbral copiado de internet (\emph{``luz menor a 100 = oscuro''}) impone una norma universal que no respeta el contexto. Tu aula de Cartago no tiene la misma luminosidad que un aula de Bogotá ni la misma que un aula de Quibdó. Calibrar es el acto de \textbf{respetar el contexto del usuario}. La filosofía de la liberación pide esa adaptación: el sistema se ajusta al lugar, no el lugar al sistema.
    pregunta_espejo: |-
      ¿Mis umbrales reflejan el contexto real del aula, o son números copiados que ignoran el lugar?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Calibrar antes de decidir es virtud; inventar umbrales sin medir es vanidad disfrazada de seguridad.
    aplicacion: |-
      Es tentador escribir \texttt{umbral = 100} sin haber medido nada. La disciplina estoica recomienda lo opuesto: \emph{mide antes de decidir}. La curandera no inventaba marcas en su mano: las construía con años de toques. Tú no puedes esperar años, pero 5 mediciones reales toman 10 minutos y sostienen un programa profesional.
    pregunta_espejo: |-
      ¿Mis umbrales se basan en mediciones reales, o son números que sonaban bien?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los sistemas contextuales son la nueva ética del oficio digital frente a los sistemas que asumen un usuario universal.
    aplicacion: |-
      En la era de la información, los sistemas suelen asumir un usuario universal (\emph{``típica frecuencia de uso''}, \emph{``típica condición ambiente''}). La ética digital exige sistemas contextuales: que se ajusten al usuario y al lugar concretos. Tu programa calibrado es ejemplo de ese principio: \textbf{el sistema se ajusta al contexto, no al revés}. Esa práctica se entrena hoy con un sensor y mañana se aplica a sistemas que sirven a comunidades reales.
    pregunta_espejo: |-
      ¿Mi programa se ajusta al contexto del aula, o asume un \emph{aula universal} que no existe?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu programa calibrado y la bitácora. En la sesión 7 vas a aprender a \textbf{depurar errores} cuando el programa no hace lo que esperas: el oficio del relojero aplicado al código. Los umbrales calibrados de hoy te servirán como referencia cuando el programa falle por razones distintas a los umbrales.
web:
  conceptos_clave:
    - termino: Variable
      definicion: |-
        Espacio nombrado en memoria donde guardas un valor para usarlo después. En MakeCode se crea desde la categoría Variables.
      ejemplo: |-
        establecer nivel_luz a (nivel de luz). Luego puedes comparar nivel_luz con un umbral en un if.
      emoji: "📦"
    - termino: Umbral
      definicion: |-
        Valor que separa dos zonas de acción del programa. Si la lectura está por encima o por debajo, el sistema reacciona distinto.
      ejemplo: |-
        umbral_oscuro = 100. Si nivel_luz menor a 100, mostrar luna; sino, mostrar sol.
      emoji: "📏"
    - termino: Calibración
      definicion: |-
        Proceso de tomar mediciones reales antes de fijar un umbral. Garantiza que el programa reacciona al contexto, no a un número inventado.
      ejemplo: |-
        Antes de fijar umbral_oscuro, mides la luz del aula en 5 momentos del día y decides el valor según el rango observado.
      emoji: "🎯"
    - termino: Bitácora de calibración
      definicion: |-
        Tabla con 4 columnas (momento, lectura, condición real, observación) que respalda la decisión del umbral con datos.
      ejemplo: |-
        Fila 1, 7 a. m., lectura 120, aula con cortinas abiertas, día nublado. Cinco filas como esa dan baseline.
      emoji: "📓"
    - termino: Nombre descriptivo
      definicion: |-
        Identificador de variable que dice qué guarda (nivel_luz, umbral_oscuro), no letras sueltas (x, y, z). Hace el código legible.
      ejemplo: |-
        En lugar de a = nivel de luz, escribir nivel_luz = nivel de luz. Cualquier lector entiende sin explicación.
      emoji: "🏷️"
  quiz:
    titulo: ¿Dominas variables, umbrales y calibración?
    instrucciones: 5 preguntas para verificar que decides umbrales con calibración, no con números inventados.
    preguntas:
      - enunciado: Tienes 5 lecturas de luz en el aula a distintas horas (65, 120, 180, 195, 210). ¿Cuál umbral de "oscuro" tiene más sentido?
        opciones:
          - 50
          - 200
          - 100
          - 220
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. 100 queda justo debajo del menor valor normal (120) y por encima del único valor oscuro (65). Separa bien las zonas.
        feedback_incorrecto: |-
          Con esas lecturas, 100 es la mejor opción: queda debajo del rango normal (120-210) y solo activa la alerta cuando la luz baja claramente.
      - enunciado: ¿Por qué se recomienda usar nombres como nivel_luz en lugar de x para las variables?
        opciones:
          - Porque hace el código legible para quien lo lea después
          - Porque x está reservada por MakeCode
          - Porque ahorra memoria
          - Porque corre más rápido
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Los nombres descriptivos son la diferencia entre código profesional y código que solo entiende quien lo escribió.
        feedback_incorrecto: |-
          La razón es la legibilidad. x no dice nada; nivel_luz dice qué guarda. El código se lee más veces de las que se escribe.
      - enunciado: Inventas el umbral sin medir nada y el programa reacciona en momentos equivocados. ¿Qué paso saltaste?
        opciones:
          - Compilar
          - Guardar el archivo
          - Conectar el cable USB
          - Calibración
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Sin calibración, los umbrales son números al azar. La calibración con 5 mediciones reales evita ese error.
        feedback_incorrecto: |-
          Saltaste la calibración. Los umbrales se decantan a partir de mediciones reales, no se inventan.
      - enunciado: ¿Cuántas mediciones mínimas recomienda la guía para una bitácora de calibración útil?
        opciones:
          - "1"
          - "5"
          - "2"
          - "100"
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. 5 mediciones en condiciones distintas dan baseline suficiente sin ser carga excesiva.
        feedback_incorrecto: |-
          Son 5 mediciones mínimas. Menos no da baseline; muchas más son carga sin necesidad para el aula.
      - enunciado: Tu programa tiene 3 umbrales (oscuro, normal, brillante). ¿Qué decisión es señal de programa profesional?
        opciones:
          - Usar 3 alertas claramente distinguibles
          - Usar las 3 mismas alertas para distinguir
          - Mostrar siempre el mismo ícono
          - No mostrar nada
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Si las 3 alertas no se distinguen, el usuario no sabe qué zona está activa. La distinción es parte del diseño.
        feedback_incorrecto: |-
          Las 3 alertas deben distinguirse a primera vista u oído. Si todas son iguales, los umbrales pierden sentido.
  resumen: |-
    Como el reloj de sol del campesino: calibrar al lugar y a la estación. Aprendes a usar variables, definir umbrales con criterio y calibrar sensores al ambiente real.
  subtema: Sensores · Variables · Umbrales · Calibración
  pre_lectura:
    por_que_importa: |-
      Saber calibrar es lo que distingue un sensor confiable de uno que da falsas alarmas. Te servirá en cualquier proyecto futuro: huertas inteligentes, alarmas, automatización, IoT.
    pregunta_detonante: |-
      ¿Qué del reloj de sol del campesino — su disciplina de calibrar al lugar y la estación — podemos llevar a los sensores que programamos?
    activacion:
      titulo: El sensor mal calibrado
      descripcion: |-
        En 5 minutos: piensa en un dispositivo del entorno (alarma, sensor de movimiento de luces, detector) que dé falsas alarmas o no responde cuando debe. ¿Qué umbral está mal calibrado?
      duracion_min: 5
    conexion:
      anterior: En la sesión 15 aprendiste actuadores y respuestas multi-actuador.
      siguiente: En la sesión 17 depurarás lógica de control con casos esperados, contrarios y límites.
  post_lectura:
    reflexion: |-
      Calibrar es disciplina de adaptar al territorio. ¿En qué otros ámbitos de tu vida (estudio, deporte, alimentación) sería útil "calibrar" en lugar de aplicar reglas genéricas?
    transferencia: |-
      Esta semana: en MakeCode programa un sensor con umbral inicial, prueba en 3 ambientes distintos (casa, colegio, exterior) y documenta cómo ajustaste el umbral en cada uno.
    cierre: |-
      El reloj de sol y el sensor digital comparten el mismo principio: la tecnología útil se calibra al lugar. La universalidad genérica es enemiga de la utilidad real.
  cinco_dimensiones:
    personal: |-
      Aprendiste que calibrar no es paso opcional — es lo que separa dato útil de ruido. Habilidad transferible a cualquier herramienta de la vida.
    emocional: |-
      Resististe la tentación de "ya está, está midiendo, sigamos". Entendiste que medir bien exige paciencia previa.
    ciudadana: |-
      Diseñar tecnología calibrada al territorio respeta a las comunidades que la usan. Es soberanía técnica práctica.
    local: |-
      Heredaste el oficio del relojero de sol: cada herramienta se hace para un lugar específico, no para un genérico ideal.
    intergeneracional: |-
      El reloj de sol del abuelo y el sensor digital comparten la lógica del lugar. La técnica que sirve es la que se calibra.

clave: 2-7
grado: 8
periodo: 2
sesion: 7
completo: true
titulo: Depuración --- buscar el error como el relojero busca el tic-tac
titulo_portada: |-
  Depuración ---
  buscar el error
  como el relojero
producto_final: |-
  Programa en MakeCode con 3 bugs intencionales (entregados por el docente o creados con un compañero) corregidos uno a uno + bitácora de depuración profesional con 3 columnas por cada bug (síntoma observado, hipótesis del problema, prueba que confirma o descarta) + descripción final de 5 líneas sobre cuál bug fue el más difícil y por qué + 1 técnica de depuración aprendida con su nombre
apertura:
  saber_ancestral: |-
    En el centro histórico de Cartago, en la carrera 5 cerca de la galería, hubo durante décadas un \textbf{taller de relojería} donde un señor mayor de gafas gruesas atendía las piezas que ningún otro mecánico se atrevía a reparar: relojes de pared antiguos heredados de los abuelos, relojes de cuerda traídos de Suiza, despertadores de hojalata de los años 60. El relojero tenía un método que cualquier aprendiz de cualquier oficio podría reconocer como sabiduría profesional: \textbf{nunca tocaba dos piezas al mismo tiempo}. Cuando un reloj llegaba averiado, primero \textbf{escuchaba}: ¿el tic-tac sonaba bien o cojeaba? ¿había un engranaje que rozaba? ¿la cuerda estaba forzada? Después \textbf{formulaba una hipótesis} (\emph{``creo que es el escape''}, decía). Después \textbf{ajustaba una sola pieza}, no varias. Después \textbf{escuchaba de nuevo}: si el tic-tac se corrigió, había encontrado el error; si no, volvía a la pieza original y formulaba otra hipótesis. \textbf{Una hipótesis, una prueba, un resultado}: ese era el método silencioso del relojero, y es exactamente el método profesional de la depuración digital moderna.
  origen: Oficio del mecánico de pueblo en el Valle del Cauca
  saber_contemporaneo: |-
    En programación, un \textbf{bug} (error de software) es una pieza del programa que no funciona como se esperaba: una variable mal calculada, un if-else con condición invertida, una pausa olvidada, un bucle infinito, una variable que se sobrescribe sin querer. La \textbf{depuración} (debugging) es el proceso de encontrar y corregir bugs. La regla profesional famosa, atribuida a Brian Kernighan: \textbf{``escribir código es la mitad del oficio; depurar es la otra mitad, y a menudo más difícil que escribir''}. El método profesional de depuración tiene 4 pasos: (1) \textbf{Reproducir} el bug consistentemente (saber qué entrada lo provoca). (2) \textbf{Formular hipótesis} sobre dónde está el error. (3) \textbf{Hacer una sola prueba} (cambiar UN cosa y ver qué pasa). (4) \textbf{Confirmar o descartar} la hipótesis. Las \textbf{técnicas} más comunes son: \emph{print debugging} (insertar \emph{mostrar variable} para ver qué valor tiene en cada paso), \emph{aislar el problema} (comentar partes del código para encontrar la sección que falla), \emph{usar el simulador} (probar valores extremos).
  pregunta_puente: |-
    ¿Qué sabía el relojero al cambiar una sola pieza a la vez, que el programador novato olvida cuando toca 5 líneas de código simultáneamente y luego no sabe cuál arregló el problema? ¿Y por qué \emph{print debugging} es la técnica más vieja y más eficaz del oficio?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los síntomas observables de un bug (qué se esperaba, qué pasó, en qué condiciones); (2) \textbf{analizar} el código generando hipótesis posibles sobre dónde está el error; (3) \textbf{aplicar} el método de \emph{una hipótesis, una prueba, un resultado} para encontrar el bug sin tocar otras partes del código; (4) \textbf{evaluar} tu propio proceso de depuración nombrando al menos 1 técnica aprendida y reflexionando sobre cuál bug fue el más difícil.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 4-6 aprendiste a programar con sensores, actuadores y umbrales. Hoy aprendes a \emph{reparar} código cuando no hace lo que esperas. Sin habilidad de depuración, cualquier programa que crezca un poco se convierte en problema sin salida.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio del relojero}: tu docente proyecta un programa MakeCode con 1 bug evidente (\emph{``debería mostrar el ícono triste pero muestra el feliz''}). Sin tocar el código todavía, anota tus 3 hipótesis posibles sobre dónde está el error.
  a_sistematizacion: |-
    Ya tienes hipótesis. Ahora vas a entender la \textbf{anatomía profesional de la depuración}: los 4 pasos del método, las técnicas más comunes, los 5 errores típicos del depurador novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: tomas un programa con 3 bugs intencionales (el docente lo entrega o lo arman entre compañeros intercambiando código con errores plantados) y los corriges uno a uno con bitácora profesional.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 3 bugs corregidos + bitácora con 3 columnas por bug + reflexión sobre el más difícil + nombre de 1 técnica aprendida. El criterio principal: que el proceso de depuración esté documentado lo suficientemente bien para que un compañero pueda reproducirlo.
  a_evaluacion: |-
    Antes de cerrar, mira la depuración desde las cinco dimensiones humanas. Documentar el proceso es respeto por quien herede el código; cambiar todo sin pensar es desprecio por el oficio.
  a_triangulo: |-
    Y para terminar, tres voces sobre el oficio del error. Dussel sobre los bugs que afectan a quienes confiaron en el sistema, Marco Aurelio sobre la disciplina de una hipótesis a la vez, Floridi sobre la depuración como ética profesional contemporánea.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Ejercicio del relojero} (15 min · individual). Tu docente proyecta o entrega un programa MakeCode con 1 bug: \emph{``debería mostrar ícono triste cuando la temperatura es menor a 18 grados, pero muestra ícono feliz''}. Sin tocar el código todavía, mira el bloque if-else y anota 3 hipótesis posibles: (1) ¿la condición está invertida (mayor en lugar de menor)?, (2) ¿el ícono está cambiado de rama?, (3) ¿la variable de temperatura está mal leída? Ordena tus hipótesis de la más probable a la menos probable.
  checks:
  - Anoté 3 hipótesis distintas sobre el bug.
  - Las ordené por probabilidad.
  - No toqué el código todavía.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Hipótesis del bug». \textbf{Formato:} 3 hipótesis numeradas + orden de probabilidad. \textbf{Sabes que terminaste cuando} tienes el plan de qué probar primero.
sistematizacion:
  intro: |-
    Tus hipótesis son el primer paso del método. Ahora necesitas la \textbf{anatomía profesional} de los 4 pasos de depuración, las técnicas usadas en la industria y los errores que delatan al depurador novato.
  pilares:
  - |-
    Los \textbf{4 pasos del método profesional} se descomponen así: (1) \textbf{Reproducir}: identifica exactamente qué entrada produce el bug. ¿Pasa siempre o solo a veces?, ¿con qué valores? Sin reproducir, no se puede depurar. (2) \textbf{Hipótesis}: formula 2-3 explicaciones posibles ordenadas por probabilidad. Lo más probable primero. (3) \textbf{Una prueba}: cambia UNA sola cosa para verificar UNA hipótesis. Si cambias varias, no sabrás cuál arregló el problema (o cuál lo empeoró). (4) \textbf{Confirmar o descartar}: si la hipótesis era correcta, el bug se corrigió. Si no, vuelve al código original y prueba la siguiente.
  - |-
    Las \textbf{3 técnicas más comunes} de depuración son: (a) \textbf{Print debugging}: insertar \emph{mostrar variable} o \emph{mostrar cadena} en puntos del código para ver qué valor tiene cada variable en cada momento. Es la técnica más vieja y la más eficaz. (b) \textbf{Aislar el problema}: comentar (deshabilitar) partes del código para encontrar la sección que falla. En MakeCode se hace clic derecho sobre un bloque y \emph{deshabilitar}. (c) \textbf{Probar valores extremos}: usar entradas extremas (0, número máximo, vacío) para forzar el bug a manifestarse.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué cambio me dará información sobre el bug?}. Si haces un cambio que no te da información (mover bloques al azar, cambiar varios valores juntos), no estás depurando: estás esperando que el bug se solucione por azar. La phronesis del depurador consiste en \textbf{convertir cada prueba en aprendizaje}, no en intento ciego.
  - |-
    Algoritmo: (1) reproducir el bug. (2) listar 2-3 hipótesis. (3) elegir la más probable. (4) hacer una prueba específica (insertar print, deshabilitar bloque, cambiar 1 valor). (5) observar resultado. (6) si confirmó hipótesis, corregir; si no, volver al código original y probar siguiente hipótesis. (7) documentar todo en bitácora.
  anatomia:
    titulo: Anatomía de la depuración
    body: |-
      \textbf{Reproducir:} con qué entrada falla. \\[1mm] \textbf{Hipótesis:} 2-3 explicaciones ordenadas. \\[1mm] \textbf{Una prueba:} cambiar una sola cosa. \\[1mm] \textbf{Confirmar/descartar:} interpretar resultado. \\[1mm] \textbf{Técnicas:} print debugging / aislar / valores extremos.
  errores_comunes: |-
    (1) \textbf{Cambiar varias cosas a la vez}: imposible saber cuál arregló o empeoró. (2) \textbf{No reproducir el bug}: si el bug pasa solo a veces y no sabes cuándo, no puedes depurarlo. (3) \textbf{Asumir sin probar}: \emph{``debe ser la variable''} sin verificarlo. (4) \textbf{No documentar el proceso}: olvidas qué probaste y caes en bucle de pruebas repetidas. (5) \textbf{Frustrarse y romper más}: agregar cambios al azar cuando el bug no cede empeora la situación.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía de la depuración». \textbf{Formato:} (a) los 4 pasos del método; (b) las 3 técnicas con su uso; (c) los 5 errores comunes con marca. \textbf{Sabes que terminaste cuando} entiendes por qué \emph{una hipótesis, una prueba} es el método y no \emph{tocar varias cosas a la vez}.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA + EVALÚA --- 3 bugs corregidos con bitácora profesional} (40 min · individual o parejas). Hora de aplicar. El docente entrega un programa con 3 bugs intencionales (o intercambian códigos entre compañeros con errores plantados), y tú los corriges uno a uno documentando todo el proceso.
  pilares:
  - |-
    Los 3 bugs sugeridos para esta sesión (el docente puede usar estos o crear otros): (1) \textbf{Bug de condición invertida}: el if dice \texttt{si temperatura $>$ 18} cuando debería ser \texttt{$<$ 18}. (2) \textbf{Bug de variable no inicializada}: una variable se usa sin haber sido establecida primero. (3) \textbf{Bug de pausa olvidada}: una animación va tan rápido que solo se ve el último frame porque falta el bloque pausa. Cada uno se corrige con método: reproducir, hipotetizar, probar.
  - |-
    Sigue el patrón \textbf{``bitácora completa por cada bug''}: la bitácora tiene 3 columnas: (a) \textbf{Síntoma}: qué hace mal el programa (\emph{``cuando hace 30 grados muestra frío''}). (b) \textbf{Hipótesis}: dónde crees que está el error (\emph{``creo que la condición está invertida''}). (c) \textbf{Prueba y resultado}: qué probaste y qué pasó (\emph{``cambié $>$ por $<$ y ahora muestra correctamente; hipótesis confirmada''}). Si una hipótesis se descarta, anótalo y pasa a la siguiente.
  - |-
    Las técnicas para aplicar: (1) usa \emph{mostrar variable} para verificar valores intermedios. (2) deshabilita bloques temporalmente para aislar el problema. (3) prueba con valores extremos (temperatura muy alta, muy baja). Documenta cuál técnica usaste con cada bug en la reflexión final.
  - |-
    Algoritmo: (1) recibir programa con bugs. (2) probar el programa para identificar qué falla. (3) para el bug 1: hipótesis → prueba → confirmar/descartar → corregir. (4) repetir para bug 2 y 3. (5) reflexión final: ¿cuál bug fue más difícil?, ¿qué técnica usaste más?, ¿qué aprendiste sobre tu propio proceso?
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 3 bugs identificados con su síntoma. \\[1mm] \checkbox Para cada bug, al menos 1 hipótesis formulada. \\[1mm] \checkbox Cada prueba cambia UNA sola cosa. \\[1mm] \checkbox Bitácora con 3 columnas por bug (síntoma, hipótesis, prueba/resultado). \\[1mm] \checkbox 3 bugs corregidos. \\[1mm] \checkbox Reflexión final con bug más difícil + técnica aprendida.
  plantilla_guion: |-
    \textbf{Bug 1.} \textit{Síntoma + Hipótesis + Prueba/Resultado.} \\[1mm] \textbf{Bug 2.} \textit{Síntoma + Hipótesis + Prueba/Resultado.} \\[1mm] \textbf{Bug 3.} \textit{Síntoma + Hipótesis + Prueba/Resultado.} \\[1mm] \textbf{Reflexión.} \textit{Cuál fue más difícil + por qué + técnica usada.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA + EVALÚA).} Título: «Actividad 3 --- 3 bugs corregidos». \textbf{Formato:} (a) bitácora 3 filas × 3 columnas; (b) reflexión final de 5 líneas; (c) técnica de depuración aprendida con su nombre. \textbf{Sabes que terminaste cuando} podrías delegar la depuración de un programa similar a un compañero con tu bitácora como guía.
  producto_titulo: 3 bugs corregidos + bitácora 3 columnas + reflexión + 1 técnica
  criterios:
  - 3 bugs identificados y corregidos
  - Bitácora con 3 columnas por bug
  - Una hipótesis por prueba (no múltiples cambios)
  - Reflexión sobre el bug más difícil
  - 1 técnica de depuración nombrada
  - Programa final funcional
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un bug ignorado afecta a quien usa el sistema; documentar la depuración es respeto por la cadena de usuarios futuros.
    aplicacion: |-
      Cuando depuras un código sin documentar, solo tú entiendes qué pasó. Si otro programador hereda el código (o tú mismo lo vuelves a abrir en 6 meses), no podrá entender por qué se hicieron ciertas decisiones. La filosofía de la liberación pide documentar el proceso de depuración: la bitácora no es trámite, es \textbf{respeto por la cadena de personas que tocarán el código después}.
    pregunta_espejo: |-
      ¿Mi bitácora permitiría que otro programador entienda qué hice y por qué, o solo yo sé qué pasó?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Una hipótesis a la vez es disciplina; tocar varias piezas simultáneas es vanidad disfrazada de eficiencia.
    aplicacion: |-
      Es tentador cambiar varias cosas al mismo tiempo para \emph{``arreglar más rápido''}. La sabiduría estoica recomienda lo opuesto: \emph{una hipótesis, una prueba, un resultado}. Esa paciencia parece lenta pero es la única que produce aprendizaje. El depurador que cambia varias cosas a la vez puede arreglar el bug por azar, pero no aprende qué pasó.
    pregunta_espejo: |-
      ¿Estoy probando una hipótesis a la vez, o cambiando varias cosas esperando que algo funcione?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La depuración rigurosa es la nueva ética profesional del oficio digital en la era del software ubicuo.
    aplicacion: |-
      En la era de la información, el software opera en todas partes: bancos, hospitales, transporte. Un bug en cualquiera de esos sistemas puede tener consecuencias graves para personas reales. La ética digital exige depuración rigurosa: no \emph{``parece funcionar''}, sino \emph{``probado con método, documentado, corregido''}. Tu hoja de hoy te entrena en esa práctica profesional que rige toda industria del siglo XXI.
    pregunta_espejo: |-
      ¿Mi depuración tiene el rigor que tendría si este código fuera para un sistema crítico, o me conformo con que parezca funcionar?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu bitácora de los 3 bugs corregidos. En la sesión 8 vas a aprender a construir \textbf{alertas con lógica compuesta} usando múltiples sensores combinados con AND/OR/NOT. La depuración de hoy es la garantía: cuando tu lógica compuesta falle, sabrás cómo encontrar el error con método.
web:
  conceptos_clave:
    - termino: Bug
      definicion: |-
        Pieza del programa que no funciona como se esperaba. Puede ser una condición invertida, una variable mal inicializada, una pausa olvidada.
      ejemplo: |-
        El programa muestra ícono feliz cuando debería mostrar triste. Síntoma claro de un if con condición invertida.
      emoji: "🐛"
      categoria: Diagnóstico
    - termino: Reproducir el bug
      definicion: |-
        Primer paso de la depuración. Identificar exactamente qué entrada produce el error, para poder investigarlo con método.
      ejemplo: |-
        El error aparece solo cuando la temperatura está por debajo de 18. Con esa pista, ya sabes dónde mirar.
      emoji: "🔁"
    - termino: Hipótesis
      definicion: |-
        Explicación posible del origen del bug, formulada antes de tocar el código. Se ordena por probabilidad y se prueba una a una.
      ejemplo: |-
        Hipótesis 1, la condición está invertida. Hipótesis 2, los íconos están cambiados de rama. Pruebas la más probable primero.
      emoji: "💡"
      categoria: Resolución
    - termino: Una hipótesis una prueba
      definicion: |-
        Regla de oro del oficio. Cambiar UNA sola cosa por prueba. Si cambias varias, no sabrás cuál arregló (o empeoró) el problema.
      ejemplo: |-
        Cambias el operador menor por mayor. Compilas. Pruebas. Si funciona, hipótesis confirmada. Sin tocar nada más.
      emoji: "🎯"
    - termino: Print debugging
      definicion: |-
        Técnica de insertar mostrar variable en puntos del código para ver qué valor tiene cada variable en cada momento. La más vieja y eficaz.
      ejemplo: |-
        Insertas mostrar nivel_luz justo antes del if. Si imprime 200 cuando esperabas 50, sabes que el sensor no está leyendo bien.
      emoji: "🖨️"
  quiz:
    titulo: ¿Sabes depurar como el relojero?
    instrucciones: 5 preguntas para verificar que aplicas el método de una hipótesis a la vez.
    preguntas:
      - enunciado: Cambias 5 cosas a la vez y el programa empieza a funcionar. ¿Qué problema hay?
        opciones:
          - Ninguno, ya funciona
          - No sabes cuál de los 5 cambios arregló el bug
          - El programa va más rápido
          - El programa va más lento
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Sin saber qué cambio arregló el problema, no hay aprendizaje. El próximo bug te tomará el mismo tiempo.
        feedback_incorrecto: |-
          El problema es que no sabes cuál de los 5 cambios fue el bueno. La depuración profesional exige una hipótesis a la vez.
      - enunciado: ¿Cuál es el primer paso del método profesional de depuración?
        opciones:
          - Reproducir el bug
          - Cambiar el código
          - Reiniciar el computador
          - Eliminar el programa
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Sin reproducir el bug, no puedes investigarlo. Identificar qué entrada lo dispara es el inicio.
        feedback_incorrecto: |-
          Primero se reproduce. Sin saber qué entrada genera el bug, cualquier cambio es a ciegas.
      - enunciado: La técnica de insertar mostrar variable en puntos del código se llama...
        opciones:
          - Compilación
          - Aislar el problema
          - Print debugging
          - Búsqueda binaria
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Print debugging. Es la técnica más vieja y la más eficaz en cualquier lenguaje.
        feedback_incorrecto: |-
          Se llama print debugging. Aunque suene básica, es la herramienta más usada por programadores profesionales.
      - enunciado: ¿Por qué se documenta el proceso de depuración en una bitácora?
        opciones:
          - Por costumbre
          - Porque lo exige MakeCode
          - Para hacer más larga la tarea
          - Para no repetir pruebas y para que otro pueda heredar el código
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. La bitácora evita pruebas repetidas y permite que un compañero entienda qué pasó sin reabrir la investigación.
        feedback_incorrecto: |-
          La razón es práctica: la bitácora evita bucles de pruebas repetidas y permite que otro hereden el código con contexto.
      - enunciado: Tu primera hipótesis se descarta tras probarla. ¿Qué sigue?
        opciones:
          - Cambiar de proyecto
          - Hacer 5 cambios a la vez
          - Borrar el programa
          - Volver al código original y probar la siguiente hipótesis
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Vuelves al código original (sin acumular cambios) y pruebas la siguiente hipótesis ordenada por probabilidad.
        feedback_incorrecto: |-
          Vuelves al código original y pruebas la siguiente hipótesis. Acumular cambios o cambiar de proyecto no es depurar.
  resumen: |-
    Como el ojo del mecánico de pueblo: buscar dónde, probar, ajustar, probar de nuevo. Aprendes método sistemático de depuración con casos esperados, contrarios y de límite.
  subtema: Depuración · Hipótesis · Pruebas · Bitácora
  pre_lectura:
    por_que_importa: |-
      Saber depurar es lo que distingue un programador novato de uno profesional. En cualquier proyecto futuro (web, móvil, IoT) los bugs son inevitables — el método sistemático los encuentra.
    pregunta_detonante: |-
      ¿Qué del ojo del mecánico de pueblo — su método disciplinado de buscar la falla — podemos llevar a la depuración de código?
    activacion:
      titulo: El bug detective
      descripcion: |-
        En 5 minutos: en parejas recuerden una falla técnica reciente (app que falla, sensor que no responde, video que no carga). Formulen 3 hipótesis distintas de la causa.
      duracion_min: 5
    conexion:
      anterior: En la sesión 16 calibraste sensores y aprendiste sobre umbrales.
      siguiente: En la sesión 18 simularás un sistema de alerta ambiental completo.
  post_lectura:
    reflexion: |-
      La depuración disciplinada es habilidad transferible: encontrar la causa raíz se aplica a problemas técnicos, sociales, personales. ¿En qué situación de tu vida sería útil aplicar el método "hipótesis-prueba-corrección-re-test"?
    transferencia: |-
      Esta semana: cuando algo te falle (app, dispositivo, plan), aplica el método: 3 hipótesis distintas, prueba aislada, corrección mínima, verificación. Documenta el proceso.
    cierre: |-
      El ojo del mecánico y el debugger digital comparten método: paciencia disciplinada, no fuerza bruta. La sabiduría artesanal sobrevive en la depuración profesional.
  cinco_dimensiones:
    personal: |-
      Aprendiste un método transferible: hipótesis, prueba, corrección, verificación. Sirve para código, dispositivos, conflictos, decisiones.
    emocional: |-
      Resististe la tentación de la fuerza bruta — entendiste que la paciencia disciplinada es virtud, no debilidad.
    ciudadana: |-
      La capacidad de depurar problemas sistemáticamente es habilidad democrática: pensar antes de actuar es ciudadanía adulta.
    local: "Heredaste el ojo del mecánico de pueblo: oír primero, tocar después, abrir solo cuando es necesario."
    intergeneracional: |-
      El método artesanal de diagnóstico y el debugger moderno comparten lógica. Lo que cambia es el medio, no la paciencia.

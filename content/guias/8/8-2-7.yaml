clave: 2-7
grado: 8
periodo: 2
sesion: 7
completo: true
duracion_min: 90
titulo: Depuración --- una hipótesis, una prueba
titulo_portada: |-
  Buscar el error
  de a una puntada
producto_final: |-
  Tres errores corregidos en un programa de MakeCode que te entrega tu docente o tu pareja, con una bitácora de depuración de tres columnas por cada uno: síntoma, hipótesis y prueba con su resultado. Y una nota final de cinco líneas: cuál error fue el más difícil, por qué, y qué técnica usaste para encontrarlo.
apertura:
  origen: Talleres de bordado de Cartago (Valle del Cauca) · la prenda que pasa por ocho manos
  fuente: |-
    Chica García, A. (2019, 17 de agosto). \emph{Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas}. Radio Nacional de Colombia.
  saber_ancestral: |-
    En Cartago, una prenda bordada no la hace una sola persona. Pasa por unas ocho artesanas y más de ocho horas de trabajo antes de llevar el nombre de un taller (Chica García, 2019). Cada una recibe la pieza de la anterior y la revisa antes de seguir: si una puntada quedó floja o un hilo cambió de tono, se ve en esa mesa y se corrige antes de que la prenda avance. Nadie deshace todo el bordado para encontrar una puntada mal hecha. Se busca por partes: esta flor, este tallo, esta franja. Los ornamentos que vistió el papa en su visita a Colombia salieron de esas mesas. Un programa con errores se revisa igual. No se cambia todo a la vez: se mira una parte, se prueba, se descarta o se confirma, y se pasa a la siguiente. La \textbf{cara de exclusión}: el nombre del taller lo sostienen ocho mujeres que rara vez aparecen en él; la reputación se acumula en el taller, no en quien borda. Hoy vas a buscar errores como se revisa una prenda: de a una parte, con una hipótesis y una prueba cada vez.
  saber_contemporaneo: |-
    Un \textbf{error} de programa, en inglés \textit{bug}, es una pieza que no hace lo que esperabas: una condición al revés, una variable que nunca se llenó, una pausa que falta. \textbf{Depurar} es encontrarlo y corregirlo. Quien programa pasa más tiempo buscando errores que escribiendo bloques nuevos, y por eso el método importa. Tiene cuatro pasos. (1) \textbf{Reproducir}: saber qué entrada provoca el error, siempre, no a veces. (2) \textbf{Hipótesis}: dos o tres explicaciones posibles, la más probable primero. (3) \textbf{Una prueba}: cambias una sola cosa y miras qué pasa. (4) \textbf{Confirmar o descartar}: si se arregló, era eso; si no, vuelves al programa original y pruebas la siguiente. Tres técnicas ayudan: mostrar el valor de una variable en pantalla, deshabilitar un bloque para aislar la parte que falla, y probar con valores extremos.
  pregunta_puente: |-
    La bordadora revisa esta flor, no toda la prenda. Cuando tu micro:bit muestre una cara feliz con 10 grados, ¿por dónde empiezas a mirar: por todo el programa o por el bloque que compara la temperatura?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} tres hipótesis sobre un error sin tocar el código; (2) \textbf{aplicar} el método de una prueba a la vez con bitácora; (3) \textbf{evaluar} cuál técnica de depuración sirvió con cada error; (4) \textbf{explicar} por qué cambiar varias cosas a la vez no es depurar.
puentes:
  a_ruta: |-
    En la sesión 6 calibraste umbrales y viste que un programa puede fallar por un número mal puesto. Hoy aprendes a encontrar el error con método, sin adivinar. En la sesión 8 vas a combinar sensores con lógica compuesta, y la depuración de hoy será tu red.
  a_escuta: |-
    Antes de corregir nada, vas a mirar un programa con un error y escribir tres hipótesis. Es la mirada de la bordadora sobre la prenda: primero ver, después tocar.
  a_sistematizacion: |-
    Ya tienes tres hipótesis ordenadas. Ahora aprendes las tres técnicas y, con tu pareja, corriges el primer error con una prueba a la vez.
  a_praxis: |-
    Ya corregiste un error con bitácora. Quedan dos, y en cada uno vas a anotar qué técnica te sirvió.
  a_producto: |-
    Lo que entregas hoy: tres errores corregidos, la bitácora de tres columnas por cada uno y la nota sobre el más difícil. La prueba de calidad: alguien lee tu bitácora y sabe qué probaste, en qué orden y qué pasó.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un error encontrado con método se puede contar; uno que se arregló solo no enseña nada.
  a_triangulo: |-
    Para terminar, tres ideas sobre mirar antes de suponer, contadas con palabras de esta guía: Dussel sobre el silencio del que escucha, Marco Aurelio sobre cambiar de parecer, y la Onlife Initiative sobre lo que rechazamos porque no entendemos.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tres hipótesis sin tocar el código} (15 min · individual). (1) Tu docente proyecta un programa de MakeCode con un error: debería mostrar una cara triste cuando la temperatura baja de 18 grados, pero muestra la cara feliz. (2) Sin tocar nada, mira el bloque «si… si no» y copia en el cuaderno la condición tal como está. (3) Escribe tres hipótesis: ¿la comparación está al revés?, ¿los íconos están en la rama equivocada?, ¿la variable de temperatura nunca se llena? (4) Ordénalas de la más probable a la menos probable y escribe por qué pusiste esa primero. (5) Escribe qué prueba harías para la primera hipótesis, y solo para esa.
  checks:
  - Copié la condición del programa tal como está.
  - Escribí tres hipótesis y las ordené con una razón.
  - Escribí una sola prueba para la primera hipótesis.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Tres hipótesis sin tocar el código». \textbf{Formato:} la condición copiada, las tres hipótesis numeradas con la razón del orden, y la prueba para la primera. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tu prueba cambia una sola cosa y puedes decir qué esperas ver si la hipótesis es cierta.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- El primer error, con bitácora} (30 min · parejas). (1) Tu docente entrega un programa con tres errores, o intercambias con tu pareja un programa donde cada uno sembró tres. (2) Con tu pareja, pruébenlo en el simulador hasta que el primer error aparezca siempre con la misma entrada: eso es reproducirlo. (3) Dibujen la bitácora de tres columnas: síntoma, hipótesis, prueba y resultado. (4) Escriban el síntoma y dos hipótesis; prueben solo la primera cambiando una sola cosa. (5) Si se arregló, anoten «confirmada»; si no, vuelvan al programa original, anoten «descartada» y prueben la segunda.
  pilares:
  - |-
    \textbf{Reproducir antes que nada.} Un error que aparece «a veces» no se puede buscar. Prueba con la misma entrada, 10 grados, botón A, hasta que falle siempre. Cuando sabes qué lo provoca, ya tienes la mitad.
  - |-
    \textbf{Las tres técnicas.} (1) Mostrar la variable: pon «mostrar número (temperatura)» antes del «si» y mira qué valor llega. (2) Aislar: clic derecho sobre un bloque y «deshabilitar»; si el error desaparece, estaba ahí. (3) Valores extremos: prueba con 0 y con 40 grados en el simulador; los extremos muestran lo que el valor normal esconde.
  - |-
    \textbf{Una cosa a la vez.} Si cambias la comparación y el ícono en la misma prueba y se arregla, no sabes cuál de los dos era. Y si se daña más, tampoco. Cada prueba cambia una sola cosa, y la bitácora dice cuál.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Reproducir con la misma entrada. (2) Escribir el síntoma. (3) Dos hipótesis, la más probable primero. (4) Una prueba, un cambio. (5) Confirmar o volver atrás y probar la siguiente. (6) Anotar todo.
  anatomia:
    titulo: La depuración, en una mirada
    body: |-
      \textbf{Síntoma:} qué hace mal y con qué entrada. \\[1mm] \textbf{Hipótesis:} dónde crees que está el error. \\[1mm] \textbf{Prueba:} el único cambio que haces. \\[1mm] \textbf{Resultado:} confirmada o descartada. \\[1mm] \textbf{Técnica:} mostrar variable, aislar o valores extremos.
  errores_comunes: |-
    (1) \textbf{Cambiar varias cosas a la vez}: no sabes cuál arregló ni cuál dañó. (2) \textbf{No reproducir}: buscas un error que no sabes cuándo aparece. (3) \textbf{Suponer sin probar}: «debe ser la variable» y cambias sin mirar. (4) \textbf{Sin bitácora}: repites la misma prueba tres veces sin darte cuenta. (5) \textbf{Mover bloques al azar}: cuando el error no cede, el programa termina peor.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- El primer error, con bitácora». \textbf{Formato:} la bitácora de tres columnas con la entrada que reproduce el error, el síntoma, las hipótesis y cada prueba con su resultado. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} el primer error está corregido y la bitácora dice qué cambiaste en cada prueba y qué pasó.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Dos errores más y la técnica que sirvió} (25 min · individual). (1) Reproduce el segundo error y llena su bitácora: síntoma, hipótesis, una prueba, resultado. (2) Haz lo mismo con el tercero. (3) Junto a cada error corregido, escribe qué técnica te sirvió: mostrar variable, aislar o valores extremos. (4) Escribe la nota final de cinco líneas: cuál error fue el más difícil y por qué. (5) Pásale tu bitácora a tu pareja y pídele que diga, sin verte el programa, en qué orden probaste.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) El programa con los tres errores corregidos, compartido con enlace o archivo .hex. (2) La bitácora de tres columnas por cada error. (3) La nota final sobre el más difícil y la técnica que usaste.
  - |-
    \textbf{Los tres errores típicos.} La comparación al revés: «mayor que» donde iba «menor que». La variable vacía: se usa antes de haberla llenado con «establecer». La pausa que falta: la animación corre tan rápido que solo se ve el último cuadro. Cada uno se ve con una técnica distinta.
  - |-
    \textbf{Descartar también es avanzar.} Una hipótesis descartada con una prueba limpia te deja con una menos. Anótala igual que la confirmada. La bordadora que revisó la flor y la encontró bien no perdió el tiempo: ya sabe que el problema está en otra parte.
  - |-
    \textbf{La prueba del que lee.} Tu bitácora sirve si otra persona sabe, sin ver el programa, qué probaste y en qué orden. Si tu pareja no puede reconstruirlo, faltó anotar el cambio o el resultado.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Cada error tiene su entrada que lo reproduce. \\[1mm] \checkbox Cada error tiene al menos una hipótesis escrita antes de probar. \\[1mm] \checkbox Cada prueba cambia una sola cosa. \\[1mm] \checkbox Bitácora de tres columnas por cada uno de los tres errores. \\[1mm] \checkbox Los tres errores corregidos y probados. \\[1mm] \checkbox Nota final con el error más difícil y la técnica que sirvió. \\[1mm] \checkbox Programa compartido con enlace o archivo .hex.
  plantilla_guion: |-
    \textbf{Síntoma.} \textit{Con … grados muestra …} \\[1mm] \textbf{Hipótesis 1.} \textit{Creo que …} \\[1mm] \textbf{Prueba.} \textit{Cambié solo …} \\[1mm] \textbf{Resultado.} \textit{Confirmada / descartada porque …} \\[1mm] \textbf{Técnica.} \textit{Mostrar variable / aislar / valores extremos.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Dos errores más y la técnica que sirvió». \textbf{Formato:} las bitácoras del segundo y el tercer error, la técnica junto a cada uno, y la nota final de cinco líneas. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} los tres errores están corregidos y tu pareja pudo decir en qué orden probaste solo con leer tu bitácora.
  producto_titulo: Tres errores corregidos + bitácora de tres columnas por error + nota sobre el más difícil y la técnica usada
  criterios:
  - Cada error tiene la entrada que lo reproduce y su síntoma escrito
  - Cada prueba de la bitácora cambia una sola cosa y tiene resultado
  - Los tres errores están corregidos y el programa funciona con las entradas de prueba
  - Junto a cada error está la técnica que sirvió
  - La nota final dice cuál fue el más difícil y por qué
  - El programa está compartido con enlace o archivo .hex
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.3
    idea: |-
      El respeto es el silencio de quien todo tiene que escuchar, porque todavía no sabe nada del otro.
    aplicacion: |-
      Antes de cambiar un bloque, el programa te está diciendo algo con su síntoma. Reproducir y escribir hipótesis es escuchar primero. Mover bloques al azar es hablar sin haber oído.
    pregunta_espejo: |-
      ¿Qué problema de esta semana intenté arreglar antes de entender qué pasaba?
  estoico:
    autor: Marco Aurelio · Meditaciones VIII, 16 (c. 175 d.C.)
    idea: |-
      Cambiar de parecer cuando alguien te corrige no te quita libertad: es parte de ella.
    aplicacion: |-
      Tu hipótesis favorita puede estar equivocada. La prueba que la descarta te está corrigiendo. Anotar «descartada» y pasar a la siguiente es lo que hace quien depura; insistir es lo que hace quien adivina.
    pregunta_espejo: |-
      ¿Cuál hipótesis me costó soltar hoy aunque la prueba la había descartado?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), Prefacio
    idea: |-
      Tememos y rechazamos aquello a lo que no logramos darle sentido.
    aplicacion: |-
      Un error que aparece «a veces» da miedo porque no tiene sentido todavía. Reproducirlo con la misma entrada le da sentido, y un error con sentido ya no asusta: se corrige.
    pregunta_espejo: |-
      ¿Qué cosa de la tecnología rechazo porque no la entiendo, y qué prueba me ayudaría a entenderla?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu bitácora de los tres errores. En la sesión 8 vas a construir alertas que combinan sensores con Y, O y NO. Las vas a probar con una tabla de ocho escenarios. Cuando una fila no coincida, vas a usar el método de hoy.
web:
  resumen: |-
    Depurar es encontrar un error con método, no con suerte: reproducir, una hipótesis, una prueba, confirmar o descartar. Hoy corriges tres errores con bitácora, como las bordadoras de Cartago revisan una prenda parte por parte antes de que avance.
  subtema: Lógica y micro:bit
  pre_lectura:
    por_que_importa: |-
      Todo programa falla en algún momento. La diferencia entre quien programa y quien adivina es cómo busca el error cuando aparece.
    pregunta_detonante: |-
      Tu micro:bit muestra una cara feliz con 10 grados. ¿Por dónde empiezas a mirar, por todo el programa o por el bloque que compara?
    activacion:
      titulo: La linterna que no prende
      descripcion: |-
        En 3 minutos, escribe tres razones por las que una linterna no prende: pila, bombillo, interruptor. ¿Cuál revisarías primero y por qué? ¿Qué prueba harías solo para esa?
      duracion_min: 5
    conexion:
      anterior: En la sesión 6 calibraste umbrales con cinco mediciones reales.
      siguiente: En la sesión 8 combinas sensores con lógica compuesta y pruebas ocho escenarios.

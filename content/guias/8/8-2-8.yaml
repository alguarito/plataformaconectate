grado: 8
periodo: 2
sesion: 8
completo: true
titulo: Alertas con lógica compuesta --- validación con escenarios
titulo_portada: |-
  Alertas
  con lógica compuesta ---
  validación con escenarios
producto_final: |-
  Sistema de alerta en MakeCode que combine 2-3 sensores con operadores AND/OR/NOT para producir al menos 3 niveles de alerta distintos (alarma máxima, alerta moderada, advertencia leve) + tabla de 8 escenarios de verificación que muestre cada combinación de entrada y la salida esperada vs. la salida real + bitácora corta de los ajustes hechos cuando alguna combinación no funcionaba como esperabas
apertura:
  saber_ancestral: |-
    En los puertos del Pacífico colombiano (Buenaventura, Tumaco, Bahía Solano) existía una figura silenciosa que sostenía la seguridad del comercio marino: \textbf{el centinela del puerto}. Sentado en la torre de vigilancia, con un catalejo viejo y un cuaderno cuadriculado, el centinela tenía la responsabilidad de \textbf{combinar varias observaciones simultáneas} para decidir qué nivel de alerta dar a la población costera. No era un trabajo de una sola variable: \textbf{exigía lógica compuesta de oficio profesional}. El centinela conocía sus reglas: \emph{``Si veo barco grande Y bandera roja, alerta máxima''} (las dos cosas: AND). \emph{``Si veo niebla O lluvia fuerte, alerta moderada''} (cualquiera de las dos: OR). \emph{``Si NO hay viento favorable, alerta de retraso''} (la ausencia de algo: NOT). Esas combinaciones no eran arbitrarias: la práctica del oficio había decantado cuáles condiciones, juntas, justificaban cuál nivel de alerta. La sabiduría del centinela era doble: (1) \textbf{no dar alerta máxima por una sola señal sospechosa} (eso producía falsas alarmas y los marineros dejaban de creer). (2) \textbf{no esperar muchas señales para dar alerta moderada} (eso producía respuestas demasiado tardías). \textbf{La lógica compuesta vivía en la observación combinada}, mucho antes de que se llamara así en computación.
  origen: Lectura de señales naturales en el campo colombiano
  saber_contemporaneo: |-
    Un \textbf{sistema de alerta con lógica compuesta} combina las habilidades de las sesiones 1-7: leer sensores (S4-S6), aplicar umbrales calibrados (S6), combinar con AND/OR/NOT (S1-S2), depurar cuando falla (S7). La regla profesional: \textbf{los sistemas reales de alerta jamás dependen de una sola variable}. Una alarma de incendio combina sensor de humo Y sensor de temperatura alta (AND, para evitar falsos positivos por cocina); una alerta de robo combina detector de movimiento Y horario nocturno O ventana abierta (combinación de AND y OR); un sistema de riego inteligente activa el agua si humedad baja AND NOT está lloviendo AND horario permitido (combinación de las 3 lógicas). Para verificar que el sistema funciona, se construye una \textbf{tabla de escenarios}: cada fila representa una combinación de entradas, y se compara la salida esperada con la salida real. Con 3 sensores binarios, hay $2^3 = 8$ escenarios. Con 4, hay 16. La regla profesional: \textbf{ningún sistema de alerta se entrega sin haber sido probado en todos sus escenarios posibles}.
  pregunta_puente: |-
    ¿Qué sabía el centinela del puerto al combinar varias observaciones para decidir el nivel de alerta, que el programador novato olvida cuando hace un sistema de alarma con un solo sensor? ¿Y por qué probar 8 escenarios es la diferencia entre un sistema profesional y uno escolar?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué combinación de 2-3 sensores produce alertas significativas para un problema real; (2) \textbf{aplicar} bloques de MakeCode con AND, OR, NOT para combinar lecturas de sensores con umbrales; (3) \textbf{analizar} los $2^n$ escenarios posibles construyendo tabla de verificación; (4) \textbf{evaluar} el sistema corrigiendo aquellos escenarios donde la salida real no coincide con la esperada.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 1-7 aprendiste todas las piezas por separado. Hoy las \emph{integras} en un sistema completo. La sesión 9 (proyecto) y la 10 (sustentación) tomarán esta integración como base. Es la cima técnica del periodo 2.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio del centinela}: piensa en un problema real del colegio que necesite una alerta combinada (cerrar el aula al final del día, alertar cuando alguien entra a un lugar restringido, avisar si el aula está oscura Y hay alguien adentro) y anota qué sensores combinarías y con qué operadores.
  a_sistematizacion: |-
    Ya tienes la idea. Ahora vas a entender la \textbf{anatomía del sistema de alerta profesional}: 3 niveles de alerta, combinación con AND/OR/NOT, tabla de escenarios de verificación, los 5 errores típicos del sistema novato (falsa alarma, alarma silenciosa, escenarios no probados, operadores confundidos, salida única para todo).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: programas un sistema con 2-3 sensores que produzca 3 niveles de alerta combinando AND/OR/NOT, lo verificas con tabla de 8 escenarios, ajustas lo que falle, documentas la bitácora.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: sistema de alerta + tabla de 8 escenarios + bitácora de ajustes. El criterio principal: que el sistema funcione correctamente en todos los escenarios de la tabla, o que la bitácora explique honestamente cuáles aún fallan y por qué.
  a_evaluacion: |-
    Antes de cerrar, mira el sistema desde las cinco dimensiones humanas. Probar todos los escenarios es respeto por quienes confiarán en la alarma; declarar funcional sin probar es negligencia con personas reales.
  a_triangulo: |-
    Y para terminar, tres voces sobre los sistemas que protegen. Dussel sobre las alarmas que cuidan a las personas vulnerables, Marco Aurelio sobre la disciplina de probar todos los casos, Floridi sobre los sistemas de alerta como infraestructura ética digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Ejercicio del centinela} (15 min · individual). Piensa en un problema real del colegio que necesite alerta combinada. Ejemplos: (a) \textbf{Cerrar el aula al final del día}: alerta si \emph{hay personas adentro Y la hora es mayor a las 18:00}. (b) \textbf{Aula oscura ocupada}: alerta si \emph{luz baja Y movimiento detectado} (alguien quedó sin luz). (c) \textbf{Permiso de entrada al laboratorio}: solo si \emph{tarjeta válida AND NO es horario de clase Y NOT está cerrado por mantenimiento}. Elige uno y anota: ¿qué sensores usarías (luz, movimiento, botón)?, ¿qué operadores (AND, OR, NOT)?, ¿qué 3 niveles de alerta tendría (máxima, moderada, leve)?
  checks:
  - Elegí un problema real del colegio.
  - Identifiqué qué sensores usaría.
  - Definí 3 niveles de alerta.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Ejercicio del centinela». \textbf{Formato:} ficha con problema + sensores + operadores + 3 niveles de alerta. \textbf{Sabes que terminaste cuando} tienes claro qué combinación produce cada nivel.
sistematizacion:
  intro: |-
    Tu ficha del centinela define el problema. Ahora necesitas la \textbf{anatomía técnica}: cómo se programan los operadores compuestos en MakeCode, cómo se construye una tabla de escenarios, los errores típicos del sistema novato.
  pilares:
  - |-
    Los \textbf{bloques de lógica compuesta} en MakeCode (categoría Lógica) son: (1) \texttt{si A y B entonces}: bloque AND. Verdadero solo si ambas son verdaderas. (2) \texttt{si A o B entonces}: bloque OR. Verdadero si al menos una. (3) \texttt{no A}: bloque NOT. Invierte el valor. Se pueden anidar: \texttt{si (A y B) o (no C) entonces}. Los paréntesis se forman naturalmente con la estructura visual de los bloques.
  - |-
    La \textbf{tabla de escenarios} para 3 sensores binarios tiene $2^3 = 8$ filas con todas las combinaciones de Verdadero (V) y Falso (F). Cada fila tiene: (a) los valores de los 3 sensores. (b) la salida esperada según tu lógica. (c) la salida real al probar en el simulador. (d) ¿coinciden o no? Si una fila no coincide, hay un bug que se depura con el método de la sesión 7.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿hay alguna combinación que mi sistema no haya considerado?}. Los sistemas de alerta novatos cubren los casos obvios (\emph{``si pasa esto, alerta''}) y olvidan los casos extremos (\emph{``¿y si pasa solo una de las dos?''}, \emph{``¿y si no pasa ninguna?''}). La phronesis del oficio consiste en \textbf{construir la tabla completa antes de declarar el sistema funcional}.
  - |-
    Algoritmo: (1) definir entradas (2-3 sensores con sus umbrales). (2) definir salidas (3 niveles de alerta). (3) construir tabla de $2^n$ escenarios con salida esperada. (4) programar en MakeCode con if-else compuestos. (5) probar cada escenario en simulador y llenar tabla con salida real. (6) ajustar lo que no coincida (usando depuración de sesión 7). (7) documentar ajustes en bitácora.
  anatomia:
    titulo: Anatomía del sistema de alerta
    body: |-
      \textbf{Sensores:} 2-3 con umbrales calibrados. \\[1mm] \textbf{Operadores:} AND, OR, NOT. \\[1mm] \textbf{Niveles:} 3 alertas distintas. \\[1mm] \textbf{Tabla:} $2^n$ escenarios con esperado vs real. \\[1mm] \textbf{Verificación:} cada fila probada.
  errores_comunes: |-
    (1) \textbf{Falsa alarma}: el sistema alerta cuando no debe (operador demasiado permisivo, OR donde debía AND). (2) \textbf{Alarma silenciosa}: el sistema no alerta cuando debería (operador demasiado restrictivo, AND donde debía OR). (3) \textbf{Escenarios no probados}: declarar el sistema funcional sin verificar todas las combinaciones. (4) \textbf{Operadores confundidos}: usar AND donde se quería OR o viceversa. (5) \textbf{Salida única}: 3 condiciones distintas pero solo 1 mensaje de alerta; el usuario no sabe qué pasó.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía del sistema de alerta». \textbf{Formato:} (a) bloques de lógica compuesta con ejemplo; (b) plantilla de tabla de escenarios para 3 sensores; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} podrías construir una tabla de 8 escenarios para tu problema.
praxis:
  intro: |-
    \textbf{Actividad 3 · ANALIZA + EVALÚA --- Sistema completo + 8 escenarios verificados} (40 min · individual o parejas). Hora de aplicar. Programar el sistema de alerta de tu elección con 2-3 sensores, construir tabla de 8 escenarios y verificar cada uno en el simulador.
  pilares:
  - |-
    Tu sistema se construye en 5 pasos: (1) definir entradas (2-3 sensores con umbrales calibrados de la sesión 6). (2) escribir tabla de escenarios con salida esperada (antes de programar). (3) programar en MakeCode con if-else compuestos. (4) probar cada escenario en simulador y llenar salida real. (5) ajustar lo que no coincida.
  - |-
    Sigue el patrón \textbf{``tabla antes que código''}: la tabla de escenarios se construye antes de programar. Eso obliga a pensar la lógica antes de implementarla. Si construyes la tabla después, tiendes a confirmar lo que ya programaste, no a verificar la lógica.
  - |-
    Para sistemas con 3 sensores se obtienen 8 escenarios. La regla: cada fila debe tener una salida definida (alerta máxima, moderada, leve, o ninguna). Si alguna fila quedó sin salida en tu tabla original, tu sistema tiene grietas lógicas que hay que cerrar.
  - |-
    Algoritmo: (1) definir entradas. (2) construir tabla con salida esperada. (3) programar. (4) probar las 8 filas. (5) anotar salida real. (6) si alguna no coincide, depurar (sesión 7). (7) registrar ajustes en bitácora.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 2-3 sensores definidos con umbrales calibrados. \\[1mm] \checkbox Lógica con AND, OR, NOT combinados. \\[1mm] \checkbox 3 niveles de alerta distintos. \\[1mm] \checkbox Tabla de 8 escenarios construida ANTES de programar. \\[1mm] \checkbox Cada escenario probado en simulador. \\[1mm] \checkbox Salida real coincide con esperada (o se documenta lo que falta). \\[1mm] \checkbox Bitácora de ajustes hecha.
  plantilla_guion: |-
    \textbf{Problema.} \textit{Qué alerta resuelve.} \\[1mm] \textbf{Sensores.} \textit{2-3 con umbrales.} \\[1mm] \textbf{Operadores.} \textit{AND, OR, NOT combinados.} \\[1mm] \textbf{Niveles.} \textit{3 alertas distintas.} \\[1mm] \textbf{Tabla.} \textit{8 filas con esperado vs real.} \\[1mm] \textbf{Bitácora.} \textit{Ajustes hechos.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · ANALIZA + EVALÚA).} Título: «Actividad 3 --- Sistema de alerta». \textbf{Formato:} (a) descripción del problema + sensores + operadores; (b) tabla de 8 escenarios con esperado y real; (c) bitácora de ajustes; (d) referencia al código MakeCode. \textbf{Sabes que terminaste cuando} las 8 filas tienen salida coincidente, o se declaran las que aún no.
  producto_titulo: Sistema de alerta + tabla de 8 escenarios + bitácora de ajustes
  criterios:
  - Sistema con 2-3 sensores combinados
  - Lógica con AND, OR, NOT
  - 3 niveles de alerta distintos
  - Tabla de 8 escenarios construida antes
  - Cada escenario verificado en simulador
  - Bitácora de ajustes documentada
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Una alarma que protege a quien depende de ella es liberadora; una que falla en silencio es traición técnica.
    aplicacion: |-
      Los sistemas de alerta del mundo real protegen vidas: alarmas de incendio, sistemas de evacuación, detectores de fugas. La filosofía de la liberación pide construir esos sistemas con responsabilidad por las personas que dependerán de ellos. Tu sistema escolar de hoy te entrena en una práctica que mañana puede aplicarse a contextos con vidas reales en juego. La phronesis del oficio consiste en \textbf{construir alarmas como si la vida del usuario dependiera de ellas}, porque a veces literalmente lo hace.
    pregunta_espejo: |-
      Si mi sistema de alerta protegiera a alguien real, ¿confiaría en él tal como está, o falta verificación?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Probar todos los escenarios es disciplina; declarar funcional con pruebas parciales es soberbia.
    aplicacion: |-
      Es tentador probar 2-3 escenarios obvios y declarar el sistema listo. La sabiduría estoica recomienda lo opuesto: \emph{prueba los 8 escenarios completos}. Los bugs más graves suelen esconderse en escenarios extremos (todas las entradas falsas, una sola entrada verdadera). La disciplina de probar lo completo es virtud profesional.
    pregunta_espejo: |-
      ¿Estoy probando los 8 escenarios completos o me detuve en los obvios?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los sistemas de alerta confiables son la infraestructura ética del oficio digital en la era de los riesgos automatizados.
    aplicacion: |-
      En la era de la información, los sistemas de alerta automatizados sostienen muchas funciones críticas (transporte, salud, finanzas). Que esos sistemas sean confiables es responsabilidad ética del oficio digital. Tu hoja de hoy te entrena en esa práctica: construir sistemas de alerta verificados, documentados, transparentes. Esa disciplina escala desde el micro:bit escolar hasta sistemas industriales.
    pregunta_espejo: |-
      ¿Mi sistema podría ser revisado por un auditor con la tabla de escenarios sin necesidad de mi explicación?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu sistema de alerta y la tabla de 8 escenarios. En la sesión 9 vas a construir un \textbf{proyecto de monitoreo} usando el micro:bit como vigía nocturno de algún proceso real del colegio durante 3 días. La lógica compuesta de hoy es el motor; el proyecto de mañana le da contexto y propósito.
web:
  conceptos_clave:
    - termino: Lógica compuesta
      definicion: |-
        Combinación de 2 o más condiciones con AND, OR, NOT para tomar una decisión más fina que con una sola variable.
      ejemplo: |-
        Alarma de incendio = humo AND temperatura alta. Necesita las dos para evitar falsos positivos por cocina.
      emoji: "🧩"
      categoria: Diseño
    - termino: Niveles de alerta
      definicion: |-
        Diferenciar la respuesta en función de la gravedad. No todo es alarma máxima; hay advertencias leves, moderadas, críticas.
      ejemplo: |-
        Luz baja sola = advertencia. Luz baja Y ventana abierta = alerta moderada. Luz baja Y ventana abierta Y horario nocturno = alarma.
      emoji: "🚦"
    - termino: Tabla de escenarios
      definicion: |-
        Tabla con todas las combinaciones posibles de entradas y la salida esperada. Para n condiciones binarias hay 2^n filas.
      ejemplo: |-
        Con 3 sensores binarios hay 8 filas. Cada una contrasta salida esperada vs. salida real del programa.
      emoji: "📊"
    - termino: Falso positivo
      definicion: |-
        El sistema dispara alerta cuando no debía. Síntoma de umbrales muy permisivos o de lógica con OR donde debía ir AND.
      ejemplo: |-
        La alarma de incendio se activa cada vez que cocinan, aunque no haya fuego. Falso positivo por usar OR en lugar de AND.
      emoji: "⚠️"
    - termino: Validación por escenarios
      definicion: |-
        Pasar el sistema por las 2^n combinaciones de entrada y verificar que cada salida real coincida con la esperada.
      ejemplo: |-
        Recorres las 8 filas de la tabla. Si una sola falla, ajustas la lógica antes de entregar el sistema.
      emoji: "✅"
  quiz:
    titulo: ¿Diseñas alertas con lógica compuesta?
    instrucciones: 5 preguntas para verificar que combinas sensores y validas el sistema por escenarios.
    preguntas:
      - enunciado: ¿Cuántas combinaciones de entrada hay que probar con 3 sensores binarios?
        opciones:
          - "3"
          - "6"
          - "9"
          - "8"
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. 2^3 = 8 combinaciones. Validar todas es la diferencia entre un sistema profesional y uno escolar.
        feedback_incorrecto: |-
          Son 2^3 = 8 combinaciones. Cada sensor binario duplica los casos a probar.
      - enunciado: Quieres una alarma de incendio que evite activarse por la cocina. ¿Qué operador conecta humo y temperatura alta?
        opciones:
          - OR
          - NOT
          - AND
          - Ninguno
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. AND exige las dos cosas (humo Y temperatura alta), filtrando la cocina que solo tiene humo.
        feedback_incorrecto: |-
          Es AND. Necesitas las dos condiciones a la vez para evitar falsas alarmas por humo de cocina.
      - enunciado: Tu sistema de riego se activa también cuando llueve. ¿Qué operador estabas olvidando?
        opciones:
          - AND con humedad baja
          - NOT con "está lloviendo"
          - OR con horario
          - Ninguno, no se puede arreglar
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La condición correcta incluye NOT está lloviendo. Sin esa negación, el sistema riega en plena lluvia.
        feedback_incorrecto: |-
          Faltaba NOT está lloviendo. El sistema solo debe regar si la humedad es baja Y no está lloviendo.
      - enunciado: ¿Para qué sirve la tabla de escenarios?
        opciones:
          - Para verificar que cada combinación da la salida esperada
          - Para hacer más larga la entrega
          - Para conectar el micro:bit
          - Para escoger los colores del programa
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Recorres las 2^n filas y comparas salida esperada con salida real. Si alguna no coincide, ajustas la lógica.
        feedback_incorrecto: |-
          La tabla sirve para validar. Recorres las 2^n combinaciones y verificas que el programa da la salida esperada.
      - enunciado: Un falso positivo en una alarma de incendio significa que...
        opciones:
          - La alarma se activa cuando no hay incendio
          - La alarma no se activa cuando hay incendio
          - La alarma no funciona nunca
          - La alarma cambia de color
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Falso positivo es alerta cuando no debía. Suele venir de usar OR donde debía ir AND.
        feedback_incorrecto: |-
          Falso positivo es activarse cuando no debía. Es síntoma de lógica permisiva (OR donde debía ir AND) o umbrales mal calibrados.
  resumen: |-
    Como las señales de los pájaros antes de la lluvia: sistema de alerta natural. Aprendes a diseñar y simular un sistema de alerta ambiental con lectura, lógica compuesta y respuesta escalonada.
  subtema: Alertas · Lógica compuesta · Validación con escenarios
  pre_lectura:
    por_que_importa: |-
      Saber diseñar sistemas de alerta es habilidad de quien protege: alarmas de incendio, sensores de humedad para huertas, monitoreo de salud. La lógica de alerta salva proyectos, recursos y a veces vidas.
    pregunta_detonante: |-
      ¿Qué de las señales de los pájaros antes de la lluvia — el sistema de alerta natural — podemos llevar a un sistema digital?
    activacion:
      titulo: La falsa alarma del lobo
      descripcion: |-
        En 5 minutos: en parejas recuerden la fábula del pastor que gritaba lobo. ¿Qué pasa cuando un sistema de alerta da muchas falsas alarmas? ¿Cómo se evita técnicamente?
      duracion_min: 5
    conexion:
      anterior: En la sesión 17 aprendiste depuración sistemática con hipótesis y casos.
      siguiente: En la sesión 19 construirás el proyecto MILC integrador del periodo.
  post_lectura:
    reflexion: |-
      Un sistema de alerta confiable se construye con disciplina: combinaciones lógicas, filtros, validación. ¿Qué situación de tu colegio o casa se beneficiaría de un sistema de alerta diseñado con estos principios?
    transferencia: |-
      Esta semana: en MakeCode programa un sistema con 2 variables, lógica compuesta y filtro temporal. Valida con 3 escenarios (normal, alerta, falsa alarma) y documenta los resultados.
    cierre: |-
      Las señales de los pájaros y el sistema digital de alerta comparten un principio: la naturaleza no avisa siempre, pero cuando avisa, hay que escuchar. La precisión es ética del cuidado.
  cinco_dimensiones:
    personal: |-
      Aprendiste a combinar señales antes de actuar — habilidad cognitiva que aplica al código y a las decisiones humanas.
    emocional: |-
      Resististe la tentación de la alerta fácil — entendiste que la precisión cuida a quien recibe el mensaje.
    ciudadana: |-
      Diseñar alertas comunitarias con lógica compuesta (huerta, salón, casa) es ciudadanía técnica concreta.
    local: |-
      Heredaste la lectura del campesino: cruzar varias señales naturales antes de decidir cosecha o espera.
    intergeneracional: |-
      Las señales de los pájaros y los sistemas digitales de alerta comparten ética: precisión como cuidado.

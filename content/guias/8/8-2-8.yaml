clave: 2-8
grado: 8
periodo: 2
sesion: 8
completo: true
duracion_min: 90
titulo: Alertas con lógica compuesta --- la tabla antes que el código
titulo_portada: |-
  Alertas
  con lógica compuesta
producto_final: |-
  Un sistema de alerta en MakeCode que combine dos o tres sensores con Y, O y NO para producir tres niveles: alarma, alerta y aviso. Y una tabla de ocho escenarios, escrita antes de programar, con la salida esperada y la salida real de cada fila, más una nota de los ajustes que hiciste cuando alguna fila no coincidió.
apertura:
  origen: Pueblo nasa de Toribío (Cauca) · las golondrinas de la mañana y las de la tarde
  fuente: |-
    Ramos García, C., Tenorio, A. D. y Muñoz Yule, F. (2011). Ciclos naturales, ciclos culturales: percepción y conocimientos tradicionales de los nasas frente al cambio climático en Toribío, Cauca, Colombia. En A. Ulloa (Ed.), \emph{Perspectivas culturales del clima} (pp. 247--274). Universidad Nacional de Colombia.
  saber_ancestral: |-
    En la sesión 6 viste que los mayores nasa de Toribío leen la lluvia en el sapo, las hormigas y la luna. Hay una señal que no se lee sola. Las golondrinas, cuenta don Luis Ardo Ascué, dependen de la hora: si pasan en la mañana, hacia las 8, 9 o 10, es porque va a llover. Si pasan en la tarde, a partir de la una, anuncian otra cosa: problemas sociales, un caso inesperado, un conflicto (Ramos García, Tenorio y Muñoz Yule, 2011). La misma golondrina, con otra hora, es otra alerta. Eso es una condición compuesta: golondrinas \textbf{y} mañana significa lluvia; golondrinas \textbf{y} tarde significa problema. Un sensor solo no decide; decide junto con otro. La \textbf{cara de exclusión}: en Toribío las golondrinas de la tarde han anunciado el asesinato de líderes. El conflicto armado forma parte de lo que ese pueblo lee en el cielo. Los autores advierten que no se trata de probar si aciertan, sino de entender cómo un pueblo ve el mundo. Hoy vas a construir alertas que combinan dos o tres señales. Y una tabla que revise todas las combinaciones antes de dar el sistema por bueno.
  saber_contemporaneo: |-
    Una alerta real casi nunca depende de una sola variable. Una alarma de incendio combina humo \textbf{y} temperatura alta, para no sonar cada vez que alguien cocina. Un riego automático abre el agua si la tierra está seca \textbf{y no} está lloviendo. En MakeCode, la categoría Lógica trae tres bloques para eso: «A y B» es verdadero solo si las dos lo son; «A o B», si al menos una; «no A» invierte el valor. Se pueden anidar: «(A y B) o (no C)». Con tres sensores de sí o no hay $2^3 = 8$ combinaciones posibles. Para comprobar el sistema se escribe una \textbf{tabla de escenarios}: una fila por combinación, con la salida que esperas. Después se prueba cada fila en el simulador y se anota la salida real. Si una fila no coincide, hay un error, y se busca con el método de la sesión 7. Un sistema con filas sin probar es un sistema del que no sabes qué hace en esas filas.
  pregunta_puente: |-
    Golondrinas y mañana es lluvia; golondrinas y tarde es problema. Si tu alarma de «aula oscura ocupada» se dispara con luz baja, ¿qué segunda señal necesitas para que no suene en el salón vacío?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} un problema del colegio que necesite dos o tres señales combinadas; (2) \textbf{crear} la tabla de ocho escenarios con la salida esperada, antes de programar; (3) \textbf{evaluar} las ocho filas en el simulador y corregir las que no coincidan; (4) \textbf{explicar} la diferencia entre una alarma falsa y una alarma muda.
puentes:
  a_ruta: |-
    En la sesión 7 aprendiste a buscar el error con una hipótesis y una prueba. Hoy combinas los sensores de las sesiones 4 y 6 con Y, O y NO, y pruebas todas las combinaciones. En la sesión 9 vas a dejar el micro:bit midiendo durante tres jornadas.
  a_escuta: |-
    Antes de abrir MakeCode, vas a elegir un problema del colegio y decidir qué señales lo detectan. Es la golondrina y la hora: dos señales, no una.
  a_sistematizacion: |-
    Ya tienes el problema y las señales. Ahora aprendes los tres bloques de lógica y, con tu pareja, escribes la tabla de ocho escenarios con lápiz.
  a_praxis: |-
    Ya tienes la tabla con la salida esperada. Toca programar el sistema, probar las ocho filas y corregir las que no coincidan.
  a_producto: |-
    Lo que entregas hoy: el programa con tres niveles de alerta, la tabla de ocho escenarios con esperado y real, y la nota de ajustes. La prueba de calidad: las ocho filas tienen salida real anotada y ninguna quedó sin probar.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un sistema probado en ocho filas se puede defender; uno probado en las dos filas obvias, no.
  a_triangulo: |-
    Para terminar, tres ideas sobre lo que queda fuera de la tabla, contadas con palabras de esta guía: Dussel sobre lo que está más allá del sistema, Séneca sobre los miedos que no aprietan, y la Onlife Initiative sobre la sobrecarga de avisos.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El problema y sus señales} (15 min · individual). (1) Elige un problema del colegio que necesite más de una señal. Ejemplos: aula oscura con gente adentro, luz baja y movimiento; salón que quedó abierto de noche, botón de puerta y hora tardía; sala de sistemas caliente con gente, temperatura alta y movimiento. (2) Escribe qué dos o tres sensores del micro:bit usarías: luz, temperatura, movimiento, botón. (3) Escribe la condición en palabras con Y, O y NO, como «luz baja Y movimiento». (4) Define tres niveles: alarma, alerta y aviso, y qué combinación produce cada uno. (5) Escribe una combinación en la que tu sistema no debería hacer nada.
  checks:
  - Elegí un problema que necesita al menos dos señales.
  - Escribí la condición en palabras con Y, O o NO.
  - Tengo tres niveles y una combinación sin alerta.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- El problema y sus señales». \textbf{Formato:} el problema en una línea, los sensores, la condición en palabras con Y, O y NO, y los tres niveles con su combinación. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes decir qué combinación dispara cada nivel y cuál no dispara nada.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · CREA --- La tabla de ocho escenarios} (30 min · parejas). (1) Con tu pareja, dibujen una tabla de ocho filas y cinco columnas: sensor 1, sensor 2, sensor 3, salida esperada, salida real. (2) Llenen las tres primeras columnas con todas las combinaciones de V y F: VVV, VVF, VFV, VFF, FVV, FVF, FFV, FFF. (3) Para cada fila, escriban la salida esperada según su lógica: alarma, alerta, aviso o nada. (4) Revisen que ninguna fila quedó sin salida. (5) Marquen las dos filas que les parecen más difíciles de decidir y escriban por qué.
  pilares:
  - |-
    \textbf{Los tres bloques de lógica.} «A y B» solo es verdadero si las dos lo son: luz baja y movimiento. «A o B» es verdadero si al menos una: puerta abierta o ventana abierta. «No A» invierte: no está lloviendo. Se combinan anidando: «(luz baja y movimiento) o (no puerta cerrada)».
  - |-
    \textbf{Por qué ocho filas.} Cada sensor de sí o no tiene dos estados. Con dos sensores hay cuatro combinaciones; con tres, ocho; con cuatro, dieciséis. La tabla las escribe todas para que ninguna quede sin decidir.
  - |-
    \textbf{La tabla antes que el código.} Si escribes la tabla después de programar, tiendes a confirmar lo que ya hiciste. Si la escribes antes, piensas la lógica sin el programa encima, y el programa tiene que cumplirla.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Tres columnas de sensores con las ocho combinaciones. (2) Una salida esperada por fila. (3) Ninguna fila vacía. (4) Marcar las difíciles. (5) Programar. (6) Probar y anotar la salida real.
  anatomia:
    titulo: La lógica compuesta, en una mirada
    body: |-
      \textbf{A y B:} verdadero solo si las dos. \\[1mm] \textbf{A o B:} verdadero si al menos una. \\[1mm] \textbf{No A:} invierte el valor. \\[1mm] \textbf{Escenario:} una combinación de V y F de los sensores. \\[1mm] \textbf{Tabla:} ocho filas, esperado y real.
  errores_comunes: |-
    (1) \textbf{Alarma falsa}: suena cuando no debe, casi siempre por un O donde iba un Y. (2) \textbf{Alarma muda}: no suena cuando debería, casi siempre por un Y donde iba un O. (3) \textbf{Filas sin probar}: el sistema se declara listo con dos filas de ocho. (4) \textbf{Y y O confundidos}: la condición en palabras dice una cosa y el bloque otra. (5) \textbf{Una sola salida}: tres combinaciones distintas y el mismo ícono para todas.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · CREA).} \textbf{Título:} «Actividad 2 --- La tabla de ocho escenarios». \textbf{Formato:} la tabla de ocho filas y cinco columnas con las tres de sensores y la de salida esperada llenas, la de salida real vacía, y las dos filas difíciles marcadas. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las ocho filas tienen salida esperada y ninguna combinación de V y F se repite.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Programar y probar las ocho filas} (25 min · individual). (1) En MakeCode, dentro de «para siempre», guarda cada lectura en una variable y compárala con su umbral de la sesión 6. (2) Arma un «si… si no, si… si no» con tres ramas usando «y», «o» y «no» según tu tabla, y un ícono distinto por nivel. (3) En el simulador, produce cada una de las ocho combinaciones y anota la salida real en la quinta columna. (4) Si una fila no coincide, aplica el método de la sesión 7: hipótesis, un cambio, prueba. (5) Anota en una nota corta qué fila falló, qué cambiaste y por qué.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) El programa con tres niveles de alerta, compartido con enlace o archivo .hex. (2) La tabla de ocho escenarios con esperado y real. (3) La nota de ajustes, aunque diga «ninguna fila falló».
  - |-
    \textbf{Producir una fila en el simulador.} Para «luz baja», tapa el sensor o mueve el control de luz del simulador. Para «movimiento», agita o usa «al agitar». Para el botón, presiónalo. Cada fila se produce con las manos, no se supone.
  - |-
    \textbf{Falsa y muda.} Si suena en la fila FFF, es alarma falsa: revisa si pusiste O donde iba Y. Si no suena en la fila VVV, es alarma muda: revisa si pusiste Y donde iba O. La tabla te dice cuál de las dos tienes.
  - |-
    \textbf{Ninguna fila sin probar.} Las dos filas obvias, todo verdadero y todo falso, casi siempre funcionan. Los errores viven en las mixtas: VFV, FVF. Esas son las que la tabla te obliga a mirar.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Dos o tres sensores con sus umbrales de la sesión 6. \\[1mm] \checkbox Lógica con al menos dos de los tres bloques: y, o, no. \\[1mm] \checkbox Tres niveles con un ícono distinto cada uno. \\[1mm] \checkbox Tabla escrita antes de programar, con las ocho filas. \\[1mm] \checkbox Las ocho filas probadas en el simulador con salida real. \\[1mm] \checkbox Nota de ajustes con la fila que falló y el cambio. \\[1mm] \checkbox Programa compartido con enlace o archivo .hex.
  plantilla_guion: |-
    \textbf{Problema.} \textit{Quiero detectar … cuando …} \\[1mm] \textbf{Señales.} \textit{Sensor 1 …, sensor 2 …, sensor 3 …} \\[1mm] \textbf{Lógica.} \textit{Alarma si … y …; alerta si … o …; aviso si no …} \\[1mm] \textbf{Filas.} \textit{Las ocho, con esperado y real.} \\[1mm] \textbf{Ajuste.} \textit{La fila … falló porque …; cambié …}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Programar y probar las ocho filas». \textbf{Formato:} la tabla completa con la columna de salida real llena, y la nota de ajustes con la fila que falló, el cambio y el porqué. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las ocho filas tienen salida real, esperado y real coinciden, y anotaste qué cambiaste si alguna falló.
  producto_titulo: Sistema de alerta con tres niveles + tabla de ocho escenarios con esperado y real + nota de ajustes
  criterios:
  - El sistema combina dos o tres sensores con al menos dos de los bloques y, o, no
  - Produce tres niveles de alerta que se distinguen a simple vista
  - La tabla tiene las ocho combinaciones y ninguna fila quedó sin salida esperada
  - Las ocho filas fueron probadas en el simulador y tienen salida real
  - Esperado y real coinciden, o la nota dice qué se cambió para que coincidan
  - El programa está compartido con enlace o archivo .hex
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §5.3.1
    idea: |-
      Toda persona y todo pueblo están siempre más allá del sistema que intenta abarcarlos.
    aplicacion: |-
      Tu tabla de ocho filas es un sistema cerrado. El mundo no: alguien entra al salón con una linterna, y esa combinación no estaba. Probar las ocho filas es lo mínimo; saber que hay una novena es lo honesto.
    pregunta_espejo: |-
      ¿Qué situación real no cabe en ninguna fila de mi tabla?
  estoico:
    autor: Séneca · Cartas a Lucilio, 13 (c. 64 d.C.)
    idea: |-
      Son más las cosas que nos asustan que las que de verdad nos aprietan.
    aplicacion: |-
      Una alarma falsa asusta sin que pase nada. Un O donde iba un Y hace sonar el sistema por cualquier cosa, y la gente aprende a no hacerle caso. La tabla te muestra en qué fila estás asustando de más.
    pregunta_espejo: |-
      ¿Qué alerta me asustó esta semana por algo que al final no apretaba?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 2.3
    idea: |-
      La abundancia de información también produce sobrecarga, distracción y olvido.
    aplicacion: |-
      Un sistema que avisa por todo no informa: satura. Tres niveles bien separados dicen qué tan grave es; un solo ícono para todo obliga a adivinar. Diseñar la lógica es decidir cuándo callar.
    pregunta_espejo: |-
      ¿Cuál de mis alertas debería callarse para que las otras se oigan?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu sistema y la tabla de ocho escenarios. En la sesión 9 vas a dejar el micro:bit midiendo una variable del colegio durante tres jornadas, con bitácora. La lógica de hoy decide qué alerta muestra mientras tú no estás mirando.
web:
  resumen: |-
    Una alerta real combina señales con Y, O y NO, y se prueba en todas sus combinaciones antes de darla por buena. Hoy escribes la tabla de ocho escenarios antes de programar, como los mayores nasa que leen las golondrinas junto con la hora del día.
  subtema: Lógica y micro:bit
  pre_lectura:
    por_que_importa: |-
      Las alarmas que te rodean, del carro, de la casa, del celular, combinan señales. Saber por qué una suena de más y otra no suena es saber leer su lógica.
    pregunta_detonante: |-
      Golondrinas y mañana es lluvia; golondrinas y tarde es problema. ¿Qué segunda señal necesita tu alarma de «aula oscura ocupada» para no sonar en el salón vacío?
    activacion:
      titulo: Y, O y NO en tu casa
      descripcion: |-
        En 3 minutos, escribe una regla de tu casa que use Y, otra que use O y otra que use NO. Por ejemplo, «puedo salir si terminé la tarea Y no está lloviendo». ¿Qué pasa si cambias el Y por un O?
      duracion_min: 5
    conexion:
      anterior: En la sesión 7 buscaste errores con una hipótesis y una prueba.
      siguiente: En la sesión 9 el micro:bit mide durante tres jornadas con bitácora.

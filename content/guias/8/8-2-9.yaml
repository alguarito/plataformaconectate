clave: 2-9
grado: 8
periodo: 2
sesion: 9
completo: true
duracion_min: 90
titulo: Proyecto de monitoreo --- tres jornadas de datos
titulo_portada: |-
  Tres jornadas
  de datos
producto_final: |-
  Un micro:bit programado para medir una variable real del colegio, temperatura del aula, luz del salón, ruido del recreo o paso de personas, durante tres jornadas. Una bitácora con al menos treinta mediciones, diez por jornada, con hora, valor, observación y nivel de alerta. Y un análisis de un patrón, la cifra que lo respalda y una propuesta de acción que salga de los datos.
apertura:
  origen: Campesinado cafetero del Valle del Cauca y Caldas · las dos cosechas y el tiempo frío
  fuente: |-
    Parada Sanabria, P. J. (2017). Práctica social y cultural del campesinado cafetero en cuatro municipios de Caldas (Colombia). \emph{Revista Colombiana de Sociología, 40}(1 Supl.), 193--212. https://doi.org/10.15446/rcs.v40n1Supl.65913
  saber_ancestral: |-
    El café no se recoge todo el año igual. En Colombia hay dos cosechas: la principal, hacia el final del año, y una segunda más pequeña, la \textbf{mitaca} o traviesa, hacia mitad de año. El Valle del Cauca está en traviesa en el primer semestre mientras otras regiones recogen la grande. Entre una cosecha y otra, los campesinos de las veredas cafeteras de Caldas hablan del \textbf{tiempo frío}: los meses en que el cafetal no da fruto (Parada Sanabria, 2017). Ese tiempo no es tiempo perdido. Es la otra mitad del ciclo, la que hace posible la siguiente cosecha. Y solo se entiende mirando el año completo. Quien mira el cafetal una semana ve un cafetal sin grano; quien lo mira doce meses ve dos cosechas y un descanso. Un patrón necesita tiempo para aparecer. La \textbf{cara de exclusión}: el descanso es del cultivo, no del recolector; en tiempo frío no hay jornal, y quien vive de recoger café pasa esos meses buscando otro trabajo. Hoy vas a dejar el micro:bit midiendo durante tres jornadas, porque treinta datos en tres días muestran lo que cien datos en una hora esconden.
  saber_contemporaneo: |-
    \textbf{Monitorear} es medir la misma variable, con la misma frecuencia, durante un tiempo, y anotar cada valor. Un proyecto de monitoreo junta lo que hiciste en el periodo: leer sensores, calibrar umbrales, depurar y combinar señales. Tiene cuatro propiedades. (1) Una \textbf{variable bien definida}: la temperatura del aula, no «el clima». (2) Una \textbf{frecuencia constante}: cada hora, no cuando te acuerdes. (3) Un \textbf{registro que queda}: bitácora en papel o en una hoja de cálculo, con hora y observación. (4) Un \textbf{análisis al final}: releer las treinta filas buscando un patrón, una subida, un pico, una hora repetida. Con el micro:bit, el registro es sencillo: el programa muestra el valor y el nivel de alerta, y tú anotas a la hora acordada. Sin propósito, el monitoreo es acumular números. Con propósito, es buscar el dato que cambia una decisión.
  pregunta_puente: |-
    El caficultor solo ve el ciclo completo mirando el año, no una semana. Si midieras la temperatura del salón una sola vez a las 10, ¿qué te perderías de lo que pasa a la 1?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cinco variables del colegio que valga la pena medir y la decisión que saldría de cada una; (2) \textbf{crear} el programa y el plan de tres jornadas con frecuencia constante; (3) \textbf{evaluar} la primera jornada de mediciones y ajustar lo que falló; (4) \textbf{explicar} por qué treinta datos en tres días valen más que cien en una hora.
puentes:
  a_ruta: |-
    En la sesión 8 tu sistema decidió con lógica compuesta. Hoy lo dejas trabajando solo durante tres jornadas y anotas lo que ve. En la sesión 10 vas a sustentar el proyecto con los datos en la mano.
  a_escuta: |-
    Antes de programar, vas a listar cinco variables del colegio y preguntarte qué decisión saldría de cada una. Sin decisión no hay proyecto: hay una lista de números.
  a_sistematizacion: |-
    Ya elegiste la variable y la decisión. Ahora aprendes las cuatro propiedades del monitoreo y, con tu pareja, programas el micro:bit y armas el plan de tres jornadas.
  a_praxis: |-
    Ya tienes el programa y el plan. Toca la primera jornada: instalar, medir, anotar y ajustar lo que no funcionó. Las otras dos jornadas siguen esta semana.
  a_producto: |-
    Lo que entregas en la sesión 10: la bitácora de treinta mediciones, el patrón con su cifra y la propuesta. Lo que entregas hoy: el plan y las diez primeras filas. La prueba de calidad: cada fila tiene hora, valor y observación.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un proyecto con propósito escrito se puede sustentar; una lista de números sin pregunta, no.
  a_triangulo: |-
    Para terminar, tres ideas sobre el tiempo que hace falta para ver, contadas con palabras de esta guía: Dussel sobre perder tiempo para elegir lo importante, Marco Aurelio sobre mirar los ciclos, y Floridi sobre los patrones pequeños.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Cinco variables y una decisión} (15 min · individual). (1) Anota cinco variables del colegio que un micro:bit pueda medir durante varios días: temperatura del salón, luz a distintas horas, ruido de la cafetería, paso de personas frente al baño, humedad de una matera del huerto. (2) Para cada una, escribe qué sensor usarías. (3) Para cada una, escribe qué decisión podría salir del dato: abrir ventanas a cierta hora, mover una clase, regar menos. (4) Escribe cada cuánto la medirías. (5) Elige una y escribe en una línea por qué esa.
  checks:
  - Tengo cinco variables con su sensor.
  - Cada variable tiene una decisión que saldría del dato.
  - Elegí una y escribí por qué.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Cinco variables y una decisión». \textbf{Formato:} tabla de 5 filas y 4 columnas: variable, sensor, decisión posible, frecuencia; y la elegida con su porqué. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} la variable elegida tiene una decisión concreta que alguien del colegio podría tomar con el dato.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · CREA --- El programa y el plan de tres jornadas} (30 min · parejas). (1) Con tu pareja, en MakeCode, guarden la lectura del sensor elegido en una variable y muéstrenla con «mostrar número». (2) Agreguen las tres ramas con los umbrales de la sesión 6 y un ícono por nivel, para que el micro:bit muestre valor y alerta. (3) Escriban el plan: dónde va a estar el micro:bit, a qué horas se anota, quién anota cada día. (4) Dibujen la bitácora de cuatro columnas: hora, valor, observación del entorno y nivel de alerta. (5) Fijen la frecuencia: diez mediciones por jornada, a horas que se puedan cumplir.
  pilares:
  - |-
    \textbf{Una variable, una unidad.} Temperatura en grados Celsius; luz de 0 a 255; ruido en el nivel que da el micrófono; personas como conteo con «al agitar» o un botón. Si la unidad cambia entre filas, la bitácora no se puede comparar.
  - |-
    \textbf{Frecuencia que se cumpla.} Diez mediciones por jornada a horas fijas: al llegar, en cada cambio de clase, en el recreo, al salir. Mejor cada 45 minutos siempre, que cada 10 minutos el lunes y nada el martes.
  - |-
    \textbf{Tres jornadas, no una.} Día 1: instalar, medir y ajustar la calibración. Días 2 y 3: medir con la frecuencia fija. Un pico de calor a la 1 de la tarde solo es un patrón si aparece los tres días.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Programar valor y alerta. (2) Escribir el plan con lugar, horas y responsable. (3) Dibujar la bitácora. (4) Medir tres jornadas. (5) Releer las treinta filas. (6) Escribir el patrón, la cifra y la propuesta.
  anatomia:
    titulo: El monitoreo, en una mirada
    body: |-
      \textbf{Variable:} una sola, con su unidad. \\[1mm] \textbf{Frecuencia:} cada cuánto, siempre igual. \\[1mm] \textbf{Bitácora:} hora, valor, observación, alerta. \\[1mm] \textbf{Patrón:} lo que se repite en las treinta filas. \\[1mm] \textbf{Propuesta:} la decisión que sale del patrón.
  errores_comunes: |-
    (1) \textbf{Medir sin propósito}: treinta números y ninguna decisión. (2) \textbf{Frecuencia que cambia}: cada hora el lunes, dos veces el martes. (3) \textbf{Confiar en la memoria}: «después anoto» y la fila se pierde. (4) \textbf{No releer}: la bitácora llena y nadie la mira al final. (5) \textbf{Propuesta sin cifra}: «hace calor» en vez de «sube 3 grados entre 12 y 1».
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · CREA).} \textbf{Título:} «Actividad 2 --- El programa y el plan de tres jornadas». \textbf{Formato:} el plan con lugar, horas y responsable por día, y la bitácora de cuatro columnas dibujada con treinta filas vacías numeradas. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} el micro:bit muestra valor y alerta, y cualquiera de los dos puede anotar una fila sin preguntarle al otro.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- La primera jornada} (25 min · individual). (1) Instala el micro:bit en el lugar del plan y toma la primera medición: hora, valor, observación, alerta. (2) Toma dos mediciones más en la sesión, con unos minutos entre ellas, cambiando algo del entorno: abre la ventana, apaga la luz. (3) Revisa si el nivel de alerta que salió tiene sentido con lo que ves; si no, ajusta el umbral y anótalo. (4) Escribe en una línea qué falló del plan: la hora, el lugar, la batería, el acceso. (5) Completa las diez mediciones de la jornada 1 en el resto del día y trae las jornadas 2 y 3 a la sesión 10.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} Hoy: el plan y las primeras filas de la jornada 1. En la sesión 10: la bitácora con treinta filas, el análisis con patrón y cifra, y la propuesta de acción. El programa se comparte con enlace o archivo .hex.
  - |-
    \textbf{El análisis final tiene tres partes.} (1) El patrón en una frase: «la temperatura del salón sube entre las 12 y la 1 los tres días». (2) La cifra que lo respalda: «de 24 a 28 grados». (3) La propuesta: «abrir las ventanas a las 11:30». Sin cifra, el patrón es una impresión.
  - |-
    \textbf{Lo que el ojo no ve.} Tú estás en el salón todos los días y no notas que sube 4 grados. La bitácora sí. Ese es el hallazgo que vas a contar: lo que treinta filas mostraron y la costumbre escondía.
  - |-
    \textbf{Si algo falla, se anota.} Se acabó la batería, alguien movió el micro:bit, se perdieron dos horas. Eso va en la observación, no se disimula. Una bitácora con huecos declarados vale más que una completa inventada.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Variable elegida con una decisión escrita. \\[1mm] \checkbox Micro:bit programado con valor y nivel de alerta. \\[1mm] \checkbox Plan con lugar, horas y responsable por jornada. \\[1mm] \checkbox Bitácora de cuatro columnas con las filas de la jornada 1. \\[1mm] \checkbox Umbral revisado en la primera jornada, con ajuste anotado si hizo falta. \\[1mm] \checkbox Una línea sobre qué falló del plan. \\[1mm] \checkbox Programa compartido con enlace o archivo .hex.
  plantilla_guion: |-
    \textbf{Variable.} \textit{Mido … en …} \\[1mm] \textbf{Decisión.} \textit{Con el dato se podría …} \\[1mm] \textbf{Frecuencia.} \textit{Diez veces por jornada, a las …} \\[1mm] \textbf{Patrón.} \textit{Los tres días, … entre … y …} \\[1mm] \textbf{Cifra.} \textit{De … a …} \\[1mm] \textbf{Propuesta.} \textit{Por eso propongo …}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- La primera jornada». \textbf{Formato:} las tres primeras filas de la bitácora, el ajuste del umbral si lo hubo, y la línea sobre qué falló del plan. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las tres filas tienen hora, valor, observación y alerta, y el nivel de alerta coincide con lo que viste en el salón.
  producto_titulo: Micro:bit midiendo tres jornadas + bitácora de treinta mediciones + patrón con cifra + propuesta de acción
  criterios:
  - La variable tiene una unidad clara y una decisión escrita antes de medir
  - El micro:bit muestra el valor y el nivel de alerta con umbrales calibrados
  - El plan fija lugar, horas y responsable, y la frecuencia se cumple las tres jornadas
  - La bitácora tiene al menos treinta filas con hora, valor, observación y alerta
  - El análisis dice un patrón en una frase y la cifra que lo respalda
  - La propuesta de acción sale del patrón y alguien del colegio podría tomarla
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §5.9.4.1
    idea: |-
      Como los temas son infinitos y el tiempo corto, hay que saber perder tiempo para elegir lo que de verdad importa.
    aplicacion: |-
      Podrías medir cinco variables a la vez y no entender ninguna. Elegir una, con una decisión escrita, es «perder» quince minutos para que las tres jornadas sirvan de algo.
    pregunta_espejo: |-
      ¿Qué decisión de mi colegio cambiaría si alguien tuviera estos treinta datos?
  estoico:
    autor: Marco Aurelio · Meditaciones VII, 47 (c. 175 d.C.)
    idea: |-
      Conviene mirar el curso de los astros y las transformaciones de las cosas, como quien gira con ellas.
    aplicacion: |-
      El caficultor mira el año para ver las dos cosechas y el tiempo frío. Tú miras tres jornadas para ver el pico de la 1 de la tarde. Lo que se repite solo aparece cuando miras el ciclo entero.
    pregunta_espejo: |-
      ¿Qué de mi día se repite sin que lo note, porque nunca lo miré tres veces seguidas?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      Los patrones pequeños solo significan algo si se juntan bien, se comparan y se procesan a tiempo.
    aplicacion: |-
      Una medición de 28 grados no dice nada. Treinta mediciones, comparadas por hora y por día, dicen «sube a la 1». Y solo sirven si las relees antes de la sesión 10, no después.
    pregunta_espejo: |-
      ¿Qué patrón pequeño de mi bitácora se perdería si no comparo los tres días?
compromiso: |-
  \textbf{Para la próxima sesión.} Completa las jornadas 2 y 3 y llega con la bitácora de treinta filas, el patrón con su cifra y la propuesta. En la sesión 10 vas a sustentar el proyecto en cinco minutos con el micro:bit funcionando. Los datos que anotes esta semana son lo que vas a defender.
web:
  resumen: |-
    Monitorear es medir la misma variable, con la misma frecuencia, durante un tiempo, y releer los datos para decidir. Hoy programas el micro:bit y planeas tres jornadas de mediciones, como el caficultor que solo entiende el cafetal mirando el año completo.
  subtema: Lógica y micro:bit
  pre_lectura:
    por_que_importa: |-
      Muchas decisiones del colegio y de la ciudad se toman con datos que alguien midió con paciencia. Saber montar un monitoreo es saber producir ese dato.
    pregunta_detonante: |-
      Si midieras la temperatura del salón una sola vez a las 10, ¿qué te perderías de lo que pasa a la 1?
    activacion:
      titulo: Tres días de lo mismo
      descripcion: |-
        En 3 minutos, escribe una cosa que pasa en tu salón todos los días a la misma hora: el calor, el ruido, la fila. ¿Cómo lo sabes? ¿Cuántos días tuviste que verlo para estar seguro?
      duracion_min: 5
    conexion:
      anterior: En la sesión 8 combinaste sensores con lógica compuesta y probaste ocho escenarios.
      siguiente: En la sesión 10 sustentas el proyecto con los datos y el micro:bit en vivo.

clave: 2-9
grado: 8
periodo: 2
sesion: 9
completo: true
titulo: Proyecto de monitoreo --- el micro:bit como vigía
titulo_portada: |-
  Proyecto de monitoreo ---
  el micro:bit
  como vigía
producto_final: |-
  Proyecto funcional de monitoreo con micro:bit que registre durante al menos 3 días continuos (o 3 jornadas escolares) 1 variable real del entorno escolar (temperatura del aula, nivel de luz, ruido del recreo, paso de personas, humedad de un huerto) + bitácora con al menos 30 mediciones (10 por jornada) + análisis de 1 hallazgo y 1 propuesta de acción razonada a partir de los datos + reflexión de 5 líneas sobre lo que el vigía digital descubrió del aula que el ojo humano no habría notado
apertura:
  saber_ancestral: |-
    En los barrios populares de Cartago y en los corregimientos del Valle del Cauca había una figura que sostenía la seguridad del lugar sin que nadie le pagara salario formal: \textbf{el vigía nocturno}, también llamado \emph{sereno} en algunos pueblos. El vigía no tenía celular, ni cámara, ni dispositivo electrónico: tenía un \textbf{pito de hojalata}, una linterna de baterías, un cuaderno cuadriculado y una rutina inquebrantable. Su oficio era simple en apariencia, complejo en disciplina: \textbf{recorrer el barrio una vez por hora durante toda la noche}, escuchar lo que sonaba, contar lo que veía, y \textbf{anotar todo en su cuaderno}. \emph{``11:30 pm, calle 8: 2 perros ladrando esquina norte''}. \emph{``12:30 am, calle 8: tranquilo''}. \emph{``1:30 am, calle 8: motocicleta blanca pasó dos veces''}. Esa bitácora del vigía no era trámite: era \textbf{conocimiento acumulado del barrio}. Al final de la semana, releyendo las páginas, el vigía podía decir: \emph{``la motocicleta blanca pasó tres noches seguidas a la misma hora''}, y eso ya era una pista. \textbf{El vigía monitoreaba con disciplina y producía conocimiento}, no por intuición sino por anotación continua. Esa práctica ancestral es la misma que el monitoreo digital moderno formaliza con sensores.
  origen: Lectores del cielo campesinos en haciendas, veredas y resguardos colombianos
  saber_contemporaneo: |-
    Un \textbf{proyecto de monitoreo} en computación física combina todas las habilidades del periodo 2: leer sensores (S4), aplicar umbrales calibrados (S6), depurar cuando falla (S7), construir alertas combinadas (S8). La regla profesional: \textbf{el monitoreo es observación con disciplina y registro continuo}. Sin registro, los datos se pierden. Sin disciplina temporal, los datos pierden contexto. El monitoreo profesional tiene 4 propiedades: (1) \textbf{Variable bien definida}: una sola variable medida con consistencia (temperatura del aula, no \emph{``el clima''}). (2) \textbf{Frecuencia constante}: el vigía pasa cada hora, no cuando se acuerda. (3) \textbf{Registro persistente}: bitácora física o digital donde quedan las lecturas. (4) \textbf{Análisis posterior}: al final del periodo se relee la bitácora para encontrar patrones. En el micro:bit, el monitoreo se puede implementar con \emph{enviar datos a la consola serie} (se imprime en pantalla del computador conectado por USB), o pidiendo al estudiante anotar manualmente lo que muestra el micro:bit cada hora.
  pregunta_puente: |-
    ¿Qué sabía el vigía nocturno al anotar cada hora aunque \emph{``no pasara nada''}, que el novato olvida cuando hace una medición ocasional y cree que ya monitoreó? ¿Y por qué 30 mediciones bien tomadas valen más que 100 mediciones sin disciplina temporal?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} una variable real del entorno escolar que valga la pena monitorear durante 3 jornadas; (2) \textbf{aplicar} las habilidades del periodo (sensores, umbrales, alertas, depuración) en un proyecto integrado; (3) \textbf{crear} la bitácora de monitoreo con 30+ mediciones; (4) \textbf{evaluar} los datos al final del periodo identificando al menos 1 hallazgo y proponiendo 1 acción concreta a partir del dato.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Has aprendido 8 habilidades por separado. Hoy las \emph{integras} en un proyecto real que dura varios días. La sesión 10 será sustentación pública de este proyecto. Es la cima del periodo 2.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lluvia de variables monitorables} del entorno escolar: 5 variables que se podrían medir con micro:bit y que tendrían sentido monitorear. La regla: variables \textbf{accesibles, medibles, con propósito}.
  a_sistematizacion: |-
    Ya tienes candidatas. Ahora vas a entender la \textbf{anatomía del proyecto de monitoreo profesional}: las 4 propiedades, la planeación de 3 jornadas, los 5 errores típicos del proyecto novato (medir sin propósito, frecuencia inconsistente, sin bitácora, sin análisis, sin propuesta).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: elegir la variable, programar el micro:bit, monitorear durante 3 días, llenar bitácora, analizar, proponer acción.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas al final de la semana: proyecto funcional + bitácora 30+ mediciones + análisis + propuesta + reflexión. El criterio principal: que la propuesta de acción sea concreta y razonada con los datos, no opinión sin sustento.
  a_evaluacion: |-
    Antes de cerrar, mira el proyecto desde las cinco dimensiones humanas. Monitorear con disciplina es respeto por el oficio del vigía; medir solo cuando uno se acuerda es desperdicio del periodo entero.
  a_triangulo: |-
    Y para terminar, tres voces sobre la observación continua. Dussel sobre el monitoreo que cuida o que vigila, Marco Aurelio sobre la disciplina de la medición continua, Floridi sobre los sistemas de monitoreo como infraestructura de información.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Lluvia de variables monitorables} (15 min · individual o parejas). Anota 5 variables del entorno escolar que se podrían medir con micro:bit durante varios días, y para cada una responde: (1) ¿qué sensor usaría?, (2) ¿por qué valdría la pena medirla? (qué decisión podría salir del dato), (3) ¿con qué frecuencia mediría? Ejemplos: temperatura del aula a lo largo del día, nivel de luz del salón en distintas horas, ruido en la cafetería entre recreos, paso de personas frente al baño, humedad de las plantas del huerto escolar.
  checks:
  - Anoté 5 variables monitorables.
  - Para cada una identifiqué sensor + propósito + frecuencia.
  - Elegí 1 entre las 5 con justificación.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Variables monitorables». \textbf{Formato:} tabla 5 filas × 4 columnas (Variable~|~Sensor~|~Propósito~|~Frecuencia). \textbf{Sabes que terminaste cuando} eliges 1 con razón clara.
sistematizacion:
  intro: |-
    Tienes 5 candidatas y 1 elegida. Ahora necesitas la \textbf{anatomía del proyecto profesional}: las 4 propiedades, el plan de 3 jornadas, los errores típicos.
  pilares:
  - |-
    Las \textbf{4 propiedades} del monitoreo profesional se descomponen así: (1) \textbf{Variable bien definida}: una sola, con unidad clara (grados Celsius, lúmenes, decibeles aproximados). (2) \textbf{Frecuencia constante}: cada cuántos minutos u horas se toma una medición. Decidir y mantener. (3) \textbf{Registro persistente}: bitácora donde queda cada medición con su hora y observación. (4) \textbf{Análisis posterior}: al final, releer la bitácora y extraer hallazgos (¿hay tendencia?, ¿hay picos?, ¿hay valores extremos?).
  - |-
    El \textbf{plan de 3 jornadas} se estructura así: (a) \textbf{Día 1}: instalación del micro:bit, primeras mediciones, ajuste de calibración. (b) \textbf{Día 2}: monitoreo continuo con frecuencia constante; 10+ mediciones. (c) \textbf{Día 3}: 10+ mediciones, cierre del registro. Al final del día 3, análisis de los 30+ datos en conjunto. La regla: \textbf{30 datos en 3 jornadas vale más que 100 datos en 1 jornada}, porque el tiempo extendido revela patrones invisibles a corto plazo.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué decidiría yo si tuviera estos datos en mano?}. El monitoreo sin propósito de decisión es solo recolección. El monitoreo con propósito busca patrones que dirijan acciones. La phronesis del oficio consiste en \textbf{recolectar para decidir, no para acumular}.
  - |-
    Algoritmo: (1) elegir variable y propósito. (2) programar micro:bit con sensor + alerta o registro visual. (3) calibrar los umbrales (S6). (4) planear el cronograma de mediciones (cada cuánto). (5) ejecutar durante 3 jornadas. (6) llenar bitácora con 30+ entradas. (7) al final, leer la bitácora completa y buscar hallazgos. (8) proponer 1 acción concreta a partir del hallazgo.
  anatomia:
    titulo: Anatomía del proyecto de monitoreo
    body: |-
      \textbf{Variable:} una sola, con unidad. \\[1mm] \textbf{Frecuencia:} constante a lo largo del periodo. \\[1mm] \textbf{Registro:} bitácora persistente. \\[1mm] \textbf{Análisis:} buscar patrones al final. \\[1mm] \textbf{Acción:} propuesta concreta basada en hallazgo.
  errores_comunes: |-
    (1) \textbf{Medir sin propósito}: tomar datos sin haber pensado qué decisión saldría de ellos. (2) \textbf{Frecuencia inconsistente}: medir cada hora un día y cada 4 horas el siguiente. (3) \textbf{Sin bitácora}: confiar en la memoria, perder datos. (4) \textbf{Sin análisis}: tener datos pero no leerlos al final. (5) \textbf{Sin propuesta}: declarar el proyecto cerrado sin haber propuesto acción a partir de los datos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía del proyecto». \textbf{Formato:} (a) las 4 propiedades aplicadas a tu variable; (b) cronograma de 3 jornadas; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} tienes plan detallado para ejecutar esta semana.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Proyecto ejecutado + bitácora + propuesta} (40 min en sesión + ejecución durante la semana · individual o parejas). Hora de ejecutar. Programa el micro:bit, instala, monitorea durante 3 jornadas, analiza, propone.
  pilares:
  - |-
    Tu proyecto se ejecuta en 5 pasos: (1) programar el micro:bit con sensor + alerta visual o registro. (2) instalar en el aula u otro lugar relevante. (3) durante 3 jornadas, anotar al menos 10 mediciones por jornada en la bitácora (puede ser cuaderno físico o hoja Excel). (4) al final, analizar las 30+ mediciones buscando patrones. (5) proponer 1 acción concreta y razonada con los datos.
  - |-
    La bitácora tiene 4 columnas: (a) \textbf{Fecha y hora} exacta de la medición. (b) \textbf{Valor del sensor} (cifra leída). (c) \textbf{Observación} del entorno (¿hay clase?, ¿había sol?, ¿alguien acababa de entrar?). (d) \textbf{Estado de alerta} si aplica (rojo/amarillo/verde según los umbrales calibrados). 30+ filas distribuidas en 3 jornadas.
  - |-
    El análisis final se estructura en 3 piezas: (a) \textbf{Patrón principal observado}: una frase clara (\emph{``la temperatura del aula sube 3 grados entre 11am y 1pm los días sin lluvia''}). (b) \textbf{Cifra que respalda el patrón}: dato numérico concreto. (c) \textbf{Propuesta de acción}: qué se podría hacer con esta información (\emph{``abrir ventanas a las 10:30 para evitar el pico de calor''}, \emph{``cambiar las cortinas por unas más claras''}).
  - |-
    Algoritmo: (1) programar. (2) instalar. (3) monitorear 3 jornadas. (4) bitácora. (5) analizar. (6) proponer. (7) reflexionar sobre lo que descubrió el vigía digital que no se habría visto a simple ojo.
  checklist:
    titulo: Checklist antes de cerrar el proyecto
    items: |-
      \checkbox Variable elegida con propósito claro. \\[1mm] \checkbox Micro:bit programado y funcionando. \\[1mm] \checkbox Calibración hecha antes de empezar. \\[1mm] \checkbox 30+ mediciones distribuidas en 3 jornadas. \\[1mm] \checkbox Bitácora completa con las 4 columnas. \\[1mm] \checkbox Análisis con 1 patrón observado y 1 cifra que lo respalda. \\[1mm] \checkbox 1 propuesta de acción concreta y razonada. \\[1mm] \checkbox Reflexión sobre lo que el vigía digital descubrió.
  plantilla_guion: |-
    \textbf{Variable.} \textit{Una sola, con unidad.} \\[1mm] \textbf{Propósito.} \textit{Qué decisión podría salir.} \\[1mm] \textbf{Plan.} \textit{Cronograma 3 jornadas + frecuencia.} \\[1mm] \textbf{Bitácora.} \textit{30+ filas con 4 columnas.} \\[1mm] \textbf{Hallazgo.} \textit{Patrón + cifra.} \\[1mm] \textbf{Propuesta.} \textit{Acción concreta.} \\[1mm] \textbf{Reflexión.} \textit{Qué descubrió el vigía digital.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Proyecto de monitoreo». \textbf{Formato:} (a) bitácora 30+ filas; (b) análisis con patrón + cifra; (c) propuesta razonada; (d) reflexión final. \textbf{Sabes que terminaste cuando} podrías sustentar el proyecto en la sesión 10 con los datos en mano.
  producto_titulo: Proyecto micro:bit + bitácora 30+ mediciones + análisis + propuesta
  criterios:
  - Variable elegida con propósito
  - Micro:bit programado y calibrado
  - 30+ mediciones en 3 jornadas
  - Bitácora con 4 columnas completa
  - 1 patrón observado con cifra
  - 1 propuesta de acción razonada
  - Reflexión sobre el hallazgo
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El monitoreo que cuida al usuario es liberador; el que lo vigila sin saberlo es opresor disfrazado de tecnología.
    aplicacion: |-
      Tu proyecto de monitoreo entra en el aula y mide algo del entorno común. Hay dos formas de hacerlo: (1) \textbf{cuidando} (ej. medir la calidad del aire para proponer mejoras) o (2) \textbf{vigilando} (ej. medir tiempo de pantalla del docente sin avisarle). La filosofía de la liberación pide siempre la primera. Tu propuesta de acción al final del proyecto debe servir al colectivo del aula, no controlar a alguien sin consentimiento.
    pregunta_espejo: |-
      Mi proyecto, ¿cuida al aula o vigila a alguien? ¿Las personas afectadas sabrían que existe y aceptarían su funcionamiento?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La disciplina de medir cada vez aunque no pase nada es virtud profesional; medir solo cuando uno se acuerda es vanidad.
    aplicacion: |-
      Es tentador medir solo cuando hay tiempo o cuando se acuerda. La sabiduría estoica recomienda lo opuesto: \emph{disciplina constante}. El vigía pasaba cada hora aunque \emph{``no pasara nada''}. Su disciplina producía conocimiento que la medición ocasional no produce. Tu proyecto necesita esa misma constancia: 30 mediciones distribuidas, no acumuladas en un día.
    pregunta_espejo: |-
      ¿Estoy midiendo con la disciplina del vigía o solo cuando me acuerdo?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los sistemas de monitoreo bien diseñados son la nueva infraestructura de información del oficio digital.
    aplicacion: |-
      En la era de la información, el monitoreo continuo sostiene decisiones de gobiernos, empresas y comunidades. Que esos sistemas sean transparentes, con propósito declarado y datos verificables es ética del oficio digital. Tu proyecto de hoy te entrena en una práctica que rige toda profesión técnica: \textbf{producir información cuidada para sostener decisiones}.
    pregunta_espejo: |-
      Mi sistema de monitoreo, ¿produce información útil para decisiones, o solo recolecta datos por recolectar?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu proyecto ejecutado, la bitácora completa y la propuesta razonada. En la sesión 10 vas a hacer la \textbf{sustentación técnica} del proyecto: 5 minutos frente al grupo + demo en vivo + responder preguntas. Sin proyecto sólido hoy, la sustentación será defensa de algo incompleto.
web:
  conceptos_clave:
    - termino: Proyecto de monitoreo
      definicion: |-
        Sistema que registra una variable del entorno durante un período, con disciplina de frecuencia y registro, para producir conocimiento.
      ejemplo: |-
        Temperatura del aula medida cada hora durante 3 jornadas. 30 lecturas que permiten detectar el momento más caluroso.
      emoji: "🛰️"
    - termino: Variable bien definida
      definicion: |-
        Una sola magnitud medida con consistencia, no una idea vaga. Permite comparar las lecturas entre sí.
      ejemplo: |-
        Temperatura del aula medida con el mismo sensor a la misma altura. No "el clima" ni "cómo se siente el aula".
      emoji: "🎯"
    - termino: Frecuencia constante
      definicion: |-
        Tomar las lecturas en intervalos regulares (cada hora, cada 30 minutos), no cuando uno se acuerda. Da contexto temporal al dato.
      ejemplo: |-
        El vigía pasa cada hora aunque "no pase nada". Sin esa regularidad, la bitácora pierde valor comparativo.
      emoji: "⏱️"
    - termino: Hallazgo
      definicion: |-
        Patrón detectado al releer la bitácora al final del período. No se ve durante una medición individual, solo al mirar el conjunto.
      ejemplo: |-
        El aula supera 28 grados todos los días entre 1pm y 3pm. Hallazgo que justifica una propuesta de ventilación.
      emoji: "🔍"
    - termino: Propuesta razonada
      definicion: |-
        Acción concreta derivada del hallazgo, no opinión libre. El dato sostiene la propuesta y la propuesta dice qué hacer.
      ejemplo: |-
        Hallazgo, calor entre 1 y 3 pm. Propuesta, abrir ventanas opuestas a las 12:30 para generar corriente cruzada antes del pico.
      emoji: "📝"
  quiz:
    titulo: ¿Sabes monitorear como el vigía nocturno?
    instrucciones: 5 preguntas para verificar que tu proyecto produce conocimiento, no solo datos.
    preguntas:
      - enunciado: ¿Cuál es la diferencia entre 30 mediciones con frecuencia constante y 100 mediciones desordenadas?
        opciones:
          - Ninguna, importa la cantidad
          - Las 30 con frecuencia constante permiten comparar; las 100 desordenadas pierden contexto
          - Las 100 siempre son mejores
          - Las 30 siempre son peores
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La disciplina temporal es lo que convierte una serie de mediciones en conocimiento comparable.
        feedback_incorrecto: |-
          La calidad del monitoreo depende de la frecuencia constante, no del número bruto. 30 medidas en horarios fijos valen más que 100 al azar.
      - enunciado: ¿Qué propiedad falta en "el clima del aula es variable"?
        opciones:
          - Frecuencia
          - Registro
          - Variable bien definida
          - Análisis
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. "El clima" es vago. Una variable bien definida sería temperatura, humedad o nivel de luz, medida con la misma técnica.
        feedback_incorrecto: |-
          Falta definir la variable. "Clima" no es medible; temperatura sí lo es, con el mismo sensor a la misma altura.
      - enunciado: Al final del período, ¿qué transforma la bitácora en conocimiento?
        opciones:
          - Releerla buscando patrones (hallazgos)
          - Imprimirla
          - Pasarla en limpio
          - Guardarla en una carpeta
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. El conocimiento aparece al releer y detectar patrones. Sin esa lectura, la bitácora es solo lista de números.
        feedback_incorrecto: |-
          La bitácora se vuelve conocimiento cuando se relee buscando patrones. Sin análisis, los datos son inertes.
      - enunciado: ¿Qué hace que una propuesta sea razonada y no opinión libre?
        opciones:
          - Que sea creativa
          - Que sea corta
          - Que sea bonita
          - Que esté sostenida por un hallazgo concreto de la bitácora
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. La propuesta razonada nace del dato. Sin hallazgo concreto, es opinión.
        feedback_incorrecto: |-
          Una propuesta razonada se sostiene en un hallazgo concreto de la bitácora. El dato justifica la acción.
      - enunciado: ¿Cuántas mediciones mínimas pide la guía para un proyecto de monitoreo válido?
        opciones:
          - "5"
          - "30"
          - "10"
          - "300"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 30 mediciones, 10 por jornada durante 3 jornadas. Da masa suficiente para detectar patrones.
        feedback_incorrecto: |-
          Son 30 mediciones (10 por jornada en 3 días). Menos no permite detectar patrones; muchas más son carga sin necesidad escolar.
  resumen: |-
    Como el conocimiento de los lectores del cielo: leer el ambiente para servir a la comunidad. Aplicas TODO lo del periodo en un proyecto de monitoreo de la huerta escolar.
  subtema: Proyecto · Monitoreo · Logos como razón universal
  pre_lectura:
    por_que_importa: |-
      Construir un proyecto integrador es la habilidad de quien lleva ideas a la realidad. Te servirá para emprender, para liderar grupos, para resolver problemas comunitarios reales con tecnología.
    pregunta_detonante: |-
      ¿Qué del logos campesino — la lectura paciente del cielo — podemos llevar al monitoreo ambiental con sensores digitales?
    activacion:
      titulo: El proyecto que cambia algo
      descripcion: |-
        En 5 minutos: en parejas identifiquen un problema real del colegio que un proyecto de monitoreo podría aliviar (cafetería, biblioteca, baños, huerta). Formulen la pregunta de monitoreo.
      duracion_min: 5
    conexion:
      anterior: En la sesión 18 simulaste sistemas de alerta ambiental.
      siguiente: En la sesión 20 sustentarás tu proyecto ante la comunidad.
  post_lectura:
    reflexion: |-
      Un proyecto que SIRVE a la comunidad es distinto a uno que LUCE en presentación. ¿Tu proyecto cuida algo concreto del colegio o de tu barrio? ¿A quién beneficia más allá de la nota?
    transferencia: |-
      Esta semana: ejecuta TU proyecto de monitoreo. 7 días de lecturas (simuladas o reales), tabla, gráfico, recomendación. Compártelo con un compañero antes de la sustentación.
    cierre: |-
      El logos campesino y el proyecto digital comparten propósito: leer el mundo para cuidarlo. La tecnología que sirve es la que se calibra al territorio y a la comunidad.
  cinco_dimensiones:
    personal: |-
      Aplicaste el periodo completo en UN proyecto con propósito comunitario — paso decisivo hacia la madurez técnica.
    emocional: Resististe la tentación del proyecto "para que se vea bien" — elegiste el que sirve a alguien real.
    ciudadana: |-
      Tu monitoreo de la huerta es ciudadanía tecnológica concreta: tu técnica al servicio de una necesidad real.
    local: "Heredaste el logos campesino del lector del cielo: leer el ambiente para cuidarlo, no para presumir."
    intergeneracional: |-
      El abuelo lector de signos y tu micro:bit comparten propósito: servir a quien depende del territorio común.

clave: 3-1
grado: 8
periodo: 3
sesion: 1
completo: true
titulo: Multimedia --- diseño visual y jerarquía de información
titulo_portada: |-
  Multimedia ---
  diseño visual
  y jerarquía
producto_final: |-
  1 pieza visual (afiche escolar, post para Instagram o WhatsApp, infografía sencilla) sobre un tema real del colegio (campaña antibullying, jornada deportiva, invitación al festival cultural) con jerarquía visual clara que incluya los 4 elementos obligatorios (título, subtítulo, cuerpo del mensaje, llamada a la acción) + crítica escrita de 1 afiche real mal diseñado (sacado de redes, prensa o publicidad escolar) identificando 3 errores de jerarquía y proponiendo cómo corregirlos
apertura:
  saber_ancestral: |-
    En las comunidades del Pacífico colombiano y en las zonas indígenas del Chocó, hay un oficio antiguo que enseña diseño visual sin llamarlo así: \textbf{el tejido tradicional}. Las mujeres tejedoras emberá, wounaan, kuna y afrodescendientes producen mochilas, manillas, ruanas, esteras con patrones que han pasado de abuela a nieta durante siglos. Una mochila tradicional no es un revoltijo de hilos al azar: tiene una \textbf{arquitectura visual estricta} que cualquier ojo entrenado reconoce: (1) \textbf{El motivo central}: el más grande, el más vistoso, el que cuenta la historia principal (un sol, un animal sagrado, una geometría ancestral). (2) \textbf{Los motivos laterales}: más pequeños, repetitivos, enmarcan el central. (3) \textbf{El borde}: línea fina y constante que cierra la composición. Cada hilo tiene función; nada está al azar. Si la tejedora pusiera el motivo central pequeño y el borde grande, la mochila se vería rota. La sabiduría es ancestral y precisa: \textbf{la jerarquía visual organiza lo que el ojo ve primero, segundo y al final}. Esa práctica del telar es exactamente el principio del diseño visual moderno: orientar al ojo del lector con tamaño, posición y contraste.
  saber_contemporaneo: |-
    El \textbf{diseño visual} es la disciplina que organiza elementos en una pantalla o página para que comuniquen un mensaje con claridad. Su herramienta más importante es la \textbf{jerarquía visual}: el orden en que el ojo del lector recorre los elementos. La regla profesional famosa: \textbf{el lector tarda 3 segundos en decidir si tu pieza le interesa}. En esos 3 segundos, el ojo recorre lo que tiene mayor jerarquía (más grande, más contrastado, ubicado arriba) y se va si no encuentra algo que lo enganche. Toda pieza visual bien diseñada tiene 4 elementos en jerarquía clara: (1) \textbf{Título}: el mensaje principal, en el tamaño más grande, ubicado arriba o al centro. (2) \textbf{Subtítulo}: complementa el título, en tamaño intermedio. (3) \textbf{Cuerpo del mensaje}: detalles, texto explicativo, en tamaño legible pero menor. (4) \textbf{Llamada a la acción} (CTA, \emph{call to action}): qué quieres que haga el lector después de ver la pieza (\emph{``inscríbete antes del 30''}, \emph{``ven al festival''}). Sin estos 4 elementos en jerarquía clara, la pieza no comunica: confunde.
  pregunta_puente: |-
    ¿Qué sabía la tejedora del Pacífico al organizar el motivo central, los laterales y el borde, que el novato en diseño olvida cuando hace un afiche con todos los textos del mismo tamaño? ¿Y por qué los 3 segundos que el lector dedica a una pieza son lo que separa el diseño profesional del decorativo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 4 elementos obligatorios de una pieza visual con jerarquía clara (título, subtítulo, cuerpo, CTA); (2) \textbf{analizar} una pieza ajena detectando si la jerarquía está aplicada o no; (3) \textbf{crear} tu pieza visual con los 4 elementos sobre un tema escolar real; (4) \textbf{evaluar} críticamente un afiche mal diseñado identificando 3 errores y proponiendo correcciones.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. El periodo 3 cierra el grado 8 con \textbf{multimedia, narrativa y ciberética}. Hoy abrimos con lo más básico y más importante: el diseño visual con jerarquía. Las próximas sesiones (animaciones, narrativa, edición, audio, ciberseguridad, estética) construyen sobre esta base.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio del lector}: tu docente proyecta 3 afiches reales y tú anotas, sin pensar mucho, qué leíste primero, segundo y tercero en cada uno. Esa secuencia es la jerarquía visual real (no la que el diseñador imaginó).
  a_sistematizacion: |-
    Ya hiciste el ejercicio del lector. Ahora vas a entender la \textbf{anatomía de la jerarquía visual}: los 4 elementos obligatorios, las 4 herramientas que crean jerarquía (tamaño, peso, color, posición), los 5 errores típicos del diseño novato (todos los textos del mismo tamaño, demasiados colores, sin CTA, exceso de información, falta de espacio en blanco).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: diseñas tu pieza visual con los 4 elementos sobre un tema escolar real, y criticas 1 afiche mal diseñado identificando errores y proponiendo correcciones.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 1 pieza visual con jerarquía + crítica de 1 afiche con propuesta. El criterio principal: que un compañero, viendo tu pieza por 3 segundos, pueda decir qué dice el mensaje principal.
  a_evaluacion: |-
    Antes de cerrar, mira el diseño desde las cinco dimensiones humanas. Diseñar con jerarquía es respeto por los 3 segundos del lector; saturar la pieza es desperdicio del oficio entero.
  a_triangulo: |-
    Y para terminar, tres voces sobre el orden visual. Dussel sobre las piezas que dignifican al lector o lo abruman, Marco Aurelio sobre la simplicidad como virtud, Floridi sobre el diseño comunicativo como ética del oficio digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Ejercicio del lector} (15 min · individual). Tu docente proyecta o entrega 3 afiches reales (campaña electoral, publicidad de evento, cartel de tienda). Para cada uno, anota sin pensar mucho: (a) ¿qué leíste primero? (b) ¿qué segundo? (c) ¿qué último o nunca leíste? Tu propio recorrido visual revela la jerarquía real del afiche. Después decide: ¿está bien diseñado (lo importante se lee primero) o mal (lo principal está perdido entre lo accesorio)?
  checks:
  - Miré 3 afiches sin pensar mucho.
  - Anoté qué leí primero, segundo, último.
  - Detecté si la jerarquía del afiche funcionaba o fallaba.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Ejercicio del lector». \textbf{Formato:} 3 fichas (1 por afiche) con secuencia de lectura + diagnóstico (jerarquía buena o mala). \textbf{Sabes que terminaste cuando} ves que tu ojo siempre va a lo grande, contrastado o ubicado arriba.
sistematizacion:
  intro: |-
    Tu ojo ya reconoce jerarquía intuitivamente. Ahora necesitas la \textbf{anatomía formal} del diseño visual con jerarquía: los 4 elementos obligatorios, las 4 herramientas que crean orden, los 5 errores típicos.
  pilares:
  - |-
    Los \textbf{4 elementos obligatorios} de una pieza visual con jerarquía clara: (1) \textbf{Título}: máximo 7 palabras, el tamaño más grande de la pieza, ubicado arriba o al centro. Responde \emph{``¿de qué trata esto?''}. (2) \textbf{Subtítulo}: 1-2 líneas, tamaño intermedio, complementa el título. (3) \textbf{Cuerpo del mensaje}: detalles, fechas, lugares, condiciones; tamaño legible (mínimo 12pt en pantalla, 24pt en afiche impreso). (4) \textbf{Llamada a la acción (CTA)}: 3-5 palabras, en botón o resaltado, qué hacer después (\emph{``Inscríbete ya''}, \emph{``Asiste el viernes''}).
  - |-
    Las \textbf{4 herramientas que crean jerarquía} son: (a) \textbf{Tamaño}: lo más grande se lee primero. (b) \textbf{Peso} (grosor de la fuente): bold se ve más fuerte que regular. (c) \textbf{Color}: contraste con el fondo (texto oscuro sobre fondo claro, o viceversa). (d) \textbf{Posición}: arriba o al centro se ve primero. Estas 4 herramientas se combinan: el título puede ser grande + bold + alto contraste + arriba; el CTA puede ser mediano + bold + color distinto + abajo destacado.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿el lector entiende el mensaje principal en 3 segundos?}. Si sí, la jerarquía funciona. Si no, la pieza tiene exceso de información, falta de contraste, o todos los textos del mismo tamaño. La phronesis del oficio consiste en \textbf{servir al lector apurado, no impresionar al lector contemplativo}.
  - |-
    Algoritmo de diseño: (1) define el tema y el público (¿a quién va dirigido?). (2) escribe el título en máximo 7 palabras. (3) escribe el CTA en 3-5 palabras. (4) abre Canva, Photoshop, Figma o PowerPoint. (5) ubica el título arriba, grande, bold. (6) ubica el CTA abajo, destacado. (7) llena el cuerpo entre los dos. (8) verifica con un compañero: ¿entiende el mensaje en 3 segundos?
  anatomia:
    titulo: Anatomía de la jerarquía visual
    body: |-
      \textbf{Título:} máx 7 palabras, grande, arriba. \\[1mm] \textbf{Subtítulo:} 1-2 líneas, mediano. \\[1mm] \textbf{Cuerpo:} detalles, legible. \\[1mm] \textbf{CTA:} 3-5 palabras, destacado. \\[1mm] \textbf{Herramientas:} tamaño + peso + color + posición.
  errores_comunes: |-
    (1) \textbf{Todos los textos del mismo tamaño}: el ojo no sabe qué leer primero. (2) \textbf{Demasiados colores}: distraen y compiten entre sí (máx 2-3 colores en una pieza). (3) \textbf{Sin CTA}: el lector no sabe qué hacer después de ver la pieza. (4) \textbf{Exceso de información}: 5 párrafos donde caben 5 frases. (5) \textbf{Falta de espacio en blanco}: la pieza saturada cansa al ojo. La regla profesional: \textbf{el espacio en blanco es elemento de diseño}, no relleno desperdiciado.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía de la jerarquía». \textbf{Formato:} (a) los 4 elementos con su uso; (b) las 4 herramientas; (c) los 5 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías diseñar una pieza desde cero sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Pieza visual + crítica de 1 afiche} (40 min · individual). Hora de crear. Diseñas tu pieza visual con los 4 elementos sobre un tema escolar real, y criticas 1 afiche real mal diseñado.
  pilares:
  - |-
    Tu pieza visual se construye en 5 pasos: (1) elegir tema escolar real (campaña antibullying, festival cultural, jornada deportiva, recolección de tapas, invitación a obra de teatro escolar). (2) escribir título de máximo 7 palabras. (3) escribir CTA de 3-5 palabras. (4) diseñar en Canva (gratis, con plantillas), Figma, o PowerPoint con formas. (5) aplicar las 4 herramientas (tamaño/peso/color/posición) para crear jerarquía.
  - |-
    Sigue el patrón \textbf{``menos es más''}: las piezas profesionales suelen tener menos elementos que las amateurs, no más. Un afiche con 3 elementos jerarquizados comunica más que uno con 20 elementos al mismo nivel. La phronesis del diseño consiste en \textbf{eliminar lo no esencial} hasta que solo quede lo necesario para comunicar.
  - |-
    La crítica del afiche mal diseñado tiene estructura mínima: (a) \textbf{Afiche real elegido}: foto o captura de un afiche real (de redes sociales, prensa, publicidad escolar). (b) \textbf{Error 1}: qué falla concretamente (ej. \emph{``el título tiene el mismo tamaño que la fecha''}). (c) \textbf{Error 2}: otro problema visual. (d) \textbf{Error 3}: tercer problema. (e) \textbf{Propuesta de corrección}: cómo lo rediseñarías en 2-3 cambios.
  - |-
    Algoritmo: (1) elegir tema. (2) escribir título y CTA. (3) abrir Canva. (4) aplicar las 4 herramientas. (5) revisar con regla de los 3 segundos. (6) elegir afiche real para criticar. (7) identificar 3 errores. (8) proponer corrección.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Pieza visual con los 4 elementos (título, subtítulo, cuerpo, CTA). \\[1mm] \checkbox Título máximo 7 palabras. \\[1mm] \checkbox CTA 3-5 palabras destacado. \\[1mm] \checkbox Máximo 2-3 colores. \\[1mm] \checkbox Jerarquía verificada con regla de los 3 segundos. \\[1mm] \checkbox Afiche real elegido para criticar. \\[1mm] \checkbox 3 errores identificados. \\[1mm] \checkbox Propuesta de corrección en 2-3 cambios.
  plantilla_guion: |-
    \textbf{Tema.} \textit{Escolar real.} \\[1mm] \textbf{Título.} \textit{Máx 7 palabras.} \\[1mm] \textbf{Subtítulo.} \textit{1-2 líneas.} \\[1mm] \textbf{Cuerpo.} \textit{Detalles legibles.} \\[1mm] \textbf{CTA.} \textit{3-5 palabras destacadas.} \\[1mm] \textbf{Crítica.} \textit{Afiche + 3 errores + propuesta.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Mi pieza visual + crítica». \textbf{Formato:} (a) referencia al archivo de la pieza (link Canva, archivo .png); (b) afiche real con 3 errores y propuesta. \textbf{Sabes que terminaste cuando} un compañero de otro grupo entiende tu mensaje en 3 segundos.
  producto_titulo: Pieza visual con jerarquía + crítica de afiche mal diseñado
  criterios:
  - 4 elementos obligatorios presentes
  - Jerarquía visible con tamaño/peso/color/posición
  - Máximo 2-3 colores
  - Espacio en blanco respetado
  - Crítica de afiche con 3 errores
  - Propuesta de corrección concreta
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Una pieza visual con jerarquía clara respeta al lector apurado; una pieza saturada lo abruma y lo expulsa.
    aplicacion: |-
      La mayoría de las personas que verán tu pieza estarán apuradas: revisando Instagram en el bus, mirando un cartel mientras caminan. La filosofía de la liberación pide diseñar para esas personas, no para el lector contemplativo de museo. La pieza que comunica en 3 segundos respeta el tiempo de quien la ve; la pieza saturada exige tiempo que el lector no tiene.
    pregunta_espejo: |-
      ¿Mi pieza respeta al lector apurado o le exige más atención de la que tiene?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Lo simple comunica; lo recargado distrae. La virtud del diseño está en lo que se quita, no en lo que se agrega.
    aplicacion: |-
      Es tentador llenar la pieza con muchos elementos para \emph{``aprovechar el espacio''}. La sabiduría estoica recomienda lo opuesto: \emph{quita hasta que solo quede lo esencial}. El diseñador novato agrega; el profesional resta. La phronesis del oficio consiste en \textbf{lograr más con menos elementos}.
    pregunta_espejo: |-
      ¿Mi pieza tiene solo lo esencial, o agregué cosas que se pueden quitar sin perder mensaje?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El diseño comunicativo claro es la nueva ética del oficio digital en la era de la sobreinformación.
    aplicacion: |-
      En la era de la información, todos compiten por la atención del lector. La ética digital exige que las piezas que se publican respeten ese tiempo limitado con claridad. Tu pieza de hoy te entrena en esa práctica que rige toda profesión que comunique en pantallas: \textbf{diseñar para que el lector apurado pueda entender el mensaje en 3 segundos}.
    pregunta_espejo: |-
      ¿Mi pieza contribuye a la claridad informacional, o agrega ruido visual al exceso ya existente?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu pieza visual y la crítica del afiche. En la sesión 2 vas a aprender a hacer \textbf{presentaciones interactivas} con animaciones e hipervínculos. El diseño visual de hoy es la base; la narrativa interactiva de mañana se monta sobre ella.
web:
  conceptos_clave:
    - termino: Jerarquía visual
      definicion: |-
        Orden en que el ojo del lector recorre los elementos de una pieza. Se construye con tamaño, contraste y ubicación.
      ejemplo: |-
        En un afiche, el título arriba en grande; el subtítulo en mediano; los detalles, más pequeños. El ojo recorre así.
      emoji: "👁️"
    - termino: Título
      definicion: |-
        Mensaje principal. Va arriba o al centro, en el tamaño más grande, con la mayor jerarquía visual.
      ejemplo: |-
        En un afiche de festival, "Festival de la Salsa" arriba en grande, no escondido entre fechas y patrocinios.
      emoji: "📝"
    - termino: Subtítulo
      definicion: |-
        Complemento del título. Aporta contexto. Tamaño intermedio entre título y cuerpo.
      ejemplo: |-
        Bajo "Festival de la Salsa", el subtítulo "Tres días de música en Cartago" da contexto.
      emoji: "📃"
    - termino: Cuerpo del mensaje
      definicion: |-
        Texto explicativo, detalles, información secundaria. Tamaño legible pero menor que título y subtítulo.
      ejemplo: |-
        Programación, dirección, precios. Va abajo, en tamaño que se lee de cerca pero no de lejos.
      emoji: "📄"
    - termino: Llamada a la acción (CTA)
      definicion: |-
        Qué quieres que haga el lector después de ver la pieza. Verbo de acción concreto, no "más información".
      ejemplo: |-
        "Inscríbete antes del 30 de mayo", "Compra tu boleta en festival.co". No "haz clic aquí".
      emoji: "🎯"
  quiz:
    titulo: ¿Dominas la jerarquía visual?
    instrucciones: 5 preguntas para verificar que diseñas piezas que comunican en 3 segundos.
    preguntas:
      - enunciado: ¿En cuántos segundos decide el lector si tu pieza visual le interesa?
        opciones:
          - "3"
          - "30"
          - "60"
          - "120"
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. 3 segundos. En ese tiempo el ojo recorre lo que tiene mayor jerarquía. Si no engancha, se va.
        feedback_incorrecto: |-
          Son 3 segundos. La pieza debe comunicar lo esencial en ese tiempo o pierde al lector.
      - enunciado: ¿Cuál es el elemento de MAYOR jerarquía en una pieza bien diseñada?
        opciones:
          - El logo
          - El título
          - El cuerpo del texto
          - El pie de página
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El título carga la jerarquía mayor: más grande, más contrastado, arriba o al centro.
        feedback_incorrecto: |-
          Es el título. Es el elemento que comunica el mensaje principal en el primer vistazo.
      - enunciado: Tu afiche dice "haz clic aquí". ¿Por qué no es una buena CTA?
        opciones:
          - Porque es muy larga
          - Porque no dice qué pasará ni con qué propósito
          - Porque tiene mayúsculas
          - Porque tiene puntuación
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Una CTA debe ser concreta: "Inscríbete antes del 30". "Haz clic aquí" no comunica el propósito.
        feedback_incorrecto: |-
          El problema es que no dice qué pasa al hacer clic ni con qué propósito. La CTA debe ser específica.
      - enunciado: ¿Cuántos elementos básicos en jerarquía clara tiene una pieza visual bien diseñada?
        opciones:
          - "2"
          - "4"
          - "10"
          - "20"
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. 4: título, subtítulo, cuerpo del mensaje y llamada a la acción.
        feedback_incorrecto: |-
          Son 4: título, subtítulo, cuerpo y CTA. Más jerarquías confunden; menos no comunican.
      - enunciado: ¿Qué define la jerarquía visual de un elemento?
        opciones:
          - Solo el color
          - Tamaño, contraste y ubicación combinados
          - El idioma
          - El tipo de letra únicamente
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Tamaño, contraste y ubicación son las 3 palancas. Combinadas crean jerarquía clara.
        feedback_incorrecto: |-
          La jerarquía se construye con tamaño, contraste y ubicación combinados. Ningún factor por sí solo basta.

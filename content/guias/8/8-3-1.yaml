clave: 3-1
grado: 8
periodo: 3
sesion: 1
completo: true
duracion_min: 90
titulo: Diseño visual --- lo que se lee primero
titulo_portada: |-
  Lo que se lee
  primero
producto_final: |-
  Una pieza visual, afiche para el colegio, publicación para redes o infografía sencilla, sobre un tema real del colegio, con los cuatro elementos en jerarquía clara: título, subtítulo, cuerpo y llamada a la acción. Y la crítica escrita de un afiche real mal diseñado, con lo que leíste primero, lo que no leíste y qué cambiarías.
apertura:
  origen: Pueblo inga de Santiago-Manoy (Alto Putumayo) · el chumbe y sus labores
  fuente: |-
    Aldana Barahona, G. M. y Sánchez Carballo, A. (2021). Tejer con la mente: el chumbe inga del Alto Putumayo colombiano como artefacto cultural y mental. \emph{Estudios Atacameños, 67}, e3521. https://doi.org/10.22199/issn.0718-1043-2021-0007
  saber_ancestral: |-
    En Santiago-Manoy, en el Alto Putumayo, las mujeres ingas tejen el \textbf{chumbe}: una faja de hasta cuatro metros de largo y ocho centímetros de ancho que protege el vientre. Antes de tejer, la tejedora elige los colores: uno para el fondo, otro para las \textbf{labores} y, si quiere, un tercero para los bordes. No más. Las labores son figuras geométricas con base en el rombo, y en 25 chumbes los investigadores contaron 46 distintas (Aldana Barahona y Sánchez Carballo, 2021). Cada labor se ve porque contrasta con el fondo: eso que los autores llaman preeminencia visual es lo que hace que el ojo la encuentre primero. Y cada labor se planea en la mente antes de pasar al telar; «el olvido de un punto hace que la labor no sea prolija», y se nota. La \textbf{cara de exclusión}: las labores ya se pasan a manillas y mochilas para la venta. Hay figuras de chumbes antiguos cuyo significado nadie recuerda. Y una tejedora, Ruby Rodríguez, dice que están «en amenaza de que tenemos que ser historia». Hoy vas a diseñar como se teje un chumbe: pocos colores, una figura que se lea primero, y todo planeado antes de tocar la herramienta.
  saber_contemporaneo: |-
    El \textbf{diseño visual} organiza los elementos de una página o pantalla para que comuniquen algo con claridad. Su herramienta central es la \textbf{jerarquía visual}: el orden en que el ojo recorre lo que hay. Quien mira un afiche decide en unos segundos si sigue leyendo. En esos segundos ve lo más grande, lo más contrastado y lo que está arriba. Una pieza bien hecha tiene cuatro elementos en jerarquía: el \textbf{título}, el mensaje en pocas palabras y en el tamaño mayor; el \textbf{subtítulo}, una o dos líneas que lo completan; el \textbf{cuerpo}, los datos que hacen falta, lugar, fecha, hora; y la \textbf{llamada a la acción}, lo que el lector debe hacer después: inscribirse, llegar, escribir. La jerarquía se construye con cuatro perillas: tamaño, peso de la letra, color y posición. Con dos o tres colores basta; con seis, todos compiten y ninguno gana.
  pregunta_puente: |-
    La tejedora inga elige tres colores y una labor que se vea primero. Si en tu afiche todo tiene el mismo tamaño y seis colores, ¿qué va a leer primero alguien que pasa en tres segundos?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} el recorrido del ojo en tres afiches reales; (2) \textbf{crear} una pieza visual con los cuatro elementos en jerarquía y máximo tres colores; (3) \textbf{evaluar} un afiche real mal diseñado con criterios concretos; (4) \textbf{explicar} qué perilla, tamaño, peso, color o posición, mueve cada decisión.
puentes:
  a_ruta: |-
    Cerraste el periodo 2 sustentando un proyecto técnico. El periodo 3 es multimedia y ciberética: hoy empieza por lo que se ve primero. En la sesión 2 vas a conectar varias piezas en una presentación con caminos.
  a_escuta: |-
    Antes de diseñar, vas a mirar tres afiches reales y anotar qué leíste primero. Tu propio ojo te va a decir dónde está la jerarquía.
  a_sistematizacion: |-
    Ya sabes por dónde entra el ojo. Ahora aprendes los cuatro elementos y las cuatro perillas, y con tu pareja bocetas la pieza en papel antes de abrir la herramienta.
  a_praxis: |-
    Ya tienes el boceto. Toca hacer la pieza en la herramienta, con tres colores y los cuatro elementos, y criticar un afiche real.
  a_producto: |-
    Lo que entregas hoy: la pieza terminada y la crítica del afiche. La prueba de calidad: tu pareja mira tu pieza tres segundos, la tapas, y dice de qué trata y qué hay que hacer.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Una pieza que se entiende en tres segundos vale más que una llena de información que nadie lee.
  a_triangulo: |-
    Para terminar, tres ideas sobre diseñar para otro, contadas con palabras de esta guía: Dussel sobre el rostro convertido en instrumento, Séneca sobre lo mucho que no nutre, y Floridi sobre el tiempo que no se comparte.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El recorrido del ojo} (15 min · individual). (1) Tu docente proyecta tres afiches reales: una campaña, un evento, un aviso de tienda. (2) Para cada uno, sin pensar mucho, anota qué leíste primero, qué segundo y qué no leíste nunca. (3) Anota qué hizo que lo primero fuera primero: ¿era más grande, más oscuro, estaba arriba? (4) Cuenta cuántos colores tiene cada afiche. (5) Elige el que peor se entiende y escribe en una línea por qué.
  checks:
  - Tengo el recorrido del ojo de los tres afiches, primero, segundo y nunca.
  - Anoté qué perilla hizo que lo primero fuera primero.
  - Conté los colores y elegí el afiche que peor se entiende.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- El recorrido del ojo». \textbf{Formato:} tabla de 3 filas y 4 columnas: afiche, primero, segundo, nunca; más el conteo de colores y la línea del peor. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} para cada afiche puedes decir qué se lee primero y por cuál perilla.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · CREA --- El boceto en papel} (30 min · parejas). (1) Con tu pareja, elijan un tema real del colegio: una jornada deportiva, una campaña contra el acoso, una invitación al festival. (2) Escriban el título en máximo siete palabras y el subtítulo en una línea. Escriban el cuerpo con lugar, fecha y hora, y la llamada a la acción en un verbo. (3) Dibujen en una hoja el rectángulo de la pieza y ubiquen los cuatro elementos con tamaños distintos: el título, el más grande. (4) Elijan tres colores: fondo, texto principal y acento, y anótenlos al margen. (5) Tapen el boceto, muéstrenlo tres segundos a otra pareja y pregunten qué leyeron primero.
  pilares:
  - |-
    \textbf{Los cuatro elementos.} Título: de qué trata, en el tamaño mayor, arriba o al centro. Subtítulo: una o dos líneas que completan. Cuerpo: los datos necesarios, lugar, fecha, hora, y nada más. Llamada a la acción: lo que el lector hace después, con un verbo, «inscríbete», «llega», «escribe».
  - |-
    \textbf{Las cuatro perillas.} Tamaño: lo grande se lee primero. Peso: la letra gruesa pesa más que la delgada. Color: el contraste con el fondo hace visible; el texto oscuro sobre fondo claro se lee, el gris sobre gris no. Posición: arriba y al centro se ve antes que abajo y a un lado.
  - |-
    \textbf{Tres colores, como el chumbe.} Un color de fondo, uno para el texto y uno de acento para lo que debe saltar. Con seis colores todo compite y nada se lee. La tejedora inga elige antes de empezar; tú también.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Escribir los cuatro textos. (2) Dibujar el rectángulo. (3) Ubicar el título grande y los demás más pequeños. (4) Elegir tres colores. (5) Probar tres segundos con alguien. (6) Corregir lo que no se leyó.
  anatomia:
    titulo: La jerarquía visual, en una mirada
    body: |-
      \textbf{Título:} lo más grande, de qué trata. \\[1mm] \textbf{Subtítulo:} una línea que completa. \\[1mm] \textbf{Cuerpo:} lugar, fecha, hora. \\[1mm] \textbf{Llamada a la acción:} un verbo. \\[1mm] \textbf{Perillas:} tamaño, peso, color, posición.
  errores_comunes: |-
    (1) \textbf{Todo del mismo tamaño}: el ojo no sabe por dónde entrar. (2) \textbf{Seis colores}: compiten entre sí y ninguno gana. (3) \textbf{Sin llamada a la acción}: el lector entiende y no sabe qué hacer. (4) \textbf{Cinco párrafos}: donde cabían cinco frases. (5) \textbf{Texto sobre fondo parecido}: gris sobre gris, amarillo sobre blanco, no se lee.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · CREA).} \textbf{Título:} «Actividad 2 --- El boceto en papel». \textbf{Formato:} el boceto con los cuatro elementos ubicados y de tamaños distintos, los tres colores anotados al margen y lo que dijo la otra pareja que leyó primero. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} la otra pareja leyó primero el título sin que se lo señalaras.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- La pieza y la crítica} (25 min · individual). (1) Abre Canva, Slides o la herramienta que indique tu docente y arma la pieza siguiendo tu boceto: cuatro elementos, tres colores. (2) Exporta la imagen o guarda el enlace. (3) Muéstrala tres segundos a tu pareja, tápala y pídele que diga de qué trata y qué hay que hacer. Anota si acertó. (4) Busca un afiche real mal diseñado, en el colegio, en la calle o en redes, y toma una foto. (5) Escribe la crítica: qué leíste primero, qué no leíste, cuántos colores tiene, qué perilla cambiarías y por qué.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) La pieza visual exportada o con enlace. (2) Lo que dijo tu pareja tras tres segundos. (3) La crítica del afiche real con su foto.
  - |-
    \textbf{La prueba de los tres segundos.} No la pasas explicando. La pasas si otra persona, sin ayuda, dice el tema y la acción. Si dice «algo del colegio», el título no manda. Si dice el tema pero no la acción, falta la llamada.
  - |-
    \textbf{Criticar con perillas, no con gusto.} «Es feo» no sirve. «El título tiene el mismo tamaño que la fecha, y el texto rojo sobre fondo naranja no se lee» sí sirve, porque dice qué cambiar.
  - |-
    \textbf{Un punto olvidado se nota.} En el chumbe, una labor con un punto de menos se ve. En tu pieza, un texto que se sale del borde o un color de más también. Revisa antes de exportar.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Título de máximo siete palabras en el tamaño mayor. \\[1mm] \checkbox Subtítulo, cuerpo y llamada a la acción, cada uno de un tamaño menor. \\[1mm] \checkbox Máximo tres colores, con contraste entre texto y fondo. \\[1mm] \checkbox Mi pareja dijo el tema y la acción tras tres segundos. \\[1mm] \checkbox Crítica de un afiche real con foto y las perillas que cambiaría. \\[1mm] \checkbox Pieza exportada o compartida con enlace.
  plantilla_guion: |-
    \textbf{Tema.} \textit{…} \\[1mm] \textbf{Título.} \textit{Siete palabras o menos.} \\[1mm] \textbf{Subtítulo.} \textit{Una línea.} \\[1mm] \textbf{Cuerpo.} \textit{Lugar, fecha, hora.} \\[1mm] \textbf{Llamada.} \textit{Un verbo.} \\[1mm] \textbf{Colores.} \textit{Fondo …, texto …, acento …}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- La pieza y la crítica». \textbf{Formato:} el enlace o nombre del archivo de la pieza, lo que dijo tu pareja, y la crítica del afiche real con foto pegada y las perillas que cambiarías. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} tu pareja acertó tema y acción, y tu crítica nombra al menos dos perillas.
  producto_titulo: Pieza visual con cuatro elementos y tres colores + prueba de tres segundos + crítica de un afiche real
  criterios:
  - La pieza tiene título, subtítulo, cuerpo y llamada a la acción, cada uno de un tamaño distinto
  - Usa máximo tres colores y el texto contrasta con el fondo
  - Tu pareja dijo el tema y la acción tras mirarla tres segundos
  - La crítica del afiche real dice qué se leyó primero y qué no
  - La crítica nombra al menos dos perillas que cambiarías y por qué
  - La pieza está exportada o compartida con enlace
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.5.6.3
    idea: |-
      La máquina puede convertir el rostro de la persona en un instrumento de sí misma.
    aplicacion: |-
      Un afiche que grita con seis colores para atrapar la mirada trata al lector como instrumento. Uno que dice en tres segundos de qué trata y qué hacer lo trata como persona con poco tiempo.
    pregunta_espejo: |-
      ¿Mi pieza le sirve a quien la mira, o solo quiere que la mire?
  estoico:
    autor: Séneca · Cartas a Lucilio, 2 (c. 64 d.C.)
    idea: |-
      Lo mucho y lo muy variado no alimenta; empalaga.
    aplicacion: |-
      Cinco párrafos y seis colores en un afiche no informan más: cansan antes de que alguien lea el título. La tejedora inga elige tres colores por eso.
    pregunta_espejo: |-
      ¿Qué le sobra a mi pieza que creí que la hacía más completa?
  floridi:
    autor: Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 4.6
    idea: |-
      Lo único de verdad finito, precioso y que no se puede compartir es el tiempo.
    aplicacion: |-
      Quien pasa por el corredor te da tres segundos. La jerarquía visual es la forma de devolverle ese tiempo con algo entendido, en vez de gastárselo.
    pregunta_espejo: |-
      ¿Qué cosa que diseñé esta semana le hizo perder tiempo a alguien?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu pieza y la crítica. En la sesión 2 vas a conectar varias piezas en una presentación con caminos: menús, saltos y regresos. La jerarquía de hoy es lo que hace que cada pantalla se entienda sola.
web:
  resumen: |-
    La jerarquía visual decide qué se lee primero: tamaño, peso, color y posición. Hoy diseñas una pieza con cuatro elementos y tres colores, como la tejedora inga que elige fondo, labor y borde antes de tejer el chumbe.
  subtema: Multimedia y ciberética
  pre_lectura:
    por_que_importa: |-
      Cada afiche, publicación y pantalla que ves fue diseñada por alguien que decidió qué verías primero. Saber hacerlo es saber comunicar sin que te expliquen.
    pregunta_detonante: |-
      Si en tu afiche todo tiene el mismo tamaño y seis colores, ¿qué va a leer primero alguien que pasa en tres segundos?
    activacion:
      titulo: Tres segundos en el corredor
      descripcion: |-
        En 3 minutos, recuerda un afiche que viste hoy en el colegio. ¿De qué trataba? ¿Qué había que hacer? Si no lo recuerdas, ¿qué crees que falló?
      duracion_min: 5
    conexion:
      anterior: En la sesión 10 del periodo 2 sustentaste tu proyecto con el micro:bit en vivo.
      siguiente: En la sesión 2 conectas piezas en una presentación con menús y regresos.

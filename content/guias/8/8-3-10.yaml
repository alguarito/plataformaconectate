clave: 3-10
grado: 8
periodo: 3
sesion: 10
completo: true
duracion_min: 90
titulo: Sustentación pública y portafolio digital del grado 8
titulo_portada: |-
  Sustentación pública
  y portafolio digital
  del grado 8
producto_final: |-
  El cierre del año en tres piezas: un portafolio digital con seis trabajos curados de los tres periodos, cada uno con dos o tres líneas que digan qué demuestra; una carta abierta de cuatro párrafos, con algo concreto aprendido en cada periodo y un compromiso para noveno, firmada y fechada; y la sustentación pública de diez minutos, con demostración en vivo del proyecto integrador y cinco minutos de preguntas del grupo.
apertura:
  origen: Cabildos del Cauca · la autoridad que se recibe y se devuelve al año
  fuente: |-
    Presidencia de la República de Colombia. (1995, 7 de diciembre). \emph{Decreto 2164 de 1995}.
  saber_ancestral: |-
    En los pueblos indígenas del Cauca, la autoridad no se toma: se recibe y se devuelve. El \textbf{cabildo} es elegido y reconocido por la propia comunidad, y su periodo dura un año. Así lo define el Decreto 2164 de 1995: una entidad pública especial, «elegidos y reconocidos por ésta». A quien recibe el cargo se le entrega un bastón de mando de madera de chonta con cintas de colores. Lo carga durante ese año y después pasa a otra persona. Desde 1991, el artículo 246 de la Constitución reconoce que esas autoridades pueden juzgar dentro de su territorio con sus propias normas. Lo que enseña esa figura es preciso: el mandato es temporal y termina rindiendo cuentas. La \textbf{cara de exclusión} está en el origen legal. La ley de 1890 que reconoció los cabildos lleva un título explícitamente racista, y la Corte Constitucional ya derribó tres de sus artículos. Hoy te toca a ti devolver lo que recibiste durante un año, delante de tu grupo.
  saber_contemporaneo: |-
    Una sustentación de diez minutos no es un resumen del año: es una selección. Tiene cuatro bloques con tiempo asignado. \textbf{Proyecto integrador} (3 min): qué hace, la voz de la persona afectada y la propuesta. \textbf{Recorrido del portafolio} (3 min): cuatro o cinco piezas y qué demuestra cada una. \textbf{Carta abierta} (2 min): se lee completa. \textbf{Cierre} (2 min): qué te llevas a noveno. Después vienen cinco minutos de preguntas. El \textbf{portafolio digital} puede ser una carpeta compartida, un sitio sencillo o un blog. El formato da igual; lo que importa son tres cosas. Que cualquiera con el enlace pueda verlo. Que esté organizado por periodos. Que cada pieza tenga dos o tres líneas explicando qué demuestra. Un archivo suelto sin descripción no comunica nada a quien no estuvo en la clase.
  pregunta_puente: |-
    El cabildo devuelve el bastón al año y rinde cuentas de lo que hizo con él. Tú vas a devolver un año de trabajo en diez minutos. ¿Qué seis piezas cuentan de verdad lo que aprendiste?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} tu producción del año y curar seis piezas que demuestren aprendizaje, no facilidad; (2) \textbf{explicar} la estructura de la sustentación, del portafolio y de la carta, con su tiempo asignado; (3) \textbf{crear} el portafolio digital, la carta abierta firmada y la sustentación de diez minutos.
puentes:
  a_ruta: |-
    El año empieza con datos, sigue con lógica y sensores y termina con multimedia y ética. En la sesión 9 juntaste todo en un proyecto sobre un problema real. Hoy lo sustentas y armas el portafolio con el que llegas a noveno.
  a_escuta: |-
    Antes de la teoría vas a revisar tu propia producción. Cuadernos, archivos, proyectos de los tres periodos. De ahí salen las seis piezas del portafolio, y elegir es la parte difícil.
  a_sistematizacion: |-
    Ya tienes la selección. Ahora vas a montar el plan minuto a minuto de los diez, el esqueleto del portafolio y la plantilla de la carta.
  a_praxis: |-
    Tienes el plan. Toca ejecutarlo: armar el portafolio, escribir la carta, ensayar con cronómetro y sustentar delante del grupo.
  a_producto: |-
    Lo que entregas hoy: el enlace del portafolio, la carta firmada y la sustentación hecha. La prueba de calidad: alguien que no estuvo en tus clases entiende, con solo abrir el portafolio, qué aprendiste.
  a_evaluacion: |-
    Antes de cerrar, mira el año desde cinco lados. Reconocer con orgullo lo que salió bien y con honestidad lo que quedó a medias son la misma virtud, no dos.
  a_triangulo: |-
    Para terminar, tres ideas sobre elegir y rendir cuentas, contadas con palabras de esta guía: Dussel sobre saber perder tiempo para elegir, Marco Aurelio sobre aceptar la corrección, Floridi sobre la abundancia que produce olvido.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Curaduría del año} (15 min · individual). (1) Revisa tus cuadernos y tus archivos de los tres periodos. (2) Elige máximo seis piezas: dos por periodo, más el proyecto integrador. (3) Elige las que mejor muestren lo que aprendiste, no las que te salieron fáciles. (4) Escribe al lado de cada una, en una línea, qué demuestra. (5) Marca cuál pondrías primera si solo pudieras mostrar una.
  checks:
  - Revisé piezas de los tres periodos.
  - Elegí máximo seis y escribí qué demuestra cada una.
  - Marqué cuál pondría primera si solo pudiera mostrar una.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} \textbf{Título:} «Actividad 1 --- Curaduría del año». \textbf{Formato:} lista de seis piezas con una línea cada una sobre qué demuestra, y la marca en la que iría primera. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} ninguna de las seis está por ser la más fácil.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- El plan de los diez minutos} (30 min · parejas). (1) Con tu pareja, escriban el plan minuto a minuto de los cuatro bloques. (2) Armen el esqueleto del portafolio: los tres periodos y las seis piezas en su sitio. (3) Escriban la primera frase de cada párrafo de la carta, la que dice qué aprendieron en concreto. (4) Explíquenle su plan al otro en tres minutos y anoten qué no se entendió.
  pilares:
  - |-
    \textbf{Los cuatro bloques, con su tiempo.} Proyecto integrador, tres minutos: qué hace, la voz de la persona y la propuesta. Recorrido del portafolio, tres minutos: cuatro o cinco piezas. Carta abierta, dos minutos: se lee completa. Cierre, dos minutos: qué te llevas a noveno. Después, cinco minutos de preguntas.
  - |-
    \textbf{El portafolio se juzga por las descripciones.} Un archivo suelto no dice nada a quien no estuvo en clase. Dos o tres líneas por pieza, con qué problema resolvía y qué aprendiste haciéndola. Eso es lo que convierte una carpeta en un portafolio.
  - |-
    \textbf{La carta, en cuatro párrafos.} Uno por periodo, cada uno con una cosa concreta, y el cuarto con un compromiso para noveno. Cierra con tu nombre completo y la fecha. Un párrafo bueno dice qué pasó: «el promedio del grupo era cuatro horas, pero un compañero tenía once». Uno malo dice «aprendí cosas sobre datos».
  - |-
    \textbf{Orgullo honesto, no falsa modestia.} Di con orgullo lo que hiciste bien y con honestidad lo que quedó a medias. «Mi micro:bit todavía falla cuando cambia la luz» y «armé un proyecto sobre el semáforo de mi cuadra» caben en la misma sustentación.
  anatomia:
    titulo: El cierre del grado 8, en una mirada
    body: |-
      \textbf{Sustentación (10 min):} proyecto 3 / portafolio 3 / carta 2 / cierre 2. \\[1mm] \textbf{Preguntas:} 5 minutos con honestidad. \\[1mm] \textbf{Portafolio:} 6 piezas con 2 o 3 líneas cada una. \\[1mm] \textbf{Carta:} 4 párrafos, nombre y fecha.
  errores_comunes: |-
    (1) \textbf{Leer las diapositivas}: si se leen, sobra quien sustenta. (2) \textbf{Portafolio de archivos sueltos}: sin descripción, nadie sabe qué está viendo. (3) \textbf{Carta genérica}: «aprendí mucho» no es un párrafo, es un relleno. (4) \textbf{Esquivar la pregunta difícil}: se nota más esquivarla que no saber. (5) \textbf{Mostrar todo el año}: seleccionar seis piezas es parte de lo que se evalúa.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- El plan de los diez minutos». \textbf{Formato:} el plan minuto a minuto, el esqueleto del portafolio por periodos y la primera frase de cada párrafo de la carta. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tu pareja te dijo qué parte de tu plan no se entendió.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Portafolio, carta y sustentación} (25 min · individual). (1) Arma el portafolio con las seis piezas y sus descripciones. (2) Escribe la carta abierta de cuatro párrafos, fírmala y féchala. (3) Ensaya con cronómetro por lo menos dos veces. (4) Sustenta delante del grupo, con la demostración en vivo del proyecto integrador. (5) Responde las preguntas y anota la que te costó más. La sesión alcanza para armar y ensayar; el portafolio se termina en casa.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} El enlace del portafolio, abierto para cualquiera que lo tenga. La carta abierta firmada y fechada. La sustentación hecha dentro de los diez minutos.
  - |-
    \textbf{Ensayar con cronómetro cambia el resultado.} Casi todo el mundo se pasa la primera vez. La segunda ronda es la que ajusta qué se cae. Si algo hay que recortar, se recorta del recorrido del portafolio, nunca de la carta.
  - |-
    \textbf{La demostración en vivo se prepara para que falle.} Ten la pieza descargada y una captura de respaldo. Si algo no carga, sigues hablando. Que la conexión falle no es tu error; quedarte en blanco, sí.
  - |-
    \textbf{Las preguntas son la parte que más se recuerda.} Contesta lo que sabes, y donde no sepas, dilo y di qué averiguarías. Cambiar de opinión delante de quien te corrige no debilita la sustentación: la termina de sostener.
  checklist:
    titulo: Antes de sustentar
    items: |-
      \checkbox Portafolio armado y con el enlace abierto para quien lo tenga. \\[1mm] \checkbox Las seis piezas con dos o tres líneas cada una. \\[1mm] \checkbox Carta abierta de cuatro párrafos, firmada y fechada. \\[1mm] \checkbox Ensayo cronometrado por lo menos dos veces. \\[1mm] \checkbox Proyecto integrador listo para demostrar en vivo. \\[1mm] \checkbox Respaldo descargado por si falla la conexión. \\[1mm] \checkbox Sustentación dentro de los diez minutos.
  plantilla_guion: |-
    \textbf{Proyecto (3 min).} \textit{Qué hace, la voz, la propuesta.} \\[1mm] \textbf{Portafolio (3 min).} \textit{Cuatro o cinco piezas y qué demuestran.} \\[1mm] \textbf{Carta (2 min).} \textit{Cuatro párrafos leídos completos.} \\[1mm] \textbf{Cierre (2 min).} \textit{Qué me llevo a noveno.} \\[1mm] \textbf{Preguntas (5 min).} \textit{Lo que sé y lo que averiguaría.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Portafolio, carta y sustentación». \textbf{Formato:} el enlace del portafolio, la carta completa, el plan minuto a minuto y las preguntas que te hicieron con lo que respondiste. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} anotaste la pregunta que más te costó y qué averiguarías para responderla mejor.
  producto_titulo: Portafolio digital de seis piezas + carta abierta firmada + sustentación de diez minutos
  criterios:
  - El portafolio tiene seis piezas de los tres periodos, cada una con su descripción
  - El enlace lo puede abrir cualquiera que lo tenga
  - La carta tiene cuatro párrafos concretos, nombre y fecha
  - La sustentación cabe en diez minutos e incluye demostración en vivo
  - Las preguntas se respondieron diciendo también lo que no se sabía
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §5.9.4.1
    idea: |-
      Como los temas son infinitos y el tiempo corto, hay que saber perder tiempo eligiendo cuáles importan.
    aplicacion: |-
      Los quince minutos que dedicas a escoger seis piezas valen más que una hora armando el portafolio con todo. Elegir es el trabajo; lo demás es montaje.
    pregunta_espejo: |-
      ¿Qué dejé fuera del portafolio, y estoy seguro de por qué?
  estoico:
    autor: Marco Aurelio · Meditaciones VIII, 16 (c. 175 d.C.)
    idea: |-
      Eres igual de libre para cambiar de parecer que para seguir el consejo de quien te corrige.
    aplicacion: |-
      En los cinco minutos de preguntas alguien va a señalar algo que no habías visto. Aceptarlo en el momento no te resta: muestra que entendiste tu propio trabajo lo bastante como para revisarlo.
    pregunta_espejo: |-
      ¿Qué me dijeron hoy que me hizo cambiar de opinión sobre algo que ya daba por hecho?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 2.3
    idea: |-
      La abundancia de información también produce sobrecarga, distracción y olvido.
    aplicacion: |-
      Un portafolio con treinta archivos sueltos no se lee: se cierra. Seis piezas con su descripción se recuerdan. Guardar todo es la forma más segura de que no quede nada.
    pregunta_espejo: |-
      ¿Mi portafolio ayuda a recordar lo que hice, o solo acumula lo que hice?
compromiso: |-
  \textbf{Para el año que viene.} Guarda el enlace del portafolio donde puedas encontrarlo en enero. La carta firmada es tuya, no del colegio. En noveno vas a trabajar con bases de datos y con análisis de información, y el proyecto de este año es el punto de partida.
web:
  resumen: |-
    En los cabildos del Cauca la autoridad se recibe y se devuelve al año, y quien la tuvo rinde cuentas. Hoy devuelves un año de trabajo en diez minutos: seis piezas curadas en un portafolio digital, una carta abierta de cuatro párrafos y la sustentación pública con demostración en vivo del proyecto integrador.
  subtema: Cierre del año · sustentación y portafolio
  pre_lectura:
    por_que_importa: |-
      Un portafolio con descripciones lo entiende alguien que no estuvo en tus clases. Sin ellas, es una carpeta de archivos que nadie va a abrir dos veces.
    pregunta_detonante: |-
      Si solo pudieras mostrar una pieza de todo el año, ¿cuál sería y qué demuestra?
    activacion:
      titulo: La primera pieza
      descripcion: |-
        En 2 minutos, escribe cuál trabajo del año mostrarías primero y qué aprendiste haciéndolo. Sin adjetivos: qué aprendiste.
      duracion_min: 5
    conexion:
      anterior: En la sesión 9 armaste el proyecto integrador sobre un problema real de tu entorno.
      siguiente: En noveno trabajas con bases de datos y análisis de información, partiendo de este proyecto.

clave: 3-10
grado: 8
periodo: 3
sesion: 10
completo: true
titulo: Sustentación pública y portafolio digital del grado 8
titulo_portada: |-
  Sustentación pública
  y portafolio digital ---
  cierre del grado 8
producto_final: |-
  Sustentación pública de 10 minutos del proyecto integrador comunitario + portafolio digital (carpeta Drive, sitio Google Sites o blog) con piezas seleccionadas de los 3 periodos del año (al menos 1 pieza por periodo más el proyecto integrador) + carta abierta de cierre del grado 8 firmada con nombre y fecha, leída en la sustentación + sesión de preguntas y respuestas de 5 minutos con la audiencia
apertura:
  saber_ancestral: |-
    En los talleres antiguos del Valle del Cauca, en las comunidades indígenas del Pacífico, en los gremios tradicionales europeos que llegaron al continente, había un acto ritual que marcaba el paso de aprendiz a oficial: \textbf{la graduación frente a los mayores del oficio}. El aprendiz que había trabajado un año bajo el maestro debía presentar su \textbf{pieza maestra}: la obra que demostraba que el oficio había sido aprendido. Esa presentación ocurría en público, en un día señalado, ante \textbf{el maestro, los oficiales viejos y los aprendices más jóvenes del taller}. El aprendiz exponía su pieza, contaba cómo la hizo, declaraba sus dificultades. Los mayores hacían preguntas técnicas y a veces incómodas. Si el aprendiz defendía con honestidad y competencia, los mayores le entregaban el \textbf{título del oficio}: ya no era aprendiz, era \emph{oficial}. Si la defensa flaqueaba, volvía al taller por otro año. La sabiduría era inquebrantable: \textbf{el oficio se certifica ante quienes lo conocen, no en privado}. Ese ritual es exactamente lo que cierra el año escolar: la sustentación pública del proyecto integrador frente a la comunidad del grupo es la versión contemporánea de la graduación del aprendiz.
  origen: Palabras de cierre en cabildos, mingas y asambleas tradicionales colombianas
  saber_contemporaneo: |-
    La \textbf{sustentación pública} del cierre de año es el acto formal donde el estudiante presenta su proyecto integrador (sesión 9) y demuestra las habilidades aprendidas durante los 3 periodos. La acompaña el \textbf{portafolio digital}: una recopilación seleccionada de las piezas producidas durante el año, organizadas para que cualquiera pueda navegarlas y entender qué se aprendió. La regla profesional: \textbf{el portafolio no es archivo de todo lo hecho; es selección curada de lo mejor}. Cualquier productor profesional contemporáneo (diseñador, programador, escritor, fotógrafo) mantiene un portafolio: es la primera carta de presentación para nuevos clientes, empleadores, programas educativos. La \textbf{carta abierta de cierre del grado} es el documento personal que el estudiante escribe en primera persona, declarando qué aprendió, qué le marcó, qué se compromete a hacer con lo aprendido en el siguiente grado. Es la firma personal del año escolar. La sustentación tiene 3 propiedades irrenunciables: tiempo controlado (10 min), demostración real (no solo descripción), honestidad ante preguntas duras.
  pregunta_puente: |-
    ¿Qué sabía el aprendiz al sentarse frente a los mayores para defender su pieza maestra, que el estudiante novato olvida cuando confunde sustentación con leer slides? ¿Y por qué el portafolio digital es la primera carta de presentación profesional para todo lo que venga después del grado 8?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} las piezas producidas en los 3 periodos del año y seleccionar las que mejor representan tu aprendizaje; (2) \textbf{explicar} en la sustentación pública qué hace tu proyecto integrador, qué aprendiste y qué te falta; (3) \textbf{evaluar} con honestidad las preguntas duras de la audiencia, reconociendo lo que aún no sabes; (4) \textbf{crear} el portafolio digital y la carta abierta de cierre del grado.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Has recorrido 29 sesiones durante el año: datos con phronesis (P1), lógica y micro:bit (P2), multimedia y ciberética (P3). Hoy todo eso \textbf{se cierra en público}. Después de hoy, el grado 8 termina; lo que sigue es el grado 9. La sustentación de hoy es la firma del año.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{curaduría rápida}: revisas tus cuadernos, archivos y referencias de los 3 periodos y eliges las piezas que pondrías en tu portafolio. Reglas: máximo 6 piezas (2 por periodo + proyecto integrador), las que mejor muestren lo que aprendiste, no las más fáciles.
  a_sistematizacion: |-
    Ya tienes curaduría. Ahora vas a entender la \textbf{anatomía de la sustentación de 10 minutos + portafolio digital + carta abierta}: la estructura, los formatos del portafolio (Drive, Sites, blog), los 7 errores típicos del sustentante novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: armas el portafolio, escribes la carta, ensayas la sustentación, sustentas en público, respondes preguntas.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: sustentación + portafolio + carta. El criterio principal: que un familiar o profesor que no conoce tu año entero pueda entender, viendo tu portafolio y leyendo tu carta, qué aprendió este estudiante.
  a_evaluacion: |-
    Antes de cerrar, mira la sustentación desde las cinco dimensiones humanas. Cerrar con honestidad y orgullo es respeto por el año entero; cerrar con improvisación es traición al trabajo de 29 sesiones.
  a_triangulo: |-
    Y para terminar, tres voces sobre el cierre del oficio. Dussel sobre el aprendiz que devuelve a la comunidad lo aprendido, Marco Aurelio sobre la honestidad del cierre, Floridi sobre el portafolio como identidad digital responsable.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Curaduría del año} (15 min · individual). Revisa tus cuadernos, archivos digitales y referencias de los 3 periodos. Elige las piezas que pondrías en tu portafolio. Reglas: (1) máximo 6 piezas (2 por periodo + proyecto integrador). (2) las que mejor muestren lo que aprendiste, no las más fáciles. (3) para cada pieza, anota en 1 línea por qué la elegiste. Ejemplos de piezas posibles: el mini-estudio del P1, la coreografía del micro:bit del P2, la pieza multimedia con estética liberación del P3, el discurso TED, el proyecto integrador.
  checks:
  - Revisé piezas de los 3 periodos.
  - Elegí máximo 6 piezas.
  - Para cada una, justifiqué la elección en 1 línea.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Curaduría del año». \textbf{Formato:} lista de 6 piezas con 1 línea de justificación por cada una. \textbf{Sabes que terminaste cuando} tu selección demuestra lo aprendido en los 3 periodos.
sistematizacion:
  intro: |-
    Tu curaduría es la base. Ahora necesitas la \textbf{anatomía profesional} de la sustentación + portafolio + carta.
  pilares:
  - |-
    La \textbf{estructura de la sustentación de 10 minutos} se descomponen así (con tiempo asignado): (1) \textbf{Intro y proyecto integrador} (3 min): qué hace tu proyecto, voz del afectado, propuesta. (2) \textbf{Recorrido del portafolio} (3 min): 4-5 piezas del año explicadas brevemente, qué demuestra cada una. (3) \textbf{Carta abierta} (2 min): lectura de la carta de cierre. (4) \textbf{Cierre} (1 min): qué se llevan al grado 9. (5) \textbf{Q\&A} (5 min adicionales): 3-5 preguntas de la audiencia.
  - |-
    Los \textbf{formatos del portafolio digital} más usados: (a) \textbf{Carpeta Drive compartida}: simple, rápido, fácil de compartir. (b) \textbf{Google Sites}: gratis, permite estructura web simple con páginas y galerías. (c) \textbf{Blog gratuito} (Blogger, WordPress.com): si quieres formato cronológico. Cualquiera sirve; lo importante es que (1) cualquier persona con el link pueda verlo, (2) tenga estructura por periodos, (3) cada pieza tenga una descripción de 2-3 líneas.
  - |-
    La \textbf{carta abierta} tiene estructura mínima de 4 párrafos: (a) \textbf{Lo que aprendí del P1} (datos con phronesis): 1 cosa concreta. (b) \textbf{Lo que aprendí del P2} (lógica y micro:bit): 1 cosa concreta. (c) \textbf{Lo que aprendí del P3} (multimedia y ciberética): 1 cosa concreta. (d) \textbf{Compromiso para el grado 9}: 1 acción que te llevas. Cierra con nombre completo + fecha. Es la firma personal del año.
  - |-
    Los \textbf{7 errores típicos} del sustentante novato: (1) Leer las slides. (2) Portafolio sin descripciones (solo archivos sueltos). (3) Carta genérica sin compromiso específico. (4) Evadir preguntas duras. (5) Pasarse del tiempo. (6) Mostrar todo el trabajo del año en lugar de curar 4-5 piezas. (7) Cierre débil sin proyección al siguiente grado.
  anatomia:
    titulo: Anatomía del cierre del año
    body: |-
      \textbf{Sustentación (10 min):} proyecto + portafolio + carta + cierre. \\[1mm] \textbf{Portafolio:} 6 piezas curadas con descripciones. \\[1mm] \textbf{Carta:} 4 párrafos + nombre + fecha. \\[1mm] \textbf{Q\&A:} 5 minutos con honestidad.
  errores_comunes: |-
    (1) Leer las slides en lugar de contar. (2) Portafolio sin descripciones útiles. (3) Carta genérica sin compromiso. (4) Evadir preguntas duras. (5) Pasarse del tiempo. (6) Mostrar todo en lugar de seleccionar. (7) Cierre sin proyección al grado 9.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Anatomía del cierre». \textbf{Formato:} (a) plan minuto a minuto de los 10 min; (b) plantilla del portafolio; (c) plantilla de la carta; (d) los 7 errores con marca. \textbf{Sabes que terminaste cuando} tienes plan completo para sustentar mañana.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- Sustentación ejecutada + portafolio + carta} (60 min en sesión + producción del portafolio en la semana · individual). Hora de ejecutar. Armas portafolio, escribes carta, ensayas, sustentas con demo, respondes preguntas.
  pilares:
  - |-
    Tu cierre se construye en 7 pasos: (1) armar el portafolio digital con las 6 piezas curadas + descripciones. (2) escribir carta abierta de 4 párrafos. (3) preparar slides simples (o usar el portafolio mismo como apoyo visual). (4) ensayar cronometrado al menos 2 veces. (5) sustentar en público con demo del proyecto integrador. (6) leer la carta. (7) responder preguntas con honestidad.
  - |-
    Sigue el patrón \textbf{``orgullo honesto sobre falsa modestia''}: el cierre del año no es momento de inflar logros ni de subestimarlos. Reconoce con orgullo lo que hiciste bien (\emph{``aprendí a calibrar sensores''}, \emph{``hice un proyecto sobre el problema del semáforo de la cuadra''}) y declara con honestidad lo que aún te falta (\emph{``mi micro:bit a veces falla por umbrales no perfectamente ajustados''}, \emph{``mi propuesta de mejora todavía no se ha presentado a la JAC''}). Ambos lados son virtud.
  - |-
    La carta abierta es la firma personal: debe ser \textbf{específica}, no genérica. Ejemplo de párrafo bueno: \emph{``En el P1 aprendí que el promedio puede engañar; cuando hice mi mini-estudio sobre tiempo de pantalla, el promedio del grupo era 4 horas, pero el MAX era 11 horas en un compañero que se quedaba sin dormir''}. Ejemplo de párrafo malo: \emph{``En el P1 aprendí cosas sobre datos''}.
  - |-
    Algoritmo: (1) armar portafolio (2 horas en casa). (2) escribir carta. (3) ensayar. (4) sustentar. (5) responder. (6) entregar al docente: link del portafolio + carta firmada + grabación de la sustentación (si se grabó).
  checklist:
    titulo: Checklist antes de sustentar
    items: |-
      \checkbox Portafolio digital armado y compartido. \\[1mm] \checkbox 6 piezas con descripciones. \\[1mm] \checkbox Carta abierta de 4 párrafos firmada. \\[1mm] \checkbox Sustentación ensayada cronometrada. \\[1mm] \checkbox Proyecto integrador listo para demo. \\[1mm] \checkbox Sustentación dentro de 10 minutos. \\[1mm] \checkbox Q\&A con honestidad. \\[1mm] \checkbox Link del portafolio entregado.
  plantilla_guion: |-
    \textbf{Intro + proyecto (3 min).} \textit{Qué hace, voz del afectado.} \\[1mm] \textbf{Portafolio (3 min).} \textit{4-5 piezas explicadas.} \\[1mm] \textbf{Carta (2 min).} \textit{4 párrafos leídos.} \\[1mm] \textbf{Cierre (1 min).} \textit{Proyección al grado 9.} \\[1mm] \textbf{Q\&A (5 min).} \textit{Preguntas con honestidad.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Cierre del grado 8». \textbf{Formato:} (a) link del portafolio; (b) carta abierta completa; (c) plan minuto a minuto; (d) preguntas recibidas con respuestas. \textbf{Sabes que terminaste cuando} entregaste todo y reservaste tiempo para reflexión personal.
  producto_titulo: Sustentación 10 min + portafolio digital + carta abierta firmada
  criterios:
  - Portafolio con 6 piezas curadas y descripciones
  - Carta abierta de 4 párrafos específicos
  - Sustentación dentro de 10 minutos
  - Demo en vivo del proyecto integrador
  - Preguntas y respuestas con honestidad
  - Link del portafolio compartible
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El aprendiz que regresa a la comunidad con oficio asumido cierra el ciclo de la pedagogía liberadora.
    aplicacion: |-
      Tu sustentación devuelve a tu grupo lo aprendido. La filosofía de la liberación reconoce ese acto: el saber no se acumula privadamente; se devuelve a la comunidad que te formó. Cuando lees tu carta abierta y muestras tu portafolio, estás cerrando el ciclo: \textbf{lo recibido vuelve hecho voz propia}. La phronesis del cierre consiste en \textbf{devolver con orgullo y humildad lo aprendido}.
    pregunta_espejo: |-
      ¿Mi sustentación devuelve oficio asumido, o solo presenta archivo sin transformación personal?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Reconocer con honestidad lo que se aprendió y lo que falta es virtud final del año; inflar logros es debilidad.
    aplicacion: |-
      Es tentador inflar el cierre del año. La disciplina estoica recomienda lo opuesto: \emph{declara con honestidad lo aprendido y lo pendiente}. Esa precisión gana respeto. El estudiante que declara \emph{``aprendí X pero me falta Y''} es más profesional que el que pretende dominio total. La phronesis del cierre honra la verdad del proceso.
    pregunta_espejo: |-
      ¿Mi sustentación declara con honestidad lo que aprendí y lo que aún me falta?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El portafolio digital responsable es la nueva carta de presentación del profesional en la era de la información distribuida.
    aplicacion: |-
      En la era digital, los portafolios son la primera carta de presentación. Tu portafolio de hoy te entrena en una práctica que rige toda profesión técnica del siglo XXI: \textbf{construir identidad digital responsable que demuestre habilidades con evidencia}. Aunque sea portafolio escolar, las prácticas son las mismas que aplicarás en universidad y en trabajo.
    pregunta_espejo: |-
      ¿Mi portafolio es identidad digital responsable que demuestra habilidades, o solo es archivo escolar disfrazado?
compromiso: |-
  \textbf{Después del grado 8.} Tu portafolio y carta abierta son el cierre formal del año, pero también el primer documento de tu trayectoria digital adulta. Guarda copia personal. Cuando entres al grado 9 y a los siguientes, revisa estas piezas: te servirán como referencia de oficio. Que el portafolio crezca cada año hasta convertirse en tu carta de presentación cuando termines el bachillerato.
web:
  conceptos_clave:
    - termino: Sustentación pública
      definicion: |-
        Acto formal de cierre del año. Presentación del proyecto integrador con tiempo controlado, demo real y honestidad ante preguntas.
      ejemplo: |-
        10 minutos donde muestras el proyecto, demuestras lo que funciona y respondes preguntas sin inventar.
      emoji: "🎤"
    - termino: Portafolio digital
      definicion: |-
        Selección curada de las mejores piezas producidas durante el año. No es archivo de todo lo hecho.
      ejemplo: |-
        De 30 piezas producidas, eliges las 6 mejores y las organizas con índice, descripción y enlace. Eso es portafolio.
      emoji: "🗂️"
    - termino: Selección curada
      definicion: |-
        Decisión consciente de qué piezas representan mejor lo aprendido. Calidad sobre cantidad, con criterio explícito.
      ejemplo: |-
        Eliges el podcast comunitario por sobre 5 podcasts más, porque ese muestra mejor tu manejo del audio y de la voz del afectado.
      emoji: "✂️"
    - termino: Carta abierta de cierre
      definicion: |-
        Documento personal en primera persona donde declaras qué aprendiste, qué te marcó y a qué te comprometes para el grado siguiente.
      ejemplo: |-
        "Este año aprendí a editar audio y a respetar el consentimiento. Me comprometo a usarlo el año entrante en proyectos del aula."
      emoji: "✉️"
    - termino: Honestidad ante preguntas duras
      definicion: |-
        Tercera propiedad irrenunciable de la sustentación. Reconocer lo no resuelto en lugar de inventar respuestas que apenas tapan.
      ejemplo: |-
        "Esa parte aún no la tengo lista; lo que tengo claro es por dónde voy a empezar a resolverla." Respuesta honesta y profesional.
      emoji: "🤝"
  quiz:
    titulo: ¿Cierras el grado con portafolio profesional?
    instrucciones: 5 preguntas para verificar que entiendes la sustentación y el portafolio digital.
    preguntas:
      - enunciado: ¿Qué diferencia un portafolio de un archivo de todo lo hecho?
        opciones:
          - Nada, son lo mismo
          - El portafolio es más grande
          - El portafolio es selección curada de lo mejor; el archivo es todo
          - El portafolio se imprime
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Portafolio es curaduría: lo mejor seleccionado con criterio. Archivo es todo, sin filtro.
        feedback_incorrecto: |-
          La diferencia es la curaduría. Portafolio selecciona lo mejor con criterio; archivo guarda todo sin filtro.
      - enunciado: ¿Cuántos minutos dura la sustentación pública de cierre?
        opciones:
          - "3"
          - "10"
          - "30"
          - "60"
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. 10 minutos. Tiempo controlado para presentar el proyecto y demostrar habilidades en demo real.
        feedback_incorrecto: |-
          Son 10 minutos. Tiempo controlado obliga a curar el mensaje, mostrar lo esencial y dejar espacio para preguntas.
      - enunciado: ¿Qué propiedad NO es irrenunciable de la sustentación?
        opciones:
          - Efectos visuales llamativos
          - Tiempo controlado
          - Demostración real (no solo descripción)
          - Honestidad ante preguntas duras
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Los efectos visuales son decoración opcional. Lo irrenunciable es tiempo, demo y honestidad.
        feedback_incorrecto: |-
          Los efectos visuales son decoración. Lo irrenunciable es tiempo controlado, demo real y honestidad ante preguntas.
      - enunciado: La carta abierta de cierre se escribe en...
        opciones:
          - Tercera persona impersonal
          - Latín
          - Solo con emojis
          - Primera persona, como declaración personal
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. Primera persona. Es declaración personal de aprendizaje y compromiso, no informe institucional.
        feedback_incorrecto: |-
          Va en primera persona. Es la firma personal del año: lo que aprendiste, lo que te marcó, a qué te comprometes.
      - enunciado: Un examinador detecta un punto que no resuelves. ¿Cómo respondes con honestidad profesional?
        opciones:
          - Inventas una respuesta
          - Cambias de tema
          - Reconoces lo no resuelto y explicas por dónde empezarías a resolverlo
          - Te quedas callado
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Reconocer lo no resuelto y mostrar el plan para abordarlo es señal de oficio profesional, no de debilidad.
        feedback_incorrecto: |-
          Reconoces lo no resuelto y explicas por dónde empezarías a resolverlo. La honestidad gana confianza profesional.
  resumen: |-
    Cierre del grado 8: del consejo de mayores a la sustentación digital. Aplicas pensamiento computacional al armar tu portafolio y cierras con el Triángulo de pensamiento.
  subtema: Cierre del grado · Triángulo de pensamiento
  pre_lectura:
    por_que_importa: |-
      Aprender a sustentar es aprender a darle voz a tu trabajo. Hoy lo que practiques aquí te servirá para tu primer trabajo, tu primera entrevista o tu primera asamblea ciudadana.
    pregunta_detonante: |-
      ¿Qué del consejo de mayores podemos llevar a una sustentación digital — y qué de lo digital podríamos ofrecerle al consejo?
    activacion:
      titulo: El círculo de palabra
      descripcion: |-
        En parejas (3 min): cada uno cuenta al otro UN logro del periodo en máximo 60 segundos. El otro escucha sin interrumpir, luego repite con sus palabras lo que entendió. Reflexionen: ¿cuán parecido es esto a sustentar un proyecto?
      duracion_min: 5
    conexion:
      anterior: "Sesiones 21-29: técnicas multimedia, ciberseguridad y ética digital del periodo 3."
      siguiente: "Grado 9 abre con tecnología, ciencia y comunicación: sustentar será habilidad transversal."
  post_lectura:
    reflexion: |-
      Esta guía es el cierre del grado 8. ¿Cuál de las tres voces del Triángulo (Dussel, Estoicismo, Floridi) te resuena más en este momento de tu vida y por qué?
    transferencia: |-
      Identifica un espacio en tu colegio, barrio, parroquia o familia donde podrías volver a sustentar algo en los próximos 6 meses. Anótalo. Conviértelo en compromiso real, no en intención vaga.
    cierre: |-
      Sustentar es darle voz a algo. La voz del consejo de mayores se hace, hoy, también voz digital. El círculo se cierra: lo ancestral camina con lo contemporáneo cuando ambos se escuchan.
  cinco_dimensiones:
    personal: |-
      Cerraste el grado 8 con sustentación, portafolio y triángulo de pensamiento — ritual completo de oficio académico.
    emocional: |-
      Sentiste la satisfacción y el nervio de presentar públicamente lo trabajado durante un año. Habilidad escasa que entrenaste.
    ciudadana: |-
      Practicaste palabra pública con evidencia y reconocimiento de límites. Esa habilidad es base de la vida democrática adulta.
    local: |-
      Heredaste el ritual de cierre del consejo de mayores: presentar lo hecho con dignidad, lo aprendido con humildad, lo pendiente con honestidad.
    intergeneracional: |-
      El cabildo que cerraba el año con palabras del vocero y tu cierre digital de grado 8 comparten gramática. El círculo se cierra cuando ambos se escuchan.

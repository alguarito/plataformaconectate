clave: 3-2
grado: 8
periodo: 3
sesion: 2
completo: true
duracion_min: 90
titulo: Presentaciones interactivas --- caminos que vuelven al menú
titulo_portada: |-
  Caminos
  que vuelven al menú
producto_final: |-
  Una presentación interactiva en Slides, Canva, Genially o PowerPoint sobre un tema escolar real, con al menos cinco pantallas conectadas por hipervínculos que dejan elegir el camino y volver al menú, tres animaciones que ayudan a entender y no solo decoran, y una nota de cinco líneas que explique por qué esos caminos y no una secuencia.
apertura:
  origen: Decimeros del Pacífico caucano (Guapi, río Saija) · la décima glosada
  fuente: |-
    Oslender, U. (2003). «Discursos ocultos de resistencia»: tradición oral y cultura política en comunidades negras de la costa pacífica colombiana. \emph{Revista Colombiana de Antropología, 39}, 203--236.
  saber_ancestral: |-
    En Guapi y en los ríos de la costa caucana, los \textbf{decimeros} recitan de memoria poemas de 44 versos: las \textbf{décimas glosadas}. La estructura es estricta. Primero va una copla de cuatro versos que «lleva la esencia». Después vienen cuatro décimas de diez versos. Cada décima tiene que terminar en el verso correspondiente de la copla inicial (Oslender, 2003, citando a Pedrosa y Vanín, 1994). Es decir: el poema abre con un menú de cuatro líneas y desarrolla cada una por su lado. Cada desarrollo vuelve al menú antes de pasar al siguiente. Nadie se pierde porque cada rama regresa. Y las décimas no tienen autoría fija: cada decimero añade o cambia partes, y así se vuelven de todos. La \textbf{cara de exclusión}: Oslender llama a estas décimas «discursos ocultos de resistencia». Las comunidades negras del Pacífico las usan para contar lo que la historia oficial calla y para reclamar su territorio. Y los decimeros son mayores a los que cada vez se escucha menos. Hoy vas a construir una presentación como una décima glosada: un menú que lleva la esencia y ramas que siempre vuelven.
  saber_contemporaneo: |-
    Una \textbf{presentación interactiva} no se recorre en línea recta. Quien la mira elige por dónde ir, entra a una sección, regresa y salta a otra. Se construye con dos herramientas. Los \textbf{hipervínculos internos}: un texto o botón que lleva a otra pantalla; en Slides, clic derecho, «Insertar enlace», y eliges la diapositiva. Las \textbf{animaciones}: elementos que aparecen, se mueven o cambian cuando haces clic. La regla es una sola: cada enlace y cada animación sirve para entender, no para decorar. Si quitas la animación y se entiende igual, sobra. Tres estructuras cubren casi todo: el \textbf{menú}, una pantalla índice con botones a cada sección; el \textbf{glosario}, una palabra que lleva a su definición y devuelve; y el \textbf{retorno}, el botón «volver al menú» que va en todas las pantallas. Sin retorno, quien entra a una rama queda atrapado. Antes de abrir la herramienta, el mapa se dibuja en papel: nodos, flechas y regresos.
  pregunta_puente: |-
    En la décima glosada, cada rama termina volviendo a un verso de la copla inicial. Si tu presentación tiene un botón que entra a una sección y ninguno que vuelva, ¿qué le pasa a quien hizo clic?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} en un mapa de papel los nodos, las ramas y los regresos de una narrativa; (2) \textbf{crear} una presentación de cinco pantallas con menú, hipervínculos y retorno; (3) \textbf{evaluar} cada animación con la prueba de quitarla; (4) \textbf{explicar} por qué un camino con ramas necesita regresos.
puentes:
  a_ruta: |-
    En la sesión 1 hiciste que una pieza se entendiera en tres segundos. Hoy conectas varias pantallas para que quien mira elija su camino. En la sesión 3 vas a contar algo en tres minutos con tu voz.
  a_escuta: |-
    Antes de abrir la herramienta, vas a dibujar el mapa en papel: cinco nodos, flechas y regresos. Es la copla inicial de la décima, la que lleva la esencia.
  a_sistematizacion: |-
    Ya tienes el mapa. Ahora aprendes los tres tipos de enlace y las tres animaciones útiles, y con tu pareja armas el menú y las primeras ramas.
  a_praxis: |-
    Ya tienes menú y ramas. Toca poner los regresos, las tres animaciones y probar que ningún camino deja atrapado a nadie.
  a_producto: |-
    Lo que entregas hoy: la presentación con enlace y la nota de cinco líneas. La prueba de calidad: le pasas el computador a alguien, no le dices nada, y en un minuto entró a dos secciones y volvió al menú.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Una presentación con cinco pantallas y regresos que funcionan vale más que una de veinte con animaciones que rebotan.
  a_triangulo: |-
    Para terminar, tres ideas sobre dejar elegir el camino, contadas con palabras de esta guía: Dussel sobre el maestro que sabe oír, Séneca sobre el tiempo que derrochamos, y Floridi sobre saber preguntar.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El mapa en papel} (15 min · individual). (1) Elige un tema escolar que tenga partes: el ciclo del agua, las reglas de un deporte, cómo funciona el micro:bit, la historia del colegio. (2) Dibuja cinco círculos: uno es el menú y los otros cuatro son secciones. (3) Traza flechas del menú a cada sección. (4) Traza las flechas de regreso, de cada sección al menú, con otro color. (5) Marca con una estrella la sección que necesita una palabra explicada, ahí irá el glosario.
  checks:
  - Tengo cinco nodos, uno de ellos es el menú.
  - Cada sección tiene flecha de ida y flecha de regreso.
  - Marqué dónde va el glosario.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- El mapa en papel». \textbf{Formato:} el mapa de cinco nodos con las flechas de ida en un color y las de regreso en otro, y la estrella del glosario. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} desde cualquier nodo puedes seguir una flecha de vuelta al menú con el dedo.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · CREA --- El menú y las ramas} (30 min · parejas). (1) Con tu pareja, en Slides o la herramienta que indique tu docente, creen cinco diapositivas y pongan el título de cada una según el mapa. (2) En la primera, el menú, escriban cuatro botones o textos, uno por sección. (3) Seleccionen cada botón, clic derecho, «Insertar enlace», y elijan la diapositiva de esa sección. (4) En cada sección pongan el contenido en pocas palabras, con la jerarquía de la sesión 1. (5) Prueben en modo presentación: desde el menú, entren a las cuatro secciones.
  pilares:
  - |-
    \textbf{Los tres enlaces.} Menú: la pantalla índice con un botón por sección; deja elegir por dónde empezar. Glosario: una palabra subrayada que lleva a su definición y trae de vuelta. Retorno: el botón «volver al menú» en todas las pantallas menos el menú.
  - |-
    \textbf{Las tres animaciones útiles.} Revelar: un elemento aparece después de otro, primero la pregunta y luego la respuesta. Resaltar: algo cambia de color o tamaño cuando toca mirarlo. Mover: una flecha o figura se desplaza para mostrar un recorrido. Las tres ayudan a entender; el texto que entra rebotando, no.
  - |-
    \textbf{La copla antes que las décimas.} El menú se escribe primero y lleva la esencia: si alguien solo ve el menú, ya sabe de qué trata todo. Las secciones desarrollan cada botón y vuelven, como cada décima vuelve a su verso.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Cinco diapositivas con título. (2) Menú con cuatro botones. (3) Enlace de cada botón a su sección. (4) Contenido corto en cada sección. (5) Probar desde el menú. (6) Después, los regresos.
  anatomia:
    titulo: La presentación interactiva, en una mirada
    body: |-
      \textbf{Menú:} la pantalla índice, lleva la esencia. \\[1mm] \textbf{Sección:} una rama con su contenido. \\[1mm] \textbf{Enlace:} el botón que lleva de una pantalla a otra. \\[1mm] \textbf{Retorno:} el botón que vuelve al menú. \\[1mm] \textbf{Animación útil:} revelar, resaltar o mover para entender.
  errores_comunes: |-
    (1) \textbf{Rama sin retorno}: quien entra a una sección no puede volver. (2) \textbf{Enlace roto}: el botón «glosario» no lleva a ninguna parte. (3) \textbf{Animación decorativa}: texto que rebota sin razón. (4) \textbf{Una transición distinta por pantalla}: cansa y distrae. (5) \textbf{Menú que no dice nada}: cuatro botones con «sección 1, 2, 3, 4» en vez del tema de cada una.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · CREA).} \textbf{Título:} «Actividad 2 --- El menú y las ramas». \textbf{Formato:} el texto de los cuatro botones del menú, la lista de las cuatro secciones con su contenido en una línea, y el enlace de la presentación. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} desde el menú entras a las cuatro secciones sin que ningún botón falle.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Regresos, animaciones y la prueba del minuto} (25 min · individual). (1) Pon en cada sección un botón «volver al menú» enlazado a la primera diapositiva. (2) En la sección con estrella, subraya la palabra difícil y enlázala a una diapositiva nueva con su definición. Desde ahí pon un enlace de regreso a esa sección. (3) Agrega tres animaciones: una que revela, una que resalta y una que mueve. Para cada una, pregúntate: si la quito, ¿se entiende igual? Si sí, cámbiala. (4) Pásale el computador a tu pareja sin decir nada y cronometra un minuto: debe entrar a dos secciones y volver al menú. (5) Escribe la nota de cinco líneas: por qué estos caminos y no una secuencia.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) La presentación compartida con enlace, con cinco pantallas, menú, retornos y glosario. (2) El resultado de la prueba del minuto. (3) La nota de cinco líneas sobre los caminos.
  - |-
    \textbf{El retorno va en todas.} Cada sección y el glosario tienen botón de regreso. Es la regla de la décima: ninguna rama se queda suelta. Si tu pareja quedó atrapada en una pantalla, falta un retorno.
  - |-
    \textbf{La prueba de quitar.} Una animación es útil solo si al quitarla se pierde algo. Revelar la respuesta después de la pregunta se pierde; un título que entra girando, no. Quita lo que no se pierde.
  - |-
    \textbf{La prueba del minuto.} No expliques. Si tu pareja entró a dos secciones y volvió sola, los caminos funcionan. Si preguntó «¿y ahora cómo vuelvo?», ya sabes qué arreglar.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Cinco pantallas, una es el menú con cuatro botones enlazados. \\[1mm] \checkbox Botón «volver al menú» en cada sección. \\[1mm] \checkbox Un glosario que lleva a la definición y devuelve. \\[1mm] \checkbox Tres animaciones que pasan la prueba de quitar. \\[1mm] \checkbox Mi pareja entró a dos secciones y volvió al menú en un minuto sin ayuda. \\[1mm] \checkbox Nota de cinco líneas sobre por qué estos caminos. \\[1mm] \checkbox Presentación compartida con enlace.
  plantilla_guion: |-
    \textbf{Tema.} \textit{…} \\[1mm] \textbf{Menú.} \textit{Cuatro botones: …, …, …, …} \\[1mm] \textbf{Glosario.} \textit{La palabra … en la sección …} \\[1mm] \textbf{Animaciones.} \textit{Revela …; resalta …; mueve …} \\[1mm] \textbf{Prueba del minuto.} \textit{Mi pareja entró a … y … y volvió / se quedó en …}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Regresos, animaciones y la prueba del minuto». \textbf{Formato:} la lista de las tres animaciones con qué se pierde si se quita cada una, el resultado de la prueba del minuto y la nota de cinco líneas. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} tu pareja volvió al menú sola y las tres animaciones tienen escrito qué se perdería sin ellas.
  producto_titulo: Presentación de cinco pantallas con menú, retornos y glosario + tres animaciones útiles + prueba del minuto + nota de cinco líneas
  criterios:
  - El menú tiene cuatro botones que dicen el tema de cada sección y todos enlazan
  - Cada sección y el glosario tienen botón de regreso que funciona
  - Las tres animaciones pasan la prueba de quitar y hay escrito qué se pierde sin cada una
  - Tu pareja entró a dos secciones y volvió al menú en un minuto sin ayuda
  - La nota de cinco líneas explica por qué caminos y no secuencia
  - La presentación está compartida con enlace
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §3.3.9.4
    idea: |-
      El maestro que libera sabe oír en silencio a la juventud y al pueblo, en vez de imponer su orden.
    aplicacion: |-
      Una presentación en línea recta impone el orden de quien la hizo. Un menú con caminos deja que quien mira elija por dónde entrar. Diseñar los regresos es una forma de oír al lector.
    pregunta_espejo: |-
      ¿Qué de lo que hice esta semana obligaba a los demás a ir en mi orden?
  estoico:
    autor: Séneca · De la brevedad de la vida, I (c. 49 d.C.)
    idea: |-
      La vida no es corta; nosotros la hacemos corta derrochando el tiempo.
    aplicacion: |-
      Un título que entra rebotando le quita dos segundos a cada persona que lo mira, y no le da nada. Multiplícalo por veinte pantallas y treinta compañeros. La prueba de quitar cuida ese tiempo.
    pregunta_espejo: |-
      ¿Qué animación puse porque se veía bonita y no porque ayudara?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      Ganan quienes saben preguntar y responder, y por eso saben qué merece recogerse y cuidarse.
    aplicacion: |-
      Un buen menú es una lista de preguntas: ¿qué es?, ¿cómo funciona?, ¿para qué sirve? Cada sección responde una y vuelve. Un menú con «sección 1, 2, 3» no pregunta nada y nadie sabe por dónde entrar.
    pregunta_espejo: |-
      ¿Los botones de mi menú son preguntas que alguien se haría, o solo nombres?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu presentación y la nota. En la sesión 3 vas a contar algo que te importa en tres minutos, con tu voz y sin leer. El menú que lleva la esencia es lo mismo que el gancho de un discurso.
web:
  resumen: |-
    Una presentación interactiva deja elegir el camino y siempre permite volver. Hoy construyes menú, ramas, glosario y regresos, como la décima glosada del Pacífico, donde cada rama termina regresando a la copla inicial.
  subtema: Multimedia y ciberética
  pre_lectura:
    por_que_importa: |-
      Los sitios, las apps y los cursos en línea son pantallas conectadas por enlaces. Saber diseñar caminos con retorno es saber que nadie se pierda en lo que haces.
    pregunta_detonante: |-
      Si tu presentación tiene un botón que entra a una sección y ninguno que vuelva, ¿qué le pasa a quien hizo clic?
    activacion:
      titulo: El botón que no vuelve
      descripcion: |-
        En 3 minutos, recuerda una app o página donde te quedaste atrapado y no sabías cómo volver. ¿Qué botón faltaba? ¿Dónde lo habrías puesto?
      duracion_min: 5
    conexion:
      anterior: En la sesión 1 diseñaste una pieza que se entiende en tres segundos.
      siguiente: En la sesión 3 cuentas algo en tres minutos con tu voz.
  mapa_ruta:
    - numero: 1
      iconos: ["🌱"]
      titulo: La décima glosada, ramas que vuelven
      duracion_min: 10
    - numero: 2
      iconos: ["✏️"]
      titulo: Actividad 1 · El mapa en papel
      duracion_min: 15
    - numero: 3
      iconos: ["🔎", "✏️"]
      titulo: Actividad 2 · El menú y las ramas
      duracion_min: 30
    - numero: 4
      iconos: ["🔎", "✅"]
      titulo: Actividad 3 · Regresos, animaciones y la prueba del minuto
      duracion_min: 25
    - numero: 5
      iconos: ["💭"]
      titulo: Tres ideas y tu compromiso
      duracion_min: 10
  actividades:
    - numero: 1
      verbo: IDENTIFICA
      titulo: El mapa en papel
      tiempo_min: 15
      modalidad: individual
      pasos:
        - Elige un tema escolar con partes y dibuja cinco círculos, uno es el menú y los otros cuatro son secciones.
        - Traza flechas del menú a cada sección.
        - Traza las flechas de regreso, de cada sección al menú, con otro color.
        - Marca con una estrella la sección que necesita una palabra explicada.
      cuaderno:
        titulo: El mapa en papel
        formato: el mapa de cinco nodos con flechas de ida en un color y de regreso en otro, y la estrella del glosario
        extension: media página
      criterios:
        - Cada sección tiene flecha de ida y de regreso.
        - Desde cualquier nodo se puede seguir una flecha de vuelta al menú.
    - numero: 2
      verbo: CREA
      titulo: El menú y las ramas
      tiempo_min: 30
      modalidad: parejas
      pasos:
        - Con tu pareja, creen cinco diapositivas con el título de cada una según el mapa.
        - En la primera, el menú, escriban cuatro botones, uno por sección, y enlacen cada uno a su diapositiva con clic derecho, «Insertar enlace».
        - En cada sección pongan el contenido en pocas palabras, con la jerarquía de la sesión 1.
        - Prueben en modo presentación entrando desde el menú a las cuatro secciones.
      cuaderno:
        titulo: El menú y las ramas
        formato: el texto de los cuatro botones, la lista de secciones con su contenido en una línea, y el enlace de la presentación
        extension: media página
      criterios:
        - Los cuatro botones del menú enlazan a su sección.
        - Ningún botón falla al probar.
    - numero: 3
      verbo: EVALÚA
      titulo: Regresos, animaciones y la prueba del minuto
      tiempo_min: 25
      modalidad: individual
      pasos:
        - Pon en cada sección un botón «volver al menú» y arma el glosario, la palabra difícil enlazada a su definición y de regreso.
        - Agrega tres animaciones, una que revela, una que resalta y una que mueve, y a cada una hazle la prueba de quitar.
        - Pásale el computador a tu pareja sin decir nada y cronometra un minuto, debe entrar a dos secciones y volver al menú.
        - Escribe la nota de cinco líneas, por qué estos caminos y no una secuencia.
      cuaderno:
        titulo: Regresos, animaciones y la prueba del minuto
        formato: las tres animaciones con qué se pierde sin cada una, el resultado de la prueba del minuto y la nota de cinco líneas
        extension: una página
      criterios:
        - Tu pareja volvió al menú sola.
        - Las tres animaciones tienen escrito qué se perdería sin ellas.
  conceptos_clave:
    - categoria: Los caminos
      termino: Presentación interactiva
      definicion: Pantallas conectadas por enlaces que dejan elegir el camino, entrar, volver y saltar.
      ejemplo: Un menú de cuatro botones y cuatro secciones, cada una con regreso.
    - categoria: Los caminos
      termino: Hipervínculo interno
      definicion: Un texto o botón que lleva a otra pantalla de la misma presentación.
      ejemplo: Clic derecho sobre el botón, «Insertar enlace», y elegir la diapositiva 3.
    - categoria: Los caminos
      termino: Menú
      definicion: La pantalla índice que lleva la esencia, como la copla inicial de la décima. Un botón por sección.
      ejemplo: «¿Qué es?», «¿Cómo funciona?», «¿Para qué sirve?», «¿Qué falla?».
    - categoria: Las reglas
      termino: Retorno
      definicion: El botón «volver al menú» que va en todas las pantallas menos el menú. Sin él, quien entra queda atrapado.
      ejemplo: Cada décima vuelve a un verso de la copla; cada sección vuelve al menú.
    - categoria: Las reglas
      termino: Glosario
      definicion: Una palabra enlazada a su definición, con un enlace que devuelve a donde estabas.
      ejemplo: «Umbral» subrayada lleva a la definición y vuelve a la sección 2.
    - categoria: Las reglas
      termino: Prueba de quitar
      definicion: Una animación es útil solo si al quitarla se pierde algo para entender.
      ejemplo: Revelar la respuesta después de la pregunta pasa la prueba; un título que gira, no.
  cinco_dimensiones:
    personal: Dibujaste el mapa antes de abrir la herramienta. Planear en papel primero sirve para cualquier cosa que tenga partes.
    emocional: Ver a tu pareja atrapada en una pantalla sin saber volver incomoda. Ese momento te dice exactamente qué botón falta.
    ciudadana: Un camino con regresos respeta a quien lo recorre. Una app que no deja volver atrás atrapa a la gente a propósito.
    local: Los decimeros del Pacífico caucano abren con una copla que lleva la esencia y cada rama vuelve a ella. Tu menú y tus retornos hacen lo mismo.
    intergeneracional: Una presentación con menú la puede ampliar el grupo del año siguiente agregando una sección. Una en línea recta hay que rehacerla.
  post_lectura:
    reflexion: ¿En qué pantalla se quedó tu pareja durante la prueba del minuto, y qué botón faltaba?
    transferencia: |-
      La próxima vez que armes algo con partes, un trabajo, un video, una carpeta, escribe primero el menú. Si el menú no dice de qué trata todo, todavía no está listo.
    cierre: La copla lleva la esencia y cada décima vuelve a ella. El menú lleva la esencia y cada sección vuelve. Nadie se pierde.
  quiz:
    titulo: ¿Sabes diseñar caminos que vuelven?
    instrucciones: Cinco preguntas para verificar que dominas menú, enlaces, retornos y animaciones útiles. No va al cuaderno.
    preguntas:
      - enunciado: Tu pareja entra a la sección 3 de tu presentación y no sabe cómo seguir. ¿Qué falta?
        opciones:
          - Un botón «volver al menú» enlazado al inicio.
          - Una animación que le muestre claramente que la sección ya terminó.
          - Más texto en la sección para que no se aburra.
          - Una transición distinta para que note el cambio.
        respuesta_index: 0
        feedback_correcto: Sí. Es una rama sin retorno. Cada sección necesita su botón de regreso.
        feedback_incorrecto: Ni animaciones ni texto ni transiciones la sacan de ahí. Falta el retorno al menú.
      - enunciado: ¿Cuál de estos menús lleva la esencia, como la copla inicial de la décima?
        opciones:
          - «Sección 1 · Sección 2 · Sección 3 · Sección 4».
          - «Inicio · Siguiente · Anterior · Fin».
          - «Diapositiva A · Diapositiva B · Diapositiva C · Diapositiva D · Diapositiva E».
          - «¿Qué es? · ¿Cómo se programa? · ¿Qué sensores tiene? · ¿Qué falla?».
        respuesta_index: 3
        feedback_correcto: Correcto. Con solo leer el menú ya sabes de qué trata todo y eliges por dónde entrar.
        feedback_incorrecto: «Sección 1» o «Diapositiva A» no dicen nada. El menú lleva la esencia cuando cada botón dice el tema de su sección.
      - enunciado: Tienes un título que entra girando y una respuesta que aparece después de la pregunta. ¿Cuál pasa la prueba de quitar?
        opciones:
          - Las dos, porque toda animación ayuda a mantener la atención.

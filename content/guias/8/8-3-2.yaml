clave: 3-2
grado: 8
periodo: 3
sesion: 2
completo: true
titulo: Animaciones e hipervínculos --- narrativa interactiva
titulo_portada: |-
  Animaciones
  e hipervínculos ---
  narrativa interactiva
producto_final: |-
  Presentación interactiva (Google Slides, Canva, Genially o PowerPoint) sobre un tema escolar real con al menos 5 slides conectadas por hipervínculos no lineales (que permitan al lector elegir caminos, no solo \emph{``siguiente / anterior''}) + al menos 3 animaciones que apoyen el contenido (no decorativas: que ayuden a entender) + breve nota de 5 líneas explicando por qué la presentación es \emph{interactiva} y no solo \emph{secuencial}
apertura:
  saber_ancestral: |-
    En las noches de fogón del Pacífico colombiano y en los corredores de las casas de los abuelos del Valle, había una práctica que cualquier nieto reconoce: el \textbf{cuentero del fogón}. El abuelo o la abuela no contaba la historia como aparece en los libros: lineal, principio-medio-fin. La contaba con \textbf{ramas, saltos, regresos}: \emph{``Y entonces el tigre dijo... pero antes les cuento de la vez que mi abuelo fue al monte... y eso me hace acordar de cuando llovió tan fuerte que el río arrastró la mula...''}. El cuento iba y volvía. El nieto, lejos de aburrirse, prestaba más atención: la narrativa con ramas obligaba a \textbf{seguir el hilo activamente}. Cuando volvía al tigre, ya había aprendido cosas que el cuento lineal nunca le habría enseñado. El cuento del fogón \textbf{no era una línea recta: era un mapa}, y el nieto navegaba ese mapa con la guía del cuentero. Mucho antes de que existieran los hipervínculos, el oficio del cuentero ancestral practicaba el \textbf{hipertexto}: textos conectados que el lector recorre eligiendo caminos. La narrativa interactiva digital es esa práctica antigua formalizada con clics.
  origen: Oficio del titiritero en plazas del Valle y el Caribe colombiano
  saber_contemporaneo: |-
    Una \textbf{presentación interactiva} es una secuencia de slides que NO se recorre linealmente: el lector puede elegir caminos, regresar, saltar entre secciones. Se construye con dos herramientas principales: (1) \textbf{Hipervínculos internos}: textos o botones que llevan a otras slides al hacer clic. En Google Slides: clic derecho → Insertar enlace → otro slide. (2) \textbf{Animaciones}: efectos que aparecen, se mueven, cambian, según un disparador (al hacer clic, al cargar, después de un tiempo). En Slides: menú Insertar → Animación. La regla profesional: \textbf{las animaciones e hipervínculos sirven para apoyar la comprensión, no para decorar}. Una animación bien usada revela información en el momento justo (un mapa que se llena por regiones, una fórmula que aparece paso a paso); una animación decorativa (textos que entran rebotando sin razón) cansa al lector. Las plataformas más usadas para narrativa interactiva son \textbf{Google Slides} (gratis, simple), \textbf{Canva} (gratis con plantillas), \textbf{Genially} (gratis con cuenta, muy potente para interactividad), \textbf{PowerPoint} (escolar). Cualquiera permite crear narrativa con ramas.
  pregunta_puente: |-
    ¿Qué sabía el cuentero del fogón al contar la historia con ramas y regresos, que el novato en presentaciones olvida cuando hace 20 slides lineales en orden estricto? ¿Y por qué una presentación con 3 ramas bien pensadas es más comunicativa que una lineal con 30 slides?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué partes de una presentación se beneficiarían de hipervínculos no lineales (menús, ramas, glosario); (2) \textbf{aplicar} hipervínculos internos y animaciones simples en la herramienta de tu elección; (3) \textbf{crear} una presentación interactiva con 5+ slides conectadas no linealmente y 3+ animaciones útiles; (4) \textbf{evaluar} la presentación verificando que las animaciones aportan comprensión, no decoran.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 1 aprendiste diseño visual y jerarquía. Hoy le agregas \emph{interactividad}: el lector ya no es pasivo, elige caminos. Las próximas sesiones (narrativa TED, edición, audio) construyen sobre tu capacidad de comunicar con varios formatos.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{mapa del cuentero}: piensa en un tema escolar que quieras presentar (historia de la independencia regional, ciclo del agua, biografía de un personaje) y dibuja en papel un mapa con 5 nodos conectados por flechas que muestren posibles caminos (no solo \emph{``siguiente''}, también \emph{``volver a tema X''}, \emph{``saltar a glosario''}).
  a_sistematizacion: |-
    Ya tienes el mapa. Ahora vas a entender la \textbf{anatomía de la narrativa interactiva}: los 3 tipos de hipervínculos (menú principal, glosario, ramas de decisión), las 3 animaciones útiles (revelar, transformar, conectar), los 5 errores típicos (animaciones decorativas, hipervínculos rotos, exceso de transiciones, ramas sin retorno, slides sin propósito).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: armas la presentación con 5+ slides, conectadas con al menos 1 menú principal y al menos 1 rama de decisión, con 3 animaciones que apoyen el contenido.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: presentación interactiva + nota explicativa. El criterio principal: que un compañero pueda recorrer tu presentación de 2 maneras distintas y aprender algo en ambas.
  a_evaluacion: |-
    Antes de cerrar, mira la interactividad desde las cinco dimensiones humanas. Construir narrativa con ramas es respeto por el lector activo; hacer presentación lineal con animaciones decorativas es desperdicio del medio digital.
  a_triangulo: |-
    Y para terminar, tres voces sobre la narrativa abierta. Dussel sobre las narrativas que dan voz al lector o lo someten al guion del autor, Marco Aurelio sobre la simplicidad efectiva, Floridi sobre el hipertexto como infraestructura cognitiva.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Mapa del cuentero} (15 min · individual). Elige un tema escolar y dibuja en papel un mapa de la narrativa: 5 nodos (slides) con flechas que conectan no solo en orden secuencial sino con ramas opcionales. Ejemplo para \emph{``ciclo del agua''}: nodo 1 \emph{intro}, nodo 2 \emph{evaporación}, nodo 3 \emph{condensación}, nodo 4 \emph{precipitación}, nodo 5 \emph{glosario}. Flechas: del 1 al 2-3-4 (menú); del 2 al 3 (secuencia); de cualquiera al 5 (glosario); del 5 a cualquiera (volver). El mapa es el plano de tu presentación interactiva.
  checks:
  - Elegí tema escolar concreto.
  - Dibujé mapa con 5 nodos.
  - Las flechas muestran caminos no solo lineales.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mapa del cuentero». \textbf{Formato:} 5 nodos numerados + flechas con etiqueta corta. \textbf{Sabes que terminaste cuando} ves al menos 1 rama (camino opcional) además del lineal.
sistematizacion:
  intro: |-
    Tu mapa en papel es el plano. Ahora necesitas la \textbf{anatomía técnica} de hipervínculos y animaciones para construir la presentación en formato digital.
  pilares:
  - |-
    Los \textbf{3 tipos de hipervínculos} útiles se descomponen así: (1) \textbf{Menú principal}: slide-índice con botones que llevan a las secciones. Permite al lector elegir por dónde empezar. (2) \textbf{Glosario}: texto subrayado o botón que lleva a una slide-definición y devuelve al lugar de origen. (3) \textbf{Ramas de decisión}: \emph{``¿quieres saber más sobre X o pasar a Y?''} con 2 botones que llevan a slides distintas. Estos 3 patrones cubren la mayoría de necesidades de narrativa interactiva.
  - |-
    Las \textbf{3 animaciones más útiles} (no decorativas) son: (a) \textbf{Revelar}: un elemento aparece después de otro. Útil para construir conceptos paso a paso (primero pregunta, luego respuesta; primero datos, luego interpretación). (b) \textbf{Transformar}: un elemento cambia de tamaño, color o posición. Útil para enfatizar (un dato que crece, una alerta que cambia a rojo). (c) \textbf{Conectar}: una flecha que se dibuja, una línea que une dos elementos. Útil para mostrar relaciones (causa-efecto, parte-todo). Estas 3 animaciones tienen propósito comunicativo claro.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿esta animación o hipervínculo aporta comprensión, o solo decora?}. Si quitas la animación y el lector entiende lo mismo, es decorativa. Si quitas y se pierde la idea, es funcional. La phronesis del oficio consiste en \textbf{usar animaciones que aporten, no que adornen}.
  - |-
    Algoritmo de construcción: (1) abrir la herramienta (Google Slides, Canva, Genially). (2) crear las 5 slides con contenido. (3) crear slide-menú con botones a cada sección. (4) en cada sección, agregar botón \emph{``volver al menú''}. (5) agregar al menos 1 hipervínculo a glosario. (6) agregar al menos 1 rama de decisión. (7) aplicar 3 animaciones que apoyen el contenido. (8) probar la navegación: ¿se puede recorrer de 2 maneras distintas?
  anatomia:
    titulo: Anatomía de la narrativa interactiva
    body: |-
      \textbf{Menú principal:} índice con botones. \\[1mm] \textbf{Glosario:} hipervínculo ida y vuelta. \\[1mm] \textbf{Ramas:} decisiones del lector. \\[1mm] \textbf{Animaciones útiles:} revelar / transformar / conectar. \\[1mm] \textbf{Prueba:} se puede recorrer de 2 maneras.
  errores_comunes: |-
    (1) \textbf{Animaciones decorativas}: textos que entran rebotando sin razón. (2) \textbf{Hipervínculos rotos}: el botón \emph{``glosario''} no lleva a ningún lado. (3) \textbf{Exceso de transiciones}: cada slide con animación distinta cansa. (4) \textbf{Ramas sin retorno}: el lector entra a una sección y no puede volver al menú. (5) \textbf{Slides sin propósito}: agregar slides solo para que sean 5 cuando 3 bastaban.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía narrativa interactiva». \textbf{Formato:} (a) los 3 tipos de hipervínculos con uso; (b) las 3 animaciones útiles; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} podrías delegar la construcción a un compañero solo con tu mapa + anatomía.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Presentación interactiva funcional} (40 min · individual o parejas). Hora de construir. Tomas tu mapa de la Actividad 1 y lo traduces a presentación con 5+ slides, hipervínculos no lineales y 3 animaciones útiles.
  pilares:
  - |-
    Tu presentación se construye en 6 pasos: (1) abrir la herramienta elegida (recomiendo Google Slides por simplicidad). (2) crear las 5 slides con contenido. (3) crear slide-menú al inicio. (4) insertar hipervínculos: en Slides, seleccionar texto o forma → Insertar → Enlace → Slides en esta presentación → elegir destino. (5) en cada slide, agregar botón de retorno al menú. (6) aplicar animaciones: menú Insertar → Animación → elegir tipo (aparecer, desplazar, transformar) y disparador (al hacer clic, después de la anterior).
  - |-
    Sigue el patrón \textbf{``mapa antes que slides''}: el mapa en papel define la navegación, las slides son su implementación. Si construyes slides sin mapa, terminas con caminos rotos o redundantes. Si construyes con mapa, las slides solo implementan algo ya pensado.
  - |-
    La nota explicativa final tiene estructura simple: (a) ¿por qué tu presentación es interactiva y no solo secuencial?, (b) ¿qué camino esperas que tome un lector apurado vs. uno curioso?, (c) ¿qué animación es la más importante y por qué? 5 líneas.
  - |-
    Algoritmo: (1) traducir mapa a slides. (2) insertar hipervínculos. (3) agregar animaciones. (4) probar navegación de 2 maneras distintas. (5) escribir nota explicativa. (6) compartir link con un compañero y pedirle que recorra de 2 maneras.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 5+ slides creadas. \\[1mm] \checkbox Slide-menú principal con botones a secciones. \\[1mm] \checkbox Cada sección con botón de retorno al menú. \\[1mm] \checkbox Al menos 1 hipervínculo a glosario o sección extra. \\[1mm] \checkbox 3 animaciones útiles (no decorativas). \\[1mm] \checkbox Navegación probada en 2 caminos distintos. \\[1mm] \checkbox Nota explicativa de 5 líneas.
  plantilla_guion: |-
    \textbf{Tema.} \textit{Escolar real.} \\[1mm] \textbf{Mapa.} \textit{5 nodos con flechas no lineales.} \\[1mm] \textbf{Menú.} \textit{Slide-índice con botones.} \\[1mm] \textbf{Glosario.} \textit{Hipervínculo ida y vuelta.} \\[1mm] \textbf{Ramas.} \textit{Al menos 1 decisión del lector.} \\[1mm] \textbf{Animaciones.} \textit{3 que apoyen contenido.} \\[1mm] \textbf{Nota.} \textit{Por qué es interactiva.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Presentación interactiva». \textbf{Formato:} (a) link a la presentación; (b) mapa de la Actividad 1 pegado o redibujado; (c) nota explicativa. \textbf{Sabes que terminaste cuando} un compañero la recorre de 2 maneras y entiende algo en cada una.
  producto_titulo: Presentación interactiva con 5+ slides + hipervínculos + 3 animaciones útiles
  criterios:
  - 5+ slides con contenido relevante
  - Slide-menú con hipervínculos a secciones
  - Botones de retorno funcionales
  - 1+ hipervínculo extra (glosario o rama)
  - 3 animaciones con propósito comunicativo
  - Nota explicativa de la interactividad
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La narrativa que ofrece caminos respeta al lector como sujeto; la que impone orden lo somete como objeto pasivo.
    aplicacion: |-
      Una presentación lineal trata al lector como receptor pasivo: recibe lo que el autor ordena. Una presentación interactiva lo trata como sujeto activo: elige qué leer primero, qué profundizar, qué saltar. La filosofía de la liberación pide ese reconocimiento. La phronesis del oficio digital consiste en \textbf{construir narrativas que dejen al lector elegir su camino}.
    pregunta_espejo: |-
      ¿Mi presentación ofrece caminos o impone uno?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La animación que aporta es virtud; la que solo decora es vanidad del autor.
    aplicacion: |-
      Es tentador agregar animaciones para que la presentación se vea \emph{``profesional''}. La sabiduría estoica recomienda lo opuesto: \emph{cada animación debe aportar comprensión, o se elimina}. La presentación con 3 animaciones útiles comunica más que la que tiene 20 decorativas. La phronesis del oficio honra a quien quita lo que no aporta.
    pregunta_espejo: |-
      ¿Mis animaciones aportan comprensión, o solo decoran porque sí?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El hipertexto bien diseñado es infraestructura cognitiva que respeta cómo el cerebro humano explora información.
    aplicacion: |-
      El cerebro no piensa linealmente: salta entre asociaciones, regresa, profundiza, conecta. El hipertexto bien diseñado respeta esa forma natural del pensamiento. Tu presentación interactiva de hoy te entrena en una práctica que rige toda producción de información digital del siglo XXI: \textbf{diseñar para cómo piensan los lectores, no para cómo escribe el autor}.
    pregunta_espejo: |-
      ¿Mi presentación respeta cómo piensan los lectores, o solo cómo yo organicé el contenido?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu presentación interactiva y la nota explicativa. En la sesión 3 vas a aprender a construir \textbf{narrativa de alto impacto al estilo TED} en discurso oral de 3 minutos. La narrativa interactiva de hoy es para pantalla; la narrativa TED de mañana es para voz.
web:
  conceptos_clave:
    - termino: Presentación interactiva
      definicion: |-
        Secuencia de slides que no se recorre linealmente. El lector elige caminos, regresa, salta entre secciones según hipervínculos.
      ejemplo: |-
        Una historia con 3 finales posibles. El lector elige al final de cada acto y la presentación salta al desenlace correspondiente.
      emoji: "🔀"
    - termino: Hipervínculo interno
      definicion: |-
        Texto o botón que al hacer clic lleva a otra slide dentro de la misma presentación. Permite ramificar la narrativa.
      ejemplo: |-
        En Google Slides, clic derecho sobre el texto → Insertar enlace → seleccionar slide destino.
      emoji: "🔗"
    - termino: Animación
      definicion: |-
        Efecto que aparece, se mueve o cambia según un disparador (clic, carga, tiempo). Debe apoyar la comprensión, no decorar.
      ejemplo: |-
        Un mapa que se llena por regiones a medida que el presentador habla. Cada región aparece al hacer clic.
      emoji: "✨"
    - termino: Disparador (trigger)
      definicion: |-
        Acción que activa la animación: clic del lector, carga de la slide, transcurso de tiempo, hover sobre un objeto.
      ejemplo: |-
        Una animación con disparador "al hacer clic" da control al lector; "al cargar" la activa automáticamente.
      emoji: "🎬"
    - termino: Plataforma de slides
      definicion: |-
        Herramienta para construir presentaciones. Las más usadas y gratuitas: Google Slides, Canva, Genially, PowerPoint escolar.
      ejemplo: |-
        Genially es muy potente para interactividad; Google Slides es simple y colaborativo en tiempo real.
      emoji: "🖼️"
  quiz:
    titulo: ¿Dominas la narrativa interactiva?
    instrucciones: 5 preguntas para verificar que diseñas presentaciones con propósito comunicativo.
    preguntas:
      - enunciado: ¿Cuál es el criterio profesional para usar animaciones?
        opciones:
          - Que sean llamativas
          - Que apoyen la comprensión, no que decoren
          - Que sean muchas
          - Que reboten siempre
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La animación bien usada revela información en el momento justo. La decorativa cansa al lector.
        feedback_incorrecto: |-
          El criterio es que apoye la comprensión. La decoración por decoración cansa y resta foco.
      - enunciado: En Google Slides, ¿cómo insertas un hipervínculo a otra slide?
        opciones:
          - Solo se puede a páginas web
          - Hay que editar HTML
          - Clic derecho → Insertar enlace → seleccionar slide
          - No es posible
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Clic derecho sobre el texto u objeto → Insertar enlace → elegir slide destino.
        feedback_incorrecto: |-
          En Google Slides se hace con clic derecho sobre el texto y luego Insertar enlace, eligiendo el slide destino.
      - enunciado: ¿Qué es un "disparador" de animación?
        opciones:
          - Un error en la presentación
          - El final del slide
          - Una herramienta externa
          - La acción que activa la animación (clic, carga, hover)
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. El disparador define cuándo se ejecuta la animación: al clic, al cargar, al tiempo, al hover.
        feedback_incorrecto: |-
          Es la acción que activa la animación. Define si el lector controla el ritmo o si avanza sola.
      - enunciado: ¿Cuál de estas plataformas permite construir narrativa interactiva con hipervínculos internos?
        opciones:
          - Google Slides, Canva, Genially y PowerPoint
          - Solo PowerPoint pago
          - Solo Adobe Illustrator
          - Solo herramientas de pago
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. Las 4 plataformas mencionadas son gratuitas o accesibles y soportan hipervínculos internos.
        feedback_incorrecto: |-
          Las 4 (Google Slides, Canva, Genially, PowerPoint escolar) lo permiten y son accesibles para estudiantes.
      - enunciado: Tu presentación tiene animaciones que entran rebotando sin razón. ¿Qué problema tiene?
        opciones:
          - Las animaciones decorativas cansan y restan foco al mensaje
          - Ninguno, es estilo personal
          - Va a ser más rápida
          - Va a tener mejor nota automáticamente
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Las animaciones decorativas distraen del mensaje y cansan al lector tras unos pocos slides.
        feedback_incorrecto: |-
          El problema es que cansan. Cada animación debe tener propósito comunicativo, no ser adorno.
  resumen: |-
    Como el movimiento del titiritero: cada figura entra, gesticula, sale en su tiempo. Aprendes a usar animaciones e hipervínculos con propósito (no decoración) en presentaciones digitales.
  subtema: Animaciones · Hipervínculos · Narrativa interactiva
  pre_lectura:
    por_que_importa: |-
      Saber crear presentaciones interactivas te diferencia profesionalmente: cuando alguien navega tu presentación según interés, en lugar de seguir un orden lineal, demuestras dominio del medio.
    pregunta_detonante: |-
      ¿Qué del titiritero —su disciplina de mover una figura a la vez— podemos llevar a las animaciones digitales?
    activacion:
      titulo: La presentación interactiva
      descripcion: |-
        En 5 minutos: en parejas exploran una presentación interactiva (en Canva o YouTube). Identifiquen 3 animaciones con propósito y 3 sin propósito. ¿Qué las distingue?
      duracion_min: 5
    conexion:
      anterior: En la sesión 21 aplicaste principios visuales a 5 diapositivas.
      siguiente: En la sesión 23 construirás presentación de alto impacto con narrativa.
  post_lectura:
    reflexion: |-
      El minimalismo en animaciones es señal de profesionalismo. ¿En qué otros ámbitos de tu vida (decoración, vestimenta, hábitos) "menos es más"?
    transferencia: |-
      Esta semana: en una presentación tuya, cuenta cuántas animaciones tienes. Si son más de 3 por diapositiva, recorta hasta dejar solo las que agreguen claridad real.
    cierre: |-
      El titiritero y el animador digital comparten oficio: mover lo justo, en el momento justo. La disciplina del movimiento es elegancia.
  cinco_dimensiones:
    personal: Aprendiste que la disciplina del movimiento es elegancia — mover lo justo es decisión madura.
    emocional: |-
      Resististe la tentación de "compensar contenido débil con efectos llamativos" — elegiste sustancia sobre espectáculo.
    ciudadana: Respetar la atención del espectador es ciudadanía digital concreta en una era de saturación visual.
    local: "Heredaste el oficio del titiritero: cada figura en su tiempo, ninguna por demás."
    intergeneracional: |-
      El titiritero de la plaza y el animador digital comparten ética. Lo que cambia es la herramienta, no la disciplina del movimiento.

  conceptos_clave:
    - categoria: Los tres actos
      termino: Gancho
      definicion: Los primeros 30 segundos. Entra con una escena, una pregunta, un dato con fuente o una imagen; no anuncia.
      ejemplo: «Gracias por dejarnos entrar», dice Pa'yumat. No «hoy vamos a hablar de».
    - categoria: Los tres actos
      termino: Desarrollo con algo en juego
      definicion: Los dos minutos del medio. Hay una tensión que no se resuelve de inmediato.
      ejemplo: «No sabía si contarle a mi mamá o borrar el mensaje».
    - categoria: Los tres actos
      termino: Cierre que vuelve
      definicion: Los últimos 30 segundos. Toca algo del gancho y pide algo concreto.
      ejemplo: «Esta noche, pregúntale a tu abuela cómo se llamaba su primer trabajo».
    - categoria: La voz
      termino: Guion de 400 a 450 palabras
      definicion: Tres minutos hablados a ritmo normal. Se escribe en prosa, como se habla.
      ejemplo: Un guion de 600 palabras dura cuatro minutos y se pasa.
    - categoria: La voz
      termino: Contar, no leer
      definicion: Se ensaya hasta que salga contado, con tres palabras clave como apoyo.
      ejemplo: Se olvidó una frase y dijo la idea con otras palabras. Nadie lo notó.
    - categoria: La voz
      termino: Autocrítica con minuto y segundo
      definicion: Dos aciertos y un cambio, cada uno con el momento exacto de la grabación.
      ejemplo: «En 1:40 aceleré y la pregunta no se entendió».
  cinco_dimensiones:
    personal: Hablaste tres minutos de algo tuyo sin leer. Esa voz es la misma que vas a necesitar para sustentar, pedir y convencer.
    emocional: Escucharte grabado incomoda. Anotar el minuto exacto de lo que cambiarías convierte esa incomodidad en un ensayo concreto.
    ciudadana: Hablar con voz propia es un derecho que en el norte del Cauca se defiende con antenas bajo amenaza. Aquí cuesta menos y vale lo mismo.
    local: Radio Pa'yumat entra pidiendo permiso y habla en nasa yuwe y castellano para que otros no hablen por su gente. Tu gancho pide permiso igual.
    intergeneracional: Una grabación de tres minutos sobre lo que te importa hoy es algo que en diez años vas a querer volver a oír.
  post_lectura:
    reflexion: ¿Qué dijo tu pareja después de los primeros 30 segundos, y qué te dice eso de tu gancho?
    transferencia: |-
      La próxima vez que tengas que pedir algo importante, escribe primero la escena con la que vas a entrar. Nunca empieces anunciando.
    cierre: Pedir permiso, entrar, poner algo en juego, volver y pedir. Tres minutos con voz propia.
  quiz:
    titulo: ¿Sabes entrar, contar y cerrar?
    instrucciones: Cinco preguntas para verificar que dominas gancho, desarrollo, cierre y la regla de contar sin leer. No va al cuaderno.
    preguntas:
      - enunciado: ¿Cuál de estas primeras frases es un gancho?
        opciones:
          - «Buenos días, mi nombre es Laura y hoy les voy a hablar del celular».
          - «El celular es un dispositivo electrónico con muchas funciones distintas».
          - «A las dos de la mañana mi celular vibró. No era nadie».
          - «Antes de empezar quiero agradecer a la profesora».
        respuesta_index: 2
        feedback_correcto: Sí. Es una escena concreta que pone algo en juego desde la primera frase.
        feedback_incorrecto: Saludar, definir o agradecer anuncian y no entran. La escena de las dos de la mañana sí entra.
      - enunciado: Tu guion tiene 620 palabras y el cronómetro marcó 4:10. ¿Qué haces?
        opciones:
          - Hablas más rápido para que todo quepa en los tres minutos.
          - Recortas el guion a unas 430 palabras y lo cronometras.
          - Quitas el cierre, que es lo menos importante.
          - Pides que te dejen cuatro minutos en vez de tres.
        respuesta_index: 1
        feedback_correcto: Correcto. Tres minutos son unas 400 a 450 palabras. Se recorta el desarrollo, no el cierre, y se vuelve a medir.
        feedback_incorrecto: Hablar rápido no se entiende y el cierre no se quita. Se recorta el guion a unas 430 palabras y se cronometra otra vez.
      - enunciado: Tu pareja oye los primeros 30 segundos y pregunta «¿y de qué es?». ¿Qué pasó?

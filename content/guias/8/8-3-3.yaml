clave: 3-3
grado: 8
periodo: 3
sesion: 3
completo: true
titulo: Narrativa de alto impacto --- estructura TED-style
titulo_portada: |-
  Narrativa de alto impacto ---
  estructura
  TED-style
producto_final: |-
  Discurso oral estilo TED de 3 minutos exactos sobre un tema personal (algo que te importa, que aprendiste o que quisieras cambiar) con (a) guion escrito en prosa de 400-500 palabras estructurado en 3 actos (gancho de 30 seg, desarrollo de 2 min, cierre de 30 seg con llamada a la acción) + (b) grabación en celular hecha en una sola toma o con máximo 3 cortes + (c) autocrítica final con 2 fortalezas y 2 áreas de mejora identificadas escuchando la grabación
apertura:
  saber_ancestral: |-
    Cualquier persona que haya pasado una noche al lado del fogón de un abuelo o de una abuela del Pacífico colombiano, del Cauca rural o del Quindío cafetero, recuerda este detalle: el cuentista \textbf{capturaba la atención del nieto en 30 segundos}, no en 10 minutos. El cuento ancestral no empezaba con \emph{``había una vez...''}: empezaba con una imagen concreta, una frase corta, un detalle que enganchaba: \emph{``Cuando yo era niño, vi al diablo cruzar el río. Tenía ojos de candela''}. Esa primera oración, dicha en voz baja, paralizaba al nieto. Después venía el \textbf{desarrollo}: el conflicto, la lucha, la pregunta sin respuesta clara. Y al final, siempre, el \textbf{cierre}: una lección, una advertencia, una imagen que se quedaba dando vueltas en la cabeza durante días. La estructura era inquebrantable: \textbf{principio que engancha, conflicto que duele, resolución que enseña}. Aristóteles llamó a esto \emph{principio, medio y fin}; los abuelos del fogón lo conocían siglos antes. Quien sabía contar bien era recordado durante generaciones; quien no, hablaba al vacío. La narrativa TED moderna es exactamente ese cuento del fogón aplicado a 3 minutos con cronómetro.
  saber_contemporaneo: |-
    Las charlas \textbf{TED} (Technology, Entertainment, Design) son discursos breves (3-18 minutos) que comparten ideas con impacto. Las más exitosas tienen estructura común que cualquier presentador profesional reconoce: \textbf{3 actos}. (1) \textbf{Gancho} (10-15\% del tiempo): primera oración que paraliza al oyente, no introduce; engancha. Puede ser una historia personal, una pregunta provocadora, un dato impactante, una imagen visual. (2) \textbf{Desarrollo} (70-75\% del tiempo): aquí se cuenta la historia, se desarrolla el conflicto, se entregan los argumentos. Debe tener tensión: algo en juego, una pregunta sin respuesta clara. (3) \textbf{Cierre} (10-15\% del tiempo): conclusión que deja una imagen, una invitación, una pregunta para el oyente. La regla profesional famosa: \textbf{lo que no se puede contar en 3 minutos, todavía no es idea clara}. Para un discurso de 3 minutos: 400-500 palabras escritas (la voz humana habla a ~150 palabras por minuto cuando se entiende bien).
  pregunta_puente: |-
    ¿Qué sabía el abuelo del fogón al empezar el cuento con una imagen concreta, que el orador novato olvida cuando empieza con \emph{``hoy les voy a hablar de...''}? ¿Y por qué un discurso TED de 3 minutos es más exigente que uno de 30, no menos?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} la estructura de 3 actos en cualquier discurso o cuento conocido; (2) \textbf{analizar} qué gancho, desarrollo y cierre tendría una historia personal tuya; (3) \textbf{crear} tu discurso TED de 3 minutos con guion escrito y grabación; (4) \textbf{evaluar} tu propia grabación detectando 2 fortalezas y 2 áreas de mejora.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En la sesión 2 aprendiste narrativa interactiva escrita y visual. Hoy aprendes narrativa oral con estructura. Las próximas sesiones (edición, audio, ciberseguridad, estética) construyen sobre tu capacidad de comunicar con voz propia.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio del fogón}: piensa en un cuento que recuerdes (que te contaron o que viste) y analiza sus 3 actos. ¿Cómo empezó (gancho)?, ¿qué pasó en medio (desarrollo)?, ¿cómo terminó (cierre)?. Esa identificación te entrena el oído narrativo.
  a_sistematizacion: |-
    Ya tienes el cuento analizado. Ahora vas a entender la \textbf{anatomía formal} de los 3 actos en discurso TED: estructura interna de cada acto, los 5 ganchos más usados, los 5 errores típicos del orador novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: eliges tu tema personal, escribes guion de 3 actos, ensayas, grabas con celular, escuchas y haces autocrítica.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: discurso TED + guion + grabación + autocrítica. El criterio principal: que un compañero que vea tu grabación quede pensando en algo después de los 3 minutos.
  a_evaluacion: |-
    Antes de cerrar, mira el discurso desde las cinco dimensiones humanas. Hablar con estructura es respeto por el oyente; improvisar 3 minutos es desperdicio del tiempo ajeno.
  a_triangulo: |-
    Y para terminar, tres voces sobre la palabra que impacta. Dussel sobre los discursos que dan voz a quien no la tiene, Epicteto sobre la disciplina del cronómetro, Floridi sobre la palabra responsable en la era de la atención escasa.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Análisis de un cuento conocido} (15 min · individual). Elige un cuento que recuerdes (puede ser un cuento del abuelo, una película, un capítulo de serie, un cuento de los libros del colegio). Identifica sus 3 actos: (a) \textbf{Gancho}: ¿cómo empezó? ¿qué te paralizó al principio? (b) \textbf{Desarrollo}: ¿cuál era el conflicto?, ¿qué pasaba en medio? (c) \textbf{Cierre}: ¿cómo terminó?, ¿qué quedaste pensando?. Anota cada acto en 2-3 líneas.
  checks:
  - Elegí un cuento conocido.
  - Identifiqué gancho, desarrollo y cierre.
  - Reconocí qué hace efectiva la estructura.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Análisis del cuento conocido». \textbf{Formato:} ficha con 3 actos identificados + 1 línea sobre qué hace memorable a ese cuento. \textbf{Sabes que terminaste cuando} ves que la estructura existe en todo cuento que recuerdas.
sistematizacion:
  intro: |-
    Tu análisis identificó la estructura en un cuento ajeno. Ahora necesitas la \textbf{anatomía formal} para aplicarla a tu propio discurso.
  pilares:
  - |-
    Los \textbf{3 actos del discurso TED} se descomponen así: (1) \textbf{Gancho (30 seg)}: primera oración que paraliza. NO empieza con \emph{``hoy voy a hablar de...''}. Empieza con una historia personal corta, una imagen concreta, una pregunta provocadora, un dato impactante. Su misión: ganar la atención en los primeros 15 segundos. (2) \textbf{Desarrollo (2 min)}: aquí se construye la historia. Tiene tensión (algo en juego), tiene cifras o ejemplos concretos, tiene una progresión (no es lista de datos). Termina llegando al punto principal. (3) \textbf{Cierre (30 seg)}: conclusión memorable. Puede ser una imagen final, una invitación a hacer algo, una pregunta abierta. Su misión: dejar al oyente pensando.
  - |-
    Los \textbf{5 ganchos más usados} en discursos TED: (a) \textbf{Historia personal corta}: \emph{``Cuando tenía 10 años, descubrí que...''}. (b) \textbf{Pregunta provocadora}: \emph{``¿Cuánto tiempo de tu vida real has pasado en redes sociales?''}. (c) \textbf{Dato impactante}: \emph{``Hoy, mientras yo hablo, 50 estudiantes en Cartago abandonan el colegio para siempre''}. (d) \textbf{Imagen concreta}: \emph{``Mi abuela tiene 84 años y nunca ha viajado más allá de su barrio''}. (e) \textbf{Cita inesperada o paradoja}: \emph{``La forma más rápida de no aprender nada es estudiar mucho''}.
  - |-
    Los \textbf{5 errores típicos} del orador novato: (1) \textbf{Empezar con saludo extenso}: \emph{``Buenos días, mi nombre es X, hoy voy a hablarles de Y...''} pierde 30 segundos sin enganchar. (2) \textbf{Leer el guion}: leer mata el discurso aunque el contenido sea bueno. (3) \textbf{Sin tensión}: el desarrollo no tiene conflicto ni pregunta, es lista de datos. (4) \textbf{Cierre débil}: \emph{``Bueno, eso es todo, gracias''} en lugar de cierre memorable. (5) \textbf{Pasarse del tiempo}: 5 minutos cuando se pidieron 3 indica falta de preparación.
  - |-
    Algoritmo: (1) elegir tema personal (algo que te importa). (2) escribir gancho de 30 seg. (3) desarrollar conflicto en 2 min con cifras o ejemplos concretos. (4) cerrar con imagen o invitación de 30 seg. (5) escribir guion completo (400-500 palabras). (6) ensayar 2 veces sin grabar. (7) grabar con celular. (8) escuchar grabación. (9) autocrítica.
  anatomia:
    titulo: Anatomía del discurso TED de 3 min
    body: |-
      \textbf{Gancho (30 seg):} historia / pregunta / dato / imagen. \\[1mm] \textbf{Desarrollo (2 min):} tensión + cifras + progresión. \\[1mm] \textbf{Cierre (30 seg):} imagen / invitación / pregunta. \\[1mm] \textbf{Guion:} 400-500 palabras. \\[1mm] \textbf{Voz:} 150 palabras por minuto cuando se entiende.
  errores_comunes: |-
    (1) Empezar con saludo extenso en vez de gancho. (2) Leer el guion en lugar de contar. (3) Desarrollo sin tensión, solo lista de datos. (4) Cierre débil con \emph{``gracias''}. (5) Pasarse del tiempo. (6) Hablar muy rápido por nervios. (7) Voz monótona sin cambios de tono.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía discurso TED». \textbf{Formato:} (a) los 3 actos con tiempo; (b) los 5 ganchos con ejemplo de cada uno; (c) los 7 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías diseñar el gancho de tu propio discurso.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Discurso TED grabado} (40 min en sesión + 1 hora de ensayo y grabación en casa · individual). Hora de crear. Eliges tema personal, escribes guion, ensayas, grabas, autocriticas.
  pilares:
  - |-
    Tu discurso se construye en 7 pasos: (1) elegir tema personal (qué te importa, qué aprendiste, qué cambiarías). (2) escribir gancho de 30 seg. (3) desarrollar 2 min con conflicto + ejemplos. (4) cerrar con imagen o invitación de 30 seg. (5) guion completo (400-500 palabras). (6) ensayar 2 veces sin grabar. (7) grabar con celular en una sola toma o máximo 3 cortes.
  - |-
    Sigue el patrón \textbf{``personal sobre genérico''}: el discurso que comparte algo personal engancha más que el que repite ideas genéricas. La phronesis del oficio narrativo consiste en \textbf{arriesgarte con tu propia voz}, no esconderte detrás de frases comunes.
  - |-
    La autocrítica después de escuchar la grabación tiene 4 dimensiones: (a) \textbf{Tiempo}: ¿se ajustó a 3 minutos?. (b) \textbf{Voz}: ¿sonó natural o leyendo?. (c) \textbf{Estructura}: ¿el gancho funcionó?, ¿el cierre dejó pensando?. (d) \textbf{Conexión}: ¿se notó que te importaba el tema?.
  - |-
    Algoritmo: (1) elegir tema. (2) escribir guion. (3) ensayar. (4) grabar. (5) escuchar. (6) identificar 2 fortalezas. (7) identificar 2 mejoras concretas. (8) entregar al docente: guion + link/archivo de grabación + autocrítica.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Tema personal elegido. \\[1mm] \checkbox Gancho escrito que paraliza. \\[1mm] \checkbox Desarrollo con conflicto y cifras concretas. \\[1mm] \checkbox Cierre memorable con imagen o invitación. \\[1mm] \checkbox Guion de 400-500 palabras. \\[1mm] \checkbox Ensayado al menos 2 veces sin grabar. \\[1mm] \checkbox Grabación de 3 minutos hecha con celular. \\[1mm] \checkbox Autocrítica con 2 fortalezas + 2 mejoras.
  plantilla_guion: |-
    \textbf{Gancho (30s).} \textit{Historia / pregunta / dato / imagen.} \\[1mm] \textbf{Desarrollo (2 min).} \textit{Conflicto + cifras + progresión.} \\[1mm] \textbf{Cierre (30s).} \textit{Imagen final o invitación.} \\[1mm] \textbf{Autocrítica.} \textit{Fortalezas + mejoras concretas.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Mi discurso TED». \textbf{Formato:} (a) guion completo; (b) link o archivo de la grabación; (c) autocrítica. \textbf{Sabes que terminaste cuando} podrías mostrar la grabación a un familiar y pediría escucharla otra vez.
  producto_titulo: Discurso TED 3 min + guion + grabación + autocrítica
  criterios:
  - 3 actos identificables (gancho/desarrollo/cierre)
  - Guion 400-500 palabras
  - Grabación 3 minutos exactos
  - Tema personal arriesgado
  - Cierre memorable
  - Autocrítica con fortalezas y mejoras
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El discurso que da voz a algo personal o comunitario es liberador; el que repite frases hechas reproduce el silencio del sistema.
    aplicacion: |-
      Tu discurso TED puede limitarse a frases genéricas que cualquiera podría decir, o puede arriesgarse a contar algo personal o de tu comunidad. La filosofía de la liberación pide lo segundo. La voz propia (\emph{``mi abuela me enseñó esto''}, \emph{``en mi barrio pasa esto''}) tiene más fuerza que el discurso impersonal. La phronesis del oficio narrativo consiste en \textbf{arriesgarse a contar lo propio}.
    pregunta_espejo: |-
      ¿Mi discurso da voz a algo personal, o repite ideas que cualquiera podría decir?
  estoico:
    autor: Epicteto
    cita: |-
      El cronómetro es disciplina; el discurso que se pasa muestra falta de oficio, no abundancia de ideas.
    aplicacion: |-
      Es tentador hablar más de los 3 minutos asignados creyendo que \emph{``tenía mucho que decir''}. La disciplina estoica recomienda lo opuesto: \emph{ajustarse al cronómetro es la mayor demostración de respeto al oyente}. El orador que se pasa muestra falta de preparación, no exceso de contenido. La phronesis honra al disciplinado.
    pregunta_espejo: |-
      ¿Estoy respetando los 3 minutos como disciplina, o ignoro el tiempo asignado?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Hablar con responsabilidad en la era de la atención escasa es la nueva ética de la palabra pública.
    aplicacion: |-
      En la era de la información, todos compiten por la atención del oyente. La ética digital pide que cuando ganas atención (por 3 minutos), respetes ese tiempo con palabra cuidada. Tu discurso de hoy te entrena en una práctica que rige toda profesión que comunique en público.
    pregunta_espejo: |-
      ¿Mi discurso respeta el tiempo del oyente con palabras cuidadas, o lo desperdicia con relleno?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu discurso grabado y la autocrítica. En la sesión 4 vas a aprender \textbf{edición de imagen con ética visual} (recorte, brillo, contraste, derechos de imagen). La narrativa oral de hoy es voz; la edición visual de mañana es ojo.
web:
  conceptos_clave:
    - termino: Estructura TED de 3 actos
      definicion: |-
        Estructura clásica del discurso breve y de impacto. Gancho (10-15%), desarrollo (70-75%) y cierre (10-15%).
      ejemplo: |-
        En 3 minutos, 30 segundos de gancho, 2 minutos de desarrollo y 30 segundos de cierre. La proporción no es decorativa.
      emoji: "🎭"
    - termino: Gancho
      definicion: |-
        Primera oración que paraliza al oyente. No introduce; engancha. Puede ser historia, pregunta, dato o imagen.
      ejemplo: |-
        "En este barrio, 3 de cada 10 estudiantes ha pensado en dejar el colegio este año." Engancha con dato, no con saludo.
      emoji: "🪝"
    - termino: Desarrollo
      definicion: |-
        Cuerpo central del discurso. Cuenta la historia, desarrolla el conflicto, entrega los argumentos. Necesita tensión.
      ejemplo: |-
        Para 3 minutos, ocupa unos 2 minutos. Hay algo en juego, una pregunta sin respuesta clara que mantiene la atención.
      emoji: "📖"
    - termino: Cierre
      definicion: |-
        Conclusión que deja una imagen, una invitación o una pregunta abierta para el oyente. No es resumen; es marca.
      ejemplo: |-
        "Si tres compañeros piensan en irse, ¿qué hace usted mañana al saludar?" Cierra con pregunta directa.
      emoji: "🎬"
    - termino: Regla de las 150 palabras por minuto
      definicion: |-
        Ritmo de habla profesional. Para 3 minutos, alrededor de 400-500 palabras escritas. Más, no se entiende; menos, se desperdicia tiempo.
      ejemplo: |-
        Escribes el discurso, lo cuentas, ajustas. Si pasas de 500 palabras para 3 minutos, hay que recortar.
      emoji: "⏱️"
  quiz:
    titulo: ¿Construyes narrativa TED?
    instrucciones: 5 preguntas para verificar que dominas la estructura de 3 actos.
    preguntas:
      - enunciado: ¿Qué porcentaje del tiempo total ocupa el gancho en un discurso TED?
        opciones:
          - 10-15%
          - 50%
          - 70%
          - 90%
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. 10-15%. El gancho es corto pero decisivo; engancha en segundos para mantener al oyente.
        feedback_incorrecto: |-
          Es 10-15%. Corto pero crítico. El gancho debe enganchar en pocos segundos, no extenderse.
      - enunciado: ¿Cuál es la diferencia entre introducir y enganchar?
        opciones:
          - No hay diferencia
          - Introducir es más corto
          - Enganchar siempre es con chistes
          - Introducir presenta el tema, enganchar paraliza al oyente con algo concreto
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. Introducir es presentar; enganchar es paralizar al oyente con historia, dato, pregunta o imagen.
        feedback_incorrecto: |-
          Introducir es presentación general; enganchar es paralizar con algo concreto y específico que cree atención inmediata.
      - enunciado: Para un discurso de 3 minutos, ¿cuántas palabras escritas son razonables?
        opciones:
          - 100
          - 400-500
          - 1500
          - 3000
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 400-500 palabras. A 150 palabras por minuto, 3 minutos caben en esa extensión.
        feedback_incorrecto: |-
          Son 400-500 palabras (a unas 150 por minuto). Más se atropella; menos sobra tiempo sin contenido.
      - enunciado: ¿Qué define un buen cierre TED?
        opciones:
          - Resumir lo dicho punto por punto
          - Dar las gracias largo
          - Dejar una imagen, invitación o pregunta que marque al oyente
          - Pedir aplausos
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. El cierre deja marca: imagen, invitación o pregunta. No es resumen; es golpe final.
        feedback_incorrecto: |-
          El cierre debe dejar marca con una imagen, invitación o pregunta. Resumir es desperdiciar el último impacto.
      - enunciado: La regla "lo que no se puede contar en 3 minutos, todavía no es idea clara" significa que...
        opciones:
          - Hay que hablar rápido
          - Solo se puede hablar 3 minutos
          - Si necesitas mucho tiempo, no has terminado de afinar tu idea
          - 3 minutos es el límite legal
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. La regla apunta a la claridad mental: si no cabe en 3 minutos, el orador aún no comprende a fondo su idea.
        feedback_incorrecto: |-
          Significa que el límite revela claridad. Si no logras condensar en 3 minutos, la idea todavía no está afinada.

clave: 3-3
grado: 8
periodo: 3
sesion: 3
completo: true
duracion_min: 90
titulo: Narrativa oral --- tres minutos con voz propia
titulo_portada: |-
  Tres minutos
  con voz propia
producto_final: |-
  Un discurso oral de tres minutos sobre algo que te importa, que aprendiste o que quisieras cambiar, con guion escrito de 400 a 450 palabras en tres actos: gancho de 30 segundos, desarrollo de dos minutos y cierre de 30 segundos con una petición concreta. Grabado con el celular en una sola toma o con máximo tres cortes, y una autocrítica con dos cosas que funcionaron y una que cambiarías.
apertura:
  origen: Pueblo nasa del norte del Cauca · Radio Pa'yumat y el Tejido de Comunicación de la ACIN
  fuente: |-
    Tejido de Comunicación ACIN. (s.\,f.). \emph{Radio Pa'yumat}. Consultado el 7 de septiembre de 2026. · Aley, P. (2012, 22 de septiembre). Conozca la emisora de la resistencia indígena. \emph{El Tiempo}.
  saber_ancestral: |-
    Desde el cerro Munchique, en Santander de Quilichao, una emisora del pueblo nasa abre cada mañana con la misma frase: «Muy buenos días, pa'yumat. Gracias por dejarnos entrar» (Aley, 2012). \textbf{Pa'yumat} quiere decir bienvenido, y también pedir permiso para entrar. Así se llama la emisora, y hace parte del Tejido de Comunicación de la Asociación de Cabildos Indígenas del Norte del Cauca. Su razón de existir cabe en una línea del propio Tejido: «recuperar la palabra y proyectarla, para que otros no hablen por nosotros». Los programas se hacen en nasa yuwe y en castellano. Los hacen comunicadores de la misma comunidad, que cuentan lo que pasa en los resguardos con su propia voz. Fíjate en el saludo: no empieza con «hoy vamos a hablar de». Pide permiso, agradece, y entra. La \textbf{cara de exclusión}: en 2012 hubo atentados contra las antenas y torres de la zona; la señal perdió alcance y los equipos tuvieron que bajarse del cerro. Hablar con voz propia, allá, tiene un costo que aquí no tiene. Hoy vas a hablar tres minutos de algo que te importa, con tu voz, y a empezar como Pa'yumat: pidiendo permiso, no anunciando.
  saber_contemporaneo: |-
    Un discurso corto se sostiene en \textbf{tres actos}. El \textbf{gancho}, unos 30 segundos: la primera frase no anuncia, entra. Puede ser una escena, una pregunta que incomoda, un dato con fuente o una imagen concreta. El \textbf{desarrollo}, unos dos minutos: aquí va la historia con algo en juego, una tensión que no se resuelve de inmediato. El \textbf{cierre}, unos 30 segundos: vuelve al gancho y pide algo concreto a quien escucha. Tres minutos hablados son entre 400 y 450 palabras a un ritmo normal; por eso el guion se escribe y se cuenta con cronómetro. Se escribe en prosa, como se habla, no en viñetas. Y no se lee: leer mata el discurso aunque el texto sea bueno. Se ensaya hasta que salga contado. Los errores más comunes son cinco: empezar con un saludo largo, leer, contar sin tensión, cerrar con un «gracias» y pasarse del tiempo.
  pregunta_puente: |-
    Radio Pa'yumat entra pidiendo permiso, no anunciando el programa. Si tu discurso empieza con «hoy les voy a hablar de», ¿cuántos de los 30 segundos del gancho gastaste sin decir nada?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los tres actos en un cuento o una película que conoces; (2) \textbf{crear} un guion de 400 a 450 palabras con gancho, desarrollo y cierre; (3) \textbf{evaluar} tu grabación con dos aciertos y un cambio; (4) \textbf{explicar} por qué un gancho pide permiso en vez de anunciar.
puentes:
  a_ruta: |-
    En la sesión 2 armaste caminos con un menú que lleva la esencia. Hoy cuentas algo con tu voz en tres minutos, y el gancho hace lo que hacía el menú. En la sesión 4 vas a editar imágenes con ética.
  a_escuta: |-
    Antes de escribir, vas a encontrar los tres actos en una historia que ya conoces. Si sabes dónde te atrapó y dónde te soltó, sabes qué es un gancho y un cierre.
  a_sistematizacion: |-
    Ya viste los tres actos en otra historia. Ahora aprendes los cinco ganchos y, con tu pareja, escribes y cronometras tu guion.
  a_praxis: |-
    Ya tienes el guion. Toca ensayar sin leer, grabar con el celular y hacer la autocrítica.
  a_producto: |-
    Lo que entregas hoy: el guion, la grabación y la autocrítica. La prueba de calidad: tu pareja escucha los primeros 30 segundos y dice si quiere seguir oyendo o no.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Tres minutos contados con tu voz valen más que diez leídos de una pantalla.
  a_triangulo: |-
    Para terminar, tres ideas sobre hablar con voz propia, contadas con palabras de esta guía: Dussel sobre la voz que irrumpe desde fuera, Marco Aurelio sobre meterse en el alma de quien habla, y la Onlife Initiative sobre lo que rechazamos porque no lo entendemos.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Los tres actos de una historia que conoces} (15 min · individual). (1) Elige una historia que recuerdes bien: una película, un capítulo de serie, un cuento de tu abuela, un partido. (2) Escribe cómo empezó y qué te atrapó en el primer minuto: ese es el gancho. (3) Escribe qué estaba en juego en la mitad y en qué momento no sabías cómo iba a terminar: ese es el desarrollo. (4) Escribe cómo cerró y si el final volvió a algo del principio: ese es el cierre. (5) Anota en una línea qué habrías cambiado del gancho o del cierre.
  checks:
  - Tengo el gancho, el desarrollo y el cierre de una historia que conozco.
  - Escribí qué estaba en juego en la mitad.
  - Anoté si el cierre volvió al principio.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Los tres actos de una historia que conoces». \textbf{Formato:} tres bloques de dos o tres líneas, gancho, desarrollo y cierre, y la línea de lo que cambiarías. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes decir en qué momento exacto la historia te atrapó y en cuál te soltó.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · CREA --- El guion de tres minutos} (30 min · parejas). (1) Elige el tema: algo que te importa, algo que aprendiste, algo que quisieras cambiar del colegio o del barrio. (2) Escribe el gancho en tres o cuatro frases, sin saludo largo y sin «hoy voy a hablar de»: una escena, una pregunta, un dato con fuente o una imagen. (3) Escribe el desarrollo en prosa, con algo en juego, hasta llegar a unas 300 palabras. (4) Escribe el cierre: vuelve al gancho y pide algo concreto a quien escucha. (5) Léelo a tu pareja con cronómetro; si pasa de 3:15, recorta; si no llega a 2:45, falta desarrollo.
  pilares:
  - |-
    \textbf{Los cinco ganchos.} Una escena personal corta: «cuando tenía diez años…». Una pregunta que incomoda: «¿cuántas horas de tu vida real llevas en el celular?». Un dato con fuente: solo si sabes de dónde salió. Una imagen concreta: algo que se pueda ver. Un permiso, como Pa'yumat: «gracias por escucharme tres minutos».
  - |-
    \textbf{El desarrollo con algo en juego.} Una lista de datos no es un desarrollo. Hace falta una tensión: algo que podía salir mal, una decisión difícil, una pregunta sin respuesta hasta el final. Si quien escucha ya sabe cómo termina, deja de escuchar.
  - |-
    \textbf{El cierre que vuelve.} El mejor cierre toca algo del gancho: la misma escena, la misma pregunta ya respondida. Y pide algo concreto: «pregúntale a tu abuela», «apaga el celular una hora». Un «gracias» no es un cierre.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Elegir el tema. (2) Escribir el gancho. (3) Escribir el desarrollo con tensión. (4) Escribir el cierre que vuelve y pide. (5) Cronometrar con tu pareja. (6) Recortar o ampliar.
  anatomia:
    titulo: El discurso de tres minutos, en una mirada
    body: |-
      \textbf{Gancho (30 s):} entra, no anuncia. \\[1mm] \textbf{Desarrollo (2 min):} algo en juego. \\[1mm] \textbf{Cierre (30 s):} vuelve al gancho y pide algo. \\[1mm] \textbf{Guion:} 400 a 450 palabras en prosa. \\[1mm] \textbf{Regla:} se cuenta, no se lee.
  errores_comunes: |-
    (1) \textbf{Saludo largo}: «buenos días, mi nombre es, hoy voy a hablar de» gasta el gancho. (2) \textbf{Leer}: aunque el texto sea bueno, suena a lectura. (3) \textbf{Sin tensión}: una lista de datos que no va a ningún lado. (4) \textbf{Cierre con «gracias»}: no pide nada ni vuelve al principio. (5) \textbf{Pasarse del tiempo}: a los cuatro minutos ya nadie escucha.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · CREA).} \textbf{Título:} «Actividad 2 --- El guion de tres minutos». \textbf{Formato:} el guion completo en prosa con los tres actos marcados al margen, el conteo de palabras y el tiempo que marcó el cronómetro. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} el guion tiene entre 400 y 450 palabras, la primera frase no anuncia y el cierre pide algo.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Grabar y criticarse} (25 min · individual). (1) Ensaya dos veces sin mirar el guion; puedes tener tres palabras clave en un papel. (2) Graba con el celular en una sola toma; si te equivocas, sigue, y solo si es grave corta, máximo tres cortes. (3) Escucha la grabación completa con audífonos. (4) Escribe la autocrítica: dos cosas que funcionaron y una que cambiarías, con el minuto y segundo donde pasa. (5) Pásale a tu pareja solo los primeros 30 segundos y pregúntale si quiere seguir oyendo.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) El guion con los tres actos marcados. (2) La grabación compartida con enlace o archivo. (3) La autocrítica con dos aciertos y un cambio, cada uno con su minuto y segundo.
  - |-
    \textbf{Contar, no leer.} Tres palabras clave en un papel son suficientes. Si se te olvida una frase, di la idea con otras palabras. Nadie tiene el guion; nadie sabe que cambiaste algo.
  - |-
    \textbf{La prueba de los 30 segundos.} Tu pareja oye el gancho y nada más. Si dice «quiero saber qué pasa», el gancho entró. Si dice «¿y de qué es?», anunciaste en vez de entrar.
  - |-
    \textbf{La autocrítica con minuto y segundo.} «Estuve nervioso» no sirve. «En 1:40 aceleré y no se entendió la pregunta» sí sirve, porque dice qué ensayar la próxima vez.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Guion de 400 a 450 palabras en prosa con tres actos marcados. \\[1mm] \checkbox La primera frase entra sin saludo largo ni «hoy voy a hablar de». \\[1mm] \checkbox El desarrollo tiene algo en juego. \\[1mm] \checkbox El cierre vuelve al gancho y pide algo concreto. \\[1mm] \checkbox Grabación de 2:45 a 3:15, una toma o máximo tres cortes, sin leer. \\[1mm] \checkbox Autocrítica con dos aciertos y un cambio, con minuto y segundo. \\[1mm] \checkbox Mi pareja oyó los primeros 30 segundos y dijo si quería seguir.
  plantilla_guion: |-
    \textbf{Gancho.} \textit{La primera frase es …} \\[1mm] \textbf{En juego.} \textit{Lo que podía salir mal era …} \\[1mm] \textbf{Cierre.} \textit{Vuelvo a … y pido …} \\[1mm] \textbf{Tiempo.} \textit{… palabras, …:… en el cronómetro.} \\[1mm] \textbf{Cambio.} \textit{En …:… voy a …}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Grabar y criticarse». \textbf{Formato:} el enlace o nombre del archivo de la grabación, la duración exacta, la autocrítica con dos aciertos y un cambio con su minuto y segundo, y lo que dijo tu pareja tras 30 segundos. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} la grabación dura entre 2:45 y 3:15 y tu cambio tiene un minuto y segundo.
  producto_titulo: Discurso de tres minutos grabado + guion en tres actos + autocrítica con minuto y segundo + prueba de los 30 segundos
  criterios:
  - El guion tiene entre 400 y 450 palabras en prosa, con gancho, desarrollo y cierre marcados
  - La primera frase entra sin saludo largo ni anuncio
  - El desarrollo tiene algo en juego y el cierre vuelve al gancho y pide algo concreto
  - La grabación dura entre 2:45 y 3:15, en una toma o máximo tres cortes, y no suena leída
  - La autocrítica tiene dos aciertos y un cambio con minuto y segundo
  - Tu pareja oyó los primeros 30 segundos y dijo si quería seguir
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.2
    idea: |-
      La conciencia ética es saber escuchar la voz del otro cuando irrumpe desde fuera de lo establecido.
    aplicacion: |-
      Radio Pa'yumat existe para que otros no hablen por los nasa. Tu discurso es tu voz irrumpiendo con algo que te importa; y cuando escuches el de un compañero, la conciencia ética es oírlo aunque no sea lo que esperabas.
    pregunta_espejo: |-
      ¿A quién le hablan por encima en mi colegio, y qué diría con tres minutos propios?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 53 (c. 175 d.C.)
    idea: |-
      Acostúmbrate a atender de verdad a lo que dice el otro y a meterte, en lo posible, en su forma de ver.
    aplicacion: |-
      Un gancho funciona cuando quien escucha se mete en tu escena. Y cuando tu pareja te dice «en 1:40 no entendí», está atendiendo de verdad. Recibir eso sin defenderse es lo que mejora el discurso.
    pregunta_espejo: |-
      ¿Qué discurso de un compañero escuché hoy de verdad, y qué me hizo ver distinto?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), Prefacio
    idea: |-
      Tememos y rechazamos aquello a lo que no logramos darle sentido.
    aplicacion: |-
      Un discurso que empieza anunciando no le da sentido a nada; el oyente se va. El gancho da sentido en 30 segundos: una escena, una pregunta. Lo que tiene sentido no se rechaza.
    pregunta_espejo: |-
      ¿Qué de mi tema me daba miedo contar, y qué pasó cuando le di una escena?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu grabación y la autocrítica. En la sesión 4 vas a editar una imagen con recorte, brillo y contraste, y a responder cinco preguntas éticas antes de publicarla. La voz propia de hoy tiene una regla parecida: solo se usa la imagen de alguien con su permiso.
web:
  resumen: |-
    Un discurso de tres minutos tiene gancho, desarrollo y cierre, y se cuenta con voz propia sin leer. Hoy escribes, grabas y te criticas, empezando como Radio Pa'yumat: pidiendo permiso para entrar en vez de anunciar.
  subtema: Multimedia y ciberética
  pre_lectura:
    por_que_importa: |-
      Vas a tener que hablar en público toda la vida: sustentar, pedir, convencer. Saber entrar en 30 segundos y cerrar pidiendo algo es lo que hace que te escuchen.
    pregunta_detonante: |-
      Si tu discurso empieza con «hoy les voy a hablar de», ¿cuántos de los 30 segundos del gancho gastaste sin decir nada?
    activacion:
      titulo: La primera frase
      descripcion: |-
        En 3 minutos, escribe la primera frase de un discurso sobre algo que te importa. Ahora táchala si empieza con «hoy», «buenos días» o «mi nombre es». Escribe otra que sea una escena o una pregunta.
      duracion_min: 5
    conexion:
      anterior: En la sesión 2 armaste una presentación con menú y regresos.
      siguiente: En la sesión 4 editas una imagen y respondes cinco preguntas éticas.

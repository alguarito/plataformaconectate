clave: 3-4
grado: 8
periodo: 3
sesion: 4
completo: true
duracion_min: 90
titulo: Edición de imagen --- lo que se puede tocar y lo que no
titulo_portada: |-
  Lo que se puede tocar
  y lo que no
producto_final: |-
  Una imagen real editada con cuatro ajustes básicos, recorte, brillo, contraste y texto, en una herramienta gratuita, con la captura del antes y del después. Y la autoevaluación ética en cinco preguntas: si hay un rostro identificable, si tienes permiso, si la edición cambia el sentido, si declaras la fuente y si la imagen final trata bien a quien aparece.
apertura:
  origen: Orfebres prehispánicos del Cauca medio · la Colección Quimbaya y la sentencia SU-649 de 2017
  fuente: |-
    Corte Constitucional de Colombia. (2017). \emph{Sentencia SU-649/17} (M. P. Alberto Rojas Ríos), 19 de octubre.
  saber_ancestral: |-
    Hace más de mil años, orfebres del Cauca medio, hoy Quindío, fundieron en oro poporos y figuras que los coleccionistas llamaron «quimbayas». En 1891 el Estado colombiano compró 122 de esas piezas, encontradas en Filandia. En 1893 el presidente encargado Carlos Holguín las regaló a la reina regente de España. Nadie les preguntó a los pueblos del Cauca medio ni a los colombianos. Las piezas siguen en el Museo de América, en Madrid. En 2017 la Corte Constitucional dijo que ese regalo violó dos derechos de todos: la moralidad administrativa y el patrimonio público. Y ordenó al Estado hacer todo lo necesario para «repatriar y/o readquirir las 122 piezas» (Corte Constitucional, 2017). Lo que está en juego: algo que no era de quien lo regaló, sacado del lugar que le daba sentido. La \textbf{cara de exclusión}: ocho años después, las piezas no han vuelto. La Cancillería alegó que ninguna ley internacional obliga a devolver un regalo entre Estados. Y los orfebres que las hicieron no tienen voz en el pleito. Hoy vas a editar una imagen y antes de tocarla vas a preguntarte lo mismo: de quién es y quién dio permiso.
  saber_contemporaneo: |-
    Editar una imagen es sencillo: Canva, Photopea, GIMP o la app del celular hacen los \textbf{cuatro ajustes básicos}. \textbf{Recortar} quita partes para enfocar lo importante. \textbf{Brillo} aclara u oscurece. \textbf{Contraste} separa lo claro de lo oscuro para que se vea mejor. \textbf{Texto} agrega un título o una nota. Con eso se resuelve casi todo. Lo difícil no es la herramienta: es la \textbf{ética visual}. La Ley 1581 de 2012 protege los datos personales, y la imagen del rostro es uno de ellos: usarla exige permiso de la persona, o de sus padres si es menor. Y la edición puede mentir sin cambiar un píxel del rostro: un recorte que quita el contexto o un texto que la persona nunca dijo cambian el sentido. Por eso, antes de publicar, cinco preguntas: ¿hay rostro identificable?, ¿tengo permiso?, ¿la edición cambia el sentido?, ¿declaro la fuente?, ¿la imagen final trata bien a quien aparece? Si una responde mal, no se publica.
  pregunta_puente: |-
    Las piezas de Filandia se regalaron sin preguntarle a nadie y se exhiben lejos de donde tenían sentido. Si recortas una foto de un compañero y le pones un texto que no dijo, ¿qué le estás quitando y a quién le pediste permiso?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cómo un recorte o un texto cambian el sentido de la misma foto; (2) \textbf{aplicar} los cuatro ajustes básicos en una herramienta gratuita; (3) \textbf{evaluar} tu edición con las cinco preguntas éticas; (4) \textbf{explicar} por qué el permiso y la fuente no son opcionales.
puentes:
  a_ruta: |-
    En la sesión 3 hablaste con voz propia. Hoy tocas la imagen de alguien, y la regla cambia: la voz es tuya, la imagen es de quien aparece. En la sesión 5 vas a trabajar con audio.
  a_escuta: |-
    Antes de editar, vas a comparar tres versiones de la misma foto y ver cómo un recorte o un texto le cambian el sentido sin tocar el rostro.
  a_sistematizacion: |-
    Ya viste cómo se miente con un recorte. Ahora aprendes los cuatro ajustes y las cinco preguntas, y con tu pareja editas una imagen con permiso.
  a_praxis: |-
    Ya sabes editar. Toca elegir tu propia imagen, aplicar los cuatro ajustes, guardar el antes y el después y responder las cinco preguntas por escrito.
  a_producto: |-
    Lo que entregas hoy: el antes y el después, y la autoevaluación de cinco preguntas. La prueba de calidad: la persona que aparece ve tu edición y no se siente engañada.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Una edición modesta con permiso vale más que una espectacular que alguien no autorizó.
  a_triangulo: |-
    Para terminar, tres ideas sobre la imagen de otro, contadas con palabras de esta guía: Dussel sobre el rostro que no es instrumento, Epicteto sobre juzgar sin saber, y Floridi sobre lo que somos hechos de información.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tres versiones de la misma foto} (15 min · individual). (1) Tu docente proyecta tres versiones de una misma foto: la original, una recortada que deja por fuera algo importante, y una con un texto agregado que cambia el sentido. (2) Para cada versión escribe en una línea qué crees que está pasando en la foto. (3) Compara tus tres líneas: ¿cuál versión te hizo pensar algo distinto de lo que muestra la original? (4) Escribe qué se quitó en el recorte y qué se agregó en el texto. (5) Escribe en una línea a quién habría que pedirle permiso antes de publicar cualquiera de las tres.
  checks:
  - Escribí qué pasa en cada una de las tres versiones.
  - Identifiqué qué quitó el recorte y qué agregó el texto.
  - Escribí a quién habría que pedirle permiso.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Tres versiones de la misma foto». \textbf{Formato:} tres líneas, una por versión, la nota de qué se quitó y qué se agregó, y la línea del permiso. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes decir cuál versión miente y con qué herramienta lo hace, recorte o texto.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- Los cuatro ajustes con permiso} (30 min · parejas). (1) Con tu pareja, elijan una foto de las que trae tu docente, sin rostros de personas reales. O una que tomó uno de los dos, donde solo aparece esa persona y da permiso en voz alta. (2) Abran la foto en Canva, Photopea o la app del celular y guarden una copia del original: ese es el antes. (3) Recorten para enfocar lo importante sin quitar el contexto que cambia el sentido. (4) Ajusten brillo y contraste hasta que se vea mejor sin que parezca otra cosa. (5) Agreguen un texto corto que describa, no que invente, y guarden el después.
  pilares:
  - |-
    \textbf{Los cuatro ajustes.} Recorte: quita lo que sobra, pero si quita el contexto, miente. Brillo: aclara u oscurece toda la imagen. Contraste: separa claros y oscuros; poco deja todo gris, mucho quema los detalles. Texto: describe lo que hay; si pone palabras en boca de alguien, miente.
  - |-
    \textbf{Las cinco preguntas.} ¿Hay rostro identificable? Si sí, hace falta permiso explícito. ¿Tengo permiso? Oral o escrito, de la persona o de sus padres si es menor. ¿La edición cambia el sentido? Si un recorte o un texto hacen que parezca otra cosa, no. ¿Declaro la fuente? Si la foto no es tuya, se dice de quién es. ¿La imagen final trata bien a quien aparece? Si esa persona la viera, ¿se sentiría engañada?
  - |-
    \textbf{La lección de las 122 piezas.} Sacadas del Cauca medio y exhibidas en Madrid, siguen siendo del lugar que les dio sentido. Una foto recortada y publicada sin permiso hace lo mismo con una persona: la saca de su contexto y la exhibe como si fuera tuya.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Elegir una foto con permiso. (2) Guardar el antes. (3) Recortar sin quitar contexto. (4) Brillo y contraste sin exagerar. (5) Texto que describe. (6) Guardar el después. (7) Cinco preguntas.
  anatomia:
    titulo: La edición con ética, en una mirada
    body: |-
      \textbf{Recorte:} enfoca, pero no quita contexto. \\[1mm] \textbf{Brillo y contraste:} se ve mejor, no parece otra cosa. \\[1mm] \textbf{Texto:} describe, no inventa. \\[1mm] \textbf{Permiso:} de quien aparece, o de sus padres. \\[1mm] \textbf{Fuente:} de quién es la foto.
  errores_comunes: |-
    (1) \textbf{Editar sin permiso}: usar la foto de un compañero sin pedírsela. (2) \textbf{Recortar para engañar}: dejar por fuera lo que cambiaría la lectura. (3) \textbf{Texto que pone palabras}: una frase que la persona no dijo. (4) \textbf{Foto ajena sin fuente}: bajarla de internet y no decir de quién es. (5) \textbf{Filtro que cambia el cuerpo}: una edición que la persona no reconocería como suya.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- Los cuatro ajustes con permiso». \textbf{Formato:} el nombre de la foto y de quién es, los cuatro ajustes aplicados con una línea cada uno sobre qué cambió, y la nota del permiso. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tienes el antes y el después guardados y puedes decir qué hizo cada ajuste.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Tu imagen y las cinco preguntas} (25 min · individual). (1) Elige tu propia imagen: una que tomaste tú sin rostros ajenos, o una con permiso dado en voz alta y anotado. (2) Aplica los cuatro ajustes y guarda el antes y el después. (3) Responde por escrito las cinco preguntas, con una línea de explicación cada una. (4) Si alguna respuesta es «no» o «no sé», escribe qué tendrías que hacer antes de publicar. (5) Muéstrale el después a la persona que aparece, o a tu pareja si no aparece nadie. Pregúntale si reconoce la foto y si la publicaría.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) El antes y el después, exportados o con enlace. (2) Las cinco preguntas respondidas con su línea de explicación. (3) Lo que dijo la persona que aparece, o tu pareja, al ver el después.
  - |-
    \textbf{Una respuesta mala detiene todo.} Si no hay permiso, no se publica. Si el recorte cambia el sentido, se vuelve al original. Si la fuente no se sabe, se busca o no se usa. Las cinco preguntas no son un promedio: una sola basta para parar.
  - |-
    \textbf{El permiso se anota.} «Me dijo que sí» se olvida. «Le pregunté a Sara el martes y dijo que sí, para el afiche del festival» es un permiso. Para menores, el permiso lo dan los padres.
  - |-
    \textbf{La prueba de quien aparece.} La persona ve tu edición. Si dice «esa soy yo, publícala», pasaste. Si dice «yo no dije eso» o «ahí no se ve que estábamos jugando», el recorte o el texto mintieron.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Antes y después guardados y exportados. \\[1mm] \checkbox Cuatro ajustes aplicados: recorte, brillo, contraste y texto. \\[1mm] \checkbox El recorte no quita contexto ni el texto inventa. \\[1mm] \checkbox Permiso anotado con nombre y fecha, o foto sin rostros ajenos. \\[1mm] \checkbox Fuente declarada si la foto no es mía. \\[1mm] \checkbox Cinco preguntas respondidas con una línea cada una. \\[1mm] \checkbox La persona que aparece, o mi pareja, vio el después y dijo si la publicaría.
  plantilla_guion: |-
    \textbf{Foto.} \textit{De …, tomada el …} \\[1mm] \textbf{Permiso.} \textit{Le pregunté a … el … y dijo …} \\[1mm] \textbf{Recorte.} \textit{Quité … y dejé … porque …} \\[1mm] \textbf{Brillo y contraste.} \textit{Subí / bajé … para …} \\[1mm] \textbf{Texto.} \textit{Escribí «…», que describe …} \\[1mm] \textbf{Quien aparece dijo.} \textit{…}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Tu imagen y las cinco preguntas». \textbf{Formato:} el antes y el después pegados o con enlace, las cinco preguntas con su respuesta y su línea, la nota del permiso y lo que dijo quien aparece. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} las cinco respuestas están escritas y ninguna es «no» sin un plan para arreglarlo.
  producto_titulo: Imagen editada con cuatro ajustes + antes y después + cinco preguntas éticas respondidas + permiso anotado
  criterios:
  - El antes y el después están guardados y se ven los cuatro ajustes
  - El recorte no quita contexto que cambie el sentido y el texto describe, no inventa
  - Hay permiso anotado con nombre y fecha, o la foto no tiene rostros ajenos
  - La fuente está declarada si la foto no es tuya
  - Las cinco preguntas tienen respuesta y una línea de explicación cada una
  - Quien aparece, o tu pareja, vio el después y dijo si la publicaría
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.2.2
    idea: |-
      El rostro del otro se revela como alguien, no como una cosa más entre mis instrumentos.
    aplicacion: |-
      Una foto de tu compañero en tu carpeta se siente como un archivo más. No lo es: es un rostro, alguien que puede decir «yo no dije eso». Pedir permiso es tratar la imagen como rostro y no como instrumento.
    pregunta_espejo: |-
      ¿Qué foto de alguien tengo guardada como si fuera un archivo cualquiera?
  estoico:
    autor: Epicteto · Enquiridión, 45 (c. 125 d.C.)
    idea: |-
      Si ves a alguien hacer algo, no digas que lo hizo mal: no sabes desde dónde juzgar.
    aplicacion: |-
      Un recorte deja por fuera que estaban jugando; un texto pone una frase que nadie dijo. Quien mira la foto editada juzga sin saber. La ética visual empieza por no fabricar ese juicio.
    pregunta_espejo: |-
      ¿Qué foto recortada me hizo juzgar a alguien esta semana, y qué no me mostró?
  floridi:
    autor: Luciano Floridi · Hyperhistory and the Philosophy of Information Policies (2015)
    idea: |-
      Somos organismos hechos también de información, que vivimos en un entorno de información.
    aplicacion: |-
      Tu imagen es parte de ti, no un adorno que se puede tomar. Editar la foto de alguien sin permiso es tocar a esa persona. Las piezas de Filandia en Madrid muestran lo que pasa cuando algo así se hace a escala de un país.
    pregunta_espejo: |-
      ¿Qué parte de mí anda en fotos que otros editaron sin preguntarme?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu antes, tu después y las cinco preguntas. En la sesión 5 vas a grabar y editar audio: recorte, volumen y ruido, y a exportar en dos formatos. La regla del permiso sigue: la voz de alguien también es suya.
web:
  resumen: |-
    Editar una imagen es fácil; lo difícil es hacerlo con permiso y sin cambiar el sentido. Hoy aplicas cuatro ajustes y respondes cinco preguntas éticas, con la lección de las 122 piezas del Cauca medio regaladas sin preguntarle a nadie.
  subtema: Multimedia y ciberética
  pre_lectura:
    por_que_importa: |-
      Cada día se editan y publican fotos de personas que no dieron permiso. Saber qué se puede tocar y qué no es lo que separa una edición de un daño.
    pregunta_detonante: |-
      Si recortas una foto de un compañero y le pones un texto que no dijo, ¿qué le estás quitando y a quién le pediste permiso?
    activacion:
      titulo: La foto que te editaron
      descripcion: |-
        En 3 minutos, recuerda una foto tuya que alguien publicó o editó sin preguntarte. ¿Qué sentiste? Si no te ha pasado, ¿a quién le has hecho tú lo mismo?
      duracion_min: 5
    conexion:
      anterior: En la sesión 3 grabaste un discurso de tres minutos con tu voz.
      siguiente: En la sesión 5 grabas y editas audio y exportas en dos formatos.
  mapa_ruta:
    - numero: 1
      iconos: ["🌱"]
      titulo: Las 122 piezas de Filandia
      duracion_min: 10
    - numero: 2
      iconos: ["✏️"]
      titulo: Actividad 1 · Tres versiones de la misma foto
      duracion_min: 15
    - numero: 3
      iconos: ["🔎", "✏️"]
      titulo: Actividad 2 · Los cuatro ajustes con permiso
      duracion_min: 30
    - numero: 4
      iconos: ["🔎", "✅"]

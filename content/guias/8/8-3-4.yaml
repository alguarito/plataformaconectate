clave: 3-4
grado: 8
periodo: 3
sesion: 4
completo: true
titulo: Edición de imagen --- ética visual y derechos de imagen
titulo_portada: |-
  Edición de imagen ---
  ética visual
  y derechos de imagen
producto_final: |-
  1 imagen real editada con al menos 4 ajustes básicos (recorte, brillo, contraste, agregar texto) usando una herramienta gratuita (Canva, GIMP, Photopea, app del celular) + captura del antes y del después + autoevaluación ética en 5 preguntas (¿hay rostro identificable?, ¿tengo permiso?, ¿la edición altera el sentido original?, ¿declaro autoría o respeto la fuente?, ¿la imagen final dignifica o reduce a la persona retratada?) con respuesta honesta en 2 líneas por pregunta
apertura:
  saber_ancestral: |-
    En el centro de Cartago, antes de las imprentas digitales, había un oficio que sostenía la comunicación visual: \textbf{el pintor de carteles}. Cuando un comerciante anunciaba apertura, una familia un velorio o el alcalde una reunión, el pintor bajaba a la plaza con pinceles y cuaderno de bocetos. Su trabajo era \textbf{representación pública}, y seguía un código ético estricto: \textbf{nunca burla del retratado, nunca mentira sobre quién era}. Si pintaba el rostro del comerciante, lo hacía con respeto: sin caricaturizar, sin alterar facciones. Si era para un velorio, con la dignidad que la familia merecía. El pintor que se burlaba perdía clientela en una semana. La sabiduría era inquebrantable: \textbf{cuando representas a otra persona, la representación debe respetarla}. Esa ética visual del oficio antiguo es exactamente la que pide la edición de imagen digital responsable, en la era de Photoshop, deepfakes y memes virales.
  saber_contemporaneo: |-
    La \textbf{edición de imagen digital} permite ajustar fotografías con herramientas simples: recortar (eliminar partes), ajustar brillo y contraste (hacer más visible), agregar texto (anotaciones), aplicar filtros, modificar colores. Las herramientas más usadas y accesibles: \textbf{Canva} (gratis, en línea, fácil), \textbf{GIMP} (gratis, descargable, profesional), \textbf{Photopea} (gratis, en línea, similar a Photoshop), apps de celular como \textbf{Snapseed} o las propias del teléfono. La regla técnica es simple: 4 ajustes básicos cubren el 80\% de las necesidades cotidianas. Pero el oficio profesional tiene una segunda capa: \textbf{la ética visual}. La \textbf{Ley 1581 de 2012} de Colombia regula el uso de datos personales, incluyendo imágenes de personas. La \textbf{Constitución de Colombia (art. 15)} protege el derecho a la imagen propia. La regla profesional: \textbf{toda imagen de una persona requiere permiso explícito para ser editada y publicada}; sin permiso, la edición y publicación pueden constituir violación de derechos. Más allá de la ley, la \textbf{ética visual} pide algo simple: cuando editas la imagen de alguien, la edición debe dignificar o al menos no degradar.
  pregunta_puente: |-
    ¿Qué sabía el pintor de carteles del centro al respetar la imagen del retratado, que el editor digital novato olvida cuando hace memes burlándose de un compañero? ¿Y por qué un recorte aparentemente inocente puede cambiar el sentido completo de una imagen?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué tipo de edición preserva el sentido original de la imagen y qué tipo lo altera; (2) \textbf{analizar} los derechos legales y éticos involucrados en el uso de imágenes de personas; (3) \textbf{evaluar} una edición propia con 5 preguntas éticas que cubran rostro, permiso, sentido, autoría y dignidad; (4) \textbf{crear} 1 imagen editada con ajustes básicos aplicados con responsabilidad ética.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 1-3 aprendiste diseño visual, narrativa interactiva y discurso oral. Hoy aprendes a manipular imágenes con responsabilidad. Las próximas sesiones (audio, ciberseguridad, estética) seguirán construyendo tu oficio multimedia con criterio ético.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio del comparador}: tu docente proyecta o entrega 3 versiones de la misma foto (original, recortada para excluir contexto, con texto agregado que cambia el sentido) y tú anotas cómo cambia el mensaje según la edición.
  a_sistematizacion: |-
    Ya hiciste el ejercicio. Ahora vas a entender la \textbf{anatomía de la edición responsable}: los 4 ajustes básicos, las 5 preguntas éticas, los 5 errores típicos del editor novato.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: eliges 1 imagen propia o con permiso, aplicas 4 ajustes básicos, capturas antes/después, completas autoevaluación ética con las 5 preguntas.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: imagen editada + capturas antes/después + autoevaluación. El criterio principal: que puedas defender públicamente cada decisión de edición ante la persona retratada.
  a_evaluacion: |-
    Antes de cerrar, mira la edición desde las cinco dimensiones humanas. Editar con permiso y respeto es honor del oficio; manipular imágenes sin consentimiento es violencia técnica encubierta.
  a_triangulo: |-
    Y para terminar, tres voces sobre la imagen del otro. Dussel sobre las imágenes que dignifican o degradan, Marco Aurelio sobre mostrar la verdad sin manipulación, Floridi sobre la ética visual en la era de las imágenes virales.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Ejercicio del comparador} (15 min · individual). Tu docente proyecta 3 versiones de una misma foto (puede ser una imagen genérica o un ejemplo del aula): (a) original sin editar, (b) recortada de manera que se excluye contexto importante, (c) con texto agregado que cambia el sentido. Anota: (1) ¿qué cambia en el mensaje entre la versión A y B?, (2) ¿qué cambia entre A y C?, (3) ¿alguna de las ediciones podría considerarse engañosa?, ¿por qué?.
  checks:
  - Comparé 3 versiones de la misma imagen.
  - Identifiqué cómo cambia el mensaje según la edición.
  - Detecté qué edición podría ser engañosa.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Comparador de ediciones». \textbf{Formato:} 3 fichas con descripción de cada versión + 1 línea sobre qué cambia el mensaje. \textbf{Sabes que terminaste cuando} ves que la edición no es neutral: cambia el significado.
sistematizacion:
  intro: |-
    El ejercicio te enseñó que las ediciones cambian sentido. Ahora necesitas la \textbf{anatomía técnica y ética}: los 4 ajustes, las 5 preguntas éticas, los errores típicos.
  pilares:
  - |-
    Los \textbf{4 ajustes básicos} de edición se descomponen así: (1) \textbf{Recorte}: eliminar partes de la imagen para enfocar lo importante. Cuidado: si recortas el contexto, puedes cambiar el sentido. (2) \textbf{Brillo}: hacer más clara o más oscura. (3) \textbf{Contraste}: aumentar la diferencia entre claros y oscuros. (4) \textbf{Agregar texto}: anotaciones, títulos, citas. Estos 4 ajustes son suficientes para la mayoría de tareas escolares y profesionales básicas.
  - |-
    Las \textbf{5 preguntas éticas} que toda edición responsable debe responder: (1) \textbf{¿Hay rostro identificable?}: si sí, exige permiso explícito de la persona. (2) \textbf{¿Tengo permiso?}: oral o escrito de la persona retratada (en caso de menores, de los padres). (3) \textbf{¿La edición altera el sentido original?}: un recorte que excluye contexto puede ser tan engañoso como un texto añadido. (4) \textbf{¿Declaro autoría o respeto la fuente?}: si la imagen es ajena, citar al autor; si es propia, indicarlo. (5) \textbf{¿La imagen final dignifica o reduce a la persona retratada?}: la pregunta más importante.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿la persona retratada vería esta edición sin sentirse traicionada?}. Si la respuesta es sí, la edición es ética. Si la respuesta es no o dudosa, la edición no debe publicarse sin diálogo previo. La phronesis del oficio visual consiste en \textbf{tratar la imagen ajena como tratarías la tuya}.
  - |-
    Algoritmo: (1) elegir imagen (propia o con permiso). (2) abrir herramienta. (3) aplicar los 4 ajustes con criterio. (4) capturar antes/después. (5) responder las 5 preguntas éticas. (6) si alguna respuesta es problemática, ajustar la edición o no publicarla.
  anatomia:
    titulo: Anatomía de la edición responsable
    body: |-
      \textbf{4 ajustes:} recorte / brillo / contraste / texto. \\[1mm] \textbf{5 preguntas éticas:} rostro / permiso / sentido / autoría / dignidad. \\[1mm] \textbf{Regla:} la edición debe poder mostrarse a la persona retratada. \\[1mm] \textbf{Ley 1581 de 2012} regula uso de imágenes con datos personales.
  errores_comunes: |-
    (1) \textbf{Editar sin permiso}: usar la imagen de un compañero sin pedirle. (2) \textbf{Recortar para engañar}: excluir contexto que cambiaría la interpretación. (3) \textbf{Agregar texto manipulador}: poner frase que la persona no dijo. (4) \textbf{Usar imágenes ajenas sin citar}: descargar de Google sin acreditar autor. (5) \textbf{Filtros que degradan}: aplicar filtros que ridiculizan o caricaturizan al retratado.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía edición responsable». \textbf{Formato:} (a) los 4 ajustes; (b) las 5 preguntas éticas; (c) los 5 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías auditar éticamente cualquier edición.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- Imagen editada con autoevaluación ética} (35 min · individual). Hora de aplicar. Eliges una imagen, aplicas los 4 ajustes básicos, capturas antes y después, completas autoevaluación con las 5 preguntas.
  pilares:
  - |-
    Tu imagen se edita en 5 pasos: (1) elegir imagen apropiada (foto propia, foto del paisaje, foto de objeto sin personas, o foto con permiso explícito). (2) abrir la herramienta (Canva, Photopea, GIMP, app del celular). (3) aplicar los 4 ajustes con criterio: recorte para enfocar, brillo/contraste para mejorar visibilidad, texto para anotación útil. (4) capturar pantalla del antes y del después. (5) responder las 5 preguntas éticas con honestidad.
  - |-
    Sigue el patrón \textbf{``permiso explícito sobre presunción de consentimiento''}: nunca asumas que tienes permiso para usar la imagen de alguien. La phronesis del oficio visual exige preguntar antes de editar. Para esta sesión, lo más seguro es trabajar con imágenes propias, paisajes, objetos sin personas, o imágenes de bancos libres (Unsplash, Pixabay) acreditando autor.
  - |-
    Las respuestas a las 5 preguntas deben ser específicas, no genéricas. \emph{``Sí, tengo permiso''} no basta: \emph{``Sí, mi amigo Pedro autorizó por WhatsApp el 15 de mayo a las 14:30 que use esta foto del partido''}. Esa especificidad es la diferencia entre formalismo y ética real.
  - |-
    Algoritmo: (1) elegir imagen. (2) editar con los 4 ajustes. (3) capturar antes/después. (4) responder las 5 preguntas con honestidad específica. (5) decidir si la imagen final puede publicarse o si requiere ajuste o descarte.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Imagen elegida con derechos claros. \\[1mm] \checkbox 4 ajustes básicos aplicados. \\[1mm] \checkbox Captura del antes hecha. \\[1mm] \checkbox Captura del después hecha. \\[1mm] \checkbox Las 5 preguntas éticas respondidas. \\[1mm] \checkbox Respuestas específicas (no genéricas). \\[1mm] \checkbox Decisión de publicar o ajustar tomada.
  plantilla_guion: |-
    \textbf{Imagen origen.} \textit{Fuente + derechos.} \\[1mm] \textbf{Ajustes aplicados.} \textit{Cuáles 4 y por qué.} \\[1mm] \textbf{Antes/Después.} \textit{Capturas.} \\[1mm] \textbf{Pregunta 1 (rostro).} \textit{Sí/No + detalle.} \\[1mm] \textbf{Pregunta 2 (permiso).} \textit{Sí/No + cómo.} \\[1mm] \textbf{Pregunta 3 (sentido).} \textit{Se conserva o se altera.} \\[1mm] \textbf{Pregunta 4 (autoría).} \textit{Declaro fuente.} \\[1mm] \textbf{Pregunta 5 (dignidad).} \textit{Dignifica o reduce.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Imagen editada + autoevaluación». \textbf{Formato:} (a) referencia a la imagen original; (b) capturas antes/después pegadas; (c) las 5 preguntas con respuesta. \textbf{Sabes que terminaste cuando} podrías mostrar la imagen final a la persona retratada sin avergonzarte.
  producto_titulo: Imagen editada + capturas antes/después + autoevaluación ética
  criterios:
  - Imagen con derechos claros
  - 4 ajustes básicos aplicados
  - Capturas antes/después
  - Las 5 preguntas éticas respondidas con detalle
  - Decisión de publicación tomada con criterio
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Una edición que dignifica a la persona retratada es liberadora; una que la caricaturiza o degrada reproduce la violencia simbólica del sistema.
    aplicacion: |-
      Cuando editas una imagen con rostro humano, asumes responsabilidad sobre cómo esa persona aparecerá ante el mundo. La filosofía de la liberación pide que esa edición respete su dignidad. Una caricatura puede ser humor; pero también puede ser violencia. La phronesis del oficio consiste en \textbf{distinguir el límite con honestidad y consultar a la persona cuando hay duda}.
    pregunta_espejo: |-
      ¿Mi edición dignifica a la persona retratada, o aprovecha que ella no puede protestar para tomar atajos visuales?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Mostrar la verdad de la imagen es virtud; manipular para confundir es vicio del oficio visual.
    aplicacion: |-
      Es tentador recortar una imagen para excluir contexto incómodo, o agregar texto que sugiere algo que no ocurrió. La sabiduría estoica recomienda lo opuesto: \emph{muestra la imagen como es}. Si la edición altera el sentido original, declárelo explícitamente. La phronesis del oficio visual consiste en \textbf{no engañar con imágenes manipuladas}.
    pregunta_espejo: |-
      ¿Mi edición preserva la verdad de la imagen, o la manipula para sugerir algo que no era?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La ética visual es la nueva ética profesional en la era de las imágenes virales.
    aplicacion: |-
      En la era de la información, una imagen editada puede viralizar en minutos. La ética digital exige responsabilidad: nunca publicar imagen de persona sin permiso, nunca editar para engañar, siempre citar fuente cuando se usa contenido ajeno. Tu hoja de hoy te entrena en esa práctica que rige toda profesión que produzca o use imágenes.
    pregunta_espejo: |-
      Si mi imagen editada se viralizara en redes, ¿la persona retratada me agradecería o me demandaría?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu imagen editada y la autoevaluación. En la sesión 5 vas a aprender a trabajar con \textbf{audio}: captura, edición y formatos para producir piezas sonoras (podcast, entrevista, narración). La imagen de hoy es ojo; el audio de mañana es voz.
web:
  conceptos_clave:
    - termino: Edición básica de imagen
      definicion: |-
        Cuatro ajustes que cubren el 80% de las necesidades cotidianas: recortar, ajustar brillo y contraste, añadir texto, aplicar filtros suaves.
      ejemplo: |-
        Recortas una foto del patio del colegio, subes el brillo y agregas el título del evento. Listo para publicar.
      emoji: "✂️"
    - termino: Ley 1581 de 2012
      definicion: |-
        Ley colombiana de protección de datos personales. Incluye el tratamiento de imágenes de personas reconocibles.
      ejemplo: |-
        Publicar una foto reconocible de un compañero sin permiso puede violar la Ley 1581. Hay que pedir autorización antes.
      emoji: "📜"
    - termino: Derecho a la imagen propia
      definicion: |-
        Derecho constitucional (art. 15) que protege a las personas frente al uso, edición y publicación de su imagen sin consentimiento.
      ejemplo: |-
        Para usar la foto de un docente en un afiche del colegio, hay que pedirle permiso explícito; no basta con que sea "del colegio".
      emoji: "🛡️"
    - termino: Permiso explícito
      definicion: |-
        Autorización clara, escrita u oral, donde la persona acepta que su imagen sea editada y publicada con un propósito definido.
      ejemplo: |-
        "Autorizo a usar mi foto en el afiche del festival del colegio, no en redes personales." Permiso claro y delimitado.
      emoji: "✅"
    - termino: Ética visual
      definicion: |-
        Principio de oficio que pide que la edición dignifique o al menos no degrade a la persona retratada. Más allá de la ley.
      ejemplo: |-
        Una caricatura que ridiculiza el rasgo físico de alguien viola la ética visual, aun si la persona "se rió de la broma".
      emoji: "🪞"
  quiz:
    titulo: ¿Editas con ética visual?
    instrucciones: 5 preguntas para verificar que combinas técnica y derechos de imagen.
    preguntas:
      - enunciado: ¿Cuántos ajustes básicos cubren el 80% de las necesidades cotidianas de edición?
        opciones:
          - "1"
          - "4"
          - "20"
          - "100"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Recortar, brillo y contraste, texto y filtros. Cuatro pasos resuelven la mayoría de los casos del aula.
        feedback_incorrecto: |-
          Son 4: recortar, brillo y contraste, texto y filtros. Cuatro ajustes resuelven la mayoría de los casos cotidianos.
      - enunciado: ¿Cuál es la ley colombiana que protege los datos personales y las imágenes?
        opciones:
          - Ley 100 de 1993
          - Ley 1581 de 2012
          - Ley 30 de 1992
          - No hay ley
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La Ley 1581 de 2012 regula el tratamiento de datos personales, incluyendo imágenes.
        feedback_incorrecto: |-
          Es la Ley 1581 de 2012, marco general de protección de datos personales en Colombia.
      - enunciado: ¿Qué artículo de la Constitución protege el derecho a la imagen propia?
        opciones:
          - Artículo 5
          - Artículo 15
          - Artículo 50
          - Artículo 100
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El artículo 15 protege la intimidad y el derecho a la imagen propia.
        feedback_incorrecto: |-
          Es el artículo 15. Protege la intimidad personal y, dentro de ella, el derecho a la imagen propia.
      - enunciado: Editas y publicas la foto de un compañero sin pedirle permiso. ¿Qué problema tienes?
        opciones:
          - Ninguno, es del colegio
          - Puedes estar violando la Ley 1581 y el derecho constitucional a la imagen
          - Solo si la foto es fea
          - Solo si la edición es muy fuerte
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Sin permiso explícito, la publicación puede violar la ley y el derecho constitucional. No depende del resultado estético.
        feedback_incorrecto: |-
          El problema es legal y ético. Sin permiso explícito, la publicación puede violar la Ley 1581 y el artículo 15 constitucional.
      - enunciado: ¿Qué pide la ética visual además de cumplir la ley?
        opciones:
          - Que la edición sea creativa
          - Que la edición dignifique o al menos no degrade a la persona retratada
          - Que tenga filtros llamativos
          - Que tenga muchos colores
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La ética visual va más allá del permiso legal: pide que la edición respete la dignidad de la persona retratada.
        feedback_incorrecto: |-
          La ética visual pide que la edición dignifique o, al menos, no degrade. Es exigencia del oficio más allá de la ley.

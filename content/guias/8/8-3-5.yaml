clave: 3-5
grado: 8
periodo: 3
sesion: 5
completo: true
titulo: Audio --- captura, edición y formatos
titulo_portada: |-
  Audio ---
  captura, edición
  y formatos
producto_final: |-
  1 pieza de audio de 1-2 minutos (entrevista a un familiar, podcast corto sobre un tema personal, narración de un cuento o noticia escolar) grabada con celular o computador, editada con Audacity o app móvil (BandLab, Soundtrap o el editor del celular) con al menos 3 operaciones técnicas básicas (recorte, ajuste de volumen, eliminación de silencio o ruido) + exportada en al menos 2 formatos (MP3 y WAV, o MP3 y M4A) + ficha de 5 líneas que describa el propósito de la pieza y al menos 1 decisión de edición tomada
apertura:
  saber_ancestral: |-
    En las emisoras barriales del Valle del Cauca, especialmente en las décadas en que la \emph{cumbia}, el \emph{currulao} y el \emph{vallenato} pasaban por la radio antes de la televisión y mucho antes del celular, había un personaje silencioso que sostenía la programación: \textbf{el operador de radio cumbero}. No era el locutor (la voz que se escuchaba), ni el cantor (la voz grabada): era el técnico que estaba detrás del vidrio del estudio, con audífonos y consola de botones, decidiendo \textbf{qué se escuchaba bien y qué se editaba antes de salir al aire}. Cuando el cantor del grupo de Quibdó llegaba a grabar una canción nueva, el operador hacía 4 tareas en orden: (1) \textbf{Capturar}: posicionar el micrófono, ajustar volumen para que la voz no saliera distorsionada. (2) \textbf{Editar}: cortar el silencio del principio, eliminar el carraspeo a la mitad, balancear la voz con el coro. (3) \textbf{Mezclar}: equilibrar instrumentos y voz. (4) \textbf{Difundir}: enviar la cinta al transmisor que llegaba a todo el departamento. Esas 4 tareas eran su \textbf{oficio profesional}: capturar, editar, mezclar, difundir. La captura y edición de audio digital es exactamente ese oficio del operador trasladado al celular o computador, ahora al alcance de cualquier estudiante.
  saber_contemporaneo: |-
    Una \textbf{pieza de audio digital} se produce en 4 fases que reproducen el oficio del operador de radio: (1) \textbf{Captura}: grabación con micrófono interno del celular o computador, o micrófono externo USB. Reglas básicas: ambiente silencioso, micrófono cerca pero no pegado a la boca, volumen ajustado (probar antes). (2) \textbf{Edición}: en \textbf{Audacity} (gratis, descargable) o app móvil (BandLab, Soundtrap, app del celular). Operaciones básicas: cortar partes innecesarias, ajustar volumen, eliminar ruido de fondo, agregar fade-in y fade-out al inicio y final. (3) \textbf{Exportación}: convertir el archivo a un formato distribuible. Los 2 formatos más usados son \textbf{MP3} (comprimido, archivo pequeño, calidad estándar) y \textbf{WAV} (sin comprimir, archivo grande, calidad máxima). El formato \textbf{M4A} es el estándar de Apple. (4) \textbf{Difusión}: publicar en plataforma (WhatsApp, podcast, link público). La regla profesional: \textbf{cada formato sirve a un propósito; elegir según el destino}. MP3 para WhatsApp o redes; WAV para archivo de calidad; M4A para dispositivos Apple.
  pregunta_puente: |-
    ¿Qué sabía el operador de radio cumbero al cortar el silencio antes de transmitir, que el novato olvida cuando publica un audio crudo de 5 minutos sin editar? ¿Y por qué el formato MP3 es el más usado en WhatsApp aunque WAV tenga mejor calidad?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} el propósito de tu pieza de audio (entrevista, podcast, narración) y el formato más apropiado para distribuirla; (2) \textbf{aplicar} las 3 operaciones básicas de edición (recorte, ajuste de volumen, eliminación de silencio o ruido) en Audacity o app móvil; (3) \textbf{crear} 1 pieza de audio de 1-2 minutos editada y exportada en 2 formatos; (4) \textbf{evaluar} tu propia pieza escuchándola completa y declarando 1 decisión de edición tomada con su razón.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. En las sesiones 1-4 trabajaste imagen y narrativa visual. Hoy trabajas \emph{voz} y \emph{sonido}. Las sesiones 6-9 abordan ciberseguridad, estética y proyecto integrador donde podrás combinar audio con video y otras piezas.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{ejercicio del oído}: grabar 30 segundos hablando libremente con tu celular y escucharte de inmediato. Reglas: (1) hablar sobre cualquier tema que te interese. (2) sin guion. (3) al terminar, escuchar la grabación completa y anotar: ¿qué sonó bien?, ¿qué sonó mal?, ¿hubo silencios largos?, ¿hubo ruido de fondo?.
  a_sistematizacion: |-
    Ya escuchaste tu propia voz. Ahora vas a entender la \textbf{anatomía del oficio del audio}: las 4 fases (captura, edición, exportación, difusión), las 3 operaciones básicas de edición, los 5 errores típicos del audio novato (volumen inconsistente, ruido de fondo, sin fade, formato equivocado, audio demasiado largo).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: planeas tu pieza (entrevista, podcast o narración), capturas, editas con 3 operaciones, exportas en 2 formatos.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: pieza de audio editada + 2 formatos exportados + ficha descriptiva. El criterio principal: que tu pieza pueda escucharse con claridad sin necesidad de ajustar volumen ni saltar silencios.
  a_evaluacion: |-
    Antes de cerrar, mira el audio desde las cinco dimensiones humanas. Editar antes de difundir es respeto por el oído del oyente; publicar audio crudo es desperdicio del oficio.
  a_triangulo: |-
    Y para terminar, tres voces sobre la voz cuidada. Dussel sobre los audios que dan voz a las comunidades, Marco Aurelio sobre la disciplina de editar antes de publicar, Floridi sobre la producción sonora responsable en la era de los podcasts.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Ejercicio del oído} (15 min · individual). Toma tu celular y graba 30 segundos hablando libremente sobre cualquier tema (cómo estuvo tu día, qué te gusta del recreo, qué cambiarías del colegio). Escúchate de inmediato y anota: (a) ¿qué sonó bien (claridad, energía, claridad de voz)?, (b) ¿qué sonó mal (volumen bajo, ruido de ventiladores, eco)?, (c) ¿hubo silencios o muletillas que sobraban?. Esa primera escucha te enseña qué editarías.
  checks:
  - Grabé 30 segundos sin guion.
  - Me escuché de inmediato.
  - Identifiqué qué sonó bien y qué editaría.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mi primera grabación». \textbf{Formato:} ficha con 3 observaciones (bueno, malo, editar). \textbf{Sabes que terminaste cuando} sabes qué cambiarías en tu próxima grabación.
sistematizacion:
  intro: |-
    Tu escucha inicial te enseñó qué hay. Ahora necesitas la \textbf{anatomía profesional}: las 4 fases del oficio del audio, las 3 operaciones básicas de edición, los formatos.
  pilares:
  - |-
    Las \textbf{4 fases del audio} se descomponen así: (1) \textbf{Captura}: ambiente silencioso (cerrar puertas, alejarse de ventiladores), micrófono a 10-15 cm de la boca, prueba de volumen antes de grabar. (2) \textbf{Edición}: cortar inicio y final (silencios o ruido al iniciar/detener grabación), ajustar volumen general (cerca de -6 dB para evitar saturación), eliminar ruido de fondo (Audacity tiene función \emph{Reducción de ruido}). (3) \textbf{Exportación}: archivo → exportar como MP3 (comprimido) o WAV (sin comprimir). (4) \textbf{Difusión}: subir al destino (WhatsApp, Drive, plataforma podcast).
  - |-
    Las \textbf{3 operaciones básicas de edición} en Audacity (o equivalente en app móvil): (a) \textbf{Recorte}: seleccionar el fragmento con el ratón (clic y arrastrar) → Edición → Cortar (Ctrl+X) o Eliminar. (b) \textbf{Ajustar volumen}: seleccionar todo (Ctrl+A) → Efecto → Amplificar (subir o bajar dB). (c) \textbf{Reducción de ruido}: seleccionar 1-2 segundos donde solo haya ruido de fondo → Efecto → Reducción de ruido → Tomar muestra → seleccionar todo → Efecto → Reducción de ruido → OK.
  - |-
    Los \textbf{formatos principales} y cuándo usar cada uno: (a) \textbf{MP3}: comprimido, archivo pequeño (~1 MB por minuto), calidad estándar. Ideal para WhatsApp, podcasts, redes sociales. (b) \textbf{WAV}: sin comprimir, archivo grande (~10 MB por minuto), calidad máxima. Ideal para archivo de respaldo o producción profesional. (c) \textbf{M4A}: estándar Apple, calidad intermedia, compatible con iPhone/Mac. La regla profesional: \textbf{MP3 para distribuir, WAV para archivar}.
  - |-
    Algoritmo: (1) planear el propósito y duración (1-2 min). (2) capturar en ambiente silencioso. (3) escuchar la grabación cruda. (4) abrir Audacity. (5) recortar inicio/final. (6) ajustar volumen general. (7) eliminar ruido de fondo. (8) exportar en MP3 + WAV. (9) escuchar el resultado final.
  anatomia:
    titulo: Anatomía del oficio del audio
    body: |-
      \textbf{Captura:} ambiente + micrófono + prueba. \\[1mm] \textbf{Edición:} recorte + volumen + ruido. \\[1mm] \textbf{Exportación:} MP3 y WAV. \\[1mm] \textbf{Difusión:} plataforma según destino.
  errores_comunes: |-
    (1) \textbf{Volumen inconsistente}: una parte muy fuerte y otra inaudible. (2) \textbf{Ruido de fondo}: ventilador, conversación al lado, ruido de la calle. (3) \textbf{Sin fade-in/out}: la grabación corta abrupta al inicio o final. (4) \textbf{Formato equivocado}: enviar WAV pesado por WhatsApp en lugar de MP3. (5) \textbf{Audio demasiado largo}: 10 minutos cuando bastaban 2.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía del audio». \textbf{Formato:} (a) las 4 fases con su propósito; (b) las 3 operaciones básicas con su atajo; (c) los formatos y cuándo usar cada uno; (d) los 5 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías producir una pieza desde cero sin abrir esta guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Pieza de audio editada + ficha descriptiva} (40 min · individual o parejas). Hora de crear. Planeas, capturas, editas con 3 operaciones, exportas en 2 formatos, escribes ficha de 5 líneas.
  pilares:
  - |-
    Tu pieza se construye en 6 pasos: (1) elegir tipo (entrevista a familiar, podcast sobre tema personal, narración de cuento). (2) escribir guion corto (no obligatorio si es entrevista). (3) capturar en ambiente silencioso (1-2 min de material crudo). (4) editar en Audacity o app móvil con las 3 operaciones. (5) exportar en MP3 y WAV (o M4A). (6) escribir ficha descriptiva.
  - |-
    Sigue el patrón \textbf{``oyente sobre autor''}: la edición sirve al oyente, no al autor. Si tu narración tiene un silencio que tú entiendes pero al oyente le parece pausa rara, hay que editarlo. Si tu voz suena monótona en una parte y enérgica en otra, balancear volúmenes. La phronesis del oficio del audio consiste en \textbf{producir lo que sería cómodo escuchar, no lo que fue cómodo grabar}.
  - |-
    La ficha descriptiva tiene estructura mínima: (a) \textbf{Tipo de pieza}: entrevista, podcast, narración. (b) \textbf{Propósito}: para qué se hizo. (c) \textbf{Decisión de edición tomada}: 1 cambio que hiciste con razón (\emph{``corté el primer minuto porque tenía ruido del bus que pasaba''}, \emph{``subí el volumen del entrevistado porque hablaba bajo''}).
  - |-
    Algoritmo: (1) elegir tipo. (2) capturar. (3) editar. (4) exportar 2 formatos. (5) escribir ficha. (6) escuchar el resultado final completo. (7) compartir con un compañero para feedback.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Pieza de 1-2 minutos. \\[1mm] \checkbox Capturada en ambiente silencioso. \\[1mm] \checkbox 3 operaciones básicas aplicadas (recorte, volumen, ruido). \\[1mm] \checkbox Exportada en MP3. \\[1mm] \checkbox Exportada en WAV o M4A. \\[1mm] \checkbox Ficha descriptiva de 5 líneas. \\[1mm] \checkbox 1 decisión de edición declarada.
  plantilla_guion: |-
    \textbf{Tipo.} \textit{Entrevista / Podcast / Narración.} \\[1mm] \textbf{Propósito.} \textit{Para qué se hizo.} \\[1mm] \textbf{Captura.} \textit{Ambiente y configuración.} \\[1mm] \textbf{Edición.} \textit{Las 3 operaciones aplicadas.} \\[1mm] \textbf{Formatos.} \textit{MP3 + WAV (o M4A).} \\[1mm] \textbf{Ficha.} \textit{Tipo + propósito + decisión.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Mi pieza de audio». \textbf{Formato:} (a) link a archivos o ubicación; (b) descripción del flujo de producción; (c) ficha descriptiva. \textbf{Sabes que terminaste cuando} le mandarías la pieza a un familiar y te enorgullecería que la escuche.
  producto_titulo: Pieza audio 1-2 min + 2 formatos + ficha descriptiva
  criterios:
  - Pieza de 1-2 minutos
  - Capturada con calidad razonable
  - 3 operaciones de edición aplicadas
  - 2 formatos exportados
  - Ficha descriptiva con decisión de edición
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Producir audio con voz propia o de la comunidad es liberador; reproducir voces ajenas sin contexto es repetir el silencio del sistema.
    aplicacion: |-
      Tu pieza de audio puede tener dos destinos: dar voz a alguien que pocas veces se escucha (un familiar mayor, una vecina del barrio, un compañero que no suele hablar) o repetir contenido genérico que ya circula en redes. La filosofía de la liberación pide lo primero. La phronesis del oficio consiste en \textbf{usar el medio sonoro para amplificar voces que el sistema mediático ignora}.
    pregunta_espejo: |-
      ¿Mi pieza da voz a alguien o algo que no suele escucharse, o repite contenido genérico?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Editar antes de difundir es disciplina; publicar audio crudo es pereza disfrazada de espontaneidad.
    aplicacion: |-
      Es tentador publicar el audio tal como salió de la grabación, con el argumento de \emph{``así suena natural''}. La sabiduría estoica recomienda lo opuesto: \emph{edita por respeto al oyente}. La edición no quita naturalidad; quita lo que estorba. El operador de radio cumbero nunca transmitía sin editar.
    pregunta_espejo: |-
      ¿Estoy editando con disciplina, o pongo excusas para no hacer el trabajo?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La producción sonora responsable es la nueva ética del oficio digital en la era de los podcasts y los audios virales.
    aplicacion: |-
      En la era de la información, los audios circulan rápido (notas de voz en WhatsApp, podcasts, redes). La ética digital exige que quien produce audio respete esa circulación: produzca con calidad, declare la fuente cuando usa material ajeno, no manipule grabaciones para engañar. Tu pieza de hoy te entrena en esa práctica que rige toda profesión que produzca contenido sonoro.
    pregunta_espejo: |-
      ¿Mi audio respeta al oyente con calidad cuidada, o publica como sea esperando que se entienda?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu pieza editada y la ficha descriptiva. En la sesión 6 vas a aprender sobre \textbf{ciberbullying} y los protocolos de prevención y denuncia, incluyendo la Línea 141 del ICBF. Es tema sensible y necesario; las habilidades multimedia que has construido (imagen, audio, narrativa) ahora se ponen al servicio de la convivencia digital.
web:
  conceptos_clave:
    - termino: Captura
      definicion: |-
        Primera fase del audio. Grabación con micrófono. Reglas básicas, ambiente silencioso, micrófono cerca pero no pegado, volumen probado.
      ejemplo: |-
        Para una entrevista, grabas en un salón sin eco, con el micrófono a un palmo de la boca y revisando volumen antes.
      emoji: "🎙️"
    - termino: Edición
      definicion: |-
        Segunda fase. En Audacity u otro editor, cortas partes innecesarias, ajustas volumen, eliminas ruido, agregas fade-in y fade-out.
      ejemplo: |-
        Cortas el "uhm" del inicio, subes el volumen general 3 dB y agregas fade-in para evitar el corte abrupto al inicio.
      emoji: "🎚️"
    - termino: Audacity
      definicion: |-
        Editor de audio gratuito, descargable, multiplataforma. Estándar profesional para grabación y edición sencilla.
      ejemplo: |-
        Abres Audacity, arrastras el archivo, seleccionas la parte a borrar y presionas Suprimir. Edición básica en pocos clics.
      emoji: "🎧"
    - termino: Formato MP3
      definicion: |-
        Audio comprimido. Archivo pequeño, calidad estándar. Ideal para WhatsApp, redes sociales o distribución masiva.
      ejemplo: |-
        Exportas el podcast como MP3 a 128 kbps. Suficiente calidad y cabe en WhatsApp sin problema.
      emoji: "📦"
    - termino: Formato WAV
      definicion: |-
        Audio sin comprimir. Archivo grande, calidad máxima. Ideal para archivo maestro o edición posterior.
      ejemplo: |-
        Guardas la grabación original en WAV. Si necesitas reeditar el año entrante, partes de un archivo sin pérdida.
      emoji: "💎"
  quiz:
    titulo: ¿Sabes producir audio con oficio?
    instrucciones: 5 preguntas para verificar que aplicas las 4 fases y eliges el formato adecuado.
    preguntas:
      - enunciado: ¿Cuáles son las 4 fases de producción de una pieza de audio?
        opciones:
          - Grabar y publicar
          - Solo edición
          - Captura y compresión
          - Captura, edición, exportación y difusión
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Captura, edición, exportación y difusión. Cada fase tiene reglas profesionales propias.
        feedback_incorrecto: |-
          Son cuatro: captura, edición, exportación y difusión. Saltar una resta calidad o alcance a la pieza.
      - enunciado: ¿Cuál es el editor de audio gratis y profesional más usado en aulas?
        opciones:
          - Word
          - Excel
          - Audacity
          - WhatsApp
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Audacity, gratuito y multiplataforma. Hace cortes, ajustes de volumen, eliminación de ruido y exportación.
        feedback_incorrecto: |-
          Es Audacity. Gratuito, descargable y suficiente para todo el oficio escolar de audio.
      - enunciado: Vas a enviar tu podcast por WhatsApp. ¿Qué formato eliges?
        opciones:
          - WAV, porque pesa más
          - MP3, comprimido y pequeño
          - PDF
          - JPG
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. MP3 está comprimido, pesa menos y tiene calidad estándar suficiente para distribución.
        feedback_incorrecto: |-
          Para WhatsApp se usa MP3. Está comprimido, pesa poco y mantiene calidad estándar suficiente.
      - enunciado: ¿Para qué sirve el fade-in al inicio de una grabación?
        opciones:
          - Para evitar el corte abrupto cuando empieza el audio
          - Para subir el volumen total
          - Para acortar la pieza
          - Para cambiar el idioma
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. El fade-in hace que el audio suba gradualmente, evitando el corte abrupto y dando entrada profesional.
        feedback_incorrecto: |-
          Sirve para evitar el corte abrupto al inicio. La pieza entra de forma gradual y suena profesional.
      - enunciado: Quieres archivar la grabación original con máxima calidad. ¿Qué formato eliges?
        opciones:
          - MP3
          - WAV
          - JPG
          - DOC
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. WAV sin comprimir conserva calidad máxima. Ideal para archivar y poder reeditar después sin pérdida.
        feedback_incorrecto: |-
          WAV. Sin compresión, calidad máxima. Pesa más pero permite reedición posterior sin pérdida.

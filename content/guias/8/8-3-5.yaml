clave: 3-5
grado: 8
periodo: 3
sesion: 5
completo: true
duracion_min: 90
titulo: Audio --- grabar, limpiar y exportar
titulo_portada: |-
  Grabar, limpiar
  y exportar
producto_final: |-
  Una pieza de audio de uno a dos minutos, una entrevista corta a un familiar, una narración o un pódcast breve, grabada con el celular o el computador y editada con Audacity o una app del celular con tres operaciones: recorte, ajuste de volumen y limpieza de silencio o ruido. Exportada en dos formatos, MP3 y WAV, con una ficha de cinco líneas que diga qué es, quién habla, cuánto dura, qué se editó y qué formato va a dónde.
apertura:
  origen: Pueblo nasa del norte del Cauca · Radio Pa'yumat desde el cerro Munchique
  fuente: |-
    Aley, P. (2012, 22 de septiembre). Conozca la emisora de la resistencia indígena. \emph{El Tiempo}. · Tejido de Comunicación ACIN. (s.\,f.). \emph{Radio Pa'yumat}. Consultado el 7 de septiembre de 2026.
  saber_ancestral: |-
    En la sesión 3 conociste el saludo de Radio Pa'yumat. Hoy mira cómo llega esa voz a los resguardos. La emisora transmite en el 101.0 de la FM desde el cerro Munchique, en Santander de Quilichao, nueve horas al día. La sostienen cinco comunicadores indígenas coordinados por Abel Coicué (Aley, 2012). Los programas se graban y se emiten en nasa yuwe y en castellano: información, campañas, avisos de mingas, días de mercado, música. Antes de Pa'yumat hubo emisoras nasa en Toribío, en 1996, y en Jambaló, en 1997; Pa'yumat nació en 2000 como emisora de toda la zona. Lo que suena en el radio pasó por lo mismo que harás hoy: alguien grabó una voz, la limpió y la mandó por una antena. La \textbf{cara de exclusión}: en 2012 hubo atentados contra las antenas y torres; la señal perdió alcance y los equipos tuvieron que bajarse del cerro. Ningún editor de audio arregla una antena caída. Y la emisora depende del tiempo libre de niños, jóvenes y adultos que la sostienen. Hoy vas a grabar una voz, limpiarla y exportarla en dos formatos. En el norte del Cauca esa cadena se sostiene bajo amenaza.
  saber_contemporaneo: |-
    Una pieza de audio se produce en tres fases. \textbf{Captura}: se graba con el micrófono del celular o del computador, en un lugar silencioso. El micrófono va a unos quince centímetros de la boca, y se hace una prueba de volumen antes. \textbf{Edición}: en Audacity, gratis en el computador, o en una app del celular, se hacen tres operaciones. Recortar: seleccionar el fragmento que sobra y eliminarlo. Ajustar el volumen: seleccionar todo y aplicar «Amplificar» hasta que se oiga parejo. Limpiar: quitar el silencio del inicio y del final, y reducir el ruido de fondo con «Reducción de ruido». \textbf{Exportación}: guardar en un formato que se pueda enviar. \textbf{MP3} comprime, pesa poco y sirve para WhatsApp y redes. \textbf{WAV} no comprime, pesa mucho más y sirve para guardar el original o seguir editando. Los errores típicos: volumen disparejo, ruido de ventilador, cortes bruscos sin fundido, y mandar un WAV pesado por donde iba un MP3.
  pregunta_puente: |-
    Pa'yumat graba en nasa yuwe, limpia la voz y la manda por una antena que puede caerse. Si grabas a tu abuela con el ventilador prendido, ¿qué parte de su voz se pierde y cuál de las tres operaciones lo arregla?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué sonó bien y qué sonó mal en una grabación tuya de treinta segundos; (2) \textbf{aplicar} recorte, volumen y limpieza en Audacity o una app; (3) \textbf{evaluar} qué formato va a cada destino; (4) \textbf{explicar} por qué el WAV se guarda y el MP3 se envía.
puentes:
  a_ruta: |-
    En la sesión 4 editaste una imagen con permiso. Hoy editas una voz, y el permiso sigue: la voz de alguien también es suya. En la sesión 6 vas a entrar en un tema serio, el ciberacoso y cómo se denuncia.
  a_escuta: |-
    Antes de editar, vas a grabarte treinta segundos y escucharte. Tu propio oído te va a decir qué hay que limpiar.
  a_sistematizacion: |-
    Ya sabes cómo suena tu voz grabada. Ahora aprendes las tres operaciones y, con tu pareja, limpias una grabación en Audacity o en la app.
  a_praxis: |-
    Ya sabes limpiar. Toca grabar tu pieza de uno a dos minutos, editarla, exportarla en dos formatos y escribir la ficha.
  a_producto: |-
    Lo que entregas hoy: el MP3, el WAV y la ficha de cinco líneas. La prueba de calidad: tu pareja oye el MP3 con audífonos y no nota ningún corte ni cambio de volumen.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un minuto limpio y parejo vale más que cinco con ruido y saltos.
  a_triangulo: |-
    Para terminar, tres ideas sobre grabar la voz de otro, contadas con palabras de esta guía: Dussel sobre el silencio del que escucha, Epicteto sobre usar las menos palabras, y Floridi sobre las tecnologías que ahorran tiempo y luego lo matan.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Treinta segundos de tu voz} (15 min · individual). (1) Con la grabadora del celular, graba treinta segundos hablando de cualquier cosa: cómo estuvo tu día, qué cambiarías del recreo. (2) Escúchate de inmediato con audífonos. (3) Anota qué sonó bien: claridad, energía, ritmo. (4) Anota qué sonó mal: ruido de fondo, volumen bajo, silencio largo al inicio, una palabra comida. (5) Para cada cosa que sonó mal, escribe si se arregla grabando de nuevo o editando.
  checks:
  - Tengo la grabación de treinta segundos.
  - Anoté al menos una cosa que sonó bien y una que sonó mal.
  - Para lo que sonó mal, dije si se arregla grabando o editando.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Treinta segundos de tu voz». \textbf{Formato:} dos columnas, «sonó bien» y «sonó mal», y junto a cada problema la palabra «grabar» o «editar». \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} sabes qué problema de tu grabación se arregla con cuál de las tres operaciones.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · APLICA --- Las tres operaciones} (30 min · parejas). (1) Con tu pareja, abran en Audacity o en la app la grabación de treinta segundos de uno de los dos. (2) Recorten: seleccionen el silencio del inicio y del final y elimínenlo. (3) Ajusten el volumen: seleccionen todo y apliquen «Amplificar» hasta que la onda llene la pista sin tocar el borde. (4) Limpien: seleccionen dos segundos donde solo hay ruido de fondo, tomen el «perfil de ruido» y apliquen «Reducción de ruido» a todo. (5) Exporten como MP3 y como WAV, y comparen el peso de los dos archivos.
  pilares:
  - |-
    \textbf{Recortar.} Clic y arrastrar sobre la onda para seleccionar; suprimir para eliminar. Se quita el silencio del inicio, el del final y las partes que sobran. Un fundido de un segundo al inicio y al final evita el corte brusco.
  - |-
    \textbf{Ajustar el volumen.} Seleccionar todo, menú Efecto, «Amplificar». La onda debe llenar la pista sin tocar el borde: si lo toca, se distorsiona. Si una parte quedó más baja, se selecciona solo esa y se amplifica aparte.
  - |-
    \textbf{Limpiar el ruido.} Se selecciona un pedazo donde solo hay ruido, ventilador o calle, y se toma el perfil. Luego «Reducción de ruido» a toda la pista. Poco reduce el ruido; mucho deja la voz metálica. Se prueba y se escucha.
  - |-
    \textbf{Cómo se hace, paso a paso.} (1) Abrir la grabación. (2) Recortar silencios. (3) Amplificar. (4) Perfil de ruido y reducción. (5) Fundidos. (6) Exportar MP3 y WAV. (7) Comparar el peso.
  anatomia:
    titulo: El audio, en una mirada
    body: |-
      \textbf{Captura:} lugar silencioso, micrófono a 15 cm, prueba de volumen. \\[1mm] \textbf{Recortar:} quitar lo que sobra. \\[1mm] \textbf{Amplificar:} volumen parejo sin tocar el borde. \\[1mm] \textbf{Reducir ruido:} perfil y aplicar. \\[1mm] \textbf{MP3:} liviano, para enviar. \textbf{WAV:} pesado, para guardar.
  errores_comunes: |-
    (1) \textbf{Volumen disparejo}: una parte grita y otra no se oye. (2) \textbf{Ruido de fondo}: el ventilador o la calle encima de la voz. (3) \textbf{Corte brusco}: sin fundido, la pieza arranca o termina de golpe. (4) \textbf{Formato equivocado}: un WAV pesado por WhatsApp. (5) \textbf{Reducción de ruido exagerada}: la voz queda metálica.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} \textbf{Título:} «Actividad 2 --- Las tres operaciones». \textbf{Formato:} las tres operaciones con una línea sobre qué cambió en cada una, y el peso del MP3 y del WAV. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} la grabación limpia se oye pareja y sabes cuántas veces pesa más el WAV que el MP3.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Tu pieza en dos formatos} (25 min · individual). (1) Decide qué vas a grabar: una entrevista corta a un familiar, una narración o un pódcast breve, y pide permiso si graba a alguien. (2) Graba de uno a dos minutos en un lugar silencioso, con el micrófono a quince centímetros. (3) Aplica las tres operaciones y los fundidos. (4) Exporta en MP3 y en WAV y anota el peso de cada uno. (5) Escribe la ficha de cinco líneas. Pásale el MP3 a tu pareja para que lo oiga con audífonos y diga si notó algún corte o salto.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} (1) El MP3 y el WAV compartidos con enlace. (2) La ficha de cinco líneas: qué es, quién habla, cuánto dura, qué se editó, qué formato va a dónde. (3) Lo que dijo tu pareja al oír el MP3.
  - |-
    \textbf{La voz de alguien es suya.} Si grabas a tu abuela o a un compañero, pides permiso antes y lo anotas, como con la imagen en la sesión 4. Y le dices para qué es y dónde va a sonar.
  - |-
    \textbf{Qué formato va a dónde.} El WAV es el original: se guarda y no se manda. El MP3 es la copia liviana: se manda por WhatsApp, se sube a la red, se pone en la presentación. Mandar el WAV donde iba el MP3 es como mandar una caja donde cabía un sobre.
  - |-
    \textbf{La prueba de los audífonos.} Tu pareja oye el MP3 sin saber dónde cortaste. Si no nota ningún salto, la edición está limpia. Si dice «ahí se oye un golpe», falta un fundido o un recorte quedó a mitad de palabra.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Permiso pedido y anotado si grabé a alguien. \\[1mm] \checkbox Pieza de uno a dos minutos grabada en lugar silencioso. \\[1mm] \checkbox Recorte, amplificación y reducción de ruido aplicados. \\[1mm] \checkbox Fundido al inicio y al final. \\[1mm] \checkbox Exportado en MP3 y en WAV, con el peso de cada uno anotado. \\[1mm] \checkbox Ficha de cinco líneas. \\[1mm] \checkbox Mi pareja oyó el MP3 y no notó cortes ni saltos de volumen.
  plantilla_guion: |-
    \textbf{Qué es.} \textit{Entrevista / narración / pódcast sobre …} \\[1mm] \textbf{Quién habla.} \textit{…, con permiso del …} \\[1mm] \textbf{Duración.} \textit{…:…} \\[1mm] \textbf{Qué se editó.} \textit{Recorté …, amplifiqué …, reduje el ruido de …} \\[1mm] \textbf{Formatos.} \textit{MP3 de … KB para …; WAV de … MB para guardar.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Tu pieza en dos formatos». \textbf{Formato:} los enlaces del MP3 y del WAV con su peso, la ficha de cinco líneas, la nota del permiso y lo que dijo tu pareja. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tienes los dos archivos, la ficha llena y tu pareja no notó ningún corte.
  producto_titulo: Pieza de audio de uno a dos minutos con tres operaciones + MP3 y WAV + ficha de cinco líneas + prueba de los audífonos
  criterios:
  - La pieza dura entre uno y dos minutos y hay permiso anotado si habla alguien más
  - Se aplicaron recorte, amplificación y reducción de ruido, con fundidos al inicio y al final
  - Está exportada en MP3 y en WAV y el peso de cada uno está anotado
  - La ficha dice qué es, quién habla, cuánto dura, qué se editó y qué formato va a dónde
  - Tu pareja oyó el MP3 con audífonos y no notó cortes ni saltos de volumen
  - Los dos archivos están compartidos con enlace
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.3
    idea: |-
      El respeto es el silencio de quien todo tiene que escuchar, porque todavía no sabe nada del otro.
    aplicacion: |-
      Grabar a tu abuela es callarte quince centímetros del micrófono y dejar que hable. Y editar su voz es quitarle el ruido, no las palabras que a ti te parecieron de más.
    pregunta_espejo: |-
      ¿Qué le recorté a la voz de alguien porque yo lo habría dicho distinto?
  estoico:
    autor: Epicteto · Enquiridión, 33 (c. 125 d.C.)
    idea: |-
      Guarda silencio cuanto puedas; di solo lo necesario y con las menos palabras posibles.
    aplicacion: |-
      Una pieza de un minuto limpia dice más que cinco con silencios y ruido. Recortar es la forma de que lo necesario se oiga. Pa'yumat tiene nueve horas al día y aun así cada aviso es corto.
    pregunta_espejo: |-
      ¿Cuántos segundos de mi pieza sobraban y me costó cortar?
  floridi:
    autor: Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 3.1
    idea: |-
      Las tecnologías se usan primero para ahorrar tiempo y después para matarlo.
    aplicacion: |-
      Un MP3 de un minuto que alguien oye en el bus le ahorra tiempo. Un WAV de veinte megas que no descarga, o un audio de cinco minutos con ruido, se lo mata. Elegir formato y duración es decidir cuál de las dos cosas haces.
    pregunta_espejo: |-
      ¿Qué audio mandé esta semana que le hizo perder tiempo a quien lo recibió?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu MP3, tu WAV y la ficha. En la sesión 6 vas a tratar un tema serio: el ciberacoso, cómo se reconoce y cómo se denuncia, con la Línea 141 del ICBF. Lo que aprendiste sobre el permiso para usar la imagen y la voz de alguien es la base de esa conversación.
web:
  resumen: |-
    Una pieza de audio se captura, se limpia y se exporta en el formato que va a cada destino. Hoy grabas, aplicas tres operaciones y exportas MP3 y WAV, como Radio Pa'yumat, que graba en nasa yuwe, limpia la voz y la manda por una antena que puede caerse.
  subtema: Multimedia y ciberética
  pre_lectura:
    por_que_importa: |-
      Los audios de WhatsApp, los pódcast y las notas de voz son audio grabado y, a veces, editado. Saber limpiar uno y elegir el formato es saber que te escuchen.
    pregunta_detonante: |-
      Si grabas a tu abuela con el ventilador prendido, ¿qué parte de su voz se pierde y cuál de las tres operaciones lo arregla?
    activacion:
      titulo: El audio que no se entendió
      descripcion: |-
        En 3 minutos, recuerda un audio de WhatsApp que tuviste que oír dos veces. ¿Era el ruido, el volumen o que hablaban muy rápido? ¿Qué le habrías hecho antes de mandarlo?
      duracion_min: 5
    conexion:
      anterior: En la sesión 4 editaste una imagen con permiso y cinco preguntas éticas.
      siguiente: En la sesión 6 tratas el ciberacoso y cómo se denuncia.

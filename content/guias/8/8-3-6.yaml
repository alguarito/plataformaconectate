completo: true
titulo: Ciberbullying --- prevención y Línea 141
titulo_portada: |-
  Ciberbullying ---
  prevención
  y Línea 141
producto_final: |-
  3 entregables sobre convivencia digital (a) mapa visual del flujo del ciberbullying en 4 fases (primeras señales, escalada, impacto, denuncia y apoyo) hecho como infografía simple, (b) plan personal de respuesta en 5 pasos que tú harías si fueras víctima o testigo, (c) cartel para el aula que comunique la Línea 141 del ICBF y otros canales de denuncia con jerarquía visual clara (sesión 1) + ficha de 5 líneas declarando 1 compromiso personal con la convivencia digital del grupo
apertura:
  saber_ancestral: |-
    En las comunidades indígenas del Pacífico, en los resguardos del Cauca, en los pueblos afrodescendientes del Chocó, había una práctica que sostenía el cuidado de los vulnerables: \textbf{cuando un joven sufría, la comunidad entera intervenía}. Si un niño llegaba al cabildo con la mirada baja, alguien preguntaba. Si una joven dejaba de venir, las mayores iban a su casa. Si un adolescente era objeto de burla, el cabildo hablaba con quien se burlaba. La sabiduría era inquebrantable: \textbf{el sufrimiento del menor no era asunto privado; era asunto comunitario}. No se esperaba a que el daño fuera grave; se intervenía en las primeras señales. Esa práctica tiene nombre simple: \emph{cuidado colectivo}. Ningún menor debe sufrir en silencio porque la comunidad existe para escucharlo. En la era digital, donde los espacios de relación están en redes y chats, esa sabiduría se traduce en \textbf{infraestructura institucional de protección}: la Línea 141 del ICBF, los protocolos escolares, las leyes. Conocer esos canales no es trámite: es \textbf{honor a la sabiduría comunitaria aplicada al espacio digital}.
  saber_contemporaneo: |-
    El \textbf{ciberbullying} (matoneo cibernético) es el uso de medios digitales (redes sociales, chats, mensajes, llamadas) para hostigar, intimidar o humillar a una persona de manera repetida. Tiene 5 propiedades que lo diferencian del conflicto cotidiano: (1) \textbf{Repetición}: no es una pelea aislada, es un hostigamiento sostenido. (2) \textbf{Desbalance de poder}: el agresor (o grupo) tiene ventaja sobre la víctima. (3) \textbf{Intención de daño}: el objetivo es hacer sufrir. (4) \textbf{Espacio digital}: ocurre por redes, WhatsApp, juegos en línea, etc. (5) \textbf{Permanencia}: lo publicado en redes deja huella; el daño se prolonga. En Colombia, los canales oficiales de denuncia son: \textbf{Línea 141 del ICBF} (Instituto Colombiano de Bienestar Familiar): atención 24/7 para menores en situación de riesgo o violencia. \textbf{Te Protejo (denunciar contenido)}: teprotejo.org, plataforma para denunciar contenido en línea contra menores. \textbf{Policía Nacional - URI / CAI}: para situaciones que requieren intervención presencial. \textbf{Protocolo institucional escolar}: cada colegio en Colombia debe tener un protocolo según la Ley 1620 de 2013 (Sistema Nacional de Convivencia Escolar). La regla profesional pedagógica: \textbf{conocer los canales de denuncia es responsabilidad de todo estudiante, no solo de las víctimas}.
  pregunta_puente: |-
    ¿Qué sabía la comunidad indígena al intervenir antes de que el daño fuera grave, que la cultura digital actual olvida cuando deja a las víctimas de ciberbullying en silencio? ¿Y por qué la Línea 141 funciona también para testigos y amigos, no solo para víctimas directas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 4 fases del ciberbullying (señales, escalada, impacto, denuncia) y los signos tempranos que permiten intervenir antes de que el daño escale; (2) \textbf{analizar} los canales oficiales de denuncia en Colombia y cuándo usar cada uno; (3) \textbf{evaluar} tu propia red de apoyo identificando a quién acudirías si fueras víctima o testigo; (4) \textbf{crear} 3 entregables (mapa del flujo, plan personal, cartel del aula) que comuniquen los protocolos al grupo.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Aprendiste a producir imagen, narrativa y audio (S1-S5). Hoy esas habilidades se ponen al servicio de la \textbf{convivencia digital}: las herramientas multimedia que dominas pueden ser usadas para construir comunidad o para herirla. La sesión 7 abordará grooming y sexting; la 8 la estética de la liberación; el periodo cierra con proyecto integrador.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{reflexión silenciosa}: sin compartir con nadie, anota mentalmente (o en papel privado que después romperás) si alguna vez has sido testigo o víctima de algo que ahora reconocerías como ciberbullying. La regla: este ejercicio es para ti, no se entrega.
  a_sistematizacion: |-
    Ya tienes la reflexión personal. Ahora vas a entender la \textbf{anatomía del ciberbullying}: las 5 propiedades que lo distinguen, las 4 fases en que se desarrolla, los canales oficiales de denuncia en Colombia (Línea 141, Te Protejo, Policía, protocolo escolar).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: construir 3 entregables que sirvan a tu grupo y a ti: mapa del flujo, plan personal de respuesta, cartel para el aula con Línea 141.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 3 piezas comunicativas + 1 compromiso personal. El criterio principal: que el cartel del aula, colgado mañana, sea claro suficiente para que cualquier estudiante sepa qué hacer si necesita ayuda.
  a_evaluacion: |-
    Antes de cerrar, mira la convivencia digital desde las cinco dimensiones humanas. Conocer los canales de denuncia es respeto por uno mismo y por los compañeros; ignorarlos es dejar solos a quienes pueden necesitar ayuda.
  a_triangulo: |-
    Y para terminar, tres voces sobre el cuidado colectivo. Dussel sobre la comunidad que protege a sus vulnerables, Séneca sobre la responsabilidad del testigo, Floridi sobre la infosfera como espacio ético compartido.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Las 5 propiedades del ciberbullying} (15 min · individual o grupos pequeños). Tu docente proyecta o entrega 3 situaciones de conflicto digital (ejemplos hipotéticos, no de tu grupo). Para cada una, evalúa si cumple las 5 propiedades del ciberbullying: (1) \textbf{Repetición}: ¿pasa varias veces o una sola? (2) \textbf{Desbalance de poder}: ¿el agresor tiene ventaja (grupo, audiencia, autoridad)? (3) \textbf{Intención de daño}: ¿busca hacer sufrir? (4) \textbf{Espacio digital}: ¿es por redes, chats, juegos? (5) \textbf{Permanencia}: ¿queda registro público o semipúblico? Solo si cumple las 5, es ciberbullying en sentido estricto.
  checks:
  - Evalué 3 situaciones con las 5 propiedades.
  - Distinguí ciberbullying de conflicto cotidiano.
  - Identifiqué cuáles propiedades hacen el daño más grave.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Las 5 propiedades». \textbf{Formato:} tabla 3 filas (situación) × 5 columnas (propiedades) con check si cumple. \textbf{Sabes que terminaste cuando} sabes distinguir conflicto cotidiano de ciberbullying.
sistematizacion:
  intro: |-
    Las 5 propiedades te enseñan a distinguir. Ahora necesitas la \textbf{anatomía profesional} de las 4 fases en que se desarrolla y los canales oficiales de denuncia en Colombia.
  pilares:
  - |-
    Las \textbf{4 fases del ciberbullying} se descomponen así: (1) \textbf{Primeras señales} (semana 1-2): un comentario aislado, una broma cargada, un emoji burlón. Aquí es donde la intervención temprana evita lo demás. (2) \textbf{Escalada} (semana 2-4): el comportamiento se vuelve repetido. La víctima empieza a evitar redes o el aula. (3) \textbf{Impacto} (semana 4+): la víctima muestra señales emocionales (aislamiento, irritabilidad, bajón académico, problemas de sueño). Hay riesgo serio. (4) \textbf{Denuncia y apoyo}: activación de los canales oficiales. Cuanto antes se llegue aquí, mejor.
  - |-
    Los \textbf{canales oficiales de denuncia} en Colombia: (a) \textbf{Línea 141 del ICBF}: número gratuito 24/7. Para menores en situación de riesgo. La atiende profesional capacitado, escucha, orienta, deriva. \textbf{No requiere ser víctima directa}: testigos, amigos y familiares pueden llamar. (b) \textbf{Te Protejo}: teprotejo.org, plataforma del ICBF para denunciar contenido en línea contra menores (videos, fotos, mensajes). Anónima si se quiere. (c) \textbf{Policía Nacional}: 123 o CAI cercano para situaciones que requieren intervención inmediata. (d) \textbf{Protocolo escolar}: el colegio tiene un protocolo según Ley 1620 de 2013; el primer contacto suele ser docente o coordinador.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿yo qué haría si pasara mañana en mi grupo?}. La phronesis del cuidado colectivo consiste en \textbf{no esperar a saber qué hacer cuando ya está pasando}, sino conocer los canales antes. La sesión de hoy es ese ejercicio: pensar el plan en frío para que esté listo cuando se necesite.
  - |-
    Algoritmo: (1) reconocer las primeras señales en uno mismo o en otros. (2) hablar con alguien de confianza (familiar, docente). (3) guardar evidencia (capturas de pantalla, fechas, horas) por si se necesita denuncia formal. (4) llamar a Línea 141 o usar Te Protejo si la situación lo requiere. (5) acompañar a la víctima sin presionarla.
  anatomia:
    titulo: Anatomía del ciberbullying y la denuncia
    body: |-
      \textbf{5 propiedades:} repetición + poder + intención + digital + permanencia. \\[1mm] \textbf{4 fases:} señales / escalada / impacto / denuncia. \\[1mm] \textbf{Canales:} Línea 141 / Te Protejo / Policía / Protocolo escolar. \\[1mm] \textbf{Regla:} testigo también puede denunciar.
  errores_comunes: |-
    (1) \textbf{Confundir conflicto con ciberbullying}: no toda pelea es ciberbullying; verificar las 5 propiedades. (2) \textbf{Esperar a que escale}: las primeras señales son el mejor momento para intervenir. (3) \textbf{Pensar que solo víctimas denuncian}: testigos y amigos también pueden llamar a Línea 141. (4) \textbf{No guardar evidencia}: sin capturas, la denuncia es difícil. (5) \textbf{Quedarse en silencio}: el silencio del testigo es lo que sostiene el ciclo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía + canales». \textbf{Formato:} (a) las 4 fases con sus señales; (b) los 4 canales con teléfono o link; (c) los 5 errores con marca. \textbf{Sabes que terminaste cuando} podrías explicarle a alguien menor de tu edad qué hacer si lo molestan en redes.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- 3 entregables comunicativos} (40 min · individual o parejas). Hora de aplicar. Construyes mapa del flujo, plan personal y cartel para el aula con los canales de denuncia.
  pilares:
  - |-
    Los 3 entregables se construyen en orden: (1) \textbf{Mapa visual del flujo}: infografía simple con las 4 fases (señales → escalada → impacto → denuncia), una caja por fase con 2-3 ejemplos concretos en cada una. Hecho en Canva, papel, o herramienta libre. (2) \textbf{Plan personal de respuesta}: 5 pasos que tú harías como víctima o testigo (\emph{``1. guardo captura, 2. hablo con mi tío Pedro, 3. llamo a Línea 141 si escala, 4. acompaño a la víctima, 5. no comparto el contenido''}). Específico para tu red de apoyo real. (3) \textbf{Cartel para el aula}: pieza visual con jerarquía clara (S1) que comunique los canales: Línea 141 destacada, Te Protejo, protocolo escolar, número de coordinador o psicólogo del colegio si aplica.
  - |-
    Sigue el patrón \textbf{``específico sobre genérico''}: el plan personal vale solo si nombra personas reales (mi tía Lucía, mi profesor Carlos), no \emph{``alguien de confianza''}. La phronesis del cuidado consiste en \textbf{decidir hoy a quién llamarías mañana}, no improvisar en el momento de crisis.
  - |-
    La ficha de compromiso personal es la pieza ética final: 5 líneas declarando qué te comprometes a hacer (o no hacer) en tu grupo. Ejemplos: \emph{``Me comprometo a no compartir capturas burlescas de compañeros''}, \emph{``Me comprometo a hablar con quien parezca aislado''}, \emph{``Me comprometo a denunciar si veo ciberbullying contra cualquier compañero''}.
  - |-
    Algoritmo: (1) construir mapa del flujo. (2) escribir plan personal con nombres reales. (3) diseñar cartel con jerarquía visual de S1. (4) escribir compromiso personal. (5) revisar con un compañero (¿se entiende el cartel?, ¿el plan tiene nombres concretos?).
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Mapa del flujo con las 4 fases. \\[1mm] \checkbox Plan personal con 5 pasos y nombres reales. \\[1mm] \checkbox Cartel para el aula con jerarquía visual clara. \\[1mm] \checkbox Línea 141 destacada en el cartel. \\[1mm] \checkbox Te Protejo y protocolo escolar mencionados. \\[1mm] \checkbox Compromiso personal de 5 líneas. \\[1mm] \checkbox Cartel listo para colgar en el aula.
  plantilla_guion: |-
    \textbf{Mapa.} \textit{4 fases con ejemplos.} \\[1mm] \textbf{Plan.} \textit{5 pasos con nombres reales.} \\[1mm] \textbf{Cartel.} \textit{Línea 141 + canales + jerarquía visual.} \\[1mm] \textbf{Compromiso.} \textit{5 líneas con acción concreta.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Convivencia digital». \textbf{Formato:} (a) mapa del flujo; (b) plan personal; (c) referencia al cartel; (d) compromiso personal. \textbf{Sabes que terminaste cuando} el cartel está listo para colgar y el plan tiene nombres reales.
  producto_titulo: Mapa del flujo + plan personal + cartel Línea 141 + compromiso
  criterios:
  - Mapa con 4 fases y ejemplos
  - Plan personal con nombres reales
  - Cartel con jerarquía visual y Línea 141 destacada
  - 4 canales de denuncia mencionados
  - Compromiso personal específico
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La comunidad que protege a sus vulnerables es liberadora; la que los abandona reproduce la violencia del sistema mediante el silencio.
    aplicacion: |-
      El ciberbullying se sostiene en el silencio de los testigos. La filosofía de la liberación pide ese acto: \textbf{no callar cuando ves que alguien sufre}. Las comunidades ancestrales intervenían en las primeras señales; las redes sociales contemporáneas suelen permitir que el sufrimiento escale sin freno. La phronesis del oficio digital consiste en \textbf{ser testigo activo, no espectador pasivo}.
    pregunta_espejo: |-
      ¿He sido testigo activo cuando vi señales de ciberbullying, o espectador silencioso?
  estoico:
    autor: Séneca
    cita: |-
      El silencio del testigo es complicidad disfrazada de neutralidad.
    aplicacion: |-
      Es tentador pensar \emph{``no es mi problema, mejor no meterme''}. La sabiduría estoica recomienda lo opuesto: \emph{el silencio del testigo sostiene el daño}. Tu plan personal de hoy te entrena para no quedarte en silencio cuando importe. No tienes que ser héroe ni intervenir físicamente: basta con llamar a Línea 141, hablar con un docente, acompañar a la víctima.
    pregunta_espejo: |-
      ¿Mi plan personal me permite no quedarme en silencio cuando vea ciberbullying?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La infosfera es espacio ético compartido; cada usuario es responsable de lo que sostiene en ella.
    aplicacion: |-
      La infosfera (entorno informacional compartido) no es neutral: lo que cada usuario sostiene allí afecta a otros. Publicar una captura burlesca contribuye al ciberbullying. Compartir contenido humillante lo amplifica. La ética digital exige conciencia de esa responsabilidad. Tu compromiso personal de hoy es entrenamiento para esa ciudadanía digital.
    pregunta_espejo: |-
      ¿Mis acciones diarias en redes contribuyen a una infosfera sana o a una hostil?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tus 3 entregables y el cartel listo para colgar. En la sesión 7 vas a aprender sobre \textbf{grooming y sexting} desde el marco legal (Ley 1336 de 2009) y los protocolos de prevención. Es continuación de la sesión de hoy: convivencia digital con criterio.
web:
  conceptos_clave:
    - termino: Ciberbullying
      definicion: |-
        Uso de medios digitales para hostigar, intimidar o humillar a una persona de manera repetida. Combina repetición, desbalance de poder, intención de daño, espacio digital y permanencia.
      ejemplo: |-
        Un grupo de WhatsApp donde varios compañeros publican fotos burlándose de un mismo estudiante durante semanas. Es ciberbullying, no broma.
      emoji: "🚫"
    - termino: Repetición y desbalance
      definicion: |-
        Dos propiedades clave que diferencian el ciberbullying del conflicto cotidiano. Es sostenido en el tiempo y con ventaja de un lado.
      ejemplo: |-
        Una pelea aislada no es bullying. Hostigamiento sostenido por un grupo a una persona sola, sí lo es.
      emoji: "⚖️"
    - termino: Línea 141 del ICBF
      definicion: |-
        Canal oficial colombiano de atención 24/7 para menores en situación de riesgo o violencia, incluido ciberbullying.
      ejemplo: |-
        Si tú o un compañero sufre hostigamiento digital, puedes llamar al 141 a cualquier hora. La línea es gratuita.
      emoji: "☎️"
    - termino: Te Protejo
      definicion: |-
        Plataforma colombiana (teprotejo.org) para denunciar contenido en línea contra menores: ciberbullying, grooming, pornografía infantil.
      ejemplo: |-
        Encuentras un perfil que difunde fotos íntimas de menores. Lo reportas en teprotejo.org sin dar tus datos.
      emoji: "🆘"
    - termino: Ley 1620 de 2013
      definicion: |-
        Ley colombiana que crea el Sistema Nacional de Convivencia Escolar y obliga a cada colegio a tener un protocolo de manejo de conflictos.
      ejemplo: |-
        Si vives ciberbullying en el colegio, tu institución debe tener un protocolo activo según la Ley 1620. Pregúntalo en orientación.
      emoji: "📚"
  quiz:
    titulo: ¿Sabes cómo prevenir y denunciar ciberbullying?
    instrucciones: 5 preguntas para verificar que conoces los canales oficiales.
    preguntas:
      - enunciado: ¿Cuál es el número de la línea oficial del ICBF para menores en riesgo?
        opciones:
          - "123"
          - "141"
          - "911"
          - "1800"
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 141. Atención 24/7, gratuita, para menores en cualquier situación de riesgo o violencia.
        feedback_incorrecto: |-
          Es la Línea 141 del ICBF. Atención 24/7 gratuita para menores en situación de violencia o riesgo.
      - enunciado: ¿Qué propiedad NO define al ciberbullying?
        opciones:
          - Repetición
          - Una sola broma aislada
          - Desbalance de poder
          - Intención de daño
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Una broma aislada no es bullying. El ciberbullying es sostenido y con desbalance de poder.
        feedback_incorrecto: |-
          Una sola broma no es bullying. Las propiedades clave son repetición, desbalance, intención, espacio digital y permanencia.
      - enunciado: ¿Qué ley obliga a los colegios colombianos a tener protocolo de convivencia escolar?
        opciones:
          - Ley 100
          - Ley 1620 de 2013
          - Ley 30
          - Ley 9
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La Ley 1620 de 2013 crea el Sistema Nacional de Convivencia Escolar.
        feedback_incorrecto: |-
          Es la Ley 1620 de 2013. Cada colegio debe tener un protocolo activo según esa ley.
      - enunciado: Quieres denunciar contenido en línea contra un menor de forma anónima. ¿Dónde lo haces?
        opciones:
          - En cualquier red social
          - En la plataforma Te Protejo (teprotejo.org)
          - En el correo personal del agresor
          - No se puede denunciar
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Te Protejo permite denuncia anónima de contenido en línea contra menores.
        feedback_incorrecto: |-
          La plataforma es Te Protejo (teprotejo.org). Acepta denuncias anónimas y opera con instituciones competentes.
      - enunciado: ¿Por qué la permanencia es propiedad clave del ciberbullying?
        opciones:
          - Porque es divertido
          - Porque lo publicado en redes deja huella y prolonga el daño en el tiempo
          - Porque dura un minuto
          - Porque solo afecta a adultos
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Lo digital deja huella; el daño se prolonga incluso si el agresor borra, porque puede haber capturas o reenvíos.
        feedback_incorrecto: |-
          La permanencia importa porque el contenido digital deja rastro: capturas y reenvíos mantienen el daño vivo aunque se borre.

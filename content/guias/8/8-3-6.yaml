clave: 3-6
grado: 8
periodo: 3
sesion: 6
completo: true
duracion_min: 90
titulo: Ciberbullying --- prevención y Línea 141
titulo_portada: |-
  Ciberbullying ---
  prevención
  y Línea 141
producto_final: |-
  Tres piezas de convivencia digital: (a) el mapa de las cuatro fases del ciberbullying, de las primeras señales a la denuncia, con dos ejemplos concretos por fase; (b) un plan personal de cinco pasos con nombres reales de las personas a las que acudirías; (c) un cartel para el aula con la Línea 141 destacada y los demás canales, listo para colgar. Cierra con una ficha de cinco líneas donde declaras un compromiso con la convivencia del grupo.
apertura:
  origen: Conciliadores en equidad y Comisión de Convivencia de la JAC · la comunidad nombra a quien mira
  fuente: |-
    Congreso de la República de Colombia. (2021, 18 de diciembre). \emph{Ley 2166 de 2021. Por la cual se establece el régimen de los organismos de acción comunal\ldots} Diario Oficial.
  saber_ancestral: |-
    En Colombia, la comunidad no espera a que aparezca un testigo: lo nombra. Las juntas de acción comunal de barrios, corregimientos y veredas campesinas postulan a los \textbf{conciliadores en equidad}. Lo que un conciliador hace constar en un acta tiene efecto de cosa juzgada (Ley 446 de 1998). En cada junta hay una \textbf{Comisión de Convivencia y Conciliación}. No se puede sancionar a nadie sin pasar por ella (Ley 2166 de 2021, art. 29). Y los jueces de paz se eligen por voto popular y fallan en equidad (Ley 497 de 1999). Mirar, aquí, es un cargo. Ojo con una cosa: esto no es una tradición antigua, es derecho colombiano vigente. En un barrio de Cartago o en una vereda del Valle, quien da fe fue escogido por sus vecinos. La \textbf{cara de exclusión}: el que da fe también puede callar. Donde el poder local es fuerte, mirar y responder tiene costo. Hoy vas a hacer lo mismo con el ciberbullying: repartir el trabajo de mirar, en vez de dejárselo a la víctima.
  saber_contemporaneo: |-
    El \textbf{ciberbullying} es el hostigamiento repetido de una persona por medios digitales. Cinco rasgos lo separan de una pelea cualquiera. \textbf{Repetición}: pasa varias veces, no una. \textbf{Desbalance de poder}: quien agrede tiene ventaja, casi siempre por el grupo que lo respalda. \textbf{Intención de daño}: busca hacer sufrir. \textbf{Espacio digital}: ocurre en chats, redes o juegos en línea. \textbf{Permanencia}: lo publicado deja rastro y el daño sigue. Colombia tiene canales abiertos para responder. La \textbf{Línea 141} del ICBF atiende gratis, las 24 horas, a cualquier menor en riesgo. \textbf{Te Protejo} (teprotejo.org) recibe denuncias de contenido, incluso anónimas. La \textbf{Policía} atiende por el 123 lo que necesita presencia inmediata. Y tu colegio debe tener un protocolo escrito, según la \textbf{Ley 1620 de 2013}. Lo importante es esto: los cuatro canales atienden a testigos, no solo a víctimas.
  pregunta_puente: |-
    La junta de acción comunal nombra a alguien para que mire y responda, y así nadie carga solo con eso. Cuando en un chat de tu grupo empieza el hostigamiento, ¿quién tiene ese cargo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} si una situación cumple los cinco rasgos del ciberbullying o es un conflicto cotidiano; (2) \textbf{analizar} las cuatro fases y decidir qué canal corresponde en cada una; (3) \textbf{crear} tres piezas que le sirvan a tu grupo: el mapa de las fases, tu plan personal con nombres reales y el cartel del aula.
puentes:
  a_ruta: |-
    En las sesiones 1 a 5 aprendiste a producir imagen, relato y audio. Hoy esas mismas herramientas se miran desde la convivencia: sirven para sostener a alguien o para hundirlo. La sesión 7 trata grooming y sexting desde la ley; la 8, la estética de la liberación.
  a_escuta: |-
    Antes de la teoría vas a clasificar tres situaciones con los cinco rasgos. Ninguna es de tu grupo: son casos hipotéticos que entrega el docente. La idea es que aprendas a distinguir antes de que te toque decidir en caliente.
  a_sistematizacion: |-
    Ya sabes reconocer. Ahora vas a ver cómo escala el daño en cuatro fases y qué canal corresponde a cada una, con su número o su enlace.
  a_praxis: |-
    Tienes el criterio y los canales. Toca construir: el mapa de las fases, tu plan personal con nombres reales y el cartel que se cuelga mañana en el aula.
  a_producto: |-
    Lo que entregas hoy: mapa, plan, cartel y compromiso. La prueba de calidad es sencilla: un compañero que no estuvo en clase mira el cartel y sabe a quién llamar.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Conocer un canal de denuncia y no decirlo es dejar sola a la persona que lo necesitaba.
  a_triangulo: |-
    Para terminar, tres ideas sobre la responsabilidad de mirar, contadas con palabras de esta guía: Dussel sobre escuchar la voz del que reclama, Marco Aurelio sobre el enjambre y la abeja, Floridi sobre vivir entre otros en un mismo entorno de información.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Las 5 propiedades} (15 min · individual). (1) Tu docente entrega tres situaciones hipotéticas de conflicto digital. (2) Para cada una, marca cuáles de los cinco rasgos cumple: repetición, desbalance de poder, intención de daño, espacio digital y permanencia. (3) Escribe cuál de las tres es ciberbullying en sentido estricto y cuál es un conflicto cotidiano. (4) Anota en una línea qué rasgo hace que el daño sea más difícil de reparar.
  checks:
  - Marqué los cinco rasgos en las tres situaciones.
  - Sé cuál de las tres no es ciberbullying y por qué.
  - Puedo nombrar el rasgo que hace más difícil reparar el daño.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Las 5 propiedades». \textbf{Formato:} tabla de 3 filas y 5 columnas, una fila por situación y una columna por rasgo, con marca donde cumpla. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las tres filas están marcadas y escribiste cuál no es ciberbullying.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · ANALIZA --- Las 4 fases y los canales} (30 min · parejas). (1) Con tu pareja, escriban las cuatro fases en orden: primeras señales, escalada, impacto, denuncia y apoyo. (2) Pongan dos ejemplos concretos en cada fase, escritos como los diría alguien de su edad. (3) Al lado de cada fase, anoten qué canal corresponde y con qué dato de contacto. (4) Marquen con una flecha en qué fase la intervención cuesta menos y explica por qué en una línea.
  pilares:
  - |-
    \textbf{Las cuatro fases.} \textbf{Primeras señales}: un comentario cargado, una broma con filo, un emoji burlón. \textbf{Escalada}: se vuelve repetido y la persona empieza a evitar el chat o el salón. \textbf{Impacto}: aparecen el aislamiento, la irritabilidad, el bajón académico o los problemas de sueño. \textbf{Denuncia y apoyo}: se activa un canal. Cuanto antes se llegue a la cuarta, menos daño hubo.
  - |-
    \textbf{Los cuatro canales, con su dato.} \textbf{Línea 141} (ICBF): gratuita, 24 horas, para cualquier menor en riesgo. Contesta un profesional que escucha, orienta y deriva. \textbf{Te Protejo} (teprotejo.org): para denunciar contenido, y acepta denuncia anónima. \textbf{Policía} (123 o el CAI más cercano): cuando hace falta presencia inmediata. \textbf{Protocolo del colegio} (Ley 1620 de 2013): el primer contacto suele ser el docente o el coordinador.
  - |-
    \textbf{El testigo también llama.} Ninguno de los cuatro canales exige ser la víctima. Un amigo, un hermano o un compañero de salón puede llamar al 141 y contar lo que vio. Es exactamente lo que hace la Comisión de Convivencia de una junta: recibir de quien mira, no solo de quien sufre.
  - |-
    \textbf{La evidencia se guarda antes, no después.} Captura de pantalla, fecha y hora. Sin eso, una denuncia se vuelve la palabra de uno contra la del otro. Guardar no es acusar: es dejar constancia, igual que el acta del conciliador.
  anatomia:
    titulo: Ciberbullying y denuncia, en una mirada
    body: |-
      \textbf{5 rasgos:} repetición + poder + intención + digital + permanencia. \\[1mm] \textbf{4 fases:} señales / escalada / impacto / denuncia. \\[1mm] \textbf{4 canales:} 141 / teprotejo.org / 123 / protocolo del colegio. \\[1mm] \textbf{Regla:} el testigo también llama.
  errores_comunes: |-
    (1) \textbf{Llamar bullying a cualquier pelea}: sin los cinco rasgos, es un conflicto y se trata como conflicto. (2) \textbf{Esperar a la fase de impacto}: cuando ya hay aislamiento, el daño está hecho. (3) \textbf{Creer que solo la víctima denuncia}: los cuatro canales reciben a testigos. (4) \textbf{No guardar capturas}: el contenido se borra y la denuncia queda sin sustento. (5) \textbf{Reenviar «para que se vea»}: cada reenvío amplía la audiencia del daño.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} \textbf{Título:} «Actividad 2 --- Las 4 fases y los canales». \textbf{Formato:} tabla de 4 filas y 3 columnas (fase / dos ejemplos / canal con su dato de contacto), más la flecha en la fase donde intervenir cuesta menos. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las cuatro filas tienen ejemplos propios y cada canal aparece con su número o su enlace.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Cartel, plan y compromiso} (25 min · individual). (1) Pasa el mapa de las cuatro fases a limpio, en papel o en una herramienta libre. (2) Escribe tu plan personal de cinco pasos con nombres reales de personas de tu vida. (3) Diseña el cartel del aula con la jerarquía visual de la sesión 1, con la Línea 141 como el elemento más grande. (4) Escribe tu compromiso en cinco líneas. (5) Pásale el cartel a un compañero y pregúntale a quién llamaría; anota si acertó.
  pilares:
  - |-
    \textbf{Tu entrega tiene cuatro piezas.} El mapa de las cuatro fases con dos ejemplos cada una. El plan personal de cinco pasos. El cartel del aula con los cuatro canales. La ficha de compromiso de cinco líneas.
  - |-
    \textbf{Nombres reales, no categorías.} «Hablo con alguien de confianza» no es un plan. «Hablo con mi tía Lucía» sí lo es. Decidir hoy a quién llamarías mañana es la mitad del trabajo, porque en el momento de la crisis ya no se decide bien.
  - |-
    \textbf{El cartel se juzga desde lejos.} Párate a tres metros. Si desde ahí no se lee el 141, la jerarquía está mal. Lo primero que se ve tiene que ser el número, no el título ni el dibujo.
  - |-
    \textbf{El compromiso se escribe en primera persona y con verbo.} «Me comprometo a no reenviar capturas burlonas de compañeros.» «Me comprometo a preguntarle a quien vea aislado.» Una promesa sin verbo no se puede cumplir ni revisar.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Mapa con las cuatro fases y dos ejemplos en cada una. \\[1mm] \checkbox Plan personal de cinco pasos con nombres reales. \\[1mm] \checkbox Cartel con la Línea 141 como elemento más grande. \\[1mm] \checkbox Los cuatro canales aparecen en el cartel con su dato. \\[1mm] \checkbox Compromiso de cinco líneas, en primera persona y con verbo. \\[1mm] \checkbox Un compañero miró el cartel y supo a quién llamar.
  plantilla_guion: |-
    \textbf{Mapa.} \textit{Cuatro fases, dos ejemplos por fase.} \\[1mm] \textbf{Plan.} \textit{Cinco pasos con nombres reales.} \\[1mm] \textbf{Cartel.} \textit{141 grande, más los otros tres canales.} \\[1mm] \textbf{Compromiso.} \textit{Cinco líneas en primera persona.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Cartel, plan y compromiso». \textbf{Formato:} el plan de cinco pasos con nombres, el boceto del cartel y las cinco líneas del compromiso. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} un compañero miró tu cartel y dijo a quién llamaría sin preguntarte nada.
  producto_titulo: Mapa de las 4 fases + plan personal con nombres + cartel con la Línea 141 + compromiso
  criterios:
  - El mapa tiene las cuatro fases y dos ejemplos propios en cada una
  - El plan de cinco pasos nombra personas reales, no categorías
  - El cartel se lee a tres metros y la Línea 141 es lo primero que se ve
  - Los cuatro canales aparecen con su número o su enlace
  - El compromiso son cinco líneas en primera persona y con verbo
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.2
    idea: |-
      Tener conciencia ética es ser capaz de oír la voz del que reclama, aunque incomode a las reglas del grupo.
    aplicacion: |-
      En un chat, la persona hostigada casi nunca grita. Dice «ya, déjenme» y el grupo sigue. Oír esa voz cuando todos la están tapando es lo que hoy entrenaste con el plan personal.
    pregunta_espejo: |-
      ¿Cuándo oí a alguien pedir que pararan y seguí como si nada?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 54 (c. 175 d.C.)
    idea: |-
      Lo que no le sirve al enjambre tampoco le sirve a la abeja.
    aplicacion: |-
      Un grupo donde se puede hostigar a cualquiera no es seguro para nadie, ni siquiera para quien se ríe hoy. El cartel que cuelgas no protege solo a una persona: cambia lo que el salón acepta.
    pregunta_espejo: |-
      ¿Lo que dejo pasar en mi grupo me protegería a mí si mañana me tocara?
  floridi:
    autor: Luciano Floridi · Hyperhistory and the Philosophy of Information Policies (2015)
    idea: |-
      Vivimos dentro de un mismo entorno de información, y compartirlo con otros nos hace responsables de lo que dejamos allí.
    aplicacion: |-
      Una captura burlona no desaparece cuando la borras: alguien ya la reenvió. Por eso la permanencia es el rasgo más difícil de reparar, y por eso no reenviar es una decisión ética, no un gesto menor.
    pregunta_espejo: |-
      ¿Qué dejé en ese entorno esta semana que no me gustaría encontrar sobre mí?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el mapa, el plan, el cartel y las cinco líneas del compromiso. El cartel se cuelga en el aula al empezar la clase. En la sesión 7 vas a trabajar grooming y sexting desde la ley y los protocolos de prevención. Es la continuación directa de lo de hoy.
web:
  resumen: |-
    En Colombia la comunidad nombra a quien mira: los conciliadores en equidad y la Comisión de Convivencia de cada junta. Hoy haces lo mismo con el ciberbullying. Aprendes a distinguirlo de un conflicto, a seguir sus cuatro fases y a usar los cuatro canales de denuncia, empezando por la Línea 141.
  subtema: Ciberseguridad · Ciberbullying · Línea 141
  pre_lectura:
    por_que_importa: |-
      Los cuatro canales de denuncia atienden a testigos, no solo a víctimas. Casi nadie lo sabe, y por eso mucha gente se queda mirando cuando ya podía haber llamado.
    pregunta_detonante: |-
      Si en un chat de tu grupo empieza el hostigamiento, ¿quién tiene el cargo de mirar y responder?
    activacion:
      titulo: Quién tiene el cargo
      descripcion: |-
        En 2 minutos, escribe el nombre de una persona a la que llamarías si mañana hostigaran a un compañero. No vale «alguien de confianza»: un nombre.
      duracion_min: 5
    conexion:
      anterior: En la sesión 5 trabajaste edición de audio y el cuidado de la voz.
      siguiente: En la sesión 7 trabajas grooming y sexting desde la ley y los protocolos.

clave: 3-7
grado: 8
periodo: 3
sesion: 7
completo: true
duracion_min: 90
titulo: Grooming y sexting --- riesgos digitales y Ley 1336
titulo_portada: |-
  Grooming y sexting ---
  riesgos digitales
  y Ley 1336
producto_final: |-
  Tres piezas de prevención: (a) el análisis de tres noticias de prensa colombiana sobre grooming o sexting, con las cuatro etapas señaladas en cada una; (b) tu protocolo personal de cinco pasos, con nombres reales de las personas a las que acudirías; (c) una ficha de una página sobre la Ley 1336 de 2009 y los artículos 218 y 219-A del Código Penal, con los canales de denuncia. Cierra con cinco líneas dirigidas a alguien menor que tú, explicándole por qué pedir ayuda no es quedar mal.
apertura:
  origen: Veredas cafeteras de Caldas · el convite, la ayuda que se convoca
  fuente: |-
    Parada Sanabria, P. J. (2017). Práctica social y cultural del campesinado cafetero en cuatro municipios de Caldas (Colombia). \emph{Revista Colombiana de Sociología, 40}(1 Supl.), 193--212. https://doi.org/10.15446/rcs.v40n1Supl.65913
  saber_ancestral: |-
    En las veredas cafeteras la ayuda mutua tiene un nombre propio: el \textbf{convite}. No es permanente ni ceremonial. Se activa cuando hay una necesidad concreta. Lo dice así una campesina de Salamina, en Caldas: «Si hay necesidad de arreglar caminos interveredales o se daña la carretera, se hace un convite» (citada en Parada Sanabria, 2017, p. 203). Fíjate en el detalle que importa. El convite no se pide como favor personal: se convoca, porque el camino es de todos. Ahí, pedir ayuda no es confesar debilidad. Es reconocer que hay problemas que ninguna casa resuelve sola. La \textbf{cara de exclusión}: la reciprocidad entre desiguales se vuelve deuda, y una junta capturada por favores convierte la ayuda en cobro. Hoy vas a necesitar exactamente esa idea. El grooming funciona porque logra que la persona no llame a nadie.
  saber_contemporaneo: |-
    El \textbf{grooming} es el proceso por el que un adulto contacta a un menor por medios digitales para ganarse su confianza con fines sexuales. No es el nombre legal, es el nombre del patrón. En Colombia la respuesta legal está repartida en varias normas. La \textbf{Ley 1336 de 2009} robustece la Ley 679 de 2001 contra la explotación, la pornografía y el turismo sexual con menores. El \textbf{artículo 218} del Código Penal castiga producir, almacenar o distribuir material de pornografía con menores. El \textbf{artículo 219-A} castiga usar medios de comunicación para ofrecer actividades sexuales con menores de 18 años, con 10 a 14 años de prisión. El \textbf{sexting} es el envío de contenido sexual por medios digitales. Cuando hay un menor en la imagen, ese material queda cubierto por el artículo 218, aunque las dos personas tengan la misma edad. Y hay algo que conviene tener claro desde el principio: la responsabilidad penal por pedir ese contenido es del adulto que lo pide, no del menor a quien se lo pidieron.
  pregunta_puente: |-
    El convite se convoca porque el camino es de todos, y por eso pedir ayuda no avergüenza a nadie. El grooming hace lo contrario: convence a la persona de que esto es un secreto suyo. ¿Cómo se rompe esa parte?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las cuatro etapas del grooming en un caso publicado en prensa, sin exponer a nadie del grupo; (2) \textbf{analizar} qué dicen la Ley 1336 y los artículos 218 y 219-A, y qué canal corresponde en cada momento; (3) \textbf{crear} tu protocolo personal de cinco pasos y la ficha legal que puedas mostrarle a alguien menor.
puentes:
  a_ruta: |-
    En la sesión 6 trabajaste ciberbullying y los canales de denuncia. Hoy sigue el mismo marco de protección al menor, con otro riesgo y otras leyes. La sesión 8 entra en la estética de la liberación y la 9 abre el proyecto integrador.
  a_escuta: |-
    Antes de la teoría vas a leer un caso publicado en prensa, en silencio. La regla es firme: el caso es de prensa, no del grupo, y no se comentan detalles de personas. Lo que se analiza es el patrón.
  a_sistematizacion: |-
    Ya viste el patrón en un caso. Ahora vas a ordenarlo en cuatro etapas y a ponerle al lado lo que dice la ley y a quién se llama en cada una.
  a_praxis: |-
    Tienes las etapas y la ley. Toca escribir lo tuyo: el análisis de tres casos, tu protocolo con nombres reales y la ficha legal de una página.
  a_producto: |-
    Lo que entregas hoy: tres casos analizados, tu protocolo y la ficha. La prueba de calidad: podrías explicárselo a un primo de once años sin asustarlo y sin ocultarle nada.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un protocolo escrito en frío es lo que te deja actuar cuando ya no hay calma para pensar.
  a_triangulo: |-
    Para terminar, tres ideas sobre la confianza y el cuidado, contadas con palabras de esta guía: Dussel sobre la persona que no es una cosa, Séneca sobre no creer de una vez lo que nos cuentan, Floridi sobre la atención como bien escaso.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Lectura de un caso de prensa} (15 min · individual). (1) Tu docente entrega un caso publicado en prensa colombiana, sin nombres de menores. (2) Léelo completo antes de escribir nada. (3) Anota cuál fue el primer contacto y por qué canal llegó. (4) Anota qué hizo el adulto para ganarse la confianza y cómo pidió silencio. (5) Escribe en qué momento alguien se enteró y quién lo denunció. Regla firme: el caso es de prensa, no del grupo, y no se comentan detalles personales.
  checks:
  - Leí el caso completo antes de escribir.
  - Anoté el primer contacto, la confianza, el silencio y la denuncia.
  - No comenté detalles de personas en el grupo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Lectura de un caso de prensa». \textbf{Formato:} ficha de cuatro renglones, uno por cada momento del caso, más una línea sobre qué se repetiría en otro caso distinto. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} puedes describir el patrón sin nombrar a nadie.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · ANALIZA --- Las 4 etapas y la ley} (30 min · parejas). (1) Con tu pareja, escriban las cuatro etapas en orden: contacto, confianza, aislamiento y solicitud. (2) Pongan al lado de cada etapa una señal concreta, dicha como se diría en un chat real. (3) Anoten qué norma aplica y qué canal corresponde en cada etapa. (4) Marquen la etapa donde todavía es fácil salir y expliquen en una línea por qué después deja de serlo.
  pilares:
  - |-
    \textbf{Las cuatro etapas.} \textbf{Contacto}: llega una solicitud por red, chat o juego en línea, casi siempre de alguien que dice tener tu edad. \textbf{Confianza}: conversación diaria, interés sostenido, regalos digitales como créditos de juego o recargas. \textbf{Aislamiento}: aparece la petición de silencio, «esto es entre nosotros», «tus papás no lo entenderían». \textbf{Solicitud}: pide contenido íntimo o un encuentro, y si hay negativa, amenaza con publicar lo que ya tiene.
  - |-
    \textbf{La ley, en tres piezas.} La \textbf{Ley 1336 de 2009} robustece la Ley 679 de 2001 contra la explotación y la pornografía con menores. El \textbf{artículo 218} del Código Penal castiga producir, almacenar o distribuir ese material. El \textbf{artículo 219-A} castiga ofrecer actividades sexuales con menores de 18 años usando medios de comunicación, con 10 a 14 años de prisión. Quien responde ante la ley es el adulto que pide, no el menor a quien le pidieron.
  - |-
    \textbf{Los canales, con su dato.} \textbf{Línea 141} del ICBF, gratuita y las 24 horas, para cualquier menor en riesgo. \textbf{Te Protejo} (teprotejo.org), para denunciar contenido, incluso de forma anónima. \textbf{CAI Virtual} de la Policía (caivirtual.policia.gov.co), especializado en delitos informáticos. \textbf{Fiscalía}, para la denuncia formal. \textbf{Protocolo del colegio} (Ley 1620 de 2013), con el docente o el orientador como primer contacto.
  - |-
    \textbf{La etapa del aislamiento es la bisagra.} Antes de ella, contar cuesta poco. Después, el agresor ya tiene material y usa la vergüenza como candado. Por eso el convite sirve de imagen: convocar ayuda no es un favor que se pide, es lo que se hace cuando el problema no cabe en una casa sola.
  anatomia:
    titulo: Grooming y ley, en una mirada
    body: |-
      \textbf{4 etapas:} contacto / confianza / aislamiento / solicitud. \\[1mm] \textbf{Ley 1336 de 2009:} robustece la Ley 679 de 2001. \\[1mm] \textbf{Código Penal:} art. 218 y art. 219-A (10 a 14 años). \\[1mm] \textbf{Canales:} 141 / teprotejo.org / CAI Virtual / Fiscalía / colegio.
  errores_comunes: |-
    (1) \textbf{Aceptar solicitudes de cuentas que no conoces fuera de la pantalla}: ahí empieza el contacto. (2) \textbf{Publicar el colegio, el uniforme o el horario}: son los datos que permiten ubicarte. (3) \textbf{Aceptar el «esto queda entre nosotros»}: ningún adulto responsable le pide secretos a un menor. (4) \textbf{Reenviar contenido íntimo de un compañero}: reenviar también es distribuir, y eso está en el artículo 218. (5) \textbf{Callar por vergüenza}: es exactamente lo que el agresor necesita para seguir.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} \textbf{Título:} «Actividad 2 --- Las 4 etapas y la ley». \textbf{Formato:} tabla de 4 filas y 3 columnas (etapa / señal concreta / norma y canal), más la marca en la etapa donde todavía es fácil salir. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} cada etapa tiene su señal escrita como se diría en un chat.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Protocolo personal y ficha legal} (25 min · individual). (1) Busca tres noticias de prensa colombiana sobre grooming o sexting y señala las cuatro etapas en cada una. (2) Escribe tu protocolo de cinco pasos con nombres reales de personas de tu vida. (3) Haz la ficha de una página con la Ley 1336, los artículos 218 y 219-A y los canales. (4) Escribe cinco líneas dirigidas a alguien menor que tú, sobre por qué pedir ayuda no es quedar mal. (5) Pásale la ficha a un compañero y pregúntale qué haría en la etapa de aislamiento.
  pilares:
  - |-
    \textbf{Tu entrega tiene cuatro piezas.} Los tres casos de prensa con sus cuatro etapas señaladas. El protocolo de cinco pasos. La ficha legal de una página. Las cinco líneas para alguien menor.
  - |-
    \textbf{Nombres reales, no categorías.} «Le cuento a alguien de confianza» no es un protocolo. «Le escribo a mi tía Marcela, que me contesta de noche» sí lo es. En el momento de la presión ya no se decide bien, así que la decisión se toma antes.
  - |-
    \textbf{Los casos son de prensa, y por una razón.} Trabajar con noticias publicadas permite ver el patrón sin exponer a nadie del salón. Si alguien reconoce su propia situación mientras lee, el paso siguiente no es contarlo en clase: es hablar con el orientador o llamar al 141.
  - |-
    \textbf{Las cinco líneas son la prueba real.} Explicárselo a alguien de once años obliga a decirlo sin tecnicismos y sin susto. Si te sale una amenaza en vez de una explicación, todavía no lo entendiste.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tres noticias de prensa con las cuatro etapas señaladas. \\[1mm] \checkbox Ningún caso del grupo, ningún nombre de compañero. \\[1mm] \checkbox Protocolo de cinco pasos con nombres reales. \\[1mm] \checkbox Ficha con la Ley 1336 y los artículos 218 y 219-A. \\[1mm] \checkbox Los cinco canales con su número o su enlace. \\[1mm] \checkbox Cinco líneas dirigidas a alguien menor que tú.
  plantilla_guion: |-
    \textbf{Casos.} \textit{Tres noticias, cuatro etapas en cada una.} \\[1mm] \textbf{Protocolo.} \textit{Cinco pasos con nombres reales.} \\[1mm] \textbf{Ficha.} \textit{Ley 1336, artículos 218 y 219-A, canales.} \\[1mm] \textbf{Cinco líneas.} \textit{Para alguien menor que tú.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Protocolo personal y ficha legal». \textbf{Formato:} los tres casos con sus etapas, el protocolo de cinco pasos y la ficha legal, más las cinco líneas finales. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} un compañero leyó tu ficha y supo qué hacer en la etapa de aislamiento.
  producto_titulo: Tres casos de prensa + protocolo personal con nombres + ficha de la Ley 1336
  criterios:
  - Los tres casos son de prensa publicada y tienen las cuatro etapas señaladas
  - El protocolo de cinco pasos nombra personas reales, no categorías
  - La ficha cita la Ley 1336 y los artículos 218 y 219-A con lo que castiga cada uno
  - Los cinco canales aparecen con su número o su enlace
  - Las cinco líneas explican sin asustar y sin ocultar
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.2.2
    idea: |-
      Cuando alguien aparece de verdad como otro, deja de ser una cosa entre mis instrumentos: es alguien, no algo.
    aplicacion: |-
      El grooming hace el movimiento contrario. Convierte a una persona en un contenido que se pide, se guarda y se cambia por algo. Reconocer ese movimiento es lo que te permite nombrarlo antes de que avance.
    pregunta_espejo: |-
      ¿En qué conversación de esta semana traté a alguien como algo y no como alguien?
  estoico:
    autor: Séneca · Sobre la ira, II, 29 (c. 45 d.C.)
    idea: |-
      No hay que apresurarse a creer lo que nos cuentan: unos mienten para engañar y otros porque ya los engañaron.
    aplicacion: |-
      Una cuenta nueva que dice tu edad, comparte tus gustos y te escribe todos los días puede ser cierta. También puede no serlo. Esperar a comprobarlo no es desconfianza enfermiza: es el paso que el protocolo te ahorra tener que improvisar.
    pregunta_espejo: |-
      ¿Qué le creí este mes a una cuenta que nunca vi fuera de la pantalla?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6
    idea: |-
      Nuestra capacidad de prestar atención es un bien escaso, valioso y limitado.
    aplicacion: |-
      Piensa en cuánto tiempo invierte alguien que te escribe a diario durante semanas. Esa atención sostenida es cara, y nadie la regala sin esperar algo. Preguntarte qué espera a cambio es una forma sencilla de leer la etapa de la confianza.
    pregunta_espejo: |-
      ¿Quién está invirtiendo mucha atención en mí, y qué parece esperar a cambio?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con los tres casos, el protocolo, la ficha y las cinco líneas. Guarda el protocolo donde puedas verlo, no en una carpeta que no vas a abrir. En la sesión 8 trabajas la estética de la liberación aplicada a producir piezas sobre tu barrio.
web:
  resumen: |-
    El convite se convoca porque el camino es de todos, y ahí pedir ayuda no avergüenza a nadie. El grooming hace lo contrario: aísla. Hoy aprendes sus cuatro etapas, qué dicen la Ley 1336 y los artículos 218 y 219-A del Código Penal, y escribes un protocolo con nombres reales.
  subtema: Ciberseguridad · Grooming y sexting · Ley 1336
  pre_lectura:
    por_que_importa: |-
      Quien responde ante la ley por pedir contenido íntimo a un menor es el adulto que lo pide. Mucha gente no lo sabe, y esa confusión es justo lo que sostiene el silencio.
    pregunta_detonante: |-
      Si alguien te pidiera guardar un secreto que no puedes contarle a nadie de tu casa, ¿qué te estaría diciendo eso de esa persona?
    activacion:
      titulo: El secreto que aísla
      descripcion: |-
        En 2 minutos, escribe tres razones que alguien podría darte para que no le cuentes a tu familia. Léelas de nuevo. Todas sirven al mismo propósito.
      duracion_min: 5
    conexion:

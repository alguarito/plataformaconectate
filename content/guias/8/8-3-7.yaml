  conceptos_clave:
    - categoria: Cómo se reconoce
      termino: Grooming
      definicion: |-
        Proceso por el que un adulto contacta a un menor por medios digitales para ganarse su confianza con fines sexuales. Es el nombre del patrón, no el nombre legal.
      ejemplo: Una cuenta nueva que dice tener tu edad, escribe a diario y termina pidiendo que no le cuentes a nadie.
    - categoria: Cómo se reconoce
      termino: Aislamiento
      definicion: "La etapa donde aparece la petición de silencio. Es la bisagra: antes de ella contar cuesta poco, después el agresor usa la vergüenza como candado."
      ejemplo: «Esto es entre nosotros», «tus papás no lo entenderían». Las dos frases sirven al mismo propósito.
    - categoria: Qué dice la ley
      termino: Ley 1336 de 2009
      definicion: |-
        Robustece la Ley 679 de 2001 contra la explotación, la pornografía y el turismo sexual con niñas, niños y adolescentes.
      ejemplo: Es el marco general del que cuelgan los delitos concretos del Código Penal.
    - categoria: Qué dice la ley
      termino: Artículos 218 y 219-A
      definicion: |-
        El 218 castiga producir, almacenar o distribuir pornografía con menores. El 219-A castiga ofrecer actividades sexuales con menores de 18 años por medios de comunicación, con 10 a 14 años de prisión.
      ejemplo: Reenviar una foto íntima de un compañero menor también es distribuir, y cae bajo el artículo 218.
    - categoria: A quién se acude
      termino: CAI Virtual de la Policía
      definicion: Punto de atención en línea de la Policía Nacional para delitos informáticos, en caivirtual.policia.gov.co.
      ejemplo: Junto con la Línea 141 y Te Protejo, es uno de los canales que puedes usar sin ser la víctima directa.
  cinco_dimensiones:
    personal: Escribiste en frío a quién acudirías, y por eso no vas a tener que decidirlo en caliente.
    emocional: La vergüenza es la herramienta principal del agresor. Nombrarla le quita la mitad de su fuerza.
    ciudadana: Saber que la responsabilidad penal es del adulto que pide cambia quién debe sentir miedo en esa situación.
    local: El convite se convoca porque el camino es de todos. Pedir ayuda ahí nunca fue una confesión de debilidad.
    intergeneracional: Las cinco líneas que escribiste para alguien menor son lo mismo que hicieron contigo quienes te advirtieron a tiempo.
  post_lectura:
    reflexion: |-
      De las cuatro etapas, ¿cuál te costaría más reconocer si te estuviera pasando a ti, y qué paso de tu protocolo lo compensa?
    transferencia: |-
      Esta semana, revisa quién puede escribirte por privado en tus redes. Cambiar esa configuración es el primer paso de tu protocolo, y toma dos minutos.
    cierre: El convite se convoca sin pedir permiso ni pedir perdón. Tu protocolo sirve para lo mismo.
  quiz:
    titulo: ¿Reconoces el patrón y sabes qué dice la ley?
    instrucciones: Cinco preguntas para verificar que identificas las etapas y conoces las normas y los canales. No va al cuaderno.
    preguntas:
      - enunciado: ¿Cuál es la etapa bisagra del grooming, la que hace mucho más difícil salir?
        opciones:
          - El aislamiento, cuando pide que no le cuentes a nadie.
          - El contacto inicial por una red o un juego.
          - La conversación diaria de las primeras semanas.
          - El momento en que alguien de la familia se entera.
        respuesta_index: 0
        feedback_correcto: Sí. Antes del aislamiento contar cuesta poco; después, la vergüenza funciona como candado.
        feedback_incorrecto: Es el aislamiento. La petición de secreto es lo que corta el acceso a la red de apoyo.
      - enunciado: Un adulto le pide contenido íntimo a un menor por chat. ¿Quién responde ante la ley?
        opciones:
          - Los dos por igual, porque ambos participaron.
          - El menor, por haber aceptado la conversación.
          - El adulto que lo pide.
          - Nadie, mientras no se publique nada.
        respuesta_index: 2
        feedback_correcto: Correcto. La responsabilidad penal recae en el adulto, y el marco legal existe para proteger al menor.

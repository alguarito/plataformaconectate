grado: 8
periodo: 3
sesion: 7
completo: true
titulo: Grooming y sexting --- riesgos digitales y Ley 1336
titulo_portada: |-
  Grooming y sexting ---
  riesgos digitales
  y Ley 1336
producto_final: |-
  3 entregables sobre prevención de riesgos digitales (a) análisis de 3 casos reales de grooming o sexting publicados en prensa colombiana (no exponer casos del grupo) identificando las 4 etapas típicas, (b) protocolo personal de prevención en 5 pasos concretos que tú aplicarías, (c) ficha resumen de la Ley 1336 de 2009 con sus puntos clave para menores + reflexión de 5 líneas sobre por qué la advertencia ancestral del \emph{``no hables con extraños''} sigue siendo válida en el entorno digital
apertura:
  saber_ancestral: |-
    En cualquier casa colombiana, los mayores repetían advertencias a los niños cuando salían solos: \emph{``no aceptes dulces de quien no conoces''}, \emph{``no subas al carro de un extraño''}, \emph{``no te dejes llevar por la promesa fácil''}. No era miedo paranoico: era \textbf{sabiduría protectora destilada de generaciones}. Las abuelas sabían que el peligro hacia menores rara vez aparece como amenaza abierta. Casi siempre llega \textbf{disfrazado de amabilidad}: el adulto que ofrece dulces, el desconocido que parece amigo, la persona mayor que ofrece atención o regalos que el menor no recibe en casa. La protección ancestral funcionaba con 3 reglas simples: (1) \textbf{Desconfía del adulto que se interesa demasiado sin razón}. (2) \textbf{No aceptes regalos de quien no conoces}. (3) \textbf{Cuéntale a un mayor de confianza si alguien te incomoda}. En el entorno digital, donde los extraños aparecen como avatares amigables, esa advertencia se hace más necesaria. La Ley 1336 de 2009 traduce esa advertencia popular al lenguaje legal del Estado.
  saber_contemporaneo: |-
    El \textbf{grooming} (acoso digital a menores) es el proceso en que un adulto (o alguien mayor) establece contacto con un menor a través de medios digitales (redes sociales, juegos en línea, chats) para ganar su confianza con intención de obtener contenido íntimo o establecer contacto físico abusivo. El \textbf{sexting} es el envío de mensajes, fotos o videos de contenido sexual a través de medios digitales; cuando involucra a menores, constituye delito penal en Colombia (producción de pornografía infantil). En Colombia, la \textbf{Ley 1336 de 2009} (Ley contra la explotación sexual comercial de niños, niñas y adolescentes) y el \textbf{Código Penal (Ley 599 de 2000)} establecen que: (1) \textbf{Producir, almacenar o distribuir} imágenes sexuales de menores es delito grave (artículo 218 del Código Penal). (2) \textbf{Grooming} es delito tipificado en el artículo 219-A del Código Penal: pena de 10 a 14 años de prisión. (3) Los \textbf{adultos} que reciben contenido íntimo de menor enfrentan responsabilidad legal completa. (4) Los \textbf{menores que envían contenido} también pueden tener consecuencias legales y emocionales graves; el marco legal busca protegerlos pero el daño psicológico y reputacional es real. La regla profesional pedagógica: \textbf{ningún adulto responsable pide contenido íntimo a un menor por ningún motivo}.
  pregunta_puente: |-
    ¿Qué sabía la abuela al advertir \emph{``no aceptes dulces de quien no conoces''}, que la cultura digital olvida cuando los menores aceptan amistades de cuentas desconocidas que parecen amables? ¿Y por qué la Ley 1336 protege específicamente a menores aunque ellos crean que están en control?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 4 etapas típicas del grooming digital (contacto inicial, ganar confianza, aislamiento, solicitud); (2) \textbf{analizar} 3 casos reales de prensa para reconocer cómo opera el patrón sin involucrar casos del grupo; (3) \textbf{evaluar} tu propio uso de redes detectando situaciones de riesgo potencial; (4) \textbf{crear} tu protocolo personal de prevención y ficha sobre la Ley 1336.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 6 abordó ciberbullying. Hoy continuamos con \textbf{grooming y sexting}: temas distintos pero relacionados por su marco común de \emph{protección al menor en entornos digitales}. La sesión 8 (estética de la liberación) y la 9 (proyecto integrador) construyen sobre esta base ética.
  a_escuta: |-
    Antes de teorizar, vas a hacer una \emph{lectura cuidadosa}: tu docente proyecta o entrega 1 caso real publicado en prensa colombiana sobre grooming (sin identificar a menores). Lees atento. La regla: este ejercicio se hace en silencio y los detalles personales del caso NO se comentan en el grupo. Lo que sí se analiza es el patrón.
  a_sistematizacion: |-
    Ya leíste el caso. Ahora vas a entender la \textbf{anatomía del grooming}: las 4 etapas típicas, el marco legal de la Ley 1336, los canales de denuncia (Línea 141, Te Protejo, CAI Virtual de la Policía).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: analizar 3 casos de prensa, construir protocolo personal, escribir ficha de la Ley 1336.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: análisis de casos + protocolo personal + ficha legal. El criterio principal: que el protocolo personal sea específico para tu vida (no genérico) y que conozcas los canales de denuncia para usarlos si tú o un compañero los necesitan.
  a_evaluacion: |-
    Antes de cerrar, mira la protección desde las cinco dimensiones humanas. Conocer los protocolos es respeto por uno mismo y por los compañeros; ignorarlos es dejar la propia seguridad al azar.
  a_triangulo: |-
    Y para terminar, tres voces sobre la protección y la confianza. Dussel sobre el sistema que protege a los vulnerables, Séneca sobre la prudencia ante el extraño, Floridi sobre la infosfera y la dignidad del menor.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Lectura cuidadosa de un caso} (15 min · individual). Tu docente proyecta o entrega 1 caso real (anónimo) publicado en prensa colombiana sobre grooming digital. Lo lees con atención y anotas: (1) ¿cuál fue el primer contacto entre el adulto agresor y el menor?, (2) ¿qué hizo el agresor para ganar confianza?, (3) ¿hubo aislamiento del menor de su red de apoyo?, (4) ¿en qué momento se hizo la denuncia? Reglas: el caso es de prensa, no del grupo. No se identifican personas. Lo que analizamos es el \textbf{patrón}, no la persona.
  checks:
  - Leí el caso con atención.
  - Identifiqué las etapas del patrón.
  - No comenté detalles personales en el grupo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Lectura del caso». \textbf{Formato:} ficha con 4 etapas identificadas + 1 línea sobre qué patrón se reconoce. \textbf{Sabes que terminaste cuando} ves el patrón, no solo el caso.
sistematizacion:
  intro: |-
    El caso te enseñó el patrón. Ahora necesitas la \textbf{anatomía formal}: las 4 etapas del grooming, el marco legal de la Ley 1336, los canales de denuncia específicos.
  pilares:
  - |-
    Las \textbf{4 etapas típicas del grooming} se descomponen así: (1) \textbf{Contacto inicial}: el agresor se acerca al menor a través de redes, juegos o chats. Suele presentarse como cercano en edad o intereses. (2) \textbf{Ganar confianza}: conversación frecuente, mostrar interés genuino aparente, regalos (créditos de juegos, vouchers, dinero). (3) \textbf{Aislamiento}: el agresor pide que el menor no le cuente a nadie. \emph{``Este es nuestro secreto''}, \emph{``tus padres no entenderían''}, \emph{``si cuentas voy a meterme en problemas''}. (4) \textbf{Solicitud o amenaza}: pide contenido íntimo o encuentro presencial; si el menor se resiste, el agresor amenaza con publicar conversaciones, contar a la familia, etc.
  - |-
    El \textbf{marco legal en Colombia} (puntos clave): (a) \textbf{Ley 1336 de 2009}: prohíbe la explotación sexual comercial de niños, niñas y adolescentes. Penaliza la producción, distribución y posesión de material de explotación sexual de menores. (b) \textbf{Código Penal, art. 218}: pornografía con menores, pena de 10-20 años. (c) \textbf{Código Penal, art. 219-A}: utilización o facilitación de medios de comunicación para ofrecer servicios sexuales con menores, pena 10-14 años. (d) Los \textbf{menores no son responsables penalmente} por los contenidos que el adulto les solicita, pero pueden sufrir consecuencias emocionales graves; el sistema legal busca proteger al menor.
  - |-
    Los \textbf{canales de denuncia específicos} en Colombia para grooming/sexting: (a) \textbf{Línea 141 ICBF}: 24/7 para menores en riesgo. (b) \textbf{Te Protejo} (teprotejo.org): denuncia anónima de contenido en línea. (c) \textbf{CAI Virtual de la Policía Nacional}: caivirtual.policia.gov.co, especializado en delitos informáticos. (d) \textbf{Fiscalía}: para denuncia formal. (e) \textbf{Protocolo escolar}: psicólogo, coordinador, según Ley 1620.
  - |-
    Algoritmo de prevención: (1) no aceptar amistades de cuentas desconocidas en redes. (2) no compartir información personal (colegio, dirección, horarios) con desconocidos. (3) si alguien te incomoda, contar inmediatamente a un adulto de confianza. (4) guardar evidencia (capturas) sin reenviar. (5) usar canales oficiales para denunciar.
  anatomia:
    titulo: Anatomía del grooming y la prevención
    body: |-
      \textbf{4 etapas:} contacto / confianza / aislamiento / solicitud. \\[1mm] \textbf{Ley 1336 de 2009:} protección de menores. \\[1mm] \textbf{Código Penal arts. 218 y 219-A:} delitos específicos. \\[1mm] \textbf{Canales:} 141 / Te Protejo / CAI Virtual / Fiscalía / colegio.
  errores_comunes: |-
    (1) \textbf{Aceptar solicitudes de cuentas desconocidas}: el contacto inicial empieza ahí. (2) \textbf{Compartir información personal}: dirección, colegio, horarios, foto en uniforme. (3) \textbf{Aceptar \emph{``este es nuestro secreto''}}: ningún adulto responsable pide secretos a un menor. (4) \textbf{Reenviar contenido íntimo}: aunque sea de un compañero, reenviar puede constituir distribución. (5) \textbf{No contar por vergüenza}: el silencio sostiene al agresor.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía + Ley 1336». \textbf{Formato:} (a) las 4 etapas con sus señales; (b) Ley 1336 con puntos clave; (c) los 5 canales de denuncia; (d) los 5 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías explicarle a alguien menor el riesgo y los protocolos.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA + CREA --- Análisis + protocolo + ficha legal} (35 min · individual). Hora de aplicar. Analizas 3 casos de prensa, construyes tu protocolo personal, escribes ficha de la Ley 1336.
  pilares:
  - |-
    Los 3 entregables se construyen así: (1) \textbf{Análisis de 3 casos de prensa}: busca 3 noticias publicadas en periódicos colombianos (El Tiempo, El Espectador, El País, El Liberal) sobre grooming o sexting. Para cada uno, identifica las 4 etapas. NO se comentan casos del grupo ni se exponen detalles personales. (2) \textbf{Protocolo personal de prevención}: 5 pasos concretos para ti (\emph{``1. no acepto solicitudes de cuentas que no conozco en la vida real; 2. si alguien me incomoda en chat, le cuento a mi mamá; 3. no comparto fotos en uniforme escolar; 4. si necesito ayuda, llamo a Línea 141; 5. guardo capturas como evidencia''}). (3) \textbf{Ficha de la Ley 1336}: resumen de 1 página con: nombre completo de la ley, año, qué protege, qué prohíbe, sanciones, canales de denuncia.
  - |-
    Sigue el patrón \textbf{``específico sobre genérico''}: el protocolo personal vale solo si menciona personas reales y acciones concretas. \emph{``Le cuento a alguien de confianza''} no basta: \emph{``Le cuento a mi tía Marcela que me deja su WhatsApp''}. La phronesis del cuidado consiste en \textbf{decidir hoy a quién llamarías mañana}.
  - |-
    La reflexión final de 5 líneas conecta lo ancestral con lo digital: ¿por qué la advertencia del \emph{``no hables con extraños''} sigue siendo válida en redes?, ¿qué hace que ahora sea más necesaria, no menos?, ¿qué dirías a un primo o hermano menor sobre esto?.
  - |-
    Algoritmo: (1) buscar 3 noticias de prensa. (2) analizar las 4 etapas en cada una. (3) escribir protocolo personal específico. (4) hacer ficha de la Ley 1336. (5) escribir reflexión final.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox 3 casos de prensa analizados con las 4 etapas. \\[1mm] \checkbox Casos son de prensa, no del grupo. \\[1mm] \checkbox Protocolo personal con 5 pasos específicos. \\[1mm] \checkbox Nombres de personas reales en el protocolo. \\[1mm] \checkbox Ficha de la Ley 1336 con puntos clave. \\[1mm] \checkbox Canales de denuncia incluidos. \\[1mm] \checkbox Reflexión final de 5 líneas.
  plantilla_guion: |-
    \textbf{Análisis de casos.} \textit{3 noticias + 4 etapas cada una.} \\[1mm] \textbf{Protocolo personal.} \textit{5 pasos específicos.} \\[1mm] \textbf{Ficha Ley 1336.} \textit{Resumen 1 página.} \\[1mm] \textbf{Reflexión.} \textit{Ancestral y digital, 5 líneas.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Prevención + Ley 1336». \textbf{Formato:} (a) análisis de 3 casos; (b) protocolo personal; (c) ficha de la ley; (d) reflexión final. \textbf{Sabes que terminaste cuando} podrías explicarle el contenido a un hermano menor sin asustarlo pero sin esconderle nada.
  producto_titulo: 3 casos analizados + protocolo personal + ficha Ley 1336
  criterios:
  - 3 casos de prensa analizados con 4 etapas
  - Protocolo personal con 5 pasos específicos
  - Nombres reales de personas de apoyo
  - Ficha de la Ley 1336 con puntos clave
  - Canales de denuncia incluidos
  - Reflexión final que conecta lo ancestral y lo digital
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un sistema legal que protege específicamente a los menores reconoce su vulnerabilidad estructural, no su debilidad personal.
    aplicacion: |-
      La Ley 1336 no protege a menores porque sean débiles: los protege porque están en una etapa de desarrollo donde la asimetría con adultos puede ser explotada. La filosofía de la liberación reconoce esa estructura: el menor no es responsable de la situación de riesgo creada por un adulto. La phronesis del cuidado consiste en \textbf{conocer el marco legal como herramienta de protección}, no como amenaza.
    pregunta_espejo: |-
      ¿Entiendo que la Ley 1336 me protege, no me restringe? ¿Sabría usarla a mi favor si necesitara?
  estoico:
    autor: Séneca
    cita: |-
      Prudencia ante el extraño que ofrece sin razón es virtud antigua; aceptar regalos sin causa es ingenuidad costosa.
    aplicacion: |-
      La advertencia ancestral del \emph{``desconfía de quien ofrece regalos sin razón''} no es paranoia: es phronesis acumulada. En el entorno digital, los \emph{regalos} pueden ser créditos en juegos, atención emocional intensa, promesas. La sabiduría estoica recomienda mantener esa prudencia, especialmente cuando el extraño parece amable.
    pregunta_espejo: |-
      ¿Aplico la prudencia ancestral en mis interacciones digitales, o la suspendo porque el otro parece amable?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La protección al menor en la infosfera es responsabilidad ética colectiva, no solo del menor mismo.
    aplicacion: |-
      La protección al menor no recae solo en el menor: recae en la comunidad digital entera (familias, escuelas, plataformas, Estado). Cada usuario adulto que ignora señales contribuye al problema; cada institución que no implementa protocolos también. Tu compromiso de hoy como joven es entrenarte en ser, primero, responsable de ti, y mañana, parte activa de esa red de protección.
    pregunta_espejo: |-
      ¿Estoy entrenándome para ser parte de la red de protección digital, o solo paso por la sesión sin internalizar?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu análisis, protocolo y ficha. En la sesión 8 vas a aprender sobre \textbf{estética de la liberación} (Dussel) aplicada a producción multimedia con sentido comunitario. Las habilidades técnicas que tienes ahora se ponen al servicio de comunicar lo que importa al barrio, no solo lo que el algoritmo premia.

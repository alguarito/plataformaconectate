    Colombia aprendió a mirar cuerpos leyendo cartillas escolares y revistas, y por eso la burla suele ser una lección vieja repetida. Toda pieza enseña a mirar. Hoy produces la tuya con los cuatro principios de la estética de la liberación y sostienes por escrito a quién dignifica y qué dejaste fuera.
  subtema: Producción multimedia con criterio ético
  pre_lectura:

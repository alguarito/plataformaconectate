clave: 3-8
grado: 8
periodo: 3
sesion: 8
completo: true
duracion_min: 90
titulo: Estética de la liberación --- cultura popular y producción ética
titulo_portada: |-
  Estética de la liberación ---
  cultura popular
  y producción ética
producto_final: |-
  Una pieza multimedia sobre un elemento de la cultura popular de tu barrio, del Valle o del Pacífico: afiche, video de un minuto, audio corto o infografía. La acompañan el análisis de una pieza comercial sobre el mismo tema, marcada con los cinco errores que reproducen jerarquías, y cuatro párrafos honestos sobre la tuya: a quién amplifica, a quién dignifica, qué dejaste fuera y qué cambiarías si pudieras consultar a la persona retratada.
apertura:
  origen: Cartillas escolares, manuales de higiene y la revista Cromos · cómo Colombia aprendió a mirar cuerpos
  fuente: |-
    Pedraza Gómez, Z. (1999). \emph{En cuerpo y alma: visiones del progreso y de la felicidad}. Universidad de los Andes, Departamento de Antropología.
  saber_ancestral: |-
    Alguien nos enseñó a mirar los cuerpos así. La antropóloga Zandra Pedraza revisó lo que se leyó en Colombia entre 1830 y 1990: cartillas escolares, manuales de higiene, textos de educación popular y la revista Cromos. Encontró que el país fue aprendiendo, página por página, qué cuerpo se consideraba sano, decente y digno de respeto, y cuál no. Ese aprendizaje pasó por la escuela. La clase de higiene y la de urbanidad enseñaban a pararse, a comer, a vestirse y, sin decirlo, a avergonzarse. El cuerpo del campesino, del negro y del indígena aparecía muchas veces del lado del atraso. Por eso la burla no es un chiste espontáneo: es una lección vieja que alguien repite sin saber de dónde la sacó. La \textbf{cara de exclusión} señala a la escuela misma: fue el aparato que enseñó cuál cuerpo era decente. Esta guía no puede presentarse como ajena a esa historia. Hoy vas a producir una pieza, y toda pieza enseña a mirar.
  saber_contemporaneo: |-
    La \textbf{estética de la liberación} es la propuesta de Enrique Dussel para juzgar una pieza por tres preguntas. ¿A quién amplifica? ¿A quién dignifica? ¿A quién deja fuera? De ahí salen cuatro principios de trabajo. \textbf{Centrar la voz del sur}: el sujeto es alguien del barrio, del Valle o del Pacífico, no un personaje genérico. \textbf{Dignificar a quien aparece}: con nombre, oficio y contexto, no como tipo folclórico. \textbf{Mostrar las contradicciones}: la cultura popular tiene riqueza y también dificultad, y ocultar la segunda es publicidad. \textbf{Producir para la comunidad}: la pieza debe poder mostrarse a la persona retratada, y esa persona debe reconocerse sin vergüenza. Ninguna pieza es neutral. Toda pieza reparte dignidad de algún modo, y la única diferencia es si quien la hizo sabía lo que estaba repartiendo.
  pregunta_puente: |-
    Si Colombia aprendió a mirar cuerpos leyendo cartillas y revistas, tu pieza también va a enseñarle a mirar a alguien. La pregunta es sencilla y difícil: ¿qué le va a enseñar?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} elementos de la cultura popular de tu entorno que la publicidad casi nunca representa con respeto; (2) \textbf{analizar} una pieza comercial con los cuatro principios y los cinco errores que reproducen jerarquías; (3) \textbf{crear} tu propia pieza y sostener por escrito a quién amplifica, a quién dignifica y qué dejaste fuera.
puentes:
  a_ruta: |-
    En las sesiones 1 a 5 aprendiste a producir imagen, relato y audio. En la 6 y la 7 trabajaste la responsabilidad frente al daño. Hoy le agregas la pregunta política: toda pieza toma partido. La sesión 9 abre el proyecto integrador y la 10 lo sustenta.
  a_escuta: |-
    Antes de la teoría vas a hacer un inventario corto. Cinco elementos de la cultura popular de tu barrio o de tu región que creas que la publicidad no representa bien. De ahí sale el tema de tu pieza.
  a_sistematizacion: |-
    Ya tienes el tema. Ahora vas a tomar una pieza comercial sobre algo parecido y a pasarla por los cuatro principios y los cinco errores, para ver el mecanismo por dentro.
  a_praxis: |-
    Tienes el criterio. Toca producir la tuya y sostenerla por escrito, con la parte incómoda incluida: qué dejaste fuera y por qué.
  a_producto: |-
    Lo que entregas hoy: la pieza, el análisis de la pieza comercial y tus cuatro párrafos. La prueba de calidad: la persona retratada podría verla y reconocerse sin vergüenza.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Producir sin preguntarse a quién dignifica una pieza no la vuelve neutral: la vuelve repetición de lo que ya estaba.
  a_triangulo: |-
    Para terminar, tres ideas sobre representar a alguien, contadas con palabras de esta guía: Dussel sobre lo que siempre queda por fuera de una mirada, Marco Aurelio sobre hacer en vez de declarar, Floridi sobre el miedo a lo que no entendemos.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario de cultura popular} (15 min · individual). (1) Anota cinco elementos de la cultura popular de tu barrio, del Valle o del Pacífico. Pueden ser oficios, comidas, músicas, fiestas o personas concretas del sector. (2) Al lado de cada uno, escribe en pocas palabras cómo lo suele mostrar la publicidad. (3) Marca los que crees que salen mal parados y explica en una línea por qué. (4) Elige uno para tu pieza y escribe a quién concreto podrías consultar sobre él.
  checks:
  - Anoté cinco elementos con cómo los muestra la publicidad.
  - Marqué los que salen mal parados y dije por qué.
  - Elegí uno y nombré a alguien concreto a quien consultar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Inventario de cultura popular». \textbf{Formato:} lista de cinco con dos columnas (elemento / cómo lo muestra la publicidad), más el elegido y el nombre de la persona a consultar. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} tu elección tiene una razón escrita y una persona detrás.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · ANALIZA --- Una pieza comercial por dentro} (30 min · parejas). (1) Con tu pareja, elijan una publicidad o una pieza de medios masivos sobre cultura popular colombiana. (2) Pásenla por los cuatro principios y anoten cuáles cumple y cuáles no. (3) Marquen cuál de los cinco errores aparece y copien la parte concreta de la pieza donde se ve. (4) Escriban en dos líneas qué le enseña esa pieza a quien la mira sobre la gente que retrata.
  pilares:
  - |-
    \textbf{Los cuatro principios.} \textbf{Centrar la voz del sur}: quien aparece es de aquí y se le nota de dónde. \textbf{Dignificar}: aparece con nombre, oficio y contexto, no como tipo. \textbf{Mostrar las contradicciones}: la riqueza y la dificultad, las dos. \textbf{Producir para la comunidad}: la pieza se le puede mostrar a la persona retratada.
  - |-
    \textbf{Los cinco errores.} \textbf{Caricaturización}: el rasgo se exagera hasta el chiste. \textbf{Romantización}: solo lo bonito, sin las dificultades reales. \textbf{Exotismo}: la persona aparece como rareza para quien mira desde fuera. \textbf{Paternalismo}: aparece como víctima que espera salvación, no como alguien que decide. \textbf{Extractivismo cultural}: se toman música, símbolos o palabras sin nombrar de dónde vienen ni devolver nada.
  - |-
    \textbf{Cómo se reconoce el exotismo.} Pregúntate para quién está hecha la pieza. Si el placer de mirarla depende de que quien mira no sea del lugar, ahí está. La cultura popular no necesita volverse extraña para valer.
  - |-
    \textbf{La pregunta que cierra el análisis.} ¿La persona retratada se reconocería en esta pieza con orgullo? Si la respuesta es sí, la pieza dignifica. Si es no, o si dudas, la pieza está repitiendo la lección vieja de las cartillas.
  anatomia:
    titulo: Estética de la liberación, en una mirada
    body: |-
      \textbf{3 preguntas:} a quién amplifica / a quién dignifica / a quién deja fuera. \\[1mm] \textbf{4 principios:} voz del sur / dignidad / contradicciones / para la comunidad. \\[1mm] \textbf{5 errores:} caricatura / romantización / exotismo / paternalismo / extractivismo. \\[1mm] \textbf{Prueba:} ¿se reconocería con orgullo?
  errores_comunes: |-
    (1) \textbf{Creer que una pieza puede ser neutral}: toda pieza reparte dignidad, se sepa o no. (2) \textbf{Confundir dignificar con embellecer}: quitar las dificultades es romantizar, no respetar. (3) \textbf{Usar a una persona sin nombrarla}: sin nombre y sin oficio, queda convertida en tipo. (4) \textbf{Tomar música o símbolos sin acreditar}: eso es extractivismo, aunque la intención sea buena. (5) \textbf{No mostrarle la pieza a nadie del lugar}: es el único chequeo que de verdad sirve.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} \textbf{Título:} «Actividad 2 --- Una pieza comercial por dentro». \textbf{Formato:} los cuatro principios con cumple o no cumple, el error identificado con la parte concreta donde se ve, y dos líneas sobre qué enseña la pieza. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes señalar el error en un fragmento concreto, no en general.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu pieza y sus cuatro párrafos} (25 min · individual). (1) Produce tu pieza sobre el elemento que elegiste, con el formato que le convenga. (2) Asegúrate de que quien aparece tenga nombre, oficio y contexto. (3) Incluye una contradicción, algo que no sea solo lo bonito del tema. (4) Escribe los cuatro párrafos: a quién amplifica, a quién dignifica, qué dejaste fuera y qué cambiarías si pudieras consultarla. (5) Revisa tu pieza contra los cinco errores y anota cuál estuviste a punto de cometer.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} La pieza multimedia. El análisis de la pieza comercial de la Actividad 2. Los cuatro párrafos sobre la tuya.
  - |-
    \textbf{El formato sigue al tema.} Un oficio pide afiche o retrato. Una fiesta pide video corto. Una música pide audio. Una comida pide infografía. Elegir bien el formato ya es parte del respeto.
  - |-
    \textbf{El párrafo difícil es el tercero.} Qué dejaste fuera. Toda pieza recorta, y decir qué quedó por fuera es más honesto que fingir que cabía todo. Ahí se ve si entendiste la idea.
  - |-
    \textbf{La prueba final no es del profesor.} Es imaginar a la persona retratada viendo tu pieza. Si te incomoda esa imagen, la pieza todavía no está.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Pieza sobre el elemento elegido en el inventario. \\[1mm] \checkbox Quien aparece tiene nombre, oficio y contexto. \\[1mm] \checkbox La pieza muestra una contradicción, no solo lo bonito. \\[1mm] \checkbox Análisis de la pieza comercial con el error señalado en un fragmento. \\[1mm] \checkbox Los cuatro párrafos, incluido qué dejaste fuera. \\[1mm] \checkbox Revisión contra los cinco errores.
  plantilla_guion: |-
    \textbf{Tema.} \textit{Elemento del inventario y por qué.} \\[1mm] \textbf{Quien aparece.} \textit{Nombre, oficio, contexto.} \\[1mm] \textbf{Pieza.} \textit{Formato y herramienta.} \\[1mm] \textbf{Cuatro párrafos.} \textit{Amplifica, dignifica, dejé fuera, cambiaría.} \\[1mm] \textbf{Comparación.} \textit{La pieza comercial y su error.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Tu pieza y sus cuatro párrafos». \textbf{Formato:} la referencia a la pieza con su formato, los cuatro párrafos y la nota sobre el error que estuviste a punto de cometer. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} podrías mostrarle la pieza a la persona retratada sin incomodidad.
  producto_titulo: Pieza multimedia + análisis de una pieza comercial + cuatro párrafos honestos
  criterios:
  - La pieza trata un elemento del inventario, de tu barrio o de tu región
  - Quien aparece tiene nombre, oficio y contexto, no es un tipo genérico
  - La pieza muestra una contradicción y no solo lo bonito del tema
  - El análisis de la pieza comercial señala el error en un fragmento concreto
  - Los cuatro párrafos dicen qué quedó fuera y qué cambiarías tras consultar
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §5.3.1
    idea: |-
      Toda persona y todo pueblo está siempre más allá del sistema desde el que otro los mira.
    aplicacion: |-
      Tu pieza recorta, y quien aparece en ella es más de lo que cabe en el encuadre. Por eso el párrafo de «qué dejé fuera» no es un trámite: es reconocer que la persona no termina donde termina tu foto.
    pregunta_espejo: |-
      ¿Qué parte de esta persona no cupo en mi pieza, y por qué elegí dejarla fuera?
  estoico:
    autor: Marco Aurelio · Meditaciones X, 16 (c. 175 d.C.)
    idea: |-
      Deja de discutir cómo debería ser una persona buena y procura serlo de verdad.
    aplicacion: |-
      Una pieza no se vuelve respetuosa porque el análisis diga que lo es. Se vuelve respetuosa en decisiones concretas: el nombre que escribes, el plano que eliges, la frase que no pones. Lo demás es declaración.
    pregunta_espejo: |-
      ¿En qué decisión concreta de mi pieza se nota el respeto, sin que yo tenga que decirlo?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), Prefacio
    idea: |-
      Tememos y rechazamos aquello a lo que no logramos darle sentido.
    aplicacion: |-
      La caricatura y el exotismo son atajos para lo que no se entendió. Cuando alguien no conoce un oficio, lo dibuja gracioso o lo dibuja exótico. Conocer antes de producir es lo que evita las dos salidas.
    pregunta_espejo: |-
      ¿Qué de lo que retraté conozco de verdad, y qué estoy suponiendo desde afuera?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la pieza, el análisis y los cuatro párrafos. Si puedes, muéstrale la pieza a la persona que retrataste y anota qué te dijo. En la sesión 9 empieza el proyecto integrador. Ahí vas a usar todo lo del año sobre un problema real de tu entorno.

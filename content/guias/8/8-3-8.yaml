clave: 3-8
grado: 8
periodo: 3
sesion: 8
completo: true
titulo: Estética de la liberación --- cultura popular y producción ética
titulo_portada: |-
  Estética de la liberación ---
  cultura popular
  y producción ética
producto_final: |-
  1 pieza multimedia (afiche, video de 1 min, podcast corto, infografía) sobre un tema de la cultura popular vallecaucana o colombiana (salsa, comida típica, oficios del barrio, fiestas tradicionales, microempresarios del barrio) que aplique los principios de la \emph{estética de la liberación} de Enrique Dussel + análisis escrito de 1 página explicando: qué voz amplifica, a quién dignifica, qué dejaste fuera y por qué + comparación con 1 pieza comercial sobre el mismo tema, identificando diferencias
apertura:
  saber_ancestral: |-
    En el Distrito de Aguablanca de Cali, en el barrio Obrero de Cartago, en los puentes peatonales de Buenaventura, hay un fenómeno visual que cualquier transeúnte reconoce: \textbf{los murales pintados por jóvenes comunitarios}. Esos murales no aparecen en revistas de diseño ni en museos: aparecen en paredes que dan a la calle. Sus motivos no son los típicos de la publicidad: no hay modelos extranjeros, ni productos de marca. Lo que aparece son las \textbf{caras del barrio}: la abuela del vecino, el tendero, el músico del bus, la madre cabeza de hogar, el niño que vende dulces en el semáforo. Cada figura es \textbf{voz de un pueblo que el sistema publicitario no representa}. Los jóvenes que los pintan no son artistas de academia: son vecinos que aprenden mientras pintan. La sabiduría del muralismo barrial es ancestral y política: \textbf{representar a quien el sistema no representa es acto de dignidad}. Esa práctica es la \emph{estética de la liberación} de Enrique Dussel: producir belleza con sentido comunitario, que amplifique voces silenciadas, no que decore sobre voces aplastadas.
  saber_contemporaneo: |-
    La \textbf{estética de la liberación} es una corriente filosófica y artística desarrollada por Enrique Dussel (1934-2023) que propone una pregunta simple pero radical sobre toda obra visual o multimedia: \emph{¿a quién dignifica esta pieza?, ¿a quién amplifica?, ¿a quién deja fuera?}. Sus 4 principios pedagógicos aplicados a producción multimedia son: (1) \textbf{Centrar la voz del sur, no del centro hegemónico}: la salsa cali sobre el rock anglo; el sancocho sobre la pasta italiana; el oficio del tendero sobre el ejecutivo. (2) \textbf{Dignificar al sujeto retratado}: el campesino con dignidad, no como cliché folclórico; la trabajadora doméstica con su nombre y oficio, no como personaje pintoresco. (3) \textbf{Mostrar contradicciones, no esconderlas}: la cultura popular tiene riqueza Y conflicto; representar ambos. (4) \textbf{Producir para la comunidad, no solo para mercado}: la pieza debe poder mostrarse al sujeto retratado y este reconocerse con orgullo. La regla profesional: \textbf{toda pieza multimedia toma posición, aunque pretenda ser neutral}. Reconocer qué posición tomas es phronesis del oficio digital.
  pregunta_puente: |-
    ¿Qué sabían los jóvenes del Aguablanca al pintar las caras del barrio en las paredes, que el publicista comercial olvida cuando produce piezas sobre la \emph{``cultura popular''} sin haber consultado al pueblo retratado? ¿Y por qué la diferencia entre representar y caricaturizar es decisión ética, no solo técnica?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las diferencias entre estética hegemónica (publicidad comercial) y estética de la liberación (producción comunitaria) en piezas multimedia reales; (2) \textbf{analizar} 1 pieza ajena (publicidad o medio masivo) aplicando los 4 principios de Dussel; (3) \textbf{crear} tu pieza multimedia con sentido comunitario sobre cultura popular del Valle o de tu barrio; (4) \textbf{evaluar} tu propia pieza con honestidad sobre a quién dignifica y a quién deja fuera.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Has aprendido a producir imagen, narrativa, audio (S1-S5) y a actuar con responsabilidad ética (S6-S7). Hoy le agregas la \textbf{dimensión política de la producción}: toda pieza toma posición. La sesión 9 (proyecto integrador) y la 10 (sustentación) son la cima del año.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{inventario rápido}: 5 elementos de la cultura popular del Valle o de tu barrio que crees que la publicidad comercial NO suele representar bien (oficios, comidas, músicas, personajes, fiestas). Esa lista es la materia prima de la pieza.
  a_sistematizacion: |-
    Ya tienes inventario. Ahora vas a entender la \textbf{anatomía de la estética de la liberación}: los 4 principios de Dussel, los 5 errores típicos del productor que se cree neutral (caricaturización, romantización, exotismo, paternalismo, extractivismo cultural).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: produces tu pieza multimedia sobre cultura popular vallecaucana o de tu barrio aplicando los 4 principios, analizas qué amplifica y qué deja fuera, comparas con 1 pieza comercial sobre el mismo tema.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: pieza multimedia + análisis Dussel-style + comparación. El criterio principal: que la persona o comunidad retratada, viendo tu pieza, se reconozca con dignidad y no con vergüenza.
  a_evaluacion: |-
    Antes de cerrar, mira la estética desde las cinco dimensiones humanas. Producir con sentido comunitario es respeto por el pueblo retratado; producir sin pensar a quién dignifica reproduce las jerarquías que el sistema ya impone.
  a_triangulo: |-
    Y para terminar, tres voces sobre la dignidad estética. Dussel sobre los pueblos que se representan a sí mismos, Séneca sobre la simplicidad como virtud frente al exotismo, Floridi sobre la producción cultural responsable en la era digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario de cultura popular} (15 min · individual). Anota 5 elementos de la cultura popular del Valle del Cauca, del Pacífico colombiano o de tu barrio que creas que la publicidad comercial casi nunca representa con respeto. Pueden ser: oficios (vendedor de chontaduro, palenquera, mototaxista, lavandera), comidas (sancocho de gallina, lulada, marranitas), músicas (currulao, salsa choke, vallenato sabanero), personajes (la abuela cuentista, el sereno, el reparador), fiestas (la del señor de los Milagros, las fiestas patronales del barrio). Elige 1 de los 5 para tu pieza.
  checks:
  - Anoté 5 elementos de cultura popular.
  - Pensé por qué la publicidad no los representa bien.
  - Elegí 1 con propósito claro.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Inventario cultural». \textbf{Formato:} lista de 5 + 1 elegido con justificación de 2 líneas. \textbf{Sabes que terminaste cuando} tu elección tiene razón comunitaria.
sistematizacion:
  intro: |-
    Tu inventario es la materia. Ahora necesitas la \textbf{anatomía formal} de la estética de la liberación: los 4 principios de Dussel, los errores típicos del productor que reproduce jerarquías sin querer.
  pilares:
  - |-
    Los \textbf{4 principios de Dussel} aplicados a producción multimedia se descomponen así: (1) \textbf{Centrar la voz del sur}: el sujeto principal de tu pieza es alguien del Valle, del Pacífico, del barrio. No un personaje genérico. (2) \textbf{Dignificar al sujeto retratado}: aparece con nombre, oficio, contexto. No como tipo folclórico (\emph{``el negro alegre''}, \emph{``el indígena místico''}). (3) \textbf{Mostrar contradicciones, no esconderlas}: la cultura popular tiene riqueza y dificultades; mostrar ambas. (4) \textbf{Producir para la comunidad}: la pieza debe poder mostrarse al sujeto y este reconocerse con orgullo.
  - |-
    Los \textbf{5 errores típicos} de la producción que se cree neutral pero reproduce jerarquías: (a) \textbf{Caricaturización}: el sujeto aparece exagerado, ridiculizado. (b) \textbf{Romantización}: el sujeto aparece idealizado, sin las dificultades reales. (c) \textbf{Exotismo}: el sujeto aparece como rareza para consumo del espectador externo. (d) \textbf{Paternalismo}: el sujeto aparece como víctima necesitada de salvación, no como agente con dignidad propia. (e) \textbf{Extractivismo cultural}: usar elementos culturales (música, símbolos, lenguaje) sin acreditar la comunidad de origen ni devolverle nada.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿la persona o comunidad retratada se reconocería en mi pieza con orgullo?}. Si la respuesta es sí, la pieza dignifica. Si la respuesta es no o dudosa, la pieza reproduce jerarquías. La phronesis del oficio multimedia consiste en \textbf{producir lo que el sujeto retratado aprobaría si pudiera verlo}.
  - |-
    Algoritmo: (1) elegir tema del inventario. (2) preguntarse: ¿conozco a alguien real que viva o practique este tema? (idealmente sí, para consultar). (3) producir pieza centrando voz del sur. (4) revisar contra los 5 errores. (5) idealmente, mostrar borrador a alguien de la comunidad retratada antes de publicar. (6) escribir análisis con los 4 principios.
  anatomia:
    titulo: Anatomía de la estética de la liberación
    body: |-
      \textbf{Principio 1:} centrar voz del sur. \\[1mm] \textbf{Principio 2:} dignificar al sujeto. \\[1mm] \textbf{Principio 3:} mostrar contradicciones. \\[1mm] \textbf{Principio 4:} producir para la comunidad. \\[1mm] \textbf{Regla:} el sujeto debería reconocerse con orgullo.
  errores_comunes: |-
    (1) Caricaturización del sujeto. (2) Romantización sin contradicciones. (3) Exotismo para consumo externo. (4) Paternalismo que niega agencia. (5) Extractivismo cultural sin acreditar. (6) Producir sobre la comunidad sin haberla consultado. (7) Imitar el estilo publicitario sin cuestionar qué reproduce.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía estética liberación». \textbf{Formato:} (a) los 4 principios; (b) los 7 errores con marca del que más temes. \textbf{Sabes que terminaste cuando} podrías auditar cualquier pieza con los 4 principios.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Pieza multimedia + análisis + comparación} (40 min · individual). Hora de aplicar. Produces pieza sobre tu tema elegido, escribes análisis con los 4 principios, comparas con 1 pieza comercial sobre el mismo tema.
  pilares:
  - |-
    Tu pieza se construye en 5 pasos: (1) elegir formato según el tema (afiche para oficio, video de 1 min para fiesta, podcast para música, infografía para comida). (2) usar las habilidades de S1-S5 (jerarquía visual, narrativa, audio). (3) centrar voz del sur (nombrar al sujeto, contar su contexto). (4) mostrar 1 contradicción (no solo lo bonito). (5) revisar contra los 5 errores antes de cerrar.
  - |-
    El análisis Dussel-style tiene 4 párrafos: (a) ¿Qué voz amplifica mi pieza? (a quién hace audible). (b) ¿A quién dignifica? (qué dignidad otorga). (c) ¿Qué dejé fuera y por qué? (honestidad sobre los límites de la pieza). (d) ¿Qué cambiaría si pudiera consultar al sujeto retratado?
  - |-
    La comparación con pieza comercial muestra el contraste: tomas 1 publicidad o pieza de medios masivos sobre el mismo tema y describes en 2-3 líneas las diferencias. Ejemplo: \emph{``La publicidad de la marca X sobre salsa cali muestra solo a bailarines profesionales sin nombre; mi pieza muestra a Doña Rosa, que baila en el patio de su casa los sábados con sus nietos''}.
  - |-
    Algoritmo: (1) producir pieza. (2) revisar contra errores. (3) escribir análisis 4 párrafos. (4) buscar pieza comercial para comparar. (5) escribir comparación.
  checklist:
    titulo: Checklist antes de entregar
    items: |-
      \checkbox Pieza multimedia producida sobre tema del inventario. \\[1mm] \checkbox Sujeto retratado con nombre y contexto. \\[1mm] \checkbox 1 contradicción mostrada. \\[1mm] \checkbox Revisada contra los 5 errores. \\[1mm] \checkbox Análisis de 4 párrafos con los principios. \\[1mm] \checkbox Comparación con pieza comercial.
  plantilla_guion: |-
    \textbf{Tema.} \textit{Cultura popular elegida.} \\[1mm] \textbf{Sujeto.} \textit{Nombre y contexto.} \\[1mm] \textbf{Pieza.} \textit{Formato y herramienta.} \\[1mm] \textbf{Análisis.} \textit{Amplifica + dignifica + deja fuera + cambiaría.} \\[1mm] \textbf{Comparación.} \textit{Versus pieza comercial.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Estética de la liberación». \textbf{Formato:} (a) referencia a la pieza; (b) análisis de 4 párrafos; (c) comparación con pieza comercial. \textbf{Sabes que terminaste cuando} la persona retratada (si pudieras mostrársela) se reconocería con orgullo.
  producto_titulo: Pieza multimedia + análisis Dussel + comparación
  criterios:
  - Tema de cultura popular del Valle o barrio
  - Sujeto con nombre y contexto
  - 4 principios de Dussel aplicados
  - Análisis honesto de 4 párrafos
  - Comparación con pieza comercial
  - Posibilidad de mostrar al sujeto retratado
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda pieza estética toma posición; reconocer cuál es ya es acto de phronesis política.
    aplicacion: |-
      La pieza neutral no existe. Toda producción multimedia amplifica algunas voces y silencia otras, dignifica a unos y reduce a otros. La filosofía de la liberación pide ese reconocimiento honesto: \textbf{declara qué posición toma tu pieza}. Esa honestidad no la debilita; la fortalece. La phronesis del oficio cultural consiste en \textbf{ser consciente de la política de la producción estética}.
    pregunta_espejo: |-
      ¿Mi pieza reconoce qué posición política toma, o pretende neutralidad imposible?
  estoico:
    autor: Séneca
    cita: |-
      La simplicidad respeta al sujeto; el exotismo lo convierte en espectáculo.
    aplicacion: |-
      Es tentador exotizar la cultura popular para hacerla \emph{``interesante''}. La sabiduría estoica recomienda lo opuesto: \emph{representa con simplicidad y respeto}. La salsa cali no necesita florituras visuales para ser respetada; basta con representarla con dignidad. El exotismo convierte cultura en mercancía; la simplicidad la honra como es.
    pregunta_espejo: |-
      ¿Estoy exotizando para \emph{vender visualmente} mi pieza, o representando con la simplicidad que el sujeto merece?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La producción cultural en la era digital es responsabilidad ética, no solo expresión personal.
    aplicacion: |-
      En la era de la información, las piezas culturales circulan masivamente. La ética digital pide responsabilidad: no producir estereotipos, no extractivismo cultural sin acreditar, no caricaturización. Tu pieza de hoy te entrena en una práctica que rige toda producción multimedia: \textbf{ser consciente del impacto cultural de lo que publicas}.
    pregunta_espejo: |-
      ¿Mi pieza contribuye a una cultura digital más justa, o reproduce estereotipos que circulan?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu pieza, análisis y comparación. En la sesión 9 vas a construir el \textbf{proyecto integrador comunitario} usando todas las habilidades del año al servicio de un problema real del barrio o colegio. La estética de la liberación de hoy es el marco; el proyecto de mañana es su aplicación más ambiciosa.
web:
  conceptos_clave:
    - termino: Estética de la liberación
      definicion: |-
        Corriente filosófica y artística de Enrique Dussel que pregunta a toda obra a quién dignifica, amplifica o deja fuera.
      ejemplo: |-
        Una pieza sobre el barrio se evalúa preguntando quién aparece, quién falta, quién queda como objeto pintoresco.
      emoji: "🌎"
    - termino: Voz del sur
      definicion: |-
        Principio que centra a las comunidades históricamente excluidas del centro hegemónico. No para folclorizarlas, para dignificarlas.
      ejemplo: |-
        Una pieza musical que parte de la salsa caleña como matriz, no como adorno exótico para una banda sonora global.
      emoji: "🗣️"
    - termino: Dignificación del sujeto
      definicion: |-
        Representar a las personas con nombre, oficio y contexto, no como clichés folclóricos o personajes pintorescos.
      ejemplo: |-
        La trabajadora doméstica aparece como "Doña Marta, 25 años en el oficio, vive en Cartago", no como "la empleada típica".
      emoji: "👤"
    - termino: Producir para la comunidad
      definicion: |-
        Criterio de oficio: la pieza debe poder mostrarse al sujeto retratado y este debe poder reconocerse con orgullo.
      ejemplo: |-
        Si el video sobre tu tía no podrías mostrárselo sin pena, la representación falla aunque haya gustado al algoritmo.
      emoji: "🏘️"
    - termino: Toma de posición
      definicion: |-
        Toda pieza toma posición, aunque pretenda ser neutral. Reconocer cuál es esa posición es phronesis del oficio digital.
      ejemplo: |-
        Una "selección neutral" de canciones del Valle que omite la salsa caleña ya tomó posición. Lo neutral no existe.
      emoji: "🎯"
  quiz:
    titulo: ¿Diseñas con estética de la liberación?
    instrucciones: 5 preguntas para verificar que entiendes el marco de Dussel aplicado a multimedia.
    preguntas:
      - enunciado: ¿Qué pregunta central plantea la estética de la liberación a toda pieza?
        opciones:
          - ¿Es bonita?
          - ¿Cuánto duró producirla?
          - ¿A quién dignifica, amplifica y a quién deja fuera?
          - ¿Cuántas vistas hizo?
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. La pregunta central no es estética sino ética: a quién dignifica la pieza, a quién amplifica, a quién omite.
        feedback_incorrecto: |-
          La pregunta es ética: a quién dignifica, amplifica y a quién deja fuera. La estética sin esa pregunta es vacía.
      - enunciado: ¿Qué significa "centrar la voz del sur"?
        opciones:
          - Hablar sobre la región sur del país
          - Centrar a comunidades históricamente excluidas como matriz, no como adorno
          - Solo usar acentos del sur
          - Vivir en el sur
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. No es geografía: es centrar a las comunidades excluidas del centro hegemónico como sujetos, no como decorado.
        feedback_incorrecto: |-
          Significa centrar a comunidades históricamente excluidas como matriz creadora, no como adorno exótico para un centro distinto.
      - enunciado: Tu video presenta a "la empleada típica". ¿Qué problema tiene desde la estética de la liberación?
        opciones:
          - No dignifica al sujeto: la trata como tipo, no como persona con nombre y oficio
          - Ninguno
          - Va a ser corto
          - No tiene música
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. "La típica" cosifica. Dignificar pide nombre, oficio y contexto. Es la diferencia entre persona y cliché.
        feedback_incorrecto: |-
          Problema es que cosifica. Dignificar pide nombre, oficio y contexto, no etiqueta genérica que reduce a la persona.
      - enunciado: ¿Cuál es la prueba última de una pieza producida con sentido comunitario?
        opciones:
          - Que sea viral
          - Que tenga muchos efectos
          - Que dure más de 5 minutos
          - Que el sujeto retratado se reconozca con orgullo al verla
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. La pieza debe poder mostrarse al sujeto. Si no lo soportarías hacerlo, la representación falla.
        feedback_incorrecto: |-
          La prueba es que el sujeto retratado pueda reconocerse con orgullo. Sin eso, la pieza falla aun con muchos likes.
      - enunciado: "Una selección 'neutral' que omite ciertas comunidades..."
        opciones:
          - Es realmente neutral
          - Es la mejor opción
          - Ya tomó posición; lo neutral no existe
          - No comunica nada
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Toda pieza toma posición. Pretender neutralidad es esconder la posición tomada al omitir.
        feedback_incorrecto: |-
          Ya tomó posición. Lo neutral no existe en multimedia: cada inclusión y omisión es decisión cargada de valor.

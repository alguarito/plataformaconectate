clave: 3-9
grado: 8
periodo: 3
sesion: 9
completo: true
duracion_min: 90
titulo: Proyecto integrador comunitario --- voz para el cambio social
titulo_portada: |-
  Proyecto integrador
  comunitario ---
  voz para el cambio
producto_final: |-
  Un proyecto multimedia sobre un problema real de tu barrio, tu cuadra o tu colegio, con cuatro piezas: la pieza principal, en video corto, audio o infografía, con la estructura de cinco partes; la entrevista a la persona afectada, con su consentimiento documentado; una propuesta de tres acciones con responsables nombrados, no «el gobierno»; y la bitácora del proceso, que registra a quién contactaste, qué dejaste fuera y si le mostraste el resultado antes de publicarlo.
apertura:
  origen: Juntas de Acción Comunal · las reglas exactas de decidir juntos, desde 1958
  fuente: |-
    Congreso de la República de Colombia. (2021, 18 de diciembre). \emph{Ley 2166 de 2021. Por la cual se establece el régimen de los organismos de acción comunal\ldots} Diario Oficial.
  saber_ancestral: |-
    Desde 1958, Colombia tiene una institución donde los vecinos deciden juntos: la \textbf{Junta de Acción Comunal} (Ley 19 de 1958). Hoy la rige la Ley 2166 de 2021, y ahí están las reglas exactas del juego. En una vereda bastan veinte afiliados para constituirla. La asamblea se reúne por lo menos tres veces al año. No se puede ni siquiera deliberar con menos del veinte por ciento de los miembros. Para cambiar los estatutos se necesitan dos terceras partes. Y hay un dato que casi nadie de tu edad conoce: se puede ser afiliado desde los catorce años. Eso significa que en tu barrio, en Cartago o donde vivas, ya existe una mesa donde tu propuesta puede entrar. La \textbf{cara de exclusión} está documentada: la asamblea es también donde el clientelismo se vuelve concreto. Quien tiene la relación personal con el alcalde consigue la obra (Líppez-De Castro et al., 2020). Deliberar bien no garantiza incidir. Hoy vas a hacer una propuesta que nombre a quién le corresponde responder.
  saber_contemporaneo: |-
    Un proyecto comunitario tiene cuatro propiedades que no se negocian. \textbf{Problema real}: observado por ti, no copiado de internet. \textbf{Voz de quien lo sufre}: con nombre, oficio, contexto y consentimiento explícito. \textbf{Propuesta concreta}: tres acciones con responsables nombrables, como la JAC del barrio o la coordinación del colegio. \textbf{Pieza producida}: terminada y lista para circular, no planeada. La pieza ética central es el \textbf{consentimiento}. Antes de entrevistar a alguien le explicas cuatro cosas. Que es un trabajo escolar. Que su testimonio irá en una pieza que se mostrará en clase y quizá en redes. Que puede negarse o pedir cambios. Que puede pedir que se retire su nombre después. Y queda registrado: un mensaje, un audio, una firma. Sin ese registro, el proyecto puede hacer daño real a la persona que quiso ayudarte.
  pregunta_puente: |-
    La ley dice que se puede ser afiliado a la junta desde los catorce años, y casi nadie lo usa. Tu propuesta va a nombrar a alguien que responda. ¿A quién, y por qué a esa persona?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} problemas reales de tu entorno con una persona afectada a la que puedas contactar esta semana; (2) \textbf{analizar} las cuatro propiedades del proyecto comunitario y preparar el consentimiento; (3) \textbf{crear} la pieza, la propuesta de tres acciones con responsables y la bitácora del proceso.
puentes:
  a_ruta: |-
    Todo el año apunta aquí. Datos en el primer periodo, lógica y sensores en el segundo, multimedia y ética en el tercero. Hoy se juntan sobre un problema que tú viste pasar. En la sesión 10 lo sustentas en público y cierras el grado.
  a_escuta: |-
    Antes de la teoría vas a hacer un inventario de tu entorno. Cinco problemas que hayas visto, no leído. Con una persona afectada en cada uno, y la pregunta clave: ¿puedo hablar con ella esta semana?
  a_sistematizacion: |-
    Ya tienes candidatos. Ahora vas a ordenar las cuatro propiedades que hacen que esto sea un proyecto y no un ejercicio, y a preparar cómo vas a pedir el consentimiento.
  a_praxis: |-
    Tienes el plan. Toca ejecutar: contactar, entrevistar, producir, proponer y dejar constancia de todo en la bitácora.
  a_producto: |-
    Lo que entregas hoy: la pieza, la entrevista con consentimiento, la propuesta y la bitácora. La prueba de calidad: la persona entrevistada podría ver la pieza y reconocer lo que dijo.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Una denuncia sin propuesta deja el problema donde estaba y de paso expone a quien te habló.
  a_triangulo: |-
    Para terminar, tres ideas sobre escuchar a alguien y hacer algo con eso, contadas con palabras de esta guía: Dussel sobre el otro que reclama, Marco Aurelio sobre entrar en lo que dice quien te habla, Floridi sobre saber preguntar.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario del entorno} (15 min · individual). (1) Anota cinco problemas de tu barrio, tu cuadra o tu colegio que hayas visto pasar, no leído en noticias. (2) Para cada uno, escribe a quién afecta y si conoces a esa persona. (3) Marca en cuáles podrías hablar con la persona afectada esta semana. (4) Elige uno como finalista y escribe su nombre completo. Ejemplos válidos: un paso peatonal sin semáforo, un aula con goteras, la basura de una esquina concreta. También un negocio del barrio que pierde clientes por no tener catálogo digital.
  checks:
  - Anoté cinco problemas que vi pasar, no leídos.
  - Escribí a quién afecta cada uno y si lo conozco.
  - Elegí uno con una persona a la que puedo contactar esta semana.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Inventario del entorno». \textbf{Formato:} tabla de 5 filas y 3 columnas (problema visto / a quién afecta / puedo contactarla esta semana), más el finalista con nombre. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} tu finalista tiene una persona real detrás y una forma de contactarla.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · ANALIZA --- Las 4 propiedades y el consentimiento} (30 min · parejas). (1) Con tu pareja, revisen los dos finalistas contra las cuatro propiedades y anoten cuál cumple mejor. (2) Escriban las tres acciones de la propuesta, cada una con el nombre del responsable. (3) Redacten el texto exacto con el que van a pedir el consentimiento, con las cuatro cosas que hay que explicar. (4) Escriban las cinco preguntas de la entrevista y marquen cuál es la que de verdad quieren que les contesten.
  pilares:
  - |-
    \textbf{Las cuatro propiedades.} \textbf{Problema real}: lo viste tú. \textbf{Voz de quien lo sufre}: con nombre, oficio y contexto. \textbf{Propuesta concreta}: tres acciones, cada una con quién debería hacerla. \textbf{Pieza producida}: terminada, no planeada.
  - |-
    \textbf{El responsable tiene nombre.} «El gobierno debería» no es una propuesta: es una queja. «La JAC del barrio», «la coordinación del colegio», «los vecinos de la cuadra impar» sí lo son. Si no sabes a quién le corresponde, esa averiguación es parte del trabajo.
  - |-
    \textbf{El consentimiento, en cuatro frases.} Es un trabajo del colegio. Lo que usted diga irá en una pieza que se mostrará en clase y quizá en redes. Puede negarse o pedir cambios. Puede pedir después que se quite su nombre. Y queda registrado en un mensaje, un audio o una firma.
  - |-
    \textbf{La bitácora es la firma del oficio.} Anota cuándo y cómo contactaste, cuándo fue la entrevista, qué decisiones de edición tomaste, qué dejaste fuera y si le mostraste el resultado antes de publicarlo. Sin ese registro no se puede saber si el trabajo se hizo bien.
  anatomia:
    titulo: El proyecto comunitario, en una mirada
    body: |-
      \textbf{4 propiedades:} problema real / voz con nombre / propuesta con responsables / pieza producida. \\[1mm] \textbf{Consentimiento:} qué es, dónde saldrá, puede negarse, puede retirarse. \\[1mm] \textbf{Propuesta:} 3 acciones, 3 responsables. \\[1mm] \textbf{Bitácora:} contacto, entrevista, edición, qué quedó fuera.
  errores_comunes: |-
    (1) \textbf{Elegir un problema enorme y lejano}: el cambio climático no cabe; la basura de tu esquina sí. (2) \textbf{Denunciar sin proponer}: señalar el problema y no decir qué hacer con él. (3) \textbf{Poner de responsable a «el gobierno»}: sin nombre, nadie responde. (4) \textbf{Entrevistar sin consentimiento}: usar el testimonio de alguien que no supo dónde iba a salir. (5) \textbf{Producir solo para la nota}: si la pieza no puede circular, el proyecto se quedó en ejercicio.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} \textbf{Título:} «Actividad 2 --- Las 4 propiedades y el consentimiento». \textbf{Formato:} las cuatro propiedades aplicadas al finalista, las tres acciones con su responsable, el texto exacto del consentimiento y las cinco preguntas. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} cada acción tiene un responsable con nombre.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- El proyecto ejecutado} (25 min · parejas). (1) Contacta a la persona y pide el consentimiento con el texto que escribieron. (2) Haz la entrevista en audio o video, con las cinco preguntas. (3) Produce la pieza con la estructura de cinco partes. (4) Redacta la propuesta de tres acciones con sus responsables. (5) Llena la bitácora y, si puedes, muéstrale la pieza a la persona antes de publicarla. La sesión alcanza para arrancar; la producción se termina durante la semana.
  pilares:
  - |-
    \textbf{Tu entrega tiene cuatro piezas.} La pieza multimedia. La entrevista con el consentimiento registrado. La propuesta de tres acciones con responsables. La bitácora del proceso.
  - |-
    \textbf{La estructura de la pieza, en cinco partes.} Qué problema es y a quién afecta, en veinte segundos. La voz de la persona, con una frase textual, en un minuto. El dato o el contexto que lo dimensiona, en media. Las tres acciones con sus responsables, en otra media. Y el cierre, con lo que le pides a quien mira.
  - |-
    \textbf{Las cinco preguntas de la entrevista.} Qué le pasa. Desde cuándo. Qué ha intentado. Qué le ayudaría. Qué cambiaría si tuviera apoyo. La cuarta es la que casi nadie hace, y es la que da la propuesta.
  - |-
    \textbf{Devolverle la pieza a quien te habló.} Es lo que separa este trabajo de una tarea. Si la persona ve el resultado antes de que circule, puede corregir lo que quedó mal dicho, que es exactamente el derecho que le prometiste.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Problema visto por ti, con una persona afectada contactada. \\[1mm] \checkbox Consentimiento registrado en mensaje, audio o firma. \\[1mm] \checkbox Entrevista hecha con las cinco preguntas. \\[1mm] \checkbox Pieza con la estructura de cinco partes. \\[1mm] \checkbox Tres acciones, cada una con su responsable nombrado. \\[1mm] \checkbox Bitácora con lo que quedó fuera. \\[1mm] \checkbox Copia entregada a la persona entrevistada.
  plantilla_guion: |-
    \textbf{Problema.} \textit{Visto por mí, en tal lugar.} \\[1mm] \textbf{Persona.} \textit{Nombre, oficio, consentimiento registrado.} \\[1mm] \textbf{Pieza.} \textit{Formato y cinco partes.} \\[1mm] \textbf{Propuesta.} \textit{Tres acciones, tres responsables.} \\[1mm] \textbf{Bitácora.} \textit{Contacto, edición, qué quedó fuera.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- El proyecto ejecutado». \textbf{Formato:} la referencia a la pieza, el registro del consentimiento, la propuesta con responsables y la bitácora. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} le entregaste una copia a la persona que entrevistaste.
  producto_titulo: Pieza multimedia + entrevista con consentimiento + propuesta con responsables + bitácora
  criterios:
  - El problema lo viste tú y tiene una persona afectada con nombre
  - El consentimiento quedó registrado en mensaje, audio o firma
  - La pieza tiene las cinco partes y está terminada, no planeada
  - Cada una de las tres acciones nombra a quién le corresponde hacerla
  - La bitácora dice qué quedó fuera y si le mostraste la pieza a la persona
triangulo:
  modo: ideas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.4.2
    idea: |-
      El otro se revela de verdad cuando aparece desde fuera del sistema y reclama algo que le corresponde.
    aplicacion: |-
      La persona que entrevistas no es el tema de tu pieza: es quien reclama. Por eso la propuesta va después de su voz y no antes, y por eso nombra a alguien que debería responderle.
    pregunta_espejo: |-
      ¿Mi pieza deja que esa persona reclame, o solo la usa para ilustrar lo que yo quería decir?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 53 (c. 175 d.C.)
    idea: |-
      Acostúmbrate a atender lo que dice el otro y, hasta donde puedas, métete en lo que está pensando.
    aplicacion: |-
      En una entrevista se nota enseguida quién escucha y quién espera su turno para la siguiente pregunta. La cuarta pregunta, qué le ayudaría, solo funciona si de verdad escuchaste las tres anteriores.
    pregunta_espejo: |-
      ¿Pregunté lo que llevaba escrito, o pregunté lo que apareció mientras me hablaba?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    idea: |-
      Gana quien sabe preguntar y responder, y por eso sabe qué datos vale la pena recoger y cuidar.
    aplicacion: |-
      Tu proyecto no necesita muchos datos: necesita los que sostienen la propuesta. Una fecha, una frecuencia, un número de personas afectadas. Lo demás sobra y distrae de lo que pediste.
    pregunta_espejo: |-
      ¿Qué dato de mi pieza sostiene de verdad la propuesta, y cuál está solo de adorno?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la pieza, el consentimiento, la propuesta y la bitácora. Si puedes, hazle llegar una copia a la persona que entrevistaste. En la sesión 10 sustentas este proyecto en público y armas el portafolio del año.
web:
  resumen: |-
    Desde 1958 los vecinos deciden juntos en las Juntas de Acción Comunal, y se puede ser afiliado desde los catorce años. Hoy usas todo lo del año sobre un problema real que viste pasar: entrevistas a quien lo sufre con su consentimiento, produces una pieza y propones tres acciones con responsables que tienen nombre.
  subtema: Proyecto integrador · ciudadanía digital
  pre_lectura:
    por_que_importa: |-
      Una denuncia sin propuesta deja el problema donde estaba. Una propuesta sin responsable nombrado tampoco mueve nada, porque nadie se da por aludido.
    pregunta_detonante: |-
      ¿Cuál es el problema más cercano a tu casa que podrías describir con nombres y fechas concretas?
    activacion:
      titulo: A quién le corresponde
      descripcion: |-
        En 2 minutos, piensa en un problema de tu cuadra y escribe quién debería resolverlo. Si escribiste «el gobierno», vuelve a intentarlo con un nombre más concreto.
      duracion_min: 5
    conexion:
      anterior: En la sesión 8 trabajaste la estética de la liberación y a quién dignifica una pieza.
      siguiente: En la sesión 10 sustentas el proyecto en público y armas el portafolio del año.

clave: 3-9
grado: 8
periodo: 3
sesion: 9
completo: true
titulo: Proyecto integrador comunitario --- voz para el cambio social
titulo_portada: |-
  Proyecto integrador
  comunitario ---
  voz para el cambio
producto_final: |-
  Proyecto multimedia integrador sobre un problema real del barrio, colegio o entorno cercano del estudiante con (a) pieza principal (video corto 2-3 min, podcast 3 min, infografía animada, fotorreportaje), (b) entrevista a al menos 1 persona afectada por el problema con su consentimiento explícito documentado, (c) propuesta de mejora razonada con 3 acciones concretas y los responsables sugeridos, (d) bitácora de producción de 1 página documentando el proceso completo
apertura:
  saber_ancestral: |-
    En los movimientos comunitarios del Pacífico colombiano, en los procesos de lucha por la tierra del Cauca, en las juntas de acción comunal de los barrios populares del Valle, hay una figura silenciosa que sostiene la memoria de las luchas: \textbf{el comunero que documenta}. Cuando una vereda enfrenta amenaza por extracción minera, cuando un barrio pelea por el alcantarillado, cuando una organización de vendedores ambulantes resiste el desalojo, hay siempre alguien que toma la cámara prestada del primo, el grabador del compañero, la libreta cuadriculada, y \textbf{documenta lo que pasa}. Ese documentar no es periodismo: es \textbf{registro comunitario para la memoria, la denuncia y la acción}. Las fotos del comunero entran en los expedientes que llegan a defensoría del pueblo. Las grabaciones se difunden en WhatsApp por los barrios vecinos. Los textos quedan archivados para que dentro de 10 años los hijos sepan qué pasó. La sabiduría es ancestral y precisa: \textbf{quien no documenta su lucha la pierde dos veces, primero al perderla y después al olvidarla}. Esa práctica del comunero es el modelo de tu proyecto integrador: \textbf{multimedia con propósito de transformación, no de adorno}.
  saber_contemporaneo: |-
    El \textbf{proyecto integrador comunitario} es la cima del año del grado 8: aplica todas las habilidades aprendidas (datos, lógica, multimedia, ética, estética) a un \textbf{problema real} de tu entorno cercano. Sus 4 propiedades irrenunciables: (1) \textbf{Problema real, no inventado}: algo que verdaderamente ocurre en el barrio, colegio, cuadra. (2) \textbf{Voz del afectado}: al menos 1 persona afectada aparece con su nombre y oficio, con consentimiento documentado. (3) \textbf{Propuesta concreta}: no solo denuncia; también propuesta de acción con responsables sugeridos. (4) \textbf{Pieza multimedia funcional}: video, podcast, infografía o fotorreportaje que pueda circular. La regla profesional del oficio comunitario: \textbf{documentar no es objetivo; es punto de partida}. La documentación sirve si sostiene acción posterior (carta a una autoridad, reunión barrial, presentación pública del problema). Sin acción, el proyecto se queda en ejercicio escolar. Con acción, se convierte en pequeña práctica de ciudadanía digital activa.
  pregunta_puente: |-
    ¿Qué sabía el comunero al documentar su lucha aunque \emph{``nadie le hubiera pedido''}, que el estudiante novato olvida cuando hace un proyecto integrador solo para la nota? ¿Y por qué un proyecto multimedia con propósito de transformación vale más que uno con producción técnica perfecta pero sin causa?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} un problema real del barrio o colegio que valga la pena documentar y que esté a tu alcance; (2) \textbf{analizar} el problema desde 3 perspectivas (la del afectado, la de la institución, la tuya como ciudadano); (3) \textbf{crear} la pieza multimedia con entrevista a afectado y propuesta de acción; (4) \textbf{evaluar} tu proyecto con honestidad sobre lo que logró y lo que dejó pendiente para una acción futura.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Has aprendido 27 sesiones de habilidades técnicas y éticas durante el año. Hoy las integras en un proyecto con propósito comunitario. La sesión 10 será sustentación pública. Esta sesión y la siguiente son la cima del año escolar.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{inventario barrial}: 5 problemas reales de tu barrio o colegio que conoces (no de internet, no inventados). Para cada uno, anota: ¿quién está afectado?, ¿lo conozco personalmente?, ¿puedo entrevistarlo esta semana?
  a_sistematizacion: |-
    Ya tienes 5 candidatos. Ahora vas a entender la \textbf{anatomía del proyecto comunitario}: las 4 propiedades, los 5 errores típicos del proyecto integrador novato (problema lejano sin contacto real, denuncia sin propuesta, propuesta sin responsable, entrevista sin consentimiento, multimedia sin propósito).
  a_praxis: |-
    Tienes el método. Toca aplicarlo: eliges 1 problema real, contactas y entrevistas a 1 afectado con consentimiento, produces la pieza multimedia, redactas propuesta con 3 acciones, llenas bitácora.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: pieza multimedia + entrevista + propuesta + bitácora. El criterio principal: que la persona entrevistada, viendo el proyecto, sienta que su voz fue respetada y amplificada.
  a_evaluacion: |-
    Antes de cerrar, mira el proyecto desde las cinco dimensiones humanas. Documentar con propósito es honor del oficio comunitario; hacerlo solo por nota es desperdicio de las habilidades del año entero.
  a_triangulo: |-
    Y para terminar, tres voces sobre la documentación con propósito. Dussel sobre la voz del afectado como centro, Marco Aurelio sobre la acción que sigue al diagnóstico, Floridi sobre el periodismo ciudadano como ética digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario barrial} (15 min · individual). Anota 5 problemas reales de tu barrio, cuadra o colegio. Reglas: (1) problemas que has \textbf{visto pasar} (no de noticias). (2) para cada uno, identifica: a quién afecta, si conoces a esa persona, si puedes entrevistarla esta semana. (3) marca 1 finalista. Ejemplos válidos: paso peatonal sin semáforo, aula con goteras, microempresario del barrio que pierde clientes por no tener WhatsApp Business, vendedora de empanadas que enfrenta problemas con un vecino, basura acumulada en una esquina específica.
  checks:
  - Anoté 5 problemas reales observados.
  - Identifiqué afectados nombrables en cada uno.
  - Verifiqué que puedo entrevistar al afectado.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Inventario barrial». \textbf{Formato:} 5 problemas + afectados + viabilidad de contacto. \textbf{Sabes que terminaste cuando} eliges 1 con afectado contactable.
sistematizacion:
  intro: |-
    Tu inventario te dio candidatos. Ahora necesitas la \textbf{anatomía del proyecto comunitario}: las 4 propiedades, los 5 errores típicos.
  pilares:
  - |-
    Las \textbf{4 propiedades irrenunciables} se descomponen así: (1) \textbf{Problema real}: observado, no inventado ni copiado de internet. (2) \textbf{Voz del afectado}: aparece con nombre, oficio, contexto y consentimiento explícito para usar su testimonio. (3) \textbf{Propuesta concreta}: 3 acciones específicas con responsables sugeridos (no \emph{``el gobierno''}, sino \emph{``la JAC del barrio''}, \emph{``la coordinadora del colegio''}, \emph{``los vecinos de la cuadra''}). (4) \textbf{Pieza multimedia funcional}: producida, no solo planeada; lista para circular.
  - |-
    El \textbf{consentimiento explícito} es la pieza ética crucial: antes de entrevistar a cualquier persona, le explicas (a) que es un proyecto escolar, (b) que su testimonio se usará en una pieza multimedia que se mostrará en clase y posiblemente en redes, (c) que puede negarse o pedir cambios, (d) que puede pedir retirar su nombre si después se arrepiente. El consentimiento debe quedar documentado: mensaje de WhatsApp, audio, firma en hoja. Sin consentimiento documentado, el proyecto puede causar daño legal y ético.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿esta pieza sirve para que algo cambie?}. Si la respuesta es no, es ejercicio escolar. Si la respuesta es sí, es práctica de ciudadanía digital activa. La phronesis del oficio comunitario consiste en \textbf{documentar con propósito, no por trámite}. Aun proyectos pequeños pueden contribuir a cambios: una carta a la coordinación, una conversación con la JAC, una publicación que circule en el barrio.
  - |-
    Algoritmo: (1) elegir problema con afectado contactable. (2) contactar y pedir consentimiento. (3) entrevistar (audio o video). (4) producir pieza multimedia. (5) redactar propuesta con 3 acciones + responsables. (6) llenar bitácora del proceso. (7) entregar al afectado una copia del producto final.
  anatomia:
    titulo: Anatomía del proyecto comunitario
    body: |-
      \textbf{Problema:} real, observado. \\[1mm] \textbf{Voz:} afectado con nombre y consentimiento. \\[1mm] \textbf{Propuesta:} 3 acciones con responsables. \\[1mm] \textbf{Pieza:} multimedia funcional. \\[1mm] \textbf{Bitácora:} proceso documentado.
  errores_comunes: |-
    (1) \textbf{Problema lejano sin contacto real}: \emph{``el cambio climático''} en lugar de \emph{``la basura de la esquina de mi cuadra''}. (2) \textbf{Denuncia sin propuesta}: identificar el problema sin proponer acción. (3) \textbf{Propuesta sin responsable nombrado}: \emph{``el gobierno debería...''}. (4) \textbf{Entrevista sin consentimiento}: usar testimonio sin avisar. (5) \textbf{Multimedia sin propósito}: pieza producida solo para nota, no para circular y contribuir al cambio.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía proyecto comunitario». \textbf{Formato:} (a) las 4 propiedades aplicadas a tu problema; (b) los 5 errores con marca del que más temes; (c) plan de consentimiento explícito. \textbf{Sabes que terminaste cuando} tienes plan completo de ejecución.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EVALÚA --- Proyecto integrador ejecutado} (40 min en sesión + producción durante la semana · individual o parejas). Hora de ejecutar. Contactas, entrevistas, produces, propones, documentas.
  pilares:
  - |-
    Tu proyecto se ejecuta en 6 pasos: (1) elegir problema y afectado. (2) contactar al afectado y pedir consentimiento explícito documentado. (3) hacer entrevista (audio o video) con 5-7 preguntas: ¿qué problema sufre?, ¿hace cuánto?, ¿qué ha intentado?, ¿qué le ayudaría?, ¿qué cambiaría si tuviera apoyo?. (4) producir pieza multimedia integrando S1-S5 (jerarquía visual, narrativa, audio, edición ética). (5) redactar propuesta con 3 acciones + responsables sugeridos. (6) llenar bitácora del proceso.
  - |-
    La pieza multimedia tiene flexibilidad de formato pero estructura mínima común: (a) \textbf{Introducción}: ¿qué problema?, ¿a quién afecta? (15-20 seg). (b) \textbf{Voz del afectado}: fragmento de la entrevista con cita textual clave (40-60 seg). (c) \textbf{Datos o contexto}: cifras, frecuencia, impacto (20-30 seg). (d) \textbf{Propuesta}: las 3 acciones con responsables (30-40 seg). (e) \textbf{Cierre}: llamada a la audiencia (10-15 seg).
  - |-
    La bitácora del proceso documenta: (a) fecha y método de contacto al afectado. (b) registro del consentimiento. (c) fecha de la entrevista y duración. (d) decisiones de edición y producción. (e) qué se incluyó y qué se dejó fuera. (f) si se le mostró el producto al afectado antes de publicar. Es la firma profesional del proyecto.
  - |-
    Algoritmo: (1) contactar afectado. (2) consentimiento documentado. (3) entrevistar. (4) producir pieza. (5) redactar propuesta. (6) bitácora. (7) opcional pero recomendado: mostrar al afectado y entregar copia del producto.
  checklist:
    titulo: Checklist antes de cerrar el proyecto
    items: |-
      \checkbox Problema real elegido con afectado contactado. \\[1mm] \checkbox Consentimiento documentado del afectado. \\[1mm] \checkbox Entrevista realizada con 5-7 preguntas. \\[1mm] \checkbox Pieza multimedia producida con estructura de 5 partes. \\[1mm] \checkbox Propuesta con 3 acciones y responsables sugeridos. \\[1mm] \checkbox Bitácora del proceso completa. \\[1mm] \checkbox Copia del producto entregada al afectado (recomendado).
  plantilla_guion: |-
    \textbf{Problema.} \textit{Real, observado.} \\[1mm] \textbf{Afectado.} \textit{Nombre + oficio + consentimiento.} \\[1mm] \textbf{Entrevista.} \textit{Fecha + duración.} \\[1mm] \textbf{Pieza.} \textit{Formato + estructura 5 partes.} \\[1mm] \textbf{Propuesta.} \textit{3 acciones + responsables.} \\[1mm] \textbf{Bitácora.} \textit{Proceso completo.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EVALÚA).} Título: «Actividad 3 --- Proyecto integrador». \textbf{Formato:} (a) referencia a la pieza; (b) bitácora del proceso; (c) propuesta escrita; (d) copia del consentimiento. \textbf{Sabes que terminaste cuando} le has entregado al afectado una copia del producto.
  producto_titulo: Pieza multimedia + entrevista con consentimiento + propuesta + bitácora
  criterios:
  - Problema real observado
  - Afectado con nombre y consentimiento documentado
  - Pieza multimedia con estructura de 5 partes
  - 3 acciones concretas con responsables nombrados
  - Bitácora del proceso completa
  - Copia del producto entregada al afectado (idealmente)
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La voz del afectado es el primer epistemólogo del problema; documentarla con respeto es honor del oficio comunitario.
    aplicacion: |-
      Tu proyecto pone la voz del afectado en el centro: no hablas \emph{sobre} él, hablas \emph{con} él. La filosofía de la liberación reconoce que el afectado sabe del problema más que cualquier observador externo. La phronesis del oficio comunitario consiste en \textbf{amplificar su voz, no reemplazarla con la propia}. Tu pieza es éxito si el afectado se reconoce con dignidad en ella.
    pregunta_espejo: |-
      ¿Mi pieza pone la voz del afectado en el centro, o la reemplaza con mi interpretación?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La denuncia sin propuesta es queja; el diagnóstico sin acción es voyeurismo del sufrimiento.
    aplicacion: |-
      Es tentador hacer una pieza que solo muestre el problema. La sabiduría estoica recomienda lo opuesto: \emph{si documentas, propone acción}. Sin propuesta concreta, el proyecto es voyeurismo: muestra sufrimiento sin contribuir a su solución. La phronesis del oficio comunitario exige que el diagnóstico vaya acompañado de propuesta razonada.
    pregunta_espejo: |-
      ¿Mi proyecto propone acción concreta, o se queda en denuncia sin salida?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El periodismo ciudadano responsable es la nueva ética del oficio digital en la era de la información distribuida.
    aplicacion: |-
      En la era de la información, los ciudadanos producen contenido tanto como las grandes instituciones. La ética digital exige que esa producción sea responsable: con consentimiento, con propósito, con propuesta. Tu proyecto integrador te entrena en ese periodismo ciudadano profesional. Aunque el alcance sea pequeño (barrio, colegio), las prácticas son las mismas que rigen el periodismo profesional.
    pregunta_espejo: |-
      ¿Mi proyecto sigue los estándares del periodismo ciudadano responsable, o es ejercicio escolar disfrazado?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con tu proyecto integrador completo. En la sesión 10 vas a hacer la \textbf{sustentación pública} de 10 minutos del proyecto + portafolio digital con piezas seleccionadas de los 3 periodos + carta abierta de cierre del grado 8. Es la graduación del año entero.

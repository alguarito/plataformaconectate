titulo: ¿Qué es técnica? --- del cuerpo al instrumento
producto_final: |-
  Definición personal de técnica (1 párrafo) + 5 ejemplos concretos contextualizados al estudiante
saber_ancestral_idea: |-
  La técnica no nació en una fábrica: nació en la mano. Los primeros artefactos --- azuela de piedra, hueso tallado, telar de cintura --- son extensiones del cuerpo humano hacia el mundo. Antes de máquina hubo gesto; antes de gesto hubo necesidad.

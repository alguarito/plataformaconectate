clave: 1-1
grado: 9
periodo: 1
sesion: 1
completo: true
titulo: ¿Qué es técnica? --- del cuerpo al instrumento
titulo_portada: |-
  ¿Qué es técnica? ---
  del cuerpo
  al instrumento
producto_final: Definición personal de técnica (1 párrafo) + 5 ejemplos contextualizados al estudiante
apertura:
  saber_ancestral: |-
    La técnica no nació en una fábrica europea. Nació en la mano, hace milenios. En el \textbf{norte del Valle del Cauca, el Quindío y Risaralda}, los \textbf{orfebres Quimbaya} (siglos VI a X) transformaron sus dedos en moldes para fundir oro a la cera perdida: el cuerpo se volvió herramienta, y la herramienta se volvió arte. Las \textbf{tejedoras Misak del Cauca} convierten sus manos en lanzaderas que codifican calendarios en sus \emph{chumbes}. Los \textbf{cesteros Embera Chamí} de Risaralda doblan la fibra con la presión exacta que la mano calcula sin medir. Los primeros artefactos --- la azuela de piedra, el hueso tallado, el telar de cintura, el atado de cuerdas --- son extensiones del cuerpo humano hacia el mundo. El que talla la madera primero usa los dientes y las uñas; cuando esos no alcanzan, fabrica un filo. La técnica es lo que el cuerpo hace cuando descubre sus límites.
  origen: Primeros artefactos humanos — azuela, hueso tallado, telar de cintura
  saber_contemporaneo: |-
    Hoy seguimos haciendo lo mismo, solo que con materiales distintos. Tu \textbf{celular} es una extensión de tu memoria, tu voz y tus ojos. Tu \textbf{bicicleta} es una extensión de tus piernas. Tu \textbf{calculadora} es una extensión de tu mente que cuenta. Cuando una tecnología desaparece silenciosa en tu vida, es porque ya se volvió cuerpo. Cuando notas que la usas, todavía es ``herramienta nueva''.
  pregunta_puente: |-
    ¿Qué cosas haces hoy con un objeto que tus abuelos hacían con el cuerpo? ¿Y qué cosas todavía haces con el cuerpo aunque ya exista un objeto que las haga?
  saber_hacer: |-
    Al terminar esta guía podrás: (1) \textbf{identificar} en tu cotidianidad 5 técnicas distintas (instrumento + propósito); (2) \textbf{explicar} la diferencia entre cuerpo-herramienta-máquina con tus propias palabras; (3) \textbf{analizar} cómo un mismo gesto humano (cortar, contar, recordar) se ha técnico a lo largo de la historia; (4) \textbf{crear} tu propia definición personal de técnica en un párrafo.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo del año --- diez sesiones para entender la historia de la técnica, desde el primer cuchillo de piedra hasta el chip de tu celular. Hoy es el punto de partida: definir qué entiendes \emph{tú} por técnica.
  a_escuta: |-
    Antes de hablar de fábricas, computadores o robots, vamos a mirar lo más antiguo: tu propio cuerpo y los objetos cotidianos que lo extienden. Sin esa observación previa, cualquier idea de ``técnica'' que tengas será prestada de televisión o de fotos --- no tuya.
  a_sistematizacion: |-
    Ya observaste técnicas en tu cotidianidad. Ahora vamos a entender las \textbf{tres etapas} que toda técnica humana ha recorrido: cuerpo, herramienta y máquina. Distinguirlas con criterio te dará un mapa para entender cualquier tecnología que veas el resto del año.
  a_praxis: |-
    Tienes el mapa. Toca tomar posición: ¿qué es la técnica para ti, después de mirar tu cotidianidad y entender la historia? La definición que escribas hoy va a ser tu ancla durante todo el periodo --- la vas a comparar con la que tendrás al final.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: 1 párrafo con tu definición personal de técnica + 5 ejemplos. El criterio es simple: que tu definición no sea una copia del diccionario, y que cada ejemplo sea concreto de tu vida.
  a_evaluacion: |-
    Antes de cerrar, mira tu trabajo desde las cinco dimensiones humanas. Definir qué es la técnica no es solo un ejercicio académico: es un acto personal, emocional, ciudadano, local y generacional --- y vale la pena nombrar por qué.
  a_triangulo: |-
    Y para terminar, tres voces antiguas que te van a acompañar todo el grado 9. Dussel sobre la técnica como acto político, Marco Aurelio sobre la técnica del cuidado de uno mismo, Floridi sobre la técnica como condición de la infoesfera. No los memorices --- escúchalos.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Técnicas en tu cotidianidad} (15 min · individual). Sin moverte de donde estás, identifica \textbf{5 objetos} en tu entorno que extienden tu cuerpo: pueden ser tan obvios como un lápiz o tan sutiles como una silla. Para cada uno: ¿qué hace ese objeto que tu cuerpo solo no puede hacer (o hace peor)?
  checks:
  - Identifiqué 5 objetos cotidianos como extensiones del cuerpo.
  - Para cada uno anoté qué función amplía o reemplaza del cuerpo humano.
  - Distinguí entre los que ``casi no noto'' y los que aún siento ``nuevos''.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Técnicas en mi cotidianidad». \textbf{Formato:} tabla de 3 columnas (Objeto~|~Qué del cuerpo extiende~|~¿Lo noto o ya es cuerpo?), mínimo 5 filas. \textbf{Sabes que terminaste cuando} cada fila identifica una función corporal específica (no ``ayudar''), y reconociste al menos UN objeto que ya no notas porque se volvió parte de ti.
sistematizacion:
  intro: |-
    Toda técnica humana sigue tres etapas que se acumulan, no se reemplazan. Las vamos a descomponer con los pilares del pensamiento computacional para que tengas un mapa claro.
  pilares:
  - |-
    Una técnica se descompone en tres etapas: (1) \textbf{cuerpo} (el órgano hace el trabajo: la mano corta, la voz cuenta, la memoria guarda), (2) \textbf{herramienta} (el objeto que extiende el cuerpo: cuchillo, ábaco, libro), (3) \textbf{máquina} (sistema que automatiza el trabajo: trapiche, calculadora, computador).
  - |-
    Toda técnica fuerte sigue el patrón \emph{``del gesto al sistema''}: primero se hace con el cuerpo, después se inventa la herramienta, después se construye la máquina que repite la herramienta. Pero cuerpo, herramienta y máquina conviven --- ningún paso elimina al anterior.
  - |-
    Lo esencial de la técnica cabe en una pregunta: \emph{¿esta técnica amplía el cuerpo o lo reemplaza?}. La diferencia es ética: ampliarlo te da autonomía, reemplazarlo te puede quitar capacidades.
  - |-
    Pasos para analizar cualquier objeto técnico: (1) ¿qué función corporal extiende?; (2) ¿qué tan automatizado está (cuerpo / herramienta / máquina)?; (3) ¿amplía o reemplaza el cuerpo?; (4) ¿qué pasaría si dejara de existir?
  anatomia:
    titulo: Anatomía de un análisis técnico
    body: |-
      \textbf{Función corporal:} ¿qué del cuerpo extiende? (mano, voz, memoria, vista, oído). \\[1mm] \textbf{Etapa:} ¿cuerpo, herramienta o máquina? \\[1mm] \textbf{Relación con el cuerpo:} ¿amplía (le da más fuerza) o reemplaza (lo deja sin función)? \\[1mm] \textbf{Origen:} ¿es un objeto local, importado, ancestral, industrial? \\[1mm] \textbf{Dependencia:} si desapareciera, ¿qué cambiaría en tu vida?
  errores_comunes: |-
    (1) Pensar que ``técnica'' es solo lo electrónico (la silla también es técnica). (2) Confundir máquina con tecnología digital (un molino de agua es una máquina sin electricidad). (3) Creer que el cuerpo es ``primitivo'' y la máquina ``avanzada'' --- son etapas distintas, no jerarquías. (4) Olvidar que toda técnica resuelve un problema concreto --- si no resuelve nada, no es técnica.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Cuerpo, herramienta, máquina». \textbf{Formato:} 3 fichas, una por etapa, cada una con: (a) definición en tus palabras (1 frase), (b) ejemplo de tu cotidianidad, (c) ejemplo de la tradición ancestral del Valle o Colombia. \textbf{Sabes que terminaste cuando} puedes explicar las 3 etapas sin notas y das un ejemplo local de cada una.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu definición personal de técnica} (25 min · individual). Hora de tomar posición. Vas a escribir 1 párrafo con tu propia definición de técnica + 5 ejemplos concretos de tu vida. Esta definición será tu ancla durante todo el periodo.
  pilares:
  - |-
    Tu definición se descompone en 3 partes: (1) qué es la técnica (en una frase tuya), (2) qué la diferencia del cuerpo desnudo y de la máquina automática, (3) qué papel cumple en la vida humana.
  - |-
    Sigue el patrón ``frase fuerte + ejemplo cotidiano + ancla local'': cada idea abstracta de tu definición debe poder demostrarse con un objeto que ves o usas en tu día.
  - |-
    Cada ejemplo expresa una sola idea. Si tu ejemplo de ``celular'' dice 3 cosas distintas (recordar, comunicar, distraer), pártelo en 3 frases o elige una. Mejor 5 ejemplos claros que 10 confusos.
  - |-
    Algoritmo de escritura: (1) responde mentalmente: ``si tuviera que explicarle a un niño qué es la técnica, ¿qué diría?''; (2) escribe esa frase; (3) lista 5 objetos de tu vida que la prueban; (4) pule la frase para que ninguna palabra sobre.
  checklist:
    titulo: Checklist antes de cerrar el cuaderno
    items: |-
      \checkbox La definición es UNA frase (no un párrafo confuso). \\[1mm] \checkbox La definición está en tus palabras (no copia del libro). \\[1mm] \checkbox 5 ejemplos concretos de tu cotidianidad (no genéricos). \\[1mm] \checkbox Al menos 1 ejemplo es de la tradición local (oficio, instrumento del Valle, saber ancestral). \\[1mm] \checkbox Puedes leer todo en voz alta sin avergonzarte ni inflarte.
  plantilla_guion: |-
    \textbf{Mi definición de técnica.} \textit{Una frase tuya, sin clichés.} \\[1mm] \textbf{Ejemplo 1.} \textit{Objeto + qué extiende del cuerpo + cómo prueba mi definición.} \\[1mm] \textbf{Ejemplo 2--5.} \textit{Lo mismo, variando cuerpo / herramienta / máquina y mezclando lo local con lo global.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi definición personal de técnica». \textbf{Formato:} (1) un párrafo con tu definición (3--5 renglones); (2) 5 ejemplos numerados con 1 frase cada uno. \textbf{Extensión:} media página de cuaderno. \textbf{Sabes que terminaste cuando} tu definición la entendería un primo más pequeño, los 5 ejemplos son tuyos, y al menos 1 es de la tradición local.
  producto_titulo: Definición personal de técnica + 5 ejemplos contextualizados
  criterios:
  - La definición cabe en UNA frase clara
  - La definición está en palabras tuyas (no del diccionario)
  - 5 ejemplos numerados, cada uno con un objeto concreto de tu vida
  - Al menos 1 ejemplo está anclado en una tradición local o ancestral
  - El conjunto se lee en voz alta sin tropezar
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Ninguna técnica es neutral; siempre sirve a un proyecto histórico.
    aplicacion: |-
      Toda técnica responde a una pregunta humana --- pero la pregunta no es la misma para todos. La técnica de la conquista buscaba dominar; la técnica del oficio campesino buscaba sostener la vida. Preguntar \emph{a quién sirve} una técnica es el primer acto de pensamiento crítico sobre ella. Heredas técnicas: decide para qué proyecto las vas a usar.
    pregunta_espejo: |-
      ¿A qué proyecto sirve la técnica que más uso en mi día? ¿La elegí yo o la heredé sin preguntar?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Cada gesto del cuerpo, cuando se hace con atención, es un acto técnico.
    aplicacion: |-
      Los estoicos entendían que la técnica más antigua es la del cuidado del propio cuerpo y la propia mente: la respiración, el caminar, el escribir a mano, el dormir bien. Antes de cualquier máquina hubo y hay una \emph{téchne} del vivir. La pregunta no es ``¿qué máquina necesito?'', sino ``¿qué gesto debo aprender bien antes de pedirle a la máquina que me reemplace?''.
    pregunta_espejo: |-
      ¿Qué gesto del cuerpo aún hago con atención? ¿Cuál ya delegué tanto a una máquina que se me está olvidando?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La técnica re-ontologiza el mundo: cambia lo que el mundo es, no solo lo que hacemos en él.
    aplicacion: |-
      Cuando una técnica entra en tu vida, no solo te ayuda a hacer cosas: cambia lo que ``hacer cosas'' significa para ti. Antes del celular, esperar al bus era un tiempo vacío; ahora es tiempo de pantalla. Antes de la calculadora, hacer cuentas era ejercicio mental; ahora es tarea pendiente. Cada técnica reescribe la infoesfera humana --- y nosotros con ella.
    pregunta_espejo: |-
      ¿Qué actividad mía cambió de naturaleza cuando entró una técnica nueva? ¿Mejoró, empeoró o solo cambió de forma?
compromiso: |-
  \textbf{Para la próxima semana.} Lleva tu cuaderno contigo durante 3 días y, cada vez que veas u uses un objeto técnico, anota una línea: nombre + qué del cuerpo extiende. Al cabo de 3 días lee la lista. Vas a descubrir que la vida cotidiana es mucho más técnica de lo que parece a simple vista. El próximo lunes traemos esa lista al aula.
web:
  resumen: |-
    Apertura del grado 9. Definir qué es técnica desde tu cotidianidad: el cuerpo, las herramientas y las máquinas como tres etapas de un mismo gesto humano.
  subtema: Apertura · Historia de la técnica
  pre_lectura:
    por_que_importa: |-
      En el grado 9 vas a estudiar la historia de la tecnología durante todo un año. Pero antes de hablar de Revolución Industrial, computadores o IA, vamos a aclarar lo básico: ¿qué entiendes TÚ por técnica? Sin esa definición personal, todo lo que aprendas será información prestada — no pensamiento propio.
    pregunta_detonante: |-
      Si te quitaran de pronto los 5 objetos que más usas en el día, ¿qué cosas seguirías pudiendo hacer y cuáles dejarías de poder hacer?
    activacion:
      titulo: Inventario rápido del cuerpo extendido
      descripcion: |-
        En 3 minutos, anota en una hoja 5 cosas que has hecho hoy desde que despertaste hasta este momento usando un objeto (un cepillo, una silla, una llave, un celular, un lápiz). Para cada uno escribe qué del cuerpo extiende o reemplaza. Ese ejercicio es lo que vamos a profundizar todo el día.
      duracion_min: 3
    conexion:
      anterior: |-
        Cierras el grado 8 con bases de pensamiento computacional y trabajo con software. Ahora abrimos la mirada histórica.
      siguiente: |-
        En la sesión 2 vas a analizar 3 máquinas simples del campo colombiano (trapiche, noria, molino) como tecnología eficiente que sigue funcionando.
  conceptos_clave:
    - termino: Técnica
      definicion: |-
        Cualquier procedimiento o instrumento que el ser humano usa para resolver un problema concreto. Va del gesto corporal al algoritmo digital.
      ejemplo: |-
        Hervir agua para purificarla es técnica. Usar un filtro de cerámica es técnica. Programar un sensor que mida pureza también es técnica.
      emoji: "🛠"
    - termino: Cuerpo como técnica
      definicion: |-
        Antes de cualquier objeto, el primer instrumento humano fue el cuerpo: la mano cortando, la voz contando, la memoria guardando. Toda técnica empieza con un gesto corporal.
      ejemplo: |-
        Cuando aplaudes para llamar la atención, usas el cuerpo como técnica. Cuando cuentas con los dedos, también. El cuerpo es la téchne más antigua.
      emoji: "✋"
    - termino: Herramienta
      definicion: |-
        Objeto que extiende una función del cuerpo. El cuerpo sigue trabajando, pero la herramienta le da alcance, fuerza o precisión.
      ejemplo: |-
        Un cuchillo extiende la fuerza de la mano para cortar. Un ábaco extiende la memoria de la mente para contar. La herramienta no reemplaza — amplía.
      emoji: "🔧"
    - termino: Máquina
      definicion: |-
        Sistema que automatiza un trabajo: combina herramientas y una fuente de energía (agua, viento, electricidad) para repetir el gesto sin esfuerzo humano constante.
      ejemplo: |-
        El trapiche del Valle es máquina: combina rueda + presión + animal o motor. La calculadora es máquina: combina circuitos + electricidad.
      emoji: "⚙️"
    - termino: Ampliar vs reemplazar
      definicion: |-
        Distinción ética clave: una técnica que amplía el cuerpo te da más autonomía; una que lo reemplaza te puede quitar capacidades si dependes solo de ella.
      ejemplo: |-
        El GPS amplía tu sentido de orientación cuando lo usas con criterio. Pero si lo usas siempre sin pensar, reemplaza tu capacidad de leer mapas mentalmente.
      emoji: "⚖️"
    - termino: Técnicas que ya no notas
      definicion: |-
        Cuando una técnica entra profundo en tu vida, deja de sentirse "nueva" y se vuelve parte del cuerpo. Las técnicas más poderosas son las invisibles.
      ejemplo: |-
        Leer es una técnica que hace 500 años casi nadie tenía. Hoy ya no la notas — se volvió tu cuerpo extendido. La escritura, igual. El celular, casi.
      emoji: "👀"
  quiz:
    titulo: "✅ Verifica los conceptos clave"
    instrucciones: |-
      5 preguntas para confirmar que dominas el vocabulario de la técnica antes de pasar a la sesión 2. Necesitas 3/5 para avanzar.
    preguntas:
      - enunciado: Una persona aplaude para llamar la atención. ¿En qué etapa de la técnica está?
        opciones:
          - Máquina, porque produce un sonido fuerte
          - Cuerpo, porque solo usa las manos sin instrumentos
          - Herramienta, porque las manos son una herramienta
          - No es técnica
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El cuerpo es la primera etapa de la técnica. Sin instrumentos, el gesto corporal ya resuelve un problema (avisar, llamar, comunicar).
        feedback_incorrecto: |-
          El cuerpo es técnica. La mano que aplaude usa el órgano para resolver un problema (avisar). Antes de cualquier objeto hubo gesto.
      - enunciado: ¿Cuál de estos es claramente una MÁQUINA y no solo una herramienta?
        opciones:
          - Un cuchillo
          - Un trapiche del Valle
          - Un lápiz
          - Una taza de barro
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El trapiche combina rueda + presión + fuente de energía (animal o motor) para automatizar el trabajo. Eso es una máquina. El cuchillo y el lápiz son herramientas; la taza es un utensilio pero no automatiza nada.
        feedback_incorrecto: |-
          El trapiche es la máquina. Combina herramientas + energía para automatizar la extracción de jugo. Cuchillo, lápiz y taza son herramientas u objetos, pero no automatizan trabajo.
      - enunciado: ¿Cuál es la diferencia ética clave entre "ampliar" y "reemplazar" el cuerpo?
        opciones:
          - No hay diferencia
          - Ampliar te da autonomía; reemplazar te puede quitar capacidades si dependes solo de la máquina
          - Ampliar es más caro
          - Reemplazar es siempre mejor
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Una técnica que amplía te suma; una que reemplaza completamente te puede dejar dependiente. El GPS amplía tu orientación si la combinas con tu lectura mental del mapa; la reemplaza si solo lo sigues sin pensar.
        feedback_incorrecto: |-
          Ampliar suma capacidad; reemplazar puede restarla. La diferencia es ética porque tiene que ver con tu autonomía: ¿la técnica te hace más capaz o más dependiente?
      - enunciado: ¿Por qué las técnicas más poderosas son las que "ya no notas"?
        opciones:
          - Porque son baratas
          - Porque entraron tan profundo en tu vida que se volvieron parte del cuerpo extendido
          - Porque son secretas
          - Porque son antiguas
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Leer fue revolucionario hace 500 años; hoy ya no lo notas. Cuando una técnica deja de sentirse "nueva", su poder es tan grande que ya es parte de ti.
        feedback_incorrecto: |-
          Cuando una técnica entra profundo, se vuelve invisible. Eso es señal de poder, no de obsolescencia. Leer, escribir, usar zapatos: técnicas invisibles que organizan tu vida.
      - enunciado: En el saber ancestral del cuerpo como técnica, ¿qué aplica a una herramienta digital de hoy?
        opciones:
          - Nada — la técnica digital es nueva
          - Todo gesto técnico empieza en el cuerpo; el celular es extensión de memoria, voz y ojos
          - Que las herramientas antiguas eran mejores
          - Que el cuerpo no tiene importancia hoy
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El celular hace lo mismo que la piedra tallada hizo hace 30 mil años: extender el cuerpo más allá de sus límites. Cambia el material, no el principio.
        feedback_incorrecto: |-
          El principio es el mismo desde la primera azuela: la técnica extiende el cuerpo. El celular es la versión 2026 de un gesto que tiene 30 mil años. Lo nuevo es el material, no la lógica.
  post_lectura:
    transferencia: |-
      Esta semana, lleva tu cuaderno contigo durante 3 días y, cada vez que veas o uses un objeto técnico, anota una línea: nombre + qué del cuerpo extiende. Al cabo de 3 días lee la lista. Vas a descubrir que la vida cotidiana es mucho más técnica de lo que parece a simple vista. El próximo lunes traes esa lista al aula.
  cinco_dimensiones:
    personal: Construiste una definición tuya de técnica, no prestada — punto de partida del año.
    emocional: Distinguiste entre técnicas que te dan autonomía y las que te pueden volver dependiente.
    ciudadana: Entendiste que la técnica nunca es neutral — sirve a un proyecto, y vale la pena preguntar a cuál.
    local: |-
      Reconociste técnicas anclas en el Valle, el Pacífico y los oficios colombianos como tan válidas como las globales.
    intergeneracional: |-
      Conectaste tu cotidianidad técnica con la primera azuela de piedra: el principio del cuerpo extendido tiene 30 mil años.

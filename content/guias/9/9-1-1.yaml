clave: 1-1
grado: 9
periodo: 1
sesion: 1
completo: true
duracion_min: 90
titulo: ¿Qué es técnica? --- del cuerpo al instrumento
titulo_portada: |-
  ¿Qué es técnica? ---
  del cuerpo
  al instrumento
producto_final: |-
  Tu definición personal de técnica en una frase, acompañada de cinco ejemplos concretos de tu vida. Cada ejemplo dice qué función del cuerpo extiende el objeto y en qué etapa está: cuerpo, herramienta o máquina. Al menos uno viene de un oficio o de una tradición que conozcas de cerca. Cierra con la ficha de las tres etapas explicadas con tus palabras.
apertura:
  origen: Formación del jaibaná embera · se aprende acompañando, no recibiendo instrucciones
  fuente: |-
    Vasco Uribe, L. G. (1985). \emph{Jaibanás: los verdaderos hombres}. Fondo de Promoción de la Cultura, Banco Popular.
  saber_ancestral: |-
    Entre los embera, el jaibaná no nace jaibaná ni hereda el cargo: aprende de un maestro, al que acompaña durante años. El antropólogo Luis Guillermo Vasco Uribe lo documentó en \emph{Jaibanás: los verdaderos hombres} (1985), tras trabajar con los embera chamí de Risaralda y con los embera del río Garrapatas, en el Valle del Cauca. Se aprende estando al lado, mirando y haciendo, no recibiendo instrucciones. Por eso lo primero que se aprende de alguien es cómo mira el mundo. Fíjate en lo que eso dice de la técnica. Antes que cualquier objeto está un cuerpo que hace algo, y alguien que aprende mirándolo. La herramienta llega después. La \textbf{cara de exclusión}: el saber del jaibaná es restringido y ha sido objeto de extracción y exotización. Esta guía toma solo el modo de aprender, no el contenido, y ahí se detiene. Hoy vas a mirar tu propia vida con esa lente y a decidir qué llamas técnica.
  saber_contemporaneo: |-
    Toda técnica humana pasa por tres etapas que se acumulan, no se reemplazan. \textbf{Cuerpo}: el órgano hace el trabajo. La mano corta, la voz cuenta, la memoria guarda. \textbf{Herramienta}: un objeto extiende esa función. El cuchillo, el ábaco, el cuaderno. \textbf{Máquina}: un sistema automatiza el trabajo con una fuente de energía. El trapiche, la calculadora, el computador. Ninguna etapa borra a la anterior: sigues cortando con la mano aunque exista la licuadora. Y hay una distinción que sí importa. Una técnica \textbf{amplía} el cuerpo cuando te deja hacer más de lo que hacías. Lo \textbf{reemplaza} cuando deja de hacer falta que tú sepas. El GPS amplía tu orientación si lo lees; la reemplaza si solo lo obedeces. Ninguna de las dos es mala por sí sola. Lo que no conviene es no saber en cuál estás.
  pregunta_puente: |-
    El aprendiz de jaibaná pasa años mirando a alguien hacer. ¿Qué sabes hacer tú porque viste a alguien hacerlo, y qué sabes hacer solo porque un aparato lo hace por ti?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} en tu entorno cinco objetos que extienden una función concreta de tu cuerpo; (2) \textbf{explicar} con tus palabras la diferencia entre cuerpo, herramienta y máquina, con un ejemplo local de cada una; (3) \textbf{crear} tu definición personal de técnica en una frase, probada con cinco ejemplos de tu vida.
puentes:
  a_ruta: |-
    Este año recorres la historia de la técnica, del primer filo de piedra al chip. Hoy pones el punto de partida: qué entiendes tú por técnica, antes de que nadie te lo defina. Vas a comparar esa frase con la que tengas en diciembre.
  a_escuta: |-
    Antes de la teoría vas a mirar lo que tienes alrededor. Cinco objetos, y qué hace cada uno que tu cuerpo solo no puede. Sin esa observación, cualquier idea de técnica que tengas es prestada.
  a_sistematizacion: |-
    Ya observaste. Ahora vas a ordenar lo observado en tres etapas y a probar que las entendiste dando un ejemplo local de cada una.
  a_praxis: |-
    Tienes el mapa. Toca tomar posición y escribir tu propia frase, con cinco ejemplos que la sostengan.
  a_producto: |-
    Lo que entregas hoy: una frase tuya y cinco ejemplos. La prueba de calidad: un primo más pequeño entiende tu definición sin que se la expliques dos veces.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Definir qué es la técnica decide cómo vas a mirar todo lo demás del año.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre hacer y saber: Dussel sobre la técnica que no es teoría aplicada, Séneca sobre enseñar a hacer y no a decir, Floridi sobre el tiempo que las tecnologías ahorran y luego matan.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Técnicas en tu cotidianidad} (15 min · individual). (1) Sin moverte de donde estás, encuentra cinco objetos que extiendan tu cuerpo. Pueden ser tan obvios como un lápiz o tan invisibles como la silla. (2) Escribe para cada uno qué función corporal concreta amplía. No vale «ayudar»: di si es fuerza, alcance, memoria, vista u oído. (3) Marca cuáles ya no notas y cuáles todavía sientes nuevos. (4) Señala al menos uno que venga de un oficio o de una tradición, no de una fábrica.
  checks:
  - Tengo cinco objetos con su función corporal concreta.
  - Marqué cuáles ya no noto y cuáles todavía siento nuevos.
  - Señalé al menos uno que viene de un oficio o una tradición.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Técnicas en mi cotidianidad». \textbf{Formato:} tabla de 5 filas y 3 columnas (objeto / qué del cuerpo extiende / lo noto o ya es cuerpo). \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} ninguna fila dice «ayudar» y una está marcada como de oficio o tradición.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Cuerpo, herramienta, máquina} (20 min · parejas). (1) Con tu pareja, escriban las tres etapas con una frase propia cada una. (2) Pongan un ejemplo de su vida diaria en cada etapa. (3) Pongan un ejemplo de un oficio o una tradición que conozcan en cada etapa. (4) Tomen uno de sus objetos de la Actividad 1 y decidan si amplía o reemplaza, con una razón escrita.
  pilares:
  - |-
    \textbf{Las tres etapas se acumulan.} El cuerpo hace. La herramienta extiende. La máquina automatiza con energía propia. Ninguna borra a la anterior: sigues contando con los dedos aunque tengas calculadora.
  - |-
    \textbf{Cómo se distingue una máquina de una herramienta.} La herramienta necesita tu fuerza todo el tiempo. La máquina necesita otra fuente de energía y repite el gesto sin ti. Un trapiche es máquina aunque no tenga un solo cable.
  - |-
    \textbf{Ampliar o reemplazar.} Amplía cuando te deja hacer más de lo que hacías. Reemplaza cuando deja de hacer falta que tú sepas. No es que una sea buena y otra mala: es que conviene saber en cuál estás parado.
  - |-
    \textbf{Cuatro preguntas para cualquier objeto.} Qué función del cuerpo extiende. En qué etapa está. Si amplía o reemplaza. Qué cambiaría en tu día si mañana no existiera.
  anatomia:
    titulo: Cuerpo, herramienta, máquina
    body: |-
      \textbf{Cuerpo:} el órgano hace el trabajo. \\[1mm] \textbf{Herramienta:} extiende una función y necesita tu fuerza. \\[1mm] \textbf{Máquina:} automatiza con otra fuente de energía. \\[1mm] \textbf{Prueba:} ¿amplía lo que sé hacer o hace que no me haga falta saberlo?
  errores_comunes: |-
    (1) \textbf{Creer que técnica es solo lo electrónico}: una silla también es técnica. (2) \textbf{Confundir máquina con aparato digital}: un molino de agua es máquina y no tiene un solo circuito. (3) \textbf{Ordenar las etapas como si fueran mejores unas que otras}: son distintas, no superiores. (4) \textbf{Describir la función como «ayudar»}: eso no dice nada; di fuerza, alcance, memoria, vista u oído. (5) \textbf{Olvidar que toda técnica resuelve algo}: si no resuelve un problema, es adorno.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Cuerpo, herramienta, máquina». \textbf{Formato:} tres fichas, una por etapa, cada una con la definición propia, un ejemplo de tu vida y un ejemplo de un oficio o tradición. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes explicar las tres etapas sin mirar las fichas.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu definición personal de técnica} (30 min · individual). (1) Responde primero en voz baja: si tuvieras que explicarle a un niño qué es la técnica, ¿qué le dirías? (2) Escribe esa respuesta en una sola frase. (3) Lista cinco objetos de tu vida que la prueben, y di en cada uno qué función del cuerpo extiende y en qué etapa está. (4) Asegúrate de que al menos uno venga de un oficio o una tradición. (5) Quita de tu frase toda palabra que no haga falta. (6) Léesela a un compañero y pídele que te diga con sus palabras qué entendió; anota si coincide.
  pilares:
  - |-
    \textbf{Tu entrega tiene dos piezas.} Una frase con tu definición. Cinco ejemplos numerados, cada uno con su función corporal y su etapa.
  - |-
    \textbf{Una frase, no un párrafo.} Si tu definición necesita tres renglones, todavía no la entendiste. La prueba es leerla en voz alta de un tirón, sin corregir a mitad de camino.
  - |-
    \textbf{Cada ejemplo dice una sola cosa.} Si el celular te sirve para recordar, comunicar y distraerte, elige una función y escríbela. Cinco ejemplos claros valen más que diez amontonados.
  - |-
    \textbf{Al menos un ejemplo de oficio o tradición.} No por folclor, sino porque obliga a mirar técnicas que no vienen en un empaque. El molde de una modista o el mango gastado de una herramienta enseñan lo mismo que un aparato.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox La definición cabe en una frase y se lee de un tirón. \\[1mm] \checkbox Está escrita con tus palabras, no copiada. \\[1mm] \checkbox Cinco ejemplos concretos de tu vida, no genéricos. \\[1mm] \checkbox Cada ejemplo dice qué función del cuerpo extiende y en qué etapa está. \\[1mm] \checkbox Al menos uno viene de un oficio o una tradición.
  plantilla_guion: |-
    \textbf{Mi definición.} \textit{Una frase, sin palabras de más.} \\[1mm] \textbf{Ejemplo 1.} \textit{Objeto, función corporal, etapa.} \\[1mm] \textbf{Ejemplos 2 a 5.} \textit{Igual, variando de etapa y mezclando lo cotidiano con lo de oficio.} \\[1mm] \textbf{Prueba.} \textit{Leerla en voz alta a alguien más pequeño.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Mi definición personal de técnica». \textbf{Formato:} la frase con tu definición y los cinco ejemplos numerados, cada uno con su función corporal y su etapa. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} alguien más pequeño que tú entendió la frase a la primera.
  producto_titulo: Definición personal de técnica en una frase + cinco ejemplos con función y etapa
  criterios:
  - La definición cabe en una frase y está en palabras tuyas
  - Un compañero la leyó y dijo qué entendió sin que se la explicaras
  - Los cinco ejemplos son objetos concretos de tu vida
  - Cada ejemplo nombra la función corporal, no dice solo «ayudar»
  - Cada ejemplo dice en qué etapa está, cuerpo, herramienta o máquina
  - Al menos un ejemplo viene de un oficio o una tradición
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.3.2.4
    cita: |-
      La tecnología no es ciencia aplicada (teoría concretada), sino que es técnica científica.
    aplicacion: |-
      La técnica no salió del laboratorio para bajar a la mano. Salió de la mano y después se dejó explicar. El aprendiz de jaibaná no recibe primero la teoría; está al lado, mira y hace. Lo mismo pasa con casi todo lo que sabes hacer bien.
    pregunta_espejo: |-
      ¿Qué sé hacer sin poder explicarlo del todo, y quién me lo enseñó estando al lado?
  estoico:
    autor: Séneca · Cartas a Lucilio, 20 (c. 64 d.C.)
    cita: |-
      La filosofía enseña a hacer, no a decir; y exige que cada uno viva según su propia ley, que la vida no desdiga de la palabra. (trad. propia)
    aplicacion: |-
      Tu definición de hoy se prueba en los cinco ejemplos, no en lo bonito que suene. Si la frase dice una cosa y tus ejemplos muestran otra, la frase está de adorno. Escribir lo que uno de verdad hace es más difícil que escribir lo que suena bien.
    pregunta_espejo: |-
      ¿Mi definición describe cómo uso las cosas de verdad, o cómo me gustaría usarlas?
  floridi:
    autor: Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 3.1
    cita: |-
      Las tecnologías se usan primero para ahorrar tiempo y luego para matarlo. (trad. propia)
    aplicacion: |-
      Casi todo objeto de tu lista entró a tu vida prometiendo ahorrarte algo. Vale la pena revisar qué hiciste con lo que te ahorró. A veces el tiempo ganado se usó en otra cosa; a veces se lo quedó el mismo aparato que lo liberó.
    pregunta_espejo: |-
      ¿En qué gasté el tiempo que me ahorró el objeto que más uso?
compromiso: |-
  \textbf{Para la próxima sesión.} Lleva el cuaderno contigo tres días. Cada vez que uses un objeto técnico, anota una línea: nombre y qué del cuerpo extiende. Al tercer día lee la lista completa. En la sesión 2 vas a estudiar máquinas simples del campo colombiano, y varias van a estar ahí.
web:
  resumen: |-
    Entre los embera, el jaibaná aprende acompañando a un maestro durante años: se aprende estando al lado, mirando y haciendo. Así empieza toda técnica. Hoy defines qué es la técnica para ti, distingues cuerpo, herramienta y máquina, y decides cuáles de tus objetos amplían lo que sabes hacer y cuáles hacen que no te haga falta saberlo.
  subtema: Apertura · Historia de la técnica
  pre_lectura:
    por_que_importa: |-
      Vas a estudiar la historia de la tecnología durante un año entero. Si no defines primero qué llamas técnica, todo lo que aprendas va a ser información prestada.
    pregunta_detonante: |-
      Si mañana te quitaran los cinco objetos que más usas, ¿qué cosas seguirías sabiendo hacer y cuáles no?
    activacion:
      titulo: El cuerpo extendido
      descripcion: |-
        En 3 minutos, anota cinco cosas que hiciste hoy usando un objeto. Al lado de cada una, escribe qué parte del cuerpo estaba extendiendo ese objeto.
      duracion_min: 3
    conexion:
      anterior: En octavo cerraste con pensamiento computacional y trabajo con datos.
      siguiente: En la sesión 2 estudias máquinas simples del campo colombiano, como el trapiche y la noria.
  mapa_ruta:

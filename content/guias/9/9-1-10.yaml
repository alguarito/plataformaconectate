      titulo: Tres citas y tu compromiso
      duracion_min: 15
  actividades:
    - numero: 1
      verbo: ANALIZA
      titulo: Las nueve preguntas del periodo
      tiempo_min: 15
      modalidad: individual
      pasos:
        - Busca en tu cuaderno las nueve preguntas puente del periodo y anótalas en orden.
        - Marca las tres que te costaron más.
        - Escribe al lado de dos de ellas qué contestarías hoy.
        - Compara esa respuesta con la que diste entonces y anota si cambió.
        - Elige la pregunta que más te marcó, porque de ahí sale tu posición.
      cuaderno:
        titulo: Las nueve preguntas del periodo
        formato: la lista de las nueve con las tres difíciles marcadas y dos respuestas de hoy comparadas
        extension: un tercio de página
      criterios:
        - Las nueve están anotadas en orden.
        - Está elegida la pregunta de la que sale la posición.
    - numero: 2
      verbo: EXPLICA
      titulo: Los cinco elementos
      tiempo_min: 20
      modalidad: parejas
      pasos:
        - Con tu pareja, escriban los cinco elementos con una frase propia cada uno.
        - Escriban cada uno su posición en una sola frase y léansela al otro.
        - Búsquenle a la posición del otro un límite que no haya visto.
        - Anoten por qué reconocer ese límite hace la posición más creíble.
      cuaderno:
        titulo: Los cinco elementos
        formato: los cinco con frase propia, tu posición en una frase y el límite que te encontró tu pareja
        extension: media página
      criterios:
        - La posición cabe en una sola frase.
        - Hay un límite escrito que no habías visto solo.
    - numero: 3
      verbo: CREA
      titulo: Tu manifiesto y su defensa
      tiempo_min: 30
      modalidad: individual
      pasos:
        - Escribe tu posición en una frase, arriba de la página.
        - Añade dos o tres razones técnicas y el ancla local del periodo que la sostiene.
        - Escribe los límites que le reconoces, sin suavizarlos.
        - Cierra con una propuesta que puedas empezar esta semana.
        - Ensáyalo con cronómetro y defiéndelo ante el grupo con notas breves.
      cuaderno:
        titulo: Tu manifiesto y su defensa
        formato: el manifiesto completo con los cinco elementos y las notas breves de la sustentación
        extension: una página
      criterios:
        - Los cinco elementos se ven a simple vista en la página.
        - Lo defendiste sin leer la hoja.
  conceptos_clave:
    - categoria: Los cinco elementos
      termino: Posición
      definicion: |-
        Una afirmación en una sola frase que dice qué crees. Si necesita dos párrafos, todavía no la tienes.
      ejemplo: «Creo que una técnica solo vale la pena si puedo explicar qué me cobra.»
    - categoria: Los cinco elementos
      termino: Razón técnica
      definicion: Un motivo que se puede discutir con datos o con un caso, y no con lo que a cada quien le agrade.
      ejemplo: «Delegar un cálculo sin decidirlo deja una capacidad sin uso» es una razón. «No me gusta» no lo es.
    - categoria: Los cinco elementos
      termino: Párrafo de límites
      definicion: |-
        Lo que reconoces que no sabes o dónde tu posición es floja. Es lo que separa una posición pensada de una consigna.
      ejemplo: Un texto sin una sola duda se lee como propaganda, y convence menos, no más.
    - categoria: Cómo se sostiene
      termino: Firme pero matizado
      definicion: Sostener con fuerza y reconocer lo flojo a la vez. La rigidez suena a no haberlo pensado; la tibieza, a no importarte.
      ejemplo: "Marco Aurelio lo escribió: cambiaría de parecer con gusto si alguien le mostrara que se equivoca."
    - categoria: Cómo se sostiene
      termino: Volver a mirarlo
      definicion: |-
        Poner una fecha para releer lo que escribiste y comprobar si cumpliste. Es lo que hace que una declaración pese.
      ejemplo: El CRIC rinde públicamente cuáles de sus mandatos se cumplieron y cuáles no.
  cinco_dimensiones:
    personal: Tienes por escrito qué piensas de la técnica, y una fecha para comprobar si seguías pensándolo.
    emocional: Defender algo en voz alta delante del grupo asusta. Haberlo ensayado convierte el miedo en tiempo medido.
    ciudadana: Escribir una posición y volver a mirarla es lo que distingue un compromiso de una frase de ocasión.
    local: Las anclas del periodo están todas a pocas horas de tu casa, y una de ellas sostiene lo que hoy afirmas.
    intergeneracional: El CRIC discute sus mandatos en congreso desde 1971 y rinde cuentas de ellos. Tú empiezas con una página.
  post_lectura:
    reflexion: |-
      ¿Cuál de las nueve preguntas contestas hoy distinto de como la contestaste el primer día, y qué te hizo cambiar?
    transferencia: |-
      Pon en tu calendario una fecha dentro de un mes para releer el manifiesto y anotar si cumpliste la propuesta.
    cierre: Un mandato no vale por estar escrito. Vale porque quienes lo hicieron vuelven a mirarlo.
  quiz:
    titulo: ¿Sabes sostener una posición?
    instrucciones: Cinco preguntas sobre los cinco elementos y sobre cómo se defiende un manifiesto. No va al cuaderno.
    preguntas:
      - enunciado: ¿Cuál de estas es una razón técnica y no un gusto?
        opciones:
          - «Prefiero lo hecho a mano antes que lo hecho a máquina.»
          - «Delegar un cálculo sin decidirlo deja una capacidad sin uso.»
          - «Me parece que la tecnología avanza demasiado rápido.»
          - «Siento que antes la gente se comunicaba mucho mejor.»
        respuesta_index: 1
        feedback_correcto: Sí. Se puede discutir con un caso o con datos, que es justo lo que la vuelve razón.
        feedback_incorrecto: La que se puede discutir con datos o con un caso. Las otras tres dicen qué te agrada.
      - enunciado: ¿Por qué el párrafo de límites hace más fuerte un manifiesto?
        opciones:
          - Porque alarga el texto y llena mejor la página completa.
          - Porque evita que el docente encuentre errores al calificarlo.
          - Porque separa una posición pensada de una consigna.
          - Porque permite cambiar de opinión más adelante sin costo.
        respuesta_index: 2
        feedback_correcto: Correcto. Un texto sin una sola duda se lee como propaganda y convence menos.
        feedback_incorrecto: Porque muestra que la posición fue pensada. Sin límites, el texto suena a consigna.
      - enunciado: ¿Qué diferencia hay entre un mandato del CRIC y lo que escribes hoy?
        opciones:
          - Ninguna: los dos son acuerdos que se ponen por escrito.
          - Que el mandato es un acto de gobierno de un pueblo y lo tuyo es mucho más pequeño.
          - Que el mandato se escribe a mano y el tuyo en computador.
          - Que el mandato dura un año y el tuyo no tiene plazo fijado.
        respuesta_index: 1
        feedback_correcto: Eso es. Sale de un congreso, rige a todos y se rinde en público. Lo tuyo aprende de eso.
        feedback_incorrecto: Que un mandato es un acto de gobierno de un pueblo. Lo tuyo es una posición personal.
      - enunciado: Tu propuesta dice «voy a pensar más antes de usar la calculadora». ¿Qué le falta?
        opciones:
          - Le falta explicar por qué la calculadora resulta problemática.
          - Le falta relacionarla con alguna de las razones técnicas.
          - Le falta mencionar qué modelo de calculadora usas hoy.
          - Le falta decir qué haces y qué día, para poder comprobarlo.
        respuesta_index: 3
        feedback_correcto: Sí. «Del lunes al viernes calculo el vuelto de memoria» se puede cumplir o incumplir.
        feedback_incorrecto: Le falta qué y cuándo. Sin eso no hay forma de saber el viernes si la cumpliste.
      - enunciado: ¿Qué significa que un mandato «vale porque quienes lo hicieron vuelven a mirarlo»?
        opciones:
          - Que se revisa públicamente si se cumplió o no se cumplió.
          - Que hay que memorizarlo para poder repetirlo en el congreso.
          - Que solo tiene validez mientras dure la asamblea que lo aprobó.
          - Que debe leerse en voz alta cada vez que alguien lo invoca.
        respuesta_index: 0
        feedback_correcto: Correcto. El CRIC reporta cuáles de sus mandatos se cumplieron y cuáles no.
        feedback_incorrecto: Que se rinde cuentas de su cumplimiento. Escribirlo es apenas la mitad del trabajo.

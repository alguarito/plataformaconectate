clave: 1-10
grado: 9
periodo: 1
sesion: 10
completo: true
titulo: Cosecha P1 --- manifiesto del técnico crítico
titulo_portada: |-
  Cosecha P1 ---
  manifiesto del
  técnico crítico
producto_final: Manifiesto personal escrito (1 página) + sustentación oral de 3 a 5 minutos donde el estudiante expone su posición sobre qué es la técnica, qué conserva del oficio ancestral y qué de ella debe ser cuestionado
apertura:
  saber_ancestral: |-
    En las tradiciones de oficio del Valle, el Pacífico y los Andes, el aprendiz al cerrar su formación con el maestro presentaba una \textbf{pieza de prueba}: el panadero su mejor pan, el sastre su mejor traje, el carpintero su mejor mueble. No era examen --- era declaración pública: ``esto soy capaz de hacer, esto defiendo, esto es mi firma''. El cierre de tu periodo 1 es exactamente eso: la pieza de prueba con la que muestras --- a ti mismo y a tus compañeros --- en qué te convertiste durante 9 sesiones de mirar la técnica con criterio.
  saber_contemporaneo: |-
    Hoy el cierre del periodo es un \textbf{manifiesto} ---  una declaración corta, pública y comprometida sobre tu posición personal frente a la técnica. No es resumen de lo aprendido (eso lo da el cuaderno); es \emph{tu voz} aplicada a las 9 preguntas-puente que has acumulado. Después lo defiendes oralmente ante tus compañeros en 3-5 minutos. Esa exposición pública es lo que separa al estudiante que ``pasó el periodo'' del que ``se transformó en el periodo''.
  pregunta_puente: |-
    Si tuvieras que decirle a tu yo de hace 2 meses --- antes de empezar este periodo --- una sola cosa que descubriste sobre la técnica, ¿cuál sería?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} las 9 sesiones del periodo y extraer 3 aprendizajes que cambiaron tu mirada; (2) \textbf{evaluar} tu propia posición sobre 3 dilemas técnicos contemporáneos (dependencia eléctrica, IA y trabajo, tecnologías propias); (3) \textbf{crear} un manifiesto personal de 1 página con tu voz propia; (4) \textbf{explicar} tu manifiesto ante el aula en 3-5 minutos con argumentos.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Nueve sesiones te trajeron hasta aquí. Hoy haces la cosecha: extraes de ese trabajo lo que de verdad te quedó. No es resumen; es destilación. Lo que escribas y sostengas hoy es tu firma del periodo.
  a_escuta: |-
    Antes de escribir tu manifiesto, vamos a releer las 9 preguntas-puente que cada sesión te dejó. Hay un patrón ahí: las preguntas que más te tocaron son las que vale la pena llevar al manifiesto.
  a_sistematizacion: |-
    Ya tienes las 9 preguntas-puente revisadas. Ahora vamos a entender los \textbf{4 elementos} de un manifiesto técnico fuerte: posición clara, argumento técnico, ancla local, propuesta accionable. Sin alguno, el manifiesto se queda en opinión.
  a_praxis: |-
    Tienes el método. Toca producir: tu manifiesto de 1 página + preparación de la sustentación oral de 3-5 minutos.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: manifiesto escrito + sustentación oral. El criterio principal: que defiendas en voz alta tu posición sin titubear y que el manifiesto se sostenga si alguien lo lee sin que tú estés presente.
  a_evaluacion: |-
    Antes de cerrar, mira el cierre del periodo desde las cinco dimensiones humanas. Esta no es solo una nota: es un acto público de toma de posición que te acompañará por años, lo notes o no.
  a_triangulo: |-
    Y para terminar, tres voces sobre el acto de tomar posición. Dussel sobre la palabra propia, Marco Aurelio sobre la coherencia de los actos, Floridi sobre la voz pública en la infoesfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Recoge las 9 preguntas-puente} (15 min · individual). Abre tu cuaderno del periodo y busca las 9 preguntas-puente (la pregunta final del bloque de apertura de cada sesión). Anótalas en orden. Para cada una: ¿la respondiste honestamente en su momento? ¿qué descubriste? ¿cuál de las 9 sigue inquietándote más?
  checks:
  - Recuperé las 9 preguntas-puente del periodo (una por sesión).
  - Para cada una anoté qué descubrí o qué quedó pendiente.
  - Identifiqué cuál de las 9 me sigue inquietando más.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Las 9 preguntas-puente del periodo». \textbf{Formato:} lista numerada del 1 al 9 con cada pregunta y debajo 1-2 renglones de respuesta honesta. Al final marca con $\star$ la pregunta que más te marca. \textbf{Sabes que terminaste cuando} reconoces honestamente que algunas las respondiste y otras siguen abiertas.
sistematizacion:
  intro: |-
    Todo manifiesto técnico fuerte tiene 4 elementos. Vamos a descomponerlos con los pilares del pensamiento computacional para que tu cierre sea defendible y no una colección de opiniones.
  pilares:
  - |-
    Un manifiesto técnico fuerte se descompone en 4 elementos: (1) \textbf{posición clara} (una afirmación principal en 1 frase: ``creo que la técnica debe...''), (2) \textbf{argumento técnico} (al menos 2-3 razones rigurosas, no morales), (3) \textbf{ancla local} (un ejemplo concreto de tu región/familia que sostenga la posición), (4) \textbf{propuesta accionable} (qué vas a hacer tú diferente la próxima semana / mes / año).
  - |-
    Todo manifiesto sigue el patrón \textbf{``firme pero matizado''}: sostén tu posición con fuerza, pero reconoce honestamente lo que NO sabes y lo que tu posición tiene de débil. La rigidez es ideología; el matiz reconocido es pensamiento.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿esta posición la puedo defender en voz alta sin avergonzarme y sin inflarme?}. Si la respuesta es no, ajusta hasta que la respuesta sea sí.
  - |-
    Pasos para escribir tu manifiesto: (1) elige UNA pregunta-puente que te marca; (2) escribe tu respuesta en una frase fuerte (la posición); (3) lista 2-3 razones técnicas que la sostienen; (4) ancla con 1 ejemplo concreto local; (5) cierra con UNA propuesta accionable.
  anatomia:
    titulo: Anatomía de un manifiesto técnico
    body: |-
      \textbf{Posición:} 1 frase fuerte (creo / propongo / sostengo). \\[1mm] \textbf{Argumentos:} 2-3 razones técnicas, no morales. \\[1mm] \textbf{Ancla local:} 1 ejemplo concreto de tu región o familia. \\[1mm] \textbf{Reconocimiento de límites:} 1-2 cosas que NO sabes o que tu posición tiene de débil. \\[1mm] \textbf{Propuesta accionable:} qué vas a hacer tú diferente. \\[1mm] \textbf{Firma:} nombre, fecha, grado, lugar.
  errores_comunes: |-
    (1) Manifiesto que es resumen disfrazado --- no tiene posición, solo enumera lo aprendido. (2) Posición sin argumentos técnicos, solo morales (``debemos cuidar la tecnología''). (3) Sin ancla local, suena prestado. (4) Sin reconocer límites, parece arrogante. (5) Sin propuesta accionable, queda en el aire.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 4 elementos de mi manifiesto». \textbf{Formato:} 4 fichas, una por elemento, cada una con lo que TÚ vas a poner en el manifiesto final. Es decir: borrador estructurado. \textbf{Sabes que terminaste cuando} tienes los 4 elementos con tu propia voz y reconoces explícitamente al menos UN límite de tu propia posición.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu manifiesto + sustentación oral} (40 min · individual). Hora de cerrar el periodo. Vas a redactar tu manifiesto en 1 página A4 y a preparar la sustentación oral de 3 a 5 minutos. Después lo defenderás ante el aula.
  pilares:
  - |-
    Tu manifiesto se descompone en 6 secciones en 1 página: posición + argumentos + ancla local + reconocimiento de límites + propuesta accionable + firma. La sustentación oral es exposición libre, sin leer la hoja.
  - |-
    Sigue el patrón \textbf{``escribe primero, hable después''}: redacta el manifiesto a mano o digital, pulélo, déjalo descansar 30 minutos, vuelve a leerlo en voz alta. Si suena a ti, está listo. Si suena prestado o forzado, reescribe.
  - |-
    Cada sección expresa una sola idea. Si tu posición intenta decir 3 cosas, parte el manifiesto. Mejor 1 idea defendida que 5 ideas confusas.
  - |-
    Algoritmo: (1) escribe la posición en una frase fuerte; (2) escribe los 2-3 argumentos; (3) escribe la ancla local; (4) reconoce 1-2 límites; (5) escribe la propuesta accionable; (6) firma; (7) lee en voz alta y ajusta; (8) prepara la sustentación oral con notas breves --- no leer la hoja.
  checklist:
    titulo: Checklist antes de presentar el manifiesto
    items: |-
      \checkbox Manifiesto en 1 página A4 con los 6 elementos. \\[1mm] \checkbox Posición en 1 frase fuerte. \\[1mm] \checkbox 2-3 argumentos técnicos (no morales). \\[1mm] \checkbox 1 ancla local concreta. \\[1mm] \checkbox Reconocimiento de al menos 1 límite. \\[1mm] \checkbox Propuesta accionable concreta para esta semana o mes. \\[1mm] \checkbox Notas breves preparadas para sustentación oral. \\[1mm] \checkbox Lo leí en voz alta y suena a mí.
  plantilla_guion: |-
    \textbf{Posición.} \textit{1 frase fuerte.} \\[1mm] \textbf{Argumentos.} \textit{2-3 razones técnicas.} \\[1mm] \textbf{Ancla local.} \textit{1 ejemplo concreto de mi región o familia.} \\[1mm] \textbf{Límites.} \textit{1-2 cosas que no sé o que mi posición tiene de débil.} \\[1mm] \textbf{Propuesta accionable.} \textit{Qué voy a hacer diferente la próxima semana / mes / año.} \\[1mm] \textbf{Firma.} \textit{Nombre, fecha, grado, lugar.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Manifiesto del técnico crítico · versión 1». \textbf{Formato:} 1 página A4 con los 6 elementos + notas breves para sustentación oral. \textbf{Extensión:} 1 página A4 + media página de notas orales. \textbf{Sabes que terminaste cuando} puedes defender el manifiesto en voz alta durante 3-5 minutos sin leerlo y sin titubear.
  producto_titulo: Manifiesto personal del técnico crítico + sustentación oral
  criterios:
  - Manifiesto en 1 página A4 con los 6 elementos visibles
  - Posición clara, argumentos técnicos, ancla local, límites reconocidos, propuesta accionable
  - Sustentación oral preparada con notas breves (no leer la hoja)
  - Lo defiendes en voz alta sin avergonzarte ni inflarte
  - Un compañero que no estuvo en clase entendería tu posición leyéndolo
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La palabra propia es el primer acto de pensamiento libre.
    aplicacion: |-
      Mucha educación se queda en repetir lo que el libro dice. Tomar posición pública --- con tu nombre, tu voz, tu firma --- es ejercer la palabra propia. Esa práctica se entrena en la escuela o no se entrena nunca. Tu manifiesto, defendido oralmente, es la primera vez en muchos años escolares que se te pidió tener voz propia. Vale la pena tomarlo en serio.
    pregunta_espejo: |-
      ¿Qué de mi manifiesto es genuinamente mío y qué viene de la voz de otros (libros, redes, profesores)? ¿Soy consciente de la diferencia?
  estoico:
    autor: Marco Aurelio
    cita: |-
      No es lo que defiendes con palabras lo que te define; es lo que sostienes con actos a lo largo del tiempo.
    aplicacion: |-
      Escribir el manifiesto es fácil; sostener lo que dice con tus actos cotidianos durante el resto del año es lo difícil. La coherencia estoica no exige perfección --- exige conciencia de la brecha. Cada semana que vivas en contradicción con tu manifiesto sin notarlo, el manifiesto pierde valor. Cada semana que lo recuerdes y ajustes, lo cumple.
    pregunta_espejo: |-
      ¿Estoy dispuesto a revisar este manifiesto cada mes para verificar si lo estoy viviendo? ¿O lo voy a archivar y olvidar?
  floridi:
    autor: Luciano Floridi
    cita: |-
      En la infoesfera contemporánea, escribir es un acto político: lo que se publica con tu nombre te define para los archivos del futuro.
    aplicacion: |-
      Tu manifiesto puede quedar en un cuaderno cerrado o puede publicarse (en tu portafolio, en redes, en un blog). Floridi nos recuerda que cualquier texto público con tu nombre se vuelve parte de tu identidad digital permanente. Eso no debe paralizar --- debe responsabilizar.
    pregunta_espejo: |-
      ¿Publicaría mi manifiesto en redes con mi nombre real? Si la respuesta es no, ¿qué me detiene? Si es sí, ¿lo voy a hacer?
compromiso: |-
  \textbf{Para el próximo periodo.} Pega o copia tu manifiesto en la primera página de tu cuaderno del Periodo 2. Cada mes durante el resto del año, vuelve a leerlo y anota brevemente: ¿qué cumplí?, ¿qué se quedó en intención?, ¿qué cambió mi posición?. Esa práctica de \textbf{volver al manifiesto} es lo que convierte una declaración en una vida. \emph{Felicitaciones por cerrar el Periodo 1 de grado 9 con voz propia.}

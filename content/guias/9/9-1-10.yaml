      iconos: ["🌱"]
      titulo: Un mandato se vuelve a mirar
      duracion_min: 10
    - numero: 2
      iconos: ["🔎"]
      titulo: Actividad 1 · Las nueve preguntas del periodo
      duracion_min: 15
    - numero: 3
      iconos: ["📖"]
      titulo: Actividad 2 · Los cinco elementos
      duracion_min: 20
    - numero: 4
      iconos: ["✏️", "✅"]

clave: 1-10
grado: 9
periodo: 1
sesion: 10
completo: false
titulo: Cosecha P1 --- manifiesto del técnico crítico
producto_final: |-
  Manifiesto personal escrito (1 página) + sustentación oral de 3 a 5 minutos donde el estudiante expone su posición sobre qué es la técnica, qué de ella conserva del oficio ancestral y qué de ella debe ser cuestionado
saber_ancestral_idea: |-
  El cierre del periodo retoma todas las anclas anteriores: el cuerpo y el instrumento, la rueda y el agua, la balanza, la imprenta, la electricidad, el ábaco, las tecnologías propias. El estudiante deja de ser consumidor pasivo de tecnología y asume una posición crítica con voz propia.
verbos_actividades:
- ANALIZA
- EVALÚA
- CREA
- EXPLICA

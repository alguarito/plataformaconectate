clave: 1-10
grado: 9
periodo: 1
sesion: 10
completo: true
duracion_min: 90
titulo: Cosecha P1 --- manifiesto del técnico crítico
titulo_portada: |-
  Cosecha del periodo ---
  manifiesto del
  técnico crítico
producto_final: |-
  Tu manifiesto del técnico crítico en una página, con cinco elementos visibles: una posición en una frase, dos o tres razones que la sostienen, un ancla local del periodo, los límites que le reconoces y una propuesta que puedas empezar esta semana. Lo defiendes en voz alta de tres a cinco minutos, con notas breves y sin leer la hoja.
apertura:
  origen: Congresos del CRIC · un mandato vale porque quienes lo hicieron vuelven a mirarlo
  fuente: |-
    Consejo Regional Indígena del Cauca. (2017). \emph{Avanza el XV congreso regional del CRIC en el resguardo de Rioblanco Sotará del pueblo indígena yanacona}.
  saber_ancestral: |-
    En los pueblos indígenas del Cauca, las normas que rigen a todos se llaman \textbf{mandatos}, y no las escribe una autoridad sola. Salen de un congreso al que llega la gente de los resguardos a discutir durante días. El XV Congreso del CRIC se reunió en Río Blanco, Sotará, del 25 al 30 de junio de 2017. De allí salieron mandatos concretos que la organización después tiene que rendir públicamente: cuáles se cumplieron y cuáles no. Un mandato no vale por estar escrito. Vale porque quienes lo hicieron vuelven a mirarlo. Conviene decir esto con precisión: así construye su norma un pueblo que disputa su gobierno con el Estado y con actores armados. Lo que tú vas a hacer hoy es algo mucho más pequeño que aprende de eso. La \textbf{cara de exclusión}: la propia organización reporta que el cumplimiento de sus mandatos queda incompleto.
  saber_contemporaneo: |-
    Un manifiesto tiene cinco elementos y ninguno sobra. \textbf{Posición}: una afirmación en una frase, que empiece por «creo que». \textbf{Razones}: dos o tres, y técnicas, no de gusto personal. \textbf{Ancla}: un caso concreto del periodo que sostenga lo que dices. \textbf{Límites}: qué no sabes y en qué tu posición es débil. \textbf{Propuesta}: algo que puedas empezar esta semana. La regla de redacción es «firme pero matizado». Sostener con fuerza y reconocer lo flojo no se contradicen: la rigidez suena a que no lo pensaste, y la tibieza a que no te importa. Y hay una prueba que no falla. Léelo en voz alta y pregúntate si puedes defenderlo sin avergonzarte y sin inflarte. Si te avergüenza, arréglalo. Si te infla, quítale adjetivos.
  pregunta_puente: |-
    Un mandato vale porque quienes lo escribieron vuelven a mirarlo. ¿Cuándo vas a volver a mirar el manifiesto que escribas hoy?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} tus propias respuestas del periodo y ver qué cambió en lo que pensabas; (2) \textbf{explicar} los cinco elementos de un manifiesto y por qué reconocer límites lo fortalece; (3) \textbf{crear} tu manifiesto en una página y defenderlo en voz alta ante el grupo.
puentes:
  a_ruta: |-
    Nueve sesiones recorrieron la técnica desde el cuerpo hasta el chip, pasando por la balanza, la imprenta, la corriente y las tecnologías propias. Hoy cierras tomando posición. En el periodo 2 pasas al diseño editorial, y esa posición te va a servir.
  a_escuta: |-
    Antes de escribir vas a releerte. Las nueve preguntas puente del periodo están en tu cuaderno, y algunas las contestaste distinto de como las contestarías hoy.
  a_sistematizacion: |-
    Ya tienes tu material. Ahora vas a ver qué separa un manifiesto de una opinión suelta, y por qué reconocer un límite lo hace más fuerte, no más débil.
  a_praxis: |-
    Tienes la estructura. Toca escribir la página, ensayarla y defenderla delante del grupo.
  a_producto: |-
    Lo que entregas hoy: una página con los cinco elementos y una sustentación de tres a cinco minutos. La prueba de calidad: alguien que no estuvo en clase entiende tu posición leyéndola.
  a_evaluacion: |-
    Antes de cerrar, mira el periodo desde cinco lados. Una posición que nunca se vuelve a mirar se convierte en una frase bonita y nada más.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre elegir y sostener: Dussel sobre saber perder tiempo para elegir los temas que importan, Marco Aurelio sobre cambiar de parecer con gusto, Floridi sobre saber preguntar y responder.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Las nueve preguntas del periodo} (15 min · individual). (1) Abre tu cuaderno y busca las nueve preguntas puente del periodo, la que cierra la apertura de cada sesión. (2) Anótalas en orden. (3) Marca las tres que te costaron más. (4) Escribe al lado de dos de ellas qué contestarías hoy, y si cambió respecto a lo que contestaste entonces. (5) Elige la que más te marcó: de ahí sale tu posición.
  checks:
  - Tengo las nueve preguntas puente anotadas en orden.
  - Marqué las tres que me costaron más.
  - Elegí la que más me marcó y sé por qué.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} \textbf{Título:} «Actividad 1 --- Las nueve preguntas del periodo». \textbf{Formato:} la lista de las nueve con las tres difíciles marcadas, más dos respuestas de hoy comparadas con las de entonces. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} tienes elegida la pregunta de la que va a salir tu posición.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los cinco elementos} (20 min · parejas). (1) Con tu pareja, escriban los cinco elementos con una frase propia cada uno. (2) Escriban cada uno su posición en una sola frase y léansela al otro. (3) Búsquenle a la posición del otro un límite que no haya visto. (4) Anoten por qué reconocer ese límite hace la posición más creíble y no menos.
  pilares:
  - |-
    \textbf{Los cinco elementos.} Posición en una frase. Dos o tres razones técnicas. Un ancla local del periodo. Los límites reconocidos. Una propuesta que empiece esta semana.
  - |-
    \textbf{Firme pero matizado.} Sostener con fuerza y reconocer lo flojo no se contradicen. La rigidez suena a que no lo pensaste; la tibieza, a que no te importa. El punto medio no es blandura: es haber mirado tu propia posición por el revés.
  - |-
    \textbf{Las razones son técnicas, no de gusto.} «No me gusta que todo sea digital» es un gusto. «Delegar un cálculo sin decidirlo deja una capacidad sin uso» es una razón, y viene de la sesión 8.
  - |-
    \textbf{Lo que escribes no es un mandato.} Un mandato es un acto de gobierno de un pueblo, discutido en congreso y rendido en público. Lo tuyo es mucho más pequeño y aprende de eso: una posición propia que te comprometes a volver a mirar.
  anatomia:
    titulo: Los cinco elementos de un manifiesto
    body: |-
      \textbf{Posición:} una frase que empieza por «creo que». \\[1mm] \textbf{Razones:} dos o tres, técnicas. \\[1mm] \textbf{Ancla:} un caso concreto del periodo. \\[1mm] \textbf{Límites:} qué no sé y dónde soy débil. \\[1mm] \textbf{Propuesta:} algo que empiece esta semana.
  errores_comunes: |-
    (1) \textbf{Posición de dos párrafos}: si no cabe en una frase, todavía no la tienes. (2) \textbf{Razones que son gustos}: lo que te agrada no sostiene nada. (3) \textbf{Ancla genérica}: «la tecnología ancestral» no es un ancla; el trapiche del río La Vieja sí. (4) \textbf{Sin límites}: un texto sin una sola duda se lee como propaganda. (5) \textbf{Leer la hoja al sustentar}: si la lees, sobra quien la escribió.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los cinco elementos». \textbf{Formato:} los cinco con frase propia, tu posición en una sola frase y el límite que te encontró tu pareja. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tienes escrito un límite que no habías visto solo.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu manifiesto y su defensa} (30 min · individual). (1) Escribe tu posición en una frase, arriba de la página. (2) Añade dos o tres razones técnicas, cada una en dos renglones. (3) Añade el ancla local del periodo que la sostiene. (4) Escribe los límites que le reconoces, sin suavizarlos. (5) Cierra con una propuesta que puedas empezar esta semana. (6) Ensáyalo con cronómetro y defiéndelo ante el grupo con notas breves, sin leer la hoja.
  pilares:
  - |-
    \textbf{Tu entrega tiene dos piezas.} La página con los cinco elementos visibles a simple vista. Y la sustentación de tres a cinco minutos, con notas y no con la hoja.
  - |-
    \textbf{El ancla la eliges tú.} El jaibaná que aprende acompañando, las dos medidas de Saucío, los oficios asignados de la finca cafetera, la décima que vuelve al inicio, la radio con NIT, el molde que se disuelve, las Pléyades. Escoge la que de verdad sostenga tu posición.
  - |-
    \textbf{El párrafo de límites es el que más pesa.} Escribir qué no sabes es lo que separa una posición pensada de una consigna. Y en la sustentación es lo que hace que te crean.
  - |-
    \textbf{La propuesta tiene fecha.} «Voy a pensar más antes de usar la calculadora» no se puede cumplir. «Del lunes al viernes calculo el vuelto de memoria» sí, y el viernes se sabe.
  checklist:
    titulo: Antes de sustentar
    items: |-
      \checkbox Posición en una sola frase, visible arriba. \\[1mm] \checkbox Dos o tres razones técnicas, no gustos. \\[1mm] \checkbox Un ancla local concreta del periodo. \\[1mm] \checkbox Límites reconocidos sin suavizar. \\[1mm] \checkbox Propuesta con día y acción. \\[1mm] \checkbox Ensayado con cronómetro, entre tres y cinco minutos. \\[1mm] \checkbox Notas breves, no la hoja completa.
  plantilla_guion: |-
    \textbf{Posición.} \textit{Creo que la técnica debe…} \\[1mm] \textbf{Razones.} \textit{Dos o tres, técnicas.} \\[1mm] \textbf{Ancla.} \textit{El caso del periodo que la sostiene.} \\[1mm] \textbf{Límites.} \textit{Qué no sé y dónde soy débil.} \\[1mm] \textbf{Propuesta.} \textit{Qué empiezo y qué día.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Tu manifiesto y su defensa». \textbf{Formato:} el manifiesto completo con los cinco elementos y las notas breves con las que lo sustentaste. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} lo defendiste sin leer la hoja y sin avergonzarte.
  producto_titulo: Manifiesto del técnico crítico en una página + sustentación de tres a cinco minutos
  criterios:
  - La posición cabe en una frase y está visible arriba de la página
  - Las razones son técnicas y vienen del periodo, no son gustos
  - El ancla local es un caso concreto, no una categoría
  - Los límites están escritos sin suavizar
  - La propuesta dice qué empiezas y qué día
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §5.9.4.1
    cita: |-
      Como los temas son infinitos y el tiempo corto, es necesario saber perder tiempo para elegir los temas fundamentales de la época que nos toca vivir.
    aplicacion: |-
      Los quince minutos que dedicas a releer tus nueve preguntas no son tiempo perdido: son la elección. Un manifiesto sobre lo primero que se te ocurra no dice nada de ti; uno sobre lo que de verdad te quedó dando vueltas, sí.
    pregunta_espejo: |-
      De todo lo del periodo, ¿qué me siguió dando vueltas después de la clase?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 21 (c. 175 d.C.)
    cita: |-
      Si alguno pudiese convencerme y hacerme patente que yo no pienso con rectitud u obro bien, con mucho gusto mudaría de dictamen y de conducta; porque yo busco la verdad, la cual jamás dañó a ninguno.
    aplicacion: |-
      Esa frase es el párrafo de límites, dicho hace mil ochocientos años. Sostener una posición y estar dispuesto a cambiarla no se contradicen: es lo que separa pensar de repetir.
    pregunta_espejo: |-
      ¿Qué tendría que mostrarme alguien para que yo cambiara la posición que escribí hoy?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    cita: |-
      La partida la ganarán quienes «sepan preguntar y responder» (Platón, Crátilo 390c) y, por tanto, sepan qué datos pueden ser útiles y relevantes, y merecen recogerse y cuidarse. (trad. propia)
    aplicacion: |-
      En la sustentación se ve. Quien preparó su posición sabe qué preguntas puede recibir y cuáles no sabe contestar todavía. Anticipar la pregunta difícil vale más que ensayar la respuesta fácil.
    pregunta_espejo: |-
      ¿Cuál es la pregunta que menos quiero que me hagan sobre mi manifiesto?
compromiso: |-
  \textbf{Para el periodo que viene.} Guarda el manifiesto donde puedas encontrarlo. Pon una fecha dentro de un mes para volver a leerlo y anotar si cumpliste la propuesta. En el periodo 2 entras al diseño editorial, y ahí tu posición sobre la técnica se pone a prueba con piezas reales.
web:
  resumen: |-
    En los congresos del CRIC las normas que rigen a todos se llaman mandatos, salen de días de discusión y después hay que rendir cuentas de cuáles se cumplieron. Un mandato no vale por estar escrito: vale porque quienes lo hicieron vuelven a mirarlo. Hoy escribes algo mucho más pequeño que aprende de eso: tu posición sobre la técnica, con sus límites y con fecha para volver a mirarla.
  subtema: Cosecha · Cierre del periodo 1
  pre_lectura:
    por_que_importa: |-
      Una posición que nunca se vuelve a mirar se convierte en una frase bonita. Lo que la sostiene es la fecha en que te comprometes a releerla.
    pregunta_detonante: |-
      De todo lo que viste este periodo, ¿qué idea te cambió algo de lo que hacías?
    activacion:
      titulo: La frase que quedó
      descripcion: |-
        En 2 minutos, escribe una sola frase que empiece por «creo que la técnica…». No la corrijas todavía: es tu punto de partida.
      duracion_min: 3
    conexion:
      anterior: En la sesión 9 defendiste una tecnología propia con evidencia y con su desventaja.
      siguiente: En el periodo 2 entras al diseño editorial y pones tu posición a prueba con piezas reales.
  mapa_ruta:

titulo: La rueda y el agua --- máquinas simples del campo colombiano
producto_final: |-
  Análisis dibujado de 3 máquinas simples cotidianas (trapiche, noria/molino, polea), explicando qué hacen, cómo y por qué se diseñaron así
saber_ancestral_idea: |-
  El trapiche del Valle, la noria del campo y el molino de agua del Pacífico aprovechan principios de la física para multiplicar la fuerza humana. No son tecnología obsoleta: son tecnología eficiente que sigue funcionando porque tiene buen diseño.

clave: 1-2
grado: 9
periodo: 1
sesion: 2
completo: true
duracion_min: 90
titulo: La rueda y el agua --- máquinas simples del campo colombiano
titulo_portada: |-
  La rueda y el agua ---
  máquinas simples
  del campo
producto_final: |-
  Tres dibujos a mano de máquinas del campo colombiano: un trapiche, una noria o molino de agua y una polea. Cada dibujo lleva al menos cuatro piezas rotuladas con su nombre, dice cuál de las seis máquinas simples opera adentro y lo justifica en una frase. Cada uno responde además las dos preguntas que importan: qué multiplica y qué pide a cambio.
apertura:
  origen: Río La Vieja en Cartago · el nivel que se mira en Puerto Alejandría
  fuente: |-
    CiudadRegión. (2022, 7 de marzo). \emph{Alarma por alto nivel del río La Vieja a su paso por Cartago}. CiudadRegión Noticias.
  saber_ancestral: |-
    El río La Vieja bordea a Cartago y le pone frontera con Risaralda. Ese mismo río movió trapiches y molinos, porque el agua que corre es fuerza gratis para quien sepa tomarla. Pero el agua cobra. Cuando crece no se lleva la ciudad entera: se lleva siempre los mismos barrios. Brisas del Río, La Platanera, La Arenera, La Playa y Tierra del Olvido quedaron bajo el agua en marzo de 2022. El río llegó a 12,3 metros. Y la gente no adivina la creciente: la mira. \textbf{Puerto Alejandría} es el punto al que se va a ver el nivel. Es la referencia con la que se compara cómo está hoy contra cómo estaba ayer. Ese es el miedo que protege: no el que paraliza, sino el que enseña a qué hay que mirarle el nivel. La \textbf{cara de exclusión}: el riesgo está repartido por clase y por ubicación, no por azar.
  saber_contemporaneo: |-
    Hay seis máquinas simples y todas las demás son combinaciones de ellas. \textbf{Palanca}, \textbf{rueda con eje}, \textbf{polea}, \textbf{plano inclinado}, \textbf{cuña} y \textbf{tornillo}. Cada una hace lo mismo en el fondo: cambia la relación entre la fuerza que pones y el efecto que consigues. Eso se llama \textbf{ventaja mecánica}. Y aquí está la regla que nadie puede saltarse: ninguna máquina regala energía. Si ganas fuerza, pierdes distancia. Si ganas distancia o velocidad, pierdes fuerza. El trapiche multiplica lo que empuja el buey, y a cambio el buey camina muchas vueltas. La polea del pozo te deja subir el balde tirando hacia abajo, y a cambio jalas la misma cantidad de cuerda. Por eso una sola pregunta basta para entender cualquier máquina: qué multiplica y qué pide a cambio. Si solo sabes contestar la primera mitad, todavía no la entendiste.
  pregunta_puente: |-
    El río da fuerza gratis y cobra creciendo sobre los mismos barrios. ¿Qué máquina de tu casa te da algo a cambio de un costo que casi nunca miras?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las seis máquinas simples en objetos de tu entorno, con un ejemplo de cada una; (2) \textbf{explicar} qué multiplica cada máquina y qué pide a cambio, sin saltarte la segunda mitad; (3) \textbf{crear} tres dibujos analíticos de máquinas del campo colombiano con sus piezas rotuladas.
puentes:
  a_ruta: |-
    En la sesión 1 definiste qué es técnica y viste que la máquina automatiza con energía propia. Hoy abres esa caja y miras qué hay adentro. En la sesión 3 llega la balanza, que es una palanca dedicada a medir.
  a_escuta: |-
    Antes de la teoría vas a cazar las seis máquinas simples a tu alrededor. Están todas, aunque no las llames así.
  a_sistematizacion: |-
    Ya las encontraste. Ahora vas a entender por qué ninguna regala nada, y a poder decir en cada caso qué se paga.
  a_praxis: |-
    Tienes la regla. Toca dibujar tres máquinas reales del campo y señalar dentro de cada una cuál de las seis está operando.
  a_producto: |-
    Lo que entregas hoy: tres dibujos con piezas rotuladas y la máquina simple identificada. La prueba de calidad: un compañero los lee sin que le expliques nada.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. «Simple» no quiere decir «primitivo»: quiere decir que no se puede descomponer en algo más básico.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre diseño y costo: Dussel sobre la coherencia formal del producto, Séneca sobre lo que nos aterra frente a lo que nos aprieta, Floridi sobre lo único que no se puede compartir.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Las seis a tu alrededor} (15 min · individual). (1) Encuentra un ejemplo cotidiano de cada una de las seis máquinas simples. Palanca, rueda con eje, polea, plano inclinado, cuña y tornillo. (2) Pueden estar en tu casa, tu mochila, la calle o una bicicleta. (3) Escribe para cada una qué hace y qué te ahorra. (4) Marca las dos que te costó más encontrar y anota por qué.
  checks:
  - Tengo un ejemplo real de cada una de las seis.
  - Escribí qué hace y qué me ahorra en cada caso.
  - Marqué las dos que me costó más encontrar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Las seis a mi alrededor». \textbf{Formato:} tabla de 6 filas y 3 columnas (máquina simple / objeto real / qué me ahorra), con marca en las dos más difíciles. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las seis filas tienen un objeto concreto, no una categoría.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Qué multiplica y qué pide} (20 min · parejas). (1) Con tu pareja, tomen tres de sus doce objetos y escriban quién aplica la fuerza en cada uno. (2) Escriban qué multiplica cada uno: fuerza, velocidad o dirección. (3) Escriban qué pide a cambio, que siempre es distancia, tiempo o recorrido. (4) Busquen un objeto donde la segunda parte no sea evidente y discútanlo hasta poder escribirla.
  pilares:
  - |-
    \textbf{Las seis y ninguna más.} Palanca, rueda con eje, polea, plano inclinado, cuña y tornillo. Todo lo demás es combinación. Un trapiche es rueda y palanca; una escalera es plano inclinado repetido.
  - |-
    \textbf{Ninguna regala energía.} Si ganas fuerza, pierdes distancia. Si ganas distancia, pierdes fuerza. Esa es la regla, y no depende del material ni de la época. El buey del trapiche camina muchas vueltas por una razón física, no por costumbre.
  - |-
    \textbf{La pregunta doble.} Qué multiplica y qué pide a cambio. Casi todo el mundo sabe contestar la primera mitad. La segunda es la que separa entender de repetir.
  - |-
    \textbf{«Simple» no es «primitivo».} Simple quiere decir que no se puede descomponer en algo más básico. Una noria bien hecha aprovecha una fuerza gratuita durante décadas sin consumir nada, y eso no lo hace ningún motor.
  anatomia:
    titulo: Cualquier máquina, en cuatro preguntas
    body: |-
      \textbf{1. Fuerza:} ¿quién la aplica, persona, animal o agua? \\[1mm] \textbf{2. Máquina simple:} ¿cuál de las seis opera adentro? \\[1mm] \textbf{3. Multiplica:} ¿fuerza, velocidad o dirección? \\[1mm] \textbf{4. Pide a cambio:} ¿distancia, tiempo o recorrido?
  errores_comunes: |-
    (1) \textbf{Creer que la máquina crea fuerza}: la redistribuye, no la fabrica. (2) \textbf{Contestar solo qué multiplica}: sin el costo, el análisis está a medias. (3) \textbf{Confundir simple con primitivo}: simple es que no se descompone más. (4) \textbf{Olvidar quién aplica la fuerza}: en el trapiche es el buey o el motor, y eso cambia todo el análisis. (5) \textbf{Dibujar sin rotular}: un dibujo sin nombres no se puede leer ni corregir.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Qué multiplica y qué pide». \textbf{Formato:} tres objetos analizados con las cuatro preguntas, más el caso difícil con su costo escrito. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} los tres tienen escrita la segunda mitad, la del costo.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tres dibujos analíticos} (30 min · individual). (1) Dibuja a mano un trapiche, una noria o molino de agua y una polea. (2) Rotula al menos cuatro piezas de cada uno con su nombre. (3) Escribe en cada dibujo cuál de las seis máquinas simples opera adentro. (4) Justifica esa identificación en una frase. (5) Añade en cada uno qué multiplica y qué pide a cambio. (6) Pásaselos a un compañero y anota qué no entendió sin que le explicaras.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres dibujos y una prueba.} Los tres con piezas rotuladas, máquina simple identificada y la pregunta doble contestada. Y lo que dijo tu compañero al leerlos solo.
  - |-
    \textbf{Dibujar a mano obliga a entender.} Copiar una foto no sirve: al dibujar hay que decidir qué pieza va sobre cuál, y ahí se ve si sabes cómo funciona. Los dibujos feos que están bien valen más que los bonitos que están mal.
  - |-
    \textbf{Rotular es la mitad del trabajo.} «Eje», «canal», «cangilón», «masa», «cuja». Si no conoces el nombre de una pieza, averígualo o descríbela; lo que no vale es dejarla sin nombre.
  - |-
    \textbf{La noria es el caso más interesante.} Usa una fuerza que no se agota y que no le cuesta a nadie... salvo cuando el río crece. Ese doble filo es exactamente lo que hay que anotar.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tres dibujos a mano: trapiche, noria o molino, y polea. \\[1mm] \checkbox Al menos cuatro piezas rotuladas en cada uno. \\[1mm] \checkbox Identificada la máquina simple que opera adentro. \\[1mm] \checkbox Justificación en una frase por dibujo. \\[1mm] \checkbox Qué multiplica y qué pide a cambio, en los tres. \\[1mm] \checkbox Un compañero los leyó sin explicación.
  plantilla_guion: |-
    \textbf{Máquina.} \textit{Cuál es y dónde se usa.} \\[1mm] \textbf{Piezas.} \textit{Cuatro nombres rotulados.} \\[1mm] \textbf{Máquina simple.} \textit{Cuál de las seis y por qué.} \\[1mm] \textbf{Multiplica.} \textit{Fuerza, velocidad o dirección.} \\[1mm] \textbf{Pide a cambio.} \textit{Distancia, tiempo o recorrido.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Tres dibujos analíticos». \textbf{Formato:} los tres dibujos con sus piezas rotuladas, la máquina simple identificada y la pregunta doble contestada en cada uno. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} un compañero leyó los tres sin preguntarte nada.
  producto_titulo: Tres dibujos analíticos de máquinas del campo con piezas rotuladas
  criterios:
  - Los tres dibujos están hechos a mano, no copiados de una foto
  - Cada uno tiene al menos cuatro piezas rotuladas con su nombre
  - Cada uno identifica cuál de las seis máquinas simples opera adentro
  - Cada uno dice qué multiplica y qué pide a cambio
  - Un compañero los leyó sin explicación adicional
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.3.1.2
    cita: |-
      El tema esencial del diseño es el de dotar al producto de coherencia formal; incluye a la tecnología… por cuanto esto significa coherencia funcional: el del valor del uso; incluye a la estética, porque la coherencia formal, en cuanto tal, es la belleza del producto.
    aplicacion: |-
      Un trapiche bien hecho es bonito porque está bien resuelto, no al revés. Cuando dibujes, fíjate en que casi ninguna pieza sobra: eso es coherencia formal, y se nota en objetos que nadie diseñó en una oficina.
    pregunta_espejo: |-
      ¿Qué objeto de mi casa me parece bonito solo porque está bien resuelto?
  estoico:
    autor: Séneca · Cartas a Lucilio, 13 (c. 64 d.C.)
    cita: |-
      Muchas más son, Lucilio, las cosas que nos aterran que las que realmente nos aprietan; frecuentemente sufrimos más por las opiniones que por la realidad.
    aplicacion: |-
      En Cartago la gente no adivina la creciente: mira el nivel en Puerto Alejandría. Esa es la diferencia entre el miedo que paraliza y el que protege. Un dato medido tranquiliza más que cien suposiciones.
    pregunta_espejo: |-
      ¿Qué cosa me preocupa sin que yo haya mirado nunca su nivel de verdad?
  floridi:
    autor: Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 4.6
    cita: |-
      Lo que en última instancia es finito, precioso, no renovable e incompartible es, en realidad, el tiempo. (trad. propia)
    aplicacion: |-
      Esa es la moneda con la que se paga casi toda ventaja mecánica. La polea te ahorra fuerza y te cobra cuerda; el trapiche ahorra esfuerzo y cobra vueltas. Casi siempre lo que se entrega a cambio es tiempo.
    pregunta_espejo: |-
      ¿Qué máquina uso a diario que me ahorra esfuerzo y me cobra tiempo sin que lo note?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con los tres dibujos rotulados. Si puedes, mira una máquina real de tu barrio y cuéntale a alguien qué multiplica y qué pide a cambio. En la sesión 3 vas a construir una balanza, que es una palanca dedicada a medir.
web:
  resumen: |-
    El río La Vieja movió trapiches y molinos, y al crecer se lleva siempre los mismos barrios de Cartago. La gente no adivina la creciente: mira el nivel en Puerto Alejandría. Hoy abres las máquinas del campo y aprendes la regla que ninguna puede saltarse: si ganas fuerza, pierdes distancia. Qué multiplica y qué pide a cambio.
  subtema: Historia de la técnica · Máquinas simples
  pre_lectura:
    por_que_importa: |-
      Casi todo el mundo sabe decir qué le ahorra una máquina. Casi nadie sabe decir qué le cobra, y ahí está la mitad que importa.
    pregunta_detonante: |-
      ¿Qué máquina usas todos los días sin saber qué está multiplicando exactamente?
    activacion:
      titulo: Fuerza gratis
      descripcion: |-
        En 2 minutos, piensa en algo que hoy hiciste con menos esfuerzo del que costaría a mano. ¿Qué entregaste a cambio?
      duracion_min: 3
    conexion:
      anterior: En la sesión 1 definiste qué es técnica y distinguiste cuerpo, herramienta y máquina.
      siguiente: En la sesión 3 construyes una balanza y ves por qué medir nunca fue neutral.

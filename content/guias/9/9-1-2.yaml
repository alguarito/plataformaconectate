clave: 1-2
grado: 9
periodo: 1
sesion: 2
completo: true
titulo: La rueda y el agua --- máquinas simples del campo colombiano
titulo_portada: |-
  La rueda y el agua ---
  máquinas simples
  del campo colombiano
producto_final: Análisis dibujado de 3 máquinas simples cotidianas (trapiche, noria/molino, polea) explicando qué hacen, cómo y por qué se diseñaron así
apertura:
  saber_ancestral: |-
    El \textbf{trapiche} del Valle del Cauca exprime caña con una rueda y dos rodillos: el animal o el motor empuja, los rodillos aplastan, el jugo cae. La \textbf{noria} del campo subía agua de pozos profundos con baldes pegados a una rueda que giraba con la corriente del río o un buey caminando. El \textbf{molino de agua} del Pacífico aprovechaba el desnivel de un arroyo para mover una piedra que molía maíz o café. Tres ejemplos de máquinas simples \emph{ingeniosas} que existían siglos antes de la electricidad.
  origen: Trapiche del Valle, noria del campo y molinos de agua del Pacífico colombiano
  saber_contemporaneo: |-
    Las máquinas modernas que usas todos los días --- la bicicleta, el destornillador, la rueda de tu maleta, la palanca de un descorchador --- son combinaciones de las mismas \textbf{seis máquinas simples} que los pueblos resolvieron hace miles de años: \textbf{palanca, rueda, polea, plano inclinado, cuña y tornillo}. La física detrás no ha cambiado. Lo que cambia son los materiales (madera/hierro/plástico), la escala (humano/industrial), y la fuente de energía (animal/agua/electricidad).
  pregunta_puente: |-
    ¿Qué hace que una máquina simple del campo colombiano siga funcionando hoy con la misma eficiencia que cuando se inventó? ¿Y qué pierde una máquina moderna cuando deja de funcionar sin electricidad?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 6 máquinas simples y dar 1 ejemplo cotidiano de cada una; (2) \textbf{analizar} 3 máquinas simples reales del campo colombiano (trapiche, noria, polea) descomponiéndolas en sus partes; (3) \textbf{explicar} por qué siguen funcionando aunque parezcan ``atrasadas''; (4) \textbf{crear} un dibujo analítico de 3 máquinas con sus piezas etiquetadas.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 1 te dio una definición de técnica; hoy bajamos a ejemplos concretos --- las máquinas más antiguas del campo colombiano. Verás que ``simple'' no significa ``primitivo''.
  a_escuta: |-
    Antes de hablar de física de máquinas, vamos a mirar las máquinas que están alrededor tuyo: en la cocina, en la calle, en la bicicleta. Cada una tiene una de las 6 máquinas simples adentro. Entrenar el ojo es el primer paso.
  a_sistematizacion: |-
    Ya viste máquinas simples en tu entorno. Ahora vamos a entender los \textbf{tres elementos físicos} que comparten todas: fuerza aplicada, ventaja mecánica, y trabajo realizado. Esa terna explica por qué un trapiche multiplica la fuerza humana sin gastar más energía.
  a_praxis: |-
    Tienes el vocabulario. Toca producir: 3 dibujos analíticos de máquinas reales del campo --- trapiche, noria/molino, polea --- con sus piezas etiquetadas y la explicación de qué máquina simple opera detrás.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: 3 dibujos con análisis. El criterio principal: que cada dibujo identifique CUÁL de las 6 máquinas simples es y por qué.
  a_evaluacion: |-
    Antes de cerrar, mira las máquinas simples desde las cinco dimensiones humanas. ¿Por qué siguen vivas? ¿Qué del Valle, del Pacífico, del campo colombiano se nombra cuando las dibujas?
  a_triangulo: |-
    Y para terminar, tres voces sobre las máquinas. Dussel sobre las tecnologías ``descartadas'' por la modernidad, Marco Aurelio sobre la elegancia del diseño que dura, Floridi sobre las máquinas que funcionan sin pedirle nada al planeta.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Las 6 máquinas simples en tu entorno} (15 min · individual). Sin moverte mucho, encuentra UN ejemplo cotidiano de cada una de las 6 máquinas simples: \textbf{palanca, rueda, polea, plano inclinado, cuña, tornillo}. Pueden ser de tu casa, mochila, calle, bicicleta. Para cada una: ¿qué hace y cómo multiplica tu fuerza?
  checks:
  - Encontré 6 ejemplos, uno de cada máquina simple.
  - Para cada ejemplo identifiqué qué fuerza multiplica o cambia de dirección.
  - Al menos uno de mis 6 ejemplos viene del campo colombiano o de un oficio tradicional.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Las 6 máquinas simples a mi alrededor». \textbf{Formato:} tabla de 3 columnas (Máquina simple~|~Ejemplo cotidiano~|~Qué fuerza multiplica/cambia), 6 filas. \textbf{Sabes que terminaste cuando} cada ejemplo es concreto (no ``rueda'' sino ``rueda de mi maleta de viaje''), y al menos uno viene del campo o de un oficio tradicional.
sistematizacion:
  intro: |-
    Toda máquina simple comparte 3 elementos físicos. Vamos a descomponerlos con los pilares del pensamiento computacional para que sepas qué buscar al analizar cualquier máquina.
  pilares:
  - |-
    Una máquina simple se descompone en 3 elementos: (1) \textbf{fuerza aplicada} (la que tú o el animal o el agua entregan), (2) \textbf{ventaja mecánica} (la relación que multiplica esa fuerza o cambia su dirección), (3) \textbf{trabajo realizado} (lo que sale --- jugo extraído, agua subida, peso levantado).
  - |-
    Toda máquina simple sigue el patrón \textbf{``ganancia con costo''}: ganas fuerza pero pierdes distancia (o al revés). Un trapiche multiplica la fuerza del buey pero el buey debe caminar muchas vueltas. Una polea simple solo cambia la dirección pero no multiplica nada. No hay máquina simple gratis.
  - |-
    Lo esencial de una máquina simple cabe en una pregunta: \emph{¿qué multiplica y qué pide a cambio?}. Si no puedes contestar las dos partes, todavía no la has entendido.
  - |-
    Pasos para analizar cualquier máquina: (1) ¿quién aplica la fuerza?; (2) ¿qué máquina simple opera adentro (cuál de las 6)?; (3) ¿qué multiplica (fuerza, velocidad, dirección)?; (4) ¿qué pide a cambio (distancia, vueltas, energía)?.
  anatomia:
    titulo: Anatomía de una máquina simple
    body: |-
      \textbf{Fuerza entrada:} ¿quién aplica el esfuerzo (mano, buey, agua, motor)? \\[1mm] \textbf{Mecanismo:} ¿qué máquina simple? \\[1mm] \textbf{Ventaja mecánica:} ¿multiplica fuerza o velocidad? \\[1mm] \textbf{Trabajo salida:} ¿qué se logra (mover, levantar, exprimir)? \\[1mm] \textbf{Costo:} ¿qué pide a cambio (distancia, tiempo, energía adicional)?
  errores_comunes: |-
    (1) Pensar que ``máquina simple'' significa pequeña --- un trapiche es máquina simple aunque sea enorme. (2) Confundir máquina simple con máquina compleja --- la bicicleta combina varias. (3) Creer que las máquinas modernas son ``mejores'' --- a veces sí, a veces solo más caras o más dependientes. (4) Olvidar el costo: toda ganancia mecánica tiene contrapartida.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Cuál de las 3 máquinas tradicionales es la más eficiente». \textbf{Formato:} 3 fichas, una por máquina (trapiche, noria/molino, polea), cada una con los 5 elementos de la anatomía (fuerza entrada, mecanismo, ventaja, trabajo salida, costo). \textbf{Veredicto razonado (4-5 líneas):} comparando las 3, ¿cuál te parece la más eficiente respecto al esfuerzo humano que ahorra? ¿Y cuál la más sostenible para usarse hoy en una finca del Valle? Justifica cada juicio con 2 criterios distintos. \textbf{Sabes que terminaste cuando} tu veredicto distingue \emph{eficiencia técnica} de \emph{viabilidad cultural} --- no siempre coinciden.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- 3 dibujos analíticos de máquinas reales} (30 min · individual). Hora de dibujar. Vas a hacer 3 dibujos a mano de máquinas simples reales del campo colombiano, con sus piezas etiquetadas y la máquina simple que opera adentro nombrada explícitamente.
  pilares:
  - |-
    Cada dibujo se descompone en 4 capas: (1) el dibujo a mano del objeto completo, (2) flechas que señalan las piezas clave, (3) etiquetas que nombran cada pieza, (4) un cuadro abajo con la máquina simple identificada (de las 6).
  - |-
    Sigue el patrón ``mirar antes de dibujar'': si nunca has visto un trapiche real (o en foto), búscalo en internet 30 segundos antes de dibujar. Si dibujas de memoria sin ver, tu dibujo será simbólico, no técnico.
  - |-
    Cada dibujo expresa una sola idea principal: cuál máquina simple hace el trabajo. Si tu dibujo está lleno de detalles decorativos (gente, animales, paisaje) pero no se ve la rueda o la palanca, no sirve como análisis técnico.
  - |-
    Algoritmo: (1) busca foto de la máquina; (2) dibújala a mano (5 min, no precisión, claridad); (3) marca con flechas las 4-6 piezas principales; (4) etiquétalas; (5) escribe abajo: ``Máquina simple identificada: \_\_\_'' y ``Por qué: \_\_\_''.
  checklist:
    titulo: Checklist antes de cerrar los 3 dibujos
    items: |-
      \checkbox 3 dibujos a mano (trapiche + noria/molino + polea) en páginas separadas o agrupadas. \\[1mm] \checkbox Cada uno con al menos 4 piezas etiquetadas (no ``cosa redonda''). \\[1mm] \checkbox Cada uno identifica explícitamente cuál máquina simple opera (de las 6). \\[1mm] \checkbox Cada uno justifica en 1 frase \emph{por qué} es esa máquina simple. \\[1mm] \checkbox Cero copias de imágenes pegadas --- todo a mano.
  plantilla_guion: |-
    \textbf{Dibujo 1 · Trapiche.} \textit{Dibujo + piezas + máquina simple identificada + justificación.} \\[1mm] \textbf{Dibujo 2 · Noria o molino.} \textit{Lo mismo.} \\[1mm] \textbf{Dibujo 3 · Polea.} \textit{Lo mismo, puede ser de un pozo, una grúa o una persiana.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- 3 máquinas simples dibujadas». \textbf{Formato:} 3 dibujos a mano con etiquetas + cuadro de identificación + justificación. \textbf{Extensión:} una página por dibujo, total tres páginas. \textbf{Sabes que terminaste cuando} cualquier compañero puede mirar tu dibujo y decir, sin que le expliques, cuál máquina simple opera adentro.
  producto_titulo: 3 dibujos analíticos de máquinas simples colombianas con piezas etiquetadas
  criterios:
  - 3 dibujos a mano (trapiche + noria/molino + polea)
  - Cada dibujo tiene al menos 4 piezas etiquetadas con nombres concretos
  - Cada dibujo identifica explícitamente cuál de las 6 máquinas simples opera
  - Cada dibujo justifica esa identificación en 1 frase
  - Un compañero puede leer los dibujos sin explicación adicional
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Lo que la modernidad llama ``atrasado'' suele ser lo que el planeta puede sostener.
    aplicacion: |-
      El trapiche, la noria y el molino de agua existen hace siglos porque funcionan sin petróleo, sin chips, sin actualización de software. La modernidad los descartó como ``obsoletos'', pero la crisis climática los está revaluando: tecnologías que aprovechan agua, viento y animal son hoy modelos de sostenibilidad. Dussel diría: lo descartado del sur es lo que el norte ahora necesita aprender.
    pregunta_espejo: |-
      ¿Qué tecnologías locales del Valle, el Pacífico o el campo colombiano consideré ``atrasadas'' sin haberlas mirado bien? ¿Cuáles funcionan hoy mejor que sus reemplazos modernos?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Lo que está bien hecho con poco material durará más que lo hecho con mucho material y poco diseño.
    aplicacion: |-
      Una polea bien diseñada en madera dura siglos. Un mecanismo electrónico mal diseñado dura años. La elegancia estoica del diseño no está en cuánto material usas --- está en cuán ajustado está cada parte a su función. El trapiche del Valle es una clase de elegancia técnica que muchos diseños modernos no alcanzan.
    pregunta_espejo: |-
      ¿De los objetos técnicos que uso, cuáles están bien diseñados (durarán) y cuáles están sobrediseñados (se romperán pronto)? ¿Qué de mi cotidianidad envejecerá bien?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Una tecnología que no pide al planeta más de lo que devuelve es una tecnología ética por diseño.
    aplicacion: |-
      Las máquinas simples del campo --- trapiche con buey, noria con agua, molino con corriente --- son éticas por diseño: aprovechan fuerzas que el planeta ya ofrece gratis. La infoesfera moderna se basa en máquinas complejas que consumen electricidad masiva. Floridi nos invita a preguntar: ¿qué tecnologías del pasado siguen siendo más éticas que sus reemplazos digitales?
    pregunta_espejo: |-
      ¿Qué tecnología que uso a diario depende de fuentes de energía que dañan el planeta? ¿Y qué tecnología más antigua resolvería lo mismo con menos costo ambiental?
compromiso: |-
  \textbf{Para la próxima semana.} Cada vez que veas una máquina cotidiana, pregúntate: ``¿cuál de las 6 máquinas simples opera adentro?'' (bicicleta, tijeras, descorchador, persiana, ascensor, escalera mecánica). Anota 5 ejemplos durante la semana. El próximo lunes traemos la lista al aula y comparamos --- es asombroso cuántas máquinas simples están escondidas en lo moderno.
web:
  resumen: |-
    Las 6 máquinas simples explicadas con 3 tecnologías colombianas: trapiche, noria y polea. "Simple" no significa "primitivo".
  subtema: Historia de la técnica · Máquinas simples
  pre_lectura:
    por_que_importa: |-
      Una máquina simple bien diseñada multiplica tu fuerza sin gastar más energía. Las del campo colombiano siguen funcionando porque su diseño es elegante — y muchas son más sostenibles que sus reemplazos modernos.
    pregunta_detonante: |-
      Si tu casa se quedara sin electricidad por una semana, ¿qué máquinas simples del campo te harían la vida más fácil?
    activacion:
      titulo: La mochila como máquina
      descripcion: |-
        En 3 minutos, mira tu mochila o cualquier objeto cerca y encuentra al menos una máquina simple "escondida" dentro: el cierre (cuña), las correas con hebilla (palanca), las ruedas si las tiene. Lo "moderno" suele esconder lo "antiguo".
      duracion_min: 3
    conexion:
      anterior: En la sesión 1 definiste qué es técnica y la distinguiste de cuerpo, herramienta y máquina.
      siguiente: |-
        En la sesión 3 verás la balanza como ejemplo de técnica que NO multiplica fuerza pero sí construye confianza social.
  conceptos_clave:
    - termino: Palanca
      definicion: |-
        Barra rígida que pivota sobre un punto de apoyo. Multiplica fuerza cuando el brazo de la fuerza es más largo que el brazo de la resistencia.
      ejemplo: |-
        Un destornillador como palanca para abrir una lata. El brazo del destornillador es largo, el punto de apoyo es la tapa, ganas fuerza.
      emoji: "➖"
    - termino: Rueda y eje
      definicion: |-
        Rueda grande unida a un eje pequeño. Al girar la rueda, el eje hace más fuerza pero en menos distancia. Es la base del trapiche y la noria.
      ejemplo: |-
        La rueda de tu bicicleta: tú pedaleas un círculo grande, el piñón mueve uno pequeño. Cambias velocidad por torque (o al revés).
      emoji: "⚙️"
    - termino: Polea
      definicion: |-
        Rueda con surco por donde pasa una cuerda. Una polea simple cambia la dirección de la fuerza; varias poleas combinadas multiplican fuerza.
      ejemplo: |-
        En un pozo, halas la cuerda hacia abajo y el balde sube. Una sola polea no multiplica, solo redirige — pero te permite usar el peso del cuerpo.
      emoji: "🪢"
    - termino: Plano inclinado
      definicion: |-
        Superficie en ángulo que permite subir un peso a una altura aplicando menos fuerza pero recorriendo más distancia.
      ejemplo: |-
        Una rampa de bodega: subes un saco de café por la rampa con menos esfuerzo que cargándolo vertical, pero caminas más.
      emoji: "📐"
    - termino: Cuña
      definicion: |-
        Dos planos inclinados unidos. Concentra una fuerza grande en un filo pequeño. Es la base del cuchillo, el hacha y la cremallera.
      ejemplo: |-
        El filo del machete del campo: la cuña concentra la fuerza de tu brazo en un milímetro de filo. Por eso corta lo que la mano sola no puede.
      emoji: "🔻"
    - termino: Tornillo
      definicion: |-
        Plano inclinado enrollado alrededor de un cilindro. Convierte rotación en avance lineal. Multiplica fuerza pero exige muchas vueltas.
      ejemplo: |-
        Un tornillo de carpintería: con un destornillador y poca fuerza puedes apretar mucho. La energía la pones en vueltas, no en kilos.
      emoji: "🔩"
  quiz:
    titulo: "✅ Verifica las 6 máquinas simples"
    instrucciones: |-
      5 preguntas para confirmar que reconoces las 6 máquinas simples en lo cotidiano. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: En un trapiche del Valle del Cauca, ¿cuál es la máquina simple principal que opera?
        opciones:
          - Plano inclinado
          - Rueda y eje
          - Polea
          - Cuña
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El trapiche usa rueda y eje: una rueda grande (la que mueve el animal o el motor) hace girar el eje que aprieta los rodillos.
        feedback_incorrecto: |-
          Es rueda y eje. La rueda grande del trapiche multiplica la fuerza del buey o motor a través del eje que aprieta los rodillos.
      - enunciado: ¿Qué máquina simple esconde una rampa para subir cajas a un camión?
        opciones:
          - Polea
          - Plano inclinado
          - Tornillo
          - Palanca
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La rampa es un plano inclinado. Subes el peso con menos fuerza pero recorriendo más distancia. Toda ganancia mecánica tiene contrapartida.
        feedback_incorrecto: |-
          Plano inclinado. La rampa te deja subir con menos fuerza, a cambio de caminar más distancia. El intercambio fuerza-distancia es la lógica de toda máquina simple.
      - enunciado: ¿Cuál es el "costo" típico de una máquina simple?
        opciones:
          - No tiene costo, es gratis
          - Gastar más energía
          - Si ganas fuerza, pierdes distancia (o al revés)
          - Romperse rápido
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. No hay máquina simple gratis: si multiplicas la fuerza, recorres más distancia. La energía total no cambia.
        feedback_incorrecto: |-
          El intercambio es fuerza por distancia (o velocidad). Una palanca larga gana fuerza pero exige más recorrido del brazo. La energía total se conserva.
      - enunciado: ¿Por qué el cuchillo o el machete es un ejemplo de cuña?
        opciones:
          - Porque es metálico
          - Porque concentra la fuerza en un filo muy delgado
          - Porque tiene mango
          - Porque sirve para cortar comida
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La cuña concentra una fuerza grande en un área pequeña (el filo). Por eso un cuchillo corta lo que la mano sola no puede.
        feedback_incorrecto: |-
          La cuña concentra fuerza. La fuerza de tu brazo (grande, distribuida) se concentra en el filo (pequeño, puntual). Eso es lo que corta.
      - enunciado: En el saber ancestral del trapiche y la noria, ¿qué aplica directamente a las máquinas modernas?
        opciones:
          - Nada — las máquinas modernas son distintas
          - Las 6 máquinas simples y la lógica de intercambio fuerza-distancia
          - Que las antiguas eran más bonitas
          - Que las modernas son siempre mejores
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. Las 6 máquinas simples se inventaron hace miles de años y siguen siendo la base de toda máquina moderna. La física no cambió — solo los materiales y las escalas.
        feedback_incorrecto: |-
          La física se conserva: las 6 máquinas simples del trapiche son las mismas que están en tu bicicleta o en un robot industrial. Cambia el material, no el principio.
  post_lectura:
    transferencia: |-
      Esta semana, cada vez que veas una máquina cotidiana (bicicleta, tijeras, descorchador, persiana, ascensor, escalera mecánica), pregúntate: ¿cuál de las 6 máquinas simples opera adentro? Anota 5 ejemplos durante la semana. El próximo lunes compararemos las listas — es asombroso cuántas máquinas simples están escondidas en lo moderno.
  cinco_dimensiones:
    personal: |-
      Aprendiste a ver las 6 máquinas simples escondidas en lo cotidiano — y descubriste que lo "moderno" es lo "antiguo" en otro material.
    emocional: |-
      Sentiste respeto por el ingenio del trapiche, la noria y el molino — tecnologías locales que la modernidad llamó "atrasadas" sin razón.
    ciudadana: |-
      Conectaste el diseño técnico con la sostenibilidad: lo que funciona sin electricidad es lo que el planeta puede sostener.
    local: |-
      Anclaste el aprendizaje en tecnologías colombianas (trapiche del Valle, noria del campo, molino del Pacífico) como objetos de orgullo, no de vergüenza.
    intergeneracional: |-
      Heredaste un saber milenario: las 6 máquinas simples llevan siendo la base de toda tecnología desde Mesopotamia hasta tu bicicleta.

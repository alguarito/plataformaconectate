clave: 1-3
grado: 9
periodo: 1
sesion: 3
completo: true
titulo: La balanza y el peso --- medir como acto político
titulo_portada: |-
  La balanza y el peso ---
  medir como
  acto político
producto_final: Experimento de pesos con balanza casera + reflexión escrita (1 página) sobre quién decide los patrones de medida y por qué eso es político
apertura:
  saber_ancestral: |-
    Las \textbf{pesas de la plaza} del pueblo del Valle no eran objetos neutros: marcaban el patrón con el que se cobraba un saco de café, un kilo de panela, una libra de queso. Las \textbf{balanzas de los orfebres Quimbaya} servían para repartir el oro entre comunidades. Las \textbf{medidas coloniales} (vara, fanega, arroba) las impuso el rey de España y de un día para otro cambiaron cuánto valía la tierra de un campesino. Medir nunca fue neutral: medir es \emph{regular}, y quien define el patrón define el reparto.
  saber_contemporaneo: |-
    Hoy seguimos midiendo, pero los patrones los deciden \textbf{instituciones}: el Sistema Internacional (kilogramo, metro, segundo) está definido por agencias científicas en Francia y Suiza. Las \textbf{calificaciones escolares} (de 1 a 5 en Colombia, de 0 a 10 en otros países) son patrones que deciden quién pasa y quién no. Los \textbf{indicadores económicos} (PIB, IPC) son patrones que deciden si un país está ``bien''. Cada vez que aceptas una métrica sin preguntar quién la definió, aceptas también la política que viene con ella.
  pregunta_puente: |-
    ¿Qué patrones de medida estás usando hoy mismo (en tu vida escolar, social, digital) sin saber quién los definió? ¿Qué cambiaría si pudieras cambiar uno de ellos?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 5 patrones de medida que rigen tu vida y quién los define; (2) \textbf{construir} una balanza casera con materiales reciclados y validar su precisión; (3) \textbf{analizar} cómo cambia la realidad cuando cambia el patrón; (4) \textbf{evaluar} con criterio si un sistema de medición es justo o no.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 2 vio máquinas que multiplican fuerza; hoy ves un objeto sencillo que multiplica algo más sutil: la confianza social. Sin balanza confiable no hay comercio justo.
  a_escuta: |-
    Antes de hablar de patrones globales, mira los patrones que rigen tu día. ¿Quién decidió qué nota es ``buena''? ¿Quién decidió cuántos seguidores son ``muchos''? Cada métrica esconde una decisión política previa.
  a_sistematizacion: |-
    Ya viste patrones que rigen tu vida. Ahora vamos a entender los \textbf{tres elementos} de toda balanza: punto de apoyo, dos brazos, patrón conocido en uno de los brazos. Esa estructura es la misma desde el orfebre Quimbaya hasta la balanza digital del supermercado.
  a_praxis: |-
    Tienes el principio. Toca construir: una balanza casera con materiales reciclados (gancho de ropa, vasitos, una regla, un eje). Si tu balanza funciona, has heredado un oficio milenario sin que nadie te lo enseñara.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: balanza casera + reflexión escrita. El criterio principal: que la balanza distinga 2 pesos distintos y que la reflexión nombre 1 sistema de medición que rige tu vida y NO sea neutral.
  a_evaluacion: |-
    Antes de cerrar, mira el acto de medir desde las cinco dimensiones humanas. Las pesas de la plaza --- y las métricas de tu celular --- no son objetos neutrales. Vale la pena nombrar a quién sirven y a quién perjudican.
  a_triangulo: |-
    Y para terminar, tres voces sobre medir. Dussel sobre las medidas coloniales, Epicteto sobre lo que sí depende de ti cuando otros te miden, Floridi sobre la dataficación de la vida.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Patrones de medida en tu vida} (15 min · individual). Sin moverte mucho, anota \textbf{5 mediciones distintas} que regulan tu vida actual: nota de un examen, tiempo de pantalla, libras de comida en casa, número de seguidores en una red, calorías de un producto. Para cada una: ¿quién definió el patrón? ¿Qué pasa contigo según el resultado de esa medición?
  checks:
  - Identifiqué 5 mediciones que regulan mi vida actual.
  - Para cada una busqué (mentalmente o googleando) quién la define.
  - Encontré al menos UNA medición cuyo patrón me parece injusto o discutible.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 5 mediciones que rigen mi vida». \textbf{Formato:} tabla de 3 columnas (Medición~|~Quién define el patrón~|~Qué decide sobre mí), 5 filas. \textbf{Sabes que terminaste cuando} reconoces al menos UNA medición cuyo patrón te parece injusto o cuestionable y puedes explicar por qué.
sistematizacion:
  intro: |-
    Toda balanza --- de la plaza ancestral a la digital del supermercado --- comparte 3 elementos. Vamos a descomponerlos con los pilares del pensamiento computacional y veremos cómo ese diseño tan simple sostiene la confianza social.
  pilares:
  - |-
    Una balanza se descompone en 3 elementos: (1) \textbf{punto de apoyo} (donde se equilibra), (2) \textbf{dos brazos iguales} (uno para lo que se pesa, otro para el patrón), (3) \textbf{patrón conocido} (las pesas calibradas, la unidad acordada). Quita uno y la balanza miente.
  - |-
    Toda balanza sigue el patrón \textbf{``equilibrio = verdad''}: si los dos brazos se equilibran con un patrón conocido en un lado y lo desconocido en el otro, podemos confiar en que el peso es el del patrón. Sin patrón conocido, no hay verdad; sin equilibrio, tampoco.
  - |-
    Lo esencial de medir cabe en una pregunta: \emph{¿quién definió el patrón y qué decide a partir de él?}. Una balanza confiable necesita responder las dos.
  - |-
    Pasos para evaluar cualquier sistema de medición: (1) ¿qué se mide?; (2) ¿con qué patrón?; (3) ¿quién definió ese patrón y cuándo?; (4) ¿qué consecuencias prácticas tiene el resultado de la medición?.
  anatomia:
    titulo: Anatomía de un sistema de medición
    body: |-
      \textbf{Qué se mide:} la magnitud (peso, tiempo, conocimiento, popularidad). \\[1mm] \textbf{Patrón:} la unidad acordada (kilo, hora, nota, seguidor). \\[1mm] \textbf{Autoridad:} quién decide y mantiene el patrón. \\[1mm] \textbf{Instrumento:} la balanza, el reloj, el examen, el contador. \\[1mm] \textbf{Consecuencia:} qué pasa contigo según el resultado.
  errores_comunes: |-
    (1) Creer que las medidas son ``objetivas'' --- siempre dependen de un patrón humano. (2) Confundir precisión con justicia --- una balanza precisa puede medir un patrón injusto. (3) Olvidar quién definió el patrón. (4) No notar que aceptar una medida es aceptar también la política que viene con ella.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Sistemas de medición y poder». \textbf{Formato:} 3 fichas, una por sistema de medición elegido (puedes elegir entre nota escolar, IPC, peso corporal, seguidores en redes, etc.), cada una con los 5 elementos de la anatomía. \textbf{Sabes que terminaste cuando} las 3 fichas nombran explícitamente a la autoridad que define el patrón y al menos UNA consecuencia concreta para una persona real.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Balanza casera + reflexión política} (30 min · individual). Hora de hacer dos cosas: (a) construir una balanza casera que funcione, (b) escribir una reflexión de 1 página sobre un sistema de medición que rige tu vida.
  pilares:
  - |-
    Tu balanza casera se descompone en 4 piezas: un gancho de ropa o regla como brazo, dos vasos o tapas como platillos, hilo o cordón para colgarlos, un punto de apoyo (lápiz, dedo, clavo). Total cero pesos.
  - |-
    Sigue el patrón ``equilibrio antes de patrón'': primero asegura que tu balanza vacía se equilibra perfectamente (ambos platillos al mismo nivel). Después agrega lo que quieres comparar.
  - |-
    Cada peso que compares expresa una sola idea: ``este objeto pesa más/menos/igual que este otro''. No necesitas gramos exactos para el ejercicio --- la comparación es lo que importa.
  - |-
    Algoritmo: (1) construye la balanza; (2) verifica equilibrio en vacío; (3) pon UN objeto en cada platillo y observa cuál pesa más; (4) ahora invierte y verifica; (5) escribe la reflexión de 1 página sobre 1 sistema de medición que rige tu vida.
  checklist:
    titulo: Checklist antes de cerrar la actividad
    items: |-
      \checkbox Balanza casera construida y verificada (equilibra en vacío). \\[1mm] \checkbox Pude comparar correctamente al menos 2 pares de objetos. \\[1mm] \checkbox Foto o dibujo de la balanza en el cuaderno. \\[1mm] \checkbox Reflexión escrita de 1 página sobre 1 sistema de medición concreto. \\[1mm] \checkbox La reflexión nombra explícitamente a quién beneficia y a quién perjudica ese sistema.
  plantilla_guion: |-
    \textbf{Balanza casera.} \textit{Dibujo o foto + lista de materiales usados + observación de 2 comparaciones.} \\[1mm] \textbf{Reflexión escrita.} \textit{Elige 1 sistema de medición que rige tu vida y responde: (a) ¿qué mide?, (b) ¿quién definió el patrón?, (c) ¿a quién beneficia y a quién no?, (d) ¿qué cambiaría tú?}.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Balanza casera y reflexión política». \textbf{Formato:} (1) dibujo o foto de tu balanza con piezas etiquetadas, (2) bitácora corta de 2 comparaciones, (3) reflexión escrita de 1 página. \textbf{Extensión:} dos páginas. \textbf{Sabes que terminaste cuando} la balanza funciona y la reflexión nombra a quién beneficia y a quién perjudica un sistema concreto.
  producto_titulo: Balanza casera funcional + reflexión política sobre medir
  criterios:
  - La balanza casera se equilibra en vacío y permite comparar 2 objetos
  - Hay dibujo o foto de la balanza con piezas etiquetadas
  - La reflexión elige UN sistema de medición concreto
  - La reflexión nombra explícitamente quién define el patrón
  - La reflexión nombra a quién beneficia y a quién perjudica
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda imposición de medida es un acto de poder; toda recuperación de medida propia es un acto de liberación.
    aplicacion: |-
      Las medidas coloniales (vara, fanega, arroba) impuestas sobre el campesino indígena cambiaron lo que valía su tierra sin que él decidiera. Hoy las métricas digitales (algoritmos de redes, scores crediticios, calificaciones automáticas de IA) hacen algo parecido: deciden tu acceso sin que sepas el patrón. Recuperar el control sobre cómo te miden es un acto político actual.
    pregunta_espejo: |-
      ¿Qué medidas rigen mi vida sin que yo sepa de dónde vinieron? ¿Cuál podría empezar a cuestionar o sustituir por una propia?
  estoico:
    autor: Epicteto
    cita: |-
      No te perturbe lo que otros miden de ti; perturba\-te solo lo que tú mides en ti mismo.
    aplicacion: |-
      Que el algoritmo de TikTok te ``mida'' con likes no depende de ti. Que el sistema escolar te asigne una nota no depende totalmente de ti. Lo que sí depende: tu propia medida de avance, tu propia escala de qué hiciste bien hoy, tu propio criterio. La libertad estoica empieza por elegir cuál medida tomas como autoridad sobre tu vida.
    pregunta_espejo: |-
      ¿Qué medida externa estoy dejando que defina mi valor? ¿Qué medida interna podría sustituirla o complementarla?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La dataficación es una forma moderna de medición política: lo que se mide se vuelve real, lo que no se mide se invisibiliza.
    aplicacion: |-
      Cada vez que una plataforma decide qué medir de ti (clics, tiempo, ubicación, contactos) está construyendo una versión tuya. Lo que no mide queda fuera de tu identidad digital. Por eso elegir qué herramientas usar y qué datos compartir es un acto profundamente político --- decides qué de ti existe en la infoesfera.
    pregunta_espejo: |-
      ¿Qué de mí está siendo medido en este momento por alguna plataforma? ¿Qué de mí queda invisibilizado porque ningún sistema lo mide?
compromiso: |-
  \textbf{Para la próxima semana.} Por 3 días, anota cada vez que una medición decide algo sobre ti (nota, hora exacta del bus, conteo de calorías, seguidores que ganaste o perdiste, score de un videojuego). Al final de los 3 días lee la lista. Vas a notar que vivimos rodeados de medición silenciosa. El próximo lunes traemos esa bitácora al aula.

clave: 1-3
grado: 9
periodo: 1
sesion: 3
completo: true
duracion_min: 90
titulo: La balanza y el peso --- medir como acto político
titulo_portada: |-
  La balanza
  y el peso ---
  medir es decidir
producto_final: |-
  Una balanza casera que se equilibre en vacío y permita comparar dos objetos, con su dibujo o foto y las piezas rotuladas. La acompaña una reflexión de una página sobre un sistema de medición que rige tu vida: qué mide, con qué patrón, quién definió ese patrón, qué decide a partir del resultado y a quién le conviene que se mida así.
apertura:
  origen: Vereda de Saucío, Chocontá · las dos medidas del valor que encontró Fals Borda
  fuente: |-
    Fals Borda, O. (2017). \emph{Campesinos de los Andes y otros escritos antológicos}. Universidad Nacional de Colombia. (Obra original publicada en 1955)
  saber_ancestral: |-
    Entre 1949 y 1953, el sociólogo Orlando Fals Borda vivió en la vereda de Saucío, en Chocontá, Cundinamarca. Conviene decirlo desde el principio: es Cundinamarca, no el Valle. Allí encontró que la gente se medía de dos maneras a la vez. Una era lo que él llamó la \textbf{escala agrícola}: una escalera invisible con los propietarios arriba y los concertados sin tierra abajo. Hasta los muebles y los zapatos servían de indicador de posición. Fals Borda anotó algo incómodo: el campesino ahorraba sobre todo para sostener su prestigio, y ese prestigio se medía por su capacidad de corresponder invitaciones. La otra manera de medir era el convite y el brazo prestado. Ahí uno valía por lo que ponía cuando a otro le hacía falta. La \textbf{cara de exclusión}: no hay que idealizar la vereda. Fals Borda registró que en Saucío no había cooperativas ni reuniones para discutir problemas comunes. Vio desaparecer la segunda medida y vio la vereda recuperarse cuando volvieron a hacer algo juntos: construir la escuela.
  saber_contemporaneo: |-
    Una balanza tiene tres partes y ninguna sobra. El \textbf{punto de apoyo}, donde el sistema se equilibra. Los \textbf{dos brazos iguales}, uno para lo desconocido y otro para el patrón. Y el \textbf{patrón conocido}, que son las pesas calibradas. Ese diseño tan simple sostiene la confianza de un mercado entero. Si los dos brazos se equilibran con un patrón que ambas partes aceptan, las dos pueden confiar en el resultado. Sin patrón aceptado no hay medición: hay una opinión con aparato. Por eso medir nunca fue un asunto técnico solamente. Alguien decide qué se mide, con qué unidad y qué pasa contigo según el número que salga. Tu promedio, tus horas de pantalla, tus seguidores y las calorías de un producto son patrones que alguien definió. La pregunta útil no es si el número es exacto. Es quién eligió medir eso y no otra cosa.
  pregunta_puente: |-
    En Saucío convivían dos medidas del valor y cada una repartía prestigio de un modo distinto. ¿Qué dos medidas conviven en tu curso, y cuál pesa más a la hora de decidir quién cuenta?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cinco sistemas de medición que regulan tu vida y quién definió cada patrón; (2) \textbf{explicar} las tres partes de una balanza y por qué el patrón compartido es lo que sostiene la confianza; (3) \textbf{crear} una balanza casera que funcione y una reflexión sobre a quién le conviene un sistema de medición concreto.
puentes:
  a_ruta: |-
    En la sesión 1 definiste qué es técnica y en la 2 estudiaste máquinas simples del campo. La balanza es la máquina simple más antigua que sigue decidiendo cosas todos los días. De aquí sale la mirada crítica que vas a usar el resto del año.
  a_escuta: |-
    Antes de la teoría vas a listar las mediciones que ya te gobiernan. No las que estudiaste: las que te pasan encima esta semana.
  a_sistematizacion: |-
    Ya tienes tu lista. Ahora vas a entender por qué una balanza funciona, y por qué el patrón compartido es la parte política del aparato.
  a_praxis: |-
    Tienes el mecanismo. Toca construirlo con tus manos y después escribir sobre un sistema de medición que sí te afecta.
  a_producto: |-
    Lo que entregas hoy: la balanza que se equilibra y una página sobre quién define el patrón. La prueba de calidad: tu reflexión nombra a alguien concreto, no «la sociedad».
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Aceptar una medida sin preguntar quién la fijó es aceptar el reparto que viene con ella.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre medir y juzgar: Dussel sobre la persona que no es una cosa, Epicteto sobre no confundir la observación con el juicio, Floridi sobre la mitad de los datos que es basura.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Patrones de medida en tu vida} (15 min · individual). (1) Anota cinco mediciones que regulan tu vida ahora mismo. Por ejemplo la nota de un examen o el tiempo de pantalla. También las libras de comida en casa, los seguidores de una cuenta o las calorías de un producto. (2) Escribe para cada una con qué unidad se mide. (3) Escribe quién definió ese patrón, con nombre o con institución. (4) Escribe qué te pasa a ti según el resultado. (5) Marca la que más te afecta y la que menos entiendes.
  checks:
  - Tengo cinco mediciones con su unidad y su resultado práctico.
  - Escribí quién definió cada patrón, con nombre o institución.
  - Marqué la que más me afecta y la que menos entiendo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Patrones de medida en mi vida». \textbf{Formato:} tabla de 5 filas y 4 columnas (qué se mide / unidad / quién definió el patrón / qué me pasa según el resultado). \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} ninguna casilla de «quién» dice «la sociedad» o «ellos».
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Las tres partes y el patrón compartido} (20 min · parejas). (1) Con tu pareja, dibujen una balanza y rotulen sus tres partes. (2) Escriban con sus palabras qué pasaría si faltara cada una. (3) Tomen dos mediciones de sus listas y decidan cuál tiene patrón compartido y cuál no. (4) Escriban en dos líneas qué se puede discutir cuando el patrón es compartido y qué no se puede discutir cuando no lo es.
  pilares:
  - |-
    \textbf{Las tres partes.} El punto de apoyo, donde el sistema se equilibra. Los dos brazos iguales, uno para lo desconocido y otro para el patrón. Y el patrón conocido, que es lo único que convierte una comparación en una medida.
  - |-
    \textbf{El patrón es la parte política.} Si tú y yo aceptamos la misma pesa, podemos discutir el resultado sin pelear. Si cada uno trae la suya, no hay medición posible: hay dos opiniones con aparato.
  - |-
    \textbf{Medir no es lo mismo que juzgar.} La balanza dice cuánto pesa. No dice si eso está bien. Cuando un número se usa directamente como juicio, alguien saltó un paso y casi siempre le convino saltarlo.
  - |-
    \textbf{Cuatro preguntas para cualquier sistema de medición.} Qué se mide. Con qué patrón. Quién definió ese patrón y cuándo. Qué se decide con el resultado. La cuarta es la que casi nunca se hace.
  anatomia:
    titulo: La balanza y el patrón, en una mirada
    body: |-
      \textbf{Punto de apoyo:} donde el sistema se equilibra. \\[1mm] \textbf{Dos brazos iguales:} lo desconocido contra el patrón. \\[1mm] \textbf{Patrón conocido:} lo que ambas partes aceptan. \\[1mm] \textbf{Pregunta:} ¿quién definió el patrón y qué se decide con el resultado?
  errores_comunes: |-
    (1) \textbf{Creer que el número es neutral}: alguien eligió qué medir y qué dejar fuera. (2) \textbf{Confundir medir con juzgar}: el peso es un dato, la valoración es otra cosa. (3) \textbf{Responder «la sociedad» a la pregunta de quién definió el patrón}: eso no es una respuesta, es una forma de no averiguarlo. (4) \textbf{Olvidar la unidad}: sin unidad, la cifra no dice nada. (5) \textbf{Medir lo fácil en vez de lo que importa}: pasa todo el tiempo, y casi siempre le conviene a alguien.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Las tres partes y el patrón compartido». \textbf{Formato:} el dibujo de la balanza con sus tres partes rotuladas y qué pasa si falta cada una, más las dos mediciones comparadas. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes decir en voz alta cuál de tus dos mediciones no tiene patrón compartido.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Balanza casera y reflexión} (30 min · individual). (1) Construye una balanza con una regla o un palo, un hilo y dos vasos o tapas iguales. (2) Ajústala hasta que se equilibre en vacío: si no lo hace, todo lo demás miente. (3) Compara dos objetos y anota cuál pesa más. (4) Dibuja o fotografía la balanza y rotula sus tres partes. (5) Escribe una página sobre una medición de tu lista: qué mide, con qué patrón, quién lo definió, qué decide y a quién le conviene. (6) Intercambia la reflexión con un compañero y señálale si nombró a alguien concreto o se quedó en «la sociedad».
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} La balanza que se equilibra en vacío. El dibujo o la foto con las piezas rotuladas. La página de reflexión sobre un solo sistema de medición.
  - |-
    \textbf{El equilibrio en vacío es la calibración.} Una balanza que ya está inclinada sin nada encima va a mentir en todas las comparaciones. Ajustar el hilo hasta que quede recta es el paso que casi todos se saltan.
  - |-
    \textbf{Elige un solo sistema para la reflexión.} Uno bien mirado enseña más que cinco mencionados. Y tiene que ser uno que te afecte de verdad esta semana, no un ejemplo de libro.
  - |-
    \textbf{Nombra a alguien.} «La sociedad» y «el sistema» no definen patrones. Los definen un ministerio, una empresa, un colegio, una aplicación. Si no sabes cuál, averiguarlo es parte del trabajo.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox La balanza se equilibra en vacío. \\[1mm] \checkbox Permite comparar dos objetos y decir cuál pesa más. \\[1mm] \checkbox Hay dibujo o foto con las tres partes rotuladas. \\[1mm] \checkbox La reflexión trata un solo sistema de medición. \\[1mm] \checkbox Nombra quién definió el patrón, con nombre o institución. \\[1mm] \checkbox Dice a quién le conviene que se mida así.
  plantilla_guion: |-
    \textbf{Balanza.} \textit{Materiales, equilibrio en vacío, comparación hecha.} \\[1mm] \textbf{Dibujo.} \textit{Tres partes rotuladas.} \\[1mm] \textbf{Sistema elegido.} \textit{Qué mide y con qué unidad.} \\[1mm] \textbf{Patrón.} \textit{Quién lo definió y cuándo.} \\[1mm] \textbf{Consecuencia.} \textit{Qué se decide y a quién le conviene.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Balanza casera y reflexión». \textbf{Formato:} el dibujo de la balanza con sus partes rotuladas, la comparación de los dos objetos y la página de reflexión. \textbf{Extensión:} media página más la página de reflexión. \textbf{Sabes que terminaste cuando} tu reflexión nombra a alguien concreto que definió el patrón.
  producto_titulo: Balanza casera que se equilibra + reflexión de una página sobre quién define el patrón
  criterios:
  - La balanza se equilibra en vacío y permite comparar dos objetos
  - Hay dibujo o foto con las tres partes rotuladas
  - La reflexión trata un solo sistema de medición que te afecta
  - La reflexión nombra con nombre o institución a quien definió el patrón
  - La reflexión dice qué se decide con el resultado y a quién le conviene
  - Revisaste la reflexión de un compañero y le señalaste si nombró a alguien concreto
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.2.2
    cita: |-
      El rostro del hombre se revela como otro cuando se recorta en nuestro sistema de instrumentos como exterior, como alguien, como una libertad que interpela, que provoca, que aparece como el que resiste a la totalización instrumental. No es algo; es alguien.
    aplicacion: |-
      Una balanza pesa cosas y eso está bien. El problema empieza cuando el mismo gesto se aplica a personas y el número reemplaza a alguien. En Saucío la escala agrícola ordenaba vecinos, y hasta los zapatos servían de indicador.
    pregunta_espejo: |-
      ¿Qué medición de mi vida me convierte en un número para alguien que no me conoce?
  estoico:
    autor: Epicteto · Enquiridión, 45 (c. 125 d.C.)
    cita: |-
      Cuando ves alguno en el baño que se lava pronto, no digas que se lava mal, sino que se lava muy pronto… En efecto, ¿de dónde aprendiste que hizo mal para formar tal juicio?
    aplicacion: |-
      La observación dice qué pasó. El juicio dice si estuvo bien, y es un paso aparte. Casi todos los usos abusivos de una medición consisten en dar ese paso sin decir que se dio.
    pregunta_espejo: |-
      ¿Cuándo pasé de decir «esto midió tanto» a decir «esto está mal» sin darme cuenta?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    cita: |-
      Parafraseando un dicho de la publicidad: la mitad de nuestros datos es basura, solo que no sabemos cuál mitad. Lo que necesitamos es entender mejor qué datos vale la pena conservar. (trad. propia)
    aplicacion: |-
      Medir mucho no es medir bien. Una aplicación puede registrar cien cosas de ti y no capturar la única que explicaría tu semana. Elegir qué vale la pena medir es más difícil que medir.
    pregunta_espejo: |-
      De todo lo que se mide sobre mí, ¿qué falta que sí explicaría cómo me va?
compromiso: |-
  \textbf{Para la próxima sesión.} Trae la balanza armada y la reflexión. Averigua además quién define una de las medidas de tu lista, con nombre de institución. En la sesión 4 vas a armar la línea del tiempo de la técnica, y las unidades de medida van a aparecer varias veces.
web:
  resumen: |-
    En Saucío convivían dos medidas del valor: la escala agrícola, que ordenaba a los vecinos, y el convite, donde uno valía por lo que ponía cuando a otro le hacía falta. Hoy construyes una balanza que se equilibre y escribes sobre un sistema de medición que te rige, nombrando a quien definió el patrón.
  subtema: Historia de la técnica · Medir y poder
  pre_lectura:
    por_que_importa: |-
      Quien define el patrón define el reparto. Por eso la pregunta útil no es si el número es exacto, sino quién eligió medir eso y no otra cosa.
    pregunta_detonante: |-
      ¿Qué medición decide algo sobre ti esta semana, y sabrías decir quién fijó ese patrón?
    activacion:
      titulo: Quién fijó la medida
      descripcion: |-
        En 2 minutos, escribe una cifra que te describa esta semana. Al lado, escribe quién decidió que esa cifra importara.
      duracion_min: 3
    conexion:
      anterior: En la sesión 2 estudiaste máquinas simples del campo colombiano.
      siguiente: En la sesión 4 armas la línea del tiempo de la técnica, del fuego a la imprenta.

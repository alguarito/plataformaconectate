titulo: La balanza y el peso --- medir como acto político
producto_final: |-
  Experimento de pesos con balanza casera + reflexión escrita (1 página) sobre por qué quién decide el patrón de medida tiene poder
saber_ancestral_idea: |-
  Las pesas de la plaza, las balanzas de orfebres Quimbaya y los registros de medidas coloniales muestran que medir nunca fue neutro: quien decidía el patrón decidía cuánto se cobraba, cuánto se trabajaba, cuánto valía un objeto. Medir es regular.
verbos_actividades:
- IDENTIFICA
- ANALIZA
- EVALÚA
- CREA

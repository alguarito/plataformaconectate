clave: 1-4
grado: 9
periodo: 1
sesion: 4
completo: true
duracion_min: 90
titulo: Línea del tiempo de la técnica --- del fuego a la imprenta
titulo_portada: |-
  Línea del tiempo
  de la técnica ---
  ¿quién la escribe?
producto_final: |-
  Tu línea del tiempo de la técnica con diez hitos ordenados por fecha. Cada uno lleva nombre, fecha, lugar de origen y qué cambió después. Al menos tres vienen de Colombia o de América Latina. Va dibujada como línea, no como lista, y cierra con un recuadro que responde qué historia cuenta tu línea y quién queda fuera de ella.
apertura:
  origen: Orfebres del Cauca medio · la cera perdida, seis pasos sin vuelta atrás
  fuente: |-
    Uribe Villegas, M. A. (1992). La orfebrería Quimbaya tardía. \emph{Boletín Museo del Oro}, 31, 30--124. · Banco de la República. (s.\,f.). Quimbaya. \emph{Enciclopedia Banrepcultural}.
  saber_ancestral: |-
    En el Cauca medio, entre el Quindío, Risaralda y el norte del Valle, hubo orfebres que fundían oro a la \textbf{cera perdida con núcleo}. El procedimiento tiene seis pasos y ninguno admite corrección. Se modela un núcleo y se recubre de cera. Se talla el detalle sobre la cera y se forra todo en arcilla. Se saca la cera derritiéndola y se vierte el metal en el hueco. Si te equivocas en el paso tres, no vuelves al dos: empiezas de nuevo. Eso exige planear la secuencia entera antes de tocar nada. Ahora fíjate en cómo lo llamamos. \textbf{«Quimbaya» es un exónimo}: un nombre que pusieron los coleccionistas y que se extendió a todo el Cauca medio. El Tesoro llamado Quimbaya se saqueó en 1890 en Filandia, sin excavación científica. La \textbf{cara de exclusión} cabe en una frase: los orfebres no dejaron nombre, los coleccionistas sí.
  saber_contemporaneo: |-
    Un hito técnico se sostiene con cuatro criterios. \textbf{Invención}: alguien lo hizo, en un lugar y un momento. \textbf{Adopción}: se difundió más allá de quien lo inventó. \textbf{Transformación}: cambió cómo vive la gente, no solo cómo trabaja. \textbf{Permanencia}: siguió usándose o dejó descendencia técnica. Con esos cuatro puedes juzgar cualquier candidato. Pero hay una pregunta anterior y más incómoda: toda cronología cuenta una historia, y la historia depende de quién arma la lista. Si tu línea va del fuego al vapor y de ahí al computador, estás contando la historia de una región. Y la estás llamando «la historia de la técnica». La orfebrería del Cauca medio es anterior a casi todo lo que aparece en esas listas. No está ausente porque no existiera. Está ausente porque quien hizo la lista no la buscó.
  pregunta_puente: |-
    Los orfebres del Cauca medio resolvieron un procedimiento de seis pasos sin vuelta atrás, siglos antes de lo que cuentan las listas. ¿Por qué crees que no aparecen en ellas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué historia cuenta una cronología comparando tres listas distintas de hitos técnicos; (2) \textbf{explicar} los cuatro criterios con que se juzga un hito y aplicarlos a un candidato; (3) \textbf{crear} tu línea del tiempo con diez hitos, tres de ellos de Colombia o América Latina.
puentes:
  a_ruta: |-
    En las sesiones 1 a 3 miraste técnicas sueltas: el cuerpo, la máquina simple, la balanza. Hoy las pones en orden y descubres que ordenar ya es tomar partido. En la sesión 5 entra la revolución industrial, que suele ocupar media línea de tiempo ella sola.
  a_escuta: |-
    Antes de la teoría vas a comparar tres listas de hitos hechas por otros. Lo interesante no es lo que traen: es lo que las tres dejan fuera.
  a_sistematizacion: |-
    Ya viste los sesgos ajenos. Ahora vas a tener criterios propios para decidir qué merece entrar y qué no.
  a_praxis: |-
    Tienes los criterios. Toca armar tu línea y sostener, en un recuadro, qué historia cuenta.
  a_producto: |-
    Lo que entregas hoy: diez hitos ordenados y el recuadro de la leyenda. La prueba de calidad: tres de los diez no salen de una lista europea.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Decidir qué entra en una cronología es decidir qué se recuerda, y eso nunca es un trabajo neutro.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre el tiempo y lo que queda fuera: Dussel sobre el pueblo que está siempre más allá del horizonte, Séneca sobre ser pródigos del tiempo, Floridi sobre lo que rechazamos por no entenderlo.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tres listas, tres miradas} (15 min · individual). (1) Busca tres listas de hitos técnicos de la historia. Una global, una latinoamericana si la encuentras y una colombiana. (2) Anota los cinco primeros de cada una. (3) Marca los hitos que se repiten en las tres. (4) Escribe qué región del mundo domina la lista global. (5) Anota un hito de la lista colombiana que no aparezca en ninguna de las otras dos.
  checks:
  - Tengo los cinco primeros hitos de las tres listas.
  - Marqué los que se repiten y vi qué región domina la global.
  - Anoté un hito colombiano ausente de las otras dos listas.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Tres listas, tres miradas». \textbf{Formato:} tres columnas con los cinco primeros hitos de cada lista, los repetidos marcados y el hito colombiano ausente señalado aparte. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} puedes decir qué región domina la lista global.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los cuatro criterios} (20 min · parejas). (1) Con tu pareja, escriban los cuatro criterios con una frase propia cada uno. (2) Apliquen los cuatro a la orfebrería a la cera perdida del Cauca medio y anoten cuáles cumple. (3) Apliquen los cuatro a un hito de la lista global y comparen. (4) Escriban en dos líneas por qué uno aparece en las listas y el otro no, si los dos cumplen los criterios.
  pilares:
  - |-
    \textbf{Los cuatro criterios.} Invención: alguien lo hizo, en un lugar y un momento. Adopción: se difundió más allá de su creador. Transformación: cambió cómo vive la gente. Permanencia: siguió usándose o dejó descendencia técnica.
  - |-
    \textbf{Un hito sin contexto no dice nada.} «La imprenta, 1450» es un dato suelto. «La imprenta de tipos móviles, Maguncia, 1450, que bajó el costo de un libro a una fracción» es un hito. Invento, contexto y consecuencia, siempre los tres.
  - |-
    \textbf{Cumplir los criterios no garantiza entrar en la lista.} La orfebrería del Cauca medio los cumple los cuatro y casi nunca aparece. La diferencia no está en la técnica: está en quién armó la lista y qué buscó.
  - |-
    \textbf{El nombre también es una decisión.} Llamamos «quimbaya» a esa orfebrería porque así la nombraron los coleccionistas, y el nombre se extendió a todo el Cauca medio. Los orfebres no dejaron nombre; los coleccionistas sí.
  anatomia:
    titulo: Cómo se juzga un hito técnico
    body: |-
      \textbf{Invención:} quién, dónde, cuándo. \\[1mm] \textbf{Adopción:} hasta dónde se difundió. \\[1mm] \textbf{Transformación:} qué cambió en la vida de la gente. \\[1mm] \textbf{Permanencia:} siguió usándose o dejó descendencia. \\[1mm] \textbf{Pregunta previa:} ¿quién armó la lista y qué buscó?
  errores_comunes: |-
    (1) \textbf{Copiar una lista sin revisarla}: la primera que aparece suele contar una sola historia. (2) \textbf{Poner el hito sin fecha ni lugar}: sin eso no se puede ordenar ni comprobar. (3) \textbf{Confundir invención con adopción}: muchas cosas se inventaron dos veces y solo se difundió una. (4) \textbf{Llamar «primitivo» a lo anterior}: la cera perdida es más exigente que muchos procesos posteriores. (5) \textbf{Usar «quimbaya» como si fuera un nombre propio}: es un exónimo de coleccionistas y conviene decirlo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los cuatro criterios». \textbf{Formato:} los cuatro criterios con frase propia, aplicados a la orfebrería del Cauca medio y a un hito de la lista global, más las dos líneas de comparación. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} las dos líneas explican por qué uno entra en las listas y el otro no.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu línea del tiempo} (30 min · individual). (1) Lista veinte candidatos, mezclando lo que encontraste en las tres listas con lo que sepas de tu región. (2) Aplícales los cuatro criterios y quédate con diez. (3) Comprueba que al menos tres sean de Colombia o América Latina. (4) Ordénalos por fecha y dibújalos sobre una línea, no en una lista vertical. (5) Escribe en cada uno nombre, fecha, lugar y qué cambió. (6) Cierra con un recuadro que diga qué historia cuenta tu línea y quién queda fuera.
  pilares:
  - |-
    \textbf{Tu entrega tiene dos piezas.} La línea dibujada con diez hitos completos. Y el recuadro de la leyenda, que es donde se ve si entendiste la sesión.
  - |-
    \textbf{Empieza por veinte y quédate con diez.} Elegir directamente diez lleva a poner los primeros que se te ocurran, que son los de la lista global. Descartar es donde se aplica el criterio.
  - |-
    \textbf{La línea se dibuja.} Una lista vertical no muestra las distancias entre siglos, y esas distancias son parte de lo que se aprende. Ver ocho mil años de un lado y cincuenta del otro cambia la idea que uno tiene del progreso.
  - |-
    \textbf{El recuadro es lo difícil.} «Quién queda fuera» obliga a nombrar algo que sabes que existió y que no cupo. Si no se te ocurre nadie, vuelve a la Actividad 1.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Diez hitos ordenados por fecha. \\[1mm] \checkbox Cada uno con nombre, fecha, lugar y qué cambió. \\[1mm] \checkbox Al menos tres de Colombia o América Latina. \\[1mm] \checkbox Está dibujada como línea, con distancias visibles. \\[1mm] \checkbox Recuadro con qué historia cuenta la línea. \\[1mm] \checkbox El recuadro nombra a alguien que queda fuera.
  plantilla_guion: |-
    \textbf{Hito.} \textit{Nombre.} \\[1mm] \textbf{Fecha y lugar.} \textit{Cuándo y dónde.} \\[1mm] \textbf{Qué cambió.} \textit{La consecuencia, en una frase.} \\[1mm] \textbf{Criterios.} \textit{Cuáles de los cuatro cumple.} \\[1mm] \textbf{Leyenda.} \textit{Qué historia cuenta mi línea y quién queda fuera.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Tu línea del tiempo». \textbf{Formato:} la línea dibujada con los diez hitos y sus datos, más el recuadro de la leyenda. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} el recuadro nombra a alguien concreto que quedó fuera.
  producto_titulo: Línea del tiempo con diez hitos justificados y su recuadro de leyenda
  criterios:
  - Los diez hitos están ordenados por fecha y llevan nombre, fecha, lugar y consecuencia
  - Al menos tres hitos son de Colombia o de América Latina
  - Está dibujada como línea y las distancias entre siglos se ven
  - El recuadro dice qué historia cuenta la línea
  - El recuadro nombra a alguien concreto que queda fuera
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §5.3.1
    cita: |-
      Analéctico quiere indicar el hecho real humano por el que todo hombre, todo grupo o pueblo se sitúa siempre «más allá» (aná-) del horizonte de la totalidad.
    aplicacion: |-
      Una lista de hitos es un horizonte, y siempre hay pueblos más allá de su borde. Los orfebres del Cauca medio están afuera de casi todas, y no por falta de técnica. Ampliar el borde es el trabajo de hoy.
    pregunta_espejo: |-
      ¿Qué sé que existió y no cabe en ninguna de las listas que consulté?
  estoico:
    autor: Séneca · De la brevedad de la vida, I (c. 49 d.C.)
    cita: |-
      Lo cierto es que la vida que se nos dio no es breve, nosotros hacemos que lo sea; y que no somos pobres, sino pródigos del tiempo.
    aplicacion: |-
      Al dibujar la línea vas a ver que la mayoría de la historia técnica ocurrió muy lentamente y que lo último pasó en un suspiro. Esa proporción sorprende, y cambia la sensación de que todo siempre fue rápido.
    pregunta_espejo: |-
      Al ver mi línea dibujada, ¿qué me sorprendió del reparto del tiempo?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), Prefacio
    cita: |-
      Tememos y rechazamos aquello a lo que no logramos dar sentido y significado. (trad. propia)
    aplicacion: |-
      Buena parte de lo que se queda fuera de una lista no se descartó: no se entendió. Una técnica que exige seis pasos sin corrección se ve simple desde afuera, y solo deja de parecerlo cuando alguien se molesta en describirla.
    pregunta_espejo: |-
      ¿Qué he descartado por no entenderlo, en vez de por conocerlo bien?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la línea dibujada y el recuadro de la leyenda. Pregúntale a alguien mayor qué invento le cambió la vida a su generación y mira si cabe en tu línea. En la sesión 5 entra la revolución industrial y el reparto de oficios.
web:
  resumen: |-
    En el Cauca medio hubo orfebres que fundían oro a la cera perdida en seis pasos sin vuelta atrás, siglos antes de casi todo lo que aparece en las listas de hitos. No están ausentes porque no existieran: están ausentes porque quien hizo la lista no los buscó. Hoy armas tu propia línea del tiempo y sostienes qué historia cuenta.
  subtema: Historia de la técnica · Cronología y poder
  pre_lectura:
    por_que_importa: |-
      Ordenar hitos parece un trabajo neutro y no lo es. Decidir qué entra en una cronología es decidir qué se recuerda.
    pregunta_detonante: |-
      Si tuvieras que nombrar tres inventos que cambiaron la vida humana, ¿alguno sería de este continente?
    activacion:
      titulo: Los tres primeros
      descripcion: |-
        En 2 minutos, escribe los tres primeros hitos técnicos que se te vengan a la cabeza. Mira de dónde son. Esa es tu lista por defecto.
      duracion_min: 3
    conexion:
      anterior: En la sesión 3 construiste una balanza y viste que medir nunca fue neutral.
      siguiente: En la sesión 5 mapeas los oficios que la revolución industrial quitó y puso.

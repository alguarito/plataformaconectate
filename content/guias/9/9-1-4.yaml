clave: 1-4
grado: 9
periodo: 1
sesion: 4
completo: true
titulo: Línea del tiempo de la técnica --- del fuego a la imprenta
titulo_portada: |-
  Línea del tiempo ---
  del fuego
  a la imprenta
producto_final: Línea del tiempo personal con 10 hitos técnicos (mezcla inventos globales con saberes locales) y justificación de por qué cada uno cambió la vida humana
apertura:
  saber_ancestral: |-
    Las cronologías oficiales privilegian inventos del norte global: rueda mesopotámica, imprenta de Gutenberg, máquina de vapor inglesa, computador de Silicon Valley. Pero la línea del tiempo de la técnica también incluye la \textbf{cerámica Quimbaya} (orfebrería que el mundo no supo replicar hasta siglos después), el \textbf{quipu inca} (sistema contable sin papel ni dígitos), el \textbf{calendario muisca} (precisión astronómica para sembrar), la \textbf{balsa de guadua} del Pacífico (resistencia al sismo que la ingeniería moderna estudia). Recuperar esa cronología completa es un acto de justicia histórica.
  saber_contemporaneo: |-
    Construir una línea del tiempo personal de la técnica es un ejercicio de \textbf{soberanía narrativa}: tú decides cuáles hitos importan, en qué orden, con qué peso. La línea de tiempo de Wikipedia no es la misma que la de un campesino del Cauca o la de un programador de Bangalore. Cada lista de ``10 inventos que cambiaron el mundo'' es también una declaración política sobre quién hace mundo y quién queda fuera.
  pregunta_puente: |-
    Si te pidieran nombrar los 5 hitos técnicos más importantes de la historia, ¿cuál sería el primero que se te ocurre? ¿De dónde viene esa lista que tienes en la cabeza?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 15+ hitos técnicos relevantes mezclando saberes locales y globales; (2) \textbf{analizar} cómo se construye una cronología y por qué incluir/excluir es político; (3) \textbf{explicar} por qué un hito cambia la vida humana, no solo aparece; (4) \textbf{crear} tu propia línea del tiempo personal con 10 hitos justificados.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Las sesiones 1-3 te dieron lentes: cuerpo, máquina, medida. Hoy ordenas todo eso en el tiempo --- 30 mil años de técnica humana resumidos en 10 hitos elegidos por ti.
  a_escuta: |-
    Antes de hacer tu propia línea de tiempo, vamos a leer 3 listas de ``inventos que cambiaron el mundo'' (una global, una latinoamericana, una local). Verás que las listas son distintas según quién las escribe. Ese es el primer aprendizaje.
  a_sistematizacion: |-
    Ya viste cómo las listas dependen del autor. Ahora vamos a entender los \textbf{4 criterios} que separan un hito técnico real de un evento curioso: invención, adopción, transformación, perdurabilidad. Aplicar esos 4 criterios te permite elegir tus 10 con criterio propio.
  a_praxis: |-
    Tienes el método. Hora de construir: 10 hitos técnicos en una línea de tiempo dibujada o digital, cada uno con su fecha (aproximada), origen geográfico y por qué cambió la vida humana. Mezcla obligatoria: al menos 3 son colombianos o latinoamericanos.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: 1 línea de tiempo + 1 justificación por hito. El criterio principal: que tu lista NO sea una copia de Wikipedia y que al menos 3 hitos vengan de Colombia o América Latina.
  a_evaluacion: |-
    Antes de cerrar, mira tu línea del tiempo desde las cinco dimensiones humanas. Elegir qué incluir y qué dejar fuera es un acto profundo --- vale la pena nombrar lo que tu lista honra y lo que silenciaría sin querer.
  a_triangulo: |-
    Y para terminar, tres voces sobre la historia de la técnica. Dussel sobre las cronologías invisibilizadas, Marco Aurelio sobre lo que dura y lo que pasa, Floridi sobre la historia como dato.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tres listas, tres miradas} (15 min · individual). Busca 3 listas de ``inventos o hitos técnicos más importantes de la historia'': (a) una global (Wikipedia, BBC, National Geographic), (b) una latinoamericana (si la encuentras), (c) una local (puedes buscar ``inventos colombianos'' o ``tecnología indígena''). Compara: ¿qué se repite, qué cambia, qué desaparece según quién la escribe?
  checks:
  - Encontré 3 listas distintas de hitos técnicos.
  - Identifiqué al menos 3 hitos que aparecen en una y no en las otras.
  - Anoté qué tipo de hito predomina en cada lista (industrial / agrícola / digital / ancestral).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Tres listas, tres miradas». \textbf{Formato:} tabla de 3 columnas (Lista global~|~Lista latinoamericana~|~Lista local), con los 5 primeros hitos de cada una. Al final 1 párrafo de 3 renglones con tu hallazgo principal. \textbf{Sabes que terminaste cuando} reconoces explícitamente que ``inventos que cambiaron el mundo'' depende de quién escribe la lista.
sistematizacion:
  intro: |-
    Toda línea de tiempo seria aplica 4 criterios para decidir qué incluir. Vamos a descomponerlos para que tu propia línea sea defendible y no una colección caprichosa.
  pilares:
  - |-
    Un hito técnico se descompone en 4 criterios: (1) \textbf{invención} (alguien lo creó, en algún lugar, en algún momento), (2) \textbf{adopción} (se difundió a una comunidad significativa), (3) \textbf{transformación} (cambió la forma de vivir o trabajar de esa comunidad), (4) \textbf{perdurabilidad} (su efecto duró décadas o siglos, no fue moda).
  - |-
    Toda buena cronología sigue el patrón \textbf{``invento + contexto + consecuencia''}: el hito en sí mismo no significa nada sin contexto (quién, dónde, por qué) y sin consecuencia (qué cambió después). Listar fechas sin contexto es perezoso.
  - |-
    Lo esencial de una línea del tiempo cabe en una pregunta: \emph{¿qué historia humana cuenta mi línea?}. Si tu línea cuenta una historia centrada en Europa industrial, no es ``la historia de la técnica'' --- es ``la historia europea de la técnica''.
  - |-
    Pasos para construir una línea seria: (1) lista 20-30 hitos candidatos; (2) aplica los 4 criterios a cada uno; (3) elige los 10 más fuertes; (4) ordénalos cronológicamente; (5) verifica que al menos 3 vengan de tu región (Colombia, América Latina).
  anatomia:
    titulo: Anatomía de un hito técnico
    body: |-
      \textbf{Nombre:} qué es (en una frase). \\[1mm] \textbf{Fecha:} año o siglo aproximado. \\[1mm] \textbf{Origen:} dónde se inventó. \\[1mm] \textbf{Adopción:} qué comunidad lo usó. \\[1mm] \textbf{Transformación:} qué cambió en la vida humana. \\[1mm] \textbf{Perdurabilidad:} su efecto hoy.
  errores_comunes: |-
    (1) Listar solo inventos famosos sin contexto (rueda, imprenta, internet) --- es ``cronología de Wikipedia''. (2) Olvidar los saberes ancestrales latinoamericanos. (3) Confundir un producto comercial con un hito (el iPhone no es un hito, el smartphone como categoría sí). (4) No nombrar la consecuencia humana --- un invento sin transformación no es hito, es curiosidad.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 4 criterios para elegir hitos». \textbf{Formato:} 4 fichas, una por criterio (invención, adopción, transformación, perdurabilidad), cada una con: definición en tus palabras + 1 ejemplo de hito que la cumple + 1 ``cuasi-hito'' que la incumple. \textbf{Sabes que terminaste cuando} puedes defender por qué un ``invento'' famoso NO califica como hito por incumplir uno de los criterios.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu línea del tiempo personal} (30 min · individual). Hora de construir. Vas a elegir 10 hitos técnicos de toda la historia humana, ordenarlos cronológicamente, y justificar cada uno con los 4 criterios. Mezcla obligatoria: al menos 3 son colombianos o latinoamericanos.
  pilares:
  - |-
    Tu línea se descompone en 3 capas: (1) el orden cronológico de los 10 hitos, (2) por cada hito una mini-ficha (nombre + fecha + origen + transformación), (3) un cuadro de leyenda al final explicando por qué tu lista NO es Wikipedia.
  - |-
    Sigue el patrón ``3 locales + 7 mixtos'': al menos 3 hitos de Colombia/América Latina (cerámica Quimbaya, quipu, calendario muisca, balsa de guadua, agricultura andina de andenes, navegación afro-pacífica) y 7 hitos globales/regionales que tú elijas.
  - |-
    Cada hito expresa una sola idea. Si tu hito dice ``imprenta'' sin contexto, no es ficha --- es palabra. Cada hito necesita las 4 piezas: nombre + fecha + origen + transformación.
  - |-
    Algoritmo: (1) lista 20 hitos candidatos sin filtrar; (2) aplica los 4 criterios y elimina los débiles; (3) verifica que tienes al menos 3 hitos locales --- si no, agrega; (4) ordena cronológicamente; (5) dibuja la línea en cuaderno o digital; (6) escribe el cuadro de leyenda al final.
  checklist:
    titulo: Checklist antes de cerrar la línea del tiempo
    items: |-
      \checkbox 10 hitos seleccionados, ordenados cronológicamente. \\[1mm] \checkbox Cada uno con nombre + fecha + origen + transformación. \\[1mm] \checkbox Al menos 3 hitos vienen de Colombia o América Latina. \\[1mm] \checkbox Línea dibujada a mano o en herramienta digital, no solo lista. \\[1mm] \checkbox Cuadro de leyenda al final que explica por qué tu lista no es Wikipedia.
  plantilla_guion: |-
    \textbf{Tu línea del tiempo.} \textit{Dibujo o esquema de 10 hitos en orden cronológico.} \\[1mm] \textbf{Fichas de cada hito.} \textit{10 mini-fichas con los 4 criterios cumplidos.} \\[1mm] \textbf{Cuadro de leyenda.} \textit{Párrafo final que explica qué tipo de historia cuenta tu lista.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi línea del tiempo de la técnica». \textbf{Formato:} (1) línea dibujada con 10 hitos, (2) ficha de cada hito, (3) párrafo de leyenda. \textbf{Extensión:} dos páginas. \textbf{Sabes que terminaste cuando} un compañero puede leer tu línea y entender qué historia cuentas sin que tú expliques.
  producto_titulo: Línea del tiempo personal de la técnica con 10 hitos justificados
  criterios:
  - 10 hitos ordenados cronológicamente
  - Cada hito tiene nombre + fecha + origen + transformación
  - Al menos 3 hitos vienen de Colombia o América Latina
  - Hay línea dibujada (no solo lista vertical)
  - Cuadro de leyenda explica qué historia cuenta la línea
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda historia oficial se construye sobre las historias que decide invisibilizar.
    aplicacion: |-
      La cronología clásica de la técnica omite o margina los aportes precolombinos, africanos, asiáticos, populares. No es por descuido: es por proyecto. Recuperar la línea del tiempo completa de la técnica --- incluyendo Quimbaya, quipu, balsas, andenes --- es restituir la dignidad de los pueblos que la modernidad europea borró del mapa. La cronología es política antes que cronológica.
    pregunta_espejo: |-
      ¿Qué hitos técnicos de mi región conocía y por qué creo que no aparecen en las listas globales? ¿Qué cambia cuando los pongo al lado de la imprenta de Gutenberg?
  estoico:
    autor: Marco Aurelio
    cita: |-
      No todo lo que pasa rápido es importante; no todo lo que dura mucho es valioso.
    aplicacion: |-
      La emoción del lanzamiento más reciente (un nuevo iPhone, una nueva IA, una nueva red social) nos hace creer que estamos en ``el momento más importante de la historia''. Marco Aurelio recordaría: la perdurabilidad importa más que la novedad. ¿Qué de hoy quedará en 100 años? Eso decide si es hito o si es moda.
    pregunta_espejo: |-
      De las tecnologías de moda hoy, ¿cuáles creo que estarán en la línea de tiempo en 100 años? ¿Cuáles habrán desaparecido?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La historia es el primer dato; quien la organiza, decide qué mundo es posible mañana.
    aplicacion: |-
      Las cronologías que aprendemos en la escuela no son neutras: estructuran lo que creemos posible. Si nos enseñan que la técnica nace en Europa industrial, asumimos que las soluciones modernas vienen de allí. Si nos enseñan que la técnica también es campesina, indígena y popular, abrimos otros caminos. La historia organizada es la condición de la imaginación técnica futura.
    pregunta_espejo: |-
      ¿Qué tipo de futuro técnico imagino, y cómo se relaciona con la historia que me enseñaron? ¿Podría imaginar otro si cambiara mi línea del tiempo?
compromiso: |-
  \textbf{Para la próxima semana.} Comparte tu línea del tiempo con un familiar mayor (abuelo, tío, papá, mamá). Pregúntale: ``¿qué hito agregarías o quitarías?''. Anota su respuesta. Esa conversación intergeneracional muchas veces da los hitos más valiosos que ningún libro tiene. El próximo lunes traemos esas respuestas al aula.

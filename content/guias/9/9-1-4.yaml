titulo: Línea del tiempo de la técnica --- del fuego a la imprenta
producto_final: |-
  Línea del tiempo personal con 10 hitos técnicos seleccionados (mezclando inventos globales con saberes locales) y justificación de por qué cada uno cambió la vida humana
saber_ancestral_idea: |-
  Las cronologías oficiales suelen privilegiar inventos del norte global (rueda, imprenta, máquina de vapor). Pero la línea de tiempo también es la cerámica Quimbaya, el quipu inca, el calendario muisca, la balsa de guadua. Recuperar esa cronología es un acto de justicia histórica.

clave: 1-5
grado: 9
periodo: 1
sesion: 5
completo: true
titulo: Revolución industrial --- máquinas que cambiaron el trabajo
titulo_portada: |-
  Revolución industrial ---
  máquinas que
  cambiaron el trabajo
producto_final: Mapa visual de oficios ganados y perdidos entre el siglo XVIII y hoy, con 3 oficios sustituidos por la máquina y 3 oficios creados por ella
apertura:
  saber_ancestral: |-
    El \textbf{oficio del herrero} en el Valle del Cauca cambió tres veces. Primero competía con el \emph{cobre indígena} de los Quimbaya, que dominaban la fundición antes de la Conquista. Después llegaron los \emph{hierros importados de Europa} y el herrero local se reinventó como artesano de detalles. En el siglo XX la \emph{fábrica industrial} produjo herramientas baratas y el herrero artesano casi desapareció --- pero hoy renace, ahora especializado en piezas únicas para la construcción regenerativa. Cada revolución técnica deja un mapa de oficios ganados y perdidos.
  origen: Oficio del herrero en el Valle del Cauca — tres revoluciones históricas
  saber_contemporaneo: |-
    La \textbf{revolución industrial} (1760--1840) cambió el patrón global: las máquinas pasaron del taller artesano a la fábrica masiva, la energía pasó del agua y el viento al carbón y el vapor, y el trabajo pasó del oficio personal al obrero asalariado. Hoy vivimos una \textbf{cuarta revolución industrial} con IA, robots y automatización digital. La pregunta no es si la tecnología quita trabajos --- es \emph{a quién permite reinventarse} y a quién no.
  pregunta_puente: |-
    ¿Qué oficio de tu familia (papá, mamá, abuelos) cambió o desapareció por una máquina? ¿Y qué oficio nuevo apareció en su lugar?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 5 oficios que la revolución industrial transformó (sustituidos, creados, mutados); (2) \textbf{analizar} con criterio la 4ª revolución industrial actual (IA, automatización, plataformas); (3) \textbf{evaluar} qué de tu propio futuro laboral está en riesgo y qué oportunidad nueva aparece; (4) \textbf{crear} un mapa visual de oficios ganados y perdidos en tu propia región.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Las sesiones 1-4 te dieron lentes para entender la técnica como historia. Hoy aterrizas esa historia en algo muy concreto: ¿qué pasa con los trabajos humanos cuando llegan las máquinas?
  a_escuta: |-
    Antes de teorizar sobre la revolución industrial, vamos a entrevistar la memoria viva. La conversación con un familiar mayor sobre oficios que ya no existen revela más que cualquier libro de historia.
  a_sistematizacion: |-
    Ya tienes datos vivos. Ahora vamos a entender los \textbf{4 patrones} de lo que pasa con un oficio cuando llega una máquina: sustituido, transformado, complementado, creado. Distinguirlos te da un mapa para leer cualquier cambio tecnológico --- el del XIX y el de hoy.
  a_praxis: |-
    Tienes el método. Toca hacer un mapa visual de oficios ganados y perdidos en tu región. No abstracto: con nombres reales de oficios que viste o que tu familia conoció.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 1 mapa visual + 3 oficios perdidos + 3 oficios creados. El criterio principal: que cada uno sea real y específico, no genérico.
  a_evaluacion: |-
    Antes de cerrar, mira la revolución industrial desde las cinco dimensiones humanas. Esta no es solo historia económica: es vidas concretas, decisiones familiares, herencias. Vale la pena nombrar a quién benefició y a quién dejó atrás.
  a_triangulo: |-
    Y para terminar, tres voces sobre el cambio técnico y el trabajo. Dussel sobre quién gana y quién pierde en cada revolución, Marco Aurelio sobre lo que sí depende de ti cuando el mundo cambia, Floridi sobre los empleos de la infoesfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Entrevista a un mayor sobre oficios perdidos} (15 min · individual). Llama o habla con un familiar mayor de 40 años (papá, mamá, tío, abuelo). Pregúntale: ``¿qué oficio había en tu juventud que ya no existe?'' y ``¿qué oficio existe hoy que no existía cuando eras joven?''. Anota su respuesta literal --- la memoria viva da información que ningún libro tiene.
  checks:
  - Conseguí hablar con un familiar mayor de 40 años.
  - Le pregunté por al menos 1 oficio perdido y 1 oficio creado.
  - Anoté sus respuestas literales (sin paráfrasis).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Memoria viva de oficios». \textbf{Formato:} (1) nombre de la persona entrevistada + parentesco + edad aproximada, (2) 2 respuestas literales (un oficio perdido + un oficio creado), (3) tu reacción en 2 renglones. \textbf{Sabes que terminaste cuando} las respuestas son textuales (entre comillas), específicas (no ``muchos trabajos cambiaron'') y reconoces algo que no sabías.
sistematizacion:
  intro: |-
    Toda revolución técnica deja un mapa de oficios en 4 estados. Vamos a descomponer ese mapa con los pilares del pensamiento computacional para que puedas leer cualquier cambio --- el del XIX y el de hoy.
  pilares:
  - |-
    Los oficios frente a la máquina se descomponen en 4 estados: (1) \textbf{sustituidos} (la máquina los reemplaza por completo: telefonista, lechero, despertador humano), (2) \textbf{transformados} (siguen existiendo pero cambian de forma: cajero bancario, secretaria, periodista), (3) \textbf{complementados} (la máquina los hace más productivos sin sustituirlos: médico con escáner, abogado con buscadores), (4) \textbf{creados} (no existían antes de la máquina: programador, community manager, científico de datos).
  - |-
    Toda revolución sigue el patrón \textbf{``no todos pierden lo mismo''}: los oficios que requieren juicio humano, creatividad o relación cara a cara suelen sobrevivir. Los oficios repetitivos y predecibles son los primeros que la máquina toma. Pero el reparto de beneficios no es justo: quien tiene capital y educación se reinventa, quien no, se queda atrás.
  - |-
    Lo esencial de la mirada sobre revoluciones técnicas cabe en una pregunta: \emph{¿quién está pagando el costo de esta revolución y quién está cobrando los beneficios?}. Sin esa pregunta, la historia de la técnica se vuelve ingenua.
  - |-
    Pasos para analizar cualquier revolución técnica: (1) ¿qué máquina o tecnología es el motor del cambio?; (2) ¿qué oficios sustituye, transforma, complementa y crea?; (3) ¿quién gana económicamente?; (4) ¿quién paga el costo en vidas reales?.
  anatomia:
    titulo: Anatomía de una revolución técnica
    body: |-
      \textbf{Motor técnico:} qué máquina o tecnología desata el cambio (vapor, electricidad, computador, IA). \\[1mm] \textbf{Oficios sustituidos:} los que la máquina reemplaza por completo. \\[1mm] \textbf{Oficios transformados:} los que cambian de forma pero subsisten. \\[1mm] \textbf{Oficios creados:} los que no existían antes. \\[1mm] \textbf{Distribución de costos y beneficios:} quién gana, quién paga.
  errores_comunes: |-
    (1) Pensar que ``la tecnología trae progreso para todos'' --- siempre hay perdedores específicos. (2) Confundir ``progreso técnico'' con ``progreso humano''. (3) Olvidar que algunas habilidades del oficio se pueden trasladar a oficios nuevos (un sastre puede ser diseñador digital de moda). (4) No nombrar a las personas concretas que pagaron el costo (obreros, campesinos desplazados, mujeres con triple jornada).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 4 estados de un oficio frente a la máquina». \textbf{Formato:} 4 fichas, una por estado (sustituido, transformado, complementado, creado), cada una con: definición en tus palabras + 2 ejemplos reales (uno histórico del siglo XX, uno actual de la 4ª revolución industrial). \textbf{Sabes que terminaste cuando} tus ejemplos son específicos (nombre concreto del oficio) y reconoces al menos UN ejemplo cercano a tu propia familia.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Mapa de oficios ganados y perdidos} (30 min · individual). Hora de mapear. Vas a hacer un mapa visual de oficios ganados y perdidos en tu propia región (Valle, Cartago, tu barrio o pueblo), con 3 oficios sustituidos por máquinas + 3 oficios creados por máquinas.
  pilares:
  - |-
    Tu mapa se descompone en 4 zonas: (1) el centro --- una pregunta clara: ``¿Qué cambió en mi región?''; (2) la izquierda --- 3 oficios perdidos con flecha al motor técnico que los sustituyó; (3) la derecha --- 3 oficios creados con flecha a la tecnología que los hizo posibles; (4) abajo --- un cuadro con tu observación sobre el reparto de beneficios.
  - |-
    Sigue el patrón \textbf{``específico vence a genérico''}: no escribas ``muchos oficios desaparecieron''. Escribe ``el lechero pasaba por mi calle hasta 1985, lo reemplazó la pasteurización industrial''. Lo concreto convence.
  - |-
    Cada oficio expresa una sola idea. Si tu ficha de ``programador'' dice tres especialidades distintas (web, móvil, IA), elige una. Mejor 6 fichas claras que 12 confusas.
  - |-
    Algoritmo: (1) lista 10 candidatos; (2) elige los 3 más fuertes de cada lado; (3) dibuja el mapa en hoja A4 horizontal; (4) escribe el cuadro de observación abajo; (5) usa el aporte de tu familia (Actividad 1) en al menos UN oficio.
  checklist:
    titulo: Checklist antes de cerrar el mapa
    items: |-
      \checkbox 3 oficios perdidos a la izquierda, con motor técnico que los sustituyó. \\[1mm] \checkbox 3 oficios creados a la derecha, con tecnología que los hizo posibles. \\[1mm] \checkbox Al menos UN oficio (perdido o creado) viene del aporte de tu familia. \\[1mm] \checkbox Cada oficio tiene fecha aproximada (década) y un lugar (mi barrio, mi región). \\[1mm] \checkbox Cuadro de observación abajo nombra a quién benefició la revolución y a quién no.
  plantilla_guion: |-
    \textbf{Mapa.} \textit{Dibujo en hoja A4 horizontal con 6 oficios distribuidos.} \\[1mm] \textbf{6 fichas mini.} \textit{Una por oficio con nombre + fecha + lugar + motor técnico relacionado.} \\[1mm] \textbf{Cuadro de observación.} \textit{Párrafo de 3-4 renglones sobre el reparto de beneficios.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mapa de oficios ganados y perdidos en mi región». \textbf{Formato:} mapa dibujado + 6 fichas mini + cuadro de observación. \textbf{Extensión:} 1 página A4 horizontal. \textbf{Sabes que terminaste cuando} un compañero puede leer tu mapa sin que tú expliques.
  producto_titulo: Mapa visual de oficios ganados y perdidos en mi región
  criterios:
  - 3 oficios perdidos + 3 oficios creados, todos con nombre concreto
  - Al menos UN oficio viene del aporte de un mayor de tu familia
  - Cada oficio tiene fecha aproximada y lugar local
  - El cuadro de observación nombra a quién benefició la revolución y a quién no
  - El mapa se entiende sin explicación oral
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda revolución técnica reparte beneficios y costos según una geografía de poder previa.
    aplicacion: |-
      La revolución industrial inglesa se hizo posible con algodón colombiano, caucho del Amazonas, café del Valle. Los beneficios quedaron en Manchester y Liverpool; los costos en el campesino latinoamericano. La 4ª revolución industrial repite el patrón: los algoritmos se entrenan con datos del sur global, los beneficios quedan en Silicon Valley. Reconocer eso es el primer acto de soberanía técnica.
    pregunta_espejo: |-
      ¿Qué materia prima, datos o trabajo de mi región alimenta tecnologías que se beneficiaron en otro lugar? ¿Cómo cambia eso lo que pienso sobre ``progreso''?
  estoico:
    autor: Marco Aurelio
    cita: |-
      No te angusties por lo que cambiará; concéntrate en lo que de tu trabajo no depende de la máquina.
    aplicacion: |-
      La angustia por ``la IA va a quitar mi trabajo'' es legítima --- pero no es estrategia. La estrategia estoica pregunta: ¿qué de tu habilidad humana NO depende de algoritmos? Curiosidad genuina, juicio en situaciones nuevas, cuidado de personas reales, creatividad no derivativa. Cultivar eso es seguro de empleo a largo plazo.
    pregunta_espejo: |-
      ¿Qué habilidad humana mía estoy cultivando que ninguna máquina puede reproducir? ¿Cuál estoy dejando atrofiar?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La 4ª revolución industrial reconfigura no solo el trabajo, sino la naturaleza misma de la agencia humana.
    aplicacion: |-
      En revoluciones anteriores, las máquinas hacían trabajo físico. En la 4ª, las máquinas hacen trabajo cognitivo: deciden, recomiendan, escriben. Floridi llama esto \emph{re-ontologización del trabajo}: cambia lo que ``trabajar'' significa. Quien entienda eso temprano podrá rediseñar su lugar; quien lo ignore, será rediseñado por otros.
    pregunta_espejo: |-
      ¿Qué tareas que antes hacía yo ahora hace una IA por mí? ¿Cuáles me hacen más capaz y cuáles me están atrofiando habilidades?
compromiso: |-
  \textbf{Para la próxima semana.} Escoge UN oficio de tu mapa (perdido o creado) e investiga 15 minutos: cuándo nació o cuándo desapareció, qué máquina o tecnología fue motor, qué pasó con las personas que vivían de ese oficio. Anota los hallazgos. El próximo lunes los traemos al aula --- son insumo del proyecto integrador del periodo.
web:
  resumen: |-
    Mapeas oficios ganados y perdidos en tu región. La revolución industrial no es solo historia económica: es vidas concretas de tu familia.
  subtema: Historia de la técnica · Revoluciones del trabajo
  pre_lectura:
    por_que_importa: |-
      La pregunta de "qué pasa con los trabajos cuando llegan las máquinas" no es del pasado: es la pregunta de tu futuro laboral. La IA y la automatización repiten patrones que ya se vieron con el telar y el vapor. Aprender a leerlos te da ventaja.
    pregunta_detonante: |-
      Si un familiar te ofreciera hoy heredar SU oficio (el de tu papá, tu mamá o tu abuelo) — ¿lo aceptarías? ¿Por qué sí o por qué no?
    activacion:
      titulo: Inventario rápido familiar
      descripcion: |-
        En 3 minutos, anota los oficios de tus 4 abuelos (o los que conozcas). Para cada uno marca si todavía existe igual, si cambió de forma, o si desapareció. Vas a ver dos generaciones de revolución técnica en tu propia familia.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 4 construiste tu línea del tiempo de la técnica. Hoy aterrizas un siglo (XIX) en algo personal: tus propios oficios familiares.
      siguiente: |-
        En la sesión 6 verás la imprenta como una revolución específica que cambió quién puede hablar al pueblo.
  conceptos_clave:
    - termino: Revolución industrial
      definicion: |-
        Periodo 1760-1840 cuando las máquinas pasaron del taller a la fábrica, la energía pasó del agua al carbón y el vapor, y el trabajo pasó del oficio personal al obrero asalariado.
      ejemplo: |-
        El telar mecánico en Inglaterra reemplazó a miles de tejedores manuales. El mismo telar hoy alimenta empleos en Bangladesh — la revolución no terminó, solo se desplazó.
      emoji: "🏭"
    - termino: 4ª revolución industrial
      definicion: |-
        Revolución actual con IA, robots, automatización digital y plataformas. Diferencia clave: ahora la máquina hace trabajo cognitivo (decidir, escribir, recomendar), no solo físico.
      ejemplo: |-
        Un radiólogo usa IA que detecta tumores. Eso no es ciencia ficción — es 2026. La pregunta es si la IA lo complementa o lo sustituye.
      emoji: "🤖"
    - termino: Oficio sustituido
      definicion: |-
        Trabajo que la máquina reemplaza por completo. Suelen ser tareas repetitivas y predecibles. Los humanos que vivían de ese oficio quedan sin lugar inmediato.
      ejemplo: |-
        Lechero (sustituido por la pasteurización industrial), telefonista (sustituido por centralita automática), digitador (sustituido por OCR + dictado).
      emoji: "❌"
    - termino: Oficio transformado
      definicion: |-
        Sigue existiendo pero cambia de forma. La habilidad central sobrevive en un nuevo formato. Quien sabe trasladarla se reinventa; quien no, se queda atrás.
      ejemplo: |-
        Cajero bancario: antes contaba billetes, hoy asesora sobre productos financieros. La habilidad social sobrevivió, la operativa fue automatizada.
      emoji: "🔄"
    - termino: Oficio complementado
      definicion: |-
        La máquina no reemplaza al humano: lo hace más productivo. Trabajan en equipo. Estos oficios suelen aumentar sus ingresos.
      ejemplo: |-
        Médico con escáner de IA: la IA detecta patrones, el médico interpreta y decide. Juntos hacen mejor diagnóstico que cualquiera solo.
      emoji: "🤝"
    - termino: Oficio creado
      definicion: |-
        No existía antes de la máquina. Surgió para diseñar, mantener o cuestionar la tecnología misma. Suelen ser los mejor pagados — y los más escasos en el sur global.
      ejemplo: |-
        Programador, científico de datos, community manager, especialista en ética de IA. Ninguno existía hace 30 años.
      emoji: "✨"
  quiz:
    titulo: "✅ Verifica el lenguaje de las revoluciones"
    instrucciones: |-
      5 preguntas para confirmar que distingues los 4 estados de un oficio frente a la máquina. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: |-
          Un médico que usa IA para detectar tumores y luego decide el tratamiento — ¿en qué estado está su oficio?
        opciones:
          - Sustituido
          - Transformado
          - Complementado
          - Creado
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Complementado: la máquina no lo reemplaza, lo hace más productivo. Juntos hacen mejor diagnóstico que cualquiera solo.
        feedback_incorrecto: |-
          Es complementado. La máquina ayuda al médico, no lo sustituye. Esta es una de las relaciones humano-máquina más sostenibles.
      - enunciado: ¿Cuál de estos oficios fue sustituido (no transformado) por la revolución industrial?
        opciones:
          - Sastre
          - Telefonista de centralita manual
          - Carpintero
          - Maestro
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La centralita automática sustituyó a la telefonista por completo. Sastre, carpintero y maestro siguen existiendo (transformados).
        feedback_incorrecto: |-
          La telefonista fue sustituida cuando llegaron las centralitas automáticas. Sastre, carpintero y maestro existen aún, transformados.
      - enunciado: ¿Cuál es la pregunta más importante al leer una revolución técnica?
        opciones:
          - ¿Es nueva la tecnología?
          - ¿Quién gana económicamente y quién paga el costo?
          - ¿Es bonita la máquina?
          - ¿Cuándo se inventó?
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Toda revolución técnica reparte beneficios y costos. Sin esa pregunta, la historia de la técnica se vuelve ingenua.
        feedback_incorrecto: |-
          ¿Quién gana y quién paga? La revolución industrial inglesa se hizo con algodón colombiano. Sin esa pregunta no se entiende quién pagó el progreso.
      - enunciado: Si una IA puede escribir correos profesionales — ¿qué pasará con el oficio de "asistente ejecutivo"?
        opciones:
          - Será sustituido por completo
          - |-
            Será transformado: las tareas operativas (correo, agenda) las hará la IA; las relacionales (gestión humana) seguirán siendo del humano
          - Será creado nuevo
          - No cambiará nada
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Las tareas operativas se automatizan; las relacionales y de juicio sobreviven. El asistente que se reinventa se enfoca en lo humano.
        feedback_incorrecto: |-
          Será transformado. La IA hace lo operativo; el asistente humano se enfoca en gestión de personas, juicio en situaciones nuevas, relaciones.
      - enunciado: En el saber ancestral del herrero del Valle, ¿qué aplica a tu propio futuro laboral?
        opciones:
          - Nada — los oficios antiguos no tienen que ver con hoy
          - Que cada revolución abre una nueva forma del oficio si sabes reinventarte
          - Que el herrero ya no existe
          - Que la tradición siempre se pierde
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El herrero del Valle se reinventó 3 veces porque supo trasladar habilidades. Tú tendrás que reinventarte 5-10 veces en tu vida laboral.
        feedback_incorrecto: |-
          El herrero se reinventó 3 veces sin perder identidad. La habilidad de trasladar saberes entre revoluciones es lo que separa al que prospera del que se queda atrás.
  post_lectura:
    transferencia: |-
      Esta semana, escoge UN oficio de tu mapa (perdido o creado) e investiga 15 minutos: cuándo nació o desapareció, qué tecnología fue motor, qué pasó con las personas. Anota los hallazgos. El próximo lunes los traemos al aula — son insumo del proyecto integrador del periodo.
  cinco_dimensiones:
    personal: |-
      Conectaste tu propio futuro laboral con la historia de las revoluciones técnicas — ya no es teoría, es tu vida.
    emocional: |-
      La conversación con un mayor te conectó con memoria viva: oficios reales de tu familia que cambiaron en una generación.
    ciudadana: |-
      Entendiste que ningún progreso técnico es para todos por igual — siempre hay reparto, y vale la pena nombrarlo.
    local: |-
      Anclaste el aprendizaje en oficios de tu propia región (herrero del Valle, oficios familiares) y no solo en datos abstractos.
    intergeneracional: |-
      La entrevista familiar y el mapa local conectan tres generaciones: la del abuelo que perdió un oficio, la del padre que se reinventó, y la tuya que aún elige.

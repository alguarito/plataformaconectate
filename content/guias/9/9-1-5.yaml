titulo: Revolución industrial --- máquinas que cambiaron el trabajo
producto_final: |-
  Mapa visual de oficios ganados y perdidos entre el siglo XVIII y hoy, identificando 3 oficios que la máquina sustituyó y 3 que la máquina creó
saber_ancestral_idea: |-
  El oficio del herrero en el Valle del Cauca cambió tres veces: primero competía con el cobre indígena, luego con la importación europea, después con la fábrica industrial. Cada vez se reinventó. La pregunta no es si la tecnología quita trabajos --- es a quién permite reinventarse y a quién no.
verbos_actividades:
- IDENTIFICA
- ANALIZA
- EVALÚA
- CREA

clave: 1-5
grado: 9
periodo: 1
sesion: 5
completo: true
duracion_min: 90
titulo: Revolución industrial --- máquinas que cambiaron el trabajo
titulo_portada: |-
  Revolución industrial ---
  máquinas que
  cambiaron el trabajo
producto_final: |-
  Un mapa visual de oficios de tu región: tres que la máquina sustituyó y tres que la máquina creó, cada uno con nombre concreto, fecha aproximada y lugar. Al menos uno sale de lo que te contó una persona mayor de tu familia. El mapa se cierra con un cuadro que nombra a quién le sirvió cada cambio y a quién no.
apertura:
  origen: Caficultura tradicional colombiana · los oficios que venían asignados y la brecha que sigue
  fuente: |-
    Ramírez Bacca, R. (2015). Mujeres en la caficultura tradicional colombiana, 1910--1970. \emph{Historia y Memoria}, (10), 43--73. https://doi.org/10.19053/20275137.3200
  saber_ancestral: |-
    En la finca cafetera del siglo XX los oficios venían asignados. Un informe consular británico de comienzos de siglo dice que la recolección «la llevan a cabo mujeres y niños». Ellas eran además escogedoras en la trilladora, cocineras de los trabajadores, encargadas de los animales, de la huerta y del pancoger (Ramírez Bacca, 2015). A la recolectora la llamaron \textbf{chapolera}, por la chapola, el arbolito de café recién nacido. Cien años después la desigualdad no es pasado. El DANE (2022) muestra que en los predios rurales de un solo dueño el 63,7~\% son hombres y el 36,3~\% mujeres. En ningún departamento del país hay paridad. Y hay un dato que incomoda más: hay más mujeres con título que mujeres tomando las decisiones productivas. La \textbf{cara de exclusión} es el ancla misma. Hoy la chapolera circula como disfraz folclórico para turistas, y ese disfraz tapa que el reparto de oficios fue una decisión, no una costumbre.
  saber_contemporaneo: |-
    Cuando entra una máquina, los oficios de un lugar quedan en cuatro estados. \textbf{Sustituido}: la máquina hace lo que hacía una persona y el oficio desaparece. \textbf{Transformado}: el oficio sigue existiendo pero cambia de contenido. \textbf{Creado}: aparece un oficio que antes no tenía sentido. \textbf{Intacto}: la máquina no lo tocó, casi siempre porque no le salía a cuenta. Leer un cambio técnico es poner cada oficio en uno de esos cuatro estados y preguntar por el reparto. Quién ganó tiempo, quién ganó dinero y quién perdió el trabajo casi nunca son la misma persona. La revolución industrial no fue solo carbón y vapor: fue un reparto nuevo de quién hace qué. Y la parte que menos se cuenta es que ese reparto no cayó del cielo. Alguien decidió a quién le tocaba cada cosa.
  pregunta_puente: |-
    En la finca cafetera los oficios venían asignados y nadie los había escogido. ¿Qué oficio de tu casa está asignado hoy sin que nadie lo haya decidido en voz alta?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} oficios que desaparecieron y aparecieron en tu región, preguntándole a alguien que los vivió; (2) \textbf{explicar} los cuatro estados en que queda un oficio cuando entra una máquina; (3) \textbf{crear} un mapa de oficios ganados y perdidos que diga a quién le sirvió cada cambio.
puentes:
  a_ruta: |-
    Vienes de definir qué es técnica y de estudiar la balanza y las máquinas simples. Hoy miras qué pasa cuando la máquina entra a un lugar donde ya había gente trabajando. En la sesión 6 llega la imprenta, que hizo lo mismo con la palabra escrita.
  a_escuta: |-
    Antes de la teoría vas a preguntar. Una llamada a alguien mayor de tu familia vale más que diez páginas de libro, porque esa persona vio desaparecer un oficio con nombre propio.
  a_sistematizacion: |-
    Ya tienes testimonio. Ahora vas a ordenarlo en los cuatro estados y a mirar el reparto: quién ganó y quién perdió con cada cambio.
  a_praxis: |-
    Tienes el criterio. Toca dibujar el mapa de tu región y sostener con datos quién salió ganando.
  a_producto: |-
    Lo que entregas hoy: el mapa con seis oficios y el cuadro del reparto. La prueba de calidad: alguien que no estuvo en clase lo entiende sin que se lo expliques.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un cambio técnico siempre reparte, y decir que «el progreso» es el responsable es no nombrar a nadie.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre máquinas y trabajo: Dussel sobre la máquina que vuelve instrumento al hombre, Epicteto sobre las opiniones que atormentan, Floridi sobre una libertad que no ocurre en el vacío.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Un oficio que ya no existe} (15 min · individual). (1) Llama o habla con alguien de tu familia mayor de cuarenta años. (2) Pregúntale qué oficio había en su juventud que hoy ya no existe. (3) Pregúntale qué oficio existe hoy que no existía entonces. (4) Anota el nombre exacto de cada oficio, el año aproximado y el lugar. (5) Pregúntale qué le pasó a la gente que vivía del oficio que desapareció.
  checks:
  - Tengo el nombre exacto de un oficio desaparecido, con año y lugar.
  - Tengo el nombre de un oficio nuevo, con año aproximado.
  - Anoté qué le pasó a la gente que vivía del oficio que desapareció.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Un oficio que ya no existe». \textbf{Formato:} ficha con el nombre de quien te contó, el oficio desaparecido con año y lugar, el oficio nuevo, y qué pasó con la gente. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} los dos oficios tienen nombre propio, no categoría.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los cuatro estados de un oficio} (20 min · parejas). (1) Con tu pareja, escriban los cuatro estados con una frase propia cada uno. (2) Clasifiquen en ellos los oficios que trajeron de sus entrevistas. (3) Elijan uno y escriban quién ganó tiempo, quién ganó dinero y quién perdió el trabajo. (4) Comprueben si las tres respuestas son la misma persona y escriban qué significa que no lo sean.
  pilares:
  - |-
    \textbf{Los cuatro estados.} Sustituido: la máquina hace lo que hacía una persona. Transformado: el oficio sigue, pero cambia por dentro. Creado: aparece uno que antes no tenía sentido. Intacto: la máquina no lo tocó, casi siempre porque no le salía a cuenta.
  - |-
    \textbf{El reparto es la pregunta.} Quién gana tiempo, quién gana dinero y quién pierde el trabajo casi nunca son la misma persona. Cuando lo son, no hubo conflicto. Cuando no lo son, hubo un reparto y conviene nombrarlo.
  - |-
    \textbf{Los oficios asignados no son costumbre.} En la finca cafetera alguien decidió que la recolección y la escogida eran de mujeres y niños. No fue la naturaleza ni la tradición: fue una decisión que se repitió tanto que dejó de parecer una.
  - |-
    \textbf{Tener el título no es decidir.} El dato del DANE lo muestra: hay más mujeres con predio a su nombre que mujeres tomando las decisiones productivas. Poseer y decidir son dos cosas distintas, y confundirlas esconde la desigualdad.
  anatomia:
    titulo: Un oficio cuando entra una máquina
    body: |-
      \textbf{Sustituido:} la máquina lo hace. \\[1mm] \textbf{Transformado:} sigue, pero cambia por dentro. \\[1mm] \textbf{Creado:} antes no tenía sentido. \\[1mm] \textbf{Intacto:} no salía a cuenta automatizarlo. \\[1mm] \textbf{Pregunta:} ¿quién ganó tiempo, quién ganó dinero, quién perdió el trabajo?
  errores_comunes: |-
    (1) \textbf{Decir «el progreso» como responsable}: el progreso no decide, deciden personas e instituciones. (2) \textbf{Nombrar categorías en vez de oficios}: «los obreros» no es un oficio; «trilladora» o «telegrafista» sí. (3) \textbf{Tratar la desigualdad como pasado}: la brecha de propiedad rural es un dato de 2022. (4) \textbf{Romantizar el oficio perdido}: muchos eran durísimos y mal pagos. (5) \textbf{Olvidar los oficios intactos}: dicen mucho sobre qué no le convino automatizar a nadie.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los cuatro estados de un oficio». \textbf{Formato:} los cuatro estados con frase propia, los oficios de las entrevistas clasificados y el reparto de uno de ellos en tres renglones. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} sabes decir si las tres respuestas del reparto son la misma persona.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Mapa de oficios ganados y perdidos} (30 min · individual). (1) Dibuja una línea de tiempo de tu región, del siglo XX a hoy. (2) Pon tres oficios que la máquina sustituyó, con nombre, año aproximado y lugar. (3) Pon tres oficios que la máquina creó, con los mismos datos. (4) Marca cuál de los seis salió de tu entrevista. (5) Cierra con un cuadro que diga, para dos de ellos, a quién le sirvió el cambio y a quién no. (6) Muéstraselo a un compañero sin explicarle nada y anota qué no se entendió.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} La línea de tiempo con seis oficios. La marca en el que salió de tu entrevista. El cuadro del reparto para dos de ellos.
  - |-
    \textbf{Nombre propio, año y lugar.} «Telegrafista, años sesenta, oficina de Cartago» es un dato. «Los trabajos de antes» no lo es. Sin nombre propio no se puede comprobar nada.
  - |-
    \textbf{El mapa se lee sin ti al lado.} Si tu compañero necesita que se lo expliques, todavía falta jerarquía visual o falta un rótulo. Eso se arregla antes de entregar, no después.
  - |-
    \textbf{El cuadro del reparto es lo difícil.} Escribir «a quién le sirvió» obliga a nombrar a alguien: una empresa, unos dueños, unos clientes. Si no logras nombrar a nadie, es que todavía no averiguaste lo suficiente.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tres oficios sustituidos, con nombre, año y lugar. \\[1mm] \checkbox Tres oficios creados, con los mismos datos. \\[1mm] \checkbox Marcado el que salió de tu entrevista. \\[1mm] \checkbox Cuadro del reparto para dos oficios. \\[1mm] \checkbox El cuadro nombra a alguien concreto, no «el progreso». \\[1mm] \checkbox Un compañero lo entendió sin explicación.
  plantilla_guion: |-
    \textbf{Oficio perdido.} \textit{Nombre, año, lugar.} \\[1mm] \textbf{Oficio creado.} \textit{Nombre, año, lugar.} \\[1mm] \textbf{De la entrevista.} \textit{Quién me lo contó.} \\[1mm] \textbf{Reparto.} \textit{Quién ganó tiempo, quién ganó dinero, quién perdió el trabajo.} \\[1mm] \textbf{Prueba.} \textit{Qué no entendió mi compañero.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Mapa de oficios ganados y perdidos». \textbf{Formato:} la línea de tiempo con los seis oficios rotulados y el cuadro del reparto de dos de ellos. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} un compañero leyó el mapa sin que le explicaras nada.
  producto_titulo: Mapa de seis oficios ganados y perdidos + cuadro del reparto
  criterios:
  - Tres oficios sustituidos y tres creados, todos con nombre propio
  - Cada oficio tiene año aproximado y lugar concreto
  - Al menos uno salió de la entrevista a una persona mayor de tu familia
  - El cuadro del reparto nombra a alguien concreto, no a «el progreso»
  - Un compañero entendió el mapa sin explicación oral
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.5.6.3
    cita: |-
      La máquina, el robot, el «rostro material» del capital ha hecho del «rostro del hombre» un instrumento de sí mismo.
    aplicacion: |-
      No es que la máquina sea mala. Es que, cuando el que decide es el que la compra, la persona pasa a medirse por lo que la máquina necesita de ella. La escogedora de la trilladora sabía eso mucho antes de que se escribiera.
    pregunta_espejo: |-
      ¿En qué parte de mi día me estoy adaptando yo a una máquina, en vez de al revés?
  estoico:
    autor: Epicteto · Enquiridión, 5 (c. 125 d.C.)
    cita: |-
      No son las cosas las que atormentan a los hombres, sino las opiniones que se tienen de ellas.
    aplicacion: |-
      Que la recolección fuera «cosa de mujeres y niños» no venía del café ni de la máquina. Venía de una opinión repetida hasta parecer un hecho. Distinguir el hecho de la opinión heredada es la mitad del trabajo de hoy.
    pregunta_espejo: |-
      ¿Qué reparto de tareas doy por natural en mi casa sin que nadie lo haya decidido en voz alta?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.2
    cita: |-
      Nuestro yo es a la vez libre y social: la libertad no ocurre en el vacío, sino en un espacio de posibilidades y de límites. (trad. propia)
    aplicacion: |-
      Nadie elige su oficio en el aire. Se elige entre lo que hay, con la máquina que ya llegó y el reparto que ya existe. Ver esos límites no quita libertad: es lo que permite usarla con puntería.
    pregunta_espejo: |-
      ¿Qué opciones de trabajo tengo de verdad hoy, y quién definió esa lista?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el mapa y el cuadro del reparto. Pregúntale a la misma persona que entrevistaste si el oficio nuevo paga mejor que el que desapareció. En la sesión 6 vas a trabajar la imprenta, que hizo con la palabra escrita lo que la máquina hizo con el trabajo.
web:
  resumen: |-
    En la finca cafetera los oficios venían asignados: la recolección y la escogida eran de mujeres y niños. Cien años después, el DANE de 2022 muestra que la brecha de propiedad rural sigue y que hay más mujeres con título que mujeres decidiendo. Hoy mapeas los oficios que la máquina quitó y puso en tu región, y dices a quién le sirvió cada cambio.
  subtema: Historia de la técnica · Revoluciones del trabajo
  pre_lectura:
    por_que_importa: |-
      Cuando un cambio técnico se cuenta sin nombres, parece que no lo decidió nadie. Y siempre lo decidió alguien, casi nunca quien perdió el trabajo.
    pregunta_detonante: |-
      ¿Qué oficio conocías de niño que ya casi no ves, y qué fue de la gente que vivía de él?
    activacion:
      titulo: El oficio que ya no está
      descripcion: |-
        En 3 minutos, escribe el nombre de un oficio que veías de pequeño y hoy casi no existe. Al lado, escribe qué máquina o servicio ocupó su lugar.
      duracion_min: 3
    conexion:
      anterior: En la sesión 4 armaste la línea del tiempo de la técnica, del fuego a la imprenta.
      siguiente: En la sesión 6 trabajas la imprenta y diseñas tu propia hoja informativa.

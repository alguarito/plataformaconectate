clave: 1-6
grado: 9
periodo: 1
sesion: 6
completo: true
duracion_min: 90
titulo: La imprenta --- escribir muchas veces lo mismo
titulo_portada: |-
  La imprenta ---
  escribir muchas
  veces lo mismo
producto_final: |-
  Una hoja informativa de una página sobre un asunto de tu barrio o tu colegio, con los cinco elementos: titular corto, núcleo de tres o cuatro frases, llamada a la acción concreta, jerarquía visual clara y pie con autor, fecha y contacto. Se juzga con una prueba: alguien que pase al lado entiende qué hacer en treinta segundos.
apertura:
  origen: Decimeros del Pacífico caucano · la décima glosada, que se repite volviendo al inicio
  fuente: |-
    Oslender, U. (2003). «Discursos ocultos de resistencia»: tradición oral y cultura política en comunidades negras de la costa pacífica colombiana. \emph{Revista Colombiana de Antropología, 39}, 203--236.
  saber_ancestral: |-
    En la costa pacífica caucana, en Guapi y en el río Saija, los decimeros componen \textbf{décimas glosadas}. La forma es exacta: una copla inicial de cuatro versos y después cuatro décimas, cada una de las cuales termina en el verso que le corresponde de la copla. Cuarenta y cuatro versos en total. La esencia se declara primero y cada parte cierra volviendo a ella. Ulrich Oslender las estudió y las llamó \textbf{discursos ocultos de resistencia}: no son adorno, son memoria y crítica de comunidades negras que disputan el reconocimiento de su territorio (Oslender, 2003). Fíjate en algo que hoy nos parece raro. La décima no tiene un autor fijo: cada decimero añade o cambia, y la versión viaja de boca en boca. La imprenta hará justo lo contrario: fijará una sola versión y le pondrá un nombre. La \textbf{cara de exclusión}: esa tradición depende de mayores cada vez menos escuchados.
  saber_contemporaneo: |-
    Una hoja informativa que funciona tiene cinco elementos, y llevan quinientos años sin cambiar. \textbf{Titular}: corto, grande, entre cinco y diez palabras. \textbf{Núcleo}: tres o cuatro frases con lo que hay que saber. \textbf{Llamada a la acción}: qué se espera que haga quien lee, dicho con un verbo. \textbf{Jerarquía visual}: no todo puede tener el mismo tamaño, porque entonces nada resalta. \textbf{Pie}: quién lo firma, cuándo y cómo contactarlo. El pasquín colonial, el volante del negocio de la esquina y la publicación que se comparte hoy usan los mismos cinco. Lo que cambió con la imprenta fue la escala. Antes copiar era rehacer a mano, y cada copia salía un poco distinta. Después una plancha produjo mil ejemplares idénticos, y ahí empezó otra cosa: quien tenía la prensa decidía qué se repetía.
  pregunta_puente: |-
    La décima se repite cambiando y no tiene dueño; la imprenta repite igual y firma. ¿Cuál de las dos se parece más a lo que circula hoy en tu teléfono?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los cinco elementos en hojas reales, del pasquín al volante de barrio; (2) \textbf{explicar} qué cambia cuando una copia deja de hacerse a mano y pasa a salir idéntica mil veces; (3) \textbf{crear} tu hoja informativa de una página sobre un asunto que te importe, y probarla con alguien.
puentes:
  a_ruta: |-
    En la sesión 5 viste qué le hace una máquina al trabajo. Hoy ves qué le hace a la palabra escrita. En la sesión 7 llega la electricidad, que volvió a cambiar la escala de todo esto.
  a_escuta: |-
    Antes de la teoría vas a mirar tres hojas reales y a buscarles las costuras. Es más fácil ver los cinco elementos en el trabajo de otro que en el propio.
  a_sistematizacion: |-
    Ya viste los cinco elementos funcionando. Ahora vas a ordenarlos y a pensar qué cambia cuando la copia deja de hacerse a mano.
  a_praxis: |-
    Tienes el método. Toca diseñar la tuya sobre algo que de verdad te importe, y ponerla a prueba con alguien que no sepa de qué va.
  a_producto: |-
    Lo que entregas hoy: una hoja de una página con los cinco elementos. La prueba de calidad son treinta segundos: quien la mire debe saber qué hacer.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Tener con qué imprimir nunca fue lo mismo que tener algo que decir, y las dos cosas se reparten desigual.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre repetir y difundir: Dussel sobre el proyecto que se impone por todos los poros, Séneca sobre lo mucho y lo muy diverso, Floridi sobre los seis mil años que lleva la escritura.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Anatomía de tres hojas} (15 min · individual). (1) Consigue tres ejemplos. Un pasquín o una hoja volante histórica. Un volante de un negocio o un evento de tu barrio. Y una publicación que hayas visto compartida esta semana. (2) Búscale a cada uno los cinco elementos y marca cuáles tiene. (3) Anota cuál elemento falta más veces. (4) Escribe en una línea cuál de los tres te haría hacer algo, y por qué.
  checks:
  - Tengo los tres ejemplos y marqué sus cinco elementos.
  - Sé cuál elemento falta más veces en los tres.
  - Escribí cuál me haría hacer algo y por qué.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Anatomía de tres hojas». \textbf{Formato:} tabla de 3 filas y 5 columnas, una fila por ejemplo y una columna por elemento, con marca donde esté. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} puedes decir qué elemento falta más y cuál hoja te movería a actuar.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los cinco elementos y la escala} (20 min · parejas). (1) Con tu pareja, escriban los cinco elementos con una frase propia cada uno. (2) Tomen la peor de sus seis hojas y arréglenle el elemento que le falta, por escrito. (3) Escriban qué cambia cuando una copia deja de hacerse a mano y sale idéntica mil veces. (4) Anoten quién decidía qué se repetía en cada caso: la décima, el pasquín y lo que circula hoy.
  pilares:
  - |-
    \textbf{Los cinco elementos.} Titular corto y grande. Núcleo de tres o cuatro frases. Llamada a la acción con un verbo. Jerarquía visual, porque si todo pesa igual nada resalta. Pie con autor, fecha y contacto.
  - |-
    \textbf{La llamada a la acción es la que más falta.} Una hoja que informa y no dice qué hacer deja el trabajo a medias. «Ven el viernes a las 3 al patio» sirve; «participa» no sirve, porque no se puede cumplir.
  - |-
    \textbf{Copiar a mano y copiar en prensa no son lo mismo.} Cuando cada copia se rehacía a mano, todas salían algo distintas y el que copiaba también decidía. Con la prensa, mil salen iguales y quien decide es quien tiene la prensa.
  - |-
    \textbf{La décima repite de otra manera.} Vuelve a la copla en cada estrofa, pero cada decimero añade o cambia y no hay una versión oficial. Repetir con variación y repetir idéntico dan resultados muy distintos.
  anatomia:
    titulo: Los cinco elementos de una hoja
    body: |-
      \textbf{Titular:} corto, grande, 5 a 10 palabras. \\[1mm] \textbf{Núcleo:} 3 o 4 frases con lo indispensable. \\[1mm] \textbf{Acción:} qué hacer, con verbo, lugar y hora. \\[1mm] \textbf{Jerarquía:} si todo pesa igual, nada resalta. \\[1mm] \textbf{Pie:} autor, fecha, contacto.
  errores_comunes: |-
    (1) \textbf{Titular largo}: si pasa de diez palabras, ya nadie lo leyó completo. (2) \textbf{Todo del mismo tamaño}: sin jerarquía, la vista no sabe por dónde entrar. (3) \textbf{Llamada vaga}: «participa» no dice qué hacer; «ven el viernes a las 3 al patio» sí. (4) \textbf{Sin pie}: una hoja sin autor ni fecha no se puede verificar ni responder. (5) \textbf{Meter todo lo que se sabe}: el núcleo son tres o cuatro frases, no el tema completo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los cinco elementos y la escala». \textbf{Formato:} los cinco elementos con frase propia, el arreglo escrito de la peor hoja y las tres respuestas sobre quién decidía qué se repetía. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} el arreglo de la hoja mala está escrito, no solo dicho.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu hoja informativa} (30 min · individual). (1) Elige un asunto de tu colegio o tu barrio que te importe de verdad. (2) Escribe el titular en cinco a diez palabras. (3) Escribe el núcleo en tres o cuatro frases. (4) Escribe la llamada a la acción con verbo, lugar y hora. (5) Móntalo en una página cuidando la jerarquía, y añade el pie con tu nombre, la fecha y un contacto. (6) Enséñasela a un compañero durante treinta segundos y pregúntale qué haría.
  pilares:
  - |-
    \textbf{Tu entrega tiene una pieza y una prueba.} La hoja de una página con los cinco elementos. Y la respuesta de un compañero que la miró treinta segundos.
  - |-
    \textbf{El asunto tiene que importarte.} Una hoja sobre un tema que te da igual se nota en la primera frase. Si no se te ocurre ninguno, pregúntale a alguien del salón qué le molesta esta semana.
  - |-
    \textbf{La jerarquía se comprueba entrecerrando los ojos.} Mira tu hoja con los ojos casi cerrados: lo que se siga viendo es tu jerarquía real. Si se ve todo o no se ve nada, hay que arreglarla.
  - |-
    \textbf{Treinta segundos, no más.} Nadie se detiene a leer una hoja completa. Si en treinta segundos tu compañero no sabe qué hacer, el problema está en el titular o en la llamada, casi nunca en el núcleo.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Titular de cinco a diez palabras. \\[1mm] \checkbox Núcleo de tres o cuatro frases. \\[1mm] \checkbox Llamada a la acción con verbo, lugar y hora. \\[1mm] \checkbox Jerarquía visible al entrecerrar los ojos. \\[1mm] \checkbox Pie con nombre, fecha y contacto. \\[1mm] \checkbox Un compañero la miró treinta segundos y supo qué hacer.
  plantilla_guion: |-
    \textbf{Titular.} \textit{Cinco a diez palabras.} \\[1mm] \textbf{Núcleo.} \textit{Tres o cuatro frases.} \\[1mm] \textbf{Acción.} \textit{Verbo, lugar y hora.} \\[1mm] \textbf{Jerarquía.} \textit{Qué se ve al entrecerrar los ojos.} \\[1mm] \textbf{Pie.} \textit{Nombre, fecha, contacto.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Tu hoja informativa». \textbf{Formato:} el boceto de la hoja con los cinco elementos rotulados y lo que respondió tu compañero tras mirarla treinta segundos. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tu compañero dijo qué haría sin que se lo explicaras.
  producto_titulo: Hoja informativa de una página con los cinco elementos, probada en treinta segundos
  criterios:
  - El titular tiene entre cinco y diez palabras
  - El núcleo cabe en tres o cuatro frases
  - La llamada a la acción tiene verbo, lugar y hora
  - La jerarquía se sostiene al mirar la hoja con los ojos entrecerrados
  - Un compañero la miró treinta segundos y supo qué hacer
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.5.3.3
    cita: |-
      El proyecto del sistema imperante se impone a todos, unívocamente. Por medio de la propaganda, por los medios de comunicación, por el cine y la televisión… por todos los poros.
    aplicacion: |-
      Quien tiene con qué repetir decide qué se repite. Eso valía para la prensa de tipos móviles y vale para lo que hoy sale primero en una pantalla. Tu hoja es, en pequeño, tomar esa capacidad para algo tuyo.
    pregunta_espejo: |-
      ¿Qué mensaje he repetido esta semana sin haber decidido yo repetirlo?
  estoico:
    autor: Séneca · Cartas a Lucilio, 2 (c. 64 d.C.)
    cita: |-
      Empalagarse con muchas cosas es lo propio de los estómagos hastiados. Lo mucho y lo muy diverso, no nutre: contamina.
    aplicacion: |-
      Séneca lo decía de los libros y sirve igual para tu hoja. Tres frases bien escogidas informan; quince amontonadas no dejan nada. Cortar es la parte del oficio que más cuesta.
    pregunta_espejo: |-
      ¿Qué frase de mi hoja sobra, y por qué me cuesta quitarla?
  floridi:
    autor: Luciano Floridi · Hyperhistory and the Philosophy of Information Policies (2015)
    cita: |-
      La historia ha durado 6.000 años: empezó con la invención de la escritura en el cuarto milenio antes de Cristo. (trad. propia)
    aplicacion: |-
      Poder registrar es lo que separa a un pueblo con historia escrita de uno cuya memoria depende de que alguien la cuente. La décima resolvió eso sin imprenta, con estructura y repetición, durante siglos.
    pregunta_espejo: |-
      ¿Qué de lo que sé de mi familia está escrito en alguna parte, y qué solo existe si alguien lo cuenta?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la hoja terminada y con lo que dijo tu compañero. Si el asunto lo permite, pega la hoja donde corresponda y mira si alguien reacciona. En la sesión 7 vas a trabajar la electricidad y una emisora comunitaria del Valle.
web:
  resumen: |-
    En Guapi y el río Saija los decimeros componen décimas glosadas: cuarenta y cuatro versos donde la esencia se declara al principio y cada parte vuelve a ella. Se repiten cambiando, y no tienen dueño. La imprenta hizo lo contrario: fijó una versión, la firmó y la sacó mil veces idéntica. Hoy diseñas tu propia hoja con los cinco elementos que llevan siglos funcionando.
  subtema: Historia de la técnica · Voz pública y diseño editorial
  pre_lectura:
    por_que_importa: |-
      Tener con qué imprimir nunca fue lo mismo que tener algo que decir. Hoy cualquiera puede publicar, y por eso los cinco elementos importan más, no menos.
    pregunta_detonante: |-
      ¿Cuál fue la última hoja o publicación que te hizo hacer algo, y qué tenía que las demás no?
    activacion:
      titulo: Treinta segundos
      descripcion: |-
        En 2 minutos, recuerda un volante que hayas visto esta semana. ¿Sabrías decir qué te pedía que hicieras? Si no, ya sabes qué le faltaba.
      duracion_min: 3
    conexion:
      anterior: En la sesión 5 mapeaste los oficios que la máquina quitó y puso en tu región.
      siguiente: En la sesión 7 trabajas la electricidad y la radio comunitaria del Valle.
  mapa_ruta:
    - numero: 1
      iconos: ["🌱"]
      titulo: La décima que vuelve al inicio
      duracion_min: 10
    - numero: 2
      iconos: ["👁"]
      titulo: Actividad 1 · Anatomía de tres hojas
      duracion_min: 15
    - numero: 3
      iconos: ["📖"]
      titulo: Actividad 2 · Los cinco elementos y la escala
      duracion_min: 20
    - numero: 4
      iconos: ["✏️"]
      titulo: Actividad 3 · Tu hoja informativa
      duracion_min: 30
    - numero: 5
      iconos: ["✅", "💭"]
      titulo: Verifica, tres citas y tu compromiso
      duracion_min: 15
  actividades:
    - numero: 1
      verbo: IDENTIFICA
      titulo: Anatomía de tres hojas
      tiempo_min: 15
      modalidad: individual
      pasos:
        - Consigue un pasquín o volante histórico, un volante de tu barrio y una publicación compartida esta semana.
        - Búscale a cada uno los cinco elementos y marca cuáles tiene.
        - Anota cuál elemento falta más veces en los tres.
        - Escribe en una línea cuál de los tres te haría hacer algo, y por qué.
      cuaderno:
        titulo: Anatomía de tres hojas
        formato: tabla de 3 filas y 5 columnas, una fila por ejemplo y una columna por elemento
        extension: un tercio de página
      criterios:
        - Los tres ejemplos están marcados elemento por elemento.
        - Queda escrito cuál falta más y cuál hoja movería a actuar.
    - numero: 2
      verbo: EXPLICA
      titulo: Los cinco elementos y la escala
      tiempo_min: 20
      modalidad: parejas
      pasos:
        - Con tu pareja, escriban los cinco elementos con una frase propia cada uno.
        - Tomen la peor de sus seis hojas y arréglenle por escrito el elemento que le falta.
        - Escriban qué cambia cuando una copia deja de hacerse a mano y sale idéntica mil veces.
        - Anoten quién decidía qué se repetía en la décima, en el pasquín y en lo que circula hoy.
      cuaderno:
        titulo: Los cinco elementos y la escala
        formato: los cinco elementos con frase propia, el arreglo escrito de la peor hoja y las tres respuestas
        extension: media página
      criterios:
        - El arreglo de la hoja mala está escrito, no solo dicho.
        - Las tres respuestas nombran quién decidía en cada caso.
    - numero: 3
      verbo: CREA
      titulo: Tu hoja informativa
      tiempo_min: 30
      modalidad: individual
      pasos:
        - Elige un asunto de tu colegio o tu barrio que te importe de verdad.
        - Escribe el titular en cinco a diez palabras y el núcleo en tres o cuatro frases.
        - Escribe la llamada a la acción con verbo, lugar y hora.
        - Móntalo en una página cuidando la jerarquía y añade el pie con nombre, fecha y contacto.
        - Enséñasela a un compañero durante treinta segundos y pregúntale qué haría.
      cuaderno:
        titulo: Tu hoja informativa
        formato: el boceto de la hoja con los cinco elementos rotulados y lo que respondió tu compañero
        extension: media página
      criterios:
        - La hoja tiene los cinco elementos completos.
        - Un compañero dijo qué haría sin que se lo explicaras.
  conceptos_clave:
    - categoria: Los cinco elementos
      termino: Titular
      definicion: |-
        La línea grande y corta que decide si alguien sigue leyendo. Entre cinco y diez palabras.
      ejemplo: «El patio se inunda cada jueves» funciona. «Informativo sobre la situación del patio» no.
    - categoria: Los cinco elementos
      termino: Llamada a la acción
      definicion: Lo que se espera que haga quien lee, dicho con un verbo, un lugar y una hora.
      ejemplo: «Ven el viernes a las 3 al patio» se puede cumplir. «Participa» no se puede cumplir.
    - categoria: Los cinco elementos
      termino: Jerarquía visual
      definicion: |-
        El orden en que la vista entra a la página. Se comprueba entrecerrando los ojos: lo que se siga viendo es la jerarquía real.
      ejemplo: Si al entrecerrar los ojos se ve todo o no se ve nada, todavía no hay jerarquía.
    - categoria: Repetir
      termino: Copia a mano y copia impresa
      definicion: Copiar a mano rehace y varía; la prensa saca mil ejemplares idénticos y concentra la decisión en quien la tiene.
      ejemplo: El copista decidía algo en cada copia. Con la prensa, decide quien es dueño de la prensa.
    - categoria: Repetir
      termino: Décima glosada
      definicion: |-
        Forma de los decimeros del Pacífico: copla de cuatro versos y cuatro décimas que cierran cada una en su verso. Cuarenta y cuatro en total.
      ejemplo: Se repite volviendo al inicio, cada decimero añade o cambia, y no existe una versión oficial.
  cinco_dimensiones:
    personal: Escribiste algo que te importa de manera que otro pueda entenderlo en treinta segundos.
    emocional: Cortar frases propias duele. Es la parte del oficio que más se aprende haciéndola.
    ciudadana: Poder publicar y tener algo que decir no son lo mismo, y la primera se reparte muy desigual.
    local: El asunto de tu hoja pasa en tu colegio o tu cuadra, y hoy tiene una página donde antes no tenía ninguna.
    intergeneracional: La décima sostuvo memoria y crítica durante siglos sin una sola imprenta, con estructura y repetición.
  post_lectura:
    reflexion: |-
      Si tu hoja circulara mil veces idéntica, ¿qué frase te gustaría haber escrito mejor antes de que saliera?
    transferencia: |-
      Mira el próximo volante que te den en la calle y búscale los cinco elementos. Casi siempre falta la llamada a la acción.
    cierre: La décima repite volviendo al inicio y cambia en cada boca. La imprenta repite igual y firma. Hoy conviven las dos.
  quiz:
    titulo: ¿Sabes armar una hoja que funcione?
    instrucciones: Cinco preguntas sobre los cinco elementos y sobre qué cambió con la imprenta. No va al cuaderno.
    preguntas:
      - enunciado: ¿Cuál de estas es una llamada a la acción que sirve?
        opciones:
          - «Ven el viernes a las 3 al patio.»
          - «Participa activamente en las actividades del colegio.»
          - «Es importante que todos tomemos conciencia del tema.»
          - «Infórmate sobre lo que está pasando en tu entorno.»
        respuesta_index: 0
        feedback_correcto: Sí. Tiene verbo, lugar y hora, así que se puede cumplir o no cumplir.
        feedback_incorrecto: La que tiene verbo, lugar y hora. Las otras tres no se pueden cumplir ni comprobar.
      - enunciado: ¿Cómo se comprueba rápido si una hoja tiene jerarquía visual?
        opciones:
          - Contando cuántos tipos de letra distintos se usaron en total.
          - Midiendo el tamaño exacto del titular con una regla.
          - Mirándola con los ojos entrecerrados y viendo qué sobrevive.
          - Comparándola con otro volante del mismo tamaño de papel.
        respuesta_index: 2
        feedback_correcto: Correcto. Lo que se sigue viendo es la jerarquía real, no la que uno creía tener.
        feedback_incorrecto: Se entrecierran los ojos. Si se ve todo o no se ve nada, no hay jerarquía.
      - enunciado: ¿Qué cambió cuando la copia dejó de hacerse a mano?
        opciones:
          - Que el texto empezó a ser más fácil de leer para todos.
          - Que salieron mil ejemplares idénticos y decidió quien tenía la prensa.
          - Que los copistas pudieron dedicarse a corregir errores ajenos.
          - Que las hojas dejaron de necesitar un autor identificable.
        respuesta_index: 1
        feedback_correcto: Eso es. Antes cada copia variaba y el copista decidía algo; después, decide el dueño de la prensa.
        feedback_incorrecto: Que aparecieron mil copias idénticas y la decisión se concentró en quien tenía la prensa.
      - enunciado: ¿Qué caracteriza a la décima glosada de los decimeros del Pacífico?
        opciones:
          - Que se escribe siempre en cuadernos que pasan de mano en mano.
          - Que tiene un autor reconocido que autoriza cada nueva versión.
          - Que cada décima cierra en su verso de la copla inicial.
          - Que solo se compone durante las fiestas patronales del pueblo.
        respuesta_index: 2
        feedback_correcto: "Sí: copla de cuatro versos y cuatro décimas que vuelven a ellos, cuarenta y cuatro en total."
        feedback_incorrecto: Que cada décima termina en el verso que le toca de la copla. Y no tiene autor fijo.
      - enunciado: Tu núcleo informativo tiene doce frases. ¿Qué conviene hacer?
        opciones:
          - Dejarlo así, porque más información siempre ayuda a quien lee.
          - Reducirlo a tres o cuatro frases con lo indispensable.
          - Pasar la mitad al titular para que se lea antes.
          - Aumentar el tamaño de la letra para que quepa mejor.
        respuesta_index: 1
        feedback_correcto: Correcto. Lo mucho y lo muy diverso no nutre, decía Séneca, y con las hojas pasa igual.
        feedback_incorrecto: Se reduce a tres o cuatro frases. Doce frases amontonadas no dejan nada en quien pasa.

grado: 9
periodo: 1
sesion: 6
completo: true
titulo: La imprenta --- escribir muchas veces lo mismo
titulo_portada: |-
  La imprenta ---
  escribir muchas veces
  lo mismo
producto_final: Hoja informativa de 1 página diseñada por el estudiante (estilo pasquín o volante) sobre un tema de interés local, lista para difundir
apertura:
  saber_ancestral: |-
    Antes de Gutenberg ya había \textbf{repetición}: los \emph{sellos mesoamericanos} estampaban diseños iguales en telas, los \emph{cilindros mayas} reproducían glifos, las \emph{estampas textiles wayuu} repetían patrones generación tras generación, las \emph{marcas de ganado} del Valle identificaban hatos enteros con un mismo símbolo. La imprenta no inventó repetir --- la inventó al \emph{texto en masa}. En el Valle del Cauca, los \textbf{pasquines y hojas volantes} fueron arma política de pueblos que no tenían periódicos propios: una sola persona escribía, otros multiplicaban a mano o con prensa improvisada, y la información circulaba antes de que las autoridades pudieran censurarla.
  origen: Pasquines del Valle y tradiciones de repetición mesoamericana, wayuu y maya
  saber_contemporaneo: |-
    Hoy ``imprimir'' incluye redes sociales: cada post tuyo se ``imprime'' en millones de pantallas en segundos. Pero a diferencia del pasquín, no eres tú quien controla la distribución --- es un algoritmo. El \textbf{principio de la imprenta} (un original, muchas copias, audiencia grande) se conserva. Lo que cambia es la velocidad (instantánea), la escala (global) y la propiedad de los medios (ya no es tu prensa, es la plataforma).
  pregunta_puente: |-
    ¿Qué tienen en común una hoja volante del Valle hace 200 años y un post viral en redes hoy? ¿Y en qué se diferencian profundamente?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los elementos visuales que una hoja informativa eficaz comparte con un post viral (titular, jerarquía, llamada a la acción); (2) \textbf{explicar} por qué Gutenberg cambió el acceso al conocimiento; (3) \textbf{aplicar} principios de diseño editorial básico (jerarquía, contraste, espacio) a una hoja propia; (4) \textbf{crear} una hoja informativa de 1 página sobre un tema de interés local de tu comunidad.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 5 vio cómo las máquinas cambian el trabajo; hoy ves cómo una máquina específica --- la imprenta --- cambió quién puede hablar al pueblo. Esa es la antesala del diseño editorial digital que verás en P2.
  a_escuta: |-
    Antes de diseñar tu propia hoja, vamos a analizar hojas volantes reales del Valle y pasquines históricos. Lo que ves ahí son decisiones de diseño que llevan siglos funcionando.
  a_sistematizacion: |-
    Ya viste hojas reales. Ahora vamos a entender los \textbf{5 elementos} que toda hoja eficaz comparte: titular, jerarquía visual, núcleo informativo, llamada a la acción, datos de pie. Esos 5 elementos siguen siendo la base del diseño editorial digital hoy.
  a_praxis: |-
    Tienes el método. Toca producir: tu propia hoja informativa de 1 página sobre un tema que importa a tu comunidad. Sin tipografía profesional, sin Adobe --- con un cuaderno, un lápiz y criterio.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 1 hoja informativa diseñada. El criterio principal: que un peatón pueda leerla en 30 segundos y saber qué hacer con esa información.
  a_evaluacion: |-
    Antes de cerrar, mira el oficio de imprimir desde las cinco dimensiones humanas. La imprenta no es nostalgia: es la antesala de la libertad de expresión, y vale la pena nombrar quién la tiene y quién no.
  a_triangulo: |-
    Y para terminar, tres voces sobre imprimir. Dussel sobre el silencio de los pueblos sin imprenta, Marco Aurelio sobre lo que vale escribir, Floridi sobre la imprenta y la infoesfera global.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Anatomía de hojas reales} (15 min · individual). Busca 3 ejemplos visuales: (a) un \emph{pasquín histórico} (búscalo: ``pasquines colombianos historia'' o ``hojas volantes Valle del Cauca''), (b) un \emph{volante moderno} (de un negocio del barrio, un evento), (c) un \emph{post viral} de redes sociales reciente. Para cada uno: ¿qué se ve primero? ¿qué viene segundo? ¿qué llamada a la acción tiene?
  checks:
  - Encontré 3 ejemplos visuales distintos (1 histórico + 1 volante moderno + 1 post viral).
  - Identifiqué qué leo primero, segundo, tercero en cada uno.
  - Reconocí qué llamada a la acción tiene (o si no tiene).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 anatomías de hojas eficaces». \textbf{Formato:} tabla de 5 columnas (Pieza~|~Titular~|~Núcleo informativo~|~Llamada a la acción~|~Qué emoción transmite), 3 filas. \textbf{Sabes que terminaste cuando} para cada pieza puedes decir en 1 frase qué hace que se entienda en 30 segundos.
sistematizacion:
  intro: |-
    Toda hoja informativa eficaz --- del pasquín al post viral --- comparte 5 elementos. Vamos a descomponerlos con los pilares del pensamiento computacional para que tu propia hoja tenga estructura.
  pilares:
  - |-
    Una hoja eficaz se descompone en 5 elementos: (1) \textbf{titular} (lo que se lee primero, debe captar en 2 segundos), (2) \textbf{jerarquía visual} (qué se ve segundo, tercero, según importancia), (3) \textbf{núcleo informativo} (la idea principal en pocas frases), (4) \textbf{llamada a la acción} (qué hacer después: asistir, llamar, escribir), (5) \textbf{datos de pie} (quién publica, dónde, cuándo).
  - |-
    Toda hoja sigue el patrón \textbf{``escaneo, no lectura''}: nadie lee tu hoja palabra por palabra. La escanea en 5-15 segundos. Si en ese tiempo no entendió de qué se trata y qué hacer, perdiste. Diseñar para escaneo es lo que separa la hoja profesional del panfleto torpe.
  - |-
    Lo esencial de una hoja cabe en una pregunta: \emph{¿qué quiero que el lector haga después de leer esto?}. Si no tienes respuesta clara, todavía no estás listo para diseñar. La acción posterior es el norte.
  - |-
    Pasos: (1) define la acción que quieres provocar; (2) escribe el titular más fuerte posible (corto, claro, urgente); (3) escribe el núcleo informativo en 3-4 frases; (4) decide la jerarquía visual (qué grande, qué chico, qué color); (5) cierra con llamada a la acción concreta.
  anatomia:
    titulo: Anatomía de una hoja informativa eficaz
    body: |-
      \textbf{Titular:} 5-10 palabras, grande, arriba. \\[1mm] \textbf{Subtítulo o gancho:} 1 frase que complementa. \\[1mm] \textbf{Núcleo informativo:} 3-4 frases con la idea central. \\[1mm] \textbf{Visual:} dibujo, foto, diagrama o ícono que ancla la atención. \\[1mm] \textbf{Llamada a la acción:} qué hacer (asistir, llamar, escribir) con datos concretos. \\[1mm] \textbf{Pie:} quién publica, cuándo, contacto.
  errores_comunes: |-
    (1) Titular largo y abstracto (``Información importante para la comunidad'') --- nadie lee. (2) Todo del mismo tamaño --- el ojo no sabe por dónde empezar. (3) No tener llamada a la acción --- el lector se va sin saber qué hacer. (4) Texto en bloque sin respiro --- desalienta antes de empezar. (5) Olvidar los datos de pie --- pierde credibilidad.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 5 elementos de una hoja eficaz». \textbf{Formato:} 5 fichas, una por elemento, cada una con definición en tus palabras + 1 ejemplo concreto que te imaginas para tu hoja final. \textbf{Sabes que terminaste cuando} puedes explicar los 5 elementos sin notas y tienes claro qué irá en cada uno de TU propia hoja.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu hoja informativa de 1 página} (35 min · individual). Hora de diseñar. Vas a hacer una hoja real sobre un tema de interés local que te importe a ti --- evento del colegio, problema del barrio, propuesta para la comunidad. El diseño es a mano en hoja A4, con criterio de pasquín moderno.
  pilares:
  - |-
    Tu hoja se descompone en 4 momentos del proceso: (1) decidir el tema y la acción a provocar, (2) escribir titular + núcleo + llamada a la acción, (3) decidir jerarquía visual (tamaños, colores, espacios), (4) ejecutar el diseño a mano en hoja A4.
  - |-
    Sigue el patrón \textbf{``regla del 1-2-3''}: 1 titular que pega, 2-3 frases de núcleo, 1 llamada a la acción. Si tu hoja tiene más texto que eso, no se va a leer.
  - |-
    Cada elemento expresa una sola idea. Si tu titular dice 3 cosas, parte la hoja en 3. Si tu llamada dice ``ven, escribe, llama'' --- elige UNA, la más fuerte.
  - |-
    Algoritmo: (1) elige tema y acción; (2) escribe en hoja borrador 3 versiones del titular; (3) elige la más fuerte; (4) escribe el núcleo en 3 frases; (5) decide qué va más grande y qué más pequeño; (6) ejecuta a mano en hoja A4 final; (7) muéstrala a un compañero --- ¿entiende en 30 segundos?
  checklist:
    titulo: Checklist antes de cerrar la hoja
    items: |-
      \checkbox Titular grande, claro, 5-10 palabras. \\[1mm] \checkbox Núcleo informativo de 3-4 frases máximo. \\[1mm] \checkbox Llamada a la acción concreta (qué hacer, cuándo, cómo). \\[1mm] \checkbox Jerarquía visual clara (algo grande, algo mediano, algo chico). \\[1mm] \checkbox Datos de pie (quién publica + fecha + contacto). \\[1mm] \checkbox Un compañero entiende qué hacer en 30 segundos.
  plantilla_guion: |-
    \textbf{Tema y acción.} \textit{Qué tema y qué quiero que el lector haga.} \\[1mm] \textbf{Titular elegido.} \textit{La versión más fuerte de las 3 que intenté.} \\[1mm] \textbf{Núcleo informativo.} \textit{3-4 frases con la idea central.} \\[1mm] \textbf{Hoja A4 final.} \textit{Diseño a mano con jerarquía visible.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi hoja informativa de 1 página». \textbf{Formato:} (1) decisión de tema + acción anotada, (2) 3 versiones de titular con la elegida marcada, (3) hoja A4 final pegada o dibujada. \textbf{Extensión:} 1 página de cuaderno + 1 hoja A4 separada. \textbf{Sabes que terminaste cuando} un peatón puede leer tu hoja en 30 segundos y entender qué hacer.
  producto_titulo: Hoja informativa A4 estilo pasquín sobre un tema de interés local
  criterios:
  - Titular grande, claro y corto (5-10 palabras)
  - Núcleo informativo de máximo 3-4 frases
  - Llamada a la acción concreta y específica
  - Jerarquía visual clara (no todo del mismo tamaño)
  - Datos de pie con autor + fecha + contacto
  - Un peatón entiende qué hacer en 30 segundos
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Donde no hay imprenta propia, no hay voz pública; donde no hay voz pública, no hay comunidad política.
    aplicacion: |-
      Antes del XIX, los pueblos colonizados no tenían imprenta propia. Eso no era casualidad: la imprenta estaba reservada a la corona y la iglesia. Cuando los pasquines y hojas volantes empezaron a circular en las plazas, el poder se asustó --- porque el monopolio de la voz pública se rompía. Hoy las redes sociales replican esa lucha: quien controla la distribución, controla la voz pública. La pregunta es si lo que escribes en redes te pertenece o le pertenece a la plataforma.
    pregunta_espejo: |-
      ¿Tengo medios propios para hacer llegar mi voz a mi comunidad, o dependo totalmente de plataformas controladas por otros? ¿Qué pasaría si esas plataformas censuraran lo que digo?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Escribe pocas cosas pero verdaderas; muchas palabras vacías son más ruido que silencio.
    aplicacion: |-
      La era de la imprenta nos dio acceso al texto; la era digital nos dio inflación de texto. Hoy producir un post de Instagram, un correo, un mensaje cuesta cero --- por eso multiplicamos contenido vacío sin pensar. La disciplina estoica: escribir solo lo que aporta. Una hoja bien hecha vale más que 100 posts mal hechos.
    pregunta_espejo: |-
      De lo que escribí esta semana en redes y correos, ¿cuánto aporta valor a alguien? ¿Cuánto es ruido que solo suma a la saturación?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La imprenta fue la primera tecnología que escaló radicalmente la infoesfera humana; las redes son la segunda.
    aplicacion: |-
      Gutenberg escaló la palabra escrita 1000 veces. Internet la escaló otro millón. Pero el principio sigue siendo el mismo: un original, muchas copias, audiencia grande. La diferencia es que ahora el original también puede ser una imagen, un video, un dato. Lo que escribes hoy en redes se ``imprime'' simultáneamente en miles de feeds --- y esa cifra es el primer paso para tomarlo en serio.
    pregunta_espejo: |-
      Si lo que estoy a punto de publicar fuera a aparecer en 1000 hojas impresas con mi nombre, ¿lo seguiría publicando? ¿Cambiaría algo?
compromiso: |-
  \textbf{Para la próxima semana.} Imprime o haz fotocopia de tu hoja informativa (5-10 copias) y distribúyela en tu salón, casa o barrio. Anota durante 3 días qué respuesta tuvo: ¿alguien hizo la acción que propusiste? Esa retroalimentación es más valiosa que una nota. El próximo lunes traemos esos hallazgos al aula.
web:
  resumen: |-
    Diseñas una hoja informativa propia siguiendo la lógica del pasquín. Del original-muchas copias al post viral, el principio se mantiene.
  subtema: Historia de la técnica · Voz pública y diseño editorial
  pre_lectura:
    por_que_importa: |-
      El principio de la imprenta — un original, muchas copias, audiencia grande — sigue siendo la base de toda comunicación masiva. Aprender a hacer una hoja que se entiende en 30 segundos es la habilidad de fondo detrás de un post viral, una valla, un volante o un email importante.
    pregunta_detonante: |-
      Si tuvieras que avisar a tu barrio sobre algo importante mañana y no pudieras usar redes — solo papel y fotocopia — ¿qué dirías y cómo lo dirías?
    activacion:
      titulo: El test de 5 segundos
      descripcion: |-
        En 3 minutos, mira algún volante o cartel que tengas a la vista (en tu casa, en la calle, en el colegio). Calcúlate 5 segundos para mirarlo. ¿Qué entendiste? ¿Sabes qué hacer? Si no, el diseñador falló. Si sí, está bien hecho.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 5 viste cómo las máquinas cambian el trabajo. Hoy ves cómo una máquina específica (la imprenta) cambió quién puede hablar al pueblo.
      siguiente: |-
        En la sesión 7 verás la electricidad como hito que reorganizó el tiempo humano y la cocina cotidiana.
  conceptos_clave:
    - termino: Titular
      definicion: |-
        5-10 palabras grandes arriba de la hoja. Lo que se lee primero. Si no captura en 2 segundos, el resto de la hoja se pierde.
      ejemplo: |-
        Mal: "Información importante para la comunidad". Bien: "Asamblea del barrio · sábado 10 AM". Específico, urgente, accionable.
      emoji: "📣"
    - termino: Jerarquía visual
      definicion: |-
        El tamaño y la posición indican qué importa más. Algo grande arriba, algo mediano en el centro, algo chico abajo. Si todo es del mismo tamaño, el ojo no sabe por dónde empezar.
      ejemplo: |-
        Titular muy grande, subtítulo mediano, cuerpo de texto normal, datos de contacto pequeños. El ojo recorre la jerarquía sin que tú tengas que explicarla.
      emoji: "📐"
    - termino: Núcleo informativo
      definicion: |-
        La idea principal en 3-4 frases máximo. Responde qué, dónde, cuándo, por qué. Sin esto, el lector queda con preguntas pero sin respuesta.
      ejemplo: |-
        "La basura no pasa el miércoles por una huelga. Llévala al punto de acopio de la calle 7. Funciona hasta el viernes". 3 frases, claras.
      emoji: "📝"
    - termino: Llamada a la acción
      definicion: |-
        Qué quieres que el lector haga después de leer. Concreta, específica, con datos. Sin esto, leyeron pero no actúan.
      ejemplo: |-
        Mal: "Apóyenos". Bien: "Trae 3 botellas plásticas el sábado 10 AM al parque". Verbo + qué + cuándo + dónde.
      emoji: "🎯"
    - termino: Diseño para escaneo
      definicion: |-
        Nadie lee tu hoja palabra por palabra. La escanea en 5-15 segundos. Si en ese tiempo no entendió, perdiste. Diseñar para escaneo separa el profesional del aficionado.
      ejemplo: |-
        Bloques cortos con respiro, viñetas en lugar de párrafos largos, palabras clave en negrita. El ojo encuentra lo importante saltando.
      emoji: "👁"
    - termino: Datos de pie
      definicion: |-
        Quién publica, fecha, contacto. Si esto falta, pierdes credibilidad. Una hoja anónima sin fecha se siente sospechosa o irrelevante.
      ejemplo: "\"JAC barrio La Esperanza · 12 de mayo de 2026 · WhatsApp 300-555-1234\". Tres datos que cambian todo."
      emoji: "📌"
  quiz:
    titulo: "✅ Verifica los principios del pasquín"
    instrucciones: |-
      5 preguntas para confirmar que dominas la lógica del original-muchas copias. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Cuántas frases máximo debe tener el núcleo informativo de una hoja eficaz?
        opciones:
          - 1 frase
          - 3-4 frases
          - 10 frases
          - Todo el texto que quepa
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. 3-4 frases máximo. Más texto = no se lee. Menos = falta información. El equilibrio es decir lo esencial sin desperdiciar atención.
        feedback_incorrecto: |-
          3-4 frases máximo. Nadie lee tu hoja como libro — la escanea. Más texto pierde lectores; menos deja preguntas.
      - enunciado: ¿Cuál es el error más grave de un titular?
        opciones:
          - Ser corto
          - Ser abstracto y vago ("Información importante para la comunidad")
          - Tener mayúsculas
          - Estar arriba
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Un titular abstracto no captura. "Asamblea del barrio sábado 10 AM" funciona mejor que "Información importante para la comunidad".
        feedback_incorrecto: |-
          Abstracción mata el titular. "Información importante" no informa nada. Específico, urgente, accionable — esa es la fórmula.
      - enunciado: ¿Qué pasa si tu hoja no tiene llamada a la acción?
        opciones:
          - Nada, está bien igual
          - El lector lee pero no actúa — perdiste la oportunidad
          - Se ve mejor
          - Es más profesional
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Sin acción concreta, hasta el mejor texto se vuelve curiosidad. Cada hoja debe terminar en qué hacer + cuándo + dónde.
        feedback_incorrecto: |-
          Sin llamada a la acción, el lector se va. Toda hoja debe contestar "¿qué hago con esta información?" en una línea clara.
      - enunciado: ¿Cuántos segundos suele tener una hoja para captar la atención?
        opciones:
          - 5-15 segundos
          - 5 minutos
          - 1 hora
          - Hasta que termine de leer
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. La gente escanea, no lee. Diseñar para escaneo de 5-15 segundos es la diferencia entre pasquín profesional y panfleto torpe.
        feedback_incorrecto: |-
          5-15 segundos. La hoja se escanea, no se lee. Si en ese tiempo no entendiste qué es y qué hacer, el diseñador falló.
      - enunciado: En el saber ancestral del pasquín del Valle, ¿qué aplica directamente a un post viral hoy?
        opciones:
          - Nada — los pasquines son antiguos
          - El principio "un original, muchas copias, audiencia grande" + la necesidad de captar atención rápido
          - Que se imprimían en papel
          - Que eran clandestinos
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. Pasquín y post viral comparten lógica de multiplicación. La diferencia es la velocidad y la propiedad de los medios — no el principio.
        feedback_incorrecto: |-
          El principio "un original + multiplicación + audiencia grande" y la urgencia de captar atención. La diferencia con el pasquín es que ahora la plataforma controla la distribución.
  post_lectura:
    transferencia: |-
      Esta semana, imprime o haz fotocopia de tu hoja (5-10 copias) y distribúyela en tu salón, casa o barrio. Anota durante 3 días qué respuesta tuvo — ¿alguien hizo la acción que propusiste? Esa retroalimentación es más valiosa que una nota. El próximo lunes traemos los hallazgos.
  cinco_dimensiones:
    personal: Aprendiste a comunicarte con criterio editorial — no más volantes torpes, no más posts vacíos.
    emocional: Sentiste el desafío de decir lo esencial en pocas frases — disciplina que cuesta y libera.
    ciudadana: "Conectaste el pasquín con la voz pública: quien tiene medios propios tiene poder político."
    local: Anclaste la sesión en pasquines reales del Valle y oficios de la imprenta colombiana del siglo XX.
    intergeneracional: El principio "un original, muchas copias" sobrevive desde Gutenberg hasta tu próximo post viral.

titulo: La imprenta --- escribir muchas veces lo mismo
producto_final: |-
  Hoja informativa de 1 página diseñada por el estudiante (estilo pasquín o volante) sobre un tema de interés local, lista para "imprimir" o difundir
saber_ancestral_idea: |-
  Antes de Gutenberg ya había repetición: sellos mesoamericanos, estampas textiles wayuu, marcas de ganado. La imprenta democratizó masivamente lo que antes solo unos pocos podían hacer. En el Valle, los pasquines y hojas volantes fueron arma política de pueblos sin medios propios.

grado: 9
periodo: 1
sesion: 7
completo: true
duracion_min: 90
titulo: La electricidad --- luz, motor, comunicación
titulo_portada: |-
  La electricidad ---
  luz, motor,
  comunicación
producto_final: |-
  La bitácora de un día sin electricidad, real o reconstruida, con diez momentos en orden cronológico. Cada momento dice qué función eléctrica falta —luz, motor o comunicación— y qué haces en su lugar. Cierra con tres aprendizajes concretos y con la separación entre lo que de verdad necesitas y lo que es costumbre.
apertura:
  origen: Red de Emisoras Comunitarias del Valle del Cauca · la voz del pueblo tiene NIT y dirección
  fuente: |-
    Red de Emisoras Comunitarias del Valle del Cauca -- LA REC FM. (2020, 21 de diciembre). \emph{Solicitud aclaración temas implementación Ley 2066 del 14 de diciembre de 2020} [Comunicación al Ministerio TIC]. Ministerio de Tecnologías de la Información y las Comunicaciones.
  saber_ancestral: |-
    La radio comunitaria del Valle del Cauca está agremiada en la Red de Emisoras Comunitarias del Valle del Cauca, LA REC FM. Tiene NIT 900.042.837-2, sede en La Unión, en el Norte del Valle, y representación legal. Su interlocución con el Ministerio TIC consta en documentación alojada en el portal del propio Ministerio (Red de Emisoras Comunitarias del Valle del Cauca, 2020). Fíjate en lo que eso significa. «La voz del pueblo en la radio» no es una figura literaria. Es una persona jurídica con deudas, con licencias que hay que renovar y con una dirección en la calle 17 de La Unión. Para que una voz llegue lejos hacen falta tres cosas que no se ven: corriente eléctrica, dinero y permiso. La \textbf{cara de exclusión}: la radio comunitaria vive endeudada y dependiente de licencias estatales, y eso condiciona lo que puede decir.
  saber_contemporaneo: |-
    Toda la electricidad que usas cumple solo tres funciones. \textbf{Luz}: convierte corriente en visión, y con eso alarga el día. \textbf{Motor}: convierte corriente en movimiento, y con eso reemplaza fuerza. \textbf{Comunicación}: convierte corriente en señal, y con eso vence la distancia. Cualquier aparato de tu casa cae en una de las tres, o en dos a la vez. La nevera es motor. El bombillo es luz. El teléfono es comunicación, aunque también sea luz cuando miras la pantalla. Sirve clasificar así porque separa dos cosas que solemos confundir: la dependencia y la costumbre. Sin luz no puedes estudiar de noche, y eso es dependencia. Tener el televisor encendido sin mirarlo es costumbre. La diferencia importa cuando falta la corriente, porque entonces se ve cuál de las dos era cuál.
  pregunta_puente: |-
    Una emisora comunitaria necesita corriente, dinero y permiso para que se oiga una voz. ¿Cuántas de esas tres cosas hacen falta para que se oiga la tuya?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} de qué aparatos eléctricos dependes y a cuál de las tres funciones pertenece cada uno; (2) \textbf{explicar} la diferencia entre dependencia y costumbre con ejemplos de tu casa; (3) \textbf{crear} la bitácora de un día sin electricidad, con diez momentos y tres aprendizajes que no sean lugares comunes.
puentes:
  a_ruta: |-
    En la sesión 6 viste cómo la imprenta multiplicó la palabra escrita. Hoy ves la técnica que multiplicó todo lo demás, incluida la voz. En la sesión 8 llegas al ábaco y al chip, que corren con esta misma corriente.
  a_escuta: |-
    Antes de la teoría vas a contar. Cuántos aparatos enchufados o con batería hay a tu alrededor ahora mismo, incluidos los apagados. La cifra suele sorprender.
  a_sistematizacion: |-
    Ya tienes el inventario. Ahora vas a clasificarlo en las tres funciones y a separar de qué dependes de qué tienes por costumbre.
  a_praxis: |-
    Tienes el criterio. Toca escribir el día sin corriente, hora por hora, y ver qué se cae y qué no.
  a_producto: |-
    Lo que entregas hoy: diez momentos con su función eléctrica y tres aprendizajes. La prueba de calidad: la bitácora se lee sin sonar a sermón.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. La corriente es tan invisible que solo se nota cuando falta, y ahí aparece de qué depende cada quien.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre distancia y voz: Dussel sobre el rodeo de la lejanía, Marco Aurelio sobre atender a lo que dice el otro, Floridi sobre un espacio público operado por actores privados.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario de tu dependencia} (15 min · individual). (1) Sin moverte mucho, cuenta cuántos aparatos enchufados o con batería hay a tu alrededor. Incluye los apagados. (2) Escribe los diez que más usas. (3) Marca cada uno con su función: luz, motor o comunicación. (4) Marca aparte los que usarías igual si no hubiera corriente durante un día. (5) Anota cuál te costaría más perder y por qué.
  checks:
  - Conté los aparatos, incluidos los apagados.
  - Los diez que más uso están marcados con su función.
  - Anoté cuál me costaría más perder y por qué.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Inventario de mi dependencia». \textbf{Formato:} tabla de 10 filas y 3 columnas (aparato / función eléctrica / lo usaría igual sin corriente). \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} cada fila tiene una sola función principal marcada.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Las tres funciones y la costumbre} (20 min · parejas). (1) Con tu pareja, escriban las tres funciones con una frase propia cada una. (2) Clasifiquen sus veinte aparatos y resuelvan juntos los que caigan en dos funciones. (3) Separen la lista en dependencia y costumbre, con una razón escrita en cada caso. (4) Elijan un aparato que crean costumbre y escriban qué harían en su lugar.
  pilares:
  - |-
    \textbf{Las tres funciones.} Luz: corriente convertida en visión, que alarga el día. Motor: corriente convertida en movimiento, que reemplaza fuerza. Comunicación: corriente convertida en señal, que vence la distancia.
  - |-
    \textbf{Dependencia y costumbre no son lo mismo.} Sin luz no estudias de noche: eso es dependencia. Tener el televisor prendido sin mirarlo es costumbre. Solo se distinguen cuando falta la corriente, y por eso conviene pensarlo antes.
  - |-
    \textbf{Casi todo lo importante es comunicación.} Es la función que menos consume y la que más se echa de menos. Una emisora comunitaria funciona con una potencia modesta y sostiene a un municipio entero informado.
  - |-
    \textbf{Detrás de la señal hay tres cosas invisibles.} Corriente, dinero y permiso. Una emisora comunitaria las necesita las tres, y la falta de cualquiera la saca del aire. Lo mismo vale para tu conexión.
  anatomia:
    titulo: Las tres funciones de la corriente
    body: |-
      \textbf{Luz:} corriente → visión; alarga el día. \\[1mm] \textbf{Motor:} corriente → movimiento; reemplaza fuerza. \\[1mm] \textbf{Comunicación:} corriente → señal; vence la distancia. \\[1mm] \textbf{Prueba:} ¿dependo de esto o es costumbre?
  errores_comunes: |-
    (1) \textbf{Contar solo los aparatos encendidos}: los apagados también dependen de la corriente. (2) \textbf{Confundir dependencia con costumbre}: la diferencia solo aparece cuando falta la luz. (3) \textbf{Creer que comunicar consume mucho}: es la función que menos gasta y la que más falta hace. (4) \textbf{Olvidar el dinero y el permiso}: una señal necesita las dos cosas además de corriente. (5) \textbf{Escribir la bitácora como sermón}: contar qué pasó convence más que decir qué está mal.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Las tres funciones y la costumbre». \textbf{Formato:} las tres funciones con frase propia, los veinte aparatos clasificados y la lista separada en dependencia y costumbre con su razón. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} cada aparato de la columna «costumbre» tiene escrito qué harías en su lugar.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Bitácora de un día sin corriente} (30 min · individual). (1) Elige un día real que recuerdes sin electricidad o reconstruye uno completo, de la mañana a la noche. (2) Escribe diez momentos en orden, con la hora. (3) Anota en cada uno qué función falta y qué haces en su lugar. (4) Marca los momentos donde la falta fue un problema real y los que solo fueron incomodidad. (5) Cierra con tres aprendizajes concretos. (6) Léesela a un compañero y pregúntale si le sonó a sermón.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} Los diez momentos con hora y función. La marca entre problema real e incomodidad. Los tres aprendizajes.
  - |-
    \textbf{El orden cronológico hace el trabajo.} Ir hora por hora obliga a acordarse de lo pequeño: el despertador, la ducha, cargar el teléfono. Ahí está lo que no se ve cuando uno lo piensa en abstracto.
  - |-
    \textbf{Los aprendizajes no pueden ser lugares comunes.} «Dependemos mucho de la tecnología» no dice nada, porque no lo aprendiste hoy. «Mi mamá no puede cobrar sin datáfono» sí lo dice, porque tiene consecuencia.
  - |-
    \textbf{Que no suene a sermón.} Un día sin corriente no es una lección moral sobre la juventud. Es un día. Contar qué pasó convence; regañar al lector lo pierde en el tercer renglón.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Diez momentos en orden y con hora. \\[1mm] \checkbox Cada momento dice qué función falta y qué haces en su lugar. \\[1mm] \checkbox Marcado qué fue problema real y qué fue incomodidad. \\[1mm] \checkbox Tres aprendizajes concretos, sin lugares comunes. \\[1mm] \checkbox Un compañero la leyó y no le sonó a sermón.
  plantilla_guion: |-
    \textbf{Hora.} \textit{Qué iba a hacer.} \\[1mm] \textbf{Función que falta.} \textit{Luz, motor o comunicación.} \\[1mm] \textbf{Qué hago en su lugar.} \textit{La solución real, no la ideal.} \\[1mm] \textbf{Tipo.} \textit{Problema real o incomodidad.} \\[1mm] \textbf{Aprendizaje.} \textit{Concreto, con consecuencia.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Bitácora de un día sin corriente». \textbf{Formato:} los diez momentos con hora, función y solución, la marca de problema o incomodidad, y los tres aprendizajes. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} un compañero la leyó sin sentir que lo estaban regañando.
  producto_titulo: Bitácora de un día sin corriente con diez momentos y tres aprendizajes
  criterios:
  - Los diez momentos están en orden cronológico y con hora
  - Cada momento nombra la función que falta y qué haces en su lugar
  - Está marcado qué fue problema real y qué fue solo incomodidad
  - Los tres aprendizajes son concretos y tienen consecuencia
  - Un compañero la leyó y no le sonó a sermón
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.2.1.1
    cita: |-
      El maestro y el discípulo deben apartarse para preparar en la vida su discurso futuro… El rodeo de la lejanía hace posible la proximidad futura.
    aplicacion: |-
      Eso es exactamente lo que hace una señal eléctrica: convierte la distancia en un rodeo que se puede recorrer. Una emisora no acorta el camino hasta la vereda; lo vuelve transitable en un segundo.
    pregunta_espejo: |-
      ¿Con quién estoy cerca solo porque existe una señal, y qué pasaría si se cayera?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 53 (c. 175 d.C.)
    cita: |-
      Acostúmbrate a estar con atención a lo que dice el otro, y en cuanto te sea posible intérnate dentro del alma del que hablare contigo.
    aplicacion: |-
      La radio comunitaria vive de eso. Alguien habla y alguien escucha de verdad, sin poder responder de inmediato. Tener el aparato encendido no es lo mismo que estar oyendo, y la diferencia se nota en lo que uno recuerda al día siguiente.
    pregunta_espejo: |-
      ¿Cuánto de lo que oigo con un aparato encendido lo estoy escuchando de verdad?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 3.6
    cita: |-
      Internet es una extensión importante del espacio público, incluso cuando lo operan y lo poseen actores privados. (trad. propia)
    aplicacion: |-
      Con la radio pasa igual y se ve mejor, porque el permiso es explícito: hay una licencia, un ministerio y una renovación. En la conexión de tu casa esas condiciones existen también, solo que casi nunca las lees.
    pregunta_espejo: |-
      ¿Quién es dueño del espacio donde hablo todos los días, y qué puede decidir sobre lo que digo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la bitácora y los tres aprendizajes. Busca si en tu municipio hay una emisora comunitaria y anota su nombre y su frecuencia. En la sesión 8 vas a recorrer la era digital, del ábaco al chip.
web:
  resumen: |-
    La radio comunitaria del Valle está agremiada en LA REC FM, con NIT, sede en La Unión y licencias que renovar. «La voz del pueblo» no es una figura literaria: es una persona jurídica con dirección en la calle. Hoy clasificas de qué corriente dependes —luz, motor o comunicación— y escribes la bitácora de un día sin ella.
  subtema: Historia de la técnica · Dependencia eléctrica
  pre_lectura:
    por_que_importa: |-
      Para que una voz llegue lejos hacen falta tres cosas que no se ven: corriente, dinero y permiso. Cuando falta cualquiera, la voz se apaga.
    pregunta_detonante: |-
      Si mañana se fuera la luz por un día entero, ¿qué es lo primero que no podrías hacer?

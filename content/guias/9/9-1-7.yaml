titulo: La electricidad --- luz, motor, comunicación
producto_final: |-
  Bitácora escrita de un día sin electricidad (puede ser real o reconstruida), identificando 10 momentos en que la electricidad cambia un acto cotidiano
saber_ancestral_idea: |-
  Antes de que llegara la luz eléctrica al Valle, el día se organizaba según el sol y el candil. La electricidad reorganizó el tiempo humano: alargó la jornada de trabajo, transformó la cocina, hizo posible la radio en pueblos lejanos. Cada cambio técnico cambia el ritmo de la vida.

completo: true
titulo: La electricidad --- luz, motor, comunicación
titulo_portada: |-
  La electricidad ---
  luz, motor,
  comunicación
producto_final: Bitácora escrita de un día sin electricidad (real o reconstruida) con 10 momentos identificados donde la electricidad cambia un acto cotidiano
apertura:
  saber_ancestral: |-
    Antes de que llegara la luz eléctrica a los pueblos del Valle y el Pacífico, el día se organizaba según el \emph{sol y el candil}. Despertarse al amanecer, almorzar al mediodía, cenar antes del oscurecer. La cocina funcionaba con \emph{leña y fogón}; las noticias viajaban con el \emph{voz a voz} en la plaza; la música se hacía con instrumentos propios. La electricidad reorganizó el tiempo humano: alargó la jornada de trabajo, transformó la cocina, hizo posible la radio que llegó a pueblos lejanos antes que la carretera. Cada hito eléctrico cambió el ritmo de la vida más que cualquier ley.
  origen: Vida cotidiana antes de la electrificación en el Valle y el Pacífico colombiano
  saber_contemporaneo: |-
    Hoy la electricidad es invisible: solo la notamos cuando falla. Pero detrás de cada acto cotidiano hay un consumo eléctrico que no ves --- la nevera enfría 24 horas, el celular se carga toda la noche, las antenas que reciben tus mensajes funcionan con megavatios. Cuando se va la luz por una hora, descubres que casi todo lo que llamas ``moderno'' depende de un cable. La pregunta que la transición energética nos pone hoy: ¿esa dependencia es servidumbre o libertad?
  pregunta_puente: |-
    ¿Qué cosas que haces sin pensar dejarían de funcionar si tu pueblo se quedara una semana sin electricidad? ¿Qué cosas seguirían intactas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 10 momentos cotidianos donde la electricidad opera (a veces invisible); (2) \textbf{analizar} cómo la electricidad reorganizó el tiempo humano (jornada, comida, comunicación); (3) \textbf{explicar} la diferencia entre uso eficiente, derroche y dependencia; (4) \textbf{crear} una bitácora de un día sin electricidad (real o reconstruida) con análisis crítico.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 6 vio la imprenta como hito que cambió la voz pública; hoy ves la electricidad como hito que cambió el tiempo de la vida. Las dos son revoluciones silenciosas que organizan tu día sin que lo notes.
  a_escuta: |-
    Antes de teorizar, vamos a inventariar tu propia dependencia eléctrica. Cuántos objetos en tu casa funcionan con electricidad. La cifra te va a sorprender --- la mayoría perdió noción de cuánto depende de la red.
  a_sistematizacion: |-
    Ya viste tu propio inventario. Ahora vamos a entender las \textbf{3 funciones esenciales} de la electricidad en la vida moderna: luz, motor, comunicación. Distinguirlas te permite ver cuál perderías primero y cuál es realmente esencial.
  a_praxis: |-
    Tienes el método. Toca producir: una bitácora de un día sin electricidad. Puede ser real (vivencia tuya o de tu familia) o reconstruida (imaginar conscientemente cómo sería). Con criterio, no con drama.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: bitácora con 10 momentos identificados + reflexión. El criterio principal: que cada momento sea específico y muestre la dependencia eléctrica invisible.
  a_evaluacion: |-
    Antes de cerrar, mira la electricidad desde las cinco dimensiones humanas. Esta tecnología que parece técnica es profundamente política: quién tiene electricidad confiable y quién no decide quién participa de la modernidad.
  a_triangulo: |-
    Y para terminar, tres voces sobre la electricidad. Dussel sobre apagones rurales y privilegios urbanos, Marco Aurelio sobre la dependencia que se vuelve invisible, Floridi sobre infraestructura energética e infoesfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Inventario de tu dependencia eléctrica} (15 min · individual). Sin moverte mucho, mira tu casa o salón y cuenta cuántos \emph{objetos enchufados o cargables} hay en este momento (incluye los que están apagados pero dependen de electricidad). Luego enumera cuáles funcionarían si se va la luz por 24 horas y cuáles no.
  checks:
  - Conté objetos eléctricos en mi casa o salón (mínimo 15).
  - Identifiqué cuáles tienen batería propia y cuáles no.
  - Anoté qué actividades del día son imposibles sin electricidad y cuáles solo cambian de forma.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mi dependencia eléctrica invisible». \textbf{Formato:} (1) lista numerada de objetos eléctricos (mínimo 15), (2) clasificación en 3 grupos: ``funcionan sin red eléctrica'' (batería), ``no funcionan sin red'' (enchufe), ``serían reemplazables por algo no eléctrico'' (lámpara $\rightarrow$ vela). \textbf{Sabes que terminaste cuando} reconoces que tu vida depende de la electricidad mucho más de lo que pensabas.
sistematizacion:
  intro: |-
    Toda la electricidad doméstica cumple solo 3 funciones esenciales. Vamos a descomponerlas con los pilares del pensamiento computacional para que sepas cuál realmente necesitas y cuál es solo costumbre.
  pilares:
  - |-
    La electricidad doméstica se descompone en 3 funciones: (1) \textbf{luz} (iluminar para extender la jornada útil más allá del sol), (2) \textbf{motor} (mover cosas con energía mecánica: ventilador, nevera, ascensor, lavadora), (3) \textbf{comunicación e información} (celular, wifi, radio, TV, computador --- esta es la dependencia más reciente y la que más crece).
  - |-
    Toda dependencia eléctrica sigue el patrón \textbf{``invisibilización progresiva''}: cuando una tecnología funciona, dejas de notarla. La luz eléctrica era novedad en 1900; hoy es invisible. La conexión a internet era novedad en 1995; hoy es invisible. Mañana lo será la IA. La pregunta crítica es qué pasa cuando esa invisibilidad se rompe.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué de mi vida cotidiana es realmente esencial y qué es solo costumbre?}. Sin esa distinción, cualquier crisis energética se vive como apocalipsis. Con ella, se vive como ajuste.
  - |-
    Pasos para evaluar tu propia dependencia: (1) inventario de objetos eléctricos; (2) clasifícalos en luz / motor / comunicación; (3) marca los esenciales (sin ellos perderías capacidad básica) y los cosméticos (puedes sustituirlos); (4) decide qué harías diferente si supieras que la luz se va por 1 semana.
  anatomia:
    titulo: Anatomía de tu consumo eléctrico
    body: |-
      \textbf{Función luz:} bombillos, lámparas. ¿Cuántas horas al día? \\[1mm] \textbf{Función motor:} nevera, ventilador, lavadora, microondas. ¿Cuál puedo apagar 24 horas? \\[1mm] \textbf{Función comunicación:} celular, wifi, computador, TV. ¿Cuánto tiempo activo? \\[1mm] \textbf{Esenciales vs cosméticos:} ¿qué objeto necesito de verdad y cuál solo por costumbre? \\[1mm] \textbf{Alternativas no eléctricas:} ¿qué objeto tendría reemplazo (lámpara $\rightarrow$ vela, ventilador $\rightarrow$ ventana, micro $\rightarrow$ estufa de gas)?
  errores_comunes: |-
    (1) Creer que ``sin electricidad no se vive'' --- la mayoría del mundo vivió sin ella hasta 1950 y no se murió. (2) Confundir esencial con habitual (la nevera es esencial; el ventilador con espejo led es costumbre). (3) No notar que la red eléctrica concentra poder (corte de luz por mora, racionamiento) en pocas manos. (4) Olvidar que la electricidad tiene un costo ambiental aunque sea invisible.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 3 funciones de la electricidad en mi vida». \textbf{Formato:} 3 fichas, una por función (luz, motor, comunicación), cada una con: 3 objetos tuyos que la cumplen + horas estimadas diarias + qué pasaría si se va la luz por 24 horas. \textbf{Sabes que terminaste cuando} identificas la función de la que MÁS dependes y reflexionas honestamente si esa dependencia es elección o costumbre.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Bitácora de un día sin electricidad} (30 min · individual). Hora de escribir. Vas a hacer una bitácora detallada de un día completo sin electricidad: puede ser una experiencia real (apagón que recuerdas, viaje al campo) o una reconstrucción imaginada con realismo. Lo importante es identificar 10 momentos donde la electricidad opera.
  pilares:
  - |-
    Tu bitácora se descompone en 3 partes: (1) introducción (contexto: día, lugar, motivo del apagón real o imaginado), (2) cuerpo (10 momentos del día con la electricidad ausente y qué hiciste o harías), (3) reflexión final (3 aprendizajes sobre tu dependencia).
  - |-
    Sigue el patrón \textbf{``mostrar, no decir''}: en lugar de escribir ``sin internet me aburrí'', escribe ``a las 3 PM no podía abrir TikTok y noté que mis manos pedían el celular cada 4 minutos''. La especificidad convence.
  - |-
    Cada momento expresa una sola idea. Si tu momento de las 7 AM dice ``no me podía bañar, ni cocinar, ni cargar el celular'', divídelo en 3 momentos distintos: 7:00 (ducha), 7:15 (cocina), 7:30 (celular). Más fino, más útil.
  - |-
    Algoritmo: (1) elige día completo (real o imaginado); (2) lista cronológicamente 10 momentos clave (mañana, mediodía, tarde, noche); (3) por cada momento describe cómo cambia con electricidad ausente; (4) cierra con 3 aprendizajes (no clichés tipo ``debemos cuidar la electricidad'', sino reflexiones específicas).
  checklist:
    titulo: Checklist antes de cerrar la bitácora
    items: |-
      \checkbox 10 momentos identificados cronológicamente. \\[1mm] \checkbox Cada momento es específico (no ``no podía hacer nada''). \\[1mm] \checkbox Distingo cuándo la electricidad cumple función de luz, motor o comunicación. \\[1mm] \checkbox 3 aprendizajes finales no clichés (reflexiones específicas, no morales de cuento). \\[1mm] \checkbox La bitácora se puede leer en voz alta sin sentirse forzada.
  plantilla_guion: |-
    \textbf{Introducción.} \textit{Contexto: día, lugar, motivo del apagón.} \\[1mm] \textbf{10 momentos del día.} \textit{Cronología con función eléctrica identificada en cada uno.} \\[1mm] \textbf{Reflexión final.} \textit{3 aprendizajes específicos sobre la dependencia eléctrica.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Bitácora de mi día sin electricidad». \textbf{Formato:} introducción de 3 renglones + 10 momentos cronológicos + reflexión final de 3 viñetas. \textbf{Extensión:} 1.5 a 2 páginas. \textbf{Sabes que terminaste cuando} la bitácora muestra dependencias invisibles que tú mismo no notabas antes.
  producto_titulo: Bitácora de un día sin electricidad con 10 momentos identificados
  criterios:
  - 10 momentos del día específicos y cronológicos
  - Cada momento identifica función eléctrica (luz, motor, comunicación)
  - 3 aprendizajes finales no clichés
  - Distingo dependencia esencial de costumbre cosmética
  - La bitácora se puede leer sin sentirse moralista
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Hay regiones donde la luz nunca llegó y eso no es accidente: es diseño.
    aplicacion: |-
      En Colombia hay zonas rurales del Pacífico, Cauca y Amazonas que en 2026 todavía no tienen electricidad confiable. La modernidad eléctrica fue selectiva: llegó primero a las capitales, después a las cabeceras municipales, después a las veredas privilegiadas, y muchas zonas siguen esperando. Reconocer que la electricidad no es solo técnica sino política es el primer paso.
    pregunta_espejo: |-
      ¿Quiénes en mi región siguen sin electricidad confiable? ¿Qué tipo de modernidad les es negada por esa falta? ¿Qué papel jugaría yo en cambiar eso?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Lo que mucho usas, deja de notarlo; lo que dejas de notar, te empieza a gobernar.
    aplicacion: |-
      La electricidad invisible te gobierna sin que lo sepas: te despierta a las 6 con alarma, te entretiene a las 8 con TV, te obliga a estar conectado todo el día. La disciplina estoica: cada cierto tiempo, hacer visible lo invisible. Un apagón breve voluntario, un día sin celular, una hora sin pantalla --- esos ejercicios reentrenan tu autonomía.
    pregunta_espejo: |-
      ¿Qué dependencia eléctrica mía no he cuestionado nunca? ¿Qué pasaría si un día renunciara conscientemente a ella?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La infoesfera contemporánea es energía-dependiente: sin electricidad, sin nube, sin red, no hay realidad digital.
    aplicacion: |-
      Toda la infoesfera --- tus mensajes, tus fotos, los algoritmos, las IAs --- corre en datacenters que consumen megavatios. Cuando hablas de ``la nube'' suena etéreo, pero la nube son edificios llenos de servidores que comen electricidad sin parar. La sostenibilidad ambiental de la infoesfera es una pregunta abierta urgente.
    pregunta_espejo: |-
      ¿Qué de mi vida digital --- streaming, gaming, redes, IA --- está consumiendo electricidad que no veo? ¿Estoy dispuesto a saber cuánto cuesta ambientalmente cada cosa?
compromiso: |-
  \textbf{Para la próxima semana.} Pasa intencionalmente \textbf{4 horas seguidas sin electricidad} (apaga celular, computador, TV, luces; usa luz natural o vela si es de noche; sin nevera abierta). Anota qué hiciste con ese tiempo, qué notaste de ti, qué extrañaste y qué descubriste. Esa experiencia vale más que cualquier teoría. El próximo lunes traemos la bitácora al aula.
web:
  resumen: |-
    Escribes una bitácora de un día sin electricidad. Descubres tu dependencia invisible — y separas lo esencial de la costumbre.
  subtema: Historia de la técnica · Dependencia eléctrica
  pre_lectura:
    por_que_importa: |-
      La electricidad es la tecnología más invisible de tu vida — solo la notas cuando falla. Pero detrás de cada acto cotidiano hay un cable. Entender esa dependencia te prepara para la transición energética que tu generación va a tener que pilotear.
    pregunta_detonante: |-
      Si tuvieras que pagar la cuenta de electricidad de tu casa con tu propio dinero, ¿qué apagarías primero y qué nunca apagarías?
    activacion:
      titulo: Cuenta los enchufes
      descripcion: |-
        En 3 minutos, mira tu casa o salón y cuenta cuántos objetos están enchufados o cargándose AHORA mismo (incluye los apagados que dependen de electricidad). La cifra te va a sorprender — la mayoría perdió noción de cuánto depende.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 6 viste cómo la imprenta cambió la voz pública. Hoy ves cómo la electricidad cambió el tiempo de la vida — dos revoluciones invisibles que organizan tu día.
      siguiente: |-
        En la sesión 8 verás el ábaco, el quipu y la era digital — de los primeros conteos al chip que llevas en el bolsillo.
  conceptos_clave:
    - termino: Función luz
      definicion: |-
        La electricidad ilumina para extender la jornada útil más allá del sol. Fue la primera función masiva de la electricidad (1880-1920) y reorganizó por completo el ritmo del día humano.
      ejemplo: |-
        Antes de la luz eléctrica, leer de noche costaba aceite y dañaba la vista. Hoy puedes leer 24 horas sin notar el costo — porque el costo es invisible (factura mensual).
      emoji: "💡"
    - termino: Función motor
      definicion: |-
        La electricidad mueve cosas: nevera, ventilador, lavadora, ascensor, lavavajillas. Reemplaza fuerza humana o animal con electricidad transformada en movimiento mecánico.
      ejemplo: |-
        La nevera de tu casa: motor + compresor + electricidad funcionando 24/7. Sin ella, tendrías que comprar comida diaria o tener un pozo de hielo (como antes).
      emoji: "⚙️"
    - termino: Función comunicación e información
      definicion: |-
        Celular, wifi, radio, TV, computador. Esta es la dependencia más reciente (1900-hoy) y la que más crece. Sin electricidad no hay infoesfera.
      ejemplo: |-
        Cuando se va la luz, tu celular dura 8 horas con batería. Cuando se va el wifi, tu celular pierde el internet — porque las antenas también necesitan luz.
      emoji: "📡"
    - termino: Invisibilización progresiva
      definicion: |-
        Cuando una tecnología funciona, dejas de notarla. La luz eléctrica era novedad en 1900; hoy es invisible. Mañana lo será la IA. La pregunta crítica es qué pasa cuando esa invisibilidad se rompe.
      ejemplo: |-
        Apagón de 2 horas: descubres cuántos relojes están conectados a la luz. Descubres que no sabes qué hacer si no es a través de pantalla.
      emoji: "🕳"
    - termino: Esencial vs costumbre
      definicion: |-
        Distinguir lo que realmente necesitas de lo que es habitual. La nevera es esencial (sin ella se daña la comida); el ventilador con espejo led es costumbre (puedes abrir una ventana).
      ejemplo: |-
        Si tuvieras que vivir 1 semana con la mitad de los aparatos eléctricos, ¿cuáles eliminarías? Esa pregunta separa lo esencial de la costumbre.
      emoji: "⚖️"
    - termino: Costo ambiental invisible
      definicion: |-
        Cada watt de electricidad tiene origen: hidroeléctrica, termoeléctrica, solar, eólica. La factura mensual te cobra en pesos, no en daño ambiental — pero el daño existe igual.
      ejemplo: |-
        Cada hora de streaming consume megavatios en datacenters. Esos datacenters están en algún lugar — y consumen electricidad de origen real. La nube no es etérea.
      emoji: "🌍"
  quiz:
    titulo: "✅ Verifica tu lectura de la dependencia eléctrica"
    instrucciones: 5 preguntas para confirmar que distingues lo esencial de la costumbre. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Cuáles son las 3 funciones esenciales de la electricidad doméstica?
        opciones:
          - Calor, frío, internet
          - Luz, motor, comunicación e información
          - TV, celular, computador
          - Cocina, baño, dormitorio
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Toda la electricidad de tu casa cumple solo una de esas 3 funciones. Distinguirlas te permite decidir qué realmente necesitas.
        feedback_incorrecto: |-
          Luz + motor + comunicación. Toda función eléctrica doméstica cabe en una de esas 3. El resto son ejemplos concretos.
      - enunciado: ¿Qué significa "invisibilización progresiva" en tecnología?
        opciones:
          - Que la tecnología se vuelve pequeña
          - Que cuando una tecnología funciona dejas de notarla — solo aparece cuando falla
          - Que se rompe
          - Que la esconden
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La luz eléctrica fue novedad; hoy es invisible. La conexión a internet, también. Cuando se rompe la invisibilidad, descubres tu dependencia.
        feedback_incorrecto: |-
          Invisibilización progresiva: cuando una tecnología funciona dejas de notarla. La luz, el wifi, pronto la IA. Solo notas cuando fallan.
      - enunciado: Si en un apagón puedes seguir leyendo un libro, ¿qué demuestra eso?
        opciones:
          - Que el libro es mejor que internet
          - Que algunas funciones esenciales NO dependen de electricidad — puedes sustituir o prescindir
          - Que los libros antiguos sirven más
          - Que no necesitas electricidad
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. No todo depende de la red. Distinguir qué sí y qué no es libertad práctica frente a la crisis energética que viene.
        feedback_incorrecto: |-
          Lo importante es distinguir qué depende de electricidad y qué no. El libro sigue siendo lectura aunque se vaya la luz. Esa autonomía es valiosa.
      - enunciado: ¿De dónde viene la electricidad que mueve datacenters de la nube?
        opciones:
          - Es etérea, no consume energía
          - De plantas hidroeléctricas, termoeléctricas, solares — consume megavatios reales
          - De los servidores mismos
          - No se sabe
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. "La nube" son edificios llenos de servidores que consumen energía real. La sostenibilidad de la infoesfera es una pregunta abierta urgente.
        feedback_incorrecto: |-
          "La nube" es física. Datacenters reales consumen megavatios. Cada hora de streaming, cada consulta a IA, tiene un costo eléctrico que pagaría el planeta si la energía no fuera renovable.
      - enunciado: En el saber ancestral del día organizado por el sol, ¿qué aplica a tu vida hoy?
        opciones:
          - Nada — ahora todo es eléctrico
          - |-
            Que el ritmo humano natural fue sustituido por uno artificial (jornada extendida, sueño desplazado, descanso reducido)
          - Que el sol todavía sale igual
          - Que los abuelos no tenían tiempo
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La electricidad reorganizó el tiempo humano. Antes el sol mandaba; hoy manda la jornada extendida que la luz hizo posible. Y tu cuerpo paga el costo.
        feedback_incorrecto: |-
          El sol organizaba la vida; ahora la organiza la electricidad. La jornada extendida, el sueño postergado, la noche poblada de pantallas son herencia técnica reciente, no naturaleza humana.
  post_lectura:
    transferencia: |-
      Esta semana, pasa intencionalmente 4 horas seguidas sin electricidad (apaga celular, computador, TV, luces; usa luz natural o vela). Anota qué hiciste, qué notaste de ti, qué extrañaste y qué descubriste. Esa experiencia vale más que cualquier teoría. El próximo lunes traemos la bitácora.
  cinco_dimensiones:
    personal: |-
      Hiciste visible una dependencia que era invisible — primer paso para tener autonomía sobre tu propia vida.
    emocional: Sentiste el peso de cuántas cosas no funcionarían sin un cable — sin moralizar, solo observando.
    ciudadana: |-
      Reconociste que la electrificación selectiva sigue siendo política: hay regiones sin luz confiable en 2026.
    local: Conectaste el ritmo del día actual con el ritmo del sol y el candil que tus abuelos conocieron.
    intergeneracional: |-
      La transición energética que tu generación va a pilotear empieza por entender cómo se vivía antes y qué de eso era mejor.

clave: 1-8
grado: 9
periodo: 1
sesion: 8
completo: true
titulo: Era digital --- del ábaco al chip
titulo_portada: |-
  Era digital ---
  del ábaco
  al chip
producto_final: Un mismo cálculo (suma de 10 números grandes) resuelto con 3 instrumentos distintos --- mentalmente, con ábaco o equivalente físico, con calculadora digital --- documentando tiempo, errores y reflexión
apertura:
  saber_ancestral: |-
    El \textbf{quipu inca} guardaba la memoria contable de imperios enteros con nudos en cuerdas: número de personas tributarias, sacos de maíz, soldados disponibles. El \textbf{ábaco mesoamericano} llamado ``nepohualtzintzin'' usaba cuentas de maíz y semillas. En el altiplano colombiano, los \textbf{Muiscas} llevaban cuentas decimales con piedrecillas que llamaban \emph{gueta} (veintenas). Y aquí mismo en el Valle del Cauca, los \textbf{tenderos campesinos de Cartago, Argelia, Ulloa} llevaban sus cuentas en libretas de papel ordinario antes de la calculadora: cosechas, fiados, jornales, lluvias. Calcular sin la mente, externalizando la memoria en un objeto, no lo inventó Silicon Valley --- lo inventaron pueblos que necesitaban guardar información hace milenios, y siguen haciéndolo abuelos y abuelas de tu propio barrio hoy.
  saber_contemporaneo: |-
    Hoy llevas en el bolsillo un dispositivo que combina ábaco, calculadora, libro y archivo --- el celular. Cada vez que delegas un cálculo, una fecha o un dato a una pantalla, repites el gesto del quipucamayoc inca que delegaba conteos al quipu. Lo nuevo no es \emph{externalizar} la mente; es la \textbf{velocidad y el alcance}. Un quipu se leía con dedos en minutos; el celular hace lo mismo en milisegundos pero a escala global. La pregunta es si esa velocidad nos hace más capaces o nos vuelve dependientes.
  pregunta_puente: |-
    ¿Qué cálculos haces a diario sin pensar gracias al celular? ¿Cuáles podrías hacer sin él? ¿Cuáles ya se te están olvidando?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 3 momentos clave en la historia del cálculo: cuerpo (mente), externalización física (quipu, ábaco), externalización digital (chip); (2) \textbf{aplicar} cada uno a un mismo problema y comparar; (3) \textbf{analizar} qué se gana y qué se pierde al delegar el cálculo a un dispositivo; (4) \textbf{evaluar} con criterio cuándo conviene calcular con la mente y cuándo conviene delegar.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Las sesiones 1-7 vieron técnicas físicas: máquinas, balanzas, imprentas, electricidad. Hoy entras a la técnica más reciente y a la vez más antigua --- la de \emph{calcular y recordar} con ayuda externa.
  a_escuta: |-
    Antes de teorizar, vamos a hacer el experimento más antiguo y más actual: el mismo cálculo con la mente, con un objeto físico y con la pantalla. Vas a notar diferencias que ningún libro te enseñaría.
  a_sistematizacion: |-
    Ya hiciste el experimento. Ahora vamos a entender los \textbf{4 momentos} de la historia del cálculo externalizado: mente, conteo físico (quipu, ábaco), mecánico (calculadora de Pascal), digital (chip). Distinguirlos te muestra que el celular es el último capítulo, no el primero.
  a_praxis: |-
    Tienes el mapa. Toca producir: una bitácora detallada del experimento de los 3 instrumentos, con reflexión sobre qué se gana y qué se pierde al externalizar.
  a_producto: |-
    Lo que sigue es el resumen de \emph{qué} entregas hoy: bitácora del experimento + reflexión crítica. El criterio principal: que la reflexión sea honesta (no moralizante) y específica sobre tu propia cognición.
  a_evaluacion: |-
    Antes de cerrar, mira la externalización del cálculo desde las cinco dimensiones humanas. Esta no es solo una historia técnica --- es la historia de cómo la mente humana se extendió en objetos, primero locales, hoy globales.
  a_triangulo: |-
    Y para terminar, tres voces sobre cálculo y memoria. Dussel sobre el quipu silenciado por la Conquista, Marco Aurelio sobre lo que dejas de saber cuando lo delegas todo, Floridi sobre la cognición distribuida en la infoesfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Experimento de los 3 instrumentos} (15 min · individual). Toma estos 10 números: 47, 138, 92, 215, 56, 304, 89, 173, 462, 218. Súmalos \textbf{tres veces}: (a) \emph{mentalmente} (anota tu resultado y el tiempo), (b) \emph{con papel y lápiz a mano} sin calculadora (anota resultado y tiempo), (c) \emph{con calculadora digital} del celular (anota resultado y tiempo). Verifica al final con la calculadora cuál era el resultado correcto.
  checks:
  - Sumé los 10 números mentalmente y anoté mi resultado + tiempo.
  - Sumé los 10 números con papel y lápiz y anoté mi resultado + tiempo.
  - Sumé con calculadora digital y verifiqué el resultado correcto.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 instrumentos, 1 cálculo». \textbf{Formato:} tabla de 4 columnas (Instrumento~|~Resultado~|~Tiempo~|~Errores), 3 filas. Al final 1 párrafo de 3 renglones con la observación principal del experimento. \textbf{Sabes que terminaste cuando} reconoces honestamente qué método te dio mejor resultado y por qué.
sistematizacion:
  intro: |-
    Toda la historia del cálculo externalizado tiene 4 momentos. Vamos a descomponerlos con los pilares del pensamiento computacional para que sepas qué heredas cuando usas tu celular.
  pilares:
  - |-
    La historia del cálculo se descompone en 4 momentos: (1) \textbf{cálculo mental} (cuerpo solo: aritmética de oficio, conteo con dedos), (2) \textbf{cálculo físico} (quipu, ábaco, marcas: la memoria sale del cuerpo a un objeto), (3) \textbf{cálculo mecánico} (Pascalina 1642, máquina de Babbage 1822: ruedas que calculan), (4) \textbf{cálculo digital} (1940-hoy: chip que opera con electricidad y miniaturiza todo lo anterior).
  - |-
    Toda externalización del cálculo sigue el patrón \textbf{``ganancia con costo cognitivo''}: ganas precisión, velocidad y memoria; pierdes ejercicio mental y autonomía si no calculas a la vez. El quipucamayoc inca era experto porque ENTENDÍA el quipu, no porque lo poseía. Lo mismo aplica a tu celular.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué cálculos vale la pena hacer con la mente y cuáles vale la pena delegar al dispositivo?}. Sin esa pregunta, delegas todo y atrofias capacidades. Con ella, eliges con criterio.
  - |-
    Pasos para evaluar tu propia delegación cognitiva: (1) ¿qué cálculos hago a diario?; (2) ¿cuáles podría hacer mentalmente con un poco de práctica?; (3) ¿cuáles realmente necesitan dispositivo?; (4) ¿qué capacidad estoy cultivando o atrofiando con mis elecciones?.
  anatomia:
    titulo: Anatomía de un instrumento de cálculo
    body: |-
      \textbf{Materia:} cuerpo (mente, dedos), objeto físico (cuerdas, cuentas), mecánico (ruedas), electrónico (chip). \\[1mm] \textbf{Operaciones:} suma, resta, conteo, recordar, comparar. \\[1mm] \textbf{Velocidad:} segundos, minutos, milisegundos. \\[1mm] \textbf{Precisión:} dependiente del usuario / dependiente del instrumento. \\[1mm] \textbf{Costo cognitivo:} qué habilidad humana entrena o atrofia.
  errores_comunes: |-
    (1) Creer que el celular ``inventó'' el cálculo externo --- el quipu lo hizo hace 5 siglos. (2) Confundir velocidad con inteligencia --- una calculadora es rápida pero no entiende. (3) Olvidar que delegar TODO atrofia capacidades. (4) No notar que la calculadora del celular es un eslabón en una historia de 5000 años, no un milagro reciente.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 4 momentos del cálculo externo». \textbf{Formato:} 4 fichas, una por momento (mental, físico, mecánico, digital), cada una con: ejemplo histórico + ejemplo cotidiano tuyo + qué capacidad humana entrena o atrofia. \textbf{Sabes que terminaste cuando} puedes explicar los 4 momentos sin notas y reconoces honestamente qué capacidades estás atrofiando en tu propia vida.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Bitácora completa + reflexión crítica} (30 min · individual). Tienes los datos del experimento. Ahora vas a escribir la bitácora completa con reflexión: ¿qué pasó en cada método?, ¿qué descubriste de tu propia mente?, ¿cuándo conviene delegar y cuándo no?.
  pilares:
  - |-
    Tu bitácora se descompone en 4 partes: (1) los datos del experimento (tabla con tiempos y errores), (2) observación sin juicio (qué pasó), (3) reflexión personal (qué descubriste de tu propia mente), (4) propuesta práctica (qué cálculos vas a hacer mentalmente esta semana).
  - |-
    Sigue el patrón \textbf{``honestidad sobre moralismo''}: si tu cálculo mental fue malo, dilo. Si fuiste lento con el papel, dilo. La sinceridad da más aprendizaje que pretender que ``todos los métodos son válidos''.
  - |-
    Cada reflexión expresa una sola idea. Si tu observación dice 4 cosas, divídela en 4 reflexiones. Mejor 4 ideas claras que 1 párrafo confuso.
  - |-
    Algoritmo: (1) copia los datos del experimento; (2) escribe 3 observaciones sobre qué pasó; (3) escribe 2-3 reflexiones personales; (4) cierra con 1 propuesta concreta: ``esta semana voy a calcular X mentalmente, no con celular''.
  checklist:
    titulo: Checklist antes de cerrar la bitácora
    items: |-
      \checkbox Tabla con los 3 métodos, resultado, tiempo, errores. \\[1mm] \checkbox Al menos 3 observaciones sobre qué pasó en el experimento. \\[1mm] \checkbox 2-3 reflexiones personales honestas (no clichés). \\[1mm] \checkbox 1 propuesta concreta sobre qué cálculos hacer mentalmente esta semana. \\[1mm] \checkbox Reconozco al menos UNA capacidad mental que estoy atrofiando por delegar.
  plantilla_guion: |-
    \textbf{Datos.} \textit{Tabla con los 3 métodos, resultado, tiempo, errores.} \\[1mm] \textbf{Observaciones.} \textit{3 cosas que pasaron en el experimento, sin juicio.} \\[1mm] \textbf{Reflexión personal.} \textit{2-3 ideas honestas sobre tu propia mente.} \\[1mm] \textbf{Propuesta.} \textit{1 cálculo concreto que harás mentalmente esta semana.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Bitácora del experimento del cálculo». \textbf{Formato:} tabla de datos + 3 observaciones + 2-3 reflexiones + 1 propuesta. \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} hay UNA propuesta concreta de cálculo mental para esta semana y reconoces qué capacidad estás atrofiando.
  producto_titulo: Bitácora del experimento de los 3 instrumentos de cálculo
  criterios:
  - Tabla con los 3 métodos, resultado real, tiempo y errores
  - 3 observaciones del experimento sin juicio
  - 2-3 reflexiones personales honestas, no clichés
  - 1 propuesta concreta para esta semana
  - Reconozco al menos UNA capacidad mental que estoy atrofiando
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Cada saber silenciado por la Conquista es una herramienta que tu generación tendrá que reaprender.
    aplicacion: |-
      El quipucamayoc inca podía leer información de cientos de quipus con un sistema que aún hoy descifran investigadores. Cuando los conquistadores quemaron los quipus, no quemaron objetos --- quemaron un sistema de conocimiento. Hoy, mientras nos volvemos dependientes del chip, esos saberes externalizados antiguos siguen siendo modelos no extractivos de pensamiento que vale la pena reaprender, no como nostalgia sino como complemento crítico.
    pregunta_espejo: |-
      ¿Qué saberes propios de mi región (cuentas de plaza, sistemas tradicionales de medida, técnicas de memoria oral) podría conocer mejor para complementar mi dependencia digital?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Lo que dejas de practicar, lo dejas de saber; lo que dejas de saber, lo dejas de poder.
    aplicacion: |-
      Cada vez que dejas de hacer una suma mental, tu cerebro reasigna esos recursos. Eso no es malo en sí --- el problema es cuando atrofiamos capacidades que después necesitamos. La sabiduría estoica recomienda cultivar habilidades base: cálculo mental simple, lectura sostenida sin pantalla, escritura a mano. No porque sean superiores, sino porque mantienen abierta la opción.
    pregunta_espejo: |-
      ¿Qué habilidad cognitiva mía estoy dejando atrofiar por delegar todo al dispositivo? ¿Estaría dispuesto a recuperarla con 5 minutos diarios?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La cognición humana hoy es distribuida: parte vive en nuestra mente, parte en los dispositivos que extienden nuestra mente.
    aplicacion: |-
      No tienes una mente individual cerrada: tienes una mente extendida que incluye tu celular, Google, tu cuenta de Notion, los algoritmos que te recomiendan películas. Floridi llama esto \emph{onlife}: ya no vivimos online u offline, sino en una vida híbrida donde lo digital es parte del yo. Conocer eso te permite diseñar mejor tu propia cognición distribuida.
    pregunta_espejo: |-
      ¿Qué partes de mi memoria, cálculo y juicio están hoy en dispositivos? ¿Soy consciente de eso? ¿Lo diseñé yo o me lo impusieron las plataformas?
compromiso: |-
  \textbf{Para la próxima semana.} Identifica \textbf{3 cálculos cotidianos} que hoy haces con celular (precio total del mercado, propina, división de cuenta entre amigos) y comprométete a hacerlos mentalmente durante 3 días seguidos. Anota qué te costó, qué descubriste y si tu velocidad mejoró. El próximo lunes traemos esa bitácora.

titulo: Era digital --- del ábaco al chip
producto_final: |-
  Un mismo cálculo (suma de 10 números grandes) resuelto con 3 instrumentos distintos --- mentalmente, con ábaco (o equivalente físico), con calculadora digital --- documentando tiempo, errores y reflexión
saber_ancestral_idea: |-
  El quipu inca, el ábaco mesoamericano y los conteos por marcas en pared son antepasados del computador. La idea de "calcular sin la mente" no la inventó Silicon Valley --- la inventaron pueblos que necesitaban guardar memoria de granos, días y deudas hace milenios.

clave: 1-8
grado: 9
periodo: 1
sesion: 8
completo: true
duracion_min: 90
titulo: Era digital --- del ábaco al chip
titulo_portada: |-
  Era digital ---
  del ábaco
  al chip
producto_final: |-
  La bitácora del experimento de los tres instrumentos: el mismo cálculo resuelto de memoria, con papel y lápiz, y con calculadora, anotando resultado, tiempo y errores en cada caso. La acompañan tres observaciones sin juicio, dos o tres reflexiones honestas, una propuesta concreta para esta semana y el reconocimiento de al menos una capacidad que estás dejando de usar.
apertura:
  origen: Bordadoras de Cartago · el molde de plástico que se disuelve
  fuente: |-
    Chica García, A. (2019, 17 de agosto). \emph{Bordados de Cartago: la herencia española que apropiaron las mujeres vallunas}. Radio Nacional de Colombia.
  saber_ancestral: |-
    En Cartago el oficio se hereda por la casa, no por la escuela. Gladys Ramírez, bordadora con más de treinta años en el oficio, aprendió a bordar de su abuela (Chica García, 2019). Fíjate en un detalle del procedimiento. El diseño se dibuja a lápiz sobre un plástico biodegradable que se disuelve al mojarse. Cuando el plástico se va, solo queda la puntada. El molde desaparece y lo que permanece es lo que la mano hizo. Esa es la pregunta de hoy, dicha con hilo. Un andamio sirve mientras se construye y después estorba. La calculadora, el corrector y el buscador son andamios: te sostienen mientras aprendes algo. La cuestión es qué queda cuando se disuelven. La \textbf{cara de exclusión}: la transmisión doméstica del oficio convive con la informalidad, y heredar el oficio no garantiza heredar un ingreso.
  saber_contemporaneo: |-
    La historia del cálculo tiene cuatro momentos y todos siguen vivos. \textbf{Mental}: el cuerpo solo, como la aritmética del tendero. \textbf{Físico}: quipu, ábaco, marcas en un palo, el cuaderno del fiado. La memoria sale de la cabeza y se apoya en un objeto. \textbf{Mecánico}: engranajes que suman sin que nadie piense en cada paso. \textbf{Electrónico}: el chip, que hace millones de operaciones por segundo. Cada salto ganó precisión, velocidad y memoria. Y cada uno cobró lo mismo: ejercicio mental. No es que delegar esté mal. Es que delegar sin darse cuenta deja capacidades sin uso, y una capacidad sin uso se apaga despacio y sin avisar. Por eso la pregunta útil no es si usar calculadora. Es cuáles cálculos vale la pena hacer con la cabeza y cuáles conviene entregar, y haber decidido cuál es cuál.
  pregunta_puente: |-
    Cuando el plástico se disuelve, solo queda la puntada. Si mañana te quitaran la calculadora del teléfono, ¿qué quedaría de lo que sabes calcular?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuánto cambian tu resultado, tu tiempo y tus errores según el instrumento que uses; (2) \textbf{explicar} los cuatro momentos del cálculo y qué gana y qué cobra cada uno; (3) \textbf{aplicar} ese criterio a tu propia vida y decidir qué delegas y qué te quedas.
puentes:
  a_ruta: |-
    En la sesión 7 viste la corriente que mueve todo esto. Hoy llegas al chip, que es donde termina el recorrido del periodo. En la sesión 9 miras las tecnologías propias y en la 10 escribes el manifiesto.
  a_escuta: |-
    Antes de la teoría vas a hacer un experimento contigo mismo. El mismo cálculo, tres veces, con tres instrumentos. Los números que salgan son tus datos.
  a_sistematizacion: |-
    Ya tienes tus tres resultados. Ahora vas a ordenarlos en los cuatro momentos del cálculo y a nombrar qué cobró cada salto.
  a_praxis: |-
    Tienes los datos y el criterio. Toca escribir qué vas a hacer con eso, en concreto y esta semana.
  a_producto: |-
    Lo que entregas hoy: la tabla del experimento y la bitácora. La prueba de calidad: las reflexiones no son frases hechas sobre la tecnología.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Delegar no es el problema; delegar sin haberlo decidido sí lo es.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre calcular y decidir: Dussel sobre las computadoras y las neuronas, Epicteto sobre lo que depende de nosotros, Floridi sobre la atención como bien escaso.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- El experimento de los tres instrumentos} (15 min · individual). (1) Toma estos diez números: 47, 138, 92, 215, 56, 304, 89, 173, 462 y 218. (2) Súmalos de memoria, sin escribir nada, y anota tu resultado y cuánto tardaste. (3) Súmalos con papel y lápiz, y anota resultado y tiempo. (4) Súmalos con calculadora, y anota resultado y tiempo. (5) Compara los tres y marca dónde estuvo cada error.
  checks:
  - Tengo los tres resultados con su tiempo.
  - Marqué dónde estuvo cada error.
  - Sé cuál método fue más rápido y cuál más exacto.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- El experimento de los tres instrumentos». \textbf{Formato:} tabla de 3 filas y 4 columnas (método / resultado / tiempo / errores), con la respuesta correcta anotada aparte. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las tres filas tienen tiempo medido, no estimado.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los cuatro momentos del cálculo} (20 min · parejas). (1) Con tu pareja, escriban los cuatro momentos con una frase propia cada uno. (2) Ubiquen en ellos el ábaco, el cuaderno del fiado, la caja registradora y el teléfono. (3) Escriban qué ganó y qué cobró cada salto. (4) Comparen sus tablas del experimento y anoten en qué se parecieron y en qué no.
  pilares:
  - |-
    \textbf{Los cuatro momentos.} Mental: el cuerpo solo. Físico: la memoria se apoya en un objeto, como el ábaco o el cuaderno del fiado. Mecánico: engranajes que suman solos. Electrónico: el chip. Ninguno borró al anterior.
  - |-
    \textbf{Cada salto gana y cobra.} Gana precisión, velocidad y memoria. Cobra ejercicio mental. Es el mismo trato de la máquina simple, solo que aquí lo que se entrega no es distancia: es práctica.
  - |-
    \textbf{Una capacidad sin uso se apaga despacio.} No se pierde de golpe ni se avisa. Simplemente un día calcular el vuelto de memoria cuesta más de lo que costaba, y uno no recuerda cuándo empezó.
  - |-
    \textbf{El molde que se disuelve.} El plástico de la bordadora sostiene el diseño mientras se borda y después desaparece. La calculadora puede ser eso, un andamio, o puede quedarse. Depende de si decides tú o si se decide solo.
  anatomia:
    titulo: Los cuatro momentos del cálculo
    body: |-
      \textbf{Mental:} el cuerpo solo. \\[1mm] \textbf{Físico:} ábaco, quipu, cuaderno; la memoria se apoya. \\[1mm] \textbf{Mecánico:} engranajes que suman sin pensar. \\[1mm] \textbf{Electrónico:} el chip. \\[1mm] \textbf{Pregunta:} ¿qué cálculo me quedo y cuál entrego?
  errores_comunes: |-
    (1) \textbf{Estimar el tiempo en vez de medirlo}: sin cronómetro los datos no sirven. (2) \textbf{Creer que el método más rápido es el mejor}: el experimento suele mostrar otra cosa. (3) \textbf{Confundir delegar con atrofiarse}: delegar decidiendo está bien; el problema es no haberlo decidido. (4) \textbf{Escribir reflexiones de frase hecha}: «dependemos mucho de la tecnología» no lo aprendiste hoy. (5) \textbf{Olvidar el cálculo físico}: el ábaco y el cuaderno del fiado son un momento propio, no un paso menor.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los cuatro momentos del cálculo». \textbf{Formato:} los cuatro momentos con frase propia, los cuatro objetos ubicados y lo que ganó y cobró cada salto. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} cada salto tiene escritas las dos partes, la ganancia y el costo.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- La bitácora y tu decisión} (30 min · individual). (1) Pasa a limpio la tabla del experimento. (2) Escribe tres observaciones de lo que pasó, sin juzgarte: solo lo que ocurrió. (3) Escribe dos o tres reflexiones honestas sobre lo que descubriste de tu cabeza. (4) Nombra al menos una capacidad que estés dejando de usar. (5) Escribe una propuesta concreta para esta semana, con qué cálculo vas a hacer sin aparato y cuándo. (6) Léesela a un compañero y pregúntale si alguna frase le sonó a lugar común.
  pilares:
  - |-
    \textbf{Tu entrega tiene cuatro piezas.} La tabla del experimento. Tres observaciones sin juicio. Dos o tres reflexiones honestas. Y una propuesta con día y hora.
  - |-
    \textbf{Observar no es juzgar.} «Tardé cuatro minutos de memoria y me equivoqué en 62» es una observación. «Soy malo para las matemáticas» es un juicio, y encima uno que no se deduce de un solo experimento.
  - |-
    \textbf{La propuesta tiene que caber en tu semana.} «Voy a calcular de memoria el vuelto en la tienda del lunes al viernes» se puede cumplir. «Voy a usar menos el celular» no, porque no dice qué ni cuándo.
  - |-
    \textbf{Nombrar la capacidad cuesta.} Escribir cuál se está apagando obliga a admitir algo sobre uno mismo. Si te sale una frase general, todavía no la nombraste.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tabla con los tres métodos, resultado, tiempo y errores. \\[1mm] \checkbox Tres observaciones sin juicio. \\[1mm] \checkbox Dos o tres reflexiones honestas, no frases hechas. \\[1mm] \checkbox Una capacidad nombrada en concreto. \\[1mm] \checkbox Una propuesta con qué cálculo y cuándo. \\[1mm] \checkbox Un compañero la leyó y no le sonó a lugar común.
  plantilla_guion: |-
    \textbf{Tabla.} \textit{Tres métodos, resultado, tiempo, errores.} \\[1mm] \textbf{Observaciones.} \textit{Qué pasó, sin juzgar.} \\[1mm] \textbf{Reflexiones.} \textit{Qué descubrí de mi cabeza.} \\[1mm] \textbf{Capacidad.} \textit{Cuál estoy dejando de usar.} \\[1mm] \textbf{Propuesta.} \textit{Qué cálculo, qué días, dónde.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} \textbf{Título:} «Actividad 3 --- La bitácora y tu decisión». \textbf{Formato:} la tabla del experimento, las tres observaciones, las reflexiones, la capacidad nombrada y la propuesta con día y lugar. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tu propuesta se puede cumplir o incumplir esta misma semana.
  producto_titulo: Bitácora del experimento de los tres instrumentos + una propuesta que se pueda cumplir
  criterios:
  - La tabla tiene los tres métodos con resultado, tiempo medido y errores
  - Las tres observaciones describen lo que pasó, sin juicio
  - Las reflexiones no son frases hechas sobre la tecnología
  - Hay una capacidad nombrada en concreto, no en general
  - La propuesta dice qué cálculo y cuándo, y se puede cumplir esta semana
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §5.4.5
    cita: |-
      Se debe tener clara conciencia que las mejores computadoras no pueden suplantar a los catorce mil millones de neuronas… situadas sólo en nuestra corteza cerebral. El método para la mejor decisión práctica es práctico.
    aplicacion: |-
      Lo escribió en 1977 y sigue en pie. La máquina calcula mejor que tú y no decide por ti qué vale la pena calcular. Esa parte no se delega, aunque a veces lo parezca.
    pregunta_espejo: |-
      ¿Qué decisión mía he dejado en manos de un aparato sin darme cuenta?
  estoico:
    autor: Epicteto · Enquiridión, 1 (c. 125 d.C.)
    cita: |-
      Hay ciertas cosas que dependen de nosotros mismos, como la opinión, la inclinación, los deseos, la aversión, y en una palabra, todas nuestras operaciones. Otras hay también que no dependen, como el cuerpo, las riquezas, la reputación, los imperios.
    aplicacion: |-
      Que exista la calculadora no depende de ti. Qué haces con ella, sí. Toda la sesión de hoy cabe en esa distinción, y la propuesta que escribas es la parte que sí está en tus manos.
    pregunta_espejo: |-
      De lo que me molesta de mi relación con los aparatos, ¿qué parte depende de mí?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6
    cita: |-
      Afirmamos que las capacidades atencionales son un bien finito, precioso y escaso. (trad. propia)
    aplicacion: |-
      Delegar un cálculo libera atención, y eso es bueno si la usas en otra cosa. El experimento de hoy sirve para ver si la liberaste o si te la quedó el mismo aparato que te la ahorró.
    pregunta_espejo: |-
      ¿En qué usé la atención que me liberó el último aparato que empecé a usar?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la bitácora y cumple tu propuesta al menos tres días. Anota si te costó más el primer día o el tercero. En la sesión 9 vas a defender una tecnología propia con evidencia, no con nostalgia.
web:
  resumen: |-
    En Cartago el bordado se hereda por la casa y el diseño se dibuja sobre un plástico que se disuelve al mojarse: cuando el molde se va, solo queda la puntada. Hoy haces el mismo cálculo de memoria, con papel y con calculadora, y miras qué queda de ti cuando el andamio desaparece.
  subtema: Historia de la técnica · Externalización del cálculo
  pre_lectura:
    por_que_importa: |-
      Delegar no es el problema. Delegar sin haberlo decidido deja capacidades sin uso, y una capacidad sin uso se apaga despacio y sin avisar.
    pregunta_detonante: |-
      ¿Cuándo fue la última vez que calculaste algo de memoria teniendo el teléfono a mano?
    activacion:
      titulo: Sin mirar
      descripcion: |-
        En 2 minutos, calcula de memoria cuánto pagarías por tres cosas de 3.500, 2.800 y 1.200 pesos. Anota el resultado y después compruébalo.
      duracion_min: 3
    conexion:
      anterior: En la sesión 7 escribiste la bitácora de un día sin electricidad.
      siguiente: En la sesión 9 defiendes una tecnología propia con evidencia y con su desventaja.

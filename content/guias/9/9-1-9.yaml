completo: true
titulo: Tecnologías propias --- saberes que el mundo aprende ahora
titulo_portada: |-
  Tecnologías propias ---
  saberes que el mundo
  aprende ahora
producto_final: Ficha completa de 1 página sobre una tecnología local sub-reconocida (agricultura andina de andenes, navegación afro-pacífica, arquitectura en guadua, medicina indígena, etc.), incluyendo descripción técnica, ventajas y por qué importa hoy
apertura:
  saber_ancestral: |-
    La \textbf{agricultura de andenes} de los pueblos andinos (incluyendo los Páez y Misak del Cauca) regenera suelos pobres mientras los cultiva: cada terraza retiene agua, fija nitrógeno y previene erosión. La \textbf{navegación afro-pacífica} de los pescadores del Chocó y Buenaventura lee corrientes, vientos y estrellas sin GPS para llegar a islas que requieren precisión de kilómetros. La \textbf{arquitectura en guadua} del Valle del Cauca y el Pacífico colombiano resiste sismos mejor que muchos edificios modernos --- lo demostró el terremoto del Eje Cafetero en 1999. La \textbf{medicina indígena} de los Arhuacos y Kogi de la Sierra Nevada lleva siglos catalogando plantas que apenas hoy estudia la farmacología occidental. Lo que la modernidad europea llamó ``atrasado'' hoy lo reevalúan universidades del norte global como \emph{tecnologías regenerativas}: técnicas que dan más al planeta de lo que toman.
  saber_contemporaneo: |-
    Frente a la crisis climática, la crisis energética y la crisis de salud mental contemporáneas, muchas tecnologías propias latinoamericanas ofrecen modelos. No es nostalgia ni romanticismo: es ingeniería biológica, química y social que sobrevivió siglos porque está bien diseñada. La pregunta no es si esas tecnologías son ``modernas'' o no --- es si sabremos integrarlas con las digitales sin extractivismo. Reconocerlas es el primer paso para usarlas con criterio en este siglo.
  pregunta_puente: |-
    ¿Qué saber técnico tradicional tienen tu familia o tu región que la modernidad oficial ignora o subvalora? ¿Por qué crees que lo subvalora?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 3-5 tecnologías propias latinoamericanas que la modernidad llamó ``atrasadas''; (2) \textbf{analizar} con precisión cómo funciona técnicamente una de ellas; (3) \textbf{evaluar} qué problema contemporáneo (clima, alimentación, vivienda, salud) podría resolver; (4) \textbf{crear} una ficha técnica de 1 página defendiendo su valor actual con argumentos, no con nostalgia.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Las sesiones 1-8 te dieron lentes para mirar la técnica con criterio histórico. Hoy aplicas esos lentes a lo más cercano: los saberes propios que están bajo tus pies y que muchas veces no ves.
  a_escuta: |-
    Antes de elegir tu tecnología propia, vamos a leer 4 ejemplos reales (andenes, guadua, navegación afro-pacífica, medicina ancestral). Lo importante no es admirarlos --- es entender por qué funcionan técnicamente.
  a_sistematizacion: |-
    Ya viste 4 ejemplos. Ahora vamos a entender los \textbf{4 criterios técnicos} que hacen que un saber tradicional califique como ``tecnología regenerativa'': funcionalidad probada, sostenibilidad, adaptabilidad al contexto, transmisibilidad intergeneracional.
  a_praxis: |-
    Tienes el método. Toca producir: una ficha técnica de 1 página sobre UNA tecnología propia, defendida con argumentos técnicos y contemporáneos --- no con nostalgia.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: 1 ficha técnica. El criterio principal: que un ingeniero externo pueda leerla y entender por qué esa tecnología funciona técnicamente, sin que tú apeles a ``es tradicional, por eso vale''.
  a_evaluacion: |-
    Antes de cerrar, mira las tecnologías propias desde las cinco dimensiones humanas. Recuperarlas no es nostalgia: es justicia histórica, sostenibilidad real, y soberanía técnica. Vale la pena nombrar las tres.
  a_triangulo: |-
    Y para terminar, tres voces sobre lo propio y lo global. Dussel sobre la colonialidad del conocimiento, Marco Aurelio sobre lo que dura cuando todo lo demás cambia, Floridi sobre tecnologías regenerativas como infoesfera saludable.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 4 tecnologías propias reales} (15 min · individual). Lee la información (en internet o materiales del aula) sobre estas 4 tecnologías propias colombianas/latinoamericanas: (a) \emph{andenes andinos}, (b) \emph{arquitectura en guadua del Pacífico}, (c) \emph{navegación afro-pacífica}, (d) \emph{medicina kogui de la Sierra Nevada}. Para cada una: ¿qué problema técnico resuelve? ¿qué ventaja tiene sobre alternativas modernas? ¿por qué crees que la modernidad la subvaloró?
  checks:
  - Leí información concreta sobre las 4 tecnologías propias.
  - Identifiqué qué problema técnico resuelve cada una.
  - Anoté al menos UNA ventaja sobre alternativas modernas en cada caso.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 4 tecnologías propias latinoamericanas». \textbf{Formato:} tabla de 4 columnas (Tecnología~|~Problema que resuelve~|~Ventaja sobre alternativa moderna~|~Por qué la subvaloraron), 4 filas. \textbf{Sabes que terminaste cuando} reconoces honestamente al menos UNA tecnología propia de la que NO sabías y entiendes por qué fue invisibilizada.
sistematizacion:
  intro: |-
    Toda tecnología propia que sobrevive a la prueba del tiempo cumple 4 criterios técnicos. Vamos a descomponerlos con los pilares del pensamiento computacional para que tu defensa sea rigurosa, no romántica.
  pilares:
  - |-
    Una tecnología regenerativa propia se descompone en 4 criterios: (1) \textbf{funcionalidad probada} (resuelve un problema técnico real, demostrado por siglos de uso), (2) \textbf{sostenibilidad} (no agota recursos --- los regenera o mantiene), (3) \textbf{adaptabilidad al contexto} (encaja con clima, materiales, cultura locales), (4) \textbf{transmisibilidad intergeneracional} (se enseña sin tecnología compleja, generación a generación).
  - |-
    Toda tecnología propia sigue el patrón \textbf{``probada por longue durée''}: la prueba de su valor no es la moda ni la novedad, sino su persistencia en el tiempo. Un sistema agrícola que lleva 3000 años nutriendo poblaciones es \emph{evidencia técnica más sólida} que una solución industrial que lleva 50 años con efectos colaterales crecientes.
  - |-
    Lo esencial de una defensa de tecnología propia cabe en una pregunta: \emph{¿esta técnica resuelve mejor que sus alternativas modernas el problema que aborda?}. Si la respuesta honesta es ``en algunos aspectos sí, en otros no'', defínelos. Si es ``solo es bonita y tradicional'', no es defensa técnica.
  - |-
    Pasos para evaluar cualquier tecnología propia: (1) ¿qué problema técnico específico resuelve?; (2) ¿qué evidencia hay de que lo resuelve bien (siglos, dispersión geográfica, adopción actual)?; (3) ¿qué desventaja tiene comparada con alternativa moderna?; (4) ¿qué problema contemporáneo podría ayudar a resolver?.
  anatomia:
    titulo: Anatomía de una tecnología propia regenerativa
    body: |-
      \textbf{Nombre y origen geográfico:} de dónde viene, qué pueblo. \\[1mm] \textbf{Problema técnico que resuelve:} específico (no ``ayuda al medio ambiente''). \\[1mm] \textbf{Mecanismo:} cómo funciona técnicamente. \\[1mm] \textbf{Evidencia:} siglos de uso, dispersión, adopción actual. \\[1mm] \textbf{Comparación:} ventajas y desventajas frente a alternativa moderna. \\[1mm] \textbf{Aplicación contemporánea:} qué problema actual podría ayudar a resolver.
  errores_comunes: |-
    (1) Defender la tecnología propia solo con argumentos morales (``es nuestra tradición'') sin argumentos técnicos. (2) Idealizarla y olvidar sus desventajas. (3) Confundir tecnología propia con artesanía decorativa --- la primera resuelve problemas técnicos, la segunda es expresión cultural. (4) Creer que ``moderno'' siempre es mejor o ``ancestral'' siempre es mejor --- las dos posiciones son ingenuas.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 4 criterios de una tecnología regenerativa». \textbf{Formato:} 4 fichas, una por criterio, cada una con: definición en tus palabras + 1 ejemplo de una de las 4 tecnologías de la Actividad 1 que la cumple bien. \textbf{Sabes que terminaste cuando} puedes evaluar cualquier saber tradicional contra los 4 criterios sin notas.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Ficha técnica de UNA tecnología propia} (30 min · individual). Hora de producir. Vas a elegir UNA tecnología propia (las 4 de la Actividad 1 u otra que conozcas de tu región: trapiche, conuco, telar wayuu, chinampa, etc.) y vas a redactar una ficha técnica de 1 página que la defienda con argumentos técnicos, no nostálgicos.
  pilares:
  - |-
    Tu ficha se descompone en 6 secciones: (1) nombre + origen geográfico (1 línea), (2) problema que resuelve (1 párrafo), (3) mecanismo técnico (cómo funciona, 1 párrafo + dibujo), (4) evidencia histórica (1 párrafo), (5) comparación con alternativa moderna (1 tabla simple), (6) aplicación contemporánea (1 párrafo: qué problema actual podría ayudar a resolver).
  - |-
    Sigue el patrón \textbf{``técnico vence a romántico''}: cada vez que escribas algo que suene a ``es bonito porque es tradición'', reescríbelo en términos técnicos: ``regenera suelo retención hídrica + fijación de nitrógeno'' es defensa técnica; ``es nuestra herencia ancestral'' es romántica.
  - |-
    Cada sección expresa una sola idea principal. Si tu sección de mecanismo dice 3 cosas confusas, divídela.
  - |-
    Algoritmo: (1) elige la tecnología; (2) investiga 10 minutos en internet con criterio; (3) llena las 6 secciones; (4) dibuja un esquema del mecanismo; (5) cierra con aplicación contemporánea concreta.
  checklist:
    titulo: Checklist antes de cerrar la ficha
    items: |-
      \checkbox Ficha cabe en 1 página A4 con las 6 secciones. \\[1mm] \checkbox Hay un dibujo del mecanismo (no foto, dibujo a mano o digital). \\[1mm] \checkbox Tabla de comparación con alternativa moderna. \\[1mm] \checkbox Aplicación contemporánea concreta (no genérica). \\[1mm] \checkbox Cero apelaciones a ``es nuestra tradición''; solo argumentos técnicos. \\[1mm] \checkbox Un compañero podría leerla y reconocer la tecnología como ``hito técnico'' aplicando los 4 criterios.
  plantilla_guion: |-
    \textbf{Sección 1.} \textit{Nombre + origen.} \\[1mm] \textbf{Sección 2.} \textit{Problema que resuelve.} \\[1mm] \textbf{Sección 3.} \textit{Mecanismo técnico + dibujo.} \\[1mm] \textbf{Sección 4.} \textit{Evidencia histórica.} \\[1mm] \textbf{Sección 5.} \textit{Tabla de comparación con alternativa moderna.} \\[1mm] \textbf{Sección 6.} \textit{Aplicación contemporánea.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Ficha técnica de [nombre de tu tecnología]». \textbf{Formato:} 6 secciones en hoja A4 + dibujo del mecanismo + tabla de comparación. \textbf{Extensión:} 1 página A4. \textbf{Sabes que terminaste cuando} la defiendes técnicamente sin apelar a la nostalgia y propones aplicación contemporánea concreta.
  producto_titulo: Ficha técnica de 1 página defendiendo una tecnología propia con argumentos rigurosos
  criterios:
  - Las 6 secciones presentes y completas
  - Dibujo del mecanismo técnico (no solo descripción verbal)
  - Tabla de comparación con alternativa moderna
  - Aplicación contemporánea concreta
  - Cero argumentos solo de tradición; todo defendido técnicamente
  - Aplica al menos 3 de los 4 criterios de tecnología regenerativa
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La descolonización del conocimiento empieza por reconocer técnicamente lo que la modernidad subvaloró.
    aplicacion: |-
      Durante 500 años la modernidad europea llamó ``primitivas'' a las técnicas precolombinas. Esa clasificación no era descripción técnica --- era política de poder. Hoy reconocer la guadua como ingeniería sismorresistente, los andenes como agronomía regenerativa, la medicina kogui como farmacología compleja, no es ``rescate cultural'': es justicia técnica. Tus abuelos siempre lo supieron; la academia apenas se está enterando.
    pregunta_espejo: |-
      ¿Qué saber técnico de mi región o familia he considerado ``atrasado'' sin haberlo estudiado a fondo? ¿Qué cambia cuando lo miro con criterio técnico riguroso?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Lo que sobrevive siglos sin renovación tecnológica sostiene su propio peso.
    aplicacion: |-
      Una tecnología que se mantiene 1000 años sin necesidad de actualización constante (sin software, sin batería, sin recambio) demuestra elegancia estructural que la mayoría de soluciones modernas no alcanzan. La sabiduría estoica reconoce el valor de la \emph{simplicidad probada}: lo que dura, dura por algo.
    pregunta_espejo: |-
      ¿Qué tecnología que uso hoy estará viva en 100 años sin actualizaciones forzosas? ¿Y cuál de las antiguas sigue cumpliendo su función intacta tras siglos?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La infoesfera saludable necesita tanto las tecnologías propias regenerativas como las digitales avanzadas.
    aplicacion: |-
      Pretender que la solución a los problemas contemporáneos viene solo de Silicon Valley es una limitación del horizonte. La crisis climática se va a resolver con energía renovable digital \emph{y} con agronomía andina, con IA \emph{y} con medicina indígena, con edificios inteligentes \emph{y} con arquitectura en guadua. La infoesfera saludable es híbrida, no monocultural.
    pregunta_espejo: |-
      ¿Qué hibridación entre tecnología propia y tecnología digital puedo imaginar para un problema contemporáneo (clima, salud, alimentación)?
compromiso: |-
  \textbf{Para la próxima semana.} Comparte tu ficha técnica con un familiar o vecino mayor que conozca tradiciones locales. Pregúntale: ``¿qué corregirías o agregarías?''. Anota su respuesta. Esa retroalimentación intergeneracional muchas veces enriquece la ficha más que cualquier libro. El próximo lunes traemos esas correcciones --- son insumo del manifiesto de cierre.

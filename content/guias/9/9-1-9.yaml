completo: true
duracion_min: 90
titulo: Tecnologías propias --- saberes que el mundo aprende ahora
titulo_portada: |-
  Tecnologías propias ---
  saberes que el mundo
  aprende ahora
producto_final: |-
  Una ficha técnica de una página sobre una tecnología propia poco reconocida: andenes andinos, arquitectura en guadua, navegación del Pacífico, trapiche, conuco o la que conozcas de tu región. Lleva el problema técnico que resuelve, el mecanismo dibujado, la evidencia de que funciona, una desventaja honesta frente a la alternativa moderna y un uso actual concreto. Sin un solo argumento que se apoye únicamente en que es tradición.
apertura:
  origen: Andes de Perú y Bolivia · las Pléyades en junio, puestas a prueba con satélite
  fuente: |-
    Orlove, B. S., Chiang, J. C. H., \& Cane, M. A. (2000). Forecasting Andean rainfall and crop yield from the influence of El Niño on Pleiades visibility. \emph{Nature, 403}(6765), 68--71. https://doi.org/10.1038/47456
  saber_ancestral: |-
    En los Andes, los agricultores miran las Pléyades en junio para saber si el verano vendrá seco. De eso depende si conviene atrasar la siembra de la papa. Conviene decirlo con precisión: esto es de los Andes de Perú y Bolivia, no del Valle ni de los quimbayas. En el año 2000, tres investigadores lo pusieron a prueba con imágenes de satélite y datos de El Niño, y encontraron que tenían razón. Cuando las Pléyades se ven borrosas es porque hay cirros altos. Y esos cirros anuncian un año de El Niño con menos lluvia (Orlove, Chiang y Cane, 2000). El saber campesino no era superstición: era una observación buena a la que le faltaba la explicación. Hoy en Colombia las Mesas Técnicas Agroclimáticas sientan en la misma mesa a agricultores, meteorólogos y técnicos. Deciden juntos qué sembrar y cuándo (Loboguerrero et al., 2018). La \textbf{cara de exclusión}: el saber local también se equivoca. Presentarlo como infalible es otra forma de faltarle al respeto. El punto no es que los abuelos supieran. Es que una observación se puede poner a prueba.
  saber_contemporaneo: |-
    Una tecnología propia se defiende con cuatro criterios técnicos, no con nostalgia. \textbf{Funcionalidad probada}: resuelve un problema concreto y hay evidencia de que lo resuelve. \textbf{Sostenibilidad}: no agota el recurso del que depende, y a veces lo regenera. \textbf{Adaptación al lugar}: está hecha para ese suelo, ese clima y esos materiales. \textbf{Transmisibilidad}: se puede enseñar sin depender de una fábrica lejana. La prueba de valor no es la antigüedad. Un sistema agrícola que lleva siglos alimentando gente ha pasado más ensayos que cualquier prototipo. Esa es la razón por la que merece atención. Pero una defensa honesta incluye la desventaja. Casi todas estas tecnologías piden más trabajo humano o más conocimiento local que su alternativa industrial. Decirlo no debilita el argumento: es lo que lo vuelve creíble.
  pregunta_puente: |-
    Los agricultores andinos leían una señal real y les faltaba la explicación. ¿Qué saber de tu región conoces que nadie ha puesto a prueba todavía, y cómo se pondría a prueba?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} el problema técnico que resuelve cada una de cuatro tecnologías propias; (2) \textbf{explicar} los cuatro criterios con que se defiende una tecnología propia sin apelar a la tradición; (3) \textbf{crear} una ficha técnica de una página que defienda una de ellas con evidencia y con una desventaja reconocida.
puentes:
  a_ruta: |-
    Vienes de recorrer la historia de la técnica desde el primer filo hasta la era digital. Hoy vuelves la mirada a lo que quedó fuera de ese relato. En la sesión 10 escribes el manifiesto del periodo, y esto es la mitad de su materia.
  a_escuta: |-
    Antes de la teoría vas a mirar cuatro tecnologías propias y a preguntarles lo mismo que le preguntarías a una máquina: qué problema resuelve y cómo se sabe que lo resuelve.
  a_sistematizacion: |-
    Ya tienes las cuatro. Ahora vas a ordenar los criterios con los que se defiende una, para que tu defensa sea técnica y no sentimental.
  a_praxis: |-
    Tienes los criterios. Toca elegir una y escribir su ficha, con la desventaja incluida.
  a_producto: |-
    Lo que entregas hoy: una ficha de una página con mecanismo dibujado y evidencia. La prueba de calidad: no queda ni un argumento que se sostenga solo en que es tradición.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Defender un saber sin ponerlo a prueba es tratarlo como adorno, no como conocimiento.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre saber y probar: Dussel sobre la tecnología humanizada, Marco Aurelio sobre mirar el curso de los astros, Floridi sobre los patrones pequeños que solo significan si se comparan.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Cuatro tecnologías propias} (15 min · individual). (1) Con los materiales del aula o internet, mira estas cuatro: andenes andinos, arquitectura en guadua, navegación del Pacífico y trapiche de caña. (2) Escribe para cada una qué problema técnico resuelve, en una frase. (3) Escribe qué evidencia hay de que lo resuelve: siglos de uso, extensión geográfica o adopción actual. (4) Marca la que más te sorprendió y di en una línea por qué.
  checks:
  - Tengo las cuatro con su problema técnico en una frase.
  - Anoté qué evidencia hay de que cada una funciona.
  - Marqué la que más me sorprendió y escribí por qué.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Cuatro tecnologías propias». \textbf{Formato:} tabla de 4 filas y 3 columnas (tecnología / problema técnico que resuelve / evidencia de que funciona). \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} ninguna casilla de evidencia dice solo «es muy antigua».
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los cuatro criterios} (20 min · parejas). (1) Con tu pareja, escriban los cuatro criterios con una frase propia cada uno. (2) Apliquen los cuatro a una de las tecnologías de la Actividad 1 y anoten cuáles cumple. (3) Busquen su alternativa industrial y escriban en qué gana cada una. (4) Escriban la desventaja de la tecnología propia sin suavizarla.
  pilares:
  - |-
    \textbf{Los cuatro criterios.} Funcionalidad probada: resuelve un problema y hay evidencia. Sostenibilidad: no agota el recurso del que vive. Adaptación al lugar: está hecha para ese suelo y ese clima. Transmisibilidad: se enseña sin depender de una fábrica lejana.
  - |-
    \textbf{La antigüedad no es un argumento, es una pista.} Que algo lleve siglos funcionando indica que pasó muchos ensayos. Pero hay que decir cuáles: qué problema resolvió, dónde, durante cuánto tiempo y con qué resultado medible.
  - |-
    \textbf{Toda defensa honesta incluye la desventaja.} Casi todas estas tecnologías piden más trabajo humano o más conocimiento local. Reconocerlo es lo que separa una ficha técnica de un folleto.
  - |-
    \textbf{El saber local también se equivoca.} Presentarlo como infalible es otra forma de faltarle al respeto. Lo valioso de las Pléyades no es que los abuelos supieran: es que la observación se pudo poner a prueba y aguantó.
  anatomia:
    titulo: Cómo se defiende una tecnología propia
    body: |-
      \textbf{Funcionalidad:} qué problema resuelve y con qué evidencia. \\[1mm] \textbf{Sostenibilidad:} qué recurso usa y si lo agota. \\[1mm] \textbf{Adaptación:} para qué suelo, clima y materiales se hizo. \\[1mm] \textbf{Transmisibilidad:} quién puede aprenderla y con qué. \\[1mm] \textbf{Honestidad:} qué desventaja tiene frente a la alternativa industrial.
  errores_comunes: |-
    (1) \textbf{Defender por antigüedad}: que sea vieja no dice si funciona. (2) \textbf{Ocultar la desventaja}: una ficha sin desventaja se lee como propaganda. (3) \textbf{Presentar el saber local como infalible}: eso también es faltarle al respeto. (4) \textbf{Atribuir un saber al lugar equivocado}: las Pléyades son de los Andes de Perú y Bolivia, no del Valle. (5) \textbf{Describir sin mecanismo}: sin dibujo del cómo funciona, la ficha es una postal.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los cuatro criterios». \textbf{Formato:} los cuatro criterios con frase propia, aplicados a una tecnología, más la comparación con su alternativa industrial y la desventaja escrita. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} la desventaja está escrita sin suavizar.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- La ficha técnica} (30 min · individual). (1) Elige una tecnología propia, de las cuatro o de tu región. (2) Escribe el problema técnico que resuelve, en una frase. (3) Dibuja el mecanismo y rotula sus partes: sin dibujo no hay ficha. (4) Escribe la evidencia de que funciona, con lugar y tiempo. (5) Escribe una desventaja honesta frente a la alternativa industrial y un uso actual concreto. (6) Intercambia la ficha con un compañero y marca si algún argumento suyo se sostiene solo en que es tradición.
  pilares:
  - |-
    \textbf{Tu ficha tiene cinco partes.} El problema técnico. El mecanismo dibujado y rotulado. La evidencia con lugar y tiempo. La desventaja frente a la alternativa industrial. El uso actual concreto.
  - |-
    \textbf{El dibujo es obligatorio.} Describir con palabras qué hace un andén es fácil; dibujar cómo retiene el agua y frena la erosión obliga a entenderlo. Ahí se ve quién leyó y quién copió.
  - |-
    \textbf{La evidencia lleva lugar y tiempo.} «Funciona hace mucho» no sirve. «Se usa en la sierra de Perú desde hace más de mil años, en terrenos con pendiente fuerte» sí sirve.
  - |-
    \textbf{El uso actual la saca del museo.} Una tecnología con un uso vigente es una propuesta; una sin él es una descripción histórica. Busca dónde se está aplicando hoy y con quién.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox El problema técnico está en una frase. \\[1mm] \checkbox Hay dibujo del mecanismo con las partes rotuladas. \\[1mm] \checkbox La evidencia menciona lugar y tiempo. \\[1mm] \checkbox Hay una desventaja escrita sin suavizar. \\[1mm] \checkbox Hay un uso actual concreto, con quién lo aplica. \\[1mm] \checkbox Ningún argumento se sostiene solo en que es tradición.
  plantilla_guion: |-
    \textbf{Tecnología.} \textit{Cuál y de dónde es, con precisión.} \\[1mm] \textbf{Problema.} \textit{Qué resuelve, en una frase.} \\[1mm] \textbf{Mecanismo.} \textit{Dibujo con partes rotuladas.} \\[1mm] \textbf{Evidencia.} \textit{Lugar, tiempo, resultado.} \\[1mm] \textbf{Desventaja y uso actual.} \textit{Sin suavizar, y con quién la aplica hoy.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- La ficha técnica». \textbf{Formato:} las cinco partes de la ficha, con el dibujo del mecanismo rotulado y la desventaja escrita. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} tu ficha se sostiene sin usar ni una vez la palabra «ancestral» como argumento.
  producto_titulo: Ficha técnica de una página con mecanismo dibujado, evidencia y desventaja reconocida
  criterios:
  - El problema técnico está enunciado en una frase
  - Hay dibujo del mecanismo con las partes rotuladas
  - La evidencia menciona lugar y tiempo, no solo antigüedad
  - Hay una desventaja honesta frente a la alternativa industrial
  - Hay un uso actual concreto y se dice quién lo aplica
  - Revisaste la ficha de un compañero y marcaste sus argumentos de sola tradición
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.7.1
    cita: |-
      No hay liberación sin economía y tecnología humanizada, diseño, y sin partir de una formación social histórica.
    aplicacion: |-
      Una tecnología propia parte de su lugar: ese suelo, ese clima, esa gente. No es una versión pobre de otra industrial. Es una respuesta distinta a un problema que la industrial resolvió pensando en otro sitio.
    pregunta_espejo: |-
      ¿Qué problema de mi región se está resolviendo con una solución pensada para otro lugar?
  estoico:
    autor: Marco Aurelio · Meditaciones VII, 47 (c. 175 d.C.)
    cita: |-
      Conduce mirar alrededor el curso de los astros, como quien gira con ellos, y contemplar también frecuentemente las mutuas conversiones de los elementos, porque las consideraciones de estas cosas purifican a uno de las manchas de esta vida terrestre.
    aplicacion: |-
      Mirar el cielo para decidir cuándo sembrar es exactamente eso: leer el curso de los astros y actuar. Los agricultores andinos lo hacían con las Pléyades, y en el año 2000 un satélite confirmó que la señal existía.
    pregunta_espejo: |-
      ¿Qué señal del entorno miro sin darme cuenta y uso para decidir algo?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    cita: |-
      Los pequeños patrones solo pueden ser significativos si se agregan correctamente, se comparan y se procesan a tiempo. (trad. propia, abreviada)
    aplicacion: |-
      El brillo de las Pléyades una noche no dice nada. Cientos de observaciones a lo largo de generaciones, comparadas y usadas a tiempo, sí dicen algo. Eso es lo que un satélite pudo verificar después.
    pregunta_espejo: |-
      ¿Qué observación mía repetida muchas veces podría significar algo si la comparara?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la ficha completa y el dibujo del mecanismo. Pregúntale a alguien mayor de tu familia por una técnica de su oficio que no se enseñe en ningún curso. En la sesión 10 escribes el manifiesto del periodo, y esa respuesta te va a servir.
web:
  resumen: |-
    En los Andes de Perú y Bolivia se mira el brillo de las Pléyades en junio para decidir cuándo sembrar la papa. En el año 2000 tres investigadores lo comprobaron con satélite: la señal existía. Hoy defiendes una tecnología propia con cuatro criterios técnicos, con evidencia de lugar y tiempo, y con su desventaja escrita sin suavizar.
  subtema: Historia de la técnica · Saberes que se pueden probar
  pre_lectura:

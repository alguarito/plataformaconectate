titulo: Tecnologías propias --- saberes que el mundo aprende ahora
producto_final: |-
  Ficha completa de 1 página sobre una tecnología local sub-reconocida (agricultura andina de andenes, navegación afro-pacífica, arquitectura en guadua, etc.), incluyendo descripción, ventajas y por qué importa hoy
saber_ancestral_idea: |-
  La agricultura andina de andenes regenera suelos. La navegación afro-pacífica lee corrientes sin GPS. La construcción en guadua resiste sismos. La medicina indígena trabaja con plantas locales. Lo que se llamaba "atrasado" hoy lo estudian universidades del norte como "tecnología regenerativa".

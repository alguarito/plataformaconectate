clave: 2-1
grado: 9
periodo: 2
sesion: 1
completo: true
titulo: ¿Qué es diseñar? --- orden, jerarquía, intención
titulo_portada: |-
  ¿Qué es diseñar? ---
  orden, jerarquía,
  intención
producto_final: Análisis comparado de 3 productos editoriales reales (libro, revista, periódico o volante) identificando decisiones de orden, jerarquía e intención del diseñador
apertura:
  saber_ancestral: |-
    Diseñar no nació con Figma. Los \textbf{pasquines populares} del Valle, los \textbf{almanaques campesinos}, los \textbf{pliegos parroquiales} y las \textbf{cartillas escolares} de los años 50 eran piezas de diseño con propósito: jerarquía clara, tipografía que se podía leer en la plaza, orden de información que respondía a una necesidad concreta de la comunidad. Antes del diseño profesional hubo \emph{oficio editorial} ---  carpintero del texto, sastre de la página, panadero de la información.
  origen: Pasquines, almanaques, pliegos parroquiales y cartillas del Valle del Cauca
  saber_contemporaneo: |-
    Hoy ``diseñar'' suele asociarse a Figma, Canva o Adobe. Pero el principio es el mismo desde el pasquín: \textbf{decidir qué importa más y comunicarlo con orden}. El diseño editorial digital hereda 500 años de tipografía, jerarquía y composición. Tu próxima publicación en redes sociales también es diseño editorial --- aunque no la pienses así.
  pregunta_puente: |-
    ¿Qué tienen en común un pasquín del Valle hace 100 años y una historia de Instagram bien hecha hoy? ¿Y en qué se diferencian profundamente?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 3 decisiones de diseño en productos editoriales reales (libro, revista, periódico); (2) \textbf{analizar} cómo \emph{orden, jerarquía e intención} sostienen la legibilidad; (3) \textbf{explicar} la diferencia entre diseño profesional y maquetación apresurada; (4) \textbf{crear} un análisis comparado de 3 productos editoriales con tus propios criterios.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo del periodo 2. En 10 sesiones vas a construir una revista digital de 8 páginas. Hoy es la apertura: entrenar el ojo a ver decisiones de diseño que otros toman sin que tú lo notes.
  a_escuta: |-
    Antes de teorizar, vamos a leer 3 productos editoriales reales. Detrás de cada uno hay decisiones específicas --- de tamaño, color, orden. Aprender a verlas es el primer paso del oficio.
  a_sistematizacion: |-
    Ya viste decisiones reales. Ahora vamos a entender los \textbf{3 pilares} de todo buen diseño editorial: orden, jerarquía e intención. Distinguirlos con criterio te permite leer cualquier pieza editorial, vieja o nueva.
  a_praxis: |-
    Tienes el método. Toca producir: un análisis comparado escrito de 3 productos editoriales. Sin diseñar todavía --- analizar primero.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: análisis comparado escrito. El criterio principal: que identifiques decisiones específicas, no generalidades estéticas.
  a_evaluacion: |-
    Antes de cerrar, mira el oficio de diseñar desde las cinco dimensiones humanas. Diseñar bien es un acto profundamente político: decides quién puede leer, qué se ve primero, qué se invisibiliza.
  a_triangulo: |-
    Y para terminar, tres voces sobre diseñar. Dussel sobre los diseños que excluyen, Marco Aurelio sobre la sencillez bien hecha, Floridi sobre el diseño como organizador de la infoesfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 3 productos editoriales reales} (15 min · individual). Sin moverte mucho, busca \textbf{3 productos editoriales} cerca tuyo: (a) un \emph{libro} (texto, ensayo, novela), (b) una \emph{revista} (impresa o digital), (c) un \emph{periódico o volante}. Para cada uno: ¿qué se ve primero al abrir? ¿qué viene después? ¿qué es lo más pequeño?
  checks:
  - Tengo a mano 3 productos editoriales reales (libro, revista, periódico/volante).
  - Identifiqué qué se ve primero, segundo, tercero en cada uno.
  - Reconocí 1 decisión de diseño en cada producto (tamaño, color, espacio).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 productos editoriales bajo la lupa». \textbf{Formato:} tabla de 4 columnas (Producto~|~Qué se ve primero~|~Qué viene después~|~Decisión de diseño identificada), 3 filas. \textbf{Sabes que terminaste cuando} para cada producto puedes nombrar al menos UNA decisión específica del diseñador.
sistematizacion:
  intro: |-
    Todo diseño editorial fuerte se sostiene en 3 pilares. Vamos a descomponerlos con los pilares del pensamiento computacional para que sepas qué buscar en cualquier pieza.
  pilares:
  - |-
    El diseño editorial se descompone en 3 pilares: (1) \textbf{orden} (qué va antes, qué después --- secuencia narrativa), (2) \textbf{jerarquía} (qué es más importante, qué es secundario --- tamaño, peso, color), (3) \textbf{intención} (para qué sirve la pieza --- informar, persuadir, entretener, recordar).
  - |-
    Todo diseño fuerte sigue el patrón \textbf{``decisión visible, no accidente''}: en una pieza bien diseñada, cada tamaño, cada color, cada espacio responde a una decisión. En una pieza apresurada, todo se ve igual ---  el ojo no sabe por dónde empezar y la lectura se vuelve trabajo.
  - |-
    Lo esencial del diseño cabe en una pregunta: \emph{¿qué quiero que el lector lea primero, qué después, y qué no necesita leer?}. Sin esa pregunta, diseñar es decorar.
  - |-
    Pasos para analizar cualquier pieza editorial: (1) ¿cuál es su intención principal?; (2) ¿qué orden propone el diseñador (de arriba abajo, de izquierda a derecha, otra)?; (3) ¿cómo establece jerarquía (tamaño, peso, color, espacio)?; (4) ¿qué decisión te parece más fuerte y cuál más débil?.
  anatomia:
    titulo: Anatomía de una pieza editorial
    body: |-
      \textbf{Intención:} informar, persuadir, entretener, recordar. \\[1mm] \textbf{Orden:} secuencia narrativa que propone (lineal, jerárquica, modular). \\[1mm] \textbf{Jerarquía visual:} tamaños, pesos, colores que distinguen lo importante. \\[1mm] \textbf{Espacio negativo:} aire que respira entre elementos. \\[1mm] \textbf{Tipografía:} familia, peso, alineación. \\[1mm] \textbf{Color:} paleta, contraste, función.
  errores_comunes: |-
    (1) Confundir ``diseñar'' con ``decorar'' --- el diseño tiene función, la decoración es opcional. (2) Pensar que ``si está bonito está bien diseñado'' --- la belleza sin función no convence. (3) Olvidar la intención: pieza con buena tipografía pero sin propósito claro pierde fuerza. (4) Imitar tendencias sin entenderlas --- copiar Figma sin saber por qué se ve así.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- 3 pilares del diseño editorial». \textbf{Formato:} 3 fichas, una por pilar (orden, jerarquía, intención), cada una con: definición en tus palabras + 1 ejemplo de uno de los 3 productos analizados en Actividad 1 que lo cumple bien. \textbf{Sabes que terminaste cuando} puedes explicar los 3 pilares sin notas y reconocer cuál es más fuerte en cada producto.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Análisis comparado de 3 productos editoriales} (30 min · individual). Hora de escribir. Vas a hacer un análisis comparado escrito (texto + dibujo/esquema) de 3 productos editoriales reales, evaluando cómo aplican los 3 pilares.
  pilares:
  - |-
    Tu análisis se descompone en 4 secciones: (1) introducción (qué productos elegiste y por qué), (2) análisis individual (los 3 pilares aplicados a cada uno), (3) comparación cruzada (qué tienen en común, qué los diferencia), (4) conclusión personal (qué decisión de diseño quieres recordar para tu propia revista).
  - |-
    Sigue el patrón \textbf{``ejemplo específico vence a categoría abstracta''}: no escribas ``el libro tiene buena tipografía''. Escribe ``el libro usa una tipografía con serifa de cuerpo 10pt con interlineado 15pt que facilita la lectura larga''. Lo concreto convence.
  - |-
    Cada análisis individual expresa una sola idea principal: cómo logra la pieza su intención. Si tu análisis enumera 7 detalles sin jerarquía propia, perdiste el foco.
  - |-
    Algoritmo: (1) elige 3 productos editoriales distintos; (2) analiza cada uno con los 3 pilares (5 min cada uno); (3) escribe comparación cruzada (5 min); (4) cierra con 1 decisión de diseño que te llevas (5 min); (5) revisa que cada apartado tenga al menos UN ejemplo específico.
  checklist:
    titulo: Checklist antes de cerrar el análisis
    items: |-
      \checkbox 3 productos editoriales distintos analizados (libro + revista + periódico/volante). \\[1mm] \checkbox Cada análisis aplica los 3 pilares (orden, jerarquía, intención). \\[1mm] \checkbox Hay al menos 1 ejemplo específico por análisis (no generalidad). \\[1mm] \checkbox Comparación cruzada identifica al menos 1 común y 1 diferencia. \\[1mm] \checkbox Conclusión personal nombra 1 decisión que vas a recordar para tu propia revista.
  plantilla_guion: |-
    \textbf{Introducción.} \textit{Qué 3 productos elegí y por qué.} \\[1mm] \textbf{Análisis individual.} \textit{Cada producto con los 3 pilares aplicados.} \\[1mm] \textbf{Comparación cruzada.} \textit{Qué tienen en común, qué los diferencia.} \\[1mm] \textbf{Conclusión personal.} \textit{Una decisión de diseño que voy a recordar para mi revista.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Análisis comparado de 3 productos editoriales». \textbf{Formato:} 4 secciones escritas + dibujo/esquema simple de cada producto. \textbf{Extensión:} 2 páginas de cuaderno. \textbf{Sabes que terminaste cuando} un compañero puede leer tu análisis y entender qué decisión de diseño te llevas.
  producto_titulo: Análisis comparado de 3 productos editoriales con los 3 pilares aplicados
  criterios:
  - 3 productos editoriales distintos analizados
  - Los 3 pilares (orden, jerarquía, intención) aplicados a cada uno
  - Al menos 1 ejemplo específico por producto (no generalidad)
  - Comparación cruzada con común y diferencia
  - Conclusión personal con decisión accionable para la revista del periodo
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Diseñar es decidir quién puede leer; toda decisión de diseño excluye a alguien.
    aplicacion: |-
      Una pieza editorial bien diseñada para ojo joven puede ser invisible para ojo anciano. Un sitio web optimizado para celular caro puede excluir a quien usa teléfono básico. Un manual médico en jerga técnica excluye al paciente. Cada decisión de diseño tiene consecuencias políticas: incluye o excluye. La inclusión empieza por reconocer a quién dejaste afuera y diseñar de nuevo.
    pregunta_espejo: |-
      ¿A quién excluyen las piezas editoriales que admiro? ¿Y mis propias piezas, a quién dejan afuera sin darme cuenta?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Lo sencillo bien hecho es más difícil que lo complicado mal hecho.
    aplicacion: |-
      La tentación del diseñador novato es ``llenar la página'' con tipografías, colores, decoraciones. La sabiduría estoica del diseño es lo opuesto: \emph{simplicidad rigurosa}. Una página con UNA fuente, dos colores, espacio generoso y jerarquía clara se ve más profesional que una con 5 fuentes y 10 colores. Aprender a quitar es más difícil que aprender a agregar.
    pregunta_espejo: |-
      Cuando diseño algo, ¿agrego o quito? ¿Qué de lo que pongo es necesario y qué es solo ruido visual que me da miedo eliminar?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El diseño es el lenguaje silencioso con que la infoesfera se organiza.
    aplicacion: |-
      Cada vez que un diseñador decide tamaño, orden y color, organiza la infoesfera. Las decisiones del que diseñó Twitter (cómo se ven los tweets, qué se destaca) moldean el debate público mundial. El diseño nunca es neutro: \emph{moldea la atención humana a escala masiva}. Aprender a diseñar es aprender a tomar responsabilidad por la atención de otros.
    pregunta_espejo: |-
      ¿Qué decisiones de diseño en las plataformas que uso a diario moldean mi atención sin que yo lo note? ¿Cuáles diseñaría diferente?
compromiso: |-
  \textbf{Para la próxima semana.} Lleva tu cuaderno durante 3 días y, cada vez que veas una pieza editorial (cartel, volante, libro, post de redes), anota UNA decisión de diseño que te llamó la atención (positiva o negativa). Al cabo de 3 días lee la lista. Vas a notar cuántas decisiones pasan invisibles. El próximo lunes traemos esa bitácora --- es insumo de la sesión 2.
web:
  resumen: |-
    Apertura del Periodo 2. Entrenas el ojo en piezas editoriales reales y entiendes los 3 pilares de todo buen diseño.
  subtema: Apertura · Diseño editorial digital
  pre_lectura:
    por_que_importa: |-
      Tu próxima publicación en redes también es diseño editorial — aunque no lo pienses así. Entrenar el ojo a ver decisiones de diseño que otros toman sin que las notes es ventaja profesional inmediata. Sin esto, copias tendencias sin entenderlas.
    pregunta_detonante: |-
      Mira la página de Instagram que más sigues. ¿Qué decisiones de diseño tomó esa persona o esa marca para que se vea así? ¿Cuáles podrías imitar y cuáles inventar?
    activacion:
      titulo: Test del primer vistazo
      descripcion: |-
        En 3 minutos, abre un libro, una revista o un periódico que tengas a mano. Mira la portada o primera página durante exactamente 5 segundos. Cierra el producto. Anota qué viste. Eso que recordaste es lo que el diseñador logró que se quedara contigo.
      duracion_min: 3
    conexion:
      anterior: |-
        En el Periodo 1 cerraste con tu manifiesto del técnico crítico. Ahora aplicas esa mirada a la técnica más cotidiana: cómo se comunica la información.
      siguiente: |-
        En la sesión 2 verás la cuadrícula como primer principio operativo del orden — la columna vertebral invisible de toda página.
  conceptos_clave:
    - termino: Orden
      definicion: |-
        La secuencia narrativa que propone una pieza editorial: qué va antes, qué después. El ojo del lector recorre la página siguiendo ese orden, sepa o no que lo está siguiendo.
      ejemplo: |-
        Una revista bien diseñada te lleva del titular al subtítulo, al lead, al cuerpo y al pie de foto en ese orden. No es accidente — es decisión.
      emoji: "🔢"
    - termino: Jerarquía
      definicion: |-
        La distinción visual entre lo más importante y lo secundario. Se establece con tamaño, peso, color, espacio. Sin jerarquía, todo se ve igual y el ojo no sabe por dónde empezar.
      ejemplo: |-
        El titular es 36pt en negrita. El subtítulo 18pt en regular. El cuerpo 11pt. Esa diferencia te dice qué leer primero sin que nadie te lo explique.
      emoji: "🏔"
    - termino: Intención
      definicion: |-
        El propósito de la pieza: informar, persuadir, entretener, recordar. Toda decisión de diseño debe servir a esa intención principal. Sin intención clara, diseñar es decorar.
      ejemplo: |-
        Un periódico tiene intención de informar rápido (titulares grandes, lead claro). Una revista de literatura tiene intención de invitar a lectura larga (tipografía cómoda, espacio generoso).
      emoji: "🎯"
    - termino: Decisión visible vs accidente
      definicion: |-
        En una pieza bien diseñada, cada tamaño, color y espacio responde a una decisión. En una pieza apresurada, todo se ve igual — el ojo no sabe qué importa.
      ejemplo: |-
        Si abres dos volantes y uno se siente "claro" y el otro "ruidoso", la diferencia es que el primero tuvo decisiones, el segundo tuvo descuidos.
      emoji: "🎲"
    - termino: Espacio negativo (aire)
      definicion: |-
        El espacio sin contenido que respira entre elementos. Es tan importante como el contenido — sin aire, la página agobia. Con aire, la página invita.
      ejemplo: |-
        Compara el feed de Apple con el de una tienda popular online. Apple usa MUCHO espacio en blanco; la otra "aprovecha cada píxel". Resultado: Apple se siente premium, la otra agobia.
      emoji: "🌬"
    - termino: Diseñar vs decorar
      definicion: |-
        Diseñar tiene función: resolver un problema de comunicación. Decorar es opcional, agrega sin función clara. El diseño puede ser bonito; pero ser bonito sin función no es diseño.
      ejemplo: |-
        Una etiqueta de medicina debe ser legible al primer vistazo (diseño). Que tenga un dibujito decorativo no la hace mejor — puede empeorarla si distrae.
      emoji: "⚖️"
  quiz:
    titulo: "✅ Verifica los 3 pilares del diseño"
    instrucciones: 5 preguntas para confirmar que dominas orden, jerarquía e intención. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Cuál es la diferencia clave entre "diseñar" y "decorar"?
        opciones:
          - No hay diferencia
          - Diseñar tiene función (resuelve un problema); decorar es opcional y no resuelve nada
          - Diseñar es para profesionales; decorar para todos
          - Diseñar usa software; decorar usa lápiz
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Diseñar resuelve un problema de comunicación. Decorar agrega sin función clara. Lo bonito puede ser diseño o decoración — la prueba es si tiene función.
        feedback_incorrecto: |-
          Diseñar = función. Decorar = adorno opcional. Una etiqueta con dibujitos puede ser decoración; una etiqueta con jerarquía clara y legible es diseño.
      - enunciado: |-
          En una revista, los titulares son 36pt, los subtítulos 18pt, el cuerpo 11pt. ¿Qué principio aplica esa decisión?
        opciones:
          - Orden
          - Jerarquía
          - Intención
          - Decoración
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La jerarquía se establece con tamaño, peso, color o espacio. Los distintos puntos tipográficos te dicen qué leer primero.
        feedback_incorrecto: |-
          Jerarquía. Los tamaños distintos crean orden de importancia: titular > subtítulo > cuerpo. Sin esa jerarquía, el ojo no sabe qué leer primero.
      - enunciado: ¿Para qué sirve el "espacio negativo" en diseño editorial?
        opciones:
          - Para ahorrar tinta
          - Para que la página respire — sin él, agobia. Con él, invita
          - Para tapar errores
          - Para llenar espacio si falta contenido
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El aire entre elementos es tan importante como el contenido. Apple usa mucho espacio en blanco y por eso se siente premium.
        feedback_incorrecto: |-
          El espacio negativo hace respirar la página. Sin él, la información se siente apretada y agobia. Con él, la lectura es invitante.
      - enunciado: Si un periódico tiene titulares grandes, lead claro y datos rápidos, ¿qué intención tiene?
        opciones:
          - Informar rápido
          - Invitar a lectura larga
          - Entretener
          - Vender productos
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Diseño coherente con intención de informar rápido. Un periódico no compite con una novela — compite con el tiempo del lector de mañana.
        feedback_incorrecto: |-
          Informar rápido. El periódico debe entregar la noticia en segundos. Por eso titulares grandes, lead claro, datos rápidos. La intención modela el diseño.
      - enunciado: En el saber ancestral de los pasquines del Valle, ¿qué aplica a tu próxima publicación digital?
        opciones:
          - Nada — los pasquines son antiguos
          - Que cada elemento (jerarquía, tipografía, orden) responde a una necesidad concreta de comunicación
          - Que se hacían en papel
          - Que eran solo para adultos
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El pasquín bien hecho tenía jerarquía clara, tipografía legible y orden propósito. Tu post de Instagram bien hecho cumple los mismos 3 pilares.
        feedback_incorrecto: |-
          Cada elemento responde a necesidad concreta. Pasquín y post de redes comparten lógica: comunicar con claridad. La forma cambia, los pilares se mantienen.
  post_lectura:
    transferencia: |-
      Esta semana, lleva tu cuaderno y cada vez que veas una pieza editorial (cartel, volante, libro, post de redes), anota UNA decisión de diseño que te llamó la atención. Al cabo de 3 días lee la lista — vas a notar cuántas decisiones pasan invisibles. El próximo lunes la traemos como insumo de la sesión 2.
  cinco_dimensiones:
    personal: |-
      Aprendiste a ver decisiones de diseño que antes eran invisibles — esa mirada es ventaja profesional inmediata.
    emocional: Reconociste que diseñar no es decorar — es responsabilidad por la atención de otros.
    ciudadana: "Entendiste que diseñar es decidir quién puede leer: cada decisión incluye o excluye."
    local: Conectaste el pasquín popular del Valle con tu próxima publicación digital — el oficio sobrevive.
    intergeneracional: |-
      La cartilla de tu abuela, el pasquín de tu bisabuelo y tu post de mañana comparten 3 pilares: orden, jerarquía, intención.

titulo: ¿Qué es diseñar? --- orden, jerarquía, intención
producto_final: |-
  Análisis comparado de 3 productos editoriales reales (libro, revista, periódico o volante) identificando decisiones de orden, jerarquía e intención del diseñador
saber_ancestral_idea: |-
  Diseñar no nació con Figma. Los pasquines populares del Valle, los almanaques campesinos, los pliegos de las parroquias eran piezas de diseño con propósito: jerarquía clara, tipografía que se podía leer en la plaza, orden de la información que respondía a una necesidad concreta de la comunidad.

clave: 2-1
grado: 9
periodo: 2
sesion: 1
completo: true
duracion_min: 90
titulo: ¿Qué es diseñar? --- orden, jerarquía, intención
titulo_portada: |-
  ¿Qué es diseñar? ---
  orden, jerarquía,
  intención
producto_final: |-
  El análisis comparado de tres productos editoriales reales —un libro, una revista y un periódico o volante— con los tres pilares aplicados a cada uno. Cada análisis lleva un ejemplo concreto de la pieza, no una generalidad, y va acompañado de un esquema dibujado del recorrido de lectura. Cierra con una decisión que vas a aplicar en la revista del periodo.
apertura:
  origen: Tejedoras ingas de Santiago-Manoy · el chumbe y la jerarquía con tres colores
  fuente: |-
    Aldana Barahona, G. M. y Sánchez Carballo, A. (2021). Tejer con la mente: el chumbe inga del Alto Putumayo colombiano como artefacto cultural y mental. \emph{Estudios Atacameños, 67}, e3521. https://doi.org/10.22199/issn.0718-1043-2021-0007
  saber_ancestral: |-
    En Santiago-Manoy, en el Alto Putumayo, las tejedoras ingas hacen \textbf{chumbes}: fajas tejidas con pictogramas geométricos que ellas llaman \emph{labores}. La técnica trabaja con muy pocos colores. Uno para el fondo, otro para las labores y a veces un tercero para los bordes. Con esos tres se construye toda la jerarquía visual de la pieza. Lo que hace que una labor se vea es el contraste contra el fondo, no la cantidad de tinta. Y hay algo más exigente todavía: cada labor se planea en la mente antes de tejerse, y un punto olvidado se nota. El chumbe no es adorno: protege el vientre de la mujer. La \textbf{cara de exclusión} la dice una tejedora, Ruby Rodríguez, en el trabajo de campo de 2018: «estamos en amenaza de que tenemos que ser historia». Hay labores de chumbes antiguos cuyo significado ya nadie conoce, y muchas se pasaron a manillas y mochilas para la venta.
  saber_contemporaneo: |-
    Diseñar una pieza editorial es tomar tres decisiones, no adornar. \textbf{Orden}: qué va antes y qué después, es decir, por dónde entra el ojo y hacia dónde sigue. \textbf{Jerarquía}: qué es lo más importante y qué es secundario, lo cual se resuelve con tamaño, peso, color y espacio. \textbf{Intención}: para qué existe la pieza y qué quieres que haga quien la mire. Las tres se comprueban con una sola pregunta. Qué quiero que lea primero, qué después y qué no necesita leer. Si no puedes contestarla, no estás diseñando: estás decorando. Y hay una prueba barata que no falla. En una pieza bien diseñada, cada tamaño y cada espacio responden a una decisión. En una hecha con prisa, todo tiene el mismo peso, y cuando todo pesa igual el ojo no sabe por dónde empezar.
  pregunta_puente: |-
    La tejedora inga construye toda la jerarquía de un chumbe con tres colores y planea cada labor antes de tejer. ¿Cuántas decisiones tomas tú antes de empezar una página?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} orden, jerarquía e intención en piezas editoriales reales que tengas a mano; (2) \textbf{explicar} cómo se construye jerarquía con tamaño, peso, color y espacio; (3) \textbf{crear} un análisis comparado de tres piezas con un ejemplo concreto de cada una y una decisión para tu revista.
puentes:
  a_ruta: |-
    En el periodo 1 recorriste la historia de la técnica y cerraste con tu manifiesto. Este periodo produces una revista, y hoy empieza por lo básico: mirar cómo está hecha una página. En la sesión 2 llega la cuadrícula.
  a_escuta: |-
    Antes de la teoría vas a mirar tres piezas que ya tienes cerca. No hace falta buscar ejemplos famosos: un volante del barrio enseña tanto como una revista de diseño.
  a_sistematizacion: |-
    Ya miraste. Ahora vas a nombrar lo que viste con los tres pilares, y a comprobar cuál de los tres falla más seguido.
  a_praxis: |-
    Tienes el vocabulario. Toca escribir el análisis comparado y sacar de ahí una decisión para tu propia revista.
  a_producto: |-
    Lo que entregas hoy: tres análisis con ejemplo concreto y un esquema del recorrido de lectura. La prueba de calidad: cada ejemplo señala una parte de la pieza, no una impresión general.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Quien diseña decide por quién lee, y conviene saber que se está decidiendo.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre decidir y economizar: Dussel sobre la publicidad que produce el deseo, Epicteto sobre decir solo lo necesario, Floridi sobre un diseño que respete la atención.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tres piezas que ya tienes} (15 min · individual). (1) Busca a tu alrededor tres productos editoriales: un libro, una revista impresa o digital, y un periódico o volante. (2) Mira cada uno durante diez segundos y anota qué viste primero. (3) Anota qué viste segundo. (4) Escribe para qué crees que existe la pieza, en una frase. (5) Marca en cuál de las tres te costó más decir qué viste primero.
  checks:
  - Tengo las tres piezas y qué vi primero en cada una.
  - Escribí para qué existe cada pieza, en una frase.
  - Marqué en cuál me costó más decir qué vi primero.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Tres piezas que ya tienes». \textbf{Formato:} tabla de 3 filas y 4 columnas (pieza / qué vi primero / qué vi segundo / para qué existe). \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las tres filas dicen qué viste primero, aunque en alguna hayas dudado.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los tres pilares} (20 min · parejas). (1) Con tu pareja, escriban los tres pilares con una frase propia cada uno. (2) Tomen la pieza donde costó más decir qué se veía primero y expliquen por qué costó. (3) Listen los cuatro recursos con que se construye jerarquía y señalen cuáles usa esa pieza. (4) Escriban qué cambiarían para que el ojo entre por donde debe.
  pilares:
  - |-
    \textbf{Los tres pilares.} Orden: por dónde entra el ojo y hacia dónde sigue. Jerarquía: qué es principal y qué secundario. Intención: para qué existe la pieza y qué quiere que hagas.
  - |-
    \textbf{La jerarquía se construye con cuatro recursos.} Tamaño, peso, color y espacio. El espacio es el que menos se usa y el que más rinde: dejar vacío alrededor de algo lo destaca más que agrandarlo.
  - |-
    \textbf{Pocos colores rinden más.} La tejedora inga arma toda la jerarquía de un chumbe con dos o tres. Lo que hace visible una labor es el contraste contra el fondo, no la cantidad de color. En una página pasa igual.
  - |-
    \textbf{Decisión visible, no accidente.} En una pieza bien diseñada cada tamaño responde a una decisión. En una apresurada todo pesa igual, y cuando todo pesa igual el ojo no sabe por dónde empezar.
  anatomia:
    titulo: Los tres pilares del diseño editorial
    body: |-
      \textbf{Orden:} por dónde entra el ojo y hacia dónde sigue. \\[1mm] \textbf{Jerarquía:} tamaño, peso, color y espacio. \\[1mm] \textbf{Intención:} para qué existe y qué pide. \\[1mm] \textbf{Prueba:} ¿qué leo primero, qué después, qué no necesito leer?
  errores_comunes: |-
    (1) \textbf{Confundir diseñar con decorar}: si no puedes decir qué se lee primero, estás decorando. (2) \textbf{Todo del mismo tamaño}: sin contraste no hay jerarquía. (3) \textbf{Muchos colores}: dos o tres bien usados rinden más que ocho. (4) \textbf{Olvidar el espacio en blanco}: no es hueco desperdiciado, es lo que hace visible lo demás. (5) \textbf{Analizar en general}: «se ve ordenado» no dice nada; hay que señalar qué parte y por qué.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los tres pilares». \textbf{Formato:} los tres pilares con frase propia, los cuatro recursos de jerarquía señalados en la pieza difícil y qué cambiarían. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} el cambio propuesto señala una parte concreta de la pieza.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- El análisis comparado} (30 min · individual). (1) Toma tus tres piezas y aplícale a cada una los tres pilares. (2) Escribe en cada pilar un ejemplo concreto de esa pieza, señalando qué parte. (3) Dibuja para cada una un esquema del recorrido de lectura, con flechas de por dónde entra y sigue el ojo. (4) Escribe qué tienen en común las tres y en qué se diferencian. (5) Cierra con una decisión concreta que vas a aplicar en la revista del periodo. (6) Enséñale un esquema a un compañero y comprueba si acierta el recorrido.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} Los tres análisis con ejemplo concreto en cada pilar. Los tres esquemas del recorrido de lectura. Y la decisión para tu revista.
  - |-
    \textbf{Ejemplo concreto significa señalar.} «El titular ocupa el tercio superior y está en negrita» es un ejemplo. «Tiene buena jerarquía» no lo es, porque no se puede comprobar mirando.
  - |-
    \textbf{El esquema del recorrido revela lo que la pieza hace de verdad.} Dibujar las flechas obliga a admitir por dónde entró el ojo, que muchas veces no es por donde el diseñador quería.
  - |-
    \textbf{La decisión final es lo que se lleva.} Una sola, concreta, aplicable: «en mi revista voy a usar dos colores y dejar el margen exterior más ancho». No una lista de buenos propósitos.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tres piezas analizadas con los tres pilares. \\[1mm] \checkbox Un ejemplo concreto por pilar, que señale una parte. \\[1mm] \checkbox Tres esquemas de recorrido de lectura con flechas. \\[1mm] \checkbox Qué tienen en común y en qué se diferencian. \\[1mm] \checkbox Una decisión concreta para la revista del periodo. \\[1mm] \checkbox Un compañero acertó el recorrido de uno de tus esquemas.
  plantilla_guion: |-
    \textbf{Pieza.} \textit{Cuál es y de dónde salió.} \\[1mm] \textbf{Orden.} \textit{Por dónde entra el ojo, con ejemplo.} \\[1mm] \textbf{Jerarquía.} \textit{Qué recursos usa y dónde se ven.} \\[1mm] \textbf{Intención.} \textit{Para qué existe y qué pide.} \\[1mm] \textbf{Decisión.} \textit{Qué aplico en mi revista.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- El análisis comparado». \textbf{Formato:} los tres análisis con sus ejemplos concretos, los tres esquemas de recorrido y la decisión para la revista. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} un compañero acertó el recorrido de uno de tus esquemas.
  producto_titulo: Análisis comparado de tres piezas editoriales con esquemas de recorrido
  criterios:
  - Las tres piezas están analizadas con los tres pilares
  - Cada pilar tiene un ejemplo concreto que señala una parte de la pieza
  - Hay un esquema del recorrido de lectura por cada pieza
  - Está escrito qué tienen en común y en qué se diferencian
  - La decisión para la revista es una sola y se puede aplicar
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.3.3.2
    cita: |-
      Lo que acontece en el sistema capitalista es que existe una política de producción del deseo, que se funda en el proyecto del sistema, y que crea por la publicidad un deseo o necesidad colectiva: el mercado.
    aplicacion: |-
      Toda pieza editorial quiere algo de quien la mira, y no siempre lo dice. Preguntarle a un volante qué desea que hagas es el análisis más rápido que existe, y casi nadie lo hace.
    pregunta_espejo: |-
      La última pieza que me hizo querer algo, ¿qué quería ella de mí?
  estoico:
    autor: Epicteto · Enquiridión, 33 (c. 125 d.C.)
    cita: |-
      Guarda el silencio cuanto te fuere posible. Nunca digas sino lo que absolutamente es necesario, y en ello emplea las menos palabras que pudieres.
    aplicacion: |-
      Eso, en una página, se llama espacio en blanco. Lo que no pones es lo que hace visible lo que sí. La tejedora inga lo resuelve con dos o tres colores, y no por falta de materiales.
    pregunta_espejo: |-
      ¿Qué le quitaría a mi última página para que lo importante se viera más?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6
    cita: |-
      Las configuraciones por defecto y otros aspectos del diseño de nuestras tecnologías deberían respetar y proteger las capacidades atencionales. (trad. propia)
    aplicacion: |-
      Diseñar es repartir la atención de otra persona, que es escasa y no es tuya. Una página que grita en todas partes no la respeta; una que ordena por dónde entrar, sí.
    pregunta_espejo: |-
      ¿Mi pieza le ahorra atención a quien la mira, o se la exige toda a la vez?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el análisis y la decisión escrita. Mira además tres portadas cualesquiera y anota en cada una qué se ve primero. En la sesión 2 vas a trabajar la cuadrícula, que es la herramienta con que se construye el orden.
web:
  resumen: |-
    Las tejedoras ingas de Santiago-Manoy construyen toda la jerarquía de un chumbe con dos o tres colores, y planean cada labor antes de tejerla. Hoy entrenas el ojo en tres piezas editoriales reales y aprendes los tres pilares: orden, jerarquía e intención. Si no puedes decir qué se lee primero, no estás diseñando: estás decorando.
  subtema: Apertura · Diseño editorial digital
  pre_lectura:
    por_que_importa: |-
      Quien diseña decide por quién lee: qué se ve primero, qué después y qué no se ve. Conviene saber que se está decidiendo.
    pregunta_detonante: |-
      De la última página que miraste, ¿podrías decir qué viste primero y por qué fue eso y no otra cosa?
    activacion:
      titulo: Diez segundos
      descripcion: |-
        En 2 minutos, mira una página cualquiera durante diez segundos y cierra los ojos. Anota qué recuerdas. Eso es su jerarquía real.
      duracion_min: 3
    conexion:
      anterior: En la sesión 10 del periodo 1 escribiste y defendiste tu manifiesto del técnico crítico.
      siguiente: En la sesión 2 trabajas la cuadrícula, la herramienta con que se construye el orden.

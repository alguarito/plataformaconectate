clave: 2-10
grado: 9
periodo: 2
sesion: 10
completo: true
titulo: Cosecha P2 --- sustentación pública de la revista
titulo_portada: |-
  Cosecha P2 ---
  sustentación pública
  de la revista
producto_final: Exposición oral pública de la revista al curso (1 minuto por página, total 8 min), donde el estudiante defiende sus decisiones de diseño y recibe feedback estructurado de 3 compañeros
apertura:
  saber_ancestral: |-
    En la \textbf{tradición de los talleres editoriales} colombianos, la primera revista de un aprendiz no se publicaba sin presentarla al maestro y a los pares. El \emph{aprendiz tipógrafo} mostraba su primer pliego compuesto y soportaba críticas amigas: ``este interlineado es muy apretado'', ``este titular pesa más de lo necesario'', ``aquí hay un viudo''. \textbf{Sustentar es someter el trabajo a una mirada externa antes de que el público lo lea.} Esa práctica antigua --- defender en voz alta lo que hiciste, escuchar lo que otros ven que tú no, ajustar --- es lo que separa el trabajo de aula del trabajo profesional.
  saber_contemporaneo: |-
    Hoy sustentar tu revista digital ante el curso es lo más cercano que tendrás --- a tu edad --- al \emph{review} profesional. En 8 minutos defiendes 8 páginas: decisión por decisión, sin esconder lo débil, sin inflar lo fuerte. Después recibes feedback estructurado de 3 compañeros. \textbf{No es prueba de nervios: es entrenamiento de oficio.} Cada presentación que hagas en tu vida adulta --- proyecto en universidad, propuesta a un cliente, pitch a un inversor --- depende de habilidades que se entrenan aquí.
  pregunta_puente: |-
    Si tuvieras 8 minutos para defender ante 30 personas el trabajo más importante de tu vida hasta hoy, ¿qué dirías? ¿Cómo demostrarías que no es solo ``una tarea''?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} tu propia revista identificando 3 fortalezas y 3 debilidades; (2) \textbf{evaluar} qué decisión de diseño defenderías con más convicción y cuál cambiarías; (3) \textbf{explicar} oralmente 8 páginas en 8 minutos con orden, criterio y voz propia; (4) \textbf{crear} estructura de sustentación + entrega oral pública.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Nueve sesiones te trajeron hasta aquí. Hoy haces la cosecha pública: defiendes lo que produjiste y aceptas mirada externa. Ese ritual cierra el periodo.
  a_escuta: |-
    Antes de sustentar tu propia revista, vamos a escuchar 3 sustentaciones reales (sea de TED, de pitchs cortos, de exposiciones académicas). Verás patrones --- las buenas presentaciones comparten estructura.
  a_sistematizacion: |-
    Ya viste presentaciones reales. Ahora vamos a entender los \textbf{4 elementos} de una sustentación efectiva: contexto (qué hiciste), proceso (cómo decidiste), defensa (por qué eso y no otra cosa), reconocimiento (qué cambiarías). Sin alguno, la sustentación queda débil.
  a_praxis: |-
    Tienes el método. Toca producir: estructura de sustentación + entrega oral pública de 8 minutos ante el curso. No es nota --- es ritual de cierre del periodo.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: estructura escrita + sustentación oral defendida. El criterio principal: que defiendas tu revista en voz alta sin titubear y reconozcas con honestidad lo que cambiarías.
  a_evaluacion: |-
    Antes de cerrar, mira el acto de sustentar desde las cinco dimensiones humanas. Defender en voz alta lo que hiciste es ciudadanía digital, soberanía personal, herencia de oficio. Vale la pena nombrar las tres.
  a_triangulo: |-
    Y para terminar, tres voces sobre sustentar. Dussel sobre tomar la palabra pública, Marco Aurelio sobre la coherencia entre lo que dices y lo que hiciste, Floridi sobre la publicación como acto reputacional.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 3 sustentaciones reales} (15 min · individual). Busca \textbf{3 presentaciones} reales de máximo 10 minutos: (a) una \emph{charla TED corta} (puedes filtrar por duración), (b) un \emph{pitch de proyecto} de algún concurso o startup (busca ``pitch 5 min'' o ``pitch competition''), (c) una \emph{sustentación académica} (defensa de tesis o proyecto de aula). Para cada una: ¿cómo empieza?, ¿cómo desarrolla?, ¿cómo cierra?
  checks:
  - Vi 3 presentaciones reales de máximo 10 minutos cada una.
  - Identifiqué cómo empieza, desarrolla y cierra cada presentación.
  - Reconocí qué hace fuerte a las buenas (estructura clara, voz propia, ejemplos concretos).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 sustentaciones reales». \textbf{Formato:} tabla de 4 columnas (Presentación~|~Inicio~|~Desarrollo~|~Cierre), 3 filas. Al final 1 párrafo de 3 renglones sobre el patrón común de las buenas presentaciones. \textbf{Sabes que terminaste cuando} reconoces patrones que vas a aplicar a tu propia sustentación.
sistematizacion:
  intro: |-
    Toda sustentación efectiva tiene 4 elementos. Vamos a descomponerlos con los pilares del pensamiento computacional para que tu defensa de 8 minutos sea sólida.
  pilares:
  - |-
    La sustentación se descompone en 4 elementos: (1) \textbf{contexto} (qué hiciste --- 1 min: tema de la revista + 8 páginas + URL), (2) \textbf{proceso} (cómo decidiste --- 2-3 min: grilla elegida, tipografía, paleta, ¿por qué?), (3) \textbf{defensa} (página por página --- 3-4 min: decisión más fuerte de cada una), (4) \textbf{reconocimiento} (qué cambiarías --- 1 min: honestidad sobre debilidades).
  - |-
    Toda sustentación fuerte sigue el patrón \textbf{``honestidad + orden''}: si sostienes una decisión con seguridad pero también reconoces lo que cambiarías, el jurado/audiencia confía más. Si solo defiendes sin matiz, suena arrogante. Si solo reconoces sin defender, suena inseguro. Las dos cosas juntas son madurez profesional.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿puedo defender cada decisión visual con un argumento que un compañero entendería en 30 segundos?}. Si la respuesta es no, hay que ensayar.
  - |-
    Pasos para preparar la sustentación: (1) ensaya en voz alta sola/o 2 veces midiendo el tiempo; (2) anota los puntos clave por página en una tarjeta (no leer la hoja); (3) prepara la URL en un dispositivo listo; (4) presenta sin esconder lo débil ni inflar lo fuerte.
  anatomia:
    titulo: Anatomía de una sustentación de 8 minutos
    body: |-
      \textbf{Minuto 1 · Contexto:} tema + público objetivo + URL. \\[1mm] \textbf{Minutos 2-3 · Proceso:} grilla, tipografía, paleta elegidos y por qué. \\[1mm] \textbf{Minutos 4-7 · Defensa:} pasa página por página, 30 segundos cada una, defendiendo decisión más fuerte. \\[1mm] \textbf{Minuto 8 · Reconocimiento:} qué cambiarías en una versión 2.0 y qué te llevas para el siguiente periodo.
  errores_comunes: |-
    (1) Leer la hoja en lugar de exponer: pierde conexión con la audiencia. (2) Justificar todo sin reconocer debilidades: suena defensivo. (3) Solo enumerar lo que hizo sin explicar por qué: pierde la oportunidad de demostrar criterio. (4) Hablar más de 8 minutos: la disciplina del tiempo importa. (5) No ensayar: se nota inmediatamente.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} Título: «Actividad 2 --- Estructura de mi sustentación». \textbf{Formato:} 4 fichas, una por elemento (contexto, proceso, defensa, reconocimiento), cada una con: minutos asignados + 3-5 puntos clave que vas a decir. \textbf{Sabes que terminaste cuando} podrías hablar 8 min en voz alta sin notas adicionales --- esto es ensayo, no improvisación.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Sustentación oral pública de tu revista} (45 min · individual + grupal). Hora de defender. Vas a presentar tu revista de 8 páginas al curso durante 8 minutos. Antes, vas a tener 10 minutos de preparación final. Después, vas a recibir feedback estructurado de 3 compañeros.
  pilares:
  - |-
    Tu presentación se descompone en 3 fases: (1) preparación final (10 min antes de exponer): repaso de la tarjeta de puntos clave, prueba de la URL, ensayo mental rápido; (2) entrega oral (8 min frente al curso): sigue la estructura 1-2-3-4 (contexto/proceso/defensa/reconocimiento); (3) feedback (5 min): escuchas 3 observaciones de compañeros sin defenderte.
  - |-
    Sigue el patrón \textbf{``segura sin arrogancia''}: defiende cada decisión, pero reconoce honestamente lo que cambiarías. La gente confía en quien dice ``esto lo haría mejor en v2'' tanto como en quien dice ``estoy orgulloso de esto y aquí está por qué''.
  - |-
    Cada minuto expresa una sola idea. No condenses contexto + proceso + defensa en 3 minutos --- pierde estructura. Respeta los tiempos.
  - |-
    Algoritmo de la presentación: (1) preséntate y di el tema en 30 segundos; (2) muestra URL pública; (3) explica decisiones de sistema visual en 2-3 minutos; (4) recorre las 8 páginas en 4 minutos defendiendo decisión más fuerte de cada una; (5) cierra con 1 minuto de qué cambiarías y qué te llevas. Al terminar, escucha 3 observaciones de compañeros sin interrumpir.
  checklist:
    titulo: Checklist antes de declarar la sustentación hecha
    items: |-
      \checkbox Estructura escrita en cuaderno (4 elementos con minutos asignados). \\[1mm] \checkbox Ensayé al menos 2 veces en voz alta midiendo el tiempo. \\[1mm] \checkbox URL pública de la revista lista y verificada. \\[1mm] \checkbox Defendí oralmente la revista durante 7-8 minutos. \\[1mm] \checkbox Reconocí al menos 1 debilidad honestamente. \\[1mm] \checkbox Escuché 3 observaciones de compañeros sin defenderme.
  plantilla_guion: |-
    \textbf{Estructura de mi sustentación.} \textit{Las 4 partes con minutos asignados.} \\[1mm] \textbf{Tarjeta de puntos clave.} \textit{Lista breve por minuto, no para leer literal.} \\[1mm] \textbf{Feedback recibido.} \textit{Las 3 observaciones literales de compañeros.} \\[1mm] \textbf{Reflexión final.} \textit{Qué cambia mi visión del trabajo después de la sustentación.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi sustentación pública». \textbf{Formato:} (1) estructura de 4 elementos con minutos, (2) tarjeta de puntos clave usada, (3) feedback literal de 3 compañeros, (4) reflexión final de 3 renglones. \textbf{Extensión:} 2 páginas de cuaderno. \textbf{Sabes que terminaste cuando} defendiste oralmente y escuchaste feedback sin defenderte.
  producto_titulo: Sustentación oral pública de la revista (8 min) + feedback estructurado recibido
  criterios:
  - Estructura escrita previa (4 elementos con minutos)
  - Ensayo previo de al menos 2 veces en voz alta
  - Sustentación oral de 7-8 minutos (no menos, no más)
  - Defensa de decisiones con argumentos + reconocimiento honesto de debilidad
  - Feedback literal de 3 compañeros transcrito
  - Reflexión final sobre lo aprendido del proceso
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Tomar la palabra pública es el primer acto de ciudadanía intelectual --- y se entrena en cada presentación, no se hereda.
    aplicacion: |-
      Sustentar en público una pieza propia ante 30 personas es un acto político: te haces visible, asumes responsabilidad, soportas mirada. En Colombia, muchas personas pasan toda su vida escolar sin ese entrenamiento y luego no pueden defender sus ideas en el trabajo. Sustentar aquí, con apoyo del docente y los pares, es lo más cercano al gimnasio de la ciudadanía intelectual.
    pregunta_espejo: |-
      ¿Estoy acostumbrado a defender mis ideas en voz alta ante un grupo o tiendo a esconderme? ¿Qué significa esto para mi futuro adulto?
  estoico:
    autor: Marco Aurelio
    cita: |-
      No es lo que dices al exponer; es la coherencia entre tu obra y tu palabra lo que se queda.
    aplicacion: |-
      Puedes presentar una revista mediocre con palabras hermosas o una revista buena con palabras simples. La sabiduría estoica del sustentante: tus palabras solo amplifican lo que hizo tu obra. Si la obra está bien hecha, la sustentación la celebra. Si no, ninguna palabra la salva. Por eso \emph{el oficio precede a la palabra}.
    pregunta_espejo: |-
      ¿Mi revista está a la altura de lo que voy a decir de ella? Si no, ¿qué prefiero corregir: la obra o el discurso?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Cada sustentación pública es un acto reputacional permanente en la infoesfera de tu vida.
    aplicacion: |-
      Las personas que te escuchen hoy --- compañeros, profesores --- son la primera audiencia. Aprenden a leerte, a confiar o desconfiar de ti. Cada presentación construye reputación, lentamente, durante años. Sustentar bien hoy es inversión a largo plazo de tu identidad pública. No te la juegas por una nota --- te la juegas por quien eres ante los demás.
    pregunta_espejo: |-
      ¿Qué versión de mí va a ver mi audiencia hoy? ¿Esa versión es la que quiero proyectar en mi vida adulta?
compromiso: |-
  \textbf{Para el próximo periodo.} Pega o copia tu sustentación (estructura + feedback recibido) en la primera página de tu cuaderno del Periodo 3. Cada mes vuelve a leerla y anota: ¿estoy aplicando lo que me señalaron como debilidad? Esa práctica de \emph{volver al feedback} es lo que convierte una crítica en aprendizaje. \emph{Felicitaciones por cerrar el Periodo 2 con voz pública.}

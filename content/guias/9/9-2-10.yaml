      Toda presentación de tu vida adulta se apoya en habilidades que se entrenan hoy. No es una prueba de nervios: es el gimnasio del oficio.
    pregunta_detonante: |-
      ¿Estoy acostumbrado a defender mis ideas en voz alta ante un grupo, o tiendo a esconderme?

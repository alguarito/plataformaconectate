  conceptos_clave:
  - categoria: Los cuatro elementos
    termino: Contexto
    definicion: |-
      El primer minuto: qué hiciste, para quién y dónde se puede ver. Sin él, nadie sabe qué está mirando.
    ejemplo: |-
      «Es una revista de ocho páginas sobre música del Pacífico, y esta es la URL.»
  - categoria: Los cuatro elementos
    termino: Proceso
    definicion: |-
      Cómo decidiste el sistema visual. No lo que hiciste, sino por qué elegiste eso y no otra cosa.
    ejemplo: |-
      «Elegí una grilla de dos columnas porque los textos son largos y a tres columnas se partían.»
  - categoria: Los cuatro elementos
    termino: Defensa
    definicion: |-
      El recorrido página por página con la decisión más fuerte de cada una, en medio minuto cada vez.
    ejemplo: |-
      «En la página 5 saqué la foto grande porque competía con el titular y ninguna de las dos se leía.»
  - categoria: Los cuatro elementos
    termino: Reconocimiento
    definicion: |-
      El cierre honesto: qué cambiarías en una segunda versión. Es lo que separa defender de justificar.
    ejemplo: |-
      «La contraportada la resolví con lo que quedaba de tiempo y se nota; la rehacía primero.»
  - categoria: Recibir la mirada externa
    termino: Escuchar sin defenderse
    definicion: |-
      Anotar la observación tal como se dijo, sin explicar por qué tomaste esa decisión. La explicación puede esperar.
    ejemplo: |-
      Si alguien dice que el titular pesa demasiado, se escribe eso, no tu razón para haberlo puesto así.
  - categoria: Recibir la mirada externa
    termino: Pauta de criterios
    definicion: |-
      La lista escrita con la que el curso observa. Existe para que el juicio caiga sobre el trabajo y no sobre la persona.
    ejemplo: |-
      «El eje de la crítica es la coherencia del sistema visual», no «no me gustó su presentación».
  cinco_dimensiones:
    personal: |-
      Defendiste en voz alta tu primer producto editorial real. Eso entrena algo que no se aprende leyendo.
    emocional: |-
      Sostuviste la mirada externa sin defenderte. Es humildad madura, que no es lo mismo que humildad sumisa.
    ciudadana: |-
      Practicaste palabra pública con criterio. Es una capacidad que la vida en común necesita y que muchos nunca cultivan.
    local: |-
      En el cuadradero la fama circula de boca en boca y ahí no hay pauta ni recurso. En el aula sí, y esa diferencia es deliberada.
    intergeneracional: |-
      Que la palabra valga porque hay memoria es un acuerdo antiguo. Lo que cambia entre generaciones es qué protege a quien queda mal parado.
  post_lectura:
    transferencia: |-
      Copia tu estructura y el feedback recibido en la primera página del cuaderno del periodo 3. Cada mes vuelve a leerlos y anota si estás aplicando lo que te señalaron.
  quiz:
    titulo: Verifica la sustentación
    instrucciones: 5 preguntas para confirmar que puedes defender tu trabajo y recibir una mirada externa. Necesitas 3/5 para continuar.
    preguntas:
    - enunciado: ¿Cuáles son los cuatro elementos de una sustentación efectiva?
      opciones:
      - Saludo inicial, descripción del trabajo, agradecimiento final y turno de preguntas
      - Contexto, proceso, defensa de las decisiones y reconocimiento de lo que cambiarías
      - Introducción, desarrollo del tema, conclusión general y bibliografía consultada
      - Presentación personal, muestra de la pantalla, resumen breve y despedida cordial
      respuesta_index: 1
      feedback_correcto: |-
        Correcto. Los cuatro se necesitan: sin proceso no hay criterio, y sin reconocimiento no hay honestidad.
      feedback_incorrecto: |-
        No es la estructura escolar de siempre. Lo que distingue una sustentación es el proceso y el reconocimiento.
    - enunciado: ¿Por qué reconocer una debilidad fortalece la sustentación en vez de debilitarla?
      opciones:
      - Porque el docente valora la modestia y suele subir la nota a quien se muestra humilde
      - Porque adelantarse a la crítica impide que los compañeros la mencionen después
      - Porque una presentación demasiado segura suele quedarse sin tiempo para el cierre
      - Porque quien escucha confía más en alguien que sostiene y a la vez reconoce
      respuesta_index: 3
      feedback_correcto: |-
        Exacto. Defender sin matiz suena arrogante; reconocer sin defender suena inseguro. Las dos juntas son madurez.
      feedback_incorrecto: |-
        No se trata de la nota ni de blindarse. Se trata de que sostener y reconocer a la vez es lo que genera confianza.
    - enunciado: Un compañero te da una observación sobre tu revista. ¿Qué haces?
      opciones:
      - Explicas por qué tomaste esa decisión, para que entienda que tenías una razón
      - Discutes la observación si te parece que no entendió lo que estabas buscando
      - La anotas literalmente y agradeces, sin explicar todavía tu razón
      - La escuchas y decides en el momento si vale la pena anotarla o no
      respuesta_index: 2
      feedback_correcto: |-
        Correcto. La explicación puede esperar. Si respondes de inmediato, dejas de escuchar lo que sigue.
      feedback_incorrecto: |-
        Defenderte en ese momento cierra la escucha. Primero se anota; la razón se puede revisar después.
    - enunciado: ¿Para qué sirve la pauta escrita de criterios con la que el curso observa?
      opciones:
      - Para que el juicio recaiga sobre el trabajo y no sobre la persona que expone
      - Para que el docente pueda calificar más rápido las presentaciones de todo el curso
      - Para que todas las revistas terminen pareciéndose entre sí y sean comparables
      - Para que quien expone sepa de antemano qué le van a preguntar al terminar
      respuesta_index: 0
      feedback_correcto: |-
        Sí. Sin pauta, la observación se vuelve opinión sobre la persona. Con pauta, cae sobre la grilla o el titular.
      feedback_incorrecto: |-
        No es velocidad ni uniformidad. La pauta protege a quien está de pie al frente.
    - enunciado: En el cuadradero, la fama de un patrón circula de boca en boca. ¿Qué diferencia hay con tu sustentación de hoy?
      opciones:
      - Que en el cuadradero la memoria del grupo es más justa porque todos se conocen entre sí
      - Que en el aula hay pauta escrita y recurso, y en el cuadradero la sanción es la vergüenza
      - Que en el cuadradero no existe ninguna forma de evaluar el trabajo que hace cada persona
      - Que en el aula la opinión de los compañeros no tiene ninguna consecuencia real para nadie
      respuesta_index: 1
      feedback_correcto: |-
        Correcto. Sin contrato escrito no hay prestaciones ni a quién recurrir, y la sanción es pública. La pauta del aula existe para que aquí no funcione así.
      feedback_incorrecto: |-
        La memoria del grupo funciona en los dos lados. La diferencia es que aquí hay criterios escritos y allá la sanción es la vergüenza.

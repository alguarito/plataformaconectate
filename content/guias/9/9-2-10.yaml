clave: 2-10
grado: 9
periodo: 2
sesion: 10
completo: true
duracion_min: 90
titulo: Cosecha P2 --- sustentación pública de la revista
titulo_portada: |-
  Cosecha P2 ---
  sustentación pública
  de la revista
producto_final: Sustentación oral de la revista ante el curso (8 min) y el registro literal del feedback de 3 compañeros
apertura:
  saber_ancestral: |-
    En los cafetales del Quindío y Risaralda, los recolectores campesinos se contratan en el cuadradero. De palabra y por una semana (Saldarriaga Ramírez, 2024). Antes de aceptar, preguntan por la fama del patrón. La palabra vale porque hay memoria: el grupo se cuenta cómo le fue en cada finca. Y la memoria también castiga. Cuando alguien falla, no lo demandan: lo avergüenzan delante de todos. La \textbf{cara de exclusión} está justo ahí. Que no haya contrato escrito significa que tampoco hay seguridad social, ni prestaciones, ni a quién recurrir ante un abuso. Por eso una sustentación de aula no puede funcionar así. Aquí la mirada del grupo también pesa. Pero existe una pauta escrita de criterios, y esa pauta está para que el juicio recaiga sobre el trabajo y no sobre la persona.
  origen: Andariegos del Eje Cafetero · el acuerdo verbal en el cuadradero y la fama que circula
  fuente: |-
    Saldarriaga Ramírez, C. (2024). Andariegos: prácticas culturales de los recolectores itinerantes de café del municipio de Pereira, Colombia. \emph{Apuntes: Revista de Estudios sobre Patrimonio Cultural, 37}. https://doi.org/10.11144/Javeriana.apu37.apcr
  saber_contemporaneo: |-
    Sustentar tu revista ante el curso es lo más cercano que vas a tener, a tu edad, a una revisión profesional. En ocho minutos defiendes ocho páginas. Decisión por decisión, sin esconder lo débil ni inflar lo fuerte. Después recibes tres observaciones de compañeros, y las anotas sin discutirlas. No es una prueba de nervios: es entrenamiento de oficio. Toda presentación de tu vida adulta se apoya en lo que se practica aquí.
  pregunta_puente: |-
    ¿Por qué en el cuadradero la fama de alguien pesa más que cualquier papel? ¿Y qué hace falta para que la mirada del curso sobre tu revista sea un juicio sobre el trabajo y no sobre ti?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué estructura comparten las presentaciones que funcionan; (2) \textbf{explicar} los cuatro elementos de una sustentación y repartirlos en el tiempo que tienes; (3) \textbf{crear} y entregar una sustentación oral de ocho minutos, y recibir el feedback sin defenderte.
puentes:
  a_ruta: |-
    Nueve sesiones te trajeron hasta aquí. Hoy haces la cosecha pública: defiendes lo que produjiste y aceptas una mirada externa. Ese es el gesto que cierra el periodo.
  a_escuta: |-
    Antes de sustentar lo tuyo, vas a escuchar tres presentaciones reales. Vas a ver que las buenas comparten estructura, y que esa estructura se puede copiar.
  a_sistematizacion: |-
    Ya viste presentaciones reales. Ahora vas a entender los \textbf{cuatro elementos} de una sustentación: contexto, proceso, defensa y reconocimiento. Si falta alguno, la sustentación queda coja.
  a_praxis: |-
    Tienes el método. Toca entregarlo. Ocho minutos ante el curso y tres observaciones que vas a anotar sin discutir.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: la estructura escrita y la sustentación defendida en voz alta. El criterio principal es que defiendas tus decisiones y reconozcas con honestidad lo que cambiarías.
  a_evaluacion: |-
    Antes de cerrar, mira el acto de sustentar desde las cinco dimensiones humanas. Defender en voz alta lo que hiciste es oficio, es ciudadanía y es herencia.
  a_triangulo: |-
    Y para terminar, tres voces sobre sustentar y escuchar. Dussel sobre saber oír, Marco Aurelio sobre hablar sin hipocresía, Floridi sobre la contención que exige una esfera pública.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tres sustentaciones reales} (15 min · individual). (1) Busca tres presentaciones de máximo diez minutos: una charla breve, un \emph{pitch} de proyecto y una sustentación académica. (2) Para cada una anota cómo empieza. (3) Anota cómo desarrolla el cuerpo. (4) Anota cómo cierra. (5) Escribe en tres renglones el patrón que comparten las tres.
  checks:
  - |-
    Vi tres presentaciones reales de máximo diez minutos cada una.
  - |-
    Anoté cómo empieza, cómo desarrolla y cómo cierra cada una.
  - |-
    Escribí el patrón común que voy a aplicar a mi propia sustentación.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Tres sustentaciones reales». \textbf{Formato:} tabla de tres filas y cuatro columnas (presentación / inicio / desarrollo / cierre), más tres renglones con el patrón común. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} el patrón que escribiste se puede aplicar a tu revista sin cambiarle nada.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- La estructura de mi sustentación} (20 min · parejas). (1) Con tu pareja, escriban los cuatro elementos de una sustentación con los minutos que lleva cada uno. (2) Cada uno arma sus cuatro fichas con los puntos que va a decir. (3) Intercambien las fichas y marquen dónde falta un argumento y sobra una descripción. (4) Escriban cada uno la debilidad que van a reconocer en voz alta.
  pilares:
  - |-
    La sustentación se descompone en cuatro elementos. El \textbf{contexto} dice qué hiciste: tema, ocho páginas y URL. El \textbf{proceso} dice cómo decidiste: grilla, tipografía y paleta, con su razón. La \textbf{defensa} recorre página por página con la decisión más fuerte de cada una. El \textbf{reconocimiento} dice qué cambiarías.
  - |-
    Toda sustentación fuerte sigue el patrón «honestidad y orden». Si sostienes una decisión con seguridad y además reconoces lo que cambiarías, quien escucha confía más. Defender sin ningún matiz suena arrogante. Reconocer sin defender nada suena inseguro. Las dos cosas juntas son madurez.
  - |-
    Todo se juega en una pregunta: ¿puedo defender cada decisión visual con un argumento que un compañero entienda en treinta segundos? Si la respuesta es no, falta ensayo, no falta talento.
  - |-
    Pasos para preparar la sustentación: (1) ensaya en voz alta dos veces midiendo el tiempo; (2) pasa los puntos clave a una tarjeta, que no es para leer literal; (3) deja la URL abierta y probada en el equipo; (4) presenta sin esconder lo débil ni inflar lo fuerte.
  anatomia:
    titulo: Anatomía de una sustentación de 8 minutos
    body: |-
      \textbf{Minuto 1 · Contexto:} tema, público al que apunta la revista y URL. \\[1mm] \textbf{Minutos 2--3 · Proceso:} grilla, tipografía y paleta, con la razón de cada elección. \\[1mm] \textbf{Minutos 4--7 · Defensa:} página por página, medio minuto cada una, con la decisión más fuerte. \\[1mm] \textbf{Minuto 8 · Reconocimiento:} qué cambiarías en una segunda versión y qué te llevas del proceso.
  errores_comunes: |-
    (1) Leer la hoja en vez de exponer, con lo que se pierde el contacto con quien escucha. (2) Justificarlo todo sin reconocer ninguna debilidad, lo que suena defensivo. (3) Enumerar lo que se hizo sin decir por qué, que desperdicia la ocasión de mostrar criterio. (4) Pasarse del tiempo, porque la disciplina del tiempo también es parte del oficio. (5) No ensayar, cosa que se nota en el primer minuto.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Estructura de mi sustentación». \textbf{Formato:} cuatro fichas, una por elemento, cada una con los minutos asignados y los puntos que vas a decir, más la debilidad que vas a reconocer. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} podrías hablar ocho minutos apoyándote solo en esas cuatro fichas.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Sustentación pública de tu revista} (45 min · individual). (1) Repasa la tarjeta de puntos clave y prueba la URL en el equipo. (2) Presenta ocho minutos ante el curso siguiendo contexto, proceso, defensa y reconocimiento. (3) Muestra la revista en pantalla mientras hablas, no solo la describas. (4) Al terminar, escucha tres observaciones de compañeros sin interrumpir. (5) Anota las tres literalmente, con las palabras de quien las dijo. (6) Escribe tres renglones sobre qué harías distinto.
  pilares:
  - |-
    Tu presentación se descompone en tres fases: la preparación final, la entrega oral de ocho minutos siguiendo los cuatro elementos, y el feedback, donde escuchas tres observaciones sin defenderte.
  - |-
    Sigue el patrón «segura sin arrogancia». Defiende cada decisión y reconoce lo que cambiarías. Quien escucha confía igual en un «esto lo haría mejor en la siguiente versión» que en un «estoy orgulloso de esto, y esta es la razón».
  - |-
    Cada minuto expresa una sola idea. No condenses contexto, proceso y defensa en tres minutos para tener tiempo de sobra: el que sobra al final no vale lo que costó atropellar el principio.
  - |-
    Algoritmo de la entrega: (1) preséntate y di el tema en medio minuto; (2) abre la URL en pantalla; (3) explica las decisiones del sistema visual; (4) recorre las ocho páginas con la decisión más fuerte de cada una; (5) cierra con lo que cambiarías; (6) escucha las tres observaciones sin interrumpir.
  checklist:
    titulo: Checklist antes y después de sustentar
    items: |-
      \checkbox Las cuatro fichas escritas con sus minutos asignados. \\[1mm] \checkbox Ensayo en voz alta al menos dos veces, con reloj. \\[1mm] \checkbox URL abierta y probada en el equipo donde vas a presentar. \\[1mm] \checkbox Sustentación entregada dentro del tiempo. \\[1mm] \checkbox Al menos una debilidad reconocida en voz alta. \\[1mm] \checkbox Tres observaciones anotadas literalmente, sin corregirlas.
  plantilla_guion: |-
    \textbf{Estructura.} \textit{Los cuatro elementos con sus minutos.} \\[1mm] \textbf{Tarjeta de puntos clave.} \textit{Lista breve por tramo, no un texto para leer.} \\[1mm] \textbf{Feedback recibido.} \textit{Las tres observaciones, literales.} \\[1mm] \textbf{Qué haría distinto.} \textit{Tres renglones.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Mi sustentación pública». \textbf{Formato:} la estructura de cuatro elementos con minutos, la tarjeta que usaste, las tres observaciones literales y tres renglones de cierre. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} las tres observaciones están anotadas tal como las dijeron, sin tu respuesta al lado.
  producto_titulo: Sustentación oral de la revista (8 min) con feedback de 3 compañeros transcrito
  criterios:
  - Estructura escrita previa con los cuatro elementos y sus minutos
  - Ensayo en voz alta al menos dos veces antes de exponer
  - Sustentación entregada dentro del tiempo acordado
  - Decisiones defendidas con argumento y al menos una debilidad reconocida
  - Tres observaciones de compañeros transcritas literalmente
  - Tres renglones sobre qué harías distinto en una segunda versión
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §3.3.9.4
    cita: |-
      El êthos de la liberación pedagógica exige al maestro saber oír en el silencio con respecto a la juventud, al pueblo.
    aplicacion: |-
      Hoy el silencio cambia de lado. El curso calla ocho minutos para que hables, y después callas tú para escuchar tres observaciones. Ninguna de las dos cosas es natural. Saber oír sin preparar la respuesta mientras el otro habla es lo más difícil de esta sesión.
    pregunta_espejo: |-
      Mientras me daban el feedback, ¿estaba escuchando o estaba armando mi defensa?
  estoico:
    autor: Marco Aurelio · Meditaciones VIII, 5 (c. 175 d.C.)
    cita: |-
      Con los ojos fijos en tu tarea, mírala y, recordando que es tu deber ser bueno, hazla sin desviarte; y habla como te parezca más justo, con buena disposición, con modestia y sin hipocresía. (trad. propia)
    aplicacion: |-
      Sin hipocresía corta para los dos lados. No infles lo que sabes que quedó flojo, y tampoco te rebajes por adelantado para que nadie te critique. Decir qué decidiste y por qué, en tus palabras, es más convincente que cualquier fórmula ensayada.
    pregunta_espejo: |-
      ¿Dije algo en la sustentación que en realidad no creo, solo porque sonaba mejor?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.3
    cita: |-
      En una esfera pública plural, los demás no pueden reducirse a instrumentos, y hacen falta contención y respeto. (trad. propia, abreviada)
    aplicacion: |-
      Vale también para quien da el feedback. Un compañero que expone no es material para lucirse encima. La pauta de criterios existe justo para eso: hace que la observación caiga sobre la grilla o el titular, y no sobre la persona que está de pie al frente.
    pregunta_espejo: |-
      De las observaciones que di hoy, ¿alguna era más sobre mí que sobre el trabajo del otro?
compromiso: |-
  \textbf{Para el próximo periodo.} Copia tu estructura y el feedback recibido en la primera página del cuaderno del periodo 3. Cada mes vuelve a leerlos y anota si estás aplicando lo que te señalaron. Volver al feedback es lo que convierte una crítica en aprendizaje.

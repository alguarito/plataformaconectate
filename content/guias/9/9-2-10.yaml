titulo: Cosecha P2 --- sustentación pública de la revista
producto_final: |-
  Exposición oral pública de la revista al curso (1 minuto por página, total 8 min), donde el estudiante defiende sus decisiones de diseño y recibe feedback estructurado de 3 compañeros
saber_ancestral_idea: |-
  En la tradición de los talleres editoriales, la primera revista de un aprendiz no se publicaba sin presentarla al maestro y a los pares. Sustentar es someter el trabajo a una mirada externa antes de que el público lo lea. Esa práctica antigua es lo que separa el trabajo de aula del trabajo profesional.
verbos_actividades:
- EVALÚA
- EXPLICA
- ANALIZA
- CREA

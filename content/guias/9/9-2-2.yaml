clave: 2-2
grado: 9
periodo: 2
sesion: 2
completo: true
duracion_min: 90
titulo: La página y la cuadrícula --- primer principio del orden
titulo_portada: |-
  La página
  y la cuadrícula ---
  el orden invisible
producto_final: |-
  Tres cuadrículas dibujadas a mano en hojas A4, cada una con su propósito declarado y su tipo identificado: modular, columnar o jerárquica. Cada una lleva los bloques de contenido ubicados y rotulados, y márgenes consistentes que se vean. Las tres tienen que ser distintas de verdad, no variaciones de la misma.
apertura:
  origen: Caladoras de Ansermanuevo · el deshilado, donde el vacío dibuja
  fuente: |-
    Soy Valle. (s.\,f.). \emph{Ruta del bordado y el calado: Ansermanuevo, Cartago}. Consultado en 2026.
  saber_ancestral: |-
    En el Norte del Valle hay un oficio hermano del bordado que trabaja quitando en vez de poniendo: el \textbf{calado}. Ansermanuevo se llama a sí misma cuna del calado y el bordado. La técnica base es el \textbf{deshilado}. Se retiran hilos de la trama o de la urdimbre y se reagrupan los que quedan con puntadas, hasta que el vacío mismo dibuja. Hay dos cosas ahí que sirven para hoy. La primera: el vacío no es lo que sobra, es parte del dibujo. La segunda: la vainica se trabaja por el revés de la tela. Lo que se ve por delante depende por completo de lo que se hizo por detrás. Una cuadrícula es exactamente eso. La \textbf{cara de exclusión}: es un oficio precario, y el reconocimiento patrimonial en curso no equivale a un ingreso digno para las artesanas.
  saber_contemporaneo: |-
    Una cuadrícula editorial es la estructura invisible que decide dónde puede ir cada cosa. Hay tres tipos y cada uno sirve a un propósito distinto. \textbf{Modular}: cajas iguales, buena para galerías, catálogos y tableros. \textbf{Columnar}: columnas verticales, buena para texto largo y para lectura seguida. \textbf{Jerárquica}: zonas de tamaños distintos, buena cuando una pieza manda sobre las demás. Se eligen por el propósito de la página, no por gusto. Y hay una regla que suena rara la primera vez: una cuadrícula está bien cuando no se nota. Si el lector percibe la retícula antes que el contenido, algo falló. Lo que sí se nota es el efecto: los márgenes constantes, las alineaciones que coinciden y el aire que deja respirar al texto. El vacío entre bloques no es papel desperdiciado. Es lo que hace legible todo lo demás.
  pregunta_puente: |-
    En el calado, el vacío dibuja y el trabajo se hace por el revés. En tu página, ¿qué hay detrás de lo que se ve, y quién lo puso ahí?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué cuadrícula sostiene piezas reales que tengas cerca; (2) \textbf{explicar} los tres tipos y qué propósito sirve cada uno; (3) \textbf{aplicar} lo aprendido dibujando tres cuadrículas distintas con su propósito declarado y sus bloques ubicados.
puentes:
  a_ruta: |-
    En la sesión 1 aprendiste que diseñar es decidir el orden, la jerarquía y la intención. Hoy construyes la herramienta con que se hace el orden. En la sesión 3 eliges la tipografía que va a vivir dentro de esta estructura.
  a_escuta: |-
    Antes de la teoría vas a buscarle la cuadrícula a piezas que ya existen. Está siempre, aunque no se vea; de eso se trata.
  a_sistematizacion: |-
    Ya la encontraste. Ahora vas a distinguir los tres tipos y a saber cuál pide cada propósito.
  a_praxis: |-
    Tienes el criterio. Toca dibujar tres cuadrículas a mano y comprobar que sirvan para lo que dicen servir.
  a_producto: |-
    Lo que entregas hoy: tres cuadrículas con propósito y bloques ubicados. La prueba de calidad: un compañero adivina para qué sirve cada una sin leer el rótulo.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. El trabajo que sostiene una página no se ve, y por eso casi nunca se le reconoce a quien lo hizo.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre lo que sostiene por debajo: Dussel sobre el trabajo detrás de los objetos, Marco Aurelio sobre hacer lo que se tiene entre manos, Floridi sobre necesitar a la vez resguardo y exposición.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Cuadrículas reales} (15 min · individual). (1) Busca tres piezas con estructura visible. Un plano de una ciudad con trazado en damero, una página de revista y un tablero o formulario digital. (2) Dibuja encima de cada una, a lápiz o mentalmente, las líneas que separan sus zonas. (3) Cuenta cuántas columnas o módulos tiene cada una. (4) Mide con el dedo si los márgenes se repiten. (5) Marca en cuál la estructura se nota demasiado.
  checks:
  - Tengo las tres piezas con sus líneas trazadas.
  - Conté columnas o módulos en cada una.
  - Marqué en cuál la estructura se nota demasiado.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Cuadrículas reales». \textbf{Formato:} tres bocetos pequeños con las líneas trazadas, cada uno con su número de columnas o módulos y una nota sobre sus márgenes. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} puedes decir en cuál la estructura se nota más de la cuenta.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los tres tipos} (20 min · parejas). (1) Con tu pareja, escriban los tres tipos con una frase propia cada uno. (2) Asignen a cada una de sus seis piezas el tipo que le corresponde. (3) Para cada tipo, escriban un propósito al que sirva bien y otro al que sirva mal. (4) Discutan una pieza donde el tipo elegido no parezca el adecuado y digan cuál usarían.
  pilares:
  - |-
    \textbf{Los tres tipos.} Modular: cajas iguales, para galerías y catálogos. Columnar: columnas verticales, para texto largo. Jerárquica: zonas de tamaños distintos, cuando una pieza manda sobre las demás.
  - |-
    \textbf{El propósito manda sobre el gusto.} Una cuadrícula modular en un texto largo obliga a saltar la vista cada pocas líneas. Una columnar en una galería de fotos desperdicia el espacio. No es cuestión de cuál se ve mejor.
  - |-
    \textbf{Está bien cuando no se nota.} Si el lector ve la retícula antes que el contenido, algo falló. Lo que sí debe notarse es el efecto: márgenes constantes, alineaciones que coinciden y aire alrededor del texto.
  - |-
    \textbf{El vacío es parte del dibujo.} En el calado el vacío dibuja, y en una página pasa igual. El espacio entre bloques no es papel desperdiciado: es lo que hace legible lo demás.
  anatomia:
    titulo: Las tres cuadrículas
    body: |-
      \textbf{Modular:} cajas iguales; galerías, catálogos, tableros. \\[1mm] \textbf{Columnar:} columnas verticales; texto largo. \\[1mm] \textbf{Jerárquica:} zonas desiguales; una pieza manda. \\[1mm] \textbf{Regla:} si se nota, falló. \\[1mm] \textbf{Vacío:} parte del dibujo, no sobra.
  errores_comunes: |-
    (1) \textbf{Elegir por gusto y no por propósito}: la pregunta es para qué sirve la página. (2) \textbf{Márgenes distintos en cada lado}: rompe la sensación de orden sin que se sepa por qué. (3) \textbf{Llenar todo el espacio}: sin aire, nada resalta. (4) \textbf{Cambiar de cuadrícula a mitad}: el lector pierde el hilo y no sabe qué le pasó. (5) \textbf{Dibujar la cuadrícula y no usarla}: si los bloques no se alinean con ella, no está haciendo su trabajo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los tres tipos». \textbf{Formato:} los tres tipos con frase propia, las seis piezas clasificadas y, por tipo, un propósito al que sirve bien y otro al que sirve mal. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tienen resuelta la pieza donde el tipo no parecía el adecuado.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tres cuadrículas dibujadas} (30 min · individual). (1) Toma tres hojas A4 y declara arriba de cada una su propósito: por ejemplo revista, cartel e infografía. (2) Elige para cada propósito el tipo que le sirve y escríbelo. (3) Dibuja los márgenes primero, iguales en las tres hojas. (4) Traza la cuadrícula con regla. (5) Ubica y rotula los bloques de contenido sobre ella. (6) Pásaselas a un compañero sin los rótulos de propósito y pregúntale para qué cree que sirve cada una.
  pilares:
  - |-
    \textbf{Tu entrega son tres hojas y una prueba.} Las tres cuadrículas con propósito y tipo declarados y sus bloques rotulados. Y lo que adivinó tu compañero al verlas sin rótulos.
  - |-
    \textbf{Los márgenes van primero.} Antes de trazar una sola columna, define cuánto aire dejas por los cuatro lados. Casi todas las páginas que se ven apretadas tienen ese problema y no otro.
  - |-
    \textbf{A mano y con regla.} Dibujar la cuadrícula a mano obliga a decidir medidas. En pantalla es demasiado fácil arrastrar hasta que algo cuadre sin saber por qué cuadró.
  - |-
    \textbf{Las tres tienen que ser distintas.} Tres columnares con distinto número de columnas son la misma cuadrícula tres veces. La consigna pide tres estructuras que resuelvan problemas distintos.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tres hojas A4, una cuadrícula en cada una. \\[1mm] \checkbox Propósito declarado y tipo identificado en cada una. \\[1mm] \checkbox Márgenes trazados primero y consistentes. \\[1mm] \checkbox Bloques de contenido ubicados y rotulados. \\[1mm] \checkbox Las tres resuelven problemas distintos. \\[1mm] \checkbox Un compañero adivinó el propósito de al menos dos.
  plantilla_guion: |-
    \textbf{Propósito.} \textit{Para qué es esta página.} \\[1mm] \textbf{Tipo.} \textit{Modular, columnar o jerárquica.} \\[1mm] \textbf{Márgenes.} \textit{Cuánto aire por los cuatro lados.} \\[1mm] \textbf{Bloques.} \textit{Qué va en cada zona.} \\[1mm] \textbf{Prueba.} \textit{Qué adivinó mi compañero.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} \textbf{Título:} «Actividad 3 --- Tres cuadrículas dibujadas». \textbf{Formato:} los tres bocetos con su propósito, su tipo y sus bloques rotulados, más lo que adivinó tu compañero. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tu compañero acertó el propósito de al menos dos.
  producto_titulo: Tres cuadrículas dibujadas a mano con propósito declarado y bloques ubicados
  criterios:
  - Hay tres cuadrículas en tres hojas, cada una con propósito y tipo declarados
  - Los márgenes están trazados primero y son consistentes
  - Los bloques de contenido están ubicados sobre la cuadrícula y rotulados
  - Las tres resuelven problemas distintos, no son variaciones de la misma
  - Un compañero acertó el propósito de al menos dos sin ver los rótulos
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.3.4.3
    cita: |-
      Los artefactos u objetos… que nos rodean en el mundo cotidiano… son entonces productos del trabajo humano… Si los entes son instrumentos producidos significa que fueron objeto de un cierto trabajo.
    aplicacion: |-
      Una página bien ordenada parece que se hizo sola, y esa es justamente la señal de que alguien trabajó. Con la vainica pasa igual: el revés sostiene el derecho y casi nadie lo mira.
    pregunta_espejo: |-
      ¿Qué cosa uso a diario que se ve tan sencilla que nunca pensé en quién la resolvió?
  estoico:
    autor: Marco Aurelio · Meditaciones II, 5 (c. 175 d.C.)
    cita: |-
      Haz lo que tienes entre manos con dignidad perfecta y sencilla, con afecto, con libertad y con justicia, y líbrate de todo otro pensamiento. (trad. propia)
    aplicacion: |-
      Trazar márgenes con regla no es glamoroso y decide más que cualquier decisión posterior. Casi todo el diseño consiste en hacer bien cosas pequeñas que nadie va a mirar de cerca.
    pregunta_espejo: |-
      ¿Qué paso aburrido me estoy saltando porque no se ve en el resultado?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 3.8
    cita: |-
      Creemos que todo el mundo necesita a la vez resguardo frente a la mirada pública y exposición… y también la generosidad del olvido deliberado. (trad. propia)
    aplicacion: |-
      Lo dicen de las personas, y sirve como imagen para la página. Un contenido necesita las dos cosas: sitio donde aparecer y aire alrededor donde no lo miren. El margen es esa segunda parte.
    pregunta_espejo: |-
      ¿A qué parte de mi página le estoy negando el aire que necesita para poder leerse?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con las tres cuadrículas dibujadas y con lo que adivinó tu compañero. Mira una página que uses a diario y cuéntale a alguien cuántas columnas tiene. En la sesión 3 eliges la tipografía que va a vivir dentro de esta estructura.
web:
  resumen: |-
    En Ansermanuevo el calado trabaja quitando: se retiran hilos de la tela y se reagrupan los que quedan, hasta que el vacío mismo dibuja. Y la vainica se trabaja por el revés, así que lo de delante depende de lo de detrás. Una cuadrícula es eso: la estructura invisible que decide dónde puede ir cada cosa.
  subtema: Diseño editorial digital · Cuadrícula
  pre_lectura:
    por_que_importa: |-
      Una cuadrícula está bien cuando no se nota. Lo que sí se nota es el efecto: márgenes constantes, alineaciones que coinciden y aire alrededor del texto.
    pregunta_detonante: |-
      ¿Podrías decir cuántas columnas tiene la última página que leíste con atención?
    activacion:
      titulo: El vacío que dibuja
      descripcion: |-
        En 2 minutos, mira una página cualquiera y fíjate solo en los espacios en blanco. ¿Se repiten? ¿Son iguales por los cuatro lados?
      duracion_min: 3
    conexion:
      anterior: En la sesión 1 analizaste tres piezas con los pilares de orden, jerarquía e intención.
      siguiente: En la sesión 3 eliges el par tipográfico que va a vivir dentro de esta cuadrícula.

clave: 2-2
grado: 9
periodo: 2
sesion: 2
completo: true
titulo: La página y la cuadrícula --- primer principio del orden
titulo_portada: |-
  La página y la cuadrícula ---
  primer principio
  del orden
producto_final: 3 grillas dibujadas a mano sobre hoja A4, cada una con propósito declarado (revista, póster, infografía) y los bloques de contenido ubicados en ellas
apertura:
  saber_ancestral: |-
    La cuadrícula no es invento del diseño moderno. La trazaron los \textbf{romanos en sus campamentos}, los \textbf{pueblos andinos en sus chacras} (cultivos en franjas perpendiculares según pendiente), los \textbf{fundadores coloniales en Cartago} (plano cuadrangular con plaza central, manzanas iguales), los \textbf{tejedores wayuu en sus mantas} (patrones geométricos repetidos con precisión). Toda comunidad que necesita organizar espacio invoca alguna forma de cuadrícula --- es una de las decisiones humanas más antiguas para domar el caos visual.
  origen: Plano colonial de Cartago, chacras andinas, mantas wayuu, campamentos romanos
  saber_contemporaneo: |-
    En diseño editorial, la \textbf{cuadrícula} (grid) es la columna vertebral invisible que sostiene cada página. Decide dónde van los márgenes, las columnas, los bloques. Sin grilla, la página se siente caótica; con grilla bien hecha, se siente \emph{tranquila y profesional} aunque el lector nunca la vea. Toda revista moderna --- The Economist, National Geographic, Time --- usa grilla rigurosa. Tu próxima publicación en Instagram también puede usarla.
  pregunta_puente: |-
    ¿Por qué la cuadrícula del plano de Cartago (manzanas iguales, calles en ángulo recto) sigue facilitando orientarte 500 años después? ¿Qué tienen en común esa cuadrícula y la de una revista bien diseñada?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuadrículas en piezas editoriales y arquitecturas reales; (2) \textbf{analizar} qué tipo de grilla usa cada producto (modular, columnar, jerárquica); (3) \textbf{aplicar} grillas a 3 propósitos distintos (revista, póster, infografía); (4) \textbf{crear} 3 grillas dibujadas con propósito declarado y contenido ubicado.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 1 te dio los 3 pilares; hoy bajas al primer principio operativo: la cuadrícula. Sin ella, los demás principios se vuelven decorativos.
  a_escuta: |-
    Antes de dibujar tus propias grillas, vamos a leer grillas reales en piezas editoriales y arquitectónicas. Verás que las mejores grillas son las que casi no se notan.
  a_sistematizacion: |-
    Ya viste grillas reales. Ahora vamos a entender los \textbf{3 tipos básicos} de grillas editoriales: modular, columnar y jerárquica. Cada una sirve a propósitos distintos.
  a_praxis: |-
    Tienes el método. Toca producir: 3 grillas dibujadas a mano para 3 propósitos distintos (revista, póster, infografía), cada una con bloques de contenido ubicados.
  a_producto: |-
    Lo que sigue resume qué entregas hoy: 3 grillas dibujadas. El criterio principal: que cada grilla sirva claramente al propósito que declaras.
  a_evaluacion: |-
    Antes de cerrar, mira la cuadrícula desde las cinco dimensiones humanas. La grilla no es solo técnica: es la promesa silenciosa de que la página respeta tu tiempo y tu atención.
  a_triangulo: |-
    Y para terminar, tres voces sobre el orden visual. Dussel sobre las cuadrículas coloniales, Marco Aurelio sobre la disciplina del orden, Floridi sobre cómo la grilla organiza la infoesfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Grillas reales} (15 min · individual). Busca \textbf{3 ejemplos} de cuadrículas reales: (a) un \emph{plano de ciudad colonial} (Cartago, Cali, Bogotá colonial), (b) una \emph{página de revista impresa o digital} (puede ser Wikipedia o National Geographic), (c) un \emph{tejido wayuu o manta indígena} (busca imágenes). Para cada uno: ¿cuántas columnas o módulos tiene? ¿qué se ubica en cada zona? ¿la grilla es visible o invisible?
  checks:
  - Encontré 3 ejemplos visuales distintos de cuadrículas (urbana, editorial, textil).
  - Conté columnas o módulos en cada uno.
  - Identifiqué si la grilla es visible o queda oculta tras el contenido.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 cuadrículas que organizan espacio». \textbf{Formato:} tabla de 4 columnas (Ejemplo~|~Columnas/módulos~|~Qué contiene cada zona~|~¿Visible o invisible?), 3 filas. \textbf{Sabes que terminaste cuando} reconoces que la cuadrícula funciona mejor cuando casi no se nota.
sistematizacion:
  intro: |-
    Toda cuadrícula editorial se reduce a 3 tipos básicos. Vamos a descomponerlos con los pilares del pensamiento computacional para que sepas elegir cuál usar para cada propósito.
  pilares:
  - |-
    Las cuadrículas editoriales se descomponen en 3 tipos: (1) \textbf{modular} (cuadrícula de cajas iguales, ideal para galerías de imágenes, dashboards, catálogos), (2) \textbf{columnar} (2-4-6 columnas verticales, ideal para texto largo, revistas, periódicos), (3) \textbf{jerárquica} (zonas de tamaño desigual organizadas por importancia, ideal para portadas, posters, páginas hero).
  - |-
    Toda grilla sigue el patrón \textbf{``invisible cuando funciona''}: si tu grilla se nota más que el contenido, fallaste. La grilla debe ser tan precisa que el ojo del lector la aplica intuitivamente sin verla. Es estructura, no decoración.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué propósito tiene la página y qué tipo de grilla sirve a ese propósito?}. Sin esa pregunta, eliges grilla por gusto y la página se siente improvisada.
  - |-
    Pasos para diseñar una grilla: (1) define el propósito (informar, mostrar imágenes, vender, contar historia); (2) elige tipo (modular, columnar, jerárquica); (3) decide márgenes (espacio fuera de la grilla); (4) decide columnas o módulos (cuántos y de qué tamaño); (5) decide el espacio entre columnas (gutter); (6) ubica los bloques de contenido.
  anatomia:
    titulo: Anatomía de una cuadrícula editorial
    body: |-
      \textbf{Márgenes:} el espacio en blanco entre el borde de la página y la grilla. \\[1mm] \textbf{Número de columnas:} 2 (libro), 3 (revista), 4-6 (periódico, dashboards). \\[1mm] \textbf{Gutter:} espacio vertical entre columnas. \\[1mm] \textbf{Líneas de base (baseline):} grilla horizontal que alinea texto entre columnas. \\[1mm] \textbf{Módulos:} cajas resultantes de cruzar columnas y baselines. \\[1mm] \textbf{Zonas de propósito:} qué se ubica en cada parte de la grilla (titular, cuerpo, imagen).
  errores_comunes: |-
    (1) Usar más columnas de las necesarias (12 columnas para una página simple = caos). (2) Olvidar márgenes generosos --- el espacio en blanco hace que la página respire. (3) Cambiar de grilla cada página de un mismo documento (rompe la coherencia del conjunto). (4) Imitar grillas famosas (The Economist) sin entender por qué funcionan.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 3 tipos de cuadrículas». \textbf{Formato:} 3 fichas, una por tipo (modular, columnar, jerárquica), cada una con: descripción + 1 producto editorial donde aparece + qué tipo de contenido organiza bien. \textbf{Sabes que terminaste cuando} puedes recomendar qué tipo de grilla usar para un propósito dado.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- 3 grillas dibujadas con propósito} (30 min · individual). Hora de producir. Vas a dibujar 3 grillas distintas en hojas A4, cada una con un propósito declarado, y vas a ubicar bloques de contenido (con sus etiquetas: titular, imagen, cuerpo, dato).
  pilares:
  - |-
    Cada grilla se descompone en 4 momentos: (1) propósito declarado arriba (``página de portada de revista de música'', ``póster de evento del colegio'', ``infografía de un tema''), (2) márgenes dibujados, (3) columnas/módulos delineados con líneas suaves, (4) bloques de contenido ubicados y etiquetados.
  - |-
    Sigue el patrón \textbf{``propósito antes que estética''}: cada decisión de tu grilla debe responder al propósito. Si tu propósito es ``mostrar muchas imágenes pequeñas'', elige grilla modular. Si es ``texto largo y respiro'', elige columnar de 2 columnas. Si es ``capturar atención y guiar lectura'', jerárquica.
  - |-
    Cada grilla expresa una sola intención principal. No mezcles ``revista'' con ``catálogo'' en la misma página --- elige uno.
  - |-
    Algoritmo: (1) elige 3 propósitos distintos; (2) por cada uno elige tipo de grilla; (3) dibuja en hoja A4 con regla los márgenes y columnas; (4) ubica los bloques de contenido (caja con etiqueta dentro: titular, foto, cuerpo, llamada a la acción); (5) escribe el propósito declarado arriba de cada hoja.
  checklist:
    titulo: Checklist antes de cerrar las 3 grillas
    items: |-
      \checkbox 3 grillas en 3 hojas A4 distintas. \\[1mm] \checkbox Cada una con propósito declarado arriba (1 frase). \\[1mm] \checkbox Cada una con tipo de grilla identificado (modular, columnar, jerárquica). \\[1mm] \checkbox Cada una con bloques de contenido etiquetados (no cajas vacías). \\[1mm] \checkbox Márgenes visibles y consistentes en las 3. \\[1mm] \checkbox Las 3 grillas son distintas entre sí (no la misma con cambios menores).
  plantilla_guion: |-
    \textbf{Grilla 1 · Revista de música.} \textit{Tipo + propósito + bloques ubicados.} \\[1mm] \textbf{Grilla 2 · Póster de evento del colegio.} \textit{Tipo + propósito + bloques.} \\[1mm] \textbf{Grilla 3 · Infografía de un tema.} \textit{Tipo + propósito + bloques.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- 3 grillas editoriales aplicadas». \textbf{Formato:} 3 hojas A4 con grilla dibujada + bloques etiquetados + propósito declarado. \textbf{Extensión:} 3 hojas A4. \textbf{Sabes que terminaste cuando} un compañero puede ver tus 3 grillas y decidir cuál usaría para cada propósito sin que tú le expliques.
  producto_titulo: 3 grillas editoriales dibujadas a mano con propósito declarado y bloques ubicados
  criterios:
  - 3 grillas distintas en 3 hojas A4
  - Cada grilla tiene propósito declarado y tipo identificado
  - Bloques de contenido ubicados y etiquetados
  - Márgenes consistentes y visibles
  - Las 3 son distintas entre sí (no variaciones menores)
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda cuadrícula impuesta organiza el espacio pero también disciplina al cuerpo que la habita.
    aplicacion: |-
      Los conquistadores trazaron Cartago con cuadrícula española, ignorando la organización de los pueblos calima previos. La cuadrícula no es neutra: la rejilla colonial impuso un modo de vivir, comerciar, vigilar. Hoy, la cuadrícula del feed de Instagram impone un modo de mirar. Reconocer eso no es rechazar la grilla --- es elegir cuál usar y para qué.
    pregunta_espejo: |-
      ¿Qué cuadrículas (físicas o digitales) habito sin haberlas elegido? ¿Cómo me disciplinan sin que lo note?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Lo que respeta su estructura sobrevive las modas; lo que la rompe sin entenderla, naufraga rápido.
    aplicacion: |-
      La grilla disciplinada de The Economist lleva 180 años sosteniendo la revista. Las modas tipográficas vienen y van; la cuadrícula sólida queda. Aprender a respetar la estructura es aprender estoicismo aplicado al diseño: no se trata de no innovar, se trata de no romper lo que sostiene sin razón. La libertad creativa empieza por la disciplina de la grilla.
    pregunta_espejo: |-
      ¿Qué estructura subyacente respeto en mi trabajo y cuál rompo solo por afán de novedad? ¿Cuál merece respetar y cuál merece romper?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Las cuadrículas digitales no solo organizan páginas: organizan la atención humana a escala global.
    aplicacion: |-
      Cuando Mark Zuckerberg eligió la grilla del feed de Facebook, decidió cómo verían el mundo 3000 millones de personas. La cuadrícula del feed (cuadrada, infinita, vertical, mezclando amigos con anuncios) modeló nuestra atención más que cualquier ley. Aprender a leer cuadrículas digitales con criterio es ciudadanía contemporánea.
    pregunta_espejo: |-
      ¿Qué cuadrículas digitales modelan mi atención hoy (feed, dashboard, grilla de Netflix)? ¿Las elegí o me las impusieron?
compromiso: |-
  \textbf{Para la próxima semana.} Mira el feed de Instagram, TikTok o YouTube de quien sigues con mente de diseñador: ¿qué cuadrícula usa la plataforma? ¿Cómo cambiarías el orden, la jerarquía, el espacio si tú la diseñaras? Anota 3 ideas. El próximo lunes traemos esas ideas --- las usaremos en la sesión 3 sobre tipografía.
web:
  resumen: |-
    Dibujas 3 grillas con propósito declarado (revista, póster, infografía). La cuadrícula es la columna vertebral invisible que sostiene toda página bien diseñada.
  subtema: Diseño editorial digital · Cuadrícula
  pre_lectura:
    por_que_importa: |-
      Sin cuadrícula, la página se siente caótica. Con grilla bien hecha, se siente tranquila y profesional aunque el lector nunca la vea. Toda revista del mundo (Economist, National Geographic, Time) usa grilla rigurosa. Tu próxima publicación en Instagram también puede usarla.
    pregunta_detonante: |-
      Si miraras tu feed de Instagram con criterio de diseñador, ¿qué cuadrícula está usando la plataforma? ¿Y cómo modelara la manera en que ves a tus amigos?
    activacion:
      titulo: Cuenta columnas
      descripcion: |-
        En 3 minutos, abre una revista o un sitio web (Wikipedia, BBC) y cuenta literalmente cuántas columnas tiene. ¿Son iguales o de tamaños diferentes? ¿Dónde van las imágenes? Ese conteo te entrena el ojo para ver lo invisible.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 1 viste los 3 pilares del diseño. Hoy bajas al primer principio operativo: la cuadrícula que sostiene todo lo demás.
      siguiente: "En la sesión 3 le pondrás voz a la grilla con tipografía: par tipográfico para tu revista."
  conceptos_clave:
    - termino: Grilla modular
      definicion: |-
        Cuadrícula de cajas iguales. Ideal para galerías de imágenes, dashboards, catálogos. Cada módulo es una unidad equivalente.
      ejemplo: |-
        El feed de Instagram en su versión clásica: cuadrícula 3×N. Cada celda igual al resto, dispuestas para que el ojo escanee sin priorizar.
      emoji: "🟦"
    - termino: Grilla columnar
      definicion: |-
        2-4-6 columnas verticales. Ideal para texto largo, revistas, periódicos. Las columnas pueden ser de igual o distinto ancho.
      ejemplo: |-
        Un periódico clásico: 4-6 columnas verticales que distribuyen titulares y cuerpo. Wikipedia: 1-2 columnas para lectura cómoda.
      emoji: "📰"
    - termino: Grilla jerárquica
      definicion: |-
        Zonas de tamaño desigual organizadas por importancia. Ideal para portadas, posters, páginas hero. Una zona "estrella" más grande, otras secundarias.
      ejemplo: |-
        La portada del New York Times: una foto grande con titular principal, varias notas secundarias en cajas más pequeñas. Jerarquía visible.
      emoji: "⛰"
    - termino: Márgenes
      definicion: |-
        Espacio en blanco entre el borde de la página y la grilla. Define el aire que respira la pieza. Márgenes generosos comunican calma; estrechos comunican urgencia.
      ejemplo: |-
        Un libro de poesía suele tener márgenes anchos (calma, contemplación). Un periódico tabloide tiene márgenes mínimos (información apretada, urgencia).
      emoji: "⬜"
    - termino: Gutter (calle)
      definicion: |-
        Espacio vertical entre columnas. Permite que el ojo distinga una columna de la siguiente sin que se mezclen las líneas.
      ejemplo: |-
        En una revista a 3 columnas, el gutter es de 10-20px. Sin gutter, las palabras de una columna se leerían como continuación de la otra.
      emoji: "↔"
    - termino: Invisible cuando funciona
      definicion: |-
        Una grilla bien hecha NO se nota — solo se nota cuando falla. Si tu lector ve la grilla como decoración, fallaste. La grilla es estructura, no espectáculo.
      ejemplo: |-
        En The Economist (180 años de grilla rigurosa), nadie ve la cuadrícula. Solo ve que la revista "se siente clara". Eso es señal de éxito.
      emoji: "👻"
  quiz:
    titulo: "✅ Verifica los tipos de grilla"
    instrucciones: |-
      5 preguntas para confirmar que distingues los 3 tipos de cuadrícula y los aplicas con criterio. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Qué tipo de grilla es ideal para una galería de imágenes o un catálogo de productos?
        opciones:
          - Modular
          - Columnar
          - Jerárquica
          - Sin grilla
        respuesta_index: 0
        feedback_correcto: |-
          Correcto. La grilla modular (cajas iguales) es perfecta para galerías y catálogos porque cada elemento tiene el mismo peso visual.
        feedback_incorrecto: |-
          Modular. Cuando todos los elementos tienen el mismo peso visual (productos en un catálogo, fotos en un feed), la grilla modular funciona mejor.
      - enunciado: ¿Cuál es la señal de que una grilla está BIEN diseñada?
        opciones:
          - Que se vea bonita
          - Que el lector la note
          - Que sea invisible — no se note, solo organice
          - Que tenga muchas columnas
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. La grilla bien hecha es invisible. El lector solo percibe que la página "se siente clara". Si nota la grilla como decoración, fallaste.
        feedback_incorrecto: |-
          Invisible. La grilla es estructura, no espectáculo. Si el lector ve la grilla en vez del contenido, la grilla está mal.
      - enunciado: En una revista a 3 columnas, ¿qué es el "gutter"?
        opciones:
          - El borde de la página
          - El espacio vertical entre columnas
          - El título principal
          - El logo
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El gutter es la "calle" entre columnas. Sin él, las palabras de una columna se mezclan con las de la otra y la lectura se rompe.
        feedback_incorrecto: |-
          Gutter = espacio entre columnas. Si no existe, las líneas de una columna se confunden con las de la siguiente. Suele ser 10-20px.
      - enunciado: ¿Qué transmiten márgenes generosos (mucho espacio en blanco)?
        opciones:
          - Pobreza
          - Calma y aire para respirar
          - Falta de contenido
          - Pereza
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Márgenes amplios = calma, aire, respeto por la atención del lector. Por eso Apple los usa: comunica premium sin decirlo.
        feedback_incorrecto: |-
          Márgenes generosos = calma, aire, premium. Por eso los libros de poesía y las marcas de lujo los usan. Lo apretado comunica urgencia o tabloide.
      - enunciado: En el saber ancestral del plano colonial de Cartago, ¿qué aplica directamente a tu revista digital?
        opciones:
          - Nada — los planos coloniales son del pasado
          - |-
            Que una cuadrícula bien pensada organiza el espacio durante siglos y facilita orientarse sin esfuerzo
          - Que solo los conquistadores diseñaban
          - Que las ciudades viejas son confusas
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El plano de Cartago facilita orientarte 500 años después gracias a su cuadrícula. Tu revista bien grillada será fácil de navegar.
        feedback_incorrecto: |-
          Cuadrícula bien pensada = orientación durable. Cartago colonial y revista bien diseñada comparten el principio: estructura invisible que organiza.
  post_lectura:
    transferencia: |-
      Esta semana, mira el feed de Instagram, TikTok o YouTube con mente de diseñador. ¿Qué cuadrícula usa la plataforma? ¿Cómo cambiarías el orden, jerarquía, espacio si la diseñaras tú? Anota 3 ideas. El próximo lunes traemos esas ideas — son insumo de la sesión 3.
  cinco_dimensiones:
    personal: |-
      Aprendiste a ver la cuadrícula invisible que sostiene toda página bien diseñada — herramienta para toda tu vida.
    emocional: "Sentiste la disciplina del orden: cómo lo estructurado puede liberar la lectura en vez de oprimirla."
    ciudadana: |-
      Reconociste que las grillas digitales (feed, dashboard) modelan tu atención y eso es político, no neutral.
    local: |-
      Conectaste el plano colonial de Cartago, las chacras andinas y las mantas wayuu como antecedentes del oficio de grillar.
    intergeneracional: |-
      La cuadrícula es decisión humana milenaria — desde Roma y los Andes hasta tu próximo dashboard. Heredas tradición de organización del espacio.

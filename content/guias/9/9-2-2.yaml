titulo: La página y la cuadrícula --- primer principio del orden
producto_final: |-
  3 grillas dibujadas a mano sobre una hoja, cada una con un propósito declarado (revista, póster, infografía) y los bloques de contenido ubicados en ellas
saber_ancestral_idea: |-
  La cuadrícula no es un invento del diseño moderno: la trazaron Roma, los pueblos andinos en sus chacras, los fundadores coloniales en Cartago, los tejedores wayuu en sus mantas. Toda comunidad que necesita organizar espacio invoca alguna forma de cuadrícula --- es una de las decisiones humanas más antiguas.

clave: 2-3
grado: 9
periodo: 2
sesion: 3
completo: true
duracion_min: 90
titulo: Tipografía --- la voz visible de las palabras
titulo_portada: |-
  Tipografía ---
  la voz visible
  de las palabras
producto_final: |-
  Diez tipografías reales clasificadas por sus cuatro ejes, y el par tipográfico que vas a usar en toda tu revista: una para titulares y otra para el cuerpo, las dos con nombre exacto y disponibles en Google Fonts. Va con la emoción central de tu revista declarada en una frase, la justificación de cada elección y una prueba real con un titular y un párrafo compuestos.
apertura:
  origen: Carnaval de Riosucio · el Matachín devuelve la palabra en verso y firmada
  fuente: |-
    Ministerio de Cultura de Colombia. (2011). \emph{Plan Especial de Salvaguardia. Carnaval de Riosucio, Caldas}. Ministerio de Cultura.
  saber_ancestral: |-
    En Riosucio, Caldas, hicieron algo poco común con el chisme. El \textbf{Matachín} es el poeta del Carnaval. Recoge los rumores y los hechos del pueblo y los devuelve \textbf{en verso, con nombre propio y en público}. Y el pueblo, a su vez, «consagra a sus Matachines o los degrada» cuando no están a la altura (Ministerio de Cultura, 2011, p. 41). Fíjate en lo que cambia ahí. El contenido puede ser el mismo que el del rumor. Lo que cambia es que alguien pone la cara, y que la palabra viene con una forma: el verso obliga a medir, a elegir y a sostener lo dicho. La \textbf{cara de exclusión}: el chisme fue y sigue siendo control social sobre las mujeres, y lo que se vigila es la reputación sexual. No es cohesión pintoresca. Hoy vas a trabajar con lo mismo: cómo la forma de una palabra decide con qué voz se oye.
  saber_contemporaneo: |-
    Una tipografía se clasifica con cuatro ejes y con eso basta para elegir bien. \textbf{Display o cuerpo}: la display es para titulares grandes y puede permitirse ser rara; la de cuerpo tiene que aguantar párrafos enteros sin cansar. \textbf{Con serifa o sin serifa}: los remates en los extremos de los trazos dan un aire de libro; su ausencia, un aire de pantalla. \textbf{Geométrica o humanista}: la geométrica se construye con círculos y rectas; la humanista imita el trazo de la mano. \textbf{Peso y ancho}: cuántas variantes trae, porque sin negrita ni cursiva no se puede construir jerarquía. La regla para combinar es corta: pareja contrastada, no idéntica. Titular y cuerpo deben sentirse parientes pero distinguibles. Dos tipografías casi iguales producen una página que se ve descuidada sin que nadie sepa por qué.
  pregunta_puente: |-
    El Matachín firma lo que dice y el verso lo obliga a medir cada palabra. Tu revista, ¿con qué voz habla, y quién decidió que hablara así?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} diez tipografías reales de tu entorno y clasificarlas por los cuatro ejes; (2) \textbf{explicar} por qué un par funciona o no, en términos de contraste y coherencia; (3) \textbf{crear} el par tipográfico de tu revista, justificado y probado con un titular y un párrafo.
puentes:
  a_ruta: |-
    En la sesión 2 construiste la cuadrícula que ordena la página. Hoy eliges la voz que va a hablar dentro de ella. En la sesión 4 llega el color, que es la tercera decisión del sistema visual.
  a_escuta: |-
    Antes de la teoría vas a coleccionar letras. Diez tipografías de sitios distintos, mirando cómo están hechas y no si te gustan.
  a_sistematizacion: |-
    Ya las tienes. Ahora vas a clasificarlas por los cuatro ejes y a entender por qué ciertos pares funcionan y otros no.
  a_praxis: |-
    Tienes el criterio. Toca elegir tu par y probarlo componiendo de verdad un titular y un párrafo.
  a_producto: |-
    Lo que entregas hoy: diez clasificadas y tu par elegido con prueba. La prueba de calidad: la emoción que declaraste se reconoce sin que la expliques.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. La forma de la letra decide el tono antes de que nadie lea una palabra.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre forma y voz: Dussel sobre la belleza que no cumple la norma vigente, Marco Aurelio sobre hablar sin hipocresía, Floridi sobre rechazar lo que no logramos entender.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Diez tipografías reales} (15 min · individual). (1) Reúne diez tipografías de sitios distintos. Tres de libros, mirando portada y cuerpo. Tres de revistas o periódicos. Dos de logotipos que conozcas. Dos de letreros de la calle. (2) Fotografía o copia una muestra de cada una. (3) Anota en cada una si la letra tiene remates en los extremos. (4) Anota si la usarías para un titular o para un párrafo largo. (5) Marca la que más te costó clasificar.
  checks:
  - Tengo diez muestras de sitios distintos.
  - Anoté en cada una si tiene remates y para qué serviría.
  - Marqué la que más me costó clasificar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Diez tipografías reales». \textbf{Formato:} tabla de 10 filas y 3 columnas (dónde la vi / tiene remates / titular o cuerpo), con marca en la más difícil. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las diez tienen las dos respuestas, aunque alguna te haya costado.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los cuatro ejes} (20 min · parejas). (1) Con tu pareja, escriban los cuatro ejes con una frase propia cada uno. (2) Clasifiquen sus veinte muestras por los cuatro. (3) Formen dos pares con ellas: uno que funcione y otro que no. (4) Escriban por qué falla el segundo, en términos de contraste y no de gusto.
  pilares:
  - |-
    \textbf{Display o cuerpo.} La display es para titulares y puede permitirse ser rara. La de cuerpo tiene que aguantar párrafos enteros sin cansar la vista, y por eso casi nunca llama la atención.
  - |-
    \textbf{Con o sin serifa, geométrica o humanista.} Los remates dan un aire de libro y su ausencia un aire de pantalla. La geométrica se construye con círculos y rectas; la humanista imita el trazo de la mano y se lee más fácil en textos largos.
  - |-
    \textbf{Peso y ancho.} Cuántas variantes trae la familia. Sin negrita y sin cursiva no se puede construir jerarquía dentro de un texto, y terminarás subrayando cosas o poniéndolas en mayúscula.
  - |-
    \textbf{Pareja contrastada, no idéntica.} Titular y cuerpo deben sentirse parientes pero distinguibles. Dos tipografías casi iguales producen una página descuidada sin que nadie sepa decir por qué.
  anatomia:
    titulo: Los cuatro ejes de una tipografía
    body: |-
      \textbf{Uso:} display para titular, cuerpo para párrafo. \\[1mm] \textbf{Remates:} con serifa (aire de libro) o sin ella (aire de pantalla). \\[1mm] \textbf{Construcción:} geométrica o humanista. \\[1mm] \textbf{Familia:} cuántos pesos y anchos trae. \\[1mm] \textbf{Regla:} pareja contrastada, no idéntica.
  errores_comunes: |-
    (1) \textbf{Usar una display en el cuerpo}: cansa la vista en el segundo párrafo. (2) \textbf{Elegir dos tipografías casi iguales}: no hay contraste y la página se ve sucia. (3) \textbf{Elegir por gusto sin declarar la emoción}: después no se puede defender ninguna decisión. (4) \textbf{Olvidar los pesos}: sin negrita ni cursiva no hay jerarquía dentro del texto. (5) \textbf{No probar con texto real}: una tipografía se juzga con un párrafo, no con la palabra que trae la muestra.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los cuatro ejes». \textbf{Formato:} los cuatro ejes con frase propia, las veinte muestras clasificadas y los dos pares, con la explicación de por qué falla el segundo. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} el par que falla está explicado por contraste y no por gusto.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu par tipográfico} (30 min · individual). (1) Escribe en una frase la emoción central de tu revista. (2) Elige la tipografía de titulares que transmita esa emoción, con su nombre exacto y disponible en Google Fonts. (3) Elige la del cuerpo, que respete esa emoción y aguante párrafos. (4) Justifica cada elección en una frase, en términos de los cuatro ejes. (5) Compón una prueba real: un titular y un párrafo de al menos cinco líneas. (6) Enséñasela a un compañero sin decirle la emoción y pregúntale qué le transmite.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} La emoción declarada en una frase. El par con nombre exacto y justificación. Y la prueba compuesta con titular y párrafo.
  - |-
    \textbf{La emoción va primero.} Sin ella eliges por defecto y después no puedes defender nada. «Cercana y directa» y «seria y documental» llevan a pares distintos, y las dos son respuestas válidas.
  - |-
    \textbf{Se prueba con texto de verdad.} La palabra que trae la muestra siempre se ve bien. Cinco líneas seguidas revelan si la letra cansa, si el espacio entre líneas alcanza y si los acentos se ven.
  - |-
    \textbf{Nombre exacto, no descripción.} «Una sin serifa moderna» no sirve para que otro reproduzca tu revista. «Source Sans 3» sí, y ese nombre va en tu bitácora del periodo.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Diez tipografías clasificadas por los cuatro ejes. \\[1mm] \checkbox Emoción central declarada en una frase. \\[1mm] \checkbox Tipografía de titulares con nombre exacto y justificación. \\[1mm] \checkbox Tipografía de cuerpo con nombre exacto y justificación. \\[1mm] \checkbox Las dos disponibles en Google Fonts. \\[1mm] \checkbox Prueba compuesta con titular y párrafo de cinco líneas.
  plantilla_guion: |-
    \textbf{Emoción.} \textit{Una frase.} \\[1mm] \textbf{Display.} \textit{Nombre exacto y por qué.} \\[1mm] \textbf{Cuerpo.} \textit{Nombre exacto y por qué.} \\[1mm] \textbf{Contraste.} \textit{En qué se distinguen.} \\[1mm] \textbf{Prueba.} \textit{Qué transmitió a mi compañero.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Tu par tipográfico». \textbf{Formato:} la emoción declarada, los dos nombres con su justificación y la prueba pegada o transcrita, más lo que dijo tu compañero. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tu compañero nombró una emoción parecida a la que declaraste.
  producto_titulo: Diez tipografías clasificadas + par tipográfico elegido, justificado y probado
  criterios:
  - Las diez tipografías están clasificadas por los cuatro ejes
  - La emoción central de la revista está declarada en una frase
  - Las dos tipografías tienen nombre exacto y están en Google Fonts
  - Cada elección se justifica en términos de los ejes, no de gusto
  - Hay una prueba compuesta con titular y párrafo de al menos cinco líneas
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.2.8.4
    cita: |-
      La aparente fealdad del rostro del oprimido, el ajado rostro del campesino, la endurecida mano del obrero… es el punto de partida de la estética de la liberación, porque es la interpelación que revela la belleza popular.
    aplicacion: |-
      Cada época tiene una letra que le parece la correcta y otras que le parecen feas. Los letreros pintados a mano de una calle no cumplen ninguna norma tipográfica y tienen una voz que ninguna fuente de catálogo consigue.
    pregunta_espejo: |-
      ¿Qué letra de mi barrio me parecía fea y ahora entiendo que tiene una voz propia?
  estoico:
    autor: Marco Aurelio · Meditaciones VIII, 5 (c. 175 d.C.)
    cita: |-
      Con los ojos fijos en tu tarea, mírala y, recordando que es tu deber ser bueno, hazla sin desviarte; y habla como te parezca más justo, con buena disposición, con modestia y sin hipocresía. (trad. propia)
    aplicacion: |-
      Elegir tipografía es elegir un tono de voz. Una letra dramática para un texto sencillo suena a exageración, igual que hablar con solemnidad de algo pequeño. La coherencia entre lo que dices y cómo se ve es una forma de honestidad.
    pregunta_espejo: |-
      ¿La voz de mi revista se parece a cómo hablo yo, o me la puse encima?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), Prefacio
    cita: |-
      Tememos y rechazamos aquello a lo que no logramos dar sentido y significado. (trad. propia)
    aplicacion: |-
      Con las letras pasa literalmente. Si el lector no descifra una palabra en el primer intento, abandona; y no dirá que la tipografía era ilegible, dirá que el texto no le interesó. Lo que no se lee, se rechaza.
    pregunta_espejo: |-
      ¿Qué texto dejé de leer esta semana por cómo estaba compuesto, sin darme cuenta de que era por eso?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el par elegido y la prueba compuesta. Anota los dos nombres exactos en tu bitácora del periodo, porque los vas a usar en todas las sesiones que quedan. En la sesión 4 eliges la paleta de color que acompaña a esta voz.

    En el Carnaval de Riosucio el Matachín recoge los rumores del pueblo y los devuelve en verso, con nombre propio y en público. La diferencia con el rumor no es el contenido: es que alguien pone la cara y que la palabra viene con una forma. Hoy eliges la forma con que va a hablar tu revista.

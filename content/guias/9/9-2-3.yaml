titulo: Tipografía --- la voz visible de las palabras
producto_final: |-
  Clasificación de 10 tipografías (display vs cuerpo, con/sin serifa, geométrica/humanista) + par tipográfico propio elegido para la revista del periodo, justificado en 1 frase
saber_ancestral_idea: |-
  Antes de la tipografía digital existió la caligrafía: los rótulos de barberías y panaderías del Valle, las letras de las décimas del Pacífico, la escritura cuidada de los registros parroquiales. Cada tipografía hereda gestos de mano humana --- por eso unas se sienten cálidas y otras frías.

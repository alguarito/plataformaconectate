clave: 2-3
grado: 9
periodo: 2
sesion: 3
completo: true
titulo: Tipografía --- la voz visible de las palabras
titulo_portada: |-
  Tipografía ---
  la voz visible
  de las palabras
producto_final: Clasificación de 10 tipografías (display vs cuerpo, con/sin serifa, geométrica/humanista) + par tipográfico propio elegido para la revista del periodo, justificado en 1 frase
apertura:
  saber_ancestral: |-
    Antes de la tipografía digital existió la \textbf{caligrafía}: los \emph{rótulos de barberías y panaderías} del Valle pintados a mano con elegancia, las \emph{letras de las décimas} del Pacífico escritas con tinta sobre cuaderno, la \emph{escritura cuidada} de los registros parroquiales, las \emph{cartas de amor} de tu abuela con su letra inconfundible. Cada tipografía digital hereda gestos de mano humana: una letra con serifa serenamente curvada viene del trazo de la pluma sobre pergamino. Una letra geométrica viene de la regla y el compás del XX. Las tipografías cargan siglos de oficio.
  saber_contemporaneo: |-
    Hoy elegir tipografía es un acto editorial mayor: define la \emph{voz visible} de tus palabras. Una tipografía con serifa (Times, Garamond, Lora) se siente clásica, autorizada. Una sin serifa (Helvetica, Inter, Roboto) se siente moderna, neutra. Una display (Bricolage, Playfair) se siente dramática, llamativa. Tu próxima revista necesitará un \textbf{par tipográfico}: una para titulares (display) y una para cuerpo (legible). Esa elección moldea cómo el lector recibe tu mensaje antes de leerlo.
  pregunta_puente: |-
    ¿Por qué la letra de tu abuela en una carta antigua se ``ve cálida''? ¿Y por qué algunas tipografías digitales transmiten lo mismo y otras no?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 10 tipografías y clasificarlas en 4 categorías; (2) \textbf{analizar} qué emoción transmite cada categoría; (3) \textbf{aplicar} la regla del ``par tipográfico'' (display + cuerpo); (4) \textbf{crear} tu par tipográfico propio para la revista del periodo, justificado.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 2 te dio la grilla; hoy le pones \emph{voz} a esa grilla con tipografía. Sin tipografía bien elegida, hasta la mejor grilla se siente fría.
  a_escuta: |-
    Antes de elegir tu par tipográfico, vamos a entrenar el ojo en 10 tipografías reales. Cada una tiene historia, propósito y emoción. Aprender a leerlas es leer el ADN del diseño.
  a_sistematizacion: |-
    Ya viste 10 tipografías. Ahora vamos a entender las \textbf{4 categorías} en que se organizan: display vs cuerpo, con vs sin serifa, geométrica vs humanista. Combinarlas con criterio es el oficio del diseñador.
  a_praxis: |-
    Tienes el método. Toca decidir: tu par tipográfico para la revista del periodo. Una para titulares, una para cuerpo, ambas eligidas con justificación.
  a_producto: |-
    Lo que sigue resume qué entregas hoy: clasificación de 10 + par tipográfico propio. El criterio: que tu par sirva al propósito de tu revista, no que ``se vea bonito''.
  a_evaluacion: |-
    Antes de cerrar, mira la tipografía desde las cinco dimensiones humanas. Elegir tipografía es elegir voz; elegir voz es elegir a quién hablas y cómo lo respetas.
  a_triangulo: |-
    Y para terminar, tres voces sobre la voz visible. Dussel sobre las tipografías colonizadas, Marco Aurelio sobre la simplicidad de las letras que duran, Floridi sobre la tipografía como infraestructura cognitiva.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 10 tipografías reales} (15 min · individual). Busca \textbf{10 tipografías} en lugares cercanos a ti: 3 de libros (mira la portada y el cuerpo), 3 de revistas o periódicos, 2 de logotipos de marcas que conoces, 2 de letreros o rótulos físicos cercanos. Para cada una: ¿con serifa o sin serifa? ¿display (grande, llamativa) o cuerpo (legible para texto)? ¿qué emoción transmite?
  checks:
  - Encontré 10 tipografías reales (3 libros + 3 revistas + 2 logos + 2 rótulos).
  - Identifiqué para cada una si es display o cuerpo, con o sin serifa.
  - Anoté la emoción que transmite (clásica, moderna, dramática, neutra, etc.).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 10 tipografías bajo la lupa». \textbf{Formato:} tabla de 5 columnas (Tipografía o muestra~|~Origen~|~Display/Cuerpo~|~Con/Sin serifa~|~Emoción transmitida), 10 filas. \textbf{Sabes que terminaste cuando} reconoces patrones (por ejemplo, las display suelen ser llamativas, las de cuerpo legibles).
sistematizacion:
  intro: |-
    Toda tipografía se clasifica en 4 dimensiones cruzadas. Vamos a descomponerlas con los pilares del pensamiento computacional para que sepas combinar con criterio en lugar de gusto.
  pilares:
  - |-
    La clasificación tipográfica se descompone en 4 ejes: (1) \textbf{display vs cuerpo} (display para titulares grandes y dramáticos; cuerpo para texto largo legible), (2) \textbf{con vs sin serifa} (con serifa: pies en las letras, sensación clásica y de lectura larga; sin serifa: limpia, moderna, ideal pantalla), (3) \textbf{geométrica vs humanista} (geométrica: trazos uniformes basados en círculos perfectos; humanista: trazos con variación que evocan la mano), (4) \textbf{regular vs variable} (regular: pesos fijos; variable: un solo archivo con muchos pesos posibles).
  - |-
    Toda combinación fuerte sigue el patrón \textbf{``par contrastado, no idéntico''}: tu titular y tu cuerpo deben sentirse parientes pero distintos. Mismo concepto (humanista + humanista) puede aburrir. Concepto opuesto (display geométrica + cuerpo humanista con serifa) crea contraste rico.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué voz quiero darle a mi revista y qué par tipográfico transmite esa voz?}. Sin esa pregunta, eliges Inter por defecto y la revista se ve genérica.
  - |-
    Pasos para elegir tu par: (1) define emoción central de tu revista; (2) elige display que transmita esa emoción para titulares; (3) elige cuerpo que respete la emoción pero priorice legibilidad; (4) verifica contraste entre ambas; (5) prueba con un titular y un párrafo de cuerpo reales.
  anatomia:
    titulo: Anatomía de un par tipográfico
    body: |-
      \textbf{Display (titulares):} llamativa, con personalidad, 36pt+. Ej: Playfair, Bricolage, Oswald. \\[1mm] \textbf{Cuerpo (texto largo):} legible, neutra, 10-12pt. Ej: Inter, Source Sans, Lora. \\[1mm] \textbf{Contraste:} las dos deben sentirse parientes pero distintas. \\[1mm] \textbf{Pesos:} cada una en al menos 2 pesos (regular + bold). \\[1mm] \textbf{Coherencia con la marca:} las dos deben sostener la emoción central de la revista. \\[1mm] \textbf{Accesibilidad:} legibles a tamaños pequeños, en pantalla y papel.
  errores_comunes: |-
    (1) Usar la misma tipografía para titulares y cuerpo (aburrido y sin jerarquía). (2) Usar dos display al mismo tiempo (caos visual). (3) Elegir tipografía decorativa para cuerpo (ilegible en textos largos). (4) Importar tipografías de moda sin probar legibilidad. (5) Olvidar que hay tipografías Google Fonts gratuitas excelentes --- no necesitas pagar.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Qué tipografía sirve para qué tipo de revista». \textbf{Formato:} 4 fichas, una por eje, cada una con: definición + 2 tipografías que ejemplifican cada extremo del eje. \textbf{Veredicto (3 tipos de revista):} para estas 3 publicaciones, decide qué par tipográfico (display + cuerpo) sería el más adecuado y justifica con 2 criterios: (1) revista de moda urbana; (2) revista académica de medicina; (3) revista cultural del Pacífico colombiano. \textbf{Sabes que terminaste cuando} tus 3 decisiones se sostienen en criterios objetivos (legibilidad, formalidad, identidad regional), no en gusto personal.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu par tipográfico para la revista} (30 min · individual). Hora de elegir. Vas a definir el par tipográfico (display + cuerpo) que usarás durante todo el periodo 2 para tu revista digital. Esta elección será tu compromiso editorial.
  pilares:
  - |-
    Tu par se descompone en 4 decisiones: (1) emoción central de tu revista (calma, urgencia, ternura, rigor, juego), (2) tipografía display elegida con su nombre exacto, (3) tipografía cuerpo elegida con su nombre exacto, (4) justificación de 1 frase por cada elección.
  - |-
    Sigue el patrón \textbf{``Google Fonts antes que ilegales''}: usa Google Fonts (gratuitas y profesionales). Bricolage Grotesque, Inter, Lora, Playfair Display, Source Sans, IBM Plex Sans --- todas profesionales, todas gratis.
  - |-
    Cada elección expresa una sola idea. No pongas ``elegí Playfair porque es bonita y elegante y moderna y profesional'' --- elige UN adjetivo y defiéndelo.
  - |-
    Algoritmo: (1) declara emoción central; (2) ve a fonts.google.com y prueba 3 display que la transmitan; (3) ve a fonts.google.com y prueba 3 cuerpo que respeten la emoción pero priorizen legibilidad; (4) elige UNA de cada; (5) escribe en cuaderno un titular y un párrafo cortos usándolas (puedes pegar pantallazos o escribirlas a mano imitándolas).
  checklist:
    titulo: Checklist antes de cerrar el par tipográfico
    items: |-
      \checkbox Emoción central de la revista declarada en 1 palabra. \\[1mm] \checkbox Tipografía display elegida con nombre exacto. \\[1mm] \checkbox Tipografía cuerpo elegida con nombre exacto. \\[1mm] \checkbox Justificación de 1 frase para cada elección. \\[1mm] \checkbox Ambas son de Google Fonts (verificado en fonts.google.com). \\[1mm] \checkbox Probé un titular y un párrafo reales con ambas.
  plantilla_guion: |-
    \textbf{Emoción central de mi revista.} \textit{1 palabra.} \\[1mm] \textbf{Display elegida.} \textit{Nombre + justificación de 1 frase.} \\[1mm] \textbf{Cuerpo elegida.} \textit{Nombre + justificación de 1 frase.} \\[1mm] \textbf{Prueba real.} \textit{Un titular y un párrafo usando ambas.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi par tipográfico para la revista». \textbf{Formato:} emoción central + par tipográfico justificado + prueba real (titular y párrafo). \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} puedes defender por qué ese par y no otro frente a un compañero.
  producto_titulo: Par tipográfico (display + cuerpo) elegido y justificado para la revista del periodo
  criterios:
  - Emoción central de la revista declarada
  - Display elegida con nombre exacto + justificación
  - Cuerpo elegida con nombre exacto + justificación
  - Ambas son de Google Fonts
  - Hay prueba real con un titular y un párrafo
  - El par mantiene contraste sin perder coherencia
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda tipografía habla con acento: las ``neutras'' son las que mejor disimulan su origen.
    aplicacion: |-
      Las tipografías que se nos venden como ``neutras'' (Helvetica, Times) no lo son: vienen de la modernidad europea del siglo XIX y XX. Reconocer eso no es rechazarlas --- es saber qué eliges cuando las usas. Hoy existen tipografías latinoamericanas (Rambla, Andika, Source Sans con caracteres adicionales) y africanas (Source Sans Hebrew, NotoSans para múltiples scripts) que abren la voz visible de la infoesfera.
    pregunta_espejo: |-
      ¿Las tipografías que uso reflejan mi región y mi lengua o solo replican estándares globales? ¿Conozco tipografías hechas en o desde Latinoamérica?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Las letras que duran son las que respetan los gestos antiguos de la mano.
    aplicacion: |-
      Las tipografías humanistas con serifa (Garamond, Caslon) llevan 400 años funcionando porque conservan los gestos del calígrafo medieval. Las fuentes geométricas de moda duran décadas. La sabiduría estoica del tipógrafo: elegir letras que han demostrado durar antes que letras que demuestren novedad.
    pregunta_espejo: |-
      ¿Elijo tipografías porque están de moda o porque tienen historia que demuestre que duran? ¿Qué cambia si priorizo la durabilidad?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La tipografía es la infraestructura cognitiva más invisible y más poderosa de la infoesfera.
    aplicacion: |-
      Cada artículo, cada email, cada notificación que lees está mediada por decisiones tipográficas que alguien tomó. Las decisiones de Helvetica del XX modelaron el siglo de la modernidad. Las decisiones de Inter del XXI están modelando el siglo digital. La tipografía no es decoración --- es infraestructura cognitiva colectiva.
    pregunta_espejo: |-
      ¿Qué tipografías han modelado mi forma de leer sin que lo note? ¿Si pudiera elegirlas yo, qué cambiaría?
compromiso: |-
  \textbf{Para la próxima semana.} Configura el par tipográfico que elegiste en tu próximo trabajo del colegio (puede ser en Google Docs, Word, Figma o Canva). Úsalo durante al menos 3 días. Anota qué notaste --- si te incomodó, si te gustó, si lo cambiarías. El próximo lunes traemos esa bitácora. La elección no es definitiva: puedes ajustarla.

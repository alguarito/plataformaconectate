titulo: Color en editorial --- contraste, jerarquía, accesibilidad
producto_final: |-
  Paleta editorial de 5 colores con código HEX y función declarada (dominante, secundario, acento, fondo, texto), justificada en 3 frases sobre la emoción que transmite a la revista
saber_ancestral_idea: |-
  Las paletas naturales del Valle --- el verde del caf­e, el ocre del sombrero vueltiao, el rojo del achiote, el azul del Pacífico --- son tan ricas y armónicas como cualquier paleta de moda global. Diseñar con paletas locales no es nostalgia: es coherencia visual con el lugar donde se publica.

clave: 2-4
grado: 9
periodo: 2
sesion: 4
completo: true
titulo: Color en editorial --- contraste, jerarquía, accesibilidad
titulo_portada: |-
  Color en editorial ---
  contraste, jerarquía,
  accesibilidad
producto_final: Paleta editorial de 5 colores con código HEX y función declarada (dominante, secundario, acento, fondo, texto), justificada en 3 frases sobre la emoción que transmite a la revista
apertura:
  saber_ancestral: |-
    Las paletas naturales del Valle, el Pacífico y los Andes son ingeniería estética milenaria. El \textbf{verde del café} en la zona cafetera; el \textbf{ocre del sombrero vueltiao}; el \textbf{rojo del achiote} con que se pintaban guerreros y se pintan hoy alimentos; el \textbf{azul del Pacífico} en el horizonte de Buenaventura y Tumaco; el \textbf{negro brillante de las molas guna} con sus contrastes precisos. Cada paleta tradicional fue probada por siglos de uso humano: armoniosa, simbólica, reconocible. La paleta no nació en Pantone --- nació donde la tierra, las plantas y el cielo se miraron juntos.
  origen: Paletas naturales del Valle, sombrero vueltiao, mola guna, Pacífico
  saber_contemporaneo: |-
    Hoy una \textbf{paleta editorial} son 3-5 colores con códigos HEX y \emph{función declarada}: uno dominante, uno secundario, uno o dos acentos, uno de fondo, uno de texto. Cada color cumple un trabajo. Si todos son ``bonitos'' pero ninguno tiene función clara, la paleta se vuelve confusión. Diseñar con paletas locales (Valle, Pacífico) no es nostalgia: es \emph{coherencia visual con el lugar donde publicas}.
  pregunta_puente: |-
    Mira el sombrero vueltiao o una mola guna: ¿qué hace que esos colores combinen perfecto aunque sean intensos? ¿Y qué falla en muchas paletas digitales que parecen ``saturadas'' o ``confusas''?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 5 paletas reales (naturales, tradicionales, comerciales); (2) \textbf{analizar} los 3 principios del color editorial: contraste, jerarquía, accesibilidad; (3) \textbf{aplicar} esos principios a una paleta de 5 colores; (4) \textbf{crear} la paleta editorial de tu revista con función declarada y justificación.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 3 te dio tipografía; hoy le agregas color a tu revista. Con grilla + tipografía + color tienes el \emph{sistema visual mínimo} para diseñar cualquier pieza editorial.
  a_escuta: |-
    Antes de elegir tu paleta, vamos a leer paletas reales que llevan siglos funcionando: la del Valle cafetero, la del Pacífico, la wayuu, la de marcas globales. Cada una tiene lógica detrás.
  a_sistematizacion: |-
    Ya viste paletas reales. Ahora vamos a entender los \textbf{3 principios del color editorial}: contraste (para distinguir), jerarquía (para ordenar la lectura), accesibilidad (para que todos puedan leer). Sin alguno, la paleta puede verse bonita pero falla en función.
  a_praxis: |-
    Tienes el método. Toca elegir: tu paleta editorial de 5 colores para la revista del periodo, con HEX y función declarada para cada uno.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: paleta de 5 colores + justificación. El criterio principal: que cada color tenga función clara y la paleta pase el test de accesibilidad (contraste mínimo).
  a_evaluacion: |-
    Antes de cerrar, mira la elección de color desde las cinco dimensiones humanas. El color no es solo estética: es ciudadanía digital (¿quién puede leer mi sitio?) y soberanía cultural (¿qué paleta heredo o invento?).
  a_triangulo: |-
    Y para terminar, tres voces sobre color. Dussel sobre las paletas colonizadas, Marco Aurelio sobre la sobriedad como elegancia, Floridi sobre el color como infraestructura de la infoesfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 5 paletas reales} (15 min · individual). Busca \textbf{5 paletas distintas}: (a) una \emph{natural} (paisaje de tu región: café, montaña, Pacífico, llanos); (b) una \emph{tradicional} (sombrero vueltiao, mola guna, manta wayuu, sayo del Pacífico); (c) una de \emph{marca global} (Coca-Cola, Spotify, Apple); (d) una de \emph{red social} que usas; (e) una \emph{paleta literaria} (la portada de un libro que te guste). Para cada una: ¿cuántos colores predomina? ¿qué emoción transmite?
  checks:
  - Identifiqué 5 paletas distintas (natural + tradicional + global + redes + literaria).
  - Conté colores principales en cada una.
  - Anoté la emoción que transmite cada paleta.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 5 paletas que comunican». \textbf{Formato:} tabla de 4 columnas (Paleta~|~Colores predominantes~|~Cantidad aprox.~|~Emoción transmitida), 5 filas. \textbf{Sabes que terminaste cuando} reconoces patrones (las paletas fuertes casi nunca usan más de 5 colores; los neón son raros).
sistematizacion:
  intro: |-
    Toda paleta editorial fuerte cumple 3 principios. Vamos a descomponerlos con los pilares del pensamiento computacional para que tu elección sea defendible y no por gusto.
  pilares:
  - |-
    El color editorial se descompone en 3 principios: (1) \textbf{contraste} (los colores deben distinguirse claramente entre sí --- contraste tonal, no solo cromático), (2) \textbf{jerarquía} (un color dominante 60~\%, uno secundario 30~\%, acentos 10~\% para guiar el ojo), (3) \textbf{accesibilidad} (combinaciones que cumplen contraste mínimo WCAG AA para que personas con baja visión o daltonismo puedan leer).
  - |-
    Toda paleta fuerte sigue el patrón \textbf{``regla 60-30-10''}: dominante 60~\% (color principal), secundario 30~\% (apoyo, fondos), acento 10~\% (botones, llamadas a la acción). Cambia las proporciones y la paleta pierde armonía. El acento que ocupa 50~\% deja de ser acento.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿esta combinación se lee bien para alguien con baja visión, daltonismo o pantalla mala?}. Si la respuesta es no, falla aunque sea ``bonita''. El diseño verdaderamente bonito incluye.
  - |-
    Pasos para construir una paleta: (1) define emoción central de tu revista; (2) elige UN dominante; (3) elige UN secundario complementario o análogo; (4) elige 1-2 acentos contrastantes; (5) verifica con webaim.org/resources/contrastchecker que el contraste texto-fondo sea $\geq$ 4.5:1.
  anatomia:
    titulo: Anatomía de una paleta editorial
    body: |-
      \textbf{Color dominante (60~\%):} el color principal de la marca o revista. \\[1mm] \textbf{Color secundario (30~\%):} apoyo del dominante, para fondos secundarios o cuerpos de texto. \\[1mm] \textbf{Acento (10~\%):} botones, llamadas a la acción, destacados. Suele contrastar. \\[1mm] \textbf{Fondo:} casi siempre blanco o muy claro (legibilidad). \\[1mm] \textbf{Texto:} negro o muy oscuro sobre fondo claro. \\[1mm] \textbf{Códigos HEX:} todos anotados con \#HHHHHH para reproducirlos.
  errores_comunes: |-
    (1) Demasiados colores (>5): paleta confusa. (2) Todos con misma saturación: sin jerarquía visual. (3) Texto gris claro sobre fondo blanco: ilegible para muchas personas. (4) Imitar paleta de marca famosa sin entender por qué funciona. (5) Olvidar que el daltonismo afecta al 8~\% de hombres --- combinaciones rojo/verde fallan para ellos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Diagnóstico de paletas reales». \textbf{Formato:} 3 fichas, una por principio (contraste, jerarquía, accesibilidad), cada una con: definición en tus palabras + ejemplo de una de las 5 paletas de la Actividad 1 que lo cumple bien + ejemplo de algo que lo incumple. \textbf{Veredicto:} mira la portada de un libro o revista que tengas a la mano. ¿Aprueba o reprueba los 3 principios? Si reprueba alguno, ¿cuál es el principio incumplido más grave y por qué? Justifica con criterios objetivos (no gusto). \textbf{Sabes que terminaste cuando} puedes diagnosticar problemas de color en cualquier diseño con argumentos verificables.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu paleta editorial} (30 min · individual). Hora de elegir. Vas a construir la paleta de 5 colores para tu revista del periodo, con códigos HEX, función declarada para cada uno, y justificación de 3 frases sobre la emoción que transmite.
  pilares:
  - |-
    Tu paleta se descompone en 5 colores con función: (1) dominante (60~\%, color principal), (2) secundario (30~\%, apoyo), (3) acento 1 (10~\%, llamadas a la acción), (4) fondo (casi siempre blanco o muy claro), (5) texto (casi siempre negro o muy oscuro). Cada uno con su código HEX.
  - |-
    Sigue el patrón \textbf{``natural antes que tendencia''}: tu primera versión puede inspirarse en una paleta natural local (café, mango, achiote, mar Pacífico, cielo del Valle). Eso le da identidad inmediata y evita la trampa de copiar marcas globales.
  - |-
    Cada color expresa una sola función. No hagas que tu acento sirva también de fondo --- elige uno para cada cosa.
  - |-
    Algoritmo: (1) declara emoción central de tu revista; (2) usa coolors.co o pinta a mano 3 paletas candidatas; (3) elige UNA; (4) anota HEX de los 5 colores; (5) declara función para cada uno; (6) verifica contraste texto-fondo en webaim.org; (7) escribe 3 frases de justificación.
  checklist:
    titulo: Checklist antes de cerrar la paleta
    items: |-
      \checkbox 5 colores con código HEX anotado. \\[1mm] \checkbox Función declarada para cada uno (dominante / secundario / acento / fondo / texto). \\[1mm] \checkbox Contraste texto-fondo verificado en webaim.org ($\geq$ 4.5:1). \\[1mm] \checkbox Al menos UN color inspirado en paleta natural o tradicional local. \\[1mm] \checkbox Justificación de 3 frases sobre emoción transmitida. \\[1mm] \checkbox La paleta se siente coherente al pasar la mirada por todos los colores juntos.
  plantilla_guion: |-
    \textbf{Emoción central de mi revista.} \textit{1 palabra.} \\[1mm] \textbf{Mi paleta.} \textit{5 colores con HEX y función.} \\[1mm] \textbf{Inspiración local.} \textit{Qué paleta natural o tradicional inspira uno o más colores.} \\[1mm] \textbf{Justificación.} \textit{3 frases sobre por qué esa paleta sirve a mi revista.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi paleta editorial». \textbf{Formato:} 5 cuadritos pintados o pegados con HEX debajo + función declarada + justificación de 3 frases. \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} puedes defender tu paleta frente a un compañero sin decir ``porque me gusta''.
  producto_titulo: Paleta editorial de 5 colores con HEX, función declarada y justificación
  criterios:
  - 5 colores con código HEX anotado
  - Función declarada para cada uno
  - Contraste texto-fondo verificado en webaim.org ($\geq$ 4.5:1)
  - Al menos 1 color inspirado en paleta natural o tradicional local
  - Justificación de 3 frases sobre emoción transmitida
  - Pasa la prueba del "test del extraño" (sin contexto, transmite la emoción declarada)
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Las paletas que dominan la infoesfera global no son universales --- son culturalmente específicas y se imponen.
    aplicacion: |-
      El blanco minimalista de las marcas tech (Apple, Notion, Linear) viene de la modernidad escandinava del siglo XX. La paleta tropical (verde palmera + azul caribe + naranja sunset) viene del marketing turístico. Cuando eliges paleta sin pensar, eliges una cultura. Atreverte a una paleta que mezcle achiote, ocre y verde café es declarar que tu revista habla desde tu lugar, no desde un genérico global.
    pregunta_espejo: |-
      ¿Mi paleta copia un estándar global (tech minimalista, tropical turístico) o se atreve a una identidad local? ¿Qué precio paga cada elección?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Pocos colores bien elegidos comunican más que muchos colores mal organizados.
    aplicacion: |-
      La tentación del diseñador novato: usar más colores ``para que se vea vivo''. La sabiduría estoica del diseño: 3-5 colores con función clara comunican más que 12 colores sin jerarquía. The Economist usa básicamente 3 colores (rojo, blanco, negro) y lleva 180 años. Apple usa 2 (blanco y gris). Lo sobrio dura.
    pregunta_espejo: |-
      ¿Por qué siento la tentación de agregar más colores cuando algo se ve ``aburrido''? ¿Será que lo aburrido es sobrio bien hecho?
  floridi:
    autor: Luciano Floridi
    cita: |-
      El color es la infraestructura cromática de la infoesfera --- decide quién puede leer y quién queda afuera.
    aplicacion: |-
      Una combinación de colores que tú ves como ``elegante'' puede ser invisible para alguien con daltonismo. Una página gris claro sobre blanco puede ser legible en tu pantalla de 1500\$ pero ilegible en una pantalla de gama básica. Diseñar con accesibilidad es ciudadanía digital: incluyes o excluyes con cada decisión cromática.
    pregunta_espejo: |-
      ¿Mi paleta funciona para alguien con daltonismo? ¿Para alguien que mira mi revista en un celular básico bajo el sol? ¿A quién dejo afuera con mi elección?
compromiso: |-
  \textbf{Para la próxima semana.} Aplica tu paleta a una pieza real esta semana: una hoja de tu cuaderno, una historia de Instagram, un grupo de Whatsapp, un avatar nuevo. Anota qué reacción tuvo (interna o externa). Si nadie comentó nada y a ti te incomodó, ajusta. La paleta no es ley --- es una hipótesis que validas usándola. El próximo lunes traemos esa bitácora.
web:
  resumen: |-
    Eliges paleta de 5 colores con HEX y función declarada para la revista. La paleta no es decoración: define quién puede leer y qué emoción transmite.
  subtema: Diseño editorial digital · Paleta de color
  pre_lectura:
    por_que_importa: |-
      Una paleta editorial no es decoración: decide quién puede leer tu revista (accesibilidad), guía la atención (jerarquía) y transmite emoción antes de leerse. Diseñar con paletas locales no es nostalgia — es coherencia visual con tu lugar.
    pregunta_detonante: Si tu revista fuera una emoción, ¿cuál sería? Y si esa emoción tuviera 5 colores, ¿cuáles?
    activacion:
      titulo: Test de 5 segundos por color
      descripcion: |-
        En 3 minutos, abre coolors.co y mira 3 paletas al azar. Para cada una anota la primera emoción que sentiste (calma, urgencia, ternura, juego, etc.). Esa reacción inmediata es el dato más valioso para diseñar — el color habla antes que cualquier palabra.
      duracion_min: 3
    conexion:
      anterior: En la sesión 3 elegiste tu par tipográfico. Hoy le agregas color al sistema visual.
      siguiente: |-
        En la sesión 5 combinarás todo (grilla + tipografía + color) en 2 spreads dibujados con relación imagen-texto.
  conceptos_clave:
    - termino: Regla 60-30-10
      definicion: |-
        Proporción saludable de una paleta: dominante 60%, secundario 30%, acento 10%. Cambia las proporciones y la armonía se rompe. El acento que ocupa 50% deja de ser acento.
      ejemplo: |-
        Si tu dominante es azul Pacífico y aparece en fondos, títulos y bloques (60%), el secundario crema lo apoya (30%), y el acento naranja achiote llama a la acción (10%).
      emoji: "⚖️"
    - termino: Contraste
      definicion: |-
        Los colores deben distinguirse claramente entre sí. No solo cromático (colores opuestos): también tonal (claro vs oscuro). Sin contraste, todo se ve plano y los elementos se mezclan.
      ejemplo: |-
        Texto negro sobre blanco = contraste máximo. Texto gris claro sobre blanco = contraste insuficiente, ilegible para muchos.
      emoji: "⚫⚪"
    - termino: Jerarquía cromática
      definicion: |-
        Los colores guían el ojo a lo importante. El acento atrae primero, el dominante sostiene el conjunto, el secundario apoya. Sin jerarquía, el ojo no sabe por dónde empezar.
      ejemplo: |-
        En una landing page, el botón "Comprar" suele ser de color acento (naranja, rojo) para destacar sobre fondo neutro. Eso es jerarquía cromática.
      emoji: "🏔"
    - termino: Accesibilidad WCAG AA
      definicion: |-
        Estándar de contraste mínimo texto-fondo para que personas con baja visión o daltonismo puedan leer: ratio ≥ 4.5:1. Verificable en webaim.org/resources/contrastchecker.
      ejemplo: |-
        Texto #333 sobre fondo #FFF tiene contraste 12.6:1 (excelente). Texto #999 sobre fondo #FFF tiene 2.85:1 (insuficiente, falla WCAG AA).
      emoji: "♿"
    - termino: Paleta natural local
      definicion: |-
        Inspirar tu paleta en colores reales de tu región (frutas, paisaje, oficios). Le da identidad inmediata y evita la trampa de copiar marcas globales.
      ejemplo: |-
        Café Valle (#5C3924), Crema (#F5E9D4), Verde plátano (#3B7A3F), Achiote (#C44530), Azul Pacífico (#1B5E7F). Paleta colombiana sin nostalgia.
      emoji: "🌎"
    - termino: HEX
      definicion: |-
        Código de 6 caracteres que identifica un color exacto (ej: #FF6B35). Permite reproducir el color en cualquier herramienta digital. Es el lenguaje universal del color en pantalla.
      ejemplo: |-
        #FFFFFF = blanco puro. #000000 = negro puro. #0066FF = azul brillante. Conocer HEX te permite recrear cualquier color que veas.
      emoji: "#️⃣"
  quiz:
    titulo: "✅ Verifica el oficio del color"
    instrucciones: 5 preguntas para confirmar que dominas la lógica del color editorial. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Qué proporciones tiene la regla 60-30-10?
        opciones:
          - 60% acento, 30% dominante, 10% secundario
          - 60% dominante, 30% secundario, 10% acento
          - 60% texto, 30% fondo, 10% bordes
          - Cualquier proporción funciona
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El dominante sostiene 60% del espacio, el secundario lo apoya con 30%, el acento llama atención puntual con 10%.
        feedback_incorrecto: |-
          Dominante 60, secundario 30, acento 10. Si inviertes y el acento ocupa 60%, deja de ser acento — la jerarquía cromática se rompe.
      - enunciado: ¿Qué ratio de contraste necesita texto-fondo para cumplir WCAG AA?
        opciones:
          - "1:1"
          - 4.5:1 o más
          - 10:1 obligatorio
          - No hay estándar
        respuesta_index: 1
        feedback_correcto: |-
          Sí. WCAG AA exige mínimo 4.5:1 para texto normal. Texto gris claro sobre blanco suele fallar; texto negro sobre blanco lo supera por mucho.
        feedback_incorrecto: |-
          4.5:1 mínimo según WCAG AA. Texto #999 sobre fondo #FFF tiene 2.85:1 — falla. Texto #333 sobre fondo #FFF tiene 12.6:1 — pasa.
      - enunciado: ¿Por qué inspirarse en paletas naturales locales (café, achiote, Pacífico)?
        opciones:
          - Es obligatorio
          - Le da identidad inmediata y evita copiar marcas globales sin pensar
          - Es más barato
          - No tiene ninguna ventaja
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Una paleta colombiana se reconoce sin texto y diferencia tu revista del genérico tech global.
        feedback_incorrecto: |-
          Identidad inmediata + diferenciación. Paleta achiote-café-crema se siente Colombia. Paleta blanco-gris-azul-tech se siente Silicon Valley.
      - enunciado: ¿Qué porcentaje de hombres tiene daltonismo y por qué importa?
        opciones:
          - 0%, no existe el daltonismo
          - 8% — combinaciones rojo/verde fallan para ellos, hay que evitarlas en información crítica
          - 50% — la mayoría
          - No es relevante para diseño
        respuesta_index: 1
        feedback_correcto: |-
          Sí. 8% de hombres tiene daltonismo. Por eso semáforos usan forma + color, no solo color. Tu paleta debe funcionar incluso sin distinguir rojo/verde.
        feedback_incorrecto: |-
          8% de hombres tiene daltonismo. Diseñar con accesibilidad significa usar contraste tonal (claro/oscuro) además de cromático, para no excluir a millones.
      - enunciado: |-
          En el saber ancestral de la mola guna o el sombrero vueltiao, ¿qué aplica directamente a tu paleta digital?
        opciones:
          - Nada — son artesanías, no diseño
          - Que pocos colores bien elegidos comunican identidad fuerte sin ser saturados ni neón
          - Que solo se debe usar blanco y negro
          - Que los colores intensos siempre fallan
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La mola guna usa 3-5 colores intensos en proporciones precisas. El resultado es identidad fuerte sin caos. Mismo principio para tu revista.
        feedback_incorrecto: |-
          Pocos colores bien elegidos > muchos colores mal organizados. La mola guna lo demuestra: 3-5 colores intensos en proporciones precisas = identidad reconocible.
  post_lectura:
    transferencia: |-
      Esta semana aplica tu paleta a una pieza real: una hoja del cuaderno, una historia de Instagram, un grupo de WhatsApp, un avatar nuevo. Anota qué reacción tuvo. La paleta no es ley — es hipótesis que validas usándola.
  cinco_dimensiones:
    personal: |-
      Tomaste la segunda decisión editorial mayor de tu revista — la voz cromática que la acompañará todo el periodo.
    emocional: Distinguiste color como decoración de color como función — y elegiste con criterio, no por gusto.
    ciudadana: "Diseñaste con accesibilidad: tu revista podrá ser leída por personas con baja visión o daltonismo."
    local: |-
      Anclaste tu paleta en colores reales del Valle, el Pacífico, el campo cafetero. Identidad cromática sin copiar Silicon Valley.
    intergeneracional: |-
      Las paletas de la mola guna y el sombrero vueltiao llevan siglos enseñando armonía cromática. Hoy las honras al integrarlas en formato digital.

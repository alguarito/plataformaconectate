clave: 2-4
grado: 9
periodo: 2
sesion: 4
completo: true
duracion_min: 90
titulo: Color en editorial --- contraste, jerarquía, accesibilidad
titulo_portada: |-
  Color en editorial ---
  cinco colores
  con oficio
producto_final: |-
  La paleta de tu revista: cinco colores con su código hexadecimal y su función declarada —dominante, secundario, acento, fondo y texto—, con el contraste entre texto y fondo verificado. Al menos uno viene de una paleta natural o tradicional de tu región. La acompañan tres frases sobre la emoción que transmite, y la prueba de que alguien reconoce esa emoción sin que se la expliques.
apertura:
  origen: El tul nasa · plantas frías, calientes, dulces y bravas
  fuente: |-
    Prieto Novoa, F. N. y León-Sicard, T. E. (2024). Actores y redes en la configuración del agroecosistema Tul Nasa en los resguardos indígenas de Toribío, Tacueyó y San Francisco en el departamento del Cauca, Colombia. \emph{Luna Azul}, (59), 53--77.
  saber_ancestral: |-
    En los resguardos nasa de Toribío, Tacueyó y San Francisco, en el Cauca, la huerta familiar se llama \textbf{tul}. Y no se siembra al azar. Las plantas pertenecen a categorías: \textbf{frías, calientes, dulces y bravas}. Cada una entra en una de ellas y se siembra según eso, para mantener el equilibrio del conjunto. La guía se queda ahí a propósito: cita la clasificación, no explica cómo funciona por dentro, porque eso no le corresponde. Lo que sí sirve para hoy es la forma. Es una \textbf{lista cerrada de categorías} donde cada elemento tiene un lugar y una función, y donde meter cualquier cosa rompe el equilibrio de todo. Una paleta editorial es exactamente eso. La \textbf{cara de exclusión}: el estudio reporta que solo el 43~\% de las familias mantiene el tul. Lo erosionan la escuela foránea, las tecnologías agrícolas modernas y los cultivos ilícitos.
  saber_contemporaneo: |-
    Una paleta editorial se sostiene sobre tres principios. \textbf{Contraste}: los colores deben distinguirse entre sí por tono y no solo por matiz, porque quien ve en escala de grises también tiene que poder separarlos. \textbf{Jerarquía}: el color señala qué es principal y qué es secundario, y por eso no puede haber cinco colores gritando a la vez. \textbf{Accesibilidad}: el texto sobre su fondo necesita un contraste suficiente, y ninguna información puede ir solo por color. Para repartirlos sirve una proporción sencilla: alrededor del sesenta por ciento para el dominante, treinta para el secundario y diez para el acento. Cinco colores bastan y cada uno tiene un oficio: dominante, secundario, acento, fondo y texto. Un color sin función declarada es un color que en algún momento va a estorbar.
  pregunta_puente: |-
    En el tul cada planta pertenece a una categoría y se siembra según ella. En tu paleta, ¿qué hace cada color, y qué pasaría si le pusieras uno más?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué hace el color en paletas reales, naturales, tradicionales y de marca; (2) \textbf{explicar} contraste, jerarquía y accesibilidad, y cómo se reparten cinco colores; (3) \textbf{crear} la paleta de tu revista con función declarada y contraste verificado.
puentes:
  a_ruta: |-
    En la sesión 2 armaste la cuadrícula y en la 3 elegiste la voz tipográfica. El color es la tercera decisión del sistema visual, y con ella queda completo. En la sesión 5 lo aplicas al diálogo entre imagen y texto.
  a_escuta: |-
    Antes de la teoría vas a mirar cinco paletas que ya existen y contar cuántos colores usan de verdad. Casi siempre son menos de los que parecen.
  a_sistematizacion: |-
    Ya las miraste. Ahora vas a nombrar los tres principios y a repartir los cinco colores por función.
  a_praxis: |-
    Tienes el criterio. Toca construir tu paleta, verificar el contraste y probar si transmite lo que dices que transmite.
  a_producto: |-
    Lo que entregas hoy: cinco colores con código, función y contraste verificado. La prueba de calidad: alguien reconoce la emoción sin que se la nombres.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. El color decide el tono de una pieza antes de que se lea una sola palabra, y también decide quién puede leerla.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre elegir con criterio propio: Dussel sobre el hetero-diseño, Marco Aurelio sobre lo superfluo, Floridi sobre configuraciones que respeten la atención.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Cinco paletas reales} (15 min · individual). (1) Reúne cinco paletas de sitios distintos. Una natural, de un paisaje de tu región. Una tradicional, de una pieza artesanal. Una de una marca conocida. Una de una revista. Una de una aplicación que uses. (2) Anota cuántos colores usa cada una de verdad, contando solo los que se repiten. (3) Anota cuál domina en cada una. (4) Mira las cinco en escala de grises y marca en cuál se pierde información.
  checks:
  - Tengo cinco paletas de sitios distintos.
  - Conté cuántos colores usa cada una de verdad.
  - Marqué en cuál se pierde información en escala de grises.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Cinco paletas reales». \textbf{Formato:} tabla de 5 filas y 3 columnas (de dónde es / cuántos colores usa / cuál domina), con marca en la que falla en grises. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} ninguna fila dice «muchos» en la columna del conteo.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Tres principios y cinco funciones} (20 min · parejas). (1) Con tu pareja, escriban los tres principios con una frase propia cada uno. (2) Escriban las cinco funciones y qué hace cada una. (3) Asignen función a los colores de una de sus paletas y vean si sobra alguno. (4) Busquen en sus ejemplos un caso donde la información vaya solo por color y escriban cómo lo arreglarían.
  pilares:
  - |-
    \textbf{Contraste que sobreviva al gris.} Dos colores distintos pueden tener el mismo tono y volverse el mismo en escala de grises. Si tu jerarquía depende solo del matiz, desaparece para mucha gente y también en una fotocopia.
  - |-
    \textbf{Cinco colores, cinco oficios.} Dominante, secundario, acento, fondo y texto. Un color sin función declarada es un color que en algún momento va a estorbar, porque nadie sabrá cuándo usarlo.
  - |-
    \textbf{La proporción importa más que la selección.} Alrededor de sesenta, treinta y diez. El acento funciona porque es escaso: si lo usas en todo, deja de acentuar y se convierte en ruido.
  - |-
    \textbf{Nunca solo por color.} Si el rojo significa una cosa y el verde otra, hace falta una segunda marca: una forma, un símbolo o una palabra. Es la regla que más se olvida y la más fácil de cumplir.
  anatomia:
    titulo: Cinco colores con oficio
    body: |-
      \textbf{Dominante:} el que manda, alrededor del 60~\%. \\[1mm] \textbf{Secundario:} apoya y hace fondos, 30~\%. \\[1mm] \textbf{Acento:} destaca lo poco, 10~\%. \\[1mm] \textbf{Fondo y texto:} contraste suficiente entre los dos. \\[1mm] \textbf{Prueba:} ¿sobrevive en escala de grises?
  errores_comunes: |-
    (1) \textbf{Elegir colores sin función}: no se sabe cuándo usar cada uno y aparecen todos a la vez. (2) \textbf{Contraste solo de matiz}: se pierde en grises y para quien no distingue ciertos colores. (3) \textbf{Usar el acento en todo}: deja de acentuar. (4) \textbf{Texto gris claro sobre blanco}: se ve elegante en pantalla y desaparece bajo el sol. (5) \textbf{Copiar una paleta sin adaptarla}: los colores de una marca extranjera cargan un contexto que no es el de tu revista.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Tres principios y cinco funciones». \textbf{Formato:} los tres principios con frase propia, las cinco funciones, una paleta con función asignada y el caso de información solo por color con su arreglo. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} saben si en la paleta que analizaron sobra algún color.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu paleta editorial} (30 min · individual). (1) Escribe la emoción central de tu revista, la misma que declaraste con la tipografía. (2) Elige el color dominante y anota su código hexadecimal. (3) Elige el secundario y el acento, con sus códigos. (4) Define fondo y texto, y verifica que el contraste entre los dos sea suficiente. (5) Comprueba que al menos uno de los cinco venga de una paleta natural o tradicional de tu región. (6) Enséñale la paleta a un compañero sin decirle nada y pregúntale qué emoción le transmite.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} Los cinco colores con código y función. El contraste de texto y fondo verificado. Y las tres frases sobre la emoción, más lo que dijo tu compañero.
  - |-
    \textbf{El código hexadecimal es obligatorio.} «Un azul oscuro» no se puede reproducir. El código sí, y va a tu bitácora del periodo junto a los nombres de las tipografías.
  - |-
    \textbf{Uno de los cinco viene de aquí.} De un paisaje, de una pieza artesanal, de una fachada de tu calle. No por folclor, sino porque obliga a mirar el color en el sitio donde vives en vez de en un catálogo.
  - |-
    \textbf{La prueba del desconocido.} Si tu compañero nombra una emoción parecida a la que declaraste, la paleta funciona. Si nombra otra, no está mal: significa que la paleta habla, solo que dice algo distinto de lo que creías.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Cinco colores con su código hexadecimal. \\[1mm] \checkbox Función declarada para cada uno. \\[1mm] \checkbox Contraste entre texto y fondo verificado. \\[1mm] \checkbox Al menos uno viene de una paleta natural o tradicional local. \\[1mm] \checkbox Tres frases sobre la emoción que transmite. \\[1mm] \checkbox Un compañero nombró una emoción al verla sin explicación.
  plantilla_guion: |-
    \textbf{Emoción.} \textit{La misma que la tipografía.} \\[1mm] \textbf{Dominante.} \textit{Código y por qué.} \\[1mm] \textbf{Secundario y acento.} \textit{Códigos y su papel.} \\[1mm] \textbf{Fondo y texto.} \textit{Contraste verificado.} \\[1mm] \textbf{Local.} \textit{Cuál de los cinco y de dónde salió.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Tu paleta editorial». \textbf{Formato:} los cinco colores con su código y su función, la verificación del contraste, las tres frases de la emoción y lo que dijo tu compañero. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} los cinco códigos están anotados y el contraste verificado.
  producto_titulo: Paleta de cinco colores con código, función declarada y contraste verificado
  criterios:
  - Los cinco colores tienen código hexadecimal anotado
  - Cada uno tiene su función declarada, sin colores sobrantes
  - El contraste entre texto y fondo está verificado
  - Al menos un color viene de una paleta natural o tradicional local
  - Un compañero nombró una emoción al ver la paleta sin explicación
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.3.8.1
    cita: |-
      Las naciones dependientes y explotadas contemplan en su suelo la contradictoria existencia de un hetero-diseño; de una imitación inadecuada de diversas tecnologías… La negación de la cultura popular niega igualmente su técnica.
    aplicacion: |-
      Copiar la paleta de una marca extranjera es cómodo y trae su contexto encima. Sacar un color del paisaje o de una pieza de tu región obliga a mirar dónde vives, que es más difícil y da un resultado que no tiene nadie más.
    pregunta_espejo: |-
      ¿De dónde saqué los colores que uso, y me pareció normal que vinieran de allí?
  estoico:
    autor: Marco Aurelio · Meditaciones V, 5 (c. 175 d.C.)
    cita: |-
      Muestra entonces las cualidades que están enteramente en tu poder: sinceridad, seriedad, resistencia en el trabajo, contento con lo que te toca, benevolencia, franqueza, ninguna afición a lo superfluo. (trad. propia)
    aplicacion: |-
      «Ninguna afición a lo superfluo» describe una paleta bien hecha. Cinco colores con oficio rinden más que doce sin él, y el acento funciona solo porque es escaso.
    pregunta_espejo: |-
      ¿Qué color de mi paleta no sabría decir cuándo se usa?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6
    cita: |-
      Las configuraciones por defecto y otros aspectos del diseño de nuestras tecnologías deberían respetar y proteger las capacidades atencionales. (trad. propia)
    aplicacion: |-
      Un contraste bajo obliga a quien lee a poner de su parte, y esa parte se la estás cobrando sin avisar. Verificar el contraste no es un trámite técnico: es decidir cuánto esfuerzo le pides a alguien por leerte.
    pregunta_espejo: |-
      ¿Cuánto esfuerzo le estoy pidiendo a quien lea mi revista, y lo decidí yo o salió así?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con los cinco códigos anotados y el contraste verificado. Fotografía un paisaje o una fachada de tu barrio y sácale tres colores. En la sesión 5 trabajas el diálogo entre imagen y texto con este sistema ya completo.
web:
  resumen: |-
    En el tul nasa las plantas pertenecen a categorías —frías, calientes, dulces y bravas— y cada una se siembra según la suya para mantener el equilibrio. Una paleta editorial funciona igual: una lista cerrada donde cada color tiene un oficio. Hoy construyes la tuya con cinco colores, contraste verificado y al menos uno sacado de donde vives.
  subtema: Diseño editorial digital · Paleta de color
  pre_lectura:
    por_que_importa: |-
      Un color sin función declarada es un color que en algún momento va a estorbar, porque nadie sabrá cuándo usarlo.
    pregunta_detonante: |-
      ¿Qué colores tiene el paisaje o la calle que ves todos los días, y podrías nombrar tres?
    activacion:
      titulo: En escala de grises
      descripcion: |-
        En 2 minutos, mira una imagen a color y después imagínala en grises. ¿Qué información se pierde al quitarle el color?
      duracion_min: 3
    conexion:
      anterior: En la sesión 3 elegiste el par tipográfico que le da voz a tu revista.
      siguiente: En la sesión 5 trabajas el diálogo entre imagen y texto con el sistema visual completo.
  mapa_ruta:
    - numero: 1
      iconos: ["🌱"]
      titulo: Cada planta en su categoría
      duracion_min: 10
    - numero: 2
      iconos: ["👁"]
      titulo: Actividad 1 · Cinco paletas reales
      duracion_min: 15
    - numero: 3
      iconos: ["📖"]
      titulo: Actividad 2 · Tres principios y cinco funciones
      duracion_min: 20
    - numero: 4
      iconos: ["✏️"]
      titulo: Actividad 3 · Tu paleta editorial
      duracion_min: 30
    - numero: 5
      iconos: ["✅", "💭"]
      titulo: Verifica, tres citas y tu compromiso
      duracion_min: 15
  actividades:
    - numero: 1
      verbo: IDENTIFICA
      titulo: Cinco paletas reales
      tiempo_min: 15
      modalidad: individual
      pasos:
        - "Reúne cinco paletas: una natural, una tradicional, una de marca, una de revista y una de aplicación."
        - Anota cuántos colores usa cada una de verdad, contando solo los que se repiten.
        - Anota cuál domina en cada una.
        - Mira las cinco en escala de grises.
        - Marca en cuál se pierde información al quitar el color.
      cuaderno:
        titulo: Cinco paletas reales
        formato: tabla de 5 filas y 3 columnas (de dónde es / cuántos colores usa / cuál domina)
        extension: un tercio de página
      criterios:
        - Ninguna fila dice «muchos» en la columna del conteo.
        - Está marcada la paleta que falla en escala de grises.
    - numero: 2
      verbo: EXPLICA
      titulo: Tres principios y cinco funciones
      tiempo_min: 20
      modalidad: parejas
      pasos:
        - Con tu pareja, escriban los tres principios con una frase propia cada uno.
        - Escriban las cinco funciones y qué hace cada una.
        - Asignen función a los colores de una de sus paletas y vean si sobra alguno.
        - Busquen un caso donde la información vaya solo por color y escriban cómo lo arreglarían.
      cuaderno:
        titulo: Tres principios y cinco funciones
        formato: los tres principios con frase propia, las cinco funciones y una paleta con función asignada
        extension: media página
      criterios:
        - Queda dicho si en la paleta analizada sobra algún color.
        - El caso de información solo por color tiene su arreglo escrito.
    - numero: 3
      verbo: CREA
      titulo: Tu paleta editorial
      tiempo_min: 30
      modalidad: individual
      pasos:
        - Escribe la emoción central de tu revista, la misma que declaraste con la tipografía.
        - Elige dominante, secundario y acento, cada uno con su código hexadecimal.
        - Define fondo y texto, y verifica que el contraste entre los dos sea suficiente.
        - Comprueba que al menos uno venga de una paleta natural o tradicional de tu región.
        - Enséñale la paleta a un compañero y pregúntale qué emoción le transmite.
      cuaderno:
        titulo: Tu paleta editorial
        formato: los cinco colores con código y función, la verificación del contraste y las tres frases de la emoción
        extension: media página
      criterios:
        - Los cinco códigos están anotados y el contraste verificado.
        - Un compañero nombró una emoción sin que se la explicaran.
  conceptos_clave:
    - categoria: Los tres principios
      termino: Contraste tonal
      definicion: |-
        La diferencia de claridad entre dos colores, no solo de matiz. Es la que sobrevive en escala de grises.
      ejemplo: Dos colores muy distintos pueden volverse el mismo gris, y ahí se pierde la jerarquía.
    - categoria: Los tres principios
      termino: Información solo por color
      definicion: Cuando el único indicio de algo es el color, y por tanto desaparece para quien no lo distingue.
      ejemplo: Si el rojo significa una cosa, hace falta además una forma, un símbolo o una palabra.
    - categoria: Las cinco funciones
      termino: Color de acento
      definicion: |-
        El que destaca lo poco importante de verdad. Funciona porque es escaso: alrededor del diez por ciento.
      ejemplo: Usado en todo deja de acentuar y se convierte en ruido visual.
    - categoria: Las cinco funciones
      termino: Función declarada
      definicion: Decir para qué sirve cada color de la paleta, para saber cuándo se usa y cuándo no.
      ejemplo: Un color sin función acaba apareciendo en cualquier parte, y nadie sabe explicar por qué está.
    - categoria: De dónde salen
      termino: Lista cerrada de categorías
      definicion: |-
        Un conjunto fijo donde cada elemento tiene su lugar, y donde meter algo fuera de la lista rompe el equilibrio.
      ejemplo: En el tul nasa las plantas son frías, calientes, dulces o bravas, y se siembran según eso.
  cinco_dimensiones:
    personal: Elegiste cinco colores y sabes decir qué hace cada uno, que es más difícil que elegir doce.
    emocional: "Que tu compañero nombre otra emoción no es un fracaso: es información sobre lo que tu paleta dice de verdad."
    ciudadana: Verificar el contraste decide cuánto esfuerzo le pides a alguien por leerte, y quién queda fuera.
    local: Sacar un color de una fachada de tu calle da un resultado que no tiene ninguna marca del mundo.
    intergeneracional: El tul organiza una huerta con cuatro categorías y funciona hace generaciones. Las listas cerradas no son un invento del diseño.
  post_lectura:
    reflexion: |-
      ¿Qué emoción nombró tu compañero, y si fue distinta de la tuya, qué color crees que la desvió?
    transferencia: |-
      Fotografía un paisaje o una fachada de tu barrio y sácale tres colores con su código. Casi nunca coinciden con los del catálogo.
    cierre: Cada planta del tul tiene su categoría y su lugar. Cinco colores con oficio rinden más que doce sin él.
  quiz:
    titulo: ¿Sabes armar una paleta que funcione?
    instrucciones: Cinco preguntas sobre contraste, funciones y accesibilidad del color. No va al cuaderno.
    preguntas:
      - enunciado: ¿Por qué conviene mirar una paleta en escala de grises?
        opciones:
          - Para comprobar cómo se verá si se imprime en blanco y negro.
          - Para ver si el contraste depende solo del matiz y se pierde.
          - Para ahorrar tinta al imprimir las pruebas del diseño.
          - Para comparar la paleta con las de otras revistas del mismo tema.
        respuesta_index: 1
        feedback_correcto: Sí. Dos colores muy distintos pueden volverse el mismo gris, y ahí desaparece la jerarquía.
        feedback_incorrecto: Para ver si el contraste sobrevive sin el color. Si depende del matiz, se pierde para mucha gente.
      - enunciado: Usas el color de acento en casi toda la revista. ¿Qué ocurre?
        opciones:
          - Deja de acentuar y se convierte en ruido.
          - Refuerza la identidad visual de la publicación.
          - Mejora la coherencia entre las distintas páginas.
          - Facilita que el lector recuerde la marca de la revista.
        respuesta_index: 0
        feedback_correcto: Correcto. El acento funciona precisamente porque es escaso.
        feedback_incorrecto: Deja de acentuar. Si todo está destacado, no hay nada destacado.
      - enunciado: ¿Cómo se clasifican las plantas en el tul nasa?
        opciones:
          - Por su altura y por el tiempo que tardan en crecer.
          - Por el color de sus flores y de sus frutos maduros.
          - Como frías, calientes, dulces o bravas.
          - Según la estación del año en que se siembran.
        respuesta_index: 2
        feedback_correcto: Eso es. Cada planta entra en una categoría y se siembra según ella.
        feedback_incorrecto: Frías, calientes, dulces o bravas. Es una lista cerrada donde cada una tiene su lugar.
      - enunciado: Tu gráfico distingue dos estados solo con rojo y verde. ¿Qué le falta?
        opciones:
          - Aumentar la saturación de los dos colores usados.
          - Añadir una leyenda en la esquina de la página.
          - Cambiar a una pareja de colores más contrastada.
          - "Una segunda marca: una forma, un símbolo o una palabra."
        respuesta_index: 3
        feedback_correcto: Sí. Es la regla que más se olvida y la más fácil de cumplir.
        feedback_incorrecto: Una segunda marca además del color. Con solo color, esa información no llega a todos.
      - enunciado: ¿Por qué se anota el código hexadecimal y no el nombre del color?
        opciones:
          - Porque «un azul oscuro» no se puede reproducir con exactitud.
          - Porque los nombres de color cambian según el idioma.
          - Porque el código ocupa menos espacio en la bitácora.
          - Porque los programas de diseño no aceptan nombres.
        respuesta_index: 0
        feedback_correcto: Correcto, y por eso el código va a la bitácora junto a los nombres de las tipografías.
        feedback_incorrecto: Porque el nombre no se puede reproducir. El código sí, exactamente.

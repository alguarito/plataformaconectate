clave: 2-5
grado: 9
periodo: 2
sesion: 5
completo: true
duracion_min: 90
titulo: Imagen y texto --- el ritmo de la lectura
titulo_portada: |-
  Imagen y texto ---
  quién habla
  primero
producto_final: |-
  Dos páginas dobles de tu revista dibujadas a mano en hojas A4 horizontales, con la cuadrícula trazada a lápiz suave, la imagen ubicada, un titular real y el cuerpo simulado. Cada una aplica el par tipográfico y la paleta que ya definiste, y declara qué relación tienen la imagen y el texto: si se refuerzan, si contrastan o si cuentan una secuencia.
apertura:
  origen: La tulpa en los pueblos del Cauca · se llega a estar y a oír
  fuente: |-
    Tejido de Comunicación ACIN. (2018, 17 de agosto). \emph{Alrededor de la tulpa como principio de la comunicación ancestral, inició el diálogo con los pares académicos de la UAIIN-CRIC}. Çxhab Wala Kiwe.
  saber_ancestral: |-
    En los pueblos del Cauca hay un lugar donde se aprende a escuchar: la \textbf{tulpa}, el fogón de tres piedras en el centro de la casa. El Tejido de Comunicación de la ACIN recoge la explicación de los mayores kiwe the del resguardo de Toez, en Caloto: «las tres piedras que forman la tulpa son traídas con todos los análisis espirituales de los mayores… es aquí donde está la comunicación propia» (2018). Cuatro comuneros del pueblo kokonuko lo cuentan igual en la revista del CRIC: alrededor del fogón, de noche y después de comer, los abuelos contaban historias a hijos y nietos. Fíjate en el detalle. Nadie llegaba allí a hablar: se llegaba a estar y a oír. La \textbf{cara de exclusión}: la tulpa es también un espacio de trabajo doméstico repartido de forma desigual, y el CRIC usa el nombre para sus espacios políticos. Es institución de gobierno, no una técnica de aula.
  saber_contemporaneo: |-
    En una página doble, la imagen y el texto tienen que turnarse. Si los dos gritan a la vez, el lector no oye a ninguno. Hay tres relaciones posibles y conviene elegir una a propósito. \textbf{Refuerzo}: los dos dicen lo mismo por canales distintos, y sirve cuando el mensaje debe quedar claro sin margen de duda. \textbf{Contraste}: la imagen dice algo que el texto matiza o contradice, y sirve para hacer pensar. \textbf{Secuencia}: la imagen empieza la historia y el texto la continúa, o al revés. Y hay un patrón que ordena casi cualquier composición: la imagen captura y el texto profundiza. El ojo entra por la imagen porque no necesita descifrarla, y la mente sigue por el texto. Por eso la pregunta que resuelve un spread es siempre la misma: qué quiero que vea primero, qué después y qué no necesita mirar.
  pregunta_puente: |-
    A la tulpa se llega a estar y a oír, no a hablar encima del otro. En tu página doble, ¿quién habla primero y quién espera su turno?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué relación tienen imagen y texto en páginas dobles reales; (2) \textbf{explicar} las tres relaciones y el patrón de la imagen que captura y el texto que profundiza; (3) \textbf{crear} dos páginas dobles a mano con tu sistema visual y la relación declarada en cada una.
puentes:
  a_ruta: |-
    Ya tienes cuadrícula, tipografía y paleta. Hoy los pones a trabajar juntos en una página doble, que es la unidad real de una revista. En la sesión 6 llevas todo esto a una herramienta digital.
  a_escuta: |-
    Antes de la teoría vas a mirar tres páginas dobles reales y a fijarte en qué miraste primero. Esa primera mirada es la que el diseñador quiso o no consiguió.
  a_sistematizacion: |-
    Ya lo viste. Ahora vas a nombrar las tres relaciones posibles y a decidir cuál usa cada spread tuyo.
  a_praxis: |-
    Tienes el criterio. Toca dibujar dos páginas dobles a mano, con la cuadrícula visible y la relación declarada.
  a_producto: |-
    Lo que entregas hoy: dos páginas dobles dibujadas. La prueba de calidad: un compañero dice qué miró primero y coincide con lo que querías.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Quien diseña decide el turno de palabra entre una foto y un párrafo, y casi nunca lo dice en voz alta.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre escuchar y esperar el turno: Dussel sobre el silencio del que todo tiene que escuchar, Marco Aurelio sobre atender a lo que dice el otro, Floridi sobre la atención como bien escaso.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tres páginas dobles reales} (15 min · individual). (1) Busca tres páginas dobles: una de periódico, una de revista y una de un libro ilustrado o un catálogo. (2) Mira cada una durante cinco segundos y anota qué miraste primero. (3) Anota qué miraste después. (4) Escribe si la imagen y el texto dicen lo mismo, se contradicen o se continúan. (5) Marca en cuál compiten entre sí y explica en una línea cómo lo notaste.
  checks:
  - Tengo las tres con qué miré primero y qué después.
  - Escribí qué relación tienen imagen y texto en cada una.
  - Marqué en cuál compiten y expliqué cómo lo noté.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Tres páginas dobles reales». \textbf{Formato:} tabla de 3 filas y 4 columnas (pieza / qué miré primero / qué después / relación entre imagen y texto), con marca en la que compiten. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las tres filas tienen nombrada su relación.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Las tres relaciones} (20 min · parejas). (1) Con tu pareja, escriban las tres relaciones con una frase propia cada una. (2) Clasifiquen sus seis piezas. (3) Tomen la que compite y escriban qué cambiarían para que uno de los dos ceda el turno. (4) Escriban en dos líneas para qué sirve cada relación, es decir, cuándo conviene usarla.
  pilares:
  - |-
    \textbf{Las tres relaciones.} Refuerzo: los dos dicen lo mismo por canales distintos. Contraste: la imagen dice algo que el texto matiza. Secuencia: uno empieza la historia y el otro la continúa.
  - |-
    \textbf{La imagen captura, el texto profundiza.} El ojo entra por la imagen porque no hay que descifrarla, y la mente sigue por el texto. Cuando el titular es tan grande que compite con la foto, el lector no sabe por dónde empezar.
  - |-
    \textbf{Si los dos dicen exactamente lo mismo, uno sobra.} El refuerzo sirve cuando el mensaje no admite dudas, pero repetir por repetir desperdicia media página. La foto debería aportar lo que el texto no puede decir.
  - |-
    \textbf{Turnarse no es un adorno.} A la tulpa se llega a estar y a oír. Una página doble donde todo grita a la vez es una conversación donde nadie escucha, y el lector se va sin haber entendido nada.
  anatomia:
    titulo: Imagen y texto, en una mirada
    body: |-
      \textbf{Refuerzo:} lo mismo por dos canales. \\[1mm] \textbf{Contraste:} la imagen dice, el texto matiza. \\[1mm] \textbf{Secuencia:} uno empieza, el otro sigue. \\[1mm] \textbf{Patrón:} la imagen captura, el texto profundiza. \\[1mm] \textbf{Pregunta:} ¿qué se mira primero y qué después?
  errores_comunes: |-
    (1) \textbf{Titular e imagen del mismo peso}: compiten y el lector no sabe por dónde entrar. (2) \textbf{Foto que repite el titular}: se pierde media página diciendo dos veces lo mismo. (3) \textbf{Texto pegado al borde de la imagen}: sin aire entre los dos, se leen como una sola mancha. (4) \textbf{No declarar la relación}: si tú no sabes cuál usaste, el lector tampoco. (5) \textbf{Llenar los dos lados por igual}: una página doble no tiene que ser simétrica para estar equilibrada.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Las tres relaciones». \textbf{Formato:} las tres con frase propia, las seis piezas clasificadas, el arreglo de la que compite y las dos líneas sobre cuándo conviene cada relación. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} la pieza que competía tiene escrito qué cede el turno.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Dos páginas dobles} (30 min · individual). (1) Toma dos hojas A4 horizontales y traza en cada una la cuadrícula a lápiz suave. (2) Decide para cada spread qué historia cuenta y qué relación tendrán imagen y texto. (3) Ubica la imagen y escribe el titular real con tu tipografía display. (4) Simula el cuerpo con líneas, respetando la mancha y el aire. (5) Aplica la paleta señalando dónde va cada color. (6) Enséñaselos a un compañero cinco segundos cada uno y anota qué dice que miró primero.
  pilares:
  - |-
    \textbf{Tu entrega son dos spreads y una prueba.} Los dos dibujados con cuadrícula visible, relación declarada y sistema visual aplicado. Y lo que dijo tu compañero después de cinco segundos.
  - |-
    \textbf{Las dos relaciones tienen que ser distintas.} Dos spreads de refuerzo son el mismo ejercicio dos veces. Prueba uno de refuerzo y otro de contraste o secuencia, que es donde se aprende.
  - |-
    \textbf{El titular va escrito de verdad.} El cuerpo se puede simular con líneas, pero el titular no: es la pieza que decide el peso visual y hay que verlo con sus palabras reales y su tipografía.
  - |-
    \textbf{Cinco segundos bastan para la prueba.} Nadie mira una página doble más tiempo antes de decidir si sigue. Si en cinco segundos tu compañero mira lo que no querías, hay que mover algo.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Dos hojas A4 horizontales con la cuadrícula a lápiz suave. \\[1mm] \checkbox Imagen ubicada y titular escrito con la tipografía display. \\[1mm] \checkbox Cuerpo simulado respetando la mancha y el aire. \\[1mm] \checkbox Paleta señalada, con la función de cada color. \\[1mm] \checkbox Relación declarada en cada spread, y distintas entre sí. \\[1mm] \checkbox Un compañero dijo qué miró primero en cada uno.
  plantilla_guion: |-
    \textbf{Historia.} \textit{Qué cuenta este spread.} \\[1mm] \textbf{Relación.} \textit{Refuerzo, contraste o secuencia.} \\[1mm] \textbf{Entrada.} \textit{Qué quiero que se mire primero.} \\[1mm] \textbf{Sistema.} \textit{Cuadrícula, tipografía y colores aplicados.} \\[1mm] \textbf{Prueba.} \textit{Qué miró primero mi compañero.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Dos páginas dobles». \textbf{Formato:} los dos bocetos con su relación declarada y la nota de qué miró primero tu compañero en cada uno. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} en al menos uno coincidió lo que miró con lo que querías.
  producto_titulo: Dos páginas dobles dibujadas con relación imagen-texto declarada
  criterios:
  - Los dos spreads están en A4 horizontal con la cuadrícula visible a lápiz
  - La imagen está ubicada y el titular escrito con la tipografía display
  - Se aplican el par tipográfico y la paleta de las sesiones anteriores
  - Cada spread declara su relación y las dos son distintas entre sí
  - Un compañero dijo qué miró primero y coincidió al menos en uno
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.3
    cita: |-
      El respeto es silencio, pero no silencio del que nada tiene que decir, sino del que todo tiene que escuchar porque nada sabe del otro como otro.
    aplicacion: |-
      En una página doble, el silencio es el espacio en blanco y el elemento que cede el turno. Que el texto calle un momento para que la imagen hable no es debilidad del texto: es lo que permite que después se le oiga.
    pregunta_espejo: |-
      ¿Qué elemento de mi spread no está dispuesto a callarse ni un segundo?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 53 (c. 175 d.C.)
    cita: |-
      Acostúmbrate a estar con atención a lo que dice el otro, y en cuanto te sea posible intérnate dentro del alma del que hablare contigo.
    aplicacion: |-
      Diseñar una página doble es imaginar a alguien que todavía no la ha visto. Los cinco segundos de la prueba sirven para eso: para dejar de mirar tu spread como quien lo hizo y mirarlo como quien llega.
    pregunta_espejo: |-
      ¿Estoy mirando mi página como el que la hizo o como el que va a llegar a ella?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6
    cita: |-
      Afirmamos que las capacidades atencionales son un bien finito, precioso y escaso. (trad. propia)
    aplicacion: |-
      Por eso el turno importa. Si la imagen y el titular piden atención a la vez, el lector gasta la suya decidiendo dónde mirar en vez de entendiendo. Ordenar la entrada es devolverle ese esfuerzo.
    pregunta_espejo: |-
      ¿Cuánta atención le cuesta a alguien decidir por dónde entrar a mi página?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con los dos spreads dibujados y con lo que dijo tu compañero. Mira una página doble cualquiera durante cinco segundos y anota qué recuerdas después. En la sesión 6 llevas todo esto a una herramienta digital.
web:
  resumen: |-
    En los pueblos del Cauca la tulpa, el fogón de tres piedras, es el lugar donde se aprende a escuchar: nadie llega allí a hablar, se llega a estar y a oír. En una página doble pasa lo mismo. Si la imagen y el texto gritan a la vez, el lector no oye a ninguno. Hoy decides quién habla primero.
  subtema: Diseño editorial digital · Composición visual
  pre_lectura:
    por_que_importa: |-
      Nadie mira una página doble más de cinco segundos antes de decidir si sigue. En esos cinco segundos se juega todo el trabajo.
    pregunta_detonante: |-
      De la última revista que hojeaste, ¿qué recuerdas: una foto o una frase?
    activacion:
      titulo: Cinco segundos

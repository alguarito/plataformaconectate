clave: 2-5
grado: 9
periodo: 2
sesion: 5
completo: true
titulo: Imagen y texto --- el ritmo de la lectura
titulo_portada: |-
  Imagen y texto ---
  el ritmo
  de la lectura
producto_final: 2 spreads (páginas dobles) de la revista diseñados a mano con foto + texto coherentes, donde la imagen y el texto se ayudan en vez de competir
apertura:
  saber_ancestral: |-
    Mucho antes de las revistas, los \textbf{petroglifos de los pueblos Calima} (norte del Valle del Cauca, siglos II a XII) combinaban imagen y símbolo en piedra: cada figura ocupaba un lugar exacto en la roca, y el orden de los grabados narraba un ritual sin texto. Siglos después, en las \textbf{revistas y periódicos ilustrados del Valle del siglo XX} (El País de Cali, El Pueblo, La Pajarera) la foto no acompañaba al texto: \emph{contaba parte de la historia}. Una foto del campesino con su cosecha decía lo que tres párrafos no decían. Un retrato de la abuela con el niño en brazos era el subtítulo emocional del artículo. Esa tradición --- que el lector quede atrapado primero por la imagen y después siga al texto --- es el principio editorial más antiguo y más eficaz que existe: \textbf{la imagen entra por el ojo, el texto entra por la mente, los dos juntos entran por el corazón}.
  saber_contemporaneo: |-
    Hoy en redes sociales el mismo principio aplica: una historia de Instagram o un post de LinkedIn que solo es texto se ignora; una foto sola sin texto se olvida; una combinación bien hecha de imagen + texto coherentes se queda. Tu próxima publicación profesional --- una historia de tu portafolio, un anuncio de evento, un artículo de blog --- depende del \emph{ritmo} entre imagen y texto. No es decorar texto con foto; es componer.
  pregunta_puente: |-
    ¿Por qué algunas portadas de revista o periódico te ``hablan'' inmediatamente y otras parecen ``hojas de Word''? ¿Qué hace la diferencia?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} la relación imagen-texto en 3 spreads reales; (2) \textbf{analizar} los 4 tipos de relación entre imagen y texto (refuerzo, contraste, narrativa, ornamental); (3) \textbf{aplicar} jerarquía visual a una combinación imagen + texto; (4) \textbf{crear} 2 spreads dibujados con foto y texto coherentes para tu revista.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 4 te dio paleta de color; hoy combinas todo lo aprendido (grilla + tipografía + color) en piezas reales: 2 spreads diseñados.
  a_escuta: |-
    Antes de dibujar tus spreads, vamos a leer spreads reales de revistas ilustradas. La forma en que combinan imagen y texto tiene patrones que llevan siglos funcionando.
  a_sistematizacion: |-
    Ya viste spreads reales. Ahora vamos a entender las \textbf{4 relaciones} posibles entre imagen y texto: refuerzo, contraste, narrativa, ornamental. Cada una sirve a un propósito distinto.
  a_praxis: |-
    Tienes el método. Toca producir: 2 spreads (páginas dobles) dibujados a mano con foto + texto. Aplicando grilla, tipografía, color y relación imagen-texto.
  a_producto: |-
    Lo que sigue resume qué entregas hoy: 2 spreads dibujados con todo el sistema visual aplicado. El criterio principal: que imagen y texto se ayuden, no compitan.
  a_evaluacion: |-
    Antes de cerrar, mira la relación imagen-texto desde las cinco dimensiones humanas. La foto ilustrada es un acto político: decide quién aparece, en qué pose, con qué encuadre.
  a_triangulo: |-
    Y para terminar, tres voces sobre imagen y texto. Dussel sobre quién aparece en las fotos editoriales, Marco Aurelio sobre la imagen como complemento de la palabra, Floridi sobre la composición en la infoesfera visual.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 3 spreads reales} (15 min · individual). Busca \textbf{3 spreads} (páginas dobles) reales: (a) uno de \emph{periódico colombiano ilustrado} (El Tiempo, El Espectador, El País del Valle); (b) uno de \emph{revista de tema cultural} (Semana, Cromos, Bocas); (c) uno de \emph{libro o catálogo con buenas imágenes}. Para cada uno: ¿qué se ve primero, la imagen o el titular? ¿la imagen refuerza el texto o lo contradice? ¿cómo se distribuye el espacio?
  checks:
  - Encontré 3 spreads reales con buena composición imagen-texto.
  - Identifiqué qué se ve primero en cada uno (imagen o titular).
  - Reconocí cómo se reparten el espacio (50/50, 70/30, etc.).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 spreads bajo la lupa». \textbf{Formato:} tabla de 5 columnas (Spread~|~Qué se ve primero~|~Reparto de espacio~|~Relación imagen-texto~|~Emoción), 3 filas. \textbf{Sabes que terminaste cuando} reconoces el patrón común de los spreads que funcionan: dejan respirar tanto la imagen como el texto.
sistematizacion:
  intro: |-
    Toda relación imagen-texto se reduce a 4 tipos. Vamos a descomponerlos con los pilares del pensamiento computacional para que sepas elegir cuál usar.
  pilares:
  - |-
    La relación imagen-texto se descompone en 4 tipos: (1) \textbf{refuerzo} (imagen y texto dicen lo mismo desde dos canales --- foto de la cosecha + título ``Llegó la cosecha del café''), (2) \textbf{contraste} (imagen y texto se tensionan productivamente --- foto del campo seco + título ``Año récord'' invita a leer), (3) \textbf{narrativa} (la imagen cuenta un momento, el texto cuenta el resto --- foto de un niño con su perro + texto que explica la historia familiar), (4) \textbf{ornamental} (imagen decorativa sin función informativa --- generalmente débil, evitar en editorial serio).
  - |-
    Toda composición fuerte sigue el patrón \textbf{``imagen captura, texto profundiza''}: el ojo entra por la imagen, la mente sigue por el texto. Si tu texto compite con la imagen por la atención principal, la composición pierde. Decide cuál lleva el peso visual y diseña en consecuencia.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué quiero que el lector vea primero y qué después?}. Sin esa decisión clara, imagen y texto compiten en lugar de bailar juntos.
  - |-
    Pasos para componer un spread: (1) decide qué historia cuenta; (2) decide qué relación tienen imagen y texto (refuerzo, contraste, narrativa); (3) decide reparto de espacio (50/50, 70/30, imagen full bleed, columnas); (4) decide jerarquía tipográfica dentro del texto; (5) verifica que respire (espacio en blanco generoso).
  anatomia:
    titulo: Anatomía de un spread editorial
    body: |-
      \textbf{Imagen principal:} foto, ilustración o composición visual dominante. \\[1mm] \textbf{Titular:} sintetiza la historia, dialoga con la imagen. \\[1mm] \textbf{Subtítulo o lead:} complementa el titular, 1-2 líneas. \\[1mm] \textbf{Cuerpo de texto:} desarrolla la historia, en columnas o bloques. \\[1mm] \textbf{Pie de foto:} contextualiza la imagen brevemente. \\[1mm] \textbf{Espacio en blanco:} respiración entre todos los elementos.
  errores_comunes: |-
    (1) Imagen pequeña y texto inmenso: el ojo no encuentra ancla visual. (2) Imagen full bleed sin titular claro: la imagen sola no explica de qué trata el artículo. (3) Texto encima de imagen sin contraste: ilegible. (4) Imagen decorativa que no aporta a la historia: ocupa espacio inútilmente. (5) Olvidar pie de foto: la imagen queda flotando sin contexto.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 4 relaciones imagen-texto». \textbf{Formato:} 4 fichas, una por relación (refuerzo, contraste, narrativa, ornamental), cada una con definición + ejemplo concreto de las 3 spreads de Actividad 1 (o uno propio) + cuándo conviene usarla. \textbf{Sabes que terminaste cuando} puedes mirar cualquier spread y diagnosticar su relación imagen-texto.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- 2 spreads dibujados a mano} (35 min · individual). Hora de producir. Vas a dibujar 2 spreads (páginas dobles) de tu revista en hojas A4, aplicando todo lo aprendido: grilla, tipografía, paleta de color, y relación imagen-texto. Sin software --- a mano, con lápiz y colores.
  pilares:
  - |-
    Cada spread se descompone en 4 capas: (1) la grilla (lápiz suave), (2) la imagen (cuadro con dibujo simple o descripción de qué irá), (3) los textos (titular grande, lead, cuerpo simulado con líneas onduladas), (4) el color (aplicando tu paleta).
  - |-
    Sigue el patrón \textbf{``primero estructura, después detalle''}: dibuja la grilla y los bloques antes de detalles. Si empiezas dibujando la foto, vas a perder el balance del spread completo.
  - |-
    Cada spread expresa una historia. No mezcles ``portada'' con ``contenido'' en el mismo spread --- elige uno u otro.
  - |-
    Algoritmo: (1) elige los 2 temas de los spreads (ej.: portada + un artículo); (2) decide la relación imagen-texto de cada uno; (3) dibuja grilla en cada A4; (4) ubica imagen y bloques de texto; (5) escribe titulares reales (no ``Lorem ipsum''); (6) aplica color con la paleta de Actividad 3 sesión 4; (7) revisa que respiren.
  checklist:
    titulo: Checklist antes de cerrar los 2 spreads
    items: |-
      \checkbox 2 spreads en 2 hojas A4 horizontales (páginas dobles). \\[1mm] \checkbox Cada uno con grilla visible (lápiz suave). \\[1mm] \checkbox Imagen ubicada + titular real + lead + cuerpo simulado. \\[1mm] \checkbox Aplicación de tu paleta de color de Sesión 4. \\[1mm] \checkbox Aplicación de tu par tipográfico de Sesión 3 (jerarquía visible). \\[1mm] \checkbox Relación imagen-texto identificada en cada spread (refuerzo / contraste / narrativa).
  plantilla_guion: |-
    \textbf{Spread 1.} \textit{Tema + relación imagen-texto + bloques ubicados.} \\[1mm] \textbf{Spread 2.} \textit{Lo mismo, con relación distinta a Spread 1.} \\[1mm] \textbf{Reflexión.} \textit{1 frase sobre cuál se siente mejor y por qué.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- 2 spreads dibujados». \textbf{Formato:} 2 hojas A4 horizontales con spreads dibujados a mano. \textbf{Extensión:} 2 hojas A4. \textbf{Sabes que terminaste cuando} un compañero puede mirar tus 2 spreads y entender la historia sin que tú expliques.
  producto_titulo: 2 spreads dibujados con grilla, tipografía, color y relación imagen-texto
  criterios:
  - 2 spreads en hojas A4 horizontales (páginas dobles)
  - Grilla visible en cada uno (lápiz suave)
  - Imagen ubicada + titular real + cuerpo simulado
  - Aplicación de paleta de color de Sesión 4
  - Aplicación de par tipográfico de Sesión 3 (jerarquía visible)
  - Relación imagen-texto identificada en cada spread
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Las fotos editoriales que dominan revistas globales nunca son neutras: deciden quién es visible y quién queda invisibilizado.
    aplicacion: |-
      Las revistas latinoamericanas tradicionales reservaban portadas para presidentes, élites y artistas internacionales. Los rostros campesinos, afros, indígenas casi nunca aparecían --- y cuando aparecían, era como ``problema social'' o ``color local''. Diseñar editorial hoy es decidir conscientemente a quién ponemos en portada y en qué pose. Tu revista escolar puede romper ese patrón.
    pregunta_espejo: |-
      ¿Quién aparece en mis spreads y en qué pose? ¿Reproduzco los estereotipos editoriales o me atrevo a otra mirada?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Una imagen vale más que mil palabras solo cuando la imagen está bien elegida.
    aplicacion: |-
      La frase ``una imagen vale más que mil palabras'' a veces sirve de excusa para no escribir bien. La sabiduría estoica del diseño editorial: imagen Y texto bien hechos valen más que cualquiera por separado. No es escoger entre los dos --- es componer los dos con rigor.
    pregunta_espejo: |-
      ¿Estoy diciendo lo mismo con palabras y con imagen, o cada una aporta algo distinto? ¿Mi spread necesita ambos elementos o uno sobra?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La composición imagen-texto es la gramática básica de la infoesfera visual contemporánea.
    aplicacion: |-
      Cada feed de redes, cada portal de noticias, cada anuncio que ves opera con la gramática imagen-texto. Aprender a componerla con criterio te da poder sobre tu propia comunicación digital. Las plataformas (Instagram, LinkedIn, TikTok) imponen formatos --- pero dentro del formato eliges tú.
    pregunta_espejo: |-
      ¿Aplico criterio editorial a mis publicaciones en redes o simplemente sigo el formato por defecto? ¿Qué cambiaría si tratara cada post como un spread?
compromiso: |-
  \textbf{Para la próxima semana.} Crea UN post real para tus redes aplicando todo lo aprendido (grilla + tipografía + paleta + relación imagen-texto). Publícalo. Anota qué reacción tuvo. Compara con tus posts anteriores. El próximo lunes traemos esa observación al aula.

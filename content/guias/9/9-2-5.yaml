titulo: Imagen y texto --- el ritmo de la lectura
producto_final: |-
  2 spreads (páginas dobles) de la revista diseñados con foto + texto coherentes, donde la imagen y el texto se ayudan en vez de competir
saber_ancestral_idea: |-
  En las revistas y periódicos ilustrados del Valle del siglo XX, la foto no acompañaba al texto: contaba parte de la historia. Esa tradición --- que el lector quede atrapado primero por la imagen y después siga al texto --- es el principio editorial más antiguo y más eficaz que existe.

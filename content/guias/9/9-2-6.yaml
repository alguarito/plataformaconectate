titulo: Herramientas digitales --- Figma, Canva o Adobe Express
titulo_portada: |-
  Herramientas digitales ---
  Figma, Canva
  o Adobe Express
producto_final: Portada de la revista del periodo hecha en la herramienta digital elegida, usando grilla, tipografía, paleta y lógica imagen-texto de las sesiones anteriores
apertura:
  saber_ancestral: |-
    El paso del \textbf{taller físico al taller digital} no cambió el oficio: cambió la herramienta. Los \emph{impresores antiguos} del Valle también dominaban una herramienta compleja --- la prensa de tipos móviles, los rodillos, las planchas, las tintas. El \emph{tipógrafo de los años 50} usaba linotipia: una máquina que componía líneas enteras de plomo fundido. El oficio era duro, lento, costoso. Aprender a usar la herramienta requería años. Hoy Figma, Canva o Adobe Express son las nuevas linotipias: herramientas complejas que aceleran el oficio sin reemplazar el criterio. Saber usarlas con maestría es heredar el oficio editorial en formato 2026.
  origen: Tradición de la imprenta y linotipia colombiana del siglo XX
  saber_contemporaneo: |-
    Las herramientas más usadas hoy: \textbf{Figma} (gratis para individuos, profesional, colaborativo, el estándar de la industria), \textbf{Canva} (más sencilla, con plantillas, ideal para principiantes), \textbf{Adobe Express} (versión simplificada de Adobe, gratuita con cuenta). Cada una tiene fortalezas distintas. Lo importante es que la herramienta no reemplaza el criterio: si llegas a Figma sin haber pensado grilla, tipografía y paleta, vas a producir piezas confusas con software profesional.
  pregunta_puente: |-
    ¿Qué herramienta digital ya usas (aunque sea Word, Google Docs, o el editor de Instagram)? ¿En qué te ayuda y qué decisiones todavía dependen de tu criterio?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 3 herramientas digitales editoriales y sus diferencias; (2) \textbf{aplicar} grilla + tipografía + color en una herramienta real; (3) \textbf{crear} la portada de tu revista del periodo en la herramienta elegida; (4) \textbf{evaluar} con criterio si una herramienta sirve a tu propósito o te obliga a forzar el diseño.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Las sesiones 1-5 te dieron criterio editorial. Hoy aplicas todo eso en una herramienta digital real. La sesión 7 será sobre accesibilidad y luego maquetar la revista completa.
  a_escuta: |-
    Antes de elegir tu herramienta, vamos a comparar las 3 más usadas. Cada una sirve a perfiles distintos: Figma para quien quiere profundidad profesional, Canva para velocidad con plantillas, Adobe Express como balance.
  a_sistematizacion: |-
    Ya viste las 3 herramientas. Ahora vamos a entender los \textbf{4 elementos básicos} que cualquier herramienta editorial digital ofrece: lienzo + capas + tipografía + exportación. Si dominas estos 4 en cualquier herramienta, dominas el oficio digital.
  a_praxis: |-
    Tienes el método. Toca producir: la portada de tu revista del periodo en la herramienta que elijas. Aplicando grilla, tipografía, color y relación imagen-texto. Es el primer producto en software de tu revista.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: portada digital. El criterio principal: que aplique conscientemente las decisiones editoriales previas, no que sea ``vistosa''.
  a_evaluacion: |-
    Antes de cerrar, mira las herramientas digitales desde las cinco dimensiones humanas. Cada herramienta es un sistema económico (Adobe paga, Figma gratis condicional), político (quién tiene acceso) y cognitivo (qué facilita y qué dificulta).
  a_triangulo: |-
    Y para terminar, tres voces sobre herramientas digitales. Dussel sobre quién tiene acceso a las profesionales, Marco Aurelio sobre la herramienta que no debe gobernarte, Floridi sobre las plataformas como infraestructura.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 3 herramientas digitales editoriales} (15 min · individual). Abre las páginas de \textbf{figma.com}, \textbf{canva.com} y \textbf{express.adobe.com}. En cada una: ¿qué muestra la página principal? ¿qué tipo de usuario apunta? ¿es gratis o paga? ¿qué tipo de pieza es el primer ejemplo? Crea cuenta gratuita en una de las 3 (la que más se acerque a tu necesidad).
  checks:
  - Visité las 3 páginas (Figma, Canva, Adobe Express).
  - Comparé tipo de usuario, precios y ejemplos.
  - Creé cuenta gratuita en una de las 3.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 herramientas editoriales digitales». \textbf{Formato:} tabla de 4 columnas (Herramienta~|~Tipo de usuario~|~Costo (gratis/paga)~|~Mi impresión), 3 filas. Al final indica cuál elegiste y por qué (1 frase). \textbf{Sabes que terminaste cuando} la elección está justificada según tu necesidad real, no por moda.
sistematizacion:
  intro: |-
    Toda herramienta editorial digital opera con 4 elementos básicos. Vamos a descomponerlos con los pilares del pensamiento computacional para que aprendas la herramienta más rápido.
  pilares:
  - |-
    Las herramientas digitales editoriales se descomponen en 4 elementos: (1) \textbf{lienzo} (la página o frame de trabajo, con tamaño definido), (2) \textbf{capas} (cada elemento es una capa apilable y editable independientemente), (3) \textbf{tipografía} (sistema para elegir, escalar y combinar fuentes), (4) \textbf{exportación} (formato final --- PNG, JPG, PDF, video).
  - |-
    Toda herramienta sigue el patrón \textbf{``modelo de capas''}: el texto, la imagen, los colores son objetos independientes que ocupan capas. Mover una capa no afecta a otra. Aprender a pensar en capas es la primera habilidad digital editorial.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿cuál herramienta sirve a la pieza que necesito y a mi nivel actual?}. Sin esa pregunta, eliges por marca o por moda.
  - |-
    Pasos para empezar en cualquier herramienta: (1) crea lienzo con tamaño correcto (A4, Instagram post, etc.); (2) agrega grilla guía; (3) agrega capas de texto con tu par tipográfico; (4) agrega capas de imagen (foto, ilustración); (5) aplica colores de tu paleta; (6) exporta en formato adecuado.
  anatomia:
    titulo: Anatomía de tu primer documento digital
    body: |-
      \textbf{Lienzo:} tamaño A4, A5, Instagram post (1080×1080), historia (1080×1920), etc. \\[1mm] \textbf{Grilla guía:} columnas y márgenes invisibles para alinear elementos. \\[1mm] \textbf{Capas:} cada texto, imagen y forma es una capa editable independiente. \\[1mm] \textbf{Tipografía:} aplica tu par display + cuerpo de Sesión 3. \\[1mm] \textbf{Color:} aplica tu paleta HEX de Sesión 4. \\[1mm] \textbf{Exportación:} JPG/PNG para web, PDF para imprimir.
  errores_comunes: |-
    (1) Empezar a diseñar sin grilla guía: todo termina desalineado. (2) Usar tipografías y colores diferentes a los del sistema visual establecido (sesiones 3 y 4): la revista pierde coherencia. (3) Aplastar todo en una sola capa: imposible editar luego. (4) Exportar en formato equivocado (PDF cuando necesitas JPG, o al revés). (5) Llenar con stickers y elementos decorativos que distraen del contenido editorial.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 4 elementos de una herramienta digital editorial». \textbf{Formato:} 4 fichas, una por elemento (lienzo, capas, tipografía, exportación), cada una con: definición + cómo lo aplica la herramienta que elegiste + captura de pantalla o dibujo del menú. \textbf{Sabes que terminaste cuando} puedes ubicar los 4 elementos en la herramienta sin titubear.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Portada digital de tu revista} (35 min · individual). Hora de producir en software. Vas a diseñar la portada de tu revista del periodo en la herramienta digital elegida, aplicando grilla + tipografía + paleta + relación imagen-texto.
  pilares:
  - |-
    Tu portada se descompone en 5 elementos: (1) lienzo A4 vertical, (2) grilla guía, (3) imagen principal (foto, ilustración o composición visual), (4) titular principal con tu display tipográfica, (5) datos de pie (nombre de revista, número, fecha).
  - |-
    Sigue el patrón \textbf{``aplica el sistema antes que improvisa''}: antes de tocar cualquier elemento, configura tu par tipográfico y tu paleta como estilos en la herramienta. Eso garantiza coherencia.
  - |-
    Cada elemento expresa una sola idea. Si tu portada quiere decir 3 cosas distintas, divídela en 3 portadas o elige una.
  - |-
    Algoritmo: (1) crea lienzo A4 vertical en la herramienta; (2) agrega grilla guía con columnas (idealmente 3); (3) ubica imagen principal (foto subida o ilustración elegida); (4) escribe titular con tu display tipográfica; (5) aplica tu paleta de color; (6) agrega datos de pie (nombre de revista + número/fecha); (7) exporta como JPG o PDF.
  checklist:
    titulo: Checklist antes de exportar la portada
    items: |-
      \checkbox Lienzo A4 vertical (210×297mm) o tamaño revista coherente. \\[1mm] \checkbox Grilla guía visible mientras diseñas (puedes ocultarla al exportar). \\[1mm] \checkbox Tipografía display de Sesión 3 aplicada al titular. \\[1mm] \checkbox Paleta de color de Sesión 4 aplicada (mínimo dominante + acento). \\[1mm] \checkbox Imagen principal compositivamente fuerte (no relleno). \\[1mm] \checkbox Datos de pie con nombre de revista + número/fecha. \\[1mm] \checkbox Exportada en formato adecuado (JPG/PDF).
  plantilla_guion: |-
    \textbf{Herramienta usada.} \textit{Figma / Canva / Adobe Express.} \\[1mm] \textbf{Tamaño del lienzo.} \textit{A4 vertical o el que elegí.} \\[1mm] \textbf{Imagen principal.} \textit{Descripción breve.} \\[1mm] \textbf{Titular.} \textit{Texto exacto.} \\[1mm] \textbf{Aplicación del sistema visual.} \textit{Cómo apliqué grilla, tipografía y color.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi portada digital de revista». \textbf{Formato:} captura impresa o dibujada de la portada + 1 párrafo de proceso (qué fue difícil, qué fue fluido). \textbf{Extensión:} 1 página. \textbf{Sabes que terminaste cuando} la portada se ve coherente con tus decisiones editoriales previas (no es ``otra cosa'').
  producto_titulo: Portada digital de revista hecha en herramienta editorial con sistema visual aplicado
  criterios:
  - Portada producida en software (Figma/Canva/Adobe Express)
  - Tamaño A4 vertical o equivalente
  - Tipografía display de Sesión 3 aplicada
  - Paleta de color de Sesión 4 aplicada
  - Imagen principal y titular dialogan
  - Datos de pie completos
  - Exportada en formato adecuado para compartir/imprimir
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      El acceso a las herramientas profesionales es la nueva alfabetización del XXI; quien no las domina depende del que las domina.
    aplicacion: |-
      Figma es gratis para individuos. Canva tiene plan gratuito robusto. Adobe Express también. Eso significa que la barrera de acceso a las herramientas profesionales de diseño editorial es \emph{conexión + tiempo de aprendizaje}, no dinero. Quien tiene acceso a internet y disciplina puede llegar al mismo nivel técnico que un estudiante de diseño en Bogotá o Nueva York. Aprovechar esa ventana es soberanía técnica.
    pregunta_espejo: |-
      ¿Estoy aprovechando la ventana actual de acceso gratuito a herramientas profesionales? ¿O me limito a las herramientas básicas porque ``son más fáciles''?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Aprende a usar la herramienta sin que ella te use a ti.
    aplicacion: |-
      Cada herramienta tiene su lógica: Canva te empuja a plantillas, Figma te empuja a sistemas complejos, Adobe te empuja a su ecosistema. La sabiduría estoica del diseñador: \emph{conocer el sesgo de tu herramienta} para usarlo o resistirlo conscientemente. Si la herramienta tiene 1000 plantillas, la pregunta es si las usas o las dejas decidir por ti.
    pregunta_espejo: |-
      Cuando uso una herramienta digital, ¿estoy decidiendo yo o estoy siguiendo lo que la herramienta me sugiere? ¿Dónde está el criterio?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Las plataformas digitales no son neutrales: cada una organiza la creación según su propia lógica económica y estética.
    aplicacion: |-
      Figma se diseñó para colaboración en empresas tech. Canva se diseñó para usuarios sin experiencia que necesitan resultados rápidos. Adobe se diseñó para profesionales del mercado creativo. Tus piezas saldrán parecidas a las de quien usa la misma plataforma, porque las plataformas \emph{sesgan la creación}. Reconocer ese sesgo es ciudadanía digital avanzada.
    pregunta_espejo: |-
      ¿Mis trabajos en Canva se parecen a otros trabajos en Canva? ¿Y mis trabajos en Figma a otros en Figma? ¿Cuál es mi voz propia más allá de la herramienta?
compromiso: |-
  \textbf{Para la próxima semana.} Hace una segunda versión de tu portada cambiando UN solo elemento (color principal, tipografía, posición de la imagen, titular). Compara las dos versiones. Anota cuál se siente mejor y por qué. Ese ejercicio de iteración es lo que separa al diseñador del usuario de plantillas. El próximo lunes traemos las dos versiones al aula.
web:
  resumen: |-
    Diseñas la portada de tu revista en software real. La herramienta no reemplaza el criterio: lo amplifica si lo tienes, lo expone si no.
  subtema: Diseño editorial digital · Herramientas profesionales
  pre_lectura:
    por_que_importa: |-
      Figma, Canva y Adobe Express son gratuitas para uso individual. Eso significa que la barrera de acceso al diseño profesional es conexión + tiempo de aprendizaje, no dinero. Aprovechar esa ventana es soberanía técnica concreta.
    pregunta_detonante: |-
      Si tuvieras que enseñarle a tu hermana menor a usar UNA herramienta de diseño hoy, ¿cuál elegirías y por qué? Esa pregunta te dice mucho sobre tu propio criterio actual.
    activacion:
      titulo: Tour rápido de 3 sitios
      descripcion: |-
        En 3 minutos abre figma.com, canva.com y express.adobe.com en pestañas distintas. Mira los hero de cada página principal. ¿Qué prometen? ¿A qué tipo de usuario apuntan? La promesa de marketing te da pista sobre la lógica de la herramienta.
      duracion_min: 3
    conexion:
      anterior: |-
        En las sesiones 1-5 construiste criterio editorial: grilla, tipografía, color, relación imagen-texto. Hoy llevas todo eso a software.
      siguiente: |-
        En la sesión 7 verás accesibilidad lectora: cómo asegurar que tu revista funcione para personas con baja visión, daltonismo o conexión lenta.
  conceptos_clave:
    - termino: Figma
      definicion: |-
        Herramienta profesional de diseño y prototipado. Gratuita para individuos, paga para equipos grandes. Estándar de la industria tech. Curva de aprendizaje moderada pero recompensa con potencia.
      ejemplo: |-
        La mayoría de apps que usas (Instagram, Spotify, bancos digitales) se diseñaron en Figma. Es donde trabajan los diseñadores de Silicon Valley y Latinoamérica profesional.
      emoji: "🎨"
    - termino: Canva
      definicion: |-
        Herramienta más sencilla, con muchas plantillas listas. Ideal para principiantes y para producir piezas rápidas (posts de redes, presentaciones, infografías). Plan gratuito robusto.
      ejemplo: |-
        Si necesitas hacer una historia de Instagram en 5 minutos para un evento mañana, Canva es la opción. Tiene plantilla, tipografía, colores predefinidos.
      emoji: "🌈"
    - termino: Adobe Express
      definicion: |-
        Versión simplificada del ecosistema Adobe (que incluye Photoshop, Illustrator). Gratuita con cuenta, ofrece equilibrio entre poder y simplicidad. Buena para quien quiere migrar luego a Adobe profesional.
      ejemplo: |-
        Si planeas estudiar diseño formal después del colegio, empezar con Adobe Express prepara el camino al ecosistema profesional.
      emoji: "✨"
    - termino: Capas (layers)
      definicion: |-
        Cada elemento (texto, imagen, forma) es una capa independiente apilable. Mover una capa no afecta a otra. Aprender a pensar en capas es la primera habilidad digital editorial.
      ejemplo: |-
        En Figma o Canva, el titular es una capa, la imagen otra, el fondo otra. Puedes mover, ocultar, duplicar cualquiera sin tocar las demás.
      emoji: "📚"
    - termino: Lienzo (frame/artboard)
      definicion: |-
        La página de trabajo con tamaño definido. A4 vertical (210×297mm), Instagram post (1080×1080), historia (1080×1920). El tamaño correcto importa antes de empezar.
      ejemplo: |-
        Si diseñas una historia de Instagram en formato A4, al exportar quedará deforme. El lienzo correcto desde el principio te ahorra reproceso.
      emoji: "🖼"
    - termino: Exportación
      definicion: |-
        Formato final del archivo. JPG/PNG para web y redes. PDF para imprimir o compartir como documento. Cada formato sirve a un propósito distinto.
      ejemplo: |-
        Para enviar la portada por WhatsApp: JPG. Para imprimir la revista: PDF. Para subir a Instagram: PNG o JPG. Confundir formato es error frecuente.
      emoji: "📤"
  quiz:
    titulo: "✅ Verifica el oficio digital"
    instrucciones: |-
      5 preguntas para confirmar que dominas la lógica básica de las herramientas editoriales digitales. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Cuál es la diferencia principal entre Figma y Canva?
        opciones:
          - No hay diferencia
          - Figma es más profesional y potente (curva mayor); Canva es más sencilla con plantillas listas
          - Canva es paga, Figma gratis
          - Figma es para video, Canva para imagen
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Figma = estándar profesional, curva mayor, más potente. Canva = más accesible, con plantillas. Ambas gratuitas para uso individual.
        feedback_incorrecto: |-
          Figma: profesional, potente, curva. Canva: sencilla, plantillas, rápida. Ambas gratuitas. Eliges según necesidad y nivel.
      - enunciado: ¿Qué son las "capas" en una herramienta digital editorial?
        opciones:
          - El tamaño del lienzo
          - Cada elemento (texto, imagen, forma) como objeto independiente apilable y editable
          - Los colores de fondo
          - Los archivos exportados
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Las capas son la base del modelo digital editorial. Cada elemento es independiente — puedes mover, ocultar, editar uno sin afectar otros.
        feedback_incorrecto: |-
          Capas = elementos independientes apilables. El titular es una capa, la imagen otra, el fondo otra. Pensar en capas es la primera habilidad digital.
      - enunciado: ¿Qué tamaño de lienzo elijo para una historia de Instagram?
        opciones:
          - A4 vertical
          - 1080×1080 px
          - 1080×1920 px
          - No importa, se ajusta solo
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Historia de Instagram: 1080×1920 px (vertical). Post normal: 1080×1080 px (cuadrado). Elegir tamaño correcto desde el inicio evita reproceso.
        feedback_incorrecto: |-
          Historias = 1080×1920 (vertical). Post normal = 1080×1080 (cuadrado). Si diseñas en A4 se deforma al exportar para Instagram.
      - enunciado: ¿Cuál es el principal "sesgo" que tienen herramientas como Canva?
        opciones:
          - No tienen sesgo
          - |-
            Empujan al usuario a usar plantillas, lo que puede hacer que sus piezas se parezcan a las de otros usuarios
          - Son demasiado complejas
          - No funcionan en celular
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Canva tiene miles de plantillas, lo que es ventaja para velocidad pero riesgo de homogeneización. Reconocer ese sesgo te permite usarlo con criterio.
        feedback_incorrecto: |-
          Canva sesga hacia plantillas. Eso te da velocidad pero homogeniza tu estética con la de millones de otros usuarios. Conocer el sesgo te permite resistirlo.
      - enunciado: |-
          En el saber ancestral del tipógrafo de linotipia, ¿qué aplica directamente a tu uso de Figma o Canva hoy?
        opciones:
          - Nada — la linotipia es del pasado
          - |-
            Que la herramienta es compleja y aprenderla bien toma tiempo, pero amplifica el oficio sin reemplazar el criterio
          - Que el plomo es mejor
          - Que las herramientas modernas son fáciles
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La linotipia exigía años de dominio; Figma exige meses. Pero ambas amplifican criterio editorial — no lo reemplazan. Sin criterio, la herramienta te traiciona.
        feedback_incorrecto: |-
          Herramienta compleja + tiempo de aprendizaje + criterio del oficio. Lo mismo desde Gutenberg hasta Figma. Sin criterio editorial, la herramienta es solo software costoso.
  post_lectura:
    transferencia: |-
      Esta semana haz una segunda versión de tu portada cambiando UN solo elemento (color principal, tipografía, posición de la imagen, titular). Compara las dos versiones. Anota cuál se siente mejor y por qué. Ese ejercicio de iteración es lo que separa al diseñador del usuario de plantillas.
  cinco_dimensiones:
    personal: |-
      Diste el salto del cuaderno al software — produjiste tu primera pieza editorial digital con criterio propio.
    emocional: Resististe la tentación de "usar plantilla y listo" — elegiste aprender la herramienta con criterio.
    ciudadana: Aprovechaste el acceso gratuito a herramientas profesionales — soberanía técnica práctica.
    local: |-
      Heredaste el oficio del tipógrafo de linotipia colombiano: dominar herramienta compleja como ampliación del criterio.
    intergeneracional: |-
      La prensa de Gutenberg, la linotipia de los 50, y Figma de hoy son la misma cadena de oficio. Tú eres el siguiente eslabón.

titulo: Herramientas digitales --- Figma, Canva o Adobe Express
producto_final: |-
  Portada de la revista del periodo hecha en la herramienta digital elegida, usando la grilla, la tipografía, la paleta y la lógica imagen-texto de las sesiones anteriores
saber_ancestral_idea: |-
  El paso del taller físico al taller digital no cambió el oficio: cambió la herramienta. Los impresores antiguos también dominaban una herramienta compleja (la prensa, los tipos móviles, las planchas). Aprender Figma o Canva es heredar ese oficio en formato 2026.

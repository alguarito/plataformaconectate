clave: 2-6
grado: 9
periodo: 2
sesion: 6
completo: true
duracion_min: 90
titulo: Herramientas digitales --- Figma, Canva o Adobe Express
titulo_portada: |-
  Herramientas digitales ---
  el lienzo,
  las capas
producto_final: |-
  La portada de tu revista hecha en la herramienta digital que elijas, en tamaño A4 vertical o equivalente. Lleva aplicados el sistema visual de las sesiones anteriores: la cuadrícula, el par tipográfico y la paleta con sus códigos. La imagen principal y el titular dialogan en vez de competir, el pie trae los datos completos y el archivo queda exportado en un formato que se pueda compartir.
apertura:
  origen: Regionalización de Univalle · que irse no fuera el precio de estudiar
  fuente: |-
    Universidad del Valle. (s.\,f.). \emph{Historia sede Cartago}. Consultado en 2026.
  saber_ancestral: |-
    En 1984 la Universidad del Valle escribió una propuesta que empezaba nombrando dos ciudades: Buenaventura y Cartago. Dos años después, por el \textbf{Acuerdo 008 del 15 de septiembre de 1986}, el Consejo Superior creó el Programa de Regionalización. La sede de Cartago abrió ese mismo año, en modalidad a distancia. La empujó un grupo de cartagüeños que consideró que la ciudad necesitaba sus propios espacios de formación. La razón de fondo era simple y muy poco romántica: estudiar obligaba a irse, e irse costaba plata, familia y salud. La \textbf{cara de exclusión}: no todo salió bien, y la sede de Sevilla cerró después del primer año. Pero la decisión dejó una idea que sigue sirviendo: nadie debería tener que perderse a sí mismo para poder estudiar. Hoy vas a usar herramientas que hicieron algo parecido con el diseño: acercarlo a quien no podía pagar un estudio.
  saber_contemporaneo: |-
    Toda herramienta de diseño editorial funciona con los mismos cuatro elementos, se llame como se llame. El \textbf{lienzo}: la página de trabajo, con un tamaño definido desde el principio. Las \textbf{capas}: el texto, las imágenes y las formas son objetos independientes que se apilan, y mover una no debería mover las otras. Las \textbf{guías}: las líneas de la cuadrícula, que no se imprimen pero ordenan todo. La \textbf{exportación}: convertir el archivo de trabajo en uno que otros puedan abrir. Aprender una herramienta es aprender dónde están esas cuatro cosas en su menú. Por eso pasar de una a otra cuesta menos de lo que parece. La pregunta para elegir no es cuál es mejor, sino cuál sirve a la pieza que necesitas y a tu nivel de hoy. Elegir por marca o por moda es cómo se pierde una tarde entera.
  pregunta_puente: |-
    La sede de Cartago existió para que estudiar no obligara a irse. Estas herramientas son gratuitas y funcionan en un navegador: ¿qué barrera quitan, y cuál dejan en pie?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} a quién se dirige cada herramienta y qué promete, mirando su propia página; (2) \textbf{explicar} los cuatro elementos comunes y dónde están en la que elegiste; (3) \textbf{crear} la portada de tu revista aplicando la cuadrícula, la tipografía y la paleta que ya definiste.
puentes:
  a_ruta: |-
    En las sesiones 2, 3 y 4 definiste cuadrícula, tipografía y paleta. Hoy los llevas a una herramienta y produces la primera pieza real. En la sesión 7 compruebas quién no puede leerla.
  a_escuta: |-
    Antes de abrir nada vas a mirar cómo se presentan las tres herramientas. Lo que promete una página principal dice a quién está buscando.
  a_sistematizacion: |-
    Ya las miraste. Ahora vas a ver que las tres tienen los mismos cuatro elementos, y a localizarlos en la que elijas.
  a_praxis: |-
    Tienes la herramienta. Toca producir la portada con el sistema visual que ya decidiste, sin inventarte uno nuevo sobre la marcha.
  a_producto: |-
    Lo que entregas hoy: la portada exportada. La prueba de calidad: se reconocen la cuadrícula, el par tipográfico y la paleta de las sesiones anteriores.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Una herramienta gratuita quita una barrera y deja otras: conviene saber cuáles.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre aprender y acceder: Dussel sobre el aprendizaje del vivir, Marco Aurelio sobre corregir enseñando, Floridi sobre un espacio público que operan actores privados.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tres herramientas por fuera} (15 min · individual). (1) Abre las páginas principales de las tres herramientas más usadas para diseño editorial. (2) Anota qué muestra cada una en lo primero que se ve. (3) Anota a qué tipo de usuario parece dirigirse. (4) Busca qué exige cada una: registro, pago, instalación o conexión permanente. (5) Marca cuál te parece más cerca de lo que necesitas hoy y escribe por qué.
  checks:
  - Miré las tres páginas principales y anoté qué muestran.
  - Anoté qué exige cada una para empezar a usarla.
  - Marqué cuál está más cerca de lo que necesito hoy.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Tres herramientas por fuera». \textbf{Formato:} tabla de 3 filas y 3 columnas (herramienta / a quién se dirige / qué exige para empezar), con marca en la elegida. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} tu elección tiene una razón escrita que no es la marca.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los cuatro elementos} (20 min · parejas). (1) Con tu pareja, escriban los cuatro elementos con una frase propia cada uno. (2) Abran la herramienta que eligieron y localicen los cuatro en su menú. (3) Anoten cómo se llama cada uno allí, porque el nombre cambia de una a otra. (4) Creen un lienzo A4 con guías y dos capas, y escriban los pasos exactos que siguieron.
  pilares:
  - |-
    \textbf{Lienzo.} La página de trabajo, con un tamaño definido antes de poner nada. Empezar sin fijarlo es la causa más común de tener que rehacerlo todo al exportar.
  - |-
    \textbf{Capas.} Texto, imágenes y formas son objetos independientes que se apilan. Si al mover una se te mueven las otras, están agrupadas o hay algo bloqueado, y conviene resolverlo antes de seguir.
  - |-
    \textbf{Guías.} Las líneas de la cuadrícula que no se imprimen. Se ponen al principio, no al final: son para construir sobre ellas, no para comprobar después si algo cuadró.
  - |-
    \textbf{Exportación.} Convertir el archivo de trabajo en uno que otros puedan abrir. El archivo de la herramienta no es la pieza: la pieza es lo que exportas.
  anatomia:
    titulo: Los cuatro elementos de cualquier herramienta
    body: |-
      \textbf{Lienzo:} tamaño definido desde el principio. \\[1mm] \textbf{Capas:} objetos independientes que se apilan. \\[1mm] \textbf{Guías:} la cuadrícula que no se imprime. \\[1mm] \textbf{Exportación:} el archivo que otros pueden abrir. \\[1mm] \textbf{Aprender una herramienta:} saber dónde están esas cuatro cosas.
  errores_comunes: |-
    (1) \textbf{Empezar sin fijar el tamaño}: al exportar no cuadra nada y toca rehacer. (2) \textbf{Trabajar todo en una sola capa}: mover una cosa mueve las demás. (3) \textbf{Poner las guías al final}: entonces no se construyó sobre ellas, se comprobó después. (4) \textbf{Confundir el archivo de trabajo con la pieza}: si nadie más puede abrirlo, no está entregado. (5) \textbf{Inventar un sistema visual nuevo}: la cuadrícula, la tipografía y la paleta ya están decididas de las sesiones anteriores.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los cuatro elementos». \textbf{Formato:} los cuatro con frase propia, cómo se llama cada uno en la herramienta elegida y los pasos exactos para crear un lienzo A4 con guías y dos capas. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} otro podría crear ese lienzo siguiendo tus pasos.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- La portada de tu revista} (30 min · individual). (1) Crea el lienzo A4 vertical y pon las guías de tu cuadrícula. (2) Coloca la imagen principal en su capa. (3) Escribe el titular con la tipografía display que elegiste, y el resto con la de cuerpo. (4) Aplica la paleta con sus códigos exactos, respetando la función de cada color. (5) Añade el pie con nombre, número y fecha. (6) Exporta el archivo y ábrelo en otro dispositivo o pásaselo a un compañero para comprobar que se ve igual.
  pilares:
  - |-
    \textbf{Tu entrega es una pieza y una comprobación.} La portada exportada, y la prueba de que se abre bien fuera de tu computador.
  - |-
    \textbf{No se inventa nada nuevo hoy.} La cuadrícula, el par tipográfico y la paleta están decididos. Si al maquetar te dan ganas de cambiarlos, anótalo y decídelo después, no a mitad de la portada.
  - |-
    \textbf{El titular y la imagen dialogan.} Si la imagen ya dice lo que dice el titular, uno de los dos sobra. Lo que funciona es que el titular añada lo que la imagen no puede decir sola.
  - |-
    \textbf{Exportar es parte del trabajo.} Un archivo que solo abre en tu cuenta no está entregado. Comprobarlo en otro dispositivo toma un minuto y evita descubrir el problema el día de la entrega.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Lienzo A4 vertical con el tamaño fijado desde el principio. \\[1mm] \checkbox Guías de la cuadrícula puestas antes de maquetar. \\[1mm] \checkbox Tipografía display y de cuerpo, las de la sesión 3. \\[1mm] \checkbox Paleta aplicada con los códigos de la sesión 4. \\[1mm] \checkbox Titular e imagen que dialogan, sin repetirse. \\[1mm] \checkbox Pie con nombre, número y fecha. \\[1mm] \checkbox Archivo exportado y abierto fuera de tu cuenta.
  plantilla_guion: |-
    \textbf{Herramienta.} \textit{Cuál y por qué esa.} \\[1mm] \textbf{Lienzo.} \textit{Tamaño y guías.} \\[1mm] \textbf{Capas.} \textit{Qué hay en cada una.} \\[1mm] \textbf{Sistema.} \textit{Tipografías y códigos de color aplicados.} \\[1mm] \textbf{Exportación.} \textit{Formato y dónde comprobé que abre.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- La portada de tu revista». \textbf{Formato:} el boceto de la portada con sus capas señaladas, los nombres de las tipografías, los códigos de color y la nota de dónde comprobaste que el archivo abre. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} el archivo se abrió bien fuera de tu computador.
  producto_titulo: Portada de la revista producida en herramienta digital con el sistema visual aplicado
  criterios:
  - El lienzo es A4 vertical y su tamaño se fijó antes de maquetar
  - Las guías de la cuadrícula están puestas y el contenido se apoya en ellas
  - Se usan el par tipográfico de la sesión 3 y la paleta de la sesión 4, con sus códigos
  - El titular añade lo que la imagen no dice sola
  - El archivo exportado se abrió correctamente fuera de tu cuenta
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.1.4.3
    cita: |-
      Codo-a-codo los hermanos en la asamblea donde se decide el destino de la patria; palabra-oído del maestro-discípulo en el aprendizaje del vivir… proximidad es la palabra que expresa la esencia del hombre.
    aplicacion: |-
      Ninguna herramienta se aprende en su manual. Se aprende viendo a alguien usarla y preguntando. Media hora al lado de quien ya sabe rinde más que dos horas de tutoriales, y eso no cambió con el software.
    pregunta_espejo: |-
      ¿A quién puedo preguntarle lo que no entiendo de esta herramienta, y por qué no le he preguntado?
  estoico:
    autor: Marco Aurelio · Meditaciones IX, 11 (c. 175 d.C.)
    cita: |-
      Si puedes, corrige enseñando a quienes obran mal; y si no puedes, acuérdate de que para eso se te ha dado la indulgencia. (trad. propia)
    aplicacion: |-
      En una sala donde unos avanzan más rápido que otros, quien ya entendió tiene dos opciones. Explicarlo, o dejar al otro atrás. Enseñar cómo se pone una guía cuesta un minuto y decide cómo termina la clase entera.
    pregunta_espejo: |-
      ¿A quién de mi salón podría enseñarle hoy algo que a mí me costó entender?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 3.6
    cita: |-
      Internet es una extensión importante del espacio público, incluso cuando lo operan y lo poseen actores privados. (trad. propia)
    aplicacion: |-
      Tu revista va a vivir en una cuenta de una empresa. Es cómodo y es gratis, y también significa que las condiciones las pone otro. Exportar el archivo y guardarlo aparte es la manera barata de que tu trabajo siga siendo tuyo.
    pregunta_espejo: |-
      ¿Qué trabajo mío existe solo dentro de la cuenta de una empresa, y qué pasaría si la cerraran?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la portada exportada y comprobada fuera de tu cuenta. Guarda además una copia del archivo de trabajo en tu propio dispositivo. En la sesión 7 vas a comprobar quién no puede leer lo que hiciste.
web:
  resumen: |-
    En 1986, por el Acuerdo 008, Univalle abrió sede en Cartago porque estudiar obligaba a irse, e irse costaba plata, familia y salud. La idea que dejó sigue sirviendo: nadie debería tener que perderse a sí mismo para poder estudiar. Hoy usas herramientas que hicieron algo parecido con el diseño, y produces la portada de tu revista.
  subtema: Diseño editorial digital · Herramientas
  pre_lectura:
    por_que_importa: |-
      Aprender una herramienta es saber dónde están cuatro cosas en su menú. Por eso pasar de una a otra cuesta mucho menos de lo que parece.
    pregunta_detonante: |-
      ¿Qué programa usas hoy que hace diez años habría costado un sueldo entero?
    activacion:
      titulo: Qué promete la portada
      descripcion: |-
        En 2 minutos, abre la página principal de una herramienta de diseño y anota a quién parece estar buscando.
      duracion_min: 3
    conexion:
      anterior: En la sesión 4 definiste la paleta de cinco colores de tu revista.
      siguiente: En la sesión 7 compruebas quién no puede leer tu revista y rediseñas un spread.

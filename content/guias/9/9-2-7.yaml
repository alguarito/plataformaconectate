clave: 2-7
grado: 9
periodo: 2
sesion: 7
completo: true
duracion_min: 90
titulo: Accesibilidad lectora --- quién NO puede leer mi revista y por qué
titulo_portada: |-
  Accesibilidad lectora ---
  quién no puede
  leer mi revista
producto_final: |-
  Un spread de tu revista rediseñado para que sea accesible: contraste de texto y fondo verificado, cuerpo de letra suficiente, texto alternativo en cada imagen informativa y una jerarquía de títulos que un lector de pantalla pueda recorrer. Va con la bitácora de antes y después, donde cada cambio dice qué barrera quita y a quién deja entrar.
apertura:
  origen: Ley 324 de 1996 y Ley 982 de 2005 · de «lengua manual» a lengua natural
  fuente: |-
    Congreso de la República de Colombia. (2005, 2 de agosto). \emph{Ley 982 de 2005. Por la cual se establecen normas tendientes a la equiparación de oportunidades para las personas sordas y sordociegas}. Diario Oficial.
  saber_ancestral: |-
    Colombia tardó medio siglo en decir bien una sola cosa. La \textbf{Ley 324 de 1996} reconoció la lengua de los sordos colombianos. Pero la llamó \textbf{«lengua manual»}, como si fuera un truco con las manos. Hubo que esperar a la \textbf{Ley 982 de 2005} para que la ley dijera lo correcto: la lengua de señas es la \textbf{lengua natural} de la comunidad sorda. La diferencia entre las dos leyes no es de palabras. Es la diferencia entre «este niño tiene un problema» y «este niño tiene un idioma que la escuela no habla». Fíjate en lo que eso cambia. En la primera versión, quien debe adaptarse es la persona. En la segunda, quien debe adaptarse es la institución. En un salón del Valle del Cauca esa diferencia decide algo concreto: si un estudiante sordo entra a la clase o se queda mirándola. La \textbf{cara de exclusión}: la exclusión no necesita mala intención. Basta con no hablar el idioma del otro y no haberse dado cuenta.
  saber_contemporaneo: |-
    La accesibilidad de una pieza se mide con cuatro ejes. \textbf{Perceptible}: que se pueda ver u oír, con contraste suficiente y con texto alternativo en las imágenes. \textbf{Operable}: que se pueda recorrer sin ratón y sin depender de un gesto fino. \textbf{Comprensible}: lenguaje claro y comportamiento previsible. \textbf{Robusto}: que funcione con las herramientas que usa la gente, incluidos los lectores de pantalla. Hay un nivel de referencia que sirve como piso realista. Un contraste de al menos 4,5 a 1 entre texto y fondo. Un cuerpo de al menos 16 píxeles en digital. Un texto alternativo por imagen informativa. Un solo título principal por página. Y una pregunta que ordena todo lo anterior: quién queda afuera con cada decisión que tomo. Sin esa pregunta, la accesibilidad se queda en buena intención.
  pregunta_puente: |-
    La ley pasó de decir «lengua manual» a decir «lengua natural», y con eso cambió quién tenía que adaptarse. En tu revista, ¿quién se está adaptando a quién?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué barreras encuentra tu revista simulando cuatro condiciones de lectura distintas; (2) \textbf{explicar} los cuatro ejes de accesibilidad y el piso mínimo de cada uno; (3) \textbf{aplicar} esos criterios a un spread real y documentar qué barrera quita cada cambio.
puentes:
  a_ruta: |-
    En las sesiones anteriores armaste páginas, elegiste tipografía y color y montaste spreads. Hoy compruebas quién no puede leerlos. En la sesión 8 corriges, y esta revisión te va a dar la mitad de la lista.
  a_escuta: |-
    Antes de la teoría vas a hacer la prueba en tu propio cuerpo. Cuatro simulaciones de dos minutos cada una, sobre tu revista, sin tocar nada todavía.
  a_sistematizacion: |-
    Ya sabes qué falla. Ahora vas a ordenarlo en los cuatro ejes y a fijar el piso mínimo de cada uno, para no discutir por gusto.
  a_praxis: |-
    Tienes el criterio. Toca rediseñar un spread de verdad y anotar qué barrera quita cada cambio.
  a_producto: |-
    Lo que entregas hoy: un spread rediseñado y su bitácora. La prueba de calidad: cada cambio nombra a quién deja entrar, no solo qué se movió.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Nadie diseña una barrera a propósito, y sin embargo casi todas las páginas tienen alguna.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre escuchar y no excluir: Dussel sobre la conciencia ética como capacidad de oír al otro, Marco Aurelio sobre el enjambre y la abeja, Floridi sobre no reducir a nadie a instrumento.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Cuatro barreras en tu revista} (15 min · individual). (1) Baja visión: aleja la revista o entrecierra los ojos y anota qué texto dejas de leer. (2) Daltonismo: pásale un simulador o imagina la pieza en escala de grises y anota qué información se pierde. (3) Sin imágenes: tapa las fotos y comprueba si el texto solo sigue explicando. (4) Solo audio: pídele a alguien que te lea la página en voz alta y anota qué no se entiende. (5) Marca cuál barrera dejó afuera a más gente.
  checks:
  - Hice las cuatro simulaciones sobre mi propia revista.
  - Anoté qué información se pierde en cada una.
  - Marqué la barrera que deja afuera a más gente.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Cuatro barreras en mi revista». \textbf{Formato:} tabla de 4 filas y 3 columnas (barrera / qué se pierde / a quién deja afuera), con marca en la peor. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} cada fila nombra qué información concreta se pierde.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los cuatro ejes y su piso} (20 min · parejas). (1) Con tu pareja, escriban los cuatro ejes con una frase propia cada uno. (2) Ubiquen en ellos las cuatro barreras que encontraron. (3) Escriban el piso mínimo de cada eje, con su número cuando lo tenga. (4) Elijan un cambio que arregle dos ejes a la vez y expliquen por qué funciona doble.
  pilares:
  - |-
    \textbf{Los cuatro ejes.} Perceptible: que se pueda ver u oír. Operable: que se pueda recorrer sin ratón. Comprensible: lenguaje claro y comportamiento previsible. Robusto: que funcione con lectores de pantalla.
  - |-
    \textbf{El piso mínimo tiene números.} Contraste de al menos 4,5 a 1 entre texto y fondo. Cuerpo de al menos 16 píxeles en digital. Un texto alternativo por imagen informativa. Un solo título principal por página.
  - |-
    \textbf{El texto alternativo describe la información, no la imagen.} «Foto» no sirve. «Gráfico: el consumo baja a la mitad después de marzo» sí, porque quien no ve la imagen recibe lo mismo que quien la ve.
  - |-
    \textbf{Lo que ayuda a uno suele ayudar a todos.} Un contraste alto sirve a quien tiene baja visión y a quien lee al sol. Los subtítulos sirven a quien no oye y a quien viaja en bus. Casi nunca es un arreglo para pocos.
  anatomia:
    titulo: Los cuatro ejes y su piso
    body: |-
      \textbf{Perceptible:} contraste $\geq$ 4,5 a 1; texto alternativo. \\[1mm] \textbf{Operable:} recorrible sin ratón. \\[1mm] \textbf{Comprensible:} lenguaje claro, comportamiento previsible. \\[1mm] \textbf{Robusto:} un solo título principal, estructura legible por lector de pantalla.
  errores_comunes: |-
    (1) \textbf{Texto gris claro sobre blanco}: se ve elegante en pantalla y desaparece al sol. (2) \textbf{Información solo por color}: si el rojo significa «mal», quien no distingue rojo no lee nada. (3) \textbf{Texto alternativo que dice «imagen»}: no aporta, y ocupa el lugar del que sí aportaría. (4) \textbf{Varios títulos principales}: el lector de pantalla pierde la estructura. (5) \textbf{Dejar la accesibilidad para el final}: rehacer cuesta más que decidirlo antes.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los cuatro ejes y su piso». \textbf{Formato:} los cuatro ejes con frase propia, las cuatro barreras ubicadas y el piso mínimo de cada eje con su número. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tienes escrito un cambio que arregla dos ejes a la vez.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Rediseña un spread} (30 min · individual). (1) Elige un spread de tu revista, el más débil de la prueba anterior. (2) Verifica el contraste de texto y fondo y súbelo si no llega al piso. (3) Sube el cuerpo de letra hasta el mínimo. (4) Escribe el texto alternativo de cada imagen informativa, en una o dos frases con la información. (5) Deja un solo título principal y ordena los subtítulos debajo. (6) Anota cada cambio en la bitácora, diciendo qué barrera quita y a quién deja entrar.
  pilares:
  - |-
    \textbf{Tu entrega tiene dos piezas.} El spread rediseñado, con el antes y el después visibles. Y la bitácora, con un renglón por cambio.
  - |-
    \textbf{Cada renglón de la bitácora nombra a alguien.} «Subí el contraste» describe. «Subí el contraste para que se lea al sol y con baja visión» explica. La segunda forma es la que sirve cuando alguien pregunte por qué.
  - |-
    \textbf{El texto alternativo se escribe pensando en voz alta.} Léelo como si se lo estuvieras contando por teléfono a alguien que no ve la página. Si esa persona se queda igual de informada, está bien escrito.
  - |-
    \textbf{Un cambio suele arreglar dos cosas.} Subir el cuerpo de letra mejora lo perceptible y de paso lo comprensible, porque obliga a cortar texto. Anótalo cuando pase: es la parte que se aprende.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Contraste de texto y fondo verificado y por encima del piso. \\[1mm] \checkbox Cuerpo de letra en el mínimo o por encima. \\[1mm] \checkbox Texto alternativo en cada imagen informativa. \\[1mm] \checkbox Un solo título principal y subtítulos ordenados. \\[1mm] \checkbox Bitácora con antes y después por cada cambio. \\[1mm] \checkbox Cada renglón dice a quién deja entrar.
  plantilla_guion: |-
    \textbf{Cambio.} \textit{Qué moví.} \\[1mm] \textbf{Eje.} \textit{Perceptible, operable, comprensible o robusto.} \\[1mm] \textbf{Antes.} \textit{Cómo estaba.} \\[1mm] \textbf{Después.} \textit{Cómo quedó.} \\[1mm] \textbf{A quién deja entrar.} \textit{Dicho con nombre de la situación.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} \textbf{Título:} «Actividad 3 --- Rediseña un spread». \textbf{Formato:} el boceto del antes y el después, y la bitácora con un renglón por cambio, cada uno con su eje y a quién deja entrar. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} ningún renglón de la bitácora se queda en describir el cambio.
  producto_titulo: Un spread accesible + bitácora donde cada cambio dice a quién deja entrar
  criterios:
  - El contraste de texto y fondo está verificado y por encima del piso
  - El cuerpo de letra alcanza el mínimo de la guía
  - Cada imagen informativa tiene texto alternativo con la información, no la palabra «imagen»
  - Hay un solo título principal y los subtítulos están ordenados debajo
  - Cada renglón de la bitácora dice qué barrera quita y a quién deja entrar
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.2
    cita: |-
      Llamamos conciencia ética la capacidad que se tiene de escuchar la voz del otro, palabra transontológica que irrumpe desde más allá del sistema vigente. Puede que la protesta justa del otro ponga en cuestión los principios morales del sistema.
    aplicacion: |-
      La ley de 1996 no oyó bien y llamó «manual» a una lengua. La de 2005 corrigió. Entre las dos hay nueve años y una comunidad insistiendo, que es exactamente lo que significa que una protesta ponga en cuestión lo vigente.
    pregunta_espejo: |-
      ¿Qué me han dicho sobre mi trabajo que no quise oír porque me obligaba a rehacerlo?
  estoico:
    autor: Marco Aurelio · Meditaciones VI, 54 (c. 175 d.C.)
    cita: |-
      Lo que no es bueno para el enjambre, tampoco es conducente para la abeja.
    aplicacion: |-
      Y al revés también: lo que se hace por unos pocos termina sirviéndole a todos. El contraste alto lo agradece quien tiene baja visión y quien lee en la calle al mediodía. Casi nada de esto es un arreglo para pocos.
    pregunta_espejo: |-
      ¿Qué arreglo hice pensando en alguien concreto y terminó mejorando la pieza entera?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.3
    cita: |-
      En una esfera pública plural, los demás no pueden reducirse a instrumentos, y hacen falta contención y respeto. (trad. propia, abreviada)
    aplicacion: |-
      Publicar es entrar a un espacio donde no todos leen igual. Diseñar suponiendo un único tipo de lector no es un error técnico: es haber decidido, sin decirlo, para quién existe la pieza.
    pregunta_espejo: |-
      ¿A qué lector le estoy diseñando por defecto, y a quién estoy dejando fuera sin haberlo decidido?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el spread rediseñado y su bitácora. Pásale la revista a alguien que use gafas y pregúntale qué le costó leer. En la sesión 8 aplicas el ojo de corrector sobre tu propio trabajo, y esta lista es la mitad del camino.
web:
  resumen: |-
    La Ley 324 de 1996 llamó «lengua manual» a la lengua de señas, como si fuera un truco con las manos. La Ley 982 de 2005 corrigió y dijo lengua natural. Entre las dos cambia quién tiene que adaptarse: la persona o la institución. Hoy compruebas quién no puede leer tu revista y rediseñas un spread para que sí pueda.
  subtema: Diseño editorial digital · Accesibilidad
  pre_lectura:
    por_que_importa: |-
      La exclusión no necesita mala intención. Basta con no hablar el idioma del otro y no haberse dado cuenta.
    pregunta_detonante: |-
      ¿Alguna vez no pudiste leer algo por cómo estaba hecho, y creíste que el problema era tuyo?
    activacion:
      titulo: Al sol
      descripcion: |-
        En 2 minutos, mira tu revista con la pantalla al mínimo de brillo o el papel bajo luz fuerte. Anota qué texto desaparece.
      duracion_min: 3
    conexion:
      anterior: En la sesión 6 montaste tus spreads con las herramientas digitales.
      siguiente: En la sesión 8 aplicas el ojo del corrector sobre tu propia revista.

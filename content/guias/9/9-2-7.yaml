clave: 2-7
grado: 9
periodo: 2
sesion: 7
completo: true
titulo: Accesibilidad lectora --- quién NO puede leer mi revista y por qué
titulo_portada: |-
  Accesibilidad lectora ---
  quién NO puede leer
  mi revista y por qué
producto_final: 1 spread de la revista rediseñado para ser accesible (contraste WCAG AA, tamaño mínimo de letra, alt text en imágenes, jerarquía clara para lectores de pantalla), con bitácora de qué se cambió y por qué
apertura:
  saber_ancestral: |-
    En los pueblos donde la lectura escrita era privilegio de pocos, la información se transmitía \textbf{oral}: el \emph{pregonero} en la plaza, el \emph{cuentero} alrededor del fogón, la \emph{canción} en el velorio, las \emph{décimas} de los versadores del Pacífico. Esa tradición oral no era ``atrasada'': era \emph{universalmente accesible}. El que no leía podía escuchar; el que no escuchaba podía mirar; el ciego conocía el cuento por la voz de la abuela. \textbf{Diseñar accesible hoy es heredar esa lógica: no dejar a nadie afuera.} La accesibilidad no es un extra técnico --- es ética editorial heredada de pueblos que respetaban a todos sus miembros.
  saber_contemporaneo: |-
    Hoy ``accesibilidad'' en diseño editorial digital tiene 4 dimensiones: (a) \textbf{contraste}, para personas con baja visión; (b) \textbf{tamaño de letra}, para que personas mayores o con dificultad lectora puedan leer; (c) \textbf{alt text} en imágenes, para que lectores de pantalla (usados por personas ciegas) puedan describir el contenido; (d) \textbf{estructura semántica} clara, para que el lector de pantalla sepa qué es titular, qué es párrafo, qué es enlace. Una revista accesible llega a 1.3 mil millones de personas con alguna discapacidad en el mundo --- una revista inaccesible las excluye, aunque no lo notes.
  pregunta_puente: |-
    ¿Quién de tu familia, vecindario o colegio tiene alguna dificultad para leer (visión, edad, daltonismo, atención)? ¿Tu revista actual los incluye o los deja afuera?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 4 tipos de barreras de accesibilidad (visión, motora, cognitiva, conexión); (2) \textbf{analizar} cómo cada decisión editorial (contraste, tamaño, alt text, estructura) afecta a quién puede leer; (3) \textbf{evaluar} un spread propio frente a criterios WCAG AA; (4) \textbf{aplicar} 4 cambios concretos que hacen tu spread accesible.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Las sesiones 1-6 te dieron criterio editorial y herramientas digitales. Hoy te pides una pregunta más profunda: ``¿a quién deja afuera mi diseño?''. Es ética editorial aplicada.
  a_escuta: |-
    Antes de rediseñar, vamos a escuchar a quien NO puede leer fácilmente: experiencia simulada con baja visión, daltonismo, lector de pantalla. Sin esa escucha, tu accesibilidad es teoría sin músculo.
  a_sistematizacion: |-
    Ya escuchaste. Ahora vamos a entender los \textbf{4 ejes WCAG} de la accesibilidad lectora: perceptible, operable, comprensible, robusto. Esa estructura te da mapa para evaluar cualquier pieza.
  a_praxis: |-
    Tienes el método. Toca rediseñar: tomar UNO de los spreads de la sesión 5 y hacerlo accesible. Cambiar contraste, tamaño, alt text, estructura. Documentar cada cambio y por qué.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: 1 spread accesible + bitácora. El criterio principal: que tu spread pase 4 pruebas concretas de accesibilidad y la bitácora explique cada decisión.
  a_evaluacion: |-
    Antes de cerrar, mira la accesibilidad desde las cinco dimensiones humanas. Esta es la sesión más profundamente ética del periodo: decidir activamente incluir o excluir.
  a_triangulo: |-
    Y para terminar, tres voces sobre quién entra al texto. Dussel sobre los excluidos por la voz pública, Marco Aurelio sobre el cuidado por los demás, Floridi sobre la infoesfera incluyente.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Experimenta 4 barreras lectoras} (15 min · individual). Vamos a simular 4 condiciones de lectura limitada: (a) \emph{baja visión}: aleja el celular o entrecierra los ojos al mirar tu revista; ¿qué texto sigues leyendo y cuál se hace ilegible?; (b) \emph{daltonismo}: usa un simulador online (color-blindness.com/coblis-color-blindness-simulator) sobre una captura de tu spread; ¿qué cambia?; (c) \emph{lector de pantalla}: cierra los ojos y deja que un compañero te describa tu spread; ¿se entiende?; (d) \emph{conexión lenta}: imagina tu spread cargando lento; ¿qué se rompe si la imagen no carga?
  checks:
  - Simulé baja visión sobre mi spread y noté qué se vuelve ilegible.
  - Probé un simulador de daltonismo sobre una captura.
  - Pedí a un compañero que describiera oralmente lo que ve en mi spread.
  - Imaginé el spread con imagen sin cargar y vi qué se rompe.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 4 barreras lectoras experimentadas». \textbf{Formato:} tabla de 3 columnas (Barrera~|~Qué falla~|~Quién queda afuera), 4 filas. \textbf{Sabes que terminaste cuando} reconoces honestamente al menos 2 barreras que tu spread actual no resuelve.
sistematizacion:
  intro: |-
    La accesibilidad digital se rige por el estándar WCAG (Web Content Accessibility Guidelines), agrupado en 4 ejes. Vamos a descomponerlos con los pilares del pensamiento computacional para aplicarlos sin volverse expertos.
  pilares:
  - |-
    Los 4 ejes WCAG se descomponen en: (1) \textbf{perceptible} (que se pueda ver, oír o tocar: contraste suficiente, alt text en imágenes, subtítulos en video), (2) \textbf{operable} (que se pueda navegar: con teclado, con voz, con mouse), (3) \textbf{comprensible} (que se entienda: lenguaje claro, estructura predecible, indicaciones consistentes), (4) \textbf{robusto} (que funcione en distintos navegadores, dispositivos, asistentes tecnológicos).
  - |-
    Toda pieza accesible sigue el patrón \textbf{``WCAG AA mínimo''}: nivel A es básico (poco), AAA es óptimo (riguroso), \emph{AA es el estándar realista exigible}. Contraste 4.5:1 en texto normal, 3:1 en texto grande, alt text en toda imagen informativa, estructura semántica clara.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿quién queda afuera por cada decisión editorial que tomo?}. Sin esa pregunta, accesibilidad es buena intención sin práctica.
  - |-
    Pasos para hacer un spread accesible: (1) verifica contraste texto-fondo en webaim.org ($\geq$ 4.5:1); (2) verifica tamaño mínimo de letra ($\geq$ 16px en cuerpo digital); (3) agrega alt text descriptivo a cada imagen informativa; (4) ordena con estructura semántica (h1, h2, párrafos); (5) verifica con simulador de daltonismo; (6) pide a alguien que lo lea sin contexto previo.
  anatomia:
    titulo: Anatomía de un spread accesible
    body: |-
      \textbf{Contraste:} texto/fondo $\geq$ 4.5:1 verificado en webaim.org. \\[1mm] \textbf{Tamaño mínimo:} cuerpo $\geq$ 16px en digital, $\geq$ 11pt impreso. \\[1mm] \textbf{Alt text:} cada imagen informativa describe su contenido en 1-2 frases. \\[1mm] \textbf{Estructura semántica:} jerarquía clara (h1 único, h2 secundarios, párrafos). \\[1mm] \textbf{Información sin solo color:} si distingues categorías, no solo por color (también por forma o etiqueta). \\[1mm] \textbf{Navegación predecible:} elementos en lugares esperados.
  errores_comunes: |-
    (1) Texto gris claro sobre blanco: ``se ve elegante'' pero falla WCAG. (2) Cuerpos de letra de 10pt en digital: ilegibles para muchos. (3) Imágenes sin alt text: invisibles para personas ciegas que usan lector de pantalla. (4) Información distinguida solo por color (rojo/verde): falla para 8\% de hombres con daltonismo. (5) Estructura desordenada: el lector de pantalla salta sin lógica.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 4 ejes WCAG aplicados a mi revista». \textbf{Formato:} 4 fichas, una por eje (perceptible, operable, comprensible, robusto), cada una con: definición + 1 chequeo específico que harías a tu revista + ejemplo de fallo común. \textbf{Sabes que terminaste cuando} tienes lista de 4 chequeos concretos que vas a aplicar.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Rediseña 1 spread accesible} (30 min · individual). Hora de rediseñar. Toma UNO de los spreads de la Sesión 5 (puede ser el más fuerte o el más débil) y aplica los 4 chequeos de accesibilidad. Documenta cada cambio.
  pilares:
  - |-
    Tu rediseño se descompone en 4 cambios concretos: (1) ajustar contraste hasta $\geq$ 4.5:1, (2) aumentar tamaño mínimo de cuerpo si está bajo 16px digital o 11pt impreso, (3) escribir alt text de 1-2 frases para cada imagen informativa, (4) verificar estructura semántica clara (¿hay un solo h1? ¿los subtítulos siguen jerarquía?).
  - |-
    Sigue el patrón \textbf{``antes y después documentados''}: para cada cambio anota la versión original y la versión nueva. Así demuestras decisión, no accidente. La bitácora es tan importante como el resultado.
  - |-
    Cada cambio expresa una decisión ética. ``Subo contraste'' = decisión de incluir personas con baja visión. ``Agrego alt text'' = decisión de incluir personas ciegas.
  - |-
    Algoritmo: (1) elige spread a rediseñar; (2) abre en herramienta digital; (3) chequea contraste; (4) chequea tamaño; (5) escribe alt text; (6) verifica estructura; (7) toma captura ANTES y DESPUÉS; (8) escribe bitácora con 4 cambios documentados.
  checklist:
    titulo: Checklist antes de declarar el spread accesible
    items: |-
      \checkbox Contraste texto-fondo $\geq$ 4.5:1 verificado en webaim.org. \\[1mm] \checkbox Cuerpo $\geq$ 16px (digital) o $\geq$ 11pt (impreso). \\[1mm] \checkbox Cada imagen informativa tiene alt text de 1-2 frases. \\[1mm] \checkbox Estructura semántica clara (un solo h1, jerarquía consistente). \\[1mm] \checkbox Verificado con simulador de daltonismo: la información se entiende sin distinguir rojo/verde. \\[1mm] \checkbox Bitácora con captura antes/después y justificación por cada cambio.
  plantilla_guion: |-
    \textbf{Spread elegido.} \textit{Cuál de los 2 spreads de Sesión 5 voy a rediseñar.} \\[1mm] \textbf{Cambio 1 · Contraste.} \textit{Antes (ratio) $\to$ después (ratio).} \\[1mm] \textbf{Cambio 2 · Tamaño.} \textit{Antes (px) $\to$ después (px).} \\[1mm] \textbf{Cambio 3 · Alt text.} \textit{Texto agregado para cada imagen.} \\[1mm] \textbf{Cambio 4 · Estructura.} \textit{Qué reordené y por qué.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Spread accesible con bitácora». \textbf{Formato:} captura antes + captura después + bitácora de 4 cambios. \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} cada cambio tiene justificación y captura.
  producto_titulo: 1 spread rediseñado para accesibilidad WCAG AA + bitácora documentada
  criterios:
  - Contraste texto-fondo verificado $\geq$ 4.5:1 en webaim.org
  - Cuerpo $\geq$ 16px digital o $\geq$ 11pt impreso
  - Alt text de 1-2 frases por cada imagen informativa
  - Estructura semántica clara con un único h1
  - Bitácora antes/después con justificación por cambio
  - Verificado con simulador de daltonismo
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda comunicación que no incluye al excluido reproduce la exclusión.
    aplicacion: |-
      Diseñar una revista bonita pero ilegible para personas con baja visión, daltonismo o conexión lenta es reproducir la exclusión histórica de cuerpos no normativos. La accesibilidad no es ``buena intención'' --- es justicia editorial concreta. Cada decisión de contraste, tamaño y alt text incluye o excluye a alguien específico de tu comunidad.
    pregunta_espejo: |-
      ¿A quién de mi propia familia o vecindario excluyo cuando diseño sin pensar en accesibilidad? ¿Qué decisión específica los volvería a incluir?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La virtud no consiste en lo que te beneficia, sino en el cuidado de los otros como si fueran tú mismo.
    aplicacion: |-
      Hacer un spread accesible toma 30 minutos extra que probablemente nadie va a agradecerte explícitamente. Pero alguien va a poder leer tu revista que no habría podido. La sabiduría estoica del diseñador: hacer lo correcto aunque nadie aplauda. La virtud no busca aplauso --- busca consecuencia ética.
    pregunta_espejo: |-
      ¿Estoy dispuesto a hacer accesibilidad aunque no se note ni se agradezca? ¿O solo cuando hay reconocimiento?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Una infoesfera saludable es una infoesfera que incluye a todos los inforgs, sin importar sus condiciones biológicas o tecnológicas.
    aplicacion: |-
      La infoesfera moderna fue diseñada por defecto para usuarios ``promedio'' --- vista 20/20, oído perfecto, conexión rápida, dispositivo de alta gama. Eso excluyó silenciosamente a millones. La accesibilidad como práctica editorial corrige ese sesgo de origen. Cada diseñador accesible es un agente de salud informacional global.
    pregunta_espejo: |-
      ¿Mi diseño contribuye a una infoesfera más incluyente o reproduce las exclusiones estructurales de las plataformas dominantes?
compromiso: |-
  \textbf{Para la próxima semana.} Comparte tu spread accesible con alguien que tenga alguna dificultad lectora (un mayor, un niño que apenas lee, alguien con gafas fuertes). Pídele que lo lea y te diga si pudo. Anota la experiencia. El próximo lunes traemos esa observación al aula --- es la mejor prueba de accesibilidad.

titulo: Accesibilidad lectora --- quién NO puede leer mi revista y por qué
producto_final: |-
  1 spread de la revista rediseñado para ser accesible (contraste WCAG AA, tamaño de letra mínimo, alt text en imágenes, jerarquía clara para lectores de pantalla), con bitácora de qué se cambió y por qué
saber_ancestral_idea: |-
  En los pueblos donde no se leía con facilidad --- por analfabetismo, por lengua propia, por ceguera, por edad --- la información se transmitía oral: el pregonero, el cuentero, la canción. Diseñar accesible hoy es heredar esa lógica: no dejar a nadie afuera. La accesibilidad no es un extra técnico --- es ética editorial.

clave: 2-8
grado: 9
periodo: 2
sesion: 8
completo: true
titulo: Edición y corrección --- el ojo crítico
titulo_portada: |-
  Edición y corrección ---
  el ojo crítico
producto_final: Bitácora de 10 errores corregidos sobre las propias páginas de la revista (5 de texto + 5 de diseño), cada uno con foto/captura del error, descripción y corrección aplicada
apertura:
  saber_ancestral: |-
    Los \textbf{orfebres Quimbaya} del norte del Valle del Cauca tenían un protocolo de descarte despiadado: cada nariguera, pectoral o figura fundida pasaba por inspección visual y táctil; las que tenían burbujas internas, grietas finas o asimetrías mínimas se fundían de nuevo. No publicaban piezas dudosas. Siglos después, ese mismo \textbf{oficio del corrector} existía mucho antes de Word. En la tipografía colombiana del siglo XX --- las imprentas de Cali, Cartago, Bogotá, Medellín y el Eje Cafetero --- el corrector era \emph{casi tan importante como el diagramador}. Su trabajo: leer con un ojo distinto al del autor, encontrar lo que el autor ya no ve. Tildes faltantes, dedos cambiados, mayúsculas mal puestas, palabras repetidas, números mal escritos, espacios dobles. El corrector salvaba revistas, periódicos y libros enteros antes de imprimir. Hoy ese oficio sobrevive en la cultura editorial profesional aunque las máquinas lo asistan. Word te marca errores pero no los corrige por ti --- alguien tiene que leer con criterio.
  origen: Tipografía colombiana del siglo XX — oficio del corrector
  saber_contemporaneo: |-
    La \textbf{edición y corrección} de un proyecto editorial digital tiene dos capas: (a) \textbf{corrección de texto} (ortografía, gramática, puntuación, coherencia, claridad); (b) \textbf{corrección de diseño} (alineación, espacios, jerarquía, color, consistencia). Las dos capas se trabajan distinto. Una revista profesional dedica al menos \emph{30~\% del tiempo} a edición y corrección antes de publicar. Saltarse esa fase es la diferencia entre un trabajo amateur y uno profesional, no importa cuán bueno fuera el primer borrador.
  pregunta_puente: |-
    ¿Cuándo fue la última vez que volviste a leer un texto tuyo después de unas horas? ¿Qué encontraste que no habías visto al escribirlo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} 5 tipos de errores comunes de texto y 5 de diseño; (2) \textbf{analizar} tu propia revista con ojo crítico distinto al del autor; (3) \textbf{evaluar} cada error según su impacto en el lector; (4) \textbf{aplicar} 10 correcciones documentadas sobre tu propio trabajo.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Las sesiones 1-7 te dieron criterio editorial, sistema visual y accesibilidad. Hoy aplicas el ojo crítico sobre tu propio trabajo --- es la sesión que diferencia amateur de profesional.
  a_escuta: |-
    Antes de corregir, vamos a leer 3 publicaciones reales con ojo de corrector. Verás errores en revistas serias, periódicos, posts virales. Eso te entrena el ojo para encontrar los tuyos.
  a_sistematizacion: |-
    Ya viste errores en publicaciones reales. Ahora vamos a entender las \textbf{2 capas de corrección} (texto + diseño) y los 10 errores más comunes (5 de cada). Tener una lista clara hace la corrección sistemática, no caprichosa.
  a_praxis: |-
    Tienes el método. Toca aplicar: revisar tu propia revista con el ojo del corrector y documentar 10 correcciones (5 de texto + 5 de diseño) con foto/captura del antes y el después.
  a_producto: |-
    Lo que sigue es el resumen de qué entregas hoy: bitácora de 10 correcciones. El criterio principal: que cada error sea específico (no ``ortografía general'') y que cada corrección esté documentada.
  a_evaluacion: |-
    Antes de cerrar, mira el oficio del corrector desde las cinco dimensiones humanas. La corrección parece técnica pero es profundamente ética: cuidado por el lector, disciplina personal, respeto por la palabra.
  a_triangulo: |-
    Y para terminar, tres voces sobre el ojo crítico. Dussel sobre la lengua de la corrección, Marco Aurelio sobre la disciplina personal, Floridi sobre la calidad informacional.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Errores en publicaciones reales} (15 min · individual). Busca \textbf{3 publicaciones reales} con buenos diseños generales (un periódico nacional, una revista cultural conocida, un post viral en redes con muchos likes). Con ojo de corrector, encuentra \textbf{al menos UN error} en cada una: puede ser ortográfico, de redacción confusa, de alineación incorrecta, de inconsistencia de estilo. Estos errores demuestran que incluso publicaciones serias necesitan corrección.
  checks:
  - Encontré al menos 1 error en un periódico/revista profesional.
  - Encontré al menos 1 error en un post viral de redes.
  - Reconocí que la corrección no es lujo --- es oficio incumplido por muchos.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 errores en publicaciones reales». \textbf{Formato:} tabla de 3 columnas (Publicación~|~Tipo de error~|~Cómo lo corregirías), 3 filas. \textbf{Sabes que terminaste cuando} encontraste errores reales y entiendes que incluso publicaciones grandes los tienen --- por eso la corrección importa.
sistematizacion:
  intro: |-
    Toda revisión editorial tiene 2 capas con sus listas de errores comunes. Vamos a descomponerlas con los pilares del pensamiento computacional para que sepas qué buscar.
  pilares:
  - |-
    La corrección se descompone en 2 capas con 5 errores típicos cada una. \textbf{Capa texto}: (a) tildes faltantes o sobrantes, (b) palabras repetidas en frases cercanas, (c) puntuación incorrecta (comas, puntos), (d) números o fechas mal escritos, (e) frases ambiguas o muy largas. \textbf{Capa diseño}: (a) alineación inconsistente, (b) espacios dobles entre palabras, (c) tipografía mezclada (más de tu par), (d) color sin función clara, (e) imagen pixelada o de baja calidad.
  - |-
    Toda corrección sigue el patrón \textbf{``leer con ojo del lector, no del autor''}: cuando tú escribes, tu cerebro completa lo que falta. Cuando otro lee, no completa. Por eso necesitas distancia (tiempo o persona) antes de corregir. Leer en voz alta es el truco más antiguo y efectivo.
  - |-
    Lo esencial de la corrección cabe en una pregunta: \emph{¿este error confunde al lector o solo me molesta a mí?}. Si confunde, corrige. Si solo es preferencia personal, suelta. La energía es limitada.
  - |-
    Pasos para corregir cualquier pieza editorial: (1) deja descansar el trabajo al menos 1 hora (mejor 1 día); (2) léelo en voz alta una vez completo; (3) revisa capa texto buscando los 5 errores comunes; (4) revisa capa diseño buscando los 5 errores comunes; (5) documenta cada corrección con antes/después; (6) lee de nuevo después de corregir.
  anatomia:
    titulo: Anatomía de una corrección documentada
    body: |-
      \textbf{Error detectado:} qué tipo (texto/diseño) y qué específicamente. \\[1mm] \textbf{Captura ANTES:} foto o pantallazo del error. \\[1mm] \textbf{Justificación:} por qué es error (no preferencia). \\[1mm] \textbf{Corrección aplicada:} qué cambiaste exactamente. \\[1mm] \textbf{Captura DESPUÉS:} resultado corregido. \\[1mm] \textbf{Impacto en el lector:} qué se gana con la corrección.
  errores_comunes: |-
    (1) Confundir corrección con reescritura: el corrector no rehace el texto, solo lo limpia. (2) Solo confiar en Word: muchos errores los pasa de largo. (3) Corregir sin descanso: el cansancio te hace pasar errores obvios. (4) Corregir solo lo que te molesta a ti: el criterio es el lector. (5) Saltarse el paso de leer en voz alta: es la prueba más efectiva.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 10 errores comunes (5 de texto + 5 de diseño)». \textbf{Formato:} 2 columnas (Texto~|~Diseño) con 5 errores cada una, cada uno con ejemplo concreto inventado o real. \textbf{Sabes que terminaste cuando} reconoces los 10 errores en cualquier publicación que mires.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- 10 correcciones sobre tu propia revista} (30 min · individual). Hora de aplicar el ojo crítico a tu propio trabajo. Vas a tomar tus spreads (sesiones 5 y 6) y portada (sesión 6) y encontrar \textbf{10 errores} para corregir: 5 de texto + 5 de diseño. Cada uno documentado con antes/después.
  pilares:
  - |-
    Tu revisión se descompone en 4 momentos: (1) descansar (cierra el archivo al menos 1 hora antes de empezar a corregir), (2) leer en voz alta el spread completo, (3) buscar los 5 errores de texto con lista de control, (4) buscar los 5 errores de diseño con lista de control.
  - |-
    Sigue el patrón \textbf{``humilde antes que defensivo''}: tu trabajo seguramente tiene los errores comunes. No te lo tomes personal --- todos los tenemos. La diferencia es si los corriges o los ignoras. Humildad ante el propio trabajo es señal de oficio.
  - |-
    Cada corrección expresa una decisión por el lector. Si dudas si corregir, pregúntate: ``¿esto confunde al lector?''. Si sí, corrige. Si no, sigue.
  - |-
    Algoritmo: (1) toma descanso de tus piezas; (2) lee en voz alta; (3) marca con lápiz cada error que encuentres; (4) llega a 10 mínimo (si encuentras menos, sigue buscando); (5) documenta cada uno con captura antes/después; (6) anota qué tipo de error y por qué es error; (7) revisa el resultado final.
  checklist:
    titulo: Checklist antes de cerrar la bitácora de corrección
    items: |-
      \checkbox Descansé mínimo 1 hora antes de corregir. \\[1mm] \checkbox Leí mi trabajo en voz alta al menos una vez completo. \\[1mm] \checkbox Encontré y corregí mínimo 5 errores de texto. \\[1mm] \checkbox Encontré y corregí mínimo 5 errores de diseño. \\[1mm] \checkbox Cada corrección tiene captura ANTES y DESPUÉS. \\[1mm] \checkbox Cada corrección tiene justificación de por qué era error.
  plantilla_guion: |-
    \textbf{Corrección 1.} \textit{Tipo (texto/diseño) + descripción del error + por qué es error.} \\[1mm] \textbf{Corrección 2-10.} \textit{Lo mismo, con capturas antes/después.} \\[1mm] \textbf{Reflexión final.} \textit{¿Qué tipo de error fue más frecuente en mi trabajo y qué me dice eso?}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} Título: «Actividad 3 --- Bitácora de 10 correcciones». \textbf{Formato:} 10 fichas mini con captura antes + después + tipo de error + justificación + reflexión final de 3 renglones. \textbf{Extensión:} 1.5 páginas de cuaderno. \textbf{Sabes que terminaste cuando} la bitácora demuestra disciplina, no improvisación.
  producto_titulo: Bitácora de 10 correcciones documentadas (5 texto + 5 diseño) sobre la propia revista
  criterios:
  - 10 correcciones documentadas (mínimo 5 de texto + 5 de diseño)
  - Cada una con captura ANTES y DESPUÉS
  - Cada una con tipo de error y justificación
  - Reflexión final identifica patrón en mis errores
  - La bitácora demuestra que descansé y leí en voz alta antes
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda corrección lingüística contiene una decisión política sobre qué lengua se considera legítima.
    aplicacion: |-
      La ``corrección'' de un texto en español de Colombia no es neutra: a veces ``corrige'' regionalismos del Valle, del Pacífico, del Caribe que son español igualmente válido. El corrector consciente respeta la voz del autor cuando es decisión deliberada y solo corrige errores genuinos. Aprende a distinguir entre error y variedad lingüística legítima --- esa distinción es ética profunda.
    pregunta_espejo: |-
      ¿Cuando corrijo, estoy quitando errores o también borrando voces regionales? ¿Qué se preserva y qué se uniforma?
  estoico:
    autor: Marco Aurelio
    cita: |-
      El cuidado paciente de lo que parece pequeño es la mayor virtud del oficio.
    aplicacion: |-
      Buscar una tilde faltante o un espacio doble parece tarea menor. Pero el cuidado paciente por lo pequeño es la diferencia entre un trabajo amateur y uno profesional. La sabiduría estoica del corrector: cada detalle es oportunidad de virtud. Quien no cuida los detalles, no cuida el conjunto.
    pregunta_espejo: |-
      ¿Me canso de buscar errores pequeños o veo en cada uno una oportunidad de oficio? ¿Qué cambia si los tomo como práctica espiritual y no como tarea?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La calidad informacional en la infoesfera depende de millones de actos de corrección invisibles.
    aplicacion: |-
      Cada texto corregido contribuye a una infoesfera más legible. Cada error no corregido es ruido que se multiplica. Floridi vería el oficio del corrector como mantenimiento ético de bien común informacional. Tu corrección sobre tu propia revista escolar es entrenamiento para ese cuidado mayor.
    pregunta_espejo: |-
      ¿Estoy contribuyendo a una infoesfera más legible o le sumo ruido cuando publico sin corregir? ¿Qué cambia si me trato como corrector profesional aunque sea estudiante?
compromiso: |-
  \textbf{Para la próxima semana.} Aplica el ojo del corrector a UN texto tuyo que vayas a publicar esta semana (post, correo, trabajo escolar). Descansa, lee en voz alta, busca los 10 errores comunes. Anota qué encontraste. Esa práctica se vuelve hábito si la repites 5 veces.
web:
  resumen: |-
    Aplicas el oficio del corrector sobre tu propia revista: 10 errores corregidos (5 de texto + 5 de diseño) con bitácora antes/después.
  subtema: Diseño editorial digital · Edición y corrección
  pre_lectura:
    por_que_importa: |-
      Una revista profesional dedica 30% del tiempo a edición y corrección antes de publicar. Saltarse esa fase es la diferencia entre trabajo amateur y profesional, no importa cuán bueno fuera el primer borrador.
    pregunta_detonante: |-
      Si publicaras un texto con tres errores ortográficos en tu CV de prácticas — ¿lo leerían igual? ¿Qué dice eso sobre el rol invisible del corrector?
    activacion:
      titulo: Lectura en voz alta
      descripcion: |-
        En 3 minutos, lee en voz alta el primer párrafo de algo que escribiste recientemente (post, ensayo, mensaje largo). Vas a notar errores que no veías al leerlo en silencio. La voz expone lo que el ojo deja pasar.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 7 hiciste accesibilidad ética. Hoy aplicas oficio técnico: el ojo crítico del corrector.
      siguiente: |-
        En la sesión 9 maquetarás tu revista completa de 8 páginas — con todo el sistema visual y correcciones aplicadas.
  conceptos_clave:
    - termino: Corrección de texto
      definicion: |-
        Revisión ortográfica, gramatical, de puntuación y coherencia. No es reescritura — es limpieza. El corrector quita errores sin tocar el estilo del autor.
      ejemplo: |-
        "Esta es una guía muy importante para los los estudiantes" → "Esta es una guía muy importante para los estudiantes" (eliminé palabra repetida).
      emoji: "✍️"
    - termino: Corrección de diseño
      definicion: |-
        Revisión de alineación, espacios, tipografía consistente, color con función, calidad de imágenes. Lo que ojo entrenado nota y ojo apresurado pasa por alto.
      ejemplo: |-
        Titular en Bricolage Grotesque 36pt, pero un subtítulo accidentalmente quedó en Inter 24pt. Mezcla rompe coherencia del sistema visual.
      emoji: "🎨"
    - termino: Distancia del autor
      definicion: |-
        Cuando tú escribes, tu cerebro completa lo que falta. Cuando lees después de tiempo (o lo lee otra persona), no completas. Por eso corrección efectiva requiere distancia.
      ejemplo: |-
        Acabas de escribir un texto. Si lo corriges inmediatamente, pasarás errores por alto. Si descansas 1 día y vuelves, encontrarás el doble.
      emoji: "⏳"
    - termino: Leer en voz alta
      definicion: |-
        Técnica más antigua y efectiva de corrección. La voz expone errores que el ojo silencioso deja pasar: frases muy largas, palabras repetidas, puntuación incorrecta.
      ejemplo: |-
        Lee tu texto en voz alta. Si una frase no puedes leerla sin respirar varias veces, es demasiado larga — divídela.
      emoji: "🗣"
    - termino: 5 errores típicos de texto
      definicion: |-
        Tildes faltantes/sobrantes, palabras repetidas, puntuación incorrecta (comas, puntos), números mal escritos, frases ambiguas o muy largas. Estos 5 cubren el 80% de errores comunes.
      ejemplo: |-
        Lista de control rápida: ¿tildes correctas? ¿palabras repetidas en frases cercanas? ¿comas bien puestas? ¿números coherentes? ¿frases no más de 25 palabras?
      emoji: "📝"
    - termino: 5 errores típicos de diseño
      definicion: |-
        Alineación inconsistente, espacios dobles entre palabras, tipografía mezclada (más de tu par), color sin función, imagen pixelada o de baja calidad.
      ejemplo: |-
        Si un párrafo está alineado a la izquierda y otro al centro sin razón clara, el ojo se descoloca. Pequeño detalle pero significativo.
      emoji: "📐"
  quiz:
    titulo: "✅ Verifica el oficio del corrector"
    instrucciones: 5 preguntas para confirmar que aplicas el ojo crítico con criterio. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Cuál es la técnica más antigua y efectiva de corrección de texto?
        opciones:
          - Usar corrector automático de Word
          - Leer el texto en voz alta
          - Imprimir y revisar
          - Pedirle a un amigo
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Leer en voz alta expone errores que el ojo deja pasar. Frases muy largas, palabras repetidas, puntuación incorrecta — la voz los señala.
        feedback_incorrecto: |-
          Leer en voz alta. La voz expone lo que el ojo silencioso deja pasar. Es la técnica de corrección más antigua y más efectiva.
      - enunciado: ¿Por qué necesitas "distancia del autor" para corregir bien tu propio texto?
        opciones:
          - Para descansar
          - Porque cuando escribes, tu cerebro completa lo que falta y no ves los errores
          - Por moda
          - No es necesario
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Tu cerebro autor completa errores automáticamente. Solo con tiempo o distancia los puedes ver. Por eso un día de descanso multiplica errores encontrados.
        feedback_incorrecto: |-
          El cerebro autor autocompleta. Solo con distancia (tiempo o persona) los errores se hacen visibles. Por eso corregir inmediatamente es ineficaz.
      - enunciado: ¿Cuál es la diferencia entre corrección y reescritura?
        opciones:
          - No hay diferencia
          - Corrección limpia errores sin tocar el estilo; reescritura rehace el texto
          - Reescritura es más rápida
          - Solo los profesionales reescriben
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El corrector limpia, no reescribe. Respeta el estilo del autor. Reescribir es otra etapa editorial — más invasiva.
        feedback_incorrecto: |-
          Corrección = limpia errores manteniendo el estilo. Reescritura = rehace el texto. El corrector profesional sabe distinguir las dos para no excederse.
      - enunciado: ¿Cuántos errores comunes cubren las dos listas (texto + diseño)?
        opciones:
          - 3 en total
          - 10 en total (5 texto + 5 diseño)
          - 20 en total
          - 50 en total
        respuesta_index: 1
        feedback_correcto: |-
          Sí. 10 errores comunes cubren el 80% de problemas típicos. Tener lista clara hace la corrección sistemática, no caprichosa.
        feedback_incorrecto: |-
          10 errores (5 texto + 5 diseño). Una lista clara te ahorra perder el foco. Si revisas con esa lista en mente, cubres lo crítico.
      - enunciado: |-
          En el saber ancestral del corrector de la tipografía colombiana, ¿qué aplica directamente a Word de hoy?
        opciones:
          - Nada — Word automatiza todo
          - Que el corrector lee con ojo distinto al del autor; Word marca errores pero no los corrige por ti
          - Que la tinta era mejor
          - Que solo los expertos podían corregir
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. Word te alerta pero no decide. El criterio del corrector profesional sobrevive en la persona, no en el software.
        feedback_incorrecto: |-
          Word asiste, no reemplaza. El corrector lee con criterio diferente al autor; alguien tiene que aplicar ese criterio. La máquina no decide qué es error.
  post_lectura:
    transferencia: |-
      Esta semana, aplica el ojo del corrector a UN texto tuyo que vayas a publicar (post, correo, trabajo escolar). Descansa, lee en voz alta, busca los 10 errores comunes. Anota qué encontraste. La práctica se vuelve hábito si la repites 5 veces.
  cinco_dimensiones:
    personal: |-
      Aplicaste disciplina sobre tu propio trabajo — separaste autor de corrector y elegiste el segundo rol.
    emocional: |-
      Resististe la tentación de defenderte de tus errores — abrazaste el oficio del corrector con humildad.
    ciudadana: Tu corrección aporta a una infoesfera más legible. Pequeño acto, gran consecuencia colectiva.
    local: Heredaste el oficio del corrector de imprenta colombiana — paciente, riguroso, invisible y esencial.
    intergeneracional: |-
      El corrector de El País del Valle hace 50 años y tu corrección de hoy comparten ética: cuidado paciente por el lector.

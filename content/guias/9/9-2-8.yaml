clave: 2-8
grado: 9
periodo: 2
sesion: 8
completo: true
duracion_min: 90
titulo: Edición y corrección --- el ojo crítico
titulo_portada: |-
  Edición y corrección ---
  el ojo
  crítico
producto_final: |-
  La bitácora de diez correcciones sobre tu propia revista: cinco de texto y cinco de diseño. Cada una lleva la captura de cómo estaba, la de cómo quedó, el tipo de error y una línea que diga si confundía al lector o solo te molestaba a ti. Cierra con el patrón que reconoces en tus propios errores.
apertura:
  origen: Pueblo wayuu, en La Guajira · la palabra pasa por un tercero antes de que el daño crezca
  fuente: |-
    UNESCO. (2010). \emph{El sistema normativo de los wayuus, aplicado por el pütchipü'üi («palabrero»)} (Expediente 00435). Lista Representativa del Patrimonio Cultural Inmaterial de la Humanidad.
  saber_ancestral: |-
    Entre el pueblo wayuu, en La Guajira, cuando dos familias entran en conflicto ninguna de las dos habla directamente con la otra. Se busca un \textbf{pütchipü'üi}, el palabrero, que lleva y trae la palabra hasta que hay un acuerdo. Fíjate en cómo está definido su oficio, porque no es lo que uno esperaría. No consiste en averiguar quién tiene la razón, sino en evitar que la ofensa se convierta en guerra. Termina en una compensación que repara el daño ante los dos clanes. La UNESCO inscribió este sistema normativo en 2010, en la Lista Representativa del Patrimonio Cultural Inmaterial de la Humanidad. En Colombia tiene su propio Plan Especial de Salvaguardia. Conviene decirlo con precisión: es el derecho de un pueblo, no una técnica de mediación escolar. La \textbf{cara de exclusión}: la responsabilidad allí es del clan, no de la persona, y la venganza existe dentro del sistema como último recurso reglado.
  saber_contemporaneo: |-
    Corregir es poner un tercero entre lo que escribiste y quien lo va a leer. Ese tercero eres tú mismo, un día después, o un compañero. Y hace falta por una razón que no depende de la voluntad: cuando tú escribes, tu cerebro completa lo que falta; cuando otro lee, no completa nada. La corrección trabaja en dos capas. La \textbf{capa de texto}: tildes, palabras repetidas cerca, puntuación que cambia el sentido, concordancias y datos mal copiados. La \textbf{capa de diseño}: alineaciones que bailan, espacios desiguales, viudas y huérfanas, jerarquías inconsistentes y contrastes flojos. Y hay una pregunta que evita la mitad de las discusiones: ¿este error confunde al lector o solo me molesta a mí? Si confunde, se corrige. Si es preferencia personal, se suelta. Corregir no es imponer tu gusto sobre el de otro.
  pregunta_puente: |-
    El palabrero no busca tener la razón: busca que el daño no crezca. Cuando corriges el trabajo de un compañero, ¿cuál de las dos cosas estás haciendo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} errores de texto y de diseño en publicaciones reales bien hechas; (2) \textbf{explicar} las dos capas de la corrección y el criterio que separa un error de una preferencia; (3) \textbf{evaluar} tu propia revista y documentar diez correcciones con su antes y su después.
puentes:
  a_ruta: |-
    En la sesión 7 comprobaste quién no podía leer tu revista y rediseñaste un spread. Hoy le pasas el ojo de corrector a todo lo demás. En la sesión 9 maquetas la revista completa, ya con estas correcciones adentro.
  a_escuta: |-
    Antes de corregirte a ti vas a corregir a otros. Es más fácil, y sirve para calibrar el ojo antes de aplicarlo donde duele.
  a_sistematizacion: |-
    Ya viste errores ajenos. Ahora vas a ordenarlos en dos capas y a fijar el criterio que separa lo que confunde de lo que solo te molesta.
  a_praxis: |-
    Tienes el criterio. Toca aplicarlo sobre tu propio trabajo, que es la parte incómoda del oficio.
  a_producto: |-
    Lo que entregas hoy: diez correcciones documentadas y el patrón de tus errores. La prueba de calidad: cada una dice si confundía o solo molestaba.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Corregir a otro es un acto de cuidado si se hace bien, y de vanidad si se hace mal.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre escuchar y rectificar: Dussel sobre el silencio del que todo tiene que escuchar, Marco Aurelio sobre seguir el aviso de quien te corrige, Floridi sobre los patrones pequeños.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Errores en trabajo ajeno} (15 min · individual). (1) Busca tres publicaciones reales bien hechas: un periódico, una revista y una publicación muy compartida. (2) Con ojo de corrector, encuentra al menos dos errores en cada una. (3) Anota de qué capa es cada uno, si de texto o de diseño. (4) Escribe al lado de cada uno si confunde al lector o si solo te molesta a ti. (5) Marca el que más te costó ver.
  checks:
  - Tengo al menos seis errores encontrados en publicaciones reales.
  - Cada uno tiene anotada su capa, texto o diseño.
  - Marqué cuáles confunden y cuáles solo me molestan.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Errores en trabajo ajeno». \textbf{Formato:} tabla de 6 filas y 3 columnas (error / capa / confunde o solo molesta), con marca en el que más costó ver. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} al menos uno de los seis está marcado como «solo me molesta».
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Las dos capas y el criterio} (20 min · parejas). (1) Con tu pareja, escriban los cinco errores típicos de cada capa. (2) Clasifiquen en ellos los doce errores que trajeron. (3) Discutan los que uno marcó como «confunde» y el otro como «solo molesta», y decidan juntos. (4) Escriban el criterio con el que resolvieron los desacuerdos.
  pilares:
  - |-
    \textbf{Capa de texto.} Tildes puestas o faltantes, palabras repetidas en frases cercanas, puntuación que cambia el sentido, concordancia entre sujeto y verbo, y datos mal copiados. Los dos últimos son los que hacen daño de verdad.
  - |-
    \textbf{Capa de diseño.} Alineaciones que bailan, espacios desiguales entre bloques, líneas sueltas al principio o al final de una columna, jerarquías inconsistentes y contrastes flojos.
  - |-
    \textbf{El criterio que evita discusiones.} ¿Confunde al lector o solo me molesta a mí? Si confunde, se corrige. Si es preferencia, se suelta. Casi todas las peleas de corrección son por preferencias disfrazadas de reglas.
  - |-
    \textbf{Por qué hace falta un tercero.} Cuando escribes, tu cerebro completa lo que falta. Cuando otro lee, no completa. Por eso el texto descansa, se lee en voz alta y pasa por alguien más antes de salir.
  anatomia:
    titulo: Corregir en dos capas
    body: |-
      \textbf{Texto:} tildes, repeticiones, puntuación, concordancia, datos. \\[1mm] \textbf{Diseño:} alineación, espacios, líneas sueltas, jerarquía, contraste. \\[1mm] \textbf{Criterio:} ¿confunde o solo me molesta? \\[1mm] \textbf{Método:} descansar, leer en voz alta, pasar por otro.
  errores_comunes: |-
    (1) \textbf{Corregir en caliente}: recién escrito, el autor no ve nada. (2) \textbf{Corregir preferencias}: cambiar el estilo de otro no es corregir. (3) \textbf{Revisar solo texto}: la mitad de los problemas de una revista son de diseño. (4) \textbf{No leer en voz alta}: la lectura silenciosa se salta lo que la boca tropieza. (5) \textbf{No verificar los datos copiados}: una cifra mal transcrita es el error más caro y el que menos se busca.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Las dos capas y el criterio». \textbf{Formato:} los cinco errores típicos de cada capa, los doce errores clasificados y el criterio con que resolvieron los desacuerdos. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} resolvieron por lo menos un desacuerdo con el criterio escrito.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Diez correcciones sobre lo tuyo} (30 min · individual). (1) Deja descansar tus páginas al menos una hora antes de empezar. (2) Léelas completas en voz alta, sin corregir nada todavía. (3) Encuentra cinco errores de texto y cinco de diseño en tu propia revista. (4) Captura cada uno antes de tocarlo y después de arreglarlo. (5) Anota en cada uno su capa y si confundía o solo te molestaba. (6) Cierra escribiendo qué patrón se repite en tus errores.
  pilares:
  - |-
    \textbf{Tu entrega tiene dos piezas.} Las diez correcciones con antes y después. Y el patrón que reconoces al final, que es lo que de verdad te llevas.
  - |-
    \textbf{Descansar y leer en voz alta no son adornos del método.} Son las dos cosas que hacen aparecer errores que llevabas días mirando sin ver. Si te saltas ese paso, vas a encontrar tres y no diez.
  - |-
    \textbf{El patrón importa más que los diez errores.} «Se me van las tildes en los pretéritos» o «siempre dejo el pie de foto desalineado» son hallazgos que sirven el resto del año. Diez errores sueltos se corrigen y se olvidan.
  - |-
    \textbf{Corregir lo propio incomoda.} Es normal. La diferencia entre alguien que mejora y alguien que se estanca suele estar ahí, y no en el talento.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Las páginas descansaron al menos una hora. \\[1mm] \checkbox Las leíste completas en voz alta. \\[1mm] \checkbox Cinco correcciones de texto y cinco de diseño. \\[1mm] \checkbox Captura del antes y del después en cada una. \\[1mm] \checkbox Cada una dice si confundía o solo molestaba. \\[1mm] \checkbox Escrito el patrón que se repite en tus errores.
  plantilla_guion: |-
    \textbf{Error.} \textit{Qué estaba mal.} \\[1mm] \textbf{Capa.} \textit{Texto o diseño.} \\[1mm] \textbf{Antes y después.} \textit{Las dos capturas.} \\[1mm] \textbf{Criterio.} \textit{Confundía o solo me molestaba.} \\[1mm] \textbf{Patrón.} \textit{Qué se repite en lo mío.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Diez correcciones sobre lo mío». \textbf{Formato:} las diez correcciones con su capa, su criterio y la referencia a las capturas, más el patrón escrito al final. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} el patrón está escrito y se puede vigilar la próxima vez.
  producto_titulo: Diez correcciones documentadas sobre la propia revista + el patrón de tus errores
  criterios:
  - Hay cinco correcciones de texto y cinco de diseño
  - Cada una tiene captura del antes y del después
  - Cada una dice si el error confundía al lector o solo molestaba al autor
  - Se nota que las páginas descansaron y se leyeron en voz alta
  - El patrón final nombra algo que se repite y se puede vigilar
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.3
    cita: |-
      El respeto es silencio, pero no silencio del que nada tiene que decir, sino del que todo tiene que escuchar porque nada sabe del otro como otro.
    aplicacion: |-
      Corregir bien empieza por callarse. Leer entero lo del otro antes de opinar, aunque desde el segundo renglón ya tengas una lista. Lo que quieres decir casi siempre cambia cuando terminas de leer.
    pregunta_espejo: |-
      ¿Cuándo empecé a corregir a alguien antes de haber terminado de leerlo?
  estoico:
    autor: Marco Aurelio · Meditaciones VIII, 16 (c. 175 d.C.)
    cita: |-
      Acuérdate que igualmente te es libre el mudar de parecer y el seguir el aviso de quien te corrija.
    aplicacion: |-
      Es la otra mitad del oficio. Recibir una corrección no es perder: es que alguien miró tu trabajo con el cuidado suficiente para encontrarle algo. Lo difícil es distinguir eso de que te impongan un gusto.
    pregunta_espejo: |-
      De las correcciones que me hicieron, ¿cuál rechacé por orgullo y no por criterio?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    cita: |-
      El verdadero problema epistemológico de los grandes datos son los pequeños patrones. (trad. propia)
    aplicacion: |-
      En tus diez errores hay un patrón, y ese patrón vale más que los diez juntos. Encontrarlo es lo que hace que la sesión siguiente empiece con menos errores en lugar de con los mismos.
    pregunta_espejo: |-
      ¿Qué se repite en mis errores, y desde cuándo lo vengo repitiendo sin notarlo?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con las diez correcciones y el patrón escrito. Pásale una página tuya a un compañero y pídele solo lo que confunda, no lo que le disguste. En la sesión 9 maquetas la revista completa con todo esto ya adentro.
web:
  resumen: |-
    Entre el pueblo wayuu, en La Guajira, la palabra pasa por un tercero antes de que el daño crezca: el palabrero no busca averiguar quién tiene la razón, sino evitar que la ofensa se convierta en guerra. Corregir es poner un tercero entre lo que escribiste y quien va a leerlo, y la pregunta que ordena todo es si el error confunde o solo te molesta.
  subtema: Diseño editorial digital · Edición y corrección
  pre_lectura:
    por_que_importa: |-
      Cuando tú escribes, tu cerebro completa lo que falta. Cuando otro lee, no completa nada. Por eso nadie corrige bien su propio texto recién escrito.
    pregunta_detonante: |-
      ¿Cuál fue el último error tuyo que solo viste cuando ya estaba publicado?

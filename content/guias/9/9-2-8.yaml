titulo: Edición y corrección --- el ojo crítico
producto_final: |-
  Bitácora de 10 errores corregidos (5 de texto + 5 de diseño) sobre las propias páginas de la revista, cada uno con foto del error, descripción y corrección aplicada
saber_ancestral_idea: |-
  El oficio del corrector existía antes de la imprenta y existe después de Word: leer con un ojo distinto al del autor, encontrar lo que él ya no ve. En las tipografías colombianas del siglo XX, el corrector era casi tan importante como el diagramador. Heredar ese oficio es heredar el rigor.
verbos_actividades:
- IDENTIFICA
- ANALIZA
- EVALÚA
- APLICA

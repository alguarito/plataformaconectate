titulo: Maquetar la revista completa --- flujo de trabajo
producto_final: |-
  Revista digital de 8 páginas con tema propio del estudiante (cultura local, ciencia, deporte, arte, etc.), exportada como PDF y subida a una URL pública (Google Drive, Issuu, Notion o equivalente)
saber_ancestral_idea: |-
  El diagramador tradicional armaba la revista físicamente, pegando recortes en una mesa, decidiendo qué iba antes y qué después con todo a la vista. Maquetar digitalmente conserva ese gesto: tener todas las páginas visibles a la vez para decidir el ritmo del conjunto, no solo la belleza de cada parte.
verbos_actividades:
- ANALIZA
- APLICA
- CREA
- EVALÚA

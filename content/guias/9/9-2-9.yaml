apertura:
  saber_ancestral: |-
    Los wounaan, en las selvas del Chocó, tejen canastos en fibra de palma de werregue. La pieza se arma en rollo: se empieza por el centro y se cose vuelta sobre vuelta (Universidad del Rosario, 2023). El orden no es negociable. Cada vuelta se apoya en la anterior, y ninguna se puede adelantar ni deshacer sin arruinar la pieza. Quien teje decide el conjunto antes de dar la primera vuelta. Los diseños hablan de la vida cotidiana, de la naturaleza y de las creencias del pueblo. La \textbf{cara de exclusión} está en el registro. La técnica se enseña hoy en talleres universitarios de Bogotá. Y la página que la documenta nombra al pueblo y a la técnica, pero no a ninguna tejedora.
  origen: Cestería wounaan en fibra de werregue · el canasto tejido en rollo desde el centro
  fuente: |-
    Universidad del Rosario, Facultad de Creación. (2023). \emph{Saberes artesanales: taller de tejeduría en werregue}.
  saber_contemporaneo: |-
    Maquetar una revista digital de ocho páginas exige tener el conjunto a la vista antes de tocar una sola página. Son cinco cosas. Vista general de las ocho. Secuencia con ritmo, para que no sean ocho páginas con la misma estructura. Coherencia del sistema visual --- grilla, tipografía, paleta --- en todas. Exportación en PDF. Y publicación con una URL que cualquiera pueda abrir. Es la sesión de \emph{cosecha} del periodo: aquí converge todo lo de las ocho sesiones anteriores.
  pregunta_puente: |-
    ¿Por qué en un canasto de werregue no se puede adelantar una vuelta? ¿Y qué le pasa a quien maqueta la página 6 de su revista antes de haber decidido qué va en la 2?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los elementos de una revista de ocho páginas y su orden típico; (2) \textbf{analizar} el flujo narrativo y visual entre páginas para planear el conjunto; (3) \textbf{aplicar} un flujo de trabajo que te lleve de la planeación a una revista publicada con URL.
puentes:
  a_ruta: |-
    Esta es la sesión más larga del periodo: en una sola vas a maquetar ocho páginas. Las sesiones 1 a 8 te prepararon. Hoy todo converge en un producto real y publicado.
  a_escuta: |-
    Antes de maquetar, vas a estudiar la estructura de una revista de ocho páginas. Qué va en portada, qué en contraportada y cómo se reparte el contenido en las seis intermedias. Eso evita la tentación del primer borrador.
  a_sistematizacion: |-
    Ya viste la estructura. Ahora vas a entender el \textbf{flujo de trabajo}: los pasos para maquetar ocho páginas sin perderte. Sin método te dispersas a la primera hora de un trabajo largo.
  a_praxis: |-
    Tienes el método. Toca producir. Tu revista completa, con tema propio, ocho páginas, sistema visual coherente, exportada en PDF y publicada con URL.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: una revista digital de ocho páginas publicada. El criterio principal es que se sienta un cuerpo y que la URL funcione para cualquiera con conexión.
  a_evaluacion: |-
    Antes de cerrar, mira tu revista publicada desde las cinco dimensiones humanas. Es la pieza editorial más sustantiva que has producido. Vale la pena nombrar qué significa.
  a_triangulo: |-
    Y para terminar, tres voces sobre el oficio de armar algo largo. Dussel sobre el orden real del saber, Marco Aurelio sobre hacer bien lo que se tiene entre manos, Floridi sobre acumular sin comprender.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Anatomía de una revista} (15 min · individual). (1) Busca dos revistas reales de ocho páginas o más: una cultural y una temática de lo que te interese. (2) Para cada una, anota qué va en la portada y qué en la contraportada. (3) Anota cómo se reparte el contenido principal entre las páginas del medio. (4) Anota si hay sumario o índice y si hay sección editorial. (5) Dibuja el esquema de las ocho páginas de una de las dos, con la función de cada una.
  checks:
  - |-
    Revisé dos revistas reales de ocho páginas o más.
  - |-
    Identifiqué qué va en portada, en contraportada y en las páginas internas.
  - |-
    Dibujé el esquema completo de una de las dos con la función de cada página.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Anatomía de una revista». \textbf{Formato:} el esquema dibujado de las ocho páginas de una de las dos revistas, con una etiqueta por página que diga qué contiene. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} puedes nombrar la función de cada una de las ocho páginas sin volver a mirar la revista.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · ANALIZA --- El plan de mis ocho páginas} (20 min · parejas). (1) Con tu pareja, escriban la estructura típica de una revista de ocho páginas. (2) Escriban el flujo de trabajo en sus cuatro fases con el tiempo que lleva cada una. (3) Cada uno arma la tabla de sus ocho páginas con el contenido y el tipo de visual de cada una. (4) Intercambien las tablas y marquen dónde el ritmo se repite demasiado.
  pilares:
  - |-
    Toda revista de ocho páginas se descompone en una estructura típica. La \textbf{portada} lleva titular, imagen y número o fecha. La \textbf{página 2} lleva editorial o sumario. Las \textbf{páginas 3 a 7} llevan el contenido principal, que pueden ser dos o tres artículos. La \textbf{página 8} es la contraportada. Hay variaciones, pero esa base sirve.
  - |-
    Todo flujo de maquetación sigue el patrón «planear, maquetar, revisar, publicar». Media hora para planear contenido y secuencia. El grueso del tiempo para maquetar. Media hora para revisar y corregir. Y media hora para exportar y publicar. Saltarse la planeación es la causa principal de las revistas que se sienten desordenadas.
  - |-
    Todo se juega en una pregunta: al pasar las ocho páginas en orden, ¿hay ritmo o se sienten todas iguales? Una revista necesita variación visual. Algunas páginas con más texto, otras con más imagen, alguna de respiro. Pero la variación no puede romper la coherencia del sistema.
  - |-
    Pasos para maquetar ocho páginas: (1) lista qué contendrá cada una; (2) abre ocho lienzos; (3) aplica la grilla y la paleta a todas antes de maquetar nada; (4) maqueta una a una empezando por la más simple; (5) revisa el conjunto cada dos o tres páginas; (6) corrige; (7) exporta en PDF; (8) sube el archivo y verifica la URL.
  anatomia:
    titulo: Anatomía de una revista de 8 páginas
    body: |-
      \textbf{Portada (p.\,1):} titular, imagen y número o fecha. \\[1mm] \textbf{Editorial o sumario (p.\,2):} entrada y lista de contenidos. \\[1mm] \textbf{Artículo principal (p.\,3--5):} dos o tres páginas. \\[1mm] \textbf{Artículo secundario (p.\,6--7):} una o dos páginas. \\[1mm] \textbf{Contraportada (p.\,8):} cierre, cita o crédito. \\[1mm] \textbf{Sistema visual:} la misma grilla, la misma tipografía y la misma paleta en las ocho.
  errores_comunes: |-
    (1) Maquetar sin planear: empiezas y en la página 4 descubres que no tienes contenido para la 6. (2) Cambiar el sistema visual por aburrimiento y romper la coherencia a mitad de camino. (3) Hacer las ocho páginas iguales, sin ninguna variación de ritmo. (4) Dejar la contraportada en blanco o con texto de relleno. (5) Exportar como imágenes sueltas en vez de un PDF.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} \textbf{Título:} «Actividad 2 --- Plan de mi revista de ocho páginas». \textbf{Formato:} tabla de ocho filas y tres columnas (página / contenido / tipo de visual), más la marca de tu pareja donde el ritmo se repite. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tienes el plan completo antes de tocar la herramienta digital.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Maqueta, exporta y publica} (40 min · individual). (1) Abre ocho lienzos en tamaño A4 vertical. (2) Aplica la grilla y la paleta a los ocho antes de maquetar nada. (3) Maqueta una a una siguiendo tu plan, empezando por la página más fácil. (4) Revisa el conjunto cada dos o tres páginas para que el sistema no se te vaya. (5) Exporta en PDF. (6) Sube el archivo, abre la URL en una pestaña nueva y comprueba que carga.
  pilares:
  - |-
    Tu maquetación se descompone en cinco fases: el plan en cuaderno, la maquetación en la herramienta, la revisión de coherencia entre las ocho, la exportación en PDF y la publicación con URL verificada. Ninguna se puede saltar sin que se note en el resultado.
  - |-
    Sigue el patrón «versión 1 publicada vence a versión 5 perfecta sin publicar». Tu primera revista no va a ser perfecta. La pregunta es si la publicas o si te quedas puliéndola para siempre.
  - |-
    Cada página expresa una idea principal. Si tu página 4 quiere decir tres cosas, divídela o elige una. Una página que dice tres cosas no dice ninguna.
  - |-
    Algoritmo: (1) ten el plan de las ocho páginas escrito; (2) abre ocho lienzos A4 vertical; (3) aplica grilla y paleta a todos; (4) maqueta una a una desde la más fácil; (5) revisa el conjunto; (6) exporta en PDF; (7) sube y verifica la URL en una pestaña nueva.
  checklist:
    titulo: Checklist antes de dar la revista por publicada
    items: |-
      \checkbox Ocho páginas maquetadas con el mismo sistema visual. \\[1mm] \checkbox Portada con titular, imagen y número o fecha. \\[1mm] \checkbox Editorial o sumario en la página 2. \\[1mm] \checkbox Contraportada resuelta, no en blanco. \\[1mm] \checkbox Exportada como PDF y no como imágenes sueltas. \\[1mm] \checkbox URL abierta en una pestaña nueva y comprobada.
  plantilla_guion: |-
    \textbf{Tema de mi revista.} \textit{Una frase corta.} \\[1mm] \textbf{Plan de ocho páginas.} \textit{Tabla con contenido y tipo de visual.} \\[1mm] \textbf{URL pública.} \textit{Enlace al PDF, ya comprobado.} \\[1mm] \textbf{Decisión más fuerte.} \textit{La decisión visual que defenderías.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} \textbf{Título:} «Actividad 3 --- Mi revista de ocho páginas publicada». \textbf{Formato:} el plan de las ocho páginas, la URL, las capturas de portada, un interior y contraportada, y tres renglones sobre la decisión que defenderías y la que rehacías. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} un compañero abre tu URL desde su equipo y la revista carga.
  producto_titulo: Revista digital de 8 páginas con tema propio, exportada en PDF y publicada con URL
  criterios:
  - Ocho páginas maquetadas con la misma grilla, tipografía y paleta
  - Portada con titular, imagen y número o fecha
  - Editorial o sumario en la página 2 y contraportada resuelta en la 8
  - Exportada en PDF, no como imágenes sueltas
  - URL comprobada por un compañero desde otro equipo
  - Tres renglones sobre la decisión más fuerte y la más débil
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §5.5.2
    cita: |-
      Es un error pensar que la ciencia pura… aplica ella misma alguna de sus conclusiones, apareciendo la tecnología como su concreta creación… Muy por el contrario, es el discurso técnico artesanal o tecnológico… echa mano… de conclusiones o teorías científicas.
    aplicacion: |-
      El orden real del saber va del oficio hacia la teoría, no al revés. Tú no aprendiste a maquetar leyendo sobre grillas: lo estás aprendiendo al armar ocho páginas que tienen que encajar. La teoría del periodo va a quedar sostenida por este producto, y no al contrario.
    pregunta_espejo: |-
      ¿Qué entendí de verdad recién cuando lo tuve que hacer, y no cuando lo leí?
  estoico:
    autor: Marco Aurelio · Meditaciones II, 5 (c. 175 d.C.)
    cita: |-
      Haz lo que tienes entre manos con dignidad perfecta y sencilla, con afecto, con libertad y con justicia, y líbrate de todo otro pensamiento. (trad. propia)
    aplicacion: |-
      Ocho páginas se maquetan de a una. La página que tienes entre manos es la única que importa mientras la haces. Pensar en las siete que faltan es la forma más rápida de no terminar ninguna. El tejido en rollo funciona igual: una vuelta a la vez, apoyada en la anterior.
    pregunta_espejo: |-
      Cuando me atasqué, ¿fue por la página que tenía delante o por todas las que faltaban?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.5
    cita: |-
      Se suponía que acumular información y conocimiento llevaría a comprender mejor… pero esa expansión sin fin cada vez describe peor nuestra experiencia diaria. (trad. propia)
    aplicacion: |-
      Ocho páginas obligan a dejar cosas fuera. Tienes más material del que cabe, y meterlo todo no hace mejor la revista: la hace ilegible. Lo que decide la calidad no es cuánto reuniste, sino qué escogiste dejar afuera y por qué.
    pregunta_espejo: |-
      ¿Qué dejé fuera de mi revista, y podría defender esa decisión en voz alta?
compromiso: |-
  \textbf{Para la próxima semana.} Comparte la URL de tu revista con tres personas distintas: alguien de tu casa, un compañero y un docente. Pídele a cada uno una observación honesta. No discutas las observaciones: anótalas. Esas tres voces son el insumo de la sustentación pública de la sesión 10.
web:
  resumen: |-
    Produces tu revista digital de ocho páginas con tema propio, sistema visual coherente, exportada en PDF y publicada con URL. Es el producto integrador del periodo.
  subtema: Diseño editorial digital · Producto integrador
  pre_lectura:
    por_que_importa: |-
      Aquí converge todo lo de las ocho sesiones anteriores. Una revista de ocho páginas publicada con URL es prueba real de oficio: pasaste de la teoría a un producto que otro puede abrir.
    pregunta_detonante: |-
      Si dentro de cinco años alguien te pidiera un solo trabajo del colegio que demostrara tu oficio, ¿qué le mostrarías?
    activacion:
      titulo: El test de la mesa entera
      descripcion: |-
        En 3 minutos, abre dos revistas y déjalas extendidas en orden. Camina alrededor y míralas desde dos metros. ¿Qué hace que el conjunto se sienta coherente y no fragmentado?
      duracion_min: 3
    conexion:
      anterior: |-
        En las sesiones 7 y 8 trabajaste accesibilidad y corrección sobre páginas sueltas.
      siguiente: |-
        En la sesión 10 sustentas públicamente tu revista ante el curso y defiendes tus decisiones.

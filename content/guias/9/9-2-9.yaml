  conceptos_clave:
  - categoria: La estructura
    termino: Estructura de ocho páginas
    definicion: |-
      Portada, editorial o sumario, contenido principal en las intermedias y contraportada. Es la base que admite variaciones.
    ejemplo: |-
      Portada, sumario en la 2, artículo principal de la 3 a la 5, secundario en 6 y 7, cierre en la 8.
  - categoria: La estructura
    termino: Ritmo del conjunto
    definicion: |-
      La variación entre páginas que evita que las ocho se sientan iguales sin romper la coherencia.
    ejemplo: |-
      Una página densa de texto, después una de imagen grande, después una de respiro con una cita.
  - categoria: El flujo de trabajo
    termino: Planear antes de maquetar
    definicion: |-
      Decidir el contenido de las ocho páginas antes de abrir la herramienta. Es lo que más se salta y lo que más se nota.
    ejemplo: |-
      La tabla de ocho filas en el cuaderno evita descubrir en la página 4 que falta material para la 6.
  - categoria: El flujo de trabajo
    termino: Coherencia del sistema
    definicion: |-
      La misma grilla, la misma tipografía y la misma paleta en las ocho páginas, sin excepciones de última hora.
    ejemplo: |-
      Cambiar la tipografía en la página 4 porque cansó la anterior rompe el conjunto entero.
  - categoria: Publicar
    termino: Exportar en PDF
    definicion: |-
      El PDF conserva tipografía, color y disposición en un solo documento. Las imágenes sueltas pierden el orden.
    ejemplo: |-
      Ocho archivos de imagen obligan al lector a ordenarlos; un PDF llega ya como revista.
  - categoria: Publicar
    termino: URL comprobada
    definicion: |-
      El enlace no está publicado hasta que alguien más lo abre desde otro equipo y funciona.
    ejemplo: |-
      Un enlace con permisos restringidos abre bien en tu sesión y falla en la de cualquier otro.
  cinco_dimensiones:
    personal: |-
      Produjiste tu primera pieza editorial completa con URL pública. Es una prueba de oficio que puedes mostrar.
    emocional: |-
      Sostener el trabajo hasta el final entrenó algo que no aparece en la nota: la capacidad de terminar.
    ciudadana: |-
      Tu revista suma una voz nueva a la infoesfera. Pequeña, pero tuya y no copia de otra.
    local: |-
      El canasto de werregue se teje en un orden que no se puede saltar. Tu revista también, aunque el material sea otro.
    intergeneracional: |-
      Quien teje decide el conjunto antes de la primera vuelta. Ese cuidado por el todo se enseña y se hereda en los oficios.
  post_lectura:
    transferencia: |-
      Esta semana comparte la URL con tres personas distintas y pídele a cada una una observación honesta. No discutas: anótalas. Son el insumo de la sustentación de la sesión 10.
  quiz:
    titulo: Verifica el flujo de maquetación
    instrucciones: 5 preguntas para confirmar que puedes llevar una revista de la planeación a la URL. Necesitas 3/5 para continuar.
    preguntas:
    - enunciado: ¿Qué va típicamente en la página 2 de una revista de ocho páginas?
      opciones:
      - El editorial o el sumario, que dan la entrada y anuncian lo que viene después
      - La contraportada, porque es la página que se lee justo después de la cubierta
      - Un anuncio de publicidad, que es lo que financia la impresión de la revista
      - Una imagen suelta a página completa, sin texto, para que la vista descanse
      respuesta_index: 0
      feedback_correcto: |-
        Correcto. La página 2 es la entrada: dice de qué va la revista y qué viene después.
      feedback_incorrecto: |-
        La contraportada es la 8. La 2 es la entrada de la revista: editorial o sumario.
    - enunciado: ¿Por qué planear las ocho páginas en el cuaderno antes de abrir la herramienta?
      opciones:
      - Porque los docentes piden siempre una evidencia escrita antes del trabajo digital
      - Porque la herramienta digital funciona más rápido si uno ya sabe lo que va a hacer
      - Porque saltarse la planeación es la causa principal de las revistas desordenadas
      - Porque el cuaderno permite dibujar bocetos que la herramienta no deja hacer igual
      respuesta_index: 2
      feedback_correcto: |-
        Exacto. Sin plan, el material se acaba a mitad de camino y las últimas páginas se rellenan.
      feedback_incorrecto: |-
        No es un requisito escolar. Sin plan descubres en la página 4 que no tienes con qué llenar la 6.
    - enunciado: ¿Qué hace que las ocho páginas se sientan un cuerpo y no páginas sueltas?
      opciones:
      - Que todas lleven el mismo color de fondo de principio a fin de la revista
      - Que todas estén numeradas en el mismo lugar y con la misma tipografía pequeña
      - Que todas tengan exactamente la misma estructura de columnas y de imágenes
      - Coherencia del sistema visual combinada con variación de ritmo entre páginas
      respuesta_index: 3
      feedback_correcto: |-
        Sí. Coherencia sin variación aburre; variación sin coherencia desarma. Hacen falta las dos.
      feedback_incorrecto: |-
        Ni el fondo ni la numeración bastan, y páginas idénticas no son un cuerpo: son una repetición.

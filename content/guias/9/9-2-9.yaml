titulo: Maquetar la revista completa --- flujo de trabajo
titulo_portada: |-
  Maquetar la
  revista completa ---
  flujo de trabajo
producto_final: Revista digital de 8 páginas con tema propio del estudiante (cultura local, ciencia, deporte, arte, etc.), exportada como PDF y subida a una URL pública (Google Drive, Issuu, Notion o equivalente)
apertura:
  saber_ancestral: |-
    Las \textbf{tejedoras Misak del Cauca} arman sus \emph{chumbes} con una planificación previa rigurosa: deciden el patrón general antes de tejer la primera fila, porque cada figura geométrica debe encajar con la siguiente y con el todo. Si una sola fila se equivoca, el calendario codificado se rompe. Esa misma lógica de \emph{ver el conjunto antes de tejer la parte} es la que practicaba el \textbf{diagramador tradicional} en las imprentas del Valle (Cali, Cartago, Tuluá): armaba la revista físicamente, pegando recortes en una mesa, decidiendo qué iba antes y qué después con \emph{todo a la vista}. Los maestros diagramadores tenían mesas enormes donde extendían las 16, 24 o 32 páginas de la revista a la vez. Caminaban alrededor de la mesa, miraban desde lejos, ajustaban. La revista nacía como cuerpo completo, no como páginas sueltas. \textbf{Maquetar digitalmente conserva ese gesto}: tener todas las páginas visibles a la vez para decidir el \emph{ritmo del conjunto}, no solo la belleza de cada parte.
  origen: Tradición del diagramador en imprentas colombianas del siglo XX
  saber_contemporaneo: |-
    Hoy maquetar una revista digital de 8 páginas en Figma, Canva o Adobe Express significa: (a) tener \textbf{vista general} de las 8 páginas; (b) verificar que la \textbf{secuencia narrativa} tenga ritmo (no 8 páginas con la misma estructura); (c) mantener \textbf{coherencia del sistema visual} (grilla, tipografía, paleta) a través de todas; (d) \textbf{exportar} como PDF profesional; (e) \textbf{publicar} con URL pública para compartir. Es la sesión de \emph{cosecha} del periodo: aquí converge todo lo aprendido en las 8 sesiones anteriores.
  pregunta_puente: |-
    Cuando miras una revista bien hecha y la pasas página por página, ¿qué hace que el conjunto se sienta ``un cuerpo'' y no ``8 páginas pegadas''? Hoy vas a aprender a producir esa coherencia.
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los elementos de una revista de 8 páginas y su orden típico; (2) \textbf{analizar} el flujo narrativo y visual de una revista entre páginas; (3) \textbf{aplicar} sistema visual coherente a 8 páginas distintas; (4) \textbf{crear} y publicar tu propia revista digital de 8 páginas con tema propio.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Esta es la sesión más larga e intensa del periodo: en una sesión vas a maquetar 8 páginas. Las sesiones 1-8 te prepararon. Hoy converge todo en producto real.
  a_escuta: |-
    Antes de maquetar tu revista, vamos a estudiar la estructura típica de una revista de 8 páginas: qué va en portada, qué en contraportada, cómo se distribuye el contenido en las 6 páginas intermedias. Eso evita la tentación del primer borrador.
  a_sistematizacion: |-
    Ya viste la estructura. Ahora vamos a entender el \textbf{flujo de trabajo del diagramador}: 5 pasos para maquetar 8 páginas sin perderte. Sin método, te vas a dispersar a la hora 1 de un trabajo de 4 horas.
  a_praxis: |-
    Tienes el método. Toca producir: tu revista completa. Tema propio elegido por ti (cultura local, ciencia, deporte, música, etc.), 8 páginas, sistema visual coherente, exportada como PDF, publicada con URL.
  a_producto: |-
    Lo que sigue resume qué entregas hoy: revista digital de 8 páginas publicada. El criterio principal: que se sienta ``un cuerpo'' coherente y la URL funcione para cualquiera con internet.
  a_evaluacion: |-
    Antes de cerrar, mira tu revista publicada desde las cinco dimensiones humanas. Es la pieza editorial más sustantiva que has producido hasta hoy. Vale la pena nombrar qué significa.
  a_triangulo: |-
    Y para terminar, tres voces sobre maquetar. Dussel sobre quién aparece en la revista, Marco Aurelio sobre la persistencia en oficio largo, Floridi sobre publicar como acto en la infoesfera.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Estructura de una revista de 8 páginas} (15 min · individual). Busca \textbf{2 revistas} reales (impresas o digitales) de 8-16 páginas: una cultural seria (Bocas, Cromos, El Malpensante) y una temática (música, deporte, ciencia, naturaleza). Para cada una: ¿qué va en portada? ¿qué en contraportada? ¿cómo se distribuye el contenido principal? ¿hay sumario o índice? ¿hay sección editorial?
  checks:
  - Analicé 2 revistas reales con 8+ páginas.
  - Identifiqué qué va en portada, contraportada y páginas internas.
  - Reconocí la presencia de sumario, editorial u otras secciones recurrentes.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Anatomía de una revista». \textbf{Formato:} esquema dibujado de las 8 páginas de UNA de las 2 revistas analizadas (portada, p.2, p.3...p.8) con etiqueta de qué contiene cada una. \textbf{Sabes que terminaste cuando} puedes nombrar la función de cada una de las 8 páginas en un esquema.
sistematizacion:
  intro: |-
    Maquetar 8 páginas requiere flujo de trabajo, no improvisación. Vamos a descomponerlo con los pilares del pensamiento computacional para que tengas mapa antes de empezar 4 horas de trabajo.
  pilares:
  - |-
    Toda revista de 8 páginas se descompone en estructura típica: (1) \textbf{Portada} (titular principal + imagen impactante + número/fecha), (2) \textbf{Página 2}: editorial o sumario, (3) \textbf{Páginas 3-7}: contenido principal (puede ser 2-3 artículos), (4) \textbf{Página 8}: contraportada (cierre visual, anuncio, crédito o cita destacada). Variaciones existen, pero esa base sirve.
  - |-
    Todo flujo de trabajo de maquetación sigue el patrón \textbf{``planear, maquetar, revisar, publicar''}: 30 min planear contenido y secuencia, 2-3 horas maquetar, 30 min revisar/corregir, 30 min exportar y publicar. Saltar planear es la causa principal de revistas que ``se sienten desordenadas''.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿al pasar las 8 páginas en orden, hay ritmo o todas se sienten iguales?}. Una revista debe tener variación visual (algunas páginas con más texto, otras con más imagen, otras de respiro) sin perder coherencia.
  - |-
    Pasos para maquetar 8 páginas: (1) lista las 8 páginas y qué contendrá cada una (planeación); (2) abre 8 lienzos en tu herramienta; (3) aplica grilla y paleta a todas (coherencia); (4) maqueta una a una, empezando por la más simple; (5) revisa el conjunto cada 2-3 páginas; (6) corrige; (7) exporta como PDF; (8) sube a Drive/Issuu/Notion para URL pública.
  anatomia:
    titulo: Anatomía de una revista de 8 páginas
    body: |-
      \textbf{Portada (p.1):} titular + imagen + número/fecha. \\[1mm] \textbf{Editorial/Sumario (p.2):} introducción + lista de contenidos. \\[1mm] \textbf{Artículo principal (p.3-5):} 2-3 páginas, spread completo. \\[1mm] \textbf{Artículo secundario (p.6-7):} 1-2 páginas. \\[1mm] \textbf{Contraportada (p.8):} cierre, cita, crédito o anuncio. \\[1mm] \textbf{Sistema visual coherente:} grilla + tipografía + paleta consistentes en las 8.
  errores_comunes: |-
    (1) Maquetar sin planear: empiezas y a la página 4 te das cuenta que no tienes contenido para la 6. (2) Variar el sistema visual por aburrimiento: cambias tipografía en la página 4 y rompes coherencia. (3) Hacer las 8 páginas iguales: sin variación de ritmo. (4) Olvidar la contraportada: la dejas en blanco o con lorem ipsum. (5) Exportar como JPG (deforma) en vez de PDF.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Plan de mi revista de 8 páginas». \textbf{Formato:} tabla de 3 columnas (Página~|~Contenido~|~Tipo de visual --- foto, texto, infografía, cita), 8 filas. \textbf{Sabes que terminaste cuando} tienes plan completo antes de tocar la herramienta digital.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Maqueta, exporta y publica tu revista} (40 min · individual). Esta sesión es más extensa de lo normal porque produces el producto integrador del periodo. Vas a tener tu revista de 8 páginas publicada antes de salir de aula.
  pilares:
  - |-
    Tu maquetación se descompone en 5 fases: (1) plan en cuaderno (8 páginas con contenido y tipo de visual), (2) maquetar en la herramienta (4 horas reales pero hoy 40 min para versión 1.0), (3) revisar coherencia visual entre las 8, (4) exportar como PDF, (5) subir a plataforma para URL pública.
  - |-
    Sigue el patrón \textbf{``versión 1 publicada vence a versión 5 perfecta sin publicar''}: tu primera revista no será perfecta. La pregunta es si la publicas o si te quedas perfeccionándola para siempre. Lección de Periodo 1: empezar imperfecto siempre vence a esperar perfecto.
  - |-
    Cada página expresa una idea principal. Si tu página 4 quiere decir 3 cosas, divídela en 3 páginas o elige una.
  - |-
    Algoritmo: (1) escribe el plan de 8 páginas en cuaderno (10 min); (2) abre 8 lienzos en tu herramienta digital con tamaño A4 vertical (5 min); (3) aplica grilla guía y paleta a todas (5 min); (4) maqueta una a una empezando por la más fácil (20 min, ritmo apretado para versión 1.0); (5) revisa el conjunto (5 min); (6) exporta como PDF; (7) sube a Drive con permisos públicos.
  checklist:
    titulo: Checklist antes de declarar la revista publicada
    items: |-
      \checkbox 8 páginas maquetadas con tu sistema visual coherente. \\[1mm] \checkbox Portada con titular + imagen + número/fecha. \\[1mm] \checkbox Editorial/sumario en p.2. \\[1mm] \checkbox Contraportada en p.8 (no en blanco). \\[1mm] \checkbox Exportada como PDF (no JPG suelto). \\[1mm] \checkbox URL pública accesible (Drive con permisos, Issuu, Notion). \\[1mm] \checkbox Verifiqué la URL en pestaña incógnita.
  plantilla_guion: |-
    \textbf{Tema de mi revista.} \textit{Frase corta.} \\[1mm] \textbf{Plan de 8 páginas.} \textit{Tabla con contenido y tipo de visual.} \\[1mm] \textbf{URL pública.} \textit{Link al PDF en Drive/Issuu/Notion.} \\[1mm] \textbf{Decisión más fuerte.} \textit{Qué decisión visual estás más orgulloso de.} \\[1mm] \textbf{Decisión más débil.} \textit{Qué cambiarías en una versión 2.0.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi revista de 8 páginas publicada». \textbf{Formato:} (1) plan de 8 páginas, (2) URL pública de la revista, (3) capturas de portada + 1 spread + contraportada, (4) reflexión personal de 3 renglones. \textbf{Extensión:} 2 páginas de cuaderno. \textbf{Sabes que terminaste cuando} tu URL es accesible y un compañero puede abrirla.
  producto_titulo: Revista digital de 8 páginas con tema propio, exportada como PDF y publicada con URL
  criterios:
  - 8 páginas maquetadas con sistema visual coherente (grilla + tipografía + paleta)
  - Portada con titular + imagen + número/fecha
  - Editorial o sumario en p.2
  - Contraportada en p.8 (no en blanco)
  - Exportada como PDF
  - URL pública accesible y verificada
  - Reflexión personal sobre decisión más fuerte y más débil
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda revista es un acto editorial: decide quién aparece, quién no, en qué tono y con qué peso.
    aplicacion: |-
      Tu revista de 8 páginas es decisión política, no solo estética. ¿Aparecen voces de tu región, tu colegio, tu barrio? ¿O reproduces el formato de revistas nacionales que solo dan voz a élites urbanas? Cada decisión de portada y de contenido principal incluye o invisibiliza. Atreverte a poner voces tradicionalmente excluidas es soberanía editorial.
    pregunta_espejo: |-
      ¿Quién aparece en mi revista y qué dice eso de mis decisiones editoriales inconscientes? ¿Qué historias del Valle o de mi colegio merecen aparecer y no estaban?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Persistir 4 horas en un oficio largo enseña más que 40 horas dispersas.
    aplicacion: |-
      Maquetar 8 páginas en una sola sesión exige persistencia que pocas tareas escolares piden. Es prueba estoica: aguantar el cansancio, mantener el criterio, no rendirse en la página 5 cuando te cansas. Esa persistencia es la habilidad profesional más subestimada --- y la que más distingue a quien sí termina proyectos de quien siempre los deja a medias.
    pregunta_espejo: |-
      ¿Qué proyectos he dejado a medias por cansancio o aburrimiento? ¿Qué cambiaría si entrenara la persistencia con esta revista como ejercicio?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Publicar es añadir un agente más a la infoesfera; cuídala como cuidarías un legado.
    aplicacion: |-
      Tu revista quedará en internet. Los archivos del futuro la guardarán. Alguien podría encontrarla en 10 años. Esa permanencia no debe paralizarte --- debe responsabilizarte. Cada decisión (qué publicas, qué ocultas, qué firmas) construye una versión de ti que vivirá más allá del aula.
    pregunta_espejo: |-
      Si dentro de 5 años alguien encuentra mi revista, ¿la voy a defender o la voy a esconder? ¿Qué cambia en mi maquetación si la pienso para durar?
compromiso: |-
  \textbf{Para la próxima semana.} Comparte la URL de tu revista con 3 personas distintas: un familiar, un compañero, un docente. Pide a cada uno UNA observación honesta. No discutas las observaciones: anótalas. Esas tres voces externas son insumo de la sustentación pública de la sesión 10. \emph{Felicitaciones por terminar el producto integrador del periodo.}
web:
  resumen: |-
    Produces tu revista digital de 8 páginas con tema propio, sistema visual coherente, exportada como PDF y publicada con URL. Es el producto integrador del periodo.
  subtema: Diseño editorial digital · Producto integrador
  pre_lectura:
    por_que_importa: |-
      Esta es la sesión de cosecha del periodo: aquí converge todo lo aprendido en las 8 sesiones anteriores. Producir una revista de 8 páginas publicada con URL es prueba real de oficio editorial. Pasaste de la teoría al producto.
    pregunta_detonante: |-
      Si dentro de 5 años un futuro empleador te pidiera mostrar UN trabajo del colegio que demostrara tu capacidad de oficio, ¿qué le mostrarías? Hoy puedes producir esa pieza.
    activacion:
      titulo: El test de la mesa entera
      descripcion: |-
        En 3 minutos, abre 2 revistas reales y déjalas extendidas en orden, página por página. Camina alrededor, mira desde 2 metros. ¿Qué hace que el conjunto se sienta coherente y no fragmentado? Esa mirada panorámica es la del diagramador.
      duracion_min: 3
    conexion:
      anterior: |-
        En las sesiones 7 y 8 hiciste accesibilidad y corrección. Hoy aplicas todo el sistema visual sobre tu producto integrador.
      siguiente: |-
        En la sesión 10 (cierre P2) sustentas públicamente tu revista al curso — exposición de 1 minuto por página.
  conceptos_clave:
    - termino: Estructura típica de 8 páginas
      definicion: |-
        Portada (p.1) + editorial/sumario (p.2) + contenido principal (p.3-7) + contraportada (p.8). Esta estructura sirve para la mayoría de revistas culturales o temáticas.
      ejemplo: |-
        Bocas o Cromos tienen variaciones, pero la base es la misma: una portada que captura, un sumario que orienta, contenido que desarrolla, contraportada que cierra.
      emoji: "📰"
    - termino: Planear antes de maquetar
      definicion: |-
        Antes de tocar la herramienta digital, listar las 8 páginas en cuaderno con qué contendrá cada una. Saltar planeación es la causa principal de revistas que se sienten desordenadas.
      ejemplo: |-
        10 minutos planeando ahorran 2 horas de reproceso. La diferencia entre amateur y profesional pasa por aquí.
      emoji: "📋"
    - termino: Coherencia visual entre páginas
      definicion: |-
        Las 8 páginas comparten grilla, tipografía y paleta. Cambiar el sistema en la página 4 rompe la sensación de "un cuerpo". La coherencia es lo que diferencia revista de carpeta de imágenes.
      ejemplo: |-
        Si tu titular usa Bricolage Grotesque en p.1, p.2, p.3, pero en p.4 cambias a Playfair sin razón, el lector siente extrañeza aunque no sepa explicar por qué.
      emoji: "🧵"
    - termino: Ritmo del conjunto
      definicion: |-
        Variación visual entre páginas: algunas con más texto, otras con más imagen, otras de respiro. Sin variación, las 8 páginas se sienten iguales y aburren.
      ejemplo: |-
        Después de un spread con mucho texto, la siguiente puede ser una página con imagen grande + cita destacada. El ojo agradece el respiro.
      emoji: "🎵"
    - termino: Exportar como PDF
      definicion: |-
        Formato profesional para compartir o imprimir. Conserva tipografía, color y disposición exactos. JPG por separado pierde la integridad del documento.
      ejemplo: |-
        En Figma: File > Export > PDF (selecciona todas las páginas). En Canva: Descargar > PDF (Estándar o Imprimir). En Adobe Express: Exportar > PDF.
      emoji: "📄"
    - termino: URL pública
      definicion: |-
        Enlace accesible para cualquiera con internet. Sube tu PDF a Google Drive con permisos públicos, Issuu (gratis para revistas), o página en Notion. La URL hace tu revista existir en el mundo.
      ejemplo: |-
        drive.google.com/file/xxxxxx con permiso "Cualquiera con el enlace puede ver". O issuu.com/turevista. La URL es prueba de existencia pública.
      emoji: "🔗"
  quiz:
    titulo: "✅ Verifica el flujo de maquetación"
    instrucciones: |-
      5 preguntas para confirmar que dominas la lógica del producto integrador. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Qué va típicamente en la página 2 de una revista de 8 páginas?
        opciones:
          - Contraportada
          - Editorial o sumario
          - Anuncio publicitario
          - Imagen suelta
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La p.2 suele tener editorial (presentación del número) o sumario (índice de contenidos). Orienta al lector antes de entrar al contenido principal.
        feedback_incorrecto: |-
          Editorial o sumario. La p.2 orienta al lector — le dice "qué vas a encontrar y por qué importa". Sin ella, el lector entra al contenido sin contexto.
      - enunciado: ¿Por qué planear las 8 páginas en cuaderno antes de abrir la herramienta digital?
        opciones:
          - Por costumbre escolar
          - Porque saltar planeación es la causa principal de revistas que se sienten desordenadas
          - Por moda
          - No es necesario
        respuesta_index: 1
        feedback_correcto: |-
          Sí. 10 minutos planeando ahorran 2 horas de reproceso. La diferencia entre amateur y profesional pasa por la planeación previa.
        feedback_incorrecto: |-
          Planeación previa = revista coherente. Sin ella, llegas a la página 4 sin saber qué va en la 6. Reproceso garantizado.
      - enunciado: ¿Qué hace que las 8 páginas se sientan "un cuerpo" y no "páginas sueltas"?
        opciones:
          - Que sean todas iguales
          - Coherencia visual (mismo grilla + tipografía + paleta) combinada con ritmo (variación entre páginas)
          - Que tengan numeración
          - Que tengan el mismo color de fondo
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Coherencia para que se sienta cuerpo + variación para que tenga ritmo. Iguales = aburren. Sin coherencia = se sienten sueltas.
        feedback_incorrecto: |-
          Coherencia + ritmo. Mismo sistema visual (coherencia) pero variación de contenido y peso entre páginas (ritmo). Las dos cosas a la vez.
      - enunciado: ¿Por qué exportar como PDF y no como JPGs sueltos?
        opciones:
          - PDF es más bonito
          - PDF conserva tipografía, color y disposición exactos en un documento unificado
          - JPGs no se pueden compartir
          - PDF pesa menos
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. PDF preserva integridad del documento. JPGs sueltos pierden la unidad de revista y desordenan las páginas.
        feedback_incorrecto: |-
          PDF = documento unificado con tipografía, color y disposición fieles. JPG suelto pierde la integridad de revista — son fotos sueltas, no publicación.
      - enunciado: En el saber ancestral del diagramador colombiano, ¿qué aplica a tu uso de Figma/Canva hoy?
        opciones:
          - Nada — ahora es digital
          - |-
            Que la revista nace como cuerpo completo, no como páginas sueltas — hay que verla entera, no una a una
          - Que las mesas de antes eran mejores
          - Que se pegaban recortes
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El diagramador caminaba alrededor de la mesa para ver todo. Tú abres las 8 páginas en miniatura para ver el cuerpo completo. Mismo gesto, formato digital.
        feedback_incorrecto: |-
          Ver entera, no una a una. El diagramador de antes y tú con Figma comparten la mirada panorámica. La revista es cuerpo, no colección.
  post_lectura:
    transferencia: |-
      Esta semana, comparte la URL de tu revista con 3 personas distintas: un familiar, un compañero, un docente. Pide UNA observación honesta a cada uno. Esas tres voces externas son insumo de la sustentación pública de la sesión 10.
  cinco_dimensiones:
    personal: Produjiste tu primera pieza editorial completa con URL pública — prueba real de oficio.
    emocional: |-
      Persistir 40 minutos en un trabajo largo entrenó algo más valioso que cualquier nota: tu capacidad de terminar.
    ciudadana: Tu revista aporta una voz nueva a la infoesfera — pequeña pero tuya, no copia de otras.
    local: |-
      Heredaste el oficio del diagramador colombiano del siglo XX: ver el cuerpo entero, no la página suelta.
    intergeneracional: |-
      Las imprentas de tu abuelo y tu Figma de hoy se encuentran en el mismo principio: la revista es cuerpo.

clave: 3-1
grado: 9
periodo: 3
sesion: 1
completo: false
titulo: ¿Qué es un dato? --- recolección con propósito
producto_final: |-
  1 hoja de cálculo con 20 datos reales recolectados por el estudiante (encuesta a 20 personas, observación, registro propio) y una pregunta concreta que esos datos van a responder
saber_ancestral_idea: |-
  El conteo de cosecha en el campo --- racimos por mata, mazorcas por surco, mantas por luna --- nunca fue vanidad estadística: era información para decidir. La abuela contaba para saber cuánto sembrar el próximo ciclo. Recoger datos sin propósito es desperdiciar el oficio milenario del conteo.
verbos_actividades:
- IDENTIFICA
- APLICA
- ANALIZA
- CREA

clave: 3-1
grado: 9
periodo: 3
sesion: 1
completo: true
duracion_min: 90
titulo: ¿Qué es un dato? --- recolección con propósito
titulo_portada: |-
  ¿Qué es un dato? ---
  recolección
  con propósito
producto_final: |-
  Una hoja de cálculo con veinte filas de datos reales que tú mismo recolectaste, entre tres y cinco columnas con su tipo declarado, y ninguna fila incompleta. La encabeza una pregunta acotada, escrita en una frase, y la cierra el uso previsto: qué vas a decidir con esos datos la próxima semana. El archivo se abre y se entiende sin que tú lo expliques.
apertura:
  origen: Registro Único de Víctimas · Cartago contado con fecha de corte
  fuente: |-
    Unidad para la Atención y Reparación Integral a las Víctimas. (2026). \emph{Cifras de víctimas municipal} [Conjunto de datos, corte 30 de junio de 2026]. Datos Abiertos Colombia.
  saber_ancestral: |-
    Cartago tenía 143.522 habitantes proyectados para 2025. Mira el \textbf{Registro Único de Víctimas}, con corte al 31 de diciembre de 2025. Allí, 7.631 personas víctimas de desplazamiento forzado figuran \textbf{ubicadas} en Cartago: viven allí. Otras 6.385 \textbf{declararon} su hecho en el municipio, y 2.624 sufrieron el desplazamiento \textbf{dentro} de Cartago. Son tres cifras distintas y ninguna es intercambiable. Sumando todos los hechos, con corte al 30 de junio de 2026 hay 9.393 personas víctimas ubicadas en Cartago. Comparando ese dato con la población proyectada, sale una razón aproximada: alrededor de uno de cada quince cartagüeños figura en el registro. Aproximada, porque los dos números tienen cortes distintos. En un salón de Cartago, «el que llegó de otra parte» no es una hipótesis. La \textbf{cara de exclusión}: estas cifras nombran desplazamiento forzado con su fuente, no como color local.
  saber_contemporaneo: |-
    Recolectar bien tiene cuatro elementos y el orden importa. \textbf{Pregunta acotada}: qué quieres responder, en una frase corta. \textbf{Instrumento}: encuesta, observación o registro, elegido según la pregunta. \textbf{Muestra}: a quién le preguntas y cuántos. \textbf{Tabla tipada}: columnas donde cada una guarda una sola clase de cosa, y con el tipo declarado. La regla es «pregunta primero, dato después». Cuando alguien dice «vamos a recoger datos del curso» sin pregunta, lo que recoge es ruido. Y hay tres palabras que el registro de víctimas enseña mejor que cualquier manual. \textbf{Unidad de análisis}: qué cuenta cada fila, si personas, hechos o declaraciones. \textbf{Fecha de corte}: hasta cuándo llegan los datos. \textbf{Metadato}: lo que hay que saber del dato para poder leerlo. Sin las tres, dos cifras del mismo tema parecen contradecirse cuando en realidad miden cosas distintas.
  pregunta_puente: |-
    Ubicado, declarado y ocurrido son tres cifras distintas del mismo municipio. ¿Qué contarías tú en cada fila de tu tabla, y estás seguro de que siempre es lo mismo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué datos tuyos recogen otros y cuáles registras tú mismo; (2) \textbf{explicar} qué son unidad de análisis, fecha de corte y metadato, con un ejemplo de cada uno; (3) \textbf{crear} una tabla de veinte filas reales con su pregunta acotada y su uso previsto.
puentes:
  a_ruta: |-
    En el periodo 2 produjiste una revista y aprendiste a decidir qué se ve primero. Este periodo trabajas con datos y terminas en un mini estudio. Hoy empieza por lo que casi siempre se salta: la pregunta antes del dato.
  a_escuta: |-
    Antes de la teoría vas a mirar tu propia huella. Qué recogen de ti y qué recoges tú. La lista de lo primero suele ser más larga de lo esperado.
  a_sistematizacion: |-
    Ya tienes tu inventario. Ahora vas a aprender las tres palabras que hacen que dos cifras del mismo tema dejen de parecer contradictorias.
  a_praxis: |-
    Tienes el método. Toca salir a recoger veinte filas reales, con una pregunta que puedas usar la semana entrante.
  a_producto: |-
    Lo que entregas hoy: la tabla con su pregunta y su uso previsto. La prueba de calidad: el archivo se entiende sin que estés al lado explicándolo.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Cada fila de una tabla sobre personas es una persona, y eso no cambia porque esté en una celda.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre datos y personas: Dussel sobre el otro que reclama, Séneca sobre no apresurarse a creer lo que nos cuentan, Floridi sobre acumular sin comprender.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tu huella de datos} (15 min · individual). (1) Abre tu celular y anota qué aplicaciones recogen datos tuyos: ubicación, tiempo de uso, contactos. (2) Anota qué datos registras tú mismo: notas, gastos, plan semanal, entrenamientos. (3) Marca cuáles de los que recoges tú los has vuelto a mirar alguna vez. (4) Escribe una pregunta que podrías responder con datos que ya tienes. (5) Marca cuál de las dos listas salió más larga.
  checks:
  - Tengo las dos listas, lo que recogen de mí y lo que recojo yo.
  - Marqué cuáles de mis registros he vuelto a mirar.
  - Escribí una pregunta que podría responder con datos que ya tengo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Mi huella de datos». \textbf{Formato:} dos columnas, lo que recogen de mí y lo que recojo yo, con marca en los que he vuelto a mirar, más la pregunta al pie. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} tienes escrita una pregunta concreta, no un tema.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Unidad, corte y metadato} (20 min · parejas). (1) Con tu pareja, escriban las tres palabras con una frase propia cada una. (2) Vuelvan a las cifras de Cartago y digan qué unidad de análisis usa cada una de las tres. (3) Escriban por qué 7.631 y 2.624 no se contradicen. (4) Diseñen juntos las columnas de una tabla para la pregunta de uno de los dos, declarando el tipo de cada columna.
  pilares:
  - |-
    \textbf{Unidad de análisis.} Qué cuenta cada fila. Personas, hechos, declaraciones u hogares. Si cambia a mitad de la tabla, los totales dejan de significar algo y nadie se da cuenta.
  - |-
    \textbf{Fecha de corte.} Hasta cuándo llegan los datos. Dos cifras del mismo tema con cortes distintos no se comparan directamente, y por eso «uno de cada quince» es una razón aproximada, no un dato exacto.
  - |-
    \textbf{Metadato.} Lo que hay que saber del dato para poder leerlo: quién lo recogió, cuándo, con qué instrumento y a quién le preguntó. Sin eso una cifra es un número suelto.
  - |-
    \textbf{Pregunta primero, dato después.} Recoger sin pregunta produce ruido. La prueba es sencilla: si no puedes decir qué vas a decidir con esos datos la semana entrante, todavía no es recolección.
  anatomia:
    titulo: Lo que hay que saber de un dato
    body: |-
      \textbf{Unidad de análisis:} qué cuenta cada fila. \\[1mm] \textbf{Fecha de corte:} hasta cuándo llegan los datos. \\[1mm] \textbf{Metadato:} quién, cuándo, con qué instrumento, a quién. \\[1mm] \textbf{Uso previsto:} qué voy a decidir con esto.
  errores_comunes: |-
    (1) \textbf{Recoger sin pregunta}: lo que sale es ruido, aunque sean muchas filas. (2) \textbf{Mezclar unidades de análisis}: si unas filas son personas y otras hechos, el total no dice nada. (3) \textbf{Comparar cifras con cortes distintos}: se puede hacer, pero hay que decir que la razón es aproximada. (4) \textbf{Columnas que guardan dos cosas}: «Juan, 15 años» en una sola celda no se puede ordenar ni filtrar. (5) \textbf{Filas incompletas}: un vacío sin explicar obliga a adivinar, y luego alguien adivina mal.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Unidad, corte y metadato». \textbf{Formato:} las tres palabras con frase propia, la unidad de análisis de las tres cifras de Cartago y el diseño de columnas con su tipo. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes explicar por qué 7.631 y 2.624 no se contradicen.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu tabla de veinte filas} (30 min · parejas). (1) Escribe tu pregunta acotada en una frase, arriba de la hoja. (2) Decide el instrumento: encuesta, observación o registro. (3) Define entre tres y cinco columnas y declara el tipo de cada una. (4) Recoge veinte filas de datos reales, sin inventar ninguna. (5) Revisa que no quede ninguna fila incompleta. (6) Escribe al pie el uso previsto: qué vas a decidir con esto la próxima semana.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres partes.} La pregunta arriba. Las veinte filas completas con sus columnas tipadas. Y el uso previsto al pie.
  - |-
    \textbf{Veinte filas reales, no inventadas.} Se nota enseguida: los datos inventados son demasiado parejos. Los reales tienen huecos raros, repeticiones y un caso extremo, y esos son justamente los que enseñan algo.
  - |-
    \textbf{Una columna, una cosa.} Nombre y edad en la misma celda no se puede ordenar. Declarar el tipo —texto, número, fecha, sí o no— evita la mitad de los problemas que verás en la sesión de limpieza.
  - |-
    \textbf{El uso previsto es el filtro.} Si no puedes decir qué vas a decidir con esos datos, la recolección todavía es curiosidad. Está bien tener curiosidad; solo que no es lo mismo.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Pregunta acotada en una frase, arriba de la hoja. \\[1mm] \checkbox Entre tres y cinco columnas con su tipo declarado. \\[1mm] \checkbox Veinte filas de datos reales, ninguna inventada. \\[1mm] \checkbox Ninguna fila incompleta. \\[1mm] \checkbox Cada columna guarda una sola clase de cosa. \\[1mm] \checkbox Uso previsto escrito al pie.
  plantilla_guion: |-
    \textbf{Pregunta.} \textit{Una frase corta y acotada.} \\[1mm] \textbf{Instrumento.} \textit{Encuesta, observación o registro.} \\[1mm] \textbf{Muestra.} \textit{A quién y cuántos.} \\[1mm] \textbf{Columnas.} \textit{Nombre y tipo de cada una.} \\[1mm] \textbf{Uso previsto.} \textit{Qué decido la próxima semana.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Tu tabla de veinte filas». \textbf{Formato:} la pregunta, el diseño de columnas con su tipo, una muestra de cinco filas copiadas a mano y el uso previsto. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} alguien abre tu archivo y entiende qué contiene sin preguntarte.
  producto_titulo: Tabla de veinte filas reales con pregunta acotada y uso previsto
  criterios:
  - La pregunta está acotada y cabe en una frase
  - Hay veinte filas de datos reales, ninguna inventada
  - Las columnas son entre tres y cinco y cada una tiene su tipo declarado
  - No queda ninguna fila incompleta
  - El uso previsto dice qué se decidirá con esos datos
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.4.2
    cita: |-
      El otro se revela realmente como otro… como el pobre, el oprimido; el que a la vera del camino, fuera del sistema, muestra su rostro sufriente y sin embargo desafiante: «¡Tengo hambre!, ¡tengo derecho a comer!».
    aplicacion: |-
      Las 9.393 personas ubicadas en Cartago no son un número: cada fila del registro es alguien que declaró lo que le pasó. Trabajar con datos sobre personas obliga a no perder eso de vista, sobre todo cuando la tabla es cómoda.
    pregunta_espejo: |-
      Si mis veinte filas fueran sobre personas, ¿cómo cambiaría lo que estoy dispuesto a publicar?
  estoico:
    autor: Séneca · Sobre la ira, II, 29 (c. 45 d.C.)
    cita: |-
      En cuanto a las que nos refieren, no debemos apresurarnos a creerlas. Muchos mienten para engañar, otros porque están engañados.
    aplicacion: |-
      Vale para las cifras. Antes de creer un número conviene preguntar quién lo recogió, cuándo cortó y qué cuenta cada fila. La mayoría de los datos torcidos no son mentiras: son metadatos que nadie miró.
    pregunta_espejo: |-
      ¿Qué cifra he repetido este mes sin saber quién la recogió ni con qué corte?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.5
    cita: |-
      Se suponía que acumular información y conocimiento llevaría a comprender mejor… pero esa expansión sin fin cada vez describe peor nuestra experiencia diaria. (trad. propia)
    aplicacion: |-
      Por eso la pregunta va antes que el dato. Veinte filas recogidas para responder algo valen más que dos mil recogidas por si acaso, y son las que puedes usar la semana entrante.
    pregunta_espejo: |-
      De todo lo que registro de mí, ¿qué he vuelto a mirar alguna vez?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la tabla lista y abierta. Comprueba antes que un compañero pueda entenderla sin que le expliques nada. En la sesión 2 vas a trabajar tablas y registros, y la columna como tipo y la fila como caso.
web:
  resumen: |-
    En el Registro Único de Víctimas, 7.631 personas figuran ubicadas en Cartago, 6.385 declararon allí su hecho y 2.624 lo sufrieron dentro del municipio. Son tres cifras distintas del mismo tema y ninguna es intercambiable. Hoy aprendes qué hay que saber de un dato para poder leerlo, y recoges veinte filas reales con una pregunta que puedas usar.
  subtema: Apertura · Datos del registro al insight
  pre_lectura:
    por_que_importa: |-
      Dos cifras del mismo tema pueden parecer contradictorias y estar las dos bien. Casi siempre lo que falta no es el dato: es el metadato.
    pregunta_detonante: |-
      ¿Qué registras de tu propia vida, y cuándo fue la última vez que lo volviste a mirar?
    activacion:
      titulo: Lo que recogen de ti
      descripcion: |-
        En 2 minutos, escribe tres datos tuyos que alguna aplicación esté recogiendo ahora mismo. Al lado, si sabes para qué los usa.
      duracion_min: 3
    conexion:
      anterior: En el periodo 2 produjiste la revista y sustentaste su diseño.
      siguiente: "En la sesión 2 trabajas tablas y registros: la columna como tipo y la fila como caso."

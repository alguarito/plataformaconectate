clave: 3-1
grado: 9
periodo: 3
sesion: 1
completo: true
titulo: ¿Qué es un dato? --- recolección con propósito
titulo_portada: |-
  ¿Qué es un dato? ---
  recolección
  con propósito
producto_final: 1 hoja de cálculo con 20 datos reales recolectados por el estudiante + una pregunta concreta que esos datos van a responder
apertura:
  saber_ancestral: |-
    En las \textbf{fincas cafeteras del norte del Valle del Cauca} (Argelia, Ulloa, Cartago, Versalles) y en las \textbf{veredas Páez del Cauca}, el \emph{conteo de cosecha} nunca fue vanidad estadística. La abuela contaba en su libreta los \emph{racimos por mata} de café, las \emph{mazorcas por surco}, las \emph{mantas terminadas por luna}, los \emph{días que llovió}. Los \textbf{taitas Páez (Nasa)} llevaban en piedrecitas y nudos el registro del año productivo de la comunidad. Cada cifra tenía propósito: saber cuánto sembrar el próximo ciclo, a quién pedir ayuda, qué reservar para el invierno, qué compartir con la asamblea. \textbf{Sin propósito, contar es desperdicio.} La estadística académica olvidó esa lección; el campesino del Valle y el comunero indígena del Cauca nunca la olvidaron.
  origen: Libreta de cosecha campesina en el Valle, el Pacífico y los Andes colombianos
  saber_contemporaneo: |-
    Hoy un \textbf{dato} es cualquier información cuantificable o categorizable que puedas registrar de forma estructurada: edad, hora, lugar, color, número, sí/no. Pero ``recolectar datos'' sin pregunta clara es lo más común de la era digital ---  apps que registran todo, hojas de cálculo que crecen sin propósito. La phronesis del dato empieza por ahí: \emph{¿qué pregunta voy a responder?}. Sin pregunta, no hay análisis posible; con pregunta, cada dato cuenta.
  pregunta_puente: |-
    ¿Qué datos recogía tu abuela en su libreta de cosecha y para qué? ¿Y qué datos recoges tú a diario (en redes, en apps, en notas) sin tener pregunta clara que esos datos vayan a responder?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} la diferencia entre dato, información y ruido; (2) \textbf{analizar} 3 prácticas de recolección de datos reales (encuesta, observación, registro propio); (3) \textbf{aplicar} la regla ``pregunta antes que dato'' a un caso propio; (4) \textbf{crear} tu primera tabla de 20 datos reales recolectados con pregunta declarada.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo del Periodo 3. En 10 sesiones vas a recorrer el ciclo del dato completo: recolección $\rightarrow$ tablas $\rightarrow$ fórmulas $\rightarrow$ filtros $\rightarrow$ tablas dinámicas $\rightarrow$ gráficos $\rightarrow$ limpieza $\rightarrow$ honestidad visual $\rightarrow$ insights $\rightarrow$ sustentación de un mini-estudio. Hoy empiezas por la base: \emph{¿qué dato vale recolectar y para qué?}.
  a_escuta: |-
    Antes de teorizar, vas a auditar tu propia relación con los datos: cuántos datos tuyos están recogiendo ya las apps, cuántos recoges tú, con qué propósito. Esa auditoría te muestra que vives rodeado de datos sin pregunta.
  a_sistematizacion: |-
    Ya viste tu propia situación. Ahora vamos a entender los \textbf{4 elementos} de toda recolección de datos seria: pregunta acotada, instrumento honesto, muestra adecuada, registro estructurado. Sin alguno, los datos recolectados son ruido.
  a_praxis: |-
    Tienes el método. Toca producir: una hoja con 20 datos reales recolectados, instrumento documentado, pregunta acotada al inicio. Es la base de todo el periodo.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy. El criterio principal: que cada uno de los 20 datos sirva a la pregunta que te planteaste, y que la pregunta sea concreta (no ``cómo es el curso'').
  a_evaluacion: |-
    Antes de cerrar, mira tu recolección desde las cinco dimensiones humanas. Decidir qué datos recoger es decisión política sutil: quién aparece, quién queda fuera, qué cuenta y qué no.
  a_triangulo: |-
    Y para terminar, tres voces sobre los datos. Dussel sobre los datos invisibilizados, Marco Aurelio sobre la phronesis del registro, Floridi sobre el dato como acto informacional.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tu propia huella de datos} (15 min · individual). Abre tu celular y haz inventario: (a) ¿qué \emph{apps} recogen datos tuyos (ubicación, tiempo de uso, contactos)?; (b) ¿qué \emph{datos cotidianos} registras tú (notas en cuaderno, lista de gastos, plan semanal)?; (c) ¿qué \emph{datos te falta} registrar de tu propia vida que mejorarían una decisión?. Anota cada lista con honestidad.
  checks:
  - Identifiqué 5+ apps que recogen datos míos sin que yo decida.
  - Identifiqué 3 prácticas de registro propio (lista de compras, notas, agenda).
  - Reconocí al menos 1 dato que NO registro y me serviría para mejorar una decisión.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mi huella de datos». \textbf{Formato:} 3 listas (Apps que me miden $\mid$ Datos que registro yo $\mid$ Datos que me servirían y no registro) con 5+ ítems cada una. \textbf{Sabes que terminaste cuando} reconoces honestamente que vives rodeado de datos pero recoges pocos con propósito propio.
sistematizacion:
  intro: |-
    Toda recolección de datos seria cumple 4 condiciones. Vamos a descomponerlas con los pilares del pensamiento computacional para que tu primera tabla no sea improvisada.
  pilares:
  - |-
    Una recolección honesta se descompone en 4 elementos: (1) \textbf{pregunta acotada} (qué quieres responder con esos datos, en una frase corta), (2) \textbf{instrumento honesto} (encuesta, observación o registro que no induzca respuesta), (3) \textbf{muestra adecuada} (a quién mides y cuántos: ni 3 amigos, ni todo el colegio sin saber por qué), (4) \textbf{registro estructurado} (tabla con columnas tipadas, no notas sueltas).
  - |-
    Toda recolección sigue el patrón \textbf{``pregunta primero, dato después''}: cuando alguien dice ``vamos a recoger datos del curso'' sin pregunta clara, lo que se recoge es ruido. Con pregunta acotada (``¿cuánto tiempo le dedican a leer fuera del colegio?''), cada dato encuentra su lugar en la tabla y su uso en el análisis.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿esta recolección la podré usar la próxima semana para decidir algo concreto?}. Si la respuesta es no, todavía no es recolección --- es curiosidad sin método.
  - |-
    Pasos para recolectar bien: (1) escribe la pregunta en 1 frase; (2) decide instrumento (encuesta/observación/registro); (3) elige muestra (a quién y cuántos); (4) diseña tabla con columnas tipadas; (5) recoge sin trampa; (6) revisa que cada fila esté completa antes de cerrar.
  anatomia:
    titulo: Anatomía de una recolección honesta
    body: |-
      \textbf{Pregunta:} 1 frase clara que responde la recolección. \\[1mm] \textbf{Instrumento:} cómo vas a recoger (encuesta, observación, registro propio). \\[1mm] \textbf{Muestra:} a quién mides (cuántos, qué grupo). \\[1mm] \textbf{Tabla:} columnas tipadas (texto, número, fecha, sí/no). \\[1mm] \textbf{Registro:} llenado completo, sin filas vacías. \\[1mm] \textbf{Uso previsto:} qué vas a decidir con esos datos.
  errores_comunes: |-
    (1) Recolectar sin pregunta: el clásico ``vamos a hacer una encuesta'' sin propósito. (2) Pregunta demasiado vaga (``cómo va el curso''): da datos basura. (3) Muestra solo de amigos cercanos: sesgo de origen. (4) Mezclar tipos en una misma columna (números y texto): rompe el análisis posterior. (5) Olvidar el uso previsto: recolectas y nunca decides nada.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 4 elementos de una recolección honesta». \textbf{Formato:} 4 fichas, una por elemento, cada una con: definición en tus palabras + ejemplo bueno + ejemplo malo (uno que conozcas, incluso de tus propias tareas anteriores). \textbf{Sabes que terminaste cuando} reconoces al menos UN error que has cometido tú en recolecciones anteriores.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu primera tabla con 20 datos reales} (30 min · individual o pareja). Hora de recolectar. Elige UNA pregunta acotada y recoge 20 filas de datos reales en una hoja de cálculo (Google Sheets, Excel o cuaderno digital). Cada fila debe responder a la pregunta.
  pilares:
  - |-
    Tu recolección se descompone en 5 pasos: (1) escribir la pregunta en 1 frase, (2) decidir instrumento (encuesta breve a 20 compañeros, observación de 20 hechos, registro propio de 20 días), (3) crear tabla con 3-5 columnas tipadas, (4) recoger los 20 datos sin saltarse columnas, (5) verificar que cada fila esté completa.
  - |-
    Sigue el patrón \textbf{``ejemplo concreto vence a categoría abstracta''}: tu pregunta debe ser específica. Mal: ``¿cómo usan el celular?''. Bien: ``¿cuántos minutos diarios pasan mis compañeros en TikTok los lunes?''. La especificidad permite responder.
  - |-
    Cada columna expresa un solo tipo de dato. Si una columna mezcla números con texto, divídela en dos columnas distintas. La pureza tipográfica es base del análisis.
  - |-
    Algoritmo: (1) elige tema; (2) escribe pregunta acotada; (3) diseña 3-5 columnas con su tipo; (4) recoge 20 filas reales; (5) revisa que ninguna fila esté incompleta; (6) guarda el archivo con nombre claro.
  checklist:
    titulo: Checklist antes de cerrar la tabla
    items: |-
      \checkbox Pregunta acotada en 1 frase escrita arriba de la tabla. \\[1mm] \checkbox 3-5 columnas con tipos declarados (texto, número, fecha, sí/no). \\[1mm] \checkbox 20 filas reales recolectadas (no inventadas). \\[1mm] \checkbox Cero filas con celdas vacías. \\[1mm] \checkbox Archivo guardado con nombre que incluye tu nombre + pregunta corta. \\[1mm] \checkbox Puedes explicar qué vas a decidir con esos 20 datos.
  plantilla_guion: |-
    \textbf{Pregunta acotada.} \textit{1 frase corta y específica.} \\[1mm] \textbf{Instrumento.} \textit{Cómo recogí los datos: encuesta, observación o registro propio.} \\[1mm] \textbf{Muestra.} \textit{A quién encuesté o qué observé.} \\[1mm] \textbf{Tabla.} \textit{3-5 columnas con tipo + 20 filas reales.} \\[1mm] \textbf{Uso previsto.} \textit{Qué voy a decidir con estos datos.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi primera tabla de 20 datos». \textbf{Formato:} captura impresa o link de la hoja + pregunta + instrumento + uso previsto + reflexión de 3 renglones. \textbf{Extensión:} 1 página de cuaderno + 1 archivo digital. \textbf{Sabes que terminaste cuando} tu hoja tiene 20 filas reales y sirve para responder UNA pregunta concreta.
  producto_titulo: Tabla de 20 datos reales recolectados con pregunta acotada y uso previsto
  criterios:
  - Pregunta acotada en 1 frase clara
  - 20 filas de datos reales (no inventadas)
  - 3-5 columnas tipadas correctamente
  - Cero filas incompletas
  - Uso previsto declarado
  - El archivo se puede abrir y leer sin explicación oral
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Lo que no se cuenta no existe en la decisión pública --- contar es ya un acto político.
    aplicacion: |-
      En Colombia, durante décadas, los pueblos indígenas no fueron ``contados'' en censos oficiales con criterios propios. El conteo del Estado los volvía invisibles. Hoy, en redes sociales, los algoritmos cuentan lo que les conviene contar de tus comportamientos. La pregunta es siempre la misma: \emph{¿quién decide qué se cuenta y para qué?}. Asumir tú la pregunta antes que ellos es ejercicio de soberanía digital.
    pregunta_espejo: |-
      ¿Qué de mi vida está siendo contado por apps sin que yo decida? ¿Y qué decido yo contar de mí mismo con criterios propios?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La phronesis empieza por la pregunta antes que por la respuesta.
    aplicacion: |-
      Recolectar datos sin pregunta es la versión moderna del que junta cosas en su casa ``por si acaso''. La sabiduría estoica recomienda lo contrario: antes de recoger, pregúntate qué decisión quieres mejorar. Sin esa disciplina previa, la recolección se vuelve acumulación, y la acumulación se vuelve carga, no virtud.
    pregunta_espejo: |-
      ¿Estoy recolectando datos para decidir mejor o para sentirme productivo? ¿Cuál fue la última decisión real que tomé desde una tabla mía?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Cada dato registrado es un acto informacional que modifica la infoesfera personal y colectiva.
    aplicacion: |-
      No existe ``recolectar datos neutralmente''. Cada dato que registras hace existir algo que antes no estaba en tu universo de decisión. Cada dato que NO registras deja una zona ciega. Aprender a recolectar con phronesis es aprender a diseñar tu propia infoesfera --- no padecerla.
    pregunta_espejo: |-
      ¿Mi recolección de hoy aporta a una infoesfera más útil para mí y mi comunidad, o solo agrega ruido a la mía y a la de las plataformas?
compromiso: |-
  \textbf{Para la próxima semana.} Sigue recolectando 5 datos diarios sobre la pregunta que elegiste hoy --- llega a 50 datos reales para la próxima sesión. La tabla bien hecha hoy es la base de todo el periodo. El próximo lunes traemos los datos para empezar a estructurarlos en tablas serias.
web:
  resumen: |-
    Apertura del Periodo 3. Construyes tu primera tabla con 20 datos reales recolectados y la pregunta acotada que esos datos van a responder. Sin pregunta, no hay recolección — hay acumulación.
  subtema: Apertura · Datos del registro al insight
  pre_lectura:
    por_que_importa: |-
      En este Periodo 3 vas a producir un mini-estudio que pueda mejorar algo concreto del colegio. Pero antes de gráficos y tablas dinámicas viene la base: recolectar datos con pregunta y propósito. Sin esa base, todo el periodo se vuelve ejercicio escolar sin consecuencia.
    pregunta_detonante: |-
      Si tu celular registra ya cientos de datos tuyos cada día y NO toma decisiones por ti, ¿qué información sí podrías recoger tú con tu propio criterio?
    activacion:
      titulo: Inventario rápido de tu huella
      descripcion: |-
        En 3 minutos: anota cuántas apps en tu celular recogen datos tuyos (ubicación, tiempo de uso, contactos). Estima cuántos datos producen sobre ti por día. Esa magnitud es contra la cual decidirás qué TÚ quieres recolectar con criterio propio.
      duracion_min: 3
    conexion:
      anterior: |-
        Cerraste P2 con la revista digital pública. Hoy empiezas el P3 — del registro al insight: aprenderás a leer y producir datos con criterio.
      siguiente: |-
        En la sesión 2 limpiarás y tiparás tu tabla para que las fórmulas y filtros posteriores funcionen sin trampa.
  conceptos_clave:
    - termino: Dato
      definicion: |-
        Información cuantificable o categorizable que puedas registrar de forma estructurada: edad, hora, lugar, color, número, sí/no.
      ejemplo: |-
        "Juan, 14 años, vive en La Esperanza, va a 9°A, 45 min de TikTok el lunes" son 5 datos. "Es buen estudiante" no es dato — es opinión.
      emoji: "📊"
    - termino: Pregunta acotada
      definicion: |-
        Una pregunta concreta, específica, que se pueda responder con datos contables. Sin pregunta acotada, la recolección se vuelve acumulación sin sentido.
      ejemplo: |-
        Mal: "¿cómo usan el celular?". Bien: "¿cuántos minutos diarios pasan mis compañeros en TikTok los lunes?". Lo específico permite responder.
      emoji: "🎯"
    - termino: Instrumento de recolección
      definicion: |-
        Cómo recoges los datos: encuesta (preguntas iguales a varios), observación (registras lo que ves sin preguntar), registro propio (anotas datos tuyos durante un tiempo).
      ejemplo: |-
        Encuesta: pregunto a 20 compañeros. Observación: cuento cuántos llevan portátil al colegio. Registro propio: anoto mi sueño por 14 noches.
      emoji: "📝"
    - termino: Muestra
      definicion: |-
        A quién mides y cuántos. Una buena muestra es lo suficientemente grande para tener tendencia y lo suficientemente cuidadosa para no incluir solo amigos cercanos.
      ejemplo: |-
        20 compañeros de TU salón es muestra clara. 5 amigos cercanos es sesgo. 200 estudiantes de todo el colegio sin saber cómo elegirlos es exceso sin método.
      emoji: "👥"
    - termino: Registro estructurado
      definicion: |-
        Tabla con columnas tipadas (texto, número, fecha, sí/no), no notas sueltas. La estructura permite que las fórmulas funcionen y otra persona pueda usar tu trabajo.
      ejemplo: |-
        Una hoja con columnas "Nombre | Edad | Minutos TikTok | Fecha" llena con 20 filas. NO: una nota en celular con párrafos mezclados.
      emoji: "🗂"
    - termino: Uso previsto
      definicion: |-
        Qué decisión vas a tomar cuando tengas los datos. Sin uso previsto, la recolección es curiosidad. Con uso previsto, cada dato encuentra propósito.
      ejemplo: |-
        Mi pregunta: "¿cuántos minutos diarios usamos TikTok?". Uso previsto: proponer al curso una franja de 30 min sin TikTok antes de dormir si el promedio supera 90 min.
      emoji: "🎬"
  quiz:
    titulo: "✅ Verifica la phronesis del dato"
    instrucciones: |-
      5 preguntas para confirmar que dominas el principio "pregunta antes que dato". Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Qué hace que una pregunta sea "acotada" para recolectar datos?
        opciones:
          - Que sea corta
          - Que se pueda responder con datos contables y sea específica
          - Que la haga un profesor
          - Que se pueda hacer en encuesta
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Acotada = específica + contestable con datos. "¿Cuántos minutos diarios pasan en TikTok los lunes?" funciona. "¿Cómo usan el celular?" no.
        feedback_incorrecto: |-
          Específica + contestable con datos. "¿Cómo va el curso?" no es acotada — no se sabe qué medir. "¿Cuánto tiempo dedican a leer fuera del colegio?" sí lo es.
      - enunciado: ¿Por qué encuestar SOLO a 5 amigos cercanos no es buena muestra?
        opciones:
          - Son pocos
          - Tienen sesgo de origen — comparten contigo gustos y rutinas
          - No saben responder
          - Es ilegal
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Sesgo de origen: tus amigos se parecen a ti. Para que la muestra sea útil debe representar la diversidad de tu grupo objetivo.
        feedback_incorrecto: |-
          Sesgo de origen. Tus 5 amigos comparten contigo características (gustos, barrio, rutinas) que hacen sus respuestas predecibles y no representativas del curso.
      - enunciado: Si recolectas datos sin declarar "uso previsto", ¿qué pasa?
        opciones:
          - Nada, está bien igual
          - La recolección se vuelve acumulación sin propósito — datos que nunca llevan a decisión
          - Los datos caducan
          - Te ponen mala nota
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Sin uso previsto, recolectas y nunca decides. Es lo más común de la era digital: apps con mil datos tuyos que tú no usas para decidir nada.
        feedback_incorrecto: |-
          Acumulación sin propósito. El uso previsto es lo que separa al analista del que junta cosas "por si acaso". Sin él, la recolección queda en cero decisiones.
      - enunciado: ¿Qué columna NO debería existir en una tabla profesional?
        opciones:
          - Una columna "Fecha" con formato dd/mm/aaaa
          - Una columna "Edad-Género" que mezcla "14-F", "15-M"
          - Una columna "Notas" con números del 0 al 5
          - Una columna "Nombre" con texto
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. "Edad-Género" mezcla 2 variables en 1 columna. Eso impide filtrar por edad o por género por separado. Debe partirse en 2 columnas: "Edad" y "Género".
        feedback_incorrecto: |-
          La mezcla de variables en una columna rompe filtros y fórmulas. "Edad" y "Género" deben ser columnas separadas para poder analizar cada variable independientemente.
      - enunciado: |-
          En el saber ancestral de la libreta de cosecha, ¿qué aplica directamente a tu próxima recolección digital?
        opciones:
          - Nada — la abuela no usaba Excel
          - Que contar sin propósito es desperdicio; con propósito, cada cifra encuentra decisión
          - Que se debe contar a mano
          - Que la abuela siempre tenía razón
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La abuela contaba racimos para decidir cuánto sembrar. Tú recoges datos para decidir qué cambiar. Mismo principio en distinta tecnología.
        feedback_incorrecto: |-
          Contar con propósito. La abuela y tu Excel comparten lógica: cada cifra debe llevar a una decisión concreta. Sin eso, el conteo es acumulación.
  post_lectura:
    transferencia: |-
      Esta semana, sigue recolectando 5 datos diarios sobre tu pregunta — llega a 50 datos reales para la próxima sesión. La tabla bien hecha hoy es la base de todo el periodo. El próximo lunes traemos los datos para estructurarlos en tablas serias.
  cinco_dimensiones:
    personal: Pasaste de consumidor pasivo de datos a productor con criterio — primer paso de soberanía cognitiva.
    emocional: |-
      Resististe la tentación de "recoger cualquier cosa". Entendiste que pregunta antes que dato es disciplina, no obstáculo.
    ciudadana: |-
      Reconociste que decidir qué contar es político — herramienta básica para defenderte de algoritmos que cuentan por ti.
    local: "Heredaste la libreta de cosecha del campo colombiano: contar para decidir, no para acumular."
    intergeneracional: |-
      La abuela contadora de cosechas y tu primera tabla digital comparten ética. Lo que cambia es la herramienta, no la phronesis.

titulo: Cosecha P3 --- sustentación del mini-estudio
producto_final: |-
  Presentación final del año (10 min) con el mini-estudio de datos completo del estudiante: pregunta de investigación, datos recolectados, análisis con hojas de cálculo, gráficos, 3 insights y decisión propuesta
saber_ancestral_idea: |-
  El cierre del año retoma todas las anclas anteriores: la cosecha contada, el inventario del almacén, la criba de granos, la balanza de la plaza, la lectura del cielo. El estudiante ya no solo usa Excel: piensa con datos como un campesino piensa con su libreta de campo --- para decidir, no para presumir.

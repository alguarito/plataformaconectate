clave: 3-10
grado: 9
periodo: 3
sesion: 10
completo: true
duracion_min: 90
titulo: Cosecha P3 --- sustentación del mini-estudio
titulo_portada: |-
  Cosecha P3 ---
  sustentación del
  mini-estudio
producto_final: Presentación de 6 a 8 diapositivas y sustentación de 10 minutos del mini-estudio, con preguntas del grupo respondidas en vivo
apertura:
  saber_ancestral: |-
    En el pueblo misak, en Guambía (Silvia, Cauca), las decisiones grandes no las toma una sola persona. Se llevan al Nu Nakchak, el espacio de las autoridades junto con los shures y las shuras. Ese modo de decidir dejó documentos con fecha. El Mandato de Vida y Permanencia Misak Misak, en Piendamó, 2005. Y la Misak Ley, proclamada el 12 de agosto de 2007. Lo que quedó escrito ahí no es una opinión del momento. Es una decisión sostenida, con testigos y con años encima. La \textbf{cara de exclusión} es que ese «no» colectivo se sostiene frente a normas externas. Y se sostiene a costa de conflicto con el Estado y con terratenientes. No es un recurso retórico: es una disputa territorial viva.
  origen: Pueblo misak de Guambía · las decisiones llevadas al Nu Nakchak y puestas por escrito
  fuente: |-
    Pueblo Misak. (2007, 12 de agosto). \emph{Misak Ley}. I Encuentro por la defensa de nuestro Derecho Mayor.
  saber_contemporaneo: |-
    Una sustentación de mini-estudio integra el periodo entero en diez minutos. Sigue una estructura estable. Contexto y pregunta de investigación. Datos usados, con su origen, su limpieza y sus límites. Análisis con las herramientas del periodo. Gráficos honestos, con el eje en cero y la fuente a la vista. Tres hallazgos con su decisión, su responsable y su plazo. Y un cierre con la decisión propuesta. Después vienen las preguntas del grupo. No es una exposición decorativa: es una rendición de cuentas.
  pregunta_puente: |-
    ¿Qué diferencia hay entre decir que no y sostener un no por escrito, con fecha y con testigos? ¿Y qué le falta a una conclusión de datos que nadie tuvo que defender delante de nadie?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} qué piezas de tu trabajo del periodo entran en la sustentación y cuáles se descartan; (2) \textbf{evaluar} tu propio estudio antes de exponerlo, anticipando las preguntas duras que puede recibir; (3) \textbf{crear} y defender una presentación de seis a ocho diapositivas que termine en una decisión propuesta.
puentes:
  a_ruta: |-
    Hace tres meses tu pregunta de investigación era una intuición. Hoy es un estudio con datos, análisis y hallazgos. La sustentación es el cierre que convierte nueve sesiones de oficio en algo que otro puede entender.
  a_escuta: |-
    Antes de teorizar, vas a hacer un inventario de cosecha. Todo lo que produjiste el periodo sobre la mesa: tabla, fórmulas, filtros, tabla dinámica, gráficos, hallazgos. Reconocer lo cosechado es la primera mitad de la sustentación.
  a_sistematizacion: |-
    Ya viste tu cosecha. Ahora vas a entender la \textbf{anatomía} de una sustentación: sus momentos, los tiempos de cada uno, qué evitar y cómo responder una pregunta dura sin ponerte a la defensiva.
  a_praxis: |-
    Tienes el método. Toca aplicarlo. Produces las diapositivas, ensayas en voz alta con cronómetro y sustentas ante el grupo respondiendo preguntas.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: la presentación, la sustentación de diez minutos y las preguntas respondidas. El criterio principal es que alguien que no vio tu proceso entienda tu decisión al final de los diez minutos.
  a_evaluacion: |-
    Antes de cerrar, mira la sustentación desde las cinco dimensiones humanas. Sustentar bien es respeto por quien escucha. Sustentar mal desperdicia el oficio de todo un periodo.
  a_triangulo: |-
    Y para terminar, tres voces sobre rendir cuentas. Dussel sobre lo que un discurso calla, Marco Aurelio sobre ser en vez de discutir cómo se debería ser, Floridi sobre en qué proyecto humano estamos trabajando.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Inventario de cosecha} (15 min · individual). (1) Pon sobre la mesa todo lo que produjiste en el periodo: tabla original, tabla limpia, fórmulas, filtros, tabla dinámica, gráficos y reporte de hallazgos. (2) Para cada pieza decide si entra en la sustentación o se queda fuera. (3) Recuerda que diez minutos admiten ocho piezas como máximo, así que vas a tener que cortar. (4) Marca las que entran y las que se quedan fuera. (5) Escribe al lado de cada descarte la razón, y distingue las que descartas por decorativas de las que descartas por cariño.
  checks:
  - |-
    Hice el inventario completo de lo que produje en el periodo.
  - |-
    Marqué qué piezas entran, con un máximo de ocho, y cuáles quedan fuera.
  - |-
    Escribí la razón de cada descarte y reconocí cuáles descartaba por cariño.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} \textbf{Título:} «Actividad 1 --- Inventario de cosecha». \textbf{Formato:} tabla de tres columnas (pieza producida / entra o no entra / por qué), con una fila por pieza. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} puedes justificar cada inclusión y cada descarte sin dudar.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EVALÚA --- Las tres preguntas duras} (20 min · parejas). (1) Con tu pareja, escriban la anatomía de la sustentación con el tiempo de cada momento. (2) Cada uno le presenta al otro su estudio en dos minutos. (3) Quien escucha escribe las tres preguntas más duras que se le ocurran. (4) Cada uno prepara su respuesta a las tres, en una o dos frases, y marca en cuál la respuesta honesta es «eso no lo miré».
  pilares:
  - |-
    La sustentación se descompone en momentos. La \textbf{portada} con tu nombre y la pregunta de investigación. El \textbf{contexto}, en tres líneas. Los \textbf{datos}, con origen, tamaño y limpieza. El \textbf{análisis}, con una tabla dinámica y un gráfico honesto. Los \textbf{tres hallazgos}, uno por diapositiva. La \textbf{decisión propuesta}. Y las \textbf{preguntas}, que van en vivo y no en diapositiva.
  - |-
    Toda diapositiva sigue el patrón «una idea, una imagen, pocas palabras». Si tiene tres ideas, se divide en tres. Si tiene un párrafo, se recorta a viñetas. Si tiene jerga, se traduce. La regla que más sirve: la diapositiva apoya tu voz, no la reemplaza. Quien lee la diapositiva en voz alta ya perdió a la audiencia.
  - |-
    Todo se juega en una preparación: anticipa las tres preguntas duras que te pueden hacer. Cómo sabes que tu muestra sirve. Qué pasaría si el dato sucio se contara distinto. Por qué tu decisión y no la contraria. Si no tienes respuesta honesta a las tres, es mejor descubrirlo ensayando.
  - |-
    Algoritmo: (1) elige las piezas del inventario; (2) produce las diapositivas con la regla de una idea por diapositiva; (3) ensaya en voz alta con cronómetro; (4) escribe las tres preguntas duras y sus respuestas; (5) sustenta; (6) responde con honestidad, incluido el «eso no lo sé» cuando corresponda; (7) anota qué ajustarías.
  anatomia:
    titulo: Anatomía de una sustentación de 10 minutos
    body: |-
      \textbf{Portada} (30 s). \\[1mm] \textbf{Contexto} (1 min). \\[1mm] \textbf{Datos y limpieza} (1,5 min). \\[1mm] \textbf{Análisis: tabla dinámica y gráfico honesto} (2 min). \\[1mm] \textbf{Hallazgos 1, 2 y 3} (1 min cada uno). \\[1mm] \textbf{Decisión y cierre} (1 min). \\[1mm] \textbf{Preguntas del grupo} (1 a 2 min). \\[1mm] \textbf{Total:} 10 minutos y las preguntas.
  errores_comunes: |-
    (1) Leer las diapositivas en voz alta, cuando la audiencia podía leerlas sola. (2) Sobrecargar de texto, que es señal de miedo y no de profundidad. (3) Esconder las limitaciones del estudio, que quien escucha va a ver de todos modos. (4) Mostrar cinco gráficos cuando uno honesto basta. (5) Cerrar con un agradecimiento en vez de cerrar con la decisión propuesta.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} \textbf{Título:} «Actividad 2 --- Las tres preguntas duras». \textbf{Formato:} la anatomía con sus tiempos, las tres preguntas que te hizo tu pareja y tu respuesta a cada una en una o dos frases. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} sabes cuál de las tres respuestas honestas es «eso no lo miré».
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Sustenta el mini-estudio} (40 min · individual). (1) Produce las seis a ocho diapositivas siguiendo la anatomía. (2) Declara las limitaciones del estudio en una diapositiva propia, no escondidas al final. (3) Ensaya una vez en voz alta con cronómetro. (4) Sustenta ante el grupo. (5) Responde al menos dos preguntas con honestidad. (6) Anota la retroalimentación recibida y un ajuste que harías si volvieras a sustentar.
  pilares:
  - |-
    Tu sustentación se descompone en cuatro piezas: la producción de las diapositivas, el ensayo cronometrado, la entrega ante el grupo y las preguntas respondidas. Sin el ensayo, las otras tres se resienten.
  - |-
    Sigue el patrón «audiencia que no vio el proceso». Prepárala como si quien escucha no hubiera estado en ninguna sesión del periodo. Eso te obliga a explicar la pregunta, los datos, el análisis y el hallazgo sin atajos. Si tu sustentación solo se entiende porque ya saben, no es comunicación.
  - |-
    Cada diapositiva responde una sola pregunta de quien escucha. Qué estudiaste. Con qué datos. Qué encontraste. Qué significa. Qué propones. Si una diapositiva no responde ninguna de esas, sobra.
  - |-
    Algoritmo: (1) produce las diapositivas; (2) ensaya en voz alta con cronómetro; (3) ten a mano las tres preguntas duras con sus respuestas; (4) sustenta; (5) responde con honestidad; (6) recibe la retroalimentación del docente y de al menos un compañero; (7) anota el ajuste que harías.
  checklist:
    titulo: Checklist antes de sustentar
    items: |-
      \checkbox Entre seis y ocho diapositivas, con una idea por diapositiva. \\[1mm] \checkbox Un ensayo en voz alta cronometrado. \\[1mm] \checkbox Las tres preguntas duras escritas con su respuesta. \\[1mm] \checkbox Las limitaciones del estudio en una diapositiva propia. \\[1mm] \checkbox El cierre es la decisión propuesta, con responsable y plazo. \\[1mm] \checkbox Sé en qué punto voy a decir «eso no lo miré».
  plantilla_guion: |-
    \textbf{Portada.} \textit{Nombre y pregunta de investigación.} \\[1mm] \textbf{Contexto.} \textit{Por qué importa, en tres líneas.} \\[1mm] \textbf{Datos.} \textit{Origen, tamaño, limpieza y límites.} \\[1mm] \textbf{Análisis.} \textit{Una tabla dinámica y un gráfico honesto.} \\[1mm] \textbf{Hallazgos.} \textit{Tres, uno por diapositiva.} \\[1mm] \textbf{Cierre.} \textit{Decisión propuesta, responsable y plazo.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Sustentación del periodo 3». \textbf{Formato:} el índice de diapositivas, las tres preguntas anticipadas, la retroalimentación recibida y el ajuste que harías. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} distingues qué sales a mejorar de qué sales a celebrar de tu propio trabajo.
  producto_titulo: Presentación de 6 a 8 diapositivas, sustentación de 10 minutos y preguntas respondidas
  criterios:
  - Entre seis y ocho diapositivas, con una sola idea en cada una
  - Tiempo total dentro del rango acordado
  - Tres hallazgos con su decisión, su responsable y su plazo
  - Limitaciones del estudio declaradas en una diapositiva propia
  - Al menos dos preguntas del grupo respondidas con honestidad
  - Cierre con la decisión propuesta y no con un agradecimiento
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.2.4.4
    cita: |-
      Hay lengua cotidiana (la de todos los días), lengua de culturas ilustradas, de cultura de masas, lengua de cultura popular… lengua política (que se comprende no por lo que dice sino por lo que calla, contra quién lo dice, cuándo y por qué…).
    aplicacion: |-
      Una sustentación también se comprende por lo que calla. Si no dices de dónde salieron los datos, cuántos eran ni qué descartaste al limpiarlos, quien escucha lo nota igual. Declarar las limitaciones no debilita el estudio: es lo que lo separa de un discurso que se sostiene por lo que oculta.
    pregunta_espejo: |-
      ¿Qué estoy dejando fuera de mi sustentación porque no me conviene decirlo?
  estoico:
    autor: Marco Aurelio · Meditaciones X, 16 (c. 175 d.C.)
    cita: |-
      De hoy más, déjate absolutamente de disputar cuál conviene que sea un hombre bueno, sino procura ser tal en realidad.
    aplicacion: |-
      No gastes los diez minutos explicando cómo debería ser un buen estudio de datos. Muestra el tuyo, con lo que tiene y lo que le falta. Y cuando llegue la pregunta que no puedes responder, «eso no lo miré» es más sólido que cualquier rodeo bien armado.
    pregunta_espejo: |-
      ¿Dediqué más tiempo a decir qué es un buen análisis que a mostrar el mío?
  floridi:
    autor: Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 3.1
    cita: |-
      Una de las preguntas políticas apremiantes que enfrentamos en las sociedades de la información avanzadas es: ¿en qué clase de proyecto humano estamos trabajando? (trad. propia)
    aplicacion: |-
      Es la pregunta con la que cierra el año. Aprendiste a limpiar una tabla, a filtrarla, a agruparla y a graficarla. La pregunta que queda no es técnica: para qué. Tu decisión propuesta es tu respuesta, y por eso el cierre no puede ser un agradecimiento.
    pregunta_espejo: |-
      Todo lo que aprendí este año a hacer con datos, ¿al servicio de qué lo quiero poner?
compromiso: |-
  \textbf{Para el año entrante.} Conserva esta presentación, tu bitácora y tus tres hallazgos. Piensa en una pregunta cotidiana que merezca un dato: los gastos de la casa, las horas de sueño, la asistencia a una actividad. Con esa, repite el ciclo entero: recoge, limpia, analiza, grafica, escribe el hallazgo y decide. La phronesis se entrena un ciclo a la vez, no en una sustentación final.
web:
  resumen: |-
    Cierre del año: una presentación de diez minutos que integra pregunta, datos, análisis, gráficos, tres hallazgos y una decisión propuesta, defendida ante el grupo.
  subtema: Datos · Rendición de cuentas
  pre_lectura:
    por_que_importa: |-
      Sin sustentación, el aprendizaje queda en privado. Defender públicamente una decisión con datos es una capacidad profesional y ciudadana, y esta es la última sesión del año para entrenarla.
    pregunta_detonante: |-
      Si tuvieras diez minutos ante alguien que no vio nada de tu proceso, ¿cómo le contarías tu estudio para que entienda tu decisión?
    activacion:
      titulo: Relato del año productivo
      descripcion: |-
        En 3 minutos, cuéntale en voz alta a tu compañero qué cosechaste este periodo: una pregunta, un dato y una decisión. Sin diapositivas, solo voz.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 9 produjiste el reporte con tus tres hallazgos.
      siguiente: |-
        El año cierra aquí, pero el ciclo sigue: cada vez que aparezca una pregunta cotidiana, vuelve a recorrerlo.

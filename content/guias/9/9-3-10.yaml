clave: 3-10
grado: 9
periodo: 3
sesion: 10
completo: true
titulo: Cosecha P3 --- sustentación del mini-estudio
titulo_portada: |-
  Cosecha P3 ---
  sustentación del
  mini-estudio
producto_final: Presentación final del año (10 min · 6-8 diapositivas) con el mini-estudio de datos completo del estudiante --- pregunta de investigación, datos recolectados, análisis con hoja de cálculo, gráficos honestos, 3 insights accionables y decisión propuesta --- defendida ante el grupo con audiencia que pregunta y evalúa
apertura:
  saber_ancestral: |-
    El cierre del año retoma todas las anclas anteriores. La \textbf{cosecha contada} en la libreta del campesino cafetero del norte del Valle (S1). El \textbf{inventario del almacén} del tendero de Cartago (S5). La \textbf{criba de granos} de la abuela campesina vallecaucana (S7). La \textbf{balanza del minero afro-pacífico} y su desconfianza educada (S8). La \textbf{lectura del cielo} de los taitas Páez del Cauca para decidir cuándo sembrar (S9). El estudiante ya no solo usa Excel: \emph{piensa con datos} como el campesino del Valle piensa con su libreta de campo, como el taita Páez piensa con su asamblea, como la tejedora Misak piensa con su chumbe --- para decidir, no para presumir. La sustentación frente al grupo es el equivalente contemporáneo del \textbf{relato del año productivo} que hacían los mayores en la junta comunitaria Nasa o en la asamblea de minga: contar qué se sembró, qué rindió, qué falló, qué hacer distinto en el ciclo siguiente.
  origen: |-
    Relato del año productivo en la junta comunitaria del Valle del Cauca, integrando todas las anclas del periodo
  saber_contemporaneo: |-
    Una \textbf{sustentación de mini-estudio de datos} integra todo el periodo en una sola presentación de 10 minutos. Sigue una estructura profesional clásica: (1) \textbf{contexto} y \emph{pregunta de investigación}; (2) \textbf{datos} usados (origen, limpieza, limitaciones); (3) \textbf{análisis} (fórmulas, filtros, tablas dinámicas); (4) \textbf{gráficos honestos} (eje en cero, fuentes, sin trucos); (5) \textbf{3 insights} con anatomía completa (dato $\to$ hallazgo $\to$ decisión $\to$ quién $\to$ plazo); (6) \textbf{decisión propuesta} con cierre; (7) \textbf{Q\&A} con el grupo. No es exposición decorativa: es \emph{rendición de cuentas} del aprendizaje del año.
  pregunta_puente: |-
    ¿Cómo contaba el campesino mayor el balance del año en la junta comunitaria sin diapositivas ni proyector? ¿Y qué pierde un estudiante que termina el año con muchas hojas de Excel pero sin haber sustentado nunca una decisión real frente a una audiencia que pregunta?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} qué piezas de tu trabajo del año entran en la sustentación y cuáles se descartan por decorativas; (2) \textbf{evaluar} críticamente tu propio mini-estudio antes de presentarlo (qué falta, qué sobra, qué pregunta dura puede hacer la audiencia); (3) \textbf{crear} una presentación de 6-8 diapositivas que integre datos, gráficos, insights y decisión; (4) \textbf{explicar} y defender ante el grupo, respondiendo preguntas con honestidad sobre qué hiciste, qué no, y qué harías distinto.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hace tres meses tu pregunta de investigación era apenas una intuición; hoy es un estudio con datos, análisis e insights. La sustentación no es \emph{``trabajo extra''}: es el cierre que convierte 9 sesiones de oficio en un producto comunicable. Sin sustentación, el aprendizaje queda en privado.
  a_escuta: |-
    Antes de teorizar, vas a hacer un \emph{inventario de cosecha}: poner sobre la mesa todo lo que produjiste el periodo (tabla, fórmulas, filtros, tabla dinámica, gráficos, insights). El reconocimiento de lo cosechado es la primera mitad de la sustentación.
  a_sistematizacion: |-
    Ya viste tu cosecha. Ahora vas a entender la \textbf{anatomía} de una sustentación profesional: 7 momentos, tiempos por diapositiva, qué evitar (jerga, decoración, lectura literal), y cómo responder preguntas duras sin defensa de ego.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: producir las 6-8 diapositivas, ensayar al menos 1 vez en voz alta cronometrando, y sustentar frente al grupo respondiendo preguntas. La sustentación es ejercicio integral: técnico, comunicativo y ético.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: presentación de 6-8 diapositivas + sustentación de 10 minutos + respuesta a Q\&A. El criterio principal: que un compañero de otro curso, que no haya visto tu proceso, pueda \textbf{entender la decisión propuesta} al final de los 10 minutos.
  a_evaluacion: |-
    Antes de cerrar, mira la sustentación desde las cinco dimensiones humanas. Sustentar bien es respeto a la audiencia y a quien te enseñó; sustentar mal es despilfarrar el oficio del año.
  a_triangulo: |-
    Y para terminar, tres voces sobre la cosecha y la rendición de cuentas. Dussel sobre quién falta en la audiencia, Marco Aurelio sobre defender sin ego, Floridi sobre la presentación como contrato público con datos.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Inventario de cosecha} (15 min · individual). Pon sobre la mesa todo el trabajo del periodo: tabla original, tabla limpia, fórmulas aplicadas, filtros usados, tabla dinámica, gráficos producidos, reporte de insights. Para cada pieza responde: \emph{¿entra en la sustentación o se queda fuera?}. Una sustentación de 10 min admite máximo 8 piezas. Tienes que cortar. Marca con ✓ las 6-8 piezas que entran y con ✗ las que se quedan fuera. La disciplina del corte es ya parte de la madurez del analista.
  checks:
  - Hice inventario completo de la cosecha del periodo.
  - Marqué qué piezas entran (máx. 8) y cuáles se descartan.
  - Reconozco qué se descarta porque es decorativo y no por cariño.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Inventario de cosecha». \textbf{Formato:} tabla 3 columnas (Pieza producida~|~¿Entra? ✓ o ✗~|~Por qué), 8-12 filas. \textbf{Sabes que terminaste cuando} tienes claras las 6-8 piezas que sostendrán los 10 minutos y puedes justificar cada inclusión y cada descarte.
sistematizacion:
  intro: |-
    Una sustentación profesional sigue una estructura estable. Vamos a descomponerla con los pilares del pensamiento computacional para que produzcas las 6-8 diapositivas con criterio, no con improvisación.
  pilares:
  - |-
    Los 7 momentos se descomponen así: (1) \textbf{portada}: tu nombre, pregunta de investigación, 1 imagen ancla. (2) \textbf{Contexto}: por qué importa la pregunta, 3 líneas máximo. (3) \textbf{Datos}: origen, tamaño, limpieza hecha (referencia a la bitácora). (4) \textbf{Análisis clave}: 1 tabla dinámica + 1 gráfico honesto. (5) \textbf{3 insights}: una diapositiva por insight (dato + hallazgo + decisión + quién + plazo). (6) \textbf{Decisión propuesta y cierre}. (7) \textbf{Q\&A} en vivo, no en diapositiva.
  - |-
    Toda diapositiva sigue el patrón \textbf{``1 idea, 1 imagen, $\leq$ 20 palabras''}: si una diapositiva tiene 3 ideas, divídela en 3. Si tiene párrafo, recórtalo a viñetas. Si tiene jerga, tradúcela. La regla más útil: \emph{la diapositiva apoya tu voz, no reemplaza tu voz}. Quien lee la diapositiva está perdiendo a la audiencia.
  - |-
    Lo esencial cabe en una regla: \emph{prepárate para las 3 preguntas duras que un crítico podría hacer}. Ejemplos típicos: \emph{``¿cómo sabes que tu muestra es representativa?''}, \emph{``¿qué pasaría si el dato sucio se contara distinto?''}, \emph{``¿por qué tu decisión y no la opuesta?''}. Si no tienes respuesta honesta a las 3, la sustentación es frágil. Mejor descubrirlo ensayando que el día de la presentación.
  - |-
    Algoritmo: (1) elige las 6-8 piezas del inventario; (2) produce las 7 diapositivas siguiendo la regla 1-1-20; (3) ensaya en voz alta cronometrando (objetivo: 10 min, máximo 12); (4) escribe las 3 preguntas duras esperadas y tus respuestas; (5) presenta; (6) responde Q\&A con honestidad (incluye \emph{``eso no lo sé''} cuando aplique); (7) anota qué mejorarías para una próxima sustentación.
  anatomia:
    titulo: Anatomía de una sustentación de 10 minutos
    body: |-
      \textbf{Portada} (30 s). \\[1mm] \textbf{Contexto} (1 min). \\[1mm] \textbf{Datos y limpieza} (1.5 min). \\[1mm] \textbf{Análisis: tabla dinámica + gráfico honesto} (2 min). \\[1mm] \textbf{Insight 1 / 2 / 3} (1 min cada uno = 3 min). \\[1mm] \textbf{Decisión y cierre} (1 min). \\[1mm] \textbf{Q\&A} (1-2 min sobre el cronómetro). \\[1mm] \textbf{Total:} 10 min + Q\&A.
  errores_comunes: |-
    (1) Leer literalmente las diapositivas en voz alta: la audiencia podía leer sola. (2) Sobrecargar de texto: más de 25-30 palabras por diapositiva es señal de pánico, no de profundidad. (3) Ocultar las limitaciones del estudio (\emph{``mi muestra es chica''}, \emph{``la limpieza descartó X''}): el crítico las verá; mejor decirlas tú mismo. (4) Mostrar 5 gráficos cuando 1 honesto basta: la sustentación no es \emph{exhibición} de software, es \emph{argumento} con datos. (5) Responder Q\&A con \emph{``no estoy seguro''} para todo: el \emph{``no lo sé''} se usa con criterio, no como escape.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Anatomía de la sustentación». \textbf{Formato:} ficha con los 7 momentos + tiempos asignados + 3 preguntas duras esperadas + tus respuestas en 1-2 frases cada una. \textbf{Sabes que terminaste cuando} podrías exponer tu sustentación a otra persona en 30 segundos resumiendo cada momento.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA + EXPLICA --- Sustenta el mini-estudio} (40 min · individual + grupo). Hora de aplicar. Vas a producir las 6-8 diapositivas, ensayar al menos 1 vez en voz alta cronometrando, y sustentar ante el grupo. La sustentación incluye Q\&A: el aprendizaje también se mide en cómo respondes.
  pilares:
  - |-
    Tu sustentación se descompone en 4 piezas: (1) \textbf{producción} (6-8 diapositivas siguiendo la anatomía); (2) \textbf{ensayo} cronometrado en voz alta; (3) \textbf{sustentación} de 10 min ante el grupo; (4) \textbf{Q\&A} con al menos 2 preguntas respondidas con honestidad.
  - |-
    Sigue el patrón \textbf{``audiencia que no vio el proceso''}: prepara la sustentación como si quien escucha no hubiera visto ninguna sesión del periodo. Eso te obliga a explicar pregunta, datos, análisis e insight sin atajos. Si tu sustentación solo se entiende \emph{``porque ya saben''}, no es comunicación: es complicidad.
  - |-
    Cada diapositiva responde una sola pregunta del oyente. \emph{¿Qué estudiaste?} (contexto). \emph{¿Con qué datos?} (datos). \emph{¿Qué encontraste?} (análisis). \emph{¿Qué significa?} (insights). \emph{¿Qué propones?} (decisión). Si una diapositiva no responde una pregunta clara, sobra.
  - |-
    Algoritmo: (1) produce las 6-8 diapositivas; (2) ensaya en voz alta con cronómetro (objetivo 10 min); (3) anota 3 preguntas duras y prepara respuestas; (4) sustenta ante el grupo; (5) responde Q\&A con honestidad; (6) recibe retroalimentación del docente y al menos 1 compañero; (7) anota 1 ajuste que harías si volvieras a sustentar.
  checklist:
    titulo: Checklist antes de sustentar
    items: |-
      \checkbox 6-8 diapositivas producidas siguiendo la regla 1-1-20. \\[1mm] \checkbox Al menos 1 ensayo en voz alta cronometrado (entre 8 y 12 min). \\[1mm] \checkbox 3 preguntas duras escritas con respuestas preparadas. \\[1mm] \checkbox Las limitaciones del estudio están declaradas en una diapositiva, no escondidas. \\[1mm] \checkbox Sé qué respuestas tengo claras y dónde diré ``eso no lo sé'' con criterio.
  plantilla_guion: |-
    \textbf{Diapositiva 1 (portada).} \textit{Nombre + pregunta + imagen.} \\[1mm] \textbf{Diapositiva 2 (contexto).} \textit{Por qué importa, 3 líneas.} \\[1mm] \textbf{Diapositiva 3 (datos).} \textit{Origen + tamaño + limpieza.} \\[1mm] \textbf{Diapositiva 4 (análisis).} \textit{Tabla dinámica + gráfico honesto.} \\[1mm] \textbf{Diapositivas 5-7 (insights 1-3).} \textit{Una por insight con anatomía completa.} \\[1mm] \textbf{Diapositiva 8 (decisión y cierre).} \textit{Decisión propuesta + 1 frase de cierre.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA + EXPLICA).} Título: «Actividad 3 --- Sustentación P3». \textbf{Formato:} índice de diapositivas + 3 preguntas duras anticipadas + retroalimentación recibida + 1 ajuste a futuro. \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} reconoces qué saliste a mejorar y qué saliste a celebrar de tu propio trabajo del año.
  producto_titulo: Presentación de 6-8 diapositivas + sustentación 10 min + Q\&A
  criterios:
  - 6-8 diapositivas con regla 1-1-20 aplicada
  - Tiempo total entre 8 y 12 minutos
  - 3 insights con anatomía completa visible en las diapositivas
  - Limitaciones del estudio declaradas, no escondidas
  - Q\&A con al menos 2 respuestas honestas (incluye ``no lo sé'' con criterio si aplica)
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Toda sustentación pública debe nombrar a quienes no están presentes en la audiencia.
    aplicacion: |-
      Cuando sustentes frente al grupo, recuerda que tu decisión podría afectar a personas que no están en el aula: estudiantes que cambiaron de curso, familias del barrio que aparecieron en tus datos, compañeros que no se atrevieron a participar. La phronesis del presentador exige nombrar a esos ausentes en al menos una diapositiva o en una frase: \emph{``esta decisión afectaría también a X, que no aparece en mi muestra''}. Sustentar sin nombrar a los ausentes es presentar para los iguales y olvidarse del nosotros amplio.
    pregunta_espejo: |-
      En mi sustentación, ¿hablo solo a los que están en el aula o nombro también a quienes no están y a quienes la decisión les caería encima?
  estoico:
    autor: Marco Aurelio
    cita: |-
      Defender sin ego es virtud; defender con orgullo herido es derrota.
    aplicacion: |-
      Recibir preguntas duras en el Q\&A es la prueba más exigente de la sustentación. La sabiduría estoica recomienda \emph{escuchar la pregunta hasta el final, agradecerla, responder con honestidad}. Si el crítico tiene razón, reconócelo en voz alta. Si tu respuesta es \emph{``eso no lo investigué''}, dilo limpio sin disculparse de más. El ego herido produce respuestas largas, defensivas y poco claras; el ego sereno produce respuestas cortas que la audiencia recordará.
    pregunta_espejo: |-
      ¿Cómo recibí las preguntas duras del Q\&A? ¿Defendí con argumento o con orgullo herido? ¿Qué hubiera dicho si hubiera podido escuchar 5 segundos más antes de responder?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Toda sustentación pública con datos es un contrato implícito con quien escucha.
    aplicacion: |-
      Cuando sustentas, le pides a tu audiencia que crea por un momento en tus datos, tu análisis y tu decisión. Ese contrato implícito tiene 3 cláusulas: (1) tus datos son trazables a un origen real; (2) tu análisis es reproducible si alguien quisiera repetirlo; (3) tus decisiones no esconden las limitaciones del estudio. Romper cualquiera de las 3 es traición civil. Sustentar bien es honrar el contrato; sustentar mal es enseñar a la próxima generación que está bien presentar humo bonito.
    pregunta_espejo: |-
      Mi sustentación, ¿honra el contrato implícito con la audiencia? ¿Dije con claridad de dónde vienen mis datos, cómo se podrían reproducir, y qué no alcancé a estudiar?
compromiso: |-
  \textbf{Para el año entrante.} El oficio de \emph{pensar con datos} no termina con esta sustentación. Conserva esta presentación; conserva tu bitácora; conserva tus 3 insights. Cuando aparezca una pregunta cotidiana que merezca dato (gastos del hogar, hábitos de sueño, asistencia a una actividad, encuesta del salón), repite el ciclo: recoge, limpia, analiza, grafica, escribe insight, decide. La phronesis se entrena un ciclo a la vez, no en una sustentación final.
web:
  resumen: |-
    Cierre del año: presentación de 10 min con 6-8 diapositivas que integra pregunta, datos, análisis, gráficos, 3 insights y decisión propuesta, defendida ante el grupo con Q&A. Es la prueba integral del oficio de pensar con datos.
  subtema: Datos · Rendición de cuentas
  pre_lectura:
    por_que_importa: |-
      Sin sustentación, el aprendizaje queda en privado. La capacidad de defender públicamente una decisión con datos es competencia profesional, ciudadana y vital. Esta es la última sesión del año: el capstone.
    pregunta_detonante: |-
      Si tuvieras 10 minutos con el rector, un padre de familia desconocido y un compañero de otro curso, ¿cómo les contarías tu mini-estudio para que entiendan tu decisión y te crean?
    activacion:
      titulo: Relato del año productivo
      descripcion: |-
        En 3 minutos: cada estudiante cuenta en voz alta a su compañero "qué cosechó este periodo con los datos": una pregunta, un dato y una decisión. Sin diapositivas. Solo voz.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 9 produjiste el reporte de 3 insights. Hoy integras todo el periodo en una sustentación de 10 minutos ante el grupo.
      siguiente: |-
        El año cierra aquí. El oficio sigue: cada vez que aparezca una pregunta cotidiana, repite el ciclo recoge → limpia → analiza → grafica → escribe insight → decide.
  conceptos_clave:
    - termino: Regla 1-1-20
      definicion: Cada diapositiva tiene 1 idea, 1 imagen, máximo 20 palabras. Si tiene más, divídela o recórtala.
      ejemplo: "Diapositiva \"Datos\": 1 frase con origen y tamaño, 1 ícono o imagen, listo. No párrafo."
      emoji: "📐"
    - termino: 7 momentos de la sustentación
      definicion: |-
        Portada, contexto, datos, análisis, 3 insights (3 diapositivas o 1), decisión y cierre. Q&A en vivo, no en diapositiva.
      ejemplo: "Total 6-8 diapositivas para 10 minutos: ~1 minuto promedio por diapositiva."
      emoji: "🗂️"
    - termino: Limitaciones declaradas
      definicion: |-
        Diapositiva o frase que reconoce qué no alcanzaste a estudiar, qué quedó por fuera, qué muestra es chica. El crítico las verá; mejor decirlas tú primero.
      ejemplo: "\"Mi muestra fue de 25 estudiantes del 9B; no incluye 9A ni 9C — la conclusión vale solo para 9B\"."
      emoji: "🛡️"
    - termino: 3 preguntas duras anticipadas
      definicion: |-
        Antes de presentar, escribe las 3 preguntas críticas que un revisor podría hacer. Si no tienes respuesta honesta a las 3, la sustentación es frágil.
      ejemplo: |-
        "¿Cómo sabes que la muestra es representativa?", "¿Qué pasaría si el dato sucio se contara distinto?", "¿Por qué tu decisión y no la opuesta?".
      emoji: "🎯"
    - termino: "\"No lo sé\" con criterio"
      definicion: |-
        Respuesta honesta cuando una pregunta del Q&A excede tu trabajo. Se dice limpio, sin disculpas largas. Es virtud, no derrota.
      ejemplo: "\"Esa correlación no la investigué. Sería buena pregunta para extender el estudio el próximo año\"."
      emoji: "🙏"
    - termino: Cierre con decisión
      definicion: |-
        La última diapositiva nombra la decisión propuesta + quién + plazo. La sustentación cierra en acción, no en agradecimiento.
      ejemplo: "\"Propongo a coordinación revisar la ruta del barrio Macarena en las próximas 4 semanas\"."
      emoji: "✅"
  quiz:
    titulo: "✅ Verifica sustentación"
    instrucciones: 5 preguntas para confirmar criterios de sustentación profesional. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Por qué declarar las limitaciones del estudio en lugar de esconderlas?
        opciones:
          - Por humildad académica
          - Porque el crítico las verá igual — declararlas primero te da credibilidad y control narrativo
          - Por costumbre
          - No es necesario
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Esconder limitaciones produce auditoría hostil; declararlas convierte al crítico en interlocutor.
        feedback_incorrecto: |-
          Las limitaciones se ven solas. Declararlas primero es estrategia, no debilidad: te da credibilidad y reduce el ataque.
      - enunciado: ¿Cuál es la regla "1-1-20" en una diapositiva?
        opciones:
          - 1 hora, 1 imagen, 20 personas
          - 1 idea, 1 imagen, máximo 20 palabras
          - 1 gráfico, 1 tabla, 20 datos
          - 1 minuto, 1 frase, 20 segundos
        respuesta_index: 1
        feedback_correcto: Sí. La diapositiva apoya tu voz, no la reemplaza. Más de 20-25 palabras suele ser señal de pánico.
        feedback_incorrecto: 1 idea, 1 imagen, ≤20 palabras. Quien lee la diapositiva pierde a la audiencia.
      - enunciado: En el Q&A, una pregunta excede tu trabajo. ¿Qué dices?
        opciones:
          - Inventas algo creíble
          - Te disculpas largamente
          - "\"Eso no lo investigué — sería buena pregunta para extender el estudio\""
          - Cambias de tema
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. "No lo sé" con criterio es virtud, no derrota. Defender con orgullo herido es lo único que la audiencia recuerda mal.
        feedback_incorrecto: |-
          Honestidad limpia: "eso no lo investigué". El ego sereno produce respuestas que la audiencia respeta.
      - enunciado: ¿Con qué debe cerrar tu sustentación?
        opciones:
          - Agradecimientos
          - La decisión propuesta + quién + plazo
          - "\"Gracias por su atención\""
          - Un meme
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La sustentación cierra en acción, no en cortesía. La decisión es el insight final de todo el año.
        feedback_incorrecto: Decisión + quién + plazo. La cortesía está bien, pero el cierre profesional nombra acción concreta.
      - enunciado: En el saber ancestral del relato del año productivo, ¿qué aplica?
        opciones:
          - Nada — son contextos distintos
          - |-
            Sustentar es rendir cuentas comunitarias: contar qué se sembró, qué rindió, qué falló y qué hacer distinto
          - Que las juntas comunitarias eran cortas
          - Que basta con datos
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El campesino mayor rendía cuentas sin diapositivas. Tú las rindes con datos. Mismo gesto comunitario.
        feedback_incorrecto: |-
          Rendir cuentas es oficio comunitario antiguo. La sustentación profesional es su versión contemporánea con datos.
  post_lectura:
    transferencia: |-
      El año cerró aquí. El oficio sigue. Cuando aparezca una pregunta cotidiana que merezca dato — gastos, hábitos, asistencia, encuesta del salón — repite el ciclo: recoge, limpia, analiza, grafica, escribe insight, decide. La phronesis se entrena un ciclo a la vez.
  cinco_dimensiones:
    personal: |-
      Te llevas al año siguiente la capacidad de defender públicamente una decisión con datos — competencia profesional y vital para presupuestos, proyectos personales y propuestas comunitarias.
    emocional: |-
      Resististe la tentación del lucimiento. Sustentar con limitaciones declaradas exige humildad activa y entrenamiento del ego sereno.
    ciudadana: |-
      Rendir cuentas públicas con datos es virtud democrática. Lo que practicaste en el aula es lo que la sociedad necesita en política, periodismo y servicio público.
    local: |-
      El campesino mayor del Valle, el tendero del barrio, la abuela de la libreta: el relato del año productivo es oficio comunitario heredado. Tu sustentación lo continúa.
    intergeneracional: |-
      Lo que la junta comunitaria hacía en voz, tú lo haces con diapositivas. La rendición de cuentas honesta es virtud que se hereda y se devuelve mejorada.

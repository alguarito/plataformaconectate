titulo: Tablas y registros --- la columna como tipo, la fila como caso
producto_final: |-
  Tabla limpia en hoja de cálculo con 3 columnas tipadas (texto, número, fecha) y 15 filas reales, sin celdas vacías ni datos repetidos
saber_ancestral_idea: |-
  Los registros parroquiales coloniales, los cuadernos de tienda del barrio y los libros de cuentas del molino tienen la misma estructura que una hoja de cálculo moderna: una fila por hecho, una columna por tipo de información. La hoja de cálculo no es nueva --- es la digitalización de un oficio antiguo.

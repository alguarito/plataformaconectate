clave: 3-2
grado: 9
periodo: 3
sesion: 2
completo: true
duracion_min: 90
titulo: Tablas y registros --- la columna como tipo, la fila como caso
titulo_portada: |-
  Tablas y registros ---
  la columna como tipo,
  la fila como caso
producto_final: |-
  Tu tabla limpia en hoja de cálculo: al menos quince filas reales, tres columnas o más con su tipo declarado —texto, número y fecha como mínimo—, encabezados cortos y consistentes, ninguna celda vacía y ninguna celda combinada. La acompaña la bitácora de limpieza, con cada cambio y por qué se hizo. El archivo se abre y se entiende sin que estés al lado.
apertura:
  origen: Arancel de gracias al sacar (1795) · una categoría que era una lista de permisos
  fuente: |-
    Twinam, A. (2015). \emph{Purchasing whiteness: Pardos, mulattos, and the quest for social mobility in the Spanish Indies}. Stanford University Press.
  saber_ancestral: |-
    En 1795 la Corona española publicó un arancel de gracias que se podían comprar. Entre las opciones estaba la blancura: un pardo o un quinterón podía pagar para que un papel oficial lo declarara blanco. Eso se llamó \textbf{gracias al sacar}, y la historiadora Ann Twinam siguió esos expedientes uno por uno. Que la blancura tuviera precio prueba dos cosas al tiempo. Que no era un hecho de la naturaleza, sino una posición social. Y que esa posición abría o cerraba puertas reales: estudiar, ordenarse sacerdote, ocupar un cargo, casarse con quien uno quisiera. En aquel sistema, la casilla que le tocaba a una persona indígena, africana o mestiza no era una etiqueta descriptiva. Era una \textbf{lista de permisos}. La \textbf{cara de exclusión}: conviene evitar la lectura amable de que «al final podían ascender». Ese rastro sigue vivo en quién parece de familia conocida y quién no.
  saber_contemporaneo: |-
    Una tabla que sirve cumple tres reglas y ninguna se negocia. \textbf{Columnas tipadas}: cada columna guarda una sola clase de cosa, sea texto, número, fecha, moneda o sí y no. Si se rompe, las fórmulas dejan de funcionar y nadie avisa. \textbf{Cada fila un caso}: una fila no puede contener tres hechos distintos. Si la columna «compras» de la fila «Juan» dice «leche, pan, mantequilla», eso son tres filas disfrazadas de una. \textbf{Encabezados cortos y consistentes}: sin espacios raros, sin abreviaturas que solo tú entiendes, iguales en toda la hoja. Y hay una prueba única para saber si la tabla está bien: si un compañero abre tu archivo y entiende la estructura sin que se la expliques. Si no, el problema no es de él. Y una advertencia que viene del arancel: cuando una columna clasifica personas, esa columna reparte algo.
  pregunta_puente: |-
    En 1795 la casilla que le tocaba a alguien decidía si podía estudiar o casarse. En tu tabla, ¿qué decide la columna que clasifica?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué rompe cada una de las tres reglas en tablas reales que tengas cerca; (2) \textbf{explicar} las tres reglas y por qué una columna que clasifica personas nunca es neutral; (3) \textbf{aplicar} la limpieza a tu propia tabla y documentar cada cambio.
puentes:
  a_ruta: |-
    En la sesión 1 recogiste veinte filas con una pregunta acotada. Hoy las pones en forma para que sirvan. En la sesión 3 llegan las fórmulas, y sin columnas tipadas ninguna funciona.
  a_escuta: |-
    Antes de la teoría vas a mirar tres tablas ajenas: una profesional, una casera y una tuya. La comparación enseña más rápido que cualquier regla.
  a_sistematizacion: |-
    Ya viste qué falla. Ahora vas a nombrar las tres reglas y a discutir la parte que casi nunca se discute: qué hace una columna cuando clasifica personas.
  a_praxis: |-
    Tienes el criterio. Toca limpiar tu propia tabla y dejar registro de cada cambio.
  a_producto: |-
    Lo que entregas hoy: la tabla limpia y su bitácora. La prueba de calidad: alguien abre tu archivo y entiende la estructura sin preguntarte nada.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Una tabla ordenada es una forma de respeto por quien la va a usar después, incluido tú.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre codificar y clasificar: Dussel sobre codificar y decodificar, Séneca sobre lo que se aplaza, Floridi sobre vernos como organismos informacionales.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Tres tablas bajo la lupa} (15 min · individual). (1) Busca tres tablas. Una profesional, de datos abiertos o una ficha técnica. Una casera, como una lista de cumpleaños o de gastos. Y la tuya de la sesión 1. (2) Mira los encabezados de cada una y anota si son cortos y consistentes. (3) Comprueba si cada columna guarda una sola clase de cosa. (4) Busca celdas vacías y celdas combinadas. (5) Marca cuál de las tres se entiende sin explicación.
  checks:
  - Revisé encabezados, tipos, vacíos y combinaciones en las tres.
  - Anoté qué regla rompe cada una.
  - Marqué cuál se entiende sin explicación.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Tres tablas bajo la lupa». \textbf{Formato:} tabla de 3 filas y 4 columnas (tabla / encabezados / columnas tipadas / vacías o combinadas), con marca en la que se entiende sola. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} sabes qué regla rompe la tuya.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Las tres reglas} (20 min · parejas). (1) Con tu pareja, escriban las tres reglas con una frase propia cada una. (2) Tomen la peor de sus seis tablas y escriban qué hay que hacerle, paso por paso. (3) Busquen en las tres profesionales una columna que clasifique personas. (4) Escriban en dos líneas qué reparte esa columna: qué se puede hacer con una categoría y qué no.
  pilares:
  - |-
    \textbf{Columnas tipadas.} Cada columna guarda una sola clase de cosa. Si mezclas texto y número en la misma, ninguna fórmula va a funcionar, y lo peor es que no aparece ningún error: aparece un resultado falso.
  - |-
    \textbf{Cada fila un caso.} «Leche, pan, mantequilla» en una celda son tres filas disfrazadas de una. Se nota al querer contar cuántas veces se compró pan y descubrir que no hay manera.
  - |-
    \textbf{Encabezados cortos y consistentes.} Sin espacios de más, sin acentos raros, sin abreviaturas privadas. Si «fecha» aparece como «Fecha», «FECHA» y «fecha\_1», ya tienes tres columnas donde debía haber una.
  - |-
    \textbf{Una columna que clasifica personas reparte algo.} No es una etiqueta descriptiva: decide quién entra en un filtro, quién aparece en un informe y quién queda fuera del conteo. El arancel de 1795 lo hacía sin disimulo; hoy se hace sin decirlo.
  anatomia:
    titulo: Las tres reglas de una tabla
    body: |-
      \textbf{Columna:} un solo tipo, declarado. \\[1mm] \textbf{Fila:} un solo caso, sin listas dentro. \\[1mm] \textbf{Encabezado:} corto, consistente, sin abreviaturas privadas. \\[1mm] \textbf{Prueba:} ¿se entiende sin que yo lo explique?
  errores_comunes: |-
    (1) \textbf{Mezclar tipos en una columna}: la fórmula no falla, devuelve algo falso. (2) \textbf{Listas dentro de una celda}: impiden contar y filtrar, que es para lo que sirve una tabla. (3) \textbf{Celdas combinadas}: se ven bien y rompen cualquier ordenamiento. (4) \textbf{Encabezados que cambian de nombre}: crean columnas fantasma. (5) \textbf{Dejar vacíos sin explicar}: alguien va a interpretarlos, y va a interpretarlos mal.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Las tres reglas». \textbf{Formato:} las tres reglas con frase propia, el plan de arreglo de la peor tabla paso por paso y las dos líneas sobre qué reparte una columna que clasifica. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} el plan de arreglo tiene pasos y no intenciones.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Limpia tu tabla} (30 min · individual). (1) Abre tu tabla de la sesión 1. (2) Arregla los encabezados: cortos, consistentes, sin abreviaturas privadas. (3) Revisa columna por columna que cada una guarde un solo tipo, y declara cuál es. (4) Separa las celdas que contengan listas, para que cada fila sea un caso. (5) Elimina las celdas combinadas y resuelve los vacíos, completándolos o marcándolos con un valor explícito. (6) Anota cada cambio en la bitácora y pásale el archivo a un compañero sin explicarle nada.
  pilares:
  - |-
    \textbf{Tu entrega tiene dos piezas.} La tabla limpia con quince filas o más. Y la bitácora, con un renglón por cambio y su razón.
  - |-
    \textbf{Los vacíos se resuelven, no se ignoran.} Si el dato no existe, se marca con un valor explícito y se dice qué significa. Un vacío sin explicar obliga a adivinar, y alguien va a adivinar mal.
  - |-
    \textbf{Declarar el tipo se hace en la hoja, no en la cabeza.} La mayoría de programas dejan fijar el formato de la columna. Hacerlo evita que una fecha se convierta en número al ordenar, que es el desastre más común.
  - |-
    \textbf{La prueba es soltar el archivo.} Pásaselo a alguien sin decir nada. Si tiene que preguntarte qué significa una columna, esa columna necesita mejor encabezado.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Encabezados cortos, consistentes y sin abreviaturas privadas. \\[1mm] \checkbox Cada columna con un solo tipo, declarado en la hoja. \\[1mm] \checkbox Quince filas o más, cada una un solo caso. \\[1mm] \checkbox Ninguna celda combinada. \\[1mm] \checkbox Vacíos resueltos o marcados con un valor explícito. \\[1mm] \checkbox Un compañero abrió el archivo y lo entendió sin preguntar.
  plantilla_guion: |-
    \textbf{Cambio.} \textit{Qué arreglé.} \\[1mm] \textbf{Regla.} \textit{Cuál de las tres.} \\[1mm] \textbf{Antes.} \textit{Cómo estaba.} \\[1mm] \textbf{Después.} \textit{Cómo quedó.} \\[1mm] \textbf{Razón.} \textit{Qué se rompía si lo dejaba así.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} \textbf{Título:} «Actividad 3 --- Limpia tu tabla». \textbf{Formato:} los encabezados finales con el tipo de cada columna, cinco filas copiadas a mano y la bitácora con un renglón por cambio. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} un compañero abrió tu archivo y no te preguntó nada.
  producto_titulo: Tabla limpia de quince filas con columnas tipadas + bitácora de limpieza
  criterios:
  - Los encabezados son cortos, consistentes y sin abreviaturas privadas
  - Cada columna guarda un solo tipo y está declarado en la hoja
  - Hay quince filas o más y cada una es un solo caso
  - No queda ninguna celda combinada ni ningún vacío sin explicar
  - Un compañero abrió el archivo y entendió la estructura sin preguntar
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.2.5.3
    cita: |-
      La información por transmitirse deberá codificarse semántica, sintáctica y fonéticamente, para ser, desde la recepción, decodificada fonética, sintáctica y semánticamente como información recibida.
    aplicacion: |-
      Una tabla es exactamente eso: codificas para que otro decodifique. Un encabezado abreviado que solo tú entiendes rompe la segunda mitad del proceso, y entonces el dato existe pero no llega.
    pregunta_espejo: |-
      ¿Qué encabezado mío entiendo solo yo, y qué pasaría si no estuviera para explicarlo?
  estoico:
    autor: Séneca · Cartas a Lucilio, 1 (c. 64 d.C.)
    cita: |-
      Mientras la diferimos, la vida transcurre. Todo lo demás, Lucilio, nos es ajeno. Sólo el tiempo, objeto tan fugaz como esquivo, es nuestro.
    aplicacion: |-
      Con las tablas pasa igual y se paga caro. Limpiar veinte filas hoy toma diez minutos; limpiar doscientas dentro de un mes toma una tarde, y para entonces ya no recuerdas qué significaba cada vacío.
    pregunta_espejo: |-
      ¿Qué arreglo de mi tabla vengo aplazando, y cuánto va a costar cuando ya no me acuerde?
  floridi:
    autor: Luciano Floridi · Hyperhistory and the Philosophy of Information Policies (2015)
    cita: |-
      Una cuarta revolución en nuestra autocomprensión —tras la copernicana, la darwiniana y la freudiana— que reinterpreta a los humanos como organismos informacionales que viven e interactúan con otros agentes informacionales en la infoesfera. (trad. propia)
    aplicacion: |-
      Si somos también lo que los registros dicen de nosotros, entonces una casilla no es un detalle administrativo. En 1795 la casilla decidía si alguien podía estudiar. Hoy decide quién aparece en un filtro y quién no.
    pregunta_espejo: |-
      ¿En qué registro estoy yo clasificado, y qué decide sobre mí esa casilla?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la tabla limpia y la bitácora. Comprueba antes que un compañero pueda abrirla y entenderla sin preguntarte. En la sesión 3 entran las fórmulas, y sobre una tabla sucia ninguna da un resultado confiable.
web:
  resumen: |-
    En 1795 la Corona publicó un arancel donde la blancura se podía comprar: la casilla que le tocaba a alguien decidía si podía estudiar, ordenarse o casarse. No era una etiqueta, era una lista de permisos. Hoy pones tu tabla en forma con tres reglas innegociables, y de paso miras qué reparte una columna cuando clasifica personas.
  subtema: Datos · Estructura de tablas
  pre_lectura:
    por_que_importa: |-
      Sobre una tabla sucia ninguna fórmula da un resultado confiable, y lo peor es que no avisa: devuelve un número que parece correcto.
    pregunta_detonante: |-
      ¿Has abierto alguna vez una hoja de cálculo de otra persona y no has entendido qué significaba una columna?
    activacion:
      titulo: La columna rara
      descripcion: |-
        En 2 minutos, mira una tabla que tengas y busca la columna cuyo nombre no entendería alguien más. Anota cómo se llamaría bien.
      duracion_min: 3
    conexion:
      anterior: En la sesión 1 recogiste veinte filas con una pregunta acotada.
      siguiente: En la sesión 3 entran SUMA, PROMEDIO, MAX, MIN y CONTARA sobre esta tabla ya limpia.

clave: 3-2
grado: 9
periodo: 3
sesion: 2
completo: true
titulo: Tablas y registros --- la columna como tipo, la fila como caso
titulo_portada: |-
  Tablas y registros ---
  la columna como tipo,
  la fila como caso
producto_final: Tabla limpia en hoja de cálculo con 3 columnas tipadas (texto, número, fecha) y 15 filas reales, sin celdas vacías ni datos repetidos
apertura:
  saber_ancestral: |-
    Los \textbf{registros parroquiales coloniales} colombianos mantenían la memoria de los pueblos durante siglos: bautizos, matrimonios, defunciones, ventas de tierra. Cada registro tenía formato uniforme (fecha, nombre, padre, madre, padrino, firma del párroco). Los \textbf{cuadernos del tendero} del barrio del Valle hacían lo mismo con las cuentas diarias: fecha, producto, cantidad, precio. Esa estructura ---  una fila por hecho, una columna por tipo --- es exactamente la lógica de una hoja de cálculo moderna. La tabla no es invento digital. Es la digitalización de un oficio centenario.
  origen: Registros parroquiales coloniales y cuadernos del tendero en el Valle del Cauca
  saber_contemporaneo: |-
    Una \textbf{tabla bien estructurada} tiene tres reglas innegociables: (1) cada \emph{columna} es UN tipo de dato (texto, número, fecha, sí/no, moneda); nunca mezcla; (2) cada \emph{fila} es UN caso completo (un encuestado, un producto, una venta); nunca a medias; (3) la \emph{primera fila} son los encabezados, con nombres cortos y consistentes. Romper cualquiera de las tres es como mezclar libras con unidades en el cuaderno del tendero --- todo lo posterior se vuelve cuento.
  pregunta_puente: |-
    ¿Cómo organizaba la abuela su libreta de cuentas o la parroquia su registro de bautizos? ¿Y qué pasa hoy cuando alguien sube una hoja de Excel con celdas combinadas, columnas mezcladas y filas incompletas?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 4 tipos básicos de dato en una hoja de cálculo (texto, número, fecha, sí/no); (2) \textbf{analizar} 3 tablas reales y diagnosticar sus errores estructurales; (3) \textbf{aplicar} las 3 reglas innegociables a tu propia recolección de la sesión anterior; (4) \textbf{crear} una tabla limpia con 15 filas reales y tipos consistentes.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 1 te dio el principio (pregunta antes que dato); hoy bajas al primer principio operativo: cómo estructurar lo que recogiste en una tabla que sí permita análisis posterior.
  a_escuta: |-
    Antes de teorizar, vas a auditar tablas reales (la del tendero, la de la parroquia, la de un sitio web). Verás patrones que separan las útiles de las inútiles.
  a_sistematizacion: |-
    Ya viste tablas reales. Ahora vamos a entender las \textbf{3 reglas innegociables} de la tabla profesional: columnas tipadas, filas completas, encabezados consistentes. Sin estas 3, ninguna fórmula posterior funciona.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: tomar tu propia tabla de la sesión 1, limpiarla, tiparla, y dejarla lista para que las fórmulas de la sesión 3 funcionen.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: tabla limpia de 15 filas. El criterio principal: que un compañero abra tu archivo y entienda la estructura sin que tú expliques.
  a_evaluacion: |-
    Antes de cerrar, mira la estructura de la tabla desde las cinco dimensiones humanas. Estructurar bien es respeto a quien va a leer la tabla después --- a ti mismo en una semana, a un compañero, a un profesor.
  a_triangulo: |-
    Y para terminar, tres voces sobre la estructura. Dussel sobre la memoria que sobrevive cuando está bien guardada, Marco Aurelio sobre el cuidado del detalle pequeño, Floridi sobre la calidad informacional como respeto al receptor.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- 3 tablas reales bajo la lupa} (15 min · individual). Encuentra \textbf{3 tablas} en tu entorno: (a) una \emph{tabla profesional} (estadística DANE, datos abiertos del gobierno, ficha técnica de un producto), (b) una \emph{tabla cotidiana} (lista de cumpleaños de tu salón, inventario del kiosko, programación del curso), (c) una \emph{tabla mal estructurada} (puede ser una propia, una de un grupo de WhatsApp, una de redes). Para cada una: ¿cumple las 3 reglas innegociables?
  checks:
  - Encontré 3 tablas reales (1 profesional, 1 cotidiana, 1 mal estructurada).
  - Identifiqué en cada una el tipo de cada columna (texto, número, fecha, sí/no).
  - Detecté errores estructurales en la mal estructurada (mezcla de tipos, celdas vacías, encabezados inconsistentes).
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- 3 tablas bajo la lupa». \textbf{Formato:} tabla de 4 columnas (Tabla~|~Tipos de columna~|~¿Filas completas?~|~Errores detectados), 3 filas. \textbf{Sabes que terminaste cuando} reconoces los 3 errores más comunes y por qué cada uno rompe el análisis posterior.
sistematizacion:
  intro: |-
    Toda tabla profesional cumple 3 reglas innegociables. Vamos a descomponerlas con los pilares del pensamiento computacional para que tu tabla no fabrique cuentos.
  pilares:
  - |-
    Las 3 reglas se descomponen así: (1) \textbf{columnas tipadas} --- cada columna almacena un solo tipo (texto / número / fecha / sí-no / moneda); romperlo impide que las fórmulas funcionen, (2) \textbf{filas completas} --- cada fila representa UN caso con todos sus campos; las celdas vacías son cáncer de las tablas, (3) \textbf{encabezados consistentes} --- nombres cortos, sin espacios al inicio, sin acentos extraños, sin mayúsculas inconsistentes; eso permite que las fórmulas referencien sin error.
  - |-
    Toda tabla sigue el patrón \textbf{``cada fila un hecho''}: una fila no puede contener 3 cosas distintas. Si tu fila ``Juan'' tiene la columna ``Compras'' con ``leche, pan, mantequilla'', estás mezclando 3 hechos. La forma correcta es 3 filas separadas (Juan-leche, Juan-pan, Juan-mantequilla) o una columna distinta por producto. Eso es ``forma larga'' versus ``forma ancha'' de los datos.
  - |-
    Lo esencial de una tabla cabe en una pregunta: \emph{¿un compañero puede abrir mi archivo y entender la estructura sin que yo le explique?}. Si la respuesta es no, hay algo mal estructurado.
  - |-
    Pasos para limpiar una tabla: (1) revisar encabezados (cortos, consistentes, sin acentos raros); (2) verificar que cada columna tenga UN tipo; (3) eliminar filas con celdas vacías o completar; (4) revisar duplicados exactos; (5) verificar que la primera columna sea un identificador único.
  anatomia:
    titulo: Anatomía de una tabla profesional
    body: |-
      \textbf{Primera fila:} encabezados cortos, sin espacios al inicio. \\[1mm] \textbf{Primera columna:} suele ser ID único o nombre. \\[1mm] \textbf{Tipos:} cada columna con su tipo declarado (texto / número / fecha / moneda). \\[1mm] \textbf{Sin combinar celdas:} las celdas combinadas rompen toda fórmula posterior. \\[1mm] \textbf{Sin filas vacías intermedias:} romperían el rango de selección. \\[1mm] \textbf{Sin colores como dato:} el color es decoración, no información.
  errores_comunes: |-
    (1) Mezclar tipos en una columna (números y texto): impide fórmulas. (2) Encabezados con espacios largos o emojis: rompen referencias. (3) Combinar celdas para ``verse mejor'': peor enemigo del análisis. (4) Usar color como dato (rojo = aprobado, verde = reprobado): el color no se exporta a CSV ni a otra herramienta. (5) Una columna con varios valores separados por comas: rompe filtros y fórmulas.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- 3 reglas innegociables de una tabla». \textbf{Formato:} 3 fichas, una por regla, cada una con: definición + ejemplo correcto + ejemplo incorrecto (con captura o dibujo). \textbf{Sabes que terminaste cuando} puedes diagnosticar errores estructurales en cualquier tabla que mires.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Limpia tu tabla a forma profesional} (30 min · individual). Hora de aplicar. Toma la tabla de 20 datos que recogiste en la sesión 1 (o crea una nueva si no la tienes) y aplícale las 3 reglas innegociables. El resultado: una tabla de mínimo 15 filas, columnas tipadas, lista para que las fórmulas de la sesión 3 funcionen.
  pilares:
  - |-
    Tu limpieza se descompone en 5 pasos: (1) revisar encabezados (cortos, sin acentos raros, consistentes), (2) declarar tipos en cada columna (Sheets/Excel: Formato $\rightarrow$ Número/Texto/Fecha), (3) eliminar filas con celdas vacías o completar lo que falta, (4) revisar duplicados exactos y decidir si quitar, (5) verificar que la primera columna identifique cada fila de forma única.
  - |-
    Sigue el patrón \textbf{``documentar antes de borrar''}: si vas a eliminar filas o columnas, anota en una hoja aparte (o en un comentario) qué quitaste y por qué. Esa bitácora hace tu trabajo reproducible y profesional.
  - |-
    Cada columna expresa una sola variable. Si tienes una columna ``Edad-Género'' (mezclada), pártela. Si tienes una columna ``Frutas favoritas'' con varios valores separados por comas, considera si necesitas 3 columnas (Fruta 1, Fruta 2, Fruta 3) o una tabla en ``forma larga''.
  - |-
    Algoritmo: (1) abre tu tabla de Sesión 1; (2) limpia encabezados; (3) tipa columnas; (4) elimina/completa filas vacías; (5) revisa duplicados; (6) verifica que tengas mínimo 15 filas reales; (7) guarda como ``tabla-limpia-{tu-nombre}.xlsx''.
  checklist:
    titulo: Checklist antes de cerrar la tabla limpia
    items: |-
      \checkbox Encabezados cortos, consistentes, sin acentos raros ni espacios al inicio. \\[1mm] \checkbox 3 columnas con tipos declarados (al menos texto, número, fecha). \\[1mm] \checkbox 15+ filas reales sin celdas vacías. \\[1mm] \checkbox Cero celdas combinadas. \\[1mm] \checkbox Ninguna columna mezcla tipos distintos. \\[1mm] \checkbox Primera columna es ID o identificador único.
  plantilla_guion: |-
    \textbf{Pregunta original.} \textit{La misma de Sesión 1, ajustada si conviene.} \\[1mm] \textbf{Encabezados finales.} \textit{Lista de los 3-5 encabezados elegidos.} \\[1mm] \textbf{Tipos por columna.} \textit{Tabla con columna + tipo.} \\[1mm] \textbf{Bitácora de limpieza.} \textit{Qué eliminé o transformé y por qué.} \\[1mm] \textbf{Archivo final.} \textit{Link o nombre del archivo guardado.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mi tabla limpia y tipada». \textbf{Formato:} captura impresa de la tabla limpia + bitácora de limpieza + nombre del archivo. \textbf{Extensión:} 1 página de cuaderno + 1 archivo digital. \textbf{Sabes que terminaste cuando} un compañero puede abrir el archivo y entender la estructura sin tu explicación.
  producto_titulo: Tabla limpia de 15 filas con 3 columnas tipadas y bitácora de limpieza
  criterios:
  - Encabezados cortos y consistentes
  - 3+ columnas con tipos declarados (texto, número, fecha al menos)
  - 15+ filas reales sin celdas vacías
  - Cero celdas combinadas
  - Bitácora de limpieza con cambios documentados
  - Archivo se puede abrir y entender sin explicación oral
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      La memoria del pueblo se mantiene cuando se estructura con disciplina --- las estructuras también son políticas.
    aplicacion: |-
      Durante siglos, las tablas oficiales del Estado colombiano no incluyeron columnas para registrar identidad afro o indígena con criterios propios. Esa ausencia estructural invisibilizaba comunidades enteras. Hoy, la pregunta de qué columnas crear en cualquier tabla --- desde un censo hasta una hoja de Excel del colegio --- decide qué se ve y qué se invisibiliza. Estructurar bien es respeto al lector; estructurar con criterio inclusivo es también respeto a quien aparece.
    pregunta_espejo: |-
      ¿Qué columnas faltan en las tablas que uso a diario? ¿Quiénes quedan invisibilizados por la ausencia de esa columna?
  estoico:
    autor: Marco Aurelio
    cita: |-
      El cuidado paciente del encabezado, del tipo, de la fila completa --- esa virtud invisible sostiene todo el análisis posterior.
    aplicacion: |-
      Estructurar bien una tabla puede tomar 30 minutos extra. Pero esos 30 minutos son la diferencia entre que las fórmulas de la próxima sesión funcionen al primer intento o que pases una hora depurando errores invisibles. La disciplina estoica recomienda: \emph{invertir tiempo en la estructura ahorra tiempo en el caos}.
    pregunta_espejo: |-
      ¿Estoy dispuesto a invertir 30 minutos en limpieza estructural, o prefiero ``ya está, vamos a las fórmulas'' y después arrepentirme?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Una tabla bien estructurada es regalo informacional a quien la recibe --- una mal estructurada es ruido egoísta.
    aplicacion: |-
      Cuando compartes una tabla con un compañero o profesor, le estás regalando o cargando. Una tabla limpia: regalo. Una con celdas combinadas, tipos mezclados y encabezados raros: carga. La calidad informacional de una hoja de cálculo es ética profesional aplicada a la herramienta más cotidiana del trabajo digital.
    pregunta_espejo: |-
      Cuando comparto una tabla, ¿estoy regalando o cargando a quien la abre después? ¿Cómo lo sé sin preguntarle?
compromiso: |-
  \textbf{Para la próxima semana.} Aplica las 3 reglas innegociables a UNA tabla cotidiana tuya (lista de gastos, inventario, programación). Compártela con alguien y pídele que diga si entiende la estructura sin que tú expliques. Ese feedback vale más que cualquier nota.
web:
  resumen: |-
    Limpias tu tabla de la sesión 1 aplicando las 3 reglas innegociables: columnas tipadas, filas completas, encabezados consistentes. Sin estas 3, ninguna fórmula posterior funciona.
  subtema: Datos · Estructura de tablas
  pre_lectura:
    por_que_importa: |-
      Una tabla profesional bien estructurada hace que las fórmulas funcionen al primer intento. Una mal estructurada te hace pasar horas depurando errores invisibles. La diferencia entre amateur y profesional empieza aquí, no en las fórmulas avanzadas.
    pregunta_detonante: |-
      Si compartes hoy tu hoja de Excel con un compañero, ¿él podría entenderla en 30 segundos sin tu explicación? Si no, ¿qué está mal estructurado?
    activacion:
      titulo: Test del compañero
      descripcion: |-
        En 3 minutos: abre la tabla de la sesión 1 y muéstrasela a un compañero. Pídele que diga, sin que tú expliques, qué hay en cada columna. Si dudó en alguna, eso es indicador de error estructural.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 1 recogiste 20 datos con pregunta acotada. Hoy le aplicas las 3 reglas que permiten que esos datos sí sirvan.
      siguiente: |-
        En la sesión 3 aplicarás las 5 fórmulas básicas (SUMA, PROMEDIO, MAX, MIN, CONTAR) sobre tu tabla limpia.
  conceptos_clave:
    - termino: Columna tipada
      definicion: |-
        Cada columna almacena UN solo tipo: texto, número, fecha, sí/no, o moneda. Romper el tipo impide que las fórmulas funcionen.
      ejemplo: |-
        Columna "Edad" debe ser solo números (14, 15, 16). Si una celda tiene "catorce", todas las fórmulas que la usen darán error.
      emoji: "🅰"
    - termino: Fila como caso
      definicion: |-
        Cada fila representa UN hecho completo con todos sus campos. Una fila a medias es como una transacción a medias — no sirve para análisis.
      ejemplo: |-
        Una fila "Juan, _, La Esperanza, 45" con la edad vacía rompe cualquier análisis de edad. Hay que completar o eliminar.
      emoji: "↔"
    - termino: Encabezados consistentes
      definicion: |-
        Primera fila con nombres cortos, sin acentos extraños, sin espacios al inicio, sin emojis. Eso permite que fórmulas referencien sin error.
      ejemplo: |-
        Bien: "Edad", "MinutosTikTok". Mal: " Edad ", "Minutos en TikTok 📱", "ÉDAD". Esos espacios y caracteres rompen referencias.
      emoji: "🏷"
    - termino: Celdas combinadas (a evitar)
      definicion: |-
        Cuando dos o más celdas se fusionan visualmente en una sola. Rompen filtros, fórmulas y exportación a CSV. Estética que destruye función.
      ejemplo: |-
        Para "agrupar visualmente" 3 filas bajo "Grado 9°A" se combinan 3 celdas. Resultado: filtros y SUMA fallan. Solución: repetir el valor en cada fila.
      emoji: "🚫"
    - termino: Forma larga vs forma ancha
      definicion: |-
        Forma larga: una fila por observación (Juan-Lunes-45min, Juan-Martes-30min). Forma ancha: una columna por dimensión (Juan, Lunes=45, Martes=30). Cada una sirve a un análisis distinto.
      ejemplo: |-
        Para tabla dinámica conviene forma larga. Para reporte visual conviene forma ancha. Saber convertir entre las dos es habilidad clave.
      emoji: "↕"
    - termino: Bitácora de limpieza
      definicion: |-
        Documento aparte donde anotas qué eliminaste, qué transformaste y por qué. Hace tu trabajo reproducible — alguien puede repetir tu proceso.
      ejemplo: |-
        "Eliminé fila 7 porque tenía edad vacía. Renombré columna Minutos en TikTok a MinutosTikTok para fórmulas." Esa bitácora es profesionalismo.
      emoji: "📋"
  quiz:
    titulo: "✅ Verifica las 3 reglas innegociables"
    instrucciones: |-
      5 preguntas para confirmar que estructuras tablas con criterio profesional. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Qué pasa si una columna mezcla números y texto?
        opciones:
          - Nada, se ve igual
          - Las fórmulas como SUMA o PROMEDIO no funcionan o devuelven 0 silenciosamente
          - Solo es problema estético
          - Excel los convierte automáticamente
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Mezclar tipos rompe las fórmulas en silencio: SUMA devuelve 0 o un número incorrecto sin avisar.
        feedback_incorrecto: |-
          Mezclar tipos rompe fórmulas silenciosamente. Es el error más peligroso: la hoja parece funcionar pero los resultados son falsos.
      - enunciado: ¿Por qué las celdas combinadas son enemigas de la tabla profesional?
        opciones:
          - Se ven feas
          - Rompen filtros, fórmulas y exportación a CSV — estética que destruye función
          - Solo se permiten en Word
          - Ocupan más espacio
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Una tabla con celdas combinadas no se puede filtrar bien, las fórmulas se confunden con el rango y al exportar a CSV se rompe.
        feedback_incorrecto: |-
          Celdas combinadas = estética que rompe función. Filtros, fórmulas y exportación fallan. Si necesitas agrupar visualmente, mejor formato condicional o repetir el valor.
      - enunciado: Una columna "Edad-Género" con valores "14-F", "15-M". ¿Qué hacer?
        opciones:
          - Dejarla así, ahorra espacio
          - "Partirla en 2 columnas: \"Edad\" (número) y \"Género\" (texto)"
          - Convertir todo a texto
          - Borrarla
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Una variable por columna es regla básica. "Edad" debe poder filtrarse/promediarse como número; "Género" como texto.
        feedback_incorrecto: |-
          Partir en 2 columnas. Una variable por columna permite filtrar por edad o por género independientemente — algo imposible con la mezcla.
      - enunciado: ¿Para qué sirve una "bitácora de limpieza"?
        opciones:
          - Para llenar página
          - Para hacer el trabajo reproducible — alguien puede repetir o auditar tu proceso
          - Para subir nota
          - No sirve
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Si eliminaste 3 filas, alguien podría preguntar por qué. La bitácora documenta tus decisiones para que el trabajo se pueda auditar.
        feedback_incorrecto: |-
          Reproducibilidad. Sin bitácora, tu trabajo es opaco. Con bitácora, otra persona puede repetir tu proceso y verificar tus decisiones.
      - enunciado: En el saber ancestral del cuaderno del tendero, ¿qué aplica directamente a tu hoja de Excel hoy?
        opciones:
          - Nada — los tenderos no usaban Excel
          - Que la estructura uniforme (una fila por hecho, una columna por tipo) permite memoria útil
          - Que se debe escribir a mano
          - Que los tenderos sabían más
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El cuaderno del tendero y tu hoja de Excel comparten la misma estructura porque ambas resuelven el mismo problema: guardar información para decidir.
        feedback_incorrecto: |-
          Estructura uniforme. La hoja de Excel digitaliza el oficio del tendero: una fila por transacción, una columna por tipo. Cambia el medio, no el principio.
  post_lectura:
    transferencia: |-
      Esta semana, aplica las 3 reglas innegociables a UNA tabla cotidiana tuya (lista de gastos, inventario, programación). Compártela con alguien y pídele que diga si entiende la estructura sin que tú expliques. Ese feedback vale más que cualquier nota.
  cinco_dimensiones:
    personal: |-
      Aprendiste que estructura bien hecha es lo que diferencia amateur de profesional en cualquier herramienta digital.
    emocional: |-
      Resististe la tentación de "ya está, sigamos" — entendiste que el orden inicial te ahorra frustración después.
    ciudadana: |-
      Saber estructurar tablas es habilidad cívica básica: lees mejor estadísticas oficiales, exiges mejor reportes, propones mejor proyectos con datos.
    local: |-
      Heredaste el oficio del tendero del Valle y del archivero parroquial: estructura uniforme como base de memoria comunitaria.
    intergeneracional: |-
      El cuaderno del tendero y tu hoja de Excel comparten lógica. Lo que cambia es el medio, no la disciplina.

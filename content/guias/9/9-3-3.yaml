producto_final: |-
  5 indicadores básicos calculados con fórmula sobre la propia tabla del estudiante (no escribir el resultado a mano, usar la fórmula), con interpretación de qué significa cada indicador en su contexto
saber_ancestral_idea: |-
  Antes de Excel, los oficios resolvían cálculos mentalmente con técnicas heredadas: el sastre estimaba metros de tela contando dedos, el panadero medía harina con jarros conocidos, el carpintero usaba la palma como unidad. La fórmula automatiza esa aritmética del oficio --- pero la inteligencia detrás sigue siendo humana.

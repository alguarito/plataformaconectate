clave: 3-3
grado: 9
periodo: 3
sesion: 3
completo: true
duracion_min: 90
titulo: Fórmulas básicas --- SUMA, PROMEDIO, MAX, MIN, CONTAR
titulo_portada: |-
  Fórmulas básicas ---
  cinco preguntas
  a la tabla
producto_final: |-
  Cinco indicadores calculados con fórmula sobre tu propia tabla: total, promedio, máximo, mínimo y cantidad de casos. Cada uno con su sintaxis escrita, su resultado verificado y una frase que diga qué significa en tu contexto, no en general. Cierra señalando cuál de los cinco es el que de verdad sirve para la decisión que tenías en mente.
apertura:
  origen: El fiado y el cuaderno de la tienda · la memoria que cualquiera puede revisar
  fuente: |-
    Martínez Benavides, A. (2021). Circuitos crediticios: fiado y trabajo relacional en un pequeño negocio en Cali, Colombia. \emph{Estudios Sociológicos de El Colegio de México, 39}(116), 467--494. https://doi.org/10.24201/es.2021v39n116.1946
  saber_ancestral: |-
    En una tienda de barrio del Valle del Cauca hay un cuaderno. La vendedora anota ahí quién debe y cuánto, y va tachando a medida que le pagan. Nadie firma nada: al fiado se entra demostrando que uno es «buena paga» y se sale cuando uno deja de serlo (Martínez Benavides, 2021). Fíjate en lo que hace ese cuaderno. La palabra vale porque hay memoria, y el registro vale porque cualquiera puede ponerlo a prueba: se abre, se suma y se compara. Es una hoja de cálculo hecha a mano, con las mismas operaciones que vas a usar hoy. La \textbf{cara de exclusión} es doble. La sanción por incumplir no es proporcional ni apelable: es la vergüenza en público, delante de testigos. Y a quien la tendera no conoce, no le fía, así que el circuito solo cuenta a los que ya estaban adentro.
  saber_contemporaneo: |-
    Cinco fórmulas responden casi todo lo que una tabla puede contestar por sí sola. \texttt{SUMA} responde cuánto hay en total. \texttt{PROMEDIO} responde cuánto suele haber por caso. \texttt{MAX} y \texttt{MIN} responden dónde están los extremos. \texttt{CONTAR} responde cuántos casos hay. Las cinco piden lo mismo para funcionar: una columna con un solo tipo de dato y un rango bien seleccionado. Y ahí está el error más común: seleccionar celda por celda en vez de tomar el rango completo, porque si mañana llega una fila nueva, la fórmula no la ve. Pero la parte que decide no es la sintaxis. Es la pregunta previa: qué vas a decidir con ese número. Un promedio de notas sirve para saber si hay que reforzar; un máximo sirve para saber si alguien se quedó sin dormir. No son intercambiables.
  pregunta_puente: |-
    El cuaderno de la tienda vale porque cualquiera puede abrirlo, sumar y comparar. Tu hoja de cálculo, ¿aguantaría que alguien la revisara así?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuánto se desvían tus cálculos mentales de los de la hoja y dónde estuvo la diferencia; (2) \textbf{explicar} qué pregunta responde cada una de las cinco fórmulas y qué exige para funcionar; (3) \textbf{aplicar} las cinco sobre tu tabla e interpretar cada resultado en tu contexto.
puentes:
  a_ruta: |-
    En la sesión 1 recogiste veinte filas y en la 2 las pusiste en forma. Hoy le haces a esa tabla las cinco preguntas básicas. En la sesión 4 aprendes a preguntarle solo por una parte, con filtros.
  a_escuta: |-
    Antes de la teoría vas a calcular de cabeza y después con fórmula. La diferencia entre los dos resultados es la clase de hoy.
  a_sistematizacion: |-
    Ya viste dónde falla tu cálculo mental. Ahora vas a saber qué pregunta responde cada fórmula y qué necesita para no mentir.
  a_praxis: |-
    Tienes las cinco. Toca aplicarlas a tu tabla y decir qué significa cada número en tu caso, no en abstracto.
  a_producto: |-
    Lo que entregas hoy: cinco indicadores con su interpretación. La prueba de calidad: cada frase habla de tu tema, no de estadística en general.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un número sin interpretación es un número; con ella empieza a servir para algo.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre calcular con propósito: Dussel sobre la técnica que echa mano de la ciencia, Marco Aurelio sobre lo que basta, Floridi sobre en qué proyecto estamos trabajando.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- De cabeza y con fórmula} (15 min · individual). (1) Abre tu tabla de la sesión 2, con su columna numérica. (2) Calcula mentalmente el total, el promedio, el máximo, el mínimo y cuántas filas hay. (3) Anota tus cinco respuestas y cuánto tardaste. (4) Calcula ahora los cinco con fórmula y anota los resultados. (5) Compara y marca en cuál te alejaste más, y escribe por qué crees que fue ese.
  checks:
  - Tengo los cinco resultados de cabeza y los cinco con fórmula.
  - Marqué en cuál me alejé más.
  - Escribí por qué creo que fue ese y no otro.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- De cabeza y con fórmula». \textbf{Formato:} tabla de 5 filas y 3 columnas (indicador / de cabeza / con fórmula), con marca en la mayor diferencia. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} tienes escrito por qué falló ese cálculo y no otro.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Qué pregunta responde cada una} (20 min · parejas). (1) Con tu pareja, escriban las cinco fórmulas con la pregunta que responde cada una, en lenguaje corriente. (2) Escriban qué exige cada una para funcionar. (3) Tomen un dato de sus tablas y digan qué indicador lo describe mejor y cuál lo describe peor. (4) Busquen un caso donde el promedio esconda algo y escriban qué indicador lo mostraría.
  pilares:
  - |-
    \textbf{Las cinco preguntas.} SUMA: cuánto hay en total. PROMEDIO: cuánto suele haber por caso. MAX y MIN: dónde están los extremos. CONTAR: cuántos casos hay. Cinco preguntas distintas y ningún atajo entre ellas.
  - |-
    \textbf{Rango antes que celda suelta.} Selecciona la columna completa, no celda por celda. Si mañana llega una fila nueva, la fórmula con rango la incluye sola y la otra no, y nadie te avisa del error.
  - |-
    \textbf{El promedio esconde a los extremos.} Un promedio de cuatro horas de pantalla puede tapar a alguien con once. Por eso el máximo y el mínimo no son adornos: son la parte del reporte que muestra a quién le está pasando algo.
  - |-
    \textbf{La pregunta va antes que la fórmula.} Qué vas a decidir con ese número. Un promedio sirve para saber si hay que reforzar; un máximo, para saber si alguien se quedó sin dormir. No son intercambiables.
  anatomia:
    titulo: Las cinco fórmulas
    body: |-
      \texttt{SUMA} \textbf{→} cuánto en total. \\[1mm] \texttt{PROMEDIO} \textbf{→} cuánto por caso. \\[1mm] \texttt{MAX} y \texttt{MIN} \textbf{→} los extremos. \\[1mm] \texttt{CONTAR} \textbf{→} cuántos casos. \\[1mm] \textbf{Exigen:} una columna de un solo tipo y un rango completo.
  errores_comunes: |-
    (1) \textbf{Seleccionar celda por celda}: la fórmula deja de crecer con la tabla. (2) \textbf{Promediar una columna con texto adentro}: devuelve un número, y es falso. (3) \textbf{Quedarse solo con el promedio}: esconde a los extremos, que suelen ser lo importante. (4) \textbf{Interpretar en abstracto}: «el promedio es 4,2» no dice nada sin decir 4,2 de qué y para qué. (5) \textbf{No verificar}: un total que no cuadra con una suma a mano de tres filas ya avisa de algo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Qué pregunta responde cada una». \textbf{Formato:} las cinco fórmulas con su pregunta y lo que exigen, más el caso donde el promedio esconde algo y el indicador que lo mostraría. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} tienen escrito un caso donde el promedio engaña.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Cinco indicadores interpretados} (30 min · individual). (1) Sobre tu tabla, escribe las cinco fórmulas con su sintaxis completa. (2) Comprueba que cada rango tome la columna entera. (3) Verifica al menos un resultado a mano, con tres filas. (4) Escribe la interpretación de cada indicador en una frase de tu contexto. (5) Señala cuál de los cinco sirve para la decisión que tenías en mente. (6) Pásale la hoja a un compañero y pídele que diga qué significa uno de tus números.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} Las cinco fórmulas con su sintaxis. Las cinco interpretaciones en una frase. Y la señal en el indicador que de verdad sirve.
  - |-
    \textbf{Interpretar es hablar de tu tema.} «El máximo es 11» no interpreta nada. «El máximo es 11 horas, y es un compañero que llega sin dormir» sí, porque cualquiera entiende qué hacer con eso.
  - |-
    \textbf{Verificar cuesta un minuto.} Suma tres filas a mano y compáralas con la fórmula. Si no coinciden, el problema está en el rango o en el tipo de la columna, y siempre es mejor descubrirlo ahora.
  - |-
    \textbf{Uno de los cinco manda.} Los cinco se calculan, pero solo uno responde tu pregunta original. Señalarlo obliga a recordar para qué recogiste los datos.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Las cinco fórmulas con su sintaxis completa. \\[1mm] \checkbox Todos los rangos toman la columna entera. \\[1mm] \checkbox Al menos un resultado verificado a mano. \\[1mm] \checkbox Cinco interpretaciones de una frase, en tu contexto. \\[1mm] \checkbox Señalado el indicador que sirve para tu decisión. \\[1mm] \checkbox Un compañero explicó uno de tus números sin ayuda.
  plantilla_guion: |-
    \textbf{Indicador.} \textit{Cuál de los cinco.} \\[1mm] \textbf{Fórmula.} \textit{La sintaxis, con su rango.} \\[1mm] \textbf{Resultado.} \textit{El número.} \\[1mm] \textbf{Qué significa.} \textit{Una frase de mi contexto.} \\[1mm] \textbf{Sirve para.} \textit{La decisión que tenía en mente.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} \textbf{Título:} «Actividad 3 --- Cinco indicadores interpretados». \textbf{Formato:} las cinco fórmulas con su resultado y su interpretación de una frase, más la señal en el que sirve para tu decisión. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} un compañero explicó uno de tus números sin que le ayudaras.
  producto_titulo: Cinco indicadores calculados con fórmula e interpretados en contexto
  criterios:
  - Las cinco fórmulas están escritas con su sintaxis y su rango completo
  - Al menos un resultado está verificado a mano
  - Las cinco interpretaciones hablan del tema propio, no de estadística en general
  - Está señalado cuál indicador sirve para la decisión original
  - Un compañero pudo explicar uno de los números sin ayuda
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §5.5.2
    cita: |-
      Es un error pensar que la ciencia pura… aplica ella misma alguna de sus conclusiones, apareciendo la tecnología como su concreta creación… Muy por el contrario, es el discurso técnico artesanal o tecnológico… echa mano… de conclusiones o teorías científicas.
    aplicacion: |-
      La tendera no aprendió a sumar porque alguien le enseñara estadística. Sumó porque hacía falta llevar la cuenta. Las fórmulas de hoy son eso mismo: una necesidad práctica que después alguien formalizó.
    pregunta_espejo: |-
      ¿Qué cálculo hago por necesidad, sin haberlo aprendido en una clase?
  estoico:
    autor: Marco Aurelio · Meditaciones IX, 6 (c. 175 d.C.)
    cita: |-
      Tu opinión presente fundada en el entendimiento, tu conducta presente dirigida al bien común y tu disposición presente de contento con todo lo que sucede: eso basta. (trad. propia)
    aplicacion: |-
      Cinco indicadores bastan para casi cualquier tabla de este tamaño. La tentación es calcular quince porque el programa los ofrece, y quince números sin interpretar informan menos que cinco bien leídos.
    pregunta_espejo: |-
      ¿Cuántos de los números que calculé sé explicar sin volver a mirarlos?
  floridi:
    autor: Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 3.1
    cita: |-
      Una de las preguntas políticas apremiantes que enfrentamos en las sociedades de la información avanzadas es: ¿en qué clase de proyecto humano estamos trabajando? (trad. propia)
    aplicacion: |-
      La versión pequeña de esa pregunta cabe en tu hoja: para qué estás calculando. Un promedio sin pregunta detrás es aritmética; con pregunta detrás es el comienzo de una decisión.
    pregunta_espejo: |-
      ¿Para qué recogí estos datos, y sigo calculando lo que responde a eso?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con los cinco indicadores interpretados. Pregúntale a alguien que lleve cuentas a mano, en una tienda o en la casa, qué revisa cuando cuadra. En la sesión 4 aprendes a preguntarle a la tabla solo por una parte.

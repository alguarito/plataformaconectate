clave: 3-3
grado: 9
periodo: 3
sesion: 3
completo: true
titulo: Fórmulas básicas --- SUMA, PROMEDIO, MAX, MIN, CONTAR
titulo_portada: |-
  Fórmulas básicas ---
  SUMA, PROMEDIO,
  MAX, MIN, CONTAR
producto_final: 5 indicadores básicos calculados con fórmula sobre la propia tabla del estudiante, con interpretación de qué significa cada uno en su contexto
apertura:
  saber_ancestral: |-
    Los oficios del Valle del Cauca y del Pacífico colombiano resolvían cálculos cotidianos con aritmética mental heredada: el \textbf{sastre de la plaza de Cartago} estimaba metros de tela contando dedos extendidos sobre el rollo; el \textbf{panadero de barrio} medía harina con jarros de tamaño conocido; el \textbf{minero afro-pacífico del Chocó} pesaba gramos de oro con balanza de mano y calculaba la \emph{ley} (porcentaje de pureza) sin lápiz; la \textbf{tendera del barrio} sumaba mentalmente cuentas de 10-15 productos sin equivocarse. Los \textbf{tejedores Wayuu} llevan inventario de chivos con sistema decimal propio. Cada uno tiene su técnica para SUMAR, PROMEDIAR, sacar MÁXIMOS y MÍNIMOS sin calculadora. Las 5 fórmulas básicas de Excel automatizan esa aritmética del oficio --- pero la inteligencia detrás (saber qué calcular y qué hacer con el resultado) sigue siendo humana.
  origen: Aritmética mental del sastre, panadero, carpintero y tendera del Valle del Cauca
  saber_contemporaneo: |-
    Las \textbf{5 fórmulas básicas} son \texttt{SUMA(rango)}, \texttt{PROMEDIO(rango)}, \texttt{MAX(rango)}, \texttt{MIN(rango)} y \texttt{CONTAR(rango)} ---o \texttt{CONTARA} para texto. Con esas 5 puedes resolver el 80~\% de los cálculos cotidianos. Cada una responde una pregunta distinta: \emph{¿cuánto en total?}, \emph{¿cuánto en promedio?}, \emph{¿cuál es el más alto / más bajo?}, \emph{¿cuántos casos hay?}. La técnica está bien; el oficio está en saber cuándo aplicar cuál.
  pregunta_puente: |-
    ¿Cómo hacía la tendera del barrio para sumar mentalmente 12 productos sin equivocarse? ¿Y qué pierde un programador novato cuando aplica fórmulas sin saber qué pregunta responde cada una?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} las 5 fórmulas básicas y la pregunta que responde cada una; (2) \textbf{aplicar} cada fórmula a un rango de tu tabla; (3) \textbf{analizar} qué significa cada resultado en el contexto de tu pregunta original; (4) \textbf{interpretar} los 5 indicadores como insumo para decisión, no como número decorativo.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 2 te dio la tabla limpia; hoy le aplicas las primeras 5 fórmulas. Es la base operativa de todo Excel --- sin estas 5 nada más funciona; con estas 5 el 80~\% de los problemas cotidianos se resuelve.
  a_escuta: |-
    Antes de teorizar, vas a calcular mentalmente versus con fórmula los mismos 5 indicadores sobre tu propia tabla. Verás dónde tu mente es más rápida y dónde la fórmula evita errores.
  a_sistematizacion: |-
    Ya viste el contraste. Ahora vamos a entender la \textbf{anatomía} de cada una de las 5 fórmulas: qué pregunta responde, qué rango toma, qué tipo de dato exige, qué error frecuente da.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: calcular 5 indicadores sobre tu propia tabla, escribir cada fórmula con criterio, e interpretar qué significa cada resultado en el contexto de tu pregunta original.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 5 indicadores calculados + 5 interpretaciones en tus palabras. El criterio principal: que cada cifra tenga una frase de interpretación que diga ``esto significa X para mi pregunta''.
  a_evaluacion: |-
    Antes de cerrar, mira las 5 fórmulas desde las cinco dimensiones humanas. Calcular bien es respeto al dato; interpretar bien es respeto a la decisión que viene después.
  a_triangulo: |-
    Y para terminar, tres voces sobre el cálculo. Dussel sobre los números que invisibilizan, Marco Aurelio sobre la aritmética como virtud, Floridi sobre los indicadores como infraestructura cognitiva.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Mente vs fórmula} (15 min · individual). Toma tu tabla de la sesión 2 (15+ filas con columna numérica). Calcula \emph{mentalmente}: total, promedio, máximo, mínimo, cantidad de filas. Anota tus resultados y el tiempo que te tomó. Después aplica las 5 fórmulas en la hoja y compara: ¿qué método fue más rápido?, ¿qué método dio resultado correcto?
  checks:
  - Hice los 5 cálculos mentalmente con tiempo cronometrado.
  - Apliqué las 5 fórmulas (SUMA, PROMEDIO, MAX, MIN, CONTAR).
  - Comparé honestamente: cuál ganó en velocidad, cuál ganó en precisión.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mente vs fórmula». \textbf{Formato:} tabla de 4 columnas (Indicador~|~Mi resultado mental~|~Resultado fórmula~|~Tiempo mental), 5 filas. Al final 1 línea con quién ganó velocidad y quién precisión. \textbf{Sabes que terminaste cuando} reconoces honestamente las fortalezas y límites de cada método.
sistematizacion:
  intro: |-
    Las 5 fórmulas básicas comparten sintaxis pero responden preguntas distintas. Vamos a descomponerlas con los pilares del pensamiento computacional para que sepas exactamente cuándo aplicar cuál.
  pilares:
  - |-
    Las 5 fórmulas se descomponen así: (1) \texttt{=SUMA(rango)} responde \emph{¿cuánto en total?}, exige columna numérica; (2) \texttt{=PROMEDIO(rango)} responde \emph{¿cuánto típicamente?}, exige columna numérica, ignora vacías; (3) \texttt{=MAX(rango)} responde \emph{¿cuál es el más alto?}, exige numérica o fecha; (4) \texttt{=MIN(rango)} responde \emph{¿cuál es el más bajo?}, igual que MAX; (5) \texttt{=CONTAR(rango)} cuenta solo números, mientras \texttt{=CONTARA(rango)} cuenta cualquier celda no vacía.
  - |-
    Toda fórmula sigue el patrón \textbf{``rango antes que celda suelta''}: nunca selecciones celda por celda; siempre toma un rango (B2:B16). Si tu tabla crece después, usa rangos abiertos (B:B) o tablas estructuradas. Esa disciplina hace que las fórmulas sigan funcionando cuando agregas filas.
  - |-
    Lo esencial del cálculo cabe en una pregunta: \emph{¿qué decisión voy a tomar con este número?}. SUMA total de ventas: decisión de pedido. PROMEDIO de notas: decisión pedagógica. MAX: identificar caso destacado. MIN: identificar caso en riesgo. CONTAR: tamaño de la muestra. Sin decisión asociada, el número es decoración.
  - |-
    Pasos para aplicar cualquier fórmula: (1) identifica la pregunta; (2) elige la fórmula que la responde; (3) selecciona el rango correcto (toda la columna sin encabezado); (4) verifica que el tipo de dato sea apropiado; (5) interpreta el resultado en términos de la pregunta original.
  anatomia:
    titulo: Anatomía de una fórmula bien escrita
    body: |-
      \textbf{Pregunta:} qué responde la fórmula en 1 frase. \\[1mm] \textbf{Fórmula:} =FUNCION(rango). \\[1mm] \textbf{Rango:} desde fila 2 hasta el final, columna correcta. \\[1mm] \textbf{Tipo esperado:} la columna debe contener el tipo apropiado (números para SUMA, fechas para MAX de fechas). \\[1mm] \textbf{Resultado:} el número que devuelve. \\[1mm] \textbf{Interpretación:} 1 frase que dice qué significa para la decisión.
  errores_comunes: |-
    (1) \texttt{=SUMA(B2)}: olvidar el rango, suma una sola celda. (2) \texttt{=SUMA(A:A)} cuando la columna A es texto: devuelve 0 sin avisar. (3) PROMEDIO sobre columna con celdas vacías al mezclar con ceros: ignora vacías pero NO ignora ceros, lo cual sesga. (4) Confundir CONTAR (solo números) con CONTARA (cualquier valor): cuentas distintas. (5) Olvidar la interpretación: tener el número sin saber qué decir con él.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía de las 5 fórmulas básicas». \textbf{Formato:} 5 fichas, una por fórmula, cada una con: pregunta que responde + sintaxis exacta + tipo esperado + error frecuente + ejemplo de tu tabla. \textbf{Sabes que terminaste cuando} podrías escribir las 5 fórmulas en cualquier tabla nueva sin consultar.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- 5 indicadores con interpretación} (30 min · individual). Hora de aplicar. Sobre tu propia tabla de Sesión 2, calcula los 5 indicadores básicos usando fórmula (no a mano) y escribe la interpretación de cada uno en el contexto de tu pregunta original.
  pilares:
  - |-
    Tu cálculo se descompone en 5 piezas: (1) SUMA, (2) PROMEDIO, (3) MAX, (4) MIN, (5) CONTAR (o CONTARA). Para cada una: fórmula escrita + resultado obtenido + interpretación en 1 frase referida a tu pregunta original.
  - |-
    Sigue el patrón \textbf{``cada indicador responde una pregunta''}: no aplicas la fórmula porque sí. Antes de cada cálculo, escribe en una nota la pregunta que vas a responder. Ese hábito separa al analista del que solo ``llena hojas''.
  - |-
    Cada interpretación expresa una sola idea. Si tu PROMEDIO da 6.2 y dices ``el promedio es 6.2, lo cual significa que el curso anda regular pero hay quienes están bien y quienes están mal'', divídelo en 2-3 frases o reduce a la más fuerte. La interpretación clara vence a la verbosa.
  - |-
    Algoritmo: (1) ubica la columna numérica relevante; (2) escribe la pregunta; (3) elige fórmula; (4) aplica; (5) anota resultado; (6) escribe interpretación. Repite para los 5.
  checklist:
    titulo: Checklist antes de cerrar los 5 indicadores
    items: |-
      \checkbox 5 fórmulas escritas con sintaxis correcta. \\[1mm] \checkbox 5 resultados obtenidos y verificados. \\[1mm] \checkbox 5 interpretaciones de 1 frase cada una, ligadas a la pregunta original. \\[1mm] \checkbox Reconozco qué indicador es el más relevante para mi decisión. \\[1mm] \checkbox Verifiqué que el tipo de dato de cada columna sea apropiado para la fórmula aplicada.
  plantilla_guion: |-
    \textbf{Pregunta original.} \textit{La de Sesión 1, ajustada si conviene.} \\[1mm] \textbf{Total (=SUMA).} \textit{Fórmula + resultado + interpretación.} \\[1mm] \textbf{Promedio (=PROMEDIO).} \textit{Lo mismo.} \\[1mm] \textbf{Máximo (=MAX).} \textit{Lo mismo.} \\[1mm] \textbf{Mínimo (=MIN).} \textit{Lo mismo.} \\[1mm] \textbf{Cantidad (=CONTAR o CONTARA).} \textit{Lo mismo.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Mis 5 indicadores con interpretación». \textbf{Formato:} 5 fichas con fórmula + resultado + interpretación + indicador clave marcado con ★. \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} puedes defender en voz alta qué decisión propones tomar basado en los 5 indicadores.
  producto_titulo: 5 indicadores básicos calculados con fórmula + interpretación contextual
  criterios:
  - 5 fórmulas escritas con sintaxis correcta
  - 5 resultados verificados
  - 5 interpretaciones de 1 frase cada una
  - Cada interpretación está ligada a la pregunta original
  - Identifico el indicador más relevante para mi decisión
  - Tipos de datos verificados (numéricos donde corresponde)
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un promedio que no nombra a los extremos es un indicador que invisibiliza a las minorías.
    aplicacion: |-
      El promedio escolar de 6.2 puede esconder a 5 estudiantes con notas brillantes y a 5 al borde de reprobar. El promedio de ingresos de un país puede esconder enormes desigualdades. La phronesis del analista exige que el promedio nunca se reporte solo: siempre acompañarlo de MAX y MIN, y idealmente de la dispersión. Reportar promedio sin extremos es decisión política sutil que invisibiliza a quienes más necesitan visibilidad.
    pregunta_espejo: |-
      Cuando reporto un ``promedio del curso'' o ``promedio del barrio'', ¿estoy invisibilizando a quienes están abajo o arriba del centro? ¿Qué cambia si reporto también MAX y MIN?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La aritmética básica bien aplicada es virtud --- la aritmética compleja sin interpretación es ego.
    aplicacion: |-
      Es tentador aprender fórmulas complejas (SUMAR.SI, BUSCARV, INDICE-COINCIDIR) y olvidar que el 80~\% de las decisiones cotidianas se resuelve con las 5 básicas. La sabiduría estoica recomienda \emph{dominar lo básico antes de impresionar con lo complejo}. Quien aplica SUMA, PROMEDIO, MAX, MIN y CONTAR con criterio resuelve más problemas reales que quien deslumbra con fórmulas avanzadas mal aplicadas.
    pregunta_espejo: |-
      ¿Estoy invirtiendo en dominar bien las 5 básicas o saltando a fórmulas complejas que después aplico mal?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Las 5 fórmulas básicas son la infraestructura cognitiva mínima para decidir en la infoesfera de datos contemporánea.
    aplicacion: |-
      Cualquier persona adulta debería saber aplicar SUMA, PROMEDIO, MAX, MIN y CONTAR. Es alfabetización numérica básica del XXI. Quien no las domina depende de otros para interpretar tablas, lo cual es vulnerabilidad cívica: créditos, becas, salud --- todo se reporta con esas 5. Dominarlas es independencia cognitiva.
    pregunta_espejo: |-
      ¿Cuántas tablas y reportes leo a diario sin aplicar mentalmente estas 5 fórmulas? ¿Cuánto me pierdo por no entender los indicadores que rigen mi vida?
compromiso: |-
  \textbf{Para la próxima semana.} Aplica las 5 fórmulas a UNA tabla cotidiana fuera del aula: gastos del mes, calificaciones, hábitos de sueño, lo que sea. Documenta una decisión real que tomes basada en esos 5 indicadores. La phronesis no se queda en el aula --- se entrena en lo cotidiano.
web:
  resumen: |-
    Aplicas las 5 fórmulas básicas a tu propia tabla con interpretación contextual. El 80% de los cálculos cotidianos se resuelve con estas 5 — domínalas con criterio.
  subtema: Datos · Aritmética digital cotidiana
  pre_lectura:
    por_que_importa: |-
      Las 5 fórmulas básicas resuelven el 80% de los cálculos de tu vida cotidiana adulta: gastos, calificaciones, hábitos, salud. Dominarlas con criterio (no solo sintaxis) es alfabetización numérica fundamental.
    pregunta_detonante: |-
      Si tuvieras 20 calificaciones del curso, ¿cuál de las 5 fórmulas básicas te diría más rápido si hay alguien al borde de reprobar?
    activacion:
      titulo: El cálculo de la tendera
      descripcion: |-
        En 3 minutos: suma mentalmente 8 cifras de 2-3 dígitos que aparecen en una lista cualquiera (precios, edades, minutos). Cronómetrate. Después usa SUMA en una hoja de cálculo. Compara: ¿qué método fue más rápido y cuál más preciso?
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 2 limpiaste y tipaste tu tabla. Hoy le aplicas las primeras 5 fórmulas que el oficio digital del XXI exige.
      siguiente: En la sesión 4 aprenderás filtros y ordenamiento — preguntar a los datos con criterio.
  conceptos_clave:
    - termino: SUMA
      definicion: "Suma todos los valores numéricos de un rango. Sintaxis: =SUMA(B2:B20). Responde: ¿cuánto en total?"
      ejemplo: "=SUMA(B2:B20) en columna de minutos de TikTok diarios → total semanal o mensual de uso del curso."
      emoji: "➕"
    - termino: PROMEDIO
      definicion: |-
        Calcula el valor medio aritmético. Sintaxis: =PROMEDIO(B2:B20). Ignora celdas vacías (no las cuenta como 0). Responde: ¿cuánto típicamente?
      ejemplo: "=PROMEDIO(C2:C20) en columna de calificaciones → nota promedio del curso."
      emoji: "➗"
    - termino: MAX
      definicion: |-
        Devuelve el valor más alto del rango. Sintaxis: =MAX(D2:D20). Sirve también con fechas (devuelve la más reciente).
      ejemplo: "=MAX(D2:D20) en horas de sueño → identificas quién durmió más, posible caso a estudiar."
      emoji: "⬆️"
    - termino: MIN
      definicion: "Devuelve el valor más bajo del rango. Sintaxis: =MIN(D2:D20). Útil para detectar casos en riesgo."
      ejemplo: "=MIN(D2:D20) en horas de sueño → identificas quién durmió menos, atención prioritaria."
      emoji: "⬇️"
    - termino: CONTAR vs CONTARA
      definicion: |-
        CONTAR(rango) cuenta solo celdas con números. CONTARA(rango) cuenta cualquier celda no vacía. Distinguirlas evita conteos falsos.
      ejemplo: |-
        =CONTAR(E:E) cuenta cuántas filas tienen edad numérica. =CONTARA(A:A) cuenta cuántas filas tienen nombre (texto).
      emoji: "🔢"
    - termino: Interpretación contextual
      definicion: |-
        Cada resultado necesita una frase que diga qué significa para la decisión. Sin interpretación, el número es decoración.
      ejemplo: |-
        "PROMEDIO de minutos = 87, MAX = 240, MIN = 15. Hay alta dispersión. Decisión: hablar individualmente con el de 240 antes de tomar medida general."
      emoji: "💡"
  quiz:
    titulo: "✅ Verifica las 5 fórmulas básicas"
    instrucciones: |-
      5 preguntas para confirmar que aplicas las 5 fórmulas con criterio, no solo sintaxis. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: Para calcular el "típico" valor de una columna numérica, ¿qué fórmula uso?
        opciones:
          - =SUMA(rango)
          - =PROMEDIO(rango)
          - =MAX(rango)
          - =CONTAR(rango)
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. PROMEDIO da el valor medio. Cuidado: ignora celdas vacías pero NO ignora ceros, lo cual puede sesgar.
        feedback_incorrecto: |-
          PROMEDIO. SUMA da total, no típico. MAX da el más alto. PROMEDIO calcula el valor medio aritmético — el "típico".
      - enunciado: ¿Cuál es la diferencia entre CONTAR y CONTARA?
        opciones:
          - No hay diferencia
          - CONTAR cuenta solo celdas con números; CONTARA cuenta cualquier celda no vacía
          - CONTAR es más rápido
          - CONTARA solo funciona en Excel, no en Sheets
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Si quieres saber cuántas edades hay registradas (números): CONTAR. Si quieres saber cuántas filas tienen nombre (texto): CONTARA.
        feedback_incorrecto: |-
          CONTAR = solo números. CONTARA = cualquier celda con valor. Usar la incorrecta puede dar conteos engañosos.
      - enunciado: Aplicas =SUMA(B2) y devuelve solo un número. ¿Qué pasó?
        opciones:
          - Funcionó bien
          - Olvidaste el rango — SUMA(B2) suma solo una celda, no el rango
          - Es error de Excel
          - B2 está vacía
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Para sumar un rango necesitas =SUMA(B2:B20). Sin rango, SUMA "suma" un solo número (que es ese mismo número).
        feedback_incorrecto: |-
          Error de rango. =SUMA(B2) no suma nada — solo devuelve el valor de B2. Lo correcto: =SUMA(B2:B20) o =SUMA(B:B) para toda la columna.
      - enunciado: ¿Por qué reportar SOLO el promedio puede ser engañoso?
        opciones:
          - Porque es lento
          - Porque oculta los extremos (MAX y MIN) — alguien puede estar al borde sin que el promedio lo refleje
          - Porque es difícil de calcular
          - No es engañoso
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Promedio 6.2 con MAX 9.5 y MIN 2.0 cuenta una historia muy distinta a promedio 6.2 con MAX 6.5 y MIN 5.8. Reportar solo promedio invisibiliza extremos.
        feedback_incorrecto: |-
          El promedio sin MAX y MIN oculta dispersión. Siempre reportar al menos los 3: PROMEDIO + MAX + MIN da contexto justo del caso real.
      - enunciado: En el saber ancestral de la aritmética del oficio, ¿qué aplica a las fórmulas de hoy?
        opciones:
          - Nada — la tendera no usaba Excel
          - Que dominar las 5 operaciones básicas con criterio resuelve el 80% de problemas reales
          - Que se debe calcular a mano siempre
          - Que las fórmulas son innecesarias
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La tendera resolvía cuentas complejas con SUMA, PROMEDIO, MAX, MIN mentales. Tú lo haces con fórmulas — mismo oficio, distinto medio.
        feedback_incorrecto: |-
          Las 5 básicas resuelven el 80%. La tendera dominaba mentalmente lo que hoy Excel automatiza. Lo que cambia es la herramienta, no el oficio de calcular para decidir.
  post_lectura:
    transferencia: |-
      Esta semana, aplica las 5 fórmulas a UNA tabla cotidiana fuera del aula: gastos del mes, calificaciones, hábitos de sueño. Documenta una decisión real que tomes basada en esos 5 indicadores.
  cinco_dimensiones:
    personal: |-
      Adquiriste 5 herramientas que usarás toda tu vida adulta: gastos, hábitos, salud, finanzas — todo cabe en SUMA/PROMEDIO/MAX/MIN/CONTAR.
    emocional: |-
      Resististe la tentación de "ya sé lo básico, vamos a las fórmulas complejas". El dominio de lo básico es virtud invisible.
    ciudadana: |-
      Leer y aplicar indicadores básicos es alfabetización numérica democrática — defenderse de reportes mal hechos en medios y publicidad.
    local: |-
      Heredaste la aritmética mental del sastre, panadero, tendera. Lo que cambia es la herramienta, no la phronesis.
    intergeneracional: |-
      La tendera del barrio que sumaba 12 productos sin errar y tu Excel comparten oficio. Las 5 fórmulas básicas son el ábaco del XXI.

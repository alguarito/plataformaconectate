clave: 3-4
grado: 9
periodo: 3
sesion: 4
completo: true
titulo: Filtros y orden --- preguntar a los datos
titulo_portada: |-
  Filtros y orden ---
  preguntar a
  los datos
producto_final: 3 preguntas concretas respondidas con filtros sobre la tabla del estudiante, cada respuesta documentada con captura del filtro aplicado y la conclusión en 1 frase
apertura:
  saber_ancestral: |-
    El oficio del \textbf{archivero antiguo} --- el escribano que organizaba los papeles del pueblo en Cartago y en tantos municipios del Valle --- consistía en saber dónde buscar para responder rápido. Cuando una \textbf{abuela campesina} revisa su libreta de cosecha buscando \emph{``¿cuánto rendió la mata del año pasado en agosto?''}, está aplicando un filtro mental. Cuando la \textbf{tendera del barrio} ordena su cuaderno de fiados de mayor a menor para decidir a quién cobrar primero, está ordenando datos. Excel automatiza ese gesto antiguo: \emph{preguntar a un montón de papeles sin tener que leerlos todos}.
  origen: Archivero del pueblo, abuela campesina y tendera del barrio en el Valle del Cauca
  saber_contemporaneo: |-
    Filtrar y ordenar son las dos operaciones más usadas sobre una tabla. \texttt{Filtrar} oculta filas que no cumplen una condición (\emph{``solo agosto''}, \emph{``solo notas $\geq$ 7''}, \emph{``solo barrio La Macarena''}); \texttt{ordenar} reorganiza las filas por una columna (mayor a menor, A a Z, fecha más reciente). Toda tabla bien construida en Sesión 2 admite filtros porque tiene \textbf{encabezados claros} y \textbf{una observación por fila}. Filtrar y ordenar no modifican los datos: solo cambian qué ves.
  pregunta_puente: |-
    ¿Cómo hacía la abuela para encontrar en su libreta el rendimiento de agosto del año pasado sin tener filtros? ¿Y qué pierde un analista novato cuando aplica filtros sin haber escrito antes la pregunta que quiere responder?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 3 tipos de filtro (texto, número, fecha) y cuándo usar cada uno; (2) \textbf{aplicar} filtros y orden a tu tabla para responder preguntas reales; (3) \textbf{analizar} qué cambia entre la tabla completa y la tabla filtrada; (4) \textbf{explicar} con tus palabras qué conclusión sacas de cada filtro y por qué importa para tu decisión.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 3 te dio las 5 fórmulas básicas sobre toda la tabla; hoy aprendes a \emph{cortar la tabla} para que las fórmulas respondan preguntas más finas. SUMA de todo es una cosa; SUMA de agosto es otra. Filtros y orden son el cuchillo que afila la pregunta.
  a_escuta: |-
    Antes de teorizar, vas a buscar 3 respuestas en tu tabla \emph{a ojo}, sin filtros. Vas a anotar cuánto tardas y cuántos errores cometes. Ese contraste con la versión filtrada te muestra para qué sirven los filtros realmente.
  a_sistematizacion: |-
    Ya viste el contraste. Ahora vamos a entender la \textbf{anatomía} de un filtro bien aplicado: qué columna activa, qué condición usa, qué resultado deja visible, qué resultado oculta. También verás cómo combinar 2 filtros sin perderte.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: 3 preguntas escritas, 3 filtros aplicados, 3 capturas de pantalla, 3 conclusiones en 1 frase. Una respuesta por filtro, ligada a tu pregunta original de Sesión 1.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: una ficha por pregunta con la pregunta, el filtro escrito, el resultado y la conclusión. El criterio principal: que un compañero pueda \textbf{reproducir} tu filtro sin que tú estés presente.
  a_evaluacion: |-
    Antes de cerrar, mira los filtros desde las cinco dimensiones humanas. Filtrar bien es respetar la pregunta; filtrar mal es manipular sin querer.
  a_triangulo: |-
    Y para terminar, tres voces sobre filtrar y mirar. Dussel sobre los filtros que invisibilizan, Marco Aurelio sobre la disciplina de mirar solo lo pertinente, Floridi sobre los filtros como mediadores de toda decisión digital.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- A ojo vs filtro} (15 min · individual). Toma tu tabla de Sesión 2 (con las fórmulas de Sesión 3 ya aplicadas). Sin tocar filtros, responde a ojo: (1) ¿cuántas filas cumplen una condición numérica (ej. nota $\geq$ 7, gasto $>$ 20.000)?; (2) ¿cuántas filas tiene una categoría específica (ej. \emph{``9A''}, \emph{``transporte''}, \emph{``agosto''})?; (3) ¿cuál es la fila con el valor más alto en una columna? Cronometra cuánto te tomó y anota cuántas veces dudaste. Después aplica filtro/orden y compara: ¿qué método fue más rápido?, ¿qué método dio resultado correcto?
  checks:
  - Respondí las 3 preguntas a ojo y cronometré cada una.
  - Apliqué filtro u orden para verificar cada respuesta.
  - Comparé honestamente: cuál ganó en velocidad y cuál en precisión.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- A ojo vs filtro». \textbf{Formato:} tabla de 4 columnas (Pregunta~|~Respuesta a ojo~|~Respuesta con filtro~|~Tiempo a ojo), 3 filas. Al final 1 línea con quién ganó velocidad y quién ganó precisión. \textbf{Sabes que terminaste cuando} reconoces honestamente en qué situaciones el filtro es indispensable y en cuáles a ojo basta.
sistematizacion:
  intro: |-
    Filtrar y ordenar parecen lo mismo pero responden preguntas distintas. Vamos a descomponer cada operación con los pilares del pensamiento computacional para que sepas exactamente cuándo aplicar cuál.
  pilares:
  - |-
    Las operaciones se descomponen así: (1) \textbf{filtro de texto} (igual a, contiene, comienza por) responde \emph{``¿qué filas pertenecen a esta categoría?''}; (2) \textbf{filtro de número} ($>$, $<$, $\geq$, $\leq$, entre, los 10 mayores) responde \emph{``¿qué filas pasan este umbral?''}; (3) \textbf{filtro de fecha} (hoy, este mes, entre dos fechas) responde \emph{``¿qué filas caen en este periodo?''}; (4) \textbf{orden} (A-Z, mayor a menor, más reciente primero) no oculta filas, las \emph{reorganiza}.
  - |-
    Todo filtro sigue el patrón \textbf{``columna $\to$ condición $\to$ resultado''}: primero eliges la columna sobre la que vas a filtrar, después la condición que deben cumplir las filas, y por último observas qué queda. Si tu tabla está bien hecha (Sesión 2), cada columna admite un solo tipo de filtro: texto en columnas de texto, número en columnas de número, fecha en columnas de fecha. Mezclar tipos rompe el filtro.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué decisión voy a tomar con la tabla filtrada?}. Filtrar por agosto: decisión de planear el próximo agosto. Filtrar por barrio: decisión de distribución. Ordenar por gasto descendente: decisión de recorte. Sin decisión asociada, el filtro es solo pantalla bonita.
  - |-
    Algoritmo para aplicar un filtro: (1) escribe la pregunta en lenguaje natural; (2) identifica la columna; (3) elige el tipo de filtro; (4) aplica la condición; (5) cuenta cuántas filas quedaron y revisa que tengan sentido; (6) si combinas 2 filtros, aplica primero el que más reduce; (7) toma captura antes de quitar el filtro.
  anatomia:
    titulo: Anatomía de un filtro bien aplicado
    body: |-
      \textbf{Pregunta:} qué quieres responder en 1 frase. \\[1mm] \textbf{Columna:} sobre cuál se filtra. \\[1mm] \textbf{Condición:} igual / contiene / mayor que / entre fechas. \\[1mm] \textbf{Filas que quedan:} cuántas pasan el filtro. \\[1mm] \textbf{Conclusión:} 1 frase que conecta el resultado con la pregunta original. \\[1mm] \textbf{Captura:} imagen de la tabla filtrada antes de quitar el filtro.
  errores_comunes: |-
    (1) Filtrar sin tener pregunta escrita: terminas con tabla rara sin saber qué viste. (2) Olvidar quitar un filtro y aplicar SUMA o PROMEDIO encima: la fórmula calcula solo lo \emph{visible}, lo cual sesga. (3) Filtrar por texto buscando \emph{``Agosto''} cuando la celda dice \emph{``agosto''} con minúscula: distinto. (4) Ordenar una columna sin extender la selección a toda la tabla: rompe la correspondencia entre filas. (5) Reportar conclusión sin captura: la pregunta queda sin evidencia.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía de un filtro». \textbf{Formato:} 3 fichas, una por tipo de filtro (texto, número, fecha), cada una con: pregunta + columna + condición + filas que quedan + error frecuente. \textbf{Sabes que terminaste cuando} podrías escribir un filtro nuevo en cualquier tabla sin consultar.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- 3 preguntas, 3 filtros, 3 conclusiones} (30 min · individual). Hora de aplicar. Sobre tu tabla de Sesión 2, vas a redactar 3 preguntas concretas, aplicar el filtro u orden que las responde, capturar pantalla y escribir la conclusión de cada una en 1 frase.
  pilares:
  - |-
    Tu trabajo se descompone en 3 piezas, una por pregunta: (1) pregunta de texto (categoría), (2) pregunta de número (umbral), (3) pregunta de fecha o de orden (periodo o ranking). Variar los 3 tipos te obliga a usar el repertorio completo.
  - |-
    Sigue el patrón \textbf{``pregunta escrita antes que filtro aplicado''}: nunca filtres por curiosidad. Antes de cada filtro, escribe la pregunta en lenguaje natural. Ese hábito separa al analista del que solo \emph{``juega con la tabla''}.
  - |-
    Cada conclusión expresa una sola idea, no tres. Si tu filtro arroja 6 filas y dices \emph{``hay 6 casos, lo cual significa que el problema está concentrado pero también podría aumentar y además habría que mirar más adelante''}, divídelo o quédate con la frase más fuerte. La conclusión clara vence a la verbosa.
  - |-
    Algoritmo: (1) escribe pregunta; (2) elige columna; (3) elige tipo de filtro; (4) aplica; (5) toma captura; (6) escribe conclusión en 1 frase; (7) quita el filtro antes de pasar a la siguiente pregunta. Repite 3 veces.
  checklist:
    titulo: Checklist antes de cerrar las 3 preguntas
    items: |-
      \checkbox 3 preguntas escritas en lenguaje natural, antes del filtro. \\[1mm] \checkbox 3 filtros aplicados, uno de texto, uno de número, uno de fecha u orden. \\[1mm] \checkbox 3 capturas de pantalla con el filtro visible. \\[1mm] \checkbox 3 conclusiones de 1 frase cada una, ligadas a la pregunta original. \\[1mm] \checkbox Quité cada filtro antes de aplicar el siguiente para no sesgar fórmulas.
  plantilla_guion: |-
    \textbf{Pregunta 1 (texto).} \textit{Categoría que quieres aislar.} \\[1mm] \textbf{Filtro aplicado.} \textit{Columna + condición.} \\[1mm] \textbf{Conclusión.} \textit{1 frase.} \\[2mm] \textbf{Pregunta 2 (número).} \textit{Umbral que quieres revisar.} \\[1mm] \textbf{Filtro aplicado.} \textit{Columna + condición.} \\[1mm] \textbf{Conclusión.} \textit{1 frase.} \\[2mm] \textbf{Pregunta 3 (fecha u orden).} \textit{Periodo o ranking.} \\[1mm] \textbf{Filtro u orden aplicado.} \textit{Cómo.} \\[1mm] \textbf{Conclusión.} \textit{1 frase.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- 3 preguntas respondidas con filtro». \textbf{Formato:} 3 fichas con pregunta + filtro escrito + captura pegada o descrita + conclusión. \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} puedes defender en voz alta qué decisión propones tomar con base en cada filtro.
  producto_titulo: 3 preguntas respondidas con filtro + captura + conclusión
  criterios:
  - 3 preguntas escritas antes del filtro
  - 3 filtros aplicados, variedad de tipos (texto, número, fecha u orden)
  - 3 capturas que muestran el filtro activo
  - 3 conclusiones de 1 frase, ligadas a la pregunta original
  - Un compañero podría reproducir cada filtro sin que tú estés presente
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Todo filtro decide quién se ve y quién queda fuera de la conversación.
    aplicacion: |-
      Cuando filtras por \emph{``solo notas $\geq$ 7''} para hacer un reporte de éxito, los reprobados desaparecen de la pantalla --- y suelen también desaparecer de la decisión. Cuando un banco filtra solicitudes por \emph{``ingresos $>$ X''}, los del filtro hacia abajo dejan de existir para esa política. Filtrar no es neutro: es un gesto político. La phronesis del analista exige declarar siempre \emph{qué quedó por fuera} del filtro y por qué eso importa.
    pregunta_espejo: |-
      Cuando filtro mi tabla para reportar solo lo bueno, ¿estoy ocultando a quienes más necesitarían atención? ¿Qué pasaría si reportara también lo que el filtro deja afuera?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La disciplina de mirar es la disciplina de soltar lo que no responde a la pregunta.
    aplicacion: |-
      Es tentador filtrar por todo y mirar todo \emph{``por si acaso encuentro algo''}. La sabiduría estoica recomienda lo contrario: \emph{primero pregunta, después filtra}. Quien filtra sin pregunta se pierde; quien filtra con pregunta entrena el músculo de mirar solo lo pertinente. Esa disciplina ahorra horas y evita conclusiones inventadas.
    pregunta_espejo: |-
      ¿Filtré con una pregunta clara o filtré por curiosidad? ¿Qué pregunta nueva nació del filtro?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Los filtros son los mediadores invisibles de toda decisión digital contemporánea.
    aplicacion: |-
      Cada vez que un buscador, una red social o una plataforma educativa te muestra resultados, hay un filtro detrás. Quien no comprende filtros depende de los filtros que otros diseñan: lee lo que el algoritmo elige, decide con lo que el algoritmo no oculta. Dominar filtros en tu propia tabla es el primer paso para entender los filtros que rigen tu vida digital.
    pregunta_espejo: |-
      ¿Cuántas pantallas miré hoy sin preguntar qué filtro había detrás? ¿Qué información me pierdo por no ver lo que el filtro deja afuera?
compromiso: |-
  \textbf{Para la próxima semana.} Aplica un filtro real a UNA tabla cotidiana fuera del aula: gastos del mes filtrados por categoría, calificaciones filtradas por área, hábitos filtrados por día de semana. Documenta una conclusión real y \textbf{lo que el filtro dejó afuera}. La phronesis no se entrena solo eligiendo qué mirar, también eligiendo qué no esconder.
web:
  resumen: |-
    Filtrar y ordenar son el cuchillo que afila la pregunta sobre una tabla. Aprendes a aplicar filtros de texto, número y fecha, y a ordenar resultados, para responder 3 preguntas reales con captura y conclusión.
  subtema: Datos · Preguntar a la tabla
  pre_lectura:
    por_que_importa: |-
      Filtrar y ordenar son las dos operaciones más usadas sobre cualquier tabla. La diferencia entre alguien que mira la tabla y alguien que la interroga está en saber escribir una pregunta antes de aplicar un filtro.
    pregunta_detonante: |-
      Si tu tabla tiene 80 filas, ¿cómo aíslas en 2 clics las 6 que cumplen una condición específica sin leer las 80?
    activacion:
      titulo: A ojo no se puede
      descripcion: |-
        En 3 minutos: el docente proyecta una tabla de 30 filas y pregunta "¿cuántas filas cumplen X?". Los estudiantes responden a ojo y luego se aplica el filtro. El contraste muestra para qué sirven los filtros realmente.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 3 aplicaste las 5 fórmulas básicas sobre toda la tabla. Hoy aprendes a cortar la tabla para que las fórmulas respondan preguntas más finas.
      siguiente: |-
        En la sesión 5 verás tablas dinámicas — re-agrupar la tabla para comparar promedios y totales por categoría.
  conceptos_clave:
    - termino: Filtro de texto
      definicion: |-
        Oculta filas que no coinciden con un valor de texto (igual, contiene, comienza por). Ideal para aislar una categoría.
      ejemplo: "Columna Curso: filtro \"igual a 9A\" deja solo las filas del 9A."
      emoji: "🔤"
    - termino: Filtro de número
      definicion: |-
        Oculta filas que no cumplen un umbral numérico (mayor, menor, entre, los 10 mayores). Ideal para identificar casos sobre/bajo el umbral.
      ejemplo: "Columna Gasto: filtro \"mayor que 20000\" deja solo los gastos relevantes."
      emoji: "🔢"
    - termino: Filtro de fecha
      definicion: Oculta filas fuera de un periodo (hoy, este mes, entre dos fechas). Ideal para preguntas temporales.
      ejemplo: "Columna Fecha: filtro \"este mes\" muestra solo las filas del mes en curso."
      emoji: "📅"
    - termino: Orden (A-Z, 0-9, fecha)
      definicion: No oculta filas, las reorganiza. Útil para rankings o priorización por valor o fecha.
      ejemplo: Ordenar la columna Gasto descendente para ver los 3 gastos más altos arriba.
      emoji: "↕️"
    - termino: Captura del filtro
      definicion: |-
        La conclusión sin captura es opinión. Toma siempre la imagen con el filtro visible antes de quitarlo, para tener evidencia.
      ejemplo: "\"Filtro Curso=9A + Gasto>20000 → 6 filas. Captura: pantallazo_9A_gastos.png\"."
      emoji: "📸"
    - termino: Conclusión en 1 frase
      definicion: |-
        Cada filtro responde una pregunta; la respuesta cabe en una frase corta ligada a la decisión que viene después.
      ejemplo: |-
        "6 estudiantes de 9A gastaron más de 20.000 en transporte — vale revisar si la ruta del barrio Macarena está fallando."
      emoji: "💡"
  quiz:
    titulo: "✅ Verifica filtros y orden"
    instrucciones: 5 preguntas para confirmar que aplicas filtros con criterio. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: Aplicaste un filtro y luego una SUMA sobre la columna filtrada. ¿Qué calcula la SUMA?
        opciones:
          - Suma toda la columna como si no hubiera filtro
          - Suma solo las filas visibles (las que pasaron el filtro)
          - Devuelve error
          - Depende de la versión de Excel
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. SUMA con filtro activo opera sobre filas visibles. Si olvidas quitar un filtro y aplicas SUMA, el resultado puede sesgarse sin que lo notes.
        feedback_incorrecto: |-
          SUMA respeta el filtro: solo cuenta las filas visibles. Por eso es vital quitar filtros antes de aplicar fórmulas que deben mirar toda la tabla.
      - enunciado: Tu filtro de texto busca "Agosto" pero las celdas dicen "agosto" en minúscula. ¿Qué pasa?
        opciones:
          - Funciona igual, no distingue mayúsculas
          - No encuentra ninguna fila — el filtro es sensible al texto exacto
          - Devuelve error
          - Se aplica solo a las mayúsculas
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El filtro de texto requiere coincidencia exacta. Por eso la higiene de datos (Sesión 2) importa antes de filtrar.
        feedback_incorrecto: |-
          El filtro de texto distingue mayúsculas o requiere coincidencia exacta. Limpia los datos antes de filtrar para evitar sorpresas.
      - enunciado: ¿Cuál es la diferencia entre filtrar y ordenar?
        opciones:
          - Ninguna, son lo mismo
          - Filtrar oculta filas; ordenar las reorganiza sin ocultar
          - Ordenar es más lento
          - Filtrar solo funciona con números
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Filtrar oculta lo que no cumple la condición. Ordenar conserva todo pero cambia el orden de aparición.
        feedback_incorrecto: |-
          Filtrar oculta. Ordenar reorganiza. Son operaciones distintas — un filtro reduce la vista; un orden la prioriza.
      - enunciado: ¿Por qué escribir la pregunta antes de aplicar el filtro?
        opciones:
          - Por costumbre académica
          - Porque sin pregunta, terminas con tabla rara sin saber qué viste
          - Porque Excel lo exige
          - No es necesario
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Filtrar sin pregunta produce "tablas bonitas sin conclusión". La pregunta separa al analista del que juega con la tabla.
        feedback_incorrecto: |-
          Sin pregunta escrita, el filtro es decoración. La disciplina de escribir la pregunta antes garantiza que el filtro sirva a una decisión.
      - enunciado: En el saber ancestral del archivero, ¿qué aplica a los filtros de hoy?
        opciones:
          - Nada, son tecnologías distintas
          - Que saber dónde buscar respuesta sin leer todo es oficio antiguo — Excel automatiza el gesto
          - Que los archiveros usaban Excel
          - Que filtrar es una invención reciente
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. El archivero, la abuela, la tendera filtraban mentalmente. La herramienta cambia, el oficio sigue.
        feedback_incorrecto: |-
          El filtro es un gesto humano antiguo. Lo que cambia es la velocidad, no la pregunta detrás del filtro.
  post_lectura:
    transferencia: |-
      Esta semana, aplica un filtro real a UNA tabla cotidiana fuera del aula: gastos por categoría, calificaciones por área, hábitos por día. Documenta la conclusión y lo que el filtro dejó afuera.
  cinco_dimensiones:
    personal: |-
      Cada vez que buscas algo en tu correo, tu galería, tu chat, aplicas filtros. Dominarlos te hace dueño de tus archivos en lugar de víctima del scroll infinito.
    emocional: |-
      Resististe la tentación de filtrar por todo "a ver qué encuentro". La pregunta antes del filtro entrena disciplina cognitiva.
    ciudadana: |-
      Los algoritmos que rigen tu feed son filtros. Quien comprende filtros propios entiende mejor los que otros aplican sobre la información que recibe.
    local: |-
      El archivero del pueblo, la abuela de la libreta, la tendera del cuaderno: filtrar es oficio del Valle hecho con papel. Hoy lo automatizas.
    intergeneracional: |-
      Tus abuelos filtraban mentalmente; tus padres con marcadores y resaltadores; tú con dos clics. Misma phronesis, distinto medio.

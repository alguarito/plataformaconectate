titulo: Filtros y orden --- preguntar a los datos
producto_final: |-
  3 preguntas concretas respondidas con filtros sobre la tabla del estudiante, cada respuesta documentada con captura del filtro aplicado y la conclusión en 1 frase
saber_ancestral_idea: |-
  El oficio del archivero antiguo --- el escribano que organizaba los papeles del pueblo --- consistía en saber dónde buscar para responder rápido. Cuando una abuela revisa su libreta de cosecha buscando "¿cuánto rendió la mata del año pasado en agosto?", está aplicando un filtro mental. Excel automatiza ese gesto.
verbos_actividades:
- IDENTIFICA
- APLICA

clave: 3-4
grado: 9
periodo: 3
sesion: 4
completo: true
duracion_min: 90
titulo: Filtros y orden --- preguntar a los datos
titulo_portada: |-
  Filtros y orden ---
  preguntarle
  a la tabla
producto_final: |-
  Tres preguntas concretas respondidas con filtros sobre tu tabla. Cada una lleva la pregunta escrita antes de tocar nada, la captura donde se vea el filtro activo y la conclusión en una frase ligada a esa pregunta. Los tres filtros son de tipos distintos: texto, número, fecha u ordenamiento. Un compañero podría reproducirlos sin que tú estés al lado.
apertura:
  origen: Paisanaje y colonias en Cali · identificarse por el río del que se viene
  fuente: |-
    Urrea-Giraldo, F., Botero, W. F. A., \& Hernández Quiceno, N. A. (2018). \emph{Cali y su relación con el Pacífico en el proceso de patrimonialización de saberes, prácticas y objetos}. Organización Internacional para las Migraciones.
  saber_ancestral: |-
    Desde los años setenta, familias enteras del Chocó, de Buenaventura, de Guapi, Timbiquí y Tumaco bajaron a Cali. Hoy la región de Cali, el sur del Valle, el norte del Cauca y Buenaventura concentra alrededor de 1,5 millones de personas afrodescendientes. Es la mayor concentración del país. Al llegar no se llegaba solo: funcionaba el \textbf{paisanaje}, es decir, el que ya estaba recibía al que venía del mismo río. Así se formaron las colonias: la guapireña, la timbiqueña, la bonaverense, la chocoana. Fíjate en el detalle que importa hoy. En el Pacífico las personas no se presentan por ciudad, sino por el río del que vienen. Ese río funciona como un identificador de origen: agrupa, conecta y decide quién te recibe al llegar. La \textbf{cara de exclusión}: el asentamiento quedó espacialmente segregado en el oriente de Cali, y la migración se aceleró con la privatización portuaria de Buenaventura.
  saber_contemporaneo: |-
    Filtrar es preguntarle a la tabla por una parte de ella. Hay cuatro operaciones y cada una responde una pregunta distinta. \textbf{Filtro de texto} (igual a, contiene, empieza por): qué filas pertenecen a esta categoría. \textbf{Filtro numérico} (mayor que, menor que, entre): qué filas pasan de este umbral. \textbf{Filtro de fecha}: qué pasó en este periodo. \textbf{Ordenamiento}: cuáles están arriba y cuáles abajo según un criterio. Todas siguen la misma secuencia: primero eliges la columna, después la condición y solo entonces miras el resultado. Y hay una regla que evita perder la tarde: la pregunta se escribe antes de tocar el filtro. Si filtras primero y buscas después qué encontraste, siempre vas a encontrar algo, y ese algo casi nunca responde nada. Filtrar no cambia los datos: cambia lo que estás mirando.
  pregunta_puente: |-
    En el Pacífico el río del que vienes agrupa y conecta antes de que digas nada más. En tu tabla, ¿qué columna funciona como ese río?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} cuánto se desvía tu respuesta a ojo de la que da un filtro; (2) \textbf{explicar} las cuatro operaciones y la secuencia columna, condición y resultado; (3) \textbf{aplicar} tres filtros de tipos distintos para responder tres preguntas escritas de antemano.
puentes:
  a_ruta: |-
    En la sesión 3 le hiciste a tu tabla las cinco preguntas básicas, que miran todo el conjunto. Hoy aprendes a preguntarle solo por una parte. En la sesión 5 agrupas y comparas con tablas dinámicas.
  a_escuta: |-
    Antes de la teoría vas a responder a ojo y después con filtro. La diferencia entre las dos respuestas es lo que enseña la sesión.
  a_sistematizacion: |-
    Ya viste dónde te equivocas mirando. Ahora vas a ordenar las cuatro operaciones y a fijar la secuencia que evita perder tiempo.
  a_praxis: |-
    Tienes el método. Toca escribir tres preguntas de verdad y responderlas con el filtro que corresponda a cada una.
  a_producto: |-
    Lo que entregas hoy: tres preguntas, tres filtros y tres conclusiones. La prueba de calidad: la pregunta está escrita antes que el filtro, y se nota.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Filtrar es decidir qué miras, y decidir qué miras es ya media respuesta.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre agrupar y mirar: Dussel sobre la cultura popular que conoce a los suyos, Marco Aurelio sobre mirar las cosas como son, Floridi sobre saber preguntar.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- A ojo y con filtro} (15 min · individual). (1) Abre tu tabla, ya con las fórmulas de la sesión 3. (2) Sin tocar nada, responde a ojo: cuántas filas pasan de cierto valor, cuántas pertenecen a una categoría y cuál es la más antigua. (3) Anota las tres respuestas y cuánto tardaste. (4) Responde ahora las tres con filtro y anota los resultados. (5) Marca en cuál te equivocaste más y escribe por qué crees que fue ahí.
  checks:
  - Tengo las tres respuestas a ojo y las tres con filtro.
  - Marqué en cuál me equivoqué más.
  - Escribí por qué creo que fue en esa y no en otra.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- A ojo y con filtro». \textbf{Formato:} tabla de 3 filas y 3 columnas (pregunta / respuesta a ojo / respuesta con filtro), con marca en la mayor diferencia. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} tienes escrito por qué fallaste justo en esa.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Las cuatro operaciones} (20 min · parejas). (1) Con tu pareja, escriban las cuatro operaciones con la pregunta que responde cada una. (2) Escriban la secuencia de tres pasos que siguen todas. (3) Tomen tres preguntas de sus tablas y digan qué operación necesita cada una. (4) Busquen una pregunta que necesite dos filtros a la vez y escríbanla completa.
  pilares:
  - |-
    \textbf{Las cuatro operaciones.} Texto: qué filas pertenecen a esta categoría. Número: qué filas pasan de este umbral. Fecha: qué pasó en este periodo. Ordenamiento: cuáles quedan arriba según un criterio.
  - |-
    \textbf{Columna, condición, resultado.} Siempre en ese orden. Primero eliges sobre qué columna vas a filtrar, después qué condición aplicas y solo entonces miras qué quedó. Saltarse el primer paso es la fuente más común de confusión.
  - |-
    \textbf{La pregunta se escribe antes.} Si filtras primero y buscas después qué encontraste, siempre encuentras algo, y ese algo casi nunca responde nada. Escribir la pregunta cuesta un minuto y ahorra media hora.
  - |-
    \textbf{Filtrar no borra.} Cambia lo que estás mirando, no los datos. Conviene saberlo: mucha gente cree que perdió filas cuando lo único que pasó es que el filtro sigue activo.
  anatomia:
    titulo: Las cuatro operaciones
    body: |-
      \textbf{Texto:} ¿qué filas son de esta categoría? \\[1mm] \textbf{Número:} ¿cuáles pasan de este umbral? \\[1mm] \textbf{Fecha:} ¿qué pasó en este periodo? \\[1mm] \textbf{Orden:} ¿cuáles quedan arriba? \\[1mm] \textbf{Secuencia:} columna → condición → resultado.
  errores_comunes: |-
    (1) \textbf{Filtrar antes de tener la pregunta}: se encuentra algo y no responde nada. (2) \textbf{Dejar un filtro activo y creer que se borraron filas}: filtrar no borra, oculta. (3) \textbf{Ordenar solo una columna}: si el programa no arrastra las demás, la tabla queda destrozada. (4) \textbf{Filtrar texto con mayúsculas y tildes inconsistentes}: quedan fuera filas que sí pertenecían. (5) \textbf{No anotar la condición usada}: al día siguiente nadie puede reproducir el resultado.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Las cuatro operaciones». \textbf{Formato:} las cuatro con su pregunta, la secuencia de tres pasos, las tres preguntas con su operación y la pregunta que necesita dos filtros. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} está escrita la pregunta que necesita dos filtros a la vez.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Tres preguntas, tres filtros} (30 min · individual). (1) Escribe tus tres preguntas antes de tocar la hoja, cada una en una frase. (2) Comprueba que las tres necesiten operaciones distintas. (3) Aplica el filtro que corresponde a cada una y anota la condición exacta que usaste. (4) Captura la pantalla con el filtro activo, de modo que se vea la condición. (5) Escribe la conclusión de cada una en una frase que responda la pregunta original. (6) Pásale las condiciones a un compañero y comprueba si llega a tus mismos resultados.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres bloques.} Pregunta, captura con el filtro activo y conclusión. Los tres, tres veces.
  - |-
    \textbf{Las tres preguntas piden operaciones distintas.} Tres filtros de texto son el mismo ejercicio tres veces. La consigna pide variar: una de categoría, una de umbral y una de tiempo o de orden.
  - |-
    \textbf{Anota la condición exacta.} «Filtré por fecha» no se puede reproducir. «Fecha entre el 1 y el 31 de agosto» sí, y esa es la diferencia entre un resultado y un resultado comprobable.
  - |-
    \textbf{La conclusión responde a la pregunta.} Si tu pregunta era cuántas filas pasan de siete horas y tu conclusión habla de otra cosa, algo se torció en el camino. Vuelve a leer la pregunta antes de escribir la conclusión.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tres preguntas escritas antes de tocar la hoja. \\[1mm] \checkbox Las tres necesitan operaciones distintas. \\[1mm] \checkbox Condición exacta anotada en cada filtro. \\[1mm] \checkbox Tres capturas donde se vea el filtro activo. \\[1mm] \checkbox Tres conclusiones de una frase, ligadas a su pregunta. \\[1mm] \checkbox Un compañero llegó a los mismos resultados con tus condiciones.
  plantilla_guion: |-
    \textbf{Pregunta.} \textit{Escrita antes, en una frase.} \\[1mm] \textbf{Columna.} \textit{Sobre cuál filtro.} \\[1mm] \textbf{Condición.} \textit{Exacta, reproducible.} \\[1mm] \textbf{Resultado.} \textit{Cuántas filas quedaron.} \\[1mm] \textbf{Conclusión.} \textit{Una frase que responda la pregunta.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} \textbf{Título:} «Actividad 3 --- Tres preguntas, tres filtros». \textbf{Formato:} las tres preguntas con su columna, su condición exacta, su resultado y su conclusión, más la nota de si tu compañero llegó a lo mismo. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} un compañero reprodujo tus tres resultados con tus condiciones.
  producto_titulo: Tres preguntas respondidas con filtros distintos, con condición reproducible
  criterios:
  - Las tres preguntas están escritas antes de aplicar ningún filtro
  - Los tres filtros son de tipos distintos, no tres veces el mismo
  - Cada uno anota la condición exacta que se usó
  - Hay tres capturas donde se ve el filtro activo
  - Un compañero reprodujo los tres resultados con esas condiciones
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §3.3.8.3
    cita: |-
      Dicha cultura posee los símbolos, los valores, los usos, las tradiciones de sabiduría, la memoria de compromisos históricos; conoce sus enemigos, sus amigos, sus aliados.
    aplicacion: |-
      Una colonia sabe quién es de su río y quién no, y eso decide quién recibe a quién. Filtrar es esa operación hecha con una columna: separar lo que pertenece de lo que no, y saber por qué se separó.
    pregunta_espejo: |-
      ¿Qué columna de mi tabla decide quién queda dentro, y quién eligió ese criterio?
  estoico:
    autor: Marco Aurelio · Meditaciones IV, 11 (c. 175 d.C.)
    cita: |-
      No te formes de las cosas la opinión que tiene quien te agravia, ni la que él querría que tuvieras; míralas como son en verdad. (trad. propia)
    aplicacion: |-
      Responder a ojo es formarse una opinión antes de mirar. El filtro obliga a mirar. Casi siempre la diferencia entre las dos respuestas no es enorme, pero es suficiente para cambiar una decisión.
    pregunta_espejo: |-
      ¿Qué doy por sabido de mis datos sin haberlo comprobado nunca?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    cita: |-
      La partida la ganarán quienes «sepan preguntar y responder» (Platón, Crátilo 390c) y, por tanto, sepan qué datos pueden ser útiles y relevantes, y merecen recogerse y cuidarse. (trad. propia)
    aplicacion: |-
      Por eso la pregunta se escribe antes que el filtro. Cualquiera puede aplicar veinte filtros en un minuto; lo que escasea es saber cuál de los veinte respondía algo que valía la pena preguntar.
    pregunta_espejo: |-
      De mis tres preguntas, ¿cuál se me ocurrió antes de abrir la hoja?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con las tres preguntas, sus condiciones y sus conclusiones. Intercambia condiciones con un compañero y comprueba si llegan a lo mismo. En la sesión 5 agrupas y comparas con tablas dinámicas.
web:
  resumen: |-
    En el Pacífico las personas no se presentan por ciudad sino por el río del que vienen, y ese río agrupa, conecta y decide quién te recibe al llegar a Cali. Filtrar es eso hecho con una columna. Hoy le preguntas a tu tabla por una parte de ella, con la pregunta escrita antes de tocar el filtro.
  subtema: Datos · Preguntar a la tabla
  pre_lectura:
    por_que_importa: |-
      Si filtras primero y buscas después qué encontraste, siempre encuentras algo. Y ese algo casi nunca responde nada.
    pregunta_detonante: |-
      ¿Qué pregunta te gustaría hacerle a tus datos, si pudieras hacerle solo una?
    activacion:
      titulo: A ojo
      descripcion: |-
        En 2 minutos, mira tu tabla y calcula a ojo cuántas filas cumplen una condición. Anota el número; después lo vas a comprobar.
      duracion_min: 3
    conexion:
      anterior: En la sesión 3 calculaste los cinco indicadores básicos sobre toda la tabla.
      siguiente: En la sesión 5 agrupas y comparas categorías con tablas dinámicas.
  mapa_ruta:
    - numero: 1
      iconos: ["🌱"]
      titulo: El río del que se viene
      duracion_min: 10
    - numero: 2
      iconos: ["👁"]
      titulo: Actividad 1 · A ojo y con filtro
      duracion_min: 15
    - numero: 3
      iconos: ["📖"]
      titulo: Actividad 2 · Las cuatro operaciones
      duracion_min: 20
    - numero: 4
      iconos: ["✏️"]
      titulo: Actividad 3 · Tres preguntas, tres filtros
      duracion_min: 30
    - numero: 5
      iconos: ["✅", "💭"]
      titulo: Verifica, tres citas y tu compromiso
      duracion_min: 15
  actividades:
    - numero: 1
      verbo: IDENTIFICA
      titulo: A ojo y con filtro
      tiempo_min: 15
      modalidad: individual
      pasos:
        - Abre tu tabla con las fórmulas de la sesión 3 ya aplicadas.
        - Sin tocar nada, responde a ojo tres preguntas sobre cantidad, categoría y fecha.
        - Anota las tres respuestas y cuánto tardaste.
        - Responde las tres con filtro y anota los resultados.
        - Marca en cuál te equivocaste más y escribe por qué crees que fue ahí.
      cuaderno:
        titulo: A ojo y con filtro
        formato: tabla de 3 filas y 3 columnas (pregunta / respuesta a ojo / respuesta con filtro)
        extension: un tercio de página
      criterios:
        - Están las tres respuestas de las dos maneras.
        - Está escrito por qué falló justo esa.
    - numero: 2
      verbo: EXPLICA
      titulo: Las cuatro operaciones
      tiempo_min: 20
      modalidad: parejas
      pasos:
        - Con tu pareja, escriban las cuatro operaciones con la pregunta que responde cada una.
        - Escriban la secuencia de tres pasos que siguen todas.
        - Tomen tres preguntas de sus tablas y digan qué operación necesita cada una.
        - Busquen una pregunta que necesite dos filtros a la vez y escríbanla completa.
      cuaderno:
        titulo: Las cuatro operaciones
        formato: las cuatro con su pregunta, la secuencia de tres pasos y la pregunta que necesita dos filtros
        extension: media página
      criterios:
        - Está escrita la pregunta que necesita dos filtros a la vez.
        - Cada operación tiene su pregunta en lenguaje corriente.
    - numero: 3
      verbo: APLICA
      titulo: Tres preguntas, tres filtros
      tiempo_min: 30
      modalidad: individual
      pasos:
        - Escribe tus tres preguntas antes de tocar la hoja, cada una en una frase.
        - Comprueba que las tres necesiten operaciones distintas.
        - Aplica el filtro de cada una y anota la condición exacta que usaste.
        - Captura la pantalla con el filtro activo, de modo que se vea la condición.
        - Escribe la conclusión de cada una en una frase que responda la pregunta original.
      cuaderno:
        titulo: Tres preguntas, tres filtros
        formato: las tres preguntas con su columna, condición exacta, resultado y conclusión
        extension: media página
      criterios:
        - Los tres filtros son de tipos distintos.
        - Un compañero reprodujo los tres resultados con esas condiciones.
  conceptos_clave:
    - categoria: Las cuatro operaciones
      termino: Filtro de texto
      definicion: |-
        Responde qué filas pertenecen a una categoría. Es sensible a mayúsculas y tildes inconsistentes.
      ejemplo: Si «Guapi» y «guapi» conviven en la columna, el filtro deja fuera filas que sí pertenecían.
    - categoria: Las cuatro operaciones
      termino: Filtro numérico
      definicion: Responde qué filas pasan de un umbral, o quedan entre dos valores.
      ejemplo: «Más de siete horas» separa a quienes conviene mirar de cerca.
    - categoria: Cómo se hace
      termino: Columna, condición, resultado
      definicion: |-
        La secuencia de todo filtro. Saltarse el primer paso es la fuente más común de confusión.
      ejemplo: Elegir la condición sin haber decidido la columna lleva a filtrar la tabla equivocada.
    - categoria: Cómo se hace
      termino: Condición reproducible
      definicion: La condición escrita con precisión suficiente para que otro llegue al mismo resultado.
      ejemplo: «Filtré por fecha» no sirve. «Fecha entre el 1 y el 31 de agosto» sí.
    - categoria: Qué hace y qué no
      termino: Filtrar no borra
      definicion: |-
        Cambia lo que estás mirando, no los datos. Las filas siguen ahí, ocultas mientras el filtro esté activo.
      ejemplo: Mucha gente cree que perdió filas cuando lo único que pasó es que dejó el filtro puesto.
  cinco_dimensiones:
    personal: Comprobaste cuánto te equivocas respondiendo a ojo, que es un dato sobre ti y no sobre la tabla.
    emocional: Escribir la pregunta antes obliga a saber qué quieres, y eso cuesta más que aplicar el filtro.
    ciudadana: Un criterio de agrupación decide quién queda dentro de un conteo. Conviene saber quién lo eligió.
    local: En el Pacífico el río del que vienes agrupa y conecta, y en Cali eso decidía quién te recibía.
    intergeneracional: Las colonias funcionaron como una red de acogida antes de que existiera la palabra «red».
  post_lectura:
    reflexion: |-
      De tus tres preguntas, ¿cuál te dio una respuesta distinta de la que esperabas, y qué hiciste con eso?
    transferencia: |-
      Intercambia tus condiciones con un compañero y comprueba si llega a los mismos resultados. Si no, falta precisión.
    cierre: "Filtrar no cambia los datos: cambia lo que estás mirando. Y decidir qué miras es ya media respuesta."
  quiz:
    titulo: ¿Sabes preguntarle a una tabla por una parte?
    instrucciones: Cinco preguntas sobre las cuatro operaciones y la secuencia. No va al cuaderno.
    preguntas:
      - enunciado: ¿Por qué se escribe la pregunta antes de aplicar el filtro?
        opciones:
          - Porque el programa exige nombrar el filtro antes de crearlo.
          - Porque si filtras primero, siempre encuentras algo que no responde nada.
          - Porque así se puede compartir la hoja con otras personas.
          - Porque los filtros se aplican en el orden en que se escriben.
        respuesta_index: 1
        feedback_correcto: Sí. Escribir la pregunta cuesta un minuto y ahorra media hora.
        feedback_incorrecto: Porque filtrar sin pregunta siempre encuentra algo, y ese algo casi nunca responde nada.
      - enunciado: Aplicaste un filtro y ahora ves menos filas. ¿Qué pasó con las demás?
        opciones:
          - Siguen ahí, ocultas mientras el filtro esté activo.
          - Se movieron al final de la tabla, después de las visibles.
          - Se eliminaron, y hay que deshacer para recuperarlas.
          - Se copiaron a una hoja nueva creada por el programa.
        respuesta_index: 0
        feedback_correcto: "Correcto. Filtrar no borra: cambia lo que estás mirando."
        feedback_incorrecto: Siguen ahí, ocultas. Filtrar cambia la vista, no los datos.
      - enunciado: ¿Cuál es la secuencia de toda operación de filtro?
        opciones:
          - Resultado, condición y después columna.
          - Condición, resultado y por último columna.
          - Columna, condición y después resultado.
          - Columna, resultado y por último condición.
        respuesta_index: 2
        feedback_correcto: Eso es. Saltarse el primer paso es la fuente más común de confusión.
        feedback_incorrecto: Columna, condición, resultado. Primero se decide sobre qué se filtra.
      - enunciado: ¿Qué significa el paisanaje en la llegada a Cali desde el Pacífico?
        opciones:
          - Que las familias viajaban siempre en grupos numerosos.
          - Que el que ya estaba recibía al que venía del mismo río.
          - Que las colonias se organizaban por barrios de destino.
          - Que existía un registro oficial de quienes llegaban.
        respuesta_index: 1
        feedback_correcto: Sí, y por eso las personas se presentan por el río del que vienen y no por la ciudad.
        feedback_incorrecto: Que el que ya estaba recibía al que venía del mismo río. Así se formaron las colonias.
      - enunciado: Anotaste «filtré por fecha». ¿Qué problema tiene?
        opciones:
          - Que las fechas deben filtrarse siempre por rango completo.
          - Que conviene ordenar antes de filtrar por una fecha.
          - Que el tipo de dato de la columna podría no ser fecha.
          - "Que no se puede reproducir: falta la condición exacta."
        respuesta_index: 3
        feedback_correcto: Correcto. «Fecha entre el 1 y el 31 de agosto» sí se puede reproducir.
        feedback_incorrecto: Que nadie puede reproducirlo. Sin la condición exacta, el resultado no se puede comprobar.

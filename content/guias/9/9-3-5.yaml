clave: 3-5
grado: 9
periodo: 3
sesion: 5
completo: true
duracion_min: 90
titulo: Tablas dinámicas --- agrupar y comparar
titulo_portada: |-
  Tablas dinámicas ---
  agrupar y
  comparar
producto_final: 1 tabla dinámica que responda una pregunta agrupando los datos, con captura y conclusión de 3 renglones
apertura:
  saber_ancestral: |-
    En el Eje Cafetero, la palabra «cuadrilla» nombra dos grupos que no se parecen en nada. Uno es el de los recolectores que entran al cafetal detrás de un patrón de corte. El patrón marca los surcos con una bandera y reparte el trabajo (Saldarriaga Ramírez, 2024). Ahí se pertenece mientras dure la cosecha. Y a la gente se la agrupa por de dónde viene: paisa, tolimense, pastuso. El otro son las Cuadrillas del Carnaval de Riosucio. Doce a quince personas trabajan un año entero en una letra, una música y un disfraz (Ministerio de Cultura, 2011). Ninguna de las tres cosas se puede repetir nunca más. Las dos cuadrillas dan pertenencia. Pero una la da mientras uno sirva, y la otra mientras uno cree. La \textbf{cara de exclusión} está del lado del cafetal. Se trabaja sin contrato ni seguridad social, en cuarteles hacinados, con jornadas que arrancan a las 6:30 de la mañana. Y hacia afuera pesa el estigma de «mal vestidos» o «bebedores de bar». Pertenecer a una cuadrilla puede convivir con quedar excluido del pueblo entero.
  origen: Cuadrillas del Eje Cafetero · la del cafetal y la del Carnaval de Riosucio
  fuente: |-
    Saldarriaga Ramírez, C. (2024). Andariegos: prácticas culturales de los recolectores itinerantes de café del municipio de Pereira, Colombia. \emph{Apuntes: Revista de Estudios sobre Patrimonio Cultural, 37}. https://doi.org/10.11144/Javeriana.apu37.apcr
  saber_contemporaneo: |-
    Una \textbf{tabla dinámica} toma una tabla larga y la resume por grupos. Agrupa por una columna y calcula un indicador sobre otra. La sesión 3 te dio una suma total; esta te da \emph{suma por categoría}. Total por mes, promedio por curso, conteo por barrio. Responde a tres decisiones simples: qué agrupo (Filas), qué calculo (Valores), qué cruzo (Columnas). Sin programar nada contesta preguntas que a mano tardarían horas. Y hace visible lo que un promedio general esconde.
  pregunta_puente: |-
    ¿Por qué la misma palabra nombra dos cuadrillas que no se parecen en nada? ¿Y qué se pierde cuando un promedio mete en una sola fila a gente que no vive lo mismo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} cuándo una pregunta necesita agruparse y cuándo basta una fórmula simple; (2) \textbf{explicar} las cuatro zonas de una tabla dinámica y qué operación pide cada pregunta; (3) \textbf{crear} tu propia tabla dinámica con una conclusión que nombre el grupo destacado y el grupo en riesgo.
puentes:
  a_ruta: |-
    La sesión 3 te dio fórmulas para toda la tabla. La sesión 4 te dio filtros para cortarla. Hoy aprendes a \emph{re-agruparla}. Ya no «cuánto en total», sino «cuánto por categoría». Es el salto del cálculo único al cálculo comparable.
  a_escuta: |-
    Antes de teorizar, vas a contestar \emph{a ojo} dos preguntas de agrupación sobre tu tabla. Después las vas a ver resueltas en dos clics. El contraste te muestra para qué sirve de verdad la herramienta.
  a_sistematizacion: |-
    Ya viste el contraste. Ahora vas a entender la \textbf{anatomía} de una tabla dinámica. Las cuatro zonas, el tipo de operación y la diferencia entre agrupar por categoría y agrupar por fecha.
  a_praxis: |-
    Tienes el método. Toca aplicarlo. Una sola tabla dinámica bien hecha, con pregunta escrita, agrupación clara, cálculo correcto y conclusión de tres renglones.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: una tabla dinámica, una captura y una conclusión escrita. El criterio principal es que la conclusión \textbf{nombre} qué categoría destaca y qué decisión podría seguir de ahí.
  a_evaluacion: |-
    Antes de cerrar, mira la tabla dinámica desde las cinco dimensiones humanas. Agrupar bien es respetar las diferencias. Agrupar mal es disolver las particularidades en un promedio anónimo.
  a_triangulo: |-
    Y para terminar, tres voces sobre agrupar. Dussel sobre lo que resiste a toda categoría, Marco Aurelio sobre mirar el conjunto, Floridi sobre los patrones pequeños que solo significan agregados.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- ¿Total o por grupo?} (15 min · individual). (1) Toma tu tabla de la sesión 2 con las fórmulas de la sesión 3 ya aplicadas. (2) Responde \emph{a ojo} dos preguntas: cuál categoría tiene el promedio más alto en una columna numérica, y cuál categoría tiene más filas. (3) Cronometra cuánto tardas y anota si dudaste. (4) Abre Insertar $\to$ Tabla dinámica, arrastra esa categoría a \emph{Filas} y la columna numérica a \emph{Valores}. (5) Verifica las dos respuestas y compara qué método fue más rápido y cuál dio el resultado correcto.
  checks:
  - |-
    Respondí a ojo cuál categoría destaca por promedio y cuál por conteo.
  - |-
    Construí una primera tabla dinámica para verificar las dos respuestas.
  - |-
    Comparé honestamente: cuál método fue más rápido y cuál dio el resultado correcto.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} \textbf{Título:} «Actividad 1 --- ¿Total o por grupo?». \textbf{Formato:} tabla de dos filas y cuatro columnas (pregunta / respuesta a ojo / respuesta con tabla dinámica / tiempo a ojo), más una línea sobre quién ganó en velocidad y quién en precisión. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} reconoces en qué casos agrupar a ojo basta y en cuáles la tabla dinámica es indispensable.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Las cuatro zonas} (20 min · parejas). (1) Con tu pareja, escriban las cuatro zonas de una tabla dinámica con la función de cada una. (2) Escriban la secuencia de tres pasos que sigue toda tabla dinámica. (3) Tomen tres preguntas de sus tablas y digan qué operación necesita cada una. (4) Busquen una pregunta que solo se responda cruzando dos categorías y escríbanla completa.
  pilares:
  - |-
    La tabla dinámica se descompone en cuatro zonas. \textbf{Filas} es la categoría por la que agrupas: mes, curso, barrio, área. \textbf{Valores} es la columna numérica sobre la que calculas. \textbf{Columnas} es opcional y sirve para cruzar una segunda categoría. \textbf{Filtros} también es opcional y limita toda la tabla. Sin Filas y Valores no hay tabla dinámica.
  - |-
    Toda tabla dinámica sigue el patrón «categoría $\to$ medida $\to$ operación». Eliges qué agrupa, qué se calcula y con qué operación: SUMA, PROMEDIO, CUENTA, MAX o MIN. El error más común es confundir CUENTA con SUMA. CUENTA dice cuántos hay; SUMA dice cuánto suman. Una columna de notas pide PROMEDIO.
  - |-
    Todo se juega en una pregunta: ¿qué decisión cambia al ver los grupos por separado? Un promedio general de 6.2 parece regular. Pero si 9A da 7.5 y 9B da 4.9, ahí está el problema. La tabla dinámica sirve cuando el total esconde diferencias que importan para decidir.
  - |-
    Algoritmo para construir una: (1) escribe la pregunta de agrupación; (2) selecciona toda la tabla con encabezados; (3) Insertar $\to$ Tabla dinámica $\to$ Nueva hoja; (4) arrastra la categoría a Filas; (5) arrastra la columna numérica a Valores; (6) verifica la operación con clic derecho; (7) interpreta y captura.
  anatomia:
    titulo: Anatomía de una tabla dinámica bien construida
    body: |-
      \textbf{Pregunta:} qué comparas y por qué. \\[1mm] \textbf{Filas:} la categoría que agrupa. \\[1mm] \textbf{Valores:} la columna numérica que calculas. \\[1mm] \textbf{Operación:} SUMA / PROMEDIO / CUENTA / MAX / MIN. \\[1mm] \textbf{Resultado:} qué categoría destaca y cuál queda al final. \\[1mm] \textbf{Interpretación:} una frase que conecta el resultado con una decisión posible.
  errores_comunes: |-
    (1) Arrastrar a Valores una columna de texto: Excel cuenta filas en vez de calcular. (2) Olvidar cambiar la operación, que arranca en SUMA aunque quieras PROMEDIO. (3) Agrupar por una columna con datos sucios, donde «9A» y «9a» aparecen como dos grupos. (4) Construir la tabla sin pregunta escrita y terminar con un resumen lindo sin conclusión. (5) Reportar la tabla sin nombrar la categoría que destaca.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Las cuatro zonas». \textbf{Formato:} las cuatro zonas con su función, la secuencia de tres pasos, las tres preguntas con su operación y la pregunta que necesita cruzar dos categorías. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} distingues una operación técnicamente correcta de una operación que responde tu pregunta real.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu tabla dinámica con conclusión} (30 min · individual). (1) Escribe en una frase la pregunta de agrupación que quieres responder. (2) Elige la categoría que va a Filas y la columna numérica que va a Valores. (3) Construye la tabla dinámica y ajusta la operación. (4) Ordena los resultados de mayor a menor. (5) Toma una captura con la tabla visible. (6) Escribe tres renglones que nombren el grupo destacado, el grupo en riesgo y la decisión posible.
  pilares:
  - |-
    Tu producto se descompone en cuatro piezas: la pregunta escrita en una frase, la tabla dinámica configurada, la captura de pantalla y la conclusión de tres renglones que nombre el grupo destacado y el grupo en riesgo.
  - |-
    Sigue el patrón «categoría con sentido pedagógico, social o económico». No agrupes por columnas técnicas como el ID o la fecha exacta. Agrupa por categorías que produzcan decisión: curso, área, mes, barrio, tipo de gasto. Una buena tabla dinámica genera movimiento; una mala genera decoración.
  - |-
    Cada conclusión sigue un guion mínimo: el grupo X destaca porque…, el grupo Y queda atrás porque…, esto sugiere que… Tres frases cortas. Si tu conclusión ocupa más de tres renglones, recórtala.
  - |-
    Algoritmo: (1) escribe la pregunta; (2) elige la categoría; (3) elige la columna numérica; (4) construye la tabla dinámica; (5) ajusta la operación; (6) ordena de mayor a menor; (7) captura; (8) escribe los tres renglones.
  checklist:
    titulo: Checklist antes de cerrar la tabla dinámica
    items: |-
      \checkbox Pregunta escrita en una frase antes de abrir la tabla dinámica. \\[1mm] \checkbox Tabla dinámica con Filas y Valores configurados y la operación correcta. \\[1mm] \checkbox Resultados ordenados de mayor a menor. \\[1mm] \checkbox Captura de pantalla con la tabla dinámica visible. \\[1mm] \checkbox Conclusión de tres renglones con grupo destacado, grupo en riesgo y decisión posible.
  plantilla_guion: |-
    \textbf{Pregunta.} \textit{¿Qué quieres comparar entre grupos?} \\[1mm] \textbf{Filas.} \textit{Categoría que agrupa.} \\[1mm] \textbf{Valores.} \textit{Columna numérica.} \\[1mm] \textbf{Operación.} \textit{SUMA / PROMEDIO / CUENTA / MAX / MIN.} \\[1mm] \textbf{Resultado.} \textit{Grupo destacado y grupo al final.} \\[1mm] \textbf{Conclusión.} \textit{Tres renglones: destaca / queda atrás / sugiere.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Mi tabla dinámica». \textbf{Formato:} la pregunta, la configuración de zonas y operación, la captura pegada o descrita y la conclusión de tres renglones. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes defender en voz alta qué decisión propones a partir de la tabla.
  producto_titulo: 1 tabla dinámica con pregunta, captura y conclusión de 3 renglones
  criterios:
  - Pregunta de agrupación escrita antes de construir la tabla
  - Filas y Valores configurados con la operación correcta
  - Resultados ordenados para que el grupo destacado salte a la vista
  - Captura visible de la tabla dinámica
  - Conclusión de tres renglones con grupo destacado y decisión posible
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §2.4.2.2
    cita: |-
      El rostro del hombre se revela como otro cuando se recorta en nuestro sistema de instrumentos como exterior, como alguien, como una libertad que interpela, que provoca, que aparece como el que resiste a la totalización instrumental. No es algo; es alguien.
    aplicacion: |-
      Agrupar es meter a alguien en una fila. Cuando agrupas por curso, quien cambió de curso a mitad de año se pierde o se duplica. Cuando agrupas por barrio, quien no tiene dirección fija no entra. Y lo que no encaja en ninguna categoría termina en «otros». Esa fila es la que hay que mirar: ahí está lo que la tabla no supo nombrar.
    pregunta_espejo: |-
      Cuando agrupé mi tabla, ¿quién quedó en «otros» o en «no aplica»? ¿Qué cambiaría si esa fila fuera visible?
  estoico:
    autor: Marco Aurelio · Meditaciones VII, 47 (c. 175 d.C.)
    cita: |-
      Conduce mirar alrededor el curso de los astros, como quien gira con ellos, y contemplar también frecuentemente las mutuas conversiones de los elementos, porque las consideraciones de estas cosas purifican a uno de las manchas de esta vida terrestre.
    aplicacion: |-
      Subir la mirada al conjunto aclara. La tabla dinámica hace ese movimiento: deja de leer fila por fila y muestra el todo agrupado. Pero conviene bajar también. El promedio del conjunto no dice lo que le pasa a cada grupo, y una cuadrilla entera puede desaparecer dentro de un solo número.
    pregunta_espejo: |-
      ¿Qué vi al mirar el conjunto que no se veía fila por fila? ¿Y qué dejé de ver al mirarlo así?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    cita: |-
      Los pequeños patrones solo pueden ser significativos si se agregan correctamente, se comparan y se procesan a tiempo. (trad. propia, abreviada)
    aplicacion: |-
      Una fila sola no dice nada. Una nota, un gasto, una jornada: ruido. Agrupadas por curso, por mes o por tipo, esas mismas filas muestran un patrón. La tabla dinámica es la máquina de agregar correctamente. Pero el «correctamente» es tuyo: la máquina agrupa por donde le digas.
    pregunta_espejo: |-
      ¿Mi agrupación deja ver el patrón, o lo fabrica porque agrupé justo por donde quería que saliera?
compromiso: |-
  \textbf{Para la próxima semana.} Aplica una tabla dinámica real a una tabla cotidiana fuera del aula: gastos por categoría, calificaciones por área, horas de sueño por día de la semana. Documenta el grupo destacado, el grupo en riesgo y una decisión real que tomes a partir de esa comparación. La phronesis no se queda en la hoja: se entrena en lo que decides después.
web:
  resumen: |-
    Una tabla dinámica resume una tabla larga agrupando por una columna y calculando otra. Es el salto del cálculo único al cálculo comparable: ya no cuánto en total, sino cuánto por categoría.
  subtema: Datos · Comparar grupos
  pre_lectura:
    por_que_importa: |-
      El promedio general suele esconder las diferencias que más importan. Agrupar abre la tabla por categorías para que el número que decide sea el que corresponde, y no el que disuelve a todos en el mismo dato.
    pregunta_detonante: |-
      Si el promedio del curso es 6.2 pero 9A tiene 7.5 y 9B tiene 4.9, ¿qué decisión cambia al ver el promedio por curso?
    activacion:
      titulo: Doce productos al azar
      descripcion: |-
        En 3 minutos, el docente nombra doce productos repitiendo algunos. Los estudiantes agrupan mentalmente y reportan cuánto de cada uno. Después se compara con una tabla dinámica en vivo.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 4 aplicaste filtros para cortar la tabla y quedarte con una parte.
      siguiente: |-
        En la sesión 6 le vas a poner imagen a esas agrupaciones con gráficos de barra, línea y circular.

  conceptos_clave:
  - categoria: Las cuatro zonas
    termino: Filas
    definicion: |-
      La categoría por la que agrupas. Cada valor distinto se vuelve una fila del resumen.
    ejemplo: |-
      Arrastras «Curso» a Filas y aparecen 9A, 9B y 9C como filas separadas.
  - categoria: Las cuatro zonas
    termino: Valores
    definicion: |-
      La columna numérica sobre la que se calcula el indicador. Es el motor del resumen.
    ejemplo: |-
      Arrastras «Nota» a Valores y por defecto calcula SUMA; hay que cambiarla a PROMEDIO.
  - categoria: Las cuatro zonas
    termino: Columnas
    definicion: |-
      Zona opcional que cruza una segunda categoría y arma una matriz.
    ejemplo: |-
      Filas con Curso y Columnas con Mes da el gasto promedio de cada curso en cada mes.
  - categoria: Las cuatro zonas
    termino: Filtros
    definicion: |-
      Zona opcional que reduce toda la tabla dinámica a un subconjunto sin tocar las demás zonas.
    ejemplo: |-
      Un filtro de grado igual a 9 deja el resumen solo con los grupos de ese grado.
  - categoria: Decidir con el resumen
    termino: Operación
    definicion: |-
      SUMA, PROMEDIO, CUENTA, MAX o MIN. Define cuál es la pregunta que estás respondiendo.
    ejemplo: |-
      Notas piden PROMEDIO, productos vendidos piden SUMA, estudiantes por curso piden CUENTA.
  - categoria: Decidir con el resumen
    termino: Conclusión de tres renglones
    definicion: |-
      El cierre mínimo de toda tabla dinámica: grupo destacado, grupo en riesgo y decisión posible.
    ejemplo: |-
      9A destaca con 7.5, 9B queda atrás con 4.9 y eso sugiere refuerzo focalizado antes que clase general.
  cinco_dimensiones:
    personal: |-
      Pasaste de mirar un total a comparar grupos. Es la capacidad que vas a usar en un presupuesto, en tus hábitos o en tus propias notas.
    emocional: |-
      Toleraste la incomodidad de que lo simple ya no alcance. Comparar grupos obliga a pensar antes de calcular.
    ciudadana: |-
      Los reportes oficiales y el periodismo de datos se construyen agrupando. Entender cómo se agrupa es poder discutir el resumen, no solo consumirlo.
    local: |-
      El patrón de corte agrupa la cuadrilla por surcos y por procedencia. Tú agrupas tu tabla por categorías. En los dos casos alguien decidió el criterio.
    intergeneracional: |-
      La libreta agrupada del almacén y tu tabla dinámica responden la misma pregunta. La herramienta cambia; la decisión sigue siendo de quien mira.
  post_lectura:
    transferencia: |-
      Esta semana aplica una tabla dinámica real a una tabla cotidiana fuera del aula: gastos por categoría, calificaciones por área u horas de sueño por día. Documenta el grupo destacado, el grupo en riesgo y una decisión real.
  quiz:
    titulo: Verifica tablas dinámicas
    instrucciones: 5 preguntas para confirmar que dominas tablas dinámicas con criterio. Necesitas 3/5 para continuar.
    preguntas:
    - enunciado: Arrastras una columna de notas a Valores y la operación queda en SUMA. ¿Qué está calculando?
      opciones:
      - El promedio de las notas de cada grupo, que suele ser lo que uno quiere ver
      - La nota más alta que alcanzó cada uno de los grupos de la tabla
      - La suma de todas las notas del grupo, que casi nunca responde la pregunta
      - La cantidad de notas registradas en cada uno de los grupos comparados
      respuesta_index: 2
      feedback_correcto: |-
        Correcto. Excel arranca en SUMA por defecto. Hay que cambiarla a PROMEDIO con clic derecho, o el indicador no significa nada.
      feedback_incorrecto: |-
        SUMA suma, incluso cuando lo que tiene sentido es promediar. Cambiar la operación es el paso que más se olvida.
    - enunciado: La categoría «9A» aparece dos veces en el resumen, con totales distintos. ¿Qué pasó?
      opciones:
      - En la columna original conviven «9A» y «9a», y al agrupar quedan como dos grupos
      - Es el comportamiento normal de la herramienta cuando una categoría reúne muchas filas asociadas
      - Faltan datos en la columna numérica y el resumen parte el grupo en dos partes
      - Es un error conocido de Excel al construir resúmenes sobre tablas muy largas
      respuesta_index: 0
      feedback_correcto: |-
        Exacto. Los datos sucios se separan al agrupar: mayúsculas, espacios y tildes inconsistentes crean grupos fantasma. La limpieza de la sesión 2 importa aquí.
      feedback_incorrecto: |-
        La causa es higiene de datos. Dos escrituras de la misma categoría producen dos grupos distintos.
    - enunciado: ¿Cuándo conviene SUMA y cuándo PROMEDIO en la zona de Valores?
      opciones:
      - PROMEDIO sirve solo para las columnas de notas; para todo lo demás la operación correcta siempre es SUMA
      - Da lo mismo, porque las dos operaciones ordenan los grupos en el mismo orden
      - SUMA cuando preguntas cuánto en total; PROMEDIO cuando preguntas cuánto típicamente
      - SUMA siempre, porque es la operación que Excel trae configurada por defecto
      respuesta_index: 2
      feedback_correcto: |-
        Correcto. Ventas piden SUMA. Notas, edad u horas piden PROMEDIO. La operación define la pregunta que estás respondiendo.
      feedback_incorrecto: |-
        Total lleva a SUMA y típico lleva a PROMEDIO. Elegir mal cambia la conclusión sin que se note.
    - enunciado: ¿Qué entrega una tabla dinámica que las fórmulas básicas de la sesión 3 no entregan?
      opciones:
      - Cálculos bastante más precisos, porque el motor de agrupación redondea mejor los decimales de cada grupo
      - Comparar grupos sin escribir diez fórmulas, porque el indicador se recalcula por categoría
      - Lo mismo que las fórmulas, solo que presentado con otro formato en la hoja
      - Mayor velocidad de cálculo sobre tablas que tienen muchos miles de filas
      respuesta_index: 1
      feedback_correcto: |-
        Sí. Su poder está en comparar grupos sin esfuerzo. Reemplaza muchas fórmulas condicionales repetidas a mano.
      feedback_incorrecto: |-
        El valor está en comparar grupos. Sin tabla dinámica, un promedio por categoría exige repetir fórmulas condicionales una por una.
    - enunciado: En el Eje Cafetero, la palabra «cuadrilla» nombra dos grupos distintos. ¿Qué tiene que ver eso con agrupar datos?
      opciones:
      - Que las cuadrillas del cafetal llevaban tablas de recolección muy parecidas a las hojas de cálculo actuales
      - Que agrupar es un invento reciente que llegó al campo con las hojas de cálculo
      - Que nada los conecta, porque una cosa es el trabajo y otra el análisis de datos
      - Que la misma etiqueta puede cubrir realidades distintas, y hay que decir cuál se agrupó
      respuesta_index: 3
      feedback_correcto: |-
        Correcto. Una cuadrilla da pertenencia mientras uno sirva y la otra mientras uno cree. La etiqueta es la misma; lo que hay debajo no. Con las categorías de tu tabla pasa igual.
      feedback_incorrecto: |-
        El punto no es la herramienta sino la etiqueta. Dos realidades muy distintas pueden caer bajo el mismo nombre, y quien agrupa tiene que declarar cuál está contando.

titulo: Tablas dinámicas --- agrupar y comparar
producto_final: |-
  1 tabla dinámica construida sobre la tabla del estudiante que responda una pregunta agrupando los datos (promedio por categoría, totales por mes, conteo por tipo) + 1 conclusión real escrita en 3 renglones
saber_ancestral_idea: |-
  El inventario del almacén del barrio se hacía agrupando: cuántos sacos de café, cuántas latas de aceite, cuántas libras de panela. Esa agrupación informaba qué pedir, qué guardar, qué bajar de precio. La tabla dinámica es ese mismo gesto en formato digital --- mirar lo grande agrupando lo pequeño.
verbos_actividades:
- ANALIZA
- APLICA
- EXPLICA
- CREA

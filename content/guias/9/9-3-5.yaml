clave: 3-5
grado: 9
periodo: 3
sesion: 5
completo: true
titulo: Tablas dinámicas --- agrupar y comparar
titulo_portada: |-
  Tablas dinámicas ---
  agrupar y
  comparar
producto_final: 1 tabla dinámica construida sobre la tabla del estudiante que responda una pregunta agrupando los datos (promedio por categoría, totales por mes, conteo por tipo) + 1 conclusión real escrita en 3 renglones
apertura:
  saber_ancestral: |-
    El \textbf{inventario del almacén de barrio} en Cartago se hacía agrupando: cuántos sacos de café, cuántas latas de aceite, cuántas libras de panela, cuántas botellas de aguardiente. Esa agrupación informaba qué pedir al mayorista, qué guardar, qué bajar de precio antes de que se venciera. La \textbf{costurera del Pacífico} sabía agrupar telas por color para mostrar al cliente; el \textbf{cosechero campesino} agrupaba el café por lote y altura. Agrupar no es solo sumar: es \emph{mirar lo grande agrupando lo pequeño}. La tabla dinámica de Excel es ese mismo gesto antiguo en formato digital.
  saber_contemporaneo: |-
    Una \textbf{tabla dinámica} (\emph{pivot table}) es una herramienta que toma una tabla larga y la resume agrupando por una columna y calculando un indicador sobre otra. Donde la sesión 3 te dio una SUMA total, la tabla dinámica te da \emph{SUMA por categoría}: total por mes, promedio por curso, conteo por barrio. Sigue tres preguntas simples: \emph{¿qué agrupo?} (filas), \emph{¿qué calculo?} (valores), \emph{¿qué subgrupos cruzo?} (columnas). Sin programar nada, una tabla dinámica responde preguntas que de otro modo tardarían horas.
  pregunta_puente: |-
    ¿Cómo hacía el tendero del barrio para saber, sin computador, qué producto se vendía más? ¿Y qué pierde un analista novato cuando salta a las tablas dinámicas sin haber escrito antes la pregunta que quiere responder por grupo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} cuándo una pregunta necesita agruparse y cuándo basta una fórmula simple; (2) \textbf{aplicar} la construcción de una tabla dinámica eligiendo filas, valores y operación; (3) \textbf{explicar} con tus palabras qué muestra la tabla dinámica y qué decisión podría tomarse con ella; (4) \textbf{crear} tu propia tabla dinámica que responda una pregunta real con conclusión escrita.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 3 te dio fórmulas para toda la tabla; la sesión 4 te dio filtros para cortar la tabla. Hoy aprendes a \emph{re-agrupar} la tabla --- ya no \emph{``cuánto en total''}, sino \emph{``cuánto por categoría''}. Es el salto del \emph{cálculo único} al \emph{cálculo comparable}.
  a_escuta: |-
    Antes de teorizar, vas a contestar \emph{a ojo} 2 preguntas de agrupación sobre tu tabla. Después vas a verlas resueltas en 2 clics con una tabla dinámica. El contraste te muestra para qué sirve realmente la herramienta.
  a_sistematizacion: |-
    Ya viste el contraste. Ahora vas a entender la \textbf{anatomía} de una tabla dinámica: las 4 zonas (filas, columnas, valores, filtros), el tipo de operación (suma, promedio, conteo) y la diferencia entre agrupar por categoría y agrupar por fecha.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: una sola tabla dinámica bien hecha, con pregunta escrita, agrupación clara, cálculo correcto y conclusión real en 3 renglones que conecte con tu pregunta original de Sesión 1.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: una tabla dinámica + captura + conclusión escrita. El criterio principal: que la conclusión \textbf{nombre} qué categoría destaca y qué decisión podría seguir de ahí.
  a_evaluacion: |-
    Antes de cerrar, mira la tabla dinámica desde las cinco dimensiones humanas. Agrupar bien es respetar las diferencias; agrupar mal es disolver las particularidades en un promedio anónimo.
  a_triangulo: |-
    Y para terminar, tres voces sobre agrupar y comparar. Dussel sobre las categorías que invisibilizan, Epicteto sobre la disciplina de comparar lo comparable, Floridi sobre los agregados como infraestructura social.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- ¿Total o por grupo?} (15 min · individual). Toma tu tabla de Sesión 2 con sus fórmulas básicas (Sesión 3). Responde \emph{a ojo} estas 2 preguntas: (1) ¿cuál categoría (curso, barrio, mes, área) tiene el promedio más alto en una de tus columnas numéricas?; (2) ¿cuál categoría tiene más filas? Cronometra cuánto te toma y anota si dudaste. Después abre Insertar $\to$ Tabla dinámica, arrastra esa categoría a \emph{Filas} y la columna numérica a \emph{Valores}, y verifica la respuesta. Compara: ¿qué método fue más rápido?, ¿qué método dio resultado correcto?
  checks:
  - Respondí a ojo cuál categoría destaca por promedio y por conteo.
  - Construí una primera tabla dinámica para verificar.
  - Comparé honestamente: cuál método fue más rápido y cuál dio resultado correcto.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- ¿Total o por grupo?». \textbf{Formato:} tabla de 4 columnas (Pregunta~|~Respuesta a ojo~|~Respuesta con tabla dinámica~|~Tiempo a ojo), 2 filas. Al final 1 línea con quién ganó velocidad y quién precisión. \textbf{Sabes que terminaste cuando} reconoces honestamente cuándo agrupar a ojo basta y cuándo la tabla dinámica es indispensable.
sistematizacion:
  intro: |-
    Una tabla dinámica parece compleja pero responde a 3 decisiones simples. Vamos a descomponerla con los pilares del pensamiento computacional para que sepas exactamente qué arrastrar a cada zona.
  pilares:
  - |-
    La tabla dinámica se descompone en 4 zonas: (1) \textbf{Filas}: la categoría por la que agrupas (mes, curso, barrio, área); (2) \textbf{Valores}: la columna numérica sobre la que calculas (gasto, nota, cantidad); (3) \textbf{Columnas}: opcional, una segunda categoría para cruzar (curso $\times$ mes); (4) \textbf{Filtros}: opcional, una categoría que limita toda la tabla (solo grado 9, solo mayo). Sin Filas y Valores no hay tabla.
  - |-
    Toda tabla dinámica sigue el patrón \textbf{``categoría $\to$ medida $\to$ operación''}: eliges qué agrupa (texto/fecha), eliges qué se calcula (número), eliges con qué operación (SUMA, PROMEDIO, CUENTA, MAX, MIN). El error más común es confundir CUENTA con SUMA: CUENTA dice \emph{cuántos hay}; SUMA dice \emph{cuánto suman}. Una columna de notas pide PROMEDIO, no SUMA.
  - |-
    Lo esencial cabe en una pregunta: \emph{¿qué decisión cambia al ver los grupos por separado y no juntos?}. Promedio general de 6.2: parece regular. Promedio por curso: 9A da 7.5 y 9B da 4.9; \emph{ahí está el problema}. La tabla dinámica sirve cuando el promedio total esconde diferencias que importan para decidir.
  - |-
    Algoritmo para construir una tabla dinámica: (1) escribe la pregunta de agrupación; (2) selecciona toda la tabla con encabezados; (3) Insertar $\to$ Tabla dinámica $\to$ Nueva hoja; (4) arrastra la categoría a Filas; (5) arrastra la columna numérica a Valores; (6) verifica que la operación sea la correcta (clic derecho $\to$ Configuración de campo); (7) interpreta y captura.
  anatomia:
    titulo: Anatomía de una tabla dinámica bien construida
    body: |-
      \textbf{Pregunta:} qué comparas y por qué. \\[1mm] \textbf{Filas:} la categoría que agrupa. \\[1mm] \textbf{Valores:} la columna numérica que calculas. \\[1mm] \textbf{Operación:} SUMA / PROMEDIO / CUENTA / MAX / MIN. \\[1mm] \textbf{Resultado:} qué categoría destaca y cuál queda al final. \\[1mm] \textbf{Interpretación:} 1 frase que conecta el resultado con una decisión posible.
  errores_comunes: |-
    (1) Arrastrar a Valores una columna de texto: Excel cuenta filas en vez de calcular. (2) Olvidar cambiar la operación: arranca en SUMA aunque quieras PROMEDIO. (3) Agrupar por una columna con datos sucios (\emph{``9A''} y \emph{``9a''} aparecen separados): muestra el grupo dos veces. (4) Construir la tabla dinámica sin pregunta escrita: terminas con resumen lindo pero sin conclusión. (5) Reportar la tabla sin nombrar la categoría que destaca.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · APLICA).} Título: «Actividad 2 --- Anatomía de una tabla dinámica». \textbf{Formato:} ficha con las 4 zonas (Filas, Columnas, Valores, Filtros) + tu primer ejemplo (qué pusiste en cada zona) + qué operación elegiste y por qué. \textbf{Sabes que terminaste cuando} podrías construir una tabla dinámica nueva en cualquier tabla sin consultar el menú.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu tabla dinámica con conclusión} (30 min · individual). Hora de crear. Sobre tu tabla de Sesión 2, vas a construir UNA tabla dinámica que responda una pregunta de agrupación real, capturar pantalla y escribir 3 renglones de conclusión que nombren qué categoría destaca y qué decisión podría seguir.
  pilares:
  - |-
    Tu producto se descompone en 4 piezas: (1) la pregunta escrita en 1 frase; (2) la tabla dinámica configurada (filas + valores + operación); (3) la captura de pantalla con la tabla visible; (4) la conclusión de 3 renglones que nombre el grupo destacado y el grupo en riesgo.
  - |-
    Sigue el patrón \textbf{``categoría con sentido pedagógico, social o económico''}: no agrupes por columnas técnicas (ID, fecha exacta) sino por categorías que produzcan decisión (curso, área, mes, barrio, tipo de gasto). Una buena tabla dinámica genera \emph{movimiento}; una mala genera \emph{decoración}.
  - |-
    Cada conclusión sigue un guion mínimo: \emph{``El grupo X destaca porque... El grupo Y queda atrás porque... Esto sugiere que...''}. Tres frases cortas. Si tu conclusión ocupa más de 3 renglones, recórtala. La claridad gana a la verbosidad.
  - |-
    Algoritmo: (1) escribe pregunta; (2) elige categoría; (3) elige columna numérica; (4) construye tabla dinámica; (5) ajusta operación; (6) ordena de mayor a menor; (7) toma captura; (8) escribe conclusión de 3 renglones.
  checklist:
    titulo: Checklist antes de cerrar la tabla dinámica
    items: |-
      \checkbox Pregunta escrita en 1 frase antes de abrir la tabla dinámica. \\[1mm] \checkbox Tabla dinámica con Filas + Valores configurados y operación correcta. \\[1mm] \checkbox Resultados ordenados de mayor a menor para que el grupo destacado salte a la vista. \\[1mm] \checkbox Captura de pantalla con la tabla dinámica visible. \\[1mm] \checkbox Conclusión de 3 renglones que nombre grupo destacado, grupo en riesgo y decisión posible.
  plantilla_guion: |-
    \textbf{Pregunta.} \textit{¿Qué quieres comparar entre grupos?} \\[1mm] \textbf{Filas.} \textit{Categoría que agrupa.} \\[1mm] \textbf{Valores.} \textit{Columna numérica.} \\[1mm] \textbf{Operación.} \textit{SUMA / PROMEDIO / CUENTA / MAX / MIN.} \\[1mm] \textbf{Resultado.} \textit{Grupo destacado + grupo al final.} \\[1mm] \textbf{Conclusión.} \textit{3 renglones: destaca / queda atrás / sugiere.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} Título: «Actividad 3 --- Mi tabla dinámica». \textbf{Formato:} ficha con pregunta + configuración (filas/valores/operación) + captura pegada o descrita + conclusión de 3 renglones. \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} puedes defender en voz alta qué decisión propones tomar basado en la tabla dinámica.
  producto_titulo: 1 tabla dinámica con pregunta, captura y conclusión de 3 renglones
  criterios:
  - Pregunta de agrupación escrita antes de construir
  - Tabla dinámica con filas + valores + operación correcta
  - Resultados ordenados para que el grupo destacado salte a la vista
  - Captura visible de la tabla dinámica
  - Conclusión de 3 renglones que nombre grupo destacado y decisión posible
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Una categoría es siempre una decisión de quién se cuenta junto a quién --- y de quién queda fuera de toda categoría.
    aplicacion: |-
      Cuando agrupas por \emph{``curso''}, los estudiantes que cambiaron de curso a mitad de año se pierden o se duplican. Cuando agrupas por \emph{``barrio''}, las personas sin dirección fija no entran. Cuando agrupas por \emph{``tipo de gasto''}, lo que no encaja en ninguna categoría se diluye en \emph{``otros''}. La phronesis del analista exige declarar siempre \emph{quién entra en cada grupo, quién quedó por fuera y quién aparece en ``otros''}.
    pregunta_espejo: |-
      Cuando agrupé mi tabla, ¿quién quedó en la categoría \emph{``otros''} o \emph{``no aplica''}? ¿Qué decisión cambiaría si esa categoría fuera visible?
  estoico:
    autor: Epicteto
    cita: |-
      No compares lo que no es comparable: ahí empieza toda confusión.
    aplicacion: |-
      Es tentador agrupar por todo y comparar lo que sea. La sabiduría estoica recomienda lo contrario: \emph{primero pregunta qué grupos son comparables}. Comparar promedio de notas entre cursos del mismo grado tiene sentido; comparar promedio de notas entre cursos de grados distintos no, porque los temas y exigencias cambian. Quien agrupa con criterio entrena el músculo de comparar solo lo comparable.
    pregunta_espejo: |-
      Los grupos que comparé, ¿eran realmente comparables o solo se parecían? ¿Qué diferencia silenciosa entre ellos podría explicar el resultado mejor que el grupo en sí?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Las tablas dinámicas son la infraestructura cognitiva con que la sociedad contemporánea se mira a sí misma.
    aplicacion: |-
      Cada vez que un noticiero muestra \emph{``casos por departamento''}, \emph{``inflación por sector''} o \emph{``votos por edad''}, hay una tabla dinámica detrás. Quien no comprende cómo se construyen depende de las agrupaciones que otros eligen. Dominar tablas dinámicas en tu propia tabla es el primer paso para criticar (o defender) las que otros publican.
    pregunta_espejo: |-
      ¿Cuántas \emph{``tablas con totales por categoría''} leí esta semana en redes o noticias? ¿Habría agrupado yo las mismas categorías?
compromiso: |-
  \textbf{Para la próxima semana.} Aplica una tabla dinámica real a UNA tabla cotidiana fuera del aula: gastos por categoría, calificaciones por área, horas de sueño por día de la semana. Documenta el grupo destacado, el grupo en riesgo y una decisión real que tomes a partir de esa comparación. La phronesis no se queda en la hoja --- se entrena en lo que decides después.

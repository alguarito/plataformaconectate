titulo: Gráficos --- la imagen de los datos
producto_final: |-
  3 gráficos (barra, línea, circular) generados a partir de la tabla del estudiante, cada uno acompañado de la justificación de por qué ese tipo de gráfico era el adecuado para esa pregunta
saber_ancestral_idea: |-
  Antes del gráfico de barras existieron los mapas en piedra de los pueblos andinos, los dibujos en arena de los pescadores afro-pacíficos para mostrar corrientes, los esquemas de la abuela en el suelo con un palo para explicar el patrón de la cosecha. Visualizar datos es un gesto humano antiguo --- el software solo cambió el medio.

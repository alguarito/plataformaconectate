clave: 3-6
grado: 9
periodo: 3
sesion: 6
completo: true
duracion_min: 90
titulo: Gráficos --- la imagen de los datos
titulo_portada: |-
  Gráficos ---
  la imagen
  de los datos
producto_final: 3 gráficos (barra, línea, circular) sobre la tabla propia, cada uno con la justificación escrita de por qué ese tipo y no otro
apertura:
  saber_ancestral: |-
    Cartago se llama a sí misma capital del bordado. Ansermanuevo se llama cuna del calado, y cada agosto lo celebra en sus Fiestas del Calado y el Bordado. Son dos oficios distintos, con dos ciudades y dos nombres. Confundirlos no es un descuido de vocabulario: es no ver lo que la mano hizo. Tener nombre propio para lo que uno hace es parte de la dignidad del trabajo (Universidad Autónoma de Occidente, 2021). Pero el reconocimiento no es lo mismo que la justicia. La \textbf{cara de exclusión} está en la informalidad. La tradición está en riesgo por falta de contrato, por desinterés generacional y por la desconexión entre artesanas y diseñadores. Y quienes bordan lo dicen sin rodeos: «la mayoría somos mujeres cabeza de familia» (citado en Chica García, 2019).
  origen: Bordadoras de Cartago y caladoras de Ansermanuevo · dos oficios con nombre propio
  fuente: |-
    Universidad Autónoma de Occidente. (2021, 24 de marzo). \emph{Cartago, capital mundial del bordado, el tejido y la moda, a través de la gestión del turismo cultural}. https://www.uao.edu.co/ciencias-administrativas/cartago-capital-mundial-del-bordado-el-tejido-la-moda-a-traves-de-la-gestion-del-turismo-cultural/
  saber_contemporaneo: |-
    Un \textbf{gráfico} convierte una tabla en imagen. El ojo lee de un vistazo lo que la tabla solo dice fila por fila. Hay tres tipos básicos que resuelven casi todos los casos. Las \texttt{barras} sirven para \emph{comparar} categorías. Las \texttt{líneas} muestran \emph{evolución} en el tiempo. El \texttt{circular} muestra \emph{participación} sobre un total. Elegir mal el tipo no es un detalle estético: hace que la pregunta se responda mal, o que el lector entienda otra cosa.
  pregunta_puente: |-
    ¿Por qué dos ciudades vecinas insisten en que su oficio se llame por su nombre? ¿Y qué pasa cuando un gráfico se titula «Gráfico 2» en lugar de decir qué muestra?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los tres tipos básicos de gráfico y la pregunta que responde cada uno; (2) \textbf{explicar} cuándo un gráfico engaña al ojo y cuándo lo orienta bien; (3) \textbf{crear} tres gráficos sobre tu propia tabla, con una justificación escrita de por qué ese tipo y no otro.
puentes:
  a_ruta: |-
    La sesión 5 te enseñó a agrupar la tabla con una tabla dinámica. Hoy le pones imagen a esa agrupación. Lo que viste en filas y columnas lo vas a ver en altura de barra, pendiente de línea y porción de torta. Es el salto del número a la imagen.
  a_escuta: |-
    Antes de teorizar, vas a mirar tres gráficos --- uno honesto y dos tramposos --- y a decir qué entendiste de cada uno. Después vas a ver la tabla que hay detrás. Ese contraste muestra que un gráfico puede iluminar o engañar.
  a_sistematizacion: |-
    Ya viste el contraste. Ahora vas a entender la \textbf{anatomía} de un gráfico bien hecho. Qué pregunta responde, qué tipo elige, qué títulos lleva, qué ejes muestra y qué cosas no debe hacer nunca.
  a_praxis: |-
    Tienes el método. Toca aplicarlo. Tres gráficos sobre tu propia tabla o sobre la tabla dinámica de la sesión 5, cada uno con su justificación escrita.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: tres gráficos y tres justificaciones. El criterio principal es que la justificación nombre la pregunta que responde el gráfico y por qué otro tipo habría sido peor.
  a_evaluacion: |-
    Antes de cerrar, mira los gráficos desde las cinco dimensiones humanas. Graficar bien es respeto al lector. Graficar mal es ruido visual, y graficar con trampas es otra cosa.
  a_triangulo: |-
    Y para terminar, tres voces sobre la imagen de los datos. Dussel sobre la coherencia entre forma y función, Marco Aurelio sobre mirar las cosas como son, Floridi sobre registrar como la técnica que abrió la historia.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- ¿Qué entendiste de este gráfico?} (15 min · individual). (1) El docente muestra tres gráficos: uno bien hecho, uno con el eje Y cortado que exagera diferencias y uno circular con doce porciones. (2) Sin ver la tabla que hay detrás, responde para cada uno qué pregunta parece responder. (3) Anota qué conclusión sacarías de cada uno. (4) Anota qué te parece sospechoso o confuso en cada caso. (5) Cuando aparezcan las tablas, compara tu lectura con los datos reales y marca dónde te desviaste más.
  checks:
  - |-
    Anoté qué pregunta parecía responder cada uno de los tres gráficos.
  - |-
    Anoté qué conclusión sacaría de cada uno antes de ver la tabla.
  - |-
    Identifiqué cuál gráfico era confiable y cuáles me engañaron, y por qué.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- ¿Qué entendiste de este gráfico?». \textbf{Formato:} tabla de tres filas, una por gráfico, y tres columnas (pregunta que parecía responder / conclusión a primera vista / qué cambió al ver la tabla). \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} reconoces que un mismo dato puede contar dos historias distintas según el gráfico que lo muestre.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Cuándo cada tipo y cuándo ninguno} (20 min · parejas). (1) Con tu pareja, escriban una ficha por tipo de gráfico con la pregunta que responde. (2) Añadan a cada ficha cuándo elegirlo y cuándo no elegirlo nunca. (3) Añadan un error frecuente de cada tipo. (4) Decidan qué gráfico usar y cuál descartar en tres casos: ventas mensuales del año, porcentaje de tipos de sangre y altura promedio por edad de 6.º a 11.º.
  pilares:
  - |-
    Los tres tipos se descomponen así. Las \textbf{barras} responden cuál categoría es mayor o menor, con las categorías en el eje X. Las \textbf{líneas} responden cómo cambia algo en el tiempo, con fechas ordenadas en el eje X. El \textbf{circular} responde qué porción del total es cada parte, y solo funciona con pocas porciones.
  - |-
    Todo gráfico sigue el patrón «pregunta $\to$ tipo $\to$ ejes $\to$ título». Primero defines la pregunta. Después eliges el tipo. Después configuras los ejes, con cero en el eje Y salvo justificación. Y por último escribes un título que diga qué muestra el gráfico, no qué tipo es. «Gasto mensual en transporte» es un título; «Gráfico de barras 1» no lo es.
  - |-
    Todo se juega en una regla: el tipo de gráfico debe coincidir con la pregunta. Comparar cinco cursos pide barras. Ver la evolución de las notas durante el periodo pide líneas. Mostrar la participación de cuatro áreas en el total de horas pide circular. Un circular con quince categorías no lo entiende nadie.
  - |-
    Algoritmo: (1) escribe la pregunta; (2) decide si comparas, si miras evolución o si muestras participación; (3) selecciona la tabla o la tabla dinámica; (4) Insertar $\to$ Gráfico recomendado; (5) ajusta título, ejes y leyenda; (6) verifica que el eje Y arranque en cero salvo motivo declarado; (7) escribe la justificación.
  anatomia:
    titulo: Anatomía de un gráfico bien hecho
    body: |-
      \textbf{Pregunta:} qué responde el gráfico, en una frase. \\[1mm] \textbf{Tipo:} barra / línea / circular. \\[1mm] \textbf{Ejes:} eje X y eje Y nombrados con su unidad. \\[1mm] \textbf{Eje Y:} arranca en cero, salvo justificación visible. \\[1mm] \textbf{Título:} dice qué muestra, no qué tipo es. \\[1mm] \textbf{Leyenda:} corta y legible, solo si hay más de una serie. \\[1mm] \textbf{Justificación:} una frase con por qué este tipo y no otro.
  errores_comunes: |-
    (1) Cortar el eje Y para exagerar diferencias, que distorsiona la lectura. (2) Usar un circular con más de siete porciones, donde ya nadie distingue nada. (3) Conectar con líneas datos que no son temporales, lo que sugiere una evolución inexistente. (4) Olvidar el título y las unidades de los ejes, con lo que el lector no sabe qué mira. (5) Hacer un gráfico bonito sin pregunta escrita: eso es decoración, no comunicación.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Cuándo cada tipo y cuándo ninguno». \textbf{Formato:} tres fichas, una por tipo, cada una con la pregunta que responde, cuándo elegirlo, cuándo no elegirlo y un error frecuente, más la decisión razonada de los tres casos. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes elegir el tipo correcto sin consultar y explicar por qué los otros dos engañarían.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tres gráficos con justificación} (30 min · individual). (1) Escribe tres preguntas, una por gráfico, antes de insertar nada. (2) Comprueba que cada pregunta pida un tipo distinto. (3) Genera los tres gráficos sobre tu tabla o sobre la tabla dinámica de la sesión 5. (4) Pon a cada uno título descriptivo, ejes con unidad y leyenda solo si hace falta. (5) Verifica que el eje Y arranque en cero en barras y líneas. (6) Escribe la justificación de cada uno diciendo por qué ese tipo y por qué otro habría sido peor.
  pilares:
  - |-
    Tu producto se descompone en tres piezas por gráfico: la pregunta escrita, el gráfico configurado con título y ejes, y la justificación de una o dos frases. Sin la justificación, un gráfico es decoración.
  - |-
    Sigue el patrón «una pregunta, un tipo». Si dos de tus preguntas piden barras, cambia una de las preguntas, no el tipo de gráfico. El objetivo no es tener tres imágenes distintas sino tres preguntas que de verdad pidan cosas distintas.
  - |-
    Cada justificación sigue un guion mínimo: elegí este tipo porque…, y otro habría sido peor porque… Dos frases bastan. La justificación es lo que separa un gráfico de un adorno.
  - |-
    Algoritmo: (1) escribe las tres preguntas; (2) asigna un tipo a cada una; (3) selecciona los datos; (4) inserta el gráfico; (5) ajusta título, ejes y leyenda; (6) revisa el eje Y; (7) escribe las tres justificaciones.
  checklist:
    titulo: Checklist antes de cerrar los tres gráficos
    items: |-
      \checkbox Tres preguntas escritas, una por gráfico, antes de insertar. \\[1mm] \checkbox Tres gráficos creados, uno de cada tipo. \\[1mm] \checkbox Todos con título descriptivo y ejes con unidad. \\[1mm] \checkbox Eje Y en cero en barras y líneas, o justificación declarada. \\[1mm] \checkbox Tres justificaciones que digan por qué ese tipo y por qué otro habría sido peor.
  plantilla_guion: |-
    \textbf{Gráfico 1 (barras).} \textit{Pregunta, categorías comparadas y justificación.} \\[1mm] \textbf{Gráfico 2 (líneas).} \textit{Pregunta, periodo evaluado y justificación.} \\[1mm] \textbf{Gráfico 3 (circular).} \textit{Pregunta, total considerado y justificación.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Mis tres gráficos con justificación». \textbf{Formato:} tres fichas con pregunta, tipo, captura pegada o descrita y justificación de una o dos frases. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} puedes defender frente a un compañero por qué cada gráfico es del tipo correcto y no de otro.
  producto_titulo: 3 gráficos (barra, línea, circular) con justificación escrita
  criterios:
  - Tres preguntas escritas antes de crear los gráficos
  - Tres gráficos, uno de cada tipo, sobre la tabla propia o la tabla dinámica
  - Títulos descriptivos y ejes con unidad en cada gráfico
  - Eje Y en cero en barras y líneas, o justificación declarada
  - Tres justificaciones que nombren por qué ese tipo y no otro
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.3.1.2
    cita: |-
      El tema esencial del diseño es el de dotar al producto de coherencia formal; incluye a la tecnología… por cuanto esto significa coherencia funcional: el del valor del uso; incluye a la estética, porque la coherencia formal, en cuanto tal, es la belleza del producto.
    aplicacion: |-
      Un gráfico bonito que responde la pregunta equivocada no es bonito: está mal resuelto. La coherencia que pide Dussel aquí es entre la pregunta y la forma. Un circular con quince porciones falla por función antes que por estética. Y cuando la forma calza con la pregunta, el gráfico se ve bien casi sin esfuerzo.
    pregunta_espejo: |-
      Mis tres gráficos, ¿los elegí por la pregunta que responden o por cuál se veía mejor en la pantalla?
  estoico:
    autor: Marco Aurelio · Meditaciones IV, 11 (c. 175 d.C.)
    cita: |-
      No te formes de las cosas la opinión que tiene quien te agravia, ni la que él querría que tuvieras; míralas como son en verdad. (trad. propia)
    aplicacion: |-
      Un eje Y cortado es exactamente eso: la opinión que el autor del gráfico querría que tuvieras. La diferencia real puede ser de cuatro puntos y parecer un derrumbe. Mirar el gráfico como es en verdad significa buscar dónde arranca el eje antes de sacar la conclusión.
    pregunta_espejo: |-
      Del último gráfico que me convenció, ¿alcancé a mirar dónde arrancaba el eje?
  floridi:
    autor: Luciano Floridi · Hyperhistory and the Philosophy of Information Policies (2015)
    cita: |-
      La historia ha durado 6.000 años: empezó con la invención de la escritura en el cuarto milenio antes de Cristo. (trad. propia)
    aplicacion: |-
      Lo que abre la historia, para Floridi, es poder registrar. Un gráfico es una forma de registro: deja la conclusión escrita en una imagen que viaja sin su autor. Por eso importa el título. Cuando el gráfico llegue a alguien que no estuvo, el título será lo único que diga qué se estaba mirando.
    pregunta_espejo: |-
      Si mi gráfico llegara solo, sin que yo lo explique, ¿qué entendería quien lo abra?
compromiso: |-
  \textbf{Para la próxima semana.} Toma un gráfico real de prensa, de redes o de un cuaderno escolar. Identifica qué pregunta dice responder, si el tipo es el adecuado, si el eje Y arranca en cero y qué categoría queda escondida en «otros». La phronesis no se queda graficando: se entrena leyendo los gráficos con que otros deciden.
web:
  resumen: |-
    Un gráfico convierte la tabla en imagen para que el ojo lea de un vistazo. Aprendes los tres tipos básicos y a justificar por qué elegiste cada uno.
  subtema: Datos · La imagen como argumento
  pre_lectura:
    por_que_importa: |-
      Casi toda noticia económica, política o de salud llega al ciudadano en forma de gráfico. Saber elegir el tipo correcto y detectar las trampas visuales es alfabetización básica.
    pregunta_detonante: |-
      Si dos gráficos muestran los mismos datos pero uno tiene el eje Y cortado, ¿qué pasa con la conclusión del lector?
    activacion:
      titulo: Tres gráficos, una sola tabla
      descripcion: |-
        En 3 minutos, el docente muestra tres gráficos de los mismos datos: uno honesto, uno con el eje cortado y uno circular con doce porciones. Los estudiantes anotan qué entendieron antes de ver la tabla.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 5 agrupaste y comparaste con una tabla dinámica.
      siguiente: |-
        En la sesión 7 vas a comunicar conclusiones con narrativa de datos: el gráfico como argumento y no como decoración.

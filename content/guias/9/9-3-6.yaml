  conceptos_clave:
  - categoria: Los tres tipos básicos
    termino: Gráfico de barras
    definicion: |-
      Compara categorías que no son tiempo. Las categorías van en el eje X y el valor en el eje Y.
    ejemplo: |-
      Las horas asignadas a cada área del plan de estudios se comparan bien con barras.
  - categoria: Los tres tipos básicos
    termino: Gráfico de líneas
    definicion: |-
      Muestra evolución en el tiempo. El eje X lleva fechas o periodos ordenados.
    ejemplo: |-
      El promedio de notas mes a mes durante el periodo se ve mejor con una línea.
  - categoria: Los tres tipos básicos
    termino: Gráfico circular
    definicion: |-
      Muestra participación sobre un total. Funciona con tres a cinco porciones y se vuelve ilegible pasadas siete.
    ejemplo: |-
      El reparto del gasto entre transporte, alimentación, útiles y ahorro cabe en un circular.
  - categoria: Reglas que evitan engaños
    termino: Eje Y en cero
    definicion: |-
      Regla básica de barras y líneas. Cortar el eje exagera diferencias y manipula la lectura.
    ejemplo: |-
      Si el rango va de 95 a 99 y el eje arranca en 90, una caída pequeña parece un derrumbe.
  - categoria: Reglas que evitan engaños
    termino: Título descriptivo
    definicion: |-
      Dice qué muestra el gráfico y no qué tipo de gráfico es. Es lo único que viaja con la imagen.
    ejemplo: |-
      «Notas promedio por curso en el periodo 3» dice algo; «Gráfico 2» no dice nada.
  - categoria: Reglas que evitan engaños
    termino: Justificación por tipo
    definicion: |-
      Una o dos frases que digan por qué ese tipo y no otro. Sin ellas el gráfico es decoración.
    ejemplo: |-
      Elegí líneas porque comparo cómo evoluciona mes a mes, y barras sueltas no mostrarían la tendencia.
  cinco_dimensiones:
    personal: |-
      Aprendiste a leer con criterio cualquier gráfico que te llegue y a producir los tuyos sin caer en trampas visuales.
    emocional: |-
      Resististe la tentación del adorno: el tercer eje, la sombra, el degradado. Elegir simple es una disciplina.
    ciudadana: |-
      Los gráficos abren las noticias. Auditar el eje, el tipo y la categoría «otros» es una forma de leer política.
    local: |-
      En el norte del Valle, bordado y calado tienen cada uno su nombre porque son cosas distintas. Con los tipos de gráfico pasa igual.
    intergeneracional: |-
      Nombrar bien lo que uno hace es un cuidado que se enseña en los oficios y se hereda. Tu título de gráfico es ese mismo cuidado.
  post_lectura:
    transferencia: |-
      Esta semana toma un gráfico real de prensa o de redes. Identifica qué pregunta dice responder, si el tipo es el adecuado, si el eje Y arranca en cero y qué categoría queda escondida en «otros».
  quiz:
    titulo: Verifica gráficos
    instrucciones: 5 preguntas para confirmar que eliges y lees gráficos con criterio. Necesitas 3/5 para continuar.
    preguntas:
    - enunciado: Quieres mostrar cómo cambió el promedio de notas mes a mes durante el periodo. ¿Qué tipo de gráfico eliges?
      opciones:
      - Un circular, porque cada mes es una porción del periodo completo que estás evaluando
      - Una línea, porque el eje X lleva periodos ordenados y la pendiente muestra la tendencia
      - Barras, porque cada mes es una categoría distinta y así se comparan entre ellas
      - Cualquiera de los tres, porque los datos son los mismos y la conclusión no cambia
      respuesta_index: 1
      feedback_correcto: |-
        Correcto. Hay tiempo ordenado, así que hay evolución, y la evolución se lee en la pendiente de una línea.
      feedback_incorrecto: |-
        Cuando el eje X es tiempo ordenado, el tipo que responde es la línea. Las barras comparan, pero no muestran tendencia.
    - enunciado: Un gráfico de barras muestra notas entre 95 y 99, y el eje Y arranca en 90. ¿Qué efecto tiene?
      opciones:
      - Ninguno en particular, porque los valores de las barras siguen siendo exactamente los mismos
      - Mejora la lectura, porque aprovecha todo el alto disponible del área del gráfico
      - Exagera las diferencias y hace que una caída pequeña parezca un derrumbe
      - Solo afecta la leyenda, que deja de corresponder con la escala que se está usando
      respuesta_index: 2
      feedback_correcto: |-
        Exacto. Cortar el eje Y es la trampa visual más común. Si hay una razón para cortarlo, se declara en el gráfico.
      feedback_incorrecto: |-
        Los valores no cambian, pero la imagen sí. Y la gente decide con la imagen, no con la tabla.
    - enunciado: ¿Cuándo deja de servir un gráfico circular?
      opciones:
      - Cuando hay muchas porciones, porque el ojo ya no distingue cuál es mayor
      - Cuando los porcentajes de las porciones no suman exactamente cien por el redondeo
      - Cuando las categorías tienen nombres largos que no caben dentro de cada porción
      - Cuando alguna de las porciones representa menos de la décima parte del total medido
      respuesta_index: 0
      feedback_correcto: |-
        Sí. Con tres a cinco porciones se lee bien; pasadas siete ya nadie compara nada. Ahí conviene pasar a barras.
      feedback_incorrecto: |-
        El límite del circular es la cantidad de porciones. Cuando son muchas, el ojo no puede comparar áreas.
    - enunciado: ¿Cuál de estos es un título descriptivo de gráfico?
      opciones:
      - «Gráfico de barras 1», porque numera la figura y permite referirse a ella en el texto
      - «Datos del periodo», porque anuncia con claridad de dónde salió la información mostrada
      - «Gasto mensual en transporte, enero a mayo», porque dice qué muestra y en qué periodo
      - «Resultados», porque es corto y deja que la imagen hable por sí sola sin interferencias
      respuesta_index: 2
      feedback_correcto: |-
        Correcto. El título es lo único que viaja con la imagen. Debe decir qué se está mirando y de cuándo.
      feedback_incorrecto: |-
        Un título dice qué muestra el gráfico. Numerarlo o llamarlo «resultados» no le dice nada a quien no estuvo.
    - enunciado: Cartago se llama capital del bordado y Ansermanuevo cuna del calado. ¿Qué tiene que ver eso con los gráficos?
      opciones:
      - Que las artesanas del norte del Valle usan gráficos para planear las piezas que van a bordar
      - Que cada oficio tiene su nombre porque hace algo distinto, y con los tipos de gráfico pasa igual
      - Que el bordado y el calado son en realidad el mismo oficio con dos nombres según la ciudad
      - Que los oficios tradicionales del territorio se explican mejor con imágenes que con tablas
      respuesta_index: 1
      feedback_correcto: |-
        Correcto. Llamar bordado a un calado es no ver lo que la mano hizo. Llamar línea a lo que pedía barras es no ver lo que la pregunta pedía.
      feedback_incorrecto: |-
        El punto es el nombre. Dos cosas distintas necesitan dos nombres, y usar el que no corresponde impide ver lo que hay.

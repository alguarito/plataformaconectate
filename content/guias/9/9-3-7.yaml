clave: 3-7
grado: 9
periodo: 3
sesion: 7
completo: true
titulo: Limpieza de datos --- el oficio del archivero
titulo_portada: |-
  Limpieza de datos ---
  el oficio
  del archivero
producto_final: 1 dataset "sucio" (provisto por el docente o descargado de un portal abierto) limpiado por el estudiante con duplicados eliminados, formatos normalizados, vacíos corregidos y errores señalados, acompañado de bitácora de qué se cambió y por qué
apertura:
  saber_ancestral: |-
    La \textbf{criba de granos} antes de cocinar --- separar la semilla buena de la mala, de las piedras, del polvo, de las cáscaras vacías --- es el mismo gesto que limpiar datos. Sin esa criba, lo que cocinas se daña; sin limpieza de datos, lo que concluyes es falso. La \textbf{abuela rural del Valle} cribaba arroz una hora antes de cocinarlo. El \textbf{archivero del pueblo} verificaba folio por folio antes de archivar. El \textbf{ordeñador} colaba la leche antes de envasarla. Todos compartían la misma sabiduría: \emph{lo que entra contaminado, sale contaminado}.
  saber_contemporaneo: |-
    La \textbf{limpieza de datos} (\emph{data cleaning}) es la operación más laboriosa y más subestimada del análisis. Antes de filtrar, pivotar o graficar, el dataset debe estar limpio: (1) sin \textbf{duplicados} (filas repetidas); (2) con \textbf{formatos normalizados} (fechas, mayúsculas, espacios); (3) sin \textbf{vacíos sospechosos} (celdas en blanco que deberían tener valor); (4) sin \textbf{errores tipográficos} (\emph{``9A''} vs \emph{``9a''} vs \emph{``9 A''}). Una regla del oficio: \emph{el 70\% del tiempo de un analista se va en limpiar; el 30\% en analizar}. Y la \textbf{bitácora} (registro de qué se cambió y por qué) es lo que separa al profesional del que solo \emph{``arregla y borra''}.
  pregunta_puente: |-
    ¿Cómo sabía la abuela que un grano estaba dañado sin probarlo? ¿Y qué pierde un analista novato cuando entrega un análisis \emph{``rápido y bonito''} sin haber cribado antes los datos sucios?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 4 tipos de suciedad típica en un dataset (duplicados, formato, vacíos, errores); (2) \textbf{analizar} qué tipo de suciedad tiene tu dataset y cuál de las decisiones futuras corre más riesgo; (3) \textbf{evaluar} qué celdas se corrigen, cuáles se eliminan y cuáles se marcan como \emph{``revisar''}; (4) \textbf{aplicar} la limpieza con una bitácora que documente cada cambio.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Hasta aquí trabajaste sobre tu propia tabla limpia. Hoy recibes una tabla \emph{sucia} (de alguien más, descargada de un portal abierto, simulada por el docente). Es la prueba realista: en el mundo profesional, los datos casi nunca llegan limpios. Limpiar es el oficio invisible.
  a_escuta: |-
    Antes de teorizar, vas a abrir el dataset sucio y vas a \emph{descubrir} las trampas sin instrucción previa. Cuántos duplicados hay, cuántas fechas mal escritas, cuántas celdas vacías sospechosas. El reconocimiento del problema es la primera mitad de la solución.
  a_sistematizacion: |-
    Ya viste la suciedad. Ahora vamos a entender la \textbf{anatomía} de los 4 tipos de problema y a aprender la regla más importante: \emph{nunca limpies sin bitácora}, porque sin bitácora nadie podrá reproducir tu análisis ni discutir tus decisiones.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: limpiar el dataset corrigiendo lo corregible, eliminando lo eliminable, marcando lo dudoso, y dejando una bitácora clara de cada cambio. El producto no es solo un archivo limpio: es un archivo limpio \emph{con historia documentada}.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: dataset limpio + bitácora. El criterio principal: que un compañero, leyendo solo tu bitácora, pueda entender qué hiciste y \textbf{por qué} en cada caso.
  a_evaluacion: |-
    Antes de cerrar, mira la limpieza desde las cinco dimensiones humanas. Limpiar bien es ética del análisis; limpiar sin bitácora es manipulación oculta.
  a_triangulo: |-
    Y para terminar, tres voces sobre limpiar. Dussel sobre lo que se descarta sin nombrarlo, Marco Aurelio sobre la paciencia del oficio invisible, Floridi sobre la integridad de los datos como condición de la verdad pública.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Descubre la suciedad} (15 min · individual). El docente reparte un dataset sucio de ~50 filas. Sin instrucción específica, abre el archivo y \emph{busca}: ¿cuántos duplicados ves?, ¿cuántas fechas con formato distinto?, ¿cuántas celdas vacías?, ¿cuántas inconsistencias de mayúscula/espacio? Anota cantidades y un ejemplo de cada tipo. \textbf{No corrijas todavía}: solo identifica. El reconocimiento es la mitad del oficio.
  checks:
  - Conté duplicados, formatos inconsistentes, vacíos y errores tipográficos.
  - Anoté al menos 1 ejemplo concreto de cada tipo de problema.
  - Resistí la tentación de \emph{``arreglar de una''} y solo identifiqué.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Descubre la suciedad». \textbf{Formato:} tabla 3 columnas (Tipo de problema~|~Cuántos casos~|~1 ejemplo), 4 filas (uno por tipo: duplicados, formato, vacíos, errores). \textbf{Sabes que terminaste cuando} puedes nombrar dónde está cada tipo de suciedad sin tener que volver a buscar.
sistematizacion:
  intro: |-
    Los 4 tipos de suciedad piden tratamientos distintos. Vamos a descomponer cada uno con los pilares del pensamiento computacional para que sepas exactamente qué hacer con cada caso.
  pilares:
  - |-
    La suciedad se descompone así: (1) \textbf{duplicados}: filas que repiten información; tratamiento: \emph{eliminar la copia, dejar el original con bitácora}. (2) \textbf{Formato inconsistente}: \emph{``2025-05-15''} vs \emph{``15/05/2025''}; tratamiento: \emph{normalizar al formato estándar}. (3) \textbf{Vacíos}: celdas en blanco; tratamiento: \emph{decidir si el vacío es legítimo, si se rellena con un valor por defecto, o si se marca como ``faltante''}. (4) \textbf{Errores tipográficos}: \emph{``9A''}, \emph{``9a''}, \emph{``9 A''}; tratamiento: \emph{unificar con Buscar y reemplazar}.
  - |-
    Toda limpieza sigue el patrón \textbf{``identifica $\to$ decide $\to$ documenta''}: nunca corrijas sin haber decidido conscientemente qué hacer, y nunca decidas sin documentar. La bitácora tiene 4 columnas: \emph{Qué encontré} / \emph{Qué hice} / \emph{Por qué} / \emph{Cuántas celdas afectadas}. Sin bitácora, otro analista (o tú mismo en 2 meses) no puede reproducir tu trabajo.
  - |-
    Lo esencial cabe en una regla: \emph{el original se conserva, la copia se limpia}. Nunca limpies sobre el archivo original. Duplica primero, renombra (\emph{``dataset\_limpio\_v1.xlsx''}), trabaja sobre la copia. Si te equivocas, puedes volver al original sin haber perdido información. Esa disciplina simple evita el 90\% de los desastres de análisis.
  - |-
    Algoritmo: (1) duplica el archivo y trabaja sobre la copia; (2) abre la bitácora antes de tocar nada; (3) atiende un tipo de problema a la vez (primero duplicados, después formato, después vacíos, después errores); (4) documenta cada cambio antes de pasar al siguiente; (5) guarda y verifica que la tabla siga teniendo el mismo número de columnas y el sentido original.
  anatomia:
    titulo: Anatomía de una bitácora bien hecha
    body: |-
      \textbf{Fecha:} cuándo se hizo el cambio. \\[1mm] \textbf{Qué encontré:} 1 frase describiendo el problema. \\[1mm] \textbf{Qué hice:} 1 frase con la decisión tomada. \\[1mm] \textbf{Por qué:} 1 frase con el criterio que justifica la decisión. \\[1mm] \textbf{Celdas afectadas:} cuántas filas o casillas se modificaron. \\[1mm] \textbf{Versión:} v1, v2, v3 (a medida que avanza la limpieza).
  errores_comunes: |-
    (1) Borrar la suciedad sin documentar: nadie puede reproducir tu análisis. (2) Trabajar sobre el archivo original: si te equivocas, perdiste el dato crudo. (3) Eliminar filas con vacíos sin preguntar si el vacío era legítimo: \emph{``sin teléfono''} puede ser un dato relevante, no un error. (4) Normalizar fechas \emph{``a ojo''} sin verificar que la columna tenga formato de fecha real. (5) Confundir limpieza con \emph{interpretación}: tu trabajo es dejar los datos limpios, no inventar valores donde no los hay.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía de la limpieza». \textbf{Formato:} 4 fichas, una por tipo de suciedad, cada una con: qué es + cómo se detecta + cómo se trata + 1 error frecuente. \textbf{Sabes que terminaste cuando} podrías explicar a un compañero qué hacer frente a cada tipo de suciedad sin consultar.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Limpia el dataset con bitácora} (30 min · individual). Hora de aplicar. Vas a duplicar el archivo sucio, abrir la bitácora, y atender los 4 tipos de problema uno por uno, documentando cada cambio. Entregas el dataset limpio y la bitácora completa.
  pilares:
  - |-
    Tu trabajo se descompone en 5 piezas: (1) duplicado del archivo (\emph{copia para limpiar}); (2) bitácora abierta antes de tocar nada; (3) limpieza de duplicados; (4) normalización de formatos; (5) tratamiento de vacíos y errores tipográficos. Cada paso con su entrada en la bitácora.
  - |-
    Sigue el patrón \textbf{``un tipo de problema a la vez''}: no mezcles tareas. Termina los duplicados antes de pasar a formatos. Termina formatos antes de pasar a vacíos. Esa disciplina evita perder el hilo y deja una bitácora ordenada.
  - |-
    Cada entrada de bitácora expresa una sola decisión, no tres. Si combinas \emph{``eliminé duplicados y normalicé fechas''} en una sola línea, otro lector no sabrá qué celdas fueron afectadas por cada cambio. Una decisión, una línea.
  - |-
    Algoritmo: (1) duplica archivo; (2) abre bitácora; (3) elimina duplicados $\to$ entrada en bitácora; (4) normaliza formatos $\to$ entrada en bitácora; (5) trata vacíos $\to$ entrada en bitácora; (6) corrige tipográficos $\to$ entrada en bitácora; (7) guarda como v\_limpio.
  checklist:
    titulo: Checklist antes de entregar el dataset limpio
    items: |-
      \checkbox Archivo duplicado: trabajé sobre copia, no sobre original. \\[1mm] \checkbox Bitácora con al menos 4 entradas (una por tipo de problema). \\[1mm] \checkbox Cada entrada con qué, cómo, por qué, cuántas celdas. \\[1mm] \checkbox Dataset limpio tiene mismas columnas y sentido que el original. \\[1mm] \checkbox Un compañero podría reproducir mi limpieza leyendo solo la bitácora.
  plantilla_guion: |-
    \textbf{Bitácora --- Limpieza del dataset [nombre]} \\[1mm] \textbf{Fecha.} \textit{2026-05-XX.} \\[1mm] \textbf{Entrada 1 (duplicados).} \textit{Qué encontré + qué hice + por qué + celdas afectadas.} \\[1mm] \textbf{Entrada 2 (formato).} \textit{Lo mismo.} \\[1mm] \textbf{Entrada 3 (vacíos).} \textit{Lo mismo.} \\[1mm] \textbf{Entrada 4 (tipográficos).} \textit{Lo mismo.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} Título: «Actividad 3 --- Bitácora de limpieza». \textbf{Formato:} 4 entradas (una por tipo) con qué + cómo + por qué + celdas afectadas. \textbf{Extensión:} 1 página de cuaderno. \textbf{Sabes que terminaste cuando} la bitácora permite que otro reproduzca el trabajo sin más explicación.
  producto_titulo: 1 dataset limpio + bitácora completa con 4 entradas
  criterios:
  - Archivo duplicado, original conservado intacto
  - Bitácora con al menos 4 entradas (duplicados, formato, vacíos, tipográficos)
  - Cada entrada documenta qué, cómo, por qué y celdas afectadas
  - Dataset limpio conserva las columnas y el sentido original
  - Un compañero podría reproducir la limpieza leyendo solo la bitácora
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Lo que se descarta sin nombrar deja de existir para quien lee el dato limpio.
    aplicacion: |-
      Cuando eliminas \emph{``duplicados''} pero la fila duplicada en realidad era una segunda compra del mismo cliente, descartas información real. Cuando rellenas vacíos con \emph{``0''} sin pensar, conviertes \emph{``no responde''} en \emph{``responde cero''}. La phronesis del analista exige nombrar siempre qué se descarta, qué se rellena y por qué, en la bitácora. Limpiar sin nombrar es manipular en silencio.
    pregunta_espejo: |-
      Cuando limpié, ¿qué decisiones tomé en silencio que un crítico podría discutir si las viera escritas? ¿Qué cambia si las nombro?
  estoico:
    autor: Marco Aurelio
    cita: |-
      La paciencia del oficio invisible es la base de toda obra que dura.
    aplicacion: |-
      Es tentador saltar la limpieza para llegar rápido al análisis. La sabiduría estoica recomienda lo contrario: \emph{quien apura la criba, dañará la cosecha}. El 70\% del tiempo en limpiar es regla del oficio, no defecto. Quien acepta esa paciencia entrena una virtud invisible que sustenta toda conclusión posterior.
    pregunta_espejo: |-
      ¿Resistí la tentación de saltar limpieza para llegar al gráfico bonito? ¿Qué calidad ganan mis conclusiones al haber cribado primero?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La integridad de los datos es la condición de toda verdad pública contemporánea.
    aplicacion: |-
      Reportes de salud, indicadores económicos, métricas educativas: toda decisión pública contemporánea descansa en datos que alguien limpió antes. Quien limpia datos no hace tarea menor: protege la integridad de la infoesfera. Tu bitácora es el equivalente civil del cuaderno del archivero del pueblo.
    pregunta_espejo: |-
      ¿Cuántas decisiones públicas leí esta semana sin preguntar quién limpió los datos detrás? ¿Qué garantía tengo de que esa limpieza tuvo bitácora?
compromiso: |-
  \textbf{Para la próxima semana.} Toma una tabla cotidiana \emph{ajena} (gastos del hogar, lista de asistencia de un grupo, libreta de un comerciante del barrio). Identifica los 4 tipos de suciedad y propón cómo la limpiarías \textbf{sin tocarla}. La phronesis se entrena también en ver el oficio antes de ejecutarlo.

titulo: Limpieza de datos --- el oficio del archivero
producto_final: |-
  1 dataset "sucio" (provisto por el docente o descargado de un portal abierto) limpiado por el estudiante: duplicados eliminados, formatos normalizados, vacíos corregidos, errores señalados, con bitácora de qué se cambió
saber_ancestral_idea: |-
  La criba de granos antes de cocinar --- separar la semilla buena de la mala, de las piedras, del polvo --- es el mismo gesto que limpiar datos. Sin esa criba, lo que cocinas se daña; sin limpieza de datos, lo que concluyes es falso. El oficio paciente del archivero rural sigue siendo necesario hoy.

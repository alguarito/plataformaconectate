clave: 3-7
grado: 9
periodo: 3
sesion: 7
completo: true
duracion_min: 90
titulo: Limpieza de datos --- el oficio del archivero
titulo_portada: |-
  Limpieza de datos ---
  el oficio
  del archivero
producto_final: |-
  Un conjunto de datos sucio, limpiado sobre una copia y con el original intacto: duplicados resueltos, formatos normalizados, vacíos decididos y errores de escritura corregidos. Lo acompaña la bitácora con al menos cuatro entradas, cada una diciendo qué encontraste, qué decidiste, por qué y a qué celdas afectó. La prueba: otra persona podría repetir tu limpieza leyendo solo la bitácora.
apertura:
  origen: Censo poblacional de comunidades indígenas · quien no queda en la lista no existe para el reparto
  fuente: |-
    Agencia Nacional de Tierras, Dirección de Asuntos Étnicos. (2023). \emph{Instructivo: levantamiento y diligenciamiento del formato de censo poblacional para comunidades indígenas} (ACCTI-I-021, versión 1).
  saber_ancestral: |-
    Cuando una comunidad indígena va a constituir o ampliar un resguardo, hay que levantar un \textbf{censo poblacional}. Conviene decir qué es exactamente: un procedimiento del Estado hecho con la comunidad, no una práctica ancestral. El instructivo lo define como una fotografía de la realidad de una comunidad en un tiempo y un espacio específicos. Se levanta persona por persona, con apoyo de miembros del cabildo, profesores y líderes, y después funcionarios lo verifican. Y aquí está lo que importa para hoy: la tierra se distribuye conforme al censo realizado. Eso convierte una lista en algo muy serio. La \textbf{cara de exclusión} cabe en una frase: quien no queda en la lista el día del censo no existe para el reparto. Un dato mal escrito, un nombre repetido o una casilla vacía no son errores de forma. Son alguien que aparece dos veces o alguien que no aparece.
  saber_contemporaneo: |-
    Un conjunto de datos se ensucia de cuatro maneras y cada una tiene su tratamiento. \textbf{Duplicados}: filas que repiten información. Se elimina la copia, se conserva el original y se anota. \textbf{Formatos inconsistentes}: la misma fecha escrita de tres modos, o mayúsculas mezcladas. Se elige un formato y se normaliza todo. \textbf{Vacíos}: se decide si se completan, se marcan con un valor explícito o se descarta la fila, y se dice cuál de las tres. \textbf{Errores de escritura}: nombres mal tecleados que parten en dos lo que era uno. El método es siempre el mismo: identificar, decidir y documentar, en ese orden. Nunca se corrige sin haber decidido, y nunca se decide sin dejar constancia. Y hay una regla que no se negocia: el original se conserva, la copia se limpia. Lo que se borra sin registro no se puede recuperar ni discutir.
  pregunta_puente: |-
    En un censo, quien queda fuera de la lista no existe para el reparto. En tu conjunto de datos, ¿qué desaparece cada vez que borras una fila sin anotarlo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los cuatro tipos de suciedad en un conjunto de datos que no habías visto antes; (2) \textbf{explicar} qué tratamiento pide cada uno y por qué la decisión va antes que la corrección; (3) \textbf{aplicar} la limpieza sobre una copia y documentarla para que otro pueda repetirla.
puentes:
  a_ruta: |-
    En las sesiones anteriores recogiste datos, los pusiste en forma, calculaste y graficaste. Hoy trabajas la parte que se lleva la mayor parte del tiempo de cualquiera que trabaje con datos y que casi nunca se enseña. En la sesión 8 miras gráficos que engañan.
  a_escuta: |-
    Antes de la teoría vas a abrir un archivo sucio sin instrucciones y a buscar qué está mal. Descubrir la suciedad solo es la mitad del oficio.
  a_sistematizacion: |-
    Ya la encontraste. Ahora vas a ordenarla en cuatro tipos y a decidir el tratamiento de cada uno antes de tocar nada.
  a_praxis: |-
    Tienes el método. Toca limpiar de verdad, sobre una copia y con la bitácora abierta desde el primer cambio.
  a_producto: |-
    Lo que entregas hoy: el archivo limpio y su bitácora. La prueba de calidad: un compañero repite tu limpieza leyendo solo la bitácora.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Borrar sin dejar constancia no es limpiar: es hacer desaparecer.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre lo que calla un registro: Dussel sobre la lengua que se comprende por lo que calla, Séneca sobre la demora como remedio, Floridi sobre cribar los datos valiosos.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Descubre la suciedad} (15 min · individual). (1) Abre el archivo sucio que reparte tu docente, sin instrucciones sobre qué buscar. (2) Cuenta cuántas filas parecen repetidas. (3) Busca cuántos formatos distintos de fecha aparecen. (4) Cuenta las celdas vacías y mira si se concentran en alguna columna. (5) Busca nombres escritos de dos maneras que en realidad son el mismo. (6) Anota cuál de los cuatro problemas te costó más ver.
  checks:
  - Conté duplicados, formatos de fecha y celdas vacías.
  - Encontré al menos un nombre escrito de dos maneras.
  - Anoté cuál problema me costó más ver.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Descubre la suciedad». \textbf{Formato:} tabla de 4 filas y 3 columnas (tipo de suciedad / cuántos encontré / dónde se concentran), con marca en el que costó más ver. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} los cuatro tipos tienen un número, aunque alguno sea cero.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Los cuatro tipos y su tratamiento} (20 min · parejas). (1) Con tu pareja, escriban los cuatro tipos con una frase propia cada uno. (2) Escriban el tratamiento de cada uno antes de tocar el archivo. (3) Discutan los vacíos: decidan para cada columna si se completan, se marcan o se descarta la fila, y escriban por qué. (4) Anoten qué se perdería si borraran las filas incompletas sin avisar.
  pilares:
  - |-
    \textbf{Duplicados.} Filas que repiten información. Se elimina la copia y se conserva el original, siempre con nota. Cuidado con los falsos duplicados: dos personas distintas pueden llamarse igual.
  - |-
    \textbf{Formatos y errores de escritura.} La misma fecha escrita de tres modos, o un nombre tecleado de dos maneras, parten en dos lo que era uno. Al normalizar suele bajar el número de categorías, y esa bajada es la señal de que funcionó.
  - |-
    \textbf{Los vacíos son una decisión, no un accidente.} Se completan, se marcan con un valor explícito o se descarta la fila. Las tres opciones son válidas; lo que no vale es no elegir y dejar que otro adivine.
  - |-
    \textbf{Identificar, decidir, documentar.} En ese orden. Nunca se corrige sin haber decidido, y nunca se decide sin dejar constancia. El original se conserva y la copia se limpia.
  anatomia:
    titulo: Los cuatro tipos de suciedad
    body: |-
      \textbf{Duplicados:} eliminar la copia, conservar el original. \\[1mm] \textbf{Formatos:} elegir uno y normalizar todo. \\[1mm] \textbf{Vacíos:} completar, marcar o descartar, y decirlo. \\[1mm] \textbf{Escritura:} unificar lo que era lo mismo. \\[1mm] \textbf{Regla:} original intacto, copia limpia, bitácora abierta.
  errores_comunes: |-
    (1) \textbf{Limpiar sobre el original}: sin copia no hay vuelta atrás. (2) \textbf{Borrar filas incompletas en bloque}: se van casos reales sin que nadie sepa cuántos. (3) \textbf{Eliminar duplicados sin mirar}: dos personas pueden llamarse igual. (4) \textbf{Corregir sin documentar}: al día siguiente nadie recuerda por qué ese dato cambió. (5) \textbf{Atender todo a la vez}: se resuelve un tipo de problema por pasada, o se pierde el hilo.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Los cuatro tipos y su tratamiento». \textbf{Formato:} los cuatro tipos con frase propia, su tratamiento decidido antes de tocar nada y la decisión sobre los vacíos columna por columna. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} cada columna con vacíos tiene su decisión escrita.
praxis:
  intro: |-
    \textbf{Actividad 3 · APLICA --- Limpia con bitácora} (30 min · individual). (1) Duplica el archivo y trabaja solo sobre la copia. (2) Abre la bitácora antes de tocar el primer dato. (3) Resuelve los duplicados y anota cuántos eran y cuáles conservaste. (4) Normaliza los formatos y anota cuál elegiste. (5) Resuelve los vacíos según lo decidido y anota la regla que aplicaste. (6) Unifica los errores de escritura y pásale la bitácora a un compañero para que repita tu limpieza.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas.} El original intacto. La copia limpia. Y la bitácora, con al menos cuatro entradas, una por tipo de suciedad.
  - |-
    \textbf{Cada entrada responde cuatro cosas.} Qué encontraste, qué decidiste, por qué y a qué celdas afectó. Sin la tercera no se puede discutir la decisión; sin la cuarta no se puede deshacer.
  - |-
    \textbf{Un tipo de problema por pasada.} Primero duplicados, después formatos, después vacíos, después escritura. Mezclarlos hace que un cambio tape a otro y que la bitácora deje de cuadrar.
  - |-
    \textbf{La prueba es que otro pueda repetirla.} Si tu compañero, con la bitácora en la mano y el archivo original, llega al mismo resultado, está bien documentada. Si tiene que preguntarte algo, falta una línea.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox El archivo original quedó intacto. \\[1mm] \checkbox La limpieza se hizo sobre una copia. \\[1mm] \checkbox Bitácora con al menos cuatro entradas, una por tipo. \\[1mm] \checkbox Cada entrada dice qué, qué decidí, por qué y qué celdas. \\[1mm] \checkbox Las columnas y el sentido del original se conservan. \\[1mm] \checkbox Un compañero repitió la limpieza leyendo solo la bitácora.
  plantilla_guion: |-
    \textbf{Qué encontré.} \textit{Tipo de suciedad y cuántos casos.} \\[1mm] \textbf{Qué decidí.} \textit{El tratamiento elegido.} \\[1mm] \textbf{Por qué.} \textit{La razón, en una línea.} \\[1mm] \textbf{Qué celdas.} \textit{Columnas y filas afectadas.} \\[1mm] \textbf{Prueba.} \textit{Quién repitió la limpieza y si llegó al mismo resultado.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · APLICA).} \textbf{Título:} «Actividad 3 --- Limpia con bitácora». \textbf{Formato:} las cuatro entradas de la bitácora completas y la nota de quién repitió la limpieza y con qué resultado. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} un compañero llegó al mismo resultado con la bitácora sola.
  producto_titulo: Conjunto de datos limpio sobre copia + bitácora reproducible de cuatro entradas
  criterios:
  - El archivo original quedó intacto y la limpieza se hizo sobre una copia
  - La bitácora tiene al menos cuatro entradas, una por tipo de suciedad
  - Cada entrada dice qué encontraste, qué decidiste, por qué y a qué celdas afectó
  - El conjunto limpio conserva las columnas y el sentido del original
  - Un compañero repitió la limpieza leyendo solo la bitácora
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.2.4.4
    cita: |-
      Hay lengua cotidiana (la de todos los días), lengua de culturas ilustradas, de cultura de masas, lengua de cultura popular… lengua política (que se comprende no por lo que dice sino por lo que calla, contra quién lo dice, cuándo y por qué…).
    aplicacion: |-
      Un conjunto de datos también se comprende por lo que calla. Las celdas vacías no son ruido: dicen a quién no se le preguntó, o quién no quiso contestar. Anotarlas es lo que impide que ese silencio se pierda.
    pregunta_espejo: |-
      ¿Qué calla mi tabla, y estoy documentando ese silencio o borrándolo?
  estoico:
    autor: Séneca · Sobre la ira, II, 29 (c. 45 d.C.)
    cita: |-
      El mayor remedio para la ira es la demora. (trad. propia)
    aplicacion: |-
      Con la limpieza pasa lo mismo. La tentación es borrar de una todas las filas incompletas y seguir. Esperar el minuto que toma decidir qué hacer con ellas es lo que separa limpiar de hacer desaparecer.
    pregunta_espejo: |-
      ¿Qué borré de un tirón alguna vez y después necesité de vuelta?
  floridi:
    autor: Luciano Floridi · Big data and their epistemological challenge (2012)
    cita: |-
      Necesitamos más y mejores técnicas y tecnologías para ver los pequeños patrones en los datos, pero necesitamos más y mejor epistemología para cribar los valiosos. (trad. propia)
    aplicacion: |-
      Las herramientas encuentran duplicados en un segundo. Decidir si dos filas iguales son un error o dos personas que se llaman igual no lo resuelve ninguna herramienta: lo resuelve quien conoce los datos.
    pregunta_espejo: |-
      ¿Qué decisión de mi limpieza no habría podido tomar un programa por mí?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con la copia limpia, el original intacto y la bitácora. Pídele a un compañero que repita tu limpieza y anota dónde se atascó. En la sesión 8 vas a auditar gráficos que engañan, y un dato mal limpiado es la mitad de un gráfico falso.
web:
  resumen: |-
    Cuando una comunidad indígena constituye o amplía un resguardo, la tierra se distribuye conforme al censo realizado: quien no queda en la lista ese día no existe para el reparto. Hoy limpias un conjunto de datos sucio y aprendes por qué borrar sin dejar constancia no es limpiar, sino hacer desaparecer.
  subtema: Datos · El oficio de limpiar
  pre_lectura:
    por_que_importa: |-
      Un nombre repetido o una casilla vacía no son errores de forma. Son alguien que aparece dos veces o alguien que no aparece.
    pregunta_detonante: |-
      ¿Qué le pasaría a tu tabla si borraras hoy todas las filas incompletas y mañana te preguntaran cuántas eran?
    activacion:
      titulo: Dos veces el mismo
      descripcion: |-
        En 2 minutos, mira una lista que tengas, de contactos o de gastos. Busca algo escrito de dos maneras que en realidad sea lo mismo.
      duracion_min: 3
    conexion:
      anterior: En la sesión 6 graficaste los datos y viste cómo cambia la lectura según el gráfico.
      siguiente: En la sesión 8 auditas gráficos engañosos y aprendes los cinco trucos más comunes.
  mapa_ruta:
    - numero: 1
      iconos: ["🌱"]
      titulo: Quien no está en la lista
      duracion_min: 10
    - numero: 2
      iconos: ["👁"]
      titulo: Actividad 1 · Descubre la suciedad
      duracion_min: 15
    - numero: 3
      iconos: ["📖"]
      titulo: Actividad 2 · Los cuatro tipos y su tratamiento
      duracion_min: 20
    - numero: 4
      iconos: ["✏️"]
      titulo: Actividad 3 · Limpia con bitácora
      duracion_min: 30
    - numero: 5
      iconos: ["✅", "💭"]
      titulo: Verifica, tres citas y tu compromiso
      duracion_min: 15
  actividades:
    - numero: 1
      verbo: IDENTIFICA
      titulo: Descubre la suciedad
      tiempo_min: 15
      modalidad: individual
      pasos:
        - Abre el archivo sucio sin instrucciones sobre qué buscar.
        - Cuenta cuántas filas parecen repetidas y cuántos formatos de fecha aparecen.
        - Cuenta las celdas vacías y mira si se concentran en alguna columna.
        - Busca nombres escritos de dos maneras que sean el mismo.
        - Anota cuál de los cuatro problemas te costó más ver.
      cuaderno:
        titulo: Descubre la suciedad
        formato: tabla de 4 filas y 3 columnas (tipo de suciedad / cuántos encontré / dónde se concentran)
        extension: un tercio de página
      criterios:
        - Los cuatro tipos tienen un número, aunque alguno sea cero.
        - Está marcado el problema que costó más ver.
    - numero: 2
      verbo: EXPLICA
      titulo: Los cuatro tipos y su tratamiento
      tiempo_min: 20
      modalidad: parejas
      pasos:
        - Con tu pareja, escriban los cuatro tipos con una frase propia cada uno.
        - Escriban el tratamiento de cada uno antes de tocar el archivo.
        - Decidan para cada columna con vacíos si se completan, se marcan o se descarta la fila.
        - Anoten qué se perdería si borraran las filas incompletas sin avisar.
      cuaderno:
        titulo: Los cuatro tipos y su tratamiento
        formato: los cuatro tipos con frase propia, su tratamiento y la decisión sobre los vacíos por columna
        extension: media página
      criterios:
        - Cada columna con vacíos tiene su decisión escrita.
        - El tratamiento se decidió antes de tocar el archivo.
    - numero: 3
      verbo: APLICA
      titulo: Limpia con bitácora
      tiempo_min: 30
      modalidad: individual
      pasos:
        - Duplica el archivo y trabaja solo sobre la copia.
        - Abre la bitácora antes de tocar el primer dato.
        - Resuelve los duplicados y anota cuántos eran y cuáles conservaste.
        - Normaliza los formatos, resuelve los vacíos y unifica los errores de escritura.
        - Pásale la bitácora a un compañero para que repita tu limpieza.
      cuaderno:
        titulo: Limpia con bitácora
        formato: las cuatro entradas de la bitácora completas y la nota de quién repitió la limpieza
        extension: media página
      criterios:
        - Un compañero llegó al mismo resultado con la bitácora sola.
        - El original quedó intacto.
  conceptos_clave:
    - categoria: Los cuatro tipos
      termino: Duplicado
      definicion: |-
        Fila que repite información ya presente. Se elimina la copia y se conserva el original, siempre con nota.
      ejemplo: "Cuidado con los falsos duplicados: dos personas distintas pueden llamarse igual."
    - categoria: Los cuatro tipos
      termino: Formato inconsistente
      definicion: La misma información escrita de varias maneras. Se elige un formato y se normaliza todo el conjunto.
      ejemplo: Al normalizar suele bajar el número de categorías, y esa bajada indica que funcionó.
    - categoria: Los cuatro tipos
      termino: Vacío
      definicion: |-
        Celda sin dato. Es una decisión, no un accidente: se completa, se marca con un valor explícito o se descarta la fila.
      ejemplo: Lo que no vale es no elegir y dejar que otro adivine qué significaba ese hueco.
    - categoria: El método
      termino: Identificar, decidir, documentar
      definicion: El orden del oficio. Nunca se corrige sin haber decidido, y nunca se decide sin dejar constancia.
      ejemplo: Cada entrada de bitácora dice qué encontraste, qué decidiste, por qué y a qué celdas afectó.
    - categoria: El método
      termino: Original y copia
      definicion: |-
        El archivo original se conserva intacto y la limpieza se hace sobre una copia. Sin eso no hay vuelta atrás.
      ejemplo: Lo que se borra sin registro no se puede recuperar ni discutir después.
  cinco_dimensiones:
    personal: Aprendiste que decidir antes de corregir es lo que separa el oficio de la prisa.
    emocional: Limpiar es tedioso y no luce. También es donde se arruinan o se salvan semanas de trabajo ajeno.
    ciudadana: Un registro decide repartos reales. Quien no queda en la lista queda fuera de lo que la lista distribuye.
    local: El censo de un resguardo lo levantan el cabildo, los profesores y los líderes, persona por persona.
    intergeneracional: Una bitácora permite que alguien entienda dentro de años por qué un dato cambió, y no tenga que adivinar.
  post_lectura:
    reflexion: |-
      De los vacíos que resolviste, ¿en cuál te costó más decidir, y qué te habría hecho falta saber para decidir mejor?
    transferencia: |-
      Pídele a un compañero que repita tu limpieza con la bitácora en la mano. Anota dónde se atascó: ahí falta una línea.
    cierre: Borrar sin dejar constancia no es limpiar. Es hacer desaparecer, y después nadie sabe cuántos eran.
  quiz:
    titulo: ¿Sabes limpiar sin hacer desaparecer?
    instrucciones: Cinco preguntas sobre los cuatro tipos de suciedad y el método. No va al cuaderno.
    preguntas:
      - enunciado: ¿Por qué se limpia sobre una copia y no sobre el original?
        opciones:
          - Porque el archivo original suele venir protegido contra la escritura directa.
          - Porque los programas trabajan más rápido con archivos duplicados.
          - Porque sin original no hay vuelta atrás si una decisión resulta mala.
          - Porque así se pueden comparar los dos archivos en pantalla a la vez.
        respuesta_index: 2
        feedback_correcto: Sí. Lo que se borra sin registro no se puede recuperar ni discutir.
        feedback_incorrecto: Porque sin el original no se puede deshacer una decisión equivocada.
      - enunciado: Encuentras dos filas idénticas con el mismo nombre. ¿Qué haces?
        opciones:
          - Eliminas una de inmediato, porque es claramente un duplicado.
          - Compruebas si son la misma persona antes de eliminar.
          - Dejas las dos filas, porque al eliminar siempre se pierde algo de información.
          - Las combinas en una sola fila con los datos de ambas.
        respuesta_index: 1
        feedback_correcto: Correcto. Dos personas distintas pueden llamarse igual, y eso es un falso duplicado.
        feedback_incorrecto: Se comprueba antes. Eliminar sin mirar es el modo más fácil de perder un caso real.
      - enunciado: ¿Qué significa que un vacío sea una decisión y no un accidente?
        opciones:
          - Que alguien decidió no responder esa pregunta a propósito.
          - Que el programa lo generó al importar el archivo.
          - Que hay que completarlo siempre con un valor estimado.
          - Que tú eliges si completarlo, marcarlo o descartar la fila, y lo dices.
        respuesta_index: 3
        feedback_correcto: Eso es. Las tres opciones son válidas; lo que no vale es no elegir.
        feedback_incorrecto: Que quien limpia elige qué hacer con él y lo deja escrito. No elegir también es una decisión, pero muda.
      - enunciado: ¿Qué debe contener cada entrada de la bitácora?
        opciones:
          - Qué encontraste, qué decidiste, por qué y qué celdas.
          - La hora exacta en que se hizo cada uno de los cambios del archivo.
          - El nombre del programa con el que se hizo la limpieza.
          - Una captura de pantalla del archivo antes de tocarlo.
        respuesta_index: 0
        feedback_correcto: Sí. Sin el «por qué» no se puede discutir la decisión; sin las celdas no se puede deshacer.
        feedback_incorrecto: "Las cuatro cosas: qué, qué decidí, por qué y qué celdas. Lo demás es opcional."
      - enunciado: En un censo para constituir un resguardo, ¿qué pasa con quien no queda en la lista?
        opciones:
          - Puede inscribirse más adelante mediante un trámite administrativo ordinario.
          - Queda registrado igual en el sistema del cabildo.
          - No existe para el reparto, porque la tierra se distribuye conforme al censo.
          - Se le asigna una porción menor de la tierra disponible.
        respuesta_index: 2
        feedback_correcto: Correcto, y por eso un nombre mal escrito no es un error de forma.
        feedback_incorrecto: No existe para el reparto. La tierra se distribuye conforme al censo realizado.

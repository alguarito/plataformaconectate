clave: 3-8
grado: 9
periodo: 3
sesion: 8
completo: true
duracion_min: 90
titulo: Visualización honesta --- gráficos que mienten
titulo_portada: |-
  Visualización honesta ---
  gráficos
  que mienten
producto_final: |-
  La auditoría de tres gráficos reales tomados de prensa, redes o publicidad, cada uno con su captura y su fuente. De cada uno se nombra el truco usado de la lista de cinco, se explica con lo que se ve en la imagen y se dice qué decisión cambiaría si alguien lo creyera. Se cierra con la versión honesta de cada gráfico, hecha con los mismos datos.
apertura:
  origen: Feria de Cartago y Fiestas del Calado de Ansermanuevo · lo que se muestra y lo que se hace
  fuente: |-
    Alcaldía de Cartago. (2021, 9 de agosto). \emph{Cartago celebra 481 años de fundación}. Municipio de Cartago Valle.
  saber_ancestral: |-
    Cada agosto Cartago celebra su aniversario, con misa en la catedral, ofrenda floral y sesión solemne del Concejo (Alcaldía de Cartago, 2021). Un detalle que casi nadie menciona: la fundación de 1540 ocurrió donde hoy está Pereira. A pocos kilómetros, Ansermanuevo celebra a mediados del mismo mes sus \textbf{Fiestas del Calado y el Bordado}. Se llama a sí misma cuna del calado y el bordado. Dos pueblos vecinos, dos ferias en el mismo mes, y en ambas la misma escena: en la feria uno se pone lo mejor que tiene. La pregunta incómoda viene después. ¿Lo mejor que tiene es lo que hace o lo que compra? No se trata de juzgar a nadie por cómo se presenta. Se trata de notar que presentarse es una decisión, y que la presentación puede coincidir con lo que hay detrás o puede taparlo. Un gráfico hace exactamente eso: presenta.
  saber_contemporaneo: |-
    Un gráfico engañoso casi nunca miente con los números. Miente con la selección y con la presentación, y por eso es difícil de atrapar. Hay cinco trucos que cubren casi todos los casos. \textbf{Eje cortado}: el eje vertical no arranca en cero y una diferencia pequeña parece enorme. \textbf{Escala torcida}: el espacio entre valores no es constante y aplana lo que crece. \textbf{Rango elegido}: se muestran solo los meses que convienen. \textbf{Categorías escondidas}: se dibujan tres barras y había siete. \textbf{Contexto omitido}: falta la cifra con la que habría que comparar. Y hay un procedimiento de diez segundos que atrapa la mayoría. Mira el eje vertical y comprueba si arranca en cero. Mira el rango de fechas. Cuenta las categorías visibles y pregúntate cuántas faltan. Y pregúntate qué cifra necesitarías para juzgar si eso es mucho o poco.
  pregunta_puente: |-
    En la feria uno se pone lo mejor que tiene, y eso no engaña a nadie porque todos saben que es una feria. ¿Cuándo un gráfico deja de presentarse y empieza a engañar?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} qué conclusión te empuja a sacar un gráfico antes de saber si es honesto; (2) \textbf{analizar} los cinco trucos y aplicar el chequeo de diez segundos; (3) \textbf{evaluar} tres gráficos reales, nombrar su truco y rehacerlos honestamente con los mismos datos.
puentes:
  a_ruta: |-
    En la sesión 6 hiciste gráficos y en la 7 limpiaste datos. Hoy miras el otro lado: qué pasa cuando alguien usa esas mismas herramientas para empujarte a una conclusión. En la sesión 9 conviertes datos en decisiones.
  a_escuta: |-
    Antes de la teoría vas a mirar tres gráficos sin que te digan que son engañosos. Lo que se te ocurra en esos primeros diez segundos es lo que le pasa a cualquier lector.
  a_sistematizacion: |-
    Ya viste tu propia reacción. Ahora vas a nombrar los cinco trucos y a aprender el chequeo que los atrapa en diez segundos.
  a_praxis: |-
    Tienes el método. Toca salir a buscar gráficos reales y rehacerlos honestamente con sus propios datos.
  a_producto: |-
    Lo que entregas hoy: tres auditorías y tres versiones honestas. La prueba de calidad: cada truco se demuestra señalando la imagen, no sospechando.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un gráfico bien hecho respeta al lector; uno torcido cuenta con que no va a mirar el eje.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre presentar y aparentar: Dussel sobre una estética más allá de la publicidad, Marco Aurelio sobre ser en vez de discutirlo, Floridi sobre la abundancia que distrae.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Mira sin sospechar} (15 min · individual). (1) Tu docente proyecta tres gráficos reales, sin decir si tienen algo raro. (2) Para cada uno, escribe qué pregunta parece responder. (3) Escribe qué conclusión sacaste en los primeros diez segundos. (4) Ahora míralos otra vez con calma y anota si cambiarías esa conclusión. (5) Marca en cuál cambió más entre la primera y la segunda mirada.
  checks:
  - Anoté la conclusión de los primeros diez segundos en los tres.
  - Volví a mirarlos con calma y anoté si cambió.
  - Marqué en cuál cambió más.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} \textbf{Título:} «Actividad 1 --- Mira sin sospechar». \textbf{Formato:} tabla de 3 filas y 3 columnas (gráfico / conclusión a los diez segundos / conclusión con calma), con marca en el que más cambió. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} las tres filas tienen las dos conclusiones escritas.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · ANALIZA --- Los cinco trucos} (20 min · parejas). (1) Con tu pareja, escriban los cinco trucos con una frase propia cada uno. (2) Vuelvan a los tres gráficos y busquen cuál truco usa cada uno. (3) Apliquen el chequeo de diez segundos y anoten qué encontró cada paso. (4) Escriban qué decisión cambiaría si alguien creyera el gráfico tal como está.
  pilares:
  - |-
    \textbf{Los cinco trucos.} Eje cortado, escala torcida, rango elegido, categorías escondidas y contexto omitido. Casi todos los gráficos engañosos usan uno de esos cinco, y muchos usan dos a la vez.
  - |-
    \textbf{El chequeo de diez segundos.} Mira si el eje vertical arranca en cero. Mira el rango de fechas. Cuenta las categorías visibles. Pregúntate qué cifra falta para saber si eso es mucho o poco.
  - |-
    \textbf{Casi nunca mienten con los números.} Mienten con la selección y con la presentación. Por eso no sirve pedir que «pongan datos reales»: los datos suelen ser reales y aun así el gráfico empuja a una conclusión falsa.
  - |-
    \textbf{Se demuestra señalando, no sospechando.} «Este gráfico se ve raro» no es una auditoría. «El eje arranca en 48 y no en cero, y por eso una diferencia de dos puntos ocupa media pantalla» sí lo es.
  anatomia:
    titulo: El chequeo de diez segundos
    body: |-
      \textbf{1. Eje vertical:} ¿arranca en cero? \\[1mm] \textbf{2. Fechas:} ¿qué rango muestra y cuál omite? \\[1mm] \textbf{3. Categorías:} ¿cuántas se ven y cuántas había? \\[1mm] \textbf{4. Contexto:} ¿con qué cifra habría que comparar?
  errores_comunes: |-
    (1) \textbf{Auditar por sospecha}: sin señalar qué elemento produce el efecto, no hay argumento. (2) \textbf{Creer que el truco está en los números}: casi siempre está en la selección. (3) \textbf{Olvidar el rango de fechas}: es el truco más común y el que menos se mira. (4) \textbf{Confundir feo con engañoso}: un gráfico mal hecho puede ser honesto. (5) \textbf{Rehacerlo con otros datos}: la versión honesta usa los mismos datos, o no demuestra nada.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} \textbf{Título:} «Actividad 2 --- Los cinco trucos». \textbf{Formato:} los cinco trucos con frase propia, el truco de cada uno de los tres gráficos y los cuatro pasos del chequeo con lo que encontró cada uno. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} cada truco identificado señala un elemento visible del gráfico.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA --- Auditoría de tres gráficos} (30 min · individual). (1) Busca tres gráficos reales en prensa, redes, publicidad o un libro. (2) Guarda la captura y la fuente de cada uno. (3) Nombra el truco de cada uno usando la lista de cinco. (4) Explica el truco señalando qué se ve en la imagen, con números. (5) Escribe qué decisión cambiaría si alguien lo creyera. (6) Rehaz cada gráfico de forma honesta, con los mismos datos, y ponlos lado a lado.
  pilares:
  - |-
    \textbf{Tu entrega tiene tres piezas por gráfico.} La captura con su fuente. La auditoría con el truco señalado. Y la versión honesta hecha con los mismos datos.
  - |-
    \textbf{La fuente es obligatoria.} Un gráfico sin origen no se puede auditar ni discutir. Si no encuentras de dónde salió, ya tienes un hallazgo, pero busca otro para auditar.
  - |-
    \textbf{La versión honesta usa los mismos datos.} Si cambias las cifras, no demostraste nada. Lo que cambias es el eje, el rango, las categorías visibles o el contexto que añades.
  - |-
    \textbf{Di qué decisión cambiaría.} Es lo que separa un ejercicio de una auditoría. «Alguien podría creer que el problema se duplicó cuando subió dos puntos» tiene consecuencias; «está mal hecho» no las tiene.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox Tres gráficos reales con captura y fuente verificable. \\[1mm] \checkbox Tres trucos nombrados con la lista de cinco. \\[1mm] \checkbox Cada truco señalado en la imagen, con números. \\[1mm] \checkbox Tres versiones honestas con los mismos datos. \\[1mm] \checkbox Cada uno dice qué decisión cambiaría. \\[1mm] \checkbox Ningún argumento se apoya solo en que «se ve raro».
  plantilla_guion: |-
    \textbf{Gráfico.} \textit{Fuente y fecha.} \\[1mm] \textbf{Truco.} \textit{Cuál de los cinco.} \\[1mm] \textbf{Prueba.} \textit{Qué se ve en la imagen, con números.} \\[1mm] \textbf{Consecuencia.} \textit{Qué decisión cambiaría.} \\[1mm] \textbf{Versión honesta.} \textit{Mismos datos, qué cambié.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA).} \textbf{Título:} «Actividad 3 --- Auditoría de tres gráficos». \textbf{Formato:} los tres con fuente, truco, prueba señalada, consecuencia y el boceto de la versión honesta. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} cada truco está probado con un número de la imagen.
  producto_titulo: Tres gráficos auditados con su truco probado + tres versiones honestas
  criterios:
  - Los tres gráficos son reales y tienen captura y fuente verificable
  - Cada truco está nombrado con la lista de cinco
  - Cada truco se prueba señalando qué se ve en la imagen, con números
  - Las tres versiones honestas usan los mismos datos del original
  - Cada auditoría dice qué decisión cambiaría si alguien creyera el gráfico
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §4.2.9.3
    cita: |-
      El arte popular es el arte primero, la suprema expresión de la estética. Se da en la vida cotidiana, en la música, la danza, la pintura, en el teatro… Es necesario formular una estética popular más allá de la publicidad y la moda.
    aplicacion: |-
      Un gráfico también es una pieza estética, y por eso convence antes de que uno lo lea. La diferencia entre presentar y persuadir es la misma que hay entre ponerse lo mejor que uno tiene y aparentar lo que no se tiene.
    pregunta_espejo: |-
      ¿Cuándo he elegido un gráfico porque se veía impresionante y no porque mostrara mejor el dato?
  estoico:
    autor: Marco Aurelio · Meditaciones X, 16 (c. 175 d.C.)
    cita: |-
      De hoy más, déjate absolutamente de disputar cuál conviene que sea un hombre bueno, sino procura ser tal en realidad.
    aplicacion: |-
      Con los gráficos igual. No se trata de escribir que el tuyo es honesto: se trata de que el eje arranque en cero y de que el rango de fechas sea el completo. La honestidad de un gráfico se ve en el gráfico.
    pregunta_espejo: |-
      ¿Qué elemento de mi último gráfico no resistiría el chequeo de diez segundos?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 2.3
    cita: |-
      La abundancia de información también puede producir sobrecarga cognitiva, distracción y amnesia (el presente olvidadizo). (trad. propia)
    aplicacion: |-
      Los gráficos engañosos viven de eso. Nadie tiene tiempo de auditar cada imagen que pasa, y el truco cuenta con esa prisa. Por eso el chequeo tiene que caber en diez segundos: si no cabe, nadie lo va a hacer.
    pregunta_espejo: |-
      ¿Cuántos gráficos vi esta semana, y a cuántos les miré el eje?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con las tres auditorías y las versiones honestas. Cuando veas un gráfico esta semana, hazle el chequeo de diez segundos antes de creerlo. En la sesión 9 conviertes tus propios datos en decisiones.
web:
  resumen: |-
    En la Feria de Cartago y en las Fiestas del Calado de Ansermanuevo uno se pone lo mejor que tiene, y la pregunta incómoda es si lo mejor que tiene es lo que hace o lo que compra. Un gráfico presenta igual. Hoy aprendes los cinco trucos con que un gráfico dice una verdad parcial, y el chequeo de diez segundos que los atrapa.
  subtema: Datos · Lectura crítica visual

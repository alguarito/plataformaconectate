titulo: Visualización honesta --- gráficos que mienten
producto_final: |-
  Análisis crítico de 3 gráficos engañosos (de prensa, redes o publicidad real) explicando qué truco usa cada uno (eje cortado, escala torcida, color sesgado, contexto omitido) + versión corregida del mismo dato
saber_ancestral_idea: |-
  El comerciante tramposo de la plaza ajustaba la balanza para sumar gramos en su favor. El gráfico tramposo hace lo mismo con la información: ajusta la escala para que parezca lo que no es. Aprender a detectar gráficos engañosos hoy es lo mismo que la abuela enseñaba al revisar la pesa de la plaza --- desconfianza educada.
verbos_actividades:
- IDENTIFICA
- ANALIZA
- EVALÚA
- CREA

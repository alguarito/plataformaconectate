clave: 3-8
grado: 9
periodo: 3
sesion: 8
completo: true
titulo: Visualización honesta --- gráficos que mienten
titulo_portada: |-
  Visualización honesta ---
  gráficos
  que mienten
producto_final: Análisis crítico de 3 gráficos engañosos reales (de prensa, redes o publicidad) explicando qué truco usa cada uno (eje cortado, escala torcida, color sesgado, contexto omitido) acompañado de versión corregida del mismo dato presentada de forma honesta
apertura:
  saber_ancestral: |-
    El \textbf{comerciante tramposo de la plaza} ajustaba la balanza para que sumara gramos en su favor: un kilo de yuca pesaba en realidad 900 gramos, pero la balanza decía \emph{``un kilo''}. La \textbf{abuela del Valle del Cauca} enseñaba a sus nietas a \emph{verificar la pesa antes de pagar}: pedir el grano en bolsa propia, revisar el fiel de la balanza, no fiarse del precio sin chequear el peso. Esa \textbf{desconfianza educada} es lo mismo que necesita el ciudadano contemporáneo frente a un gráfico: \emph{verificar antes de creer}. Un gráfico tramposo hace con la información lo que la balanza tramposa hacía con los granos.
  origen: Balanza de la plaza, desconfianza educada de la abuela del Valle del Cauca
  saber_contemporaneo: |-
    Un \textbf{gráfico engañoso} no es necesariamente falso: es un gráfico que dice una verdad parcial con técnica visual que orienta al lector a una conclusión exagerada o equivocada. Los 5 trucos más comunes son: (1) \textbf{eje Y cortado} (no arranca en cero) que exagera diferencias; (2) \textbf{escala logarítmica oculta} que reduce visualmente grandes diferencias; (3) \textbf{color sesgado} (rojo para lo que se quiere criticar, verde para lo que se quiere alabar); (4) \textbf{contexto omitido} (mostrar el último mes sin los 12 anteriores); (5) \textbf{cherry picking} (mostrar solo las categorías que apoyan la tesis y ocultar el resto). Detectar estos trucos es alfabetización ciudadana del XXI.
  pregunta_puente: |-
    ¿Cómo enseñaba la abuela a sus nietas a no dejarse engañar en la plaza? ¿Y qué pierde un ciudadano novato cuando comparte en redes un gráfico bonito sin haber verificado si el eje Y arranca en cero?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} los 5 trucos visuales más usados en gráficos engañosos; (2) \textbf{analizar} 3 gráficos reales de prensa o redes y descubrir qué truco usa cada uno; (3) \textbf{evaluar} qué tan grave es cada engaño (qué decisión cambiaría el lector con la versión honesta); (4) \textbf{crear} la versión corregida de cada gráfico para mostrar el mismo dato de forma honesta.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. La sesión 6 te enseñó a hacer gráficos honestos; hoy aprendes a \emph{detectar} los gráficos deshonestos. Es la otra mitad del oficio visual: producir bien y leer críticamente. Sin esta segunda mitad, la primera queda incompleta.
  a_escuta: |-
    Antes de teorizar, vas a mirar 3 gráficos reales (de prensa colombiana o publicidad) y a decir qué entendiste de cada uno sin saber que tienen truco. Después se revelan los trucos y comparas tu lectura inicial con la versión honesta.
  a_sistematizacion: |-
    Ya viste el contraste. Ahora vas a entender la \textbf{anatomía} de los 5 trucos típicos: cómo funcionan, qué efecto producen, cómo detectarlos en 5 segundos, qué exigir al diseñador honesto.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: 3 gráficos engañosos reales, cada uno con análisis del truco, evaluación de gravedad y versión corregida (puede ser boceto a mano o gráfico hecho en Excel sobre el mismo dato). Producto crítico, no decorativo.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 3 gráficos engañosos + 3 análisis del truco + 3 versiones corregidas. El criterio principal: que cada análisis nombre \textbf{qué decisión cambiaría el lector} al ver la versión corregida.
  a_evaluacion: |-
    Antes de cerrar, mira los gráficos engañosos desde las cinco dimensiones humanas. Detectar engaños es defensa civil; producir engaños es daño cívico aunque sea legal.
  a_triangulo: |-
    Y para terminar, tres voces sobre la honestidad visual. Dussel sobre la imagen que excluye a los pobres del análisis, Epicteto sobre la disciplina de verificar antes de creer, Floridi sobre la integridad visual como infraestructura democrática.
escuta:
  escena: |-
    \textbf{Actividad 1 · IDENTIFICA --- Mira sin sospechar} (15 min · individual). El docente proyecta 3 gráficos reales (capturas de prensa o redes, sin atribuirlos como \emph{``engañosos''}). Para cada uno responde: \emph{¿qué pregunta parece responder?}, \emph{¿qué conclusión sacarías?}, \emph{¿qué decisión tomarías si fueras alcalde, padre de familia o consumidor?}. \textbf{No analices todavía} si hay truco: responde como cualquier lector apurado.
  checks:
  - Para cada gráfico, anoté qué pregunta parecía responder.
  - Para cada gráfico, anoté qué conclusión saqué sin sospechar.
  - Para cada gráfico, anoté qué decisión tomaría como ciudadano.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1 --- Mira sin sospechar». \textbf{Formato:} tabla 3 filas (un gráfico por fila) × 3 columnas (Pregunta que parece responder~|~Conclusión sin sospechar~|~Decisión que tomaría). \textbf{Sabes que terminaste cuando} reconoces que un gráfico te empujó a una conclusión rápida que después podría no sostenerse.
sistematizacion:
  intro: |-
    Los 5 trucos visuales más comunes se descomponen y se detectan en segundos si sabes qué buscar. Vamos a aprender la \emph{lista de chequeo} del lector crítico.
  pilares:
  - |-
    Los 5 trucos se descomponen así: (1) \textbf{Eje Y cortado}: arranca en valor distinto a cero, hace pequeñas diferencias parezcan enormes. (2) \textbf{Escala logarítmica oculta}: comprime visualmente grandes diferencias; sin etiqueta clara, engaña. (3) \textbf{Color sesgado}: rojo/verde, oscuro/claro asociados a moral; el dato no es moral. (4) \textbf{Contexto omitido}: muestra el peor mes o el mejor mes, no la serie completa. (5) \textbf{Cherry picking}: selecciona las categorías que apoyan la tesis y oculta las que la contradicen.
  - |-
    Toda detección sigue el patrón \textbf{``mira el eje Y, mira las fechas, mira las categorías visibles, pregunta qué falta''}: 4 chequeos en 10 segundos. Eje Y: ¿arranca en cero? Fechas: ¿es la serie completa o un recorte? Categorías: ¿están todas o solo las convenientes? Color: ¿hay carga moral indebida? Si alguno falla, el gráfico está bajo sospecha.
  - |-
    Lo esencial cabe en una regla: \emph{un gráfico engañoso casi siempre dice una verdad parcial}. No miente con los números, miente con la \emph{selección} y la \emph{presentación}. Por eso es legal, popular y peligroso. La detección no busca pillar mentiras sino \emph{verdades parciales} disfrazadas de panorama completo.
  - |-
    Algoritmo para auditar un gráfico: (1) lee título y eje Y; (2) verifica si arranca en cero; (3) verifica el rango de fechas; (4) cuenta cuántas categorías hay y pregunta cuántas habrá en realidad; (5) revisa colores; (6) escribe en 1 frase qué decisión induce el gráfico; (7) compara con qué decisión saldría con la versión honesta.
  anatomia:
    titulo: Anatomía de un gráfico engañoso bien analizado
    body: |-
      \textbf{Fuente:} dónde lo encontraste (medio, fecha). \\[1mm] \textbf{Truco principal:} cuál de los 5 usa. \\[1mm] \textbf{Cómo funciona:} 1 frase. \\[1mm] \textbf{Decisión que induce:} qué conclusión empuja al lector. \\[1mm] \textbf{Versión honesta:} cómo se vería el mismo dato sin truco. \\[1mm] \textbf{Decisión que saldría con la versión honesta:} en qué cambiaría.
  errores_comunes: |-
    (1) Confundir \emph{``estilo feo''} con \emph{``engañoso''}: un gráfico simple puede ser honesto. (2) Asumir engaño donde solo hay opción gráfica discutible (\emph{``yo lo habría hecho diferente''} no es lo mismo que \emph{``engaña''}). (3) No comparar con la versión honesta: la denuncia sin alternativa es queja, no análisis. (4) Olvidar la fuente: el gráfico engañoso sin fuente no es analizable. (5) Compartir en redes el gráfico sospechoso \emph{``a ver qué dicen''} antes de auditarlo: replicas la trampa.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2 --- Anatomía del engaño visual». \textbf{Formato:} 5 fichas, una por truco (eje cortado, escala log, color sesgado, contexto omitido, cherry picking), cada una con: cómo funciona + cómo se detecta + 1 ejemplo de la vida real. \textbf{Sabes que terminaste cuando} podrías auditar un gráfico nuevo en 30 segundos sin guía.
praxis:
  intro: |-
    \textbf{Actividad 3 · EVALÚA y CREA --- Auditoría de 3 gráficos reales} (30 min · individual). Hora de aplicar. Vas a buscar 3 gráficos reales (prensa, redes, publicidad, libro escolar) con sospecha de truco, vas a documentar el engaño y a producir la versión honesta de cada uno.
  pilares:
  - |-
    Tu trabajo se descompone en 3 piezas, una por gráfico: (1) captura o referencia del gráfico engañoso; (2) análisis del truco (qué hace, cómo, qué decisión induce); (3) versión corregida (boceto o gráfico nuevo en Excel/Sheets sobre el mismo dato).
  - |-
    Sigue el patrón \textbf{``verdad parcial $\to$ verdad completa''}: el gráfico engañoso no necesariamente miente; selecciona y presenta para empujar a una conclusión. Tu versión honesta debe usar \emph{el mismo dato} pero presentarlo de forma que el lector llegue a una conclusión justa, no manipulada.
  - |-
    Cada análisis se cierra con la \textbf{pregunta de gravedad}: \emph{¿en qué decisión real cambiaría el lector al ver la versión honesta?}. Si la respuesta es \emph{``cambiaría su voto''}, \emph{``cambiaría su compra''}, \emph{``cambiaría su confianza institucional''}, el engaño es grave. Si la respuesta es \emph{``ninguna decisión real cambia''}, el engaño es decorativo pero no peligroso.
  - |-
    Algoritmo: (1) busca 3 gráficos con sospecha; (2) toma captura y registra fuente; (3) audita con la lista de chequeo (eje, fechas, categorías, color); (4) nombra el truco; (5) escribe la decisión que induce; (6) produce versión honesta; (7) escribe la decisión que saldría con la versión honesta.
  checklist:
    titulo: Checklist antes de cerrar la auditoría
    items: |-
      \checkbox 3 gráficos con captura y fuente registrada. \\[1mm] \checkbox Cada gráfico tiene truco nombrado y explicado en 1 frase. \\[1mm] \checkbox Cada gráfico tiene su versión honesta (boceto o nuevo gráfico). \\[1mm] \checkbox Cada análisis cierra con qué decisión cambiaría. \\[1mm] \checkbox Ninguno de los 3 gráficos fue elegido sin verificar antes que realmente había truco.
  plantilla_guion: |-
    \textbf{Gráfico 1.} \textit{Fuente + captura + truco + decisión que induce + versión honesta + decisión nueva.} \\[2mm] \textbf{Gráfico 2.} \textit{Lo mismo.} \\[2mm] \textbf{Gráfico 3.} \textit{Lo mismo.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EVALÚA + CREA).} Título: «Actividad 3 --- Auditoría de 3 gráficos engañosos». \textbf{Formato:} 3 fichas con fuente + truco + análisis + versión honesta + decisión que cambia. \textbf{Extensión:} 1-2 páginas de cuaderno. \textbf{Sabes que terminaste cuando} podrías mostrar tu auditoría a un compañero y convencerlo del engaño en menos de 1 minuto por gráfico.
  producto_titulo: 3 gráficos engañosos auditados + versión honesta de cada uno
  criterios:
  - 3 gráficos reales con captura y fuente verificable
  - 3 trucos nombrados con la lista de los 5
  - 3 versiones honestas usando el mismo dato
  - 3 evaluaciones de gravedad (qué decisión cambia)
  - El análisis está fundado en evidencia visible, no en sospecha vaga
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Una imagen que excluye a los pobres del análisis los excluye también de la política pública.
    aplicacion: |-
      Cuando un gráfico de \emph{``estrato económico''} agrupa estratos 1, 2 y 3 en una sola barra \emph{``estrato bajo''} mientras separa 4, 5 y 6 en barras individuales, la imagen literalmente aplana la diversidad de la pobreza y resalta la de la riqueza. La phronesis del análisis exige denunciar las elecciones gráficas que invisibilizan a quienes ya son invisibles en la sociedad. El engaño visual no siempre es técnico: a veces es de \emph{quién aparece como sujeto único} y quién queda fundido en un promedio anónimo.
    pregunta_espejo: |-
      En los 3 gráficos que analicé, ¿qué grupos sociales quedaron disueltos en categorías agregadas y qué grupos aparecieron con detalle propio? ¿La elección era inocente?
  estoico:
    autor: Epicteto
    cita: |-
      Antes de creer en lo que ves, verifica que lo que ves está completo.
    aplicacion: |-
      La sabiduría estoica recomienda lentitud frente a la imagen impactante. La emoción que produce un gráfico (indignación, miedo, esperanza) es la primera señal de sospecha: el diseñador buscó esa reacción. Quien aprende a posponer la conclusión hasta haber verificado eje, fechas, categorías y fuente entrena una virtud civil que defiende del manipulador y del propagandista.
    pregunta_espejo: |-
      ¿Qué emociones me produjeron los gráficos que analicé? ¿La emoción me empujó a una conclusión que la versión honesta desmiente?
  floridi:
    autor: Luciano Floridi
    cita: |-
      La integridad visual de los datos es infraestructura democrática invisible.
    aplicacion: |-
      Cada vez que un gráfico mal hecho circula en redes sin auditoría, se erosiona la confianza pública en los datos y se debilita la capacidad colectiva de decidir. El ciudadano que aprende a detectar engaños visuales no solo se protege a sí mismo: contribuye a que la infoesfera siga siendo habitable. Es alfabetización defensiva del XXI.
    pregunta_espejo: |-
      ¿Cuántos gráficos compartí o creí en redes esta semana sin auditarlos? ¿Cuánto contribuí, sin querer, a la circulación del engaño visual?
compromiso: |-
  \textbf{Para la próxima semana.} Cuando veas un gráfico en redes o prensa, antes de compartirlo o comentarlo, aplica la \textbf{lista de los 5 chequeos} (eje, fechas, categorías, color, fuente). Si falla en alguno, no lo compartas: comenta el problema. La phronesis civil se entrena en cada \emph{scroll}.
web:
  resumen: |-
    Un gráfico engañoso no miente: dice una verdad parcial con técnica visual que empuja al lector a una conclusión equivocada. Aprendes a detectar los 5 trucos típicos y a producir la versión honesta del mismo dato.
  subtema: Datos · Lectura crítica visual
  pre_lectura:
    por_que_importa: |-
      Casi todo gráfico que circula en redes y prensa fue diseñado para empujarte a una conclusión. Aprender a auditarlo en 30 segundos es alfabetización defensiva del siglo XXI.
    pregunta_detonante: |-
      Si un gráfico te indigna o te emociona en 2 segundos, ¿es porque los datos son contundentes o porque el diseñador eligió esos colores y esa escala?
    activacion:
      titulo: Verificar la balanza
      descripcion: |-
        En 3 minutos: el docente muestra 3 gráficos reales (capturas de prensa) sin decir que tienen truco. Los estudiantes anotan qué entendieron y qué decisión tomarían como ciudadanos.
      duracion_min: 3
    conexion:
      anterior: |-
        En la sesión 6 aprendiste a producir gráficos honestos. Hoy aprendes a detectar los deshonestos. Producir bien y leer críticamente son la misma alfabetización.
      siguiente: "En la sesión 9 cierras el periodo conectando dato → hallazgo → decisión: el insight accionable."
  conceptos_clave:
    - termino: Eje Y cortado
      definicion: |-
        Truco más común: el eje Y no arranca en cero, lo cual exagera diferencias pequeñas. Detección: mira siempre el primer valor del eje Y.
      ejemplo: "Gráfico de barras con eje Y que arranca en 95: una caída de 99 a 97 parece enorme."
      emoji: "✂️"
    - termino: Escala logarítmica oculta
      definicion: |-
        Comprime grandes diferencias visualmente. Sin etiqueta clara, engaña. Detección: revisa si el eje crece de 1 → 10 → 100 → 1000.
      ejemplo: "Casos por país con escala log: el país con 10.000 casos parece solo \"el doble\" del que tiene 100."
      emoji: "📉"
    - termino: Color sesgado
      definicion: |-
        Rojo para lo que el diseñador quiere criticar; verde para lo que quiere alabar. El dato no es moral; el color le impone moral.
      ejemplo: |-
        Gráfico de "estratos sociales": rojo intenso para estratos bajos, verde apacible para estratos altos.
      emoji: "🎨"
    - termino: Contexto omitido
      definicion: |-
        Muestra el mejor mes o el peor mes sin la serie completa. Detección: pregunta siempre "¿qué pasó antes y después?".
      ejemplo: Crisis económica mostrada con solo 3 meses, sin los 12 anteriores que mostrarían tendencia distinta.
      emoji: "✂️"
    - termino: Cherry picking
      definicion: |-
        Selecciona las categorías que apoyan la tesis y oculta el resto en "otros" o las omite. Detección: cuenta categorías visibles y pregunta cuántas hay en realidad.
      ejemplo: Comparación de 5 productos donde solo se muestran los 3 que mejoran, omitiendo los 2 que cayeron.
      emoji: "🍒"
    - termino: Lista de chequeo en 30 segundos
      definicion: |-
        4 verificaciones rápidas: eje Y (¿arranca en cero?), fechas (¿serie completa?), categorías (¿todas?), color (¿carga moral?).
      ejemplo: "Antes de compartir un gráfico en redes, los 4 chequeos: 10 segundos cada uno."
      emoji: "🛡️"
  quiz:
    titulo: "✅ Verifica detección de engaños visuales"
    instrucciones: 5 preguntas para confirmar que auditas gráficos con criterio. Necesitas 3/5 para continuar.
    preguntas:
      - enunciado: ¿Por qué un gráfico engañoso suele ser legal?
        opciones:
          - Porque nadie verifica
          - Porque dice una verdad parcial sin números falsos — manipula con selección y presentación
          - Porque las leyes son laxas
          - No es legal
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El engaño visual es legal y peligroso precisamente porque los datos son ciertos: lo que manipula es el eje, la escala o la selección.
        feedback_incorrecto: |-
          Es legal porque no miente con números. Por eso requiere auditoría visual: la verdad parcial es la verdad más peligrosa.
      - enunciado: Un gráfico te indigna en 2 segundos. ¿Qué haces primero?
        opciones:
          - Compartirlo en redes
          - Aplicar la lista de 4 chequeos antes de creer o compartir
          - Comentar de inmediato
          - Confiar en la emoción
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La emoción rápida es la primera señal de sospecha — el diseñador buscó esa reacción. Verifica antes de actuar.
        feedback_incorrecto: Verificar antes de creer. La indignación instantánea suele ser diseño, no contundencia del dato.
      - enunciado: ¿Cuál de estos NO es uno de los 5 trucos típicos?
        opciones:
          - Eje Y cortado
          - Color sesgado
          - Escala logarítmica con etiqueta clara
          - Cherry picking
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. La escala log con etiqueta clara y declarada NO es engaño: es opción legítima. El truco aparece cuando la escala log se oculta.
        feedback_incorrecto: |-
          La escala log declarada es legítima. El engaño llega cuando se oculta o cuando se elige sin explicar al lector.
      - enunciado: ¿Qué hace especial a una "versión honesta"?
        opciones:
          - Que es más bonita
          - Que usa el mismo dato pero presentado de forma que el lector llegue a una conclusión justa
          - Que es más colorida
          - Que es más larga
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La versión honesta no cambia los datos: cambia la presentación. Mismo dato, conclusión justa.
        feedback_incorrecto: "Mismo dato, presentación justa. Si cambias los datos, ya no es auditoría: es contraargumento."
      - enunciado: En el saber ancestral de la balanza, ¿qué aplica a los gráficos engañosos?
        opciones:
          - Nada
          - Verificar antes de creer es desconfianza educada, no paranoia — es defensa civil
          - Que las balanzas modernas son honestas
          - Que cambió todo
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la conexión. La abuela enseñaba a verificar el peso; tú verificas el eje. Mismo gesto, distinto medio.
        feedback_incorrecto: |-
          Desconfianza educada. La verificación es virtud cívica heredada — solo cambia el objeto: de la balanza al gráfico.
  post_lectura:
    transferencia: |-
      Esta semana, antes de compartir o comentar cualquier gráfico en redes o prensa, aplica la lista de 4 chequeos (eje, fechas, categorías, color). Si falla en alguno, no lo compartas: comenta el problema.
  cinco_dimensiones:
    personal: |-
      Pasaste de consumidor de gráficos a auditor: ya no aceptas indignaciones o euforias instantáneas sin verificar.
    emocional: Aprendiste a detectar la emoción inducida por diseño y a posponer la conclusión hasta auditar.
    ciudadana: |-
      La detección de engaños visuales es defensa civil. Tu auditoría protege también a quienes comparten sin saber.
    local: La abuela enseñaba a verificar la pesa; tú verificas el eje. Mismo gesto, distinto objeto.
    intergeneracional: La desconfianza educada es legado de la abuela rural. Tu pantalla es la nueva balanza.

clave: 3-9
grado: 9
periodo: 3
sesion: 9
completo: true
titulo: Insights --- del dato a la decisión
titulo_portada: |-
  Insights ---
  del dato
  a la decisión
producto_final: Reporte de 1 página con 3 insights extraídos de los datos del estudiante, cada insight con dato que lo soporta, hallazgo en 1 frase y decisión concreta que tomar a partir de él
apertura:
  saber_ancestral: |-
    Antes de los meteorólogos y de las apps del clima, los \textbf{campesinos del Valle del Cauca} leían el cielo para decidir: \emph{nubes a tres días}, \emph{viento del norte}, \emph{hormigas marchando en fila}, \emph{ranas cantando antes del atardecer}. Esos eran sus \emph{insights}: patrones leídos en señales que el resto de la gente veía sin mirar, y que llevaban a decisiones concretas --- \emph{sembrar hoy}, \emph{esperar dos días}, \emph{cosechar urgente}. El \textbf{pescador afro-pacífico} leía la mar de la misma manera: el color del agua, el viento, las gaviotas. Un insight no era una predicción adivinada: era un patrón con dato detrás y una decisión que se desprende. El gesto sigue siendo el mismo en la era de las hojas de cálculo.
  saber_contemporaneo: |-
    Un \textbf{insight} no es un número, ni un gráfico, ni una tabla dinámica. Es la \emph{lectura que conecta el dato con una decisión}. Tiene tres partes obligatorias: (1) el \textbf{dato} que lo sostiene (el número, el promedio, la diferencia entre grupos); (2) el \textbf{hallazgo} expresado en 1 frase clara (qué patrón viste); (3) la \textbf{decisión} concreta que se desprende (qué hacer ahora distinto). Un número sin hallazgo es ruido. Un hallazgo sin decisión es comentario. Solo cuando los tres están conectados, el dato deja de ser decoración y se vuelve \emph{insight} accionable.
  pregunta_puente: |-
    ¿Cómo sabía el campesino que las hormigas marchando significaban lluvia? ¿Y qué pierde un analista novato cuando entrega un reporte lleno de gráficos sin haber escrito un solo insight con decisión clara?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} la diferencia entre dato, hallazgo y decisión, y por qué un \emph{insight} requiere los tres; (2) \textbf{evaluar} cuáles de tus datos del periodo tienen potencial de insight y cuáles son solo decoración; (3) \textbf{explicar} cada insight con la estructura \emph{dato $\to$ hallazgo $\to$ decisión}; (4) \textbf{crear} un reporte de 1 página con 3 insights accionables extraídos de tus propios datos.
puentes:
  a_ruta: |-
    Antes de empezar, mira el viaje completo. Recolectaste datos (S1), los limpiaste (S2 y S7), aplicaste fórmulas (S3), filtraste (S4), agrupaste con tablas dinámicas (S5), graficaste (S6) y aprendiste a leer críticamente gráficos engañosos (S8). Hoy haces el último paso: convertir todo eso en 3 \emph{insights} con decisión clara. Es el salto del \emph{análisis} a la \emph{acción}.
  a_escuta: |-
    Antes de teorizar, vas a mirar tu propio trabajo del periodo y a preguntar de cada gráfico, cada tabla, cada fórmula: \emph{``¿qué decisión cambiaría yo si esto fuera real?''}. Esa pregunta separa los datos accionables de los decorativos.
  a_sistematizacion: |-
    Ya viste cuáles datos te \emph{hablan} y cuáles no. Ahora vas a entender la \textbf{anatomía} de un insight: cómo se redacta, qué jerga evitar, cómo se evalúa si es accionable o no, qué decisión nombra.
  a_praxis: |-
    Tienes el método. Toca aplicarlo: 3 insights bien redactados sobre tus datos del periodo, con dato + hallazgo + decisión, ordenados por importancia y reunidos en un reporte de 1 página apto para entregar a un docente, un padre de familia o un compañero que no haya visto tu tabla.
  a_producto: |-
    Lo que sigue resume \emph{qué} entregas hoy: 1 página con 3 insights numerados. El criterio principal: que un lector que no haya visto tus datos pueda \emph{entender la decisión} sin tener que pedir explicación adicional.
  a_evaluacion: |-
    Antes de cerrar, mira los insights desde las cinco dimensiones humanas. Un insight bueno respeta el dato y respeta al lector; un insight inflado vende humo y manipula.
  a_triangulo: |-
    Y para terminar, tres voces sobre del dato a la decisión. Dussel sobre los insights que olvidan a las víctimas, Séneca sobre la sencillez como virtud del hallazgo, Floridi sobre la decisión como cierre obligado del trabajo con datos.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Insight vs decoración} (15 min · individual). Abre tu carpeta de trabajo del periodo (tabla original, tabla limpia, fórmulas, filtros, tabla dinámica, gráficos). Para cada elemento responde: \emph{``¿qué decisión cambiaría si esto fuera real?''}. Marca con ✨ los que sí cambiarían una decisión y con 🗑️ los que solo decoran. Al final, cuenta cuántos elementos tenías y cuántos quedaron como insight potencial.
  checks:
  - Pasé por cada elemento de mi trabajo del periodo con la pregunta \emph{``¿qué decisión cambiaría?''}.
  - Marqué los accionables con ✨ y los decorativos con 🗑️.
  - Reconozco honestamente cuánto de mi trabajo es decoración y cuánto es \emph{insight} potencial.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} Título: «Actividad 1 --- Insight vs decoración». \textbf{Formato:} tabla 3 columnas (Elemento del trabajo~|~Decisión que cambiaría~|~✨ o 🗑️), 6-10 filas. Al final 1 línea con cuántos quedaron accionables. \textbf{Sabes que terminaste cuando} reconoces qué fracción de tu trabajo del periodo era ya un insight potencial y cuánto era decoración con buena intención.
sistematizacion:
  intro: |-
    Un insight bien escrito no parece complicado, pero exige disciplina. Vamos a descomponer su anatomía con los pilares del pensamiento computacional para que sepas exactamente qué pedirle a cada uno de los 3 que vas a producir.
  pilares:
  - |-
    Un insight se descompone en 3 piezas: (1) \textbf{Dato}: el número, el promedio, la diferencia entre grupos, el rango, la tasa. Es la evidencia. (2) \textbf{Hallazgo}: 1 frase clara que diga qué patrón viste. Es la lectura humana del dato. (3) \textbf{Decisión}: 1 frase con la acción concreta que se desprende. Es lo que hace que el insight cuente.
  - |-
    Todo insight sigue el patrón \textbf{``por cada dato, una sola decisión''}. Si tu insight propone 3 decisiones distintas, no es un insight: son tres insights mal separados. Disciplina de oficio: \emph{una evidencia, un hallazgo, una decisión}. Esa restricción dura es la que produce reportes legibles.
  - |-
    Lo esencial cabe en una regla: \emph{el lector debe poder accionar el insight sin pedirte explicación adicional}. Si tu insight dice \emph{``hay variación en la columna X''}, no es un insight. Si dice \emph{``el promedio de gasto en transporte del 9B (32.000) es 60\% más alto que el del 9A (20.000) --- vale revisar si la ruta del barrio Macarena requiere intervención''}, entonces sí: dato + hallazgo + decisión.
  - |-
    Algoritmo para escribir un insight: (1) elige un dato significativo de tu trabajo; (2) escribe el dato en 1 línea numérica; (3) escribe el hallazgo en 1 frase humana; (4) escribe la decisión en 1 frase accionable; (5) léelo en voz alta a un compañero y pregunta \emph{``¿entendiste qué hacer?''}. Si la respuesta es no, reescribe.
  anatomia:
    titulo: Anatomía de un insight bien escrito
    body: |-
      \textbf{Dato.} \textit{1 línea con el número o diferencia que sostiene el hallazgo.} \\[1mm] \textbf{Hallazgo.} \textit{1 frase con el patrón leído.} \\[1mm] \textbf{Decisión.} \textit{1 frase con la acción concreta que se desprende.} \\[1mm] \textbf{Quién decide.} \textit{Persona o rol que debería actuar.} \\[1mm] \textbf{Plazo sugerido.} \textit{Esta semana / este mes / este periodo.}
  errores_comunes: |-
    (1) Confundir \emph{``hay variación''} con un insight: variación es descripción, no hallazgo. (2) Olvidar la decisión: hallazgo sin acción es comentario. (3) Inflar el insight con jerga (\emph{``análisis multidimensional revela tendencias''}): si necesitas jerga, no entendiste el dato. (4) Mezclar 3 decisiones en una sola línea: produces ruido, no claridad. (5) Reportar el insight sin nombrar \emph{quién} debería decidir: la acción queda sin dueño.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EVALÚA).} Título: «Actividad 2 --- Anatomía de un insight». \textbf{Formato:} ficha con las 5 partes (dato, hallazgo, decisión, quién decide, plazo) + 1 lista de los 5 errores comunes con marca de cuál cometes más. \textbf{Sabes que terminaste cuando} podrías reescribir un insight pobre y convertirlo en uno sólido sin instrucción adicional.
praxis:
  intro: |-
    \textbf{Actividad 3 · EXPLICA + CREA --- Reporte de 3 insights} (30 min · individual). Hora de crear. Vas a producir un reporte de 1 página con 3 insights ordenados por importancia, cada uno con la anatomía completa (dato + hallazgo + decisión + quién + plazo).
  pilares:
  - |-
    Tu reporte se descompone en 5 piezas: (1) título corto del reporte; (2) 1 línea con la pregunta de investigación de Sesión 1 (recuerda al lector qué estabas estudiando); (3) Insight 1; (4) Insight 2; (5) Insight 3. Los 3 insights ordenados de mayor a menor importancia.
  - |-
    Sigue el patrón \textbf{``importancia por encima de orden cronológico''}: no ordenes los insights por el orden en que los descubriste, sino por cuánto importan. El más importante primero, el menos importante último. El lector apurado lee solo el primero y debe quedarse con lo esencial.
  - |-
    Cada insight se redacta como \textbf{telegram}: cada palabra paga renta. Si una palabra no aporta a dato, hallazgo o decisión, se elimina. La concisión es ética, no estilo: respeta el tiempo del lector y obliga al analista a pensar bien.
  - |-
    Algoritmo: (1) escribe la pregunta de investigación; (2) elige los 3 datos más significativos de tu trabajo del periodo; (3) escribe dato + hallazgo + decisión + quién + plazo para cada uno; (4) ordena por importancia; (5) revisa que el reporte completo quepa en 1 página; (6) léelo a un compañero y verifica que entiende la decisión sin tu ayuda.
  checklist:
    titulo: Checklist antes de cerrar el reporte
    items: |-
      \checkbox 3 insights con dato + hallazgo + decisión claros. \\[1mm] \checkbox Cada insight nombra quién debería decidir y en qué plazo. \\[1mm] \checkbox Insights ordenados por importancia descendente. \\[1mm] \checkbox Reporte cabe en 1 página de cuaderno o de hoja A4. \\[1mm] \checkbox Un lector ajeno entiende las 3 decisiones sin pedir explicación.
  plantilla_guion: |-
    \textbf{Reporte de [tema].} \\[1mm] \textbf{Pregunta de investigación.} \textit{1 línea.} \\[2mm] \textbf{Insight 1 (el más importante).} \textit{Dato + hallazgo + decisión + quién + plazo.} \\[2mm] \textbf{Insight 2.} \textit{Lo mismo.} \\[2mm] \textbf{Insight 3.} \textit{Lo mismo.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · EXPLICA + CREA).} Título: «Actividad 3 --- Reporte de 3 insights». \textbf{Formato:} 1 página con título + pregunta de investigación + 3 insights estructurados. \textbf{Extensión:} 1 página de cuaderno o 1 hoja A4. \textbf{Sabes que terminaste cuando} un lector que no haya visto tus datos puede actuar a partir de tu reporte sin pedir explicación adicional.
  producto_titulo: 1 reporte de 1 página con 3 insights accionables
  criterios:
  - Pregunta de investigación incluida al inicio del reporte
  - 3 insights con dato, hallazgo y decisión claros y separados
  - Cada insight nombra quién decide y en qué plazo
  - Insights ordenados por importancia (no por orden cronológico)
  - Un lector ajeno entiende las 3 decisiones sin necesidad de tu explicación
triangulo:
  dussel:
    autor: Enrique Dussel
    cita: |-
      Un insight que no nombra a las víctimas se vuelve cómplice del problema que pretende analizar.
    aplicacion: |-
      Cuando reportas \emph{``el promedio del curso mejoró 0.3 puntos''}, ese insight invisibiliza a los 5 estudiantes que reprobaron de manera silenciosa. Cuando reportas \emph{``el barrio aumentó su consumo en X\%''}, invisibilizas a las familias que no llegan a fin de mes. La phronesis del analista exige que los insights mencionen \emph{quién mejora}, \emph{quién queda atrás} y \emph{qué decisión protege a quienes están en riesgo}. El insight que solo cuenta a los ganadores es propaganda disfrazada de análisis.
    pregunta_espejo: |-
      En mis 3 insights, ¿quién aparece beneficiado y quién queda invisible? ¿Hay un insight que solo nombre el promedio cuando debería nombrar a los extremos?
  estoico:
    autor: Séneca
    cita: |-
      Lo que se dice con menos palabras se entiende con más fuerza.
    aplicacion: |-
      Es tentador inflar los insights con jerga (\emph{``el análisis multivariado revela una correlación significativa entre las dimensiones X e Y''}). La sabiduría estoica recomienda lo contrario: \emph{cuanta menos jerga, más claridad}. Un insight bien escrito cabe en 2-3 frases legibles para un padre de familia. Quien escribe con sencillez respeta al lector y obliga a su propia mente a entender de verdad lo que dice.
    pregunta_espejo: |-
      ¿Mis insights usan jerga para parecer más profesionales o están escritos para que cualquier persona los entienda? ¿Qué palabras puedo eliminar sin perder sentido?
  floridi:
    autor: Luciano Floridi
    cita: |-
      Sin decisión, el trabajo con datos es entretenimiento; con decisión, es responsabilidad pública.
    aplicacion: |-
      El analista contemporáneo no cierra su trabajo en el gráfico ni en la tabla: cierra en la decisión. Quien produce datos sin nombrar qué decisión se desprende deja al lector descargado de responsabilidad y al sistema sin guía. La cultura del \emph{insight accionable} es la versión profesional de la cultura del campesino que leía las hormigas para decidir cuándo sembrar. La decisión es ética, no detalle.
    pregunta_espejo: |-
      ¿Cuántos reportes leí esta semana sin ver una sola decisión clara? ¿Cuántos datos compartí o produje yo sin cerrar con una acción concreta?
compromiso: |-
  \textbf{Para la próxima semana.} Toma un reporte cotidiano (boletín escolar, factura de servicios, recibo de gastos del hogar) e identifica un insight con dato + hallazgo + decisión. Compártelo con quien pueda actuar (madre, padre, hermano mayor, docente). La phronesis se entrena llevando el insight al mundo, no dejándolo en la libreta.

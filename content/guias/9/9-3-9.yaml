titulo: Insights --- del dato a la decisión
producto_final: |-
  Reporte de 1 página con 3 insights extraídos de los datos del estudiante, cada insight con: dato que lo soporta, hallazgo, y decisión concreta que tomar a partir de él
saber_ancestral_idea: |-
  Antes de los meteorólogos, los campesinos del Valle leían el cielo para decidir: nubes a tres días, viento del norte, hormigas marchando. Esos eran sus insights --- patrones leídos en datos crudos que llevaban a decisiones concretas (sembrar hoy, esperar, cosechar). El insight no es un número: es lo que ese número te lleva a hacer.
verbos_actividades:
- ANALIZA
- EVALÚA
- EXPLICA
- CREA

clave: 3-9
grado: 9
periodo: 3
sesion: 9
completo: true
duracion_min: 90
titulo: Insights --- del dato a la decisión
titulo_portada: |-
  Insights ---
  del dato
  a la decisión
producto_final: |-
  Un reporte de una página con tu pregunta de investigación arriba y tres hallazgos ordenados por importancia. Cada uno tiene su dato en una línea numérica, el hallazgo en una frase humana y una decisión concreta que nombra quién decide y en qué plazo. La prueba: alguien ajeno entiende las tres decisiones sin que tú expliques nada.
apertura:
  origen: Crisis de la roya (2008-2011) · lo que no depende de nadie y lo que sí
  fuente: |-
    Avelino, J., Cristancho, M., Georgiou, S., Imbach, P., Aguilar, L., Bornemann, G., Läderach, P., Anzueto, F., Hruska, A. J., \& Morales, C. (2015). The coffee rust crises in Colombia and Central America (2008--2013): Impacts, plausible causes and proposed solutions. \emph{Food Security, 7}(2), 303--321. https://doi.org/10.1007/s12571-015-0446-9
  saber_ancestral: |-
    Un cafetero del Valle o del Quindío controla cuándo abona, cuándo renueva y cuándo recoge. No controla el hongo, ni la temperatura, ni el precio en Nueva York. Entre 2008 y 2011 la roya hizo caer la producción colombiana un 31~\% en promedio frente a 2007 (Avelino et al., 2015). Y aquí viene lo que no conviene simplificar. Lo que disparó la crisis no fue solo el clima. Al subir el costo de los insumos, muchos dejaron de abonar, y un cafetal mal manejado se volvió vulnerable. Es decir: buena parte de lo que parecía incontrolable se fabricó con decisiones económicas. La \textbf{cara de exclusión}: presentar el precio internacional como destino sería falsear el dato. En medio de todo eso viven 557.311 familias productoras. La pregunta del cafetero no es cómo evitar la incertidumbre, sino qué hacer con la parte que sí es suya.
  saber_contemporaneo: |-
    Un hallazgo útil tiene tres piezas y ninguna sirve sola. \textbf{Dato}: el número, la diferencia entre grupos, el rango, la tasa. Es la evidencia y va en una línea. \textbf{Hallazgo}: una frase humana que dice qué significa ese número. \textbf{Decisión}: qué se hace a partir de él, con quién decide y en qué plazo. Y hay una regla que ordena todo: por cada dato, una sola decisión. Si tu hallazgo propone tres cosas distintas, son tres hallazgos mal separados. La prueba de que está bien escrito es que alguien pueda actuar sin pedirte explicación. «Hay variación en la columna de horarios» no es un hallazgo: es una observación sin destino. «El 60~\% llega después de las siete, así que la reunión empieza siete y media» sí lo es. Dice qué hacer, y se puede cumplir o no cumplir.
  pregunta_puente: |-
    El cafetero no controla el hongo ni el precio, pero sí cuándo abona. En tus datos, ¿qué parte de lo que encontraste depende de alguien que puedas nombrar?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{analizar} tu propio trabajo del periodo y separar lo que cambiaría una decisión de lo que solo decora; (2) \textbf{explicar} la anatomía de un hallazgo y por qué cada dato admite una sola decisión; (3) \textbf{crear} un reporte de tres hallazgos accionables, ordenados por importancia.
puentes:
  a_ruta: |-
    Todo el periodo apunta aquí. Recogiste, ordenaste, calculaste, filtraste, agrupaste, graficaste, limpiaste y aprendiste a desconfiar de un gráfico. Hoy conviertes eso en decisiones. En la sesión 10 lo sustentas.
  a_escuta: |-
    Antes de la teoría vas a revisar tu propia carpeta con una sola pregunta encima: qué decisión cambiaría si esto fuera real. La mayoría de lo que hiciste no la cambia, y está bien saberlo.
  a_sistematizacion: |-
    Ya separaste lo que sirve. Ahora vas a darle forma con las tres piezas y a comprobar que cada dato lleve una sola decisión.
  a_praxis: |-
    Tienes el molde. Toca escribir el reporte y ordenar los hallazgos por lo que pesan, no por el orden en que aparecieron.
  a_producto: |-
    Lo que entregas hoy: una página con tres hallazgos accionables. La prueba de calidad: cada decisión dice quién decide y en qué plazo.
  a_evaluacion: |-
    Antes de cerrar, mira lo que hiciste desde cinco lados. Un dato que no cambia ninguna decisión es información, y la información sola no mueve nada.
  a_triangulo: |-
    Para terminar, tres citas verificadas sobre leer y decidir: Dussel sobre saber oír en el silencio, Epicteto sobre la opinión que uno concibe, Floridi sobre artefactos que cambian de estado solos.
escuta:
  escena: |-
    \textbf{Actividad 1 · ANALIZA --- Hallazgo o decoración} (15 min · individual). (1) Abre tu carpeta del periodo: la tabla original, la limpia, las fórmulas, los filtros, la tabla dinámica y los gráficos. (2) Para cada elemento pregúntate qué decisión cambiaría si esto fuera real. (3) Marca con una señal los que sí cambiarían algo. (4) Marca con otra los que solo se ven bien. (5) Cuenta cuántos hay de cada clase y anota si te sorprendió la proporción.
  checks:
  - Revisé todos los elementos de mi carpeta del periodo.
  - Marqué cuáles cambiarían una decisión y cuáles solo decoran.
  - Conté cuántos hay de cada clase.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 1 · ANALIZA).} \textbf{Título:} «Actividad 1 --- Hallazgo o decoración». \textbf{Formato:} lista de los elementos del periodo con su marca, más el conteo final de cada clase. \textbf{Extensión:} un tercio de página. \textbf{Sabes que terminaste cuando} tienes los dos conteos y sabes cuál pesó más.
sistematizacion:
  intro: |-
    \textbf{Actividad 2 · EXPLICA --- Dato, hallazgo, decisión} (20 min · parejas). (1) Con tu pareja, escriban las tres piezas con una frase propia cada una. (2) Tomen un elemento marcado como útil y escríbanlo con las tres piezas completas. (3) Comprueben que la decisión nombre quién decide y en qué plazo. (4) Busquen un hallazgo que proponga dos decisiones y sepárenlo en dos.
  pilares:
  - |-
    \textbf{Las tres piezas.} Dato: el número, en una línea. Hallazgo: qué significa, en una frase humana. Decisión: qué se hace, quién decide y en qué plazo. Faltando cualquiera, el lector tiene que completar por su cuenta.
  - |-
    \textbf{Por cada dato, una sola decisión.} Si propone tres cosas, son tres hallazgos mal separados. Separarlos hace que cada uno se pueda aceptar o rechazar por su cuenta, que es lo que permite discutirlos.
  - |-
    \textbf{La decisión nombra a alguien y un plazo.} «Habría que revisar los horarios» no compromete a nadie. «La coordinación revisa los horarios antes del viernes» sí, porque el viernes se sabe si pasó.
  - |-
    \textbf{Separar lo que depende de quién.} Hay cosas que no dependen de nadie, otras que no dependen de ti pero sí de alguien con nombre, y otras que dependen de ti. Casi toda la energía útil está en las dos últimas.
  anatomia:
    titulo: La anatomía de un hallazgo
    body: |-
      \textbf{Dato:} el número, en una línea. \\[1mm] \textbf{Hallazgo:} qué significa, en una frase. \\[1mm] \textbf{Decisión:} qué se hace, quién decide, en qué plazo. \\[1mm] \textbf{Regla:} un dato, una decisión. \\[1mm] \textbf{Prueba:} ¿puede actuar sin preguntarme?
  errores_comunes: |-
    (1) \textbf{Confundir observación con hallazgo}: «hay variación» no dice qué hacer. (2) \textbf{Meter tres decisiones en un hallazgo}: ninguna se puede discutir por separado. (3) \textbf{No nombrar a quien decide}: sin responsable, la decisión no ocurre. (4) \textbf{Ordenar por orden cronológico}: el reporte se ordena por lo que pesa, no por cuándo apareció. (5) \textbf{Presentar como incontrolable lo que sí depende de alguien}: es la forma más cómoda de no proponer nada.
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 2 · EXPLICA).} \textbf{Título:} «Actividad 2 --- Dato, hallazgo, decisión». \textbf{Formato:} las tres piezas con frase propia, un elemento escrito con las tres completas y el hallazgo doble separado en dos. \textbf{Extensión:} media página. \textbf{Sabes que terminaste cuando} la decisión escrita nombra a alguien y un plazo.
praxis:
  intro: |-
    \textbf{Actividad 3 · CREA --- Tu reporte de tres hallazgos} (30 min · individual). (1) Escribe arriba tu pregunta de investigación del periodo. (2) Elige los tres elementos que más cambiarían una decisión. (3) Escribe cada uno con sus tres piezas: dato, hallazgo y decisión. (4) Comprueba que cada decisión nombre quién decide y en qué plazo. (5) Ordénalos por importancia, no por el orden en que los encontraste. (6) Dáselo a leer a alguien que no estuvo en el periodo y anota si entendió las tres decisiones.
  pilares:
  - |-
    \textbf{Tu entrega cabe en una página.} La pregunta arriba, tres hallazgos completos y nada más. Si necesita dos páginas, sobran hallazgos o sobran palabras.
  - |-
    \textbf{Ordenar por importancia es una decisión.} El primero es el que más cambia algo, no el que encontraste primero. Ese orden dice tanto sobre tu criterio como los hallazgos mismos.
  - |-
    \textbf{El dato va en una línea numérica.} «El 60~\% llega después de las siete» pesa; «muchos llegan tarde» no. El número es lo que permite discutir sin pelear.
  - |-
    \textbf{La prueba es un lector ajeno.} Si tiene que preguntarte qué se supone que hay que hacer, la decisión no estaba escrita. Y si te pregunta quién debe hacerlo, faltaba el nombre.
  checklist:
    titulo: Antes de entregar
    items: |-
      \checkbox La pregunta de investigación está arriba del reporte. \\[1mm] \checkbox Tres hallazgos, cada uno con dato, hallazgo y decisión. \\[1mm] \checkbox Cada dato va en una línea con su número. \\[1mm] \checkbox Cada decisión nombra quién decide y en qué plazo. \\[1mm] \checkbox Están ordenados por importancia, no por cronología. \\[1mm] \checkbox Un lector ajeno entendió las tres decisiones sin explicación.
  plantilla_guion: |-
    \textbf{Pregunta.} \textit{La del periodo, en una frase.} \\[1mm] \textbf{Dato.} \textit{El número, en una línea.} \\[1mm] \textbf{Hallazgo.} \textit{Qué significa, en una frase humana.} \\[1mm] \textbf{Decisión.} \textit{Qué se hace, quién decide, en qué plazo.} \\[1mm] \textbf{Orden.} \textit{Por lo que pesa, no por cuándo apareció.}
  cuaderno: |-
    \textbf{Lo que va al cuaderno (Actividad 3 · CREA).} \textbf{Título:} «Actividad 3 --- Tu reporte de tres hallazgos». \textbf{Formato:} la pregunta, los tres hallazgos con sus tres piezas y la nota de qué entendió el lector ajeno. \textbf{Extensión:} una página. \textbf{Sabes que terminaste cuando} alguien que no estuvo en el periodo dijo las tres decisiones con sus palabras.
  producto_titulo: Reporte de una página con tres hallazgos accionables ordenados por importancia
  criterios:
  - La pregunta de investigación aparece al inicio del reporte
  - Los tres hallazgos tienen dato, hallazgo y decisión, separados y claros
  - Cada dato aparece en una línea con su número
  - Cada decisión nombra quién decide y en qué plazo
  - Un lector ajeno entendió las tres decisiones sin explicación adicional
triangulo:
  modo: citas
  dussel:
    autor: Enrique Dussel · Filosofía de la liberación (1977), §3.3.9.4
    cita: |-
      El êthos de la liberación pedagógica exige al maestro saber oír en el silencio con respecto a la juventud, al pueblo.
    aplicacion: |-
      Con los datos pasa algo parecido. Antes de decidir qué dicen, hay que dejarlos hablar: mirar el caso raro, el vacío, el grupo pequeño. Casi siempre el hallazgo está donde uno no fue a buscarlo.
    pregunta_espejo: |-
      ¿Qué dato de los míos ignoré porque no encajaba con lo que esperaba encontrar?
  estoico:
    autor: Epicteto · Enquiridión, 20 (c. 125 d.C.)
    cita: |-
      Acuérdate que no te ofende el que te injuria, ni el que te golpea, sino la opinión que has concebido.
    aplicacion: |-
      Un número tampoco decide por sí solo: decide la lectura que uno hace. Pero cuidado con llevar esto demasiado lejos. En la crisis de la roya, buena parte de lo que parecía incontrolable venía de decisiones económicas concretas, y llamarlo destino habría sido falsear el dato.
    pregunta_espejo: |-
      ¿Qué estoy llamando «así son las cosas» cuando en realidad alguien lo decidió?
  floridi:
    autor: The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 3.2
    cita: |-
      En el mundo onlife, los artefactos han dejado de ser meras máquinas que simplemente operan según instrucciones humanas: pueden cambiar de estado de manera autónoma. (trad. propia)
    aplicacion: |-
      Cada vez más decisiones las toma un sistema leyendo datos, sin que nadie escriba el hallazgo. Por eso saber escribir uno a mano importa: es la manera de comprobar si la decisión automática habría sido la misma.
    pregunta_espejo: |-
      ¿Qué decisión sobre mí tomó esta semana un sistema, a partir de qué dato?
compromiso: |-
  \textbf{Para la próxima sesión.} Llega con el reporte de una página y con lo que dijo tu lector ajeno. Elige una de tus tres decisiones y averigua quién tendría que tomarla de verdad. En la sesión 10 sustentas el mini estudio del periodo.
web:
  resumen: |-
    Un cafetero controla cuándo abona, no el hongo ni el precio en Nueva York. Pero la crisis de la roya no fue solo clima: al subir el costo de los insumos muchos dejaron de abonar, y el cafetal mal manejado se volvió vulnerable. Hoy conviertes tus datos en tres decisiones que nombren quién decide y en qué plazo.
  subtema: Datos · Del dato a la decisión
  pre_lectura:
    por_que_importa: |-
      Un dato que no cambia ninguna decisión es información, y la información sola no mueve nada. La diferencia está en nombrar quién decide.
    pregunta_detonante: |-
      De todo lo que averiguaste este periodo, ¿qué harías distinto la próxima semana?
    activacion:
      titulo: Una sola decisión
      descripcion: |-
        En 2 minutos, escribe un número que hayas encontrado en tus datos. Al lado, qué harías distinto por ese número.
      duracion_min: 3
    conexion:
      anterior: En la sesión 8 auditaste tres gráficos engañosos y los rehiciste con honestidad.
      siguiente: En la sesión 10 sustentas el mini estudio que cierra el periodo y el año.
  mapa_ruta:

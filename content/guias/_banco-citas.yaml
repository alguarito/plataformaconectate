  #   · Dussel: PDF de la 5.ª ed. en enriquedussel.com, descargado y extraído con
  #     pdftotext; se comprobó primero que reprodujera literalmente las citas ya
  #     verificadas del banco (§2.4.2.2 y §4.3.2.4) antes de extraer las nuevas.
  #   · Floridi: PDF de acceso abierto de los capítulos 2 y 12 en Springer; la
  #     paginación impresa se verificó página por página.

  - id: dussel-fl-2-1-4-3
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §2.1.4.3"
    texto: "Codo-a-codo los hermanos en la asamblea donde se decide el destino de la patria; palabra-oído del maestro-discípulo en el aprendizaje del vivir… proximidad es la palabra que expresa la esencia del hombre."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §2.1.4.3 (cap. 2.1 «Proximidad»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. El parágrafo abre con «Rostro-a-rostro el hijo-madre en el mamar; sexo-a-sexo el varón-mujer en el amor;» y sigue con lo citado; se elide el arranque, que no es apto para el aula. Cierra: «su plenitud primera (arqueológica) y última (escatológica)»."
    temas: [aprender acompañando, mentoría, asamblea, cercanía, oficio]
    grados: [9, 10, 11]

  - id: dussel-fl-2-2-1-1
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §2.2.1.1"
    texto: "El maestro y el discípulo deben apartarse para preparar en la vida su discurso futuro… El rodeo de la lejanía hace posible la proximidad futura."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §2.2.1.1 (cap. 2.2 «Totalidad»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. Parágrafo completo: «La proximidad, el cara-a-cara del hombre con el hombre deja siempre lugar a la lejanía. El niño es dejado en su cuna; el amado debe partir a su trabajo; el maestro y el discípulo deben apartarse…»."
    temas: [autonomía, distancia, aprendizaje, trabajo propio]
    grados: [9, 10, 11]

  - id: dussel-fl-2-5-3-3
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §2.5.3.3"
    texto: "El proyecto del sistema imperante se impone a todos, unívocamente. Por medio de la propaganda, por los medios de comunicación, por el cine y la televisión… por todos los poros."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §2.5.3.3 (cap. 2.5 «Alienación»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. El parágrafo cierra con «Quien resiste se lo secuestra, encarcela, tortura, expulsa, mata», que se elide por criterio de aula; la elisión no altera el sentido de lo citado."
    temas: [medios, publicidad, ideología, algoritmos, lo que parece normal]
    grados: [9, 10, 11]

  - id: dussel-fl-4-2-4-4
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §4.2.4.4"
    texto: "Hay lengua cotidiana (la de todos los días), lengua de culturas ilustradas, de cultura de masas, lengua de cultura popular… lengua política (que se comprende no por lo que dice sino por lo que calla, contra quién lo dice, cuándo y por qué…)."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §4.2.4.4 (cap. 4.2 «Semiótica»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF, fragmento por fragmento. El original antepone «La lengua, como totalidad expresiva del mundo, tiene tantas modalidades como el mismo mundo:» —de ahí que «hay» vaya en minúscula en la obra— y entre las modalidades cita también la erótica y la religiosa, elididas aquí. El paréntesis final del original termina en «y por qué, etc.)»."
    temas: [lenguaje, medios, leer entre líneas, registro, público destinatario]
    grados: [9, 10, 11]

  - id: dussel-fl-4-2-5-3
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §4.2.5.3"
    texto: "La información por transmitirse deberá codificarse semántica, sintáctica y fonéticamente, para ser, desde la recepción, decodificada fonética, sintáctica y semánticamente como información recibida."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §4.2.5.3 (cap. 4.2 «Semiótica»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. Va precedida de «El proceso de codificación es correlativo al de decodificación» y seguida de la observación sobre la modelización matemática e informática."
    temas: [datos, codificación, comunicación, formatos, malentendidos]
    grados: [9, 10, 11]

  - id: dussel-fl-4-2-8-4
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §4.2.8.4"
    texto: "La aparente fealdad del rostro del oprimido, el ajado rostro del campesino, la endurecida mano del obrero… es el punto de partida de la estética de la liberación, porque es la interpelación que revela la belleza popular."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §4.2.8.4 (cap. 4.2 «Semiótica»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. La elisión omite «la cara tosca de la mujer del pueblo (que no puede comprar la cosmética de la belleza vigente)». El parágrafo define además el esteticismo como «la ideología de la belleza»."
    temas: [estética de la liberación, a quién dignifica una pieza, retrato, belleza vigente]
    grados: [9, 10, 11]

  - id: dussel-fl-4-2-9-3
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §4.2.9.3"
    texto: "El arte popular es el arte primero, la suprema expresión de la estética. Se da en la vida cotidiana, en la música, la danza, la pintura, en el teatro… Es necesario formular una estética popular más allá de la publicidad y la moda."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §4.2.9.3 (cap. 4.2 «Semiótica», cierre), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. El parágrafo nombra los murales de Orozco, Siqueiros y Rivera «como exposición del pueblo en su gesta revolucionaria»."
    temas: [cultura popular, estética, murales, publicidad y moda, arte cotidiano]
    grados: [9, 10, 11]

  - id: dussel-fl-4-3-1-2
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §4.3.1.2"
    texto: "El tema esencial del diseño es el de dotar al producto de coherencia formal; incluye a la tecnología… por cuanto esto significa coherencia funcional: el del valor del uso; incluye a la estética, porque la coherencia formal, en cuanto tal, es la belleza del producto."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §4.3.1.2 (cap. 4.3 «Poiética»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. La elisión omite el inciso «(y por ello a la ciencia en su implementación poiética)». El parágrafo explica antes por qué Dussel privilegia el diseño: incluye la tecnología y el arte."
    temas: [diseño, jerarquía visual, forma y función, maquetación, producto]
    grados: [9, 10, 11]

  - id: dussel-fl-4-3-3-2
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §4.3.3.2"
    texto: "Lo que acontece en el sistema capitalista es que existe una política de producción del deseo, que se funda en el proyecto del sistema, y que crea por la publicidad un deseo o necesidad colectiva: el mercado."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §4.3.3.2 (cap. 4.3 «Poiética»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. Va precedida de la definición de «satisfactor» como el ente que sacia una necesidad."
    temas: [publicidad, consumo, deseo, necesidad, mercado]
    grados: [9, 10, 11]

  - id: dussel-fl-4-3-8-1
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §4.3.8.1"
    texto: "Las naciones dependientes y explotadas contemplan en su suelo la contradictoria existencia de un hetero-diseño; de una imitación inadecuada de diversas tecnologías… La negación de la cultura popular niega igualmente su técnica."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §4.3.8.1 (cap. 4.3 «Poiética»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. La elisión omite la escena de la aldea campesina con el asno y el Chevrolet. NOTA — el §4.3.6.7, sobre tecnología y diseño vernáculos, dice «para que no florezca», un «no» que contradice el sentido del pasaje; se descartó por esa duda de OCR o de edición."
    temas: [tecnologías propias, dependencia, importar soluciones, diseño ajeno]
    grados: [9, 10, 11]

  - id: dussel-fl-5-4-5
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §5.4.5"
    texto: "Se debe tener clara conciencia que las mejores computadoras no pueden suplantar a los catorce mil millones de neuronas… situadas sólo en nuestra corteza cerebral. El método para la mejor decisión práctica es práctico."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §5.4.5 (cap. 5 «Método»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. La elisión omite «(con hasta sus doscientas mil conexiones de cada una con las otras)». El parágrafo cierra: «No es lo mismo manejar entes de razón que respetar hombres…»."
    temas: [inteligencia artificial, decidir, límites del cómputo, criterio propio]
    grados: [9, 10, 11]

  - id: dussel-fl-5-5-2
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §5.5.2"
    texto: "Es un error pensar que la ciencia pura… aplica ella misma alguna de sus conclusiones, apareciendo la tecnología como su concreta creación… Muy por el contrario, es el discurso técnico artesanal o tecnológico… echa mano… de conclusiones o teorías científicas."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §5.5.2 (cap. 5 «Método»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF, fragmento por fragmento. Cada elisión está marcada: se omiten las marcas de esquema (a), (a'), (b'), la oración «En este caso c es creada por a, mediando un movimiento aplicativo b» y el inciso «el que ante una dificultad, limitación, ambigüedad, falta de precisión… por razones técnicas». Cierra: «son las técnicas o tecnologías concretas las que han lanzado en los tiempos modernos a las ciencias a buscar nuevas soluciones»."
    temas: [técnica y ciencia, oficio, del problema a la teoría, orden real del saber]
    grados: [9, 10, 11]

  - id: floridi-onlife-manifiesto-3-2-artefactos
    voz: floridi
    autor: "The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 3.2"
    texto: "En el mundo onlife, los artefactos han dejado de ser meras máquinas que simplemente operan según instrucciones humanas: pueden cambiar de estado de manera autónoma. (trad. propia)"
    texto_original: "In the onlife-world, artefacts have ceased to be mere machines simply operating according to human instructions. They can change states in autonomous ways…"
    edicion: "The Onlife Manifesto, en L. Floridi (ed.), The Onlife Manifesto, Springer, 2015, § 3.2, p. 10, acceso abierto, DOI 10.1007/978-3-319-04093-6_2, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF de acceso abierto del capítulo; paginación impresa verificada página por página (pdf p.4 = p. 10 impresa)."
    temas: [automatización, inteligencia artificial, datos, quién decide]
    grados: [9, 10, 11]

  - id: floridi-onlife-manifiesto-3-6-publico
    voz: floridi
    autor: "The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 3.6"
    texto: "Internet es una extensión importante del espacio público, incluso cuando lo operan y lo poseen actores privados. (trad. propia)"
    texto_original: "The Internet is an important extension of the public space, even when operated and owned by private actors."
    edicion: "The Onlife Manifesto, en L. Floridi (ed.), The Onlife Manifesto, Springer, 2015, § 3.6, pp. 10–11, acceso abierto, DOI 10.1007/978-3-319-04093-6_2, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF de acceso abierto. El § arranca en la p. 10 impresa y continúa en la 11; la frase citada queda a caballo del salto de página."
    temas: [espacio público, plataformas privadas, redes, ciudadanía digital]
    grados: [9, 10, 11]

  - id: floridi-onlife-manifiesto-3-8-resguardo
    voz: floridi
    autor: "The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 3.8"
    texto: "Creemos que todo el mundo necesita a la vez resguardo frente a la mirada pública y exposición… y también la generosidad del olvido deliberado. (trad. propia)"
    texto_original: "We believe that everybody needs both shelter from the public gaze and exposure. The public sphere should foster a range of interactions and engagements that incorporate an empowering opacity of the self… as well as the generosity of deliberate forgetfulness."
    edicion: "The Onlife Manifesto, en L. Floridi (ed.), The Onlife Manifesto, Springer, 2015, § 3.8, p. 11, acceso abierto, DOI 10.1007/978-3-319-04093-6_2, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF de acceso abierto (pdf p.5 = p. 11 impresa). La elisión une la primera oración con el cierre del parágrafo."
    temas: [privacidad, identidad, derecho al olvido, exposición, huella digital]
    grados: [9, 10, 11]

  - id: floridi-onlife-manifiesto-4-2-libertad
    voz: floridi
    autor: "The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.2"
    texto: "Nuestro yo es a la vez libre y social: la libertad no ocurre en el vacío, sino en un espacio de posibilidades y de límites. (trad. propia)"
    texto_original: "…our selves are both free and social, i.e., that freedom does not occur in a vacuum, but in a space of affordances and constraints."
    edicion: "The Onlife Manifesto, en L. Floridi (ed.), The Onlife Manifesto, Springer, 2015, § 4.2 «The Relational Self», pp. 11–12, acceso abierto, DOI 10.1007/978-3-319-04093-6_2, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF de acceso abierto. «Affordances» se traduce como «posibilidades» por legibilidad en el aula; el original queda registrado arriba."
    temas: [libertad, presión del grupo, decidir, límites, identidad]
    grados: [9, 10, 11]

  - id: floridi-onlife-manifiesto-4-3-instrumentos
    voz: floridi
    autor: "The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.3"
    texto: "En una esfera pública plural, los demás no pueden reducirse a instrumentos, y hacen falta contención y respeto. (trad. propia, abreviada)"
    texto_original: "These two attitudes are serious hurdles for thinking and experiencing public spheres in the form of plurality, where others cannot be reduced to instruments, and where self-restraint and respect are required."
    edicion: "The Onlife Manifesto, en L. Floridi (ed.), The Onlife Manifesto, Springer, 2015, § 4.3, p. 12, acceso abierto, DOI 10.1007/978-3-319-04093-6_2, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF de acceso abierto (pdf p.6 = p. 12 impresa). «These two attitudes» remite a la utopía de omnisciencia y omnipotencia y a la actitud instrumental hacia el otro, descritas al abrir el §."
    temas: [las personas no son instrumentos, respeto, convivencia digital, contención]
    grados: [9, 10, 11]

  - id: floridi-onlife-manifiesto-4-5-acumular
    voz: floridi
    autor: "The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.5"
    texto: "Se suponía que acumular información y conocimiento llevaría a comprender mejor… pero esa expansión sin fin cada vez describe peor nuestra experiencia diaria. (trad. propia)"
    texto_original: "Earlier notions of rationality presumed that accumulating hard-won information and knowledge would lead to better understanding and thereby control… But this endless expansion is becoming ever less meaningful and less efficient in describing our daily experiences."
    edicion: "The Onlife Manifesto, en L. Floridi (ed.), The Onlife Manifesto, Springer, 2015, § 4.5, p. 12, acceso abierto, DOI 10.1007/978-3-319-04093-6_2, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF de acceso abierto. La elisión omite la mención al «ideal enciclopédico» que va entre las dos oraciones citadas."
    temas: [sobrecarga de información, acumular datos, curaduría, qué vale la pena guardar]
    grados: [9, 10, 11]

  - id: floridi-hiperhistoria-escritura
    voz: floridi
    autor: "Luciano Floridi · Hyperhistory and the Philosophy of Information Policies (2015)"
    texto: "La historia ha durado 6.000 años: empezó con la invención de la escritura en el cuarto milenio antes de Cristo. (trad. propia)"
    texto_original: "History has lasted 6,000 years, since it began with the invention of writing in the fourth millennium BC."
    edicion: "L. Floridi, «Hyperhistory and the Philosophy of Information Policies», en The Onlife Manifesto, Springer, 2015, pp. 51–63 (§ 1, p. 51), acceso abierto, DOI 10.1007/978-3-319-04093-6_12, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF de acceso abierto del capítulo (primera página). Va precedida de la afirmación de que fueron las TIC las que marcaron la diferencia «entre quienes fuimos y quienes somos»."
    temas: [historia de la técnica, escritura, imprenta, era digital, registrar]
    grados: [9, 10, 11]

  # ═══════════════════ AMPLIACIÓN v3 · cotejo 2026-09-09 ═══════════════════
  # Motivo: tras migrar 18 guías de 9.º quedaban 4 citas de Dussel, 1 estoica y
  # 1 de Floridi sin usar, con 12 guías de ese grado y 60 de 10.º y 11.º por
  # delante. El cuello de botella eran los estoicos.
  #
  # NOTA DE MÉTODO sobre Marco Aurelio. Las entradas anteriores del banco citan
  # la traducción de Díaz de Miranda (Wikisource es). Esa página es un OCR de una
  # edición del s. XVIII sin numeración de párrafo visible, así que asignarle un
  # localizador a un pasaje nuevo habría sido adivinar. Las entradas de abajo
  # citan por eso la traducción inglesa de George Long en Wikisource en, que sí
  # trae la numeración estándar, y el español es traducción propia declarada.
  # No mezclar las dos ediciones al citar: cada entrada dice de cuál viene.

  - id: marco-aurelio-ii-5
    voz: estoico
    autor: "Marco Aurelio · Meditaciones II, 5 (c. 175 d.C.)"
    texto: "Haz lo que tienes entre manos con dignidad perfecta y sencilla, con afecto, con libertad y con justicia, y líbrate de todo otro pensamiento. (trad. propia)"
    texto_original: "…to do what thou hast in hand with perfect and simple dignity, and feeling of affection, and freedom, and justice, and to give thyself relief from all other thoughts."
    edicion: "The Thoughts of the Emperor Marcus Aurelius Antoninus, trad. de George Long, Libro II, 5, Wikisource en, consultada 2026-09-09, https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus/Book_II"
    verificacion: "cotejada 2026-09-09 en el texto de Long descargado de Wikisource en, que trae la numeración estándar. Traducción propia; el original inglés queda arriba. El parágrafo abre con «Every moment think steadily as a Roman and a man»."
    temas: [oficio, concentración, hacer bien lo que se tiene delante, cuidado]
    grados: [9, 10, 11]

  - id: marco-aurelio-iv-7
    voz: estoico
    autor: "Marco Aurelio · Meditaciones IV, 7 (c. 175 d.C.)"
    texto: "Quita tu opinión y queda quitada la queja «me han hecho daño». Quita la queja «me han hecho daño» y el daño mismo queda quitado. (trad. propia)"
    texto_original: "Take away thy opinion, and then there is taken away the complaint, \"I have been harmed.\" Take away the complaint, \"I have been harmed,\" and the harm is taken away."
    edicion: "The Thoughts of the Emperor Marcus Aurelius Antoninus, trad. de George Long, Libro IV, 7, Wikisource en, consultada 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el texto de Long. Traducción propia; parágrafo íntegro, sin elisiones."
    temas: [juicio, crítica recibida, separar el hecho de la interpretación]
    grados: [9, 10, 11]

  - id: marco-aurelio-iv-11
    voz: estoico
    autor: "Marco Aurelio · Meditaciones IV, 11 (c. 175 d.C.)"
    texto: "No te formes de las cosas la opinión que tiene quien te agravia, ni la que él querría que tuvieras; míralas como son en verdad. (trad. propia)"
    texto_original: "Do not have such an opinion of things as he has who does thee wrong, or such as he wishes thee to have, but look at them as they are in truth."
    edicion: "The Thoughts of the Emperor Marcus Aurelius Antoninus, trad. de George Long, Libro IV, 11, Wikisource en, consultada 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el texto de Long. Traducción propia; parágrafo íntegro, sin elisiones."
    temas: [lectura crítica, publicidad, gráficos que engañan, mirar el dato como es]
    grados: [9, 10, 11]

  - id: marco-aurelio-v-5
    voz: estoico
    autor: "Marco Aurelio · Meditaciones V, 5 (c. 175 d.C.)"
    texto: "Muestra entonces las cualidades que están enteramente en tu poder: sinceridad, seriedad, resistencia en el trabajo, contento con lo que te toca, benevolencia, franqueza, ninguna afición a lo superfluo. (trad. propia)"
    texto_original: "Show those qualities then which are altogether in thy power, sincerity, gravity, endurance of labor, aversion to pleasure, contentment with thy portion and with few things, benevolence, frankness, no love of superfluity, freedom from trifling, magnanimity."
    edicion: "The Thoughts of the Emperor Marcus Aurelius Antoninus, trad. de George Long, Libro V, 5, Wikisource en, consultada 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el texto de Long. Traducción propia y abreviada: se omiten del final «freedom from trifling, magnanimity» y del interior «aversion to pleasure», por extensión. El parágrafo abre con «Thou sayest, Men cannot admire the sharpness of thy wits»."
    temas: [oficio, lo que sí depende de mí, constancia, trabajo bien hecho]
    grados: [9, 10, 11]

  - id: marco-aurelio-viii-5
    voz: estoico
    autor: "Marco Aurelio · Meditaciones VIII, 5 (c. 175 d.C.)"
    texto: "Con los ojos fijos en tu tarea, mírala y, recordando que es tu deber ser bueno, hazla sin desviarte; y habla como te parezca más justo, con buena disposición, con modestia y sin hipocresía. (trad. propia)"
    texto_original: "…having fixed thy eyes steadily on thy business, look at it, and at the same time remembering that it is thy duty to be a good man, and what man's nature demands, do that without turning aside; and speak as it seems to thee most just, only let it be with a good disposition and with modesty and without hypocrisy."
    edicion: "The Thoughts of the Emperor Marcus Aurelius Antoninus, trad. de George Long, Libro VIII, 5, Wikisource en, consultada 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el texto de Long. Traducción propia, con elisión del arranque del parágrafo («This is the chief thing: Be not perturbed…») y de «and what man's nature demands»."
    temas: [sustentar una posición, hablar con honestidad, sin fingir, foco]
    grados: [9, 10, 11]

  - id: marco-aurelio-ix-6
    voz: estoico
    autor: "Marco Aurelio · Meditaciones IX, 6 (c. 175 d.C.)"
    texto: "Tu opinión presente fundada en el entendimiento, tu conducta presente dirigida al bien común y tu disposición presente de contento con todo lo que sucede: eso basta. (trad. propia)"
    texto_original: "Thy present opinion founded on understanding, and thy present conduct directed to social good, and thy present disposition of contentment with everything which happens†—that is enough."
    edicion: "The Thoughts of the Emperor Marcus Aurelius Antoninus, trad. de George Long, Libro IX, 6, Wikisource en, consultada 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el texto de Long. Traducción propia; parágrafo íntegro. El «†» que aparece en texto_original es la llamada de nota de la edición de Long y no forma parte del texto de Marco Aurelio."
    temas: [criterio propio, bien común, suficiencia, decidir con lo que hay]
    grados: [9, 10, 11]

  - id: marco-aurelio-ix-11
    voz: estoico
    autor: "Marco Aurelio · Meditaciones IX, 11 (c. 175 d.C.)"
    texto: "Si puedes, corrige enseñando a quienes obran mal; y si no puedes, acuérdate de que para eso se te ha dado la indulgencia. (trad. propia)"
    texto_original: "If thou art able, correct by teaching those who do wrong; but if thou canst not, remember that indulgence is given to thee for this purpose."
    edicion: "The Thoughts of the Emperor Marcus Aurelius Antoninus, trad. de George Long, Libro IX, 11, Wikisource en, consultada 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el texto de Long. Traducción propia; se cita solo la primera oración del parágrafo, que continúa sobre la indulgencia de los dioses."
    temas: [corregir a otro, enseñar en vez de castigar, revisión entre pares]
    grados: [9, 10, 11]

  - id: dussel-fl-2-3-7-6
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §2.3.7.6"
    texto: "En el capitalismo, valor es el carácter de un bien en cuanto es producto y objetivación de trabajo humano… pero, y al mismo tiempo, en cuanto ha sido hecho «como mercancía»."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §2.3.7.6, PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF, fragmento por fragmento. Se eliden los incisos «(y el producto \"como producto\" es la productualidad de la cosa)» y la aclaración sobre el valor de cambio."
    temas: [trabajo, valor, mercancía, consumo, precio y esfuerzo]
    grados: [10, 11]

  - id: dussel-fl-3-3-8-3
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §3.3.8.3"
    texto: "Dicha cultura posee los símbolos, los valores, los usos, las tradiciones de sabiduría, la memoria de compromisos históricos; conoce sus enemigos, sus amigos, sus aliados."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §3.3.8.3 (cap. 3.3 «Pedagógica»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF. «Dicha cultura» remite a la cultura popular, definida en las líneas anteriores del mismo parágrafo, que cierra llamándola «el núcleo más incontaminado e irradiativo de resistencia del oprimido»."
    temas: [cultura popular, saber local, memoria, anclas, tradición]
    grados: [9, 10, 11]

  - id: dussel-fl-4-3-4-3
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §4.3.4.3"
    texto: "Los artefactos u objetos… que nos rodean en el mundo cotidiano… son entonces productos del trabajo humano… Si los entes son instrumentos producidos significa que fueron objeto de un cierto trabajo."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §4.3.4.3 (cap. 4.3 «Poiética»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF, fragmento por fragmento. Cada elisión va marcada: se omiten la marca de esquema «(Ob del esquema)», el inciso «la proxemia» y el pasaje sobre los parques naturales."
    temas: [técnica, objetos cotidianos, trabajo detrás de las cosas, diseño]
    grados: [9, 10, 11]

  - id: dussel-fl-5-4-4
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §5.4.4"
    texto: "…era necesario tener un buen coup d'oeil, «ojo clínico» de la situación real…; un uso cuidadoso de la memoria… circunspección o mirada en torno que no pierde detalles; cautela o precaución en el saber sospechar, desconfiar."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §5.4.4 (cap. 5 «Método»), PDF en enriquedussel.com, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF, fragmento por fragmento. Cada elisión va marcada: se omiten el arranque «En primer lugar», el término griego «(aisthesis)» y la lista intermedia de condiciones (intuición, disciplina, sollertia, ratio, perspicacia). El original escribe «ojo clínico\" con comilla de cierre simple, aquí normalizada. El parágrafo cierra: «La decisión es así un juicio práctico querido; es un querer juzgado»."
    temas: [decidir, deliberación, mirar bien, desconfiar, criterio]
    grados: [10, 11]

  - id: floridi-onlife-comentario-1-3-responsabilidad
    voz: floridi
    autor: "Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 1.3"
    texto: "Cuanto más avanzan las tecnologías de la información, más responsable parece la humanidad de cómo van las cosas, y sin embargo más difícil se vuelve identificar fuentes concretas de responsabilidad. (trad. propia)"
    texto_original: "Paradoxically, the more ICTs advance, the more humanity appears responsible for how things go in the world (including in terms of forecasting and prevention of consequences and future event), and yet, the more difficult it becomes to identify specific sources of responsibility."
    edicion: "L. Floridi, «Luciano Floridi—Commentary on the Onlife Manifesto», en The Onlife Manifesto, Springer, 2015, § 1.3, p. 21, acceso abierto, DOI 10.1007/978-3-319-04093-6_4, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF de acceso abierto del capítulo; paginación verificada página por página (pdf p.1 = p. 21 impresa). La traducción omite el inciso sobre previsión y prevención de consecuencias."
    temas: [responsabilidad, automatización, quién responde, algoritmos, decisiones]
    grados: [10, 11]

  - id: floridi-onlife-comentario-3-1-proyecto
    voz: floridi
    autor: "Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 3.1"
    texto: "Una de las preguntas políticas apremiantes que enfrentamos en las sociedades de la información avanzadas es: ¿en qué clase de proyecto humano estamos trabajando? (trad. propia)"
    texto_original: "So one of the pressing political questions that we are facing in advance information societies is: what sort of human project are we working on?"
    edicion: "L. Floridi, «Luciano Floridi—Commentary on the Onlife Manifesto», en The Onlife Manifesto, Springer, 2015, § 3.1, p. 22, acceso abierto, DOI 10.1007/978-3-319-04093-6_4, consultado 2026-09-09"
    verificacion: "cotejada 2026-09-09 en el PDF de acceso abierto (pdf p.2 = p. 22 impresa). Va inmediatamente después de «Technologies are used to save time first, and then to kill it», que ya está en el banco."
    temas: [para qué sirve la técnica, proyecto común, cierre de periodo, manifiesto]
    grados: [9, 10, 11]




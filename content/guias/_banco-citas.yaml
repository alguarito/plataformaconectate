# Banco de citas verificadas · triángulo de pensamiento (9.º–11.º)
# Solo citas cotejadas contra la obra. El campo `autor` es el string exacto que va en el YAML de la guía.
#
# Convenciones
# - `autor` sigue el formato canónico «Nombre · Obra localizador (año)».
# - `autor_repo_previo`: strings que hoy usan las guías (semillero / territorio-interior / 8-1-1) para la misma cita;
#   sirven para migrar. Cuando el localizador del repo era incorrecto, aquí va corregido.
# - `texto`: ≤ 45 palabras, apto para 14–17 años. En obras no escritas en español, `texto_original` trae el pasaje
#   cotejado y `texto` es traducción propia («trad. propia») o la traducción libre cotejada que se indica.
# - Textos del s. XVIII–XIX (Díaz de Miranda, Brun, Navarro y Calvo): se moderniza solo la ortografía (á→a, ú→u…).
# - Fechas de cotejo: 2026-09-04. Fuentes: Wikisource (es/en/la), enriquedussel.com (PDF de la obra), Springer (HTML de
#   acceso abierto), PDF de acceso abierto de The Onlife Manifesto (cap. Manifiesto, con paginación).
version: 1
citas:

  # ───────────────────────── DUSSEL ─────────────────────────
  # Fuente única: Enrique Dussel, «Filosofía de la liberación» (escrita en 1975, 1.ª ed. 1977), texto de la 5.ª edición,
  # PDF libre en el sitio del autor: https://enriquedussel.com/txt/Textos_Libros/29.Filosofia_de_la_liberacion.pdf
  # La numeración de parágrafos (p. ej. 2.4.4.2) es estable entre ediciones; se usa como localizador.

  - id: dussel-fl-5-3-1
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §5.3.1"
    autor_repo_previo:
      - "Enrique Dussel · Filosofía de la liberación (1977), §2.4"
      - "Enrique Dussel · Filosofía de la liberación (1977)"
    texto: "Analéctico quiere indicar el hecho real humano por el que todo hombre, todo grupo o pueblo se sitúa siempre «más allá» (aná-) del horizonte de la totalidad."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §5.3.1 «Momento analéctico» (p. 186 del índice), PDF en enriquedussel.com, consultado 2026-09-04, https://enriquedussel.com/txt/Textos_Libros/29.Filosofia_de_la_liberacion.pdf"
    verificacion: "banco previo del repo (semillero); cotejo: cotejada 2026-09-04 en el PDF de enriquedussel.com. OJO: el repo la ubica en §2.4; el pasaje está en §5.3.1 (que remite a 2.4). El PDF trae «(anó-)» por error de OCR; la forma correcta es «aná-»."
    divergencia_documentada: true
    temas: [exclusión, más allá del sistema, diversidad, pensar desde afuera]
    grados: [10, 11]

  - id: dussel-fl-2-4-4-2
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §2.4.4.2"
    autor_repo_previo:
      - "Enrique Dussel · Filosofía de la liberación (1977)"
    texto: "El otro se revela realmente como otro… como el pobre, el oprimido; el que a la vera del camino, fuera del sistema, muestra su rostro sufriente y sin embargo desafiante: «¡Tengo hambre!, ¡tengo derecho a comer!»."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §2.4.4.2 (cap. 2.4 «Exterioridad»), PDF en enriquedussel.com, consultado 2026-09-04"
    verificacion: "banco previo del repo (semillero); cotejo: cotejada 2026-09-04 en el PDF. Texto íntegro: «El otro se revela realmente como otro (3.4.8.1), en toda la acuidad de su exterioridad, cuando irrumpe como lo más extremadamente distinto, como lo no habitual o cotidiano, como lo extraordinario, lo enorme (fuera de la norma), como el pobre, el oprimido; el que a la vera del camino…». La elipsis del repo es legítima; el original no lleva coma tras «el que»."
    divergencia_documentada: true
    temas: [exclusión, escuchar al otro, dignidad, quién queda fuera del sistema]
    grados: [9, 10, 11]

  - id: dussel-fl-2-4-2-2
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §2.4.2.2"
    texto: "El rostro del hombre se revela como otro cuando se recorta en nuestro sistema de instrumentos como exterior, como alguien, como una libertad que interpela, que provoca, que aparece como el que resiste a la totalización instrumental. No es algo; es alguien."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §2.4.2.2, PDF en enriquedussel.com, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF de enriquedussel.com (párrafo completo)."
    temas: [datos y personas, perfiles, dignidad, exclusión, las personas no son cosas]
    grados: [9, 10, 11]

  - id: dussel-fl-2-5-6-3
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §2.5.6.3"
    texto: "La máquina, el robot, el «rostro material» del capital ha hecho del «rostro del hombre» un instrumento de sí mismo."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §2.5.6.3 (cap. 2.5 «Alienación»), PDF en enriquedussel.com, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF; es la última oración del parágrafo, que habla del campesino «interpretado como un asalariado más… como un accesorio conciente maquínico»."
    temas: [automatización, trabajo, tecnología y personas, exclusión]
    grados: [10, 11]

  - id: dussel-fl-2-6-2-2
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.2"
    texto: "Llamamos conciencia ética la capacidad que se tiene de escuchar la voz del otro, palabra transontológica que irrumpe desde más allá del sistema vigente. Puede que la protesta justa del otro ponga en cuestión los principios morales del sistema."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §2.6.2.2 (cap. 2.6 «Liberación», p. 77), PDF en enriquedussel.com, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF (dos primeras oraciones del parágrafo)."
    temas: [escuchar al otro, ética, criticar el sistema, información y cuidado]
    grados: [10, 11]

  - id: dussel-fl-2-6-2-3
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §2.6.2.3"
    texto: "El respeto es silencio, pero no silencio del que nada tiene que decir, sino del que todo tiene que escuchar porque nada sabe del otro como otro."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §2.6.2.3, PDF en enriquedussel.com, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF (última oración del parágrafo). Sustituye, con texto verificable, a la cita del repo «Aquel que es capaz de escuchar silenciosamente al Otro…», que no aparece en esta obra (ver pendientes)."
    temas: [escuchar al otro, respeto, silencio, diálogo]
    grados: [9, 10, 11]

  - id: dussel-fl-2-6-7-1
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §2.6.7.1"
    texto: "No hay liberación sin economía y tecnología humanizada, diseño, y sin partir de una formación social histórica."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §2.6.7.1, PDF en enriquedussel.com, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF."
    temas: [tecnología, diseño, liberación, tecnología con rostro humano]
    grados: [9, 10, 11]

  - id: dussel-fl-3-3-9-4
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §3.3.9.4"
    texto: "El êthos de la liberación pedagógica exige al maestro saber oír en el silencio con respecto a la juventud, al pueblo."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §3.3.9.4 (cap. 3.3 «Pedagógica»), PDF en enriquedussel.com, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF (primera oración del parágrafo)."
    temas: [escuchar al otro, educación, juventud, aula]
    grados: [9, 10, 11]

  - id: dussel-fl-4-2-5-4
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §4.2.5.4"
    texto: "Se acepta ingenuamente que la información puede ser decodificada, que no existen conflictos lingüísticos, sociales, políticos, eróticos."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §4.2.5.4 (cap. 4.2 «Semiótica», crítica del modelo emisor-canal-receptor), PDF en enriquedussel.com, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF. Oración completa: «Es decir, se acepta ingenuamente que…». En Dussel, «eróticos» designa la relación varón-mujer / familiar (cap. 3.2), no un sentido sexual; explicarlo en clase o cortar en «políticos…»."
    temas: [información, comunicación, modelos y realidad, datos no neutrales]
    grados: [10, 11]

  - id: dussel-fl-4-3-2-4
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §4.3.2.4"
    texto: "La tecnología no es ciencia aplicada (teoría concretada), sino que es técnica científica."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §4.3.2.4 (cap. 4.3 «Poiética», sección «De la técnica al diseño»), PDF en enriquedussel.com, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF. Oración completa: «Es decir, la tecnología no es ciencia aplicada (teoría concretada), sino que es técnica científica (poiética que incluye en su propio proceso fabricativo proyectual a aquello de la ciencia que necesita para sus propios fines)»."
    temas: [qué es la tecnología, ciencia y técnica, diseño, trabajo bien hecho]
    grados: [9, 10, 11]

  - id: dussel-fl-5-9-4-1
    voz: dussel
    autor: "Enrique Dussel · Filosofía de la liberación (1977), §5.9.4.1"
    texto: "Como los temas son infinitos y el tiempo corto, es necesario saber perder tiempo para elegir los temas fundamentales de la época que nos toca vivir."
    texto_original: null
    edicion: "Filosofía de la liberación, 5.ª ed., §5.9.4.1 (cap. 5.9 «Filosofía de la liberación», p. 203), PDF en enriquedussel.com, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF. Sigue: «Es necesario saber perder tiempo para comprometerse con las luchas de los pueblos periféricos… Es necesario saber perder tiempo en escuchar la voz de dicho pueblo»."
    temas: [tiempo y atención, elegir, prioridades, escuchar al otro]
    grados: [9, 10, 11]

  # ───────────────────────── ESTOICOS · MARCO AURELIO ─────────────────────────
  # Fuente: Marco Aurelio, «Soliloquios» (= Meditaciones), trad. de Jacinto Díaz de Miranda (1786), en «Obras de los
  # moralistas griegos» (Madrid, Hernando, 1888), Wikisource es: https://es.wikisource.org/wiki/Soliloquios
  # Esa edición no numera los parágrafos; la numeración libro/número es la estándar, cotejada con la trad. inglesa de
  # G. Long en Wikisource en (https://en.wikisource.org/wiki/The_Thoughts_of_the_Emperor_Marcus_Aurelius_Antoninus).

  - id: marco-aurelio-vi-21
    voz: estoico
    autor: "Marco Aurelio · Meditaciones VI, 21 (c. 175 d.C.)"
    autor_repo_previo:
      - "Marco Aurelio · Meditaciones VI, 21 (c. 175 d.C.)"
    texto: "Si alguno pudiese convencerme y hacerme patente que yo no pienso con rectitud u obro bien, con mucho gusto mudaría de dictamen y de conducta; porque yo busco la verdad, la cual jamás dañó a ninguno."
    texto_original: null
    edicion: "Trad. de Jacinto Díaz de Miranda, Soliloquios, Libro VI, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Soliloquios/Libro_VI"
    verificacion: "banco previo del repo (semillero); cotejo: cotejada 2026-09-04 en Wikisource es (Díaz de Miranda) y numeración en Wikisource en (Long, VI.21). El texto que hoy usa el repo («Si alguien puede refutarme y probar de modo concluyente…») sigue la trad. de Bach Pellicer (Gredos, 1977), con derechos y no cotejable en línea; aquí va la versión de dominio público. El OCR de Wikisource trae «ú otro bien» por «u obro bien»."
    temas: [verdad, error, cambiar de opinión, discutir con datos]
    grados: [9, 10, 11]

  - id: marco-aurelio-vi-53
    voz: estoico
    autor: "Marco Aurelio · Meditaciones VI, 53 (c. 175 d.C.)"
    texto: "Acostúmbrate a estar con atención a lo que dice el otro, y en cuanto te sea posible intérnate dentro del alma del que hablare contigo."
    texto_original: null
    edicion: "Trad. de Jacinto Díaz de Miranda, Soliloquios, Libro VI, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Soliloquios/Libro_VI"
    verificacion: "cotejada 2026-09-04 en Wikisource es; numeración cotejada con Long VI.53 («Accustom thyself to attend carefully to what is said by another»)."
    temas: [escuchar al otro, atención, diálogo]
    grados: [9, 10, 11]

  - id: marco-aurelio-vi-54
    voz: estoico
    autor: "Marco Aurelio · Meditaciones VI, 54 (c. 175 d.C.)"
    autor_repo_previo:
      - "Marco Aurelio · Meditaciones VI, 54 (c. 175 d.C.)"
    texto: "Lo que no es bueno para el enjambre, tampoco es conducente para la abeja."
    texto_original: null
    edicion: "Trad. de Jacinto Díaz de Miranda, Soliloquios, Libro VI, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Soliloquios/Libro_VI"
    verificacion: "banco previo del repo (semillero: «Lo que no beneficia al enjambre, tampoco beneficia a la abeja»); cotejo: cotejada 2026-09-04 en Wikisource es (Díaz de Miranda) y en Long VI.54. El sentido coincide; la redacción del repo es paráfrasis moderna."
    temas: [bien común, comunidad, redes, datos compartidos]
    grados: [9, 10, 11]

  - id: marco-aurelio-vii-47
    voz: estoico
    autor: "Marco Aurelio · Meditaciones VII, 47 (c. 175 d.C.)"
    autor_repo_previo:
      - "Marco Aurelio · Meditaciones VII, 47 (c. 175 d.C.)"
      - "Marco Aurelio · Meditaciones VII, 47 (trad. Bach Pellicer, Gredos, 1977)"
    texto: "Conduce mirar alrededor el curso de los astros, como quien gira con ellos, y contemplar también frecuentemente las mutuas conversiones de los elementos, porque las consideraciones de estas cosas purifican a uno de las manchas de esta vida terrestre."
    texto_original: null
    edicion: "Trad. de Jacinto Díaz de Miranda, Soliloquios, Libro VII, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Soliloquios/Libro_VII"
    verificacion: "banco previo del repo (semillero, territorio-interior); cotejo: cotejada 2026-09-04 en Wikisource es (Díaz de Miranda) y numeración en Long VII.47. El texto del repo («Contempla las evoluciones de los astros…») es la trad. de Bach Pellicer (Gredos), no cotejable en línea."
    temas: [cambio, perspectiva, ciencia, mirar el conjunto]
    grados: [9, 10, 11]

  - id: marco-aurelio-viii-16
    voz: estoico
    autor: "Marco Aurelio · Meditaciones VIII, 16 (c. 175 d.C.)"
    texto: "Acuérdate que igualmente te es libre el mudar de parecer y el seguir el aviso de quien te corrija."
    texto_original: null
    edicion: "Trad. de Jacinto Díaz de Miranda, Soliloquios, Libro VIII, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Soliloquios/Libro_VIII"
    verificacion: "cotejada 2026-09-04 en Wikisource es; numeración cotejada con Long VIII.16 («Remember that to change thy opinion and to follow him who corrects thy error is as consistent with freedom…»)."
    temas: [error, cambiar de opinión, corrección, revisión entre pares]
    grados: [9, 10, 11]

  - id: marco-aurelio-x-16
    voz: estoico
    autor: "Marco Aurelio · Meditaciones X, 16 (c. 175 d.C.)"
    texto: "De hoy más, déjate absolutamente de disputar cuál conviene que sea un hombre bueno, sino procura ser tal en realidad."
    texto_original: null
    edicion: "Trad. de Jacinto Díaz de Miranda, Soliloquios, Libro X, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Soliloquios/Libro_X"
    verificacion: "cotejada 2026-09-04 en Wikisource es; numeración cotejada con Long X.16 («No longer talk at all about the kind of man that a good man ought to be, but be such»)."
    temas: [trabajo bien hecho, coherencia, hacer más que hablar]
    grados: [9, 10, 11]

  # ───────────────────────── ESTOICOS · EPICTETO ─────────────────────────
  # Fuente: Epicteto, «Enchiridión o Máximas», trad. de Antonio Brun, en «Obras de los moralistas griegos» (Madrid,
  # Hernando, 1888), Wikisource es: https://es.wikisource.org/wiki/Enquiridión/Máximas
  # Esa edición divide el texto con su propia numeración (se indica como «ed. 1888: máx. N»); el § del campo `autor`
  # es el estándar, cotejado con la trad. inglesa de Elizabeth Carter (1759) en Wikisource en
  # (https://en.wikisource.org/wiki/All_the_Works_of_Epictetus,_Which_Are_Now_Extant/The_Encheiridion).

  - id: epicteto-enq-1
    voz: estoico
    autor: "Epicteto · Enquiridión, 1 (c. 125 d.C.)"
    autor_repo_previo:
      - "Epicteto · Enquiridión, 1 (c. 125 d.C.; trad. desde E. Carter)"
    texto: "Hay ciertas cosas que dependen de nosotros mismos, como la opinión, la inclinación, los deseos, la aversión, y en una palabra, todas nuestras operaciones. Otras hay también que no dependen, como el cuerpo, las riquezas, la reputación, los imperios."
    texto_original: null
    edicion: "Trad. de Antonio Brun, Máximas, ed. 1888: máx. I, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Enquiridi%C3%B3n/M%C3%A1ximas"
    verificacion: "banco previo del repo (semillero: «Algunas cosas están en nuestro poder y otras no…», trad. desde Carter); cotejo: cotejada 2026-09-04 en Wikisource es (Brun) y en Carter §1 («Some things are in our power, and others not…»). Sentido idéntico; la redacción del repo es traducción propia desde el inglés."
    temas: [decidir con lo que depende de uno, control, ansiedad digital]
    grados: [9, 10, 11]

  - id: epicteto-enq-5
    voz: estoico
    autor: "Epicteto · Enquiridión, 5 (c. 125 d.C.)"
    autor_repo_previo:
      - "Epicteto · Enquiridión, 5 (c. 125 d.C.)"
    texto: "No son las cosas las que atormentan a los hombres, sino las opiniones que se tienen de ellas."
    texto_original: null
    edicion: "Trad. de Antonio Brun, Máximas, ed. 1888: máx. X, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Enquiridi%C3%B3n/M%C3%A1ximas"
    verificacion: "banco previo del repo (semillero: «No son las cosas las que perturban a los hombres, sino las opiniones sobre las cosas»); cotejo: cotejada 2026-09-04 en Wikisource es (Brun) y en Carter §5 («Men are disturbed not by things, but by the principles and notions which they form concerning things»)."
    temas: [opinión y realidad, emociones, redes]
    grados: [9, 10, 11]

  - id: epicteto-enq-20
    voz: estoico
    autor: "Epicteto · Enquiridión, 20 (c. 125 d.C.)"
    texto: "Acuérdate que no te ofende el que te injuria, ni el que te golpea, sino la opinión que has concebido."
    texto_original: null
    edicion: "Trad. de Antonio Brun, Máximas, ed. 1888: máx. XXVIII, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Enquiridi%C3%B3n/M%C3%A1ximas"
    verificacion: "cotejada 2026-09-04 en Wikisource es (Brun); numeración estándar cotejada con Carter §20 («Remember that it is not he who reviles you… but the principle which represents these things as insulting»)."
    temas: [insultos en línea, lo que depende de uno, ciberacoso]
    grados: [9, 10, 11]

  - id: epicteto-enq-33
    voz: estoico
    autor: "Epicteto · Enquiridión, 33 (c. 125 d.C.)"
    texto: "Guarda el silencio cuanto te fuere posible. Nunca digas sino lo que absolutamente es necesario, y en ello emplea las menos palabras que pudieres."
    texto_original: null
    edicion: "Trad. de Antonio Brun, Máximas, ed. 1888: máx. XLII, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Enquiridi%C3%B3n/M%C3%A1ximas"
    verificacion: "cotejada 2026-09-04 en Wikisource es (Brun); numeración estándar cotejada con Carter §33 («Be for the most part silent: or speak merely what is necessary, and in few words»)."
    temas: [publicar, atención, decir lo necesario, ruido]
    grados: [9, 10, 11]

  - id: epicteto-enq-42
    voz: estoico
    autor: "Epicteto · Enquiridión, 42 (c. 125 d.C.)"
    texto: "Cuando alguno te hace mal o habla mal de ti, acuérdate que cree deberlo hacer así. ¿Piensas tú que pueda dejar su opinión para seguir la tuya?"
    texto_original: null
    edicion: "Trad. de Antonio Brun, Máximas, ed. 1888: máx. LXIV, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Enquiridi%C3%B3n/M%C3%A1ximas"
    verificacion: "cotejada 2026-09-04 en Wikisource es (Brun); numeración estándar cotejada con Carter §42 («When any person doth ill by you, or speaks ill of you, remember that he acts or speaks from a supposition of its being his duty»)."
    temas: [escuchar al otro, desacuerdo, redes, empatía]
    grados: [9, 10, 11]

  - id: epicteto-enq-45
    voz: estoico
    autor: "Epicteto · Enquiridión, 45 (c. 125 d.C.)"
    texto: "Cuando ves alguno en el baño que se lava pronto, no digas que se lava mal, sino que se lava muy pronto… En efecto, ¿de dónde aprendiste que hizo mal para formar tal juicio?"
    texto_original: null
    edicion: "Trad. de Antonio Brun, Máximas, ed. 1888: máx. LXVII, Wikisource es, consultada 2026-09-04, https://es.wikisource.org/wiki/Enquiridi%C3%B3n/M%C3%A1ximas"
    verificacion: "cotejada 2026-09-04 en Wikisource es (Brun); numeración estándar cotejada con Carter §45 («Does anyone bathe hastily? Do not say that he does it ill, but hastily»). El OCR de Wikisource desordena la frase intermedia sobre «beber mucho»; por eso la elipsis. El repo (semillero, sin obra) trae «Se lava uno con prisas: no digas que “mal”, sino que “con prisas”», paráfrasis de este mismo pasaje."
    temas: [verdad y error, juicio precipitado, sesgos, hechos vs. interpretaciones]
    grados: [9, 10, 11]

  # ───────────────────────── ESTOICOS · SÉNECA ─────────────────────────
  # Fuentes: latín en Wikisource la (Epistulae morales ad Lucilium; De ira; De brevitate vitae); traducciones en
  # Wikisource es: «Cartas a Lucilio (Wikisource tr.)» (trad. colaborativa, 2009), «De la ira» (trad. Francisco Navarro y
  # Calvo, 1884) y «De la brevedad de la vida» (traductor no indicado en Wikisource; castellano clásico).

  - id: seneca-ep-1-3
    voz: estoico
    autor: "Séneca · Cartas a Lucilio, 1 (c. 64 d.C.)"
    texto: "Mientras la diferimos, la vida transcurre. Todo lo demás, Lucilio, nos es ajeno. Sólo el tiempo, objeto tan fugaz como esquivo, es nuestro."
    texto_original: "Dum differtur vita transcurrit. Omnia, Lucili, aliena sunt, tempus tantum nostrum est; in huius rei unius fugacis ac lubricae possessionem natura nos misit."
    edicion: "Latín: Epistulae morales ad Lucilium, Liber I, ep. 1, 3, Wikisource la, https://la.wikisource.org/wiki/Epistulae_morales_ad_Lucilium/Liber_I · Español: Cartas a Lucilio (Wikisource tr.), Carta 1, https://es.wikisource.org/wiki/Cartas_a_Lucilio_(Wikisource_tr.)/Carta_1 · consultadas 2026-09-04"
    verificacion: "cotejada 2026-09-04 en latín (Wikisource la, ep. 1, 3) y en la trad. de Wikisource es, de la que se toma el texto."
    temas: [tiempo y atención, procrastinación, pantallas]
    grados: [9, 10, 11]

  - id: seneca-ep-2-4
    voz: estoico
    autor: "Séneca · Cartas a Lucilio, 2 (c. 64 d.C.)"
    texto: "Empalagarse con muchas cosas es lo propio de los estómagos hastiados. Lo mucho y lo muy diverso, no nutre: contamina."
    texto_original: "Fastidientis stomachi est multa degustare; quae ubi varia sunt et diversa, inquinant non alunt."
    edicion: "Latín: Epistulae morales ad Lucilium, Liber I, ep. 2, 4, Wikisource la · Español: Cartas a Lucilio (Wikisource tr.), Carta 2, https://es.wikisource.org/wiki/Cartas_a_Lucilio_(Wikisource_tr.)/Carta_2 · consultadas 2026-09-04"
    verificacion: "cotejada 2026-09-04 en latín (ep. 2, 4) y en la trad. de Wikisource es, de la que se toma el texto. En la misma carta (2, 3): «Distringit librorum multitudo… satis est habere quantum legas» («si no puedes leer todo lo que puedas poseer, suficiente te sea poseer lo que puedas leer»)."
    temas: [sobrecarga de información, atención, scroll infinito, leer a fondo]
    grados: [9, 10, 11]

  - id: seneca-ep-13-4
    voz: estoico
    autor: "Séneca · Cartas a Lucilio, 13 (c. 64 d.C.)"
    autor_repo_previo:
      - "Séneca"
    texto: "Muchas más son, Lucilio, las cosas que nos aterran que las que realmente nos aprietan; frecuentemente sufrimos más por las opiniones que por la realidad."
    texto_original: "Plura sunt, Lucili, quae nos terrent quam quae premunt, et saepius opinione quam re laboramus."
    edicion: "Latín: Epistulae morales ad Lucilium, Liber II, ep. 13, 4, Wikisource la, https://la.wikisource.org/wiki/Epistulae_morales_ad_Lucilium/Liber_II · Español: Cartas a Lucilio (Wikisource tr.), Carta 13, https://es.wikisource.org/wiki/Cartas_a_Lucilio_(Wikisource_tr.)/Carta_13 · consultadas 2026-09-04"
    verificacion: "banco previo del repo (semillero, sin obra: «Son más las cosas que nos asustan que las que nos aplastan, y sufrimos más en la imaginación que en la realidad»); cotejo: cotejada 2026-09-04 en latín y en la trad. de Wikisource es (texto tomado de esta, con ajuste mínimo de puntuación). La versión del repo es paráfrasis fiel."
    temas: [miedo, opinión y realidad, alarmismo, noticias]
    grados: [9, 10, 11]

  - id: seneca-ep-20-2
    voz: estoico
    autor: "Séneca · Cartas a Lucilio, 20 (c. 64 d.C.)"
    autor_repo_previo:
      - "Séneca · Cartas a Lucilio, 20 (c. 64 d.C.)"
    texto: "La filosofía enseña a hacer, no a decir; y exige que cada uno viva según su propia ley, que la vida no desdiga de la palabra. (trad. propia)"
    texto_original: "Facere docet philosophia, non dicere, et hoc exigit, ut ad legem suam quisque vivat, ne orationi vita dissentiat vel ipsa inter se vita."
    edicion: "Latín: Epistulae morales ad Lucilium, Liber II, ep. 20, 2, Wikisource la, https://la.wikisource.org/wiki/Epistulae_morales_ad_Lucilium/Liber_II · Español de apoyo: Cartas a Lucilio (Wikisource tr.), Carta 20, https://es.wikisource.org/wiki/Cartas_a_Lucilio_(Wikisource_tr.)/Carta_20 · consultadas 2026-09-04"
    verificacion: "banco previo del repo (semillero, territorio-interior: «La filosofía enseña a obrar, no a hablar; quiere que cada uno viva a la manera que prescribe, que estén en armonía nuestras palabras con nuestras acciones»); cotejo: cotejada 2026-09-04 contra el latín (ep. 20, 2) y contra la trad. de Wikisource es («La filosofía enseña a hacer, no de hablar…»). El texto del repo es fiel al sentido pero no coincide literalmente con ninguna traducción libre localizada; se ofrece trad. propia."
    temas: [trabajo bien hecho, coherencia, hacer más que hablar]
    grados: [9, 10, 11]

  - id: seneca-ira-ii-29-1
    voz: estoico
    autor: "Séneca · Sobre la ira, II, 29 (c. 45 d.C.)"
    autor_repo_previo:
      - "Séneca · Sobre la ira, libro II (c. 45 d.C.)"
    texto: "El mayor remedio para la ira es la demora. (trad. propia)"
    texto_original: "Maximum remedium irae mora est. Hoc ab illa pete initio, non ut ignoscat sed ut iudicet: graues habet impetus primos; desinet, si expectat."
    edicion: "Latín: De ira, Liber II, cap. XXIX, 1, Wikisource la, https://la.wikisource.org/wiki/De_ira/Liber_II · Español: De la ira (1884), trad. Francisco Navarro y Calvo, Libro segundo, https://es.wikisource.org/wiki/De_la_ira/Libro_segundo · consultadas 2026-09-04"
    verificacion: "banco previo del repo (territorio-interior); cotejo: cotejada 2026-09-04 en latín (II, 29, 1) y en Navarro y Calvo («El mejor remedio para la ira es el tiempo. No le pidas al principio que perdone, sino que juzgue; si espera, se disipa»). El texto del repo traduce «mora» como «demora», más literal; se mantiene."
    temas: [pausa antes de responder, redes, ira, autocontrol]
    grados: [9, 10, 11]

  - id: seneca-ira-ii-29-2
    voz: estoico
    autor: "Séneca · Sobre la ira, II, 29 (c. 45 d.C.)"
    texto: "En cuanto a las que nos refieren, no debemos apresurarnos a creerlas. Muchos mienten para engañar, otros porque están engañados."
    texto_original: "De iis quae narrata sunt non debemus cito credere: multi mentiuntur ut decipiant, multi quia decepti sunt."
    edicion: "Latín: De ira, Liber II, cap. XXIX, 2, Wikisource la, https://la.wikisource.org/wiki/De_ira/Liber_II · Español: De la ira (1884), trad. Francisco Navarro y Calvo, Libro segundo, https://es.wikisource.org/wiki/De_la_ira/Libro_segundo · consultadas 2026-09-04"
    verificacion: "cotejada 2026-09-04 en latín (II, 29, 2) y en Navarro y Calvo, de quien se toma el texto. Sigue: «¿Y al amigo le condenas en el acto, sin oírle, sin interrogarle?»."
    temas: [desinformación, verificar antes de compartir, rumores, verdad y error]
    grados: [9, 10, 11]

  - id: seneca-brev-i-4
    voz: estoico
    autor: "Séneca · De la brevedad de la vida, I (c. 49 d.C.)"
    texto: "Lo cierto es que la vida que se nos dio no es breve, nosotros hacemos que lo sea; y que no somos pobres, sino pródigos del tiempo."
    texto_original: "Ita est: non accipimus brevem vitam, sed facimus, nec inopes eius sed prodigi sumus."
    edicion: "Latín: De brevitate vitae, I, 4, Wikisource la, https://la.wikisource.org/wiki/De_brevitate_vitae · Español: De la brevedad de la vida, cap. I, Wikisource es (traductor no indicado), https://es.wikisource.org/wiki/De_la_brevedad_de_la_vida · consultadas 2026-09-04"
    verificacion: "cotejada 2026-09-04 en latín (I, 4) y en la trad. castellana de Wikisource es, de la que se toma el texto. Antes (I, 3): «Non exiguum temporis habemus, sed multum perdimus» («El tiempo que tenemos no es corto; pero perdiendo mucho de él, hacemos que lo sea»)."
    temas: [tiempo y atención, uso del tiempo, pantallas]
    grados: [9, 10, 11]

  # ───────────────────────── FLORIDI ─────────────────────────
  # Fuentes cotejadas:
  # (A) L. Floridi, «Big Data and Their Epistemological Challenge», Philosophy & Technology 25(4), 2012, pp. 435–437,
  #     texto íntegro de acceso libre en https://link.springer.com/article/10.1007/s13347-012-0093-4 (HTML; la
  #     paginación exacta por frase no es visible, se indica aproximada).
  # (B) The Onlife Initiative (grupo de la Comisión Europea presidido por Floridi), «The Onlife Manifesto», en
  #     L. Floridi (ed.), The Onlife Manifesto. Being Human in a Hyperconnected Era, Springer, 2015, pp. 7–13 (acceso
  #     abierto CC BY-NC; DOI 10.1007/978-3-319-04093-6_2). Cotejado en el PDF con paginación.
  # (C) L. Floridi, «Luciano Floridi—Commentary on the Onlife Manifesto», ibíd., pp. 21–23 (acceso abierto,
  #     https://link.springer.com/chapter/10.1007/978-3-319-04093-6_4).
  # (D) L. Floridi, «Hyperhistory and the Philosophy of Information Policies», ibíd., pp. 51–63 (acceso abierto,
  #     https://link.springer.com/chapter/10.1007/978-3-319-04093-6_12).

  - id: floridi-bigdata-2012-pequenos-patrones
    voz: floridi
    autor: "Luciano Floridi · Big data and their epistemological challenge (2012)"
    autor_repo_previo:
      - "Luciano Floridi · Big data and their epistemological challenge (2012)"
    texto: "Los pequeños patrones solo pueden ser significativos si se agregan correctamente, se comparan y se procesan a tiempo. (trad. propia, abreviada)"
    texto_original: "Unfortunately, small patterns may be significant only if properly aggregated, e.g. in terms of loyalty cards and shopping suggestions, compared, as when a bank can use big data to fight fraudsters, and timely processed, as in financial markets."
    edicion: "Philosophy & Technology 25(4), 2012, pp. 435–437 (frase en p. 436 aprox.), Springer, acceso libre, consultado 2026-09-04, https://link.springer.com/article/10.1007/s13347-012-0093-4"
    verificacion: "banco previo del repo (semillero); cotejo: cotejada 2026-09-04 en el HTML de acceso libre de Springer. La versión del repo omite los ejemplos (tarjetas de fidelidad, bancos, mercados) y es fiel."
    temas: [datos, patrones, análisis de datos, contexto]
    grados: [9, 10, 11]

  - id: floridi-bigdata-2012-problema
    voz: floridi
    autor: "Luciano Floridi · Big data and their epistemological challenge (2012)"
    texto: "El verdadero problema epistemológico de los grandes datos son los pequeños patrones. (trad. propia)"
    texto_original: "The real, epistemological problem with big data is small patterns."
    edicion: "Philosophy & Technology 25(4), 2012, pp. 435–437 (p. 436 aprox.), Springer, acceso libre, consultado 2026-09-04, https://link.springer.com/article/10.1007/s13347-012-0093-4"
    verificacion: "cotejada 2026-09-04 en el HTML de acceso libre de Springer."
    temas: [datos, patrones, qué buscar en los datos]
    grados: [9, 10, 11]

  - id: floridi-bigdata-2012-epistemologia
    voz: floridi
    autor: "Luciano Floridi · Big data and their epistemological challenge (2012)"
    texto: "Necesitamos más y mejores técnicas y tecnologías para ver los pequeños patrones en los datos, pero necesitamos más y mejor epistemología para cribar los valiosos. (trad. propia)"
    texto_original: "We need more and better techniques and technologies to see the small data patterns, but we need more and better epistemology to sift the valuable ones."
    edicion: "Philosophy & Technology 25(4), 2012, pp. 435–437 (p. 437 aprox.), Springer, acceso libre, consultado 2026-09-04, https://link.springer.com/article/10.1007/s13347-012-0093-4"
    verificacion: "cotejada 2026-09-04 en el HTML de acceso libre de Springer."
    temas: [datos, pensar antes de calcular, criterio, verdad y error]
    grados: [10, 11]

  - id: floridi-bigdata-2012-basura
    voz: floridi
    autor: "Luciano Floridi · Big data and their epistemological challenge (2012)"
    texto: "Parafraseando un dicho de la publicidad: la mitad de nuestros datos es basura, solo que no sabemos cuál mitad. Lo que necesitamos es entender mejor qué datos vale la pena conservar. (trad. propia)"
    texto_original: "Rephrasing a common saying in advertisement, half of our data is junk, we just do not know which half. So what we need is a better understanding of which data are worth preserving."
    edicion: "Philosophy & Technology 25(4), 2012, pp. 435–437 (p. 437 aprox.), Springer, acceso libre, consultado 2026-09-04, https://link.springer.com/article/10.1007/s13347-012-0093-4"
    verificacion: "cotejada 2026-09-04 en el HTML de acceso libre de Springer."
    temas: [datos, qué guardar y qué borrar, información y cuidado, almacenamiento]
    grados: [9, 10, 11]

  - id: floridi-bigdata-2012-preguntar
    voz: floridi
    autor: "Luciano Floridi · Big data and their epistemological challenge (2012)"
    texto: "La partida la ganarán quienes «sepan preguntar y responder» (Platón, Crátilo 390c) y, por tanto, sepan qué datos pueden ser útiles y relevantes, y merecen recogerse y cuidarse. (trad. propia)"
    texto_original: "…ultimately, the game will be won by those who “know how to ask and answer questions” (Plato, Cratylus, 390c) and therefore know which data may be useful and relevant, and hence worth collecting and curating, in order to exploit their valuable patterns."
    edicion: "Philosophy & Technology 25(4), 2012, pp. 435–437 (p. 437 aprox.), Springer, acceso libre, consultado 2026-09-04, https://link.springer.com/article/10.1007/s13347-012-0093-4"
    verificacion: "cotejada 2026-09-04 en el HTML de acceso libre de Springer."
    temas: [hacer buenas preguntas, datos, investigación escolar, trabajo bien hecho]
    grados: [9, 10, 11]

  - id: floridi-onlife-manifiesto-p7-sentido
    voz: floridi
    autor: "The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), Prefacio"
    texto: "Tememos y rechazamos aquello a lo que no logramos dar sentido y significado. (trad. propia)"
    texto_original: "…we fear and reject what we fail to make sense of and give meaning to."
    edicion: "The Onlife Manifesto, en L. Floridi (ed.), The Onlife Manifesto, Springer, 2015, p. 7 (Preface), acceso abierto, DOI 10.1007/978-3-319-04093-6_2, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF de acceso abierto del capítulo (con paginación) y en el HTML de Springer. Autoría colectiva del grupo Onlife presidido por Floridi; en la Introducción (p. 2) Floridi indica que el material no atribuido es obra de todo el grupo."
    temas: [miedo a la tecnología, comprender antes de rechazar, cambio]
    grados: [9, 10, 11]

  - id: floridi-onlife-manifiesto-2-3-sobrecarga
    voz: floridi
    autor: "The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 2.3"
    texto: "La abundancia de información también puede producir sobrecarga cognitiva, distracción y amnesia (el presente olvidadizo). (trad. propia)"
    texto_original: "The abundance of information may also result in cognitive overload, distraction, and amnesia (the forgetful present)."
    edicion: "The Onlife Manifesto, en L. Floridi (ed.), The Onlife Manifesto, Springer, 2015, § 2.3, p. 9, acceso abierto, DOI 10.1007/978-3-319-04093-6_2, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF de acceso abierto del capítulo (p. 9) y en el HTML de Springer."
    temas: [sobrecarga de información, atención, distracción, memoria]
    grados: [9, 10, 11]

  - id: floridi-onlife-manifiesto-4-6-atencion
    voz: floridi
    autor: "The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6"
    texto: "Afirmamos que las capacidades atencionales son un bien finito, precioso y escaso. (trad. propia)"
    texto_original: "…we assert that attentional capabilities are a finite, precious and rare asset."
    edicion: "The Onlife Manifesto, en L. Floridi (ed.), The Onlife Manifesto, Springer, 2015, § 4.6 «Caring for Our Attentional Capabilities», p. 12, acceso abierto, DOI 10.1007/978-3-319-04093-6_2, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF de acceso abierto del capítulo (p. 12) y en el HTML de Springer."
    temas: [tiempo y atención, economía de la atención, cuidado]
    grados: [9, 10, 11]

  - id: floridi-onlife-manifiesto-4-6-diseno
    voz: floridi
    autor: "The Onlife Initiative (ed. Luciano Floridi) · The Onlife Manifesto (2015), § 4.6"
    texto: "Las configuraciones por defecto y otros aspectos del diseño de nuestras tecnologías deberían respetar y proteger las capacidades atencionales. (trad. propia)"
    texto_original: "We believe that, in addition to offering informed choices, the default settings and other designed aspects of our technologies should respect and protect attentional capabilities."
    edicion: "The Onlife Manifesto, en L. Floridi (ed.), The Onlife Manifesto, Springer, 2015, § 4.6, p. 13, acceso abierto, DOI 10.1007/978-3-319-04093-6_2, consultado 2026-09-04"
    verificacion: "cotejada 2026-09-04 en el PDF de acceso abierto del capítulo (p. 13) y en el HTML de Springer."
    temas: [diseño, configuración por defecto, atención, información y cuidado, apps]
    grados: [9, 10, 11]

  - id: floridi-onlife-comentario-3-1-tiempo
    voz: floridi
    autor: "Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 3.1"
    texto: "Las tecnologías se usan primero para ahorrar tiempo y luego para matarlo. (trad. propia)"
    texto_original: "Technologies are used to save time first, and then to kill it."
    edicion: "L. Floridi, «Luciano Floridi—Commentary on the Onlife Manifesto», en The Onlife Manifesto, Springer, 2015, pp. 21–23 (§ 3.1), acceso abierto, consultado 2026-09-04, https://link.springer.com/chapter/10.1007/978-3-319-04093-6_4"
    verificacion: "cotejada 2026-09-04 en el HTML de acceso abierto de Springer (paginación interna no visible; el capítulo ocupa pp. 21–23)."
    temas: [tiempo y atención, uso del tiempo, pantallas]
    grados: [9, 10, 11]

  - id: floridi-onlife-comentario-4-6-tiempo-finito
    voz: floridi
    autor: "Luciano Floridi · Commentary on the Onlife Manifesto (2015), § 4.6"
    texto: "Lo que en última instancia es finito, precioso, no renovable e incompartible es, en realidad, el tiempo. (trad. propia)"
    texto_original: "What is ultimately finite, precious, not-renewable, and unsharable is actually time."
    edicion: "L. Floridi, «Luciano Floridi—Commentary on the Onlife Manifesto», en The Onlife Manifesto, Springer, 2015, pp. 21–23 (§ 4.6), acceso abierto, consultado 2026-09-04, https://link.springer.com/chapter/10.1007/978-3-319-04093-6_4"
    verificacion: "cotejada 2026-09-04 en el HTML de acceso abierto de Springer."
    temas: [tiempo y atención, decidir con lo que depende de uno]
    grados: [9, 10, 11]

  - id: floridi-onlife-hiperhistoria-inforgs
    voz: floridi
    autor: "Luciano Floridi · Hyperhistory and the Philosophy of Information Policies (2015)"
    autor_repo_previo:
      - "Luciano Floridi · La cuarta revolución (2014)"
      - "Luciano Floridi · La cuarta revolución (2014; trad.)"
      - "Luciano Floridi"
    texto: "Una cuarta revolución en nuestra autocomprensión —tras la copernicana, la darwiniana y la freudiana— que reinterpreta a los humanos como organismos informacionales que viven e interactúan con otros agentes informacionales en la infoesfera. (trad. propia)"
    texto_original: "…a fourth revolution in our self-understanding—after the Copernican, the Darwinian, and Freudian ones—that re-interprets humans as informational organisms living and interacting with other informational agents in the infosphere."
    edicion: "L. Floridi, «Hyperhistory and the Philosophy of Information Policies», en The Onlife Manifesto, Springer, 2015, pp. 51–63 (§ 2 «The Philosophy of Information Policies»), acceso abierto, consultado 2026-09-04, https://link.springer.com/chapter/10.1007/978-3-319-04093-6_12"
    verificacion: "cotejada 2026-09-04 en el HTML de acceso abierto de Springer. Es el equivalente verificable de la cita del repo «Somos organismos informacionales (inforgs)…» atribuida a La cuarta revolución (2014), que no se pudo cotejar (ver pendientes)."
    temas: [infoesfera, quiénes somos en la era digital, identidad digital]
    grados: [10, 11]

  # ═══════════════════ AMPLIACIÓN v2 · cotejo 2026-09-09 ═══════════════════
  # Motivo: con 42 citas (7 Dussel y 10 Floridi aptas para 9.º) las 87 guías de
  # 9.º–11.º en modo `citas` habrían repetido cada cita de Dussel unas 12 veces.

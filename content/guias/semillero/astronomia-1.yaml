# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Magnitud aparente
      definicion: |-
        Medida del brillo de un astro tal como se ve desde la Tierra. Escala invertida heredada de Hiparco: entre más brillante, más pequeño el número (y puede ser negativo). No mide la potencia real de la estrella, sino cómo nos llega.
      ejemplo: |-
        Sirio es −1,5 (brillantísima) y la estrella más débil que ve el ojo humano en cielo perfecto es ≈ 6. Una vela cerca le gana a un reflector lejano: por eso «aparente» no es «real».
      emoji: "✨"
      categoria: "Medición"
    - termino: Altura y azimut
      definicion: |-
        Los dos números que ubican cualquier objeto en el cielo. Altura: grados sobre el horizonte (0° = horizonte, 90° = cénit). Azimut: dirección en grados desde el Norte girando al Este (N=0°, E=90°, S=180°, O=270°).
      ejemplo: |-
        «Altura 30°, azimut 90°» hace que cualquier persona del mundo apunte al mismo pedazo de cielo que tú. Sin esos dos números, «vi una estrella bonita» no es un dato.
      emoji: "📐"
      categoria: "Medición"
    - termino: Contaminación lumínica
      definicion: |-
        Resplandor del cielo nocturno causado por la luz artificial que se dispersa hacia arriba. Ahoga las estrellas débiles. Se clasifica con la escala Bortle, de 1 (cielo virgen) a 9 (centro de ciudad).
      ejemplo: |-
        En el centro de Cartago se ven estrellas hasta magnitud ≈ 4; en una vereda oscura, hasta ≈ 6. La misma noche y el mismo cielo, con la mitad de las estrellas borradas por el alumbrado.
      emoji: "💡"
      categoria: "Cielo"
    - termino: Magnitud límite
      definicion: |-
        La estrella más débil que alcanzas a ver desde un lugar. Es la forma práctica de medir qué tan oscuro (bueno) es tu cielo, contando cuántas estrellas ves dentro de una figura conocida.
      ejemplo: |-
        Contar 7 estrellas donde otro cuenta 3 significa que tu cielo es más oscuro. Se anota el conteo («conté 7»), nunca la impresión («se veían hartas»).
      emoji: "🔢"
      categoria: "Cielo"
    - termino: Observar (≠ mirar)
      definicion: |-
        Mirar con método. Exige 5 cosas: qué buscas (decidido antes), cuándo y dónde exactos, con qué instrumento, en qué condiciones, y registro inmediato. La prueba: otra persona debe poder repetir tu observación leyendo tu registro.
      ejemplo: |-
        Anotar de memoria al otro día no es observar: el cerebro rellena lo que no vio. Y «no vi nada» sí es dato — el abuelo pronosticaba justo cuando las Cabrillas NO se veían bien.
      emoji: "🔭"
      categoria: "Método"
    - termino: Bitácora de observación
      definicion: |-
        El cuaderno de campo del observador. Tiene encabezado (lugar, fecha, hora, luna, nubosidad, luces, magnitud límite) y una fila por objeto (altura, azimut, brillo, hora). Convierte luz en información.
      ejemplo: |-
        Miles de personas mirarán el cielo esta noche y casi ninguna producirá un dato. La diferencia entre un paseo y una observación es una libreta.
      emoji: "📓"
      categoria: "Método"

  quiz:
    titulo: "¿Ya puedes salir a observar?"
    instrucciones: "5 preguntas para verificar que tu instrumento está calibrado y tu bitácora sirve."
    preguntas:
      - enunciado: "¿Por qué el pronóstico de las Cabrillas del abuelo campesino funcionaba?"
        opciones:
          - "Era casualidad; en realidad nunca funcionó."
          - "En años de El Niño, nubes altas (cirros) opacan las Pléyades — y El Niño trae la sequía. El abuelo veía las estrellas, y las estrellas le contaban el clima."
          - "Porque las Pléyades se apagan cuando va a llover."
          - "Porque el abuelo tenía un almanaque escondido."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Lo publicaron en Nature en el 2000 (Orlove et al.). La visibilidad de las Pléyades es un indicador indirecto de El Niño. La ciencia no le dio la razón: se la reconoció.
        feedback_incorrecto: |-
          No es casualidad. En años de El Niño los cirros opacan las Pléyades, y El Niño trae sequía. El abuelo leía un indicador real, 400 años antes que el satélite (Orlove et al., 2000).
      - enunciado: "Estrella A tiene magnitud 1 y estrella B tiene magnitud 5. ¿Cuál se ve más brillante?"
        opciones:
          - "La B, porque 5 es mayor que 1."
          - "La A, porque la escala va al revés: entre más brillante, más pequeño el número."
          - "Las dos igual; la magnitud mide el tamaño."
          - "Depende del color."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. La escala de Hiparco es invertida y contraintuitiva: menor número = más brillante, y los astros muy brillantes son negativos (Sirio: −1,5).
        feedback_incorrecto: |-
          Ojo con la trampa: la escala va al revés. Magnitud 1 es MÁS brillante que magnitud 5. Los más brillantes llegan a números negativos, como Sirio (−1,5).
      - enunciado: "Sales a observar y en 20 minutos no lograste ver lo que buscabas. ¿Qué anotas?"
        opciones:
          - "Nada; si no vi, no hay dato."
          - "Anoto que NO lo vi, con la hora y las condiciones: la ausencia también es dato."
          - "Invento una observación aproximada para no dejar la fila vacía."
          - "Lo anoto mañana de memoria."
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. La ausencia es dato — el pronóstico del abuelo se basaba justamente en cuando las Cabrillas NO se veían bien. Por eso la bitácora tiene la franja «lo que esperaba ver y NO vi».
        feedback_incorrecto: |-
          «No vi nada» SÍ es dato. El abuelo pronosticaba precisamente cuando las Cabrillas se veían turbias. Nunca inventes un registro ni lo anotes de memoria al otro día.
      - enunciado: "Antes de contar estrellas para medir la magnitud límite, ¿qué es indispensable?"
        opciones:
          - "Usar la linterna del celular para ver la carta del cielo."
          - "Estar 20–30 minutos sin mirar ninguna pantalla, para que la pupila se adapte a la oscuridad."
          - "Observar apenas se oculta el sol."
          - "Mirar fijamente un solo punto sin parpadear."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El ojo tarda 20–30 minutos en adaptarse y 2 segundos de pantalla blanca en perderlo todo. Esa espera incómoda es la mitad del ejercicio.
        feedback_incorrecto: |-
          Tu ojo necesita 20–30 minutos de oscuridad para abrirse, y basta un vistazo al celular para volver a cero. Si miras la pantalla, empiezas de nuevo.
      - enunciado: "¿Cuándo sabes que tu bitácora realmente sirve?"
        opciones:
          - "Cuando está bonita y ordenada."
          - "Cuando otra persona puede repetir tu observación leyendo solo tu registro."
          - "Cuando llenaste todas las filas."
          - "Cuando el profe la revisó."
        respuesta_index: 1
        feedback_correcto: |-
          Esa es la prueba de fuego, y por eso hiciste el ensayo en seco con tu pareja. Si no puede ubicar el objeto leyendo tu registro, era un paseo, no un dato.
        feedback_incorrecto: |-
          La prueba es la repetibilidad: otra persona debe poder pararse donde tú y encontrar el objeto leyendo solo tu registro. Bonita no es lo mismo que útil.

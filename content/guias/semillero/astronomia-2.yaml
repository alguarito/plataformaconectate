# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Curva de luz
      definicion: |-
        Gráfica del brillo de un astro (eje vertical) contra el tiempo (eje horizontal). Convierte muchas medidas sueltas en una forma que revela si la estrella es estable, variable o tiene algo cruzando por delante.
      ejemplo: |-
        Si el brillo cae un 1% y vuelve, algo pasó frente a la estrella. El patrón no está en un dato: está en la forma que hacen todos los puntos juntos.
      emoji: "📈"
      categoria: "Datos"
    - termino: Tránsito
      definicion: |-
        El paso de un planeta por delante de su estrella, visto desde la Tierra. Tapa una pizca de luz (≈1%) y produce un bajón simétrico en la curva de luz que se repite con cada órbita.
      ejemplo: |-
        Nadie fotografía el planeta: se detecta su sombra en los datos. Así las misiones Kepler y TESS (NASA) han hallado miles de exoplanetas.
      emoji: "🪐"
      categoria: "Datos"
    - termino: Estrella variable
      definicion: |-
        Una estrella cuyo brillo sube y baja con un ritmo propio. En la curva de luz se ve como olas regulares, no como un bajón único: late como un corazón.
      ejemplo: |-
        Si la curva sube y baja con ritmo fijo es una variable; si solo baja una vez y vuelve, es un tránsito. Distinguirlas es leer bien el patrón.
      emoji: "💫"
      categoria: "Datos"
    - termino: Catálogo astronómico
      definicion: |-
        Base de datos donde cada astro tiene ficha: nombre o número, coordenadas, magnitud y fecha de cada medida. Se puede ordenar, filtrar y —clave— cualquiera puede revisarlo.
      ejemplo: |-
        Cuando anotas objeto · altura · azimut · hora · brillo en tu bitácora, estás construyendo tu propio catálogo. La estructura es la misma que la del profesional.
      emoji: "🗂️"
      categoria: "Método"
    - termino: Cita de fuentes (APA 7ª)
      definicion: |-
        Decir de dónde salió un dato: quién lo tomó, con qué, cuándo y dónde. Hace que el dato sea rastreable y verificable, para que otro pueda ir a la misma fuente y comprobarlo.
      ejemplo: |-
        A las cabañuelas les faltó esto: nadie guardó los registros de forma revisable. Tu bitácora, fechada y con lugar, ya es citable — por eso vale.
      emoji: "🔖"
      categoria: "Método"
    - termino: Patrón
      definicion: |-
        Una regularidad en los datos: algo que se repite (un ritmo, un bajón que vuelve) o que cambia de forma ordenada. Sistematizar es ordenar los datos hasta que el patrón aparezca.
      ejemplo: |-
        Un solo bajón puede ser una nube o un error. Solo cuando el patrón se repite se vuelve confiable: la repetición es lo que distingue un descubrimiento de una casualidad.
      emoji: "🔁"
      categoria: "Datos"

  quiz:
    titulo: "¿Sabes hacer hablar a los datos?"
    instrucciones: "5 preguntas para verificar que puedes leer una curva de luz y citar tus fuentes."
    preguntas:
      - enunciado: "En una curva de luz, el brillo de una estrella cae ≈1% de forma simétrica y luego vuelve a la normalidad. ¿Qué es lo más probable?"
        opciones:
          - "La estrella se está apagando para siempre."
          - "Un planeta pasó por delante de la estrella (un tránsito)."
          - "El telescopio se dañó."
          - "Es de día."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Ese bajón simétrico es la firma de un tránsito: un planeta tapó una pizca de luz al cruzar. Si además se repite con cada órbita, se confirma. Así caza planetas la misión Kepler.
        feedback_incorrecto: |-
          Un bajón simétrico del ≈1% que vuelve es un tránsito: un planeta cruzó por delante. No se ve el planeta, se ve su sombra en los datos. La repetición lo confirma.
      - enunciado: "¿Por qué un solo bajón en la curva de luz NO basta para gritar «¡descubrí un planeta!»?"
        opciones:
          - "Porque los planetas no existen."
          - "Porque un bajón único puede ser una nube, un error o ruido; solo la repetición del patrón lo confirma."
          - "Porque hay que verlo con los propios ojos."
          - "Porque 1% es demasiado grande."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La repetición es la clave: si el bajón vuelve cada cierto tiempo (la órbita), es un planeta; si pasó una sola vez, pudo ser cualquier cosa. Dudar es parte del método.
        feedback_incorrecto: |-
          Un bajón solo puede ser una nube o un error. Lo que confirma un planeta es que el patrón se REPITA con cada órbita. La repetición distingue un descubrimiento de una casualidad.
      - enunciado: "Tus datos de brillo van de 0,98 a 1,00. ¿Cómo debe ir la escala del eje vertical para ver bien el patrón?"
        opciones:
          - "De 0 a 100, para que se vea grande."
          - "Acercada al rango real, por ejemplo de 0,97 a 1,01."
          - "Da igual, la escala no importa."
          - "De 0 a 1000."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Un bajón del 1% es pequeñísimo: si el eje va de 0 a 100, se vuelve invisible. Acercar la escala al rango real de los datos es la mitad del análisis.
        feedback_incorrecto: |-
          Hay que acercar la escala al rango de los datos (ej. 0,97 a 1,01). Si el eje va de 0 a 100, el bajón del 1% desaparece. Elegir bien la escala es parte del análisis.
      - enunciado: "¿Qué diferencia una «impresión» de un «dato» científico?"
        opciones:
          - "Nada, son lo mismo."
          - "El dato tiene número, unidad, hora y fuente; se puede rastrear. La impresión no."
          - "La impresión es más confiable porque es personal."
          - "El dato siempre viene de la NASA."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. «Se veían hartas estrellas» es impresión; «conté 7 estrellas a las 8:15» es dato: tiene número, hora y se puede verificar. Esa diferencia es la base de la ciencia.
        feedback_incorrecto: |-
          Un dato tiene número, unidad, hora y fuente rastreable; una impresión no. «Conté 7 a las 8:15» es dato; «se veían hartas» es impresión. La ciencia trabaja con datos.
      - enunciado: "¿Por qué hay que citar en APA 7ª la tabla de datos que usaste?"
        opciones:
          - "Para que la gráfica se vea más larga."
          - "Para que el dato sea rastreable y verificable: otro puede ir a la misma fuente y comprobarlo."
          - "No hace falta citar datos."
          - "Solo se citan los libros."
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Citar no es adorno: hace que tu dato se pueda rastrear y verificar. Sin fuente, tu gráfica es un dibujo; con fuente, es evidencia. Es lo que les faltó a las cabañuelas.
        feedback_incorrecto: |-
          Se cita para que el dato sea rastreable: otro puede ir a la fuente y comprobarlo. Sin fuente, la gráfica es un dibujo, no evidencia. Citar es lo que hace verificable un dato.

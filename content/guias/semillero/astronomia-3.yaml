# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Fotómetro
      definicion: |-
        Un instrumento que mide cuánta luz hay. En este módulo lo construyes con un micro:bit y su sensor de luz integrado, para medir la luz de fondo del cielo (la contaminación lumínica).
      ejemplo: |-
        Donde tu ojo del módulo 1 vio más estrellas (cielo oscuro), el fotómetro debería dar un número más bajo: menos luz de fondo. El instrumento vuelve comprobable lo que el ojo estimaba.
      emoji: "🔆"
      categoria: "Instrumento"
    - termino: input.lightLevel()
      definicion: |-
        El bloque de MakeCode que lee el sensor de luz del micro:bit y devuelve un número de 0 (oscuridad) a 255 (mucha luz). Es la medida cruda, sin cablear nada.
      ejemplo: |-
        La matriz de 25 LED, además de mostrar íconos, mide la luz que le llega. lightLevel te da, por ejemplo, 42 — un número que aún no significa nada hasta que lo calibras.
      emoji: "💡"
      categoria: "Instrumento"
    - termino: Calibrar
      definicion: |-
        Fijar los umbrales de un instrumento midiendo condiciones conocidas, para que sus números signifiquen algo. Sin calibrar, un dato es un número suelto; calibrado, es una medida.
      ejemplo: |-
        Tapas el sensor (tu «oscuro»), lo pones bajo la luz (tu «claro») y decides los cortes. Igual que la casera ajustaba su pesa con un peso patrón antes de vender.
      emoji: "⚖️"
      categoria: "Método"
    - termino: Umbral
      definicion: |-
        El valor de corte que separa dos estados. En el fotómetro decides, por ejemplo, que menos de 30 es «cielo oscuro» y más de 90 es «con luz». Los umbrales se justifican con tus medidas.
      ejemplo: |-
        La curandera del Pacífico tenía umbrales en la mano: normal, fiebre leve, fiebre fuerte. Tú los pones en números, medidos y justificados, no inventados.
      emoji: "📊"
      categoria: "Método"
    - termino: Pseudocódigo
      definicion: |-
        La lógica de un programa escrita en palabras, antes de armar los bloques. Leer → comparar con umbrales → actuar. Escribirlo primero evita perderse después en el código.
      ejemplo: |-
        «Por siempre: leer luz. Si luz < 30, mostrar luna. Si no, si luz < 90, media luna. Si no, sol.» Los bloques solo traducen lo que ya decidiste en palabras.
      emoji: "📝"
      categoria: "Método"
    - termino: Escenario de prueba
      definicion: |-
        Una situación con resultado esperado que usas para comprobar un instrumento antes de creerle. Si el resultado real no coincide con el esperado, ajustas y repites.
      ejemplo: |-
        Sensor tapado → espero «oscuro». Bajo el bombillo → espero «con luz». Probar los 5 escenarios es lo que convierte un programa que corre en un instrumento en el que se puede creer.
      emoji: "✅"
      categoria: "Método"

  quiz:
    titulo: "¿Tu fotómetro mide de verdad?"
    instrucciones: "5 preguntas para verificar que sabes construir y calibrar un instrumento con micro:bit."
    preguntas:
      - enunciado: "¿Cómo mide la luz un micro:bit sin cablear ningún sensor externo?"
        opciones:
          - "Con su matriz de 25 LED, que también detecta la luz que le llega; se lee con input.lightLevel() (0 a 255)."
          - "No puede: hay que conectarle un sensor aparte."
          - "Con el botón A."
          - "Midiendo la temperatura."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Los LED, al revés, funcionan como pequeños detectores de luz. input.lightLevel() devuelve de 0 (oscuro) a 255 (mucha luz). El instrumento ya está dentro del micro:bit.
        feedback_incorrecto: |-
          El micro:bit mide luz con su propia matriz de 25 LED (los LED también detectan luz). Se lee con input.lightLevel(), de 0 a 255. No hace falta cablear nada.
      - enunciado: "Tu fotómetro lee «42». ¿Por qué ese número solo no basta?"
        opciones:
          - "Porque 42 es un número muy pequeño."
          - "Porque un número crudo no significa nada hasta calibrarlo: hay que fijar umbrales midiendo condiciones conocidas."
          - "Porque el micro:bit está dañado."
          - "Porque debería dar letras, no números."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. 42 no es «oscuro» ni «claro» hasta que lo comparas con umbrales calibrados. Mides tu «oscuro» y tu «claro» y decides los cortes, como la casera con su pesa.
        feedback_incorrecto: |-
          Un número crudo no dice nada sin calibrar. Hay que fijar umbrales midiendo condiciones conocidas (tapado, con luz). Solo entonces 42 significa «oscuro» o «intermedio».
      - enunciado: "¿Por qué se escribe el pseudocódigo ANTES de armar los bloques?"
        opciones:
          - "Es una pérdida de tiempo; mejor arrastrar bloques directo."
          - "Porque MakeCode lo exige."
          - "Porque decidir la lógica en palabras primero evita perderse en el código; los bloques solo traducen lo ya decidido."
          - "Porque el pseudocódigo es más bonito."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Corregir la lógica en palabras es barato; corregirla en bloques es caro. El pseudocódigo (leer → comparar → actuar) es el plano; los bloques solo lo construyen.
        feedback_incorrecto: |-
          Se escribe la lógica en palabras primero para no perderse: leer → comparar con umbrales → actuar. Los bloques solo traducen ese plan. Corregir en palabras es más barato.
      - enunciado: "Donde en el módulo 1 contaste MÁS estrellas a ojo, ¿qué debería marcar el fotómetro?"
        opciones:
          - "Un número más alto (más luz de fondo)."
          - "Exactamente el mismo número de estrellas."
          - "Cero siempre."
          - "Un número más bajo: más estrellas visibles significa menos luz de fondo, menos contaminación."
        respuesta_index: 3
        feedback_correcto: |-
          Correcto. Más luz de fondo = más contaminación = menos estrellas. Así que cielo con más estrellas (ojo) debería dar lectura más baja (instrumento). Ese contraste es el corazón del módulo.
        feedback_incorrecto: |-
          Más contaminación lumínica tapa más estrellas. Donde viste más estrellas, el cielo estaba más oscuro, así que el fotómetro debería dar un número MÁS BAJO. Ojo e instrumento deberían concordar.
      - enunciado: "Tu programa «corre» en el simulador. ¿Ya es un instrumento confiable?"
        opciones:
          - "Sí, si corre, sirve."
          - "Sí, los instrumentos no se prueban."
          - "Todavía no: hay que probarlo en escenarios con resultado esperado y ajustar lo que falle."
          - "Solo si tiene muchos colores."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Un programa que corre no es un instrumento que mide. Se prueba en 5 escenarios (esperado/real); si algo falla, se ajustan los umbrales y se repite. Probar es lo que da confianza.
        feedback_incorrecto: |-
          Que «corra» no basta. Un instrumento se prueba: 5 escenarios con esperado y real, y se ajusta lo que falle. Solo entonces se le puede creer la medida. Probar no es desconfianza, es rigor.

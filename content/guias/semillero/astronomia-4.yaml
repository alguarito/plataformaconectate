# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Afirmación calibrada
      definicion: |-
        Decir exactamente lo que tu evidencia sostiene, ni más ni menos. Hay una escalera de la certeza (creo → observé → mis datos sugieren → hay evidencia → está demostrado) y la honestidad es pararse en el peldaño correcto.
      ejemplo: |-
        Con 3 noches y un micro:bit puedes decir «mis datos sugieren que mi cuadra tiene más luz que la vereda», no «la contaminación lumínica está acabando con las estrellas». Lo segundo es verdad en el mundo, pero tú no lo demostraste.
      emoji: "🪜"
      categoria: "Ética"
    - termino: Reconocer los límites
      definicion: |-
        Decir qué NO alcanza a afirmar tu evidencia. Va en el póster antes del cierre, en su propio recuadro, no escondido en letra chica. No te debilita: te vuelve confiable.
      ejemplo: |-
        «Con 2 puntos de medición y un sensor poco sensible, no puedo comparar con un observatorio; solo comparar mis dos lugares.» Reconocerlo hace tu informe más fuerte, no más débil.
      emoji: "🔎"
      categoria: "Ética"
    - termino: Dar crédito (citar)
      definicion: |-
        Reconocer en APA 7ª el trabajo de quien te precedió y las fuentes que usaste. Es justicia (no te apropias lo ajeno) y honestidad (queda claro qué es tuyo). Un póster sin fuentes tuerce la palabra.
      ejemplo: |-
        Citar el estudio de las Cabrillas (Orlove et al., 2000) o la tabla de datos que usaste es como el mayor que dice «así me lo enseñaron»: honra la cadena del conocimiento.
      emoji: "🔖"
      categoria: "Ética"
    - termino: Cuidar la infoesfera
      definicion: |-
        Lo que publicas entra a un bien común: otros lo leerán y lo usarán. Difundir un dato inflado o mal medido contamina a todos los que vengan después. Comunicar tiene deberes.
      ejemplo: |-
        Un rumor falso daña a un pueblo entero; un dato exagerado daña el conocimiento de todos los que lo lean. No exagerar, no ocultar el error y corregir es cuidar a la comunidad.
      emoji: "🌐"
      categoria: "Ética"
    - termino: Póster de investigación
      definicion: |-
        Un cartel que cuenta tu investigación como una historia honesta: pregunta, qué hice, qué hallé, qué NO puedo afirmar y qué preguntas nuevas quedan, más las fuentes. Si no se entiende en 1 minuto, tiene demasiado texto.
      ejemplo: |-
        Los límites van en su propio recuadro, no escondidos al final. Un informe que oculta sus límites no es más fuerte: es menos confiable.
      emoji: "📊"
      categoria: "Comunicar"
    - termino: Evaluación liberadora
      definicion: |-
        La cuarta fase MILC: valorar tu propia investigación — qué aprendiste, qué error corregiste, a quién le sirve y con qué cuidado, qué pregunta nueva te llevas. No es una nota: es una conversación honesta contigo mismo.
      ejemplo: |-
        Cerrar preguntándote «¿qué clase de investigador quiero ser?» vale más que cualquier calificación. La pregunta nueva que anotes es la semilla de tu próximo itinerario.
      emoji: "🔄"
      categoria: "Comunicar"

  quiz:
    titulo: "¿Comunicas con honestidad?"
    instrucciones: "5 preguntas para verificar que sabes cerrar una investigación cuidando el conocimiento."
    preguntas:
      - enunciado: "Mediste el brillo del cielo en 2 puntos durante 3 noches. ¿Cuál afirmación está calibrada a tu evidencia?"
        opciones:
          - "«La contaminación lumínica está acabando con las estrellas del planeta.»"
          - "«Demostré que las ciudades no deberían tener alumbrado.»"
          - "«Todas las veredas del mundo tienen mejor cielo que las ciudades.»"
          - "«En los 2 puntos que medí, el más cercano al poste dio más luz de fondo.»"
        respuesta_index: 3
        feedback_correcto: |-
          Sí. Esa frase se queda en el peldaño que tu evidencia sostiene («observé/mis datos sugieren»). Las otras suben peldaños que no te ganaste: son verdades del mundo que tú no demostraste con 2 puntos y 3 noches.
        feedback_incorrecto: |-
          La calibrada es la de «en los 2 puntos que medí...». Las demás exageran: afirman cosas ciertas en el mundo pero que TÚ no demostraste. Párate en el peldaño que tu evidencia aguanta.
      - enunciado: "¿Dónde deben ir los límites de tu investigación en el póster?"
        opciones:
          - "Escondidos al final en letra pequeña, o mejor no ponerlos."
          - "En su propio recuadro visible, antes del cierre: reconocerlos te hace más confiable."
          - "No se ponen: debilitan el trabajo."
          - "Solo si alguien pregunta."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Un informe que oculta sus límites no es más fuerte, es menos confiable. Ponerlos a la vista, antes del cierre, muestra que sabes hasta dónde llega tu evidencia. Eso es rigor.
        feedback_incorrecto: |-
          Los límites van visibles, en su propio recuadro, antes del cierre. Reconocerlos NO te debilita: te vuelve confiable. Esconderlos es lo que hace sospechoso un informe.
      - enunciado: "En tu sustentación te preguntan algo que no mediste. ¿Qué haces?"
        opciones:
          - "Invento una respuesta para no quedar mal."
          - "Cambio de tema."
          - "Digo «eso no lo sé / no lo medí», sin torcer la palabra."
          - "Digo que sí lo demostré aunque no sea cierto."
        respuesta_index: 2
        feedback_correcto: |-
          Bien. Decir «no lo sé» es fuerza, no debilidad: es no torcer la palabra caminada. Inventar una respuesta rompe la confianza — después nadie te cree. La ciencia se sostiene en esa honestidad.
        feedback_incorrecto: |-
          Se dice «eso no lo sé / no lo medí». Inventar para no quedar mal es perder la palabra: destruye tu credibilidad. Reconocer lo que no sabes es lo que te hace confiable.
      - enunciado: "¿Por qué hay que citar en APA 7ª las fuentes que usaste?"
        opciones:
          - "Es justicia (reconoces a quien te precedió) y honestidad (queda claro qué es tuyo)."
          - "Para llenar espacio en el póster."
          - "No hace falta si el trabajo es tuyo."
          - "Solo para trabajos de la universidad."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Citar honra la cadena del conocimiento, como el mayor que dice «así me lo enseñaron». Presentar lo ajeno como propio es torcer la palabra. Dar crédito es justicia y honestidad a la vez.
        feedback_incorrecto: |-
          Se cita porque es justicia (reconoces el trabajo ajeno) y honestidad (se ve qué es tuyo). Apropiarse lo de otro es perder la palabra. Citar honra la cadena del conocimiento.
      - enunciado: "¿Qué significa «cuidar la infoesfera» al comunicar?"
        opciones:
          - "Publicar lo más rápido posible, sin revisar."
          - "Guardar todo en secreto para que nadie lo copie."
          - "Recordar que lo que publicas queda y otros lo usarán: un dato inflado contamina a todos los que lo lean después."
          - "Poner muchos colores en el póster."
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Tu dato entra a un bien común. Exagerar u ocultar el error contamina el conocimiento de todos los que vengan. Cuidar el conocimiento es cuidar a la comunidad que lo va a usar.
        feedback_incorrecto: |-
          Es recordar que lo que publicas queda y otros lo usarán. Un dato inflado o mal medido contamina a todos los que lo lean después, como un rumor daña a un pueblo. Por eso comunicar tiene deberes.

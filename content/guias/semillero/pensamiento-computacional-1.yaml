      donde: "sistematizacion"

# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Pensamiento computacional
      definicion: |-
        Formular un problema de modo que su solución se pueda ejecutar paso a paso, por una persona o por una máquina (Wing, 2006). No es programar: es lo que se piensa antes de tocar el teclado.
      ejemplo: |-
        Los retos Bebras, creados por Valentina Dagienė, se resuelven con lápiz y papel: ponen a prueba el razonamiento, no el manejo de un lenguaje de programación.
      emoji: "🧠"
      categoria: "Marco"
    - termino: Descomposición
      definicion: |-
        Partir un problema grande en pedazos que se puedan resolver por separado. Cortaste bien cuando puedes entregarle un pedazo a otra persona y esa persona lo resuelve sin preguntarte nada.
      ejemplo: |-
        La caladora retira los hilos de uno en uno: «si tratas de deshilar dos hilos a la vez, ellos no te dejan, se pegan entre sí» (Olivia, caladora, en Pérez-Bustos, 2019).
      emoji: "🧩"
      categoria: "Pilar"
    - termino: Reconocimiento de patrones
      definicion: |-
        Descubrir que varios pedazos del problema son en realidad el mismo pedazo con otro nombre, para resolverlo una vez y reutilizar la solución.
      ejemplo: |-
        El turno del lavado, el del tablero y el del aseo se resuelven con la misma regla de rotación: no son tres problemas, es uno tres veces.
      emoji: "🔁"
      categoria: "Pilar"
    - termino: Abstracción
      definicion: |-
        Quedarse con lo que decide —variables, reglas, criterio de éxito— y soltar el detalle que no cambia el resultado.
      ejemplo: |-
        La caladora borda sobre la rejilla, no sobre la tela: el color del lino y la marca del hilo no cambian el diseño, así que los suelta.
      emoji: "🔍"
      categoria: "Pilar"
    - termino: Algoritmo
      definicion: |-
        Una secuencia ordenada, finita y sin ambigüedad de pasos que lleva del punto de partida al resultado. Otra persona debe poder ejecutarlo sin preguntarte nada.
      ejemplo: |-
        El calado tiene el suyo: marcar el cuadro → sacar dos y dos → deshilar de uno en uno → remendar y bordar. Bordar antes de deshilar no es otra manera: es arruinar la pieza.
      emoji: "📋"
      categoria: "Pilar"
    - termino: Criterio de éxito
      definicion: |-
        La forma concreta de comprobar que el problema quedó resuelto. Si no puedes escribir cómo lo verificarás, todavía no planteaste el problema: solo lo describiste.
      ejemplo: |-
        «Que quede mejor» no se verifica. «Que nadie lave dos días seguidos y todos laven igual número de veces al mes» sí: se cuenta y se comprueba.
      emoji: "✅"
      categoria: "Planteamiento"
    - termino: El daño sin remiendo
      definicion: |-
        Reconocer que un problema —o una de sus ramas— no se resuelve con lógica, porque pide plata, permiso o una conversación. Nombrarlo es criterio, no rendirse.
      ejemplo: |-
        Cuando faltan demasiados hilos, la caladora sabe que ya no hay remiendo posible y no gasta la tarde intentándolo (Pérez-Bustos, 2019).
      emoji: "✖️"
      categoria: "Planteamiento"

  quiz:
    titulo: "¿Sabes plantear antes de resolver?"
    instrucciones: "5 preguntas para verificar que reconoces un problema que pide lógica y sabes partirlo."
    preguntas:
      - enunciado: "¿Cuáles son los cuatro pilares del pensamiento computacional?"
        opciones:
          - "Teclado, pantalla, memoria y procesador."
          - "Internet, datos, nube e inteligencia artificial."
          - "Descomposición, patrones, abstracción y algoritmo."
          - "Sumar, restar, multiplicar y dividir."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Partir el problema, ver lo que se repite, quedarse con lo que decide y ordenar los pasos. La caladora de Cartago los usa los cuatro, y no toca un computador.
        feedback_incorrecto: |-
          Son descomposición, patrones, abstracción y algoritmo. Ninguno necesita un computador: son formas de mirar un problema hasta que se deja resolver por pasos.
      - enunciado: "¿Cómo sabes que descompusiste bien un problema?"
        opciones:
          - "Cuando cada pedazo se puede resolver sin mirar a los otros, y otra persona podría resolver uno solo."
          - "Cuando quedan muchos pedazos, mientras más mejor."
          - "Cuando todos los pedazos son del mismo tamaño."
          - "Cuando el problema desaparece."
        respuesta_index: 0
        feedback_correcto: |-
          Exacto. Si para resolver A necesitas el resultado de B y viceversa, todavía están pegados —como los hilos que salen de a dos. Sigue partiendo.
        feedback_incorrecto: |-
          No es cuestión de cantidad ni de tamaño: cada pedazo debe sostenerse solo. La prueba es poder entregarle uno a un compañero y que lo resuelva sin preguntarte nada.
      - enunciado: "«Que la casa quede más organizada» — ¿por qué este planteamiento todavía no sirve?"
        opciones:
          - "Porque es un problema muy grande."
          - "Porque no tiene criterio de éxito verificable: no dice cómo se comprobaría que quedó bien."
          - "Porque no se puede programar."
          - "Porque no es un problema real."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. «Más organizada» no se puede comprobar. En cambio «que cada cosa tenga un lugar fijo y nadie tarde más de un minuto en encontrar el recibo del mes» sí se verifica.
        feedback_incorrecto: |-
          Le falta el criterio de éxito: cómo sabrás que quedó bien. Sin eso no planteaste el problema, solo lo describiste — y no hay manera de saber si tu solución sirvió.
      - enunciado: "¿Qué hace la caladora cuando faltan demasiados hilos y el daño ya no se puede remendar?"
        opciones:
          - "Sigue bordando encima para taparlo."
          - "Cambia de oficio."
          - "Le pide a otra caladora que lo intente."
          - "Reconoce que no hay arreglo posible y no gasta la tarde intentándolo."
        respuesta_index: 3
        feedback_correcto: |-
          Así es. Saber cuál problema no tiene remiendo es criterio, no rendirse — igual que marcar «sin remiendo» la rama que pide plata, permiso o una conversación que no te toca.
        feedback_incorrecto: |-
          Reconoce que no hay remiendo y no insiste. Esa lectura —distinguir lo que se puede arreglar de lo que no— es parte del oficio, y también del pensamiento computacional.
      - enunciado: "Descubres que «avisar el turno de lavado» y «avisar quién expone el viernes» se resuelven igual. ¿Qué encontraste?"
        opciones:
          - "Un patrón: un mismo problema con dos nombres, que se resuelve una vez y se reutiliza."
          - "Una coincidencia sin importancia."
          - "Un error en tu descomposición."
          - "Que ninguno de los dos pide lógica."
        respuesta_index: 0
        feedback_correcto: |-
          Sí: «rotación con aviso». Un patrón resuelto una vez sirve muchas veces — es la misma puntada repetida en cada celda de la rejilla, no una puntada nueva por agujero.
        feedback_incorrecto: |-
          Encontraste un patrón: dos ramas que son el mismo problema con otro nombre. Resolverlo una sola vez y reutilizarlo es justo lo que ahorra el trabajo de bordar a ciegas.

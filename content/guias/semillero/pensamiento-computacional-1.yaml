recursos:
  diagramas:
    - archivo: "rejilla-calado.tex"
      alt: "Tres paneles en secuencia: (1) un cuadrado de tela con la trama densa, todos los hilos juntos; (2) el mismo cuadrado tras el deshilado, con una rejilla regular de hilos gruesos que quedan cada cuatro; (3) la rejilla con la misma puntada repetida en cada celda. Las flechas entre paneles se llaman «descomponer» y «abstraer», el paso repetido se llama «patrón», y debajo corre una tira de cuatro pasos numerados: marcar el cuadro, sacar dos y dos, deshilar de uno en uno, remendar y bordar."

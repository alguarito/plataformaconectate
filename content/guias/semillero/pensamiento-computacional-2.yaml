# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Algoritmo
      definicion: |-
        Secuencia ordenada, finita y sin ambigüedad de pasos que lleva del punto de partida al resultado. Se arma con solo tres estructuras: secuencia, decisión y repetición.
      ejemplo: |-
        El beneficio del café: despulpar → fermentar → lavar → secar, con una decisión en medio (si la muestra suena a cascajo, lavar) y una repetición (mientras no suene, esperar y volver a probar).
      emoji: "📋"
      categoria: "Marco"
    - termino: Secuencia
      definicion: |-
        Pasos que van uno detrás de otro en un orden que no se puede alterar. Es la estructura más simple, y la que arruina el trabajo cuando se cambia.
      ejemplo: |-
        Bordar antes de deshilar, o lavar antes de fermentar: no es «otra manera», es un error irreversible.
      emoji: "➡️"
      categoria: "Estructura"
    - termino: Decisión
      definicion: |-
        Una pregunta de sí o no que abre dos caminos: «si (condición) entonces… si no…». En el diagrama de flujo se dibuja con un rombo, y siempre tiene dos salidas.
      ejemplo: |-
        «Si la muestra suena a cascajo, empezar a lavar; si no, esperar una hora.» Eso es una condición: una prueba, no un tiempo supuesto.
      emoji: "🔀"
      categoria: "Estructura"
    - termino: Repetición
      definicion: |-
        Volver a hacer algo mientras una condición se cumpla: «mientras (condición) hacer…». En el diagrama es una flecha que regresa hacia el rombo que la controla.
      ejemplo: |-
        «Mientras la muestra no suene a cascajo: esperar una hora y volver a probar.» Si nada cambiara adentro, daría vueltas para siempre.
      emoji: "🔁"
      categoria: "Estructura"
    - termino: Pseudocódigo
      definicion: |-
        El algoritmo escrito en español, sin lenguaje de programación pero sin ambigüedad: un paso por línea, verbo al inicio, condiciones entre paréntesis y sangría para lo que va adentro.
      ejemplo: |-
        La prueba de que está bien escrito no es que se vea bonito: es que otra persona lo ejecute sin hacerte una sola pregunta.
      emoji: "✍️"
      categoria: "Escritura"
    - termino: Diagrama de flujo
      definicion: |-
        El mismo algoritmo, dibujado con cuatro figuras: óvalo (inicio y fin), rectángulo (acción), rombo (decisión con dos salidas) y flechas (el orden).
      ejemplo: |-
        Dibujar obliga a lo que escribir deja pasar: una flecha que no llega a ninguna parte es un caso que el algoritmo no había previsto.
      emoji: "📊"
      categoria: "Escritura"
    - termino: Eficiencia
      definicion: |-
        Cuántos pasos cuesta un algoritmo, contados en el peor caso. Dos soluciones al mismo problema no valen lo mismo si una tarda el doble.
      ejemplo: |-
        Buscar un nombre en una lista de 100 desordenada puede costar 100 miradas; si está ordenada y la partes por la mitad cada vez, bastan 7. Pero ordenar también cuesta.
      emoji: "⚖️"
      categoria: "Comparación"

  quiz:
    titulo: "¿Tu algoritmo decide o solo obedece?"
    instrucciones: "5 preguntas para verificar que reconoces las tres estructuras y sabes comparar dos estrategias."
    preguntas:
      - enunciado: "¿Cuáles son las tres estructuras con las que se escribe cualquier algoritmo?"
        opciones:
          - "Entrada, proceso y salida."
          - "Óvalo, rectángulo y rombo."
          - "Secuencia, decisión y repetición."
          - "Sumar, comparar y guardar."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Los lenguajes cambian; las estructuras no. Si crees que tu problema necesita una cuarta, casi siempre es que todavía no lo partiste bien.
        feedback_incorrecto: |-
          Son secuencia (pasos en orden), decisión (si… entonces… si no…) y repetición (mientras…). Las figuras del diagrama son cómo se dibujan, no las estructuras mismas.
      - enunciado: "«Fermentar el café durante 15 horas» frente a «fermentar hasta que la muestra suene a cascajo». ¿Cuál es la diferencia?"
        opciones:
          - "Ninguna, las dos dicen lo mismo con otras palabras."
          - "La primera obedece un tiempo supuesto; la segunda decide con una prueba, y por eso funciona en tierra fría y en tierra caliente."
          - "La segunda es más lenta."
          - "La primera es más moderna."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. Esa es la diferencia entre una receta y un algoritmo. La condición se adapta al mundo real; el tiempo fijo solo funciona el día en que las condiciones coinciden.
        feedback_incorrecto: |-
          La primera obedece un tiempo, la segunda decide con una prueba. Por eso la fermentación dura entre 12 y 18 horas según la temperatura, pero la prueba del cascajo sirve siempre.
      - enunciado: "En tu diagrama de flujo hay un rombo con una sola flecha de salida. ¿Qué significa?"
        opciones:
          - "Que hay un caso sin respuesta: falta decir qué pasa cuando la condición no se cumple."
          - "Que el diagrama quedó más limpio."
          - "Que la decisión es opcional."
          - "Que hay que borrar el rombo."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Toda decisión tiene dos caminos. Si el «no» no lleva a ningún lado, tu algoritmo se queda mudo justo cuando alguien lo necesita.
        feedback_incorrecto: |-
          Significa que falta el camino del «no». Dibujar sirve precisamente para eso: destapa los casos que al escribir se pasan por alto.
      - enunciado: "Buscar un nombre en una lista de 100. ¿Qué comparación es honesta?"
        opciones:
          - "Comparar el mejor caso de mi estrategia contra el peor de la otra."
          - "Comparar cuál se ve más elegante."
          - "No hace falta comparar si mi estrategia ya funciona."
          - "Comparar el peor caso de las dos, y contar también lo que cuesta preparar (ordenar)."
        respuesta_index: 3
        feedback_correcto: |-
          Así es. El peor caso y el costo de preparar. Ordenar para buscar rápido vale la pena si vas a buscar muchas veces; si buscas una sola vez, no.
        feedback_incorrecto: |-
          Se compara el peor caso de ambas, y se cuenta lo que hay que preparar antes. Comparar con el día de suerte es hacerse trampa a uno mismo.
      - enunciado: "Tu pareja ejecuta tu pseudocódigo y te pregunta «¿y aquí qué hago?». ¿Qué te dice eso?"
        opciones:
          - "Que no puso atención."
          - "Que hay ambigüedad: ese paso no está terminado."
          - "Que el algoritmo es demasiado difícil para ella."
          - "Que hay que explicárselo de viva voz."
        respuesta_index: 1
        feedback_correcto: |-
          Eso mismo. La prueba de un algoritmo es que otra persona lo ejecute sin preguntar. Cada pregunta señala un paso que en tu cabeza estaba y en el papel no.
        feedback_incorrecto: |-
          Señala ambigüedad en ese paso. Lo que para ti es «obvio» es, para quien lo ejecuta, un paso que falta — y explicárselo de viva voz tapa el hueco en vez de arreglarlo.

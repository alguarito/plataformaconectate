# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Bebras
      definicion: |-
        Iniciativa internacional de retos de pensamiento computacional, nacida en Lituania en 2004 y creada por Valentina Dagienė. Hoy está en más de 50 países. «Bebras» significa castor en lituano.
      ejemplo: |-
        Sus retos se resuelven con lápiz y papel: no piden programar ni saber un lenguaje. Piden leer bien, probar en pequeño y razonar.
      emoji: "🦫"
      categoria: "Marco"
    - termino: Caso pequeño
      definicion: |-
        Resolver primero la versión más chiquita del problema (con 2, con 3) para ver el patrón antes de atacar el caso grande. Además sirve para comprobar si entendiste las reglas.
      ejemplo: |-
        Si el reto habla de 8 castores cruzando un río, empieza con 2. El patrón casi siempre aparece entre el caso 2 y el 4.
      emoji: "🔬"
      categoria: "Estrategia"
    - termino: Invariante
      definicion: |-
        Algo que se mantiene igual pase lo que pase, hagas los movimientos que hagas. Cuando lo encuentras, todas las respuestas que exigirían cambiarlo quedan descartadas de una vez.
      ejemplo: |-
        «La suma siempre queda par», «el total nunca aumenta». Es el patrón del módulo 1 mirado al revés: no lo que se repite, sino lo que resiste.
      emoji: "🧱"
      categoria: "Estrategia"
    - termino: Descarte por imposibilidad
      definicion: |-
        Probar que una opción no puede ser, en vez de construir la que sí. Si tres de cuatro opciones rompen una regla, la cuarta es la respuesta.
      ejemplo: |-
        Exige una razón, no una corazonada: «esa se ve rara» no descarta nada. Y si descartas las cuatro, leíste mal una regla.
      emoji: "❌"
      categoria: "Estrategia"
    - termino: Calibrar
      definicion: |-
        Ajustar una sola variable después de cada intento, usando lo que el intento anterior te enseñó. Si cambias dos cosas a la vez y funciona, no sabrás cuál lo arregló.
      ejemplo: |-
        En el tejo: el tiro se fue largo, entonces se ajusta la fuerza — no la fuerza y el ángulo y la postura al tiempo.
      emoji: "🎯"
      categoria: "Método"
    - termino: Turmequé (tejo)
      definicion: |-
        Juego de origen muisca practicado hace más de 500 años en el altiplano cundiboyacense. Deporte nacional de Colombia por la Ley 613 de 2000 y patrimonio cultural inmaterial por la Ley 1947 de 2019.
      ejemplo: |-
        Cancha de 17,5 metros, bocín de unos cinco centímetros, gana quien llegue primero a 27 puntos. No se gana con fuerza: se gana calibrando.
      emoji: "🇨🇴"
      categoria: "Saber ancestral"

  quiz:
    titulo: "¿Sabes resolver lo que nunca habías visto?"
    instrucciones: "5 preguntas para verificar que dominas las estrategias frente a un reto desconocido."
    preguntas:
      - enunciado: "Un reto habla de 10 fichas y no se te ocurre nada. ¿Cuál es el primer movimiento?"
        opciones:
          - "Intentar con las 10 hasta que salga."
          - "Resolverlo primero con 2 fichas, luego con 3, y buscar el patrón."
          - "Buscar la respuesta con un compañero."
          - "Pasar al siguiente reto."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El caso pequeño casi siempre destapa el patrón entre el 2 y el 4, y de paso te confirma si entendiste bien las reglas.
        feedback_incorrecto: |-
          Empieza pequeño: con 2, luego con 3. Atacar el caso grande de una es como tirar sin mirar la cancha.
      - enunciado: "¿Qué es un invariante?"
        opciones:
          - "La respuesta correcta del reto."
          - "Una regla que el enunciado no dice."
          - "Algo que se mantiene igual hagas los movimientos que hagas, y que por eso descarta opciones enteras."
          - "El número más grande del problema."
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. «La suma siempre queda par», «el total nunca sube». Si algo no puede cambiar, todo lo que exigiría cambiarlo queda descartado de una vez.
        feedback_incorrecto: |-
          Es lo que se mantiene igual pase lo que pase. Se encuentra haciendo dos o tres movimientos permitidos y preguntando: ¿qué siguió igual?
      - enunciado: "Tu primer intento falla. ¿Qué haces?"
        opciones:
          - "Repetirlo igual, con más cuidado."
          - "Cambiar todo el enfoque desde cero."
          - "Cambiar tres cosas a la vez para ir más rápido."
          - "Leer qué información dejó ese intento y cambiar una sola cosa."
        respuesta_index: 3
        feedback_correcto: |-
          Como en el tejo. El tiro que se fue largo te dijo algo: ajusta la fuerza, no la fuerza y el ángulo y la postura. Si cambias dos y funciona, no sabrás cuál lo arregló.
        feedback_incorrecto: |-
          Un intento fallido es información, no fracaso. Se lee lo que dejó y se ajusta una sola variable — cambiar varias a la vez borra la evidencia.
      - enunciado: "Descartas una opción porque «se ve rara». ¿Vale?"
        opciones:
          - "No: descartar exige nombrar la regla que esa opción rompe."
          - "Sí, la intuición se entrena."
          - "Sí, si al final aciertas."
          - "Solo si el reto es fácil."
        respuesta_index: 0
        feedback_correcto: |-
          Así es. El descarte es un argumento, no una sensación. Y si te toca descartar las cuatro opciones, no descartaste: leíste mal una regla.
        feedback_incorrecto: |-
          No vale. Hay que nombrar la regla que la opción rompe; si no, no es descarte, es adivinanza con cara seria.
      - enunciado: "¿Por qué en esta guía una respuesta correcta sin explicación no cuenta?"
        opciones:
          - "Para que el trabajo sea más largo."
          - "Porque las respuestas correctas son sospechosas."
          - "Porque lo que sirve en el reto siguiente es el camino, no el resultado de este."
          - "Porque el profesor no puede revisarlas."
        respuesta_index: 2
        feedback_correcto: |-
          Eso es. Cada reto Bebras es distinto: memorizar respuestas no sirve de nada. Lo único que se transfiere al siguiente problema es la estrategia con la que llegaste.
        feedback_incorrecto: |-
          Porque el camino es lo único que se puede volver a usar. Un reto sin resolver pero bien descrito vale más que tres resueltos sin explicación.

# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Metacognición
      definicion: |-
        Pensar sobre el propio pensar: mirar tu solución —y tu manera de resolver— desde afuera, como si fuera de otra persona.
      ejemplo: |-
        No es preguntar «¿me funcionó?», sino «¿qué hacía yo antes cuando un problema no me salía, y qué hago ahora?».
      emoji: "🪞"
      categoria: "Marco"
    - termino: Caso límite
      definicion: |-
        La entrada rara que nadie previó porque nadie la imaginó: la lista vacía, el empate, el cero, el elemento repetido, la persona que falta.
      ejemplo: |-
        En el mundo real llegan siempre. Y el caso límite que encuentra otra persona vale doble: tú tienes un punto ciego con lo tuyo.
      emoji: "🧨"
      categoria: "Evaluación"
    - termino: Cómo crece el costo
      definicion: |-
        No basta con contar los pasos una vez: hay que ver cómo suben cuando el problema crece. Con 2, 4 y 8 elementos se ve si sube parejo o se dispara.
      ejemplo: |-
        Si con 5 elementos hace 25 pasos y con 10 hace 100, con 100 elementos será inservible — y eso no se nota probando solo con 5.
      emoji: "📈"
      categoria: "Evaluación"
    - termino: Límite y defecto
      definicion: |-
        Un defecto se arregla; un límite es lo que tu solución no puede hacer aunque esté perfecta. Nombrar el límite es honestidad, no derrota.
      ejemplo: |-
        Un algoritmo de turnos no puede resolver que alguien no quiera cumplirlos: eso pide una conversación, no una regla mejor.
      emoji: "🚧"
      categoria: "Evaluación"
    - termino: Mejora verificable
      definicion: |-
        Un solo cambio, con la evidencia que lo justifica y la medida concreta que dirá si mejoró. Si no se puede verificar, no es una mejora: es un deseo.
      ejemplo: |-
        «Cambio X por Y, porque la tabla de costo se dispara con 8, y sabré que mejoró si con 8 baja de 40 pasos a menos de 20.»
      emoji: "🔧"
      categoria: "Mejora"
    - termino: No depender de una sola cosa
      definicion: |-
        Una solución que se apoya en un único elemento —una persona, un dato, un supuesto— se cae el día en que ese elemento falla.
      ejemplo: |-
        Por eso Cenicafé no liberó una variedad resistente sino varias, apoyadas en diversidad genética: contra razas nuevas del hongo, una sola carta no alcanza.
      emoji: "🌱"
      categoria: "Saber situado"

  quiz:
    titulo: "¿Sabes evaluar lo que tú mismo hiciste?"
    instrucciones: "5 preguntas para verificar que puedes juzgar tu solución con evidencia y proponer una mejora defendible."
    preguntas:
      - enunciado: "¿Cuál es el momento correcto para preguntarse dónde va a fallar una solución?"
        opciones:
          - "Cuando ya falló, que es cuando se ve el problema."
          - "Mientras todavía funciona, como hizo Cenicafé antes de que llegara la roya."
          - "Nunca: si funciona, no se toca."
          - "Cuando alguien se queja."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. En 1983 la roya no fue el desastre que se temía porque la pregunta se había hecho años antes, con los cafetales sanos.
        feedback_incorrecto: |-
          Mientras todavía funciona. Esperar a que falle convierte la evaluación en reparación de urgencia — y a veces ya no hay con qué responder.
      - enunciado: "Tu algoritmo hace 25 pasos con 5 elementos y 100 con 10. ¿Qué te dice eso?"
        opciones:
          - "Que es rápido, porque 100 pasos es poco."
          - "Que hay que contar otra vez."
          - "Que el costo crece al cuadrado: con 100 elementos será inservible."
          - "Nada: lo importante es que funciona."
        respuesta_index: 2
        feedback_correcto: |-
          Exacto. Al doblar la entrada, los pasos se multiplicaron por cuatro. Eso no se nota probando solo con 5, y por eso se hace la tabla con 2, 4 y 8.
        feedback_incorrecto: |-
          Al doblar los elementos, los pasos se cuadruplicaron: crece al cuadrado. Con 100 elementos, esa solución deja de servir.
      - enunciado: "«Mi solución le sirve a todos.» ¿Qué opinas de esa respuesta?"
        opciones:
          - "Es la respuesta de quien no miró: toda solución reparte beneficios y costos."
          - "Es la mejor respuesta posible."
          - "Es correcta si el problema es pequeño."
          - "Depende del profesor."
        respuesta_index: 0
        feedback_correcto: |-
          Así es. Hay que escribir dos listas con nombres concretos. Que alguien aparezca en la de costos no hace mala la solución: la hace consciente.
        feedback_incorrecto: |-
          «A todos» significa que no se buscó a quién le cuesta. Ese alguien está fuera del sistema, decía Dussel: no aparece en tus cuentas si no lo buscas a propósito.
      - enunciado: "¿Cuál es la diferencia entre un defecto y un límite?"
        opciones:
          - "Ninguna, son sinónimos."
          - "El límite es más grave que el defecto."
          - "El defecto lo encuentra el profesor; el límite, el estudiante."
          - "El defecto se arregla; el límite es lo que la solución no puede hacer aunque esté perfecta."
        respuesta_index: 3
        feedback_correcto: |-
          Eso es. Un algoritmo de turnos no puede resolver que alguien no quiera cumplirlos: eso pide una conversación. Nombrar el límite es honestidad, no derrota.
        feedback_incorrecto: |-
          El defecto se corrige; el límite se nombra. Confundirlos lleva a intentar arreglar con reglas lo que no se arregla con reglas.
      - enunciado: "Propones cinco mejoras a la vez y la solución mejora. ¿Qué problema hay?"
        opciones:
          - "Ninguno, mejoró."
          - "Que es demasiado trabajo."
          - "Que no sabrás cuál de las cinco la mejoró — ni cuál podría estar empeorándola."
          - "Que hay que consultarlo antes."
        respuesta_index: 2
        feedback_correcto: |-
          Igual que en el tejo: un cambio por vuelta. Si mueves cinco cosas y funciona, no aprendiste nada que puedas usar la próxima vez.
        feedback_incorrecto: |-
          No sabrás cuál funcionó. Un solo cambio, con su razón y su medida — así la mejora enseña algo, además de mejorar.

# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Sistema embebido
      definicion: |-
        Un computador escondido dentro de un objeto que percibe su entorno y actúa sobre él. Tiene tres partes: sensor (percibe), lógica (decide) y actuador (hace). Quita una y deja de funcionar.
      ejemplo: |-
        Una puerta automática: sensor (detecta que te acercas) → lógica (si hay alguien, abrir) → actuador (el motor abre). El sapo Nasa también las tiene: piel que siente, instinto que decide, canto que avisa.
      emoji: "⚙️"
      categoria: "Anatomía"
    - termino: Sensor
      definicion: |-
        La parte que percibe una señal del entorno: luz, calor, movimiento, sonido. Es el oído, el ojo y el tacto del aparato. Convierte un pedazo del mundo en información que la lógica puede usar.
      ejemplo: |-
        El micro:bit trae varios sensores adentro, sin cablear: luz (su matriz de LED), temperatura, acelerómetro (movimiento) y brújula (dirección). Cada uno es una forma de escuchar el mundo.
      emoji: "👂"
      categoria: "Anatomía"
    - termino: Actuador
      definicion: |-
        La parte que hace algo visible en respuesta: prende un LED, suena, muestra un ícono, mueve un motor. Sin actuador, un aparato percibe pero no responde — y entonces no es un sistema.
      ejemplo: |-
        En el micro:bit, la matriz de LED (mostrar un ícono o número) y el sonido son actuadores. El canto del sapo es su actuador: avisa lo que percibió.
      emoji: "🔔"
      categoria: "Anatomía"
    - termino: Bioindicador
      definicion: |-
        Un ser vivo que reacciona a un cambio del ambiente antes que nosotros, y que una comunidad aprende a leer para actuar a tiempo. Es, en el fondo, un sensor vivo.
      ejemplo: |-
        Para el pueblo Nasa, el canto del sapo y la rana o el paso del colibrí anuncian la lluvia (Ulloa, 2011). Leer esa señal a tiempo permitía decidir cuándo sembrar o resguardarse.
      emoji: "🐸"
      categoria: "Saber ancestral"
    - termino: Necesidad antes que sensor
      definicion: |-
        La regla de oro del diseño: se empieza por una necesidad real (con dueño) y después se busca qué sensor la alcanza — no al revés. Un aparato que parte del sensor suele no servirle a nadie.
      ejemplo: |-
        Mal: «tengo un acelerómetro, ¿qué hago?». Bien: «hay que saber si el corral quedó abierto → el acelerómetro puede sentir si la puerta se movió». La necesidad manda; el sensor obedece.
      emoji: "🎯"
      categoria: "Diseño"
    - termino: micro:bit
      definicion: |-
        Un pequeño computador del tamaño de una galleta con sensores integrados (luz, temperatura, movimiento, brújula) y una matriz de 25 LED, que se programa en MakeCode sin cablear nada.
      ejemplo: |-
        Es el instrumento de toda la línea de Robótica del semillero, y ya lo usaste como fotómetro en Astronomía. Sus sensores vienen adentro: percibir el mundo no cuesta un cable.
      emoji: "🔲"
      categoria: "Instrumento"

  quiz:
    titulo: "¿Sabes escuchar antes de construir?"
    instrucciones: "5 preguntas para verificar que puedes detectar necesidades y mapearlas a sensores."
    preguntas:
      - enunciado: "¿Cuáles son las tres partes de todo sistema que percibe y actúa?"
        opciones:
          - "Pantalla, teclado y batería."
          - "Sensor (percibe), lógica (decide) y actuador (hace)."
          - "Cable, tornillo y caja."
          - "Internet, wifi y pantalla."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Sensor → lógica → actuador. Quita cualquiera y deja de funcionar: un sensor sin lógica no decide, una lógica sin actuador no hace, un actuador sin sensor no sabe cuándo. El sapo Nasa tenía las tres.
        feedback_incorrecto: |-
          Son sensor (percibe), lógica (decide con una regla) y actuador (hace algo visible). Es la anatomía de todo, de una puerta automática a un satélite — y del sapo que siente, decide y canta.
      - enunciado: "Un compañero dice: «tengo el acelerómetro del micro:bit, ¿qué invento con él?». ¿Qué le aconsejas?"
        opciones:
          - "Que invente cualquier cosa, lo importante es usar el sensor."
          - "Que empiece al revés: busque primero una necesidad real y luego vea si el acelerómetro la alcanza."
          - "Que compre más sensores."
          - "Que no use el micro:bit."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. La necesidad manda, el sensor obedece. Empezar por el sensor lleva a aparatos que no le sirven a nadie. El Nasa no leía al sapo por curiosidad: lo leía para decidir algo real.
        feedback_incorrecto: |-
          Se empieza por la necesidad, no por el sensor. «Tengo un sensor, ¿qué hago?» produce juguetes sin dueño. Primero la necesidad real, después qué sensor la alcanza.
      - enunciado: "¿Qué es un «sensor vivo» o bioindicador, según el saber Nasa?"
        opciones:
          - "Un animal de laboratorio."
          - "Un ser vivo que reacciona a un cambio del ambiente antes que nosotros y que la comunidad lee para actuar a tiempo."
          - "Un sensor electrónico muy caro."
          - "Una planta decorativa."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. El sapo, la rana, el colibrí: perciben la llegada de la lluvia y reaccionan, y el pueblo Nasa lee esa reacción para decidir cuándo sembrar o resguardarse. Un sensor vivo percibe y avisa.
        feedback_incorrecto: |-
          Es un ser vivo que siente el cambio del ambiente antes que nosotros y reacciona (el sapo canta por la lluvia); la comunidad lo lee para actuar a tiempo. Es, en el fondo, un sensor vivo.
      - enunciado: "¿Cuál de estas necesidades pasa el «test del sapo» (le sirve a alguien real)?"
        opciones:
          - "«Que el micro:bit titile con colores bonitos.»"
          - "«Avisar cuando la puerta del corral queda abierta, para que no se salgan los animales.»"
          - "«Hacer algo, cualquier cosa, con el acelerómetro.»"
          - "«Que se vea moderno.»"
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Esa necesidad tiene dueño (quien cuida el corral) y resuelve un problema real. Las otras son caprichos: «se ve bonito» o «usar el sensor por usarlo» no le sirven a una persona concreta.
        feedback_incorrecto: |-
          La del corral: tiene dueño y resuelve un problema real. «Titilar bonito» o «hacer algo con el sensor» son caprichos sin dueño. El test del sapo pregunta: ¿a quién le sirve de verdad?
      - enunciado: "¿Por qué el micro:bit es cómodo para empezar en robótica?"
        opciones:
          - "Porque es el computador más potente del mundo."
          - "Porque ya trae varios sensores integrados (luz, temperatura, movimiento, brújula), sin cablear ni comprar nada."
          - "Porque no necesita programación."
          - "Porque funciona sin electricidad."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Sus «sentidos» vienen adentro: la matriz de LED mide luz, y trae temperatura, acelerómetro y brújula. Percibir el mundo no cuesta un cable — puedes concentrarte en la necesidad y la lógica.
        feedback_incorrecto: |-
          Porque trae sensores integrados (luz, temperatura, movimiento, brújula) sin cablear nada. Eso te deja concentrarte en lo que importa: qué necesidad atender y con qué lógica, no en el montaje.

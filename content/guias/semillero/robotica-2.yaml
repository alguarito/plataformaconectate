# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Pseudocódigo
      definicion: |-
        La lógica de un programa escrita en palabras ordenadas, antes de armar los bloques. Suele empezar con un bucle («por siempre») que lee un sensor y decide con una regla. Es el plano en lenguaje humano.
      ejemplo: |-
        «Por siempre: leer la luz. Si la luz es menor que 30, mostrar la luna; si no, mostrar el sol.» Es barato de corregir (solo texto), y por eso ahí deben morir los errores.
      emoji: "📝"
      categoria: "Diseño"
    - termino: Diagrama de flujo
      definicion: |-
        La lógica dibujada con cuatro figuras: óvalo (inicio/fin), rectángulo (una acción), rombo (una pregunta sí/no, con dos salidas) y flechas (el camino). Dibujar delata los huecos que las palabras esconden.
      ejemplo: |-
        Sigue las flechas con el dedo: si llegas a un rectángulo sin flecha de salida, o a un rombo con una sola, hay un hueco. Es lo que aprendiste en 7°, ahora al servicio de tu aparato.
      emoji: "🔀"
      categoria: "Diseño"
    - termino: Umbral
      definicion: |-
        El valor de corte que convierte el número de un sensor en una decisión. El sensor no dice «oscuro»: dice 42; el umbral (menor que 30 = oscuro) lo vuelve decisión. No se inventa: se calibra.
      ejemplo: |-
        Se mide el sensor en condiciones conocidas (tapado = oscuro, con luz = claro) y se elige el corte con esos números. Como fijaste los umbrales del fotómetro en Astronomía.
      emoji: "📏"
      categoria: "Diseño"
    - termino: Calibrar un umbral
      definicion: |-
        Fijar el valor de corte midiendo condiciones conocidas, para poder justificarlo. Un umbral calibrado se defiende con datos; uno inventado, solo con la palabra.
      ejemplo: |-
        La curandera del Pacífico fijaba «fiebre leve» usando su propia mano como patrón. Tú mides tapado y con luz, y pones el umbral con esos números en la mano.
      emoji: "🌡️"
      categoria: "Método"
    - termino: Bucle «por siempre»
      definicion: |-
        La estructura que hace que un sistema vigile sin parar: repite una y otra vez leer el sensor y decidir. Un aparato que reacciona no revisa una vez, sino continuamente.
      ejemplo: |-
        «Por siempre: leer... si... hacer.» Sin el bucle, el aparato mira una sola vez y se queda quieto. El bucle es lo que lo mantiene atento, como el que vigila el corral.
      emoji: "🔁"
      categoria: "Diseño"
    - termino: Fundición a la cera perdida
      definicion: |-
        Técnica orfebre de los Quimbaya (Norte del Valle): modelar en cera, cubrir en arcilla, derretir y sacar la cera, verter el metal y romper el molde. Un procedimiento de orden absoluto: cada paso depende del anterior.
      ejemplo: |-
        Una vez vertido el oro, el error ya no se puede deshacer; por eso el orfebre planeaba toda la secuencia antes de empezar. Programar es igual: se diseña la lógica antes de ejecutarla.
      emoji: "🏺"
      categoria: "Saber ancestral"

  quiz:
    titulo: "¿Sabes pensar antes de programar?"
    instrucciones: "5 preguntas para verificar que puedes diseñar la lógica antes de tocar un bloque."
    preguntas:
      - enunciado: "¿Por qué se escribe el pseudocódigo y el diagrama de flujo ANTES de armar los bloques?"
        opciones:
          - "Es un requisito aburrido sin utilidad."
          - "Porque corregir la lógica en palabras o en un dibujo es barato; corregirla con los bloques ya armados cuesta horas."
          - "Porque MakeCode no funciona sin diagrama."
          - "Porque el diagrama se ve más profesional."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Como el orfebre Quimbaya, que planeaba toda la secuencia antes de verter el oro: una vez vertido, no hay corrección. En palabras el error cuesta un borrón; con el oro (los bloques) cuesta la pieza.
        feedback_incorrecto: |-
          Porque el error es barato de corregir en el plano (texto o dibujo) y carísimo en los bloques ya armados. El orfebre no fundía sin la secuencia clara; tú no programas sin la lógica clara.
      - enunciado: "En un diagrama de flujo, ¿qué representa el rombo?"
        opciones:
          - "El inicio del programa."
          - "Una pregunta de sí/no, de la que salen dos caminos."
          - "Una acción como mostrar un ícono."
          - "El final del programa."
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. El rombo es una decisión: una pregunta (¿luz < 30?) con dos salidas, sí y no. Si un rombo tiene una sola salida, hay un hueco en tu lógica.
        feedback_incorrecto: |-
          El rombo es una pregunta sí/no con DOS salidas. El óvalo es inicio/fin, el rectángulo es una acción. Toda pregunta necesita sus dos caminos, o la lógica queda coja.
      - enunciado: "Tu sensor de luz da «42». ¿Qué necesitas para convertir ese número en una decisión?"
        opciones:
          - "Nada, 42 ya significa «oscuro»."
          - "Un umbral calibrado: un valor de corte fijado midiendo condiciones conocidas."
          - "Un número más grande."
          - "Otro micro:bit."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. 42 no dice nada hasta compararlo con un umbral. Y el umbral se calibra: mides tapado y con luz, y eliges el corte con esos números. Inventarlo es un capricho; medirlo es método.
        feedback_incorrecto: |-
          Necesitas un umbral calibrado: un valor de corte que fijas midiendo condiciones conocidas (tapado, con luz). Sin umbral no hay decisión; con uno inventado, la decisión es un capricho.
      - enunciado: "Sigues las flechas de tu diagrama y llegas a un rectángulo del que no sale ninguna flecha. ¿Qué significa?"
        opciones:
          - "Que el diagrama está terminado."
          - "Que hay un hueco: el proceso queda colgado sin continuar. Hay que arreglarlo."
          - "Que ganaste el juego."
          - "Que sobra ese rectángulo."
        respuesta_index: 1
        feedback_correcto: |-
          Bien. Una acción sin flecha de salida deja el proceso colgado. Seguir las flechas con el dedo es justo para cazar esos huecos antes de programar, cuando arreglarlos es barato.
        feedback_incorrecto: |-
          Es un hueco: el proceso llega ahí y no sabe seguir. Cada acción debe tener su flecha de salida y el bucle debe cerrarse. Cazar esos huecos en el dibujo ahorra horas después.
      - enunciado: "¿Qué muestra que tu diagrama de flujo está bien diseñado?"
        opciones:
          - "Que tiene muchos colores."
          - "Que otra persona puede seguir las flechas y entender qué hace el aparato sin que se lo expliques."
          - "Que es muy largo."
          - "Que solo tú lo entiendes."
        respuesta_index: 1
        feedback_correcto: |-
          Exacto. El plano es para que OTRO lo lea, como el del orfebre. Si tu pareja sigue las flechas y cuenta qué hace tu aparato sin tu ayuda, tu lógica está clara y sin huecos.
        feedback_incorrecto: |-
          Que otra persona pueda seguirlo sin tu ayuda. Un diagrama que solo tú entiendes todavía tiene huecos. La prueba del compañero es la que revela si la lógica está clara.

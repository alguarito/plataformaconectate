# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: MakeCode
      definicion: |-
        El entorno visual (makecode.microbit.org) donde se programa el micro:bit arrastrando bloques que encajan. Cada figura de un diagrama de flujo tiene su bloque, así que programar es traducir el plano, no inventar.
      ejemplo: |-
        Óvalo → «por siempre»; rectángulo de acción → mostrar ícono; rombo → «si… si no». Trae un simulador con los sensores en pantalla, para construir y probar aunque no tengas el aparato físico.
      emoji: "🧩"
      categoria: "Construir"
    - termino: Bucle «por siempre»
      definicion: |-
        El bloque que hace que el aparato vigile sin parar: repite una y otra vez leer el sensor y decidir. Corresponde al óvalo de inicio del diagrama de flujo cerrado sobre sí mismo.
      ejemplo: |-
        Sin «por siempre», el aparato mira una sola vez y se queda quieto. Con él, revisa continuamente, como el que vigila el corral o el río.
      emoji: "🔁"
      categoria: "Construir"
    - termino: Calibrar (con medidas)
      definicion: |-
        Fijar el umbral midiendo el sensor en condiciones conocidas (baja y alta) y poniendo el corte entre las dos. Convierte un número inventado en una medida que se puede justificar.
      ejemplo: |-
        «Tapado me dio 5, con luz 180; pongo el umbral en 40.» Un umbral bien calibrado es la diferencia entre un aparato que acierta y uno que se dispara por cualquier cosa.
      emoji: "📏"
      categoria: "Método"
    - termino: Escenario de prueba
      definicion: |-
        Una situación con resultado esperado que se usa para comprobar el aparato. Se corre, se anota el resultado real y, si no coincide, se ajusta y se repite. La prueba no busca aplausos: busca fallas.
      ejemplo: |-
        Tapado → espero «oscuro». Bajo el bombillo → «con luz». El escenario que rompe tu aparato es el más valioso: te dice qué arreglar, como la primera navegada le dice al emberá qué lado rebajar.
      emoji: "✅"
      categoria: "Probar"
    - termino: Probar es llevar al río
      definicion: |-
        La idea de que un programa que «corre» todavía no es un aparato que «sirve»: solo la prueba en escenarios reales lo demuestra. La realidad, no la intención, es el juez.
      ejemplo: |-
        El potro emberá se juzga en el agua, no en la orilla: las fallas que no se ven en tierra aparecen en el río. Tu prototipo se juzga en los 5 escenarios, no en que el código se vea bonito.
      emoji: "🛶"
      categoria: "Saber ancestral"
    - termino: Ajustar (probar → ajustar → probar)
      definicion: |-
        El ciclo que vuelve confiable un aparato: cuando un escenario falla, se cambia algo (casi siempre un umbral o una regla), se anota qué se cambió y se vuelve a probar. La falla no es fracaso: es el oficio.
      ejemplo: |-
        Documentar «en el escenario 3 falló, subí el umbral de 30 a 45 y volvió a pasar» prueba que tu aparato mejoró con evidencia, no con suerte. Ese ajuste es la joya del módulo.
      emoji: "🔧"
      categoria: "Probar"

  quiz:
    titulo: "¿Tu prototipo sirve de verdad?"
    instrucciones: "5 preguntas para verificar que sabes construir, calibrar y probar un aparato."
    preguntas:
      - enunciado: "¿Por qué se dice que programar en MakeCode es «traducir, no inventar»?"
        opciones:
          - "Porque cada figura del diagrama de flujo del módulo 2 tiene su bloque: óvalo → «por siempre», rombo → «si… si no», etc."
          - "Porque MakeCode escribe el código solo."
          - "Porque no hay que pensar nada."
          - "Porque se copia de internet."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Si tu diagrama estaba sin huecos, armar los bloques es traducir pieza por pieza. Por eso el trabajo difícil fue pensar la lógica en el módulo 2; aquí solo la construyes.
        feedback_incorrecto: |-
          Porque cada figura del diagrama de flujo tiene su bloque equivalente (óvalo → «por siempre», rombo → «si… si no»). Programar es traducir tu plano del módulo 2, no empezar de cero.
      - enunciado: "Tu programa «corre» en el simulador. ¿Ya puedes confiar en que tu aparato sirve?"
        opciones:
          - "Sí, si corre, sirve."
          - "Sí, los aparatos no se prueban."
          - "Todavía no: hay que probarlo en escenarios reales; un programa que corre no es un aparato que sirve."
          - "Solo si tiene sonido."
        respuesta_index: 2
        feedback_correcto: |-
          Correcto. Como el potro: se ve bien en la orilla, pero solo el río dice si sirve. Un programa que corre puede fallar en la primera prueba real. Por eso se prueba en 5 escenarios.
        feedback_incorrecto: |-
          Que corra no basta. El potro se juzga en el agua, no en la orilla. Hay que probar el aparato en escenarios reales; las fallas que no se ven en la pantalla aparecen en la prueba.
      - enunciado: "¿Cómo se fija un buen umbral en tu programa?"
        opciones:
          - "Poniendo cualquier número «a ver qué pasa»."
          - "Midiendo el sensor en la condición baja y en la alta, y poniendo el umbral entre las dos."
          - "Copiando el de otro compañero."
          - "Usando siempre 50."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. «Tapado me dio 5, con luz 180; pongo el umbral en 40.» Ese número es una medida, no un invento — y por eso tu aparato acierta en vez de dispararse por cualquier cosa.
        feedback_incorrecto: |-
          Se mide la condición baja y la alta, y se pone el umbral entre las dos. Un umbral inventado dispara el aparato por nada; uno medido se puede justificar y acierta.
      - enunciado: "Al probar, un escenario hace que tu aparato falle. ¿Qué es eso?"
        opciones:
          - "Un fracaso: mejor borrar todo y empezar de nuevo."
          - "Una señal de que el aparato no sirve."
          - "Algo que hay que ocultar en el informe."
          - "La información más útil: te dice qué ajustar. Cambias algo, lo anotas y vuelves a probar."
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. La falla no es fracaso: es el oficio. El escenario que rompe tu aparato es el más valioso, como la primera navegada le dice al emberá qué lado rebajar. Ajustas, anotas y repites.
        feedback_incorrecto: |-
          Es la información más útil: te muestra qué arreglar. Se ajusta (casi siempre un umbral o una regla), se anota qué se cambió y se vuelve a probar. La falla es parte del método, no un fracaso.
      - enunciado: "¿Por qué se graba un video del aparato funcionando?"
        opciones:
          - "Para ganar likes."
          - "Porque mostrarlo funcionar es la prueba: el emberá no describe su canoa, la pone a flotar."
          - "Porque es obligatorio en MakeCode."
          - "Para hacer el trabajo más largo."
        respuesta_index: 1
        feedback_correcto: |-
          Sí. Un aparato se demuestra funcionando, no contándolo. El video es tu canoa flotando: la evidencia de que tu prototipo pasó del plano al mundo y hace lo que prometía.
        feedback_incorrecto: |-
          Porque mostrarlo funcionar es la prueba más clara, como el emberá que pone su canoa a flotar en vez de describirla. El video muestra que tu aparato de verdad hace lo que dijiste.

# ─── Contenido web ────────────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: Depurar
      definicion: |-
        Hallar por qué falla un aparato, no adivinar. Se lee el síntoma, se plantea una causa probable, se pone a prueba y, si no era, se plantea otra — una a la vez, como quien sigue el agua hasta la gotera.
      ejemplo: |-
        «En el escenario 3 mostró sol estando oscuro» (síntoma) → «el umbral está muy bajo» (causa) → subo el umbral y vuelvo a probar. Depurar así arregla el aparato y te enseña cómo funciona.
      emoji: "🔍"
      categoria: "Mejorar"
    - termino: Ciclo de mejora
      definicion: |-
        El lazo que vuelve mejor un aparato: probar → observar dónde falla → cambiar UNA cosa → volver a probar. La regla de oro es cambiar una sola cosa por vuelta, para saber qué la arregló.
      ejemplo: |-
        Si cambias el umbral, la regla y el ícono a la vez y mejora, no sabrás cuál lo logró. Es la espiral Misak hecha método: cada vuelta vuelve con una cosa aprendida y sube un poco.
      emoji: "🔄"
      categoria: "Mejorar"
    - termino: Evaluar con evidencia
      definicion: |-
        Medir el desempeño con un número, antes y después de una mejora, en vez de decir «quedó mejor». Elige un criterio (cuántos escenarios pasa) y compáralo.
      ejemplo: |-
        «Pasaba 3 de 5; cambié el umbral; ahora pasa 5 de 5» es una mejora demostrada. Y si al mejorar un escenario empeoró otro, la evidencia también te lo dirá — y eso es oro.
      emoji: "📊"
      categoria: "Mejorar"
    - termino: Límites del aparato
      definicion: |-
        Lo que un aparato NO hace: las condiciones que no maneja y qué tan probado está. Reconocerlos no lo debilita: lo vuelve confiable, porque quien lo use sabe hasta dónde llega.
      ejemplo: |-
        «Con poca luz se confunde; solo lo probé en 5 escenarios y un lugar.» Un aparato honesto declara sus límites, sobre todo cuando alguien podría confiarle algo importante.
      emoji: "🚧"
      categoria: "Ética"
    - termino: A quién sirve (y a quién no)
      definicion: |-
        La pregunta ética del aparato: para quién es útil de verdad, y a quién no le basta o dónde fallar sería peligroso. Prometer más de lo que hace puede poner a alguien en riesgo.
      ejemplo: |-
        Una alarma ayuda a vigilar, pero no reemplaza el cuidado humano; venderla como garantía sería engañar a quien confía en ella. Di, junto a lo que hace, lo que no hace.
      emoji: "⚖️"
      categoria: "Ética"
    - termino: Espiral del tiempo (Misak)
      definicion: |-
        Concepción Misak del tiempo como una espiral que regresa al centro: para avanzar, se mira hacia atrás. Evaluar es eso — volver sobre lo hecho para mejorarlo en la siguiente vuelta.
      ejemplo: |-
        Simbolizada en el Kuarimpele, cinta tejida en espiral. No se progresa olvidando y empezando de cero: se progresa iterando. Mejorar no es rehacer, es volver con lo aprendido.
      emoji: "🌀"
      categoria: "Saber ancestral"

  quiz:
    titulo: "¿Sabes evaluar y mejorar?"
    instrucciones: "5 preguntas para verificar que sabes depurar, iterar con evidencia y reconocer límites."
    preguntas:
      - enunciado: "Tu aparato falla en un escenario. ¿Cuántas cosas cambias antes de volver a probar?"
        opciones:
          - "Una sola, para saber cuál fue la que lo arregló."
          - "Varias a la vez, para arreglarlo más rápido."
          - "Ninguna, mejor lo dejo así."
          - "Cambio todo el programa de cero."
        respuesta_index: 0
        feedback_correcto: |-
          Sí. Una cosa por vuelta. Si cambias varias y mejora, no sabrás cuál lo logró ni podrás repetirlo. Es la espiral Misak hecha método: cada vuelta vuelve con una cosa aprendida.
        feedback_incorrecto: |-
          Una sola cosa por vuelta. Si cambias varias a la vez y mejora, no sabes cuál fue. Cambia una, comprueba, anota; luego la siguiente. Así la mejora es con evidencia, no con suerte.
      - enunciado: "¿Cuál de estas SÍ es una evaluación con evidencia?"
        opciones:
          - "«Quedó mucho mejor.»"
          - "«Se ve más profesional.»"
          - "«A mí me gusta más así.»"
          - "«Pasaba 3 de 5 escenarios; cambié el umbral; ahora pasa 5 de 5.»"
        respuesta_index: 3
        feedback_correcto: |-
          Exacto. Evaluar es poner un número antes y después. «3 de 5 → 5 de 5» demuestra la mejora; «quedó mejor» es solo una opinión. Medir es lo que separa mejorar de creer que mejoraste.
        feedback_incorrecto: |-
          La que tiene números antes y después: «3 de 5 → 5 de 5». «Quedó mejor» o «se ve más profesional» son opiniones. Evaluar con evidencia es medir un criterio claro y compararlo.
      - enunciado: "¿Qué es «depurar» un aparato?"
        opciones:
          - "Cambiar cosas al azar hasta que funcione."
          - "Borrarlo y empezar de nuevo."
          - "Buscar la causa de la falla: síntoma → hipótesis → probarla → si no era, otra."
          - "Ignorar el error."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Depurar es seguir el agua hasta la gotera: una causa probable a la vez, comprobándola. No solo arregla el aparato; te enseña cómo funciona. La falla, de frente, es la mejor maestra.
        feedback_incorrecto: |-
          Es buscar la causa con método: síntoma, una hipótesis, probarla, y si no era, otra. Cambiar al azar arregla sin enseñar. Depurar bien te muestra por qué fallaba.
      - enunciado: "¿Por qué se escribe la nota de «a quién NO le sirve» el aparato?"
        opciones:
          - "Para que se vea humilde."
          - "Porque prometer más de lo que hace puede poner en riesgo a quien confía; un aparato honesto dice lo que hace y lo que no."
          - "No hace falta; basta decir para qué sirve."
          - "Para hacer el informe más largo."
        respuesta_index: 1
        feedback_correcto: |-
          Correcto. Una alarma ayuda pero no reemplaza el cuidado; venderla como garantía sería engañar. Decir a quién no le basta cuida a quien la usa — y eso es parte de construirla bien.
        feedback_incorrecto: |-
          Porque prometer de más puede poner en riesgo a quien confía en el aparato. Reconocer a quién no le sirve, o dónde fallar sería peligroso, es honestidad y cuidado, no debilidad.
      - enunciado: "Según la espiral del tiempo de los Misak, ¿cómo se avanza mejor?"
        opciones:
          - "En línea recta, olvidando lo hecho y empezando de cero."
          - "Sin mirar nunca el pasado."
          - "Mirando hacia atrás lo que se hizo para hacerlo mejor en la siguiente vuelta."
          - "Copiando el aparato de otro."
        respuesta_index: 2
        feedback_correcto: |-
          Sí. Para los Misak, el tiempo es una espiral: se avanza volviendo a mirar. Evaluar es eso — no rehacer de cero, sino iterar con lo aprendido. Mejorar es volver con lo aprendido, un poco más arriba.
        feedback_incorrecto: |-
          Mirando hacia atrás para avanzar: el tiempo Misak es una espiral, no una recta. Evaluar es volver sobre lo hecho para mejorarlo, no olvidarlo y empezar de cero. Mejorar es iterar.

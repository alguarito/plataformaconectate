      ejemplo: "Se empieza por un 3 o 4 de 10, no por un 9, y se repite el mismo escalón varias veces antes de subir."
      emoji: "🪜"
      categoria: "Herramienta"
    - termino: "Qué te pasó, no qué tienes"
      definicion: "Preguntar por lo ocurrido en vez de por el defecto cambia la conversación entera."
      ejemplo: "Cuando el sufrimiento se explica solo por dentro, la persona carga con una culpa que no le toca."
      emoji: "💬"
      categoria: "Distinguir"

    - termino: "Mirar lo que cambió"
      definicion: "No la intensidad, sino la conducta: si dejó de hacer lo que le gustaba, si cambió el sueño o el apetito, si dejó de ver gente, hace cuánto."
      ejemplo: "Umbral: más de dos semanas, casi todos los días, y cambió el funcionamiento. Ese es el momento de contarlo, no de decidir qué es."
      emoji: "🔎"
      categoria: "Herramienta"
    - termino: "Lo que no ayuda"
      definicion: "«Échale ganas» vuelve la enfermedad un problema de voluntad; «tienes todo para estar bien» agrega culpa; «cualquier cosa me avisas» le deja el trabajo al que está mal."
      ejemplo: "Lo que sí sirve es más simple: «te creo», «no estás solo», «vamos juntos»."
      emoji: "🚫"
      categoria: "Distinguir"
    - termino: "Los tres niveles"
      definicion: "Alguien de confianza con nombre propio · orientación escolar con oficina y horario · la EPS y las líneas de atención."
      ejemplo: "Una ruta que hay que buscar en una crisis no existe. Por eso se averigua antes y se escribe."
      emoji: "🧭"
      categoria: "Herramienta"

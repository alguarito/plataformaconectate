      definicion: "Trece estudios revisados: ninguno halló un aumento estadísticamente significativo de la ideación entre quienes fueron preguntados; algunos hallaron reducción (Dazzi y otros, 2014)."
      ejemplo: "Quien lleva semanas con eso en la cabeza no se entera de nada nuevo porque tú preguntes. Lo nuevo es que deja de estar solo."
      emoji: "❓"
      categoria: "Entender"
    - termino: "«El que lo dice no lo hace»"
      definicion: "Falso. Cuando alguien lo dice, lo está diciendo, y se toma en serio siempre, sin excepción."
      ejemplo: "Y si fuera «para llamar la atención», seguiría siendo alguien pidiendo atención de la peor manera que se le ocurrió."
      emoji: "⚠️"
      categoria: "Distinguir"
    - termino: "Los tres pasos"
      definicion: "Preguntar directo y callarse · quedarse y no dejar sola a la persona · avisar a un adulto hoy, sin excepción."
      ejemplo: "No te toca diagnosticar, tratar, convencer ni resolver. Te toca lo que hace la Guardia: ver, quedarse, avisar."
      emoji: "3️⃣"
      categoria: "Herramienta"
    - termino: "La reserva no se promete"
      definicion: "Es una promesa que no se puede cumplir sin poner en riesgo a alguien, y deja a quien la hace atrapado entre su palabra y una vida."
      ejemplo: "«No te puedo prometer eso. Sí te prometo que no lo voy a andar contando: se lo digo solo a alguien que pueda ayudarte, y si quieres vamos juntos.»"
      emoji: "🤐"
      categoria: "Herramienta"
    - termino: "Del chat a una persona"
      definicion: "Por escrito no se puede ver ni acompañar, y quedarse es justo el paso que no funciona a distancia."
      ejemplo: "Si te llega por chat, no lo resuelvas por chat: llama, ve, o consigue que un adulto vaya."
      emoji: "📵"
      categoria: "Herramienta"

      definicion: "En los primeros días sobra la gente; después no llega nadie, justo cuando empieza lo difícil."
      ejemplo: "El acompañamiento que sirve es el que aparece tarde: el mensaje del mes siguiente, la llamada a los seis meses."
      emoji: "📆"
      categoria: "Herramienta"
    - termino: "Decir el nombre"
      definicion: "Casi nadie lo dice, por miedo a hacer daño; y quien quedó suele estar deseando oírlo."
      ejemplo: "«Hoy me acordé de él» —sin pedir respuesta— es de las cosas que más se agradecen."
      emoji: "💬"
      categoria: "Herramienta"

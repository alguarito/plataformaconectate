      definicion: "No se mide en cantidad —todos creen usar menos de lo que usan— sino en lo que se dejó de hacer."
      ejemplo: "El deporte que dejaste, la persona que no ves, las noches que no duermes, lo que ya no te da gusto."
      emoji: "🕳️"
      categoria: "Herramienta"
    - termino: "Sustituir, no prohibir"
      definicion: "La alternativa tiene que dar lo mismo que la anestesia y estar a la mano de antemano."
      ejemplo: "Si lo que buscabas era compañía, salir a correr solo no sirve. Y lo que hay que preparar veinte minutos no se usa nunca."
      emoji: "🔄"
      categoria: "Herramienta"
    - termino: "Meter tiempo en la mitad"
      definicion: "Diez minutos entre el impulso y la acción, haciendo otra cosa cualquiera."
      ejemplo: "Muchas veces alcanza, porque las emociones bajan solas si uno las deja —que es justo lo que la anestesia no permite comprobar."
      emoji: "⏳"
      categoria: "Herramienta"

# ─── Contenido web extra ──────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: "Macroestructura"
      definicion: "El contenido global de un texto: su tema o asunto, resumible en una frase. Es lo que la gente recuerda y repite."
      ejemplo: "De una cadena larga sobre el acueducto queda solo «el agua es peligrosa»."
      emoji: "🗂️"
      categoria: "Lectura crítica"
    - termino: "Microestructura"
      definicion: "La estructura local del texto: las oraciones y las relaciones de conexión y coherencia entre ellas. Ahí viven los conectores."
      ejemplo: "«Se cayó el puente y por eso el agua está contaminada»: el «por eso» inventa una causa."
      emoji: "🔗"
      categoria: "Lectura crítica"
    - termino: "Modalizador evidencial"
      definicion: "Expresión que señala de dónde viene la información: «dicen que», «al parecer», «me confirmaron». En español no es una marca gramatical obligatoria, se activa en el contexto."
      ejemplo: "«Me confirmaron» simula verificación sin decir quién confirmó."
      emoji: "🎭"
      categoria: "Lectura crítica"
    - termino: "Reclamo de hecho y reclamo de sentido"
      definicion: "El primero afirma qué ocurrió y se verifica; el segundo afirma qué significa y pertenece a la tradición de cada quien."
      ejemplo: "«El puente se cayó» se comprueba; «fue un llamado de atención» se respeta."
      emoji: "⚖️"
      categoria: "Filosofía"
    - termino: "Concentración"
      definicion: "Cantidad de sustancia por unidad de volumen. Sin el volumen no hay concentración: por eso una instrucción sin denominador es inservible."
      ejemplo: "Media taza de blanqueador trata unos 2.400 L; en un tanque de 500 L la cuenta es otra."
      emoji: "🧪"
      categoria: "Ciencias naturales"
    - termino: "Autonomía moral"
      definicion: "Responder uno mismo por lo que decide, en vez de delegar la decisión en lo que otro mandó. No exige renunciar a las propias creencias."
      ejemplo: "Puedo tener mi fe intacta y aun así verificar antes de reenviar."
      emoji: "🧭"
      categoria: "Filosofía"
  quiz:
    titulo: "Verifica lo que entendiste"
    instrucciones: "Cinco preguntas. Responde sin volver al texto y revisa después lo que falles."
    preguntas:
      - enunciado: "Un mensaje dice: «Al parecer el acueducto quedó afectado y por eso el agua está contaminada». ¿Dónde está la trampa?"
        opciones:
          - "En el «y por eso»: un conector no prueba una causa, le ordena al lector que la construya"
          - "En que menciona el acueducto, que no existe"
          - "En que es un mensaje demasiado corto"
          - "En que no tiene faltas de ortografía"
        respuesta_index: 0
        feedback_correcto: "Exacto. Dos hechos puestos uno detrás del otro no son una causa, aunque el conector lo sugiera."
        feedback_incorrecto: "Revisa el pilar 1. La microestructura es donde el mensaje fabrica la causalidad que no probó."
      - enunciado: "¿Por qué un mensaje de una sola línea circula tan bien?"
        opciones:
          - "Porque en textos muy cortos micro y macroestructura coinciden: no hay nada que resumir"
          - "Porque los mensajes cortos siempre son verdaderos"
          - "Porque no se pueden reenviar los largos"
          - "Porque tienen mejor ortografía"

        opciones:
          - "Que el sismo fue más fuerte en una que en otra"
          - "La suerte de cada quien"
          - "La vulnerabilidad: materiales, antigüedad, mantenimiento y con qué contaba cada familia"
          - "La magnitud del sismo, que cambia de casa en casa"
        respuesta_index: 2
        feedback_correcto: "Correcto. Con la misma amenaza, lo que cambia es lo que la amenaza encontró."
        feedback_incorrecto: "La magnitud es una sola para todo el sismo. Lo que cambia entre dos casas vecinas es su vulnerabilidad."
      - enunciado: "¿Cuántos ángulos de la vulnerabilidad propone Wilches-Chaux?"
        opciones:
          - "Uno solo: el económico"
          - "Tres: natural, física y social"
          - "Tantos como quiera cada quien"
          - "Once, y advierte que separarlos sirve solo para estudiarlos"
        respuesta_index: 3
        feedback_correcto: "Sí: once, y el propio autor insiste en que ninguno actúa solo."
        feedback_incorrecto: "Vuelve a la figura. Son once, y la gracia está en verlos actuar juntos."
      - enunciado: "Van a hacer el mapa de una cuadra. ¿Qué NO debe aparecer en él?"
        opciones:
          - "El croquis del tramo"
          - "Datos que permitan identificar a una familia o una vivienda concreta"
          - "Los ángulos que explican cada punto"
          - "Lo que quedó por confirmar"
        respuesta_index: 1

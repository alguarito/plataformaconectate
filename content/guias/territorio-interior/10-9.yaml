# ─── Apertura (MILC) ──────────────────────────────────────────────────
apertura:
  saber_ancestral: |-
    En los Andes, campesinos de Perú y Bolivia observan a finales de junio el brillo de las \textbf{Pléyades} (un cúmulo de estrellas que aquí llaman \emph{las cabrillas} o \emph{los siete cabritos}) para decidir cuándo sembrar la papa. Si el cúmulo se ve grande y brillante, esperan lluvias buenas y siembran en la fecha de siempre; si se ve tenue y pequeño, esperan lluvias tardías y escasas, y atrasan la siembra varias semanas. En el año 2000, tres investigadores publicaron en la revista \emph{Nature} una prueba de esa señal: cruzaron el brillo aparente del cúmulo con imágenes satelitales y con los registros de El Niño. El saber resistió. Cuando El Niño calienta el Pacífico, se forma nubosidad alta que apaga el brillo de las Pléyades \textbf{y} anticipa una temporada de lluvias pobre. El campesino no adivinaba: \textbf{leía una señal real y ajustaba una decisión}. Le faltaba el mecanismo, no el acierto.
  saber_contemporaneo: |-
    Eso mismo hace hoy un pronóstico sísmico, y conviene decir con precisión qué es y qué no es. Tras el sismo del 10 de agosto de 2026, el Servicio Geológico de Estados Unidos publicó un \textbf{pronóstico de réplicas} calculado con la ley de Omori, que describe cómo van disminuyendo con el tiempo. Para el año siguiente estimó una probabilidad del \textbf{98,8 \%} de al menos una réplica de magnitud 4 o mayor, del \textbf{58,5 \%} de al menos una de magnitud 5 o mayor y del \textbf{10,6 \%} de al menos una de magnitud 6 o mayor. Nada de eso dice cuándo, ni dónde exactamente, ni a qué hora. Es lo mismo que respondió el Servicio Geológico Colombiano cuando le preguntaron si se pueden predecir: «la ciencia no tiene ninguna herramienta o tecnología que permita hacer esto». \textbf{Probabilidad no es predicción}: una dice qué tan seguido pasa algo, la otra pretende decir cuándo.
  pregunta_puente: |-
    El campesino andino no predecía el día de la lluvia: leía una señal, estimaba qué tan probable era una buena temporada y \textbf{movía la fecha de la siembra}, que era lo único que estaba en sus manos. ¿Y si prepararse ante un sismo fuera exactamente eso, y no adivinar la fecha del próximo?
  saber_hacer: |-
    Al terminar podrás: (1) \textbf{identificar} en tu casa y tu salón lo que protege y lo que amenaza, con criterios observables; (2) \textbf{explicar} por qué existen dos ondas sísmicas y qué hace posible una alerta temprana; (3) \textbf{analizar} un histograma de réplicas sin confundir frecuencia con magnitud, y leer una probabilidad sin exagerarla ni despreciarla; (4) \textbf{crear} tu tablero de riesgo con las decisiones que sí dependen de ti.

# ─── Puentes narrativos (7) ───────────────────────────────────────────
puentes:
  a_ruta: |-
    Ya sabes que un saber campesino de siglos resistió la prueba de un satélite. Mira ahora el mapa de la sesión: vas a mirar tu entorno, a entender la física y los números del riesgo, y a construir un plan que no dependa de adivinar nada.
  a_escuta: |-
    Antes de los números conviene mirar. La preparación no empieza en un manual: empieza en el techo de tu salón, en el estante de tu cuarto y en la ruta que hay entre tú y la puerta.
  a_sistematizacion: |-
    Ya sabes qué hay a tu alrededor. Ahora vienen la física y las matemáticas, porque el miedo se alimenta de cifras mal leídas y esta fase es, sobre todo, un entrenamiento en leer bien.
  a_praxis: |-
    Ya sabes leer el dato. Es hora de convertirlo en decisiones concretas: qué haces antes, qué haces durante los segundos de sacudida y qué haces después.
  a_producto: |-
    Practicaste el recorrido. Ahora deja tu evidencia: el tablero de riesgo, que es tu plan escrito y verificable, no una buena intención.
  a_evaluacion: |-
    Terminaste el producto. Detente a mirar qué cambió en ti (no la nota, sino tu manera de estar frente a algo que no controlas del todo).
  a_triangulo: |-
    Cerramos pensando en grande: tres voces para entender de quién es el saber que sirve, qué parte del miedo la pone la imaginación y cómo un gráfico también puede mentir.

# ─── Fase 1 · Escucha = Actividad 1 ───────────────────────────────────
escuta:
  escena: |-
    \textbf{Haz el recorrido de la mirada}, primero en el salón y luego en tu casa. No estás buscando culpables ni imaginando catástrofes: estás inventariando hechos observables. Anota tres cosas. \textbf{Lo que cae}: estantes sin anclar, televisores en el borde, materas en repisas altas, cuadros y lámparas sobre las camas, vidrios grandes. \textbf{Lo que estorba}: cajas en pasillos, puertas que abren hacia adentro, muebles que bloquean la salida. \textbf{Lo que protege}: mesas resistentes, muros firmes, espacios despejados lejos de ventanas. Mide con los ojos, no con el susto: ¿cuántos pasos hay de tu puesto a la salida?, ¿esa ruta está libre? Vas a descubrir que la mayoría de los riesgos de tu casa \textbf{no son el sismo}: son objetos que alguien puso donde no debía.
  checks:
  - |-
    Listaste al menos cinco objetos que podrían caer, con el lugar exacto donde están.
  - |-
    Identificaste la ruta de salida de tu salón y contaste los pasos, señalando qué la obstruye.
  - |-
    Señalaste al menos dos lugares que sí protegen, y explicaste por qué protegen.
  cuaderno: |-
    \textbf{En tu cuaderno (Actividad 1 · IDENTIFICA).} Título: «Actividad 1. El recorrido de la mirada». \textbf{Formato:} tres columnas (lo que cae · lo que estorba · lo que protege). \textbf{Extensión:} mínimo cinco entradas en la primera columna y dos en cada una de las otras, cada una con su ubicación. \textbf{Sabes que terminaste cuando} cualquiera de tu casa podría tomar tu lista y arreglar hoy mismo tres cosas concretas.

# ─── Fase 2 · Sistematización = Actividad 2 (4 pilares) ───────────────
sistematizacion:
  intro: |-
    Un sismo no es un castigo ni un misterio: es una liberación de energía que viaja en forma de ondas y deja datos que se pueden contar. Esta fase te da cuatro herramientas para leer esos datos, y la última es la más importante para vivir tranquilo: distinguir \textbf{qué tan probable} es algo de \textbf{cuándo} va a ocurrir. Todos los números que siguen son reales y llevan su fecha de corte, porque un dato de emergencia sin fecha no sirve.
  pilares:
  - |-
    \textbf{No viaja una onda, viajan dos.} La onda \textbf{P} es de compresión y corre por la corteza a unos 6 kilómetros por segundo; la onda \textbf{S} es transversal, más lenta (unos 3,5) y es la que de verdad sacude. Como la P llega antes, la diferencia entre ambas permite calcular a qué distancia ocurrió el sismo, y es lo que hace posible una \textbf{alerta temprana}: no se adivina el sismo, se detecta la primera onda y se avisa antes de que llegue la segunda. El aviso no es magia; es que la información viaja más rápido que el daño.
  - |-
    \textbf{La energía no crece de a poquitos.} Cada unidad entera de magnitud equivale a unas \textbf{32 veces} más energía liberada. Entre la mayor réplica registrada (4,8) y el sismo principal (7,4) hay 2,6 unidades de diferencia, lo que significa cerca de \textbf{8.000 veces} más energía. Por eso una réplica de 4,8 asusta pero no derriba lo que resistió el 10 de agosto, y por eso la escala engaña: parece que 7,4 y 4,8 están cerca, y no lo están en absoluto.
  - |-
    \textbf{El histograma cuenta cuántas, no qué tan fuertes.} Réplicas reportadas por el Servicio Geológico Colombiano: \textbf{47} al final del 10 de agosto, \textbf{96} acumuladas al 11 y \textbf{más de 130} al 12, todas entre magnitud 0,6 y 4,8. Si las pones por día y no acumuladas, quedan barras de 47, 49 y unas 34: el histograma \textbf{baja}. Eso es la ley de Omori dibujada. Y el mensaje que da un gráfico es distinto del que da el miedo: no es que «siga temblando cada vez más», es que va disminuyendo.
  - |-
    \textbf{Probabilidad no es predicción, y tampoco es certeza.} El pronóstico del 12 de agosto daba 98,8 \% de al menos una réplica de magnitud 4 o más en un año. Suena aterrador y no lo es: una magnitud 4 a profundidad intermedia casi no se siente, y el 98,8 \% no dice ni cuándo ni dónde. En la otra punta, el 10,6 \% de una magnitud 6 o más no significa «no va a pasar»: significa poco probable, que es distinto de imposible. Y un dato para dimensionar: en Colombia se registran unos \textbf{2.500 sismos al mes}, y casi ninguno se siente.
  anatomia:
    titulo: "Cómo se lee un histograma sin dejarse engañar"
    body: |-
      \begin{pasoslista}
      \item \textbf{¿Qué mide la altura?} En un histograma de réplicas, el eje vertical cuenta \textbf{cuántas}, no qué tan fuertes. Confundir frecuencia con magnitud es el error más común: una barra alta puede ser un montón de sismos diminutos.
      \item \textbf{¿Los intervalos son iguales?} Si una barra abarca un rango más ancho que las otras, parece decir más de lo que dice. Y ojo con lo acumulado: 47, 96 y 130 \textbf{no} son tres días, son un total que crece; por día son 47, 49 y unas 34.
      \item \textbf{¿El eje empieza en cero, y hay denominador?} Un eje cortado convierte una diferencia pequeña en un abismo. Y una cifra sin su total no dice nada: 9.393 personas víctimas de desplazamiento en Cartago suena distinto cuando sabes que el municipio tiene unos 143.522 habitantes, es decir, cerca del 6,5 \%.
      \end{pasoslista}
  errores_comunes: |-
    \textbf{«Ya tembló, ya no toca»:} la corteza no lleva la cuenta ni reparte turnos. Es la misma falacia de creer que un dado ya «debe» sacar seis. \textbf{«98,8 \% quiere decir que viene un terremoto»:} dice que habrá al menos un sismo pequeño, no uno grande. \textbf{«4,8 es casi 7,4»:} son unas 8.000 veces menos energía. \textbf{Buscar el marco de la puerta:} es una recomendación vieja; la vigente es agacharse, cubrirse y agarrarse. \textbf{Leer el acumulado como si fuera diario:} el gráfico deja de bajar y el miedo sube sin razón.
  cuaderno: |-
    \textbf{En tu cuaderno (Actividad 2 · ANALIZA).} Título: «Actividad 2. El histograma de las réplicas». \textbf{Formato:} un histograma dibujado a mano con los datos diarios (47, 49 y unas 34) más cinco renglones de lectura. \textbf{Extensión:} el gráfico rotulado con sus dos ejes, y debajo la explicación de qué tendencia muestra y por qué el dato acumulado da otra impresión. \textbf{Sabes que terminaste cuando} tu texto usa bien las palabras frecuencia, magnitud, probabilidad y tendencia.

# ─── Fase 3 · Praxis = Actividad 3 (4 pilares + producto) ─────────────
praxis:
  intro: |-
    Aquí se acaba la teoría. Un plan de protección no es una lista de miedos: es un conjunto de decisiones tomadas con calma \textbf{hoy}, para no tener que tomarlas en diez segundos de sacudida. Y hay algo que este programa sostiene desde el primer momento: aquí no habrá simulacros sorpresa. Todo lo que se practique se avisa antes, se explica y se puede observar sin participar.
  pilares:
  - |-
    \textbf{Antes:} acuerda con tu familia un \textbf{punto de encuentro} fuera de la casa y un \textbf{contacto en otra ciudad} (en una emergencia las líneas locales se saturan y las de larga distancia a veces no). Ancla estantes y televisores, baja lo pesado de las repisas altas, despeja pasillos y ten a mano linterna, agua, copia de documentos y los medicamentos de quien los necesite.
  - |-
    \textbf{Durante:} \textbf{agáchate, cúbrete y agárrate}. Protege cabeza y cuello, métete bajo una mesa resistente si la hay y sostente hasta que pare. No corras ni uses ascensores mientras sacude: la mayoría de las lesiones vienen de moverse entre cosas que caen. Lejos de ventanas, vidrios y objetos colgantes. En la calle, busca un lugar abierto lejos de postes, cables y fachadas. En un carro, reduce y detente lejos de postes y puentes.
  - |-
    \textbf{Después:} revisa si hay heridos y si la estructura tiene grietas nuevas, y sal si hay riesgo de colapso. No enciendas llamas ni interruptores hasta descartar fuga de gas. No satures el teléfono: un mensaje de texto pasa donde una llamada no. Espera réplicas y confía solo en fuentes oficiales con nombre y fecha de corte.
  - |-
    \textbf{Lo que sí controlas:} no controlas la placa de Nazca ni la fecha del próximo sismo. Sí controlas el estante que anclas, la ruta que despejas, el punto de encuentro que acuerdas, el mensaje que verificas antes de reenviar y a quién avisas. La amenaza no se negocia; la vulnerabilidad y la exposición, sí.
  checklist:
    titulo: "El recorrido de tu casa, con la familia"
    items: |-
      \begin{checklista}
      \item \textbf{Punto de encuentro y contacto externo} acordados en voz alta con quien vive contigo, y anotados donde todos los vean.
      \item \textbf{Tres arreglos hechos esta semana}, no prometidos: anclar un mueble, bajar algo pesado, despejar un pasillo.
      \item \textbf{Ruta de salida} recorrida caminando, contando pasos, con la luz apagada al menos una vez.
      \item \textbf{Lo esencial reunido} en un solo lugar conocido por todos: linterna, agua, documentos, medicamentos.
      \item \textbf{Una conversación con alguien mayor} de tu casa sobre qué haría si el sismo lo agarra solo. Escuchar, no dar clase.
      \end{checklista}
  plantilla_guion: |-
    \textbf{Tablero de riesgo (plantilla).} Divide una hoja en cuatro. \emph{Arriba a la izquierda:} el histograma de las réplicas con sus ejes rotulados. \emph{Arriba a la derecha:} tres cifras con su fecha de corte y una frase que explique qué NO dicen. \emph{Abajo a la izquierda:} dos columnas, «no depende de mí» y «sí depende de mí», con mínimo cuatro entradas cada una. \emph{Abajo a la derecha:} el plan de la casa (punto de encuentro, contacto externo, tres arreglos con fecha). Fírmalo con la fecha del día: un plan sin fecha es un deseo.
  cuaderno: |-
    \textbf{En tu cuaderno (Actividad 3 · CREA).} Título: «Actividad 3. Mi tablero de riesgo». \textbf{Formato:} una hoja dividida en cuatro, según la plantilla. \textbf{Extensión:} el gráfico, las tres cifras leídas, las dos columnas del control y el plan de la casa. \textbf{Sabes que terminaste cuando} los tres arreglos ya están hechos y puedes decir en qué día los hiciste.
  producto_titulo: "Tablero de riesgo: histograma, lectura de cifras, dicotomía del control y plan de la casa"
  criterios:
  - |-
    Tu histograma tiene los dos ejes rotulados, usa los datos diarios y no los acumulados, y su lectura escrita nombra la tendencia correcta.
  - |-
    Explicaste con tus palabras la diferencia entre probabilidad y predicción, usando una de las cifras reales del pronóstico.
  - |-
    Desmontaste al menos un titular o mensaje que hayas visto, señalando qué dato le falta (la fuente, la fecha de corte o el denominador).
  - |-
    Tu plan de casa tiene punto de encuentro, contacto externo y tres arreglos concretos \textbf{ya realizados}, con la fecha en que los hiciste.
  - |-
    Separaste en dos columnas lo que no depende de ti y lo que sí, con al menos cuatro entradas en cada una.

# ─── Triángulo de pensamiento ─────────────────────────────────────────
triangulo:
  dussel:
    autor: "Enrique Dussel"
    cita: "El filósofo, en América latina, debe comenzar por ser discípulo del pueblo oprimido latinoamericano."
    aplicacion: |-
      El campesino que leía las Pléyades no esperó permiso de nadie para saber. Cuando la ciencia fue a verificar su señal, no la corrigió: le encontró el mecanismo. Dussel invierte quién enseña a quién, y en gestión del riesgo eso es literal: quien vive junto al río sabe dónde crece, y quien vive en la ladera sabe qué se mueve cuando llueve.
    pregunta_espejo: "¿Qué sabe mi familia o mi barrio sobre este territorio que ningún mapa oficial registra todavía?"
  estoico:
    autor: "Séneca"
    cita: "Son más las cosas que nos asustan que las que nos aplastan, y sufrimos más en la imaginación que en la realidad."
    aplicacion: |-
      Después del 10 de agosto, muchas noches se fueron en imaginar el sismo que venía. Séneca no dice que el peligro sea falso: dice que el sufrimiento anticipado supera casi siempre al daño real. Prepararse es justamente lo que corta ese exceso, porque convierte una amenaza imaginada sin forma en una lista de cosas hechas.
    pregunta_espejo: "¿Cuánto de lo que me quita el sueño es peligro real y cuánto es una escena que yo mismo repito?"
  floridi:
    autor: "Luciano Floridi"
    cita: "Somos organismos informacionales (inforgs) conectados entre sí e inmersos en un entorno informacional: la infoesfera."
    aplicacion: |-
      Un gráfico también es un mensaje, y puede mentir sin decir una sola cifra falsa: basta con cortar un eje, cambiar el ancho de una barra o publicar un número sin su total. En una emergencia esas decisiones de diseño mueven a gente real. Leer un histograma con criterio es, hoy, una forma de defensa personal.
    pregunta_espejo: "La última gráfica que compartí, ¿la leí completa o solo miré cuál barra era más alta?"

# ─── Cierre / Compromiso ──────────────────────────────────────────────
compromiso: |-
  \textbf{Para la próxima sesión.} Tres cosas, y las tres se verifican. Primero, haz los \textbf{tres arreglos} de tu casa y anota la fecha: no sirve haberlos pensado. Segundo, busca en una fuente oficial el conteo de sismos del último mes en Colombia y compáralo con lo que tú creías: casi seguro son muchos más de los que sentiste, y entender eso baja el sobresalto. Tercero, siéntate con alguien mayor de tu casa y acuerden el punto de encuentro y el contacto de otra ciudad. Trae una sola frase escrita: qué cambió en tu casa esta semana por algo que tú propusiste.

# ─── Contenido web extra ──────────────────────────────────────────────
web:
  conceptos_clave:
    - termino: "Onda P y onda S"
      definicion: "Las dos ondas de un sismo: la P comprime y viaja más rápido (unos 6 km/s); la S es transversal, más lenta (unos 3,5 km/s) y es la que sacude."
      ejemplo: "La diferencia de llegada entre ambas permite calcular la distancia al epicentro y da los segundos de una alerta temprana."
      emoji: "〰️"
      categoria: "El fenómeno físico"
    - termino: "Histograma"
      definicion: "Gráfico de barras contiguas que muestra con qué frecuencia ocurre algo dentro de intervalos iguales. La altura cuenta casos, no intensidad."
      ejemplo: "Las réplicas por día (47, 49 y unas 34) dibujan una barra que baja: la ley de Omori a la vista."
      emoji: "📊"
      categoria: "Matemáticas"
    - termino: "Probabilidad y predicción"
      definicion: "La probabilidad estima qué tan frecuente es un suceso; la predicción pretende decir cuándo y dónde ocurrirá. Los sismos admiten lo primero, no lo segundo."
      ejemplo: "98,8 % de al menos una réplica de magnitud 4 o más en un año no dice ni el día ni la hora."
      emoji: "🎲"
      categoria: "Matemáticas"
    - termino: "Ley de Omori"
      definicion: "Describe cómo el número de réplicas disminuye con el tiempo tras un sismo grande: no paran de golpe, se van espaciando."
      ejemplo: "Por eso el conteo diario de réplicas baja aunque el acumulado siga creciendo."
      emoji: "📉"
      categoria: "El fenómeno físico"
    - termino: "Eje truncado"
      definicion: "Gráfico cuyo eje vertical no empieza en cero, de modo que una diferencia pequeña parece enorme. No es mentira en los datos, es mentira en el dibujo."
      ejemplo: "Una barra que parece el doble de otra puede representar apenas un 3 % más."
      emoji: "✂️"
      categoria: "Lectura crítica"
    - termino: "Vulnerabilidad"
      definicion: "Las condiciones previas que hacen que un mismo fenómeno dañe mucho a unos y poco a otros. No es la amenaza: es lo que la amenaza encuentra."
      ejemplo: "El Cairo perdió cerca del 80 % de su infraestructura con viviendas centenarias en bahareque."
      emoji: "🧱"
      categoria: "Autocuidado y seguridad"
  quiz:
    titulo: "Verifica lo que entendiste"
    instrucciones: "Cinco preguntas. Responde sin volver al texto y revisa después lo que falles."
    preguntas:
      - enunciado: "Un pronóstico dice: «98,8 % de probabilidad de al menos una réplica de magnitud 4 o mayor en el próximo año». ¿Qué significa?"
        opciones:
          - "Que es casi seguro que ocurra al menos un sismo pequeño, sin decir cuándo ni dónde exactamente"
          - "Que viene un terremoto grande y ya está anunciado"
          - "Que hay 98,8 % de probabilidad de que se repita el sismo del 10 de agosto"
          - "Que el 98,8 % del territorio va a temblar"
        respuesta_index: 0
        feedback_correcto: "Exacto. Alta probabilidad de algo pequeño no es lo mismo que anuncio de algo grande."
        feedback_incorrecto: "Vuelve al pilar 4. Una magnitud 4 a profundidad intermedia casi no se siente, y una probabilidad no fija fecha ni lugar."
      - enunciado: "En un histograma de réplicas, ¿qué mide la altura de cada barra?"
        opciones:
          - "Cuántas réplicas hubo en ese intervalo"
          - "Qué tan fuerte fue la réplica más grande"
          - "Cuánta energía se liberó en total"
          - "Cuántos días duró el temblor"
        respuesta_index: 0
        feedback_correcto: "Correcto: frecuencia, no intensidad. Es el error de lectura más común."
        feedback_incorrecto: "Revisa la anatomía. El eje vertical cuenta casos; una barra alta puede ser un montón de sismos diminutos."
      - enunciado: "Alguien afirma: «ya tembló fuerte, así que ahora nos toca descansar unos años». ¿Qué falla en el razonamiento?"
        opciones:

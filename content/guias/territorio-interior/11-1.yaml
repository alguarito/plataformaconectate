    - termino: "Decidir antes"
      definicion: "En el momento hay dos segundos, ganas y una justificación lista. Lo que se decidió en frío se sostiene; lo que se decide en caliente se negocia."
      ejemplo: "Incluye no ponerse donde la decisión va a ser difícil: no llevar el papelito, no aceptar el favor que después cobra."
      emoji: "🧊"
      categoria: "Herramienta"
    - termino: "La prueba de las tres"
      definicion: "¿Lo contaría? ¿Lo haría si me estuvieran viendo? ¿Me molestaría que me lo hicieran a mí?"
      ejemplo: "Casi ninguna justificación sobrevive a la tercera pregunta."
      emoji: "❓"
      categoria: "Herramienta"
    - termino: "Carácter y vigilancia"
      definicion: "Portarse bien porque queda registro no es carácter: es vigilancia, y se cae en cuanto el registro falla."
      ejemplo: "Vale la pena buscar a propósito los ratos en que nadie mira. Ahí es donde se sabe quién es uno."
      emoji: "👁️"
      categoria: "Distinguir"

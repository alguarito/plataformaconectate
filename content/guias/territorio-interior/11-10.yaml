      ejemplo: "Los beneficios aumentaban con la reflexión y las motivaciones altruistas. Pero los participantes eran principalmente adultos mayores de Estados Unidos: no se puede extrapolar sin más."
      emoji: "📚"
      categoria: "Entender"
    - termino: "Devolver en público"
      definicion: "Un acto público deja registro, da reconocimiento a quien trabajó sin que se notara, y transmite a los que vienen detrás."
      ejemplo: "Es lo que hacen la minga, el convite y el levantamiento de tumba: cerrar delante de todos."
      emoji: "🎪"
      categoria: "Herramienta"
    - termino: "Publicar no es devolver"
      definicion: "Publicar deja el registro y se salta la entrega; devolver le entrega algo a alguien que estaba ahí."
      ejemplo: "Si el registro que queda es más grande que el trabajo que se hizo, hubo una foto con actividad de fondo."
      emoji: "📵"
      categoria: "Distinguir"
    - termino: "El proyecto de vida es un verbo"
      definicion: "Se entiende mejor como a quién vas a cuidar y de qué te vas a hacer cargo que como una lista de lo que vas a tener."
      ejemplo: "Lo que uno va a tener casi nunca sale como se planeó; de qué se hace cargo sí depende de uno."
      emoji: "🧭"
      categoria: "Entender"
    - termino: "La pregunta nueva"
      definicion: "El último producto del programa: una pregunta abierta y el primer paso concreto que se va a dar con ella."
      ejemplo: "Una pregunta sin un primer paso es un buen deseo, y a esta altura ya saben la diferencia."
      emoji: "❓"
      categoria: "Herramienta"

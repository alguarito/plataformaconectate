      definicion: "Posponer no mantiene abiertas las opciones: el tiempo las cierra solo, y uno termina en la opción por defecto sin haberla examinado."
      ejemplo: "Quien decidió quedarse puede explicar por qué; a quien se le pasó el tiempo solo le queda decir que no alcanzó a decidir."
      emoji: "⏳"
      categoria: "Distinguir"
    - termino: "El paso pequeño"
      definicion: "Una acción de esta semana que dependa solo de ti y que otra persona podría ver que hiciste."
      ejemplo: "«Decidir» no es un paso. Escribir el correo, hacer la llamada o hablar con alguien que ya lo hizo, sí."
      emoji: "👣"
      categoria: "Herramienta"

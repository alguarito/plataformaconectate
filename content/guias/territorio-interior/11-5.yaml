# Foco: migración, oportunidad y querencia ---alas y raíces---.
# Ancla verificada: las redes de paisanos. Los estudios sobre migración
# en Colombia describen cómo esas redes se configuraban para estimular,
# facilitar y apoyar la llegada, y cómo la adaptación de quienes llegaban
# después de los pioneros era más fácil porque encontraban paisanos ya
# establecidos dispuestos a darles apoyo o información. Desde 1930 la
# ciudad atrae migración rural; hacia 1947 empieza a recibir desplazados.

    - termino: "Quedarse por decisión"
      definicion: "Irse no es siempre progresar ni quedarse siempre conformarse. Lo que distingue es si se decidió o simplemente pasó."
      ejemplo: "Y hay una tercera opción que casi nadie considera a los diecisiete: irse un tiempo y volver."

      definicion: "A muchos les enseñaron que pedir ayuda o compañía es de débiles, y en la adultez temprana esa lección se cobra."
      ejemplo: "Casi todo el mundo se alegra cuando alguien le escribe después de mucho tiempo, y casi todos creen que serían los únicos a quienes les da pena."
      emoji: "✉️"

      definicion: "Los principios estaban presentes en los sistemas duraderos y ausentes en los que se derrumbaron: alguien, en cada generación, hizo el trabajo."
      ejemplo: "Un acueducto veredal, una biblioteca, un río limpio o una tradición se caen en una generación si nadie los sostiene."
      emoji: "🔧"
      categoria: "Entender"
    - termino: "Nadie empieza de cero"
      definicion: "El agua potable, la vía, la escuela, la vacuna, el derecho a estudiar siendo mujer: nada existía por defecto."
      ejemplo: "Saberlo no quita mérito: ubica."
      emoji: "🧱"
      categoria: "Entender"
    - termino: "Devolver no es agradecer"
      definicion: "Agradecer es un sentimiento y se agota en quien lo siente; devolver es una acción y le llega a alguien más."
      ejemplo: "Y no es caridad: es hacerse cargo de una parte de lo recibido, dentro del sistema del que uno hace parte."
      emoji: "🔄"
      categoria: "Distinguir"
    - termino: "Preservar lo que se sabe"
      definicion: "La historia de un barrio, cómo se consiguió el acueducto, los nombres de las plantas: vive en la cabeza de gente mayor y se pierde entera."
      ejemplo: "Ustedes pueden grabar treinta minutos con un teléfono. Preservar nunca fue tan barato, y por eso no hacerlo pesa más."
      emoji: "🎙️"
      categoria: "Herramienta"

    - termino: "La prueba de la plaza"
      definicion: "¿Leerías esto en voz alta, con tu nombre, delante de la persona de la que se trata? Si la gracia depende de que no se sepa quién fue, ya sabes qué es."
      ejemplo: "No prohíbe la burla: Riosucio lleva un siglo burlándose de sus políticos. Exige autor, público y final."
      emoji: "📢"
      categoria: "Herramienta"
    - termino: "El mensaje privado"
      definicion: "Dos frases a quien fue afectado: que lo viste, que estuvo mal, sin pedirle nada. No hay que responderle al grupo para hacer algo."
      ejemplo: "En un grupo grande casi nadie interviene porque cada uno espera que hable otro; el privado no tiene ese costo."
      emoji: "✉️"
      categoria: "Herramienta"

      definicion: "Si la minga es para una persona del curso, esa persona también tiene tarea: no es el objeto de la ayuda, es uno más de los que trabajan."
      ejemplo: "El otro no pide caridad: reclama un derecho. La versión de obra de caridad humilla a quien recibe."

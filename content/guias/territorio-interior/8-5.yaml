      definicion: "Agresión escolar, acoso y ciberacoso que no constituyen delito y que se presentan de manera repetida o sistemática, o causan daño sin incapacidad."
      ejemplo: "La palabra que cambia el tipo es «repetida»: un apodo una vez es tipo I; todos los días durante un mes es tipo II."
      emoji: "2️⃣"
      categoria: "Herramienta"
    - termino: "Situación tipo III"
      definicion: "Situaciones constitutivas de presuntos delitos, incluidos los que atentan contra la libertad, la integridad y la formación sexual."
      ejemplo: "Ahí no hay nada que decidir entre estudiantes: se avisa siempre, y lo maneja un adulto."
      emoji: "3️⃣"
      categoria: "Herramienta"
    - termino: "Avisar no es acusar"
      definicion: "Acusar busca que a alguien le pase algo; avisar busca que a alguien deje de pasarle algo. El que acusa señala culpables; el que avisa cuenta lo que vio."
      ejemplo: "«Sapo» es la herramienta con que el que hace daño se queda sin testigos. Ningún código entre estudiantes cubre a quien está lastimando a otro."
      emoji: "📣"
      categoria: "Distinguir"
    - termino: "El principio de legalidad"
      definicion: "Nadie puede ser sancionado por algo que no estaba definido como falta antes, y tiene derecho a ser oído."
      ejemplo: "Un curso que castiga a alguien por un rumor está pasando el mismo límite que la Corte le puso al Estado."
      emoji: "📜"
      categoria: "Entender"

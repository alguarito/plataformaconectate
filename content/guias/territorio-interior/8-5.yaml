      definicion: "Situaciones esporádicas que afectan el clima escolar y que en ningún caso generan daños al cuerpo o a la salud física o mental."
      ejemplo: "Un roce, una discusión, un empujón aislado. Se puede manejar con acompañamiento (Decreto 1965 de 2013)."

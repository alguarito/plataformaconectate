      ejemplo: "Primero se fabrica una vara, después se vende lo que hace falta para alcanzarla. Quien menos puede comprarlo es quien más fácil queda por fuera."
      emoji: "💰"
      categoria: "Entender"
    - termino: "Lo que el cuerpo hace"
      definicion: "Camina, juega, abraza, aguanta, aprende. Nada de eso aparece en ninguna vara."
      ejemplo: "Ninguna medida del siglo XX midió jamás lo que un cuerpo es capaz de hacer."
      emoji: "🏃"
      categoria: "Herramienta"

      ejemplo: "«Que se haga respetar» · «que ayude en la cocina» · «que no ande solo de noche»."
      emoji: "🔄"
      categoria: "Herramienta"
    - termino: "Las dos caras del mandato"
      definicion: "A unas les quita el derecho a intentar; a otros, el derecho a necesitar."
      ejemplo: "No pedir ayuda, no llorar, no decir que algo duele, responder con rabia porque es la única emoción permitida."
      emoji: "🪞"
      categoria: "Entender"

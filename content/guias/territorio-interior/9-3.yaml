    - termino: "La pregunta temprana"
      definicion: "«¿Te ha pegado?» es la pregunta tardía. La temprana es: «¿qué podías hacer antes que ya no haces?»."
      ejemplo: "Nadie recuerda cuándo empezó, porque no empezó: se fue estrechando, y cada paso parecía razonable."
      emoji: "❓"
      categoria: "Herramienta"
    - termino: "Las cinco libertades"
      definicion: "Salir sin pedir permiso, ver a los amigos, decir lo que se piensa, ponerse lo que se quiere, disponer del propio tiempo."
      ejemplo: "La pregunta que las resume: ¿esta relación le hizo la vida más grande o más pequeña? El cuidado agranda; el control encoge."
      emoji: "🕊️"
      categoria: "Herramienta"
    - termino: "Sentir y actuar"
      definicion: "El celo es una emoción y llega solo; revisar un teléfono, exigir respuesta o prohibir una amistad son conductas que se eligen."
      ejemplo: "Sentir celos no le hace daño a nadie. Actuarlos sí."
      emoji: "⚖️"
      categoria: "Distinguir"

    - termino: "El continuo"
      definicion: "La violencia en la pareja no es un estallido: es una escalera que empieza con cosas que nadie llamó violencia."
      ejemplo: "Lo que en 1936 se trataba como un arrebato hoy se entiende como el último escalón de algo que empezó mucho antes."
      emoji: "🪜"
      categoria: "Entender"
    - termino: "La prueba del descontrol"
      definicion: "Quien «pierde el control» escoge muy bien delante de quién lo pierde, y qué romper, y a quién golpear."
      ejemplo: "Nadie pierde el control con su jefe, ni con un policía, ni delante de la mamá de ella. Eso no es un arrebato: es una conducta dirigida."
      emoji: "🎯"
      categoria: "Distinguir"
    - termino: "El límite bajo"
      definicion: "Decidir en frío, y en los escalones uno a tres, qué conducta termina una relación."
      ejemplo: "En el escalón del golpe casi no queda margen: para entonces la persona suele estar aislada, convencida de que exagera y avergonzada."
      emoji: "🚩"
      categoria: "Herramienta"
    - termino: "Acompañar sin ordenar"
      definicion: "Nombrar lo que se vio, preguntar cómo se siente y dejar la puerta abierta. Decirle a alguien que deje a su pareja rara vez funciona y suele cerrar la conversación."
      ejemplo: "Del escalón cinco hacia arriba —aislamiento, culpa, amenazas— se avisa a un adulto siempre, aunque el amigo pida que no."
      emoji: "🫂"
      categoria: "Herramienta"

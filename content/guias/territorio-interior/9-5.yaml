    - termino: "La asimetría de la serie"
      definicion: "El que dice la frase ve un dato aislado; el que la recibe ve la serie completa de un año."
      ejemplo: "Por eso los dos pueden estar diciendo la verdad cuando uno dice «no fue nada» y el otro dice «estoy harta»."

    - termino: "La barrera de actitud"
      definicion: "La Convención nombra el entorno y también la actitud: decidir por alguien, hablarle al acompañante, felicitarlo por cosas ordinarias."
      ejemplo: "Venir a clase no es una hazaña. Y se pregunta antes de ayudar, siempre."
      emoji: "🙋"
      categoria: "Entender"
    - termino: "Ajustes que no cuestan"
      definicion: "Hablar de frente, no explicar de espaldas, dejar la instrucción escrita, dar un minuto más, avisar los cambios, deletrear la palabra difícil."
      ejemplo: "Ninguno cuesta un peso, y casi todos mejoran la clase para todo el mundo."
      emoji: "🛠️"
      categoria: "Herramienta"

    - termino: "Reconocer sin humillar"
      definicion: "Si el daño fue público, la reparación también. Pero un acto que humilla no repara: crea un daño nuevo."
      ejemplo: "El acto se hace sobre lo que pasó, no sobre quiénes son las personas —y quien recibió el daño decide cuánto quiere aparecer."
      emoji: "🕊️"
      categoria: "Herramienta"

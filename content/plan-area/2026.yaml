            competencia: "Reconocer la historia del diseño visual desde los petroglifos hasta la era digital."
            aprendizaje: "Identifica hitos del diseño gráfico y la influencia ancestral en la estética contemporánea."
            cognitivo: "Conoce los principios del diseño: jerarquía, equilibrio, contraste, ritmo, unidad."
            procedimental: "Analiza piezas de diseño popular (almanaques, esquelas) y contemporáneas."
            actitudinal: "Valora el diseño visual del Pacífico como tradición digna y vigente."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Producir piezas visuales con herramientas digitales (Canva, Figma, Google Slides)."
            aprendizaje: "Diseña piezas comunicativas (cartel, infografía, presentación) con criterio profesional."
            cognitivo: "Identifica los principios de tipografía, color y layout."
            procedimental: "Produce una pieza visual de 1 página integrando texto + imagen + identidad visual."
            actitudinal: "Cuida la accesibilidad: contrastes legibles, fuentes claras, jerarquía evidente."
          - componente: "Solución de problemas con tecnología"
            competencia: "Resolver problemas de comunicación visual con criterio ético y estético."
            aprendizaje: "Identifica cuándo un diseño confunde y cómo corregirlo."
            cognitivo: "Reconoce errores comunes: exceso de fuentes, color saturado, jerarquía confusa."
            procedimental: "Revisa diseños propios y ajenos aplicando una lista de chequeo de 5 criterios."
            actitudinal: "Acepta retroalimentación con humildad y mejora iterativamente."
          - componente: "Tecnología y sociedad"
            competencia: "Producir piezas visuales que dialoguen con saberes y estéticas locales."
            aprendizaje: "Integra elementos del diseño visual del Pacífico en producciones propias."
            cognitivo: "Reconoce los aportes estéticos de comunidades del Chocó, Cauca y Valle."
            procedimental: "Diseña una pieza visual final que integre al menos un elemento ancestral identificable."
            actitudinal: "Honra a las comunidades del Pacífico citando sus aportes en cada pieza."

  - grado: 9
    nivel: "BÁSICA SECUNDARIA"
    grado_nombre: "NOVENO"
    periodos:
      - num: 1
        titulo: "Técnica, ciencia y tecnología"
        dba: "Comprende la evolución histórica de la técnica desde la mano humana hasta la era digital, distinguiendo técnica, ciencia y tecnología."
        anclaje: "La técnica en la mano (azuela, hueso tallado)"
        proyecto: "Manifiesto del técnico crítico"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender la evolución histórica desde los primeros artefactos hasta el chip."
            aprendizaje: "Construye una línea de tiempo de la técnica desde el fuego hasta la imprenta y la era digital."
            cognitivo: "Distingue técnica, ciencia y tecnología; reconoce hitos: fuego, rueda, imprenta, electricidad, internet."
            procedimental: "Investiga 5 hitos tecnológicos y los presenta en línea de tiempo visual."
            actitudinal: "Reconoce que la técnica nació en la mano humana antes que en la fábrica."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Usar herramientas tecnológicas con criterio histórico y crítico."
            aprendizaje: "Maneja herramientas digitales valorando lo que cada una hereda de oficios anteriores."
            cognitivo: "Conoce el origen y propósito de cada herramienta que usa cotidianamente."
            procedimental: "Documenta el uso de 5 herramientas con su contexto histórico."
            actitudinal: "Cuida las herramientas como extensión del cuerpo, no como descartables."
          - componente: "Solución de problemas con tecnología"
            competencia: "Resolver problemas tecnológicos con perspectiva histórica y crítica."
            aprendizaje: "Compara soluciones técnicas antiguas y modernas al mismo problema."
            cognitivo: "Identifica problemas que la humanidad ha resuelto varias veces de formas distintas."
            procedimental: "Analiza un problema actual y propone solución integrando tradición y tecnología."
            actitudinal: "No idolatra lo nuevo ni desprecia lo antiguo; juzga por criterio."
          - componente: "Tecnología y sociedad"
            competencia: "Construir manifiesto del técnico crítico responsable."
            aprendizaje: "Redacta un manifiesto personal sobre su rol como técnico/usuario responsable."
            cognitivo: "Reconoce las dimensiones éticas, ambientales y sociales del trabajo técnico."
            procedimental: "Elabora un manifiesto de 1 página con sus principios técnicos personales."
            actitudinal: "Asume posición crítica frente al consumismo tecnológico."
      - num: 2
        titulo: "Diseño editorial y maquetación digital"
        dba: "Produce piezas editoriales digitales con criterio profesional, integrando tradición de pasquines populares y herramientas contemporáneas."
        anclaje: "Pasquines, almanaques y esquelas del Valle"
        proyecto: "Revista escolar con diseño editorial"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender la evolución del diseño editorial desde la imprenta de Gutenberg hasta el diseño web."
            aprendizaje: "Identifica hitos del diseño editorial y su raíz popular en pasquines y almanaques."
            cognitivo: "Conoce los componentes editoriales: portada, contraportada, sumario, secciones, cierre."
            procedimental: "Investiga 3 revistas y describe su estructura editorial."
            actitudinal: "Honra el diseño popular del Valle como tradición editorial vigente."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Maquetar piezas editoriales con herramientas digitales (Canva, Figma, Adobe Express)."
            aprendizaje: "Produce una revista de 8-12 páginas con maquetación coherente."
            cognitivo: "Reconoce reglas de cuadrícula, tipografía editorial y jerarquía visual."
            procedimental: "Maqueta una revista escolar de 8+ páginas con secciones, imágenes y texto."
            actitudinal: "Cuida cada detalle como el editor de tradición."
          - componente: "Solución de problemas con tecnología"
            competencia: "Resolver problemas de maquetación con criterio profesional."
            aprendizaje: "Detecta y corrige problemas editoriales (jerarquía confusa, fuentes mal combinadas, accesibilidad)."
            cognitivo: "Conoce los 10 errores comunes en diseño editorial."
            procedimental: "Revisa la revista propia y ajena aplicando lista de chequeo."
            actitudinal: "Itera con paciencia; el primer borrador nunca es el final."
          - componente: "Tecnología y sociedad"
            competencia: "Publicar piezas editoriales que aporten valor a la comunidad escolar."
            aprendizaje: "Distribuye su revista a la comunidad y registra retroalimentación."
            cognitivo: "Reconoce el rol social de la prensa escolar y su capacidad de informar y formar."
            procedimental: "Sustenta la revista ante el salón y recoge feedback de mínimo 5 lectores."
            actitudinal: "Asume responsabilidad por lo que publica como editor."
      - num: 3
        titulo: "Datos, estadística y visualización"
        dba: "Analiza datos del entorno escolar y comunitario usando estadística básica, visualización honesta y herramientas digitales."
        anclaje: "La libreta de la abuela (conteo de cosecha)"
        proyecto: "Diagnóstico de mi colegio con datos"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender la estadística como ciencia de la incertidumbre y la visualización como lenguaje universal."
            aprendizaje: "Identifica los tipos de gráficos y cuándo usar cada uno."
            cognitivo: "Define media, mediana, moda, rango, desviación; distingue gráfico de barras, líneas, sectores."
            procedimental: "Calcula medidas de tendencia central a partir de un conjunto de datos."
            actitudinal: "Honra a la abuela cosechera como estadista ancestral."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Producir visualizaciones honestas con hojas de cálculo y herramientas de BI básico."
            aprendizaje: "Diseña gráficos en Excel/Sheets con criterio comunicativo."
            cognitivo: "Conoce los principios de la visualización honesta: ejes correctos, escalas justas, sin distorsión."
            procedimental: "Produce 3 visualizaciones distintas de un mismo dataset escolar."
            actitudinal: "Diseña gráficos para informar, no para impresionar ni engañar."
          - componente: "Solución de problemas con tecnología"
            competencia: "Resolver problemas comunitarios con análisis de datos."
            aprendizaje: "Identifica un problema del colegio, recolecta datos y propone solución basada en evidencia."
            cognitivo: "Reconoce los pasos del método de investigación con datos."
            procedimental: "Realiza encuesta a mínimo 30 estudiantes, analiza resultados y presenta hallazgos."
            actitudinal: "Aplica rigor estadístico básico; reconoce los límites de su muestra."
          - componente: "Tecnología y sociedad"
            competencia: "Comunicar resultados de análisis de datos a la comunidad escolar con honestidad."
            aprendizaje: "Presenta el diagnóstico del colegio a directivos y comunidad."
            cognitivo: "Reconoce el rol del dato en la toma de decisiones democráticas."
            procedimental: "Elabora informe ciudadano de 6 páginas con datos, gráficos y propuestas."
            actitudinal: "Honra la estadística doméstica de la abuela como ética de cuidado comunitario."

  - grado: 10
    nivel: "MEDIA"
    grado_nombre: "DÉCIMO"
    periodos:
      - num: 1
        titulo: "Edición digital y autoría con IA responsable"
        dba: "Produce un libro digital escolar aplicando criterios editoriales, derechos de autor, prompting técnico y declaración honesta de uso de IA."
        anclaje: "El personaje silencioso del barrio (intermediario)"
        proyecto: "Mi libro digital: del oficio del editor al sello propio"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender la evolución de la autoría editorial desde la imprenta hasta los libros con IA."
            aprendizaje: "Distingue el rol histórico del editor y los desafíos contemporáneos con IA generativa."
            cognitivo: "Define qué hace y qué no hace un editor; reconoce el ciclo editorial completo."
            procedimental: "Analiza 3 libros editoriales y describe su estructura, voz y producción."
            actitudinal: "Honra al personaje silencioso del barrio como intermediario cultural ancestral."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Usar IA con criterio profesional para escritura editorial."
            aprendizaje: "Aplica las 5 partes del prompt profesional para texto y itera respuestas."
            cognitivo: "Conoce las técnicas de prompting técnico para escritura: rol, contexto, restricciones, ejemplos, formato."
            procedimental: "Produce capítulos de libro con IA como asistente, editando con voz propia."
            actitudinal: "La IA es asistente, no autor; la voz del libro es del estudiante."
          - componente: "Solución de problemas con tecnología"
            competencia: "Resolver problemas de derechos de autor y autoría con IA según legislación colombiana."
            aprendizaje: "Aplica la Ley 23 de 1982 y las consideraciones éticas sobre obras derivadas con IA."
            cognitivo: "Reconoce la diferencia entre obra original, obra derivada y obra generada por IA."
            procedimental: "Declara explícitamente la participación de IA en cada capítulo del libro."
            actitudinal: "Sostiene la honestidad académica frente a la presión del atajo."
          - componente: "Tecnología y sociedad"
            competencia: "Publicar un libro escolar con criterio profesional y compromiso ético."
            aprendizaje: "Compila, sustenta y difunde su libro de 80 páginas en la feria del libro escolar (S10)."
            cognitivo: "Reconoce el rol del autor responsable en la infoesfera contemporánea."
            procedimental: "Sustenta su libro públicamente y recoge retroalimentación crítica."
            actitudinal: "Asume el rol de autor con responsabilidad y orgullo."
      - num: 2
        titulo: "Comunicación profesional con IA"
        dba: "Produce documentos profesionales (informes técnicos, comerciales, estudios de mercado) usando IA como asistente y declarando su uso."
        anclaje: "Los 4 oficios de la palabra (barrio Obrero)"
        proyecto: "Informe profesional del oficio"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender la evolución de los géneros de texto profesional."
            aprendizaje: "Identifica los 4 tipos de texto profesional y sus convenciones."
            cognitivo: "Distingue informe técnico, informe comercial, ensayo y estudio de mercado."
            procedimental: "Analiza 4 textos profesionales y los clasifica por género."
            actitudinal: "Honra a los 4 oficios de la palabra del barrio Obrero."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Producir documentos profesionales con Google Docs/Word + IA responsable."
            aprendizaje: "Maneja estilos, índices, citas y referencias en documentos profesionales."
            cognitivo: "Reconoce los componentes de un documento profesional formal."
            procedimental: "Produce un informe técnico de 10+ páginas con todos los componentes formales."
            actitudinal: "Cuida cada detalle como el cuentista cuida la palabra empeñada."
          - componente: "Solución de problemas con tecnología"
            competencia: "Resolver problemas comunicativos en contextos laborales reales."
            aprendizaje: "Redacta correos profesionales, propuestas y reportes para audiencias reales."
            cognitivo: "Identifica el tono, registro y estructura adecuados según audiencia."
            procedimental: "Redacta y envía 3 correos profesionales reales (a docentes, directivos o empresas)."

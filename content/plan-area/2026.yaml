          - componente: "Apropiación y uso de la tecnología"
            competencia: "Construir un MVP digital y recolectar datos de validación reales."
            aprendizaje: "Implementa un MVP en plataforma de bajo código y recolecta datos de uso."
            cognitivo: "Conoce las plataformas no-code para MVPs (Glide, Bubble, sitios web)."
            procedimental: "Implementa un MVP funcional y recolecta datos de mínimo 20 usuarios reales."
            actitudinal: "Acepta el MVP como imperfecto pero útil para aprender."
          - componente: "Solución de problemas con tecnología"

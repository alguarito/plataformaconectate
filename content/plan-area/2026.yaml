# ─── Sección 1 · INTRODUCCIÓN ────────────────────────────────────────────────
introduccion: |
  En la actualidad, la educación de calidad no solo implica el cumplimiento de
  estándares académicos, sino la capacidad de transformar la realidad de los
  estudiantes desde el desarrollo del pensamiento crítico, creativo y ético.
  El presente Plan de Área de Tecnología e Informática 2026 de la Institución
  Educativa Sor María Juliana se ha estructurado con base en el Modelo
  Pedagógico Institucional MILC (Modelo de Investigación Liberadora y
  Científica), articulando estrategias activas de aprendizaje, perspectiva
  liberadora, integración del pensamiento computacional y formación
  socioemocional.

  Este plan articula estrategias metodológicas activas como el Aprendizaje
  Basado en Proyectos (ABP), el enfoque STEAM (Ciencia, Tecnología,
  Ingeniería, Artes y Matemáticas), el Aula Invertida y la asistencia
  responsable de Inteligencia Artificial, como vías para una formación
  significativa, contextualizada y orientada al desarrollo de competencias
  para el siglo XXI. En coherencia con el perfil julianista y el énfasis
  contable de la institución, el área busca fortalecer competencias
  relacionadas con la gestión de la información, el análisis de datos, la
  comunicación digital responsable y la producción editorial con criterio.

  La edición 2026 cierra el pipeline editorial MILC v3 (single source of
  truth): 216 piezas curriculares activas distribuidas entre 180 guías
  didácticas, 18 proyectos integradores entregable-céntricos y 18 exámenes
  finales con banco de práctica. Todas se generan desde archivos YAML
  versionados, se compilan a PDF imprimible y se publican en la plataforma
  Conéctate (alguarito.github.io/plataformaconectate), accesible offline-first
  desde cualquier dispositivo.

  De esta forma, este plan representa una hoja de ruta estratégica para el
  desarrollo de competencias integradoras, en donde se articula lo técnico
  con lo humano, lo disciplinar con lo social, y lo tecnológico con lo
  cultural, ancestral y ético. Se posiciona como apuesta clara hacia una
  educación más crítica, conectada con el presente y proyectada hacia el
  futuro, donde la tecnología se convierte en puente para el desarrollo
  humano integral.

# ─── Sección 2 · JUSTIFICACIÓN O ENFOQUE DEL ÁREA ────────────────────────────
justificacion: |
  El área de Tecnología e Informática en la Institución Educativa Sor María
  Juliana se proyecta como un eje transversal del currículo que dinamiza la
  experiencia educativa desde la acción, la investigación y la producción
  consciente. Su enfoque trasciende la mera alfabetización digital para
  convertirse en una experiencia formativa integral que articula el saber
  hacer con criterio (Wing, 2006), la conciencia social (Freire, 1970), la
  reflexión filosófica desde la liberación (Dussel, 1977; Floridi, 2014) y la
  habitabilidad responsable de la infoesfera.

  La implementación de secuencias didácticas estructuradas en formato MILC v3
  se configura como herramienta pedagógica estratégica para desarrollar
  competencias desde el pensamiento complejo, integrando lo argumentativo, lo
  procedimental y lo actitudinal. Cada guía cierra con un triángulo
  filosófico (Dussel + Estoicismo + Floridi) que vincula la técnica con la
  ética; cada proyecto integrador incrusta reflexiones en los productos
  mismos (no como anexos) para que la dimensión humana sea inseparable de la
  producción tecnológica.

  El enfoque de proyectos de aula adquiere especial relevancia al permitir
  que el conocimiento se articule con las vivencias, necesidades y saberes
  del entorno. Cada periodo abre con un anclaje ancestral del Valle del
  Cauca, el Pacífico o el campo colombiano (el pregonero de Cartago, la
  minga campesina, las abuelas tejedoras, doña Mercedes la maestra rural,
  los oficios de la palabra del barrio Obrero, los maestros carpinteros y
  relojeros), de modo que la tecnología contemporánea se enraíza en
  saberes propios sin perder rigor técnico.

  Desde este enfoque, el aula se convierte en laboratorio para el
  pensamiento crítico y la solución de problemas contextualizados.

# ─── Sección 3 · OBJETIVOS Y METAS DE APRENDIZAJE ────────────────────────────
objetivos_generales: |
  Desarrollar en los estudiantes competencias tecnológicas, comunicativas,
  investigativas y éticas que les permitan comprender, aplicar y transformar
  creativamente el conocimiento digital, mediante el uso responsable de las
  TIC, el pensamiento computacional y la integración de saberes ancestrales,
  para responder con criterio a los retos personales, profesionales y
  ciudadanos del siglo XXI.

metas_aprendizaje:
  - "Fomentar la alfabetización digital crítica para que los estudiantes comprendan, evalúen y utilicen responsablemente las TIC como herramientas de aprendizaje, expresión y participación ciudadana."
  - "Desarrollar el pensamiento computacional como estrategia para analizar, descomponer y resolver problemas reales mediante procesos lógicos, algoritmos y herramientas digitales."
  - "Potenciar el pensamiento crítico y creativo en la construcción de soluciones tecnológicas a partir de proyectos interdisciplinarios con sentido social, vinculados a las realidades del contexto escolar y comunitario."
  - "Fortalecer el uso ético, seguro y responsable de la tecnología, promoviendo la ciudadanía digital, la protección de datos personales, la participación democrática en entornos virtuales y el respeto por la diversidad."
  - "Integrar el uso de herramientas tecnológicas en procesos contables y administrativos, desarrollando habilidades prácticas para la gestión de información, el análisis de datos y la solución de problemas del entorno productivo."
  - "Articular la tecnología con los proyectos de aula, generando experiencias significativas en las que se promueva la investigación, el trabajo colaborativo, la resiliencia y la comunicación efectiva, en sintonía con el modelo pedagógico MILC."
  - "Promover el uso de las TIC como medio para la inclusión, la sostenibilidad ambiental y la equidad social, reconociendo su potencial transformador en la construcción de una sociedad más justa, ética e intercultural."
  - "Desarrollar competencias para la vida laboral y la educación superior, mediante el dominio progresivo de herramientas digitales, software ofimático, plataformas colaborativas y sistemas de información."
  - "Integrar la Inteligencia Artificial generativa al aula con criterio progresivo (sin IA en G6° · declaración honesta en G7° · uso responsable obligatorio en G8°–G11°), formando estudiantes que mantengan voz propia, verifiquen información y declaren su proceso."

# ─── Sección 4 · MARCO LEGAL ─────────────────────────────────────────────────
marco_legal: |
  El presente Plan de Área se fundamenta en la normatividad vigente
  colombiana sobre educación, tecnología e información:

  \textbf{Constitución Política de Colombia (1991).}
  \begin{itemize}
    \item Artículo 27: garantiza las libertades de enseñanza, aprendizaje, investigación y cátedra.
    \item Artículo 70: el Estado tiene el deber de promover y fomentar el acceso a la cultura.
    \item Artículo 71: la búsqueda de conocimientos y la expresión artística son libres.
  \end{itemize}

  \textbf{Ley General de Educación 115 de 1994.} Define la tecnología e
  informática como área obligatoria y fundamental en la educación básica.
  \begin{itemize}
    \item Artículo 5: fines de la Educación (numerales 5, 7, 10, 11 y 13).
    \item Artículo 13: objetivos comunes de todos los niveles (literal f).
    \item Artículo 21: objetivos específicos de la educación básica primaria (literal ñ).
    \item Artículo 22: objetivos específicos de la educación básica secundaria (literal g).
    \item Artículo 23: áreas obligatorias y fundamentales (numeral 9: Tecnología e Informática).
  \end{itemize}

  \textbf{Orientaciones MEN.}
  \begin{itemize}
    \item Guía No. 30: \emph{Ser competente en tecnología: ¡una necesidad para el desarrollo!} (2008). Define los cuatro componentes: naturaleza y evolución, apropiación y uso, solución de problemas, tecnología y sociedad.
    \item Orientaciones Curriculares para el Área de Tecnología e Informática en Educación Básica y Media (MEN, Bogotá, julio de 2022).
    \item Derechos Básicos de Aprendizaje (DBA) por grado.
  \end{itemize}

  \textbf{Ley 1581 de 2012} de protección de datos personales (referente en
  guías de G6°·P1 y G6°·P3 sobre identidad y huella digital).

  \textbf{Ley 1620 de 2013} de convivencia escolar y formación para los
  derechos humanos, sexuales y reproductivos (referente para netiqueta,
  riesgos digitales y educación socioemocional).

# ─── Sección 5 · MARCO TEÓRICO ───────────────────────────────────────────────
marco_teorico_intro: |
  El Plan de Área articula referentes pedagógicos, filosóficos y
  tecnológicos en un lenguaje operativo para el aula, conformando lo que el
  modelo MILC denomina el \emph{triángulo de pensamiento} y el \emph{marco
  de referentes integradores}.

triangulo_pensamiento:
  - nombre: "Enrique Dussel · Filosofía de la liberación"
    aporte: "Reconocimiento de la voz del otro. Cuidar la propia voz es respeto a sí mismo. Lo que escribimos cuenta porque cuenta la voz de quien escribe. Eje en las guías de identidad digital (G6) y producción editorial (G10–G11)."
  - nombre: "Marco Aurelio · Estoicismo"
    aporte: "Disciplina del tiempo. Lo que escribes hoy queda. La prisa es enemiga del juicio: parar, respirar y verificar antes de creer o reenviar. Eje en evaluación crítica de fuentes (G6) y uso de IA (G7–G11)."
  - nombre: "Luciano Floridi · Filosofía de la información"
    aporte: "Infoesfera. Habitas un ambiente informacional compartido. Cada mensaje suma claridad o ruido. Eres responsable de lo que produces como tuyo. Eje en ciudadanía digital, seguridad y ética de IA."

referentes_marco_teorico:
  - autor: "Paulo Freire"
    obra: "Pedagogía del oprimido (1970)"
    aporte: "Crítica a la educación bancaria y defensa de una educación problematizadora. El estudiante interpreta su realidad y actúa sobre ella mediante diálogo, conciencia crítica y praxis."
  - autor: "Enrique Dussel"
    obra: "Filosofía de la liberación (1977)"
    aporte: "Exterioridad, alteridad, ética y crítica de la dominación. La tecnología debe pensarse desde el otro, especialmente desde quien queda excluido o silenciado por sistemas técnicos."
  - autor: "Luciano Floridi"
    obra: "Filosofía de la información (2014)"
    aporte: "Infoesfera, vida onlife, identidad y ética informacional. Los estudiantes habitan entornos donde identidad, datos, comunicación y aprendizaje se entrelazan."
  - autor: "Jeannette M. Wing"
    obra: "Computational Thinking (2006)"
    aporte: "Gramática cognitiva para resolver problemas: descomponer, reconocer patrones, abstraer, diseñar algoritmos, depurar, modelar y evaluar soluciones."
  - autor: "CASEL"
    obra: "Marco socioemocional (2020)"
    aporte: "Competencias socioemocionales: autoconciencia, autorregulación, conciencia social, habilidades relacionales y toma responsable de decisiones."
  - autor: "UNESCO"
    obra: "Competencias en IA para estudiantes (2024)"
    aporte: "Competencias estudiantiles en inteligencia artificial con enfoque humano, ético, creativo e inclusivo."
  - autor: "MEN Colombia"
    obra: "Guía No. 30 (2008)"
    aporte: "Marco colombiano para competencias tecnológicas y los 4 componentes: naturaleza, apropiación, solución de problemas y tecnología-sociedad."

# ─── Sección 6 · MARCO CONTEXTUAL ────────────────────────────────────────────
marco_contextual_historia: |
  La Institución Educativa Sor María Juliana tuvo su origen el 25 de febrero
  de 1927 en la carrera 4ª con calle 14 esquina, en Cartago, Valle del Cauca.
  En ese entonces se llamaba \emph{Escuela Superior} y la directora fue una
  reconocida pedagoga, la señorita Albertina Vásquez. La sociedad de Cartago
  hizo de este claustro un semillero de mujeres ilustres que entraron a
  ocupar los mejores cargos de la ciudad. El 4 de octubre de 1965 comenzó a
  funcionar la institución en su sede actual, consolidando una trayectoria
  de casi un siglo en la formación de niños, niñas y jóvenes cartagüeños.

marco_contextual_socioeconomico: |
  La población estudiantil de la I.E. Sor María Juliana tiene un promedio de
  3.000 estudiantes, lo que la convierte en la institución educativa con
  mayor densidad estudiantil del municipio. Dicha población proviene
  mayoritariamente de los estratos 1, 2 y 3, con un componente importante de
  familias migrantes, monoparentales y multiculturales. El área de
  Tecnología e Informática ha asumido el compromiso de cerrar brechas
  digitales mediante una plataforma propia (Conéctate) que opera offline tras
  la primera visita, permitiendo acceso a las 216 piezas curriculares incluso
  desde dispositivos modestos con conectividad intermitente.

anclajes_ancestrales:
  - { grado: 6,  periodo: 1, oficio: "El pregonero del barrio",            resumen: "Don Aurelio llevaba avisos con campanita. Su nombre era su identidad: si lo entregaba bien, la cuadra lo buscaba; si lo dañaba, lo corregían." }
  - { grado: 6,  periodo: 2, oficio: "Relojero, costurera, panadero",      resumen: "Maestros de oficio que entendían su máquina por dentro. Don Lucho con el reloj, doña Carmen con la Singer, don Aurelio con el horno." }
  - { grado: 6,  periodo: 3, oficio: "Doña Mercedes, maestra rural",       resumen: "Enseñaba a escribir bien y a leer crítico. Antes de creer una noticia preguntaba: ¿quién?, ¿cuándo?, ¿por qué?, ¿qué prueba?, ¿quién más?" }
  - { grado: 7,  periodo: 1, oficio: "La minga del Valle",                 resumen: "Veinte vecinos cosechaban café al tiempo, en surcos distintos, sin estorbarse, con reciprocidad. Es la matriz cultural de la coautoría en la nube." }
  - { grado: 7,  periodo: 2, oficio: "Doña Sofía, la tejedora",            resumen: "Tejía canastos siguiendo un algoritmo: secuencia, repetición, condicional al borde, variable contadora en la cabeza. Las tejedoras programaban antes que las computadoras." }
  - { grado: 7,  periodo: 3, oficio: "El consejero del barrio",            resumen: "Doña Mercedes, don Lucho, doña Esperanza. Aconsejaban pero no decidían por nadie. La IA hoy ocupa ese rol: requiere verificación y voz propia." }
  - { grado: 8,  periodo: 1, oficio: "El gesto de la cocina del Valle",    resumen: "La abuela tomaba decisiones lógicas antes de poner la olla al fogón. Cuidado, precisión y verificación cruzada en cada paso." }
  - { grado: 8,  periodo: 2, oficio: "Decisiones del campesino",           resumen: "En las fincas, decisiones que parecen sencillas esconden lógica compuesta: condiciones AND/OR/NOT que evitan pérdidas." }
  - { grado: 8,  periodo: 3, oficio: "Diseño visual del Pacífico",         resumen: "Comunidades del Chocó con tradiciones de diseño visual y gestión del dato comunal. Lo común se anota, se cuida, se transmite." }
  - { grado: 9,  periodo: 1, oficio: "La técnica en la mano",              resumen: "Los primeros artefactos (azuela, hueso tallado) no nacieron en fábrica: nacieron en la mano. La técnica es habilidad situada antes que herramienta." }
  - { grado: 9,  periodo: 2, oficio: "Pasquines, almanaques, esquelas",    resumen: "Diseño popular del Valle: pliegos parroquiales y almanaques campesinos. La maquetación tiene siglos antes de Figma." }
  - { grado: 9,  periodo: 3, oficio: "La libreta de la abuela",            resumen: "Conteo de cosecha: racimos por mata, gallinas por corral, deudas pendientes. La estadística doméstica como ética de cuidado." }
  - { grado: 10, periodo: 1, oficio: "El personaje silencioso del barrio", resumen: "Intermediario que conectaba familias y oficios. Curaduría comunitaria de la información, sin algoritmo ni servidor." }
  - { grado: 10, periodo: 2, oficio: "Los 4 oficios de la palabra",        resumen: "En el barrio Obrero: cuentista, pregonero, recitador, sermoneador. Cada uno con un tipo de palabra; cada uno con criterio editorial." }
  - { grado: 10, periodo: 3, oficio: "Tiendas y panaderías del centro",    resumen: "Microempresas del Quindío y Cartago que sostienen libros de cuentas, fiar y cobrar, oferta de temporada. Gestión del negocio antes del Excel." }
  - { grado: 11, periodo: 1, oficio: "Oficio y palabra",                   resumen: "Una persona se conocía por dos cosas: su oficio (lo que sabía hacer) y su palabra (lo que sostenía). Identidad y reputación digital tienen aquí su anclaje." }
  - { grado: 11, periodo: 2, oficio: "El maestro carpintero",              resumen: "No necesita reloj para saber dónde se traba el taller: lo ve. Lectura del proceso, detección de cuellos de botella y mejora continua." }
  - { grado: 11, periodo: 3, oficio: "Oficios que escuchan al pueblo",     resumen: "Los oficios del Valle no nacían de la imaginación del emprendedor genial: nacían de escuchar lo que el pueblo necesitaba. Validación de mercado ancestral." }

# ─── Sección 7 · MARCO CONCEPTUAL ────────────────────────────────────────────
marco_conceptual_intro: |
  El marco conceptual se sustenta en los cuatro componentes de la Guía No. 30
  del MEN, articulados con las cuatro fases del modelo MILC institucional y
  el triángulo filosófico de pensamiento.

componentes_men:
  - nombre: "Naturaleza y evolución de la tecnología"
    descripcion: "Se refiere a las características y objetivos de la tecnología, a sus conceptos fundamentales (sistema, componente, estructura, función, recurso, optimización, evolución), a sus relaciones con la ciencia y la sociedad, y al modo como su desarrollo histórico ha transformado la cultura humana."
  - nombre: "Apropiación y uso de la tecnología"
    descripcion: "Se trata de la utilización adecuada, pertinente y crítica de la tecnología (artefactos, productos, procesos y sistemas) con el fin de optimizar, aumentar la productividad, facilitar el trabajo, generar nuevas formas de comunicación y construir realidades sociales."
  - nombre: "Solución de problemas con tecnología"
    descripcion: "Se refiere al manejo de estrategias en y para la identificación, formulación y solución de problemas con tecnología, así como para la jerarquización y comunicación de ideas. Comprende estrategias que van desde la detección de fallas y necesidades hasta el diseño y ejecución de soluciones."
  - nombre: "Tecnología y sociedad"
    descripcion: "Trata tres aspectos: 1) Las actitudes de los estudiantes hacia la tecnología, en términos de sensibilización social y ambiental, curiosidad, cooperación, trabajo en equipo, apertura intelectual. 2) La valoración social que el estudiante hace de la tecnología. 3) La participación social que involucra la tecnología."

fases_milc:
  - nombre: "Escuta"
    descripcion: "Escuchar, observar y problematizar la realidad tecnológica del estudiante y su comunidad. Cada periodo abre con un saber ancestral que ancla el tema técnico en un oficio propio."
  - nombre: "Sistematización"
    descripcion: "Ordenar información, reconocer patrones, construir criterios, documentar procesos y formular explicaciones."
  - nombre: "Praxis"
    descripcion: "Diseñar, experimentar, programar, prototipar, comunicar o intervenir una situación concreta. Cada periodo cierra con un producto entregable verificable."
  - nombre: "Evaluación liberadora"
    descripcion: "Valorar evidencias, impactos, aprendizajes, errores, mejoras y compromisos éticos. Se incrustan reflexiones del triángulo filosófico dentro de los productos."

# ─── Sección 8 · DISEÑO CURRICULAR (mallas G6-G11) ───────────────────────────
# Para cada grado: 3 periodos. Cada periodo: encabezado institucional + tabla
# con 4 filas (componentes MEN) × 6 columnas (Estándar/Competencia/Aprendizaje
# /Cognitivo/Procedimental/Actitudinal).
# Los aprendizajes se referencian a las 10 sesiones reales del periodo (YAMLs).
# Las competencias y descriptores se redactan por periodo según el tema.

mallas:
  - grado: 6
    nivel: "BÁSICA SECUNDARIA"
    grado_nombre: "SEXTO"
    periodos:
      - num: 1
        titulo: "Comunicación e identidad digital"
        dba: "Comprende los principios de identidad y comunicación digital, reconociendo derechos, responsabilidades y riesgos en la habitabilidad de la red."
        anclaje: "El pregonero del barrio (don Aurelio · Cartago)"
        proyecto: "Pregoneros digitales del barrio"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Reconocer la tecnología como práctica cultural que evoluciona con la sociedad, desde el pregonero del barrio hasta las redes sociales."
            aprendizaje: "Identifica los medios de comunicación a través de la historia y su transformación tecnológica (S5)."
            cognitivo: "Reconoce diferencias entre identidad y huella digital, y describe la evolución de los medios desde el pregonero hasta WhatsApp."
            procedimental: "Construye una línea de tiempo de los medios de comunicación y elabora una entrevista a un adulto mayor sobre la evolución de la comunicación."
            actitudinal: "Valora los saberes ancestrales de transmisión oral y los pone en diálogo con sus prácticas digitales actuales."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Configurar y usar correo institucional y entornos digitales aplicando los 10 acuerdos de netiqueta."
            aprendizaje: "Crea su correo institucional, redacta correos formales con las 5 partes y aplica netiqueta (S3–S4)."
            cognitivo: "Identifica las 5 partes de un correo formal y los 10 acuerdos de netiqueta para chats y redes."
            procedimental: "Configura su correo institucional con firma profesional y redacta correos formales a docentes y directivos."
            actitudinal: "Demuestra respeto en sus comunicaciones digitales y reconoce el valor de la palabra escrita."
          - componente: "Solución de problemas con tecnología"
            competencia: "Reconocer riesgos digitales (grooming, phishing, ciberacoso) y aplicar las 3 acciones de oro para responder con criterio."
            aprendizaje: "Identifica las 5 señales de alerta digital y los 3 adultos de confianza (S8); aplica los 3 filtros antes de publicar (S9)."
            cognitivo: "Identifica señales de grooming, phishing y ciberacoso, y conoce la Ley 1581 de protección de datos personales (S7)."
            procedimental: "Aplica los 3 filtros antes de publicar (¿es verdad? · ¿es necesario? · ¿es amable?) y elabora carteles de prevención."
            actitudinal: "Asume el rol de upstander frente al ciberacoso y cuida la privacidad propia y ajena."
          - componente: "Tecnología y sociedad"
            competencia: "Construir su identidad digital con criterio ético y participar como ciudadano responsable de la infoesfera."
            aprendizaje: "Elabora su tarjeta de identidad digital (S2), reflexiona sobre su huella (S6) y presenta su pitch de 2 minutos (S10)."
            cognitivo: "Reconoce las dimensiones de su identidad digital (activa, pasiva y secundaria) y los principios del triángulo Dussel-Estoico-Floridi aplicado a su voz digital."
            procedimental: "Diseña y presenta su pitch personal digital de 2 minutos siguiendo la estructura de 4 momentos."
            actitudinal: "Sostiene su voz con dignidad (Dussel), cuida lo que escribe sabiendo que queda (Estoico) y aporta claridad a la infoesfera (Floridi)."
      - num: 2
        titulo: "Hardware, software y la máquina por dentro"
        dba: "Identifica componentes principales de un sistema informático y explica sus funciones; aplica criterios de mantenimiento, ergonomía y selección razonada de equipos."
        anclaje: "Relojero, costurera y panadero de Cartago"
        proyecto: "Maestros del oficio digital: abrir la máquina"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender las 4 funciones básicas de toda máquina inteligente y reconocer la evolución del hardware."
            aprendizaje: "Identifica las 4 funciones (entrada/procesamiento/salida/almacenamiento) y las piezas del gabinete (S2–S3)."
            cognitivo: "Reconoce CPU, RAM, disco, fuente y tarjeta madre, comprendiendo el papel de cada pieza en el funcionamiento del sistema."
            procedimental: "Elabora un mapa anatómico del computador con 8 piezas identificadas y descripción propia."
            actitudinal: "Valora la habilidad del relojero/costurera/panadero como antecedente del técnico actual y reconoce su propio derecho a conocer la máquina por dentro."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Manejar periféricos, sistema operativo y archivos digitales con criterio de organización profesional."
            aprendizaje: "Distingue periféricos de entrada, salida y mixtos (S4), comprende qué es el sistema operativo (S6) y organiza archivos en carpetas (S7)."
            cognitivo: "Diferencia hardware de software y conoce los principales sistemas operativos (Windows, macOS, Linux, Android)."
            procedimental: "Organiza sus archivos en una estructura profesional (año/materia/periodo) y nombra archivos con criterio (fecha-tema-apellido)."
            actitudinal: "Aplica buenas prácticas en la sala de sistemas y respeta los equipos compartidos."
          - componente: "Solución de problemas con tecnología"
            competencia: "Diagnosticar problemas básicos de un equipo informático y aplicar mantenimiento preventivo con criterio."
            aprendizaje: "Aplica las 5 reglas de cuidado de la sala (S1, S8, S9) y reconoce señales de fallo (sobrecalentamiento, lentitud, mal apagado)."
            cognitivo: "Identifica las 3 acciones de mantenimiento básico: limpiar, actualizar, respaldar; y reconoce las señales de problemas comunes."
            procedimental: "Realiza limpieza física suave del equipo, actualiza el sistema operativo y crea respaldos de archivos importantes."
            actitudinal: "Cuida su cuerpo aplicando la regla 20-20-20 y la postura ergonómica frente al computador."
          - componente: "Tecnología y sociedad"
            competencia: "Elegir un equipo informático con criterio razonado, evitando el extremismo del precio (ni el más barato ni el más costoso)."
            aprendizaje: "Construye una ficha técnica del computador ideal para estudio con presupuesto razonado (S10)."
            cognitivo: "Reconoce las especificaciones mínimas razonables para uso escolar (CPU i3/Ryzen3, RAM 8 GB, SSD 256 GB)."
            procedimental: "Elabora una ficha técnica con marca, modelo, especificaciones y precio realista en pesos colombianos."
            actitudinal: "Aplica criterio frente a la publicidad y a las ofertas extremas; reconoce que lo barato sale caro."
      - num: 3
        titulo: "Escribir y buscar con criterio"
        dba: "Produce un documento informativo digital aplicando criterios de formato, búsqueda y evaluación de fuentes; identifica fake news y cita responsablemente."
        anclaje: "Doña Mercedes, maestra rural (La Plata, Cartago)"
        proyecto: "Reporteros con criterio del barrio"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender qué es internet, cómo viajan los datos y la diferencia entre internet y la World Wide Web."
            aprendizaje: "Reconoce la arquitectura cliente-servidor y los componentes de internet (S7)."
            cognitivo: "Describe internet como red de redes de servidores conectados por cables submarinos, satélites y antenas."
            procedimental: "Explica con ejemplos cómo viaja una petición desde su navegador hasta un servidor y de regreso."
            actitudinal: "Aprecia internet como bien común global que requiere cuidado y mantenimiento colectivo."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Producir documentos digitales con formato profesional usando un procesador de texto (Word/Google Docs/LibreOffice)."
            aprendizaje: "Aplica formato básico, listas, tablas, imágenes y encabezados profesionales en un documento (S2–S6)."
            cognitivo: "Identifica los elementos de un documento profesional: fuente, tamaño, márgenes, alineación, listas, tablas, encabezado, pie y números de página."
            procedimental: "Produce un documento informativo de 4 páginas con todos los elementos de formato profesional aplicados."
            actitudinal: "Cuida la presentación de su trabajo y valora la legibilidad como respeto al lector."
          - componente: "Solución de problemas con tecnología"
            competencia: "Buscar información con operadores avanzados y evaluar fuentes con criterio CRAAP para detectar fake news."
            aprendizaje: "Aplica operadores de búsqueda (site:, comillas, guion menos) y evalúa fuentes con las 5 letras CRAAP (S8–S9)."
            cognitivo: "Reconoce los 5 criterios CRAAP (Currency, Relevance, Authority, Accuracy, Purpose) y las 5 señales típicas de fake news."
            procedimental: "Investiga un tema usando al menos 3 fuentes externas evaluadas con CRAAP y elabora una guía visual anti-fake news para el salón."
            actitudinal: "Antes de creer o reenviar, se detiene, respira y verifica (Marco Aurelio); no comparte rumores ni cadenas."
          - componente: "Tecnología y sociedad"
            competencia: "Producir y publicar información con responsabilidad ciudadana, citando fuentes y respetando autoría."
            aprendizaje: "Cita fuentes correctamente, evita el plagio y reconoce la responsabilidad de quien publica (S10)."
            cognitivo: "Identifica la importancia de citar fuentes, la honestidad académica y el rol del estudiante como productor responsable en la infoesfera."
            procedimental: "Entrega un informe ciudadano del barrio con mínimo 2 fuentes citadas y declaración de uso de IA si la utilizó."
            actitudinal: "Asume su rol como ciudadano digital productor (no solo consumidor) y aporta claridad a su comunidad."

  - grado: 7
    nivel: "BÁSICA SECUNDARIA"
    grado_nombre: "SÉPTIMO"
    periodos:
      - num: 1
        titulo: "Trabajo colaborativo en la nube (Microsoft 365)"
        dba: "Produce un proyecto colaborativo en Microsoft 365 aplicando coautoría, permisos, comentarios e historial de versiones, con declaración del proceso."
        anclaje: "La minga del Valle del Cauca"
        proyecto: "Minga digital: una obra colaborativa en la nube"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender el paso de Office tradicional a Microsoft 365 y el concepto de computación en la nube."
            aprendizaje: "Identifica qué es la nube, diferencia Office tradicional de M365 y conoce OneDrive como nube personal (S2–S3)."
            cognitivo: "Describe la arquitectura cliente-nube y el rol del navegador como portal universal de acceso."
            procedimental: "Accede a office.com con su cuenta institucional y explora OneDrive, Word, Excel y PowerPoint en línea."
            actitudinal: "Reconoce la minga del Valle como ancestro cultural de la coautoría digital y valora la reciprocidad."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Trabajar en equipo en archivos compartidos con coautoría asincrónica y comentarios constructivos."
            aprendizaje: "Comparte archivos con permisos (lectura/comentarios/edición), edita en coautoría asincrónica y usa comentarios (S5–S7)."
            cognitivo: "Distingue los 3 niveles de permisos (lectura, comentarios, edición) y comprende cuándo usar cada uno."
            procedimental: "Coedita un Word de 4 páginas con 2 compañeros, usa comentarios para sugerencias y resuelve revisiones."
            actitudinal: "Respeta la autoría del compañero, hace comentarios constructivos y participa con reciprocidad como en la minga."
          - componente: "Solución de problemas con tecnología"
            competencia: "Recuperar versiones anteriores de un archivo y gestionar conflictos de edición con criterio."
            aprendizaje: "Aplica el historial de versiones cuando algo se daña en el archivo compartido (S8) y resuelve conflictos con calma."
            cognitivo: "Identifica que Microsoft 365 guarda automáticamente versiones y permite recuperar contenido perdido."
            procedimental: "Practica restaurar versiones anteriores cuando algo se daña, sin escándalos ni pánico."
            actitudinal: "Asume la solución técnica + humana frente a errores del equipo: recupera la versión y avisa con calma."
          - componente: "Tecnología y sociedad"
            competencia: "Gestionar reuniones virtuales y comunicación profesional con Outlook y Teams."
            aprendizaje: "Maneja Outlook (correo + calendario) y Teams (videoconferencia + chat + compartir pantalla) en el contexto escolar (S9)."
            cognitivo: "Reconoce los protocolos de invitación, aceptación y cortesía en reuniones virtuales."
            procedimental: "Acepta invitaciones por Outlook, se une a reuniones por Teams y participa con criterio profesional."
            actitudinal: "Aprecia la nube como bien común del equipo: cuida lo que pone allí porque es ambiente compartido (Floridi)."
      - num: 2
        titulo: "Algoritmia y pensamiento computacional (Scratch)"
        dba: "Aplica las técnicas del pensamiento computacional (descomposición, patrones, abstracción, algoritmo) para producir un programa en Scratch con variables, condicionales y bucles."
        anclaje: "Doña Sofía, la tejedora del Valle"
        proyecto: "Tejedoras digitales: mi primer programa con criterio"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Reconocer las raíces ancestrales del pensamiento computacional en oficios tradicionales (tejido, cocina, agricultura)."
            aprendizaje: "Identifica las 4 técnicas del pensamiento computacional y reconoce que las tejedoras ya programaban (S1–S3)."
            cognitivo: "Define algoritmo, secuencia, repetición, condicional y variable, y los reconoce en oficios cotidianos."
            procedimental: "Descompone un problema cotidiano (cepillarse, cocinar, tejer) en pasos algorítmicos."
            actitudinal: "Honra a las tejedoras del Valle como primeras programadoras y reconoce la dignidad de los saberes ancestrales."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Programar en Scratch usando variables, condicionales y bucles con propósito claro."
            aprendizaje: "Construye programas en Scratch con personajes que responden al usuario (S8–S9)."
            cognitivo: "Conoce los bloques principales de Scratch: eventos, control, sensores, variables, operadores."
            procedimental: "Programa un juego o narrativa interactiva con al menos 2 personajes, 2 escenas, 2 variables, 2 condicionales y 2 bucles."
            actitudinal: "Programa con paciencia y claridad: variables con nombre, bucles con propósito, condiciones sin duplicar."
          - componente: "Solución de problemas con tecnología"
            competencia: "Aplicar diagramas de flujo y depuración para resolver problemas algorítmicos."
            aprendizaje: "Elabora diagramas de flujo con figuras correctas (S4) y depura programas paso a paso (S8–S9)."
            cognitivo: "Reconoce las figuras del diagrama de flujo (óvalo/rectángulo/rombo/flecha) y su significado."
            procedimental: "Diseña un diagrama de flujo en cuaderno antes de programar; prueba el programa con usuarios externos."
            actitudinal: "Acepta los errores como parte del proceso y depura con paciencia."
          - componente: "Tecnología y sociedad"
            competencia: "Producir un programa con instructivo de uso para que otros lo entiendan y usen."
            aprendizaje: "Documenta su programa con instructivo de uso de 1 página (S10)."
            cognitivo: "Comprende que un programa debe ser entendible por otros, no solo por su autor."
            procedimental: "Redacta un instructivo de uso con 7 partes y lo prueba con un compañero externo al equipo."
            actitudinal: "Reconoce que el código que escribe hoy se ejecuta automáticamente después; es responsable de lo que su programa hace al usuario (Floridi)."
      - num: 3
        titulo: "Inteligencia artificial con criterio"
        dba: "Usa modelos de lenguaje (LLMs) con criterio para asistir un trabajo, declarando honestamente el uso, verificando la información y manteniendo voz propia."
        anclaje: "El consejero del barrio (don Lucho, doña Mercedes, doña Esperanza)"
        proyecto: "Consejeros digitales: IA con criterio para mi salón"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender qué es la inteligencia artificial, sus tipos y cómo aprende."
            aprendizaje: "Identifica IA en su vida diaria (S2), distingue IA estrecha de general (S3) y comprende el proceso de entrenamiento (S4)."
            cognitivo: "Define IA, LLM, dataset y entrenamiento; distingue aprendizaje supervisado y no supervisado."
            procedimental: "Identifica al menos 5 ejemplos de IA en su vida diaria (TikTok, Siri, filtros, etc.)."
            actitudinal: "Reconoce que el consejero del barrio aconsejaba pero no decidía por nadie; la IA hoy ocupa ese rol con sus límites."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Formular prompts efectivos a modelos de lenguaje (ChatGPT, Claude, Gemini) con criterio profesional."
            aprendizaje: "Aplica los 4 elementos del prompt (rol, contexto, tarea, formato) y itera la respuesta (S6–S7)."
            cognitivo: "Conoce los componentes de un prompt efectivo y las técnicas de iteración (refinar restricciones, voz, longitud)."
            procedimental: "Construye una guía de 6 prompts útiles para grado 7° probados en una IA real."
            actitudinal: "Pide bien hoy para no editar mañana (Marco Aurelio); el tiempo invertido en formular se recupera al multiplicar."
          - componente: "Solución de problemas con tecnología"
            competencia: "Verificar la información que produce una IA y detectar alucinaciones."
            aprendizaje: "Reconoce alucinaciones, sesgos y deshonestidad académica relacionados con IA (S8); verifica datos contra fuentes externas."
            cognitivo: "Identifica las alucinaciones como respuestas estadísticamente probables pero no verdaderas, y reconoce el sesgo de datos."
            procedimental: "Verifica al menos 2 datos generados por IA contra fuentes oficiales antes de incluirlos en un trabajo."
            actitudinal: "Mantiene escepticismo saludable: la IA habla rápido y seguro, pero requiere verificación humana."
          - componente: "Tecnología y sociedad"
            competencia: "Declarar honestamente el uso de IA en cualquier trabajo académico y aplicar la política institucional."
            aprendizaje: "Aplica la declaración honesta de uso de IA (S9) y redacta el decálogo ético del salón (S10)."
            cognitivo: "Conoce la política institucional de IA por grados y los 5 principios transversales no negociables."
            procedimental: "Incluye sección 'Cómo trabajamos con IA' en sus entregables, especificando modelo, partes, edición y verificación."
            actitudinal: "Habita la infoesfera como productor responsable: la IA amplifica su voz, no la silencia (Dussel + Floridi)."

  - grado: 8
    nivel: "BÁSICA SECUNDARIA"
    grado_nombre: "OCTAVO"
    periodos:
      - num: 1
        titulo: "Lógica computacional avanzada"
        dba: "Aplica lógica condicional compuesta (AND/OR/NOT) y estructuras de control complejas para resolver problemas de la vida cotidiana."
        anclaje: "El gesto de la cocina del Valle"
        proyecto: "Decisiones lógicas: del fogón al algoritmo"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender la lógica booleana como base del razonamiento computacional moderno."
            aprendizaje: "Identifica operadores lógicos AND, OR, NOT y su origen en el álgebra de Boole."
            cognitivo: "Define los 3 operadores lógicos principales y construye tablas de verdad."
            procedimental: "Resuelve ejercicios de lógica booleana con tablas de verdad."
            actitudinal: "Honra el gesto ancestral de cuidado y verificación cruzada de la abuela cocinera."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Programar condicionales compuestas y estructuras anidadas en Scratch o entornos similares."
            aprendizaje: "Construye programas con condicionales múltiples y anidadas para resolver problemas reales."
            cognitivo: "Conoce las estructuras: si-entonces-sino, anidamiento, casos múltiples."
            procedimental: "Programa una simulación de decisiones cotidianas (vestirse según clima, planear menú según ingredientes)."
            actitudinal: "Acepta la complejidad lógica de la vida cotidiana sin simplificarla."
          - componente: "Solución de problemas con tecnología"
            competencia: "Aplicar lógica condicional compuesta para resolver problemas de la vida real."
            aprendizaje: "Diseña algoritmos con condiciones AND/OR para evitar errores típicos."
            cognitivo: "Identifica casos donde AND vs OR cambia el resultado del algoritmo."
            procedimental: "Crea un algoritmo verificador de decisiones cotidianas con condicionales compuestas."
            actitudinal: "Verifica cruzando condiciones antes de actuar, como la abuela frente al fogón."
          - componente: "Tecnología y sociedad"
            competencia: "Aplicar lógica compuesta para evitar errores socialmente costosos en sistemas automatizados."
            aprendizaje: "Reflexiona sobre cómo algoritmos mal diseñados pueden excluir o perjudicar a grupos."
            cognitivo: "Reconoce ejemplos de sistemas automatizados con consecuencias sociales (filtros bancarios, sistemas de admisión)."
            procedimental: "Analiza un caso real de decisión algorítmica que tuvo impacto social y propone mejoras."
            actitudinal: "Asume responsabilidad por los efectos de los algoritmos que diseña en otros (Dussel)."
      - num: 2
        titulo: "Datos como tablas: pensar con estructura"
        dba: "Organiza y analiza datos en tablas estructuradas, comprendiendo filas, columnas, tipos de datos y operaciones básicas."
        anclaje: "Decisiones del campesino en la finca"
        proyecto: "Datos del barrio: ver lo que no se ve a simple vista"
        competencias:
          - componente: "Naturaleza y evolución de la tecnología"
            competencia: "Comprender el dato como representación digital del mundo."
            aprendizaje: "Identifica tipos de datos: numérico, texto, fecha, booleano."
            cognitivo: "Diferencia los tipos de datos y sus operaciones permitidas."
            procedimental: "Clasifica datos en categorías y los organiza en tablas."
            actitudinal: "Reconoce que el campesino del Valle ya hacía análisis de datos sin Excel."
          - componente: "Apropiación y uso de la tecnología"
            competencia: "Manejar hojas de cálculo (Excel/Google Sheets) con criterio profesional."
            aprendizaje: "Construye tablas con encabezados, fórmulas básicas (SUMA, PROMEDIO) y gráficos simples."
            cognitivo: "Conoce las funciones básicas de una hoja de cálculo."
            procedimental: "Construye una tabla de 20+ filas con datos reales y aplica fórmulas y gráficos."
            actitudinal: "Cuida la calidad del dato: completo, verificado, fechado."
          - componente: "Solución de problemas con tecnología"
            competencia: "Resolver problemas analizando datos estructurados con criterio estadístico básico."
            aprendizaje: "Calcula promedios, mínimos, máximos y elabora conclusiones a partir de datos."
            cognitivo: "Identifica las estadísticas básicas y su interpretación."
            procedimental: "Analiza un conjunto de datos del barrio (precios, edades, calificaciones) y obtiene conclusiones."
            actitudinal: "Verifica los datos antes de concluir; evita generalizar desde muestras pequeñas."
          - componente: "Tecnología y sociedad"
            competencia: "Reconocer el rol ético del dato en decisiones sociales y políticas."
            aprendizaje: "Reflexiona sobre cómo datos mal usados pueden discriminar o manipular."
            cognitivo: "Reconoce sesgos comunes: muestra pequeña, no representativa, sesgo de confirmación."
            procedimental: "Analiza un caso de manipulación estadística (encuesta sesgada, gráfico engañoso) y propone correcciones."
            actitudinal: "Asume responsabilidad por los datos que produce y publica."
      - num: 3
        titulo: "Diseño visual y comunicación digital"

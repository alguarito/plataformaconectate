            aprendizaje: "Sustenta ante jurado real (docentes + emprendedores) con declaración ética de uso de IA (S10)."
            cognitivo: "Reconoce su rol como emprendedor responsable en la economía y la infoesfera."
            procedimental: "Sustenta públicamente y registra compromiso de mejora a 6 meses."
            actitudinal: "Honra al pueblo como destinatario y validador del oficio emprendedor."

# ─── Sección 9 · METODOLOGÍA ─────────────────────────────────────────────────
metodologia_intro: |
  La metodología del área se organiza en torno al modelo MILC v3 (4 fases) y
  6 estrategias activas, articuladas con el triángulo filosófico y la
  política de IA progresiva. Cada sesión sigue una secuencia didáctica de 10
  bloques estandarizados, garantizando coherencia entre los 6 grados.

estrategias_activas:
  - nombre: "Design Thinking"
    descripcion: "Empatizar, definir, idear, prototipar y validar soluciones con usuarios reales."
  - nombre: "Aprendizaje Basado en Proyectos (ABP)"
    descripcion: "Reto, producto, roles, cronograma, evidencias y sustentación pública."
  - nombre: "PRIMM (programación)"
    descripcion: "Predecir, ejecutar, investigar, modificar y crear."
  - nombre: "Aprendizaje basado en datos"
    descripcion: "Formular preguntas, registrar, organizar, visualizar e interpretar honestamente."
  - nombre: "Laboratorio técnico"
    descripcion: "Diagnóstico, prueba, cuidado, bitácora y protocolo."
  - nombre: "Producción editorial digital"
    descripcion: "Documentos, presentaciones, infografías, mapas, campañas, prototipos, portafolios."

# Política de IA responsable (institucional)
politica_ia:
  - rango: "Grado 6°"
    postura: "Sin IA"
    detalle: "Los entregables se producen a mano por el equipo, con criterio propio. La IA aún no se cubre como herramienta de uso. Si algún estudiante la usó por curiosidad personal, debe declararlo en la sustentación."
  - rango: "Grado 7°"
    postura: "IA con declaración"
    detalle: "Se permite el uso de IA generativa con declaración explícita: qué herramienta (Claude/ChatGPT/Gemini), en qué parte, cuánto editó el equipo a mano. La IA es asistente, no reemplazo del trabajo humano."
  - rango: "Grados 8° a 11°"
    postura: "IA esperada · declaración obligatoria"
    detalle: "La rúbrica del entregable 1 penaliza explícitamente la falta de declaración o el copy-paste sin edición. Se evalúa el uso responsable: voz humana visible + edición + declaración + verificación de lo que dijo la IA contra fuentes externas."

principios_ia:
  - "Declarar siempre el uso, así sea pequeño."
  - "Verificar contra fuente externa los datos importantes (fechas, leyes, nombres)."
  - "Editar con voz propia: la IA puede borrador, pero el entregable es del estudiante."
  - "Respetar la privacidad: no escribir datos personales de otros en prompts."
  - "No usar IA en evaluaciones que valoran algo personal (autobiografía, reflexión propia, ética)."

# ─── Sección 10 · RECURSOS Y AMBIENTES DE APRENDIZAJE ────────────────────────
recursos_intro: |
  El área cuenta con la plataforma propia Conéctate
  (alguarito.github.io/plataformaconectate), accesible offline-first y
  hospedando 216 piezas curriculares activas:
recursos:
  - tipo: "Guías didácticas MILC v3"
    cantidad: 180
    detalle: "30 guías por grado, distribuidas en 3 periodos × 10 sesiones; cada guía cierra con triángulo filosófico, evaluación liberadora y compromiso firmado."
  - tipo: "Proyectos integradores entregable-céntricos"
    cantidad: 18
    detalle: "Un proyecto por grado-periodo, con 3-5 entregables y reflexión del triángulo incrustada en cada producto (no como anexo)."
  - tipo: "Exámenes finales con banco de práctica"
    cantidad: 18
    detalle: "Un examen formal de 5 preguntas (45 min) y un banco de práctica de 20-30 OM por grado-periodo, ambos derivados del mismo YAML SSOT."
ambientes:
  - "Sala de sistemas institucional (con 5 reglas firmadas por cada grado al inicio del periodo)."
  - "Plataforma Conéctate con Service Worker (offline-first tras la primera visita)."
  - "Cuaderno físico personal del estudiante (encabezado fijo de cada guía)."
  - "Cuentas institucionales Microsoft 365 (Outlook, OneDrive, Teams, Word/Excel/PowerPoint online)."
  - "Acceso supervisado a IA generativa (Claude, ChatGPT, Gemini) desde G7° en adelante."

# ─── Sección 11 · PLATAFORMA CONÉCTATE ──────────────────────────────────────
# Diferenciador institucional del área: plataforma propia que articula
# arquitectura técnica, accesibilidad, pipeline editorial y experiencia de
# aula desde un único repositorio versionado.
plataforma_conectate:
  intro: |
    La \textbf{Plataforma Conéctate} (alguarito.github.io/plataformaconectate)
    es el ecosistema digital propio del área de Tecnología e Informática.
    Desarrollada y mantenida por el docente titular, opera como repositorio
    único y reproducible de las 216 piezas curriculares activas, articulando
    arquitectura técnica de software profesional con experiencia de aula
    accesible y offline-first.

  arquitectura_intro: |
    La plataforma se construyó como aplicación estática (\emph{static
    site generator}) con disciplina de ingeniería de software contemporánea.
    No requiere base de datos, autenticación ni mantenimiento de servidores.
    El hospedaje en GitHub Pages garantiza disponibilidad sin costo
    institucional ni dependencia de proveedores comerciales.

  arquitectura_items:
    - clave: "Framework"
      valor: "Astro 4.x (static site generator con islas de interactividad TypeScript). Mínimo JavaScript en el cliente."
    - clave: "Estilos"
      valor: "Tailwind CSS con sistema de diseño propio \\emph{Bento Moderna} (paleta de 7 colores acentuados sobre neutros, radios 16/24/32px, sombras suaves)."
    - clave: "Tipografía"
      valor: "Inter como única familia (web-safe, alta legibilidad en pantalla, soporta acentos del español sin fallback)."
    - clave: "Lenguaje"
      valor: "TypeScript en todo el código (tipado estricto, evita errores en tiempo de ejecución)."
    - clave: "Build"
      valor: "249 páginas estáticas pre-renderizadas en cada compilación. Sin SSR ni hidratación parcial salvo en componentes interactivos puntuales."
    - clave: "Hospedaje"
      valor: "GitHub Pages (CDN global gratis, sin límite de ancho de banda, HTTPS por defecto)."
    - clave: "CI/CD"
      valor: "GitHub Actions: cada push a main dispara build automático + deploy. Tiempo total desde commit a producción: ~3 minutos."
    - clave: "Repositorio"
      valor: "github.com/alguarito/plataformaconectate (público, versionado completo con git)."
    - clave: "URL pública"
      valor: "alguarito.github.io/plataformaconectate"

  offline_intro: |
    La plataforma funciona \textbf{offline} tras la primera visita gracias a
    un Service Worker propio (\emph{progressive web app}). Esto es decisivo
    en el contexto institucional: sala de sistemas con conectividad
    intermitente, hogares con datos limitados, jornadas extracurriculares
    sin Wi-Fi. Una vez cargada por primera vez en cualquier dispositivo, la
    plataforma se vuelve disponible sin conexión, incluyendo todas las
    guías, exámenes, proyectos y PDFs locales.

  offline_estrategias:
    - tipo: "Páginas HTML"
      estrategia: "stale-while-revalidate"
      detalle: "Respuesta instantánea desde caché; en segundo plano se descarga la versión más reciente para la próxima visita."
    - tipo: "Assets con hash (Astro)"
      estrategia: "cache-first"
      detalle: "La URL contiene el hash del contenido; nunca cambia; se cachea de manera permanente sin riesgo de desactualización."
    - tipo: "PDFs locales"
      estrategia: "cache-first"
      detalle: "Guías, exámenes y proyectos imprimibles se cachean tras primera descarga; quedan disponibles offline indefinidamente."
    - tipo: "Imágenes y diagramas"
      estrategia: "cache-first"
      detalle: "Recursos visuales del corpus quedan disponibles sin conexión tras primera carga."
    - tipo: "Fuente Inter (CDN)"
      estrategia: "cache-first"
      detalle: "Cacheada una sola vez por dispositivo; ahorra ancho de banda en visitas posteriores."

  offline_versionado: |
    El Service Worker tiene versionado explícito (variable \texttt{VERSION}
    en \texttt{public/sw.js}). Cada cambio sustantivo en el contenido bumpea
    la versión, lo que dispara invalidación controlada del caché. La versión
    actual es \texttt{v27}. Este mecanismo evita el clásico problema de
    estudiantes viendo contenido desactualizado por caché agresivo.

  pipeline_intro: |
    El corazón pedagógico-técnico de la plataforma es el \textbf{pipeline
    editorial MILC v3}: cada pieza curricular vive como archivo YAML
    versionado y un script de Python compila desde esa única fuente tanto el
    PDF imprimible (vía xelatex) como el TypeScript que renderiza la web.
    Esta arquitectura \emph{single source of truth} garantiza coherencia: lo
    que el estudiante lee online es exactamente lo que descarga en PDF.

  pipeline_piezas:
    - tipo: "Guías de aprendizaje (180)"
      yaml: "content/guias/{grado}/{clave}.yaml"
      pdf: "public/guias-mejoras/{sesion}-{grado}-TIC.pdf"
      ts: "src/data/guiasContenido/{grado}-{periodo}-{sesion}.ts"
      comando: "make guia-build"
    - tipo: "Exámenes finales (18)"
      yaml: "content/examenes/{grado}-{periodo}.yaml"
      pdf: "public/examenes-mejoras/examen-{periodo}-{grado}-TIC.pdf"
      ts: "src/data/examenesContenido/{grado}-{periodo}.ts"
      comando: "make examen-build && make examen-web"
    - tipo: "Proyectos integradores (18)"
      yaml: "content/proyectos/{grado}-{periodo}.yaml"
      pdf: "public/proyectos/proyecto-{periodo}-{grado}-TIC.pdf"
      ts: "src/data/proyectosContenido/{grado}-{periodo}.ts"
      comando: "make proyecto-build"
    - tipo: "Plan de área (este documento)"
      yaml: "content/plan-area/2026.yaml"
      pdf: "public/plan-de-area/plan-de-area-2026.pdf"
      ts: "src/data/planArea.ts (legacy compat)"
      comando: "make plan-area-build"

  pipeline_validacion: |
    Cada pieza tiene un \textbf{linter} (\texttt{make guia-lint},
    \texttt{make examen-lint}) que valida el contrato editorial MILC v3:
    presencia de saber ancestral, triángulo filosófico, evaluación
    liberadora, distribución de Bloom, número mínimo de actividades,
    referentes bibliográficos. Las piezas que no cumplen se rechazan antes
    de compilar. Esta automatización elimina errores humanos de edición y
    sostiene la coherencia editorial del corpus.

  diseno_intro: |
    La plataforma adopta un sistema visual propio llamado \textbf{Bento
    Moderna}, inspirado en la organización modular de las bandejas \emph{bento}
    japonesas: cada pieza de información vive en su propia card con jerarquía
    visual clara, paleta acotada y respiración generosa. Optimizado
    \textbf{mobile-first} para el dispositivo más común del estudiantado
    (Android gama media, pantallas 360-414px), escala armónicamente a
    escritorio.

  accesibilidad_intro: |
    La plataforma cumple los criterios \textbf{WCAG 2.1 AA} en sus aspectos
    fundamentales, asegurando que el estudiantado con diversidad funcional o
    en condiciones desfavorables (luz directa, dispositivos antiguos, lectores
    de pantalla) acceda al contenido sin barreras.

  accesibilidad_items:
    - clave: "Contraste"
      valor: "≥ 4.5:1 en texto sobre fondo (verificado con herramientas WCAG). Los colores acento (lime, yellow) se reservan para elementos decorativos, nunca para texto."
    - clave: "Targets táctiles"
      valor: "≥ 44×44 px en todo elemento interactivo (botones, enlaces, controles)."
    - clave: "Teclado"
      valor: "Navegación completa con tabulador y focus visible (\\emph{focus-visible}) en todo elemento interactivo."
    - clave: "Movimiento"
      valor: "Respeta \\texttt{prefers-reduced-motion}: animaciones se desactivan automáticamente para usuarios sensibles a movimiento."
    - clave: "Modo oscuro"
      valor: "Activable manualmente; respeta preferencia del sistema. Cada paleta tiene variante dark verificada con mismo contraste."
    - clave: "Imágenes"
      valor: "Texto alternativo (\\texttt{alt}) en toda imagen significativa; imágenes decorativas marcadas como tales."
    - clave: "Estructura semántica"
      valor: "Encabezados jerárquicos (h1→h2→h3), regiones ARIA, listas correctamente etiquetadas."
    - clave: "Idioma"
      valor: "Atributo \\texttt{lang=\"es\"} en todas las páginas; soporte completo de acentos sin fallback de fuente."

  componentes_intro: |
    La plataforma incorpora componentes interactivos propios para enriquecer
    la experiencia pedagógica sin sacrificar rendimiento ni accesibilidad.
    Todos son componentes Astro con islas de interactividad TypeScript
    (hidratación selectiva).

  componentes_lista:
    - nombre: "LabQuiz"
      descripcion: "Quiz inline con feedback inmediato. Renderiza el banco de práctica de los exámenes finales (20-30 preguntas OM por grado-periodo). Cada respuesta da retroalimentación específica."
    - nombre: "LabVisualizacion"
      descripcion: "Visualizaciones interactivas (gráficos, simulaciones, diagramas) para guías que requieren explorar conceptos dinámicamente."
    - nombre: "TestRunner"
      descripcion: "Pruebas autoevaluativas con score y barra de progreso. Útil para autoevaluación intermedia del periodo."
    - nombre: "BadgeDensidad"
      descripcion: "Indicador visual de cada guía: estrellas absolutas por completitud del contrato MILC v3 + color por densidad real medida en palabras del YAML."
    - nombre: "CompletarBoton"
      descripcion: "Marca la guía/proyecto/examen como completado. El sistema recuerda con \\texttt{localStorage} (sin servidor ni datos personales)."
    - nombre: "CompartirWhatsApp"
      descripcion: "Genera link específico a la pieza para compartir por WhatsApp (canal principal de comunicación con familias)."
    - nombre: "BuscadorOverlay"
      descripcion: "Búsqueda full-text del corpus en el cliente (sin backend). Indexa títulos y temas de las 216 piezas."

  metricas_intro: |
    La plataforma se audita periódicamente con \textbf{Google Lighthouse}
    (estándar de la industria). Las métricas actuales en build de producción:

  metricas_lista:
    - metrica: "Performance"
      valor: "≥ 95 / 100"
      detalle: "First Contentful Paint < 1.5s en 3G simulado; bundle JS mínimo (<50 KB en home)."
    - metrica: "Accessibility"
      valor: "≥ 90 / 100"
      detalle: "Cumplimiento de criterios WCAG AA verificables automáticamente."
    - metrica: "Best Practices"
      valor: "≥ 95 / 100"
      detalle: "HTTPS, sin librerías obsoletas, sin errores de consola."
    - metrica: "SEO"
      valor: "≥ 95 / 100"
      detalle: "Meta tags Open Graph, sitemap, robots.txt, estructura semántica."

  articulacion_intro: |
    La plataforma se diseñó pensando en escenarios de aula reales: sala con
    proyector, sala con computadores por estudiante, salón sin tecnología,
    estudiantes en casa, familias que quieren acompañar. Cada escenario está
    contemplado.

  articulacion_momentos:
    - cuando: "Antes de clase · Preparación docente"
      detalle: "El docente revisa la guía web en su navegador o tableta. Si va a clase sin proyector, imprime el PDF (mismo contenido). El plan de aula del docente queda en la pestaña abierta como guion."
    - cuando: "Antes de clase · Preparación estudiante"
      detalle: "Si el estudiante tiene acceso en casa, pre-lee la guía (offline-first: una vez cargada queda disponible sin datos). El badge de densidad le anticipa si la sesión es ligera o densa."
    - cuando: "Durante la clase · Sala de sistemas"
      detalle: "Cada estudiante en su computador accede a su ritmo. La plataforma funciona aunque la red institucional sea inestable (Service Worker cachea todo). Sin licencias, sin instalación, sin cuentas individuales."
    - cuando: "Durante la clase · Salón con proyector"
      detalle: "El docente proyecta la guía web a todo el grupo. La jerarquía visual (paleta Bento, tipografía Inter, colores acento) garantiza legibilidad desde la última fila."
    - cuando: "Durante la clase · Salón sin tecnología"
      detalle: "El docente lleva impresos los PDFs imprimibles. Los estudiantes trabajan en cuaderno físico. La plataforma se consulta después en casa para profundizar."
    - cuando: "Cuaderno físico del estudiante"
      detalle: "Cada guía instruye un encabezado fijo (\\emph{Guía: G° · P · S · Tema · Fecha}). Solo lo que aparece en bloques ✏️ ACTIVIDAD, 🌱 SABER ANCESTRAL y 💭 REFLEXIÓN va al cuaderno. La plataforma es para leer; el cuaderno es para producir."
    - cuando: "Después de clase · Refuerzo"
      detalle: "El estudiante practica con el banco de 20-30 preguntas OM del LabQuiz (disponible 24/7 offline). Repasa la guía las veces que necesite. El progreso queda guardado en localStorage."
    - cuando: "Familias y acudientes"
      detalle: "Mismo enlace que para el estudiante (sin login ni cuenta). Acceden desde cualquier dispositivo. Pueden acompañar al estudiante en las actividades del cuaderno y verificar el compromiso firmado de cada guía."
    - cuando: "Directivos y coordinación"
      detalle: "Este Plan de Área (PDF rector) se autogenera desde el contenido. Trazabilidad completa: cada pieza tiene historial de cambios en git. Indicadores institucionales reproducibles (216 piezas activas, distribución por nivel MILC, etc.)."

  brecha_digital: |
    El diseño de la plataforma asume las condiciones reales del estudiantado
    de la I.E. Sor María Juliana: dispositivos modestos, conectividad
    intermitente, sin licencias institucionales adicionales. La plataforma
    \textbf{no aumenta la brecha} sino que la reduce: cualquier estudiante
    con acceso a internet una vez puede después usar la plataforma sin
    datos; cualquier estudiante sin dispositivo personal puede trabajar con
    los PDFs impresos por el docente; cualquier familia puede acompañar sin
    crear cuenta ni instalar nada.

  open_source: |
    El código de la plataforma es \textbf{abierto y reproducible}: el
    repositorio \texttt{github.com/alguarito/plataformaconectate} está
    público, las dependencias son estándares de la industria (Astro,
    Tailwind, TypeScript --- ninguno con bloqueo comercial), y las 216
    piezas curriculares son contenido educativo institucional. Esto permite
    que la Secretaría de Educación, otras instituciones públicas o
    investigadores académicos puedan auditar, replicar o adaptar la
    plataforma sin restricciones.

# ─── Sección 12 · INTENSIDAD HORARIA ─────────────────────────────────────────
intensidad_horaria:
  semanas_por_periodo: 13
  sesiones_por_periodo: 10
  intensidad_semanal_horas: 3
  total_horas_periodo: 39
  total_horas_ano: 117
  detalle: |
    Cada grado de Básica Secundaria y Media recibe 3 horas semanales de
    Tecnología e Informática, distribuidas en aproximadamente 2 sesiones
    de 90 minutos o 3 sesiones de 60 minutos según la franja horaria
    institucional. El periodo escolar abarca 13 semanas (39 horas), con
    10 sesiones pedagógicas planificadas en el formato MILC y 3 sesiones
    de holgura para cosecha, sustentación y recuperación.

# ─── Sección 13 · EVALUACIÓN ─────────────────────────────────────────────────
evaluacion_intro: |
  La evaluación es formativa, criterial, integral y liberadora, en coherencia
  con el SIEE institucional. Se valoran cuatro dimensiones del desempeño y
  cuatro tipos de instrumentos.

criterios_evaluacion:
  - nombre: "Cognitivo"
    descripcion: "Comprende conceptos, sistemas, relaciones, riesgos, datos, algoritmos y criterios de decisión."
  - nombre: "Procedimental"
    descripcion: "Usa herramientas, documenta procesos, programa, analiza datos, prototipa y produce recursos digitales."
  - nombre: "Actitudinal y socioemocional"
    descripcion: "Cuida equipos, regula emociones, colabora, respeta acuerdos, reconoce al otro y decide responsablemente."
  - nombre: "Ético-cultural"
    descripcion: "Valida información, protege datos, reconoce contexto, evita plagio, considera impacto social y propone usos con sentido."

ponderacion:
  - { item: "Guías y portafolio del cuaderno",      pct: 30 }
  - { item: "Proyecto integrador del periodo",      pct: 30 }
  - { item: "Examen final del periodo",             pct: 20 }
  - { item: "Participación y reflexión MILC",       pct: 20 }

tipos_evaluacion:
  - "Diagnóstica: al iniciar cada periodo (S1 de apertura)."
  - "Formativa: continua, intercalada en cada sesión (VERIFICA, OBSERVA, ACTIVIDAD)."
  - "Sumativa: examen final (S10) y proyecto integrador del periodo."
  - "Autoevaluación: cada estudiante valora su proceso al cierre del periodo."
  - "Coevaluación: entre pares en proyectos colaborativos (rúbrica compartida)."

# Sistema de valoración de las guías en la plataforma web
valoracion_web:
  estrellas:
    - estrellas: 5
      nombre: "MILC v3 · pro"
      significado: "Contrato completo: saber ancestral + ruta + actividades + triángulo + 5 dimensiones."
    - estrellas: 4
      nombre: "MILC v3 · bloques"
      significado: "Bloques filosóficos completos (saber + triángulo + 5d) sin actividades estructuradas."
    - estrellas: 3
      nombre: "Legacy migrada"
      significado: "TS migrado pre-MILC v3."
    - estrellas: 2
      nombre: "PDF disponible"
      significado: "Solo PDF, sin contenido enriquecido en web."
  color:
    - { nivel: "Alta",  umbral: "≥ 2500 palabras",   color: "verde MILC", detalle: "Guía con actividades muy expandidas y ejemplos largos." }
    - { nivel: "Media", umbral: "1800 – 2499",        color: "mostaza",    detalle: "Guía estándar que cumple el contrato sin excesos." }
    - { nivel: "Baja",  umbral: "< 1800",             color: "ocre",       detalle: "Guía mínima que cumple lo justo (candidata a expansión)." }

# ─── Sección 14 · PLAN HME ───────────────────────────────────────────────────
plan_hme: |
  El Plan de Acción hacia la Meta de la Excelencia (HME) del área prioriza:

  \begin{enumerate}
    \item Sostener el 100\% de cobertura curricular MILC v3 en grados 6° a 11° (alcanzado en 2026).
    \item Reducir la brecha digital con la plataforma offline-first y materiales imprimibles institucionales.
    \item Integrar progresivamente la IA generativa con declaración honesta como política institucional.
    \item Articular los proyectos integradores con proyectos transversales del PEI.
    \item Documentar los proyectos sobresalientes en una feria anual de tecnología responsable.
  \end{enumerate}

# ─── Sección 15 · COMISIÓN DE EVALUACIÓN Y PROMOCIÓN ─────────────────────────
comision_evaluacion: |
  La comisión de evaluación y promoción del área se reúne al cierre de cada
  periodo para revisar:

  \begin{itemize}
    \item Estudiantes con desempeño bajo en cualquiera de los 4 criterios.
    \item Estudiantes con desempeño excepcional (candidatos a feria de tecnología).
    \item Casos especiales: NEE, situaciones familiares, retiros, ingresos tardíos.
    \item Ajustes al plan de aula del siguiente periodo según hallazgos.
  \end{itemize}

# ─── Sección 16 · ACTIVIDADES DE APOYO ───────────────────────────────────────
actividades_apoyo: |
  Para estudiantes con dificultades en su proceso:

  \begin{itemize}
    \item Acceso permanente a la plataforma Conéctate con contenido offline.
    \item Talleres de recuperación al cierre de cada periodo (3 sesiones de 60 min).
    \item Tutoría entre pares con estudiantes de excelencia.
    \item Material adaptado para estudiantes con NEE en colaboración con el departamento de orientación.
    \item Acompañamiento docente personalizado vía Outlook/Teams.
  \end{itemize}

# ─── Sección 17 · MODELO PARA NEE ────────────────────────────────────────────
nee: |
  El área aplica los principios del Diseño Universal del Aprendizaje (DUA):

  \begin{itemize}
    \item Múltiples representaciones: cada guía combina texto, imagen, video, ejemplos y diagramas.
    \item Múltiples vías de acción y expresión: el estudiante puede demostrar aprendizaje por escrito, oral, visual o práctico.
    \item Múltiples formas de motivación: anclaje ancestral, retos comunitarios, reconocimiento público en la feria.
    \item La plataforma cumple criterios WCAG 2.1 AA mínimos: contraste, fuentes legibles (Inter), navegación por teclado, prefers-reduced-motion respetado.
    \item Articulación con el PIAR (Plan Individual de Ajustes Razonables) cuando aplica.
  \end{itemize}

# ─── Sección 18 · ARTICULACIÓN CON PROYECTOS TRANSVERSALES ───────────────────
articulacion_transversal: |
  El área de Tecnología e Informática articula con los proyectos
  transversales institucionales:

  \begin{itemize}
    \item \textbf{Proyecto de Educación Sexual y Construcción de Ciudadanía}: las guías de identidad digital (G6°·P1), netiqueta (G6°·P1·S4) y riesgos digitales (G6°·P1·S8) abordan ciudadanía digital y prevención de violencias en redes.
    \item \textbf{Proyecto de Educación Ambiental (PRAE)}: las guías de hardware (G6°·P2) abordan el ciclo de vida y disposición responsable de equipos electrónicos.
    \item \textbf{Proyecto de Convivencia Escolar}: la coautoría en la nube (G7°·P1) y el decálogo ético de IA (G7°·P3) construyen acuerdos de aula y respeto digital.
    \item \textbf{Proyecto de Lectoescritura}: las guías de producción editorial (G9°·P2, G10°·P1) y los proyectos integradores producen revistas, libros y documentos publicables.
    \item \textbf{Proyecto de Emprendimiento}: G10°·P3 y G11°·P3 desarrollan microemprendimientos escolares con plan completo y sustentación pública.
  \end{itemize}


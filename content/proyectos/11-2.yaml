clave: "11-2"
grado: 11
periodo: 2
completo: true

titulo: "Proyecto integrador · Automatización de un proceso real con IA"
titulo_portada: |-
  Automatización
  de un proceso real

autor: "Dr. Álvaro Cárdenas Orozco"
dba: "Mapea, diseña y automatiza un proceso digital real con criterio ético, midiendo con KPIs honestos y aplicando IA donde aporta valor sin sustituir el contacto humano que importa."
estrategia: "Mapeo BPMN + Lean automation + IA como copiloto"
duracion_semanas: 5
modalidad: "equipo"

reto: |-
  Identifica un proceso \textbf{repetitivo y observable} en tu colegio, casa o microemprendimiento familiar, mapéalo con BPMN, automatiza al menos 2 de sus pasos con Zapier/Make/n8n y conecta una IA que ayude sin reemplazar al humano que importa. Mide con 3 KPIs honestos durante 2 semanas y entrega un reporte de mejora con Kaizen.

insumos:
  - "Acceso a draw.io o Lucidchart gratuito para mapeo BPMN"
  - "Cuenta gratis en Zapier o Make (n8n self-hosted opcional)"
  - "Google Forms + Google Sheets (cuenta Gmail)"
  - "Acceso a IA: Claude, Gemini o ChatGPT"
  - "Plantilla de bitácora de KPIs (la entrega el docente)"
  - "1 proceso real elegido por el equipo (NO inventado)"

anclaje: |-
  En el centro de Cartago hubo durante décadas una \textbf{panadería de barrio} que abría a las 4 de la madrugada. El maestro panadero tenía una rutina escrita a marcador grueso pegada a la pared: \emph{4:00 amasar, 5:00 leudar, 6:00 hornear primer lote, 7:00 sacar y enfriar, 7:30 empacar, 8:00 abrir mostrador.} Cada paso con su hora; cada hora con su acción. Cuando faltaba un ayudante, el siguiente leía la hoja y sabía qué hacer. Eso era \textbf{automatización antes del software}: convertir un proceso repetitivo en rutina documentada que cualquiera puede ejecutar. El panadero entendía algo que los emprendedores digitales redescubren: primero se mapea, después se automatiza.

aprendizajes:
  - sesion: 1
    titulo: "Mapeo de procesos: dónde se pierde el tiempo"
  - sesion: 2
    titulo: "Diagramas de flujo y BPMN básico"
  - sesion: 3
    titulo: "Formularios digitales: captura sin papel"
  - sesion: 4
    titulo: "Hojas de cálculo como base de datos"
  - sesion: 5
    titulo: "Automatización con triggers (Zapier, Make, n8n)"
  - sesion: 6
    titulo: "IA en mensajería: clasificar y responder con criterio"
  - sesion: 7
    titulo: "Chatbots sin código: flujos conversacionales"
  - sesion: 8
    titulo: "KPIs: las métricas que importan"
  - sesion: 9
    titulo: "Mejora continua Kaizen aplicada a procesos digitales"
  - sesion: 10
    titulo: "Caso real: automatizar un proceso del colegio o la casa"

entregables:
  - numero: 1
    titulo: "Mapa BPMN del proceso elegido"
    que_entregas: |-
      Diagrama BPMN en draw.io o Lucidchart del proceso real elegido, exportado como PNG o PDF. Debe mostrar: actores, pasos secuenciales, decisiones (rombos), entradas/salidas y dónde se pierde tiempo. Acompañado de 1 párrafo describiendo el proceso \emph{tal como existe hoy} (no como quisieras que fuera).
    como_se_hace:
      - "Observar el proceso real durante 2-3 días tomando notas en papel"
      - "Entrevistar al menos a 1 persona que ejecuta el proceso"
      - "Listar pasos, actores y momentos de fricción identificados"
      - "Diagramar en BPMN con la simbología correcta (rectángulos, rombos, óvalos)"
      - "Exportar y agregar el párrafo descriptivo"
    reflexion:
      lente: "dussel"
      titulo: "A quién afecta este proceso hoy"
      consigna: |-
        Agrega al pie del mapa BPMN una sección titulada \emph{``A quién afecta este proceso hoy''}. Reconoce explícitamente qué personas viven el proceso cada día (el operario, el cliente, el supervisor, los ausentes), quién paga las consecuencias cuando falla, y a quién \textbf{no estás escuchando} aún en tu mapeo. \textbf{Ese párrafo queda en el PDF del mapa}, no como anexo escolar. Sostenerlo te impide automatizar a espaldas de quien hace el trabajo real.
    criterios:
      - "Proceso real observado en campo (no hipotético ni copiado de internet)"
      - "BPMN con simbología correcta (rectángulos, rombos, óvalos, flechas)"
      - "Al menos 1 entrevista realizada y citada"
      - "Mínimo 3 puntos de fricción identificados explícitamente"
      - "Párrafo Dussel publicado al pie del mapa"

  - numero: 2
    titulo: "Automatización funcional con Zapier/Make/n8n + IA"
    que_entregas: |-
      Workflow de automatización funcionando con al menos 2 pasos automatizados que reemplazan trabajo manual del proceso mapeado. Debe incluir al menos un nodo de IA (clasificación de mensajes, respuesta inicial, etiquetado de formulario). Entregas: enlace al workflow + screenshot del flujo + 1 video de 60 segundos demostrando el funcionamiento.
    como_se_hace:
      - "Definir 2 pasos del proceso donde la automatización aporta valor real"
      - "Diseñar el flujo en Zapier/Make/n8n: trigger + acciones"
      - "Agregar un nodo de IA donde tenga sentido (no de adorno)"
      - "Probar con datos reales (mínimo 5 ejecuciones)"
      - "Grabar video corto mostrando el flujo de inicio a fin"
    reflexion:
      lente: "estoico"
      titulo: "Lo que decidimos NO automatizar"
      consigna: |-
        En la descripción del workflow (puede ser en el README del repo, en una nota dentro de Zapier, o en el reporte) escribe un párrafo titulado \emph{``Lo que decidimos NO automatizar''}. Declara explícitamente \textbf{qué pasos del proceso conservamos manuales a propósito} y por qué (porque exigen criterio humano, porque el contacto humano dignifica al cliente, porque el costo del error automatizado supera el beneficio). \textbf{Esa declaración queda visible al usuario del workflow}, no en privado. El estoico entiende que la automatización disciplinada exige saber dónde NO meterla.
    criterios:
      - "Workflow funcional con 2+ pasos automatizados (no maquetado)"
      - "1+ nodo de IA con propósito claro (no de adorno)"
      - "Mínimo 5 ejecuciones reales con datos verificables"
      - "Video de 60s demostrando inicio a fin"
      - "Párrafo estoico publicado en descripción del workflow"

  - numero: 3
    titulo: "Bitácora de 3 KPIs honestos durante 2 semanas + análisis Kaizen"
    que_entregas: |-
      Hoja de cálculo con 3 KPIs medidos cada día durante 14 días corridos (mínimo). Al final, reporte de 1-2 páginas con: gráfico de evolución, análisis de tendencia, 1 hipótesis Kaizen sobre dónde mejorar el proceso para el siguiente ciclo, y propuesta de cambio concreto.
    como_se_hace:
      - "Definir 3 KPIs que reflejen la salud del proceso (no vanity metrics)"
      - "Crear plantilla en Google Sheets con columnas de fecha y KPIs"
      - "Medir cada día durante 14 días (sin saltar)"
      - "Graficar evolución con líneas o barras (eje desde 0)"
      - "Escribir 1 hipótesis Kaizen + 1 propuesta de cambio para el siguiente ciclo"
    reflexion:
      lente: "floridi"
      titulo: "Qué información agrega mi automatización a la conversación común"
      consigna: |-
        En el reporte final, agrega una sección titulada \emph{``Qué información agrega mi automatización a la conversación común''}. Reflexiona sobre los datos que tu workflow está produciendo y dejando circulando: ¿enriquecen la cadena informacional del proceso (datos útiles para decisiones futuras) o solo generan ruido (logs sin propósito, métricas vanity)? \textbf{Esa reflexión es parte del reporte que entregas}. La ética de Floridi pregunta por la calidad de la información que tu automatización deja en la infoesfera, no solo por su eficiencia local.
    criterios:
      - "3 KPIs definidos con justificación (por qué estos y no otros)"
      - "Mínimo 14 días de mediciones consecutivas sin huecos"
      - "Gráfico con eje desde 0 y etiquetas claras (visualización honesta)"
      - "1 hipótesis Kaizen + 1 propuesta de cambio concreta"
      - "Reflexión Floridi publicada en el reporte"

  - numero: 4
    titulo: "Sustentación pública + declaración honesta de IA y de límites del workflow"
    que_entregas: |-
      Sustentación oral de 5 minutos frente al grupo o ante el supervisor del proceso (si es del colegio o casa) + carta firmada de 1 página declarando: modelos de IA usados, qué decisiones tomó el equipo sin IA, integración explícita del triángulo (1 decisión concreta por cada lente) y limitaciones reconocidas del workflow tal como existe.
    como_se_hace:
      - "Preparar guion de 5 min siguiendo la estructura sugerida (ver abajo)"
      - "Ensayar con cronómetro al menos 2 veces"
      - "Escribir carta con porcentajes y modelos verificables"
      - "Identificar 1 decisión concreta tomada por cada lente del triángulo"
      - "Listar al menos 3 limitaciones del workflow actual"
    reflexion:
      lente: "dussel"
      titulo: "Triángulo aplicado al proceso automatizado"
      consigna: |-
        En la carta firmada dedica un párrafo a cada lente del triángulo. \textbf{Por Dussel}: a quién dejé fuera del proceso automatizado (por brecha digital, por idioma, por costo). \textbf{Por el estoico}: qué disciplina exige sostener este workflow para que no se descomponga en 6 meses. \textbf{Por Floridi}: qué responsabilidad ética asume el equipo por los datos que el workflow está produciendo y almacenando. Cada uno debe terminar con \textbf{una decisión concreta tomada} (no retórica).
    criterios:
      - "Sustentación de 5 minutos exactos cronometrados"
      - "Demo en vivo del workflow funcionando (no captura estática)"
      - "Carta firmada con porcentajes y modelos verificables (no inventados)"
      - "3 lentes del triángulo con decisión concreta por cada una"
      - "Al menos 3 limitaciones reconocidas honestamente"

rubrica:
  - entregable: 1
    nivel_5: "Proceso real bien observado, BPMN correcto, fricción identificada, Dussel visible"
    nivel_3: "BPMN aceptable pero observación superficial o fricción mal identificada"
    nivel_1: "Proceso hipotético, BPMN con errores o sin entrevista"
  - entregable: 2
    nivel_5: "Workflow funcional con IA con propósito, 5+ ejecuciones, estoico visible"
    nivel_3: "Workflow maquetado o IA de adorno, pocas ejecuciones reales"
    nivel_1: "Workflow no funciona o sin nodo de IA"
  - entregable: 3
    nivel_5: "14 días sin huecos, gráfico honesto, hipótesis Kaizen accionable, Floridi visible"
    nivel_3: "Datos con huecos o KPIs vanity, propuesta Kaizen genérica"
    nivel_1: "Datos insuficientes o gráfico engañoso (eje truncado)"
  - entregable: 4
    nivel_5: "5 min exactos, demo en vivo, 3 lentes con decisión concreta, límites honestos"
    nivel_3: "Sustentación con tiempo descontrolado o triángulo retórico"
    nivel_1: "No sustentó, demo falló sin reconocer o triángulo ausente"
  - entregable: "global"
    titulo: "Coherencia entre mapeo, automatización, métricas y triángulo"
    nivel_5: "El proceso real, el workflow, los KPIs y las decisiones del triángulo dialogan"
    nivel_3: "Coherencia parcial entre las partes"
    nivel_1: "Las partes no se conectan; parecen ejercicios separados"

sustentacion:
  duracion_min: 5
  guion_sugerido:
    - "1 min · Proceso elegido y por qué importa automatizarlo"
    - "1 min · Mapa BPMN: actores, fricción, decisión de qué automatizar y qué no"
    - "2 min · Demo en vivo del workflow + lectura de los 3 KPIs medidos"
    - "30 seg · Hipótesis Kaizen para el próximo ciclo"
    - "30 seg · Triángulo: 1 decisión concreta por cada lente"

declaracion_ia: |-
  Tu carta firmada debe declarar honestamente: \textbf{(1)} modelos de IA usados en el workflow y en la redacción de los entregables. \textbf{(2)} porcentaje del workflow donde la IA toma decisiones autónomamente y porcentaje donde solo asiste a un humano. \textbf{(3)} qué decisión tomó el equipo \emph{sin IA}, y por qué (ej. ``decidimos no usar IA para responder reclamos de clientes porque exigen criterio humano''). \textbf{(4)} las 3 lentes del triángulo con decisión concreta tomada por cada una.

cierre: |-
  Cierras el periodo 2 con un workflow real funcionando y un equipo con disciplina de mejora continua. El periodo 3 (Proyecto emprendedor) te pedirá llevar este mismo método a la cima del bachillerato: validar antes de construir, medir antes de pedir, sustentar antes de ejecutar.

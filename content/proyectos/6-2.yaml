clave: "6-2"
grado: 6
periodo: 2
completo: true

titulo: "Proyecto integrador · Maestros del oficio digital: abrir la máquina"
titulo_portada: |-
  Maestros
  del oficio
  digital

autor: "Dr. Álvaro Cárdenas Orozco"
dba: "Identifica los componentes principales de un sistema informático y explica sus funciones; aplica criterios de mantenimiento, ergonomía y selección razonada de equipo (MEN, T\\&I 6°)."
estrategia: "Trabajo en equipo + producto comunitario + reflexión ética"
duracion_semanas: 4
modalidad: "equipo de 3"

reto: |-
  Tu equipo de 3 estudiantes se convierte en \textbf{maestros del oficio digital del salón}: produce 3 productos que ayuden al colegio y al barrio a entender el computador por dentro y a cuidarlo. Un \textbf{mapa anatómico del computador} (póster), un \textbf{manual ilustrado de cuidado de la sala} firmado por el salón, y una \textbf{ficha técnica del computador ideal} para uso escolar con presupuesto razonado. Todo aplicando los 10 aprendizajes del periodo 2.

insumos:
  - "Cuaderno físico de cada integrante con sus 10 sesiones del periodo registradas"
  - "Cartulinas o papel grande para el póster y el manual (3-4 hojas)"
  - "Marcadores, colores, lápices del equipo"
  - "Acceso a un computador real del colegio para observar (con permiso del profe)"
  - "Acceso a Outlook o correo institucional para entregar la ficha técnica al rector o coordinador"
  - "1 ficha técnica de un computador real (catálogo o página de tienda) para usar como referencia"

anclaje: |-
  Antes de las máquinas modernas, en cada cuadra de Cartago había \textbf{maestros de oficio} que conocían sus herramientas por dentro. El \textbf{relojero} don Lucho podía nombrar cada engranaje del reloj; la \textbf{costurera} doña Carmen conocía cada bobina y tensión de su Singer; el \textbf{panadero} don Aurelio sabía a qué temperatura crecía la masa en su horno de leña. \emph{Cada uno era libre porque entendía su máquina}. Hoy tu equipo asume ese mismo oficio con una máquina nueva: el computador. Cuando termines este proyecto, no vas a depender del técnico ni del vendedor para entender qué hay adentro, cómo cuidarlo y cómo elegirlo. Eres el maestro del oficio digital de tu cuadra.

aprendizajes:
  - sesion: 1
    titulo: "Apertura del periodo 2 y las máquinas inteligentes por dentro"
  - sesion: 2
    titulo: "Las 4 funciones básicas de toda máquina inteligente"
  - sesion: 3
    titulo: "El gabinete por dentro: CPU, RAM, disco, fuente, tarjeta madre"
  - sesion: 4
    titulo: "Periféricos: entrada, salida y mixtos"
  - sesion: 5
    titulo: "Hardware vs software: el cuerpo y las instrucciones"
  - sesion: 6
    titulo: "El sistema operativo: el gerente del computador"
  - sesion: 7
    titulo: "Archivos y carpetas: ordenar mi biblioteca digital"
  - sesion: 8
    titulo: "Mantenimiento básico: limpieza, actualizaciones y respaldos"
  - sesion: 9
    titulo: "Postura y vida útil: cuidar el equipo y cuidarme yo"
  - sesion: 10
    titulo: "Mi computador ideal: ficha técnica con criterio"

entregables:
  - numero: 1
    titulo: "Mapa anatómico del computador (Dussel)"

    que_entregas: |-
      Un \textbf{póster de cartulina grande} (1 hoja tamaño pliego o 2 hojas tamaño carta pegadas) con el \textbf{mapa anatómico del computador}. El póster tiene: \textbf{(a) dibujo de un gabinete abierto} (o un laptop visto por dentro); \textbf{(b) 8 piezas identificadas con flechas} (CPU, RAM, disco, fuente, tarjeta madre, ventilador, lector óptico, puertos); \textbf{(c) descripción de 1 línea por pieza} con palabras propias del equipo (no copia de la guía); \textbf{(d) 4 funciones básicas} (entrada, procesamiento, salida, almacenamiento) marcadas en una esquina con icono; \textbf{(e) firma de los 3 integrantes con fecha} en la esquina inferior.

    como_se_hace:
      - "Paso 1: el equipo observa un computador real de la sala (con permiso del profe) y dibuja borrador del gabinete."
      - "Paso 2: cada integrante toma 2-3 piezas para investigar y describir con palabras propias (no copia)."
      - "Paso 3: unir los 3 textos en el póster con flechas claras hacia cada pieza."
      - "Paso 4: agregar el ícono de las 4 funciones básicas con su descripción corta."
      - "Paso 5: revisar legibilidad desde 2 metros de distancia y firmar el equipo."

    reflexion:
      lente: "dussel"
      titulo: |-
        💭 Conocer la máquina por dentro es nuestro derecho (Dussel)
      consigna: |-
        En la parte inferior del póster, los 3 escriben juntos un párrafo de 3 líneas: \emph{``Conocer las máquinas por dentro no es privilegio de técnicos ni de adultos. Como estudiantes de 6°, también tenemos derecho a saber qué hay dentro del computador que usamos cada día. Este mapa es prueba de que sí podemos.''}. Este párrafo queda visible en el póster, no como anexo.

    criterios:
      - "El póster identifica al menos 8 piezas con flechas claras."
      - "Cada pieza tiene descripción de 1 línea con palabras propias."
      - "Las 4 funciones básicas están señaladas en una esquina."
      - "El póster es legible desde 2 metros de distancia."
      - "El párrafo Dussel está visible en el póster (no en anexo)."

  - numero: 2
    titulo: "Manual ilustrado de cuidado de la sala (Estoico)"

    que_entregas: |-
      Un \textbf{manual ilustrado de cuidado de la sala de sistemas} (cartulina mediana o cuaderno tamaño A4) con \textbf{las 5 reglas firmadas por todos los compañeros del salón}. Cada regla tiene un \textbf{ícono dibujado} y una \textbf{frase corta y clara}. Al final hay un espacio para que cada compañero firme con su nombre + curso. El manual se entregará al rector o al coordinador mediante un correo formal (aplicando S3 sobre las 5 partes del correo).

    como_se_hace:
      - "Paso 1: reproducir las 5 reglas de la sala (S1, S8, S9) en formato manual: manos limpias · sin comer · postura · apagado correcto · reportar daños."
      - "Paso 2: dibujar un ícono por regla (qué quiere decir visualmente)."
      - "Paso 3: pasar el manual por el salón pidiendo firma de cada compañero con nombre + curso."
      - "Paso 4: redactar correo formal al rector o coordinador (5 partes) explicando qué es el manual y por qué lo hicieron como salón."
      - "Paso 5: enviar el correo desde correo institucional. Imprimir el envío o tomar captura."

    reflexion:
      lente: "estoico"
      titulo: |-
        💭 Lo que cuidamos hoy nos cuida mañana (Marco Aurelio)
      consigna: |-
        En la parte inferior del manual escriban juntos en 3 líneas: \emph{``Marco Aurelio decía: lo que cuidas con disciplina, te cuida después. Estas 5 reglas firmadas en 2026 alargan la vida de la sala de sistemas y de nuestros propios cuerpos. Quien firmó aquí se compromete a sostenerlas el resto del año.''}. Queda escrito en el manual, junto a las firmas.

    criterios:
      - "El manual tiene las 5 reglas completas y legibles."
      - "Cada regla tiene un ícono dibujado al lado."
      - "Hay al menos 15 firmas de compañeros del salón."
      - "Se envió correo formal al rector o coordinador con las 5 partes correctas."
      - "El párrafo estoico está visible en el manual junto a las firmas."

  - numero: 3
    titulo: "Ficha técnica del computador ideal con presupuesto (Floridi)"

    que_entregas: |-
      Una \textbf{ficha técnica de 1 hoja} (tamaño carta) del \textbf{computador ideal} para un estudiante de 6° en 2026, con \textbf{presupuesto razonado}. La ficha tiene: \textbf{(a) marca y modelo} (real o inventado, pero verosímil); \textbf{(b) CPU recomendada} con justificación corta; \textbf{(c) RAM recomendada} con justificación; \textbf{(d) disco recomendado} (tipo y tamaño) con justificación; \textbf{(e) sistema operativo} elegido con justificación; \textbf{(f) periféricos mínimos} necesarios; \textbf{(g) precio total estimado en pesos colombianos}; \textbf{(h) párrafo final} explicando por qué esa configuración es ``razonable, no extrema''.

    como_se_hace:
      - "Paso 1: discutir en equipo qué usos reales tendrá el computador (tareas, navegar, ver video, edición ligera)."
      - "Paso 2: cada integrante investiga 1-2 componentes en catálogos o páginas reales (CPU, RAM, disco, etc.)."
      - "Paso 3: armar la ficha técnica con justificación de cada elección y precio estimado."
      - "Paso 4: aplicar el criterio de S10: ni demasiado barato (sale caro) ni demasiado caro (gama gamer sin razón)."
      - "Paso 5: redactar el párrafo final sobre por qué la configuración es razonable y publicar la ficha en el cuaderno de equipo."

    reflexion:
      lente: "floridi"
      titulo: |-
        💭 Elegir con criterio es ciudadanía digital (Floridi)
      consigna: |-
        En la ficha (parte inferior o respaldo), escriban: \emph{``Luciano Floridi dice que vivimos rodeados de máquinas inteligentes. Saber elegirlas con criterio --- ni de menos ni de más --- es la nueva ciudadanía digital. Esta ficha es la voz de nuestro equipo aportando un criterio razonable de compra a nuestra comunidad: no caer en estafas, no derrochar, decidir bien.''}. Queda visible junto a la ficha.

    criterios:
      - "La ficha tiene los 7 componentes pedidos (CPU, RAM, disco, SO, periféricos, precio, párrafo final)."
      - "Cada elección tiene justificación de 1-2 líneas con criterio propio."
      - "El precio estimado en pesos es realista para 2026."
      - "La configuración es razonable (no extrema), aplicando el criterio de S10."
      - "El párrafo Floridi está visible en la ficha."

  - numero: 4
    titulo: "Sustentación de equipo y autoevaluación (transversal)"

    que_entregas: |-
      \textbf{Sustentación oral de 5 minutos en clase} donde el equipo presenta los 3 entregables al profe y al grupo. \textbf{Todos los 3 integrantes hablan} (no se vale uno solo). Apoyan con los productos físicos (póster, manual, ficha técnica). Después: \textbf{autoevaluación con la rúbrica de 5 criterios} marcada honestamente.

    como_se_hace:
      - "Paso 1: armar guion de 5 minutos: 1 min introducción (quiénes somos, qué hicimos), 3 min muestra de los 3 entregables (1 min cada uno, hablado por integrante distinto), 1 min reflexión final del equipo."
      - "Paso 2: ensayar al menos 1 vez con cronómetro."
      - "Paso 3: presentar ante profe y compañeros."
      - "Paso 4: después de la sustentación, autoevaluarse con la rúbrica de 5 criterios."
      - "Paso 5: redactar 4 líneas de reflexión personal de cada integrante: '¿qué aprendí siendo maestro del oficio digital?'."

    reflexion:
      lente: "dussel"
      titulo: |-
        💭 Cierre del equipo: nuestra cosecha del periodo 2
      consigna: |-
        Cada integrante escribe en su cuaderno 4 líneas: \emph{``Mi mayor aprendizaje siendo maestro del oficio digital fue \_\_\_. Lo que más me costó del proyecto fue \_\_\_. La regla de cuidado que voy a sostener todo el año es \_\_\_. Le doy gracias a mi equipo por \_\_\_.''}. Firmado.

    criterios:
      - "Los 3 integrantes hablaron durante la sustentación."
      - "Los 5 minutos se respetaron (entre 4:30 y 5:30)."
      - "Los 3 productos físicos se mostraron al grupo."
      - "Hay autoevaluación honesta con la rúbrica."
      - "Cada integrante escribió sus 4 líneas de reflexión personal."

rubrica:
  - entregable: 1
    nivel_5: "Póster completo con 8 piezas + 4 funciones + descripción propia + párrafo Dussel visible + firmado por los 3."
    nivel_3: "Póster con 5-7 piezas o falta alguna parte del paquete (funciones, descripción propia o párrafo Dussel)."
    nivel_1: "Póster incompleto (<5 piezas), sin descripciones propias o sin párrafo Dussel."

  - entregable: 2
    nivel_5: "Manual con las 5 reglas, íconos, 15+ firmas del salón, correo enviado al rector, párrafo estoico visible."
    nivel_3: "Manual con las 5 reglas pero faltan firmas (<10), o falta correo formal, o falta párrafo estoico."
    nivel_1: "Manual incompleto, sin firmas o sin correo enviado."

  - entregable: 3
    nivel_5: "Ficha técnica con los 7 componentes + justificación propia + precio realista + párrafo Floridi visible."
    nivel_3: "Ficha técnica con 4-6 componentes o sin justificación propia o sin párrafo Floridi."
    nivel_1: "Ficha técnica incompleta (<4 componentes) o sin criterio aplicado."

  - entregable: 4
    nivel_5: "Los 3 hablaron 5 min con productos a la vista, autoevaluación honesta, reflexión personal de cada uno."
    nivel_3: "1-2 integrantes hablaron, sustentación de 3-4 min, autoevaluación con criterio limitado."
    nivel_1: "Solo 1 habló o no hubo sustentación, sin autoevaluación."

  - entregable: "global"
    titulo: "Comunicación, sustentación e integración del triángulo"
    nivel_5: "Las 3 lentes (Dussel + Estoico + Floridi) están visibles en los productos, no como anexo aparte. Reflexiones genuinas, no copiadas."
    nivel_3: "Las 3 lentes están pero alguna parece copiada o forzada al producto."
    nivel_1: "Falta alguna lente o las reflexiones son superficiales/postizas."

sustentacion:
  duracion_min: 5
  guion_sugerido:
    - "1 min · presentación del equipo + reto del proyecto"
    - "1 min · entregable 1 (póster anatómico) explicado por integrante A"
    - "1 min · entregable 2 (manual de cuidado) explicado por integrante B"
    - "1 min · entregable 3 (ficha técnica) explicado por integrante C"
    - "1 min · cierre del equipo: aprendizajes + agradecimientos"

declaracion_ia: |-
  Este es proyecto de grado 6°. \textbf{NO se permite el uso de IA generativa} (ChatGPT, Claude, Gemini, DALL-E) para producir los entregables. Los productos deben ser hechos a mano por el equipo, con criterio propio. La IA aún no se cubre como herramienta de uso en grado 6°. Si en algún momento se usó IA (por curiosidad personal), declararlo en la sustentación.

cierre: |-
  Cerrando el periodo 2, los maestros del oficio digital del salón quedaron: producir y entregar a la comunidad criterio para abrir y cuidar la máquina. El periodo 3 te abre la puerta del oficio que viene: vas a aprender a buscar, evaluar y producir información con criterio en internet.

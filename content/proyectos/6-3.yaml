clave: "6-3"
grado: 6
periodo: 3
completo: true

titulo: "Proyecto integrador · Reporteros con criterio: documento informativo del barrio"
titulo_portada: |-
  Reporteros
  con criterio
  del barrio

autor: "Dr. Álvaro Cárdenas Orozco"
dba: "Produce un documento informativo digital aplicando criterios de formato, búsqueda y evaluación de fuentes; identifica fake news y cita responsablemente (MEN, T\\&I 6°)."
estrategia: "Trabajo en equipo + producto comunitario + reflexión ética"
duracion_semanas: 4
modalidad: "equipo de 3"

reto: |-
  Tu equipo de 3 estudiantes se convierte en \textbf{reporteros con criterio del barrio}: investiga un tema real, escribe con buen formato y publica un \textbf{documento informativo digital de 4 páginas} que ayude a la comunidad. Cierra el periodo con una \textbf{guía anti-fake news para tu salón} y un \textbf{cartel de operadores de búsqueda} útil para todos. Todo aplicando los 10 aprendizajes del periodo 3.

insumos:
  - "Cuaderno físico de cada integrante con sus 10 sesiones del periodo registradas"
  - "Acceso a computador con Word, Google Docs o LibreOffice Writer"
  - "Acceso a internet para investigación con criterio"
  - "Cartulinas o papel grande para la guía anti-fake y el cartel de operadores"
  - "Marcadores, colores, lápices del equipo"
  - "Acceso a Outlook o correo institucional para entregar el documento al rector o profe"

anclaje: |-
  Doña Mercedes la maestra rural de la vereda La Plata de Cartago enseñaba dos cosas que valían oro: \textbf{escribir bien y leer críticamente}. Antes de creer una noticia del periódico, preguntaba 5 cosas al vecino: \emph{¿quién la escribió?, ¿cuándo?, ¿por qué?, ¿qué prueba tiene?, ¿quién más lo dice?}. Sus exalumnos, ya adultos, sabían redactar peticiones al alcalde y desconfiar de promesas falsas. Hoy tu equipo asume el mismo oficio doble con las herramientas de tu tiempo: produces un documento serio con Word/Docs, y publicas un escudo anti-fake-news para que tu salón no caiga en cadenas mentirosas. Eres el reportero con criterio de tu cuadra.

aprendizajes:
  - sesion: 1
    titulo: "Apertura del periodo 3 y el oficio de escribir y buscar con criterio"
  - sesion: 2
    titulo: "¿Qué es un procesador de texto? Word, Google Docs y sus partes"
  - sesion: 3
    titulo: "Formato básico: fuente, tamaño, negrita, cursiva, alineación"
  - sesion: 4
    titulo: "Listas, viñetas y numeración"
  - sesion: 5
    titulo: "Tablas e imágenes en un documento"
  - sesion: 6
    titulo: "Encabezado, pie de página y números de página"
  - sesion: 7
    titulo: "¿Qué es internet? Cómo viajan los datos a tu pantalla"
  - sesion: 8
    titulo: "Buscar bien: operadores y técnicas en Google"
  - sesion: 9
    titulo: "Evaluar fuentes: CRAAP y detectar fake news"
  - sesion: 10
    titulo: "Mi primer documento informativo"

entregables:
  - numero: 1
    titulo: "Documento informativo digital del barrio (Dussel)"

    que_entregas: |-
      Un \textbf{documento digital de 4 páginas} en Word, Google Docs o LibreOffice, sobre un \textbf{tema real del barrio o de Cartago} (ejemplo: ``El parque que necesita arreglo'', ``Los oficios de mi cuadra'', ``Los puentes del río La Vieja'', ``El cementerio de los ingleses'', ``Historia de mi colegio''). El documento debe tener: \textbf{(a) portada} (título + integrantes + grado + fecha); \textbf{(b) introducción} de 1 párrafo; \textbf{(c) 2-3 secciones con subtítulo} cada una con su párrafo; \textbf{(d) 1 tabla} con datos comparativos; \textbf{(e) 1 imagen} con pie de foto y fuente; \textbf{(f) cierre} de 1 párrafo; \textbf{(g) fuentes citadas} (mínimo 3 con autor/entidad, título, fecha de consulta); \textbf{(h) encabezado} con nombre del equipo y \textbf{pie con número de página}.

    como_se_hace:
      - "Paso 1: elegir tema real del barrio o Cartago. Acordar las 2-3 preguntas que el documento va a responder."
      - "Paso 2: investigar usando operadores de S8 (site:gov.co, comillas, guion menos). Buscar mínimo 3 fuentes; aplicar CRAAP a cada una y descartar las que no pasen."
      - "Paso 3: redactar el contenido en equipo (cada integrante asume 1 sección) en Google Docs colaborativo o Word."
      - "Paso 4: aplicar formato profesional (fuente Arial/Calibri 12, interlineado 1,5, márgenes 2,5 cm, títulos centrados en negrita, encabezado y pie con número de página)."
      - "Paso 5: revisar con checklist final (S10) antes de entregar; exportar a PDF y enviar por correo institucional al profe."

    reflexion:
      lente: "dussel"
      titulo: |-
        💭 Nuestra escritura cuenta (Dussel)
      consigna: |-
        En la introducción o el cierre del documento (o como nota destacada al pie de portada), los 3 escriben juntos un párrafo de 3 líneas: \emph{``Como estudiantes de 6°, esta es nuestra voz escrita sobre nuestro barrio. No es ensayo de adultos: es voz propia con formato cuidado y fuentes honestas. La firmamos con nuestros nombres reales porque sostenemos lo que aquí decimos.''}. Queda visible en el documento, no como anexo.

    criterios:
      - "El documento tiene 4 páginas con las 8 partes pedidas (portada, intro, 2-3 secciones, tabla, imagen, cierre, fuentes, encabezado/pie)."
      - "Las 3 fuentes citadas pasan CRAAP (autoría conocida + fecha + propósito honesto)."
      - "El formato es profesional y consistente (1 fuente, 1 tamaño base, márgenes regulares, interlineado 1,5)."
      - "Hay 1 tabla con datos comparativos y 1 imagen con pie + fuente."
      - "El párrafo Dussel está visible en el documento."

  - numero: 2
    titulo: "Guía anti-fake news para el salón (Estoico)"

    que_entregas: |-
      Una \textbf{guía visual anti-fake news} (cartulina mediana o póster) firmada por todos los compañeros del salón. La guía tiene: \textbf{(a) las 5 letras de CRAAP} explicadas en 1 línea cada una; \textbf{(b) las 5 señales típicas} de una fake news (urgencia, promesa extrema, sin fuente, URL rara, pedir reenvío); \textbf{(c) 3 pasos de oro} si una noticia es sospechosa (no reenviar, verificar fuente, reportar al adulto/profe); \textbf{(d) ícono} por cada elemento; \textbf{(e) espacio para firma} de cada compañero del salón.

    como_se_hace:
      - "Paso 1: reproducir las 5 letras CRAAP y las 5 señales de fake news en la cartulina con letra clara."
      - "Paso 2: dibujar un ícono por elemento (qué quiere decir visualmente)."
      - "Paso 3: pasar la guía por el salón pidiendo a cada compañero firmar con nombre + curso."
      - "Paso 4: redactar correo formal al rector o coordinador (5 partes) explicando qué es la guía y por qué la hicieron como salón."
      - "Paso 5: enviar el correo desde correo institucional. Imprimir el envío o tomar captura. Pegar la guía en cartelera o salón."

    reflexion:
      lente: "estoico"
      titulo: |-
        💭 Antes de reenviar, párate y respira (Marco Aurelio)
      consigna: |-
        En la parte inferior de la guía escriban juntos en 3 líneas: \emph{``Marco Aurelio decía: la prisa es enemiga del juicio. Antes de creer y reenviar cualquier audio o imagen, párate, respira y verifica. Estos 5 criterios firmados por nuestro salón en 2026 son el escudo contra el rumor digital del barrio.''}. Queda escrito junto a las firmas.

    criterios:
      - "La guía tiene las 5 letras CRAAP explicadas en 1 línea cada una."
      - "Incluye las 5 señales de fake news y los 3 pasos de oro."
      - "Cada elemento tiene un ícono dibujado."
      - "Hay al menos 15 firmas de compañeros del salón + correo formal al rector enviado."
      - "El párrafo estoico está visible en la guía junto a las firmas."

  - numero: 3
    titulo: "Cartel de operadores de búsqueda (Floridi)"

    que_entregas: |-
      Un \textbf{cartel mediano} con los \textbf{6 operadores de búsqueda} más útiles para todos: \textbf{(a) ``frase exacta''} (comillas dobles); \textbf{(b) -palabra} (excluir término); \textbf{(c) site:dominio} (buscar dentro de un sitio); \textbf{(d) filetype:pdf} (buscar tipo de archivo); \textbf{(e) intitle:término} (en título); \textbf{(f) OR / AND} (alternativas o conjuntos). Cada operador con: \emph{(1) nombre, (2) qué hace en 1 línea, (3) ejemplo concreto con búsqueda real}. El cartel se pega en la sala de sistemas o en el aula.

    como_se_hace:
      - "Paso 1: cada integrante asume 2 operadores y los investiga + prueba en Google (probar para creer)."
      - "Paso 2: armar el cartel con los 6 operadores en bloque visual claro: nombre + qué hace + ejemplo."
      - "Paso 3: dibujar un ícono pequeño por operador para refuerzo visual."
      - "Paso 4: revisar la legibilidad desde 2 metros de distancia."
      - "Paso 5: pegar el cartel en la sala de sistemas o el aula, con permiso del profe."

    reflexion:
      lente: "floridi"
      titulo: |-
        💭 Buscar bien es ciudadanía digital (Floridi)
      consigna: |-
        En el cartel (parte inferior o esquina), escriban: \emph{``Luciano Floridi dice que en la infoesfera no solo recibes información: también la produces. Estos 6 operadores son la voz de nuestro equipo aportando criterio de búsqueda a nuestro salón: buscar bien es ciudadanía digital. Quien busca con operadores no queda atrapado en publicidad: encuentra lo que necesita.''}. Queda visible en el cartel.

    criterios:
      - "Los 6 operadores están presentes con su descripción y ejemplo real."
      - "Cada operador tiene 1 ejemplo de búsqueda concreta probada por el equipo."
      - "Cada operador tiene un ícono dibujado."
      - "El cartel es legible desde 2 metros de distancia y está pegado en sala de sistemas o aula."
      - "El párrafo Floridi está visible en el cartel."

  - numero: 4
    titulo: "Sustentación de equipo y autoevaluación (transversal)"

    que_entregas: |-
      \textbf{Sustentación oral de 5 minutos en clase} donde el equipo presenta los 3 entregables al profe y al grupo. \textbf{Todos los 3 integrantes hablan}. Apoyan con los productos (PDF en pantalla, guía anti-fake en cartulina, cartel de operadores). Después: \textbf{autoevaluación con la rúbrica de 5 criterios} marcada honestamente.

    como_se_hace:
      - "Paso 1: armar guion de 5 minutos: 1 min introducción (quiénes somos, qué hicimos), 3 min muestra de los 3 entregables (1 min cada uno, hablado por integrante distinto), 1 min reflexión final del equipo."
      - "Paso 2: ensayar al menos 1 vez con cronómetro."
      - "Paso 3: presentar ante profe y compañeros (proyectar el documento PDF en pantalla)."
      - "Paso 4: después de la sustentación, autoevaluarse con la rúbrica de 5 criterios."
      - "Paso 5: redactar 4 líneas de reflexión personal de cada integrante: '¿qué aprendí siendo reportero con criterio?'."

    reflexion:
      lente: "dussel"
      titulo: |-
        💭 Cierre del equipo: cosecha del grado 6°
      consigna: |-
        Cada integrante escribe en su cuaderno 4 líneas: \emph{``Mi mayor aprendizaje siendo reportero con criterio del barrio fue \_\_\_. Lo que más me costó del proyecto fue \_\_\_. El criterio CRAAP o el operador de búsqueda que voy a sostener todo el año es \_\_\_. Le doy gracias a mi equipo por \_\_\_.''}. Firmado.

    criterios:
      - "Los 3 integrantes hablaron durante la sustentación."
      - "Los 5 minutos se respetaron (entre 4:30 y 5:30)."
      - "Los 3 productos se mostraron al grupo (PDF en pantalla + guía + cartel)."
      - "Hay autoevaluación honesta con la rúbrica."
      - "Cada integrante escribió sus 4 líneas de reflexión personal."

rubrica:
  - entregable: 1
    nivel_5: "Documento de 4 páginas con las 8 partes + 3 fuentes CRAAP + formato profesional + tabla + imagen + párrafo Dussel visible."
    nivel_3: "Documento incompleto (faltan 1-2 partes) o sin alguna de las verificaciones (3 fuentes/tabla/imagen/formato consistente)."
    nivel_1: "Documento incompleto (< 3 páginas) o sin formato consistente o sin fuentes citadas."

  - entregable: 2
    nivel_5: "Guía con CRAAP + 5 señales + 3 pasos de oro + íconos + 15+ firmas + correo al rector + párrafo estoico visible."
    nivel_3: "Guía con CRAAP y señales pero faltan firmas (<10) o falta correo formal o falta párrafo estoico."
    nivel_1: "Guía incompleta o sin firmas o sin correo enviado."

  - entregable: 3
    nivel_5: "Cartel con los 6 operadores + descripción + ejemplo probado + íconos + instalado visible + párrafo Floridi."
    nivel_3: "Cartel con 4-5 operadores o sin ejemplo probado o sin instalar visible."
    nivel_1: "Cartel incompleto (< 4 operadores) o sin párrafo Floridi."

  - entregable: 4
    nivel_5: "Los 3 hablaron 5 min con productos a la vista, autoevaluación honesta, reflexión personal de cada uno."
    nivel_3: "1-2 integrantes hablaron, sustentación de 3-4 min, autoevaluación con criterio limitado."
    nivel_1: "Solo 1 habló o no hubo sustentación, sin autoevaluación."

  - entregable: "global"
    titulo: "Comunicación, sustentación e integración del triángulo"
    nivel_5: "Las 3 lentes (Dussel + Estoico + Floridi) están visibles en los productos, no como anexo aparte. Reflexiones genuinas, no copiadas."
    nivel_3: "Las 3 lentes están pero alguna parece copiada o forzada al producto."
    nivel_1: "Falta alguna lente o las reflexiones son superficiales/postizas."

sustentacion:
  duracion_min: 5
  guion_sugerido:
    - "1 min · presentación del equipo + reto del proyecto"
    - "1 min · entregable 1 (documento informativo) explicado por integrante A"
    - "1 min · entregable 2 (guía anti-fake) explicado por integrante B"
    - "1 min · entregable 3 (cartel de operadores) explicado por integrante C"
    - "1 min · cierre del equipo: aprendizajes + agradecimientos"

declaracion_ia: |-
  Este es proyecto de grado 6°. \textbf{NO se permite el uso de IA generativa} (ChatGPT, Claude, Gemini, DALL-E) para producir los entregables. La investigación y redacción son del equipo con criterio propio. La IA aún no se cubre como herramienta de uso en grado 6°. Si en algún momento se usó IA (por curiosidad personal), declararlo en la sustentación.

cierre: |-
  Cerrando el grado 6°, los reporteros con criterio del barrio quedaron: producir y entregar a la comunidad un documento serio y un escudo anti-fake. En grado 7° subes a colaborar en la nube (Microsoft 365), programar tus primeros pasos (Scratch) y conocer la IA con criterio.

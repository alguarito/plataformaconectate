clave: "8-1"
grado: 8
periodo: 1
completo: true

titulo: "Proyecto integrador · Mini-estudio con phronesis y hoja de cálculo"
titulo_portada: |-
  Mini-estudio
  con phronesis y
  hoja de cálculo

autor: "Dr. Álvaro Cárdenas Orozco"
dba: "Diseña una pregunta de investigación, recolecta datos reales del entorno, los procesa con fórmulas básicas y referencias absolutas, los visualiza con honestidad y propone una decisión razonada con criterio práctico."
estrategia: "Phronesis con datos + Excel/Sheets básico + Gráficos honestos"
duracion_semanas: 5
modalidad: "equipo"

reto: |-
  Realiza un \textbf{mini-estudio sobre un problema observable de tu colegio o casa}: define una pregunta con propósito, recoge mínimo \textbf{20 mediciones reales}, las procesas con fórmulas (SUMA, PROMEDIO, MAX, MIN), aplicas referencias absolutas correctamente, las visualizas con honestidad (3 principios mínimos) y entregas una decisión razonada al destinatario nombrado.

insumos:
  - "Microsoft Excel o Google Sheets (cuenta Gmail si Sheets)"
  - "Plantilla de bitácora de limpieza (la entrega el docente)"
  - "Validador de gráfico honesto: checklist de 3 principios"
  - "Lista de 20+ mediciones por hacer en 5 días corridos"
  - "Destinatario real identificado (rector, coordinador, papá/mamá)"
  - "Calculadora de bolsillo para verificar fórmulas manualmente"

anclaje: |-
  En los pueblos cafeteros que rodean Cartago (Sevilla, Caicedonia, Riofrío, Trujillo) trabajó durante décadas \textbf{la acopiadora de café}: una mujer (casi siempre mujer) que abría una bodega pequeña y recibía los bultos de café de los pequeños productores. Tenía dos herramientas: una balanza grande y una \textbf{libreta cuadriculada}. Por cada productor anotaba nombre, vereda, fecha, kilos brutos, kilos limpios, calidad, precio por kilo, total pagado. Al final de la semana, sumaba columnas a mano, comparaba con la semana anterior y decidía: \emph{``Esta semana don Aurelio trajo el café más limpio: en la próxima cosecha le doy primero el pago.''} Esa práctica era \textbf{phronesis con datos}: criterio práctico aplicado a cifras concretas. No era estadística académica; era el saber del oficio cruzado con la columna sumada. La hoja de cálculo en Excel es la herencia digital de esa libreta de la acopiadora.

aprendizajes:
  - sesion: 1
    titulo: "Phronesis con datos: preguntar antes de calcular"
  - sesion: 2
    titulo: "Tipos de datos: número, texto, fecha, porcentaje"
  - sesion: 3
    titulo: "Tablas limpias: campos, registros y bitácora"
  - sesion: 4
    titulo: "4 funciones básicas: SUMA, PROMEDIO, MAX, MIN"
  - sesion: 5
    titulo: 'Referencias relativas y absolutas (A1 vs \$A\$1)'
  - sesion: 6
    titulo: "Fórmulas compuestas y jerarquía PEMDAS"
  - sesion: 7
    titulo: "Gráficos honestos: barras, líneas, circulares"
  - sesion: 8
    titulo: "Formato condicional y validación de datos"
  - sesion: 9
    titulo: "Mini-estudio del entorno escolar"
  - sesion: 10
    titulo: "Sustentación del mini-estudio en 4 minutos"

entregables:
  - numero: 1
    titulo: "Pregunta de estudio + recolección de 20+ datos reales"
    que_entregas: |-
      Documento de 1 página con: pregunta de investigación con propósito claro, justificación de por qué importa al entorno (colegio o casa), destinatario real identificado por nombre o cargo, plan de recolección (qué se mide, cómo, cuándo). + Hoja de Excel/Sheets con mínimo \textbf{20 mediciones reales} recolectadas durante al menos \textbf{5 días corridos} con contexto de cada medición (fecha, hora, condición).
    como_se_hace:
      - "Definir pregunta de investigación con propósito y destinatario"
      - "Diseñar plan de recolección (variable, instrumento, frecuencia)"
      - "Recolectar mínimo 20 mediciones reales en 5+ días distintos"
      - "Documentar contexto de cada medición en columnas separadas"
      - "Guardar pestaña 'datos crudos' separada y no tocarla después"
    reflexion:
      lente: "dussel"
      titulo: "A quién no medimos y por qué"
      consigna: |-
        En el documento de 1 página, agrega una sección titulada \emph{``A quién no medimos y por qué''}. Reconoce honestamente qué casos quedaron fuera de tus mediciones: horarios que no pudiste cubrir, lugares a los que no entraste, personas que no quisieron participar, días que no estuviste. Explica qué sesgo introduce esa ausencia en el estudio. \textbf{Esa sección queda en el documento entregado al docente y al destinatario}. La lente del nosotros pregunta por los casos que no entraron al cuaderno cuadriculado.
    criterios:
      - "Pregunta con propósito y destinatario nombrado"
      - "Justificación clara (por qué importa al entorno)"
      - "20+ mediciones reales recolectadas en 5+ días corridos"
      - "Contexto documentado por cada medición"
      - "Sección Dussel publicada en el documento"

  - numero: 2
    titulo: "Limpieza + análisis con 4 fórmulas básicas + referencias absolutas"
    que_entregas: |-
      Hoja de cálculo con: pestaña 1 ``datos crudos'' (intacta), pestaña 2 ``datos limpios'' (formatos normalizados, faltantes marcados N/A, duplicados detectados), pestaña 3 ``análisis'' con al menos: \textbf{SUMA, PROMEDIO, MAX, MIN aplicadas correctamente, y al menos 1 fórmula con referencia absoluta} (ej. multiplicar cada valor por una constante en \$B\$1). Acompañado de bitácora de limpieza con 3+ decisiones documentadas (qué se corrigió, cómo, por qué).
    como_se_hace:
      - "Copiar pestaña cruda y empezar limpieza en la segunda"
      - "Normalizar formatos: fechas, números, mayúsculas"
      - "Detectar duplicados con Datos > Quitar duplicados"
      - "Aplicar las 4 fórmulas básicas en la pestaña análisis"
      - "Usar al menos 1 referencia absoluta correctamente (\\$A\\$1)"
    reflexion:
      lente: "estoico"
      titulo: "Lo que decidimos no maquillar"
      consigna: |-
        En una celda visible de la pestaña ``datos limpios'' o en una pestaña ``Notas'', agrega un párrafo titulado \emph{``Lo que decidimos no maquillar''}. Reconoce honestamente qué casos atípicos podrías haber borrado para que el promedio se viera mejor: ¿un valor extremo?, ¿una respuesta que rompía la tendencia esperada? Explica por qué decidiste conservarlos. \textbf{Esa nota queda en la hoja de cálculo entregada al destinatario}, no en privado. La acopiadora del café no borraba el bulto sucio para que el promedio se viera mejor: lo registraba.
    criterios:
      - "3 pestañas separadas: crudos, limpios, análisis"
      - "4 fórmulas básicas correctamente aplicadas"
      - "1+ referencia absoluta usada correctamente"
      - "Bitácora con 3+ decisiones de limpieza documentadas"
      - "Párrafo estoico publicado en la hoja"

  - numero: 3
    titulo: "Gráfico honesto + decisión razonada para el destinatario"
    que_entregas: |-
      Reporte de 1 página con: \textbf{1 gráfico honesto} (verificar 3 principios: eje desde 0, escala consistente, etiquetas legibles), tabla resumen con datos clave, \textbf{1 decisión razonada} para el destinatario (qué sugieres con base en los datos, no opinión libre). Formato profesional, sin maquillaje visual.
    como_se_hace:
      - "Decidir qué tipo de gráfico es el más adecuado al dato"
      - "Construir el gráfico aplicando los 3 principios honestos"
      - "Verificar con un compañero externo que el gráfico se entiende solo"
      - "Sintetizar tabla resumen con datos clave"
      - "Redactar decisión razonada: dato + propuesta concreta + destinatario"
    reflexion:
      lente: "floridi"
      titulo: "Mi reporte en la cadena informacional"
      consigna: |-
        En el reporte, agrega una sección titulada \emph{``Mi reporte en la cadena informacional''}. Reflexiona: ¿qué información agrega tu mini-estudio a la conversación del entorno?, ¿enriquece la decisión del destinatario con datos honestos o solo agrega ruido?, ¿qué responsabilidad asumes por las cifras que publicas? \textbf{Esa sección queda dentro del reporte entregado al destinatario real}, no como anexo escolar. La ética de Floridi va más allá de la corrección estadística.
    criterios:
      - "1 gráfico honesto (3 principios verificados)"
      - "Tabla resumen con datos clave"
      - "1 decisión razonada con propuesta concreta"
      - "Formato profesional sin maquillaje"
      - "Reflexión Floridi publicada dentro del reporte"

  - numero: 4
    titulo: "Sustentación de 4 minutos + entrega real al destinatario"
    que_entregas: |-
      Sustentación oral de 4 minutos frente al grupo + entrega real del reporte al destinatario (rectoría, coordinación, papá/mamá según el caso) con acuse documentado (foto, firma de recibido, screenshot del correo) + carta firmada del equipo con compromisos del triángulo para los próximos periodos.
    como_se_hace:
      - "Preparar guion de 4 min siguiendo la estructura sugerida"
      - "Ensayar con cronómetro 2 veces"
      - "Imprimir o enviar el reporte al destinatario real (no simulado)"
      - "Documentar la entrega (foto, firma, screenshot)"
      - "Escribir carta con compromisos verificables del triángulo"
    reflexion:
      lente: "dussel"
      titulo: "Compromisos del equipo investigador"
      consigna: |-
        En la carta del equipo, dedica un párrafo a cada lente del triángulo \textbf{como compromisos verificables}. \textbf{Por Dussel}: a qué grupo del entorno que no medimos nos comprometemos a integrar si hay una v2. \textbf{Por el estoico}: qué disciplina personal sostendremos como analistas (no inflar conclusiones, no truncar ejes, no maquillar promedios). \textbf{Por Floridi}: qué información honesta seguiremos publicando sobre el seguimiento (si el destinatario actuó). Cada uno con \textbf{decisión concreta y fechada}.
    criterios:
      - "Sustentación de 4 min exactos cronometrados"
      - "Reporte entregado realmente al destinatario"
      - "Acuse de recibo documentado (foto, firma o screenshot)"
      - "Carta con compromisos verificables del triángulo"
      - "Demo: muestra gráfico + tabla + decisión razonada"

rubrica:
  - entregable: 1
    nivel_5: "Pregunta con propósito, 20+ datos reales, 5+ días, Dussel visible"
    nivel_3: "Pregunta vaga o datos insuficientes"
    nivel_1: "Sin pregunta clara o datos inventados"
  - entregable: 2
    nivel_5: "3 pestañas, 4 fórmulas correctas, 1+ referencia absoluta, estoico visible"
    nivel_3: "Análisis con fórmulas parciales o sin referencias absolutas"
    nivel_1: "Sin limpieza o sin fórmulas básicas"
  - entregable: 3
    nivel_5: "Gráfico honesto, decisión razonada con propuesta, Floridi visible"
    nivel_3: "Gráfico aceptable o decisión sin propuesta clara"
    nivel_1: "Gráfico engañoso o sin decisión razonada"
  - entregable: 4
    nivel_5: "4 min exactos, reporte entregado realmente, compromisos triángulo verificables"
    nivel_3: "Sustentación con tiempo descontrolado o reporte no entregado"
    nivel_1: "No sustentó o reporte simulado"
  - entregable: "global"
    titulo: "Coherencia del mini-estudio: pregunta, datos, análisis y decisión"
    nivel_5: "La pregunta, los datos, el análisis y la decisión dialogan"
    nivel_3: "Coherencia parcial entre las partes"
    nivel_1: "Las partes parecen ejercicios separados"

sustentacion:
  duracion_min: 4
  guion_sugerido:
    - "30 seg · Pregunta de investigación y destinatario real"
    - "1 min · Metodología: cómo recolectamos los 20+ datos"
    - "1 min · Hallazgo principal con gráfico honesto en pantalla"
    - "1 min · Decisión razonada: qué proponemos al destinatario"
    - "30 seg · Compromisos del triángulo + entrega real del reporte"

declaracion_ia: |-
  Tu carta debe declarar honestamente: \textbf{(1)} si usaron IA para análisis (poco probable en G8 P1, pero documentar si la hubo). \textbf{(2)} cómo verificaron que el gráfico no miente (3 principios). \textbf{(3)} qué decisión tomaron como equipo sin IA y por qué. \textbf{(4)} las 3 lentes del triángulo como compromisos verificables.

cierre: |-
  Cierras el periodo 1 con tu primer mini-estudio entregado a un destinatario real. El periodo 2 (Lógica avanzada y micro:bit) te pedirá llevar este criterio práctico a las decisiones que toma el código: AND, OR, NOT, sensores y umbrales calibrados. La acopiadora del café se va contigo a programar.

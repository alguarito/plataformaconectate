clave: "8-2"
grado: 8
periodo: 2
completo: true

titulo: "Proyecto integrador · El micro:bit como vigía del barrio"
titulo_portada: |-
  El micro:bit
  como vigía
  del barrio

autor: "Dr. Álvaro Cárdenas Orozco"
dba: "Diseña, programa, calibra y sustenta un sistema de monitoreo con micro:bit que aplica lógica condicional compuesta (AND, OR, NOT), sensores con umbrales calibrados y depuración con método del relojero."
estrategia: "Computación física + Lógica condicional + Depuración disciplinada"
duracion_semanas: 5
modalidad: "equipo"

reto: |-
  Construye un \textbf{vigía electrónico con micro:bit} para un problema real de tu casa, colegio o barrio (alerta de inundación, vigilancia de cuarto a oscuras, conteo de personas en la biblioteca, alarma de puerta abierta, monitoreo de temperatura del aula, etc.). Debe usar al menos un sensor, lógica condicional compuesta con AND/OR/NOT, umbrales calibrados con \textbf{datos reales} y validación por escenarios. Termina con sustentación pública del oficio.

insumos:
  - "Kit micro:bit (1 por equipo) con cable USB"
  - "MakeCode online (makecode.microbit.org) o app móvil"
  - "Sensores adicionales si los hay: humedad, distancia, sonido"
  - "Cuaderno de bitácora del relojero (papel o digital)"
  - "Acceso a IA generativa para asistencia en pseudocódigo (no para reemplazar el oficio)"
  - "Ambiente real para probar el vigía (casa, aula, biblioteca, jardín)"

anclaje: |-
  En los barrios de Cartago, hasta los años 90, hubo un personaje silencioso que llegaba a las casas con una caja de herramientas y un voltímetro: \textbf{el electricista del barrio}. Cuando se iba la luz de un bombillo o de toda una casa, su método no era cambiar piezas al azar: era \textbf{lógica aplicada paso a paso}. Empezaba preguntando: ¿cuándo se fue?, ¿se fueron las otras casas también? Después medía en distintos puntos: \emph{¿hay corriente AND el bombillo no enciende?, ¿hay corriente OR sólo en algunos tomacorrientes?, ¿es NOT problema de la red, sino del circuito de la casa?}. Cada medición confirmaba o descartaba una hipótesis hasta llegar al fallo concreto. Esa práctica era \textbf{lógica condicional aplicada a un problema físico real}: el mismo if-else-if con AND/OR/NOT que ejecuta un micro:bit cuando lee sensores y dispara actuadores. La diferencia entre el electricista del barrio y un programador con MakeCode no es el oficio: es el medio.

aprendizajes:
  - sesion: 1
    titulo: "Lógica avanzada: if-else con AND, OR y NOT"
  - sesion: 2
    titulo: "Tablas de verdad: reglas universales"
  - sesion: 3
    titulo: "Algoritmos: del pseudocódigo al diagrama de flujo"
  - sesion: 4
    titulo: "Sensores en MakeCode: micro:bit que siente"
  - sesion: 5
    titulo: "Actuadores: LEDs, sonido, coreografía"
  - sesion: 6
    titulo: "Sensores con variables y umbrales calibrados"
  - sesion: 7
    titulo: "Depuración: una hipótesis, una prueba, un resultado"
  - sesion: 8
    titulo: "Alertas con lógica compuesta y validación por escenarios"
  - sesion: 9
    titulo: "Proyecto de monitoreo: el micro:bit como vigía"
  - sesion: 10
    titulo: "Sustentación del proyecto técnico"

entregables:
  - numero: 1
    titulo: "Problema observado + algoritmo en pseudocódigo + diagrama de flujo"
    que_entregas: |-
      Documento de 1-2 páginas con: problema real observado en casa/colegio/barrio (no inventado), justificación de por qué importa, algoritmo en pseudocódigo (escrito en lenguaje natural con if-else-if + AND/OR/NOT) y diagrama de flujo con simbología correcta (rectángulos, rombos, óvalos, flechas).
    como_se_hace:
      - "Observar el problema durante 1-2 días tomando notas"
      - "Decidir qué sensor del micro:bit aplica (luz, temperatura, movimiento, sonido)"
      - "Escribir el algoritmo en pseudocódigo con condicionales compuestas"
      - "Diagramar en draw.io o papel con simbología correcta"
      - "Mostrar el pseudocódigo a otro equipo para verificar que se entiende"
    reflexion:
      lente: "dussel"
      titulo: "A quién protege y a quién no este vigía"
      consigna: |-
        En el documento, agrega una sección titulada \emph{``A quién protege y a quién no este vigía''}. Reconoce honestamente qué personas se benefician del sistema y \textbf{a quién no llega}: vecinos sin el dispositivo, personas con discapacidad auditiva si la alarma es solo sonora, personas mayores que no entienden el LED. Explica el sesgo de tu diseño. \textbf{Esa sección queda en el documento entregado al docente y al destinatario del vigía}. La lente del nosotros pregunta por las personas que el sistema no alcanza.
    criterios:
      - "Problema real observado (no inventado)"
      - "Justificación clara (por qué importa)"
      - "Pseudocódigo con if-else-if + AND/OR/NOT"
      - "Diagrama de flujo con simbología correcta"
      - "Sección Dussel publicada en el documento"

  - numero: 2
    titulo: "Programa MakeCode + calibración de umbrales con datos reales"
    que_entregas: |-
      Programa de MakeCode funcional cargado en el micro:bit, con: variables nombradas con sentido (no x, y, z), al menos 1 sensor leído, al menos 1 condicional compuesta con AND/OR/NOT, al menos 1 actuador (LED, sonido, pin externo) y \textbf{umbrales calibrados con 5+ mediciones reales del ambiente}. Acompañado de bitácora de calibración: 5 mediciones con contexto (hora, condición, lectura).
    como_se_hace:
      - "Programar en MakeCode con variables descriptivas"
      - "Tomar 5+ lecturas del sensor en distintas condiciones del ambiente"
      - "Decidir el umbral del condicional con base en esas lecturas"
      - "Cargar el programa al micro:bit y probar"
      - "Documentar la bitácora de calibración (no inventar umbrales)"
    reflexion:
      lente: "estoico"
      titulo: "Lo que decidimos no programar todavía"
      consigna: |-
        En el código (comentario al inicio) o en una nota acompañante, agrega un párrafo titulado \emph{``Lo que decidimos no programar todavía''}. Declara qué \textbf{features quisieron incluir y decidieron dejar fuera a propósito} para esta versión: una alarma adicional que distraía, una conexión a internet que volvía el sistema frágil, un sensor que no estaba calibrado. \textbf{Esa nota queda dentro del código fuente o en la documentación del vigía}. El estoico entiende que el oficio del programador disciplinado es saber dónde no meter más complejidad sin antes validar.
    criterios:
      - "Programa MakeCode funcional cargado en micro:bit"
      - "Variables con nombres descriptivos (no x, y, z)"
      - "Condicional compuesta con AND/OR/NOT visible en el código"
      - "Bitácora de calibración con 5+ mediciones reales del ambiente"
      - "Párrafo estoico publicado en código o documentación"

  - numero: 3
    titulo: "Validación por escenarios + bitácora del relojero (depuración)"
    que_entregas: |-
      Tabla de validación con todos los escenarios posibles (si tienes n condiciones binarias, debes probar 2\^n combinaciones, ej. 3 sensores binarios = 8 escenarios). Para cada escenario: salida esperada y salida real observada. + Bitácora del relojero: \textbf{mínimo 3 bugs detectados y corregidos} con anatomía del oficio (hipótesis, prueba, resultado, una sola cosa cambiada a la vez).
    como_se_hace:
      - "Listar todos los escenarios posibles (tabla de verdad)"
      - "Probar el vigía en cada escenario (forzando las condiciones del ambiente)"
      - "Anotar salida esperada vs salida real"
      - "Cuando hay un bug, aplicar el método del relojero: 1 hipótesis, 1 prueba, 1 resultado"
      - "Documentar 3+ bugs corregidos con el flujo completo"
    reflexion:
      lente: "floridi"
      titulo: "Mi vigía en la cadena informacional del barrio"
      consigna: |-
        En la bitácora del relojero, agrega una sección titulada \emph{``Mi vigía en la cadena informacional del barrio''}. Reflexiona: ¿qué información agrega tu vigía a la conversación del entorno?, ¿enriquece la seguridad o la organización del lugar o solo agrega ruido más?, ¿qué responsabilidad asumes por las alarmas que dispara o no dispara? Si el vigía falla y nadie reacciona, ¿qué responsabilidad queda con quien lo construyó? \textbf{Esa sección queda en la bitácora entregada al docente y al destinatario del vigía}. La ética de Floridi pregunta por el efecto del sistema en la cadena informacional del entorno.
    criterios:
      - 'Tabla de validación con todos los escenarios (mínimo 2\^n)'
      - "Salida esperada vs salida real documentada"
      - "3+ bugs detectados y corregidos con bitácora del relojero"
      - "Una sola cosa cambiada por intento (disciplina del relojero)"
      - "Reflexión Floridi publicada en la bitácora"

  - numero: 4
    titulo: "Sustentación con demo en vivo + entrega del vigía al destinatario"
    que_entregas: |-
      Sustentación de 5 minutos frente al grupo con \textbf{demo en vivo} del vigía funcionando (no captura estática) + entrega real del vigía al destinatario del entorno (familia, biblioteca, aula, jardín) con instrucciones de uso impresas + carta firmada del equipo con compromisos del triángulo.
    como_se_hace:
      - "Preparar guion de 5 min con estructura clara"
      - "Ensayar la demo en vivo en el ambiente real al menos 2 veces"
      - "Imprimir instrucciones de uso del vigía (1 página)"
      - "Entregar formalmente el vigía al destinatario"
      - "Escribir carta con compromisos verificables del triángulo"
    reflexion:
      lente: "dussel"
      titulo: "Compromisos del equipo programador"
      consigna: |-
        En la carta del equipo, dedica un párrafo a cada lente del triángulo \textbf{como compromisos verificables, no retóricos}. \textbf{Por Dussel}: a qué persona del entorno que no protege el vigía actual nos comprometemos a integrar en v2 (alarma visual además de sonora, instrucciones en otro idioma, etc.). \textbf{Por el estoico}: qué disciplina personal sostendremos como programadores (no agregar features sin validar, no abandonar el vigía si falla, mantener bitácora). \textbf{Por Floridi}: qué información honesta seguiremos publicando sobre el desempeño real del vigía (cuándo falló, qué corregimos). Cada uno con \textbf{decisión concreta y fechada}.
    criterios:
      - "Sustentación de 5 min exactos cronometrados"
      - "Demo en vivo del vigía funcionando en ambiente real"
      - "Instrucciones de uso impresas entregadas"
      - "Vigía entregado realmente al destinatario"
      - "Carta con compromisos verificables del triángulo"

rubrica:
  - entregable: 1
    nivel_5: "Problema real observado, pseudocódigo correcto, diagrama de flujo, Dussel visible"
    nivel_3: "Pseudocódigo con errores menores o diagrama incompleto"
    nivel_1: "Problema inventado o sin algoritmo"
  - entregable: 2
    nivel_5: "Programa funcional, condicional compuesta, 5+ mediciones reales, estoico visible"
    nivel_3: "Programa funcional pero umbrales no calibrados o variables vagas"
    nivel_1: "Programa no funciona o sin condicional compuesta"
  - entregable: 3
    nivel_5: "Validación completa por escenarios, 3+ bugs con bitácora del relojero, Floridi visible"
    nivel_3: "Validación parcial o bugs corregidos sin método del relojero"
    nivel_1: "Sin validación o sin bitácora de depuración"
  - entregable: 4
    nivel_5: "5 min, demo en vivo en ambiente real, entrega real al destinatario, compromisos triángulo"
    nivel_3: "Demo en vivo pero sin entrega real al destinatario"
    nivel_1: "No sustentó o vigía no funcionó en la demo"
  - entregable: "global"
    titulo: "Coherencia del vigía: problema, algoritmo, calibración, validación y entrega"
    nivel_5: "Las 4 partes dialogan; el vigía protege al destinatario nombrado en el problema inicial"
    nivel_3: "Coherencia parcial entre las partes"
    nivel_1: "Las partes parecen ejercicios separados"

sustentacion:
  duracion_min: 5
  guion_sugerido:
    - "30 seg · Problema real observado y destinatario"
    - "1 min · Algoritmo en pseudocódigo + diagrama (qué decide el vigía)"
    - "2 min · Demo en vivo del vigía funcionando en ambiente real"
    - "1 min · Validación: tabla de escenarios + 1 bug corregido con método del relojero"
    - "30 seg · Compromisos del triángulo + entrega formal del vigía"

declaracion_ia: |-
  Tu carta del equipo debe declarar honestamente: \textbf{(1)} si usaron IA para pseudocódigo o ideas, en qué tareas. \textbf{(2)} qué partes del oficio se hicieron sin IA (la calibración con datos reales, la depuración con el método del relojero, la prueba en ambiente real). \textbf{(3)} qué decisión técnica tomaron como equipo sin IA y por qué. \textbf{(4)} las 3 lentes del triángulo como compromisos verificables.

cierre: |-
  Cierras el periodo 2 con tu primer vigía electrónico funcionando en un ambiente real. El periodo 3 (Multimedia y ciberética) te pedirá llevar este criterio al cómo se cuenta, se muestra, se comparte la información. El electricista del barrio se va contigo a editar video.

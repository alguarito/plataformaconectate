clave: "8-3"
grado: 8
periodo: 3
completo: true

titulo: "Proyecto integrador · Pieza multimedia comunitaria con voz para el cambio"
titulo_portada: |-
  Pieza multimedia
  comunitaria con
  voz para el cambio

autor: "Dr. Álvaro Cárdenas Orozco"
dba: "Diseña, produce y publica una pieza multimedia (video, podcast o foto-historia) sobre un tema sensible de su entorno con criterio editorial, ética visual, derechos de imagen respetados y declaración del proceso de producción."
estrategia: "Estética de la liberación + Narrativa TED + Ética visual y de datos"
duracion_semanas: 5
modalidad: "equipo"

reto: |-
  Produce una \textbf{pieza multimedia comunitaria} sobre un tema sensible que el barrio o el colegio necesita conversar (convivencia digital, oficios que desaparecen, voces silenciadas, prevención del ciberbullying, cuidado del Pacífico, salsa caleña, narradores del Valle, etc.). Debe aplicar diseño con jerarquía, narrativa TED, edición de imagen con ética visual, audio limpio y \textbf{consentimiento explícito} de cada persona retratada. La pieza se publica y se entrega al sujeto retratado para su aprobación.

insumos:
  - "Cámara del celular o cámara prestada del colegio"
  - "Audacity (gratis) o app móvil para edición de audio"
  - "Canva, CapCut o iMovie para edición de imagen/video"
  - "Plantilla de consentimiento de imagen (la entrega el docente)"
  - "Plataforma de publicación: YouTube, Issuu, Instagram, blog escolar"
  - "Lista de 2+ sujetos posibles a entrevistar/fotografiar con consentimiento"

anclaje: |-
  En los barrios del Pacífico colombiano (Tumaco, Buenaventura, Guapi) y también en los pueblos del Valle, sostiene la memoria comunitaria una figura que casi no aparece en los libros: \textbf{la narradora de cuentos de las veladas}. Era una mujer mayor que sentaba a los niños y adultos en círculo y contaba las historias del barrio. La narradora tenía un oficio invisible pero severo: \textbf{decidía qué se contaba, cómo se contaba y a quién protegía la historia}. Sabía que un chiste sobre el vecino borracho podía hacerlo reír si estaba presente, o destruirlo si no estaba. Sabía que la historia de la vecina infiel podía contarse con dignidad o con burla, y escogía las palabras-imagen. La narradora era \textbf{editora visual antes de los pixels}: jerarquizaba la información, manejaba ritmo, conocía la diferencia entre dignificar y degradar al sujeto retratado. Esa práctica ancestral es la madre directa de todo lo que aprendiste este periodo.

aprendizajes:
  - sesion: 1
    titulo: "Diseño visual y jerarquía de información"
  - sesion: 2
    titulo: "Animaciones e hipervínculos: narrativa interactiva"
  - sesion: 3
    titulo: "Narrativa de alto impacto estructura TED"
  - sesion: 4
    titulo: "Edición de imagen y ética visual + Ley 1581"
  - sesion: 5
    titulo: "Audio: captura, edición, formatos"
  - sesion: 6
    titulo: "Ciberbullying: prevención y Línea 141 ICBF"
  - sesion: 7
    titulo: "Grooming y sexting: Ley 1336 y protocolos"
  - sesion: 8
    titulo: "Estética de la liberación: cultura popular y producción ética"
  - sesion: 9
    titulo: "Proyecto integrador comunitario"
  - sesion: 10
    titulo: "Sustentación pública + portafolio digital del grado 8"

entregables:
  - numero: 1
    titulo: "Tema con sentido + sujetos identificados + consentimiento documentado"
    que_entregas: |-
      Documento de 1-2 páginas con: tema elegido con foco (no genérico), justificación de por qué importa al barrio o al colegio, identificación de 1-3 sujetos a retratar (personas reales del entorno) con sus oficios o historias relevantes, \textbf{consentimiento firmado o video-grabado} de cada sujeto donde acepta participar, conocer dónde se publicará la pieza y por cuánto tiempo. Estructura narrativa TED preliminar (gancho, historia, idea-llave, llamado a la acción).
    como_se_hace:
      - "Elegir tema con foco y justificación clara"
      - "Identificar 1-3 sujetos del entorno (no inventados, no famosos)"
      - "Pedir consentimiento explícito (formato firmado o video)"
      - "Mostrar el formato de consentimiento al sujeto antes de filmar"
      - "Estructurar narrativa TED preliminar antes de producir"
    reflexion:
      lente: "dussel"
      titulo: "Voces que protegemos al contar esta historia"
      consigna: |-
        En el documento, agrega una sección titulada \emph{``Voces que protegemos al contar esta historia''}. Reconoce honestamente qué voces del entorno quedan fuera de tu pieza (porque no aceptaron participar, porque no las encontraste, porque no te animaste, porque no encajaban en la narrativa). Explica si su ausencia es deliberada o involuntaria, y qué riesgo trae para la historia. \textbf{Esa sección queda en el documento entregado al docente y al sujeto retratado}. La narradora de las veladas elegía con cuidado a quién mostrar y a quién no; tú haces lo mismo con tu pieza.
    criterios:
      - "Tema con foco y justificación clara"
      - "1-3 sujetos reales identificados con consentimiento documentado"
      - "Estructura narrativa TED preliminar"
      - "Plataforma de publicación decidida y aceptada por los sujetos"
      - "Sección Dussel publicada en el documento"

  - numero: 2
    titulo: "Pieza multimedia producida (video / podcast / foto-historia)"
    que_entregas: |-
      Pieza multimedia terminada en uno de los 3 formatos: video de 3-5 min (CapCut/iMovie), podcast de 5-7 min (Audacity), o foto-historia de 8-12 imágenes con texto (Canva). Debe tener: jerarquía visual clara, audio limpio (sin ruido de fondo molesto), edición ética (no rotos de imagen, no efectos que degraden al sujeto), créditos visibles con nombre del equipo y de los sujetos retratados (con consentimiento).
    como_se_hace:
      - "Producir borrador V1 con material en bruto"
      - "Editar audio reduciendo ruido (Audacity tiene reducción de ruido)"
      - "Editar imagen sin filtros que ridiculicen al sujeto"
      - "Aplicar narrativa TED: gancho-historia-idea-CTA"
      - "Revisar la pieza con un compañero externo antes de la versión final"
    reflexion:
      lente: "estoico"
      titulo: "Lo que decidimos no incluir en la pieza"
      consigna: |-
        En la pieza misma (al final, en créditos extendidos, o en una pestaña ``Sobre esta pieza'' del sitio) agrega una sección titulada \emph{``Lo que decidimos no incluir en la pieza''}. Declara qué tomas, frases, imágenes o efectos consideraste y \textbf{decidiste dejar fuera a propósito}: un comentario gracioso pero hiriente, una toma donde el sujeto se veía mal sin haberlo aceptado, un efecto que llamaba atención pero degradaba al protagonista. \textbf{Esa sección queda dentro de la pieza publicada o en su documentación pública}. El estoico entiende que el editor disciplinado quita más de lo que añade.
    criterios:
      - "Pieza terminada en uno de los 3 formatos con duración correcta"
      - "Audio limpio (reducción de ruido aplicada)"
      - "Edición ética (sin degradación del sujeto)"
      - "Estructura TED visible (gancho-historia-idea-CTA)"
      - "Sección estoica publicada dentro de la pieza"

  - numero: 3
    titulo: "Revisión por el sujeto retratado + ajustes éticos + publicación"
    que_entregas: |-
      \textbf{Visualización previa de la pieza con cada sujeto retratado} antes de publicar, registrando su retroalimentación. Ajustes hechos a partir de esa revisión (mínimo 1-2 cambios documentados). + Publicación final en la plataforma elegida con URL pública + créditos completos + enlaces a recursos de prevención (Línea 141 si el tema lo amerita, derechos de imagen Ley 1581 si hay menores).
    como_se_hace:
      - "Convocar a cada sujeto para ver la pieza antes de publicar"
      - "Registrar su retroalimentación (qué quita, qué deja, qué cambia)"
      - "Hacer los ajustes y documentarlos"
      - "Publicar en plataforma pública con créditos completos"
      - "Agregar enlaces a recursos: Línea 141, Ley 1581, Ley 1336 si aplica"
    reflexion:
      lente: "floridi"
      titulo: "Mi pieza en la cadena informacional del barrio"
      consigna: |-
        En la página de créditos extendidos o en la sección ``Sobre esta pieza'' del sitio, agrega una sección titulada \emph{``Mi pieza en la cadena informacional del barrio''}. Reflexiona: ¿qué información agrega tu pieza a la conversación pública?, ¿dignifica al barrio y al sujeto o solo agrega contenido que el algoritmo premia?, ¿qué responsabilidad asumes por lo que circula con tu nombre como autor? \textbf{Esa sección queda en la URL pública}. La ética de Floridi va más allá del cumplimiento legal: pregunta por el aporte real a la cadena informacional del entorno.
    criterios:
      - "Revisión previa con cada sujeto retratado"
      - "1-2 ajustes documentados a partir de la revisión"
      - "Publicación en plataforma pública con URL funcional"
      - "Créditos completos con consentimiento documentado"
      - "Reflexión Floridi publicada en la URL"

  - numero: 4
    titulo: "Acto público de presentación + portafolio digital del grado 8°"
    que_entregas: |-
      Acto público de 10 minutos con presentación de la pieza al barrio o la comunidad escolar, con \textbf{2+ invitados externos} (familia del equipo, sujetos retratados, vecinos, profesionales del medio). + Portafolio digital del grado 8° (URL pública en GitHub Pages, Notion, o Issuu) con: mejores piezas del año (P1: mini-estudio, P2: vigía micro:bit, P3: pieza multimedia) + carta de cierre del grado firmada con compromisos del triángulo para el grado 9°.
    como_se_hace:
      - "Preparar acto público (físico o virtual) y confirmar 2+ invitados"
      - "Ensayar presentación corta (3-5 min introducción + visualización + conversación)"
      - "Diseñar portafolio digital simple con las 3 piezas del año"
      - "Escribir carta de cierre del grado 8°"
      - "Publicar portafolio en plataforma pública"
    reflexion:
      lente: "dussel"
      titulo: "Compromisos del equipo comunicador"
      consigna: |-
        En la carta de cierre del grado 8°, dedica un párrafo a cada lente del triángulo \textbf{como compromisos verificables, no retóricos}. \textbf{Por Dussel}: a qué voz del barrio que dejamos fuera nos comprometemos a integrar en una v2 de la pieza o en un nuevo proyecto. \textbf{Por el estoico}: qué disciplina sostendremos como comunicadores (no publicar sin consentimiento, no degradar al sujeto, no apurar piezas sin revisión). \textbf{Por Floridi}: qué información honesta seguiremos publicando sobre los efectos de la pieza en el barrio. Cada uno con \textbf{decisión concreta y fechada para el grado 9°}.
    criterios:
      - "Acto público de 10 min efectivamente realizado"
      - "2+ invitados externos asistieron"
      - "Portafolio digital del grado 8° publicado con URL"
      - "Las 3 piezas del año visibles en el portafolio"
      - "Carta de cierre con compromisos verificables del triángulo"

rubrica:
  - entregable: 1
    nivel_5: "Tema con foco, sujetos con consentimiento documentado, estructura TED, Dussel visible"
    nivel_3: "Tema genérico o consentimiento parcial"
    nivel_1: "Sin sujetos reales o sin consentimiento documentado"
  - entregable: 2
    nivel_5: "Pieza con audio limpio, edición ética, estructura TED, estoico visible"
    nivel_3: "Pieza terminada pero con fallas técnicas o sin estructura TED clara"
    nivel_1: "Pieza sin terminar o con edición que degrada al sujeto"
  - entregable: 3
    nivel_5: "Revisión con sujetos, 1-2 ajustes documentados, URL pública, Floridi visible"
    nivel_3: "Publicación pero sin revisión previa con sujetos"
    nivel_1: "Publicación sin consentimiento documentado o sin URL"
  - entregable: 4
    nivel_5: "Acto público con 2+ invitados, portafolio publicado, carta con compromisos verificables"
    nivel_3: "Acto sin invitados externos o portafolio incompleto"
    nivel_1: "No realizó el acto o sin portafolio del grado"
  - entregable: "global"
    titulo: "Voz comunicativa propia: la pieza dignifica al sujeto retratado"
    nivel_5: "La pieza tiene voz propia, dignifica al sujeto, sigue estética de la liberación"
    nivel_3: "La pieza muestra al sujeto pero con cliché folclórico o sin contexto"
    nivel_1: "La pieza degrada al sujeto o copia clichés sin reflexión"

sustentacion:
  duracion_min: 10
  guion_sugerido:
    - "2 min · Por qué este tema y por qué este sujeto"
    - "3 min · Reproducir la pieza completa (o un fragmento si es muy larga)"
    - "2 min · Decisiones éticas: qué quitamos, por qué, consentimiento, recursos"
    - "2 min · Compromisos del triángulo para el grado 9°"
    - "1 min · Mostrar portafolio digital del grado 8° y URL"

declaracion_ia: |-
  Tu carta de cierre del grado 8° debe declarar honestamente: \textbf{(1)} si usaron IA en alguna parte de la pieza (texto del guion, ilustración generada, transcripción) y dónde. \textbf{(2)} qué decisiones se tomaron sin IA (consentimiento, revisión con el sujeto, decisión ética sobre qué incluir). \textbf{(3)} qué decisión comunicativa tomaron como equipo. \textbf{(4)} las 3 lentes del triángulo como compromisos verificables y fechados para el grado 9°.

cierre: |-
  Cierras el periodo 3, el grado 8° y dejas listas las herramientas para el grado 9°. La narradora de las veladas se va contigo a producir piezas con criterio ético en los próximos grados. El portafolio digital del grado 8° queda como la primera pieza pública firmada por el equipo: el oficio del comunicador con palabra empeñada.
